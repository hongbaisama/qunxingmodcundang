 horror.12.b.name: "建造一座$building_horror_forecast$"
 horror.12.b.desc: ""
 horror.12.b.hint: "在£interface£['concept_colony_view']的$colony_view_tab_planet_summary$一栏建造一座£building£§Y$building_horror_forecast$§!。"
 horror.12.b.lore: "§L“让它继续那未曾开始的预测。”§!"
 horror.12.b.req: "已建造$building_horror_forecast$"
 horror.12.b.fail: "£trigger_no£$horror.12.b.req$"
 horror.12.b.success: "£trigger_yes£$horror.12.b.req$"
 
 horror.13.name: "完成负相传统"
 horror.13.desc: ""
 horror.13.hint: "在£interface£['concept_society_management_view']的$society_management_view_tab_traditions$一栏采纳['concept_tradition_horror']传统的全部子传统。"
 horror.13.lore: "§L“我们已经打开了潘多拉魔盒，即使关闭也于事无补。”§!"
 horror.13.req: "已完成负相传统"
 horror.13.fail: "£trigger_no£$horror.13.req$"
 horror.13.success: "£trigger_yes£$horror.13.req$"
 MESSAGE_HORROR_FOCUS_13_COMPLETED_DESC: "$MESSAGE_DEVELOPMENT_FOCUS_COMPLETED_DESC$\n获得研究选项：\n£physics §Y$tech_horror_shield$§!\n£engineering §Y$tech_horror_armor$§!"
 
 horror.14.name: "研究负相防护部件"
 horror.14.desc: ""
 horror.14.hint: "在£interface£['concept_technology_view']界面，寻找并研究£physics §Y$tech_horror_shield$§!与£engineering §Y$tech_horror_armor$§!科技，它们都是属于['concept_horror_time']类别的§H稀有科技§!。"
 horror.14.lore: "§L“尽管不能百分百确信，但我们的舰船外壳已经能与负相存在的皮肤相媲美。”§!"
 horror.14.req: "已研究£physics §Y$tech_horror_shield$§!与£engineering §Y$tech_horror_armor$§!科技"
 horror.14.a.fail: "£trigger_no£已研究£physics §Y$tech_horror_shield$§!科技"
 horror.14.a.success: "£trigger_yes£已研究£physics §Y$tech_horror_shield$§!科技"
 horror.14.b.fail: "£trigger_no£已研究£engineering §Y$tech_horror_armor$§!科技"
 horror.14.b.success: "£trigger_yes£已研究£engineering §Y$tech_horror_armor$§!科技"
 MESSAGE_HORROR_FOCUS_14_COMPLETED_DESC: "$MESSAGE_CONQUEST_FOCUS_COMPLETED_DESC$\n获得研究选项：\n£physics §Y$tech_horror_beam$§!"
 
 horror.15.name: "建造负相武装舰船"
 horror.15.desc: ""
 horror.15.hint: "在£interface£['concept_fleet_management_view']的$fleet_management_view_tab_ship_designer$一栏，设计一艘装备了如§Y$HORROR_BEAM$§!或§Y$HORROR_ACCELERATOR$§!之类负相武器的舰船，并在['concept_shipyard']里进行建造。"
 horror.15.lore: "§L“如果说引力是爱，那我们的爱甚至能吞噬黑洞本身。”§!"
 horror.15.req: "已建造装备任意负相武器的舰船"
 horror.15.fail: "£trigger_no£$horror.15.req$"
 horror.15.success: "£trigger_yes£$horror.15.req$"
 MESSAGE_HORROR_FOCUS_15_COMPLETED_DESC: "$MESSAGE_CONQUEST_FOCUS_COMPLETED_DESC$\n获得§Y$horror_focus_modifier$§!修正：\n$horror_focus_modifier_effect$"
 
 horror.16.name: "击退位面之魇"
 horror.16.desc: ""
 horror.16.hint: "位面之魇往往出没于['concept_sc_black_hole']，拥有极高的战斗能力和再生能力，并具备一定的隐形探测能力。\n位面之魇的武器附带一定的穿透能力与混乱功能，皮肤也为其提供了较高的硬化水平，此外其对位面的扰动可以同时对星系内的所有舰船造成伤害。"
 horror.16.lore: "§L“这不是你们该来的地方，黑洞才是你们永远的家。”§!"
 horror.16.req: "已击退一只位面之魇"
 horror.16.fail: "£trigger_no£$horror.16.req$"
 horror.16.success: "£trigger_yes£$horror.16.req$"
