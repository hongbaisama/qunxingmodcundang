l_simp_chinese:
 horror.1.name: "调查黑洞"
 horror.1.desc: ""
 horror.1.hint: "派遣一艘£science_ship£['concept_science_ship']去对黑洞进行调查，而黑洞往往是['concept_sc_black_hole']的中央恒星。"
 horror.1.lore: "§L“黑洞可谓是宇宙中最吸引人的天体——物理意义上的吸引。”§!"
 horror.1.req: "已调查一颗黑洞"
 horror.1.fail: "£trigger_no£$horror.1.req$"
 horror.1.success: "£trigger_yes£$horror.1.req$"
 MESSAGE_HORROR_FOCUS_1_COMPLETED_DESC: "$MESSAGE_EXPLORATION_FOCUS_COMPLETED_DESC$\n§Y我们已开始对黑洞产生兴趣§!"
 
 horror.2.name: "发现3个黑洞星系"
 horror.2.desc: ""
 horror.2.hint: "派遣一艘£science_ship£['concept_science_ship']去寻觅银河中的黑洞，而['concept_sc_black_hole']往往在星图上有着独特的图标。"
 horror.2.lore: "§L“你相信黑洞会说话吗？据说，只要在两个黑洞星系间来回穿梭，就能收到来自黑洞的情诗。”§!"
 horror.2.req: "已发现3个黑洞星系"
 horror.2.fail: "£trigger_no£$horror.2.req$"
 horror.2.success: "£trigger_yes£$horror.2.req$"
 MESSAGE_HORROR_FOCUS_2_COMPLETED_DESC: "$MESSAGE_EXPLORATION_FOCUS_COMPLETED_DESC$\n§Y我们似乎感知到了负相存在§!"
 
 horror.3.name: "接触负相存在"
 horror.3.desc: ""
 horror.3.hint: "位面之魇往往出没于['concept_sc_black_hole']，但它是既强大又危险的负相存在，并具备一定的隐形探测能力。"
 horror.3.lore: "§L“我以前和你一样也是个探索者，直到我的飞船中了一炮。”§!"
 horror.3.req: "已接触负相存在"
 horror.3.fail: "£trigger_no£$horror.3.req$"
 horror.3.success: "£trigger_yes£$horror.3.req$"
 MESSAGE_HORROR_FOCUS_3_COMPLETED_DESC: "$MESSAGE_EXPLORATION_FOCUS_COMPLETED_DESC$\n获得研究选项：\n£physics §Y$tech_mine_dark_matter$§!"
 
 horror.4.name: "拥有25暗物质"
 horror.4.desc: ""
 horror.4.hint: "为了获取$r_dark_matter$，可以在带有暗物质资源的['concept_celestial_objects']周围建造£science_ship£['concept_research_stations']，而暗物质资源常见于黑洞。\n\n或者，也可以在£market£['concept_market']上或从其它['concept_empires']处购买$r_dark_matter$。$focus_other$"
 horror.4.lore: "§L“我能听到它，但我看不到；\n我能闻到它，但我尝不到；\n我能感到它，但我摸不到。”§!"
 horror.4.req: "已拥有25暗物质"
 horror.4.fail: "£trigger_no£$horror.4.req$"
 horror.4.success: "£trigger_yes£$horror.4.req$"
 MESSAGE_HORROR_FOCUS_4_COMPLETED_DESC: "$MESSAGE_DEVELOPMENT_FOCUS_COMPLETED_DESC$\n§Y是时候亲手开启大门了§!"
 
 time_focus.10.name: "开启负相之门"
 time_focus.10.desc.1: "负相在低语，似乎有什么正引诱着我们步入歧途。\n前进的道路迷雾重重，但一切都只需轻轻一推。"
 time_focus.10.desc.2: "负相在低语，似乎有什么正引诱着我们深入迷雾。\n前进的道路错综复杂，但一切都只需轻轻一推。"
 time_focus.10.a: "我们的目的是研究它。"
 time_focus.10.b: "我们的使命是接纳它。"
 time_focus.10.tooltip: "§R当前的选择将决定后续的路线§!"
 
 horror.11.a.name: "建造一座$building_horror_research$"
 horror.11.a.desc: ""
 horror.11.a.hint: "在£interface£['concept_colony_view']的$colony_view_tab_planet_summary$一栏建造一座£building£§Y$building_horror_research$§!。"
 horror.11.a.lore: "§L“研究，并发现。”§!"
 horror.11.a.req: "已建造$building_horror_research$"
 horror.11.a.fail: "£trigger_no£$horror.11.a.req$"
 horror.11.a.success: "£trigger_yes£$horror.11.a.req$"
