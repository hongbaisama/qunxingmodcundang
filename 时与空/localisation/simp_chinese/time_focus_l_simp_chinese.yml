 horror.11.b.name: "建造一座$building_horror_monument$"
 horror.11.b.desc: ""
 horror.11.b.hint: "在£interface£['concept_colony_view']的$colony_view_tab_planet_summary$一栏建造一座£building£§Y$building_horror_monument$§!。"
