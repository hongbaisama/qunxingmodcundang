 MESSAGE_HORROR_FOCUS_16_B_COMPLETED_DESC: "$MESSAGE_CONQUEST_FOCUS_COMPLETED_DESC$\n获得研究选项：\n£society §Y$tech_time_3_b_1$§!\n£physics §Y$tech_horror_focus_1$§!"
 
