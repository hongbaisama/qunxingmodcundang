 horror.12.a.name: "建造一座$building_horror_computer$"
 horror.12.a.desc: ""
 horror.12.a.hint: "在£interface£['concept_colony_view']的$colony_view_tab_planet_summary$一栏建造一座£building£§Y$building_horror_computer$§!。"
