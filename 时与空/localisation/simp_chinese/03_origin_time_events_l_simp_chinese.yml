 time.210.name:0 "追随者：§H一锤定音§!"
 time.210.desc:0 "终于，无休止的纷争迎来了短暂的停歇。\n\n追随者们在政府和民众中占据了压倒性的优势，质疑者的言论不攻自破，这场关于权利的争夺胜负已定。\n\n只待时机合适，追随者们就将重组政府，用他们的方式指引我们的未来。"
 time.210.a:0 "向最伟大的帝国致敬！"
 time.211.name:0 "追随者：§H游行§!"
 time.211.desc.life:0 "一直以来，§Y[time_black_hole_leader.GetName]§!的追随者们都计划着进行一次游行，希望当局政府公开阴谋的真相。\n\n今天，他们的计划成功了，这场声势浩大的游行在我们的首都展开，并意外地收获了许多民众的支持。尽管我们都知道根本不存在什么阴谋，但狂热的追随者们根本不相信我们的任何解释。"
 time.211.desc.death:0 "一直以来，§Y[time_black_hole_leader.GetName]§!的追随者们都计划着进行一次游行，希望[Owner.GetRulerTitle]的权力得到进一步提升。\n\n今天，他们的计划成功了，这场声势浩大的游行在我们的首都展开，并意外地收获了许多民众的支持。许多参与者表示，分散的权力远不如中央集权反应迅速，更何况我们拥有如此一位英明的统治者。"
 time.211.a:0 "随他们去吧。"
 time.211.b:0 "立即阻止这场游行！"
 time.212.name:0 "追随者：§H演说§!"
 time.212.desc.life:0 "今天，§Y[time_black_hole_leader.GetName]§!的追随者们在人群密集处举办了一场大型演说。\n\n这场演说的主题根本无关紧要，因为通篇都是子虚乌有的阴谋论，但无论是演讲者还是倾听者都对此深信不疑，他们已陷入了信息茧房。"
 time.212.desc.death:0 "今天，§Y[time_black_hole_leader.GetName]§!的追随者们在人群密集处举办了一场大型演说。\n\n这场演说围绕着[Owner.GetRulerTitle]的各项功绩展开，尽管其中存在不少显著的夸大现象，但演讲者与倾听者都不在乎这些小问题。"
 time.212.a:0 "这是他们自发的行为，不应干涉。"
 time.212.b:0 "演说的内容不合理，没有必要继续了。"
 time.213.name:0 "追随者：§H政变§!"
 time.213.desc.life:0 "不知从何时起，§Y[time_black_hole_leader.GetName]§!的追随者就在政府中安插了不少内应，并集中在今天爆发。\n\n他们操纵了一场参会者很少的秘密会议，并强硬地要求让§Y[time_black_hole_leader.GetName]§!的一位亲属担任[Owner.GetRulerTitle]。所幸，我们及时地控制了情况，他们所签署的法律并不具备任何效力。"
 time.213.desc.death:0 "不知从何时起，§Y[time_black_hole_leader.GetName]§!的追随者就在政府中安插了不少内应，并集中在今天爆发。\n\n他们操纵了一场参会者很少的秘密会议，并强硬地要求让§Y[time_black_hole_leader.GetName]§!作为我们永远的[Owner.GetRulerTitle]。所幸，我们及时地控制了情况，他们所签署的法律并不具备任何效力。"
 time.213.a:0 "羁押政变者，优先安抚民心。"
 time.213.b:0 "处决政变者，必须杀鸡儆猴！"
 time.214.name:0 "追随者：§H暴动§!"
 time.214.desc.life:0 "一群无法无天的恐怖分子突然展开了暴动，在被军警控制之前，他们已经造成了不小的损伤。\n\n经核实，他们都是§Y[time_black_hole_leader.GetName]§!的极端追随者，这次暴动的目的不得而知，但我们猜测这是对于所谓“阴谋”的报复。"
 time.214.desc.death:0 "一群无法无天的恐怖分子突然展开了暴动，在被军警控制之前，他们已经造成了不小的损伤。\n\n经核实，他们都是§Y[time_black_hole_leader.GetName]§!的极端追随者，这次暴动的目的不得而知，但在§Y[time_black_hole_leader.GetName]§!出面调解后，恐怖分子们停止了抵抗。"
 time.214.a:0 "一场可怕的灾难。"
 time.214.b:0 "迅速弥补损失，恢复日常秩序。"
 time.215.name:0 "追随者：§H谣言§!"
 time.215.desc.life:0 "近日，一则有关§Y[time_black_hole_leader.GetName]§!死亡事故的谣言在社区中散布。\n\n最终调查发现，谣言的来源是§Y[time_black_hole_leader.GetName]§!的追随者，这并不出乎我们的意料。尽管我们逮捕了作者，但要处理铺天盖地的谣言仍需一些工夫。"
 time.215.desc.death:0 "近日，一则过度夸大§Y[time_black_hole_leader.GetName]§!的谣言在社区中散布。\n\n最终调查发现，谣言的来源是§Y[time_black_hole_leader.GetName]§!的追随者，这并不出乎我们的意料。尽管我们逮捕了作者，但要处理铺天盖地的谣言仍需一些工夫。"
 time.215.a:0 "人们自然会识破谣言。"
 time.215.b:0 "不能放任谣言蛊惑人心。"
 
