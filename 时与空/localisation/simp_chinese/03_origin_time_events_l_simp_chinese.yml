 time.243.name:0 "研究者：§H政变§!"
 time.243.desc.life:0 "不知从何时起，视界之内的研究者就在政府中安插了不少内应，并集中在今天爆发。\n\n他们操纵了一场参会者很少的秘密会议，并强硬地要求成立专项小组以全力研究黑洞中心。所幸，我们及时地控制了情况，他们所签署的法律并不具备任何效力。"
 time.243.desc.death:0 "不知从何时起，视界之内的研究者就在政府中安插了不少内应，并集中在今天爆发。\n\n他们操纵了一场参会者很少的秘密会议，并强硬地要求§Y[time_black_hole_leader.GetName]§!参与一场对外保密的实验。所幸，我们及时地控制了情况，他们所签署的法律并不具备任何效力。"
 time.244.name:0 "研究者：§H暴动§!"
 time.244.desc.life:0 "一群无法无天的恐怖分子突然展开了暴动，在被军警控制之前，他们已经造成了不小的损伤。\n\n经核实，他们都是视界之内的极端研究者，这次暴动的目的不得而知，但我们猜测这是出于对未知的极度渴求。"
 time.244.desc.death:0 "一群无法无天的恐怖分子突然展开了暴动，在被军警控制之前，他们已经造成了不小的损伤。\n\n经核实，他们都是视界之内的极端研究者，这次暴动的目的不得而知，但在§Y[time_black_hole_leader.GetName]§!同意最低限度的配合后，恐怖分子们立即终止了行动。"
 time.245.name:0 "研究者：§H谣言§!"
 time.245.desc.life:0 "近日，一则有关世界并不存在的谣言在社区中散布。\n\n最终调查发现，谣言的来源是视界之内的研究者，这并不出乎我们的意料。尽管我们逮捕了作者，但要处理铺天盖地的谣言仍需一些工夫。"
 time.245.desc.death:0 "近日，一则有关§Y[time_black_hole_leader.GetName]§!的能力可被复制的谣言在社区中散布。\n\n最终调查发现，谣言的来源是视界之内的研究者，这并不出乎我们的意料。尽管我们逮捕了作者，但要处理铺天盖地的谣言仍需一些工夫。"
 
 situation_time_militarist_vs_pacifist:0 "§H战争？§!§G和平？§!"
 situation_time_militarist_vs_pacifist_type:0 "$situation_time_militarist_vs_pacifist$"
 situation_time_militarist_vs_pacifist_desc:0 "视界之内，§H$ethic_militarist$者§!与§G$ethic_pacifist$者§!正为我们的未来争论不休。\n§Y究竟谁才是正确的？或许问题根本不在这里。§!"
