 time.250.name:0 "激进者：§H一锤定音§!"
 time.250.desc:0 "终于，无休止的纷争迎来了短暂的停歇。\n\n激进者们在政府和民众中占据了压倒性的优势，保守者的言论不攻自破，这场关于权利的争夺胜负已定。\n\n只待时机合适，激进者们就将重组政府，用他们的方式指引我们的未来。"
 time.250.a:0 "这是属于战争的时代！"
 time.251.name:0 "激进者：§H游行§!"
 time.251.desc:0 "一直以来，视界之内的激进者们都计划着进行一次游行，希望当局政府制订法律以让强者拥有更高的社会地位。\n\n今天，他们的计划成功了，这场声势浩大的游行在我们的首都展开，并意外地收获了许多民众的支持。许多参与者表示，这是个弱肉强食的社会，弱者唯一的生存之道就是不断变强。"
 time.252.name:0 "激进者：§H演说§!"
 time.252.desc:0 "今天，视界之内的激进者们在人群密集处举办了一场大型演说。\n\n这场演说的主题根本无关紧要，因为通篇都是对强者的仰慕与对弱者的鄙视，但无论是演讲者还是倾听者都对此深信不疑，他们已陷入了信息茧房。"
 time.253.name:0 "激进者：§H政变§!"
 time.253.desc:0 "不知从何时起，视界之内的激进者就在政府中安插了不少内应，并集中在今天爆发。\n\n他们操纵了一场参会者很少的秘密会议，并强硬地要求以最强者担任国家的要职。所幸，我们及时地控制了情况，他们所签署的法律并不具备任何效力。"
 time.254.name:0 "激进者：§H暴动§!"
 time.254.desc:0 "一群无法无天的恐怖分子突然展开了暴动，在被军警控制之前，他们已经造成了不小的损伤。\n\n经核实，他们都是视界之内的极端激进者，这次暴动的目的不得而知，但我们猜测这是为了展现自己强大的力量。"
 time.255.name:0 "激进者：§H谣言§!"
 time.255.desc:0 "近日，一则政府倡议集体狩猎弱者的谣言在社区中散布。\n\n最终调查发现，谣言的来源是视界之内的激进者，这并不出乎我们的意料。尽管我们逮捕了作者，但要处理铺天盖地的谣言仍需一些工夫。"
 
 time.260.name:0 "保守者：§H一锤定音§!"
 time.260.desc:0 "终于，无休止的纷争迎来了短暂的停歇。\n\n保守者们在政府和民众中占据了压倒性的优势，激进者的言论不攻自破，这场关于权利的争夺胜负已定。\n\n只待时机合适，保守者们就将重组政府，用他们的方式指引我们的未来。"
 time.260.a:0 "这是属于和平的时代！"
 time.261.name:0 "保守者：§H游行§!"
 time.261.desc:0 "一直以来，视界之内的保守者们都计划着进行一次游行，希望当局政府制订法律以更加彻底地维护和平。\n\n今天，他们的计划成功了，这场声势浩大的游行在我们的首都展开，并意外地收获了许多民众的支持。许多参与者表示，生命无价，唯有和谐的社会才能建设辉煌的未来。"
 time.262.name:0 "保守者：§H演说§!"
 time.262.desc:0 "今天，视界之内的保守者们在人群密集处举办了一场大型演说。\n\n这场演说围绕着全民互助制度展开，尽管其中存在不少天真的幻想与一厢情愿的假设，但演讲者与倾听者都不在乎这些小问题。"
 time.263.name:0 "保守者：§H政变§!"
 time.263.desc:0 "不知从何时起，视界之内的保守者就在政府中安插了不少内应，并集中在今天爆发。\n\n他们操纵了一场参会者很少的秘密会议，并委婉地要求禁止社会中的一切暴力。所幸，我们及时地控制了情况，他们所签署的法律并不具备任何效力。"
 time.264.name:0 "保守者：§H暴动§!"
 time.264.desc:0 "一群无法无天的恐怖分子突然展开了暴动，在被军警控制之前，他们已经造成了不小的损伤。\n\n经核实，他们都是视界之内的极端保守者，这次暴动的目的不得而知，但他们表示这是为了和平的必要之恶。"
 time.265.name:0 "保守者：§H谣言§!"
 time.265.desc:0 "近日，一则政府要员涉嫌连环谋杀案的谣言在社区中散布。\n\n最终调查发现，谣言的来源是视界之内的保守者，这并不出乎我们的意料。尽管我们逮捕了作者，但要处理铺天盖地的谣言仍需一些工夫。"
 
