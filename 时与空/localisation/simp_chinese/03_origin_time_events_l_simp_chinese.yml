 time.270.name:0 "纯净者：§H一锤定音§!"
 time.270.desc:0 "终于，无休止的纷争迎来了短暂的停歇。\n\n纯净者们在政府和民众中占据了压倒性的优势，混合者的言论不攻自破，这场关于权利的争夺胜负已定。\n\n只待时机合适，纯净者们就将重组政府，用他们的方式指引我们的未来。"
 time.270.a:0 "拥抱孤立就是拥抱命运！"
 time.271.name:0 "纯净者：§H游行§!"
 time.271.desc:0 "一直以来，视界之内的纯净者们都计划着进行一次游行，希望当局政府立即将一切外星异种驱逐出境。\n\n今天，他们的计划成功了，这场声势浩大的游行在我们的首都展开，并意外地收获了许多民众的支持。许多参与者表示，我们是高贵的民族，不应被低劣的异种玷污。"
 time.272.name:0 "纯净者：§H演说§!"
 time.272.desc:0 "今天，视界之内的纯净者们在人群密集处举办了一场大型演说。\n\n这场演说的主题根本无关紧要，因为通篇都是对外星异种的谩骂与诋毁，但无论是演讲者还是倾听者都对此深信不疑，他们已陷入了信息茧房。"
 time.273.name:0 "纯净者：§H政变§!"
 time.273.desc:0 "不知从何时起，视界之内的纯净者就在政府中安插了不少内应，并集中在今天爆发。\n\n他们操纵了一场参会者很少的秘密会议，并强硬地要求断绝与外星异种的一切交流。所幸，我们及时地控制了情况，他们所签署的法律并不具备任何效力。"
 time.274.name:0 "纯净者：§H暴动§!"
 time.274.desc:0 "一群无法无天的恐怖分子突然展开了暴动，在被军警控制之前，他们已经造成了不小的损伤。\n\n经核实，他们都是视界之内的极端纯净者，这次暴动的目的不得而知，但我们猜测这是针对外星异种的集中迫害。"
 time.275.name:0 "纯净者：§H谣言§!"
 time.275.desc:0 "近日，一则外星异种企图颠覆政权的谣言在社区中散布。\n\n最终调查发现，谣言的来源是视界之内的纯净者，这并不出乎我们的意料。尽管我们逮捕了作者，但要处理铺天盖地的谣言仍需一些工夫。"
 
 time.280.name:0 "混合者：§H一锤定音§!"
 time.280.desc:0 "终于，无休止的纷争迎来了短暂的停歇。\n\n混合者们在政府和民众中占据了压倒性的优势，纯净者的言论不攻自破，这场关于权利的争夺胜负已定。\n\n只待时机合适，混合者们就将重组政府，用他们的方式指引我们的未来。"
 time.280.a:0 "拥抱多元才是拥抱希望！"
 time.281.name:0 "混合者：§H游行§!"
 time.281.desc:0 "一直以来，视界之内的混合者们都计划着进行一次游行，希望当局政府深化民族与外族的友善交流。\n\n今天，他们的计划成功了，这场声势浩大的游行在我们的首都展开，并意外地收获了许多民众的支持。许多参与者表示，我们的民族值得自豪，但来自外星的智慧也不可或缺。"
 time.282.name:0 "混合者：§H演说§!"
 time.282.desc:0 "今天，视界之内的混合者们在人群密集处举办了一场大型演说。\n\n这场演说围绕着民族多元化展开，尽管其中存在不少空洞的口号与不切实际的计划，但演讲者与倾听者都不在乎这些小问题。"
 time.283.name:0 "混合者：§H政变§!"
 time.283.desc:0 "不知从何时起，视界之内的混合者就在政府中安插了不少内应，并集中在今天爆发。\n\n他们操纵了一场参会者很少的秘密会议，并强硬地要求让外族占有一定配额的政府要职。所幸，我们及时地控制了情况，他们所签署的法律并不具备任何效力。"
 time.284.name:0 "混合者：§H暴动§!"
 time.284.desc:0 "一群无法无天的恐怖分子突然展开了暴动，在被军警控制之前，他们已经造成了不小的损伤。\n\n经核实，他们都是视界之内的极端混合者，这次暴动的目的不得而知，但我们猜测这是对极端民族主义者的反击。"
 time.285.name:0 "混合者：§H谣言§!"
 time.285.desc:0 "近日，一则与外族通婚可提升子代智商的谣言在社区中散布。\n\n最终调查发现，谣言的来源是视界之内的混合者，这并不出乎我们的意料。尽管我们逮捕了作者，但要处理铺天盖地的谣言仍需一些工夫。"
 
 time.292.name:0 "黑洞呢喃：§H时螶之歉§!"
 time.292.desc:0 "就在局势变得一发不可收拾之前，我们再一次收到了视界信号。不过，它来自于我们的母星……\n\n“我很抱歉，可怜的§Y[Owner.GetSpeciesName]§!们。”那生物就在我们母星的中央说道，“我本以为改变意味着机遇，就像你们过去或未来的那样，却不想为你们徒增了困惑，反令你们陷入了自相矛盾的囚笼。或许我做得太过火了，这有违我的初衷。”那生物顿了顿，继续低声呢喃着：“现在我认为，选择权应该交给你们。”\n\n那神秘的信号就如母亲的抚摸，我们即使不能完全理解，却仍然可以体会到其中的温暖。就在信号结束的一瞬间，狂热的民众突然停下了自己的所作所为，仿佛过去的一切只是一场梦。"
 time.292.a:0 "并非出于时之螶的干涉，这是我们自己所选择的明天。"
 time.292.b:0 "尽管内心的信念不会改变，但是时候结束这场闹剧了。"
 time.292.c:0 "我们早已做出了最好的决定，没有任何必要进行更改。"
 time.293.name:0 "黑洞呢喃：§H理想家园§!"
 time.293.desc:0 "这些天来，我们的母星一直在和我们交流——准确来说，是那个叫做§H时之螶§!的神秘生物，正通过我们的母星与我们进行交流。\n\n祂希望我们能接纳祂的存在，尽管之前的种种事件令我们难以放松对祂的戒备。也许是为了表露充足的善意，祂使视界内的时空流动更加稳定有序，引力陷阱的扭曲效应也大幅削弱，我们朝思暮想的中央奇点也逐渐揭开了它的面纱。\n\n§H“这里就是你们的理想家园。”§!那生物似乎在喃喃自语，§H“也许现在不是，但过去曾经是，将来也会是。”§!"
 time.293.a:0 "原来这才是黑洞真正的核心。"
 time.294.name:0 "黑洞呢喃：§H戛然而止§!"
 time.294.desc:0 "随着我们失去§Y[Target.GetName]§!的掌控权，我们与§H时之螶§!的交流也戛然而止。"
 time.294.a:0 "她想告诉我们什么呢？"
 
 time.100.name:0 "时之螶：§B奇点奥秘§!"
 time.100.desc.1:0 "我们出生在这个神秘的黑洞中，它的深处一定隐藏了什么不为人所知的时空奥秘。\n\n为此，我们专门成立了一个针对母星最深处的研究小组，夜以继日地分析从中发出的数据。通过与宇宙中其它黑洞的数据进行对比，我们发现，我们身处的黑洞中央是一个由于时空扭曲而形成的奇点。并且，它的形成方式并不自然，就像是有人故意扭曲了时空来形成这一奇点。\n\n令人瞠目结舌的是，就在我们取得了这一科研结果的同时，从奇点中传来了熟悉又陌生的信号：一首我们曾经听过的诗歌，重复着短语§H引力即欲望§!以及§H时间即视野§!的那首诗歌……\n\n是§H时之螶§!！\n\n一切都真相大白了。我们原以为，在我们第一次收到视界信号之前，§H时之螶§!一直都只是默默地注视着我们，但实际上，它早就对我们进行了干涉。准确来说，我们这整个种群，就是§H时之螶§!亲手创造的。此时，我们也突然理解了§H时之螶§!曾经发给我们的信号——那是它对我们发现真相的暗示！\n\n我们非常庆幸，当初收到视界信号的时候，并未将其无视，最终呼唤§H时之螶§!的时候，选择接受它的爱。不过，也许，正是因为我们是§H时之螶§!创造的，我们才会选择这么做。"
 time.100.desc.2:0 "我们出生在这个神秘的黑洞中，它的深处一定隐藏了什么不为人所知的时空奥秘。\n\n为此，§Y[origin_time_ruler.GetName]§!领导了一个针对母星最深处的研究小组，夜以继日地分析从中发出的数据。通过与宇宙中其它黑洞的数据进行对比，我们发现，我们身处的黑洞中央是一个由于时空扭曲而形成的奇点。并且，它的形成方式并不自然，就像是有人故意扭曲了时空来形成这一奇点。\n\n令人瞠目结舌的是，就在我们取得了这一科研结果的同时，从奇点中传来了熟悉又陌生的信号：一首我们曾经听过的诗歌，重复着短语§H引力即欲望§!以及§H时间即视野§!的那首诗歌……\n\n是§H时之螶§!！\n\n一切都真相大白了。我们原以为，在我们第一次收到视界信号之前，§H时之螶§!一直都只是默默地注视着我们，但实际上，它早就对我们进行了干涉。准确来说，我们这整个种群，就是§H时之螶§!亲手创造的。此时，我们也突然理解了§H时之螶§!曾经发给我们的信号——那是它对我们发现真相的暗示！\n\n我们非常庆幸，当初收到视界信号的时候，并未将其无视；§Y[origin_time_ruler.GetName]§!进入黑洞的时候，求知的欲望战胜了死亡的恐惧；最终呼唤§H时之螶§!的时候，选择接受它的爱。不过，也许，正是因为我们是§H时之螶§!创造的，我们才会选择这么做。"
 time.100.a:0 "§M过 去 即 未 来 即 过 去 ！§!"
 time.100.a.tooltip:0 "§Y[origin_time_ruler.GetName]领悟了时空的本质§!"
 time.200.name:0 "时之螶：§M降临§!"
 time.200.desc:0 "时之螶再次降临于我们的位面，并不余遗力地守护我们。"
 time.200.a:0 "她永远爱我们，我们也永远爱她。"
 
