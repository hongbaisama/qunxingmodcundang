 time.110.name:0 "神秘奇点：§H初探奇点§!"
 time.110.desc:0 "随着我们迈入太空，神秘的母星奇点也深深吸引了我们的注意。\n\n我们计划利用在黑洞中生存的技巧，从变幻莫测的时空之中发现我们的历史，并找出我们的方向。\n\n探索者们已经准备就绪，但我们最好选择一个旅程的目的地。"
 time.110.a:0 "$approach_pc_time_encourage$。"
 time.110.b:0 "$approach_pc_time_default$。"
 time.110.c:0 "$approach_pc_time_discourage$。"
 
 district_time_level_up:0 "['concept_district_time_level_up_yellow']"
 clear_a_time_blocker_0:0 "['concept_clear_a_time_blocker_0_yellow']"
 time_blocker_2_can_be_cleared:0 "['concept_time_blocker_2_can_be_cleared_yellow']"
 time_blocker_3_can_be_cleared:0 "['concept_time_blocker_3_can_be_cleared_yellow']"
 
 time.121.name:0 "神秘奇点：§H未知时空§!"
 time.121.desc:0 "我们的探索者抵达了一处未知的时空。\n\n在这片时空之中，我们发现时间非常规律地朝着反方向流动，如果我们能查明这一现象的原因，或许就能利用这片时空。"
 time.121.a:0 "研究这一现象。"
 time.111.name:0 "神秘奇点：§H时间逆流§!"
 time.111.desc:0 "根据科学官的研究，该现象或许是由早期白洞引起的。\n\n在这片时空的中心旋涡里，酝酿着一颗小小的反奇点，它以与黑洞相反的时间标尺旋转，并源源不断地将未知位面的物质向外喷出。\n\n尽管我们仍然无法知晓其具体原理，但这片时空的规律已经变得可以掌握。"
 time.111.a:0 "真是美丽。"
 time.122.name:0 "神秘奇点：§H未知时空§!"
 time.122.desc:0 "我们的探索者抵达了一处未知的时空。\n\n在这片时空之中，我们发现空间非常规律地围着某个中心旋转，如果我们能查明这一现象的原因，或许就能利用这片时空。"
 time.122.a:0 "研究这一现象。"
 time.112.name:0 "神秘奇点：§H空间旋涡§!"
 time.112.desc:0 "根据科学官的研究，该现象或许是由微型奇点引起的。\n\n在这片时空的中心旋涡中，酝酿着一颗小小的微型奇点，它以不大但迅速的吸引力吞噬周边的物质，并因此带动了整个空间的旋转。\n\n尽管我们仍然无法知晓其具体原理，但这片时空的规律已经变得可以掌握。"
 time.112.a:0 "真是有趣。"
 time.123.name:0 "神秘奇点：§H未知时空§!"
 time.123.desc:0 "我们的探索者抵达了一处未知的时空。\n\n在这片时空之中，我们发现物质在一片混沌中反复合成又分解，如果我们能查明这一现象的原因，或许就能利用这片时空。"
 time.123.a:0 "研究这一现象。"
 time.113.name:0 "神秘奇点：§H物质熔炉§!"
 time.113.desc:0 "根据科学官的研究，该现象或许是由高压力场引起的。\n\n在这片时空的中心旋涡中，一个奇异点不断朝外释放压力，导致整个时空处于极端高压状态，粒子之间迅速碰撞合成物质，而物质又无法承受高压而分解。\n\n尽管我们仍然无法知晓其具体原理，但这片时空的规律已经变得可以掌握。"
 time.113.a:0 "真是震撼。"
 time.124.name:0 "神秘奇点：§H未知时空§!"
 time.124.desc:0 "我们的探索者抵达了一处未知的时空。\n\n在这片时空之中，我们明显地感受到一股奇妙的异样，这里的氛围比其它时空更加压抑，这背后一定隐藏着我们不知道的秘密。"
 time.124.a:0 "我们渴求答案。"
 time.114.name:0 "神秘奇点：§H折叠维度§!"
 time.114.desc:0 "调查表明，这是一种罕见的折叠维度现象。\n\n五个维度在这片时空折叠成了一半，我们所感受到的压抑感，正是对较低维度中容纳了较高维度的信息量感到无所适从。\n\n尽管我们无法完全掌握其原理，但这为我们的时空利用方式带来了不小的启发。"
 time.114.a:0 "真是奇妙。"
 time.125.name:0 "神秘奇点：§H未知时空§!"
 time.125.desc:0 "我们的探索者抵达了一处未知的时空。\n\n在这片时空之中，我们发现了一道巨大的位面裂缝，贪婪地吮吸着周围的粒子，如果放任其扩大，或许会对其它时空造成难以磨灭的影响。"
 time.125.a:0 "我们提防灾难。"
 time.115.name:0 "神秘奇点：§H位面裂缝§!"
 time.115.desc:0 "经过了艰辛的修补过程，位面裂缝暂时停止了扩张。\n\n参与修补过程的工作人员表示，他们透过位面裂缝窥探到了一些另一个世界的存在，声称一群“更高维度”的“恶魔”正在相互厮杀，并因此在维度中撕开了其它的裂缝。\n\n尽管我们无法完全修补位面裂缝，但“高维生物”的打斗给我们带来了意外之喜。"
 time.115.a:0 "真是可怕。"
 time.126.name:0 "神秘奇点：§H未知时空§!"
 time.126.desc:0 "我们的探索者抵达了一处未知的时空。\n\n在这片时空之中，还滞留着一些没有实体的诡异生命，它们似乎极具进攻性，会袭击任何尝试靠近的黑洞居民，我们最好将它们驱逐。"
 time.126.a:0 "我们守卫家园。"
 time.116.name:0 "神秘奇点：§H虚境生物§!"
 time.116.desc:0 "在一番苦斗之后，那群生命最终落荒而逃。\n\n这群诡异生物虽然没有实体，但并非不可战胜，常规的武器仍然能对它们造成一定的伤害。由于它们奇特的生命形式，我们将它们称为“虚境生物”。\n\n尽管我们蒙受了一些损失，但我们成功救出了一些受困的居民。"
 time.116.a:0 "真是幸运。"
 
 time.130.name:0 "神秘奇点：§H超越屏障§!"
 time.130.desc:0 "我们的探索者最终接近了黑洞的中央地带。\n\n当探索者们准备继续朝前走时，却被一道无形的屏障挡住了。有人试探性地拿出随身物品向前扔去，那物品却反弹回来砸到了他的脸上。随行的科研人员立刻从行囊中拿出各式各样的探测装置，但无论多么精密的仪器都无法感应到屏障的存在，更不要说分析屏障的组分与成因了。\n\n我们的首席科学官请求对此立项调查，但关于调查的方向则众说纷纭。"
 time.130.a:0 "从屏障的物理性质着手。"
 time.130.b:0 "从屏障的历史记载着手。"
 time.130.c:0 "从屏障的组成材料着手。"
 time.131.name:0 "神秘奇点：§H透明之墙§!"
 time.131.desc:0 "对中央屏障的测试已经告一段落。\n\n无论我们如何与这道屏障进行交互，都不能得到任何有效的信息，唯一的反馈在于我们已知的一切物质都无法穿过它——除了光。\n\n从这个方向上进行研究恐怕不会有任何的进展，我们的科研人员正在尝试从其它角度入手。"
 time.131.a:0 "就像一面透明之墙。"
 time.132.name:0 "神秘奇点：§H无名之墙§!"
 time.132.desc:0 "对中央屏障的查阅已经告一段落。\n\n无论我们翻读了多少资料，都不能找到任何有关于这道屏障的记载，唯一能够确定的事情在于所有人都不曾见过它——除了我们。\n\n从这个方向上进行研究恐怕不会有任何的进展，我们的科研人员正在尝试从其它角度入手。"
 time.132.a:0 "就像一面无名之墙。"
 time.133.name:0 "神秘奇点：§H虚幻之墙§!"
 time.133.desc:0 "对中央屏障的分析已经告一段落。\n\n无论我们参考了怎样的材料，都不能从工程性质上找出与屏障类似的物质，唯一可能的结论就是它什么东西都不是——除了力场。\n\n从这个方向上进行研究恐怕不会有任何的进展，我们的科研人员正在尝试从其它角度入手。"
 time.133.a:0 "就像一面虚幻之墙。"
 time.134.name:0 "神秘奇点：§H意外收获§!"
 time.134.desc:0 "尽管我们对于中央屏障的研究仍然没有进展，但我们发现了一处意外收获。\n\n根据先前的测试数据，我们或许可以利用其平息一片时空的混乱旋涡，并将它们纳入我们的领地。这种机会可遇不可求，但这需要消耗一大笔资源，并可能暂时推迟我们的研究进程。"
 time.134.a:0 "我们不能浪费这么宝贵的机会。"
 time.134.b:0 "我们的首要任务是突破屏障。"
 time.135.name:0 "神秘奇点：§H求救信号§!"
 time.135.desc:0 "尽管我们对于中央屏障的研究仍然没有进展，但我们收到了一则求救信号。\n\n这则信号采用一种十分古老的语言，但幸运的是，在我们先前的查阅中知悉了这一语言的语法。获救者或许会加入我们，但这需要消耗一大笔资源，并可能暂时推迟我们的研究进程。"
 time.135.a:0 "我们不能对他们见死不救。"
 time.135.b:0 "我们的首要任务是突破屏障。"
 time.136.name:0 "神秘奇点：§H突发奇想§!"
 time.136.desc:0 "尽管我们对于中央屏障的研究仍然没有进展，但我们迸发了一个突发奇想。\n\n虽然没有任何材料与屏障类似，但我们可以用多种材料混合以模拟屏障的性质，并用以拓展现有区划。这个想法很大胆，但这需要消耗一大笔资源，并可能暂时推迟我们的研究进程。"
 time.136.a:0 "我们不能否认天马行空的价值。"
 time.136.b:0 "我们的首要任务是突破屏障。"
 time.137.name:0 "神秘奇点：§H引力共振§!"
 time.137.desc:0 "功夫不负有心人，我们对屏障的研究终于有了收获。\n\n在某一次的例行检查中，工作人员意外地发现了屏障的奇异特性。当以某一种极高的频率向屏障输出信号时，屏障会回应信号，并进行微弱的振动。\n\n我们推测，这一引力屏障是以某一特定频率信号来生成力场并维持形态，而我们碰巧输出的频率与该频率叠加后，会使其循环波的某一相位处于不稳定状态，并导致屏障的振动。虽然要想持续输出这一高频信号具备一定难度，而屏障的共振幅度也并不剧烈，但这仍然给了我们一丝突破屏障的希望。\n\n我们不知道这一方法是否可行，但这也许是我们超越屏障的唯一机会。"
 time.137.a:0 "在尝试之前，谁也无法预测结果。"
 time.138.name:0 "神秘奇点：§H踏入深渊§!"
 time.138.desc:0 "在引力共振的作用下，引力屏障最终出现了缺口，并因而瞬间碎裂。与此同时，一股强大的吸引力将我们包裹，仿佛一切都将被这无底的深渊吞噬。在勉强维持斥力平衡后，我们才总算获得了喘息的机会。\n\n有哲学家认为，这一屏障并非是为了阻碍我们，相反，它真正的目的是保护我们。"
 time.138.a:0 "但我们总要迈出这一步。"
 
 time.141.name:0 "神秘奇点：§H引力波动§!"
 time.141.desc:0 "一股剧烈的引力波动席卷了整颗黑洞。\n\n一批正在未知时空调查的探索者被波动吞噬，并就此杳无音信，我们只能认定为他们死在了这场突如其来的灾难中。这批探索者的亲人感到十分悲痛，其它的探索者同事也对此表示遗憾。\n\n他们呼吁，在牺牲者遇难的这片时空建立一座纪念碑以吊唁逝者，而这或许会使我们暂时无法对此地开发利用。"
 time.141.a:0 "我们不能辜负他们的成果。"
 time.141.b:0 "我们应当铭记他们的牺牲。"
 time.142.name:0 "神秘奇点：§H数据核心§!"
 time.142.desc:0 "我们的探索者找到了一个神秘的数据核心。\n\n当他们将数据核心运到中央研究所时，数据核心突然启动，并瞬间释放出无数的未知辐射。这种辐射并不会对我们的身体造成直接伤害，但它似乎会影响我们的心智，并引发沮丧、悲恸、失忆、狂躁等症状。\n\n但是，这一数据核心之中存储了许多我们未曾涉足的知识，它或许能为我们的科学进步提供显著帮助。"
 time.142.a:0 "利用它稳定混乱的时空。"
 time.142.b:0 "利用它增强帝国的科研。"
 time.143.name:0 "神秘奇点：§H相位转移§!"
 time.143.desc:0 "我们的一些区划突然消失得无影无踪。\n\n原先的建筑群都在转瞬间不见，取而代之的则是数片未知的时空。根据经验老到的探索者所说，这是一种罕见的相位转移现象，只不过从未见过有如此大的规模。\n\n我们不知道这些时空是否会再次变幻，但这给了我们一个建设新区域的机会，同时也是一个了解黑洞的机会。"
 time.143.a:0 "开发这些时空。"
 time.143.b:0 "研究相位转移。"
 time.144.name:0 "神秘奇点：§H电磁风暴§!"
 time.144.desc:0 "一阵电磁风暴袭击了我们的母星。\n\n电磁风暴并不常见，就我们的历史而言，它的上一次出现距今足足有数百年。然而，一旦风暴形成，它对我们文明的打击是灾难性的。所幸，每次电磁风暴结束后都会使数片时空在很长一段时间处于相对稳定状态，因为风暴会消耗它们的能量，延缓高熵化的速率。\n\n对于这些趋近于稳定的新时空，我们应当选择合适的利用方式。"
 time.144.a:0 "将它们改造成永久居所。"
 time.144.b:0 "只把它们用作公共用地。"
 time.145.name:0 "神秘奇点：§H先锋据点§!"
 time.145.desc:0 "我们的探索者离黑洞的核心更加接近了。\n\n据称，只需不久，我们很快就能触及神秘奇点的核心。但越是靠近中央，时空就越是混乱，而距本土漫长的距离也使得补给和增员变得十分困难。\n\n因此，他们申请在最前沿建设一座先锋据点，在其中储存一定的物资，并迁入一些居民繁衍生息，以便更加高效地探索黑洞。"
 time.145.a:0 "批准，并学习他们的据点技术。"
 time.145.b:0 "批准，并宣扬他们的先锋精神。"
 time.146.name:0 "神秘奇点：§H法则逆转§!"
 time.146.desc:0 "黑洞中的部分物理法则突然与以往大相径庭。\n\n这是我们从未经历过的灾难，所有遭到改变的领域都经受了毁灭性的打击，相关生产线不得不停止运转，对应的科研方向也就此被关上了大门。但作为生存于黑洞中的文明，习惯于黑洞的多变早已刻入我们的血脉中。\n\n我们迅速地调整了我们的产业结构与科研方向，探索者也借此机会调查了本没有机会接触的更高维度，我们绝不会被黑洞击败。"
 time.146.a:0 "全力支援探索者的行动。"
 time.146.b:0 "以稳定本土平衡为优先。"
 time.147.name:0 "神秘奇点：§H恐惧蔓延§!"
 time.147.desc:0 "我们的探索者开始集体罢工了。\n\n最初是一个探索者拒绝向前，随后是几个，再是一队，再然后是一批，现如今，绝大多数的探索者都开始后撤了。我们不清楚他们罢工的理由，不过或许是源自他们对黑洞核心未知的恐惧。但很快，我们发现了不对劲，因为往后撤的探索者远比我们曾派出的探索者人数还要多，其中也有不少并未登记在籍的人口，但他们都坚称自己是我们的一份子。\n\n面对如此怪事，我们应当如何处理？"
 time.147.a:0 "允许籍贯之外的人民回归帝国。"
 make_situation_pc_time_slow:0 "§R这将在5年内减缓局势的进度。§!"
 time.147.b:0 "要求他们继续探索以证明忠诚。"
 make_situation_pc_time_fast:0 "§G这将在5年内加快局势的进度。§!"
 time.148.name:0 "神秘奇点：§H异界领域§!"
 time.148.desc:0 "我们的探索者似乎误入了异界的领域。\n\n无论从任何方向都无法找到通往黑洞核心的航道，仿佛原本的区域被异界所替换。虽然对神秘奇点的探索暂时没有进度，但我们的探索者仍兴致勃勃地对异界展开了调查。根据回报，这个世界充斥着与正常位面相反的物质，物理性质也存在着极大的差异，他们称之为“负相位面”。\n\n就在我们对负相位面感到好奇时，一批探索者声称找到了迷失其中的黑洞居民，但无法确保他们的可信度。"
 make_situation_pc_time_stop:0 "§R这将在5年内阻止局势的进展。§!"
 time.148.a:0 "他们也是我们的一份子。"
 time.148.b:0 "他们说的话完全不可信。"
 time.149.name:0 "神秘奇点：§H遥远星团§!"
 time.149.desc:0 "黑洞的核心时空似乎连通着一片遥远的星团。\n\n我们的探索者发现，这片星团中充斥着混乱无序的纳米机器人，而闯入我们领土的纳米云也为我们的开发建设带来了极大的阻碍。此时，远方的炮火声传入了探索者的耳边，他们朝朦胧的天空望去，竟是数头灰色的巨龙正与数艘灰色的舰船鏖战。\n\n我们的探索者及时找到了藏身处以避免被发现，并在战斗结束后安然无恙地踏上了返程。而在离开之前，他们可以搜寻一些战斗的残骸以供研究。"
 time.149.a:0 "研究纳米巨龙的残骸。"
 time.149.b:0 "研究纳米战舰的残骸。"
 
 time.151.name:0 "神秘奇点：§H时空流股§!"
 time.151.desc:0 "我们距离成功仅有咫尺之遥，但触手可及的黑洞中心周围却包裹着一股无序的时空乱流，这远比外层的引力漩涡要危险得多。\n\n为了尽可能减少损失，[Owner.GetRulerTitle]§Y[situation_pc_time_leader.GetName]§!，同时也是全国最精锐的探索者，决定铤而走险，独自进入时空流股以寻找一条通路。\n\n在前方等待着[situation_pc_time_leader.GetHerHim]的究竟是什么，我们谁也不知道。"
 time.151.a:0 "这是必要的牺牲。"
 time.151.a.tooltip:0 "§R['concept_origin_time_chosen']特质暂时失效§!"
 time.152.name:0 "神秘奇点：§H光锥错位§!"
 time.152.desc:0 "§Y[situation_pc_time_leader.GetName]§!发现自己在时间轴上的移动方式既混乱又规律。\n\n这和视界内过去、现在、未来不存在明显界限的情况不同，流股中的移动事件所形成的光锥会稳定朝平行方向传播，而非正常的垂直方向。这也就意味着，§Y[situation_pc_time_leader.GetName]§!所做的几乎一切都永远无法反馈回[situation_pc_time_leader.GetHerselfHimself]，并且[situation_pc_time_leader.GetSheHe]也永远无法预估自己的所作所为会对外界产生怎样的影响。\n\n这是极度危险的，§Y[situation_pc_time_leader.GetName]§!可能在眨眼间就将整个宇宙的因果链打乱，也可能因为某个小小的举动而使自己的生命提前终结。"
 time.152.a:0 "相信自己。"
 time.153.name:0 "神秘奇点：§H无限放大§!"
 time.153.desc:0 "§Y[situation_pc_time_leader.GetName]§!在时空流股中找到了一处较为稳定的安身之所，但很快，[situation_pc_time_leader.GetSheHe]就察觉到了异样。\n\n这处时空似乎能将不同的时间节点重叠起来，再通过一种未知的效应将同一个事物所引发的微小震颤无限放大。这一奇异的现象或许有助于§Y[situation_pc_time_leader.GetName]§!提升对自身能力的掌控，而这片空间似乎也能通过锚定与外界进行连通，但其独有的特性也许会因此遭到破坏。"
 time.153.a:0 "[situation_pc_time_leader.GetName]应当使擅长之处精益求精。"
 time.153.a.tooltip:0 "§Y[situation_pc_time_leader.GetName]的专属特质的主要职业部分会得到增幅§!"
 time.153.b:0 "[situation_pc_time_leader.GetName]可以对能力进行全面掌握。"
 time.153.b.tooltip:0 "§Y[situation_pc_time_leader.GetName]的专属特质的其它职业部分会得到增幅§!"
 time.153.c:0 "这片时空会造福我们的人民。"
 time.154.name:0 "神秘奇点：§H无穷叠加§!"
 time.154.desc:0 "§Y[situation_pc_time_leader.GetName]§!在时空流股中找到了一处较为稳定的安身之所，但很快，[situation_pc_time_leader.GetSheHe]就察觉到了异样。\n\n这处时空似乎能将不同的时间节点重叠起来，再通过一种未知的效应将同一个事物所引发的微小震颤无穷叠加。§Y[situation_pc_time_leader.GetName]§!尝试通过锚定使这片空间与外界进行连通，但在行动中发现这很可能干扰其独有的特性。"
 time.154.a:0 "仅连通部分，利用它来创造资源。"
 time.154.b:0 "仅连通部分，利用它来加工材料。"
 time.154.c:0 "完全连通，我们需要更多的时空。"
 time.155.name:0 "神秘奇点：§H链式反应§!"
 time.155.desc:0 "几经辗转，§Y[situation_pc_time_leader.GetName]§!终于发现了一个大量流股的交汇处。\n\n经过精密的计算，如果向该交汇点施加一定的能量，使流股的速度提升至某一定值，将有可能导致下一个交汇处的密度趋于无穷，并形成一个短时间的奇点以撕裂流股。这一大胆的尝试并不需要消耗太多的资源，因为我们只需要在起点轻轻一推，整个流程就会如链式反应般不断扩大持续进行。\n\n但是，该举措太过危险，难以预估其长期后果，甚至有引发流股崩溃的风险。"
 time.155.a:0 "针对性利用暗物质的能量引发共鸣。"
 time.155.a.tooltip:0 "§Y这更容易形成奇点，但也更加危险§!"
 time.155.b:0 "谨慎地使用常规资源促进流程进行。"
 time.155.b.tooltip:0 "§Y这可能导向不同的结果，但更安全§!"
 time.155.c:0 "风险太大了，放弃探索，离开流股。"
 time.155.c.tooltip:0 "§Y我们将尝试从外部绕开时空流股§!"
 time.156.name:0 "神秘奇点：§H蝴蝶效应§!"
 time.156.desc:0 "几经辗转，§Y[situation_pc_time_leader.GetName]§!终于发现了一个大量流股的交汇处。\n\n经过精密的计算，如果向该交汇点施加一定的能量，使流股的速度提升至某一定值，将有可能导致整体流股变得更加湍急，并形成能够稳定穿越的孔隙。这一大胆的尝试并不需要消耗太多的资源，因为我们只需要在起点轻轻一推，整个流程就会因蝴蝶效应而扩散至整个流股。\n\n但是，该举措太过危险，难以预估其长期后果，甚至有引发流股崩溃的风险。"
 time.156.a:0 "谨慎地使用常规资源促进流程进行。"
 time.156.a.tooltip:0 "§Y这很可能成功，但也有失败的风险§!"
 time.156.b:0 "风险太大了，放弃探索，离开流股。"
 time.156.b.tooltip:0 "§Y我们将尝试从外部绕开时空流股§!"
 time.157.name:0 "神秘奇点：§H所见皆虚§!"
 time.157.desc:0 "在若干个流转周期后，一个奇点出现在了某个交汇处，周围的流股也因扭曲而形变。然而，§Y[situation_pc_time_leader.GetName]§!并没能等到流股撕裂，就被强大的引力场困住了。\n\n但奇点并未将[situation_pc_time_leader.GetHerHim]粉碎，而是化作了一面镜子。镜中有§Y[situation_pc_time_leader.GetName]§!，还有一面镜子，这面镜子中也有一个§Y[situation_pc_time_leader.GetName]§!和另一面镜子。无数面镜子中，无数个§Y[situation_pc_time_leader.GetName]§!看着镜子，也是看着无数个自己。\n\n当§Y[situation_pc_time_leader.GetName]§!意识到这一点之后，镜子扭曲为一团难以描述的物体，镜中的§Y[situation_pc_time_leader.GetName]§!也形变成一片无法辨别的阴影。\n镜子碎了，§Y[situation_pc_time_leader.GetName]§!甚至意识不到镜子是何时碎的，就像它原本就不存在。\n时空流股消失了，§Y[situation_pc_time_leader.GetName]§!也没能察觉其消失的瞬间，也许[situation_pc_time_leader.GetSheHe]从未进入过。"
 time.157.a:0 "所见皆虚，唯有时间永恒。"
 time.157.a.tooltip:0 "§Y[situation_pc_time_leader.GetName]的专属特质的国家统治部分会得到增幅§!"
 time.157.b:0 "所见皆虚，存在便是意义。"
 time.157.b.tooltip:0 "§Y[situation_pc_time_leader.GetName]的专属特质的资源产出部分会得到增幅§!"
 time.157.c:0 "所见皆虚，现实亦非真实。"
 time.158.name:0 "神秘奇点：§H眼见为实§!"
 time.158.desc:0 "在若干个流转周期后，流股之间出现了无数个微小的孔隙，最近的一个在瞬间将§Y[situation_pc_time_leader.GetName]§!裹挟其中。\n\n在时空乱流的彼岸，竟是另一个黑洞，§Y[situation_pc_time_leader.GetName]§!甚至怀疑自己回到了母星。然而，这片世界空无一人，完全没有任何文明的迹象，这才使§Y[situation_pc_time_leader.GetName]§!确信这里是我们的另一面。凭借着先前探索的经验与记录，§Y[situation_pc_time_leader.GetName]§!抵达了黑洞的视界边缘，但星空根本就不存在，视界之外只有一片漆黑。\n\n后来，§Y[situation_pc_time_leader.GetName]§!又返回了流股，穿越了其它的孔隙，成功找到了前往黑洞中心的通路，但我们的另一面却始终令[situation_pc_time_leader.GetHerHim]耿耿于怀。\n也许，这是我们的文明诞生之前，也是宇宙诞生的伊始。\n也许，这是我们的文明消亡之后，也是世界衰退的终结。"
 time.158.a:0 "眼见为实，宇宙的伊始值得研究。"
 time.158.b:0 "眼见为实，世界的终结理应深思。"
 time.158.c:0 "眼见为实，命运的循环已成既定。"
 time.159.name:0 "神秘奇点：§H无果而终§!"
 time.159.desc_1:0 "我们已经有很长的时间没能接收到§Y[situation_pc_time_leader.GetName]§!的讯息了。\n\n根据流股研究者的观测，我们发现，§Y[situation_pc_time_leader.GetName]§!好像陷入了一个无法打破的循环，这一结局似乎早在进入之时就已确定。无论是过去、现在、未来，[situation_pc_time_leader.GetSheHe]早已死去。"
 time.159.desc_2:0 "最精锐的探索者已经不在了，尽管其并非因流股而逝。\n\n对时空流股的分析显示，流股在过去的数段时间内变得愈发混乱，现在再次进入流股几乎没有幸存的可能了，我们决定放弃继续探索，转而寻找绕开流股的方法。"
 time.159.a:0 "木已成舟，只能接受。"
 time.159.b:0 "我们总会有办法的。"
 time.159.tooltip:0 "§Y我们将尝试从外部绕开时空流股§!"
 
 time.160.name:0 "神秘奇点：§H黑洞之心§!"
 time.160.desc:0 "历经千难万险，我们的探索者终于抵达了旅途的目的地。\n\n黑洞的中心就是一个普通的奇点。\n一个奇点。\n一个普通的奇点。\n一个完全符合黑洞定律的奇点。\n我们的探索者失望透顶，我们也失望透顶。我们本以为，我们的黑洞与其它黑洞不一样的原因在于中央的奇点，但事实证明，没有原因。即使如此，生活仍要继续，我们的探索者依然会在无数个时空中寻找一些未曾见过的现象，调查一些未曾踏足的领域。\n\n这就是我们的使命，这便是我们的宿命。"
 time.160.a.materialist:0 "对未知的钻研即是我们的命运。"
 time.160.a.spiritualist:0 "对灵魂的感知即是我们的命运。"
 time.160.a.militarist:0 "对武力的崇尚即是我们的命运。"
 time.160.a.pacifist:0 "对生活的享受即是我们的命运。"
 time.160.a.xenophile:0 "对希望的追求即是我们的命运。"
 time.160.a.xenophobe:0 "对领土的捍卫即是我们的命运。"
 time.160.a.egalitarian:0 "对幸福的向往即是我们的命运。"
 time.160.a.authoritarian:0 "对星海的掌控即是我们的命运。"
 time.160.b:0 "对时空的探索即是我们的命运。"
 time.160.c:0 "对文明的进步即是我们的命运。"
 time.160.d:0 "对民族的发展即是我们的命运。"
 time.161.name:0 "神秘奇点：§H视界信号§!"
 time.161.desc_1:0 "就在我们的生活重归正轨之后，数个星系向我们传来了神秘的信号。根据观测，那些信号的来源似乎都是黑洞星系。\n\n有人推测，发信者和我们同样是黑洞的居民；\n有人怀疑，信号源是在警告危险；\n还有人认为，这是来自视界的信号，正邀请我们前往黑洞。"
 time.161.desc_2:0 "就在我们的生活重归正轨之后，我们的母星朝我们传来了神秘的信号。经过分析，信号的内容似乎是在传授一些特殊的科技。\n\n有人推测，发信者是更深层的奇点居民；\n有人怀疑，信号源是在警告危险；\n还有人认为，这是来自时之螶的信号，正邀请我们踏入未知。"
 time.161.a:0 "这意味着什么？"
 gain_horizonsignal_spawn_system_point:0 "§Y我们获知了几个视界信号的坐标。§!"
 time.161.b:0 "这意味着什么？"
 
 time.170.name:0 "神秘奇点：§H维度枢纽§!"
 time.170.desc:0 "我们本以为黑洞的中心只是一个普通的奇点，并一度信以为真。\n\n但在§H时之螶§!的帮助下，我们终于卸下了奇点的伪装，发现了陷阱之下的秘密——这是一个连接其它位面的枢纽。我们不知道宇宙中有多少个这样的枢纽，也不知道在我们之前是否曾有人使用过这个枢纽，更不知道位面枢纽的形成原因，但我们确信，我们正在通往真相的道路上渐行渐远。\n\n我们很庆幸，母星和我们一样不平凡。"
 time.170.a:0 "连接着维度，也连接着真理。"
 unlock_tradition_origin_time:0 "解锁['concept_tradition_origin_time']传统树"
 unlock_ap_origin_time:0 "解锁['concept_ap_origin_time']飞升天赋"
 
 PC_TIME_END_CHAIN_title:0 "视界信号"
 PC_TIME_END_CHAIN_desc:0 "我们收到了一些神秘的信号，它们似乎都来自于黑洞。"
 horizonsignal_spawn_system_point:0 "视界坐标"
 horizonsignal_spawn_system_point_desc:0 "这是其中一个视界信号的信号源坐标。"
 
 TIME_BLACK_HOLE_CHAIN_title:0 "时之螶：交流"
 TIME_BLACK_HOLE_CHAIN_desc:0 "黑洞中出现了一个又一个谜团，仿佛在故意嘲笑我们的无知。而视界里传来的一阵又一阵低吟，似乎与我们的母星存在千丝万缕的关系。\n\n我们很快就会知道，我们从哪里来，我们要往哪里去。"
 
 time.201.name:0 "视界信号：§H如影随形§!"
 time.201.desc:0 "又来了，又来了……\n\n时隔多日，在我们的科研船进入另一个黑洞星系时，我们又收到了那串神秘的视界信号。这就像是某种神秘存在一直跟在我们身后，一遇到黑洞便迫不及待地将其占为己有，再大肆嘲弄我们的浑然不知一般。但是，这次的信号和之前的有些许不同，我们可能需要重新破解。\n\n可以肯定的是，这绝对不是一场恶作剧，至少，不是一般的恶作剧。"
 time.201.a:0 "再次分析视界信号。"
 time.201.b:0 "忘了那该死的信号吧！"
 time.202.name:0 "视界信号：§H杂乱无章§!"
 time.202.desc:0 "这一次的信号分析十分艰难，分析结果也非常令人困惑。\n\n信号中充斥着不规则的语句，我们根本无法理解对方究竟想传达什么信息，似乎对方本打算说些什么，却又中途反悔，并打乱了信号。"
 time.202.a:0 "一个来自黑洞的恶作剧。"
 time.203.name:0 "视界信号：§H生或者死§!"
 time.203.desc:0 "这一次的信号分析十分艰难，分析结果也非常令人震惊。\n\n我们不知道对方的真实目的究竟是什么，但这一次，它们将目光落在了我们的[Root.GetRulerTitle]——§Y[time_black_hole_leader.GetName]§!身上。纵使我们的种族拥有在黑洞中生存的能力，但先前的一系列事件让我们明白，宇宙中绝大多数的黑洞都是贪婪的暴食者，我们的母星只是特例。因此，如果我们将[Root.GetRulerTitle]送入黑洞，[time_black_hole_leader.GetSheHe]就无法为我们指引前进的方向，我们的民众也极有可能陷入恐慌。\n\n当然，我们也可以拒绝，但谁又知道还会发生些什么呢？"
 time.203.b.tooltip:0 "§H[time_black_hole_leader.GetName]§!会在§Y30天§!内抵达出口点。"
 time.203.a:0 "我选择生存。"
 time.203.b:0 "我选择死亡。"
 # 结局1
 time.204.name:0 "视界信号：§H向死而生§!"
 time.204.desc:0 "这实在是令人难以置信！\n\n在[Root.GetRulerTitle]§Y[time_black_hole_leader.GetName]§!驾驶的飞船进入事件视界的一瞬间，它竟然从我们的母星中心飞出来了！经过交流，我们可以确定，飞船中的正是[Root.GetRulerTitle]§Y[time_black_hole_leader.GetName]§!本人。据§Y[time_black_hole_leader.GetName]§!表示，[time_black_hole_leader.GetSheHe]在进入事件视界的一瞬间，只感觉回到了母星的怀抱，随后，就出现在了母星人民的面前。\n\n在将§Y[time_black_hole_leader.GetName]§!迎回中央政府后，我们很快地对[time_black_hole_leader.GetSheHe]进行了身体检查，发现[Root.GetRulerTitle]并无异样。但是，研究人员发现，§Y[time_black_hole_leader.GetName]§!周围的时空似乎变得更稳定了，并且[time_black_hole_leader.GetSheHe]可以在一定程度上命令时空。"
 time.204.a:0 "为[time_black_hole_leader.GetName]的死里逃生欢呼！"
 # 结局2
 time.205.name:0 "视界信号：§H贪生怕死§!"
 time.205.desc:0 "这实在是令人难以置信！\n\n一夜之间，[Root.GetRulerTitle]§Y[time_black_hole_leader.GetName]§!便消失了，无论在母星的哪个角落都无法找到[time_black_hole_leader.GetSheHe]的踪迹。就在我们为[Root.GetRulerTitle]的失踪百般焦虑时，我们再一次收到了视界信号……\n\n根据分析，在这个信号内也有一段声音编码，听起来就像是[Root.GetRulerTitle]§Y[time_black_hole_leader.GetName]§!的声音。[time_black_hole_leader.GetSheHe]似乎在哀嚎，仿佛遭受了什么极为痛苦的事情。但很快地，哀嚎声就渐渐消逝，取而代之的是某种生物的笑声。“为什么不愿意接受我的拥抱呢？”那生物似乎在说，“贪生怕死者无法在黑洞中生存。”\n\n随后，信号便中断了。"
 time.205.a:0 "这感觉简直生不如死……"
 
 time.206.name:0 "黑洞呢喃：§H追随者与质疑者§!"
 time.206.desc.life:0 "[Owner.GetRulerTitle]§Y[time_black_hole_leader.GetName]§!的离奇死亡震惊了举国上下，对旧[Owner.GetRulerTitle]不满的质疑者认为，[time_black_hole_leader.GetSheHe]的胆怯是造成这一悲剧的原因。\n\n不过，也有一批追随于§Y[time_black_hole_leader.GetName]§!的人声称这起事故是一场阴谋，他们会为已故的[Owner.GetRulerTitle]讨要一个说法。\n\n视界之内一如既往地宁静，但在错综复杂的时空里，疑惑与不安正逐渐蔓延。"
 time.206.desc.death:0 "[Owner.GetRulerTitle]§Y[time_black_hole_leader.GetName]§!的光荣事迹已经传遍了整个国度，[time_black_hole_leader.GetSheHe]也因此收获了一批坚定的追随者，但[Owner.GetRulerTitle]尚未表态。\n\n然而，并非所有人都对该事迹深信不疑，他们认定这只是§Y[time_black_hole_leader.GetName]§!为自己谋划的一场炒作，并将质疑转变为对[Owner.GetRulerTitle]的敌意。\n\n视界之内一如既往地宁静，但在错综复杂的时空里，疑惑与不安正逐渐蔓延。"
 time.206.a:0 "这是暴风雨前的宁静。"
 
 time.207.name:0 "黑洞呢喃：§H崇敬者与研究者§!"
 time.207.desc.life:0 "眨眼间，时间已过去数月，[Owner.GetRulerTitle]§Y[time_black_hole_leader.GetName]§!的离奇死亡仍然使全国人民震惊。一群著名的研究者认为，§Y[time_black_hole_leader.GetName]§!的死亡本身只是一场遗憾，但其所蕴含的意义才值得我们深思。\n\n然而，更多人情愿将这起事故视作上天神罚，唯有保持对黑洞的崇敬才有可能避免悲剧重演。\n\n现如今，视界之内又出现了两个新的派别，尽管并不强大，但它们的潜力也不容小觑。"
 time.207.desc.death:0 "眨眼间，时间已过去数月，[Owner.GetRulerTitle]§Y[time_black_hole_leader.GetName]§!的光荣事迹仍在全国范围内传播。一批狂热的崇敬者将§Y[time_black_hole_leader.GetName]§!视作至高无上的神明，并不遗余力地宣讲自己的教义。\n\n不过，也有冷静的人们认为这绝非神迹，我们应该做的是研究奇迹发生的原因，并分析现象背后的本质。\n\n现如今，视界之内又出现了两个新的派别，尽管并不强大，但它们的潜力也不容小觑。"
 time.207.a:0 "似乎有什么在背后推波助澜。"
 
 time.208.name:0 "黑洞呢喃：§H激进者与保守者§!"
 time.208.desc.life:0 "时光荏苒，对[Owner.GetRulerTitle]离奇死亡的议论反而愈演愈烈。被黑洞吞噬的§Y[time_black_hole_leader.GetName]§!令不少人的思想变得保守，他们变得更加珍惜生命并不愿意承担风险。\n\n与之相反，另一群人却觉得保守者过于胆怯，他们坚信只有靠激进与勇敢的途径才可能大有作为。\n\n六个势力彼此争论不休，视界之内早已变得混乱不堪。"
 time.208.desc.death:0 "时光荏苒，对[Owner.GetRulerTitle]光荣事迹的传颂反而愈演愈烈。历经黑洞考验的§Y[time_black_hole_leader.GetName]§!引发了一场慕强的潮流，不少人开始追求用激进的手段决定一切。\n\n但是，被激进者欺凌的普通民众对此表示严重不满，他们希冀通过一种更加保守与和平的方式决定自己的命运。\n\n六个势力彼此争论不休，视界之内早已变得混乱不堪。"
 time.208.a:0 "这些争论真的有意义吗？"
 
 time.209.name:0 "黑洞呢喃：§H纯净者与混合者§!"
 time.209.desc.life:0 "黑洞中的局势已经不再与[Owner.GetRulerTitle]的死亡完全相关了。我们的人民自发地将§Y[time_black_hole_leader.GetName]§!的贪生怕死视作我们无法抹去的污点，并将自己与其它物种进行比较，希望多元的方式能避免民族的缺陷。\n\n但是，一批爱国人士强烈地抨击了这一行为，他们认为是其它物种污染了我们，只有将民族纯净化才可抹除这一污点。\n\n视界之内的纷争已经抵达了新的高潮。"
 time.209.desc.death:0 "黑洞中的局势已经不再与[Owner.GetRulerTitle]的事迹完全相关了。我们的人民自发地将§Y[time_black_hole_leader.GetName]§!的向死而生视作整个民族高贵的证明，并因此极端排斥其它的物种，以免污染民族的纯净性。\n\n与之相反，一些进步人士则认为其它物种能为我们带来更多可能性，我们的民族可以拥有多元化的发展，这同样是高贵的表现。\n\n视界之内的纷争已经抵达了新的高潮。"
 time.209.a:0 "没有什么能够阻挡历史的车轮。"
 
