 time.30.name:0 "神秘奇点：§H理解无限§!"
 time.30.desc:0 "奇点并非密度最高的形态，我们还可以对其再次进行压缩。\n\n在时之螶的暗示下，我们尝试了这一前所未有的黑洞压缩技术——通过压缩奇点来使其密度达到溢出。只有在时之螶的帮助下，我们才能完成这一过程，因此，我们对我们的母星进行了压缩。然而，时之螶仅告诉我们这一行为可以让我们理解宇宙的全部奥秘，却并没有告诉我们代价是什么。\n\n§R代价是什么？§!"
 time.30.a:0 "§R我能看见永恒……§!"
 time.30.a.tooltip:0 "§H解锁功能：§!奇点递归\n$t$允许将§Y$pc_black_hole$§!环境改造为§Y$pc_time$§!\n$t$每个§Y$pc_time$§!与§Y$pc_endless_time$§!都将产生$mod_col_time_mult$§G+5%§!\n§R$pc_endless_time$将所在星系的超空间航道全部吞噬！§!"
 time.24.name:0 "神秘奇点：§H永恒告别§!"
 time.24.desc.1:0 "黑洞都是邪恶而毫无美感的，我们曾经的母星更是如此。\n\n$change_pc_time_1_desc$"
 time.24.a.1:0 "§Y这是神的指引……§!"
 time.24.a.1.tooltip:0 "成功封印§Y$pc_time$§!，并因此获得国家修正§Y$change_pc_time_1$§!。"
 time.24.desc.2:0 "宇宙中的每一个黑洞都暗藏奥秘，我们曾经的母星也不例外。\n\n$change_pc_time_2_desc$"
 time.24.a.2:0 "§B数据难以置信……§!"
 time.24.a.2.tooltip:0 "成功窥视§Y$pc_time$§!，并因此获得国家修正§Y$change_pc_time_2$§!。"
 
 time.29.name:0 "神秘奇点：§H视界雾霭§!"
 time.29.desc.1:0 "利用在母星中学到的技术，我们成功地改变了视界雾霭下的物理法则，甚至成功将其转变成了一颗黑洞。\n\n混乱与无序不再是§Y[time_wormhole_planet.GetName]§!的代名词，这里已然成为了我们的第二家园。"
 time.29.desc.2:0 "通过对视界雾霭的研究，我们有了一个惊人的发现——§Y[time_wormhole_planet.GetName]§!的视界竟然与§Y[time_wormhole_core_planet.GetName]§!相连！\n\n科学官已经利用该特性开启了一对两颗星球之间的稳定虫洞，我们决定放弃对§Y[time_wormhole_planet.GetName]§!本身的开发，转而将它所占据的维度纳入§Y[time_wormhole_core_planet.GetName]§!的领域。"
 time.29.a:0 "这里就是我们的第二视界。"
 time.29.b:0 "这是一片属于我们的天地。"
 
 time.50.name:0 "时之螶：§B过去宫殿§!"
 time.50.desc:0 "在无尽奇点中生活了数年后，我们终于意识到了未来宫殿的含义。\n\n这座神秘的宫殿正是来自于我们的未来，其中的资源也是未来的我们给予的馈赠。或许，现在是回报的时刻了，我们也能为这个§Y循环§!尽自己的一份力，让过去的我们得到现在的帮助吧。当然，过去的时间是有限的，未来的时间是无限的，所以我们仅需提供很少的资源就能让§Y循环§!完整。\n\n§H时之螶§!也期待着我们的回应。"
 time.50.a:0 "我们永远是循环的一份子。"
 time.50.b:0 "未来的我们会弥补现在的这一份。"
 time.51.name:0 "时之螶：§M时空循环§!"
 time.51.desc:0 "我们达成了一个时空循环：现在的我们为过去提供帮助，而未来的我们也为现在做出贡献。\n\n我们真正地理解了循环的含义，也真正地明白了§H时之螶§!的深意。不只是§H时之螶§!深爱着我们，我们也深爱着我们。"
 time.51.a:0 "§M我们永远爱我们。§!"