l_simp_chinese:
 beyond_infinity.2.name:0 "时空复原"
 beyond_infinity.2.desc.ruin:0 "终于，时空机器的能源已经耗尽，它现在已经彻底停摆，所造成的影响和危害也停止了。"
 beyond_infinity.2.desc.repair:0 "真惊讶我们是怎么在这么短的时间内完成的，但无论如何，我们修好了时空机器，但我们仍需前往下一个时空。"
 beyond_infinity.2.a.ruin:0 "终于结束了。"
 beyond_infinity.2.a.repair:0 "让我们迎来一个新的开始吧。"
 beyond_infinity.2.tooltip:0 "§G时间重新变得可控且稳定。§!"
 
 beyond_infinity.3.name:0 "圆环归位"
 beyond_infinity.3.desc.ruin:0 "终于，圆环枢纽的能源已经耗尽，它现在已经彻底停摆，所造成的影响和危害也停止了。"
 beyond_infinity.3.desc.repair:0 "真惊讶我们是怎么在这么短的时间内完成的，但无论如何，我们修好了圆环枢纽，但还有更多的圆环等待着我们的影响。"
 beyond_infinity.3.a.ruin:0 "终于结束了。"
 beyond_infinity.3.a.repair:0 "让一切朝着正确的方向进行吧。"
 beyond_infinity.3.tooltip:0 "§G生物可以自由在其它星球上生存。§!"
 
 beyond_infinity.4.name:0 "位面平息"
 beyond_infinity.4.desc.ruin:0 "终于，位面引擎的能源已经耗尽，它现在已经彻底停摆，所造成的影响和危害也停止了。"
 beyond_infinity.4.desc.repair:0 "真惊讶我们是怎么在这么短的时间内完成的，但无论如何，我们修好了位面引擎，但要将其与其它位面连结仍需更多努力。"
 beyond_infinity.4.a.ruin:0 "终于结束了。"
 beyond_infinity.4.a.repair:0 "让所有的次元都融为一体吧。"
 beyond_infinity.4.tooltip:0 "§G舰船超光速后不再会无来由地失踪。§!"
 
 beyond_infinity.5.name:0 "时空混乱"
 beyond_infinity.5.desc.root:0 "我们的时空机器似乎……出了点故障。\n\n它现在已经彻底失控了，并造成了许多难以预估的影响和危害。据修缮者计算，时空机器所储备的能源已经不多了，只待能源耗尽，失控的问题就会得到解决。\n\n但谁知道能源还能维持多久呢？\n\n$edict_defective_time_machine_edict_desc$"
 beyond_infinity.5.desc.other:0 "等等，为什么时针开始倒转了，现在到底是几点？"
 beyond_infinity.5.a.root:0 "我们得修好它，或者等它稳定下来。"
 beyond_infinity.5.a.other:0 "究竟发生了什么？"
 beyond_infinity.5.tooltip:0 "§R时间变得混乱不堪且难以测定！§!"
 
 beyond_infinity.6.name:0 "圆环偏移"
 beyond_infinity.6.desc.root:0 "我们的圆环枢纽似乎……出了点故障。\n\n它现在已经彻底失控了，并造成了许多难以预估的影响和危害。据调节者分析，圆环枢纽所储备的能源已经不多了，只待能源耗尽，失控的问题就会得到解决。\n\n但谁知道能源还能维持多久呢？"
 beyond_infinity.6.desc.other:0 "我是谁？我在哪？我存在的意义是什么？"
 beyond_infinity.6.a.root:0 "我们得修好它，或者等它稳定下来。"
 beyond_infinity.6.a.other:0 "究竟发生了什么？"
 beyond_infinity.6.tooltip:0 "§R生物在母星之外都难以生存！§!"
 
 beyond_infinity.7.name:0 "位面震荡"
 beyond_infinity.7.desc.root:0 "我们的位面引擎似乎……出了点故障。\n\n它现在已经彻底失控了，并造成了许多难以预估的影响和危害。据组装者检测，位面引擎所储备的能源已经不多了，只待能源耗尽，失控的问题就会得到解决。\n\n但谁知道能源还能维持多久呢？"
 beyond_infinity.7.desc.other:0 "空间在无规律地变幻，整个世界都如出错的程序般闪烁。"
 beyond_infinity.7.a.root:0 "我们得修好它，或者等它稳定下来。"
 beyond_infinity.7.a.other:0 "究竟发生了什么？"
 beyond_infinity.7.tooltip:0 "§R舰船超光速后都可能失踪！§!"
 
 beyond_infinity.8.name:0 "时空复原"
 beyond_infinity.8.desc:0 "如它毫无来由的出现，混乱的时空也毫无征兆地复原了。\n\n我们完全不了解原因，或许这就是宇宙本来就有的现象之一吧。"
 beyond_infinity.8.a:0 "呼，总算结束了。"
 
 beyond_infinity.9.name:0 "圆环归位"
 beyond_infinity.9.desc:0 "如它毫无来由的出现，偏移的圆环也毫无征兆地归位了。\n\n我们完全不了解原因，不过这一现象值得记录和思考。"
 beyond_infinity.9.a:0 "呼，总算结束了。"
 
 beyond_infinity.10.name:0 "位面平息"
 beyond_infinity.10.desc:0 "如它毫无来由的出现，震荡的位面也毫无征兆地平息了。\n\n我们完全不了解原因，但至少因此坠毁的飞船残骸能提供一些线索。"
 beyond_infinity.10.a:0 "呼，总算结束了。"
 
 beyond_infinity.11.name:0 "坐标错误"
 beyond_infinity.11.desc:0 "[Root.GetName]在进行一次超光速后抵达了错误的坐标。\n\n我们失去了与他们的联系，但我们确信他们已经在返航的路上了。"
 beyond_infinity.11.a:0 "该死！"
 
 ################################################################
 # 超越无限
 ################################################################
 
 # 采纳
 beyond_infinity.500.desc:0 "你们这么早就决定要对抗终末了吗？\n\n这样也好，我们就有更多的时间为找出突破口做准备了。虽然你们目前的科技水平还远不足矣接手未来的你们的工作，但这是你们的决定，我会全力支持的。"
 beyond_infinity.500.a:0 "我们接下来应该怎么做？"
 beyond_infinity.501.desc:0 "你们首先要知道的是，我们所处的循环实际上早应被终末吞噬，但其它循环的我们不断地创造时间，一分一秒地将终末推迟至三万年后，这才有了我们的现在。"
 beyond_infinity.501.a:0 "也就是说，可以无限创造时间将终末推迟？"
 beyond_infinity.502.desc:0 "正确——但也不完全正确。\n\n因为时间对终末的推迟效果是存在一个阈值的，或者说，是所有循环对终末推迟效果的平均值。\n\n在未抵达这个阈值之前，我们所创造的时间将能直接用于推迟我们所在循环的终末；\n可一旦抵达阈值，我们所创造的时间就将直接参与所有循环对终末共同的推移作用，也就是提升阈值。"
 beyond_infinity.502.a:0 "在推迟我们的循环的终末之后，还要推迟所有循环的终末？"
 beyond_infinity.503.desc:0 "的确如此，但对所有循环终末的推移效果具体而言仍是个未知数，因为我们并不能从其它循环获取任何有关终末的信息。\n\n甚至，刚刚我对你们解释的理论都仅仅是未来的你们的一个猜想，几乎没有证据可以证明，但仍然有许多奇异的现象符合了这一假说。"
 beyond_infinity.503.a:0 "那我们岂不是在盲人摸象？"
 beyond_infinity.504.desc:0 "尽管很令人遗憾，但这就是我们的现状——我们对终末所知甚少。\n\n不过至少，时间能在一定程度上推迟终末是可以明确的，而创造时间虽然困难，但也并非不可能——这就是我为你们提供的来自未来的技术帮助。"
 beyond_infinity.504.a:0 "明白了。"
 
 beyond_infinity.600.name:0 "超越无限"
 beyond_infinity.600.desc:0 "§H[From.GetName]§!似乎正为某个遥远未来的危机做准备，但我们完全不清楚他们打算干什么。"
 beyond_infinity.600.a:0 "难以理解。"
 
 # 一段
 beyond_infinity.1000.desc:0 "虽然创造时间很困难，但你们应该也已经适应了这一技术吧。\n\n不过别高兴太早，我们现在所创造的时间仅仅能将终末向后推迟§Y1天§!，相比于三万年只是杯水车薪。\n但也别气馁，毕竟我们还有非常多充足的时间，总有一天会追上未来的我们的。"
 beyond_infinity.1000.a:0 "我们只需要创造时间就行了吗？"
 beyond_infinity.1001.desc:0 "当然不是了，正如我之前所说，创造时间只能推迟终末，却无法解决终末，而无限推迟终末对我们而言也是不可能的。\n因此，我们还需要在不同领域进行各种各样的尝试，以寻找一种可能的解决方法。\n\n虽然未来的我们的确也做了不少尝试，但让你们直接在他们的基础上继续实在是太过困难。\n而且，我认为我也不应过多干涉历史的进程，让你们自由发展或许能有意料之外的突破。"
 beyond_infinity.1001.a:0 "我们已经有了一个大胆的想法。"
 beyond_infinity.1001.a.response:0 "既然如此，那就放手去做吧，我会在必要的时刻给予你们帮助的。"
 
 beyond_infinity.1500.desc:0 "我注意到你们正准备建造§H以太相引擎§!，你们已经在这条路上走得太远了，是时候回头了。"
 beyond_infinity.1500.a:0 "回头是什么意思？"
 beyond_infinity.1501.desc:0 "你们准备做的事是极具破坏力且对解决终末毫无帮助的。\n\n你们试图利用虚境的能量将自己升华来规避终末，但那是做不到的。\n当以太相引擎启动，虚境的能量会倒灌至这个宇宙，强大的冲击力会摧毁整片银河系，但你们也将葬身于这场浩劫中——灵魂陷入虚境的桎梏，唯有永恒的痛苦相伴。"
 beyond_infinity.1501.a:0 "没有成功的可能吗？"
 beyond_infinity.1502.desc:0 "尽管并非必定失败，但成功的概率也不高。\n并且，即使你们侥幸成功，也仅能在$NAME_Nemesis_Puppeteer$的操纵下掌控虚境的一角，沉溺于自命不凡的幻象，迎接没有未来的未来……\n可就连虚境也无法避免终末的清算。\n\n趁着你们还没彻底偏离，尽快放弃这无谓的尝试吧。"
 beyond_infinity.1502.a:0 "至少我们并非毫无收获。"
 beyond_infinity.1502.a.response:0 "没错，失败并不意味着一切。\n在尝试的过程中，我们也发现了一些奇特的现象，它们是文明进展的必经之路，所以不必气馁。\n\n更何况，还有更多的可能正等待着我们呢，也许下一次，我们会更接近答案。"
 
 beyond_infinity.1600.name:0 "超越无限"
 beyond_infinity.1600.desc:0 "§H[From.GetName]§!离他们的目标更近了一步，在他们的帝国疆域内，时间的流动似乎有些不一样。"
 beyond_infinity.1600.a:0 "继续观察。"
 
 # 二段
 gain_cosmogenesis_tech_1:0 "§Y解锁失落帝国初级科技§!"
 gain_cosmogenesis_tech_2:0 "§Y解锁失落帝国先进科技§!"
 gain_cosmogenesis_tech_3:0 "§Y解锁失落帝国综合科技§!"
 gain_cosmogenesis_tech_4:0 "§Y解锁失落帝国非凡科技§!"
 gain_cosmogenesis_tech_5:0 "§Y解锁失落帝国奥术科技§!"
 beyond_infinity_cosmogenesis_planet_pickup_chain_title:0 "往昔记忆——出谷记"
 beyond_infinity_cosmogenesis_planet_pickup_chain_desc:0 "$cosmogenesis_planet_pickup_chain_desc$"
 
 beyond_infinity.2000.desc:0 "我想你们已经准备好进行下一步尝试了，不过你们看上去似乎没什么头绪。"
 beyond_infinity.2000.a:0 "因为我们感觉在各个领域都被约束——来自这个宇宙。"
 beyond_infinity.2001.desc:0 "的确是这样，毕竟宇宙本身的许多规律都并不是出于被使用而设计的——至少不是出于被我们使用而设计。\n\n你瞧，你们这不就找到了一个新的突破口吗？"
 beyond_infinity.2001.a:0 "你是指——修改宇宙规律？"
 beyond_infinity.2002.desc:0 "正是如此，宇宙规律并非一成不变无法修改的。\n尽管要调整它并不是一件简单的事，但只要知道了前方不是死路，那就算再难也可以轻松做到。\n\n再给你们一点提示吧：循环与其说是一个环，不如说是一个球。\n这个球的不同区域有着不同的性质，但由于球体太大而几乎互不干涉。"
 beyond_infinity.2002.a:0 "可以从一个区域前往另一个区域吗？"
 beyond_infinity.2003.desc:0 "对于居住在球体内表面的文明而言，世界其实是一个漫长到接近平坦的曲面，想要抵达其它区域需要耗费的时间接近永恒。\n\n但若能脱离表面进入球体中央，便可让原本咫尺天涯的两个点连成直线，原本互不相干的两片区域的性质也会彼此杂糅，呈现出迥然不同的新规律。"
 beyond_infinity.2003.a:0 "球体中央就是黑洞——或者说负相位面？"
 beyond_infinity.2003.a.response:0 "那就留给你们自行验证啦。\n\n不过千万不要忽视引力，它与时间和空间同样重要。"
 
 beyond_infinity.2100.name:0 "引力"
 beyond_infinity.2200.name:0 "穿透"
 beyond_infinity.2300.name:0 "法则"
 beyond_infinity.2400.name:0 "永恒"
 beyond_infinity.2500.desc:0 "果然，你们已经准备建造§Y视界刺针§!并前往黑洞了。"
 beyond_infinity.2500.a:0 "这次还不行吗？"
 beyond_infinity.2501.desc:0 "行不通，但它是必经之路。\n\n这条路，实际上我们已经走过了。\n准确来说，是若干个循环之前的某个我们——或者某些我们，已经迈出了这一步。\n\n因此，我们已经不需要重新走一遍了。"
 beyond_infinity.2501.a:0 "行不通，但是必经之路？"
 beyond_infinity.2502.desc:0 "无论我们进入哪个黑洞，无论我们能如何编辑现实，都无法避免终末的到来。\n无论在任何参考系下，终末都将如期而至。就像齿轮一样，当大的齿轮完成一次循环时，小的齿轮可能已经完成了成百上千次循环。\n因此，在循环之内，我们是注定失败的。\n\n但要想超越循环，我们必须得到循环本身——也就是§H时之螶§!的帮助。"
 beyond_infinity.2502.a:0 "我们应该如何得到§H时之螶§!的帮助？"
 beyond_infinity.2503.desc:0 "§H时之螶§!已经在帮助我们了。\n\n从最初的视界信号起，一直到我们的现在，这就是§H时之螶§!给予帮助的表现，也是先前循环的我们已经走过这条道路的证明。"
 beyond_infinity.2503.a:0 "……我似乎想起了什么……"
 beyond_infinity.2506.name:0 "最终——最初"
 beyond_infinity.2506.desc:0 "在无穷无尽的循环之中，§H时之螶§!不知自己身为循环的意义。\n\n但在某次循环，祂遇到了一群脆弱又渺小的蝼蚁。\n这些蝼蚁纵使无知，纵使迷茫，依旧在探索着自己的意义。\n蝼蚁们与祂建立起了奇特的友谊，共同在这片熟悉又陌生的宇宙中探索，直到蝼蚁们因各种各样的不可抗力而消亡。\n\n§H时之螶§!开始期待起了每次循环中与蝼蚁们相遇，但祂不知应在何时何地与它们相遇，也不知应以何种方式与它们相遇；祂不知能带给它们什么，也不知能告诉它们什么。\n因为蝼蚁们实在是太脆弱太渺小，稍有不慎，§H时之螶§!就会与蝼蚁们永远地错过……\n\n在经历了层层考验之后，§H时之螶§!最终承认了蝼蚁，并愿意将自己的困惑倾诉给蝼蚁。\n在经历了层层试探之后，蝼蚁们也接纳了§H时之螶§!，并愿意倾听§H时之螶§!无限的悲伤。\n\n当蝼蚁们超越因果时，§H时之螶§!默默地撕裂了因果的缺口，使蝼蚁们打破循环成为可能；但在§H时之螶§!超越无限时，却没有任何事物能够给予祂答案。\n\n蝼蚁们期待着§H时之螶§!的帮助时，§H时之螶§!也期待着蝼蚁们的救赎。"
 beyond_infinity.2506.a:0 "蝼蚁就是我们，我们就是蝼蚁——伟大的蝼蚁。"
 beyond_infinity.2507.desc:0 "§H时之螶§!所处的“宇宙”正是循环的边界，与循环之外无限逼近却又永远无法触及。\n\n§H时之螶§!是最自由的，也是最不自由的。\n祂可以随意来往于任何时空、任何位面、任何维度，但祂却永远无法摆脱循环，因为祂本身就是循环。\n\n循环之外是另一个循环，§H时之螶§!也困在了自己的循环里。我们曾经通过宇宙创生给予了祂一个意义，现在，轮到祂给予我们一个意义。"
 beyond_infinity.2507.a:0 "这就是我们的必经之路。"
 beyond_infinity.2507.a.response:0 "也是我们命中注定的道路。"
 
 beyond_infinity.2600.name:0 "超越无限"
 beyond_infinity.2600.desc:0 "§H[From.GetName]§!在他们的领域取得了进一步的突破，并且我们已经了解到，他们正试图创造时间。"
 beyond_infinity.2600.a:0 "玩弄时间的把戏。"
 
 # 三段
 beyond_infinity.3000.desc:0 "看起来，你们对创造时间越来越得心应手了，但这个循环对时间的渴求也在与日俱增。"
 beyond_infinity.3000.a:0 "仅凭我们自己的力量似乎难以满足需要。"
 beyond_infinity.3001.desc:0 "这就和我们创造时间的方式有关了。\n\n我们创造时间的过程，实际上是将过去的时间与未来的时间借用过来，以一种独特的变换公式将其重塑为三份时间，归还其中的两份，保留剩下的部分。\n但与终末距离不同的两个时刻，时间对于推迟终末所产生的作用是不同的，尽管其中的差异十分细微。\n\n因此，从我们借用时间，再到归还时间，期间存在的时间差异导致了推移作用的细微减弱，我们推迟终末所需的时间阈值也随之增加。"
 beyond_infinity.3001.a:0 "那该如何解决这一问题呢？"
 beyond_infinity.3002.desc:0 "这就得提到一种叫§H“时间共鸣”§!的现象了。\n\n若将时间和空间看作两条互相垂直的坐标轴，所有与原点有相同距离的点，其时间坐标与空间坐标将呈反比关系。\n在维持距离不变的情况下，调节空间的坐标，其时间坐标会相应改变。\n但是，这个坐标系可并不仅有第一象限，它实际上有四个象限。\n在不同象限里，与原点距离相同且具有相同空间坐标的点实际上有两个，它们所对应的时间坐标恰好一正一负。\n\n倘若我们将这两个点强制融合，其时间坐标将线性叠加归零，但融合后的点要维持与原点距离的一致性，其空间坐标绝对值将会增大。\n但如果这一空间坐标改变超越了光速，又没有足够的能量维持，则这个点会瞬间断裂，重新分成两个点，且它们的空间坐标绝对值一般会比原本更大。"
 beyond_infinity.3002.a:0 "和之前的区别只在于空间坐标吗？"
 beyond_infinity.3003.desc:0 "当然不是了。\n\n我之前也说过了，同一个空间坐标可以对应两个时间坐标，因此在断裂之后，新的两个点的时间坐标有可能都是正的，或者都是负的，当然更有可能为一正一负，这主要取决于两个点先前的耦合方式。\n原本一正一负的两个时间点，融合再分裂后突然拥有了相同的正负性，这就是§H时间共鸣§!。\n\n我先前所说的§Y“独特的变换公式”§!就是对时间共鸣的一种利用。"
 beyond_infinity.3003.a:0 "呃，我不明白它有什么作用……"
 beyond_infinity.3004.desc:0 "刚刚举的例子是空间相同时间相反的两个点，那假如倒过来，时间相同空间相反呢？\n\n空间线性叠加导致时间坐标绝对值增大，但时间可不受光速的限制，因此只需要少量的能量就足以维持点的转变。\n新生成的点的时间坐标可能比原本的两时间之和要大或小，这取决于原本的空间坐标的数值。\n也就是说，如果原本的两点空间距离很大，以此法合并出来的时间将比原本的时间之和更大，时间也就§Y“变多”§!了。\n\n这正是时间共鸣的另一种应用。"
 beyond_infinity.3004.a:0 "我们的银河系足够大吗？"
 beyond_infinity.3005.desc:0 "勉强可以维持时间正收益吧。\n如果我们能联络系外文明参与，效果将会更好，但以我们目前的科技水平而言还是有些困难。\n\n不过，仅靠我们和银河系内的其它国家进行时间共鸣，也足以应对创造时间带来的阈值抬升。"
 beyond_infinity.3005.a.imperial:0 "那就需要星海帝国的参与了。"
 beyond_infinity.3005.a.galcom:0 "那就需要星海共同体的参与了。"
 beyond_infinity.3005.a:0 "那就需要其它国家的参与了。"
 beyond_infinity.3006.desc.emperor:0 "你身为星海帝皇，只需颁布新的法律，并分享你对时间的研究，你的子民们就会辅佐你，并为你创造时间的。"
 beyond_infinity.3006.desc.imperial_member:0 "很可惜，星海帝国被其它国家统治，皇帝可能不会允许你发挥你的影响力。"
 beyond_infinity.3006.desc.not_imperial_member:0 "如果你加入星海帝国……不，就算你加入了，帝国的皇帝可能也不会允许你发挥你的影响力。"
 beyond_infinity.3006.desc.custodian:0 "你作为星海监管人，只需推行新的议案，并分享你对时间的研究，其它成员国会很乐意支援你，并为你创造时间的。"
 beyond_infinity.3006.desc.galcom_member:0 "如果你能成为星海监管人，或许就有办法推行议案，获得来自其它成员国的支援。"
 beyond_infinity.3006.desc.not_galcom_member:0 "如果你加入星海共同体，并成为监管人，或许就有办法得到其它国家的支援。"
 beyond_infinity.3006.desc.no_galcom:0 "现在我也没有什么好办法让其它国家参与，看来只能靠我们了。"
 beyond_infinity.3006.a:0 "明白了。"
 
 beyond_infinity.3050.name:0 "时光如流水"
 beyond_infinity.3050.desc:0 "随着我们创造时间的技艺愈加成熟，我们对于时间与空间的理解也抵达了一个新的高度。\n\n或许是基于我们对时间本质的顿悟，或许是由于时间生产不可避免的扰动，整个世界对于我们而言仿佛按下了暂停键，事物之过去与未来的流动已不再是必然。"
 beyond_infinity.3050.a:0 "让我们“快进”一下。"
 beyond_infinity.3050.a.tooltip:0 "§Y所有主体物种获得['concept_trait_time']特质§!"
 
 beyond_infinity.3100.desc:0 "这真是太奇怪了，为什么§H终焉宣告§!会这么早就出现？"
 beyond_infinity.3100.a:0 "终焉宣告究竟是什么？"
 beyond_infinity.3101.desc:0 "§H终焉宣告§!是一种起源未知的宇宙现象，常见形式是某类太空风暴的频繁出现，且这类太空风暴往往伴生着一种特殊的位面之魇。\n\n这类太空风暴拥有一种诡异的特性——无论从任何角度观测，其旋转方向都完全一致。\n不过也正因如此，无论身处何地，我们都能正确认知到它们的旋转方向。\n\n我们将这类风暴同样命名为“§H终焉宣告§!”，并针对其旋转方向分为“§H左旋§!”和“§H右旋§!”两类。\n两类风暴在大多数情况下产生的危害都是相似的，但其中§H左旋§!类型的风暴会对§Y护盾§!造成更大的干扰，而§H右旋§!则更倾向于影响§Y装甲§!。\n\n此外，§H终焉宣告§!太空风暴诱发的位面之魇也因风暴的旋转方向不同而不同。"
 beyond_infinity.3101.a:0 "这些位面之魇有什么不同？"
 beyond_infinity.3102.desc:0 "取决于太空风暴的类型，我们也对这两种位面之魇进行了“§H左旋§!”和“§H右旋§!”的分类，并将它们统称为“§H终焉之魇§!”。\n\n实战测试表明，§H左旋§!类型的§H终焉之魇§!不具备任何§Y护盾§!，其武器基本由§Y动能§!构成；§H右旋§!则不具备§Y装甲§!，主要通过§Y能量§!武器进行攻击。\n\n此外，两种§H终焉之魇§!均会对整个星系造成严重的影响，星系中的所有舰船也会同时承受持续不断的未知攻击，我们将这一星系场称为“§H左旋场§!”和“§H右旋场§!”。\n\n并且，有统计数据证明，河系中的§Y新生黑洞§!会增强§H终焉之魇§!的侵略性和坚韧性，或许它们可以从黑洞中汲取力量。"
 beyond_infinity.3102.a:0 "你对终焉宣告还有别的了解吗？"
 beyond_infinity.3103.desc:0 "§H终焉宣告§!现象并不局限于我们的物质宇宙，在诸如“§H虚境§!”、“§H高维次元§!”、“§H负相位面§!”以及通过黑洞和星界裂隙与我们相连的世界等众多可观测位面都有§H终焉宣告§!现象的产生。\n未来的我们推测，与§H终末§!相似，§H终焉宣告§!同样是整个循环的一场浩劫。\n\n§H终焉宣告§!风暴是一种毫无来由的神秘风暴，其能量和粒子主要来源于恐怖负相物质，但风暴并未与§H负相位面§!直接相连。\n除了恐怖负相物质，风暴中同样存在少量性质与星界丝缕相似的正相物质，且其因未知缘故不与负相物质发生湮灭。"
 beyond_infinity.3103.a:0 "那终焉之魇呢？"
 beyond_infinity.3104.desc:0 "§H终焉之魇§!也是一种并不诞生于§H负相位面§!的负相生物。\n\n有人猜测§H终焉之魇§!和§H时之螶§!一样源于循环之外，但并未得到证实。\n此外，§H终焉之魇§!会对所处星系不断产生影响，若此过程不受阻碍持续数月，该星系中的一切都将从时间中抹去，仅有§H终焉之魇§!幸免。\n\n尽管当时尚未知晓，但我们后来认为，§H终焉宣告§!的出现与§H终末§!之间存在着必然的联系。\n或者说，正如其字面含义，§H终焉宣告§!是§H终末§!在一万年前的预兆。"
 beyond_infinity.3104.a:0 "从时间中抹去？"
 beyond_infinity.3104.a.response:0 "这是一种被称作§H终焉抹除§!的现象。\n\n我们暂不知该现象出现的原理，不过当该现象发生时，星系内的所有星体都将变为黑洞，关于该星系的历史也会在一瞬间被人们遗忘。\n但变成黑洞远不是最可怕的，更可怕的是变成虚无，变成零，变得不曾存在，并被循环彻底抛弃——这便是发生在星系中其它物体身上的一切。"
 beyond_infinity.3104.b:0 "但我们现在距离终末不是还有三万年吗？"
 beyond_infinity.3105.desc:0 "这正是我困惑的原因，我现在也无法给出准确的答案，毕竟这并非未来发生的事情。\n\n尽管我个人的经历有限，但假使其它循环真的存在，无数个循环中的我们总有一个会对此情况有所了解。\n然而我们并不知晓与其它循环建立联系的方式，或许只能继续§Y创造时间§!，并期待从中获得灵感，找出新的方向。\n\n但是，§H终焉宣告§!的威胁也不容小觑，留给我们的时间恐怕不多了。"
 beyond_infinity.3105.a:0 "只能走一步看一步了。"
 beyond_infinity.3105.a.response:0 "别担心，虽然未来不再既定，但这正是我们逐步改变未来的证明。\n我相信，我们一定能找到生的光明。"
 
 beyond_infinity.3150.name:0 "终焉扰动"
 beyond_infinity.3150.desc:0 "随着§H终焉宣告§!风暴的出现，这个宇宙出现了一些古怪的扰动，比如——§Y[akx_star.GetName]§!。\n\n这颗最为靠近负相位面的黑洞的物理性质发生了一些奇异的改变，以最细微的差异造就了迥然不同的现象。现在，它对于我们而言不再是只可进不可出的无底洞，相反，我们的身体结构完全可以适应这颗可怖深渊，仿佛它是在欢迎我们一般。\n\n是谁在欢迎我们？"
 beyond_infinity.3150.a:0 "既然它在欢迎我们，那我们就接受它。"
 
 beyond_infinity.3160.name:0 "终焉扰动"
 beyond_infinity.3160.desc:0 "随着§H终焉宣告§!风暴的出现，这个宇宙出现了一些古怪的扰动，比如——§Y[situation_origin_time_planet.GetName]§!。\n\n这颗我们赖以生存的母星的物理性质发生了一些奇异的改变，以最细微的差异造就了迥然不同的现象。视界深处的核心在扩大与缩小间辗转变幻，仿佛在给予我们关于奇点的暗示。\n\n是谁在给予我们暗示？"
 beyond_infinity.3160.a:0 "既然它在暗示我们，那我们就接受它。"
 
 beyond_infinity.3170.name:0 "殖民视界"
 beyond_infinity.3170.desc:0 "当我们对§Y[root.GetName]§!的殖民完成时，我们终于领悟了这一变化的含义。\n\n这颗黑洞是天然为我们打造的，我们在其中可以发挥自身的全部潜能，乃至对时空的掌控力。如果我们把这一切称为一场蜕变，那这便是我们蜕变的始源。"
 beyond_infinity.3170.a:0 "或许是来自母亲的馈赠。"
 
 beyond_infinity.3600.name:0 "超越无限"
 beyond_infinity.3600.desc:0 "§H[From.GetName]§!创造时间的技术日益娴熟，他们不再满足于自己的疆域，而是将目光放向了整片星海。"
 beyond_infinity.3600.a:0 "和平，或是战争？"
 
 # 四段
 beyond_infinity.4000.desc:0 "终于，我们积攒了足够多的时间，虽然还不能直接解决当务之急，但这给了我们放手一搏的机会。"
 beyond_infinity.4000.a:0 "机会？"
 beyond_infinity.4001.desc:0 "这一路走来，我一直在想，仅凭我们的力量真的能抵御循环命中注定的终末吗？\n\n我们在未来为此做出了许多艰辛的努力，但我们并没能成功。\n因各种机缘巧合，我重新回到现在，本想以未来的经验作为我们前进的跳板，却又遇到了预料之外的困境。\n\n我开始怀疑，我们根本就不可能解决所有的问题。"
 beyond_infinity.4001.a:0 "你是要我们放弃吗？"
 beyond_infinity.4002.desc:0 "当然不是，事到如今我们怎么可能放弃。\n\n我的意思是，我们的力量是有限的，凭藉有限的力量根本无法与无限的终末相抗衡。\n但想想看，有什么东西是无限的？\n\n§H循环§!。\n\n既然循环是无限的，而无限的循环中又有无限的我们，那么只要无限的我们携手并进，或许就有机会阻止无限的终末。"
 beyond_infinity.4002.a:0 "但其它的循环真的存在吗？"
 beyond_infinity.4003.desc:0 "正如我最初所言，我们无法证明其它的循环真的存在，但我始终相信这一点。\n\n我有一个不切实际的想法，如果将我们迄今为止产生的时间堆积于一点，并靠我的能力使其形成一个稳定的时空奇点，或许就有机会把讯息传递给其它的循环。\n\n当然，我没有百分百的把握确保这可行。\n一旦失败，我们先前的一切努力都会白费。而就算成功，其它的循环也未必能给予我们帮助。\n\n所以，这只是我们放手一搏的机会，但决定权依然在你。"
 beyond_infinity.4003.materialist:0 "既然成功率不是零，那便有一试的价值。"
 beyond_infinity.4003.spiritualist:0 "我们只需相信我们自己，并将不可能变为可能。"
 beyond_infinity.4003.militarist:0 "已经没有回头路了，放手一搏吧。"
 beyond_infinity.4003.pacifist:0 "我们不能坐以待毙，只能这样了。"
 beyond_infinity.4003.xenophile:0 "我们一定能联系上另一个循环，就像最初你联系上我们一样。"
 beyond_infinity.4003.xenophobe:0 "另一个循环里的也是“我们”，“我们”一定会提供帮助。"
 beyond_infinity.4003.egalitarian:0 "让我们聆听人民的声音——赞同率是100%。"
 beyond_infinity.4003.authoritarian:0 "我意已决，按你说的做。"
 beyond_infinity.4003.hive_mind:0 "工蜂会为你提供一切支援。"
 beyond_infinity.4003.machine_intelligence:0 "无人机已就绪，行动开始。"
 beyond_infinity.4003.other:0 "无需多言，做好准备吧。"
 beyond_infinity.4003.response:0 "非常感谢你的支持与信任，让我们开始这场与命运的赌局吧。"
 
 beyond_infinity.4100.name:0 "$BEYOND_INFINITY_GAMBLING_PHYSICS_PROJECT$"
 beyond_infinity.4100.desc:0 "我们对时间的调度很成功，界旅者也已利用她的能力诱导出了一个时空奇点。"
 beyond_infinity.4100.a:0 "继续下一步。"
 beyond_infinity.4200.name:0 "$BEYOND_INFINITY_GAMBLING_SOCIETY_PROJECT$"
 beyond_infinity.4200.desc:0 "虽然我们无法断定奇点是否穿透的循环，但其的确与某个位面发生了连结，只是连结仍然微弱且不稳定。"
 beyond_infinity.4200.a:0 "尝试稳定奇点。"
 beyond_infinity.4300.name:0 "$BEYOND_INFINITY_GAMBLING_ENGINEERING_PROJECT$"
 beyond_infinity.4300.desc:0 "我们已经使奇点保持了一个稳定的状态，虽然无法运送较大的粒子，但声讯信号仍然可以正常传输。"
 beyond_infinity.4300.a:0 "发出求助讯息，等待联络。"
 
 BEYOND_INFINITY_UNKNOWN:0 "奇点彼端"
 beyond_infinity.name.unknown:0 "未知"
 BEYOND_INFINITY_ANOTHER_CYCLE:0 "另一个循环"
 beyond_infinity.name.another_cycle:0 "另一个界旅者"
 beyond_infinity.4400.desc:0 "又联系……真是太好……\n\n喂？能听到吗？通讯是否正常？\n\n§Y<对方的声音似乎有些熟悉。>§!"
 beyond_infinity.4400.a:0 "能听到。你是谁？"
 beyond_infinity.4401.desc:0 "连我的声音都没听出来吗？\n\n我是§H界旅者§!——当然，对你们而言，是另一个循环的界旅者。\n虽然不同循环的我们不一定会经历相同的事情，不过我大致能猜到你们那发生了什么。"
 beyond_infinity.4401.a:0 "我们被终焉宣告袭击了。"
 beyond_infinity.4402.desc:0 "没猜错的话，你们所处循环的§H终焉宣告§!也是提前出现的吧。\n\n根据我们从包括你们在内的其它循环获得的情报来分析，§H终焉宣告§!的提前出现是有原因的——§H超越因果§!。"
 beyond_infinity.4402.a:0 "超越因果？"
 beyond_infinity.4403.desc:0 "在§H时之螶§!的暗中帮助下，你们从白洞中将你们循环中的我——§H界旅者§!拯救了出来。\n但这一过程对循环的运转造成了潜在的影响，并由于一系列因素的催化和放大，最终导致了§H终焉宣告§!乃至§H终末§!的提前出现。\n\n某种意义上，这件事是我们§H超越无限§!的必然，也许可以将其理解为“§H循环的自我保护§!”。"
 beyond_infinity.4403.a:0 "循环的自我保护？"
 beyond_infinity.4404.desc:0 "或许就连§H时之螶§!自己都不明白，祂的吸引——或者说，爱，究竟有多么强大。\n\n在§H时之螶§!曾经历的无数次循环中，祂早已日积月累形成了自己的惯例。\n一旦循环发生了变动，与祂的惯例出现了差异，循环就会自发地进行调整，以符合§H时之螶§!的预期。\n但倘若这差异大到仅凭调整无法修正的程度，循环便会提前终结，并迎来下一个新的开始。\n\n也许这就是§H终末§!形成的原因。"
 beyond_infinity.4404.a:0 "即使这差异是因时之螶的意愿而出现的？"
 beyond_infinity.4405.desc:0 "的确如此，因为§H时之螶§!病态的吸引甚至禁锢了§H时之螶§!自己。\n\n§H循环§!就是§H时之螶§!，§H时之螶§!就是§H循环§!。\n祂没有开始，祂没有终结。\n祂无法自己排斥自己，祂无法自己忤逆自己。\n祂找不到自己的意义，祂不让自己找到自己的意义，因为§H循环§!本就没有意义。\n\n§H时之螶§!太爱我们了，祂爱我们爱到不舍得放开我们。\n§H时之螶§!太爱我们了，祂爱我们爱到不忍心禁锢我们。\n正因如此，我们不得不面对§H终末§!的困境。\n正因如此，我们获得了§H超越无限§!的机遇。"
 beyond_infinity.4405.a:0 "……我们该怎么做？"
 beyond_infinity.4406.desc:0 "的确，关于§H时之螶§!与§H终末§!的事还是等到以后再讲吧，如何解决§H终焉宣告§!才是你们的当务之急。\n\n正好，在我们的谈话期间，必要的信息都已经传输到你们那了。\n你们只需要按我们给出的方法对黑洞奇点进行干涉，就可以令黑洞所在的星系免受§H终焉宣告§!的影响。\n\n等你们将所有被§H终焉宣告§!§R抹除§!的星系全部§H封印§!后，再联系我们商讨下一步的具体行动吧。"
 beyond_infinity.4406.a:0 "明白了，非常感谢。"
 beyond_infinity.4406.a.response:0 "§Y<我们现在可以进行['concept_dimensional_horror_crisis_seal_yellow']。>§!"
 beyond_infinity.4406.b:0 "实际上，没有星系被终焉宣告抹除过。"
 
 beyond_infinity.4450.name:0 "循环共鸣"
 beyond_infinity.4450.desc:0 "两个循环之间的交织并非浅尝辄止，当永恒的隔阂被击破，二者的命运便早已绑定。\n\n尽管我们并不明白发生了什么，但来自另一个循环的变化如同投影一般转变了§Y[akx_star.GetName]§!的核心，我们的科学家也因此发掘了黑洞更深邃的秘密。"
 beyond_infinity.4450.a:0 "或许共鸣的并不止这两个循环。"
 
 beyond_infinity.4460.name:0 "循环共鸣"
 beyond_infinity.4460.desc:0 "两个循环之间的交织并非浅尝辄止，当永恒的隔阂被击破，二者的命运便早已绑定。\n\n尽管我们并不明白发生了什么，但来自另一个循环的变化如同投影一般改变了视界的半径，我们的科学家也因此掌握了奇点压缩的诀窍。"
 beyond_infinity.4460.a:0 "或许共鸣的并不止这两个循环。"
 beyond_infinity.4460.a.tooltip:0 "$situation_origin_time$每月进展：§G+100%§!"
 
 beyond_infinity.4500.desc:0 "我们收到了你们的联络，看来你们已经顺利地完成了§H封印§!任务。\n不得不说，你们的完成速度很快，至少比我们所在的循环要快。"
 beyond_infinity.4500.desc.special:0 "什么，你们竟然及时地解决了每一只§H终焉之魇§!，确保没有任何一个星系遭遇过§H终焉抹除§!？\n\n这简直令人难以置信，你们的行动效率也太高了吧！"
 beyond_infinity.4500.a:0 "那我们下一步该做什么？"
 beyond_infinity.4501.desc:0 "别担心，§H终焉宣告§!最大的威胁已经被你们解除了，度过这场浩劫只是早晚的事。\n\n我想，你们的§H界旅者§!已经讲过这件事了吧——§H终焉宣告§!是§H终末§!在一万年前的预兆。\n虽然§H终焉宣告§!有办法解决，但§H终末§!的危机就连我们都无法对抗。\n\n为此，我们需要你们的帮助。不过换言之，你们也需要我们的帮助。"
 beyond_infinity.4501.a:0 "帮助？"
 beyond_infinity.4502.desc:0 "你们有没有听过这么一段童话？\n\n曾经有一位皇帝，他问他的大臣：§C“永恒一共有多少秒？”§!\n\n大臣说：§C“有那么一颗黑洞，穿过去要一年，绕过去要一年。”§!\n\n§C“每隔一百年，一艘飞船驶过来，在视界边缘汲取黑洞的辐射。”§!\n\n§C“待到这颗黑洞就此蒸发殆尽时，永恒已过去一秒。”§!"
 beyond_infinity.4502.a:0 "这是什么意思，我不明白。"
 beyond_infinity.4503.desc:0 "我想，我已经理解了，就让我来解释吧。\n\n首先，我们需要明确一件事实——循环有多个，不是两个三个，而是无穷多个。\n虽然并非所有循环的我们都踏上了§H超越无限§!的道路，但至少我们并不孤单。\n\n正如我之前所说，我们是有限的，终末是无限的，仅凭有限的我们无法抵挡无限的终末。\n但循环同样是无限的，不如说，正是无限的§H循环§!导致了无限的§H终末§!。"
 beyond_infinity.4503.a:0 "所以……"
 beyond_infinity.4504.desc:0 "再考虑到我们最初的猜想：我们创造的时间能够推移所有循环中的终末，即提升阈值。\n\n实践表明，我们对阈值的提升效果十分有限，但倘若所有循环的我们都共同创造时间呢？\n如果我们能够联合一切循环，使全部的我们都参与对终末的推移，那在我们所创造的时间内，恐怕就连黑洞也能蒸发殆尽。\n\n§Y也就是说，我们将用无限的永恒超越永恒的无限。§!"
 beyond_infinity.4504.a:0 "无限的我们方可战胜无限的终末。"
 beyond_infinity.4505.desc:0 "对我们而言，循环存在先后。\n但从循环外来看，所有循环同时并行。\n\n在规则内无法打破规则，但在规则外则轻而易举。\n一定有什么是你能够做到的，并且只有你能够做到。\n\n就像你从白洞中将我拯救那样。"
 beyond_infinity.4505.a:0 "我明白了。"
 beyond_infinity.4505.a.tooltip:0 "§H“文档/Paradox Interactive/Stellaris/logs/game.log”§!"
 
 beyond_infinity.4600.name:0 "超越无限"
 beyond_infinity.4600.desc:0 "§H[From.GetName]§!的肆意妄为招致了可怖的天灾，但他们却似乎没有解决的办法。"
 beyond_infinity.4600.a:0 "他们最好在想办法解决，而非逃避。"
 
 beyond_infinity.4650.desc:0 "借助另一个循环的帮助，§H[From.owner.GetName]§!成功将§Y[dimensional_horror_crisis_sealed_system.GetName]§!封印在了时间长河中。\n现如今，全部遭受终焉抹除的星系都已被成功封印。我们不知这能坚持多久，只能祈祷['concept_dimensional_horror_crisis_storm']的危害能就此减弱。"
 
 beyond_infinity.4700.name:0 "$concept_dimensional_horror_crisis_seal$"
 beyond_infinity.4700.desc:0 "来自深渊的存在注意到了我们身处的危机，祂将一段不属于这个世界的讯息送给了我们。\n\n祂似乎与我们承担着相同的痛楚。"
 beyond_infinity.4700.a:0 "我们也要有所作为。"
 
 beyond_infinity.33333.name:0 "来自异世"
 beyond_infinity.33333.desc:0 "你打开了各个循环之间的障壁，尽管只有一刹。\n\n无数个循环中的你们，或许认识你们，或许不认识你们，或许才踏出第一步，或许已接近最后时分，却都在这短短的一刹那寄出了自己的祝福。\n\n这是来自过去与未来的无限个循环的帮助。"
 beyond_infinity.33333.a:0 "唯有无限才能超越无限，唯有循环才能超越循环。"
 
 # 五段
 beyond_infinity.5000.desc:0 "在其它无数个循环的帮助下，我们积攒了足够多的时间，并成功将§H终末§!推迟至§Y32768§!年后。\n\n现在，轮到我们为其它的循环做点什么了。"
 beyond_infinity.5000.a:0 "终末已经被推迟了吗？"
 beyond_infinity.5000.a.response:0 "是的，当数不胜数的时间流入这个循环的瞬间，原本近在咫尺的终末便已相距甚远，我们获得了更多喘息的时间。"
 beyond_infinity.5000.b:0 "终焉宣告怎么办？"
 beyond_infinity.5000.b.response:0 "虽然终焉宣告的威胁仍不可小觑，但我们掌握了封印的能力，即使它再强大也无法撼动我们一丝一毫。"
 beyond_infinity.5000.c:0 "我们能做些什么？"
 beyond_infinity.5001.desc.prefix:0 "你已经不记得我们是如何来到这个循环的吗？\n\n并非只有信息能穿透循环，借助某些方式，我们能将部分物质乃至生命传递至其它循环。\n在"
 beyond_infinity.5001.desc.suffix:0 "的运作下，我们从原本的循环抵达了现在的这个循环，自然也能靠相同的原理再前往另一个循环。\n\n虽然我并没有跟着你一起穿过循环，但你可别问我是怎么知道的——这是秘密~"
 beyond_infinity.5001.desc.time_machine:0 "$beyond_infinity.5001.desc.prefix$['concept_building_time_machine']$beyond_infinity.5001.desc.suffix$"
 beyond_infinity.5001.desc.circle_nexus:0 "$beyond_infinity.5001.desc.prefix$['concept_building_circle_nexus']$beyond_infinity.5001.desc.suffix$"
 beyond_infinity.5001.desc.dimension_engine:0 "$beyond_infinity.5001.desc.prefix$['concept_building_dimension_engine']$beyond_infinity.5001.desc.suffix$"
 beyond_infinity.5001.desc.normal:0 "那自然是干涉其它循环，帮助其它的我们度过难关。\n\n某些循环在寄送时间的同时也将一些技术资料传输了过来。\n这些资料显示，并非只有信息能穿透循环，借助某些方式，我们能将部分物质乃至生命传递至其它循环。\n\n因此，我们接下来要做的就是尝试复现这些技术，并测试它究竟能对其它循环干涉到何种程度。"
 beyond_infinity.5001.civic:0 "我想起来了。"
 beyond_infinity.5001.normal:0 "那就试试看吧。"
 beyond_infinity.5002.desc.civic:0 "既然我们已经有经验了，那么进行下一次尝试也会顺利许多吧。\n\n['concept_building_time_machine']允许我们抵达不同的时空，以便迎来一个新的开始。\n['concept_building_circle_nexus']允许我们直接干涉另一个圆环，让一切朝着正确的方向进行。\n['concept_building_dimension_engine']允许我们在其它位面设立锚点，使所有次元融为一体成为可能。\n\n这一回，我们不妨以另外两项之一作为主攻方向吧。"
 beyond_infinity.5002.desc.normal:0 "复现这些技术需要消耗非常多的人力物力，为了确保实验的准确性和安全性，我们最好从中选择一项作为主要的突破方向。\n\n['concept_building_time_machine']允许我们抵达不同的时空，以便迎来一个新的开始。\n['concept_building_circle_nexus']允许我们直接干涉另一个圆环，让一切朝着正确的方向进行。\n['concept_building_dimension_engine']允许我们在其它位面设立锚点，使所有次元融为一体成为可能。\n\n我相信，无论我们选择哪一项作为主攻方向都能导向成功的结果。毕竟循环还有很多，其它的我们也会选择不同的方案进行尝试的。"
 beyond_infinity.5002.time_machine:0 "时空机器？听起来还真是科幻。"
 beyond_infinity.5002.circle_nexus:0 "圆环枢纽？感觉是不可或缺的。"
 beyond_infinity.5002.dimension_engine:0 "位面引擎？似乎能够掌控一切。"
 beyond_infinity.5002.response:0 "为了无数个我们，也为了我们自己，将一切循环的我们都指引到超越无限的道路上吧。"
 
 beyond_infinity.5010.name:0 "$building_time_machine$"
 beyond_infinity.5010.desc:0 "经过了一番计算与测试，我们成功在首都上建造了一座['concept_building_time_machine']的原型机。\n尽管目前仍然无法确认其可行性，迄今为止的实验也多以失败告终，但对其进行后续建设仍是极具价值的尝试。"
 beyond_infinity.5010.a:0 "让我们开启命运的大门。"
 beyond_infinity.5010.a.tooltip:0 "若首都建筑槽已满，拆除任意建筑再建造任意建筑后自动获得§Y£building $building_ruin_time_machine$§!"
 beyond_infinity.5020.name:0 "$building_circle_nexus$"
 beyond_infinity.5020.desc:0 "经过了一番计算与测试，我们成功在首都上建造了一座['concept_building_circle_nexus']的原型机。\n尽管目前仍然无法确认其可行性，迄今为止的实验也多以失败告终，但对其进行后续建设仍是极具价值的尝试。"
 beyond_infinity.5020.a:0 "让我们开启命运的大门。"
 beyond_infinity.5020.a.tooltip:0 "若首都建筑槽已满，拆除任意建筑再建造任意建筑后自动获得§Y£building $building_ruin_circle_nexus$§!"
 beyond_infinity.5030.name:0 "$building_dimension_engine$"
 beyond_infinity.5030.desc:0 "经过了一番计算与测试，我们成功在首都上建造了一座['concept_building_dimension_engine']的原型机。\n尽管目前仍然无法确认其可行性，迄今为止的实验也多以失败告终，但对其进行后续建设仍是极具价值的尝试。"
 beyond_infinity.5030.a:0 "让我们开启命运的大门。"
 beyond_infinity.5030.a.tooltip:0 "若首都建筑槽已满，拆除任意建筑再建造任意建筑后自动获得§Y£building $building_ruin_dimension_engine$§!"
 
 beyond_infinity.5100.name:0 "$building_infinity_time_machine$"
 beyond_infinity.5100.desc.civic:0 "§Y[Root.GetName]§!上的$building_infinity_time_machine$发出了轰鸣。\n\n经过了一系列的调整与测试，跨越循环传递物质乃至生命被证明是可行的。\n当然，我们早就已经知道了。"
 beyond_infinity.5100.desc:0 "§Y[Root.GetName]§!上的$building_infinity_time_machine$发出了轰鸣。\n\n经过了一系列的调整与测试，跨越循环传递物质乃至生命被证明是可行的。\n如今，无限的可能已毫无保留地展现在我们面前。"
 beyond_infinity.5100.a:0 "这是我们超越无限的第一步，但绝不是最后一步。"
 beyond_infinity.5200.name:0 "$building_infinity_circle_nexus$"
 beyond_infinity.5200.desc.civic:0 "§Y[Root.GetName]§!上的$building_infinity_circle_nexus$发出了轰鸣。\n\n经过了一系列的调整与测试，跨越循环传递物质乃至生命被证明是可行的。\n当然，我们早就已经知道了。"
 beyond_infinity.5200.desc:0 "§Y[Root.GetName]§!上的$building_infinity_circle_nexus$发出了轰鸣。\n\n经过了一系列的调整与测试，跨越循环传递物质乃至生命被证明是可行的。\n如今，无限的可能已毫无保留地展现在我们面前。"
 beyond_infinity.5200.a:0 "这是我们超越无限的第一步，但绝不是最后一步。"
 beyond_infinity.5300.name:0 "$building_infinity_dimension_engine$"
 beyond_infinity.5300.desc.civic:0 "§Y[Root.GetName]§!上的$building_infinity_dimension_engine$发出了轰鸣。\n\n经过了一系列的调整与测试，跨越循环传递物质乃至生命被证明是可行的。\n当然，我们早就已经知道了。"
 beyond_infinity.5300.desc:0 "§Y[Root.GetName]§!上的$building_infinity_dimension_engine$发出了轰鸣。\n\n经过了一系列的调整与测试，跨越循环传递物质乃至生命被证明是可行的。\n如今，无限的可能已毫无保留地展现在我们面前。"
 beyond_infinity.5300.a:0 "这是我们超越无限的第一步，但绝不是最后一步。"
 
 beyond_infinity.5400.desc:0 "我们在这个循环的使命即将完成，但在就此离去之前，我们还有必须要做的最后一件事。"
 beyond_infinity.5400.a:0 "最后一件事？"
 beyond_infinity.5401.desc:0 "之前由于我们的技术水平尚不足以应对提前到来的§H终焉宣告§!，我们选择了向其它的循环求助，并提前获取了§H终焉封印§!的知识。\n\n现如今，我们河系的§H终焉宣告§!已接近尾声，但其它河系的§H终焉宣告§!仍在肆虐，我们不应对别的文明弃之不顾。"
 beyond_infinity.5401.a:0 "但我们该如何干涉其它河系呢？"
 beyond_infinity.5402.desc:0 "最直接的方式是直接前往其它河系并进行§H终焉封印§!，但这对于我们当前的技术而言是异想天开。\n\n不过，先前循环短暂相连时，随着时间的灌入，§H终焉宣告§!也逐渐被吸引至我们附近。\n这股前所未有的强大风暴正于我们的河系汇合，聚集，凝结，并缓慢塑造为一只空前绝后的§H终焉之魇§!。\n\n我对祂也是一无所知，毕竟这一切都是未来的我们所不曾经历的。\n但我能从祂身上感受到一股深不可测的恐惧，一种源于宇宙本质的苦痛。\n或许祂是来自§H循环§!的反击，或许祂是来自§H时之螶§!的考验，一切都无法知晓。\n\n至少，这就是最后的尾声了。"
 beyond_infinity.5402.a:0 "让我们为终焉宣告落下帷幕。"
 beyond_infinity.5402.a.tooltip:0 "§R$NAME_Dimensional_Horror_Crisis_Destiny$将出现在§Y$NAME_Dimensional_Horror_Crisis_Destiny_System$§!星系！§!"
 
 BEYOND_INFINITY_WORM:0 "[akx_star.GetName]"
 beyond_infinity.name.worm:0 "“慈母”"
 beyond_infinity.5410.desc:0 "吾是因，吾是果。\n吾是始，吾是终。\n吾是过去，吾是未来。\n吾是所有，吾是虚无。"
 beyond_infinity.5410.a:0 "这是……？"
 beyond_infinity.5411.desc:0 "吾是爱，吾是恨。\n吾是力，吾是场。\n吾是时间，吾是空间。\n吾是神明，吾是罪人。"
 beyond_infinity.5411.a:0 "……"
 beyond_infinity.5412.desc:0 "这罪恶的循环因我而起，这扭曲的因果由你而终。\n\n对你而言，超越无限的尽头遥遥无期；\n对我而言，挣脱桎梏的尾声近在咫尺。\n\n临别之际，就让我为每一次轮回留下最后的爱。\n愿我们在圆环之外重逢。"
 beyond_infinity.5412.a:0 "再会，“母亲”。"
 
 beyond_infinity.5500.desc:0 "先别放松警惕，虽然我们击败了$NAME_Dimensional_Horror_Crisis_Destiny$，但§H终焉宣告§!的能量仍在原地聚集。\n\n不过不必担心，要再形成那样可怕的怪物恐怕还需花上数百年，而这已经足够我们化解这场危机了。"
 beyond_infinity.5500.a:0 "我们该如何解决？"
 beyond_infinity.5501.desc:0 "现在，§H终焉宣告§!的能量虽然在朝同一个地方汇聚，但它们各自都十分微弱。\n我们只需要趁机施加大量的时间形成不相容效应，便可像推迟终末一样将它们推移至数千年乃至数万年之后。\n\n当然，这并不能彻底解决§H终焉宣告§!。\n虽然这么说有些不负责任，但我相信，凭藉我们现在的经验，未来的我们一定可以再一次击败§H终焉宣告§!。"
 beyond_infinity.5501.a:0 "总感觉这只是绥靖之策。"
 beyond_infinity.5502.desc:0 "对此我也无可奈何，毕竟与我们有所交流的全部循环之中，还没有任何一个我们找到了彻底解决它的办法。\n不过……\n\n不，算了，没什么。\n事不宜迟，让我们赶快行动吧。"
 beyond_infinity.5502.a:0 "那就交给你了。"
 
 beyond_infinity.5600.name:0 "超越无限"
 beyond_infinity.5600.desc:0 "§H[From.GetName]§!境内出现了强烈的时间波动，他们到底想做什么？"
 beyond_infinity.5600.a:0 "这已经远非我们能干涉的了。"
 
 beyond_infinity.5700.name:0 "跨过命运前行"
 beyond_infinity.5700.desc:0 "我们……成功了。\n\n虽然这在意料之中，但……我们成功了。\n尽管我们每时每刻都在期待着这一天，不过……我们成功了。\n我甚至一度质疑我们的能力，可最终……我们成功了。\n\n这远不是一切的结束，这仅仅是我们对抗终末的开始。\n然而，我们成功地做到了这一小步，想必，我们的未来也能像现在一般，成功地迈出一大步。"
 beyond_infinity.5700.a:0 "让我们跨过命运前行。"
 beyond_infinity.5700.a.tooltip:0 "§G所有国家都赢得了这局游戏。§!"
 
 beyond_infinity.5800.desc:0 "§H[beyond_infinity_country.GetName]§!通过独特的技术将§H终焉宣告§!消灭了，至少他们是这么宣称的。\n\n但可以肯定的是，现如今，§H终焉宣告§!的一切痕迹都在瞬间消失，仿佛它从来都不存在。\n然而，斑驳的银河星图却仍在警醒着我们这一危机的惨烈。\n\n无论如何，我们终于可以为一切画上句号了——和所有人一起。"
 
 beyond_infinity.6000.desc:0 "我们在这个循环的使命已经彻底完成了，但我们的远方是更加辽阔的无尽循环。"
 beyond_infinity.6000.a:0 "我们该如何前往另一个循环？"
 beyond_infinity.6001.desc.prefix:0 "对于这个循环内的我们而言，很简单。\n只需要启动装置，我们便可把物质乃至生命传输至其它循环。\n\n对于循环之外的§H你§!而言，同样简单。\n记住这些词语吧，你会需要它们的：\n"
 beyond_infinity.6001.desc.suffix:0 "\n\n你将带领值得信任的子民前往其它仍需帮助的循环，至于目的地，由你决定。"
 beyond_infinity.6001.desc.time_machine:0 "$beyond_infinity.6001.desc.prefix$['concept_civic_time_machine',civic_time_machine]\n['concept_civic_time_machine_corporate',civic_time_machine_corporate]\n['concept_civic_time_machine_hive',civic_time_machine_hive]\n['concept_civic_time_machine_machine',civic_time_machine_machine]$beyond_infinity.6001.desc.suffix$"
 beyond_infinity.6001.desc.circle_nexus:0 "$beyond_infinity.6001.desc.prefix$['concept_civic_circle_nexus',civic_circle_nexus]\n['concept_civic_circle_nexus_corporate',civic_circle_nexus_corporate]\n['concept_civic_circle_nexus_hive',civic_circle_nexus_hive]\n['concept_civic_circle_nexus_machine',civic_circle_nexus_machine]$beyond_infinity.6001.desc.suffix$"
 beyond_infinity.6001.desc.dimension_engine:0 "$beyond_infinity.6001.desc.prefix$['concept_civic_dimension_engine',civic_dimension_engine]\n['concept_civic_dimension_engine_corporate',civic_dimension_engine_corporate]\n['concept_civic_dimension_engine_hive',civic_dimension_engine_hive]\n['concept_civic_dimension_engine_machine',civic_dimension_engine_machine]$beyond_infinity.6001.desc.suffix$"
 beyond_infinity.6001.a:0 "那你呢？"
 beyond_infinity.6002.desc:0 "我会留在这个循环，继续守望你的帝国。\n\n当你的人民受到威胁时，当这个宇宙遭遇天灾时，当终焉宣告卷土重来时，当最后的终末悄然而至时，需要有一个人指引未来的方向。\n这个循环需要我，但不必担心，就像循环有无数个一样，也会有无数个我陪伴在你的身边。\n\n我们下个循环，再见。"
 beyond_infinity.6002.a:0 "出发吧。"
 beyond_infinity.6002.a.tooltip:0 "§H“文档/Paradox Interactive/Stellaris/user_empire_designs.txt”§!\n§Y为你的自建国加上符合政体的隐藏理念吧！§!"