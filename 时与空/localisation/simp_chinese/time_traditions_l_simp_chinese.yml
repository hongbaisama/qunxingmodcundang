 tr_hope_2:0 "圣仆"
 tr_hope_2_delayed:0 "“圆环——奇异之环，时间之环，饥饿之环。”"
 
 tr_hope_3:0 "时螶之界"
 tr_hope_3_delayed:0 "“将行之事，必为已行。”"
 
 tr_hope_4:0 "命中相会"
 tr_hope_4_delayed:0 "“圆环是始也是终。”"
 
 tr_hope_5:0 "信使"
 tr_hope_5_delayed:0 "“已行之事，终将再行。”"
 
