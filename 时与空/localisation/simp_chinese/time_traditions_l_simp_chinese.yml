 ################################################################
 # 负相
 ################################################################
 
 tradition_horror:0 "负相"
 tradition_horror_desc:0 "我们从未想过恐怖负相位面的存在，而如今它正敞开大门，引诱着我们深入。"
 tr_horror_adopt:0 "初探负相"
 tr_horror_finish:0 "深入负相"
 tr_horror_finish_desc:0 "$UNLOCKS_AGENDA$§Y$council_agenda_agenda_tradition_horror_name$§!\n获得随机§Y先驱者遗珍§!与§Y先驱者科技§!"
 
 tr_horror_1:0 "光锥"
 tr_horror_1_delayed:0 "光锥代表什么，时间又是什么？"
 
 tr_horror_2:0 "力场"
 tr_horror_2_delayed:0 "力场是否存在，空间有何意义？"
 
 tr_horror_3:0 "负相"
 tr_horror_3_delayed:0 "负相的背面潜伏着怎样的危机？"
 
 tr_horror_4:0 "时空"
 tr_horror_4_delayed:0 "时空能否倒流，因果能否逆转？"
 
 tr_horror_5:0 "位面"
 tr_horror_5_delayed:0 "位面的彼岸隐藏着怎样的奥秘？"
 
 ################################################################
 # 时空
 ################################################################
 
 tradition_time:0 "时空"
 tradition_time_desc:0 "对我们而言，时空并非是个陌生的概念。但当我们深入恐怖负相位面时，它却变得不那么熟悉。"
 tr_time_adopt:0 "时空简史"
 tr_time_finish:0 "圆环理论"
 tr_time_finish_desc:0 "$UNLOCKS_AGENDA$§Y$council_agenda_agenda_tradition_time_name$§!\n[GetTrTimeFinishDesc]"
 tr_time_finish_desc_1:0 "获得遗珍：$r_horror_matter$"
 tr_time_finish_desc_2:0 "§Y£sr_dark_matter 2000.00§!\n$r_horror_matter_become_powerful$"
 
 tr_time_1:0 "光锥波动性"
 tr_time_1_delayed:0 "时间的光锥并非一成不变。我们可以利用光锥的波动性将敌人的激光偏折到其它时间段，以此来规避大多数对手发动的攻击。"
 
 tr_time_2:0 "力场粒子性"
 tr_time_2_delayed:0 "空间的力场并非虚无缥缈。我们可以利用力场的粒子性将敌人的炮弹吸收为舰船的动能，以此来减少大多数对手造成的伤害。"
 
 tr_time_3:0 "负相具象性"
 tr_time_3_delayed:0 "负相同样可以具象化。具象化的负相会失去变幻莫测的性质，转而获得强大的吸引力和扭曲力，更加便于我们的研究。"
 
 tr_time_4:0 "时空共轭性"
 tr_time_4_delayed:0 "时间与空间相辅相成。通过时间与空间的双维打击，我们能更加精确地锁定敌舰的薄弱部位，并造成更大的威胁。"
 
 tr_time_5:0 "位面虚无性"
 tr_time_5_delayed:0 "位面可以在虚无之中转换。不同的世界都通过恐怖负相物质连接，负相生物则可以利用此性质自由地穿梭于各个位面，并实现自己的循环。"
 
 ################################################################
 # 终末
 ################################################################
 
 tradition_end:0 "终末"
 tradition_end_desc:0 "终末是一次结束，但也是一场开始。祂既是一个概念，又是一种实体。\n我们终究迎来了终末的命运。"
 tr_end_adopt:0 "终末之始"
 tr_end_finish:0 "始源之终"
 tr_end_finish_desc:0 "$UNLOCKS_AGENDA$§Y$council_agenda_agenda_tradition_end_name$§!\n$time.505.tooltip$\n$mod_country_unity_produces_mult$：§G+15%§!\n$MOD_COUNTRY_ASCENSION_PERKS_ADD$：§G+1§!"
 
 tr_end_1:0 "光锥御衡者"
 tr_end_1_delayed:0 "重新对光锥进行御衡，终末有自己的法则。"
 
 tr_end_2:0 "力场混沌者"
 tr_end_2_delayed:0 "使力场充满混沌，这是只属于终末的次元。"
 
 tr_end_3:0 "负相蔓延者"
 tr_end_3_delayed:0 "负相在因果间蔓延，终末的旅程永无尽头。"
 
 tr_end_4:0 "时空湮灭者"
 tr_end_4_delayed:0 "湮灭周而复始，这便是时空对终末的妥协。"
 
 tr_end_5:0 "位面破碎者"
 tr_end_5_delayed:0 "破碎所有的伤口，终末不容许位面的无瑕。"
 
 ################################################################
 # 希望
 ################################################################
 
 tradition_hope:0 "希望"
 tradition_hope_desc:0 "我们拒绝了终末的诱惑，我们会用自己的双手开拓未来，寻觅打破循环的希望。"
