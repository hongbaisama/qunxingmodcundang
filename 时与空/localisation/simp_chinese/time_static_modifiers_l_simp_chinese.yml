 time_haze:0 "视界雾霭"
 time_haze_desc:0 "这颗星球表面形成了类似黑洞的不完全视界，其中充斥着混乱与无序。"
 second_time_homeworld:0 "第二视界"
 second_time_homeworld_desc:0 "这颗星球在雾霭的笼罩下彻底转变成了一颗黑洞，它已然成为了我们的第二家园。"
 time_wormhole:0 "视界虫洞"
 time_wormhole_desc:0 "这颗星球与§Y[time_wormhole_core_planet.GetName]§!紧密相连，一切物质交换都将通过虫洞维持。"
 time_wormhole_core:0 "奇点虫洞"
 time_wormhole_core_desc:0 "银心奇点与§Y[time_wormhole_planet.GetName]§!紧密相连，我们开辟了一片属于自己的天地。"
 
 time_hotel_modifier_1:0 "时光监狱的警醒"
 time_hotel_modifier_1_desc:0 "时光监狱背后的故事警醒了帝国的每一个公民，所有人在破坏社会稳定之前都会先思考自己的未来。"
 time_hotel_modifier_2:0 "时光监狱的秘密"
 time_hotel_modifier_2_desc:0 "时光监狱蕴藏的秘密有利于星球的建设、舰船的装配与决议的施行，但我们仍未能完全掌握其原理。"
 
 origin_contract_composer_assimilation:0 "何为所求：填充"
 origin_contract_composer_assimilation_desc:0 "低语满足于§Y$the_composer_of_strands$§!的意志，我们也满足于无限的渴求。"
 origin_contract_cradle_assimilation:0 "何为所求：容纳"
 origin_contract_cradle_assimilation_desc:0 "低语满足于§Y$the_cradle_of_souls$§!的意志，我们也满足于无限的渴求。"
 origin_contract_eater_assimilation:0 "何为所求：征服"
 origin_contract_eater_assimilation_desc:0 "低语满足于§Y$the_eater_of_worlds$§!的意志，我们也满足于无限的渴求。"
 origin_contract_instrument_assimilation:0 "何为所求：支配"
 origin_contract_instrument_assimilation_desc:0 "低语满足于§Y$the_instrument_of_desire$§!的意志，我们也满足于无限的渴求。"
 
 psionic_origin_best:0 "祝圣灵能源泉"
 psionic_origin_best_desc:0 "这颗星球与虚境直接连通，并源源不断地产生极量的灵能。"
