 psionic_origin:0 "灵能源泉"
 psionic_origin_desc:0 "这颗星球与虚境直接连通，并源源不断地产生灵能。"
 best_psionic:0 "强大的灵能浪潮"
 best_psionic_desc:0 "这颗星球充斥着强大的灵能浪潮，环境与虚境十分相似。"
 good_psionic:0 "稳定的灵能浪潮"
 good_psionic_desc:0 "这颗星球充斥着稳定的灵能浪潮，虚境访客可以很好地利用这股浪潮。"
 normal_psionic:0 "灵能浪潮"
 normal_psionic_desc:0 "这颗星球充斥着灵能浪潮，虚境访客可以在一定程度上利用这股浪潮。"
 bad_psionic:0 "脆弱的灵能浪潮"
 bad_psionic_desc:0 "这颗星球充斥着脆弱的灵能浪潮，虚境访客难以利用这股浪潮。"
 worst_psionic:0 "混乱的灵能浪潮"
 worst_psionic_desc:0 "这颗星球充斥着混乱的灵能浪潮，就连虚境访客也不能很好地抵御这股浪潮。"
 psionic_disaster:0 "灵能恐惧"
 psionic_disaster_desc:0 "灵能灾难的发生使得人民对灵能产生恐惧，社会难以维持正常秩序。"
 
 nanites_1:0 "收集纳米机器"
 nanites_1_desc:0 "这颗星球的大气层中散布着许多零散的纳米机器，星球上的人口正在对它们进行收集。"
 nanites_2:0 "回收纳米机器"
 nanites_2_desc:0 "这颗星球深埋着许多废弃的纳米机器，星球上的人口正在对它们进行回收。"
 nanites_3:0 "维修纳米机器"
 nanites_3_desc:0 "这颗星球上有许多破损的纳米机器，星球上的人口正在对它们进行维修。"
 nanites_4:0 "组建纳米机器"
 nanites_4_desc:0 "这颗星球需要许多全新的纳米机器，星球上的人口正在组建新型的纳米机器。"
 nanites_5:0 "改装纳米机器"
 nanites_5_desc:0 "这颗星球需要许多特殊的纳米机器，星球上的人口正在对现有的纳米机器进行改装。"
 nanites_nanotech_swarm_consume_world_effect_same:0 "§Y纳米区划提供额外岗位§!"
 nanites_nanotech_swarm_consume_world:0 "活性纳米过载"
