l_simp_chinese:
 r_horror_matter_modifier:0 "§M位面研究§!"
 r_horror_matter_modifier_desc:0 "§M我们触及了一个未曾察觉的位面，它近在咫尺却遥不可及，那里究竟隐藏着怎样的奥秘？§!"
 
 r_time_modifier_1:0 "§M负相探知§!"
 r_time_modifier_1_desc:0 "§M我们正如饥似渴地探索着负相位面，无限的知识颠覆了原有的认知。§!"
 r_time_modifier_2:0 "$r_time_modifier_1$"
 r_time_modifier_2_desc:0 "$r_time_modifier_1_desc$"
 r_time_modifier_3:0 "$r_time_modifier_1$"
 r_time_modifier_3_desc:0 "$r_time_modifier_1_desc$"
 r_time_modifier_4:0 "$r_time_modifier_1$"
 r_time_modifier_4_desc:0 "$r_time_modifier_1_desc$"
 r_time_modifier_5:0 "$r_time_modifier_1$"
 r_time_modifier_5_desc:0 "$r_time_modifier_1_desc$"
 r_time_modifier_6:0 "§M时空洞察§!"
 r_time_modifier_6_desc:0 "§M我们对负相位面早已了如指掌，但对时空的钻研永无止境。§!"
 r_time_modifier_7:0 "$r_time_modifier_6$"
 r_time_modifier_7_desc:0 "$r_time_modifier_6_desc$"
 r_time_modifier_8:0 "$r_time_modifier_6$"
 r_time_modifier_8_desc:0 "$r_time_modifier_6_desc$"
 r_time_modifier_9:0 "$r_time_modifier_6$"
 r_time_modifier_9_desc:0 "$r_time_modifier_6_desc$"
 r_time_modifier_10:0 "§M终末之心§!"
 r_time_modifier_10_desc:0 "§M负相位面已被我们完全剖析。\n我们不再是曾经的我们，我们早已踏入不同的河流。§!"
 
 time_dimensional_horror_modifier:0 "凝视"
 time_dimensional_horror_modifier_desc:0 "圆环所在，形影不离。"
 time_worm_manifestation:0 "凝视"
 time_worm_manifestation_desc:0 "圆环所在，形影不离。"
 time_horror:0 "时空馈赠"
 time_horror_desc:0 "这份§Y具象化恐怖负相物质§!来自§Y恐怖负相位面§!的最深处。\n它是我们进行负相物质复制的原体，也是我们探知负相位面奥秘的关键。"
 time_cycle_modifier:0 "时空循环"
 time_cycle_modifier_desc:0 "我们达成了一个时空循环：现在的我们为过去提供帮助，而未来的我们也为现在做出贡献。\n§M我们永远爱我们。§!"
 
 time_0_planet_modifier:0 "视界命运"
 time_0_planet_modifier_desc:0 "我们已属于黑洞。\n即使我们未曾选择，但在视界中的命运给予了我们洞悉时空的机遇。"
 time_1_planet_modifier:0 "视界历史"
 time_1_planet_modifier_desc:0 "我们本属于黑洞。\n即使我们并不喜欢，但在视界中的历史的确给我们带来了不少好处。"
 time_2_planet_modifier:0 "视界数据"
 time_2_planet_modifier_desc:0 "我们曾属于黑洞。\n即使我们早已远去，但在视界中的数据依然加速了我们的科研进展。"
 time_3_planet_modifier:0 "视界信号"
 time_3_planet_modifier_desc:0 "我们将属于黑洞。\n即使我们无从得知，但在视界中的信号正带领我们走向未知的结局。"
 origin_time_earth_modifier:0 "视界之前"
 origin_time_earth_modifier_desc:0 "这并非这颗星球原本的面貌，但它在视界之前的历史，我们已经无从知晓。"
 akx_time_erasure_system_modifier:0 "虚无"
 akx_time_erasure_system_modifier_desc:0 "这片星系已从时空中被抹除。"
 akx_time_erasure_planet_modifier:0 "虚无"
 akx_time_erasure_planet_modifier_desc:0 "这颗星球已从时空中被抹除。"
 time_wanderer_system_modifier:0 "无形奇点"
 time_wanderer_system_modifier_desc:0 "这片星系中似乎出现了某种异常，根据系内的引力场推测，仿佛有个无形的奇点在星系各处游荡。"
 time_wanderer_planet_modifier:0 "无形奇点"
 time_wanderer_planet_modifier_desc:0 "这颗星球上似乎出现了某种异常，根据周边的引力场推测，仿佛有个无形的奇点在星球周围游荡。"
 time_wanderer_black_hole_modifier:0 "与死相连"
 time_wanderer_black_hole_modifier_desc:0 "这颗星球遭到了游荡奇点的吞噬，其上位面之魇的投影似乎宣誓着黑洞的主权。"
 time_wanderer_modifier:0 "与死共舞"
 time_wanderer_modifier_desc:0 "界旅者从深渊带来了赴宴的赠礼。"
 time_wanderer_false_modifier:0 "死亡之吻"
 time_wanderer_false_modifier_desc:0 "界旅者紧急跃迁前记录的临界数据极具研究价值。"
 
 time_lifeline_just_a_dream:0 "只是梦幻"
 time_lifeline_just_a_dream_desc:0 "我们做了一场漫长的梦，但那真的只是梦吗？"
 time_lifeline_i_am_sorry:0 "我很抱歉"
 time_lifeline_i_am_sorry_desc:0 "求救者为没能信守承诺感到抱歉，我们为求救者难逃一死感到抱歉。"
 time_lifeline_traveler_in_dream:0 "梦中旅人"
 time_lifeline_traveler_in_dream_desc:0 "我们无法证明自己所处的宇宙不在黑洞之中，正如无法用梦里的事物证明自己在不在梦里。\n§Y但在无穷无尽的未来，我们会找到答案。一定。§!"
 time_lifeline_rule_of_time:0 "时间法则"
 time_lifeline_rule_of_time_desc:0 "永远不要轻视时间，时间有着时间的法则。\n§Y正如我们有着我们的责任，她也有着她的使命。§!"
 time_lifeline_song_of_circle:0 "圆环之歌"
 time_lifeline_song_of_circle_desc:0 "文明的废墟之上，新的文明正在发芽。\n§Y这是一首献给逝者的摇篮曲。§!"
 time_lifeline_identical_twins:0 "同卵双生"
 time_lifeline_identical_twins_desc:0 "不同宇宙的同一个星球彼此重叠。如何证明？如何证伪？\n§Y总有一天，我们能够触及宇宙的真相；总有一天，我们可以成为拉普拉斯妖。§!"
 time_lifeline_closed_loop:0 "达成闭环"
 time_lifeline_closed_loop_desc:0 "一个闭环的达成，一场故事的落幕。"
 time_lifeline_civilization_afterglow:0 "文明余晖"
 time_lifeline_civilization_afterglow_desc:0 "这些时间水晶的半成品也许是一个文明最后的辉煌。"
 time_lifeline_civilization_afterglow_gestalt:0 "$time_lifeline_civilization_afterglow$"
 time_lifeline_civilization_afterglow_gestalt_desc:0 "$time_lifeline_civilization_afterglow_desc$"
 time_lifeline_mirror_world:0 "镜像世界"
 time_lifeline_mirror_world_desc:0 "一面湖泊连接着地表与地底，相似但不同的世界互为镜像。"
 time_lifeline_my_last_mission:0 "最后使命"
 time_lifeline_my_last_mission_desc:0 "求救者为不同时间的自己开辟了正确的航道，她用生命达成了最后的使命。"
 time_lifeline_there_is_no_wonder:0 "没有奇迹"
 time_lifeline_there_is_no_wonder_desc:0 "奇迹没有发生，我们见证了求救者生命的末路。"
 time_lifeline_there_is_no_wonder_gestalt:0 "$time_lifeline_there_is_no_wonder$"
 time_lifeline_there_is_no_wonder_gestalt_desc:0 "$time_lifeline_there_is_no_wonder_desc$"
 time_lifeline_fly_against_fire:0 "飞蛾扑火"
 time_lifeline_fly_against_fire_desc:0 "飞蛾扑向生存的光芒，殊不知那是致命的闪电。"
 time_lifeline_finally_be_oblation:0 "终为祭品"
 time_lifeline_finally_be_oblation_desc:0 "祭祀中断又重启，她最终还是沦为了祭品。"
 time_lifeline_finally_be_oblation_gestalt:0 "$time_lifeline_finally_be_oblation$"
 time_lifeline_finally_be_oblation_gestalt_desc:0 "$time_lifeline_finally_be_oblation_desc$"
 time_lifeline_finally_be_oblation_spiritualist:0 "$time_lifeline_finally_be_oblation$"
 time_lifeline_finally_be_oblation_spiritualist_desc:0 "无论如何，祭礼始终会开始。"
 
 white_hole_recycle_bin_modifier:0 "$sm_white_hole_recycle_bin$"
 white_hole_recycle_bin_modifier_desc:0 "由于从源头上回收了大部分物质，物质流对舰船的危害减弱了。"
 
 horror_focus_modifier:0 "梦魇终结者"
 horror_focus_modifier_desc:0 "为了在负相领域走得更远，我们需要对负相存在了解更多——无论用何种手段。"
 horror_focus_modifier_effect:0 "$mod_damage_vs_country_type_guardian_horror_mult$:§G+50%§!"
 
 pc_time_modifier_1:0 "逝者上的乐土"
 pc_time_modifier_1_desc:0 "为了不辜负逝者的成果，我们更应对这片时空开发利用，哪怕会招致非议。"
 pc_time_modifier_2:0 "被动的抑郁者"
 pc_time_modifier_2_desc:0 "数据核心释放的辐射会很大程度上影响居民的心智，并引发被动的抑郁症状。"
 pc_time_modifier_3:0 "愚蠢的开拓者"
 pc_time_modifier_3_desc:0 "数据核心存储的知识并未对开拓时空带来想象中的便利，我们反而不得不用自己的计算系统来辅助它的运转。"
 pc_time_modifier_4:0 "智慧的先驱者"
 pc_time_modifier_4_desc:0 "数据核心存储的知识引导着我们朝未知的领域探索，我们十分感谢这位先驱者的支援，尽管它很快就坏了。"
 pc_time_modifier_5:0 "面纱中的城市"
 pc_time_modifier_5_desc:0 "我们尝试在新的时空中建设城市，但偶发的相位转移现象经常造成施工上的麻烦。"
 pc_time_modifier_6:0 "风暴后的领土"
 pc_time_modifier_6_desc:0 "为了改造新的领土，我们的居民不得不在一个更为艰辛的环境中适应并生活。"
 pc_time_modifier_7:0 "风暴后的乐园"
 pc_time_modifier_7_desc:0 "风暴之后的时空兼具稳定性和危险性，已经成为了居民们调剂生活的乐园。"
 pc_time_modifier_8:0 "据点的迁出地"
 pc_time_modifier_8_desc:0 "一批长大成人的青壮年被安排前往先锋据点，他们将为神秘奇点的探索做出卓越的贡献。"
 pc_time_modifier_9:0 "据点的建筑风"
 pc_time_modifier_9_desc:0 "我们学习了据点的建筑风格，更加高效地利用了现有的时空，但这需要一段时间适应。"
 pc_time_modifier_10:0 "法则的大逆转"
 pc_time_modifier_10_desc:0 "黑洞中的部分法则经历了逆转，这极大程度上影响了我们的生产活动与科研进程。"
 pc_time_modifier_11:0 "不言败的居民"
 pc_time_modifier_11_desc:0 "纵使法则逆转，身为黑洞的居民也能很快适应变化，我们永不言败。"
 pc_time_modifier_12:0 "他们来自负相"
 pc_time_modifier_12_desc:0 "一群来自负相位面的居民回归了我们的家园，但显然事情并没有那么简单。"
 pc_time_modifier_13:0 "我们向往负相"
 pc_time_modifier_13_desc:0 "在保持着对负相位面警惕的同时，我们也向往着负相位面中未知的一切。"
 pc_time_modifier_14:0 "灰色的纳米云"
 pc_time_modifier_14_desc:0 "这团混乱无序的纳米云闯入了我们的领土，所有被染成灰色的区域都暂时无法使用。"
 pc_time_modifier_end:0 "奇点的守望者"
 pc_time_modifier_end_desc:0 "[GetPcTimeModifierEndDesc]"
 pc_time_modifier_end_desc_1:0 "黑洞的核心或许真的平凡无奇，但我们也会永远守望中央奇点，直到谜团解开的那一天。"
 pc_time_modifier_end_desc_2:0 "黑洞的核心原来只是个假象，我们对中央奇点的守望已不再是徒劳。"
 pc_time_modifier_end_desc_3:0 "黑洞的核心竟是时之螶的造物，我们守望着奇点，时之螶守望着我们。"
 pc_time_modifier_end_desc_4:0 "奇点的核心已经向我们彻底敞开，我们将与时之螶一同守望时空的真谛，直至永恒。"
 
 origin_time_modifier_materialist:0 "未知的钻研者"
 origin_time_modifier_materialist_desc:0 "$time.160.a.materialist$"
 origin_time_modifier_spiritualist:0 "灵魂的感知者"
 origin_time_modifier_spiritualist_desc:0 "$time.160.a.spiritualist$"
 origin_time_modifier_militarist:0 "武力的崇尚者"
 origin_time_modifier_militarist_desc:0 "$time.160.a.militarist$"
 origin_time_modifier_pacifist:0 "生活的享受者"
 origin_time_modifier_pacifist_desc:0 "$time.160.a.pacifist$"
 origin_time_modifier_xenophile:0 "希望的追求者"
 origin_time_modifier_xenophile_desc:0 "$time.160.a.xenophile$"
 origin_time_modifier_xenophobe:0 "领土的护卫者"
 origin_time_modifier_xenophobe_desc:0 "$time.160.a.xenophobe$"
 origin_time_modifier_egalitarian:0 "幸福的向往者"
 origin_time_modifier_egalitarian_desc:0 "$time.160.a.egalitarian$"
 origin_time_modifier_authoritarian:0 "星海的掌控者"
 origin_time_modifier_authoritarian_desc:0 "$time.160.a.authoritarian$"
 
 timesingularity:0 "黑洞之心"
 timesingularity_desc:0 "经过研究，时空黑洞的核心是时空扭曲而成的奇点，而这一切全都是时之螶的有意为之。该研究成果不仅进一步地证明了时之螶对我们的爱，而且使得黑洞中的生物可以暂时性地控制时空，并由此提高工作效率。"
 timesingularity_effect:0 "$mod_district_time_usage_cap_mult$：§G+50%§!\n$planet_time_researchers$$MOD_JOB_MAX_WORKFORCE_MULT$：§G+50%§!\n$pc_time$的正面星球修正：§G+100%§!\n$pc_time$的负面星球修正：§G-100%§!\n$planet_black_hole_physicists_with_icon$产出的$MOD_PLANET_CRIME_ADD$：§G-1§!\n$planet_black_hole_biologists_with_icon$产出的$MOD_PLANET_AMENITIES_ADD$：§G+100§!\n$planet_black_hole_engineers_with_icon$产出的$MOD_PLANET_HOUSING_ADD$：§G+100§!\n首都专属规划类型晋升为：$col_timesingularity_capital$"
 timelife:0 "重获新生"
 timelife_desc:0 "统治者进入黑洞竟然毫发未损，甚至拥有了更强的能力。我们的民众受到了极大的鼓舞，犹如重获新生。"
 timedeath:0 "难逃一死"
 timedeath_desc:0 "统治者离奇失踪，其哀嚎声却从黑洞中传来。我们的民众受到了极大的打击，担忧自己难逃一死。"
 timefear:0 "黑洞恐惧"
 timefear_desc:0 "一得知统治者即将被黑洞吞噬，我们的民众便对黑洞产生了严重的恐惧。"
 
 origin_time_coup:0 "政变风波"
 origin_time_coup_desc:0 "尽管政变未能成功，但其风波仍然影响着视界之内的稳定。"
 origin_time_authoritarian_attraction:0 "追随者的谣言"
 origin_time_authoritarian_attraction_desc:0 "追随者们在社区中散布了谣言，影响着民众的判断。"
 origin_time_egalitarian_attraction:0 "质疑者的谣言"
 origin_time_egalitarian_attraction_desc:0 "质疑者们在社区中散布了谣言，影响着民众的判断。"
 origin_time_spiritualist_attraction:0 "崇敬者的谣言"
 origin_time_spiritualist_attraction_desc:0 "崇敬者们在社区中散布了谣言，影响着民众的判断。"
 origin_time_materialist_attraction:0 "研究者的谣言"
 origin_time_materialist_attraction_desc:0 "研究者们在社区中散布了谣言，影响着民众的判断。"
 origin_time_militarist_attraction:0 "激进者的谣言"
 origin_time_militarist_attraction_desc:0 "激进者们在社区中散布了谣言，影响着民众的判断。"
 origin_time_pacifist_attraction:0 "保守者的谣言"
 origin_time_pacifist_attraction_desc:0 "保守者们在社区中散布了谣言，影响着民众的判断。"
 origin_time_xenophobe_attraction:0 "纯净者的谣言"
 origin_time_xenophobe_attraction_desc:0 "纯净者们在社区中散布了谣言，影响着民众的判断。"
 origin_time_xenophile_attraction:0 "混合者的谣言"
 origin_time_xenophile_attraction_desc:0 "混合者们在社区中散布了谣言，影响着民众的判断。"
 
