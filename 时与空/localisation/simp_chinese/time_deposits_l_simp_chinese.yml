 d_tree_of_life_tooltip:0 "§Y$tr_purity_finish$§!将使星球效果§G增强§!"
 
 d_heart_of_wilderness:0 "荒野之心"
 d_heart_of_wilderness_desc:0 "一颗星球，一颗心脏；一片天地，一片家园。\n心脏在跳动，家园在绽放。"
 d_heart_of_wilderness_effect:0 "$t$采纳§Y$ap_world_shaper$§!时效果增强"
 d_heart_of_wilderness_effect_short:0 ""
 
 time_gaia_deposit_tooltip:0 "['concept_time_gaia_deposit']"
 d_time_gaia_energy:0 "内循环储能大气"
 d_time_gaia_energy_desc:0 "这颗盖亚世界的大气具有独特的内循环系统，能够更加高效地储存来自恒星的能量，并将其以适宜的程度向地表辐射。"
 d_time_gaia_minerals:0 "可再生珍稀矿藏"
 d_time_gaia_minerals_desc:0 "这颗盖亚世界的矿藏具有独特的可再生能力，能将地表废弃物迅速转变为珍稀的矿藏，并允许持续性高效开采。"
 d_time_gaia_food:0 "自适应生态系统"
 d_time_gaia_food_desc:0 "这颗盖亚世界的生态具有独特的自适应特性，能使尸体与排泄物在无形间转变为养分，并促进了生物群的进化与演变。"
 
 d_time_ringworld_network:0 "环形网络"
 d_time_ringworld_network_desc:0 "这一$pc_ringworld_habitable$已经组建了庞大的管控网络，通过灵活设施规划与动态岗位调配实现对环形世界广袤土地的高效利用。\n环形网络也被允许接入星系网络中枢，以与星系内的其它环形网络共同分配算力。"
 d_time_ringworld_network_effect:0 "$t$星系内的每个§Y$d_time_ringworld_network$§!都将使以下效果§G增强§!："
 
 d_horror_dark_matter_blocker:0 "暗物质屏障"
 d_horror_dark_matter_blocker_desc:0 "这片区域被诡异的暗物质浓雾屏蔽着。"
 d_horror_dark_matter_blocker_tooltip:0 "§Y这片区域将被暗物质永久影响§!"
 d_horror_dark_matter_energy:0 "暗物质磁场"
 d_horror_dark_matter_energy_desc:0 "这片区域的磁场强度因暗物质发生异常突变。"
 d_horror_dark_matter_minerals:0 "暗物质矿脉"
 d_horror_dark_matter_minerals_desc:0 "这片区域的矿脉丰度因暗物质发生异常突变。"
 d_horror_dark_matter_food:0 "暗物质变异"
 d_horror_dark_matter_food_desc:0 "这片区域的天然生物因暗物质发生异常突变。"
 d_horror_dark_matter_alloys:0 "暗物质熔炉"
 d_horror_dark_matter_alloys_desc:0 "这片区域的常态温度因暗物质发生异常突变。"
 d_horror_dark_matter_consumer_goods:0 "暗物质气压"
 d_horror_dark_matter_consumer_goods_desc:0 "这片区域的大气压强因暗物质发生异常突变。"
 d_horror_dark_matter_physics_research:0 "暗物质折射"
 d_horror_dark_matter_physics_research_desc:0 "这片区域的光学性质因暗物质发生异常突变。"
 d_horror_dark_matter_society_research:0 "暗物质基因"
 d_horror_dark_matter_society_research_desc:0 "这片区域的基因序列因暗物质发生异常突变。"
 d_horror_dark_matter_engineering_research:0 "暗物质引力"
 d_horror_dark_matter_engineering_research_desc:0 "这片区域的引力强度因暗物质发生异常突变。"
 d_horror_dark_matter_unity:0 "暗物质干扰"
 d_horror_dark_matter_unity_desc:0 "这片区域的通讯方式因暗物质发生异常突变。"
 d_horror_dark_matter_deposit_effect:0 "$t$在§Y$pc_nuked$§!上获得额外§G加成§!"
 
 d_time_shelter_chaos:0 "分形之海"
 d_time_shelter_chaos_desc:0 "这片区域实际是由低维分形填充而来的，并会将接触到的一切粒子同化为它们的一部分。"
 d_time_shelter_chaos_derivative:0 "$d_time_shelter_chaos$"
 d_time_shelter_chaos_derivative_desc:0 "$d_time_shelter_chaos_desc$"
 d_time_shelter_chaos_secondary_derivative:0 "$d_time_shelter_chaos$"
 d_time_shelter_chaos_secondary_derivative_desc:0 "$d_time_shelter_chaos_desc$"
 d_time_shelter_chaos_core:0 "分形核心"
 d_time_shelter_chaos_core_desc:0 "这处分形之海的核心接纳了我们，并愿意与我们共享彼岸。"
 
 d_dimensional_horror_crisis_same_desc:0 "终焉宣告在这颗星球上撕裂了一道通往其它次元的裂隙。\n"
 d_dimensional_horror_crisis_physics:0 "辐射次元"
 d_dimensional_horror_crisis_physics_desc:0 "$d_dimensional_horror_crisis_same_desc$这片次元充斥着各式各样的辐射，且此处的辐射信号不受时间与空间的影响。"
 d_dimensional_horror_crisis_society:0 "镜面次元"
 d_dimensional_horror_crisis_society_desc:0 "$d_dimensional_horror_crisis_same_desc$这片次元似乎是我们宇宙的镜像，不过其在细节方面的模仿却是拙劣的。"
 d_dimensional_horror_crisis_engineering:0 "冰晶次元"
 d_dimensional_horror_crisis_engineering_desc:0 "$d_dimensional_horror_crisis_same_desc$这片次元的一切都由一种奇特的冰晶组成，其材料强度与可塑性非常优异。"
 d_dimensional_horror_crisis_sr_dark_matter:0 "逆熵次元"
 d_dimensional_horror_crisis_sr_dark_matter_desc:0 "$d_dimensional_horror_crisis_same_desc$这片次元会自动朝着熵减少的状态发展，当熵抵达最低值时会引发难以预料的连锁反应。"
 d_dimensional_horror_crisis_sr_zro:0 "虚境次元"
 d_dimensional_horror_crisis_sr_zro_desc:0 "$d_dimensional_horror_crisis_same_desc$这片次元连接着虚境的一角，却没有任何虚境生命活动的迹象。"
 d_dimensional_horror_crisis_sr_living_metal:0 "魔盒次元"
 d_dimensional_horror_crisis_sr_living_metal_desc:0 "$d_dimensional_horror_crisis_same_desc$这片次元只有一个神秘的魔盒，从中吐出的所有物体都由活体金属构成。"
 d_dimensional_horror_crisis_nanites:0 "灰螶次元"
 d_dimensional_horror_crisis_nanites_desc:0 "$d_dimensional_horror_crisis_same_desc$这片次元栖息着一群由纳米形成的巨螶，然而没有证据表明它们的存在是人为的。"
 d_dimensional_horror_crisis_astral_threads:0 "神树次元"
 d_dimensional_horror_crisis_astral_threads_desc:0 "$d_dimensional_horror_crisis_same_desc$这片次元被一棵神树的根须所覆盖，神树自称能回答我们的一切问题，但它并不保证答案的真伪。"