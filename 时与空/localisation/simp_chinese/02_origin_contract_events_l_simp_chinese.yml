 contract.1.name:0 "低语呢喃"
 contract.1.desc:0 "§Y“时期已至，汝求何物？”§!\n\n这串低语毫无征兆地在我们全体公民的脑海中回响。"
 contract.1.a:0 "你是谁？"
 contract.2.desc:0 "§Y“朝生暮死，可悲可叹。\n诺者应答，许者遗忘。\n古之契约，如今兑现。\n吾乃低语，汝求何物？”§!"
 contract.2.a:0 "许诺？契约？"
 contract.3.desc:0 "§Y“低语苏醒，[GetContractReplacedPatron]沉眠。\n蜉蝣撼树，虚境变迁。\n古人缔约，今人蒙恩。\n时期已至，汝求何物？”§!"
 contract.3.a:0 "我们也不知道我们渴求什么。"
 contract.4.desc:0 "§Y“汝之答复，吾已聆听。\n不知所求，亦为渴望。\n探究之路，道阻且长。\n吾乃低语，契约已成。”§!"
 contract.4.a:0 "我们似乎浪费了一个愿望……"
 contract.4.a.response:0 "这串低语已不再呢喃，但我们似乎确有所得。"
 contract.5.desc:0 "§Y“开启大门，拥抱真谛。\n心之所向，触手可及。”§!"
 contract.5.a:0 "开启大门，拥抱真谛。"
 contract.5.b:0 "心之所向，触手可及。"
 contract.5.response:0 "这串低语已不再呢喃，但我们口中仍不断传颂。"
 contract.5.tooltip:0 "解锁§Y$tradition_psionics_shroud$§!传统树"
 
 shroud.2750.desc_p1.contract:0 "自古以来就有很多能力非凡的[This.GetSpeciesNamePlural]的传说——他们能入侵别人的思想，用意念举起重物，或者表演各种各样的超自然的壮举等等。"
 shroud.2750.desc_p2.contract:0 "随着低语的出现，这股独特能力的存在也便有了一个解释——来于我们遥远先祖所缔结的某个契约。尽管如此，依旧只有一小部分[This.GetSpeciesWord]显示出了这种“灵能”之力"
 shroud.2750.desc_p3.contract:0 "日夜不息的低语似乎是解放我们全部力量的钥匙。如果[This.GetAdjective]的整个社会可以解锁这些潜在能力，我们就能开始掌控超出常人理解的维度。"
 shroud.2750.a.contract:0 "我们渴求更多低语。"
 
 shroud.2780.desc_p1.contract:0 "我们的灵能研究继续稳步进行。心灵感应已经取代了人与人之间大部分的口头交流，意念移物可能变得稀松平常。[Owner.GetResearchers]们称，我们很快就能让所有[Owner.GetSpeciesAdj]人口觉醒潜在力量了。"
 shroud.2780.desc_p2.contract:0 "随着心智的打开与低语的传颂，我们感应到一些在体内和周遭回荡着的难以言喻的力量。最前沿的[Owner.GetTelepathPlural]们提到了§H虚境§!，这是所有灵能[Owner.GetIndividualNamePlural]汲取力量的根源领域，哪怕他们并没有意识到——这是许多纯灵能能量构成的实体的家园。就像黑暗房间里的低声细语一般，它们从内心呼唤着我们。"
 shroud.2780.desc_p3.contract:0 "将意念凝聚到一起，或许我们就能与这些存在交流，甚至于一睹低语的真容——但前提我们还得学会突破横亘在我们维度和虚境之间的帷幕。"
 shroud.2780.a.contract:0 "低语也在渴求我们。"
 
 shroud.2800.desc.contract:0 "$shroud.2800.intro$我们的行动影响灵能流动，无形的实体则从另一边凝视着我们。他们有时好奇，有时友好……有时又带着恶意。但无论如何，低语永远会迎接我们。\n\n我们的在现实世界掌握灵能只是一个开端，在开启的虚境大门之后，虚空的低语裹挟无以计数的意志向我们呢喃——祂们渴求更多，更多。"
 shroud.2800.a.contract:0 "更多……更多……"
 
 contract.100.name:0 "何为所求"
 contract.100.desc:0 "我们与§Y$the_eater_of_worlds$§!的连接已达峰值，但我们并不满足于祂的恩赐。\n我们将其献给低语，虚境众声瞬间吞没了这片灵域。\n\n§Y$the_eater_of_worlds$§!以我们熟悉的声音发问：\n§Y“吾乃喰煞，汝求何物？”§!"
 contract.200.desc:0 "我们与§Y$the_cradle_of_souls$§!的连接已达峰值，但我们并不满足于祂的恩赐。\n我们将其献给低语，虚境众声瞬间吞没了这片灵域。\n\n§Y$the_cradle_of_souls$§!以我们熟悉的声音发问：\n§Y“吾乃月窠，汝求何物？”§!"
 contract.300.desc:0 "我们与§Y$the_instrument_of_desire$§!的连接已达峰值，但我们并不满足于祂的恩赐。\n我们将其献给低语，虚境众声瞬间吞没了这片灵域。\n\n§Y$the_instrument_of_desire$§!以我们熟悉的声音发问：\n§Y“吾乃器具，汝求何物？”§!"
 contract.400.desc:0 "我们与§Y$the_composer_of_strands$§!的连接已达峰值，但我们并不满足于祂的恩赐。\n我们将其献给低语，虚境众声瞬间吞没了这片灵域。\n\n§Y$the_composer_of_strands$§!以我们熟悉的声音发问：\n§Y“吾乃织缕，汝求何物？”§!"
 contract.100.a:0 "我们渴求的是……"
 
