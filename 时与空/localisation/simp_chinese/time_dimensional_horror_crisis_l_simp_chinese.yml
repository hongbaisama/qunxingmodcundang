 time_dimensional_horror_crisis.1.name:0 "新的整数"
 time_dimensional_horror_crisis.1.desc.prefix:0 "我们正试图掌握时间，时间却给我们开了个小小的玩笑。\n\n在对时间进行一次例行的变换后，我们的对数学的认知发生了天翻地覆的变化。起初只是变换区域的机器给出了错误的结果，随后是整个星球的计算机都出现了故障。情况愈演愈烈，乃至整个国家的人都不再能正确认知数学，几乎一切有关数字的计算都不再有逻辑可言。\n\n一位天才的数学家回顾了我们的往事，将星界裂隙中的记录与我们的现状相对比，并创造性地提出了一个新的整数——圆周率。当把这个位于三与四之间的“整数”纳入现有数学体系时，他惊讶地发现，原本混沌无序的计算竟变得严丝合缝，但要证明这一点却似乎是目前无法做到的。\n\n"
 time_dimensional_horror_crisis.1.desc.suffix:0 "尽管发生这场认知灾难的原因不明，我们还是及时地修改了我们的数学体系。这次变化对未来将产生何种影响尚难以预估，但至少我们勉强稳定了科学的严谨性与逻辑性。\n\n与此同时，整个空间的疏密性似乎发生了变动，时间的流逝也逐渐变得不再可控，似乎有什么正从宇宙的深邃中浮现。"
 time_dimensional_horror_crisis.1.desc.a:0 "$time_dimensional_horror_crisis.1.desc.prefix$曾参与过$astral_rift_akx_horror$裂隙探索的退休工作者表示，他对“三四之间”的经历记忆犹新。当时探针的计算方式与这位天才数学家提出的新方式颇为相似，他可以笃定我们发生了和裂隙中相同的事——或者说，我们所处的宇宙正逐渐与负相位面趋同。\n\n$time_dimensional_horror_crisis.1.desc.suffix$"
 time_dimensional_horror_crisis.1.desc.b:0 "$time_dimensional_horror_crisis.1.desc.prefix$曾参与过$astral_rift_akx_horror$裂隙探索的退休工作者表示，他对“新的整数”的经历记忆犹新。虽然当时并未解析这一整数的全部特性，但此方面的空白似乎被这位天才科学家所填补，困扰他多年的遗憾终于被解决了。\n\n$time_dimensional_horror_crisis.1.desc.suffix$"
 time_dimensional_horror_crisis.1.a:0 "它已经来了。"
 time_dimensional_horror_crisis.1.a.tooltip:0 "§R['concept_dimensional_horror_crisis_storm_tooltip']即将降临在§Y[dimensional_horror_crisis_storm_start_system.GetName]§!！§!"
 time_dimensional_horror_crisis.10.name:0 "终焉宣告"
 time_dimensional_horror_crisis.10.desc.prefix:0 "指针的转动不曾停歇，终焉的宣告准时降临。\n\n"
 time_dimensional_horror_crisis.10.desc.suffix:0 "我们曾经设想会经历怎样的敌人——吞食一切的虫群、来自高维的灵体、肃清谬误的机械、操纵心智的女王，但我们却从未想过最原始却又最直白的天灾——这个宇宙本身。这并非什么痴心妄想的征服者，亦非什么杀戮成性的毁灭者，而是囊括整个宇宙乃至所有位面的自然现象——一场命中注定的终结。\n\n这并非终末，而是终末的预兆，此即为§H终焉宣告§!。"
 time_dimensional_horror_crisis.10.desc.a:0 "$time_dimensional_horror_crisis.10.desc.prefix$['concept_dimensional_horror_crisis_storm']在一瞬间淹没了我们的首都，所有人都不约而同地想到了一个词——“终末”。混沌、无序、痛苦、灾难、死亡、终结，几乎一切可怖的负面词汇都如字面般发生在遭受波及的星球上。\n\n$time_dimensional_horror_crisis.10.desc.suffix$"
 time_dimensional_horror_crisis.10.desc.b:0 "$time_dimensional_horror_crisis.10.desc.prefix$['concept_dimensional_horror_crisis_storm']在一瞬间淹没了§Y[dimensional_horror_crisis_storm_start_system.GetName]§!，没有人知道那里究竟发生了什么。混沌、无序、痛苦、灾难、死亡、终结，几乎一切可怖的负面词汇都如字面般弥漫在深不可测的风暴之中。\n\n$time_dimensional_horror_crisis.10.desc.suffix$"
 time_dimensional_horror_crisis.10.a:0 "我们的敌人，即是宇宙本身。"
 
 time_dimensional_horror_crisis.500.name:0 "$concept_dimensional_horror_crisis_seal$"
 time_dimensional_horror_crisis.500.desc.a:0 "借助另一个循环的帮助，我们成功将§Y[dimensional_horror_crisis_sealed_system.GetName]§!封印在了时间长河中。\n现如今，全部遭受['concept_dimensional_horror_crisis_erasure']的星系都已被成功封印。我们不知这能坚持多久，只能祈祷['concept_dimensional_horror_crisis_storm']的危害能就此减弱。"
 time_dimensional_horror_crisis.500.desc.b:0 "借助另一个循环的帮助，我们成功将§Y[dimensional_horror_crisis_sealed_system.GetName]§!封印在了时间长河中。\n尽管我们不知这能坚持多久，至少该星系在短时间内不会再受['concept_dimensional_horror_crisis_storm']的影响了。"
 time_dimensional_horror_crisis.500.a:0 "我们安全了……暂时。"
 time_dimensional_horror_crisis.500.a.tooltip:0 "['concept_dimensional_horror_crisis_ship_orange']不会再引发['concept_dimensional_horror_crisis_erasure_red']"
 time_dimensional_horror_crisis.500.b:0 "这一个——然后是下一个。"
 time_dimensional_horror_crisis.500.b.tooltip:0 "['concept_dimensional_horror_crisis_storm']不会再对§Y[dimensional_horror_crisis_sealed_system.GetName]§!产生负面效果"
 
 time_dimensional_horror_crisis.1000.name:0 "命运之陨"
 time_dimensional_horror_crisis.1000.desc:0 "祂是时间？祂是空间？\n祂是循环？祂是因果？\n祂是世界？祂是维度？\n\n§C“祂什么都是，祂什么都不是。”§!\n\n祂是开始？祂是终结？\n祂是使者？祂是神明？\n祂是实体？祂是概念？\n\n§C“祂什么都是，祂什么都不是。”§!\n\n§R“吾乃命运，后会无期。”§!"
 time_dimensional_horror_crisis.1000.a:0 "祂什么都是，祂什么都不是。"
 
 time_dimensional_horror_crisis.1100.desc:0 "§Y[From.GetName]§!在§Y[dimensional_horror_crisis_destiny_system.GetName]§!成功击退了名为“$NAME_Dimensional_Horror_Crisis_Destiny$”的终焉之魇。\n\n随着这只来自终焉的怪物的消亡，整个银河的终焉风暴也随之变得平缓。但我们明白，这一切还没有完全结束。"
 time_dimensional_horror_crisis.1100.a:0 "终焉的钟声已经敲响，但这次哀悼的是终焉自身。"