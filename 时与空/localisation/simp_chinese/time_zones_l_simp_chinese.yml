 zone_pirate_king_military: "炉石酒馆"
 zone_pirate_king_military_desc: "水手与工匠们齐聚在这间广阔的酒馆中，沉浸于一款最新的卡牌游戏。虽然看上去不务正业，但水手与工匠们却能因此迸发出昙花一现的灵感。"
 zone_pirate_king_military_tt: "每$pop_group_unit$$soldier_type_plural_with_icon$提供的§Y$mod_pirate_king_reward_gain$§!：§G+1%§!\n每$pop_group_unit$$foundry_type_plural_with_icon$提供的§Y$MOD_STARBASE_SHIPYARD_BUILD_SPEED_MULT$§!：§G+1%§!"
 
 zone_adeptus_mechanicus: "教化园"
 zone_adeptus_mechanicus_desc: "这片园地创新地使用了适配机器的自动学习装置，用最先进的技术对机神造物进行最传统的教化。"
 zone_adeptus_mechanicus_ark: "$zone_adeptus_mechanicus$"
