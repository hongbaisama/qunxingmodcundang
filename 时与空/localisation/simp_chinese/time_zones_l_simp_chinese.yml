 zone_time_ruin_cosmogenesis_world: "突触缆绳"
 zone_time_ruin_cosmogenesis_world_desc: "这些缆绳可以将多个舱室有序地连接在一起，提供了人员迁移、物资运输、信息交流、能源供应的稳定途径。"
