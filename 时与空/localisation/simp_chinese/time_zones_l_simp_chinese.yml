 zone_time_shelter_main_default: "$zone_default$"
 zone_time_shelter_main_default_desc: "$zone_default_desc$"
 zone_time_shelter_main_1: "扩容协议"
 zone_time_shelter_main_1_desc: "对彼岸与现世的维系通道进行扩容，以容纳更多工作岗位进行数据交换。"
 zone_time_shelter_main_2: "过载协议"
 zone_time_shelter_main_2_desc: "对彼岸与现世的维系通道进行过载，令工作岗位能以更高效率完成通讯。"
 zone_time_shelter_main_3: "备份协议"
 zone_time_shelter_main_3_desc: "对彼岸与现世的维系通道进行备份，允许工作岗位在一定程度上自动化。"
 zone_time_shelter_main_4: "分流协议"
 zone_time_shelter_main_4_desc: "对彼岸与现世的维系通道进行分流，大幅缓解在岗工作人员的精力损耗。"
 zone_time_shelter_main_5: "压缩协议"
 zone_time_shelter_main_5_desc: "对彼岸与现世的维系通道进行压缩，腾出充裕的空间用于工作人员休憩。"
 zone_time_shelter_resource: "开拓者兵团"
 zone_time_shelter_resource_desc: "成立一支兵团，并于彼岸开拓新的领土。"
 zone_time_shelter_manufacturing: "铸星者企划"
 zone_time_shelter_manufacturing_desc: "发起一场企划，将彼岸重塑为理想的家园。"
 zone_time_shelter_unity: "思考者结社"
 zone_time_shelter_unity_desc: "缔造一处结社，旨在对彼岸本身进行思考。"
 zone_time_shelter_research: "求真者秘会"
 zone_time_shelter_research_desc: "组建一个秘会，探究彼岸的法则与真理。"