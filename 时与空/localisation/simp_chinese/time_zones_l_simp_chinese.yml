 zone_adeptus_mechanicus_resort_desc: "$zone_adeptus_mechanicus_desc$"
 
 zone_noah_ark_civilian: "诺亚乐园"
 zone_noah_ark_civilian_desc: "这座乐园以诺亚为名，在促进生产增效与经济增长的同时，将所有乘员紧密地连接在了一起。"
 zone_noah_ark_science: "诺亚大学"
 zone_noah_ark_science_desc: "这座大学以诺亚为名，其培养的高质量人才用观察、实验与数据，把外面的大千世界完美地展现在我们眼前。"
 
 zone_monster_hunter: "集狩区"
 zone_monster_hunter_desc: "猎人们成群结队地进入集狩区，这已经成为了一项传统。而在捕猎之前，猎人们的武器与装备需要得到最优质的保养。"
