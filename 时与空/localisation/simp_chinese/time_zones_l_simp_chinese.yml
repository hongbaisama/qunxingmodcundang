l_simp_chinese:
 zone_akx_worm: "视界领域"
 zone_akx_worm_desc: "借助密铺微型奇点，这片领域拥有与黑洞视界相似的性质。"
 zone_akx_worm_requires_capital: "§R警告：该£zone 区划特化仅在首都生效§!"
 zone_worm_black_hole: "视界观测场"
 zone_worm_black_hole_desc: "通过接收中央视界表层裂隙扩散出的粒子束，我们可以拼凑出黑洞内的部分信息，并得以观测奇点。"
 
 zone_time_default: "$zone_default$"
 zone_time_default_desc: "$zone_default_desc$"
 zone_time_urban: "$zone_urban$"
 zone_time_urban_desc: "$zone_urban_desc$"
 zone_time: "凝滞力场"
 zone_time_desc: "时空在此处凝滞，并以永恒的跨度将秩序一点一点向外辐射。"
 zone_time_requires_tech: "$physics_research_icon_with_space$$tech_time_blocker_1$"
 
 zone_time_physics: "调零者次元"
 zone_time_physics_desc: "这是调零者生活与工作所处的视界，零点与逆熵是此处稳定常态。"
 zone_time_physics_requires_tech: "['concept_zone_time_physics_requires_tech']"
 
 zone_time_society: "逐光者次元"
 zone_time_society_desc: "这是逐光者生活与工作所处的视界，躯壳与灵魂在此处没有界限。"
 zone_time_society_requires_tech: "['concept_zone_time_society_requires_tech']"
 
 zone_time_engineering: "驱影者次元"
 zone_time_engineering_desc: "这是驱影者生活与工作所处的视界，粒子与波动于此处失去意义。"
 zone_time_engineering_requires_tech: "['concept_zone_time_engineering_requires_tech']"
 
 zone_gas_energy: "气态发电"
 zone_gas_energy_desc: "集中利用气态层级中的放电现象，为我们的向上求索提供动力。"
 zone_gas_energy_physics: "气态研究支援"
 zone_gas_energy_physics_desc: "侧重于解析气态层级中的放电现象，我们的物理学家就能在无知的黑夜中点亮光明。"
 zone_gas_minerals: "固态提取"
 zone_gas_minerals_desc: "固态外壳与气态涡流的屏障下，钻头在啃食着富饶的矿藏，源源不断地输出工业的血液。"
 zone_gas_minerals_engineering: "固态研究支援"
 zone_gas_minerals_engineering_desc: "稳定的矿藏供应，无论是固态的还是流体的，我们的工程学家能以别人想都不敢想的速度进行实验。"
 zone_gas_food: "液态聚焦"
 zone_gas_food_desc: "大片的生物工程作物在液态的繁育池泛起波浪，养活了这个不断增长的帝国。"
 zone_gas_food_biology: "液态研究支援"
 zone_gas_food_biology_desc: "通过从液态培养舱合成有机材料，我们的实验速度和质量都大大提高了。"
 
 zone_psionic_energy: "冥想发电"
 zone_psionic_energy_desc: "集中利用冥想时产生的能量波动，为我们的向上求索提供动力。"
 zone_psionic_energy_physics: "冥想研究支援"
 zone_psionic_energy_physics_desc: "侧重于解析冥想时产生的能量波动，我们的物理学家就能在无知的黑夜中点亮光明。"
 zone_psionic_minerals: "传送提取"
 zone_psionic_minerals_desc: "现实与虚境的交界处，小型传送门此起彼伏地开闭，源源不断地输出工业的血液。"
 zone_psionic_minerals_engineering: "传送研究支援"
 zone_psionic_minerals_engineering_desc: "稳定的物资供应，无论是和平的还是武力的，我们的工程学家能以别人想都不敢想的速度进行实验。"
 zone_psionic_food: "祭祀聚焦"
 zone_psionic_food_desc: "大片的祭坛从虚境生物借来了口粮，养活了这个不断增长的帝国。"
 zone_psionic_food_biology: "祭祀研究支援"
 zone_psionic_food_biology_desc: "通过从邻近的祭坛祈求有机材料，我们的实验速度和质量都大大提高了。"
 
 zone_nanites_energy: "供能发电"
 zone_nanites_energy_desc: "集中利用星球核心的热能，为我们的向上求索提供动力。"
 zone_nanites_energy_physics: "供能研究支援"
 zone_nanites_energy_physics_desc: "侧重于解析星球核心的热能，我们的物理学家就能在无知的黑夜中点亮光明。"
 zone_nanites_minerals: "采集提取"
 zone_nanites_minerals_desc: "流动的大气与漂浮的尘埃中，回收小组采集着每一份废料，源源不断地输出工业的血液。"
 zone_nanites_minerals_engineering: "采集研究支援"
 zone_nanites_minerals_engineering_desc: "稳定的资源供应，无论是制造的还是回收的，我们的工程学家能以别人想都不敢想的速度进行实验。"
 
 zone_praise_the_sun: "日轮祭坛"
 zone_praise_the_sun_desc: "在这座最接近太阳的祭坛上，滚烫的日晷与炽热的心灵造就了对无私恒星的无限赞颂。"
 
 zone_time_ruin_cosmogenesis_world_main: "$zone_default$"
