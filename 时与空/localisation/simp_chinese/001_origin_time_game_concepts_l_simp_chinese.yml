 concept_black_hole_physicist_desc: "[black_hole_physicist.GetNamePlural]是一种产出$i_energy$、$i_consumer_goods$和$i_physics$的复合岗位，并被同时视作§I$job_technician$§!、§I$job_artisan$§!与§I$job_physicist$§!岗位。\n\n转化比例：\n§I无§!→4$i_energy$\n1$i_minerals$+1$i_food$→2$i_consumer_goods$\n1$i_energy$+0.5$i_consumer_goods$+0.25$i_alloys$→2$i_physics$\n\n§L$job_black_hole_physicist_desc$§!"
 
 concept_black_hole_biologist: "$job_black_hole_biologist_plural$"
 concept_black_hole_biologist_desc: "[black_hole_biologist.GetNamePlural]是一种产出$i_food$、$i_unity$和$i_society$的复合岗位，并被同时视作§I$job_farmer$§!、§I$job_bureaucrat$§!与§I$job_biologist$§!岗位。\n\n转化比例：\n§I无§!→4$i_food$\n0.5$i_consumer_goods$+0.5$i_alloys$→2$i_unity$\n1$i_food$+0.5$i_consumer_goods$+0.25$i_alloys$→2$i_society$\n\n§L$job_black_hole_biologist_desc$§!"
 
 concept_black_hole_engineer: "$job_black_hole_engineer_plural$"
 concept_black_hole_engineer_desc: "[black_hole_engineer.GetNamePlural]是一种产出$i_minerals$、$i_alloys$和$i_engineering$的复合岗位，并被同时视作§I$job_miner$§!、§I$job_foundry$§!与§I$job_engineer$§!岗位。\n\n转化比例：\n§I无§!→4$i_minerals$\n1$i_energy$+1$i_minerals$→2$i_alloys$\n1$i_minerals$+0.5$i_consumer_goods$+0.25$i_alloys$→2$i_engineering$\n\n§L$job_black_hole_engineer_desc$§!"
 
 concept_time_recursioner: "$job_time_recursioner_plural$"
 concept_time_recursioner_desc: "[time_recursioner.GetNamePlural]是一种产出$i_energy$、$i_minerals$、$i_food$、$i_consumer_goods$、$i_alloys$、$i_unity$和$i_research$的复合岗位，并被同时视作§I$job_technician$§!、§I$job_miner$§!、§I$job_farmer$§!、§I$job_artisan$§!、§I$job_foundry$§!、§I$job_bureaucrat$§!与§I研究§!岗位。\n\n转化比例：\n§I无§!→2$i_energy$+2$i_minerals$+2$i_food$\n0.5$i_minerals$+0.5$i_food$→1$i_consumer_goods$\n0.5$i_energy$+0.5$i_minerals$→1$i_alloys$\n0.25$i_consumer_goods$+0.25$i_alloys$→1$i_unity$\n0.5$i_energy$+0.25$i_consumer_goods$+0.125$i_alloys$→1$i_physics$\n0.5$i_food$+0.25$i_consumer_goods$+0.125$i_alloys$→1$i_society$\n0.5$i_minerals$+0.25$i_consumer_goods$+0.125$i_alloys$→1$i_engineering$\n\n§L$job_time_recursioner_desc$§!"
 
