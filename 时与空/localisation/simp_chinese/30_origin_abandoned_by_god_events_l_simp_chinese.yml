l_simp_chinese:
 origin_abandoned_by_god.4.name:0 "复仇之时"
 origin_abandoned_by_god.4.desc:0 "终于，复仇的时刻到了。\n\n数百年前遭受的屈辱历史，我们永远不会遗忘。现如今，我们将亲手撕开虚境的大门，让狂妄的神明清楚，谁才是愚昧的玩物。"
 origin_abandoned_by_god.4.a:0 "我们不会再被任何人抛弃。"
 
 crisis.4140.abandoned_by_god.desc:0 "这还只是我们复仇之路的第一步。\n\n在过去的几年里，我们曾不止一次地问自己：是神明给了我们一切，又由祂一一夺走，我们的复仇是否正义？这个问题，我们暂时无法回答，但我们不会停下复仇的脚步，因为我们总会找到答案。"
 crisis.4145.abandoned_by_god.desc:0 "[Root.GetName]不会被击败。我们对§H复仇§!的渴望也绝不改变。深植于心中对于扩张的动力与渴求渗透到了社会的每个角落，在战斗能力与科学进步方面带来了出人意料的惊人进展，到达了我们从未预料的层面。\n\n在如同[Root.GetName]的意志一般团结的整体面前，即使是曾经的神明也会为之震撼吧？"
 crisis.4150.abandoned_by_god.desc:0 "随着时光流逝，信念之火也在每个[Root.GetSpeciesName]之中以不可动摇的决心被传开。我们的疆域不断扩大，我们所投入的力量也是如此。\n\n当遇到其他帝国的时候，我们会给他们两个选择：要么完全效忠，要么选择灭亡。当然，这是在我们会给他们选择的前提下。\n\n不管怎样，[Root.GetName]正继续扩张，扩张直至§H神明§!的领地！"
 crisis.4155.abandoned_by_god.desc:0 "一项剧烈的变化正在到来。[Root.GetName]已经马上快要实现我们的宏大目标了。每个[Root.GetSpeciesName]都发自心底地感受到了——§H复仇之时§!正逐渐逼近。\n\n我们仍然可以从我们的经历，不，应该说是我们的历史——接受神明眷顾的历史中学到有关征服敌人，统治这个混乱不堪星河的新方法。\n\n当然了，那些胆敢与我们作对的势力所做的一切努力都将化为徒劳，哪怕是§H神明§!！"
 
 crisis.6000.abandoned_by_god.desc:0 "我们建造的宏伟的§H以太相引擎§!框架已经围绕我们母星系的恒星安置就位。这座巨型结构，一旦完工，将撕开位于我们位面和虚境之间的薄幕。\n\n我们不必再忍受作为玩物的屈辱历史，在一颗小球上苟延残喘——实际上，我们将成群结队地，如同征服者一般跨越这道天堑。现实将任我们的喜好被随意地改造，§H神明§!的地位也将被我们撼动。"
 crisis.6000.abandoned_by_god:0 "昔日的神明，别来无恙。"
 crisis.6050.abandoned_by_god.desc:0 "我们正屹立于卑微存在的巅峰。以太相引擎完成了，我们将重新定义谁才是卑微的§H玩物§!。\n\n当引擎启动的时候，引发的亚空间反作用将会引爆星系内的每一颗恒星。遍布星系的所有生命体都会被抹除，但彼时我们早已安全地离开了这片凡世之地，重返存在的更高位面，时间在那里已经失去意义，宇宙的一丝一缕都将随我们的喜好任意改动。\n\n§H神明在恐惧，而我们在呐喊。§!"
 crisis.6050.abandoned_by_god:0 "复仇没有理由，只因你太弱小了。"
 crisis.6050.abandoned_by_god.tooltip:0 "我们将与神明展开最后的决战，但结局的胜负已没有人能够记录。\n\n§Y星系毁灭了。§!"