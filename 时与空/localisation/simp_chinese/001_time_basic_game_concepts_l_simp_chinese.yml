 concept_time_ruler_trait_red: "§R$concept_time_ruler_trait$§!"
 concept_time_ruler_trait: "起源统治者特质"
 concept_time_ruler_trait_desc: "这是§H时与空§!模组起源专属的统治者§d命定特质§!，只有对应起源的§Y统治者§!或§Y继承人§!才可获取，并且仅作为§Y统治者§!时方可§G生效§!。\n\n此类特质的加成数值一般与§Y$MOD_LEADER_SKILL_ADD$§!、§Y$MOD_COUNCILOR_SKILL_ADD$§!、§Y$MOD_RULER_SKILL_ADD$§!有关。"
 
 concept_time_node_trait_green: "§G$concept_time_node_trait$§!"
 concept_time_node_trait_red: "§R$concept_time_node_trait$§!"
 concept_time_node_trait: "起源节点特质"
 concept_time_node_trait_desc: "这是§H时与空§!模组起源专属的节点§d命定特质§!，只有对应起源的§Y格式塔节点§!才可获取，并且仅作为§Y格式塔节点§!时方可§G生效§!。\n\n此类特质的加成数值一般与§Y有效节点技能等级§!、§Y$MOD_COUNCILOR_SKILL_ADD$§!有关。"
 
 concept_time_inborn_legendary_trait: "§l传奇英杰专属特质§!"
 concept_time_inborn_legendary_trait_desc: "这是§H时与空§!模组为所有§l传奇英杰§!（包含其它模组）添加的§d命定特质§!，但通过['concept_origin_legendary_worship']起源晋升而来的领袖并不会获得此特质。\n\n此特质的加成侧重与§Y领袖老练级§!有关，加成数值与§Y$MOD_LEADER_SKILL_ADD$§!有关，且['concept_origin_legendary_worship']起源会使此特质效果§G翻倍§!。"
 
 concept_time_inborn_renowned_trait: "§r著名英杰专属特质§!"
 concept_time_inborn_renowned_trait_desc: "这是§H时与空§!模组为所有§r著名英杰§!（包含其它模组）添加的§d命定特质§!，但通过['concept_origin_legendary_worship']起源晋升而来的领袖并不会获得此特质。\n\n此特质的加成侧重与§Y领袖老练级§!有关，加成数值与§Y$MOD_LEADER_SKILL_ADD$§!有关，且['concept_origin_legendary_worship']起源会使此特质效果§G翻倍§!。"
 
 concept_akx_messenger_species_trait: "信使特质"
 concept_akx_messenger_species_trait_desc: "信使也许是他们的先祖，或许是他们的未来，但无论如何，该物种已经接受了这一现实，并积极享受着信使血脉带来的优势。\n\n$concept_akx_messenger_species_trait$：\n$t$['concept_trait_akx_messenger']\n$t$['concept_trait_akx_waiting_world_all']"
 
