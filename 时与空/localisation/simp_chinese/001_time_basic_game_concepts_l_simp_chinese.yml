 concept_building_akx_monument_decay_white: "§W$concept_building_akx_monument_decay$§!"
 concept_building_akx_monument_decay: "负相记忆紊乱"
 concept_building_akx_monument_decay_desc: "同时对负相位面进行高频、大量的记忆可能导致严重的负相紊乱，并阻碍我们对负相的深入。\n\n为了避免潜在的灾害，每个£building §Y$building_horror_monument$系列建筑§!会平分对星球的加成。"
 
