l_simp_chinese:
 # 负相时空
 concept_horror_time: "§M负相时空§!"
 concept_horror_time_desc: "§M负相时空§!是一类神秘科技的统称，它们主要来自于我们对§M负相位面§!的研究。尽管其依据与结果可能大相径庭，但这就是§M负相位面§!的真实所在。\n\n§M负相时空§!是一类特殊的科技，它永远不会自然出现，但每次完成研究后，都有可能获得满足条件的科技选项。\n激活§Y$r_horror_matter$§!、激活§Y$r_time$§!、任命['concept_has_horror_time_knowledge']的领袖进行研究、提高['concept_category_horror_time_draw_chance_mult']等，都能§G提高§!获得研究选项的§Y概率§!。"
 
 concept_has_horror_time_knowledge: "拥有负相知识"
 concept_has_horror_time_knowledge_desc: "这代表着该领袖对['concept_horror_time']拥有一定独到的知识。\n\n该领袖需满足以下条件之一：\n—获悉了任意§Y负相奥秘§!\n—经历过§Y黑洞穿行§!\n—拥有§Y$leader_trait_time_soul$§!特质\n—拥有['concept_leader_trait_equinox_seal']特质\n—拥有§Y$leader_trait_horror_focus$§!特质\n—拥有§Y$leader_trait_expertise_horror_time$§!特质\n—拥有§Y$leader_trait_dimensional_horror_weapon_specialization$§!特质\n—拥有§Y界旅者命定特质§!\n—拥有§Y$leader_trait_dimension_traveler_brief$§!特质"
 
 concept_category_horror_time_research_speed_mult_white: "§W研究速度（§Y负相时空§!）§!"
 concept_category_horror_time_research_speed_mult: "研究速度（负相时空）"
 concept_category_horror_time_research_speed_mult_desc: "这代表着我们对['concept_horror_time']的掌握程度，能§G加快§!我们对相关领域科技的§Y研究速度§!，也能§G减少§!相关议程的§Y推行需求§!。"
 
 concept_category_horror_time_draw_chance_mult_white: "§W§Y负相时空§!选项的概率§!"
 concept_category_horror_time_draw_chance_mult: "负相时空选项的概率"
 concept_category_horror_time_draw_chance_mult_desc: "这代表着我们对['concept_horror_time']的了解程度，能§G提高§!获得相关领域科技选项的§Y概率§!。"
 
 concept_can_approach_black_hole: "触及视界边缘"
 concept_can_approach_black_hole_desc: "这代表着该领袖拥有靠近黑洞工作的能力，可以执行其它常规领袖无法完成的任务。\n\n该领袖需满足以下条件之一：\n—物种拥有['concept_trait_time']特质\n—物种拥有['concept_trait_time_soul']特质\n—物种拥有['concept_trait_origin_black_hole']特质\n—物种拥有['concept_trait_dimension_traveler']特质\n—物种拥有['concept_trait_akx_messenger']特质\n—物种拥有['concept_trait_akx_waiting_world_all']特质\n—物种拥有['concept_tech_time_trait']\n—领袖['concept_has_horror_time_knowledge']"
 
 # 终末行舟
 databank_time_titan: "终末行舟"
 
 concept_time_titan_desc: "终末行舟的数据库显示，本有数量众多的终末行舟参与了逃亡计划，但大多都因无可避免的命运而陨落，仅有极少数成功地抵达了不同的位面，而被我们的宇宙所接纳的仅有这一艘。\n\n终末行舟的建造不是批量的，取决于设计者与组装者的能力，不同的终末行舟所能发挥的实力也有所差异——换言之，每艘终末行舟都是独一无二的。\n\n"
 
 concept_exceptional_time_titan_color: "§3$concept_exceptional_time_titan$§!"
 concept_exceptional_time_titan: "$exceptional$"
 concept_exceptional_time_titan_desc: "$concept_time_titan_desc$$concept_exceptional_time_titan_color$稀有度导致：\n$t$终末行舟组件升级效果：§G+100%§!\n$t$彼岸庇护所最终产出：§G+100%§!"
 
 concept_epic_time_titan_color: "§2$concept_epic_time_titan$§!"
 concept_epic_time_titan: "$epic$"
 concept_epic_time_titan_desc: "$concept_time_titan_desc$$concept_epic_time_titan_color$稀有度导致：\n$t$终末行舟组件升级效果：§G+80%§!\n$t$彼岸庇护所最终产出：§G+80%§!"
 
 concept_rare_time_titan_color: "§1$concept_rare_time_titan$§!"
 concept_rare_time_titan: "$rare$"
 concept_rare_time_titan_desc: "$concept_time_titan_desc$$concept_rare_time_titan_color$稀有度导致：\n$t$终末行舟组件升级效果：§G+40%§!\n$t$彼岸庇护所最终产出：§G+40%§!"
 
 concept_common_time_titan_color: "§0$concept_common_time_titan$§!"
 concept_common_time_titan: "$common$"
 concept_common_time_titan_desc: "$concept_time_titan_desc$$concept_common_time_titan_color$稀有度导致：\n$t$终末行舟组件升级效果：§Y+0%§!\n$t$彼岸庇护所最终产出：§Y+0%§!"
 
 concept_time_titan_best_status_color: "§M$concept_time_titan_best_status$§!"
 concept_time_titan_best_status: "命定循环"
 concept_time_titan_best_status_desc: "终末行舟由身为明日船长的界旅者驾驶，她将为我们打破命定的终末循环。\n\n$concept_time_titan_best_status_color$状态导致：\n$t$$unlock_time_titan_component_upgrade$\n$t$终末行舟组件生效倍率：§Y100%§!\n$t$终末行舟诅咒生效倍率：§R0%§!"
 
 concept_time_titan_good_status_color: "§H$concept_time_titan_good_status$§!"
 concept_time_titan_good_status: "未来偏航"
 concept_time_titan_good_status_desc: "终末行舟由明日船长驾驶，通往终末的未来就此偏航。\n\n$concept_time_titan_good_status_color$状态导致：\n$t$终末行舟组件生效倍率：§Y100%§!\n$t$终末行舟诅咒生效倍率：§R0%§!"
 
 concept_time_titan_normal_status_color: "§B$concept_time_titan_normal_status$§!"
 concept_time_titan_normal_status: "因果庇佑"
 concept_time_titan_normal_status_desc: "终末行舟由界旅者驾驶，交织的因果于终末中取得庇佑。\n\n$concept_time_titan_normal_status_color$状态导致：\n$t$终末行舟组件生效倍率：§Y50%§!\n$t$终末行舟诅咒生效倍率：§R0%§!"
 
 concept_time_titan_bad_status_color: "§R$concept_time_titan_bad_status$§!"
 concept_time_titan_bad_status: "终末诅咒"
 concept_time_titan_bad_status_desc: "终末行舟未由合适的指挥官驾驶，终末的诅咒正逐渐将其腐蚀。\n\n$concept_time_titan_bad_status_color$状态导致：\n$t$终末行舟组件生效倍率：§Y0%§!\n$t$终末行舟诅咒生效倍率：§R100%§!"
 
 concept_time_shelter_maintenance_white: "§W$concept_time_shelter_maintenance$§!"
 concept_time_shelter_maintenance_yellow: "§Y$concept_time_shelter_maintenance$§!"
 concept_time_shelter_maintenance: "彼岸维系度"
 concept_time_shelter_maintenance_desc: "彼岸并非终末行舟的内部空间，而是借助终末行舟扭曲奇点可以抵达的不计其数的混沌之一。因此，彼岸与现世的物质交换与信息流通必须依靠专门的设施维持，该维持效率即为彼岸维系度。\n\n提高彼岸维系度可以令彼岸庇护所§Y产出的资源§!与§Y提供的修正§!更§G完整§!地增益于我们的帝国。\n\n§Y$concept_time_shelter_maintenance$§!无法超过['concept_time_shelter_maintenance_cap']"
 
 concept_time_shelter_maintenance_cap_white: "§W$concept_time_shelter_maintenance_cap$§!"
 concept_time_shelter_maintenance_cap: "彼岸维系度上限"
 concept_time_shelter_maintenance_cap_desc: "现世与彼岸的维系效率并非无上限，这受我们的维系设施性能与彼岸的总体环境影响。\n\n['concept_time_shelter_maintenance']无法超过§Y$concept_time_shelter_maintenance_cap$§!"
 
 # 位面之鳞
 concept_dimensional_horror_damage_reduction: "位面之鳞"
 concept_dimensional_horror_damage_reduction_desc: "位面之魇通体覆盖诡异的位面之鳞，其引发的时空扭曲可以为其抵御绝大多数受到的伤害。\n\n§Y$dimensional_horror_voidworms$§!会因$FE_DIFFICULTY$至多产生：\n$t$—$MOD_SHIP_DAMAGE_REDUCTION_MULT$：§G+10%§!\n\n§Y$dimensional_horror$§!会因$FE_DIFFICULTY$至多产生：\n$t$—$MOD_SHIP_DAMAGE_REDUCTION_MULT$：§G+25%§!\n\n§Y$dimensional_horror_crisis$§!会因$FE_DIFFICULTY$至多产生：\n$t$—$MOD_SHIP_DAMAGE_REDUCTION_MULT$：§G+50%§!\n\n§Y$dimensional_horror_destiny$§!会因$FE_DIFFICULTY$至多产生：\n$t$—$MOD_SHIP_DAMAGE_REDUCTION_MULT$：§G+100%§!\n\n§R该部件装配于位面之魇以外的舰船时不会产生上述效果！§!"
 
 # 负相武器负面概率
 concept_horror_weapon_debuff_chance: "负相武器负面概率"
 concept_horror_weapon_debuff_chance_short: "概率"
 concept_horror_weapon_debuff_chance_desc: "研究£physics ['concept_tech_horror_focus_1']科技后，绝大多数负相武器可以造成['concept_confusion']或['concept_terrify']，其施加负面效果的概率受到以下影响：\n$t$—拥有['concept_ap_horror']飞升：§G×2§!\n$t$—拥有['concept_ap_time']飞升：§G×1.5§!\n$t$—装配于['concept_biological_ship']或['concept_space_fauna']：§R×0.5§!"
 
