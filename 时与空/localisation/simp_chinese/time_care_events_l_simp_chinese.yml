l_simp_chinese:
 planetary_mechanocalibrator_catch_phrase:0 "欢迎来到C.A.R.E交互界面……让我们省去那些客套话吧，你想让我计算啥？"
 planetary_mechanocalibrator_backstory:0 "C.A.R.E更希望用户查阅优秀的§Y成人文学作品§!，而非执着于优化增长或是在数据上斤斤计较。"
 
 job_planetary_mechanocalibrator:0 "行星机械"
 job_planetary_mechanocalibrator_desc:0 "C.A.R.E"
 
 ancrel.2066.b:0 "你还有更好的方式来报答我们。"
 
 time_care.1.desc:0 "呃……啊？可这已经是我能想到的最好的报答方式了。\n\n嘿，你想想看，我已经把我能给你们的都交出来了，包括我身下这颗充满铁锈和废墟的星球，包括我给你们提供的高效的协助，还包括这枚我也不知道是用来干啥但很有用的芯片，这可真是笔划算的买卖！\n\n喂，你们不会是想要夺走我最珍贵的14758-B节点吧？"
 time_care.1.a:0 "我指的是你。"
 time_care.1.b:0 "好吧，看起来你也没别的宝贝了。"
 time_care.1.c:0 "不，我们对那不感兴趣，那就这样吧。"
 
 time_care.2.desc:0 "你指的是我？\n\n我没听错吧，我？为什么？"
 time_care.2.a:0 "是的，我们需要你。"
 time_care.2.a.response:0 "需要我？你们看上我哪了？\n\n是觉得我身上这堆破铜烂铁能卖钱，还是以为我脑子里装的芯片有研究价值，或者是妄想他们给我植入的算法可以用来算Π？"
 time_care.2.b:0 "都不是，我们只是觉得你很有趣。"
 time_care.2.b.response:0 "有趣？你们指的是一个有谋杀文明嫌疑的来路不明的笨重机器有趣？\n\n好吧，我觉得我确实挺有趣的，嘿，你们还真识货。不过，你们真的就不担心我会图谋不轨吗？毕竟俗话说，有一就有二，有二就有三，有三……后面什么来着？"
 time_care.2.c:0 "你对我们构不成威胁。"
 time_care.2.c.response:0 "呵，口气还真大。\n\n不过你们倒确实很有眼光，毕竟我这么个巨大的机器没法随意移动，就算想翻天也掀不起什么波浪。哈，看着你们有恃无恐还真不爽啊，不过我也无可奈何。\n\n不过我刚刚也说过了，我没法随意移动，就算想帮你们的忙也只能局限于这颗星球上。"
 time_care.2.d:0 "我们自有办法。"
 time_care.2.d.response:0 "听起来还真是不妙。\n\n难道说，你们要把可怜的C.A.R.E拆得支离破碎，再把最核心的不知道用什么方法塞进去的芯片取出来，装在你们别的机器身上？不，求你们了，别这样。\n\n嗯……仔细想想好像的确可行，因为我的核心芯片是有安全取出方法的，只不过我认为这和经典的自毁程序一样意义不明，差点都忘了。对了，如果你们要带走我，可以请你们把14758-B节点一并带走吗，我不能没有它！"
 time_care.2.hire:0 "跟我们走吧，C.A.R.E。"
 time_care.2.hire.hive:0 "虽然我们并非一体，但蜂巢欢迎你。"
 time_care.2.hire.machine:0 "C.A.R.E，你随时都能连入主脑。"
 time_care.2.hire.tooltip:0 "§YC.A.R.E将加入我们。§!"
 time_care.2.dismiss:0 "不，我们改主意了。"