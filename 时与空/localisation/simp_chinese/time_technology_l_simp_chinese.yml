 # 终焉宣告
 
 tech_dimensional_horror_crisis_storm_protection_level_1:0 "负相导流"
 tech_dimensional_horror_crisis_storm_protection_level_1_desc:0 "撕开一道通往负相位面的缺口，通过导流效应影响终焉宣告的能量分布，以避免大规模的损伤。"
 tech_dimensional_horror_crisis_storm_protection_level_2:0 "负相屏障"
 tech_dimensional_horror_crisis_storm_protection_level_2_desc:0 "展开一面负相物质构成的屏障，将重要设备与终焉宣告在时空上相隔绝，以减少大规模的损伤。"
 tech_dimensional_horror_crisis_storm_protection_level_3:0 "负质量陷阱"
 tech_dimensional_horror_crisis_storm_protection_level_3_desc:0 "制造一个负质量陷阱，吸收难以阻断的终焉物质流，确保一定程度的安全性。"
 tech_dimensional_horror_crisis_storm_protection_level_4:0 "负能量褶皱"
 tech_dimensional_horror_crisis_storm_protection_level_4_desc:0 "形成一处负能量褶皱，折射难以迟滞的终焉能量流，确保一定程度的稳定性。"
 tech_dimensional_horror_crisis_storm_protection_level_5:0 "正相时空场"
 tech_dimensional_horror_crisis_storm_protection_level_5_desc:0 "利用星界物质创造一片覆盖全国的正相时空场，使其与终焉宣告的时空扭曲效应在一定程度上相抵消。"
 
 tech_dimensional_horror_crisis_storm_protection_building_1:0 "负声波通讯"
 tech_dimensional_horror_crisis_storm_protection_building_1_desc:0 "以负相物质作为声波传导介质，使在终焉宣告期间的远距离通讯成为可能。"
 tech_dimensional_horror_crisis_storm_protection_building_2:0 "负维度存储"
 tech_dimensional_horror_crisis_storm_protection_building_2_desc:0 "以负相位面作为物资存储容器，以腾出更多的空间安置终焉宣告中的难民。"
 tech_dimensional_horror_crisis_storm_protection_building_3:0 "负基质改造"
 tech_dimensional_horror_crisis_storm_protection_building_3_desc:0 "将负相物质用于环境改造的基质，在终焉宣告笼罩下的世界创建一片安居地。"
 tech_dimensional_horror_crisis_storm_protection_building_4:0 "负生命备份"
 tech_dimensional_horror_crisis_storm_protection_building_4_desc:0 "将负相位面用于生命备份的场所，可弥补终焉宣告对宝贵生产力造成的损失。"
 tech_dimensional_horror_crisis_storm_protection_building_5:0 "逆循环回溯"
 tech_dimensional_horror_crisis_storm_protection_building_5_desc:0 "利用星界物质将部分时空的逆循环回溯，推迟并加快终焉宣告造成的影响，令其冲突而无效化。"
 
 tech_dimensional_horror_crisis_storm_protection_component_1:0 "负作用引擎"
 tech_dimensional_horror_crisis_storm_protection_component_1_desc:0 "以负相物质间的相互作用力作为推进原理，无规律的运动轨迹甚至能规避终焉宣告的轰击。"
 tech_dimensional_horror_crisis_storm_protection_component_2:0 "负叠加设备"
 tech_dimensional_horror_crisis_storm_protection_component_2_desc:0 "借助负相物质将不同时空进行反方向叠加，允许舰船在危急时刻修改自身坐标至安全区域。"
 tech_dimensional_horror_crisis_storm_protection_component_3:0 "负势能护盾"
 tech_dimensional_horror_crisis_storm_protection_component_3_desc:0 "将负相物质具备的负势能在瞬间释放，以抵御终焉宣告的能量扰动。"
 tech_dimensional_horror_crisis_storm_protection_component_4:0 "负阻力装甲"
 tech_dimensional_horror_crisis_storm_protection_component_4_desc:0 "借助负相物质的负阻力特性加固装甲，可以偏转不致命的武器攻击。"
 tech_dimensional_horror_crisis_storm_protection_component_5:0 "非因果核心"
 tech_dimensional_horror_crisis_storm_protection_component_5_desc:0 "利用星界物质颠倒因果的先后顺序，使终焉宣告的危害脱离时空而遭到抹除。"