 tech_time_hide:0 "时与空：隐藏科技"
 tech_time_hide_desc:0 "时与空模组用于隐藏某些东西的前置科技，你不应该见到它。"
 
 tech_horror_focus_1:0 "光子弦共振"
 tech_horror_focus_1_desc:0 "通过对位面之魇神经传导机制的研究，我们现在可以利用弦共振效应操纵敌方舰船的光子信号，并藉此篡夺指挥权。"
 tech_horror_focus_1_effect:0 "§H解锁特性：§!负相武器可以造成['concept_confusion']或['concept_terrify']"
 tech_horror_focus_2:0 "负相体重塑"
 tech_horror_focus_2_desc:0 "我们的躯体远非最完美的形态，为了与负相位面更加契合，我们亟需对其重塑。"
 tech_horror_focus_2_effect:0 "['concept_tech_time_trait']点数花费：§G-1§!\n§H解锁特性：§!移除['concept_tech_time_trait']"
 
 tech_coils_god_1:0 "神之圆环"
 tech_coils_god_1_desc:0 "我们从一个前超光速文明处发现了此物，上面刻着：“给予迷失者的教训”。\n这似乎就是一个普通的圆，但能从中感受到奇特的能量，不过或许只是心理作用。"
 tech_coils_god_2:0 "神之圆环"
 tech_coils_god_2_desc:0 "一个前超光速文明赠送了我们一份礼物，上面刻着：“赠予虔信者的宝藏”。\n这似乎就是一个普通的圆，但能从中感受到奇特的能量，不过或许只是心理作用。"
 
 tech_akx_ouroboros:0 "衔尾之蛇"
 tech_akx_ouroboros_desc:0 "衔尾之蛇象征着无限的循环，这不是结束，也不是开始。"
 
 tech_horror_titan_blueprint:0 "蓝图：未来使者"
 tech_horror_titan_blueprint_desc:0 "我们获得了终末行舟的完整掌控权，但也遗失了它的过去与未来。"
 tech_time_titan_blueprint:0 "蓝图：希望使者"
 tech_time_titan_blueprint_desc:0 "我们对负相位面的了解与日俱增，或许我们能对未来使者加以改造，以接近它原本的面貌。"
 tech_end_titan_blueprint:0 "蓝图：终末使者"
 tech_end_titan_blueprint_desc:0 "我们已深谙负相时空的奥秘，或许我们能对希望使者加以改造，以还原它最初的面貌。"
 
 tech_building_time_hotel:0 "时光之遗"
 tech_building_time_hotel_desc:0 "时光监狱的构造深深吸引住了我们的科学家，如此精妙的建筑或许很快就能由我们创造。"
 tech_time_microsingularity:0 "奇点之谜"
 tech_time_microsingularity_desc:0 "时光监狱的秘密在于墙体中所充斥的微型奇点，它们或许能在舰船的设计中派上用场。"
 tech_noah_ark:0 "诺亚再现"
 tech_noah_ark_desc:0 "根据诺亚文明的日志记载，我们也许能用我们的技术还原其真实面貌。"
 
 tech_corrupt_brain_hive_1:0 "腐化基因编辑工程"
 tech_corrupt_brain_hive_1_desc:0 "我们在挽救腐化主脑的行动上有所进展，但这仅能暂时减轻腐化的影响。如果到了最后关头，我们或许会凭借这项技术孤注一掷。"
