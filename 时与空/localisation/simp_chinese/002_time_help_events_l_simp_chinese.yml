 time_help.0.name:0 "时空之外的讯息"
 time_help.0.desc:0 "这里是§H《时与空》§!模组的内置攻略，会随着模组版本提升逐步更新。这里也可以对一些机制进行设定。\n\n建议玩家优先自行探索，以获取最好的游戏体验，也欢迎加入QQ群：§H810943193§!。\n\n如果你不希望你的非人工星球变死寂或黑洞，你可以对星球执行控制台指令\n§Yeffect set_planet_flag = can_not_be_changed_by_akx_worm§!"
 time_help.0.a:0 "界旅者事件链"
 time_help.0.b:0 "起源攻略"
 time_help.0.c:0 "控制事件内阁"
 time_help.0.other:0 "实用功能"
 time_help.0.music:0 "播放音乐"
 time_help.0.ascension_paths:0 "飞升路线"
 time_help.0.donation:0 "赞助作者"
 
 time_help.1.name:0 "界旅者事件链"
 time_help.1.desc:0 "界旅者事件链是本模组中一条内容丰富、流程极长、条件苛刻的事件链，因此，通过玩家自然探索较难以体验完整流程乃至隐藏路线，故特此制作相关攻略。"
 time_help.1.a:0 "§G时之螶：旅者§!"
 time_help.1.a.tooltip:0 "需要遇见§Y白洞§!星系"
 time_help.1.b:0 "§Y时之螶：再见§!"
 time_help.1.b.tooltip:0 "需要完成§Y超越重力§!"
 time_help.1.c:0 "§R时间原点§!"
 time_help.1.c.tooltip:0 "需要接纳§Y界旅者§!"
 time_help.1.d:0 "§M超越因果§!"
 time_help.1.d.tooltip:0 "需要抵达§Y时间原点§!"
 time_help.11.name:0 "时之螶：旅者"
 time_help.11.desc:0 "在§Y时之螶§!事件链中，触发§Y$akx.9101.name$§!事件后，研究§Y$WORM_ENTRY_POINT$§!项目前，派遣舰船进入任意§Y白洞§!星系（若为§Y$origin_white_hole$§!起源则改为进入母星系），触发§Y$DIMENSION_TRAVELER_CHAIN_1_title$§!事件链。\n\n多次分析视界信号，并成功驶入白洞。与界旅者通讯，邀请她共同离开白洞，开启§Y超越重力§!局势。\n\n在局势的最终阶段全程保持§Y开启引擎§!，且§R不批准§!界旅者的请求，完成局势，结束事件链。"
 time_help.12.name:0 "时之螶：再见"
 time_help.12.desc:0 "在白洞变成黑洞的§Y十年§!后，自动触发§Y$DIMENSION_TRAVELER_CHAIN_2_title$§!事件链。\n\n派遣舰船重返§R该星系§!，拯救并§Y接纳§!“过去”的界旅者，获得特殊领袖界旅者。"
 time_help.13.name:0 "时间原点"
 time_help.13.desc:0 "接受§Y时之螶§!的爱，通过后续系列事件开启§Y$AP_HORROR_PROJECT_1$§!、§Y$AP_HORROR_PROJECT_2$§!、§Y$AP_HORROR_PROJECT_3$§!三个特殊项目。\n\n令界旅者研究§R全部§!的§Y奥秘§!系列特殊项目，解锁['concept_policy_dimension_traveler']政策，并与“未来”的界旅者在§Y$DIMENSION_TRAVELER_TITLE$§!再见。"
 time_help.14.name:0 "超越因果"
 time_help.14.desc:0 "$normal_dimension_traveler$政策下，在§Y$DIMENSION_TRAVELER_TITLE$§!事件的数年后，根据§Y$dimension_traveler.305.name$§!事件中的选择开启§Y$DIMENSION_TRAVELER_PROJECT_END_1$§!、§Y$DIMENSION_TRAVELER_PROJECT_END_2$§!、§Y$DIMENSION_TRAVELER_PROJECT_END_3$§!中的一个特殊项目。\n\n通过多个周目，研究§R全部§!的§Y超越§!系列特殊项目，获取§R三条§!谜底并在玩家现实世界记录。"
 time_help.dimension_traveler.hide:0 "§M隐藏真结局§!"
 time_help.dimension_traveler.hide.response:0 "新的周目，在开启§Y超越重力§!局势前的§R最后一个§!事件（即§Y因果的转折点§!）中§Y暂停§!、§Y存档§!、§Y读档§!，事件内容和选项效果将发生改变，进入§Y隐藏时间线§!，并开启§Y超越因果§!局势。\n\n根据事件§Y标题§!选择对应的§Y谜底§!，完成局势，达成§M隐藏真结局§!。"
 time_help.dimension_traveler.hide.tooltip:0 "需要获取任意§Y谜底§!"
 
 time_help.100.name:0 "起源攻略"
 time_help.100.desc:0 "在这里，你可以查询部分特殊起源的游玩攻略。"
 time_help.100.a:0 "$origin_time$"
 time_help.100.b:0 "$origin_gas_colony$"
 time_help.100.c:0 "$origin_psionic$"
 time_help.100.d:0 "$origin_nanites$"
 time_help.100.e:0 "$origin_noah_ark$"
 time_help.101.name:0 "$origin_time$"
 time_help.101.desc:0 "$origin_time$起源前期建议优先推进§Y$situation_pc_time$§!局势，清理母星的障碍并升级母星的区划，并确保['concept_origin_time_chosen']始终作为国家统治者。\n\n统治者拥有['concept_leader_trait_ruler_time']特质的条件下，完成事件§Y环型神殿§!后，建造§Y$building_akx_worm_3$§!前，派遣科学官驾驶科研船进入任意§Y黑洞§!星系（存在一定条件限制），可以触发§Y$TIME_BLACK_HOLE_CHAIN_title$§!事件链，并激活§Y$situation_time_black_hole_chain$§!局势。\n\n通过清理§Y$d_time_blocker_3$§!解锁['concept_tradition_origin_time']传统，并在母星上执行§Y$decision_time$§!决议，可以进一步增强母星。\n\n通过执行§Y$decision_time$§!决议解锁['concept_ap_origin_time']飞升，并推行§Y$council_agenda_agenda_time_soul_name$§!议程，可以根据§Y飞升路线§!增强物种与领袖。"
 time_help.102.name:0 "$origin_gas_colony$"
 time_help.102.desc:0 "$origin_gas_colony$起源通过调查§Y$pc_gas_giant$§!发现异常现象§Y$gas_colony_change_categories$§!，并完成后续特殊项目，即有可能将其转变为§Y宜居的气态巨行星§!。\n\n若触发原版§Y气体人§!相关事件，会新增部分起源专属对话，根据你的选择可能获得§Y宜居的气态巨行星§!或者解锁专属§Y飞升天赋§!。"
 time_help.103.name:0 "$origin_psionic$"
 time_help.103.desc:0 "$origin_psionic$起源研究科技£society §Y$tech_terrestrial_sculpting$§!后，可将§Y九大宜居星球§!、§Y$pc_gaia$§!、§Y$pc_nuked$§!、§Y$pc_relic$§!、§Y$pc_city$§!、§Y$pc_hive$§!环境改造为§Y灵能星球§!。\n\n通过§Y灵能飞升§!，将解锁两个专属§Y星球决议§!。\n可以将§Y$normal_psionic$§!和§Y$bad_psionic$§!转变为§Y$good_psionic$§!。\n也可以将§Y$worst_psionic$§!随机转变为其它更好的灵能浪潮，但前提是不能已出现灾难预兆。\n\n§Y突入虚境§!后，将自动获得§Y$ap_become_the_crisis$§!飞升天赋。"
 time_help.104.name:0 "$origin_nanites$"
 time_help.104.desc:0 "$origin_nanites$起源研究科技£society §Y$tech_terrestrial_sculpting$§!后，可将§Y$pc_gray_goo$§!与§Y$pc_machine$§!环境改造为§Y宜居的纳米星球§!。\n\nL星门被开启后，固定出现§Y灰蛊舰队§!，你可以选择§R加入§!或者§G抵抗§!。\n若选择§R加入§!，§Y灰蛊舰队§!将成为你的友军，你将自动获得§Y$ap_become_the_crisis$§!飞升天赋，并§R向全银河宣战§!。此外，你将解锁建造灰蛊舰队的§Y星球决议§!。\n若选择§G抵抗§!，你将自动获得§Y$ap_defender_of_the_galaxy$§!飞升天赋，并获得对§Y天灾§!和§Y灰蛊舰队§!伤害增加的加成。"
 time_help.105.name:0 "$origin_noah_ark$"
 time_help.105.desc:0 "$origin_noah_ark$起源研究科技£society §Y$tech_climate_restoration$§!后，可将§Y$pc_flood$§!环境改造为§Y$pc_ocean$§!。\n\n无论通过环境改造还是盖亚播种，将母星系中的§Y$NAME_Noah_Ark_Home_Planet$§!改造为§Y$pc_gaia$§!后，将会发现新的考古遗迹。"
 
