 time_help.850.d.tooltip:0 "在所有['concept_dimensional_horror_crisis_erasured_yellow']且§Y未['concept_dimensional_horror_crisis_sealed_yellow']§!的星系获得['concept_dimensional_horror_crisis_seal_yellow']项目"
 
 time_help.900.name:0 "播放音乐"
 time_help.900.desc:0 "本模组新增了部分音乐，用于在某些事件中播放，你也随时可以通过此界面播放音乐。\n\n§R注意：§!播放音乐并不会停止上一首音乐（游戏代码限制），所以请不要同时播放多次音乐。"
