 time_help.850.name:0 "实用功能"
 time_help.850.desc:0 "这些是作者做的一些实用功能，可以解决一些强迫症问题和一些不希望出现的bug。"
 time_help.850.a:0 "主体物种迭代"
 time_help.850.a.allow.0:0 "主体物种的默认模板不能不存在或未被拥有"
 time_help.850.a.allow.1:0 "主体物种的默认模板不能已经是主要物种"
 time_help.850.a.allow.2:0 "主体物种的默认模板不能与主要物种相差甚远"
 time_help.850.a.allow.3:0 "主体物种的默认模板的人口数量应占优势"
