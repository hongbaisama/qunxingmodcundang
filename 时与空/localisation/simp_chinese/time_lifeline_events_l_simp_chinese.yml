l_simp_chinese:
 time_lifeline_categories:0 "生命线"
 time_lifeline_categories_desc:0 "我们从黑洞视界内接收到了数条神秘的讯息，根据其急促的发送频率，我们怀疑这可能是求救信号。"
 
 TIME_LIFELINE_CHAIN_title:0 "生命线"
 TIME_LIFELINE_CHAIN_desc:0 "我们收到了来自黑洞的求救信号，但求救者……在哪？"
 
 time_lifeline.name:0 "生命线"
 time_lifeline_need_short_time:0 "§G我们可能在短时间内就能再次收到求救者的通讯。§!" # 30~60天
 time_lifeline_need_some_time:0 "§Y我们可能需要一段时间才能再次收到求救者的通讯。§!" # 90~180天
 time_lifeline_need_long_time:0 "§R我们可能在很长一段时间内都不能与求救者进行通讯。§!" # 180~360天
 time_lifeline_need_unknown_time:0 "§M我们不知需要多久才能与求救者再次进行通讯。§!\n§R也许就是明天，也许直到永远。§!" # 1~720天
 
 to_be_continued:0 "§Y未完待续。§!"
 
 ################################################################
 # 阶段1
 ################################################################
 
 time_lifeline.1.desc:0 "经过分析与核实，我们可以肯定这的确是某人的求救信号，并且我们可以尝试与信号源建立联系。"
 time_lifeline.1.a:0 "立即与求救者进行通讯。"
 time_lifeline.1.b:0 "这和我们没关系，忽略信号。"
 time_lifeline.2.desc:0 "喂！嘿！能听到吗？"
 time_lifeline.2.a:0 "可以，只是没有画面。"
 time_lifeline.3.desc:0 "不好意思，我的通讯设备受到了严重的损伤，能成功发出通讯已经谢天谢地了……\n\n情况紧急，我需要你们的帮助！"
 time_lifeline.3.a:0 "你被困在黑洞里，我们也无能为力。"
 time_lifeline.3.b:0 "我们不会为渣滓提供帮助。"
 time_lifeline.3.b.response:0 "等等，渣滓是什么意……\n\n§R<通讯已切断。>§!"
 time_lifeline.4.desc:0 "黑洞？你在说什么呀，没时间开玩笑了！\n\n我的飞船坠毁在这颗星球上，于是我下了飞船准备寻找物资，却碰到了一群可怕的怪物！\n这群黑色的怪物动作缓慢，像一团浓稠的粘液，但速度却和飞一样，真不知该说是快还是慢。\n它们一看到我就朝我冲来，无论我怎么跑都无法甩开它们。\n\n就在我被逼到死路时，它们却突然一动不动，真搞不清状况。"
 time_lifeline.4.a:0 "我们似乎也对这种怪物没有任何了解。"
 time_lifeline.5.desc:0 "虽然它们就像石头一样伫立在我的前面，但我也不知道它们什么时候会突然向我发起攻击。\n所以，求求你们救我出来，我现在就连呼吸都不敢了。"
 time_lifeline.5.a:0 "很遗憾，我们也爱莫能助。"
 time_lifeline.6.desc:0 "欸？明明只要派艘飞船进来就好了，我的通讯设备应该也可以发送位置坐标给你们……\n\n不过也不能怪你们不愿意帮忙。\n那这样吧，你们告诉我，是应该趁现在赶快逃跑，还是拿点别的东西去试探它们？"
 time_lifeline.6.a:0 "趁现在赶快跑吧，不能错过时机。"
 time_lifeline.6.b:0 "贸然行动很危险，先试探一下吧。"
 time_lifeline.6.c:0 "我们不会给予你任何帮助，关闭通讯。"
 time_lifeline.6.c.response:0 "嘿，等等，你们不能……\n\n§R<通讯已切断。>§!"
 time_lifeline.7.desc:0 "好，我试试看……哇！它们突然活过来了！不要靠近我！"
 time_lifeline.7.a:0 "发生了什么？收到请回答！"
 time_lifeline.8.desc:0 "呼——我还活着，而且我还发现了它们的规律……\n\n在我保持不动的时候，它们就会被定住；只有当我开始移动时，它们才会恢复正常，真是一群诡异的怪物。\n不过就算知道了这一点，我也逃不掉了，因为一旦我跑起来，它们很快就会抓住我了！\n我现在只能坐以待毙，但值得庆幸的是，只要我没有移动，就算动作幅度大一些也不会激活它们，起码现在我可以大口呼吸了。\n\n我想我可能是没救了，虽然你没能伸出援手，但我还是感谢你能陪着我做决定。再见了，如果我能活着逃出来，希望到时候还能联系你——当然，是如果……"
 time_lifeline.8.a:0 "好吧，我期待着你的联络。"
 time_lifeline.8.b:0 "那也得等你逃出来再说，别死了。"
 
 ################################################################
 # 阶段2
 ################################################################
 
 time_lifeline.10.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者被怪物围困，虽然发现了规律，但无法逃脱。>§!"
 time_lifeline.10.a:0 "又是你，你还活着？"
 time_lifeline.11.desc:0 "是呀，真是惊险。我心想，可能没人会再来救我了，于是我就把通讯设备拆了，尝试用零件去修复我的施术单元——换个容易理解的说法，我的飞行器。\n\n虽然零件有些不匹配，但我花了一段时间后，还是让飞行器可以勉强使用了。\n于是我就嗖的一下，用比怪物还要快的速度飞出了它们的包围圈！\n但我刚飞回飞船旁边，飞行器就又坏了，恐怕一时半会是修不好了。\n\n不过飞船上还有一定的食物储备以及一个备用通讯器，在我休整之后，我就立刻用它来联系你了。\n当然，毕竟是备用的，所以压根没有影像传输功能。"
 time_lifeline.11.a:0 "你接下来打算怎么办？"
 time_lifeline.12.desc:0 "当然是寻找有用的材料来维修飞船了，毕竟飞船损坏得并不是很严重，用一些常见的材料应该就能修好了，这颗星球上肯定能找到我需要的。\n\n我观察过了，飞船周围似乎没有怪物的踪迹。\n飞船的北面是一座高耸的山峰，西边有一个巨大的湖泊，东部是一块广袤的沙漠，南方有一片茂密的森林。\n我就是从南面飞回来的，那群怪物现在可能还在里面，我可不想重新面对它们。\n\n你来决定吧，我该去哪探索？"
 time_lifeline.12.a:0 "山峰上应该会有裸露的丰富矿藏。"
 time_lifeline.12.a.response:0 "你说的有道理，希望这回我能有所收获。"
 time_lifeline.12.b:0 "去湖泊吧，说不定可以遇上当地文明。"
 time_lifeline.12.b.response:0 "真是个好主意，希望能碰上友善的原住民。"
 time_lifeline.12.c:0 "尽管可能不是个好主意，干脆去沙漠碰碰运气？"
 time_lifeline.12.c.response:0 "的确，刚听到这个回答时，我也吃了一惊。不过风险与机遇并存，我出发了！"
 
 ################################################################
 # 阶段2（山峰）
 ################################################################
 
 time_lifeline.100.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者前往山峰寻找可用的材料。>§!"
 time_lifeline.100.a:0 "可以，你到目的地了吗？"
 time_lifeline.101.desc:0 "是的，尽管途中经历了一些阻碍，但我还是平安无事地抵达了目的地。\n\n我现在位于山脚，已经做好了登山的准备。\n我可以看到，半山腰上有一大片繁盛的树林，还有一处岩石裸露的陡峭山脊，雪线以上则是白茫茫的积雪。\n远处有一大片乌云似乎正在接近，可我不能确定它会不会到我这来，但愿不会吧。\n\n我现在该做什么？"
 time_lifeline.101.a:0 "先去山上的树林看看吧。"
 time_lifeline.101.a.response:0 "我觉得那就是一片平平无奇的树林……\n不管那么多了，还是先去看看吧。"
 time_lifeline.101.b:0 "裸露的岩石中更有可能找到你需要的。"
 time_lifeline.101.b.response:0 "嗯，我也是这么想的，那我出发咯。"
 time_lifeline.101.c:0 "先在山脚周围探索吧，要是在山上遇雨会很危险。"
 time_lifeline.101.c.response:0 "你说的很对，这确实是一个稳妥的办法。"
 
 time_lifeline.110.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者前往半山腰上的树林寻找可用的材料。>§!"
 time_lifeline.110.a:0 "可以，情况怎么样？"
 time_lifeline.111.desc:0 "情况……有点不太妙。\n\n那团乌云越来越近了，并且下起了倾盆大雨。\n不仅如此，我还看见，它下的是黑色的雨！\n雨势很大，我已经看不清山脚的景象，就像被一片朦胧的雾气笼罩，仿佛下方已经完全淹没在黑色的海洋。\n\n我有一种不详的预感，直觉告诉我应该立即往山顶跑。"
 time_lifeline.111.a:0 "相信你的直觉，找条上山的路。"
 time_lifeline.111.a.response:0 "好，我的直觉很准的，等我到了山顶就跟你联络。"
 time_lifeline.111.b:0 "没什么好怕的，在附近找个避雨的地方。"
 time_lifeline.111.b.response:0 "这样真的没问题吗？\n好吧，我相信你，只是下雨罢了，没什么好怕的。\n\n等雨停了我就跟你联络。"
 
 time_lifeline.120.desc:0 "$time_lifeline.110.desc$\n\n§E<历史记录：求救者前往岩石裸露的山脊寻找可用的材料。>§!"
 time_lifeline.120.a:0 "$time_lifeline.110.a$"
 time_lifeline.121.desc:0 "$time_lifeline.111.desc$但是这里似乎有些太陡峭了，我很担心能不能爬上去。"
 time_lifeline.121.a:0 "只能选择这么做了，注意做好安全防护。"
 time_lifeline.121.a.response:0 "好，我会想办法爬上去的，等我到了山顶就跟你联络。"
 time_lifeline.121.b:0 "$time_lifeline.111.b$"
 time_lifeline.121.b.response:0 "$time_lifeline.111.b.response$"
 
 time_lifeline.130.desc:0 "$time_lifeline.110.desc$\n\n§E<历史记录：求救者在山脚附近寻找可用的材料。>§!"
 time_lifeline.130.a:0 "$time_lifeline.110.a$"
 time_lifeline.131.desc:0 "情况……有点不太妙。\n\n那团乌云越来越近了，并且下起了倾盆大雨。\n不仅如此，我还看见，它下的是黑色的雨！\n直觉告诉我，这雨很危险，所以我就立刻找了条路往山上跑。\n雨势很大，我已经看不清山脚的景象，就像被一片朦胧的雾气笼罩，仿佛下方已经完全淹没在黑色的海洋。\n\n我确信这雨真的很危险，而且这团乌云正追着我不放！我明白我得朝山顶走，但我是匆忙上山的，现在有些迷路……"
 time_lifeline.131.a:0 "相信自己，你一定可以化险为夷。"
 time_lifeline.131.a.response:0 "好，现在不是泄气的时候，等我到了山顶就跟你联络。"
 
 time_lifeline.140.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者为了躲避危险的乌云与黑雨前往山顶。>§!"
 time_lifeline.140.a:0 "到山顶了吗？"
 time_lifeline.141.desc.1:0 "我成功地找到了上山的路，已经顺利地抵达了山顶。\n但乌云离我更近了，雨势也没有减弱的趋势，反而还在逐渐增大。\n可以确信，我原本待的地方已经被黑色的雨水淹没了。$time_lifeline.141.desc.same$"
 time_lifeline.141.desc.2:0 "我尝试寻找一块便于攀爬的岩壁，可它却陡峭得出乎我的意料，我还差点摔下去。\n但身后的乌云紧追不舍，雨势反而还在加剧，我不得不忍着伤痛继续往上爬，好不容易才抵达了山顶。$time_lifeline.141.desc.same$"
 time_lifeline.141.desc.3:0 "我好不容易才找到一条合适的登山途径，可它却坑坑洼洼，处处都是陷阱。\n但我没有时间另辟蹊径，雨声仿佛就在我的耳边，慌乱中我摔了好几跤，又不得不爬起来继续往山上跑，总算抵达了顶峰。$time_lifeline.141.desc.same$"
 time_lifeline.141.desc.same:0 "\n\n山顶上有一座似乎是祭坛的建筑，但很破旧，仿佛很久都没有人来过。\n虽然看着有些诡异，但毕竟有屋顶，我打算走进祭坛避雨。\n\n这座祭坛似乎是用一种白色的荧光石搭建的，因为我能在昏暗的天色下看到它在发光。\n白色的祭坛伫立在白色的雪冠上，不知道是为了和自然相得益彰，还是为了融入环境伪装自己，又或者只是单纯觉得白色代表圣洁……\n搞不清楚，干脆不管它了。\n\n走进祭坛，周围的墙壁上似乎绘画着大小不一但形状相似的图标。\n我来看看——好像是一条蛇，咬着自己的尾巴，身体盘起来变成了一个圈。"
 time_lifeline.141.a:0 "这应该叫“§H衔尾之蛇§!”。"
 time_lifeline.142.desc:0 "咦？真奇怪，祭坛的中间居然是一台巨大的机器。\n高科技风格的机器挤占了原始宗教风的祭坛的核心空间，感觉还真是违和。\n\n这台机器倒是意外地干净，表面一尘不染，就好像前不久才有人保养过一样。\n不过机器上也有着“§H衔尾之蛇§!”的纹样，也许这台机器就是祭祀的圣物。\n\n你觉得这台机器是用来做什么的呢？\n喏，给你仔细看看——呀，我忘了，这只备用通讯器不能传输影像。"
 time_lifeline.142.a:0 "这应该是用于分析山上矿藏的机器。"
 time_lifeline.142.b:0 "显然，这是祭祀“§H衔尾之蛇§!”的礼器。"
 time_lifeline.142.c:0 "一定是用来嘉奖赫赫战功的纪念碑！"
 time_lifeline.142.d:0 "根据数据库推测：算Π？"
 time_lifeline.142.e:0 "猜不出来，毕竟未见全貌。"
 time_lifeline.143.desc:0 "糟糕，乌云已经抵达祭坛上方了，我可以听到雨拍打屋顶的声音！\n\n我感觉屋顶正在融化，整个祭坛也摇摇欲坠，或许当初选择来这座山就是个错误，我已经无处可逃了……\n不对，如果我没有上山，可能我早就被雨水淹没了吧。\n哎呀，纠结这些也没用了，只好放手一搏了。\n\n我准备钻进这台机器里，尝试启动它，说不定是架私人飞船呢？\n就算不能启动，起码合金的外壳也能抵挡……§R<噪音>§!……咦……§R<噪音>§!……\n\n这台机器内部似乎会隔绝信号，我得尽快进去启动机器，先关闭通讯吧。\n谢谢你的指引，若是没有你，我肯定做不到这一切。\n如果我能活下来，我会再联系你的……§R<噪音>§!……"
 time_lifeline.143.a:0 "再……见。"
 time_lifeline.143.a.response:0 "……§R<噪音>§!……"
 
 time_lifeline.150.desc:0 "我们已经有很久没有收到当初的求救者的通讯了，可能对方已经遭遇了不测。\n\n或许那雨真的有什么古怪，或许是对方还是选择了上山并发生了意外，或许……\n\n没有什么或许，时间没有退路，事实已成既定。"
 time_lifeline.150.a:0 "$time_lifeline.300.a$"
 time_lifeline.150.b:0 "$time_lifeline.300.b$"
 time_lifeline.150.c:0 "如果她肯好好听话，就不会发生意外。"
 time_lifeline.150.d:0 "$time_lifeline.300.d$"
 time_lifeline.150.e:0 "$time_lifeline.300.e$"
 
 ################################################################
 # 阶段2（湖泊）
 ################################################################
 
 time_lifeline.200.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者前往湖泊寻找可用的材料。>§!"
 time_lifeline.200.a:0 "$time_lifeline.100.a$"
 time_lifeline.201.desc:0 "是的，一路上非常顺利，我平安无事地抵达了目的地，只是这湖泊比我预估的还要远。\n\n我才刚抵达湖畔，湖水很清，倒映着周围的景色，感觉真美。\n咦？湖中好像有什么东西，我看看，那好像是一艘船？\n但是它太远了，我看不清，也不能确定。\n\n那物体一动不动，如果是船的话，也许是有人故意停泊在湖水中央？"
 time_lifeline.201.a:0 "不如去看看。"
 time_lifeline.202.desc:0 "但我的飞行器坏了，我也没有别的途径可以靠近那艘船，总不能游过去吧？\n\n湖泊周围只有一些低矮的灌木丛，再远点就是稀稀落落的几棵半枯萎的树。\n呀，那好像是座房屋，似乎是用石头做的，跟周边的真石头几乎一模一样，我差点就错过了。\n\n不知道有没有当地生命居住在里面，我过去看看吧。"
 time_lifeline.202.a:0 "不知是敌是友。"
 time_lifeline.202.a.response:0 "考虑这么多也没有用了，得实际看看才能知道真相。\n\n一会见。"
 
 time_lifeline.210.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者前往石屋，希望能遇到当地文明。>§!"
 time_lifeline.210.a:0 "可以，看见原住民了吗？"
 time_lifeline.211.desc:0 "没看见，我也没有探测到任何智慧生命的迹象。\n\n石屋里空无一人，但是有一些简易的家具，比如石桌、石椅、石床，还有一个石头搭建的壁炉。\n这些家具上落满了灰，看起来已经很久没人在此居住了。\n\n天气似乎突然变冷了，这间屋子应该也没什么特别值得注意的，我还是出去吧。"
 time_lifeline.211.a:0 "既然冷了，不如点燃壁炉暖暖身子。"
 time_lifeline.211.b:0 "出去看看吧，也许发生了什么事。"
 time_lifeline.212.desc:0 "好，我来试……§R<噪音>§!……\n\n……§R<噪音>§!……好像点不……§R<噪音>§!……喂？……§R<噪音>§!……\n\n……§R<噪音>§!……"
 time_lifeline.212.a:0 "发生什么了？能听到吗？"
 time_lifeline.212.a.response:0 "……好像……§R<噪音>§!……\n\n……§R<噪音>§!……等会联系……§R<噪音>§!……"
 time_lifeline.213.desc:0 "好，我出去……§R<噪音>§!……\n\n……§R<噪音>§!……外面好冷……§R<噪音>§!……喂？……§R<噪音>§!……\n\n……§R<噪音>§!……"
 time_lifeline.213.a:0 "$time_lifeline.212.a$"
 time_lifeline.213.a.response:0 "$time_lifeline.212.a.response$"
 
 time_lifeline.220.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者在石屋中没有收获，但通讯突然受到了强烈干扰。>§!"
 time_lifeline.220.a:0 "之前发生了什么？"
 time_lifeline.221.desc.1:0 "好像突然下起了冰雹，但过了一会就突然停了。\n风暴后的气温依然很低，但这石屋似乎具备一定的保暖功能，感觉不算太糟。\n\n我观察了一会，似乎没有下一场冰雹的迹象，外面应该是安全的，所以我打算出去看看。"
 time_lifeline.221.desc.2:0 "天上突然下起了冰雹，我还没反应过来就被冰雹砸中了！\n真的，太冷了，我感觉很糟，虽然立刻逃回了石屋，但还是好冷，好疼……\n\n我进行了紧急包扎，感觉好点了，但我不能一直呆在这，所以我打算出去看看。"
 time_lifeline.221.a:0 "小心行动，一旦发生什么意外就立刻返回石屋。"
 time_lifeline.221.b:0 "你现在还带着伤，先在石床上休息一会吧。"
 time_lifeline.221.b.response:0 "其实我也希望这么做，既然你开口了，那我就休息一会吧，等我睡醒了再联系你。"
 time_lifeline.222.desc:0 "没问题。\n\n呀，湖水结冰了！\n也难怪，毕竟才下了那么大一场冰雹，天气又很冷。\n不过这么一来，就算不用飞行器，我也能去看看湖中心的那艘船了。\n\n那真的是船吗，还是别的什么东西？\n如果是船的话，它又为什么会停泊在湖中心呢？\n船上会不会有人，又会不会有我需要的材料呢？"
 time_lifeline.222.a:0 "这得等你亲自确认了。"
 time_lifeline.222.a.response:0 "嗯，如果我有什么收获，就会立即和你联络的。"
 time_lifeline.222.b:0 "冰面很危险，还是先在附近探索吧。"
 time_lifeline.222.b.response:0 "的确如此，我还是太莽撞了……如果我有什么发现就立即和你联络。"
 
 time_lifeline.230.desc:0 "……救命……§R<噪音>§!……\n\n……黑色的雨……§R<噪音>§!……淹没……§R<噪音>§!……"
 time_lifeline.230.a:0 "喂？喂！"
 time_lifeline.231.desc:0 "……§R<噪音>§!……"
 time_lifeline.231.a:0 "……"
 time_lifeline.231.a.response:0 "……§R<噪音>§!……"
 time_lifeline.232.desc:0 "我们已经有很久没有收到当初的求救者的通讯了，可能对方已经遭遇了不测。\n\n我们只知道对方在生前的最后时刻发出了求救，但我们却无能为力，或许……\n\n没有什么或许，时间没有退路，事实已成既定。"
 time_lifeline.232.a:0 "$time_lifeline.300.a$"
 time_lifeline.232.b:0 "$time_lifeline.300.b$"
 time_lifeline.232.c:0 "她似乎被什么东西淹没了，但谜底已不得而知。"
 time_lifeline.232.d:0 "$time_lifeline.300.d$"
 time_lifeline.232.e:0 "$time_lifeline.300.e$"
 
 time_lifeline.240.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：湖泊结冰了，求救者前往湖中心查看那艘船。>§!"
 time_lifeline.240.a:0 "能听到，一路顺利吗？"
 time_lifeline.241.desc:0 "我本以为会发生什么，但事实上却是出乎意料的顺利。\n\n冰面很结实，我确信不是我体重轻的缘故，因为那艘船正好好的伫立在冰面上。\n这确实是一艘船，就是有些破旧，规模也不算大，不过相比于我驾驶的飞船而言还是大了不少。\n\n这艘船上似乎没有人，不管怎么呼喊都没人应答。\n于是，我利用船尾的绳梯登上了甲板，让我来看看船上都有些什么。"
 time_lifeline.241.a:0 "无人的废船是一些恐怖片常见的地点。"
 time_lifeline.242.desc:0 "呜哇，不要吓我啦！\n\n甲板上很杂乱，堆满了歪七扭八的木箱子，但里面都是空的。\n桅杆似乎被风折断了，重重地倒在甲板上，把船舵砸得粉碎，幸好没有人在底下。\n\n这里有一个通往船舱的楼梯，说不定里面会有什么好东西。"
 time_lifeline.242.a:0 "我劝你别抱太大希望。"
 time_lifeline.243.desc:0 "船舱似乎比我想象的还要大，光是走在阶梯上就产生了不小的回声。\n\n我现在应该处于船舱的中央大厅，沿着船身是两条深不见底的走廊，我猜它们分别指向船头和船尾。\n走廊两侧是数不胜数的小房间，可能是船员的休息室吧。\n大厅里木桌和木椅井井有条，这里也许是用作餐厅。\n\n餐厅的四周也有好几道门，也许是厨房和储物室吧。\n直觉告诉我，里面会有我需要的材料。"
 time_lifeline.243.a:0 "最好是因为你的直觉，而不是因为你的肚子。"
 time_lifeline.244.desc:0 "唔！船身突然剧烈地震动了起来，发生了什么？\n\n我隐约能听到淅淅沥沥的雨声，是下雨了吗？\n通往甲板的门不知道什么时候关上了，而且还打不开，我也不清楚外面是什么情况。\n船体还在激烈地摇晃，我听到了什么东西撕裂的声音，感觉不太妙。\n\n糟糕，这艘船似乎正在下沉，难道是冰面裂开了吗？\n更糟糕的是，船舱漏水了，越来越多的水灌进了大厅。\n虽然它们在往船头流，但恐怕要不了多久，整艘船就都会被水淹没！\n\n门死死地固定在墙上，无论我怎么撞都撞不开，我该怎么……§R<噪音>§!……"
 time_lifeline.244.a:0 "手边有什么工具可以用吗？喂？"
 time_lifeline.244.a.response:0 "§R<通讯已切断。>§!"
 
 ################################################################
 # 阶段2（沙漠）
 ################################################################
 
 time_lifeline.300.desc:0 "我们已经有很久没有收到当初的求救者的通讯了，可能对方已经遭遇了不测。\n\n或许选择沙漠作为目的地是个错误的决定，或许对方运气太差命中注定会死在那里，或许……\n\n没有什么或许，时间没有退路，事实已成既定。"
 time_lifeline.300.a:0 "如果回到当初，我们是否可以拯救她？"
 time_lifeline.300.b:0 "我们没有义务为他人的死亡负责。"
 time_lifeline.300.c:0 "悲剧注定发生，我们无能为力。"
 time_lifeline.300.d:0 "又一个鲜活的生命就此消亡。"
 time_lifeline.300.e:0 "令人遗憾。"
 
 ################################################################
 # 阶段3（时间机器）
 ################################################################
 
 time_lifeline.400.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者为了躲避危险的黑雨，不得不启动了祭坛中的机器。>§!"
 time_lifeline.400.a:0 "总算收到你的消息了，情况如何？"
 time_lifeline.401.desc:0 "情况不算好也不算坏。\n\n这台机器里面是一些精密的仪表和控制台，各式各样的指示灯和按钮琳琅满目。\n我并不会操控这台机器，但我没有时间去逐个分析各个按钮与拉杆的作用，于是我按下了我觉得最像启动按钮的那个，而这台机器也真的启动了。\n\n机器突然开始旋转，速度也越来越快，我只觉一阵天旋地转，整个身体就像飞起来一般，轻飘飘地浮在半空中。\n我似乎失去了重力，因为我感受不到重力的存在；\n我似乎失去了自我，因为我感受不到自我的存在。\n\n我不知何时昏死过去，醒来时，机器已经停止了运作。"
 time_lifeline.401.a:0 "那机器外面怎么样？"
 time_lifeline.402.desc.pass:0 "我不敢确定，但应该是安全的。\n\n机器外面依然是先前的白色祭坛，完全没有受损的痕迹，甚至比我印象中更加整洁。\n祭坛外晴空万里，皑皑白雪也毫无波澜地平铺在地上，仿佛什么都没发生过。\n\n现在想想还有些可笑，为什么我会觉得那阵雨很危险呢，说不定只是普通的雨罢了。\n而我还为了躲避那场雨四处逃窜，真是滑稽。"
 time_lifeline.402.desc.future:0 "我不敢确定，但应该是安全的。\n\n刚走出机器的时候，我还吃了一惊。现在已经完全没有祭坛的痕迹，或许它在那场黑雨中被彻底摧毁了。\n曾经的白雪也消失不见，取而代之的是绿油油的草地。\n\n那阵雨真的有这么大的威力吗？\n如果说这是雨后的景象，我总有股不对劲的感觉，但我又想不出其它合理的解释。"
 time_lifeline.402.a:0 "已行之事无法改变，我们应该直面未来。"
 time_lifeline.402.b:0 "纠结于过去没有意义，想想接下来该怎么做。"
 time_lifeline.403.desc:0 "你点醒我了，发生过的事情已成事实，考虑这些对我当前的处境没有帮助。\n\n这台机器可能暂时派不上用场了，所以我打算先返回飞船填充一下补给。\n虽然这趟探险没有收获，但有你在我身边，我相信我一定可以脱离困境。"
 time_lifeline.403.a:0 "我期待着那一天。"
 time_lifeline.403.a.response:0 "嗯，我也期待着那一天。\n\n等我到了飞船就联系你，一会见。"
 
 time_lifeline.410.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者受到了鼓舞，准备返回飞船。>§!"
 time_lifeline.410.a:0 "回到飞船了吗？"
 time_lifeline.411.desc.same:0 "该说是回到了呢，还是说没有呢？\n\n我确信我没有记错地方，但当我来到飞船坠落的地点时，它不见了！\n飞船不见了……\n\n"
 time_lifeline.411.desc.pass:0 "$time_lifeline.411.desc.same$地面很平整，连撞击的痕迹都没有留下，仿佛飞船从未存在过。\n我一度怀疑是不是我记错了地点，所以我又在周围仔细寻找了一番，却仍然没有飞船的踪影。\n\n虽然又累又饿，但若找不到飞船，我就没法补给。\n我……该怎么办？"
 time_lifeline.411.desc.future:0 "$time_lifeline.411.desc.same$但只是飞船不见了，地上的撞击坑仍然完好无损，只是里面已经长满了植被。\n我可以肯定飞船就应该在这里，于是我又在周围仔细寻找了一番，却仍然没有飞船的踪影。\n\n虽然又累又饿，但若找不到飞船，我就没法补给。\n我……该怎么办？"
 time_lifeline.411.a:0 "也许是被本地生物运走了。"
 time_lifeline.412.desc:0 "的确有这个可能性，但我连本地生物是否存在都不清楚。\n\n对了，我可以去西边的湖泊看看，如果这颗星球上真的存在文明，那么在水边发现文明踪迹的可能性是最大的！"
 time_lifeline.412.a:0 "没错，这是个正确的判断。"
 time_lifeline.412.a.response:0 "嘿嘿，毕竟我也造访过好几个不同的星球嘛。"
 
 ################################################################
 # 阶段3（时间机器-过去）
 ################################################################
 
 time_lifeline.420.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者发现飞船消失，准备前往湖泊寻找文明踪迹。>§!"
 time_lifeline.420.a:0 "找到了文明吗？"
 time_lifeline.421.desc:0 "我有一个坏消息，还有一个更坏的消息。\n\n坏消息是：\n我在湖畔找到了一座石屋，但它已经荒废很久了。\n这里根本没有文明生存的迹象，也没有飞船的踪影。\n\n更坏的消息是：\n一大团乌云正在朝我飘来！那团乌云和之前的乌云很像，但又不完全一样。\n之前的乌云下着黑色的雨，而现在的乌云则是打雷带闪电，时不时雷击着下方的树木。"
 time_lifeline.421.a:0 "有什么可以躲避的地方吗？"
 time_lifeline.422.desc:0 "这里离山峰太远了，我肯定来不及跑过去。\n湖边停泊着一艘似乎废弃了的木船，长长的桅杆很容易引来闪电，躲在船上恐怕不是一个好的选择。\n\n现在，我唯一的退路就是刚刚找到的石屋了，希望我能在里面平安度过雷暴。"
 time_lifeline.422.a:0 "或许你可以利用那艘船——那根桅杆。"
 time_lifeline.422.b:0 "赶快躲进石屋里，提前做好准备。"
 time_lifeline.423.desc:0 "利用桅杆？我明白了，让桅杆来吸引雷击，我则躲在安全的石屋里，真是个好主意。\n\n光是木头恐怕引雷效果不佳，我可以用衣服上的金属装饰对桅杆加工一下。\n再尝试推动木船，让它朝湖心漂移，说不定可以把雷暴引走。\n\n不过乌云已经不远了，但愿我能及时完成准备工作。"
 time_lifeline.423.a:0 "如果来不及就赶快退回石屋。"
 time_lifeline.423.a.response:0 "放心吧，我对时间很有把握的！"
 time_lifeline.424.desc:0 "的确，乌云已经不远了，要想做什么准备工作得趁现在。\n\n我打算找点支撑物堆在石屋里，毕竟这石屋看起来并不够结实，如果真的遭到了雷击，它们应该可以为我撑出一片安全的空间。\n\n当然，如果没有被雷击自然是最好的结果，但总要防患于未然嘛。"
 time_lifeline.424.a:0 "一定要保护好自己。"
 time_lifeline.424.a.response:0 "我会的，我一定会坚持到下次与你联络。"
 
 time_lifeline.430.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者遭遇雷暴，打算利用桅杆充当避雷针。>§!"
 time_lifeline.430.a:0 "雷暴过去了吗？"
 time_lifeline.431.desc:0 "我有一个好消息，还有一个更好的消息。\n\n好消息是：\n乌云已经跟着木船远去了，我所在的石屋完全没有遭到雷击，我现在非常安全！\n\n更好的消息是：\n我已经知道发生什么了，还有飞船消失的原因！"
 time_lifeline.431.a:0 "你知道了什么？"
 time_lifeline.432.desc:0 "当我为加工桅杆做准备时，我在甲板上找到了一只通讯器改装成的留言器。\n我赶紧打开留言器，发现里面用我熟悉的文字写着：“§H这里不是未来，而是过去！用时间机器重返未来！§!”\n\n一切都能说得通了，我之前避雨时钻进的机器实际上是§H时空穿梭机§!。\n祭坛安然无恙不是因为从黑雨中幸存，而是压根未曾遭受黑雨的侵蚀。\n无影无踪的飞船，毫无伤痕的地面，这些都是最好的证明。\n\n因为这个时候，我的飞船还没有迫降在这颗星球上！"
 time_lifeline.432.a:0 "你为什么能如此确信，万一它是个陷阱呢？"
 time_lifeline.433.desc:0 "我能从留言器上感受到时间的痕迹。\n而之前在祭坛的机器里时，我也有过细微但类似的感觉，但我担心只是我弄错了。\n\n实际上，我是个§H时间旅行者§!。\n我的飞行器的主要功能其实是进行§H时空穿梭§!，但穿梭并不是轻易就能做到的，更何况我的飞行器也坏了。\n正是因为我以往的经历，我明白，不，我相信，这条留言是不同时间线上的我寄给我自己的。\n虽然不知道为什么她不亲自告诉我，但这其中一定有什么理由吧。\n\n我，相信我自己，无论是过去的自己，还是未来的自己——就像我相信你一样。"
 time_lifeline.433.a:0 "这……真是出乎意料。"
 time_lifeline.434.desc:0 "我知道，这种事很难使人信服，所以我并没有一开始说明。\n\n但现在，我应该知道要怎么做了。\n我准备前往山峰，仔细调查一下§H时间机器§!，并回到我原本的时间线，当然，得延后一点避开黑雨。\n\n在此之后的事，就等以后再说吧。"
 time_lifeline.434.a:0 "调查后与我联系吧，也许我能提供帮助。"
 time_lifeline.434.a.response:0 "那真是太感谢你了！"
 
 time_lifeline.440.desc.1:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者遭遇雷暴，打算待在石屋里躲避。>§!"
 time_lifeline.440.desc.2:0 "能……能听到吗？\n\n§E<历史记录：求救者遭遇雷暴，打算待在石屋里躲避。>§!"
 time_lifeline.440.a:0 "雷暴过去了吗？"
 time_lifeline.440.b:0 "你听起来似乎不太好。"
 time_lifeline.441.desc.1:0 "雷暴应该过去了，但我被石头压住了……\n\n运气很差，我的石屋还是被雷击中了，支撑物也没坚持太久，我被埋起来了。\n\n我又冷又累，空气越来越稀薄令我难以呼吸，我知道我必须做点什么。\n\n唔——嘿！\n上面还有一块，嘿！\n再来，我可以的！\n怎么还有？\n但我看见光了，希望就在眼前，应该是最后一块了，嘿！\n\n呼~总算逃出来了……"
 time_lifeline.441.desc.2:0 "我……被石头压住了。\n\n运气糟透了……我的石屋还是被雷击中了。\n支撑物也……没坚持太久，我被埋起来了……\n\n我……又冷又累，身上的伤口也开裂了，我感觉……很不好……我已经没有力气推开石头了。空气越来越稀薄，我知道我必须做点什么，但……还是什么都做不了……\n\n很抱歉，我没能尽到我信使的责任，不能给大家……很抱歉，让你帮了我这么多，我却没能达成约定……"
 time_lifeline.441.a:0 "真是不容易啊。"
 time_lifeline.441.b:0 "等一等，坚持住！"
 time_lifeline.441.b.response:0 "……抱歉……\n\n§R<通讯已切断。>§!"
 time_lifeline.442.desc:0 "哈……真是太累了。\n\n虽然身上被磨出了不少伤口，但并无大碍，只是我已经精疲力竭了。\n如果我之前已经遍体鳞伤，我都不能确定是否还能逃出生天。\n\n咦，我似乎在石堆里发现了什么？\n这块石头上似乎刻着某种文字，我尝试翻译一下：\n“§H11037.7.7§!”\n\n欸？"
 time_lifeline.442.a:0 "看起来像是日期。"
 time_lifeline.443.desc:0 "我的第一反应也是这个，可是……\n\n现在已经11037年了吗？\n如果按照银河统一标准计时来看，这比我抵达这颗星球要晚了几千年，难道我在这里待了几千甚至几万年了吗？"
 time_lifeline.443.a:0 "可能这并非按银河统一标准写的。"
 time_lifeline.444.desc:0 "你说的也有道理，也许只是按当地历法来算才是11037年。\n\n但自制定历法以来的一万多年里，这个文明都没能迈入星空，与其它银河文明建立联系吗？\n可这简陋的石头小屋怎么看都不像是一个太空文明的产物。\n\n不行，我已经完全搞不懂了。"
 time_lifeline.444.a:0 "不如做几个假设，用它们来解释当前的一切。"
 time_lifeline.445.desc:0 "假设？我试试。\n\n假如，我们确定这个日期是按银河统一标准写的，那么现在就是11037年，比我迫降在这颗星球上晚了几千年。\n我确信，我并没有在这颗星球上待那么长时间，那只有可能是中间这段时间被“§H抹去§!”了，或者说，“§H跳过§!”。\n\n我的切身经历告诉我，§H时空穿梭§!是可能的，不，是实际存在的。\n唯一的解释，那就是祭坛中的机器实际上是§H时空穿梭机§!！\n因为我启动了机器，所以我来到了遥远的未来，也就是11037年。\n飞船不翼而飞是因为早就被人开走了，撞击坑的消失也是因为经过了漫长的岁月而被风沙抚平。\n至于是谁开走的飞船，我认为那就是我自己。\n\n在正确的时间线上，我一定集齐了材料修好了飞船，并驾驶着飞船头也不回地离开了这颗星球。"
 time_lifeline.445.a:0 "很……令人难以置信。"
 time_lifeline.446.desc:0 "嘿嘿，很天马行空吧，我自己也吓了一跳。\n\n但是，我说的可不是开玩笑哦，我准备现在就前往山峰，再调查一下那台机器。\n如果真如我所言，我就需要用它重返正确的时间线，达成闭环。\n\n就算发现我猜错了，那也只是排除了一个错误推论而已。"
 time_lifeline.446.a:0 "那就去看看吧。"
 time_lifeline.446.a.response:0 "好，我们一会见！"
 
 time_lifeline.450.desc.1:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者根据留言判断自己处在过去，准备使用时间机器重返未来。>§!\n§E<记录备注：求救者是一名时间旅行者，值得关注。>§!"
 time_lifeline.450.desc.2:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者根据文字判断自己处在未来，准备使用时间机器回到过去。>§!\n§E<记录备注：求救者的想象力很丰富……不值得关注。>§!"
 time_lifeline.450.a:0 "对时间机器的调查进展如何？"
 time_lifeline.451.same:0 "绝大多数仪表和按钮，我都不知道它们是用来干什么的。\n\n不过我发现了一个刻度密集的圆表，上面如时钟般刻了十二个等间隔的刻度，每两个刻度间又有十二个等间隔的小刻度，小刻度之间又有十二个等间隔的更小刻度……\n此外，旁边还有一个仪表，似乎是用于显示更加精确的刻度。\n这两个表盘位于操作台的正中央，我认为它们与穿梭目标时间点之间一定有某种关联。\n\n"
 time_lifeline.451.desc:0 "老实说，没有头绪。$time_lifeline.451.same$我准备在机器外放一个醒目的标记物，再微调这个表盘，然后启动机器。\n最后，通过观察标记物是否存在来确定我是前往了过去还是未来；如果标记物存在，还可以分析其状态来判断我穿梭了多久。\n\n嘿嘿，是个笨办法吧？"
 time_lifeline.451.a:0 "如果能让我看看的话，说不定可以更快解决。"
 time_lifeline.452.desc:0 "真是可惜，这只通讯器没有传输影像的功能。\n而且就算有，这台机器本身也会屏蔽信号，依然没法给你看细节。\n\n好了，想再多也不能解决问题，接下来，就让我试试看吧。"
 time_lifeline.452.a:0 "你最终会重返未来，对吧？"
 time_lifeline.452.a.response:0 "是的，没错，让我们未来再见！"
 time_lifeline.452.b:0 "你最终会回到过去，对吧？"
 time_lifeline.452.b.response:0 "是的，没错，让我们重归原点！"
 
 time_lifeline.490.desc:0 "通讯就此切断，我们再也无法与求救者取得联系了。\n\n我们没能救得了她。"
 time_lifeline.490.a:0 "尽管她并不是我们的一份子，但我很抱歉。"
 time_lifeline.490.b:0 "我很抱歉，这就是情感吗？"
 time_lifeline.490.c:0 "我很抱歉。"
 time_lifeline.490.d:0 "我们不会为异族的死感到抱歉！"
 time_lifeline.490.e:0 "不，这不是我们的错！"
 
 ################################################################
 # 阶段3（时间机器-未来）
 ################################################################
 
 time_lifeline.460.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者发现飞船消失，准备前往湖泊寻找文明踪迹。>§!"
 time_lifeline.460.a:0 "找到了文明吗？"
 time_lifeline.461.desc:0 "没有找到任何一个本地人，但我并非毫无收获。\n\n我在湖畔找到了大量的石质建筑与设施，显然这是一个当地部落曾经生活过的地方。\n很可惜，生活的痕迹已经不复存在，这块区域应该被废弃很久了，甚至可能连整个文明都不在了。\n\n而且，我也没在这看到飞船的踪影，恐怕并不是被本地生物运走的，而是出于别的什么原因……"
 time_lifeline.461.a:0 "再多调查调查吧，说不定会有所发现。"
 time_lifeline.462.desc:0 "要说发现，其实也不是没有。\n\n我在好几间石屋里发现了相似的沉眠孢子，但我无法确定这是当地智慧生物留下来的，还是单纯被风吹来的非智慧生命的孢子。\n我已经使用随身携带的分析设备对其进行检测了，但检测需要一段时间。\n\n所以，我想趁着这段时间和你联系，分析我现在的处境。"
 time_lifeline.462.a:0 "让我们整理一下现有的情报。"
 time_lifeline.463.desc:0 "我目前有一件事情不明白，就是我在启动机器后，一共昏迷了多久？\n\n如果可以确定时间的话，或许可以锁定飞船可能存在的范围。"
 time_lifeline.463.a:0 "$time_lifeline.531.a$"
 time_lifeline.464.desc:0 "$time_lifeline.532.desc$"
 time_lifeline.464.a:0 "$time_lifeline.532.a$"
 time_lifeline.465.desc:0 "$time_lifeline.533.desc$"
 time_lifeline.465.a:0 "$time_lifeline.533.a$"
 time_lifeline.466.desc:0 "$time_lifeline.534.desc$"
 time_lifeline.466.a:0 "$time_lifeline.534.a$"
 time_lifeline.467.desc:0 "$time_lifeline.535.desc$"
 time_lifeline.467.a:0 "$time_lifeline.535.a$"
 time_lifeline.468.desc:0 "这一系列事件的确令人费解，但现在纠结这些也无济于事。\n\n分析结果似乎已经出来了。\n我看看，这些孢子的细胞中，细胞器分工明确，细胞核中的遗传物质维持稳定双螺旋结构。\n再根据细胞整体形状判断，相比于真菌而言，其实这更像是带有细胞壁的特殊动物细胞。\n我也找来了一些周围真菌的样本，将它们与孢子进行比对，结果全都不吻合。\n\n也许，这些孢子就是这个部落所遗留的东西，这个文明可能是一个特殊的真菌文明。"
 time_lifeline.468.a:0 "真是有趣。"
 time_lifeline.469.desc:0 "湖畔有一艘废弃的木船，虽然可能不会有什么收获，但我打算上去看看。\n毕竟不亲自尝试就不会有结果嘛。"
 time_lifeline.469.a:0 "那我就等你的好消息。"
 time_lifeline.469.a.response:0 "好，我很快就会再联系你。"
 
 time_lifeline.470.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者认为曾有个真菌文明，但已不复存在。最终，求救者决定前往废船探索。>§!\n§E<记录备注：求救者发现我们之间存在时间差异，值得关注。>§!"
 time_lifeline.470.a:0 "在废船上有所收获吗？"
 time_lifeline.471.desc:0 "是的，但……我不明白。\n\n我登上了甲板，但上面空无一物，只有一根不知道为何折断的桅杆，重重地倒在甲板上，把船舵砸得粉碎。\n后来，我从桅杆的碎屑中发现了一些金属装饰，但它们莫名地很眼熟。\n\n不仅如此，我还找到了一只通讯器改装成的留言器。"
 time_lifeline.471.a:0 "留言器？"
 time_lifeline.472.desc:0 "留言器里只有这么一条信息：“§H这里不是未来，而是过去！用时间机器重返未来！§!”\n\n信息使用的是我所熟悉的语言，这已经很令我惊讶了，其中的内容更是使我困惑。\n首先是“§H时间机器§!”这个词，我想，大概是指祭坛中央的那台机器吧。\n但它说“§H这里不是未来，而是过去§!”又是什么意思？\n\n难道是有人在提醒我当前的时间点吗？"
 time_lifeline.472.a:0 "不妨用它解释目前的情况来验证。"
 time_lifeline.473.desc:0 "首先假设留言是真的，那我就是通过祭坛里的“§H时间机器§!”来到了过去。\n\n这或许可以解释为什么飞船不见了，那是因为此时的我还未抵达这颗星球。\n可不仅是飞船，机器外的祭坛也一整个消失了，我本以为它是被黑雨摧毁了，难道是——因为它现在还没被建成？\n\n不对不对，还有事情解释不通，那是什么呢……"
 time_lifeline.473.a:0 "别忘了飞船的撞击坑。"
 time_lifeline.474.desc:0 "对了，只是飞船不见了，撞击坑还原封不动地保留在那里！\n\n如果我是回到了过去，那撞击坑又是如何形成的？\n若用陨石坑来解释未免太过牵强附会了吧。\n退一步来想，这条留言真的是给我的吗，会不会其实它是留给别人的，而我自作主张地误解了它的意思？\n如果不是，那我先前关于§H时间机器§!的解释或许是错误的，我未必真的穿越了时空。\n\n无论如何，这都与祭坛里的那台机器有着千丝万缕的关系，只有重新对它仔细调查才能解开这一谜团。"
 time_lifeline.474.a:0 "那就再调查一遍吧。"
 time_lifeline.474.a.response:0 "之前忙着躲避黑雨，没有时间仔细调查，现在我一定要解开这台机器的秘密！"
 
 time_lifeline.480.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者发现了一条神秘的留言，为了验证信息的真伪选择重新调查机器。>§!"
 time_lifeline.480.a:0 "$time_lifeline.450.a$"
 time_lifeline.481.desc:0 "一开始，我一头雾水。$time_lifeline.451.same$但后来，我用了一种笨办法来进行测试，最终得出了一个结论——这是台货真价实的§H时空穿梭机§!。\n不仅如此，我还基本掌握了操控这台机器的方法。"
 time_lifeline.481.a:0 "也就是说，那条留言说的是真的？"
 time_lifeline.482.desc:0 "也不能就这么肯定，因为我只验证了一半，没能验证另一半。\n更何况，我依然不知道那条留言究竟是不是寄给我的。\n\n不过唯一能确定的是，我的确穿梭到了不同的时间线上，若想回到正确的时间节点，只能靠这台§H时间机器§!了。\n直觉告诉我，这可能是唯一的机会，因为我甚至能听见机器里的零件在叮当作响。\n\n这最后的选择，就交给你吧。\n我的命运，也交给你了。"
 time_lifeline.482.a:0 "相信留言吧，重返未来。"
 time_lifeline.482.a.response:0 "未来……是吗？\n\n好，让我们未来再见！"
 time_lifeline.482.b:0 "疑点太多了，回到过去。"
 time_lifeline.482.b.response:0 "过去……是吗？\n\n好，让我们重归原点！"
 time_lifeline.482.c:0 "我现在无法做出判断。"
 time_lifeline.482.c.response:0 "是这样啊……\n也是，我有些太过于依赖你了，让你不得不为我承担选择的责任。\n\n好，这一次，我会自己决定我的命运。"
 
 ################################################################
 # 阶段3（镜中世界）
 ################################################################
 
 time_lifeline.500.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者登上了无人的废船，但船却沉没了，我们也失去了联系。>§!"
 time_lifeline.500.a:0 "你还活着吗？真是太好了！"
 time_lifeline.501.desc:0 "应该……还活着吧。\n\n之前在和你通讯时，我的备用通讯器突然被水冲走了，不久后，我也被水冲走了，并陷入了昏迷。\n当我从昏迷中苏醒，发现我正浮在水面上，可那艘船却几乎完好无损地飘在不远处。\n我重新登上了船，惊讶地发现，之前断裂的桅杆居然恢复原状了，但甲板上的箱子则不翼而飞，也许是掉进湖里了。\n\n我再一次进入了船舱，发现桌子、椅子都稳稳地固定在原本的位置。\n我还在大厅里找到了我的通讯器，幸好它防水。"
 time_lifeline.501.a:0 "你说“应该”……是什么意思？"
 time_lifeline.502.desc:0 "你注意到了呀。老实说，我也不清楚我是不是还活着，也许我已经上了天堂。\n\n我苏醒后，映入眼帘的就是一片粉色的天空。\n现在应该是晚上，因为我找不到太阳的位置，但天空却自己发着粉红色的光，有一种既梦幻又诡异的感觉。\n\n这是个梦吗，还是说这里就是天堂，你能告诉我吗？\n那我又是怎么和你联系的呢，你只是我的幻想吗？"
 time_lifeline.502.a:0 "这一切当然不是梦，因为我并非虚假。"
 time_lifeline.502.b:0 "你肯定还活着，不信你捏一下自己。"
 time_lifeline.502.c:0 "是的，我只是你的幻想，你也只是我的幻想。"
 time_lifeline.503.desc:0 "既然你这么说，那我就能确定这一切是真实的了。\n虽然用梦里的事物去验证梦是不是梦很可笑，但我愿意相信你。\n\n不知道自那以后过了多久，我已经有些饿了。\n我准备先在储物室里寻找一些可以吃的食物，当然，味道和质量肯定就不能抱太大期待了。"
 time_lifeline.503.a:0 "之后你打算怎么办？毕竟你还在湖中央。"
 time_lifeline.504.desc:0 "呀，好疼！看起来我应该还活着，总不能上了天堂还会感受到痛吧。\n这真是太好了，毕竟我还有非做不可的任务。\n\n不知道自那以后过了多久，我已经有些饿了。\n我准备先在储物室里寻找一些可以吃的食物，当然，味道和质量肯定就不能抱太大期待了。"
 time_lifeline.504.a:0 "$time_lifeline.503.a$"
 time_lifeline.505.desc:0 "原来是这样，我只是做了一场梦啊，你也是。\n\n既然是梦，那就有该醒的时刻。\n我可不能一直做梦，我还有我该做的事情。\n人们常说，在梦里死去，就会从梦里苏醒，我也不知是真是假。\n\n我会忘记你的，毕竟只是一场梦。\n\n你也要忘记我，毕竟只是一场梦。"
 time_lifeline.505.a:0 "没必要遗忘，美梦与噩梦同样值得纪念。"
 time_lifeline.505.a.response:0 "希望梦醒后，我还能见到你。"
 time_lifeline.506.desc:0 "我不知道，也许我可以试着启动这艘船，再或者等这艘船自己随着水波飘到岸边，毕竟我的飞行器坏了嘛……\n\n等等，我的飞行器居然被修好了，真是离奇，我又开始怀疑这是不是梦了！\n是有人帮我修好了它吗，那为什么不带我一起走呢，难道那人就躲在这艘船上？\n\n算了，我还是先用飞行器回飞船一趟吧。\n虽然暂时没有收获，但以后总能有办法的，毕竟你会帮我的嘛。"
 time_lifeline.506.a:0 "我很好奇你的飞行器的原理。"
 time_lifeline.506.a.response:0 "欸？这个嘛，要解释起来有点麻烦，用法大概是骑在上面，嗖的一下就飞走了，和女巫的飞天扫帚差不多，是魔法啦！\n\n哈哈，不开玩笑了，具体的以后再说吧，我们之后联系。"
 
 time_lifeline.510.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者的飞行器被修好了，打算骑着飞行器返回飞船。>§!\n§E<记录备注：真的是骑着回去的吗？>§!"
 time_lifeline.510.a:0 "回到飞船了吗？"
 time_lifeline.511.desc:0 "不，还没有，不过我有一些意外发现。\n\n原本是石屋的地方，突然变成了一处繁盛的部落，飞行器的传感部件也表明其中活跃着不少生物。\n虽然房屋和设施同样是用石头筑成的，但跟之前我见到的情形真是天差地别。\n部落里居住的似乎是一个真菌文明，身上长满了密密麻麻的根须与触手，看起来有些吓人。\n\n我打算先去和他们交涉，但我的通讯设备太老旧了，启用翻译功能翻译本地人的话时，就没法和你进行正常通讯了。"
 time_lifeline.511.a:0 "祝你好运。"
 time_lifeline.511.a.response:0 "希望他们好说话吧，等我交涉完就立刻和你联系。"
 
 time_lifeline.520.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者意外发现了原住民，并计划与当地居民交涉。>§!"
 time_lifeline.520.a:0 "交涉成果如何？"
 time_lifeline.521.desc:0 "事情比我想象的还要顺利，当地人虽然看起来很可怕，但实际上非常友善，只是……好像不太聪明的样子。\n\n这个文明似乎仍处于石器时代，是一个非常原始的部落，恐怕他们没法给我带来什么帮助。\n但有一点让我感到很奇怪，就是当地的石屋和石制家具显得有些太过精致了，不像是一个原始文明能够轻松做到的。"
 time_lifeline.521.a:0 "确实蹊跷。"
 time_lifeline.522.desc:0 "还不仅如此。\n\n这个石器部落带有着远古的属灵崇拜，他们似乎信仰着一种蛇形的邪神——当然，不是我故意贬低他们的信仰，而是他们真的处处表现出对神明的敬畏，或者说，恐惧。\n他们似乎把我当成了神明的使者，我备受欢迎也许是这个原因。\n他们络绎不绝地送上了珍藏的食物，一边乞求着我——或者说神明的原谅，似乎这个神明对他们降下了什么惩罚。\n\n他们说要带我去一个神圣的地方。\n尽管我更想要寻找修复飞船的材料，但还是不要冒犯当地人比较好。"
 time_lifeline.522.a:0 "感觉不对劲，注意安全。"
 time_lifeline.522.a.response:0 "放心吧，我的飞行器从不离身，就算发生了什么意外，我也会嗖的一下马上飞走的。"
 
 time_lifeline.530.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者被当地居民当成了神明的使者，并被带往圣地。>§!"
 time_lifeline.530.a:0 "到圣地了吗？"
 time_lifeline.531.desc:0 "这个所谓的圣地似乎就在山峰上——是我一开始跟你说的，那个飞船北面的山峰。\n\n一路以来，我发觉植被的种类发生了变化，和我记忆中的大相径庭。\n不仅如此，这座山峰也有了变化——我很确信，之前看到这座山时，山顶是有不少积雪的，但现在，山顶却长着翠绿的植物，完全没有积雪的痕迹。\n\n我昏迷之后，世界究竟发生了什么？"
 time_lifeline.531.a:0 "也许你昏迷了几个月，甚至几年。"
 time_lifeline.532.desc:0 "什么？等等，这不可能吧？\n\n要是我昏迷了这么久都不吃不喝，那我应该早就死了。"
 time_lifeline.532.a:0 "事实上，我每次收到你的通讯的间隔都很长。"
 time_lifeline.533.desc:0 "怎么会，虽然我走得可能是慢了一些，但我很确定我每次和你通讯的间隔都只有几个小时呀？\n\n我倒是有些好奇，每次我向你发起通讯，你几乎是瞬间就接收到了。\n没想到你这么在乎我，嘿嘿。"
 time_lifeline.533.a:0 "其实，每次收到通讯，都需要一段时间才会转接给我。"
 time_lifeline.534.desc:0 "你这么一说，我怀疑我们之间的§H时间观念§!存在很大的不同……\n\n不对，再怎么不同都无法解释这一切，我认为我们之间的§H时间流速§!肯定存在着巨大的差异。"
 time_lifeline.534.a:0 "毕竟你处在黑洞里嘛。"
 time_lifeline.535.desc:0 "又提到了黑洞，原来你之前不是在开玩笑呀。\n\n但我很确信，我的飞船并没有坠毁在黑洞里，而是迫降在了一颗宜居星球上，甚至于这个星系里都没有黑洞！"
 time_lifeline.535.a:0 "太奇怪了，因为我们就是从黑洞收到你的信号的。"
 time_lifeline.536.desc:0 "这一系列事件的确令人费解，但现在纠结这些也无济于事。\n\n我们目前已经抵达半山腰了，他们所说的圣地应该位于山顶，等我见到了圣地再和你联络吧。\n这段时间里，我也会好好思考一下迄今为止的事。"
 time_lifeline.536.a:0 "明白了。"
 time_lifeline.536.a.response:0 "一会见。"
 
 time_lifeline.540.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者发觉环境发生了较大的改变，但目前的首要任务是前往山顶的圣地。>§!\n§E<记录备注：求救者发现我们之间存在时间差异，值得关注。>§!"
 time_lifeline.540.a:0 "圣地是个怎样的地方？"
 time_lifeline.541.desc:0 "山顶上有一座白色的祭坛，也许这里就是他们所说的“神圣的地方”。\n\n我跟着原住民走进祭坛，周围的墙壁上似乎绘画着大小不一但形状相似的图标。\n我来看看——好像是一条蛇，咬着自己的尾巴，身体盘起来变成了一个圈，我想这就是他们所崇拜的蛇神。"
 time_lifeline.541.a:0 "这应该叫“§H衔尾之蛇§!”。"
 time_lifeline.542.desc:0 "祭坛的正中央是一台巨大的机器，原住民们则将机器团团围住，这真是太诡异了。\n\n他们围着机器跳起舞来，一个身形佝偻的本地人则站在机器的旁边，口中念念有词。\n因为我在和你通讯，所以没法翻译他说的话。\n我想，这应该是某种祭祀仪式，那人也许是部落的祭司，正在为祭祀念诵祭词。\n\n气氛有些恐怖，我感到很不安。"
 time_lifeline.542.a:0 "抓紧你的飞行器，一有什么异样就立刻逃走。"
 time_lifeline.543.desc:0 "嗯，我抓得死死的，感觉心都快要跳出来了。\n\n仪式好像结束了，众人停下了舞蹈的步伐，祭司也不再念着陌生的咒语。\n祭司打开了机器的门，里面好像是一些精密的仪表和控制台，不知道是用来做什么的。\n周围的人自发散开，在我的面前空出了一条道路，祭司也对我做出了一个“请”的动作。\n\n他们……是希望我进去吗？"
 time_lifeline.543.a:0 "也许里面没有危险，还可能埋藏着这颗星球的秘密。"
 time_lifeline.543.b:0 "一切都太诡异了，他们不值得信任，赶快逃走！"
 time_lifeline.544.desc:0 "你……真的是这么想的吗？\n你应该不是在把我往火坑里推吧……\n\n好吧，我相信你，也许他们没有恶意。\n毕竟他们还把我当成神明的使者，应该不会做出献祭神使之类的大不敬举动……吧？\n那我就进去了……§R<噪音>§!……咦……§R<噪音>§!……\n\n……§R<噪音>§!……"
 time_lifeline.544.a:0 "怎么回事，你有危险？"
 time_lifeline.544.a.response:0 "……§R<噪音>§!……不，暂时没有，他们并未做出什么过激的举动，只是这台机器里似乎会屏蔽信号。\n\n那我就先进去了，我们一会再联络……§R<噪音>§!……"
 time_lifeline.545.desc:0 "你说的对，这场祭祀非常不对劲，也许这个部落有着人祭的传统，可能我就是他们献给“§H衔尾之蛇§!”的祭品！\n\n我不能再待下去了，我要启动飞行器离开这里。\n飞行时不方便通讯，那么等我回到飞船再和你联络。"
 time_lifeline.545.a:0 "好，我会等你的消息。"
 time_lifeline.545.a.response:0 "……嗖——"
 
 ################################################################
 # 阶段4（达成闭环）
 ################################################################
 
 time_lifeline.600.desc.pass:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者启动了时间机器，并迈向了未来。她的选择是正确的吗？>§!"
 time_lifeline.600.desc.future:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者启动了时间机器，并迈向了过去。我们的选择是正确的吗？>§!"
 time_lifeline.600.desc.future.chosen_by_myself:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者启动了时间机器，并迈向了过去。她的选择是正确的吗？>§!"
 time_lifeline.600.a:0 "从未如此期待你的联系，情况怎么样？"
 time_lifeline.601.desc.pass:0 "我似乎回到了正确的时间线。$time_lifeline.601.desc.same$"
 time_lifeline.601.desc.future:0 "我想，你的选择应该是正确的。$time_lifeline.601.desc.same$"
 time_lifeline.601.desc.future.chosen_by_myself:0 "我想，我应该赌对了。$time_lifeline.601.desc.same$"
 time_lifeline.601.desc.same:0 "\n\n我打开了门，机器外是破损的祭坛，屋顶已经彻底塌陷了，只剩一些断壁残垣仍然维持着祭坛原本的形状。\n祭坛外的雪地变成了灰色，似乎沾满了污秽，真不想踩上去。\n\n天空飘着洁白的细雪，四周很静谧，听不见一点声音，我感到有股安心感。"
 time_lifeline.601.a:0 "§H时间机器§!怎么样了？"
 time_lifeline.602.desc:0 "§H时间机器§!似乎报废了，我检查了一番，但没发现原因，不过它也暂时派不上用场了。"
 time_lifeline.602.a:0 "你接下来打算怎么办？"
 time_lifeline.603.desc:0 "我心想，反正这台机器也坏了，干脆把它拆开，说不定可以发现一些还能利用的零部件。\n\n毕竟这颗星球上好像也没有存活的文明，私自拆开……应该也没人会怪我吧，嘿嘿。"
 time_lifeline.603.a:0 "要是我派飞船去救你，你不会把飞船也拆了吧？"
 time_lifeline.603.a.response:0 "才不会呢！我要开始拆解了，别调侃我啦。\n\n我一有什么发现就会立刻联系你的。"
 
 time_lifeline.610.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者似乎回到了正确的时间线，但时间机器坏了，求救者正在对其进行拆解。>§!\n§E<记录备注：她好像真的很喜欢拆东西。>§!"
 time_lifeline.610.a:0 "有什么可用的零件吗？"
 time_lifeline.611.desc:0 "是的，我找到了。\n\n和我猜想的一样，§H时间机器§!的核心是这颗§H时间水晶§!。\n并且它还是人造的，难道这颗星球上曾有能制造出这么精密的物质的文明吗？\n不过它们现在似乎已经不在了。"
 time_lifeline.611.a:0 "§H时间水晶§!是什么东西？"
 time_lifeline.611.a.response:0 "§H时间水晶§!是一种独特的晶体，一般只被发现于黑洞视界内，似乎需要一定的引力场和时间扭曲引发的磁场变化才能形成。\n\n因此，大家一般使用的都是天然§H时间水晶§!，难以进行人工合成。\n在我的认知里，迄今为止仅有几例人工合成的事迹。\n\n§H时间水晶§!本身具备一定扭曲时空的能力，但需要合适的方法才能激发。\n具体原理我也不太清楚，我只管实际使用就行了，嘿嘿。"
 time_lifeline.611.b:0 "这对你来说很重要吗？"
 time_lifeline.612.desc.same:0 "我的飞行器实际上是我的施术单元，飞行只是其中一个功能。\n我进行§H时空穿梭§!就是靠的施术单元，而§H时空模块§!的核心就是一颗§H时间水晶§!，只是它在上一次穿梭的过程中严重损坏了。"
 time_lifeline.612.desc:0 "当然很重要了，毕竟我是§H时间旅行者§!嘛。\n\n$time_lifeline.612.desc.same$"
 time_lifeline.612.a:0 "那你的意思是？"
 time_lifeline.613.desc:0 "当然很重要了，毕竟我是§H时间旅行者§!嘛。\n\n对了，我之前好像都没有提起过这件事，毕竟§H时空穿梭§!这种事总是令人难以置信的。\n但我刚刚才利用§H时间机器§!返回了正确的时间线，这样你应该能相信了吧？\n\n嗯……好像也还是没什么说服力。\n毕竟你既没有亲眼看见过，也没有亲身经历过，一直都是我在自说自话而已。"
 time_lifeline.613.a:0 "不，我当然相信。"
 time_lifeline.614.desc:0 "你愿意相信真是太好了。\n\n$time_lifeline.612.desc.same$"
 time_lifeline.614.a:0 "$time_lifeline.612.a$"
 time_lifeline.615.desc:0 "没错，我要用§H时间机器§!的§H时间水晶§!来修复我的施术单元的§H时空模块§!。\n有了这个，我就能暂时进行§H时空穿梭§!了。\n\n不过没做好万全的准备就进行§H时空穿梭§!是很危险的，而且我的飞船也还没修好。\n所以，我打算在这里建立一个§H时空锚点§!，让她们来为我提供补给、修复飞船。"
 time_lifeline.615.a:0 "§H时空锚点§!又是什么？"
 time_lifeline.616.desc:0 "§H时空锚点§!其实相当于时间轴和空间轴上的一个坐标，通过这个坐标就能准确地抵达我所在的时间节点与空间节点。\n\n当我建立起§H时空锚点§!并用一种特定形式在时空上传播时，不同时间线上的我就会接收并破译信号，她们也就会得知我需要帮助。\n如果接收信号的我距离§H时空锚点§!足够近，并且恰好有能力给予帮助，就会抵达锚点赶来帮忙。\n\n这是在我们内部约定俗成的规则，毕竟大家都是我自己嘛。\n为了达成美好的时间闭环，大家都会共同为自己努力的。"
 time_lifeline.616.a:0 "这……还真是一个方便的好东西啊。"
 time_lifeline.617.desc:0 "你要是把它想得太简单可就大错特错了哦。\n\n虽然和§H时空穿梭§!相比更轻松，但要建立§H时空锚点§!也是很费时费力的，维持得越久就越危险。\n不仅如此，利用§H时空锚点§!展开救援本身也是扰动时空的行为，如果未能及时达成闭环，甚至可能因为蝴蝶效应引发严重的因果混乱。\n\n所以，不到万不得已的时候，我是不会这么做的。"
 time_lifeline.617.a:0 "现在已经是万不得已的状况了吗？"
 time_lifeline.618.desc:0 "准确来说还没有那么危急，但毕竟我的施术单元已经坏了，如果新的§H时间水晶§!也遭到破损，我就没机会建立§H时空锚点§!了。\n\n更何况，我已经很久没吃东西没喝水了，现在又饿又累，稍微找人帮个忙也可以理解吧，嘿嘿。"
 time_lifeline.618.a:0 "你总能找到各种各样的理由。"
 time_lifeline.618.a.response:0 "好啦，接下来，我就要建立§H时空锚点§!了。\n\n等我把飞船修好就会和你联系的。"
 
 time_lifeline.620.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者准备建立时空锚点，利用时间线来获取帮助。>§!\n§E<记录备注：一个充满谜团的人，她真的可信吗？>§!"
 time_lifeline.620.a:0 "飞船修好了吗？"
 time_lifeline.621.desc:0 "嗯，已经修理好了，我也做完了补给。\n\n不过我被骂了一顿，因为她穿越时空赶来提供帮助又返回原本的时间线，所以在短时间内无法再次§H时空穿梭§!了。\n她发现我的处境没那么糟糕，感觉被骗了，就气鼓鼓地走了，嘿嘿。\n\n不过见到另一个自己的感觉真奇怪，好害羞呀。"
 time_lifeline.621.a:0 "你们不能频繁进行§H时空穿梭§!吗？"
 time_lifeline.622.desc:0 "当然不能了，§H时空穿梭§!是非常耗费体能的，我又不是机器，也会累的呀。\n\n而且，虽然在体力允许的情况下的确可以频繁穿越，但在多次高频改变时间线的影响下，时空会变得紊乱，§H时空穿梭§!也很难安全准确地抵达目的地。\n如果跑错了地方，甚至被困在§H时空乱流§!里，都是非常危险的事情。\n\n所以，我只有在极端特殊情况下才会这么做。"
 time_lifeline.622.a:0 "那你接下来打算做什么？"
 time_lifeline.623.desc.same:0 "因为我在抵达这颗星球前才进行过§H时空穿梭§!，所以我暂时无法再次进行穿梭。\n因此，我打算再调查一遍这颗星球，毕竟这颗星球看起来充满谜团嘛。\n\n"
 time_lifeline.623.desc.pass:0 "$time_lifeline.623.desc.same$我有件事情一直很在意，所以我准备前往这颗星球的太空轨道探索一番，也许那里可以找到问题的答案。"
 time_lifeline.623.desc.future:0 "$time_lifeline.623.desc.same$飞船的四周基本都已经调查过了，所以我准备前往尚未造访的东部沙漠，说不定那里会有新的发现。"
 time_lifeline.623.a:0 "如果找到了线索记得联系我。"
 time_lifeline.623.a.response:0 "当然啦，毕竟我还有想要问你的事情。\n一会见。"
 time_lifeline.623.b:0 "如果有什么发现记得联系我。"
 time_lifeline.623.b.response:0 "那是自然，我还会需要你的帮助的。\n一会见。"
 
 ################################################################
 # 阶段4（达成闭环-过去）
 ################################################################
 
 time_lifeline.630.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者的飞船修好了，因为有在意的地方，所以前往太空轨道探索。>§!"
 time_lifeline.630.a:0 "你找到问题的答案了吗？"
 time_lifeline.631.desc:0 "不，暂时还没有，不过我有件事想向你确认一下。"
 time_lifeline.631.a:0 "什么事？"
 time_lifeline.632.desc:0 "你每次接收到我的信号，它们的间隔应该很长吧，我想应该有几个月甚至几年的空隙。"
 time_lifeline.632.a:0 "的确如此。"
 time_lifeline.633.desc:0 "果然，因为我发现，你方的副手声音经常改变，我猜测是因为你们的人事变动了。\n\n但人事不可能在一天之内变动得这么频繁，所以只有可能是——你们那里时间流逝得比我想的长得多。"
 time_lifeline.633.a:0 "为什么你会认为是在一天之内变动？"
 time_lifeline.634.desc:0 "因为对我而言，不考虑§H时空机器§!改变的时间，现在所经历的一切都是在一天之内发生的。\n\n我这里经过一天，你们那里却经过几年……\n我认为这不会是因为我们之间的§H时间观念§!存在着不同，而是我们之间的§H时间流速§!的的确确存在巨大的差异！"
 time_lifeline.634.a:0 "毕竟你处在黑洞里嘛。"
 time_lifeline.635.desc:0 "黑洞？我记得你之前也曾提到过这个词，当时我只以为你在开玩笑，现在看来，应该是真的。\n\n可我并不认为我处在黑洞里，因为我确信这只是一颗平平无奇的宜居星球。\n但§H时间流速§!的差异是客观存在的，我想想……"
 time_lifeline.635.a:0 "也许是星球上的某样东西影响了时间？"
 time_lifeline.636.desc:0 "的确有这个可能性，不过这个东西究竟是什么呢？\n\n当然，不会是§H时间机器§!，因为单凭一台机器并不足以产生这么大的广域时间差距。\n\n对了，黑洞！\n尽管这个星系的恒星并不是黑洞，但之前，我的飞船就是因为一阵异常引力波动而坠毁在这颗星球上的。\n我猜想，也许这颗星球的轨道上存在一个小型黑洞，只是尚未形成足够大的吸积盘，因此我没能观测到它的存在。\n\n接下来，我只需要分析星球各处的引力场变化，就能锁定那颗黑洞可能存在的范围了。"
 time_lifeline.636.a:0 "靠近黑洞不会很危险吗？"
 time_lifeline.637.desc:0 "黑洞确实很危险，如果不慎误入视界，即使是我也很难逃离。$time_lifeline.637.desc.same$"
 time_lifeline.637.desc.same:0 "\n\n但是啊，追求真理的路上总是存在牺牲的，如果仅仅因为危险就选择逃避，又该如何发现真相呢？\n\n当然了，我绝不会白白送死，因为我也有着自己的使命。\n所以，我会小心谨慎的，相信我吧。"
 time_lifeline.637.a:0 "那就相信你的能力吧。"
 time_lifeline.637.a.response:0 "放心吧。"
 time_lifeline.637.b:0 "不行，我不能容忍别人踏上有去无回的旅途。"
 time_lifeline.638.desc:0 "为什么要这么坚持呢……\n\n好吧，既然是你的选择，那我就只能放弃这个打算了。\n毕竟不是所有的谜题都需要一个答案，有的结果与真相反而会令人遗憾。$time_lifeline.647.desc.same$"
 time_lifeline.638.a:0 "$time_lifeline.647.a$"
 time_lifeline.638.a.response:0 "$time_lifeline.647.a.response$"
 
 time_lifeline.640.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者计划通过分析引力场来搜寻潜在的黑洞。>§!\n§E<记录备注：求救者发现我们之间存在时间差异，值得关注。>§!"
 time_lifeline.640.a:0 "找到那颗黑洞了吗？"
 time_lifeline.641.desc:0 "应该算是找到了吧，只是跟我预料的有点不同。\n\n这颗黑洞，准确来说是奇点，周围根本就不存在吸积盘，我只能通过引力场来判断它的视界范围。\n根据视界范围和黑洞质量推算，这颗奇点的直径甚至比普朗克长度还要小，远低于机器的计算精度，这分明是不可能发生的情况。\n不仅如此，这颗看不见的奇点还在以一种无规律的方式位移，似乎并非受周边天体的影响，而是仅凭自己的意愿行动。\n\n这东西到底是什么？"
 time_lifeline.641.a:0 "我们可能曾经接触过这种天体，并称其为“§H游荡奇点§!”。"
 time_lifeline.641.b:0 "我们也对这种神秘的天体没有了解。"
 time_lifeline.642.desc.1:0 "“§H游荡奇点§!”？真是个贴切的好名字。$time_lifeline.642.desc.same$"
 time_lifeline.642.desc.2:0 "由于它一直在太空中游荡，我决定称呼它为“§H游荡奇点§!”。$time_lifeline.642.desc.same$"
 time_lifeline.642.desc.same:0 "\n\n我不清楚§H游荡奇点§!为什么会出现在这里，但我可以确定，之前导致飞船坠毁的就是这颗奇点，它周围的引力场异常与航行记录仪中的数据吻合。"
 time_lifeline.642.a:0 "§H游荡奇点§!会是引发时间差异的根源吗？"
 time_lifeline.643.desc:0 "我认为不完全是这样。\n\n但是，我的飞船检测到你的信号正是来自这颗奇点，恐怕目前也只能这么判断了。\n我猜测，我们原本是无法联系上彼此的，但是信号却通过黑洞来往于两个不同的世界，这也就导致了§H时间流速§!的差异。"
 time_lifeline.643.a:0 "也许你的宇宙就在一颗黑洞里，§H游荡奇点§!则是通往外界的桥梁。"
 time_lifeline.644.desc:0 "合理的假设。\n\n可是，你有没有想过，如果你才是黑洞里的那个人呢？"
 time_lifeline.644.a:0 "不，我从来没这么想过。"
 time_lifeline.645.desc:0 "果然，我们所有人都坚信自己所处的世界是真实的，对方的才是视界之内的宇宙。\n\n但如果我们一直以来所坚信的错了呢？\n或许是你在黑洞之中，或许是我在黑洞之中，或许我们都在黑洞之中，或许没有人在黑洞之中。\n\n毕竟没有人可以用梦里的事物证明自己在不在梦里。"
 time_lifeline.645.a:0 "这样就永远无法判断孰对孰错了。"
 time_lifeline.646.desc:0 "可能如此。\n谁能肯定，黑洞中不会孕育着一个宇宙呢？\n谁又能肯定，自己的宇宙不是孕育在另一个黑洞中呢？\n\n这个问题也许没有答案。\n但我相信，总有一天，我们可以突破无穷无尽的技术的上限，抵达浩瀚无垠的宇宙的边缘，并藉此探索“视界之外”的世界，得到我们想要的答案。\n\n那时候，我们就不再是梦中人了。"
 time_lifeline.646.a:0 "我也相信，一定会有那么一天。"
 time_lifeline.647.desc:0 "是时候告别了，天下没有不散的宴席。\n\n这颗星球上没有我特别在意的事物了，我已经找到了自己的答案。$time_lifeline.647.desc.same$"
 time_lifeline.647.desc.same:0 "\n再过不久，我就会激活施术单元，带着整艘飞船穿梭到另一片时空。\n届时，我们或许就无法再取得联系了。\n\n这可能是我们之间的最后一次通讯。\n但我相信，在无穷无尽的未来，我们一定可以再见。"
 time_lifeline.647.a:0 "是的，一定。"
 time_lifeline.647.a.response:0 "未来未来，不确定的才是未来。\n让我们未来再见。"
 
 time_lifeline.650.desc:0 "我们已经有很久没有收到当初的求救者的通讯了，可能对方已经遭遇了不测。\n\n或许对方操作失误被奇点捕获，或许对方沉醉于真相而驶入视界，或许……\n\n没有什么或许，时间没有退路，事实已成既定。"
 time_lifeline.650.a:0 "如果回到当初，我们是否可以劝阻她？"
 time_lifeline.650.b:0 "$time_lifeline.300.b$"
 time_lifeline.650.c:0 "追求真理的道路上总是不乏牺牲。"
 time_lifeline.650.d:0 "$time_lifeline.300.d$"
 time_lifeline.650.e:0 "$time_lifeline.300.e$"
 
 ################################################################
 # 阶段4（达成闭环-未来）
 ################################################################
 
 time_lifeline.660.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者的飞船修好了，因为有在意的地方，所以前往东部沙漠探索。>§!"
 time_lifeline.660.a:0 "你有什么新的发现吗？"
 time_lifeline.661.desc:0 "我并没有发现什么实际上的东西，而是在感官上察觉了异样。\n\n这片沙漠很奇怪，各个地区的§H时间流速§!都大相径庭，有的地方分子热运动极快，有的地方却如冻住一般静止。\n不仅如此，空气对光的折射率也存在很大的差距，某个方向五光十色，另一个方向却漆黑一片。\n种种现象表明，这片沙漠的各部分光速是不同的，甚至是时刻变化的。\n\n尽管这一现象十分罕见，但我的确曾经历过。\n这里充斥着§H时空乱流§!。"
 time_lifeline.661.a:0 "§H时空乱流§!是什么？"
 time_lifeline.662.desc:0 "§H时空乱流§!是一种特殊的物理现象，不同区域之间的§H时空曲率§!不同，这也导致了物理性质、物理参数乃至物理法则的差异。\n\n在§H时空乱流§!中，时间轴与空间轴是不固定且非单向的，它们会在各个节点分裂，并朝着不同的方向延申。\n它具备极高的危险性，因为难以通过逻辑判断自己的行为会造成何种影响。\n被困于其中的普通人几乎不可能逃脱，甚至会因为自己一个寻常的举动引发死循环，导致所有的自己都被迫迈向死路。\n\n即使是我，若无施术单元的辅助，也极有可能陷入死局。"
 time_lifeline.662.a:0 "施术单元真是个万能的宝贝。"
 time_lifeline.663.desc:0 "嘿嘿，它的确是个值得信赖的伙伴，但这并不代表我离开它就什么也做不了。\n\n实际上，飞行和时空操控都是我自己的能力，我本人可以独立于施术单元短暂地运用能力。\n施术单元只是一个辅助我施放术法的工具，起到放大、分流、载荷、维稳等作用，可以让能力的运用更加轻松、更加持久、更加高效。\n施术单元的飞行功能并非是简单地利用浮力或者反作用力，而是由一种类似引力场或者相位的形式实现的，这实质上是将我产生的相位场放大来进行位移。\n就连施术单元的§H时间水晶§!也是需要我本人轻微扭曲时空才能激活的，这就是我进行§H时空穿梭§!的原理。\n\n不过施术单元曾多次救了我的命，我确实离不开它。"
 time_lifeline.663.a:0 "看来是我夸错对象了。"
 time_lifeline.664.desc:0 "好啦，不聊这个了。\n\n现在问题的关键是为什么这片沙漠会充满§H时空乱流§!，以及为什么我之前没有察觉。\n\n若想解开谜题，应该只有在沙漠的深处才能找到答案吧。"
 time_lifeline.664.a:0 "但这片沙漠不是很危险吗？"
 time_lifeline.665.desc:0 "§H时空乱流§!确实很危险，哪怕只有一步路走错，即使是我也很难补救。$time_lifeline.637.desc.same$"
 time_lifeline.665.a:0 "$time_lifeline.637.a$"
 time_lifeline.665.a.response:0 "$time_lifeline.637.a.response$"
 time_lifeline.665.b:0 "$time_lifeline.637.b$"
 time_lifeline.666.desc:0 "$time_lifeline.638.desc$"
 time_lifeline.666.a:0 "$time_lifeline.638.a$"
 time_lifeline.666.a.response:0 "$time_lifeline.638.a.response$"
 
 time_lifeline.670.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者计划前往沙漠深处以调查时空乱流>§!\n§E<记录备注：求救者本人拥有飞行与时空操控的能力，值得关注。>§!"
 time_lifeline.670.a:0 "找到线索了吗？"
 time_lifeline.671.desc:0 "我想，我应该是发现了问题的根源。\n\n在沙漠的中心地带，这里弃置着不计其数的§H时间机器§!。\n有的只蒙了一层沙尘，有的被黄沙半掩，有的则完全陷入沙地，仅露出了顶部的表面。\n\n单是这样的数量就已经很庞大了，若是再考虑深埋于沙地之下的机器，结果只会更加惊人。"
 time_lifeline.671.a:0 "这些机器就是引发乱流的原因吗？"
 time_lifeline.672.desc:0 "基本上可以肯定，因为这里几乎全部的§H时间机器§!都处于激活状态！\n\n准确来说，不是有人主动启动了它们，而是机器核心的§H时间水晶§!在各自的时空场影响下产生了共鸣。\n无数的水晶以截然不同的形式影响着时空，也就引发了这一系列混乱。\n\n甚至不仅是§H时空乱流§!，也许这颗星球上的各种灾害都是它们导致的。\n在与你通讯之前，我就曾亲眼见过暴雨、冰雹、闪电、飓风同时出现的可怖情景。\n我猜想，§H时空乱流§!里的种种蝴蝶效应彼此叠加，致使沙漠之外的天气变化无常。\n长期生活其中的生物甚至可能无法适应变幻莫测的环境而转变成怪物，先前我遭遇的那群黑色怪物也许就是来源于这片沙漠。\n\n说不定，这颗星球原本的文明就是因此覆灭的。"
 time_lifeline.672.a:0 "这简直是一场灾难，他们为什么要这么做？"
 time_lifeline.673.desc:0 "我也很好奇，这个文明究竟有多么发达，竟然可以批量生产如此巨量的§H时间机器§!。\n\n我刚刚才发现，几乎所有的机器上都画着一个§H衔尾之蛇§!的图标，他们也许是出于某种信仰制造的这些机器。\n这里还有一段文字，我尝试翻译一下：\n“§H谨献给最伟大的时空之主——时之螶§!”\n\n§H时之螶§!？"
 time_lifeline.673.a:0 "这是个熟悉的名字。"
 time_lifeline.673.b:0 "这或许就是他们所信奉的神明。"
 time_lifeline.674.desc.1:0 "你知道§H时之螶§!代表着什么吗？\n不，这似乎也不是很重要。\n总之，这个§H时之螶§!应该就是他们所信奉的神明吧。$time_lifeline.674.desc.same$"
 time_lifeline.674.desc.2:0 "我认为很有这个可能，尽管我并不知道§H时之螶§!代表着什么。$time_lifeline.674.desc.same$"
 time_lifeline.674.desc.same:0 "\n\n这个文明应该是§H时之螶§!的狂热追随者。\n有可能是这位“时空之主”要求他们建造这些机器，有可能是他们自作主张地改变时空以讨神明的欢心，有可能是他们接受了神明的帮助却肆无忌惮而招致惩罚……\n\n其原因已经随着文明的覆灭消失在时间长河里，但这个文明亲手促成了自己的衰亡是不争的事实。"
 time_lifeline.674.a:0 "他们没能强大到左右自己的命运。"
 time_lifeline.675.desc:0 "不，没那么简单，永远不要轻视时间。\n\n尽管时间看似毫无规律，但时间有着它自己的法则，只是我们暂时无从得知。\n玩弄时间的把戏最终只会自食恶果，顺应时间的浪潮才是世界的本质。\n\n正因如此，我们只能小心谨慎地探索时间，避开时间的逆鳞。\n正是如此，我们才能成功地引导时间，得以窥见时间的一角。"
 time_lifeline.675.a:0 "但你似乎最擅长时间把戏。"
 time_lifeline.676.desc:0 "的确如此，也许总有一天，时间会对我降下惩罚。\n\n可我也有我自己的使命，我注定会在一定程度上违背时间，也不知这究竟是时间的默许，还是一时的宽容。\n\n并且啊并且，起码现在的我还活得好好的，以后的命运就以后再说吧。"
 time_lifeline.676.a:0 "可你刚刚才劝我们不要轻视时间。"
 time_lifeline.677.desc:0 "那是当然了，毕竟你代表了一个文明，必须要为整个文明的未来考虑。\n\n而我只是一个个体，即使我死去了，我也不需要为别人负责。\n并且，个体的死亡并不意味着整体的灭亡，无穷无尽的时间线上，还有无数个自己会替我达成目标。"
 time_lifeline.677.desc.chosen_by_myself:0 "$time_lifeline.677.desc$\n\n正如之前在§H时间机器§!里的选择一样，这是我自己决定的命运。\n既然那时，我成功地回到了正确的时间线，那么现在，我也一定不会走偏。\n我相信，我坚信，我确信，我所选择的道路一定会通往阳光灿烂的明天。"
 time_lifeline.677.a:0 "或许这就是你我的责任吧。"
 time_lifeline.677.b:0 "这听起来和我们有些类似。"
 time_lifeline.678.desc:0 "你有你的责任，我也有我的使命，接下来就该告别了。\n\n虽然找出了§H时空乱流§!的根源，但我总感觉仍有未解之谜。\n不过我也没有时间继续探索这颗星球了，不是所有的谜题都需要一个答案。$time_lifeline.647.desc.same$"
 time_lifeline.678.a:0 "$time_lifeline.647.a$"
 time_lifeline.678.a.response:0 "$time_lifeline.647.a.response$"
 
 time_lifeline.680.desc:0 "我们已经有很久没有收到当初的求救者的通讯了，可能对方已经遭遇了不测。\n\n或许对方迷失于时空乱流，或许对方在沙漠深处遭到攻击，或许……\n\n没有什么或许，时间没有退路，事实已成既定。"
 time_lifeline.680.a:0 "$time_lifeline.650.a$"
 time_lifeline.680.b:0 "$time_lifeline.300.b$"
 time_lifeline.680.c:0 "时间是个可怕的对手。"
 time_lifeline.680.d:0 "$time_lifeline.300.d$"
 time_lifeline.680.e:0 "$time_lifeline.300.e$"
 
 ################################################################
 # 阶段4（偏离航道）
 ################################################################
 
 time_lifeline.700.desc.pass:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者启动了时间机器，并迈向了过去。她的选择是正确的吗？>§!"
 time_lifeline.700.desc.future:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者启动了时间机器，并迈向了未来。我们的选择是正确的吗？>§!"
 time_lifeline.700.desc.future.chosen_by_myself:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者启动了时间机器，并迈向了未来。她的选择是正确的吗？>§!"
 time_lifeline.700.a:0 "$time_lifeline.600.a$"
 
 ################################################################
 # 阶段4（偏离航道-过去）
 ################################################################
 
 time_lifeline.710.desc:0 "我感觉很不对劲。\n\n我现在还待在§H时间机器§!里，但感觉空气十分灼热，金属外壳也烫得难以接近。\n还有件非常奇怪的事情，那就是这台机器突然不屏蔽信号了，所以我现在能和你通讯。"
 time_lifeline.710.a:0 "能看看外面发生了什么吗？"
 time_lifeline.710.b:0 "最好先待在原地，等待机器冷却。"
 time_lifeline.710.b.response:0 "我想这应该不是机器本身运转产生的热量，应该是外面有什么东西。\n\n不过静观其变总不是坏事，贸然出去可能会有危险。"
 time_lifeline.711.desc:0 "好，我要开门了。\n\n呜哇！是滚烫的岩浆！\n为什么这里会有岩浆？\n它灌进机器里了！"
 time_lifeline.711.a:0 "糟糕！"
 time_lifeline.711.a.response:0 "（另一端传来了惨叫声。）\n\n§R<通讯已切断。>§!"
 time_lifeline.712.desc:0 "通讯就此切断，我们再也无法与求救者取得联系了。\n\n她恐怕已经葬身于岩浆之中。"
 time_lifeline.712.a:0 "$time_lifeline.300.a$"
 time_lifeline.712.b:0 "$time_lifeline.300.b$"
 time_lifeline.712.c:0 "我们不应拿他人的生命冒险。"
 time_lifeline.712.d:0 "$time_lifeline.300.d$"
 time_lifeline.712.e:0 "$time_lifeline.300.e$"
 
 time_lifeline.720.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：时间机器外似乎存在热源，求救者在等待冷却。>§!"
 time_lifeline.720.a:0 "怎么样，外面冷下来了吗？"
 time_lifeline.721.desc:0 "机器的外壳温度开始降下来了，不过空气还是依然灼热，地板也在发烫，我感到有些呼吸困难。"
 time_lifeline.721.a:0 "现在外面应该安全了，小心点开门。"
 time_lifeline.722.desc:0 "好，我会小心的。\n\n欸？外面的世界，这是怎么了？"
 time_lifeline.722.a:0 "外面变成什么样了？"
 time_lifeline.723.desc:0 "祭坛消失了，准确来说，是原本的整个世界都消失了，取而代之的是一片火海！\n\n整颗星球都被灼热的岩浆覆盖了，一些浮在熔岩表面的岩石才刚冷却下来就又被融化了。\n这台机器现在就浮在岩浆上，如果我把门打开得再大些，说不定岩浆就会灌进来了！"
 time_lifeline.723.a:0 "难道你穿越的时间点错了？"
 time_lifeline.724.desc:0 "看来是这样的，现在似乎是星球诞生没多久，地壳都尚未冷却的时期。\n\n我太鲁莽了！"
 time_lifeline.724.a:0 "你可以重新启动§H时间机器§!吗？"
 time_lifeline.725.desc:0 "糟糕，这台机器的核心部件好像被烧坏了，现在已经无法启动了。\n\n我好像，回不去了……"
 time_lifeline.725.a:0 "能不能修好核心部件？"
 time_lifeline.726.desc:0 "恐怕非常困难，而且就算能，我也没有足够的材料。\n\n不过我想到了一个办法，让我先把核心部件拆出来，看看有没有我想的那个东西。"
 time_lifeline.726.a:0 "你指什么东西？"
 time_lifeline.726.a.response:0 "还不能确定有没有呢，等我拆出来就知道了。\n\n等会联络。"
 
 time_lifeline.730.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者似乎回到了熔岩时期，正在拆解核心部件。>§!"
 time_lifeline.730.a:0 "你找到需要的东西了吗？"
 time_lifeline.731.desc:0 "还好，找到了。\n\n和我猜想的一样，§H时间机器§!的核心是这颗§H时间水晶§!。\n并且它还是人造的，难道这颗星球上曾有能制造出这么精密的物质的文明吗？\n明明它们连太空时代都没迈入。\n\n如果能用这颗§H时间水晶§!来替换我的施术单元的§H时空模块§!核心，或许我就能尝试§H时空穿梭§!了。"
 time_lifeline.731.a:0 "等等，你都在说些什么？"
 time_lifeline.732.desc:0 "欸，我之前没跟你说过吗？\n\n其实，我是个§H时间旅行者§!。$time_lifeline.612.desc.same$"
 time_lifeline.732.a:0 "我还以为你只是想象力丰富。"
 time_lifeline.733.desc:0 "呀，你是这么看我的呀……\n\n不过重要的是别的啦，就是从§H时间机器§!里拆出来的§H时间水晶§!。\n糟糕，温度实在是太高了，这颗水晶的绝大部分都已经受热变性了，最乐观的情况下也只有中心部分的水晶可能正常生效。"
 time_lifeline.733.a:0 "那部分水晶足以让你进行§H时空穿梭§!吗？"
 time_lifeline.734.desc:0 "我想，可能远远不够吧……\n\n空气越来越灼热了，氧含量也越来越低。\n我还可以闻到刺鼻的硫磺味，我的呼吸道正遭受持续不断的损伤，情况十分危险。\n\n但是，我已经束手无策了，我找不到办法逃脱，我也没有办法完成使命……"
 time_lifeline.734.a:0 "真的没有办法了吗？"
 time_lifeline.735.desc:0 "我想，我还有最后一个手段。\n\n这颗§H时间水晶§!的核心或许不足……咳咳……不足以让我进行§H时空穿梭§!，但是，它应该可以把通讯器带到另一个时间线上。"
 time_lifeline.735.a:0 "你是说？"
 time_lifeline.736.desc:0 "我准备把这只通讯器改造成留言器，并利用§H时间水晶§!将它寄给曾经的我……咳咳……也就是第二次启动机器前的我。\n\n……咳咳……\n我会告诉我自己，我误判了时间点，那时候的我不在未来，而是在过去……咳咳……"
 time_lifeline.736.a:0 "可是现在的你……"
 time_lifeline.737.desc:0 "自然，现在的我绝无可能生还，但至少……咳咳……不同时间线上的我还能有一线生机。\n\n我也不是第一次经历这种事了……咳咳……虽然只是得知了另一个自己陷入死局，但我相信，另一个我一定是做好了赴死的准备……咳咳……用尽最后的力气将其它的我引领到真正的闭环。\n\n我并不孤单，无数个宇宙中，无数条时间线上，还有无数个我在为使命奋力拼搏。\n就算我死了，也还有无数个我活着，我会为她们开辟一条正确的航道。"
 time_lifeline.737.a:0 "我尊重你的选择。"
 time_lifeline.737.a.response:0 "我要完成我最后的任务……咳咳……如果你以后见到了另一个我，记得代我向她问好。\n\n§R<通讯已切断。>§!"
 
 time_lifeline.740.desc:0 "通讯就此切断，我们再也无法与求救者取得联系了。\n\n她在为自己的最后使命做准备。"
 time_lifeline.740.a:0 "时间是个圆，一切最终都会作用在自己身上。"
 time_lifeline.740.b:0 "时间是个迷宫，她用生命寻找着迷宫的出口。"
 time_lifeline.740.c:0 "在生命的最后时刻也要为他人开辟生机，真是个伟大的人。"
 time_lifeline.740.d:0 "她为自己战斗到了最后一刻，向她致敬。"
 time_lifeline.740.e:0 "一切都是为了所有自己的共同理想。"
 time_lifeline.740.f:0 "我们一定会再见的，一定。"
 
 ################################################################
 # 阶段4（偏离航道-未来）
 ################################################################
 
 time_lifeline.760.desc.1:0 "我想，你的选择应该是正确的。$time_lifeline.760.desc.same$"
 time_lifeline.760.desc.2:0 "我想，我应该赌对了。$time_lifeline.760.desc.same$"
 time_lifeline.760.desc.same:0 "\n\n机器外面依然没有祭坛的踪影，但山峰的积雪还在。\n这大概是在黑雨过后的不久吧，祭坛可能是被黑雨彻底摧毁了，幸好我通过§H时间机器§!逃过一劫。"
 time_lifeline.760.a:0 "你接下来打算怎么办？"
 time_lifeline.761.desc:0 "这台机器似乎彻底报废了，我也不知道是因为我操作不当，还是因为它运转得太频繁了，又或者是它本来就已经到了使用年限。\n\n但无论如何，我都用不上这台机器了，所以我准备把它拆了，说不定会有我能用得上的零部件。"
 time_lifeline.761.a:0 "那就祝你好运。"
 time_lifeline.761.a.response:0 "谢谢。一有什么发现，我就会立刻联系你的。"
 
 time_lifeline.770.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者似乎回到了正确的时间线，但时间机器坏了，求救者正在对其进行拆解。>§!"
 time_lifeline.770.a:0 "发现了什么有用的零部件吗？"
 time_lifeline.771.desc:0 "那已经不重要了……我发现了非常可怕的一个事实！"
 time_lifeline.771.a:0 "你的声音颤抖得很厉害，发生什么了？"
 time_lifeline.772.desc:0 "我被包围了！被黑色的海洋包围了！\n\n之前时间紧迫，我没能仔细观察，但现在我发现了，这片黑色的海洋实际上是由一种黑色的粘稠物质组成的。\n我最初碰到的那些怪物看起来就是这种物质！"
 time_lifeline.772.a:0 "黑色的……怪物？"
 time_lifeline.773.desc:0 "是的，就是那个只有在我移动时才会行动的怪物。\n\n我也对这黑色的海洋进行了测试，它们同样具备这样的特性，这也就证明了，这片海洋实际上是由无数个黑色怪物融合而成的巨大怪物。\n更恐怖的是，整个世界已经被黑色的海洋淹没了，只有这块山顶仍幸免于难。"
 time_lifeline.773.a:0 "听起来糟透了。"
 time_lifeline.774.desc:0 "幸好，这片海洋离我还有一段距离。\n\n起初，我以为只要我保持不动就不会有危险，但后来，我发现我错了。\n当我保持不动时，这团黑色的粘稠物质并不是同样维持静止，而是以微弱的速度向外扩张。\n但现在，黑色的粘稠物质大量聚集，每一份微小都汇聚成庞大，纵使我保持不动，黑色的海洋依然以肉眼可见的速度向上蔓延。\n\n也就是说，总有一天，我会被它们吞噬。"
 time_lifeline.774.a:0 "它们需要多久才会蔓延到顶点？"
 time_lifeline.775.desc:0 "我不能确定。\n\n它们的蔓延速度时快时慢，难以测量。\n也许后天？明天？\n也许只要今天。\n\n真是可恶啊，明明做出了正确的选择，却没能得到好的结果。\n§H时间机器§!无法启动了，我的飞行器也无法修复，而且就算能修复，我也没法逃离这颗星球……"
 time_lifeline.775.a:0 "耐心等待吧，也许事情会有转机。"
 time_lifeline.775.a.response:0 "只能期待奇迹了。\n\n我又累又饿，需要休息一段时间了……"
 time_lifeline.775.b:0 "$time_lifeline.775.a$"
 time_lifeline.775.b.response:0 "只能期待奇迹了。\n\n我又累又饿，身上的伤口也隐隐作痛。我需要休息很长一段时间了，很长很长，很长……"
 
 time_lifeline.780.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者被黑色的海洋包围，等待着奇迹的降临。>§!"
 time_lifeline.780.a:0 "事情有什么转机吗？"
 time_lifeline.781.desc:0 "没有，没什么转机，也没什么奇迹。\n\n我没有食物可以吃，我没有水可以喝，我只能睡觉。\n但每次睡醒后，那片黑色的海洋就又往上蔓延了一大段。\n为了避免激活它，我什么都不敢做，似乎无论我干什么都会加快我的死亡。\n\n我把石头丢进去，石头不见了，海向上爬了一截；\n我把雪球丢进去，雪球不见了，海向上爬了一截；\n我把树枝丢进去，树枝不见了，海向上爬了一截。\n\n你能体会到吗，一个人眼睁睁地看着死亡向自己走来毫不停歇，而自己却无能为力的感觉有多绝望？"
 time_lifeline.781.a:0 "……"
 time_lifeline.782.desc:0 "我就像被困在一个没有出口的迷宫里，无论我如何挣扎，都不能找到前进的方向。\n\n我所做的一切，都只是把我朝死亡推得更进一步。\n我，已经没有办法了。\n我，已经受够了。\n我……"
 time_lifeline.782.a:0 "等等，还不能放弃！"
 time_lifeline.782.a.response:0 "我把石头丢进去，石头不见了，海向上爬了一截；\n我把雪球丢进去，雪球不见了，海向上爬了一截；\n我把树枝丢进去，树枝不见了，海向上爬了一截；\n我把自己丢进去……\n\n§R<通讯已切断。>§!"
 time_lifeline.783.desc:0 "通讯就此切断，我们再也无法与求救者取得联系了。\n\n她已经放弃了生的希望，投身于黑色的海洋。"
 time_lifeline.783.a:0 "寄希望于奇迹是不会有结果的。"
 time_lifeline.783.b:0 "很遗憾，她未得神明眷顾。"
 time_lifeline.783.c:0 "选择自杀是懦弱的行为。"
 time_lifeline.783.d:0 "没有出口的迷宫是最大的恶意。"
 time_lifeline.783.e:0 "若融入集体意识，她绝不会轻易放弃。"
 time_lifeline.783.f:0 "这不是最好的结局。"
 
 time_lifeline.790.desc:0 "我们已经有很久没有收到当初的求救者的通讯了，可能对方已经遭遇了不测。\n\n或许对方旧伤复发死于感染，或许在长眠中被黑色海洋淹没，或许……\n\n没有什么或许，时间没有退路，事实已成既定。"
 time_lifeline.790.a:0 "$time_lifeline.300.a$"
 time_lifeline.790.b:0 "$time_lifeline.300.b$"
 time_lifeline.790.c:0 "一定有什么地方出了错。"
 time_lifeline.790.d:0 "$time_lifeline.300.d$"
 time_lifeline.790.e:0 "$time_lifeline.300.e$"
 
 ################################################################
 # 阶段4（时间祭礼）
 ################################################################
 
 time_lifeline.800.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者参与到祭祀之中，走进了神秘的机器。>§!"
 time_lifeline.800.a:0 "$time_lifeline.600.a$"
 time_lifeline.801.desc:0 "真是可恶，我被骗了！\n\n一开始，那个祭司只是跟着我进去，在机器里又唱又跳的，唱得也不算难听。\n后来，他一边念念有词一边在控制台上进行着让人眼花缭乱的操作，身为石器时代的生物却能如此轻车熟路地操纵机器，真让人难以置信。\n当祭司停下了手中的动作后，机器发出了如指针跳转的滴答声，他也立刻离开了机器，只留下我一个人。\n\n正当我准备跟着他一同出去时，机器的门突然自己关上了，与此同时，整台机器也开始旋转。\n机器的转速越来越快，我只觉一阵天翻地覆，整个身体就像飞起来一般，轻飘飘地浮在半空中。\n我似乎失去了重力，因为我感受不到重力的存在；\n我似乎失去了自我，因为我感受不到自我的存在。\n\n我不知何时昏死过去，醒来时，机器已经停止了运作。"
 time_lifeline.801.a:0 "看来，你就是祭祀中的祭品。"
 time_lifeline.802.desc:0 "明明是你劝说我进去，我才放心大胆地相信他们的，现在又跟我说我是祭品……\n\n算了，毕竟你又没有身临其境，也不能揣摩他们的意图，不能全怪在你的身上。\n还是怪我太不小心了，就这么轻易地上了一群史前生物的当。\n但最该怪的还是那群人，前脚还毕恭毕敬地把我视作神明的使者，后脚就把我当成了祭祀的祭品，谁能想到会这样啊！"
 time_lifeline.802.a:0 "纠结这些也没用了，机器外面安全吗？"
 time_lifeline.803.desc:0 "我苏醒过来后，打开了机器的门，发现外面的世界与之前大不相同了。\n\n不只是那群原住民不在，就连整个祭坛都不见了！\n底下的雪地变成了干裂的泥土，头顶的天空也变得漆黑一片，空气中还充斥着污浊的恶臭气息，就像是把各种各样的化学品混合在一起然后蒸发成气体一般。\n哪怕是山上也遍布雾霾，我根本没法辨别山下的情况。\n\n我不清楚原住民们走了有多远，说不定他们就在附近埋伏着我。\n虽然我可以尝试飞行来避开陷阱，但空气质量太差，可视度也很低，在空中难以分辨方向，还是尽可能别贸然采取这样的行动吧。\n山下可能潜藏着危险，但待在山上也不会取得什么进展，你认为我该怎么做？"
 time_lifeline.803.a:0 "一直待在原地没法解决问题，下去看看吧。"
 time_lifeline.803.a.response:0 "好的，我也正打算这么做，那等我下了山就和你联络。"
 time_lifeline.803.b:0 "山下太危险了，先在山上等雾霾消散吧。"
 time_lifeline.803.b.response:0 "的确，谁也不知道底下会有什么危险，还是先等我能看清前方的路再行动吧。"
 time_lifeline.804.desc:0 "什么，向下飞？\n\n雾霾一般来说都比较重吧，底下的空气可能更加浑浊……\n而且我也看不清山下的情况，就这么下去太危险了……咳咳……\n\n真的要向下飞吗？"
 time_lifeline.804.a:0 "相信我，向下飞！"
 time_lifeline.804.a.response:0 "既然你这么说了，那我就拼一把，向下飞！\n\n……咳咳……\n等我到了山脚就和你联络！"
 
 time_lifeline.805.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者被原住民作为祭品献祭后，发现世界变了，决定等雾霾消散再行动。>§!"
 time_lifeline.805.a:0 "雾霾消散了吗？"
 time_lifeline.806.desc:0 "不，还没有……咳咳……\n\n我感觉空气好像变得更加浑浊了，味道也更难闻了，我现在有些呼吸困难。\n月亮似乎也被乌云遮住了，也可能只是雾霾更浓了，我现在什么都看不见，眼前一片漆黑。\n我感觉事情不对劲，我的处境很危险……咳咳……\n\n不能一直待在这阵雾里，我做点什么！"
 time_lifeline.806.a:0 "向上飞，也许可以逃离雾霾。"
 time_lifeline.806.b:0 "向下飞，或许能有一线生机。"
 time_lifeline.807.desc:0 "好的，我马上就往上飞！\n……咳咳……怎么回事，我感觉越往上飞，空气越稀薄，味道也越来越刺鼻。\n\n呼吸越来越困难了，糟糕，可能要不了多久，我就会窒息昏迷。\n但现在已经……没有回头路了，我只能寄希望于雾霾上方……可能存在的纯净空气。\n\n我感觉很累，很累……\n不行，不能在这个时候睡着，但……\n我好累，眼睛要……睁不开了……"
 time_lifeline.807.a:0 "坚持住！"
 time_lifeline.808.desc:0 "嗯……我可以的，不能睡……\n\n等一下，我……我看到了一道光，那里肯定就是出口！\n别睡……就差一点了，就差一点……\n\n……马上就要到了……"
 time_lifeline.808.a:0 "继续向上飞！"
 time_lifeline.808.a.response:0 "不对，那不是什么光，那是……\n\n（雷鸣声）\n\n§R<通讯已切断。>§!"
 time_lifeline.809.desc:0 "通讯就此切断，我们再也无法与求救者取得联系了。\n\n致命的闪电却被她当成了生存的光芒……也许我们就是那道闪电。"
 time_lifeline.809.a:0 "我们本想帮助她，却害死了她……"
 time_lifeline.809.b:0 "又不是我们亲手杀了她，我们不需要内疚。"
 time_lifeline.809.c:0 "那并非神明的救赎，而是魔鬼的陷阱。"
 time_lifeline.809.d:0 "我的人民不会因牺牲而怨恨我。"
 time_lifeline.809.e:0 "她本应得到我们妥善的照顾。"
 time_lifeline.809.f:0 "给人以希望，又给人以绝望……"
 
 time_lifeline.810.desc.1:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者被原住民作为祭品献祭后，发现世界变了，决定下山查看情况。>§!"
 time_lifeline.810.desc.2:0 "$time_lifeline.2.desc$\n\n§E<历史记录：雾霾越来越严重，求救者感到处境危险，决定下山以脱离雾霾。>§!"
 time_lifeline.810.a:0 "一路顺利吗？"
 time_lifeline.810.b:0 "到山脚了吗？"
 time_lifeline.811.desc.1:0 "嗯，畅通无阻。\n虽然有些看不清路，但我并没有碰到什么埋伏，也没有遭遇什么意外，很顺利地就抵达山脚了。\n\n一开始我还担心会出现什么状况，结果是我大惊小怪了。$time_lifeline.811.desc.same$"
 time_lifeline.811.desc.2:0 "勉强到了山脚。\n因为四周一片昏暗，在下山的过程中看不清障碍物，中途我撞上了好几棵树的树枝。\n幸好有防护服，我伤得不算太严重。\n\n我本以为一路上会有原住民的埋伏，结果是我大惊小怪了。$time_lifeline.811.desc.same$"
 time_lifeline.811.desc.same:0 "\n而且越往山下走，我就感觉空气越来越清新，雾也越来越稀薄，尽管还是存在不小的影响，但比山顶好多了。\n\n我想，这片雾霾的密度应该比空气低，所以雾霾会聚集在山顶。\n可为什么呢，为什么雾霾会比空气轻？"
 time_lifeline.811.a:0 "换个角度思考，也许是“为什么空气会比雾霾重？”"
 time_lifeline.812.desc:0 "空气会比雾霾重？\n\n难不成，这片雾霾的形成原因并非是空气中“混杂”了什么，而是空气中“剥离”了什么？\n是因为空气中缺少了某种高密度物质，所以才会形成更轻的雾霾？\n再天马行空一些，“剥离”的未必是某种物质，而是某种性质？\n不行，我完全理不清状况，还是先不要考虑这些事情了。\n\n现在重要的事在于我接下来该怎么办。"
 time_lifeline.812.a:0 "你有什么计划吗？"
 time_lifeline.813.desc:0 "我现在最想做的就是赶紧回到飞船上，但飞船还没修好，就算我返回飞船也没法离开这颗星球。\n\n我想想看，目前有这么几种选择：\n前往湖泊，继续寻找材料；\n前往沙漠，或许会有可用的物资；\n回到山顶，把那台机器拆了，没准能获得新的发现。\n\n我该怎么做？"
 time_lifeline.813.desc.same:0 "虽然我一直都遵循你的选择，但我觉得这个主意不太好。\n\n"
 time_lifeline.813.desc.a:0 "$time_lifeline.813.desc.same$那群欺骗我的原住民现在可能就在湖畔的部落里，如果我贸然接近，也许会被他们发现我还活着，从而遭到攻击。\n我不是什么专业的战斗人员，即使只是石器文明，我也很难以一己之力对抗整个部落吧。"
 time_lifeline.813.desc.b:0 "$time_lifeline.813.desc.same$现在的空气虽然好了一些，但依旧污浊刺鼻，沙漠里的情况恐怕不会很好，甚至更遭。\n而且现在天很黑，万一沙漠里扬起沙尘暴，我很难找出逃离的方向，还是太危险了。"
 time_lifeline.813.desc.c:0 "$time_lifeline.813.desc.same$我才刚刚从山上走下来，现在又往回爬，实在是太累了。\n而且我们刚刚才讨论过了，这片雾霾的密度比空气低，现在山顶可能充满了雾霾，长时间待在里面很有可能会窒息。"
 time_lifeline.813.a:0 "前往湖泊。"
 time_lifeline.813.b:0 "前往沙漠。"
 time_lifeline.813.c:0 "回到山顶。"
 time_lifeline.813.d:0 "那么……前往森林。"
 time_lifeline.814.desc:0 "森林？\n等等，你指的是飞船南方的那片森林？\n\n对呀，我怎么把那片森林给忘了。\n我之前就在森林里找到了一些可用的材料，只是突然被怪物袭击，没能把它们带回飞船。\n可是说起怪物，万一那片森林里还是有怪物该怎么办？\n不过现在都过去那么久了，也许那些怪物已经离开了，而且森林这么大，碰到那群怪物的可能性也不是很大吧。\n\n那就决定了，去森林，说不定可以找到我之前丢下的材料。"
 time_lifeline.814.a:0 "可是那群怪物不是比原住民更危险吗？"
 time_lifeline.814.a.response:0 "好吧，那些怪物的危险性确实要比湖畔的原住民高，但那些真菌生物的根须和触手实在太吓人了，甚至超过了我对黑色怪物的恐惧！\n\n我实在不知道该怎么应对那群家伙，还是森林里那些我不动它们就不动的怪物要好处理得多。\n那就这样了，我们森林见。"
 
 time_lifeline.820.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者发现雾霾似乎比空气轻，随后决定前往森林寻找修复飞船的材料。>§!\n§E<记录备注：相较于怪物，求救者更害怕原住民的根须与触手。你不该有任何不恰当的想象。>§!"
 time_lifeline.820.a:0 "到森林了吗，有没有碰到那些怪物？"
 time_lifeline.821.desc:0 "不，我发现了一些别的东西。\n\n因为森林在南方，我打算在飞往森林前先看看飞船的状况，结果有了惊人的发现。\n飞船原本是迫降在一片平地上，但那块区域现在遍是高耸的建筑，飞船也不见了踪影。\n\n这里似乎是一片工业废墟，各种各样的建筑里存放着各种各样的机器，流水线上甚至还有未被取出的产品。\n墙上的漆已经开始脱落，机器的金属外壳也生满了锈。\n我找不到任何智慧生命存在的迹象，这里似乎已经荒废很久了。\n\n我确信之前并没有看到过这些建筑，我打算进去看看。"
 time_lifeline.821.a:0 "贸然进入很危险吧？"
 time_lifeline.822.desc:0 "虽然这里的确很诡异，但我没感受到任何潜在的危险。\n而且，就算有什么意外发生，我也会用飞行器立刻避开的。\n\n这片废墟里应该有许多金属材料，它们或许可以用作修复飞船的材料，尽管我连飞船都还没找到。\n此外我对这些工厂的意义很感兴趣，它们究竟是用来生产什么的呢？\n难道是那群石器时代的真菌文明建造的这些工厂吗，他们又是如何做到的呢？\n\n这里充满了谜团。"
 time_lifeline.822.a:0 "那就进去看看吧，注意安全。"
 time_lifeline.822.a.response:0 "好的，如果有什么发现，我就会联系你的。"
 
 time_lifeline.830.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者发现了一片工业废墟，决定进入探索。>§!"
 time_lifeline.830.a:0 "找到什么了吗？"
 time_lifeline.831.desc:0 "嗯，我很有收获！\n\n我先是在外围绕了一圈，发现这片区域的占地比我想的大了许多。\n建筑的排列井然有序，之间的过道四通八达。\n车间、储液罐、贮藏室、分流室、实验室、安保部、指挥部、回收站、哨戒塔等各类设施一应俱全，管道、货车、小型飞船等运输工具的配置在各地都十分完备。\n\n根据这片废墟的规模来分析，这里也许曾是某个重要的核心工业区。"
 time_lifeline.831.a:0 "那它是生产什么的呢？"
 time_lifeline.832.desc:0 "这个嘛……我还不能确定。\n\n我探索过了一些车间，也检查过了一些贮藏室，不同地区生产的东西各不相同，也不知是分工合作还是各自独立。\n我想想，有生产金属板的、有生产反应堆的、有生产引擎的、有生产齿轮的、有生产试剂的、还有生产晶体的，实在难以想象它究竟是用来做什么的。\n\n不过考虑到这片工业区有各种重武器把守，我想，这里可能是某种军需禁地，专门生产战争武器的。"
 time_lifeline.832.a:0 "还有什么其它的发现吗？"
 time_lifeline.833.desc:0 "当然有了，就在刚刚，我发现所有的建筑上都有一段文字标记。\n\n这座建筑上写着“§H11025.1.8§!”，这一座是“§H11025.1.9§!”，这一座是“§H11025.1.10§!”。\n等到了这一片区域，上面就写着“§H11024.12.5§!”、“§H11024.12.4§!”、“§H11024.12.3§!”之类的。\n\n这种像日期一样的记号，是代表着建筑建成的时间吗？\n不对，我没有看到过带有相同数字的建筑，这个文明应该不会刻意在相邻的日期建成相邻的建筑吧？\n它们之间似乎存在某个规律，若用日期解释实在有些牵强……"
 time_lifeline.833.a:0 "难道这是一种建筑编号？"
 time_lifeline.834.desc:0 "建筑编号？\n对了，这样就能说得通了！\n\n这个文明也许是对不同区域的建筑进行了编号，以便管理和分配。\n不过这些编号很有意思，除了最前面的五位数，后面的数字最大都是“12”，“12”有什么特别的意义吗？\n\n目前我还找不到问题的答案，不过继续探索这片废墟也许会有什么新的发现吧。"
 time_lifeline.834.a:0 "我等着你的好消息。"
 time_lifeline.834.a.response:0 "好，我应该很快就会再次和你联络的。"
 
 time_lifeline.840.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者大致了解了工业废墟的情况，准备深入探索。>§!"
 time_lifeline.840.a:0 "取得了什么新的进展吗？"
 time_lifeline.841.desc:0 "我还是很在意工厂里的那些晶体，于是我又仔细地对它们进行了调查。\n\n这些晶体很特别，有时很轻，有时很重，它们的质量似乎在一刻不停地发生着变化。\n这些晶体吸收光的频率也不固定，这就导致了它们总是显示出不同的颜色，也容易让人产生认知上的误解。\n实际上，这些晶体本身很有可能是无色的。\n\n不仅如此，我能从它们中感受到微弱的时间流动，根据我以往的经验，这些晶体有可能就是§H时间水晶§!，只不过还是半成品。"
 time_lifeline.841.a:0 "$time_lifeline.611.a$"
 time_lifeline.841.a.response:0 "$time_lifeline.611.a.response$"
 time_lifeline.841.b:0 "为什么你会对§H时间水晶§!如此了解？"
 time_lifeline.842.desc:0 "因为我是§H时间旅行者§!！\n开玩笑的啦，只是我过去经历了许多，恰好对它有所了解罢了。\n\n不过可以确定的是，要想人工合成这些水晶，光凭石器时代的技术是远不足够的。\n这些工厂不可能是那个真菌部落建成的，而大概是某个极端先进的文明筑造的。\n\n只是那个文明可能早已灭亡。"
 time_lifeline.842.a:0 "再辉煌的文明也总有谢幕的一天。"
 time_lifeline.843.desc:0 "虽然我很想知道，为什么这个文明可以制造出这么多§H时间水晶§!的半成品，但我还有一个更重要的发现——\n这里有一艘完好无损的飞船。\n\n而且我检查过了，它的各项机能都可正常运作，燃料虽然不多，但也足以坚持很久。\n这也就意味着，我终于可以离开这颗星球了！\n\n不过在离开之前，我还想在这颗星球上多探索一会，毕竟还有很多我没能解开的谜团。"
 time_lifeline.843.a:0 "那就尽情地探索吧，问题等待着你的解答。"
 time_lifeline.843.a.response:0 "有你的支持，那我就放心啦！"
 time_lifeline.843.b:0 "这颗星球有太多未知的危险，还是不要冒险了。"
 time_lifeline.844.desc:0 "的确，这颗星球危机四伏，还是抓紧时间离开吧。\n毕竟不是所有的谜题都需要一个答案，有的结果与真相反而会令人遗憾。$time_lifeline.844.desc.same$"
 time_lifeline.844.desc.same:0 "\n\n再过不久，我就要驶向茫茫的太空了。\n我有预感，我们之间的联系仅仅局限在这颗星球上，届时，我们或许就无法再继续交流了。\n\n这可能是我们之间的最后一次通讯。\n但我相信，在无穷无尽的未来，我们一定可以再见。"
 time_lifeline.844.a:0 "$time_lifeline.638.a$"
 time_lifeline.844.a.response:0 "$time_lifeline.638.a.response$"
 
 time_lifeline.850.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者发现了时间水晶的半成品和完好无损的飞船，决定再在星球上探索一段时间。>§!\n§E<记录备注：求救者声称自己是时间旅行者，但似乎只是个玩笑。>§!"
 time_lifeline.850.a:0 "找到问题的答案了吗？"
 time_lifeline.851.desc:0 "因为之前发现了§H时间水晶§!的半成品，我想到了什么，就决定回山峰一趟。\n\n因为我特意从飞船里拿了氧气供给设备，所以很顺利地抵达了山顶，那台机器也原封不动地待在原地。\n经过一番调查，果然不出我所料，这台机器实际上是§H时间机器§!。\n\n原住民的祭祀恐怕是为了将我献给时间，而那名祭司应该是调节了机器的设置，将我送到了另一个时间线。"
 time_lifeline.851.a:0 "那你现在究竟在哪一年？"
 time_lifeline.852.desc:0 "要确定具体是哪一年或许有些困难，不过若只是判断我处于过去还是未来，那倒是有办法确认。\n\n我认为这个时间线并不存在那个真菌文明，所以我放心地前往湖泊寻找答案。\n在那里，原本是石屋的地方高楼耸立，湖泊也被染成了污浊的黑色，但这些都不会影响我的判断。\n\n最初拜访真菌部落的时候，我曾悄悄地在地里埋了一枚存储了放射性物质的胶囊。\n别担心，里面只是一种对生物和环境无害的特殊同位素，我习惯于靠它来判断时间线的先后顺序。"
 time_lifeline.852.a:0 "“习惯于”？你经常做这种事情吗？"
 time_lifeline.853.desc:0 "的确如此，毕竟我是§H时间旅行者§!嘛，这回我可没有开玩笑。\n\n由于我经常会来往于不同的时间线，所以必须要有一种比较稳定的方式来判断时间。\n因此，我之前特意埋好了胶囊，现在又来到原地检测那种放射性物质的含量，并最终发现含量为零。\n\n这种元素的半衰期很长，若要让胶囊内的物质完全衰变，需要数百万年的时间。\n的确可能是我被传送到了数百万年后，也有可能是我的胶囊在中途被他人拿走了，这些都会干扰我的判断。\n但我认为更大的可能是，我现在处于埋藏胶囊的时间线之前。\n\n也就是说，我被§H时间机器§!带回了过去。"
 time_lifeline.853.a:0 "听起来太匪夷所思了。"
 time_lifeline.854.desc:0 "§H时空穿梭§!是科幻小说中常见的桥段，但很多人也仅仅把它当作科幻小说里才会发生的内容。\n我知道这种事情很难令人信服，所以我之前一直没有提及这件事。\n但是，请你相信我吧，接受我所说的那段话，这样才能更好地理解这一切。\n\n还记得那个“§H衔尾之蛇§!”的标记吗？\n不仅是祭坛的墙壁上有，那台§H时间机器§!的外壳上也有，先前发现的工业废墟的墙壁上也有着这一标记。\n若是将它们联系起来，或许一切就都能说得通了。\n\n如果你相信我的话，可以听听我的猜想吗？"
 time_lifeline.854.a:0 "我相信你，说说吧。"
 time_lifeline.855.desc:0 "起初，这颗星球上有一个文明逐渐繁荣昌盛，但他们却突然崇拜上了一个神秘的蛇神。\n这位蛇神似乎掌管时间与循环，因此，这个文明为了敬奉蛇神而尝试人工合成§H时间水晶§!。\n\n但好景不长，因为某场突如其来的变故，也许是某场浩大的战争，也许是星球环境的日益恶化，这个文明没能挺过去。\n批量生产§H时间水晶§!的计划以失败告终，尽管制造出了大量的半成品，但仍然有少数完全品得以成功。\n正是这些少数的成品，货真价实的§H时间机器§!被发明出来了，可与此同时，这个文明也灭亡了。\n\n不知多少年后，这颗星球上又发展出了新的文明，也就是那个石器时代的真菌部落。\n在一次偶然中，这个部落发现了远古文明的遗产——那台§H时间机器§!。\n这一发现令他们雀跃，他们把这台机器视作神明的恩赐，搬到了山上，还建立了祭坛加以保护。\n机器上§H衔尾之蛇§!的图案也被他们当成神明的肖像，并热忱地崇拜着这位蛇神。\n\n时间是个环，过去文明的历史也许会再一次上演。"
 time_lifeline.855.a:0 "如果回到过去，是否可以挽救这个早已衰亡的文明？"
 time_lifeline.856.desc:0 "时间是个环，若只是改变个体的未来尚有可能，但想改变一个文明的历史，恐怕非常困难。\n\n时间的循环并非只有一个，而是同时存在着多个，可能平行，可能交叉，甚至可能在交叉后形成新的循环。\n时间不是一条单行线，而是一个十字路口。\n我们的每一个选择对自己的影响都很大，但每一个选择对所有自己的影响都很小，因为此时此刻，有着无数个自己正站在十字路口做出了自己的选择。\n单是改变个体的未来就如此艰难，那换成一个文明呢？\n\n一个文明中有着无数个个体，这无数个个体所创造的无数个循环彼此交错，又形成了无数个新的循环。\n一个文明的循环是由其中无数个个体共同创造的，仅仅改变其中部分的小循环，既可能无法改变整体的循环，又可能因其他个体的选择导致循环走向意料之外的结果。\n\n这就是所谓历史的必然，这就是所谓时间的因果。"
 time_lifeline.856.a:0 "我第一次体会到自己是如此的渺小。"
 time_lifeline.857.desc:0 "也不需要这么悲观啦，毕竟，就算是再不可能的事情，它的概率也不是零。\n只要不是零，那就依然有可能的机会。\n\n就算我们要做的事情再怎么困难，若是因此而放弃，那“可能”也会变成“不可能”。\n即使我们不能直接改变文明的循环，起码我们可以尝试改变自己的循环。\n在无数个我们的共同作用下，我们也许真的有可能撬动历史的车轮，改变文明的循环。\n\n毕竟呀，未来未来，不确定的才是未来。\n纵然，我们也许无法改变过去，但我们可以创造未来，属于我们自己的未来。"
 time_lifeline.857.a:0 "本应是我为你提供帮助，反而被你安慰了。"
 time_lifeline.858.desc:0 "文明的衰亡确实令人惋惜，但在废墟上重生的文明同样是个奇迹。\n\n虽然他们欺骗了我，但我并不怪他们，也许对他们而言，亲历时间的祭礼反而是最大的荣幸吧。\n这个文明还会在这片土地上发芽的，而我们也有我们自己该做的事情。$time_lifeline.647.desc.same$"
 time_lifeline.858.a:0 "$time_lifeline.647.a$"
 time_lifeline.858.a.response:0 "（对方唱起了一支轻柔的歌，这是一首献给逝者的摇篮曲。）"
 
 time_lifeline.860.desc:0 "我们已经有很久没有收到当初的求救者的通讯了，可能对方已经遭遇了不测。\n\n或许对方掉入了废墟里的陷阱，或许对方遭到了潜伏怪物的袭击，或许……\n\n没有什么或许，时间没有退路，事实已成既定。"
 time_lifeline.860.a:0 "$time_lifeline.650.a$"
 time_lifeline.860.b:0 "$time_lifeline.300.b$"
 time_lifeline.860.c:0 "好奇害死猫。"
 time_lifeline.860.d:0 "$time_lifeline.300.d$"
 time_lifeline.860.e:0 "$time_lifeline.300.e$"
 
 ################################################################
 # 阶段4（镜面之谜）
 ################################################################
 
 time_lifeline.900.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者使用飞行器逃离了祭祀，准备返回飞船。>§!"
 time_lifeline.900.a:0 "$time_lifeline.600.a$"
 time_lifeline.901.desc:0 "呼，吓死我了，还好我逃出来了。\n\n我乘上飞行器向外飞的时候，原住民们很惊讶，但很快就反应了过来。\n但我早就已经飞出了祭坛，只有他们的怒吼从身后传来。\n\n现在我已经返回了飞船迫降的地方，但……\n出了点状况。"
 time_lifeline.901.a:0 "发生了什么？"
 time_lifeline.902.desc:0 "我的飞船不见了！\n\n我很确信我的飞船受到了严重的损伤，光凭石器时代的文明是不可能将它修复的，所以不可能是那群真菌生物驾驶它离开这里。\n而且，不仅是飞船，就连撞击坑都消失了。\n这里只有一片平坦的地面，丝毫没有飞船撞击的痕迹，单凭这里的真菌部落也是无法将其掩盖的。\n\n目前我所遭遇的一切都太奇怪了，根本不能用常理来解释。"
 time_lifeline.902.a:0 "简直就像到了另一个世界。"
 time_lifeline.903.desc:0 "另一个世界？\n你启发了我，或许真的有这个可能！\n\n想想看，我这一路上究竟发生了多少与先前不同的事？\n按照时间线从后往前推，我现在发现飞船和撞击坑不见了，这是第一个不同之处。\n再往前，也就是参与祭礼之前，我发觉植被的种类发生了变化，并且山顶的积雪被翠绿的植物取而代之，这是第二个不同之处。\n而我又是为何会前往山顶呢？那是由于当地真菌文明的带领，而这个部落先前只有一座石屋，这是第三个不同之处。\n最后回到一切的开始，我在水面上苏醒，发现天空散发着奇特的光线，这是第四个不同之处。\n\n当时我还分不清现实与梦幻，一度怀疑自己上了天堂，但实际是我的确到了另一个世界，不过它既非梦境也非天堂。\n也就是说，自我苏醒以来，我便不再处于原本的星球，而是抵达了一片相似却又不同的新天地。"
 time_lifeline.903.a:0 "一切的根源或许就是那片湖。"
 time_lifeline.904.desc:0 "是的，没错，一定是我在被水淹没后，于无意识的状态下出现在了这里。\n\n既然找出了罪魁祸首，那接下来就要去好好调查那片湖泊，说不定可以发现什么离奇的真相。"
 time_lifeline.904.a:0 "注意安全，提防湖边的真菌部落。"
 time_lifeline.904.a.response:0 "我飞得很快，他们现在应该还来不及返回部落，现在正是最好的时机。\n一会见，如果遭遇了什么意外，我也会立即联系你的。"
 
 time_lifeline.910.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者发现飞船与撞击坑都消失了，正在前往湖泊寻找真相。>§!\n§E<记录备注：求救者认为自己位于另一个世界，值得关注。>§!"
 time_lifeline.910.a:0 "抵达湖泊了吗？"
 time_lifeline.911.desc:0 "嗯，靠着飞行器，我很快就重新回到了这里。\n\n部落里似乎没有什么人，看来，整个部落的成员都参与了那场祭祀，并且现在都还在下山的路上。\n如果要调查部落，我最好尽快动手，毕竟我也不知道他们什么时候会回来。\n但是，我觉得湖水是整个谜团的核心，优先调查它也不失为好的选择。\n\n事情总要有一个先后顺序，你来决定吧。"
 time_lifeline.911.a:0 "事不宜迟，趁现在赶紧调查部落吧。"
 time_lifeline.911.a.response:0 "你说的没错，要是晚点调查说不定就来不及了。\n等我消息。"
 time_lifeline.911.b:0 "部落里未必存在有价值的线索，优先调查湖水。"
 time_lifeline.911.b.response:0 "毕竟只是一个石器时代的文明嘛，不见得会藏着什么特别的秘密，湖泊才是当下的紧要任务。\n等我消息。"
 
 time_lifeline.920.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者抵达了湖泊，决定优先调查部落。>§!"
 time_lifeline.920.a:0 "部落里有什么发现吗？"
 time_lifeline.921.desc:0 "暂时没什么收获。\n\n这似乎就是一个非常普通的部落，仿佛一切都在表明着：石器时代就应该是这样的。\n要说奇怪的地方，那就是搭建房屋的材料太光滑了，他们真的有能力做到这种程度吗？\n屋子里的石质家具也一样，就像被精细地加工过一样，完全看不出手工研磨的痕迹。\n\n这个部落的朴素可能只是一个假象，底下也许隐藏着惊天的秘密。"
 time_lifeline.921.a:0 "也许他们并不只是个石器文明。"
 time_lifeline.922.desc:0 "对了，我在这间似乎是首领栖所的石屋里找到了这个。\n\n在这面疑似会客室的主墙体上，刻着一幅神秘又抽象的壁画。\n我来看看，嗯……上面似乎记录了一个故事。\n\n这里的环境似乎很恶劣，天上下着火雨，地面也发生了开裂，灼热的岩浆喷涌而出。\n在如此险恶的地方，飓风和海啸追逐着一群逃亡的生命，不过他们看起来和那群真菌原住民并不像。\n这些生命已经被逼入了绝境，情急之下，他们纷纷跳进了水里以躲避灾难。\n当他们浮出水面后，世界似乎恢复了正常，十分安宁。\n\n壁画到此为止了，不仅是这个莫名其妙的故事，还有一点很奇怪。\n那就是壁画的最后部分，这里的内容是倒着画的，不知是因为某个失误，还是画图者的有意为之。"
 time_lifeline.922.a:0 "似乎无法从中解读出什么有价值的信息。"
 time_lifeline.922.a.response:0 "我也是这么想的，可惜，又浪费了宝贵的时间。\n现在，我得赶紧去调查湖水了，等我联络。"
 
 time_lifeline.930.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者调查了部落后，打算尽快调查湖水。>§!"
 time_lifeline.930.a:0 "$time_lifeline.940.a$"
 time_lifeline.931.desc:0 "我觉得应该是没什么值得注意的地方啦。\n\n这段时间里，我一直在思考那幅壁画，就是先前在首领栖所里发现的那幅画。\n我总觉得那段故事里隐藏了某个重要的信息，只是我们暂时没有发现。\n或者说，暂时无法发现。"
 time_lifeline.931.a:0 "你是指避难的生命跳入水中？"
 time_lifeline.932.desc:0 "不是啦，跳入水中后发现世界大变样，这一点我当然发现啦。\n毕竟这一点，和我目前的经历很相像嘛。\n\n根据壁画上的信息，我认为他们跳入的水，就是指的这片湖泊。\n所以，如果我重新跳入湖中，说不定就能回到原本的世界。\n不过，我更关注最后的那部分，为什么那部分会是倒着画的呢？\n\n但现在思考这些也不会有结果，还是先检验一下现有的猜想吧，看看能否通过这片湖水重返之前的世界。"
 time_lifeline.932.a:0 "虽然很危险，但也只能这么做了。"
 time_lifeline.932.a.response:0 "放心吧，我可不会那么轻易就死掉的。\n我一定，一定会再和你联络的！"
 
 time_lifeline.940.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者抵达了湖泊，决定优先调查湖水。>§!"
 time_lifeline.940.a:0 "湖水里有什么秘密吗？"
 time_lifeline.941.desc:0 "嗯，我好像有了不得了的大发现！\n\n我激活了我的施术单元，仔细地分析了这片湖水的成分与性质，发现湖水中似乎存在一种很特别的物质。\n尽管这种物质很难被检测发现，但经过一番努力，我还是成功地测试出了它的部分性质。\n\n准确来说，这种物质应该是一种粒子，它会吸收几乎一切的光线，所以只能通过间接的方式“看”到它的存在。\n并且，这种粒子的各类理化性质会随着时间无规律变化，但也正是这种奇特的变化帮助我锁定了这种粒子。\n\n此外，这种粒子还有一个令人匪夷所思的特点——它的质量是负的！"
 time_lifeline.941.a:0 "施术单元？"
 time_lifeline.941.a.response:0 "施术单元就是我的飞行器啦。\n当然，它可不只有飞行这一个功能，实际上是个多功能复合的特殊工具。\n\n要仔细解释太费时费力了，以后有机会再说吧。\n现在重要的是——这种粒子的质量是负的！"
 time_lifeline.941.b:0 "负的质量？"
 time_lifeline.942.desc:0 "没错，一开始我也不敢相信，但我仔细地检查过了我的施术单元以及实验步骤，我能肯定这个结论是正确的。\n\n也就是说，如果某个正常物质中混入了这种粒子，整个物质的密度反而会减小，质量也会降低，就像是被这种粒子“剥离”了部分质量。\n此外，由于它的吸光性，混杂有这种粒子的物质的颜色也会变“深”，而这种粒子本身的颜色或许可以被定义为“黑色”。\n\n这么奇特的粒子，肯定要有一个独一无二的名字吧？\n根据它的特点，我想想……就叫它“§H负相粒子§!”好了。"
 time_lifeline.942.a:0 "听着就很怪。"
 time_lifeline.942.a.response:0 "嘿嘿，我也感觉很怪，不过这种粒子本身就是很怪嘛。\n湖水就先调查到这里了，我打算趁着他们还没回来赶紧调查一番部落，没准能有新的发现。\n\n等我联络。"
 
 time_lifeline.950.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者调查了湖水后，打算趁机调查部落。>§!"
 time_lifeline.950.a:0 "$time_lifeline.920.a$"
 time_lifeline.951.desc:0 "不，我还没来得及有什么发现，原住民就已经回来了。\n\n他们一看到我就举起了武器，并试图对我发起攻击，我只得匆忙躲避。\n一些人拿着捕网警惕着我，一旦我飞起来，他们就会抛出捕网困住我。\n而且这里的树木都很高耸，错综复杂的枝干也会影响我的飞行。\n因此，我只能徒步奔跑，在房屋之间四处穿梭以躲避他们的追击。\n\n但他们人多势众，我也不熟悉地形，最终还是被他们团团围住了。"
 time_lifeline.951.a:0 "可以尝试与他们交涉吗？"
 time_lifeline.952.desc:0 "不，他们来势汹汹，看样子不会轻易放过我。\n\n他们似乎对我手上的施术单元感到畏惧，并不敢轻举妄动。\n可包围圈还是在逐渐缩小，我已经无处可逃了。"
 time_lifeline.952.a:0 "拼一把，尝试飞出去！"
 time_lifeline.953.desc.same:0 "没错，即使他们有所准备，但这也是我最后的机会了。\n\n嘿咻，快——让——开——\n（急剧的风声）\n呼！\n（嘈杂的嘶吼声）\n差一点！\n（弓箭的离弦声）\n呜哇，好痛！\n\n"
 time_lifeline.953.desc.1:0 "$time_lifeline.953.desc.same$糟糕，我被弓箭射中了，幸好没有射到关键部位，我还可以继续坚持。\n呀，差点又要被射中了，好险。\n前面就是树林的出口，马上就能逃离他们的追击了。\n\n好，出来了！"
 time_lifeline.953.desc.2:0 "$time_lifeline.953.desc.same$糟糕，我被弓箭射中了，虽然没有射到关键部位，但我之前受的伤因此开裂了……\n呀，又被射中了，不行！\n啊，好痛！\n（猛烈的撞击声）\n\n可恶，伤口太疼了，害得我撞到了树，然后我就摔下来了……\n已经来不及了，他们再一次包围了我，这下我彻底出不去了……"
 time_lifeline.953.a:0 "快跳进湖里！"
 time_lifeline.953.a.response:0 "嗯，这是最好的办法了，不仅可以躲避追兵，还能验证我之前的猜想。\n一定要等着我，我绝对会活着和你联络的！"
 time_lifeline.953.b:0 "还有其它的办法吗？"
 time_lifeline.953.b.response:0 "恐怕没有，由于刚刚的撞击，我的施术单元再次严重受损，现在我连自卫的手段都没了……\n\n喂，你们不要靠近我，离我远点！\n你们到底想做什么？\n放开我！\n\n§R<通讯已切断。>§!"
 time_lifeline.954.desc:0 "通讯就此切断，我们再也无法与求救者取得联系了。\n\n她从可怖的祭祀中逃出，却逃不过沦为祭品的命运。"
 time_lifeline.954.a:0 "她没能逃过时间的必然。"
 time_lifeline.954.b:0 "再一次，祭礼开始了。"
 time_lifeline.954.c:0 "若是她足够强大，一定可以打破这场闹剧。"
 time_lifeline.954.d:0 "果然，异族的习俗既落后又危险。"
 time_lifeline.954.e:0 "为什么要浪费生命于这种毫无意义的仪式呢？"
 time_lifeline.954.f:0 "荒诞的历史再一次重演。"
 
 time_lifeline.960.desc.1:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者摆脱了追击，决定跳入湖水验证猜想。>§!"
 time_lifeline.960.desc.2:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者决定跳入水中，尝试回到原本的世界。>§!"
 time_lifeline.960.a:0 "回到原本的世界了吗？"
 time_lifeline.961.desc:0 "应该是回来了吧，天空的颜色是正常的黑色，远方的朝阳正缓缓升起。\n尽管周遭非常寒冷，但看到这一幕，我还是感到心里很暖。\n\n对了，我记得我在第一次落入湖里之前下了一场冰雹，所以这里会比另一个世界更冷吧，这也再一次验证了我的猜想。\n现在，我正漂浮在水面上，全身都湿透了，为了避免失温，我得赶紧回到岸上。"
 time_lifeline.961.a:0 "你跳入湖水后，有什么特别的感受吗？"
 time_lifeline.962.desc:0 "特别的感受？\n的确是有。\n\n第一次的时候，因为完全没有做好准备，被淹没后我惊慌失措，并没有注意到这种异样。\n但这次我是有备而来，在跳入水后，我感觉到有某种无形的东西正渗入我的体内，随后我感到非常放松，不知不觉就昏迷了。\n\n再度苏醒后，我就是现在的样子了，跟第一次苏醒时状况相似。"
 time_lifeline.962.a:0 "你接下来打算怎么做？"
 time_lifeline.963.desc.1:0 "等我飞回岸上后，我准备先燃起篝火，把衣服烘干，也顺便暖暖身体。\n对了，中箭的伤口也得处理一下，万一感染了就不妙了。$time_lifeline.963.desc.same$"
 time_lifeline.963.desc.2:0 "等我飞回岸上后，我准备先燃起篝火，把衣服烘干，也顺便暖暖身体。$time_lifeline.963.desc.same$"
 time_lifeline.963.desc.same:0 "\n休整之后，我打算重新检查一下飞船的状况，也再次确认我的确是回来了。\n\n在那之后，我计划去山顶看看，虽然那是另一个世界发生的事，但说不定这个世界里同样有那个机器。\n我会把那台机器拆了，取得的材料应该可以用来修复飞船。\n而且，如果有机会的话，我也想研究一下那台机器的构造和作用。\n\n但是这个世界的天气和环境似乎比另一个世界要恶劣许多，不知道路上会不会遭遇什么意外，我有点不安。"
 time_lifeline.963.a:0 "放心吧，一旦遇到危险就立刻联络我。"
 time_lifeline.963.a.response:0 "嗯，你的话让我放心多了。\n我也得继续努力了，如果因为畏惧而什么都不做，是什么问题都无法解决的。\n接下来，我就要按照计划行动了，我们之后联系。"
 
 time_lifeline.970.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者回到了原本的世界，准备按照自己的计划行动。>§!"
 time_lifeline.970.a:0 "有什么异常情况吗？"
 time_lifeline.971.desc:0 "虽然中途遭遇了几次糟糕的天气，但我都及时找到了安全的地方避开了危险。\n除此之外，一路上还算顺利吧，毕竟我有飞行器，没费多少时间就抵达了目的地。\n\n我先是回到了飞船迫降的地方，飞船安然无恙地待在原地，受损的情况也并没有恶化，看来这块地方没有遭受什么特别的环境危害。\n随后，我前往了山顶，在那里看到了一座同样的白色祭坛，只是祭坛外被白雪覆盖，看起来就像是融为一体了。\n\n如我所料，祭坛里的的确确摆放着一模一样的机器，上面也有着§H衔尾之蛇§!的图案。"
 time_lifeline.971.a:0 "你调查过这台机器吗？"
 time_lifeline.972.desc:0 "当然调查过了，准确来说，是一边拆解一边调查的。\n\n拆解机器的时候，我发现了一个很有趣的东西，也大概能猜出这台机器的用途，以及那个所谓的祭礼是怎么回事了。\n但它应该和这颗星球的谜团没有太大关系，只算是我个人的意外收获吧。\n不过这台机器的构造很精巧，我可以发送给你一些具体的细节，应该会对你的国家有不少的帮助吧，这也算是我的一点小小的感谢啦。\n\n拆解这台机器的确获得了不少有用的物资，有了它们，就能尝试修复飞船了。\n就在刚刚，我终于把需要的材料搬回了飞船，马上就能着手进行修理，希望一切顺利吧。"
 time_lifeline.972.a:0 "关于那片湖，你怎么想？"
 time_lifeline.973.desc:0 "单凭现在收集的信息，我暂时没什么头绪。\n\n目前唯一可以确定的是，这片湖泊连接了两个相似但又不同的世界。\n至于别的，一切都有可能，我也拿不准哪种猜想更符合逻辑。\n\n还是先等我修复完飞船再考虑这些吧，在修理的过程中，我也会好好整理现有的线索。"
 time_lifeline.973.a:0 "我也会思考这个问题的。"
 time_lifeline.973.a.response:0 "好的，我应该很快就能修好飞船了，那我们一会见。"
 
 time_lifeline.980.desc:0 "$time_lifeline.2.desc$\n\n§E<历史记录：求救者用拆解神秘机器获取的材料修复飞船，并同时思考湖水之下的秘密。>§!\n§E<记录备注：她似乎从机器里发现了什么，但有意隐瞒。>§!"
 time_lifeline.980.a:0 "飞船修好了吗？"
 time_lifeline.981.desc:0 "是的，很顺利就完成了修理工作，比我预想的还要简单。\n\n不仅如此，关于这片湖泊，我也有了一个大胆的猜想。"
 time_lifeline.981.a:0 "说说看吧。"
 time_lifeline.982.desc:0 "还记得之前我找到的那幅壁画吗？\n我之前一直很在意画的最后部分，也就是上下颠倒的那部分，我想，现在我应该明白那代表什么了。\n\n倒过来画最后部分并不是因为失误或者巧合，而是画图者的有意为之，或者说，这只是画图者客观记录的真相。\n这片湖泊连接的其实是上下颠倒的两个世界，我并不是通过湖水前往了另一颗星球，而是借助湖水穿过了地壳！"
 time_lifeline.982.a:0 "穿过地壳……难道有一个世界在地底？"
 time_lifeline.983.desc:0 "没错，接下来的问题就是判断哪个才是地底的世界了。\n\n因为我的飞船迫降在这个世界里，所以这个原本的世界就是星球表面的世界。\n那么另一个世界，只可能是星球地壳之内的世界，也就是那个地底世界。\n我第一次在湖面上苏醒时，看到的天空是粉红色，但实际上那并非天空，而是这颗星球的地幔或者地心。\n\n星球表面的世界环境很糟糕，因此，这颗星球上的文明就建造出了一个地底的世界，并居住在这片乐土里。\n这就是这颗星球上最大谜团的最终答案。"
 time_lifeline.983.a:0 "这太匪夷所思了，他们是怎么做到这一切的？"
 time_lifeline.984.desc:0 "虽然我不知道他们是如何做到的，但他们的科技水平一定很高，能在薄薄的地壳里安放反重力装置，以使地底世界的重力颠倒。\n而我之前遇到的那个真菌文明，也许正是这个先进文明的后代，只是由于某种原因衰弱了。\n\n我认为，尽管它很荒谬，但我的这一猜想不会错的，那幅壁画就是最好的证据。"
 time_lifeline.984.a:0 "这……就是真相了吗？"
 time_lifeline.985.desc:0 "毕竟也没有其它的证据嘛，而且我的直觉一向很准的，说不定一猜就猜中真相啦。\n\n在这颗星球上的探索已经告一段落了，真是惊险又有趣呀。\n好啦好啦，别再纠结这件事了，有个侦探曾经说过：“当你排除了所有的不可能性，剩下的无论多不可能，那都是事实。”\n我想，这句话应该也适合现在的情况吧。$time_lifeline.844.desc.same$"
 time_lifeline.985.a:0 "总觉得你在强词夺理……"
 time_lifeline.985.a.response:0 "才没有！"
 time_lifeline.985.b:0 "好吧，等我们再见的时候重新找出真相吧。"
 time_lifeline.985.b.response:0 "嗯，一定，我们约好了。"
 
 time_lifeline.990.desc:0 "$time_lifeline.980.desc$"
 time_lifeline.990.a:0 "$time_lifeline.980.a$"
 time_lifeline.991.desc:0 "是的，很顺利就完成了修理工作，比我预想的还要简单。\n\n因为我一直对这片湖的秘密很感兴趣，所以在联系你之前，我先去了一趟湖泊，再一次分析了湖水的成分与性质。\n就在刚刚，结果已经出来了。"
 time_lifeline.991.a:0 "有什么新的发现吗？"
 time_lifeline.992.desc:0 "倒也算不上新，只是对于这个世界的湖水而言，的确是个新发现。\n\n我再一次检测到了“§H负相粒子§!”的存在，就是那种性质会不断变化、质量为负的吸光粒子。\n这种粒子同时出现在两个世界的湖水里，我认为这并非偶然。"
 time_lifeline.992.a:0 "毕竟这两片湖其实就是同一片湖嘛。"
 time_lifeline.993.desc:0 "真的是同一片湖吗？\n\n换句话说，真的是因为它们是同一片湖，所以才会有相同的粒子吗？\n有没有一种可能，是因为这两片湖都拥有相同的粒子，所以它们才变成了同一片湖呢？"
 time_lifeline.993.a:0 "等一等，你的意思是——它们最初是不同的湖？"
 time_lifeline.994.desc:0 "我认为很有可能。\n\n一开始，我曾经有过一个天马行空的猜想，就是这两个世界其实都在同一颗星球上，只是一个在地表，一个在地底，它们由这片湖水彼此相连。\n为了验证这一点，我去调查了一番湖畔的石屋附近。\n\n之前忘了跟你说了，最初拜访真菌部落的时候，我曾悄悄地在地里埋了一枚存储了放射性物质的胶囊。\n别担心，里面只是一种对生物和环境无害的特殊同位素，我习惯于靠它来判断一些事情。\n\n在调查湖畔石屋的时候，我检测了土壤中放射性物质的含量，发现结果为零。"
 time_lifeline.994.a:0 "这意味着什么？"
 time_lifeline.995.desc:0 "虽然在短时间内，这种放射性物质不会大量从容器中逃逸并扩散，但仍然会有极少量蔓延到泥土中，并且远超我的仪器检测的阈值。\n\n既然完全检测不到含量，要么是因为这种物质已经历经数百万年而全部衰变，要么是这里根本就不存在这种物质。\n我大致估计了一下自我埋下胶囊到现在的时间，并据此推算扩散半径，得出的结果是——至少数十千米。\n尽管我无法在短时间内计算这颗星球的地壳厚度，但我也不需要计算。\n因为若我是通过湖水穿过了几十千米的距离，那我早就淹死在湖水里了。\n\n根据这一事实，我可以将我的第一个猜想证伪。"
 time_lifeline.995.a:0 "第一个猜想？"
 time_lifeline.996.desc:0 "没错，我的猜想可不止一个。\n\n要说起第二个猜想，就不得不提及之前我说过，但没有注意到的一件事——\n第一次从湖水中苏醒后，废船断裂的桅杆复原了，我的施术单元也被修好了。\n\n桅杆的复原或许是因为实际存在两艘船，这个世界的桅杆断裂了，而另一个世界的桅杆仍安然无恙，毕竟那个世界一直很安定嘛。\n但施术单元的修复可就不能如此解释了，因为根本就不可能出现一模一样的另一个施术单元嘛。\n我的施术单元是专门定制的，不可能在抵达这颗星球后的短时间内被仿制，所以我手上的就是原原本本的那一把。\n\n也不太可能是有其它人帮我修复了施术单元，因为我当时检查过它的传感记录，在短时间内并没有其它生命靠近过施术单元。"
 time_lifeline.996.a:0 "可这又能证明什么呢？"
 time_lifeline.997.desc:0 "这证明了我的施术单元是被这片湖水修复的，精确一点来说，是被湖水中的“§H负相粒子§!”修复的。\n虽然不清楚具体的修复过程，但我想，应该是二者之间产生了什么共鸣吧？\n\n我的施术单元能够辅助我飞起来，但飞行的原理并非是通过浮力或者反作用力，它实际上是由一种类似引力场或者相位的形式实现的。\n既然我的施术单元能和这种粒子产生共鸣，那么它或许也有着类似的性质。\n\n于是，我大胆地推断，这两个世界，其实是不同平行宇宙中的同一颗星球！\n这两片湖水均由于某种原因混杂了大量的“§H负相粒子§!”，因此，它们彼此相连了，两个维度也因此重叠在了一起。\n\n这就是这颗星球上最大谜团的最终答案。"
 time_lifeline.997.a:0 "这太匪夷所思了，没有逻辑。"
 time_lifeline.998.desc:0 "这可不是科幻小说，这是现实。\n\n小说需要逻辑，但现实不需要。\n当然了，现实也有着自己的逻辑，只是你我都不知道，毕竟没有人是拉普拉斯妖。\n但这并不意味着追求逻辑是错误的，因为迄今为止，我们所找出的定理、公式、规律、逻辑都在一定程度上适用。\n或许它们并不完美，但我们总在尽可能使它们变得完美。\n\n我的猜想也是一样，虽然我无法断定它就是真相，尽管它的确缺乏足够的逻辑，甚至它也不是对现状唯一的解释，但，追求真理的过程不正是如此吗？\n若它就是现实，那么它一定存在着某种我们暂未找到的逻辑；正因为它可能是现实，所以我们可以继续将其完善。\n如果仅仅因为逻辑不足而非切实证伪就摈弃一次尝试，那我们或许永远都无法了解现实。\n\n接受它的不完美吧，接受每一次突破的不完美吧。\n也许我们永远都无法触及宇宙的真相，但我们仍然可以无限逼近它，直到我们与现实的差异只剩无穷小。\n\n也许总有一天，我们能够证明一切的真理；\n也许总有一天，我们可以成为拉普拉斯妖。"
 time_lifeline.998.a:0 "也许会有那么一天吧。"
 time_lifeline.999.desc:0 "在这颗星球上的探索已经告一段落了，我们一起经历了许多，发现了许多，探讨了许多，真是段令人难忘的时光啊。\n\n虽然我们只是找出了一个不那么像真相的真相，再准确一点，只是一个荒谬至极的猜想，但这毕竟也是我们难得的收获嘛。\n可正是由于它的不完备，我们才有机会进一步完善它嘛，只不过不是现在。$time_lifeline.844.desc.same$"
 time_lifeline.999.a:0 "我们一定会再见，一起成为拉普拉斯妖。"
 time_lifeline.999.a.response:0 "嘿嘿，那只是个比喻啦。\n那，我们约好了哦，一定。"