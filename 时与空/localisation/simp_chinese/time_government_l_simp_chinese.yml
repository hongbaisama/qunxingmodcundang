 edict_origin_gas_colony_edict_rare_crystals_desc:0 "以$rare_crystals$作为凝结核，可以加快固态核心的凝结速率，提高挖掘效率，也有利于我们的工程学研究。"
 edict_origin_gas_colony_edict_exotic_gases:0 "液态领域培养皿"
 edict_origin_gas_colony_edict_exotic_gases_desc:0 "以$exotic_gases$作为培养皿，可以加快液态领域的形成速率，提高培育效率，也有利于我们的社会学研究。"
