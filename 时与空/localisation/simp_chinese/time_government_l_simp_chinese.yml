 edict_origin_psionic_edict_desc:0 "通过消耗$sr_zro$来维持我们与虚境间的裂缝，我们思念故乡的人民会更加团结地凝聚在一起。"
 edict_origin_nanites_edict:0 "纳米科技逆向协议"
 edict_origin_nanites_edict_desc:0 "通过对$nanites$的逆向，我们可以获取更多有关过去的信息和早已失传的科技，并强化我们对$nanites$的操控能力。"
 
 edict_secondhand_country_edict:0 "不论续航"
 edict_secondhand_country_edict_desc:0 "该法令将我们的机器改造推向极致，使其效果翻倍，但同时也使出现恶性副作用的概率上升了，包括突发灾难性的宕机。\n\n§R又能出什么问题呢？§!\n\n§R$edict_secondhand_country_edict$将无视['concept_edict_fund']，并始终消耗你每月$unity_with_icon$收入的80%！§!"
 edict_secondhand_country_edict_effect:0 "所有因['concept_secondhand_country_traits_orange']而导致的正面效果翻倍。"
 
