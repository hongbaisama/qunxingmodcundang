 normal_dimension_traveler:0 "['concept_normal_dimension_traveler']"
 normal_dimension_traveler_desc:0 "界旅者不需要依赖负相位面，她自己就能创造美好的过去与未来。\n\n§E界旅者将维持§Y常规§!的状态§!"
 
 policy_beyond_infinity_seal:0 "$concept_dimensional_horror_crisis_seal$"
 policy_beyond_infinity_seal_desc:0 "借助另一个循环的帮助，我们掌握了终焉封印的方法，但也许不是所有星系都值得我们大动干戈。\n"
 beyond_infinity_seal_for_affected_name:0 "$beyond_infinity_seal_for_affected$"
 beyond_infinity_seal_for_affected:0 "封印被影响星系"
 beyond_infinity_seal_for_affected_desc:0 "我们并不是为了完成任务，任何星系都值得我们守卫。\n\n§E舰船只要进入['concept_dimensional_horror_crisis_storm_affected_yellow']或['concept_dimensional_horror_crisis_erasured_yellow']的星系，就会自动获得该星系的['concept_dimensional_horror_crisis_seal_yellow']项目§!"
 beyond_infinity_seal_for_erasured_name:0 "$beyond_infinity_seal_for_erasured$"
 beyond_infinity_seal_for_erasured:0 "封印被抹除星系"
 beyond_infinity_seal_for_erasured_desc:0 "事务应区分轻重缓急，一时的舍弃是为了长远的安宁。\n\n§E舰船只有进入['concept_dimensional_horror_crisis_erasured_yellow']的星系时，才会自动获得该星系的['concept_dimensional_horror_crisis_seal_yellow']项目§!"
 
 #法令
 edict_defective_time_machine_edict:0 "时空复原"
 edict_defective_time_machine_edict_desc:0 "§R警告：§!\n由于蠢驴的代码原因，在时空乱码期间存档会导致存档记录错误的年份（-5000年左右），即使关闭时空乱码也依然如此，并会导致一系列不可预估的bug。\n因此，请在存档前开启$edict_defective_time_machine_edict$法令以关闭时空乱码，避免存档数据错误。"
 defective_time_machine_edict_effect:0 "§Y关闭时空乱码机制；时空乱码机制将在读档后自动重启§!"
 
