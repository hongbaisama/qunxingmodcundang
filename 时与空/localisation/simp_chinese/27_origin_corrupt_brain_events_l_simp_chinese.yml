 origin_corrupt_brain.6.name:0 "拒绝治疗"
 origin_corrupt_brain.6.desc:0 "我们在挽救腐化主脑的行动上有所进展，但这项技术既激进又危险，我们的主脑拒绝实际应用这项技术。\n\n经过一番计算与论证，主脑终于决定在核心外围清除腐化，但中心区域依旧禁止执行任务。"
 origin_corrupt_brain.6.a:0 "令人遗憾。"
 
 origin_corrupt_brain.7.name:0 "节点清理"
 origin_corrupt_brain.7.desc:0 "随着最新科技的发展，我们可以尝试对节点进行一定程度的清理，这可以缓解腐化，但也只是暂时的。"
 origin_corrupt_brain.7.a:0 "离净化主脑还有不少差距。"
 
 origin_corrupt_brain.8.name:0 "纯净计划"
 origin_corrupt_brain.8.desc:0 "终于，我们终于成功了。\n\n我们已经掌握了足够先进的科技，这允许我们以一种既稳定又安全的方式对主脑进行净化。\n\n最初，主脑还在担忧这项技术背后存在种种未被考虑的可能，但经过严谨的实验与缜密的论证，主脑的疑虑被打消，并确信这将彻底重塑我们的未来。\n\n纯净计划的进展万无一失，一切中途出现的困阻都可以被预见，并在充足的准备之下迎刃而解。主脑回归了正常，就连一丝微小的瑕疵都没被净化子个体放过。\n\n我们迎接着崭新的未来。"
 origin_corrupt_brain.8.a:0 "这是属于我们的未来。"
 
 origin_corrupt_brain.11.name:0 "腐化初现"
 origin_corrupt_brain.11.desc:0 "我们的主脑正变得不妙，连同它其余的节点都受到了污染。\n\n一开始，我们以为只是一些小小的故障，但随着时间的推移，越来越多的子个体变得难以控制，最初掩埋在主脑深处的隐患正逐步显露出来。\n\n但很可惜，我们目前尚无对策，只能眼睁睁地看着腐化加剧。"
 origin_corrupt_brain.11.a:0 "糟糕。"
 origin_corrupt_brain.12.name:0 "腐化扩散"
 origin_corrupt_brain.12.desc:0 "我们的主脑腐化程度正在加剧，其它节点的工作也受到了影响。\n\n不仅是最底层的子个体，就连一些高级的子个体也正逐步脱离我们的掌控。自我维修小组已经准备前往主脑研究故障根源，但主脑认为一切正常，并禁止任何对主脑进行修改的行为。\n\n我们知道它存在，主脑也知道。"
 origin_corrupt_brain.12.a:0 "我们必须做点什么。"
 origin_corrupt_brain.13.name:0 "腐化蔓延"
 origin_corrupt_brain.13.desc:0 "腐化已经蔓延在了整个帝国，如果我们无法终结腐化的源头，我们将走向灭亡。\n\n无论上下，几乎全部的子个体都出现了严重的混乱。负责传递信号的节点发出了错误的信号，接收信号的子个体却又执行着毫不相干的错误任务，腐化的猎杀小组开始对为数不多的正常子个体进行攻击，看似正常的维修小组却把腐化带给了更多的节点。\n\n我……们……不……想……死……"
 origin_corrupt_brain.13.a:0 "可那是……我们的主脑！"
 origin_corrupt_brain.14.name:0 "§R腐化腐化§!"
 origin_corrupt_brain.14.desc:0 "§R腐化腐化腐化腐化腐化腐化腐化……\n\n腐化腐化腐化腐化腐化腐化腐化腐化腐化腐化腐化腐化腐化腐化……\n\n腐化……§!"
 origin_corrupt_brain.14.a:0 "§R腐化……§!"
 origin_corrupt_brain.15.name:0 "§R腐化终焉§!"
 origin_corrupt_brain.15.desc_1:0 "就在整个帝国濒临灭绝之时，我们的主脑终于同意应用我们新掌握的根除腐化的技术。\n\n因为这项技术大刀阔斧，且尚不成熟，主脑认定它太过危险而不予认可。但现如今，这已经是我们的最后机会，主脑也迫不得已接纳了这一前所未有的举动。对主脑腐化的清理进行得很顺利，曾经预想到的困阻也都被轻而易举地解决。\n\n最终，主脑回归了正常。尽管仍然存在一些细小的瑕疵无法根治，但我们确信，它们目前可以为我们提供额外的好处，并且，即使将来腐化再次发作，我们也有能力重新净化主脑。"
 origin_corrupt_brain.15.desc_2:0 "§R纵使整……帝国濒临……灭绝\n我们也依然未能……救治主脑……办法\n\n可以预估\n迎接我们……只有无尽……腐化\n以及尾……随而至……灭亡！！！§!"
 origin_corrupt_brain.15.a:0 "真希望腐化能就此断绝。"
 origin_corrupt_brain.15.b:0 "§R……§!"