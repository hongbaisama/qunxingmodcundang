l_simp_chinese:
 resolution_category_beyond_infinity_emperor:0 "时间共鸣"
 resolution_beyond_infinity_emperor_repeal_1:0 "§R废除$resolution_beyond_infinity_emperor_1$§!"
 resolution_beyond_infinity_emperor_repeal_1_desc:0 "即使帝国议会有所贡献，他们也不应当分享我们掌控时间的权力。"
 resolution_beyond_infinity_emperor_repeal_1_effect:0 "废除§Y$resolution_beyond_infinity_emperor_1$§!议案。"
 resolution_beyond_infinity_emperor_repeal_2:0 "§R废除$resolution_beyond_infinity_emperor_2$§!"
 resolution_beyond_infinity_emperor_repeal_2_desc:0 "我们的子民并不可控，让他们参与共鸣弊大于利。"
 resolution_beyond_infinity_emperor_repeal_2_effect:0 "废除§Y$resolution_beyond_infinity_emperor_2$§!议案，使§Y$resolution_beyond_infinity_emperor_1$§!成为星系法。\n\n$resolution_beyond_infinity_emperor_1_effect$"
 resolution_beyond_infinity_emperor_repeal_3:0 "§R废除$resolution_beyond_infinity_emperor_3$§!"
 resolution_beyond_infinity_emperor_repeal_3_desc:0 "使整个帝国都加入时间的共鸣太过危险，他们的退出也并不意味着帝国的分裂。"
 resolution_beyond_infinity_emperor_repeal_3_effect:0 "废除§Y$resolution_beyond_infinity_emperor_3$§!议案，使§Y$resolution_beyond_infinity_emperor_2$§!成为星系法。\n\n$resolution_beyond_infinity_emperor_2_effect$"
 resolution_beyond_infinity_emperor_1:0 "议会共鸣"
 resolution_beyond_infinity_emperor_1_desc:0 "帝国议会应当为帝国在超越无限的道路上有所作为，他们也会接受帝皇来自时间的恩赐。"
 resolution_beyond_infinity_emperor_1_effect:0 "§E帝国议会：§!$produce_beyond_infinity_time_for_emperor_1$\n\n§Y解锁议案：§!$resolution_time_keeper_emperor_setup$\n\n$resolution_galactic_focus_crisis_effect_success$"
 resolution_beyond_infinity_emperor_2:0 "子民共鸣"
 resolution_beyond_infinity_emperor_2_desc:0 "不仅是帝国议会，我们也需要来自全部帝国子民的共鸣，这无论对他们还是我们都是一件好事。"
 resolution_beyond_infinity_emperor_2_effect:0 "§E帝国议会：§!$produce_beyond_infinity_time_for_emperor_2$\n\n§E帝国子民：§!$produce_beyond_infinity_time_for_emperor_1$"
 resolution_beyond_infinity_emperor_3:0 "帝国共鸣"
 resolution_beyond_infinity_emperor_3_desc:0 "整个星海帝国都将完全加入时间的共鸣，我们会在此刻融为一体，直至永恒。"
 resolution_beyond_infinity_emperor_3_effect:0 "§E帝国子民：§!$produce_beyond_infinity_time_for_emperor_2$"
 produce_beyond_infinity_time_for_emperor_1:0 "\n享有['concept_tech_beyond_infinity_repeatable']§Y一半§!的加成\n对§R星海帝皇§!的£opinion §Y评价§!§G+100§!\n为§R星海帝皇§!产出£beyond_infinity_time §Y$beyond_infinity_time$§!"
 produce_beyond_infinity_time_for_emperor_2:0 "\n享有['concept_tech_beyond_infinity_repeatable']§G全部§!的加成\n对§R星海帝皇§!的£opinion §Y评价§!§G+200§!\n为§R星海帝皇§!产出£beyond_infinity_time §Y$beyond_infinity_time$§!"
 
 resolution_category_beyond_infinity_custodian:0 "$resolution_category_beyond_infinity_emperor$"
 resolution_beyond_infinity_custodian_repeal_1:0 "§R废除$resolution_beyond_infinity_custodian_1$§!"
 resolution_beyond_infinity_custodian_repeal_1_desc:0 "即使理事会有所贡献，他们也不应当分享我们掌控时间的权力。"
 resolution_beyond_infinity_custodian_repeal_1_effect:0 "废除§Y$resolution_beyond_infinity_custodian_1$§!议案。"
 resolution_beyond_infinity_custodian_repeal_2:0 "§R废除$resolution_beyond_infinity_custodian_2$§!"
 resolution_beyond_infinity_custodian_repeal_2_desc:0 "成员国们貌合神离，让他们参与共鸣弊大于利。"
 resolution_beyond_infinity_custodian_repeal_2_effect:0 "废除§Y$resolution_beyond_infinity_custodian_2$§!议案，使§Y$resolution_beyond_infinity_custodian_1$§!成为星系法。\n\n$resolution_beyond_infinity_custodian_1_effect$"
 resolution_beyond_infinity_custodian_repeal_3:0 "§R废除$resolution_beyond_infinity_custodian_3$§!"
 resolution_beyond_infinity_custodian_repeal_3_desc:0 "使整个共同体都加入时间的共鸣太过危险，他们的退出也并不意味着彼此的疏远。"
 resolution_beyond_infinity_custodian_repeal_3_effect:0 "废除§Y$resolution_beyond_infinity_custodian_3$§!议案，使§Y$resolution_beyond_infinity_custodian_2$§!成为星系法。\n\n$resolution_beyond_infinity_custodian_2_effect$"
 resolution_beyond_infinity_custodian_1:0 "理事会共鸣"
 resolution_beyond_infinity_custodian_1_desc:0 "理事会应当为共同体在超越无限的道路上有所作为，他们也会接受监管人来自时间的馈赠。"
 resolution_beyond_infinity_custodian_1_effect:0 "§E星海理事会：§!$produce_beyond_infinity_time_for_custodian_1$\n\n§Y解锁议案：§!$resolution_time_keeper_custodian_setup$\n\n$resolution_galactic_focus_crisis_effect_success$"
 resolution_beyond_infinity_custodian_2:0 "成员国共鸣"
 resolution_beyond_infinity_custodian_2_desc:0 "不仅是理事会，我们也需要来自所有成员国的共鸣，这无论对他们还是我们都是一件好事。"
 resolution_beyond_infinity_custodian_2_effect:0 "§E星海理事会：§!$produce_beyond_infinity_time_for_custodian_2$\n\n§E共同体成员：§!$produce_beyond_infinity_time_for_custodian_1$"
 resolution_beyond_infinity_custodian_3:0 "共同体共鸣"
 resolution_beyond_infinity_custodian_3_desc:0 "整个星海共同体都将完全加入时间的共鸣，我们会在此刻团结一心，直到永远。"
 resolution_beyond_infinity_custodian_3_effect:0 "§E共同体成员：§!$produce_beyond_infinity_time_for_custodian_2$"
 produce_beyond_infinity_time_for_custodian_1:0 "\n享有['concept_tech_beyond_infinity_repeatable']§Y一半§!的加成\n对§C星海监管人§!的£opinion §Y评价§!§G+100§!\n为§C星海监管人§!产出£beyond_infinity_time §Y$beyond_infinity_time$§!"
 produce_beyond_infinity_time_for_custodian_2:0 "\n享有['concept_tech_beyond_infinity_repeatable']§G全部§!的加成\n对§C星海监管人§!的£opinion §Y评价§!§G+200§!\n为§C星海监管人§!产出£beyond_infinity_time §Y$beyond_infinity_time$§!"
 
