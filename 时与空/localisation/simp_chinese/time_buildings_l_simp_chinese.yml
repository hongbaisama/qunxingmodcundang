 building_adeptus_mechanicus_vault_desc:0 "$origin_adeptus_mechanicus_picture$不思悔改与冥顽不灵的机械会被强制送往此地进行惩处。这并非我们对他们的虐待，而是我们令其焕然一新的洗礼。\n更何况，他们自己也乐在其中。"
 
