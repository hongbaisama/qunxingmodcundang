 building_time_shelter_secondary_job_1: "谬误演算仪"
 building_time_shelter_secondary_job_1_desc: "彼岸与现世的偏差必须得到精确演算，任何谬误都是重大的影响因素。"
 building_time_shelter_secondary_job_2: "悖论修正仪"
 building_time_shelter_secondary_job_2_desc: "彼岸与现世的偏差必须得到及时修正，任何悖论都是严重的安全隐患。"
 
 building_time_shelter_max_districts_1: "静滞钟楼"
 building_time_shelter_max_districts_1_desc: "当钟表就此静滞，时间也停止流动。"
 building_time_shelter_max_districts_2: "逆转钟楼"
 building_time_shelter_max_districts_2_desc: "当钟表开始逆转，时间也随之倒退。"
 
 building_time_shelter_sentinel_base_resource_1: "荒废许愿井"
 building_time_shelter_sentinel_base_resource_1_desc: "彼岸哨兵在此处发现了一座荒废的许愿井，有人投入硬币，却没能得到回应。"
 building_time_shelter_sentinel_base_resource_2: "怪异许愿井"
 building_time_shelter_sentinel_base_resource_2_desc: "对许愿井的请求终于取得了回报，彼岸哨兵开始将源源不断的资源运回庇护所。"
 building_time_shelter_sentinel_base_resource_3: "受诅许愿井"
 building_time_shelter_sentinel_base_resource_3_desc: "这座许愿井受到了诅咒，我们已经无法停止许愿了——直到许愿井的愿望得到满足。"
 
 building_time_shelter_sentinel_rare_resource_1: "熟悉的矿道"
 building_time_shelter_sentinel_rare_resource_1_desc: "彼岸哨兵在此处发现了一座熟悉的矿道，其中显露出不少稀有矿藏。"
 building_time_shelter_sentinel_rare_resource_2: "无止尽矿道"
 building_time_shelter_sentinel_rare_resource_2_desc: "彼岸哨兵试图对这座矿道探索，却始终无法抵达尽头。"
 building_time_shelter_sentinel_rare_resource_3: "衔尾蛇矿道"
 building_time_shelter_sentinel_rare_resource_3_desc: "彼岸哨兵从矿道的出口返回，但他们似乎已在其中度过了数百年。"
 
 building_time_shelter_sentinel_planet_modifier_a_1: "无限森林"
 building_time_shelter_sentinel_planet_modifier_a_1_desc: "彼岸哨兵在此处发现了一片资源取之不尽的庞大森林。"
 building_time_shelter_sentinel_planet_modifier_a_2: "蔓延森林"
 building_time_shelter_sentinel_planet_modifier_a_2_desc: "这片庞大的森林似乎在无休止地向外蔓延，天知道它们什么时候会将我们包围。"
 
 building_time_shelter_sentinel_planet_modifier_b_1: "青春不老泉"
 building_time_shelter_sentinel_planet_modifier_b_1_desc: "彼岸哨兵在此处发现了一处不老泉，饮用者可永葆青春。"
 building_time_shelter_sentinel_planet_modifier_b_2: "生亡不老泉"
 building_time_shelter_sentinel_planet_modifier_b_2_desc: "喝下不老泉的人似乎陷入了生与死的叠加态，但他们确实失去了衰朽的机能。"
 
 building_time_shelter_sentinel_country_modifier: "失落军械库"
 building_time_shelter_sentinel_country_modifier_desc: "彼岸哨兵在此处发现了一座失落的军械库，其中贮藏着一些远古时期的装备。"
 
 building_time_shelter_artisan_base_resource_1: "古怪工厂"
 building_time_shelter_artisan_base_resource_1_desc: "次元工匠设计了一座古怪的工厂，声称这能大幅提高工业生产效率。"
 building_time_shelter_artisan_base_resource_2: "智慧工厂"
 building_time_shelter_artisan_base_resource_2_desc: "这座工厂似乎有着自己的智慧，但它确实在工业生产上达成了预期指标。"
 building_time_shelter_artisan_base_resource_3: "炼狱工厂"
 building_time_shelter_artisan_base_resource_3_desc: "这座工厂接管了远超所需的权限，此地早已变为一处炼狱。"
 
 building_time_shelter_artisan_rare_resource_1: "高压熔炉"
 building_time_shelter_artisan_rare_resource_1_desc: "次元工匠设计了一台高压熔炉，并确保一切都处于安全范围内。"
 building_time_shelter_artisan_rare_resource_2: "负压熔炉"
 building_time_shelter_artisan_rare_resource_2_desc: "这台熔炉的工作压力失控般地骤降，但其产品质量却意外地很好。"
 building_time_shelter_artisan_rare_resource_3: "真空熔炉"
 building_time_shelter_artisan_rare_resource_3_desc: "这台熔炉内部已经变成真空，或许物质是在另一个位面实现重组的。"
 
 building_time_shelter_artisan_planet_modifier_a_1: "自维护车间"
 building_time_shelter_artisan_planet_modifier_a_1_desc: "次元工匠设计了一处车间，其配置了一套用于自发维护的设备。"
 building_time_shelter_artisan_planet_modifier_a_2: "自重置车间"
 building_time_shelter_artisan_planet_modifier_a_2_desc: "这处车间的状态在无规律地刷新，但只要不在刷新期间迷失其中，它还是安全的。"
 
 building_time_shelter_artisan_planet_modifier_b_1: "建造者机库"
 building_time_shelter_artisan_planet_modifier_b_1_desc: "次元工匠设计了一座机库，用于容纳生产建造型智能机器人。"
 building_time_shelter_artisan_planet_modifier_b_2: "复制者机库"
 building_time_shelter_artisan_planet_modifier_b_2_desc: "智能机器人对机库本身进行了改造，现在它们会不断自我复制以完成并不存在的工作——不惜一切代价。"
 
 building_time_shelter_artisan_country_modifier: "反物质船坞"
 building_time_shelter_artisan_country_modifier_desc: "该区域的特性允许次元工匠使用反物质进行舰船配件建造，失误引发的湮灭也在计算之内。"
 
 building_time_shelter_elder_base_resource_1: "应许交易所"
 building_time_shelter_elder_base_resource_1_desc: "位面长老在此地组建了一座交易所，并声称此为应许之地。"
 building_time_shelter_elder_base_resource_2: "受祝交易所"
 building_time_shelter_elder_base_resource_2_desc: "这座交易所受到了位面长老的祝福，庇护所的居民满怀期待地在此购置物资。"
 building_time_shelter_elder_base_resource_3: "属灵交易所"
 building_time_shelter_elder_base_resource_3_desc: "这座交易所进行了重大改革，将由属灵代替居民完成一切交易，且无需居民本人同意。"
 
 building_time_shelter_elder_rare_resource_1: "自然教会"
 building_time_shelter_elder_rare_resource_1_desc: "位面长老成立了一处普世教会，旨在引导居民融入彼岸的自然。"
 building_time_shelter_elder_rare_resource_2: "低语教会"
 building_time_shelter_elder_rare_resource_2_desc: "融入彼岸的第一步——聆听自然的低语。"
 building_time_shelter_elder_rare_resource_3: "谵妄教会"
 building_time_shelter_elder_rare_resource_3_desc: "融入彼岸的第二步——遵循自然的教诲、传播自然的福音、服从自然的意志、§R自然自然自然自然自然§!。"
 
 building_time_shelter_elder_planet_modifier_a_1: "调配行政楼"
 building_time_shelter_elder_planet_modifier_a_1_desc: "位面长老建造了一片行政楼，用于对庇护所的人员与物资进行及时调配。"
 building_time_shelter_elder_planet_modifier_a_2: "冗余行政楼"
 building_time_shelter_elder_planet_modifier_a_2_desc: "这片行政楼也不可避免地陷入了冗余的窘境，但一切都是庇护所必要的。"
 
 building_time_shelter_elder_planet_modifier_b_1: "布施修道院"
 building_time_shelter_elder_planet_modifier_b_1_desc: "位面长老修建了一处修道院，并对庇护所的穷困居民施以援手。"
 building_time_shelter_elder_planet_modifier_b_2: "宣泄修道院"
 building_time_shelter_elder_planet_modifier_b_2_desc: "这处修道院似乎已经偏离了本心，无节制的宣泄刺激着每个人心中无法满足的欲望。"
 
 building_time_shelter_elder_country_modifier: "殉道者信标"
 building_time_shelter_elder_country_modifier_desc: "这里是由无数殉道者的尸骸搭建成的信标，时刻激励着帝国对飞升的探求。"
 
 building_time_shelter_watcher_base_resource_1: "求真实验室"
 building_time_shelter_watcher_base_resource_1_desc: "维度观者搭建了这座精妙的实验室，用于满足他们求知的欲望。"
 building_time_shelter_watcher_base_resource_2: "秘密实验室"
 building_time_shelter_watcher_base_resource_2_desc: "这座实验室的存在已经变成了秘密，维度观者似乎进行着某种危险的实验。"
 building_time_shelter_watcher_base_resource_3: "狂信实验室"
 building_time_shelter_watcher_base_resource_3_desc: "维度观者借助实验将自己融入彼岸，他们不在这里，他们无处不在。"
 
 building_time_shelter_watcher_rare_resource_1: "调查基金会"
 building_time_shelter_watcher_rare_resource_1_desc: "维度观者组织了一个基金会，旨在对各种异常现象进行调查。"
 building_time_shelter_watcher_rare_resource_2: "收容基金会"
 building_time_shelter_watcher_rare_resource_2_desc: "某些异常现象的危险程度远超我们的想象，它们必须得到收容。"
 building_time_shelter_watcher_rare_resource_3: "封存基金会"
 building_time_shelter_watcher_rare_resource_3_desc: "基金会已经停摆，它的档案已被封存，只希望没有人再次获悉那个存在。"
 
 building_time_shelter_watcher_planet_modifier_a_1: "桃源夹缝"
 building_time_shelter_watcher_planet_modifier_a_1_desc: "维度观者通过奇点撕开了一道夹缝，它连接着一处世外桃源。"
 building_time_shelter_watcher_planet_modifier_a_2: "虚空夹缝"
 building_time_shelter_watcher_planet_modifier_a_2_desc: "所谓的世外桃源只是一场幻象，但愿沉溺于虚无中的人们永远不要醒来。"
 
 building_time_shelter_watcher_planet_modifier_b_1: "学术图书馆"
 building_time_shelter_watcher_planet_modifier_b_1_desc: "维度观者将自己的学术成果储存与这座图书馆中，并对外界免费开放。"
 building_time_shelter_watcher_planet_modifier_b_2: "禁忌图书馆"
 building_time_shelter_watcher_planet_modifier_b_2_desc: "一些不可容忍的禁忌知识混杂在了书籍之中，但它们的泄露已无从阻止。"
 
 building_time_shelter_watcher_country_modifier: "无知象牙塔"
 building_time_shelter_watcher_country_modifier_desc: "维度观者用这座空无一物的象牙塔时刻警醒自己——我们唯一所知的就是我们一无所知。"