l_simp_chinese:
 
 ################################################################
 # 预设国特殊
 ################################################################
 
 TIMELINE_EVENT_WONDER_COUNTRY_TIME_0_TOOLTIP: "§H命定之人§!\n§Y起源事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]的统治者[EVENT_TARGET_1.GetName]展现了某种奇迹，成为历代序时者里第一个触及§H永恒奥秘§!之人。"
 TIMELINE_EVENT_WONDER_COUNTRY_TIME_1_TOOLTIP: "§H命定之人§!\n§Y起源事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]的统治者[EVENT_TARGET_1.GetName]感悟了某种预兆，被选定为§H不朽者§!，为逐光者们寻觅未来的光明。"
 TIMELINE_EVENT_WONDER_COUNTRY_TIME_2_TOOLTIP: "§H命定之人§!\n§Y起源事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]的统治者[EVENT_TARGET_1.GetName]接收了某种信号，解锁了无来源的§H知识库§!，并得知了终末的阴影。"
 TIMELINE_WONDER_COUNTRY_TIME: "命定之人\n§L[GetDate]§!"
 
 ################################################################
 # 时之螶
 ################################################################
 
 TIMELINE_EVENT_HORIZONSIGNAL_BEGIN_TOOLTIP: "§H视界信号§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]收到了来自[EVENT_TARGET_1.GetName]的视界信号，并派遣[EVENT_TARGET_2.GetName]驶向信号中暗藏的坐标。\n尽管他陷入了黑洞的永恒怀抱，却为我们揭示了§H时之螶§!的存在。"
 TIMELINE_HORIZONSIGNAL_BEGIN: "视界信号\n§L[GetDate]§!"
 
 TIMELINE_EVENT_HORIZONSIGNAL_NOT_BEGIN_TOOLTIP: "§H视界信号§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]收到了来自[EVENT_TARGET_1.GetName]的视界信号，但最终决定不予理睬。\n我们似乎错过了什么，但这未尝不是一件好事。"
 TIMELINE_HORIZONSIGNAL_NOT_BEGIN: "拒绝信号\n§L[GetDate]§!"
 
 TIMELINE_EVENT_HORIZONSIGNAL_BEGIN_BUT_STOP_TOOLTIP: "§H讯息结束§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]再次收到了[EVENT_TARGET_1.GetName]的死亡邀请，但最终决定不予理睬。\n我们似乎错过了什么，但这未尝不是一件好事。"
 TIMELINE_HORIZONSIGNAL_BEGIN_BUT_STOP: "讯息结束\n§L[GetDate]§!"
 
 TIMELINE_EVENT_LOOP_TEMPLE_TOOLTIP: "§H环形神殿§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]意外发现了[EVENT_TARGET_1.GetName]上的环形神殿，并接纳了它的存在。\n这或许是“时间蠕虫”赠予我们的礼物。"
 TIMELINE_LOOP_TEMPLE: "环形神殿\n§L[GetDate]§!"
 
 TIMELINE_EVENT_LOOP_TEMPLE_BUT_SEAL_TOOLTIP: "§H环形神殿§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]意外发现了[EVENT_TARGET_1.GetName]上的环形神殿，但最终决定将其封印。\n小心驶得万年船。"
 TIMELINE_LOOP_TEMPLE_BUT_SEAL: "封印神殿\n§L[GetDate]§!"
 
 TIMELINE_EVENT_WORM_LOVES_US_AND_ACCEPT_TOOLTIP: "§H见证未来§!\n§Y星系事件§!\n\n§L[GetDate]§!，时之螶向[EVENT_TARGET_0.GetName]献出了无限的爱，而我们也接纳了她无限的爱。\n在爱的舔舐下，我们终于步上了命中注定的道路。"
 TIMELINE_EVENT_WORM_LOVES_US_AND_ACCEPT_OTHER_TOOLTIP: "§H见证未来§!\n§Y星系事件§!\n\n§L[GetDate]§!，时之螶向[EVENT_TARGET_0.GetName]献出了无限的爱，而他们也接纳了她无限的爱。\n在爱的舔舐下，他们终于步上了命中注定的道路。"
 TIMELINE_WORM_LOVES_US_AND_ACCEPT: "见证未来\n§L[GetDate]§!"
 
 TIMELINE_EVENT_WORM_LOVES_US_BUT_REFUSE_TOOLTIP: "§H破碎圆环§!\n§Y星系事件§!\n\n§L[GetDate]§!，时之螶向[EVENT_TARGET_0.GetName]献出了无限的爱，而我们却不愿接纳这份扭曲的爱。\n我们驱逐了它，但它就在那里。"
 TIMELINE_EVENT_WORM_LOVES_US_BUT_REFUSE_OTHER_TOOLTIP: "§H破碎圆环§!\n§Y星系事件§!\n\n§L[GetDate]§!，时之螶向[EVENT_TARGET_0.GetName]献出了无限的爱，而他们却不愿接纳这份扭曲的爱。\n他们驱逐了它，但它就在那里。"
 TIMELINE_WORM_LOVES_US_BUT_REFUSE: "破碎圆环\n§L[GetDate]§!"
 
 TIMELINE_EVENT_ACCEPT_UNLEASHED_MESSENGER_NORMAL_TOOLTIP: "§H崭新曙光§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]已经重构了信使物种的起源，并开始了向信使的转变。\n已行之事，必将再行。"
 TIMELINE_EVENT_ACCEPT_UNLEASHED_MESSENGER_ROBOTIC_TOOLTIP: "§H崭新曙光§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]已经逆向了信使物种的机理，并开始了向信使的转变。\n已行之事，必将再行。"
 TIMELINE_ACCEPT_UNLEASHED_MESSENGER: "崭新曙光\n§L[GetDate]§!"
 
 TIMELINE_EVENT_ACCEPT_LEASHED_MESSENGER_NORMAL_TOOLTIP: "§H夜幕降临§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]已经重构了信使物种的起源，并开始了向信使的转变。\n已行之事，必将再行。"
 TIMELINE_EVENT_ACCEPT_LEASHED_MESSENGER_ROBOTIC_TOOLTIP: "§H夜幕降临§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]已经逆向了信使物种的机理，并开始了向信使的转变。\n已行之事，必将再行。"
 TIMELINE_ACCEPT_LEASHED_MESSENGER: "夜幕降临\n§L[GetDate]§!"
 
 TIMELINE_EVENT_GAIN_TIME_TITAN_TOOLTIP: "§H时空之外§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]的指挥官[EVENT_TARGET_1.GetName]于[EVENT_TARGET_2.GetName]接管了明日船长的终末行舟。\n我们获得了它的完整掌控权，但也遗失了它的过去与未来。"
 TIMELINE_GAIN_TIME_TITAN: "时空之外\n§L[GetDate]§!"
 
 TIMELINE_EVENT_MANIFOLD_COUNTRY_ASCENSION_TOOLTIP: "§H受赞颂者§!\n§Y星系事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]启动了梦魇的召唤仪式，并试图朝着终点飞升。\n他们的飞升是成功还是失败了？这个问题或许只有他们自己能够解答，而我们可能永远也得不到真相。"
 TIMELINE_MANIFOLD_COUNTRY_ASCENSION: "受赞颂者\n§L[GetDate]§!"
 
 TIMELINE_EVENT_HOLE_PETS_PANTAGRUEL_TOOLTIP: "§H$NAME_Pantagruel$§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]见证了[EVENT_TARGET_1.GetName]的自我压缩，并从中发现了另外一个宇宙。\n圣仆完成了最初的使命。"
 TIMELINE_HOLE_PETS_PANTAGRUEL: "$NAME_Pantagruel$\n§L[GetDate]§!"
 
 ################################################################
 # 负相
 ################################################################
 
 TIMELINE_EVENT_FIRST_MEET_DIMENSIONAL_HORROR_TOOLTIP: "§H负相存在§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]于[EVENT_TARGET_1.GetName]星系首次遭遇了位面之魇。"
 TIMELINE_FIRST_MEET_DIMENSIONAL_HORROR: "负相存在\n§L[GetDate]§!"
 
 TIMELINE_EVENT_ACTIVE_TR_HORROR_ADOPT_TOOLTIP: "§H初入负相§!\n§Y里程碑§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]采纳了负相传统，踏入了负相的领域。\n尽管步履蹒跚，但我们仍在前进。"
 TIMELINE_ACTIVE_TR_HORROR_ADOPT: "初入负相\n§L[GetDate]§!"
 
 TIMELINE_EVENT_ACTIVE_AP_HORROR_TOOLTIP: "§H负相奥秘§!\n§Y里程碑§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]采纳了负相奥秘飞升天赋，而时之螶则撕裂了维度，慷慨地为我们指明了探索的方向。\n这或许意味着灾难，但也可能蕴含着机遇。"
 TIMELINE_ACTIVE_AP_HORROR: "负相奥秘\n§L[GetDate]§!"
 
 TIMELINE_EVENT_ACTIVE_AP_TIME_TOOLTIP: "§H时空因果§!\n§Y里程碑§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]采纳了时空因果飞升天赋，我们对知识的追求永无止境，但其尽头究竟是希望，还是终末？\n我们渴求更多，更多，更多……"
 TIMELINE_ACTIVE_AP_TIME: "时空因果\n§L[GetDate]§!"
 
 TIMELINE_EVENT_ACTIVE_AP_BEYOND_INFINITY_TOOLTIP: "§H超越无限§!\n§Y星系事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]在超越因果之后，踏上了超越无限的道路。\n正如过去之轮回，正如未来之循环。"
 TIMELINE_EVENT_ACTIVE_AP_BEYOND_INFINITY_OTHER_TOOLTIP: "§H超越无限§!\n§Y星系事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]似乎正为某个遥远未来的危机做准备，并踏上了超越无限的道路。\n正如过去之轮回，正如未来之循环。"
 TIMELINE_ACTIVE_AP_BEYOND_INFINITY: "超越无限\n§L[GetDate]§!"
 
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_HORROR_1_TOOLTIP: "§H陷入循环§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]完成了对$astral_rift_akx_horror$的探索，但代价是一名科学官就此离去。\n他们陷入了循环，那我们呢？"
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_HORROR_1: "陷入循环\n§L[GetDate]§!"
 
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_HORROR_2_TOOLTIP: "§H命定谜团§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]完成了对$astral_rift_akx_horror$的探索，但仍有谜团未能解开。\n这真的是命中注定的吗？"
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_HORROR_2: "命定谜团\n§L[GetDate]§!"
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_HORROR_2_THIRD_TOOLTIP: "§H命定悲剧§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]完成了对$astral_rift_akx_horror$的探索，但悲剧仍然无从避免。\n这真的是命中注定的吗？"
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_HORROR_2_THIRD: "命定悲剧\n§L[GetDate]§!"
 
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_HORROR_3_TOOLTIP: "§H灰烬之中§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]完成了对$astral_rift_akx_horror$的探索，尽管一切以灰烬告终。\n我们错失了挽救自己的机会。"
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_HORROR_3: "灰烬之中\n§L[GetDate]§!"
 
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_HORROR_4_LOST_TOOLTIP: "§H镜中倒影§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]完成了对$astral_rift_akx_horror$的探索，并找到了另一位[EVENT_TARGET_1.GetName]。\n失踪者被幸存者取代，这一切绝对不会是巧合。"
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_HORROR_4_MIRROR_TOOLTIP: "§H镜中倒影§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]完成了对$astral_rift_akx_horror$的探索，[EVENT_TARGET_1.GetName]也遇见了另一个自己。\n互为镜像的两人现在合二为一了。"
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_HORROR_4: "镜中倒影\n§L[GetDate]§!"
 
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_TIME_1_TOOLTIP: "§H无果而终§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]中断了对$astral_rift_akx_time$的探索，只为避免触及世界的真实。\n还好，他们没有发现更多。"
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_TIME_1: "无果而终\n§L[GetDate]§!"
 
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_TIME_2_TOOLTIP: "§H连接无限§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]结束了对$astral_rift_akx_time$的探索，只因这次探索本身注定没有结局。\n锚链的彼端是无限。"
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_TIME_2: "连接无限\n§L[GetDate]§!"
 
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_TIME_3_TOOLTIP: "§H迷宫尽头§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]完成了对$astral_rift_akx_time$的探索，然而这次探索本身就是一个循环。\n那我们现在所迎接的究竟是谁？"
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_TIME_3: "迷宫尽头\n§L[GetDate]§!"
 
 ################################################################
 # 终焉宣告
 ################################################################
 
 TIMELINE_EVENT_DIMENSIONAL_HORROR_CRISIS_BEGIN_TOOLTIP: "§H终焉宣告§!\n§Y危机事件§!\n\n§L[GetDate]§!，一场名为终焉宣告的风暴在银河悄然降临。混沌、无序、痛苦、灾难、死亡、终结，几乎一切可怖的负面词汇都如字面般弥漫在深不可测的风暴之中。这仅仅是一个开始，却将我们裹挟直至时间尽头。\n我们的敌人，即是宇宙本身。"
 TIMELINE_DIMENSIONAL_HORROR_CRISIS_BEGIN: "终焉宣告\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSIONAL_HORROR_CRISIS_BEGIN_FOR_NEW_COUNTRY_TOOLTIP: "§H终焉宣告§!\n§Y危机事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]观测到了一场名为终焉宣告的风暴，而它早已存在。混沌、无序、痛苦、灾难、死亡、终结，几乎一切可怖的负面词汇都如字面般弥漫在深不可测的风暴之中。这仅仅是一个开始，却将我们裹挟直至时间尽头。\n我们的敌人，即是宇宙本身。"
 TIMELINE_DIMENSIONAL_HORROR_CRISIS_BEGIN_FOR_NEW_COUNTRY: "终焉宣告\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSIONAL_HORROR_CRISIS_DESTINY_OCCUR_TOOLTIP: "§H命运尾声§!\n§Y危机事件§!\n\n§L[GetDate]§!，名为命运的终焉之魇在[EVENT_TARGET_0.GetName]星系汇聚成型。我们能从祂身上感受到一股深不可测的恐惧，一种源于宇宙本质的苦痛。或许祂是来自循环的反击，或许祂是来自时之螶的考验，一切都无法知晓。\n至少，这就是最后的尾声了。"
 TIMELINE_DIMENSIONAL_HORROR_CRISIS_DESTINY_OCCUR: "命运尾声\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSIONAL_HORROR_CRISIS_END_TOOLTIP: "§H跨过命运前行§!\n§Y危机事件§!\n\n§L[GetDate]§!，名为命运的终焉之魇已经陨落，这场风暴浩劫也缓缓停歇。现如今，终焉宣告的一切痕迹都在瞬间消失，仿佛它从来都不存在。然而，斑驳的银河星图却仍在警醒着我们这一危机的惨烈。\n无论如何，我们终于可以为一切画上句号了——和所有人一起。"
 TIMELINE_DIMENSIONAL_HORROR_CRISIS_END: "跨过命运前行\n§L[GetDate]§!"

 ################################################################
 # 时间机器/圆环枢纽/位面引擎
 ################################################################
 
 TIMELINE_EVENT_TIME_MACHINE_BEGIN_TOOLTIP: "§H时空混乱§!\n§Y星系事件§!\n\n§L[GetDate]§!，银河系的时间突然变得混乱不堪且难以测定。"
 TIMELINE_TIME_MACHINE_BEGIN: "时空混乱\n§L[GetDate]§!"
 
 TIMELINE_EVENT_TIME_MACHINE_END_TOOLTIP: "§H时空复原§!\n§Y星系事件§!\n\n§L[GetDate]§!，如它毫无来由的出现，混乱的时空也毫无征兆地复原了。"
 TIMELINE_TIME_MACHINE_END: "时空复原\n§L[GetDate]§!"
 
 TIMELINE_EVENT_CIRCLE_NEXUS_BEGIN_TOOLTIP: "§H圆环偏移§!\n§Y星系事件§!\n\n§L[GetDate]§!，银河系遭遇了前所未有的存在哲学危机。"
 TIMELINE_CIRCLE_NEXUS_BEGIN: "圆环偏移\n§L[GetDate]§!"
 
 TIMELINE_EVENT_CIRCLE_NEXUS_END_TOOLTIP: "§H圆环归位§!\n§Y星系事件§!\n\n§L[GetDate]§!，如它毫无来由的出现，偏移的圆环也毫无征兆地归位了。"
 TIMELINE_CIRCLE_NEXUS_END: "圆环归位\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_ENGINE_BEGIN_TOOLTIP: "§H位面震荡§!\n§Y星系事件§!\n\n§L[GetDate]§!，银河系眨眼间便如出错的程序般闪烁。"
 TIMELINE_DIMENSION_ENGINE_BEGIN: "位面震荡\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_ENGINE_END_TOOLTIP: "§H位面平息§!\n§Y星系事件§!\n\n§L[GetDate]§!，如它毫无来由的出现，震荡的位面也毫无征兆地平息了。"
 TIMELINE_DIMENSION_ENGINE_END: "位面平息\n§L[GetDate]§!"
 
 ################################################################
 # 界旅者
 ################################################################
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_BEGIN_ORIGIN_TOOLTIP: "§H白洞之中§!\n§Y起源事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]收到了来自[EVENT_TARGET_1.GetName]的白洞信号，并决定对其分析。\n这是一段早已开始的旅程。"
 TIMELINE_EVENT_DIMENSION_TRAVELER_BEGIN_TOOLTIP: "§H白洞之中§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]收到了来自[EVENT_TARGET_1.GetName]的白洞信号，并决定对其分析。\n这是一段新的开始。"
 TIMELINE_DIMENSION_TRAVELER_BEGIN: "白洞之中\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_NOT_BEGIN_TOOLTIP: "§H白洞之中§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]收到了来自[EVENT_TARGET_1.GetName]的白洞信号，但决定置之不理。\n未曾开始，早已结束。"
 TIMELINE_DIMENSION_TRAVELER_NOT_BEGIN: "白洞之中\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_BEGIN_BUT_STOP_TOOLTIP: "§H白洞之终§!\n§Y帝国事件§!\n\n§L[GetDate]§!，经过了一番尝试，[EVENT_TARGET_0.GetName]最终还是放弃了对白洞的探索。\n白洞之旅已达尽头。"
 TIMELINE_DIMENSION_TRAVELER_BEGIN_BUT_STOP: "白洞之终\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_1_ORIGIN_TOOLTIP: "§H永不再见§!\n§Y起源事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]的科研船驶出了白洞，与之相伴的是少女甜美的歌声。和我们最初听到的不同，那是一阵欢快的歌声，仿佛在迎接着某人的到来。\n但我们明白，某人永远不会再来了。"
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_1_TOOLTIP: "§H永不再见§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]的科研船驶出了白洞，与之相伴的是少女甜美的歌声。和我们最初听到的不同，那是一阵欢快的歌声，仿佛在迎接着某人的到来。\n但我们明白，某人永远不会再来了。"
 TIMELINE_DIMENSION_TRAVELER_END_1: "永不再见\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_2_ORIGIN_TOOLTIP: "§H毁灭§!\n§Y起源事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]的科研船没能抵御住引力源强大的引力，坠入了白洞中心，并再也没有发来任何消息。我们确信，科研船已经被引力源彻底毁灭，但那位白洞中的少女何去何从则无从知晓。\n啊，白洞。"
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_2_TOOLTIP: "§H毁灭§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]的科研船没能抵御住引力源强大的引力，坠入了白洞中心，并再也没有发来任何消息。我们确信，科研船已经被引力源彻底毁灭，但那位白洞中的少女何去何从则无从知晓。\n我们再也无法知道真相了。"
 TIMELINE_DIMENSION_TRAVELER_END_2: "毁灭\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_3_ORIGIN_TOOLTIP: "§H终结§!\n§Y起源事件§!\n\n§L[GetDate]§!，没有了强大的引力阻碍，[EVENT_TARGET_0.GetName]的科研船顺利地离开了白洞，但我们却没能带上该带的人。\n白洞的歌声停止了，但我们的歌声还会延续。"
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_3_TOOLTIP: "§H终结§!\n§Y帝国事件§!\n\n§L[GetDate]§!，没有了强大的引力阻碍，[EVENT_TARGET_0.GetName]的科研船顺利地离开了白洞，但我们却没能带上该带的人。\n那位白洞中的少女发生了什么我们无从得知，但我们确信，一起银河系的危机已经得到了终结。"
 TIMELINE_DIMENSION_TRAVELER_END_3: "终结\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_4_ORIGIN_TOOLTIP: "§H原点§!\n§Y起源事件§!\n\n§L[GetDate]§!，白洞中的少女远离了[EVENT_TARGET_0.GetName]的科研船，飞速逼近白洞中心，并引发了一场爆炸。白洞在大爆炸后变成了可怖的黑洞，然而少女的举措似乎并未失败，因为黑洞暂无继续扩大的趋势。\n一切又回到了原点。"
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_4_TOOLTIP: "§H原点§!\n§Y帝国事件§!\n\n§L[GetDate]§!，白洞中的少女远离了[EVENT_TARGET_0.GetName]的科研船，飞速逼近白洞中心，并引发了一场爆炸。白洞在大爆炸后变成了可怖的黑洞，然而少女的举措似乎并未失败，因为黑洞暂无继续扩大的趋势。\n一切又回到了原点。"
 TIMELINE_DIMENSION_TRAVELER_END_4: "原点\n§L[GetDate]§!"
 
 TIMELINE_EVENT_HIRE_DIMENSION_TRAVELER_TOOLTIP: "§H终会再见§!\n§Y里程碑§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]重返[EVENT_TARGET_1.GetName]星系，并拯救了似曾相识的少女。经过一番交流，少女决定为我们效力。\n虽已并非故人，但我们终会再见。"
 TIMELINE_HIRE_DIMENSION_TRAVELER: "终会再见\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DISMISS_DIMENSION_TRAVELER_ORIGIN_TOOLTIP: "§H终会再见§!\n§Y起源事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]重返[EVENT_TARGET_1.GetName]星系，并拯救了似曾相识的少女。经过一番交流，少女决定履行自己的使命。\n笼中的小鸟又重归自由。"
 TIMELINE_EVENT_DISMISS_DIMENSION_TRAVELER_TOOLTIP: "§H终会再见§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]重返[EVENT_TARGET_1.GetName]星系，并拯救了似曾相识的少女。经过一番交流，少女决定履行自己的使命。\n再见，我们一定会再见。"
