 TIMELINE_EVENT_DIMENSION_TRAVELER_END_6_TOOLTIP: "§H时间原点§!\n§Y里程碑§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]与白洞中的少女在时间原点重逢。在无限的等待后，她抵达了旅途的终点。\n我们下个循环，再见。"
 TIMELINE_DIMENSION_TRAVELER_END_6: "时间原点\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_7_ORIGIN_TOOLTIP: "§H陷入轮回§!\n§Y起源事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]最终没能超越因果的束缚，界旅者再一次不可避免地坠入黑洞。一场剧烈的大爆炸吞噬了整个星系，你只能从嘈杂的电磁辐射中寻觅到一丝少女最后的呢喃。\n我们没能守护好我们的天籁……"
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_7_TOOLTIP: "§H陷入轮回§!\n§Y帝国事件§!\n\n§L[GetDate]§!，[EVENT_TARGET_0.GetName]最终没能超越因果的束缚，界旅者再一次不可避免地坠入黑洞。一场剧烈的大爆炸吞噬了整个星系，你只能从嘈杂的电磁辐射中寻觅到一丝少女最后的呢喃。\n我们永远地失去她了……"
 TIMELINE_DIMENSION_TRAVELER_END_7: "陷入轮回\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_8_ORIGIN_TOOLTIP: "§H超越因果§!\n§Y里程碑§!\n\n§L[GetDate]§!，历经成千上万的兴盛与衰亡，历经数不胜数的存档与读档，我们始终贯彻了对彼此的爱，并在无穷无尽的平行世界中找到了只属于我们的时间线。[EVENT_TARGET_0.GetName]向时之螶交出了答案，故事迎来了圆满的结局。\n我们会用自己的歌喉咏唱。"
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_8_TOOLTIP: "§H超越因果§!\n§Y里程碑§!\n\n§L[GetDate]§!，历经成千上万的兴盛与衰亡，历经数不胜数的存档与读档，我们始终贯彻了对彼此的爱，并在无穷无尽的平行世界中找到了只属于我们的时间线。[EVENT_TARGET_0.GetName]向时之螶交出了答案，故事迎来了圆满的结局。\n我们会用自己的羽翼翱翔。"
