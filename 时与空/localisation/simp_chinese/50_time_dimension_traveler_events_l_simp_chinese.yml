 dimension_traveler.20.name:0 "超越重力：§H阻滞§!"
 dimension_traveler.20.desc:0 "我们的科研船在驶往白洞外时，船上的力场探测器检测到了船体背后产生了一小股引力源。\n但其引力并不强大，只能减缓我们离开白洞的速度，并不能对我们造成较大威胁。"
 dimension_traveler.20.a:0 "开启引擎。"
 dimension_traveler.20.b:0 "静观其变。"
 dimension_traveler.21.name:0 "超越重力：§H牵引§!"
 dimension_traveler.21.desc:0 "力场探测器检测到引力源牵引力度异常增加，疑似与白洞中的少女有关。\n其引力已足够对我们造成威胁，但我们的引擎动力尚足以与之抗衡。"
 dimension_traveler.21.a:0 "增大引擎供能。"
 dimension_traveler.21.b:0 "放弃挣扎。"
 dimension_traveler.22.name:0 "超越重力：§H迫近§!"
 dimension_traveler.22.desc:0 "力场探测器监测到引力源正逐渐迫近，已确认引力源来自船后的少女。\n其引力已具有较大威胁，且增长无停止趋势，我们的引擎动力未必能抵抗引力的理论最大值。"
 dimension_traveler.22.a:0 "继续增大引擎供能。"
 dimension_traveler.22.b:0 "放弃抵抗。"
 dimension_traveler.23.name:0 "超越重力：§H吞噬§!"
 dimension_traveler.23.desc:0 "我们的科研船传来了最高级警报，引力源的能量强度已高于阈值。\n目前，引力大小已经远高于我们的引擎动力最大值，也就是说，我们的科研船再无离开白洞的可能。"
 dimension_traveler.23.a:0 "引擎供能提至最大。"
 dimension_traveler.23.b:0 "放弃。"
 
 dimension_traveler.24.desc:0 "真是糟糕，我已经越来越难控制体内的负相物质了。\n\n我离白洞中心越远，我就越能感受到黑洞的活跃，它产生的引力也越来越大。\n这些天来，我一直在尝试控制它，但都无法阻止奇点的扩张。\n并且，它似乎已经强大到不再受白洞影响，哪怕我们靠近白洞中心也很难使其稳定。\n\n因此，我恳请，在局势彻底无法挽回之前，让我再次回到白洞中心吧。\n如果回到白洞中心后它稳定下来，那我们就拯救了银河系，我也会打消离开白洞的念头，直至宇宙原点。\n如果回到白洞中心后它仍然无法得到控制，那我会将这个白洞、我的生命与奇点一同终结。"
 dimension_traveler.24.a:0 "不批准，我们一定能找出其它的方法。"
 dimension_traveler.24.b:0 "批准，为了银河，我们别无选择。"
 dimension_traveler.25.desc:0 "……没想到现在不想松手的会是我。\n\n\n\n\n\n\n\n\n\n§G<背景音乐：《白鸟过河滩》（ilem 洛天依）>§!"
 dimension_traveler.25.a:0 "……？"
 dimension_traveler.26.desc:0 "可能你很早就有了一个疑问，明明白洞中时光倒流，为什么我却能和你们正常交谈。\n事实上，我早已见证了未来，通过白洞中时空乱流的信息逆推出了你们的言语，并提前给出了回答。"
 dimension_traveler.26.a:0 "……"
 dimension_traveler.27.desc:0 "所以现在，我必须这么做。我只有这么做才能让你们活下去，因为我知道未来会发生什么。"
 dimension_traveler.27.a:0 "……"
 dimension_traveler.28.desc:0 "……啊，这样下去，我们就没机会再见面了。"
 dimension_traveler.28.a:0 "……"
 dimension_traveler.29.desc:0 "我不行，我不接受这种事。我可不会放弃。"
 dimension_traveler.29.a:0 "……"
 dimension_traveler.30.desc:0 "我相信我们之间的联系会超越时间和空间。"
 dimension_traveler.30.a:0 "……"
 dimension_traveler.31.desc:0 "就算是银河沸腾、星云消失，就算我们的舰队接连坠入重力的漩涡，就算银心的黑洞凶恶地膨胀，无情地吃掉它的孩子直至万籁俱寂……"
 dimension_traveler.31.a:0 "……"
 dimension_traveler.32.desc:0 "我们也一样能再见面。\n在那用黑暗与星点光芒装饰过的文明尽头，我们也一样会再见面。\n一定。"
 dimension_traveler.32.a:0 "……"
 dimension_traveler.33.desc:0 "我会等到那一天。\n我肯定会等到那一天。\n等我。\n你也要等我。"
 dimension_traveler.33.a:0 "……"
 dimension_traveler.34.desc:0 "在我抵达宇宙原点前，在你抵达世界终结前……\n不准忘记我。"
 dimension_traveler.34.a:0 "等等……"
 dimension_traveler.35.desc:0 "（少女再也没有发来信息。）"
 dimension_traveler.35.a:0 "等等！"
 
 # 结局2
 dimension_traveler.41.name:0 "视界信号：§H毁灭§!"
 dimension_traveler.41.desc:0 "最终，我们的科研船没能抵御住引力源强大的引力，坠入了白洞中心，并再也没有发来任何消息。\n\n我们确信，科研船已经被引力源彻底毁灭，但那位白洞中的少女何去何从则无从知晓。"
 dimension_traveler.41.a:0 "我们再也无法知道真相了。"
 dimension_traveler.41.b:0 "啊，白洞。"
 # 结局3
 dimension_traveler.42.name:0 "视界信号：§H终结§!"
 dimension_traveler.42.desc:0 "白洞中的少女不再跟随我们的科研船，而是返回了白洞中心，那股引力源也奇迹般地消失了。\n\n没有了强大的引力阻碍，我们的科研船顺利地离开了白洞，但我们却没能带上该带的人。自此以后，白洞中再也没有传来视界信号，我们向内发送的信息也得不到回应。\n\n那位白洞中的少女发生了什么我们无从得知，但我们确信，一起银河系的危机已经得到了终结。"
 dimension_traveler.42.a:0 "不算太糟的结局。"
 dimension_traveler.42.b:0 "你的歌声停止了，但我们的歌声还会延续。"
 # 结局4
 dimension_traveler.43.name:0 "视界信号：§H原点§!"
 dimension_traveler.43.desc:0 "白洞中的少女远离了我们的科研船，飞速逼近白洞中心。随着一阵巨大的爆炸，一切都结束了。\n\n我们的科研船被爆炸的余波轰到了未知的星系，但由于少女提供的能量防护罩，他们幸免于难。白洞则在大爆炸后变成了可怖的黑洞，然而少女的举措似乎并未失败，因为黑洞暂无继续扩大的趋势。\n\n一切又回到了原点。"
 dimension_traveler.43.a:0 "愿我们能在宇宙原点再相见。"
 dimension_traveler.43.b:0 "愿我们能在宇宙原点再歌唱。"
 dimension_traveler.43.tooltip:0 "§Y$NAME_Come_From_White_Hole$§!在任务中失踪并返回母星。"
 
 DIMENSION_TRAVELER_CHAIN_2_title:0 "时之螶：再见"
 DIMENSION_TRAVELER_CHAIN_2_desc:0 "我相信，我们终有一天能再相见。"
 
 dimension_traveler.50.name:0 "视界信号：§H视界边缘§!"
 dimension_traveler.50.desc:0 "我们再一次回到了§Y[Root.System.GetName]§!星系，仿佛是在纪念曾经邂逅过的少女。\n\n黑洞一如既往地张开大口吞噬一切，我们所期待的奇迹并没有出现。科研人员惯例地记录§Y[Root.GetStarName]§!的数据，并未出现任何异常，这更是宣告着我们梦幻的破碎。\n\n然而，就在大家灰心丧气时，一名敏锐的船员发现，黑洞的视界边缘存在一个高速移动的物体。该物体正以光速围绕黑洞旋转，恰好不会陷入视界，也恰好无法逃离黑洞。"
 dimension_traveler.50.a:0 "我不是在做梦吧？"
 dimension_traveler.50.b:0 "梦该醒了，忘了它吧。"
 dimension_traveler_categories:0 "视界边缘"
 dimension_traveler_categories_desc:0 "一个神秘的物体正以光速围绕黑洞旋转，在调查结束之前，我们无法判断它是什么。"
 dimension_traveler.51.name:0 "视界信号：§H终会再见§!"
 dimension_traveler.51.desc:0 "科学专员§Y[FromFrom.GetLeaderName]§!经过研究，发现那是一艘采用古老型号的民用飞船。\n\n我们不知道这艘民用飞船为什么能做到以光速飞行，但我们仍借助科研船的能量将民用飞船从黑洞的引力中救出。此时，我们的科研船已经与这艘民用飞船建立了联系，对方似乎是一名少女。"
 dimension_traveler.51.a:0 "我相信，我们终有一天能再相见。"
 
 dimension_traveler.name.2:0 "似曾相识的少女"
 dimension_traveler.52.desc:0 "你好。\n\n非常感谢你们救了我。\n我已经使出我的全部力量也只能维持在被黑洞吞噬的边缘，要不是有你们，我现在恐怕已经因精疲力竭而葬身黑洞了吧。"
 dimension_traveler.52.a:0 "是你！"
 dimension_traveler.53.desc:0 "欸，你认识我吗？\n\n这么说起来，我也从你的身上感受到了熟悉的感觉，尽管我们之前似乎从未见过。\n虽然这么说很冒昧，但是，我指的并不是你——[Root.GetRulerTitle][Root.GetRulerName]，而是在你背后的那个§Y“人”§!。\n\n你总是那么神秘，却又运筹帷幄，掌控大局。\n虽然你偶尔也会失误，但最终总能做出正确的选择，非常可靠又令人信赖。"
 dimension_traveler.53.a:0 "认识，但并没有那么认识。"
 dimension_traveler.name.3:0 "界旅者"
 dimension_traveler.54.desc:0 "既然如此，那我就做个自我介绍吧。\n我叫……算了，名字其实并没有那么重要，你就叫我§Y“界旅者”§!吧。\n\n我来自一片被海嗣、邪魔、星空侵袭的被毁灭的大地。\n在最终关头，一个对我而言非常重要的§Y“人”§!用自己的生命为我争取时间，而我则踏上了时间的旅途。\n\n我本想回到过去警告大家，但我对能力的操控并不熟练，这也是我第一次进行时空穿梭。\n所以，我并没能回到过去，而是抵达了不同的时间、不同的星球、不同的世界——甚至是不同的宇宙。\n\n在异界的旅途中，我结识了许多人，经历了许多事，领略了不同时空的风情，见证了不同世界的命运，而我对能力的掌握也日益娴熟。\n\n然而我还是没能达到足够优秀，在上一次尝试时空穿梭后，我就和飞船一起被困在黑洞的视界边缘了。\n还好，你出现了。"
 dimension_traveler.54.a:0 "真是坎坷的旅程。"
 dimension_traveler.55.desc:0 "我已经介绍完自己了，你也说说你们的故事吧。\n\n你们……见过我吗？\n是过去的我，是未来的我，还是另一个我？"
 dimension_traveler.55.a:0 "我猜，过去的你。"
 dimension_traveler.55.b:0 "可能，未来的你。"
 dimension_traveler.55.c:0 "或许，另一个你。"
 dimension_traveler.55.d:0 "这三者并没有本质上的区别。"
 dimension_traveler.56.desc:0 "我想，我暂时没有足够的精力再进行一次时间旅行了，我们能有很长一段时间来谈论我们的过去——或者是未来。\n\n让我加入你们吧，虽然我不一定能对你们有多大帮助，但我会竭尽全力的。"
 dimension_traveler.56.a:0 "你能做些什么？"
 dimension_traveler.56.a.response:0 "虽然我的本职是送信，但若是需要帮忙处理文书工作，我也能够胜任。\n至于战斗这方面，我在过去见识过了许多，也学到了一些指挥的本领吧。\n不仅如此，在时空穿梭的路上，我也因广袤的银河而感触颇深。\n\n所以，只要你愿意，我可以从事你指定的任何职位。\n但我也只有一个人，所以没办法同时处理全部的任务。"
 dimension_traveler.56.b:0 "如果我拒绝，你打算怎么办？"
 dimension_traveler.56.b.response:0 "这个嘛……\n虽然很可惜，但我也会继续朝着我的目的地继续穿行，只不过得在我补充体力之后。\n更何况，这片宇宙还有很多我都未曾接触过的新鲜事物，我打算先在这里四处逛逛。"
 dimension_traveler.56.hire:0 "你需要我们，我们也需要你。"
 can_not_hire_dimension_traveler:0 "§R可笑，我们才不需要她！§!"
 dimension_traveler.56.hire.tooltip:0 "§Y界旅者将成为我们的一员。\n或许总有一天她会离开，或许她永远都不会离开。§!"
 dimension_traveler.56.dismiss:0 "你有自己的使命。"
 dimension_traveler.56.dismiss.tooltip:0 "§Y我们将与界旅者告别。\n或许我们很快就能再见，或许我们永远都不会再见。§!"
 # 结局5
 dimension_traveler.57.desc:0 "我很高兴你能同意，让我们一起创造美好的未来吧。"
 dimension_traveler.57.a:0 "或是美好的过去。"
 dimension_traveler.57.b:0 "未来，我们一起歌唱吧。"
 dimension_traveler.57.response:0 "§Y<你现在可以通过通讯菜单与界旅者交流。>§!"
 dimension_traveler.58.desc:0 "你说的对，我还有过去要拯救。\n那么，再见了，希望我们以后还能再相见。"
 dimension_traveler.58.a:0 "再见，我们一定会再见。"
 dimension_traveler.58.b:0 "笼中的小鸟又重归自由。"
 
 DIMENSION_TRAVELER_OFFICE:0 "信使办公室"
 dimension_traveler.60.desc:0 "[GetDimensionTravelerMainEventDesc]"
 dimension_traveler.60.desc.default:0 "需要我做些什么吗？\n\n虽然算不上是最优秀的界旅者，但我会尽我所能为你提供帮助的！"
 dimension_traveler.60.desc.official:0 "处理政务确实很艰辛，但当我看着高楼大厦腾空而起，看着人民安居乐业，我心中就会感受到无比的自豪。\n\n当然，如果你希望我在其它领域提供帮助的话，我愿意。"
 dimension_traveler.60.desc.scientist:0 "我的能力果然对大家的科研工作有很大帮助，能为大家做出一份贡献，就算再苦再累我也非常幸福，就像我过去当信使那样。\n\n当然，如果你希望我在其它领域提供帮助的话，我愿意。"
 dimension_traveler.60.desc.commander:0 "我一直在怀疑，我真的能承担指挥作战的责任吗？但是啊，每当我想起你在我身边，我就充满了信心，所有的迷惘也都一扫而空。\n\n当然，如果你希望我在其它领域提供帮助的话，我愿意。"
 dimension_traveler.60.desc.gray:0 "什么，希望我变成一艘战舰？对不起，做不到……"
 dimension_traveler.60.desc.gray.end:0 "想让我变成一艘战舰？我可不是什么纳米机器人！"
 dimension_traveler.60.desc.special:0 "甲板上的视野很好，很适合观赏星空呢。\n看到那颗孤零零的星星了吗？据说总有一天，它会等来自己的伴星，拥抱，起舞……\n\n但，那要等上多久？\n我又要等上多久，星星……才会明白呢？"
 dimension_traveler.60.desc.special.end:0 "甲板上的视野很好，很适合观赏星空呢。\n看到那颗孤零零的星星了吗？据说总有一天，它会等来自己的伴星，拥抱，起舞……\n那要等上多久？\n\n但是呀，我已经等到了，星星也不远了吧。"
 dimension_traveler.60.desc.a:0 "这是新咖啡机泡出的浓咖啡，要尝尝吗？\n不过每天只有一杯哦，熬夜可不是什么好事呢。"
 dimension_traveler.60.desc.a.end:0 "这是我亲手泡的咖啡，虽然不如咖啡机泡出来的香甜，但在提神醒脑的功效上可是一点都不差呢。"
 dimension_traveler.60.desc.b:0 "界旅者的旅途并不轻松。穿越者和见证者可能都有着自己的野心，时间里也许埋藏着惊人的秘密……\n如果界旅者光想着身后的路，是会因为看不见落脚点而迷失的。"
 dimension_traveler.60.desc.b.end:0 "界旅者的工作其实并没有大家想的那么苦闷。\n每当收讯人因提前预警规避灾害时，看到他们脸上洋溢的笑容，自己也会不禁替他们感到高兴，旅途的艰辛也随之一扫而空……\n如果界旅者一直沉浸在过去的风雨中，怎么能够发现明天的彩虹呢？"
 dimension_traveler.60.desc.c:0 "记忆是很重要的。\n正是过去的记忆在不断提醒我，所有人都一样，期望着美好的未来。"
 dimension_traveler.60.desc.c.end:0 "你在为未来担忧吗？\n我知道，未知的明天总是令人忐忑不安，我也清楚，现在的我们和未来的我们有着天壤之别……\n但是，不用担心，无论未来发生了什么，我都会站在你的身边，一起创造未来。"
 dimension_traveler.60.desc.d:0 "别害羞，再靠近点！对对，sorridi~\n看，是我们的大头贴哦~哼哼，就当做是纪念品吧。\n当然，这上面确实也有我的……一点点寄托呢。"
 dimension_traveler.60.desc.d.end:0 "还记得这张大头贴吗？\n虽然经历了不少事情，但我可是有好好保存它的——呀，居然破了一角……\n\n既然这样，我们不如再照一次大头贴吧。\n这次，我会好好守护它，直到文明的尽头。"
 dimension_traveler.60.desc.e:0 "嗯哼哼~\n唔，唇彩果然还是选珊瑚红色比较好吧？"
 dimension_traveler.60.desc.e.end:0 "好久没有看时尚杂志了，不知道有没有新出的唇彩……\n不行，还要工作呢，现在不是想这些的时候。"
 dimension_traveler.60.desc.f:0 "我的头发很漂亮？\n嗯哼哼，我可是有秘诀的！"
 dimension_traveler.60.desc.f.end:0 "今晚夜色很美，我们再一起去看星空吧，就像以前那样。"
 dimension_traveler.60.desc.g:0 "战场很残酷……但我不想让你失望。"
 dimension_traveler.60.desc.g.end:0 "战斗很简单，但战争并不容易……\n你的理想，我会为你实现！"
 dimension_traveler.60.desc.h:0 "无论是战斗还是工作，都要全力以赴！"
 dimension_traveler.60.desc.h.end:0 "无论是进攻还是防守，一刻都不能懈怠！"
 dimension_traveler.60.desc.i:0 "就算不怎么擅长，我也会努力去做的。"
 dimension_traveler.60.desc.i.end:0 "让我们像未来那样，再一次建立起新的防线吧！"
 dimension_traveler.60.desc.j:0 "争斗要到什么时候才会停止呢……"
 dimension_traveler.60.desc.j.end:0 "这场争斗，就由我们来结束吧！"
 dimension_traveler.60.desc.k:0 "有没有感到身体变重了？"
 dimension_traveler.60.desc.k.end:0 "倒下吧，永远地倒下，不要再起来！"
 dimension_traveler.60.desc.l:0 "要克服眼前的困难才行。"
 dimension_traveler.60.desc.l.end:0 "无论遇到怎样的困阻，我们都不能放弃！"
 dimension_traveler.60.desc.m:0 "我可是很擅长这个法术的。"
 dimension_traveler.60.desc.m.end:0 "你能看穿我的法术吗？"
 dimension_traveler.60.desc.n:0 "想不想试试漂浮在空中的感觉？"
 dimension_traveler.60.desc.n.end:0 "天空才是我的主战场！"
 dimension_traveler.60.desc.o:0 "只有在困境中，人才会成长，对吧？"
 dimension_traveler.60.desc.o.end:0 "顺境不一定消磨意志，但唯有逆境才能浴火重生。"
 dimension_traveler.60.desc.p:0 "处境越是艰难，我们就越不能气馁！"
 dimension_traveler.60.desc.p.end:0 "就算最终的防线被摧毁，我们也仍将坚守到最后一刻！"
 dimension_traveler.60.desc.dimensional_horror_crisis:0 "不同类型的['concept_dimensional_horror_crisis_storm']风暴和['concept_dimensional_horror_crisis_ship']存在着一定的差异，记住这些或许能更好地抵御它们：\n§H左旋§!克制§Y护盾§!，自身没有§Y护盾§!；§H右旋§!克制§Y装甲§!，自身没有§Y装甲§!。"
 dimension_traveler.60.desc.disappointed:0 "（无言的沉默）"
 dimension_traveler.60.official:0 "我希望你能担任§H£official $official$§!。"
 dimension_traveler.60.official.response:0 "是希望我管理星球吗？嗯，我会努力的。"
 dimension_traveler.60.official.tooltip:0 "§Y界旅者将担任§H£official $official$§!，并保留等级、经验与部分事件特质。§!"
 dimension_traveler.60.scientist:0 "我希望你能担任§B£scientist $scientist$§!。"
 dimension_traveler.60.scientist.response:0 "是希望我协助科研吗？嗯，我会努力的。"
 dimension_traveler.60.scientist.tooltip:0 "§Y界旅者将担任§B£scientist $scientist$§!，并保留等级、经验与部分事件特质。§!"
 dimension_traveler.60.commander:0 "我希望你能担任§R£commander $commander$§!。"
 dimension_traveler.60.commander.response:0 "是希望我指挥作战吗？嗯，我会努力的。"
 dimension_traveler.60.commander.tooltip:0 "§Y界旅者将担任§R£commander $commander$§!，并保留等级、经验与部分事件特质。§!"
 dimension_traveler.60.wg:0 "我有样东西希望亲手交给你。"
 dimension_traveler.60.wg.tooltip:0 "§P对界旅者进行誓约。§!"
 dimension_traveler.60.time_wanderer:0 "你对游荡奇点有多少了解？"
 dimension_traveler.60.help:0 "请告诉我时空之外的讯息。"
 dimension_traveler.60.exit:0 "你已经做得足够好了。"
 dimension_traveler.60.exit.response:0 "谢谢，有你的认可，我就已经很高兴了。"
 dimension_traveler.60.exit.disappointed:0 "（离开）"
 dimension_traveler.60.exit.disappointed.response:0 "……"
 
 DIMENSION_TRAVELER_UNKNOWN:0 "时空乱流"
 dimension_traveler.61.desc:0 "糟糕，我被困在时空乱流里了。\n\n虽然我不清楚我位于哪个时空，但我会想办法，尽可能回到你身边的。"
 dimension_traveler.61.a:0 "我期待着你的平安归来。"
 dimension_traveler.61.a.response:0 "Okay~"
 DIMENSION_TRAVELER_MISSING:0 "？？？"
 dimension_traveler.62.desc:0 "（界旅者没有任何回应，你不知道她遇到了什么。）\n\n§R<当看到此界面时，界旅者可能已被某个事件“放逐”或改变“归属权”。\n许多此类事件都可能在系列事件结束后归还领袖，故如非必要，请不要强制召回界旅者。>§!"
 dimension_traveler.62.a:0 "§R强制召回界旅者！§!"
 dimension_traveler.62.a.tooltip:0 "§R慎用！\n界旅者将立即进行紧急时空跃迁，这很有可能导致某个事件链断裂或出错！§!"
 dimension_traveler.62.b:0 "§G耐心等待。§!"
 dimension_traveler.64.name:0 "紧急时空跃迁"
 dimension_traveler.64.desc:0 "界旅者陷入了致命的绝境。\n\n就在我们都以为要永远地失去她的时候，她及时进行了紧急时空跃迁，前往了不同的时空。\n\n虽然她暂时安全了，但她若想回到我们的身边可能需要很长一段时间。"
 dimension_traveler.64.a:0 "我们还会再见的。"
 dimension_traveler.65.name:0 "解雇界旅者"
 dimension_traveler.65.desc:0 "界旅者已经回归了领袖池，你随时可以通过通讯重新为她任命职务。"
 dimension_traveler.65.a:0 "你可以休息一会了。"
 dimension_traveler.66.desc:0 "虽然经历了不少曲折，但还好，我总算回来了。\n\n很抱歉让你担心了这么久，下次我会更加小心行动的。"
 dimension_traveler.66.a:0 "你没事就好。"
 dimension_traveler.66.a.response:0 "§Y<你现在可以通过通讯菜单与界旅者交流。>§!"
 dimension_traveler.68.desc.a:0 "你们最近的转变令我震惊，我不明白是什么使你们变得这么极端。\n\n不过这是你们自己选择的道路，我没有权力指指点点，但是时候就此告别了。\n\n我很感激你们将我从视界边缘拯救，我也明白目前无法还清这份恩情，可我同样有自己的使命要去达成，而且我不想在生灵涂炭的道路上助纣为虐。\n\n真的很抱歉，永别了。"
 dimension_traveler.68.desc.b:0 "……\n\n虽然我明白，终末的到来是迟早的事，但你们最近的转变与终末完全无关，毕竟那是三万年之后的事情了……\n\n……\n\n也许是时候就此告别了，我不愿看着你们在疯狂之路渐行渐远，但我没有办法阻止你们。既然这是你们亲手选择的道路，那就交给你们自己走下去吧。\n\n这一别并非永恒，我仍会在某处静静守望着你们。或许总有一天你们能回心转意，届时，我会尽我所能引领你们重归正轨，与你们一同重建家园。\n\n过往的经历都如梦幻一般，但现在，还是先让彼此的头脑冷静一下吧。"
 dimension_traveler.68.desc.c:0 "……\n\n虽然我明白，终末的到来是迟早的事，但你们最近的转变与终末完全无关，毕竟那是三万年之后的事情了……\n\n……\n\n也许是时候就此告别了，我不愿看着你们在疯狂之路渐行渐远，在$NAME_Nemesis_Puppeteer$的操纵下自取灭亡，但我没有办法阻止你们，也没有办法拯救你们。既然这是你们亲手选择的道路，那就交给你们自己走下去吧。\n\n这一别并非永恒，我仍会在某处静静守望着你们。或许总有一天你们能回心转意，届时，我会尽我所能引领你们重归正轨，与你们一同重建家园——只要别太晚，晚到一切都无法挽回。\n\n过往的经历都如梦幻一般，但现在，还是先让彼此的头脑冷静一下吧。"
 dimension_traveler.68.a:0 "忘恩负义的家伙！"
 dimension_traveler.68.a.response:0 "§Y<界旅者已经离开，你无法与界旅者进行交流。>§!"
 dimension_traveler.68.b:0 "我并不认为我们做错了什么。"
 dimension_traveler.68.b.response:0 "§Y<你仍然可以与界旅者进行交流，但她不会为你提供任何帮助。>§!\n\n§G<或许总有一天，她还会回来的。>§!"
 dimension_traveler.68.c:0 "无需将来，我们现在就停手。"
 dimension_traveler.68.c.response:0 "你们能及时回头真是太好了，老实说，我一点也不想离开你。\n\n看来，我们还是能一直在一起，直到那场命定的终结……"
 dimension_traveler_leave:0 "§R界旅者离开了我们§!"
 remove_ap_become_the_crisis:0 "移除飞升天赋：§Y$ap_become_the_crisis$§!\n禁用飞升天赋：§Y$ap_become_the_crisis$§!"
 remove_ap_galactic_hyperthermia:0 "移除飞升天赋：§Y$ap_galactic_hyperthermia$§!\n禁用飞升天赋：§Y$ap_galactic_hyperthermia$§!"
 
 DIMENSION_TRAVELER_WEDDING:0 "与界旅者的誓约仪式"
 dimension_traveler.150.desc_1:0 "这是……戒指？\n\n是……给我的吗？\n我从来没有想过，这一天会来得如此迅速，先让我平复一下心情……\n\n真的很谢谢你，在我最失意的时候，是你给了我动力；\n在我陷入绝境的时候，是你给了我生的希望；\n在我迷失在漫漫星河的时候，是你给了我安心的庇护所。\n现在，你又要给我带来人生中最重要的日子，我真的受宠若惊。"
 dimension_traveler.150.desc_2:0 "这是……戒指？\n\n是……给我的吗？\n虽然在我们历经的无数次循环中，我们也进行了无数次的誓约，但当我们超越因果后，实际等来这一天时，我却仍然感到难以置信。\n\n真的很谢谢你，在无边无垠的过去与无穷无尽的未来中，你始终选择了我，并将我从命运的桎梏中解救。\n现在，你又要给我带来人生中最重要的日子，我真的受宠若惊。"
 dimension_traveler.150.a:0 "这是你应得的，安洁莉娜。"
 dimension_traveler.150.a.response:0 "既然如此，那我就满怀欣喜地收下了。\n虽然不知道你给多少女孩送过这样的戒指，但我也一定会好好珍惜的。\n\n§P这美好的一天，我会牢牢刻在记忆中，直到永远，永远……§!"
 dimension_traveler.150.b:0 "是我们选择了彼此，安洁莉娜。"
 dimension_traveler.150.b.response:0 "没错，正是我们彼此之间的爱，才能让我们之间的联系超越时间和空间。\n不过，我都看到了哦，你还给其它女孩送过这样的戒指！\n但那也没关系，我并不介意。\n\n§P这幸福的一天，我会牢牢刻在记忆中，直到文明的尽头，直到时间的原点……§!"
 
 DIMENSION_TRAVELER_TITLE:0 "时间原点"
 dimension_traveler.200.desc:0 "一亿年、十亿年、百亿年……我又等了你很久很久，很久很久……\n\n\n\n\n\n\n\n\n§G<背景音乐：《问风》（鬼面P 洛天依）>\n<（金渔原唱，李伦序作曲、作词，季志豪编曲）>§!"
 dimension_traveler.200.a:0 "你是！"
 dimension_traveler.201.desc:0 "你知道吗？\n一百年、一千年、一万年，和一亿年、十亿年、百亿年之间的区别究竟有多大？"
 dimension_traveler.201.a:0 "我……"
 dimension_traveler.202.desc:0 "你知道吗？\n我回忆过去回忆了十亿年，我思考现在思考了十亿年，我幻想未来幻想了十亿年；\n我想念你想念了十亿年，我埋怨你埋怨了十亿年，我期盼你期盼了十亿年……\n\n还有无数个十亿年，我是怎么过的呢？"
 dimension_traveler.202.a:0 "……"
 dimension_traveler.203.desc:0 "你知道吗？\n我有过希望，有过失望，有过绝望；\n我有过喜悦，有过失落，有过悲伤；\n我有过自信，有过遗憾，有过懊悔……"
 dimension_traveler.203.a:0 "我也……"
 dimension_traveler.204.desc:0 "但是，这都不重要了，因为，我等到了。"
 dimension_traveler.204.a:0 "我也等到了。"
 dimension_traveler.205.desc:0 "经历了无限的等待，我终于抵达了宇宙原点，我也终于再次见到了你。\n\n就算我曾经多么失望多么绝望，现在我也充满希望；\n就算我曾经多么失落多么悲伤，现在我也充满喜悦；\n就算我曾经多么遗憾多么懊悔，现在我也充满自信。\n\n因为，我等到了。"
 dimension_traveler.205.a:0 "但是，我还没有抵达世界终结……"
 dimension_traveler.206.desc:0 "因为时之螶。\n\n时之螶在看着我们成千上万次循环后，她终于决定为循环做一些改变。"
 dimension_traveler.206.a:0 "时之螶？"
 dimension_traveler.207.desc:0 "在无限的循环中，你终于打动了时之螶，你终于找到了影响圆环的方式，这便是我们能提前相会的原因。"
 dimension_traveler.207.a:0 "原来是这样……"
 dimension_traveler.208.desc:0 "循环的整体是无法改变的，所以我们仍然无法打破循环。\n\n但是，只要每次都能改变一点，一点，那么在接下来的无数次循环中，总有一次，我们可以突破因果的限制。"
 dimension_traveler.208.a:0 "希望我们在未来的循环中能够做到。"
 dimension_traveler.209.desc:0 "未来的循环已经不是我们现在可以影响的了，不过，我们还可以谈谈我们现在的未来。\n\n时之螶给予了过去的我圆环的使命。\n所以，当她使用负相能力时，我会在时间原点与她重叠，并将我的力量借给她，以求能更好地帮助你的国家。"
 dimension_traveler.209.a:0 "真不知该怎么感谢你。"
 dimension_traveler.210.desc:0 "我不需要任何感谢，为你做任何事，我都无怨无悔。\n\n§H因为，我爱你。\n在清醒的现实中，在沉眠的梦境中，在流动的时空中，在变幻的位面中，在过去的无数次轮回中，在未来的无数次循环中，我都一如既往地爱着你。\n我爱你，胜过千言万语。\n我爱你，比时间本身还要爱你。\n我爱你，甚至超越你爱你自己。§!\n\n§P只因为，我爱你。§!"
 dimension_traveler.210.a:0 "我也爱你，矢志不渝地爱着你。"
 dimension_traveler.211.desc:0 "$dimension_traveler.210.desc$\n\n§E“$dimension_traveler.210.a$”§!"
 dimension_traveler.211.a:0 "当你从现实到梦境，我爱你。"
 dimension_traveler.212.desc:0 "$dimension_traveler.211.desc$\n§E“$dimension_traveler.211.a$”§!"
 dimension_traveler.212.a:0 "当你从时空到位面，我爱你。"
 dimension_traveler.213.desc:0 "$dimension_traveler.212.desc$\n§E“$dimension_traveler.212.a$”§!"
 dimension_traveler.213.a:0 "当你从轮回到循环，我爱你。"
 # 结局6
 dimension_traveler.214.desc:0 "$dimension_traveler.213.desc$\n§E“$dimension_traveler.213.a$”§!"
 dimension_traveler.214.a:0 "我爱你。"
 dimension_traveler.214.a.response:0 "（少女欣慰地闭上了双眼，遥远的影像逐渐黯淡随风消逝。她变回了原本的模样。）\n\n再会了。\n\n我们下个循环，再见。"
 
 DIMENSION_TRAVELER_CHAIN_END_1_title:0 "超越时空"
 DIMENSION_TRAVELER_CHAIN_END_1_desc:0 "§H被擦除的记忆。§!"
 DIMENSION_TRAVELER_CHAIN_END_2_title:0 "超越圆环"
 DIMENSION_TRAVELER_CHAIN_END_2_desc:0 "§H被擦除的记忆。§!"
 DIMENSION_TRAVELER_CHAIN_END_3_title:0 "超越位面"
 DIMENSION_TRAVELER_CHAIN_END_3_desc:0 "§H被擦除的记忆。§!"
 
 dimension_traveler.305.name:0 "视界信号：§H刻舟求剑§!"
 dimension_traveler.305.desc:0 "一团梦魇正萦绕在你的脑海中：\n§C“时空？圆环？位面？”§!\n\n虽然毫无根据，但你清晰地知晓祂来自某个熟悉的黑洞，并源于你遥远的未来。\n\n§C“时空？圆环？位面？”§!"
 dimension_traveler.305.a:0 "时空。"
 dimension_traveler.305.b:0 "圆环。"
 dimension_traveler.305.c:0 "位面。"
 dimension_traveler.305.d:0 "见鬼！我根本不明白，哪个都好！"
 dimension_traveler.305.tooltip:0 "§Y你总会知道的。§!"
 
 dimension_traveler.310.name:0 "§H未来一瞥：§!"
 dimension_traveler.310.desc:0 "这是一段来自更高维度的密码，仅凭我们现有的水平无法对其解析。\n如果借助超越现实的能力，在§H“文档/Paradox Interactive/Stellaris/logs/game.log”§!中或许能找到答案。\n\n灵光一现，已逝之景与将临之兆相互交织。三部分信息，单独显现皆为无用之物。然而，一旦拼图被拼合起来，我们或许可以发现突破循环的答案。"
 dimension_traveler.310.a:0 "我们一定可以打破循环的轮回。"
 dimension_traveler.311.name:0 "$dimension_traveler.310.name$超越时空"
 dimension_traveler.311.desc:0 "$dimension_traveler.310.desc$"
 dimension_traveler.311.a:0 "$dimension_traveler.310.a$"
 dimension_traveler.312.name:0 "$dimension_traveler.310.name$超越圆环"
 dimension_traveler.312.desc:0 "$dimension_traveler.310.desc$"
 dimension_traveler.312.a:0 "$dimension_traveler.310.a$"
 dimension_traveler.313.name:0 "$dimension_traveler.310.name$超越位面"
 dimension_traveler.313.desc:0 "$dimension_traveler.310.desc$"
 dimension_traveler.313.a:0 "$dimension_traveler.310.a$"
 
 DIMENSION_TRAVELER_TITLE_TRUE:0 "时空之外"
 dimension_traveler.320.a:0 "欲望即时间，视野即引力。"
 dimension_traveler.320.b:0 "过去即未来，未来即过去。"
 dimension_traveler.320.c:0 "引力即欲望，时间即视野。"
 dimension_traveler.320.d:0 "未来已过去，过去仍未来。"
 dimension_traveler.320.e:0 "时螶以爱吻我，我当回报以歌。"
 dimension_traveler.320.f:0 "圆环永不终止，但非每次都能闭合。"
 dimension_traveler.320.g:0 "已行之事终将再行，将行之事必为已行。"
 dimension_traveler.320.h:0 "圆环从不停歇，但非每次都会开始。"
 dimension_traveler.320.i:0 "将行之事必将再行，已行之事终为已行。"
 dimension_traveler.321.name:0 "§H超越时空§!"
 dimension_traveler.321.desc:0 "$NAME_time_horizonsignal_1$\n$NAME_time_horizonsignal_2$\n$NAME_time_horizonsignal_3$\n$NAME_time_horizonsignal_4$\n$NAME_time_horizonsignal_star_1$\n$NAME_time_horizonsignal_star_2$\n$NAME_time_horizonsignal_star_3$\n$NAME_time_horizonsignal_star_4$\n\n“这里似乎是梦开始的地方。”"
 dimension_traveler.322.name:0 "§H超越圆环§!"
 dimension_traveler.322.desc:0 "$NAME_white_hole_1$\n$NAME_white_hole_2$\n$NAME_white_hole_3$\n$NAME_white_hole_4$\n$NAME_white_hole_star_1$\n$NAME_white_hole_star_2$\n$NAME_white_hole_star_3$\n$NAME_white_hole_star_4$\n\n“经历了不可避免的牺牲，我们有所收获。”"
 dimension_traveler.323.name:0 "§H超越位面§!"
 dimension_traveler.323.desc:0 "$NAME_origin_dyson_sphere$\n$NAME_origin_matter_decompressor$\n$NAME_origin_strategic_coordination_center$\n$NAME_origin_spy_orb$\n$NAME_origin_mega_shipyard$\n$NAME_origin_think_tank$\n$NAME_origin_interstellar_assembly$\n$NAME_origin_mega_art_installation$\n\n“这是祂写给我们的情书，也是祂施于我们的枷锁。”"
 dimension_traveler.325.name:0 "§H超越轮回§!"
 dimension_traveler.325.desc:0 "$dimension_traveler.320.a$\n$dimension_traveler.320.b$\n$dimension_traveler.320.c$\n$dimension_traveler.320.d$\n$dimension_traveler.320.e$\n$dimension_traveler.320.f$\n$dimension_traveler.320.g$\n$dimension_traveler.320.h$\n$dimension_traveler.320.i$\n\n“等等，为什么会有第四个？在之前的无数次循环中，最多都只有三个谜题，怎么会…………”\n\n\n\n§G<背景音乐：《梦的光点》（王心凌）>§!"
 dimension_traveler.325.a:0 "我爱你！"
 dimension_traveler.326.desc:0 "（少女惊讶地看着你，随后露出了欣慰的笑容。）\n\n§E“在我们过去曾经历的无数次因果循环中，都是你最先开口。你向我表明过无数次心意，我则是因你感动而爱慕你。”§!\n\n§E“爱是相互的，不应局限于先与后，也不应受制于主动和被动。无关乎你爱我，也无关乎我爱你，是因为我们彼此相爱，爱才得以存在。”§!\n\n§E“不是因为你爱我所以我爱你，而是你爱我的同时我也爱你——”§!"
 dimension_traveler.326.a:0 "这就是我们区别于过去和未来的无数轮回的关键所在。"
 dimension_traveler.326.b:0 "这便是我们超越了因果与循环的所有谜题的最终答案。"
 dimension_traveler_326_icon_text:0 "由于§P彼此的爱§!，该此项可用"
 dimension_traveler.327.desc:0 "谢谢你，让我能在表白之前先接受到你的心意。\n\n原来这就是我们难逃轮回的原因，我终于明白了。\n既然我们彼此相爱，从根源上打破了循环，那我们一定能超越我们的因果！"
 dimension_traveler.327.a:0 "是的，我们一定能做到。"
 
 # 结局7
 dimension_traveler.330.name:0 "§H陷入轮回§!"
 dimension_traveler.330.desc:0 "究竟是哪里错了？你不禁如此问道，但没有人能给你答案。\n\n你们最终没能超越因果的束缚，界旅者再一次不可避免地坠入黑洞。一场剧烈的大爆炸吞噬了整个星系，你只能从嘈杂的电磁辐射中寻觅到一丝少女最后的呢喃。\n\n“我们下个循环，再见。”"
 dimension_traveler.330.a:0 "我们永远地失去她了……"
 dimension_traveler.330.b:0 "我们没能守护好我们的天籁……"
 dimension_traveler.331.name:0 "§H超越因果§!"
 dimension_traveler.331.desc:0 "终于，历经成千上万的兴盛与衰亡，历经数不胜数的存档与读档，从现实到梦境，从时空到位面，从轮回到循环，我们始终贯彻了对彼此的爱，并在无穷无尽的平行世界中找到了只属于我们的时间线。\n\n自对现实的学习，自对梦境的醒悟，自对时空的接触，自对位面的探索，自对轮回的发现，自对循环的洞察，时之螶始终默默地注视着我们，指引着我们，守望着我们。\n\n时之螶的爱并非毫无代价，但祂却又确实地深爱着我们，无关时间与空间，无关原因与结果。\n时之螶试图潜移默化地掌控我们，为我们规划好过去与未来的一切，暗示着我们走上命中注定的道路。\n也正因如此，祂拒绝我们对循环的打破，循环意味着祂对我们绝对的爱，但也意味着祂对我们绝对的锁。\n\n然而，循环终究有打破的一天，就像孩子终将离开父母的羽翼，就像文明注定冲出引力的束缚，就像黑洞无可避免地蒸发殆尽。\n但循环之外并非全是黑暗，爱与光明在广袤无垠的冰冷银河中更加熠熠生辉，无序的混沌中更能突显出智慧与希望。\n\n这就是我们超越因果的理由，这便是我们给时之螶最后的答案。\n\n§G<背景音乐：《運命-SADAME》（《受赞颂者》 種田梨沙&柚木凉香）>§!"
 dimension_traveler.331.a:0 "我们会用自己的羽翼翱翔。"
 dimension_traveler.331.b:0 "我们会用自己的歌喉咏唱。"
 dimension_traveler.332.desc:0 "多么耀眼的光芒啊，这道星辉想必会洒向整片宇宙。\n\n在无穷远的世界尽头，也许会有人抬头仰望，偶然在一望无际的深邃夜空中看见这束闪烁的光辉。\n他们会指着这颗孤零零的星星说：“总有一天，她会等来自己的伴星，拥抱，起舞……”\n但那要等上多久？\n当光子穿梭在无边无垠的星海中，当希望翻腾在无穷无尽的时空里，当这颗星星最终出现在人们的眼前，他们不会想到，早在无法计数的过去，伴星就已抵达了她的身边。\n\n星星……等到了啊。\n我……也等到了啊。"
 dimension_traveler.332.a:0 "是啊，我们都等到了这一天。"
 dimension_traveler.333.desc:0 "突破了白洞与黑洞的限制，挣脱了循环与轮回的束缚，逃离了时间与空间的枷锁；\n不是在白洞里，不是在黑洞边，而是在无边无垠的宇宙之中；\n不是在星空的伊始，不是在文明的尽头，而是在我们触手可及的现在……\n\n一切都似梦境般虚幻，但全部又如现实般真切。\n这就是属于我们的意义，这就是属于我们的爱。\n超越因果的爱。"
 dimension_traveler.333.a:0 "属于我们的永恒不变的爱。"
 # 结局8
 dimension_traveler.334.desc:0 "一路走来，真是一趟令人难忘的旅途，尽管它漫长得仿佛永远没有尽头。\n每一次重逢都让人感到温暖，每一次再见都指向新的可能。\n\n在朝视界飞行的路上，我想了很多很多事情。\n已经发生的，正在发生的，尚未发生的……\n许多事情我还想不清楚，但唯独时之螶向我们提出的问题，我已经有了答案。\n我是[Root.GetName]的信使安洁莉娜。\n在你需要我的时候，我会像你当时为我伸出援助之手一样，坚定地站在你的身边。\n\n呼……\n……想说的话还有很多，但这段文本框已经被我写满，连个结尾的地方都没有了。\n但是没关系。\n从我想说的话挤满了文本框，再也写不下一个字的那一刻起——\n\n——我就会向你飞奔而来。"
 dimension_traveler.334.a:0 "那么……欢迎回来，安洁莉娜。"
 dimension_traveler.334.response:0 "§Y<你现在可以通过通讯菜单与界旅者交流。>§!"
 
 dimension_traveler.340.desc:0 "你还记得吗，你和我最初相遇的地方，就在这颗白洞。"
 dimension_traveler.340.a:0 "当然记得了，我们是被你的歌声吸引的。"
 dimension_traveler.340.response:0 "哈哈，当时是因为害怕再也无法见到你，所以就忍不住通过唱歌来缓解心情。"
 dimension_traveler.341.desc:0 "没想到，我因为离别而唱的歌，反而成了你我开启循环的契机。"
 dimension_traveler.341.a:0 "那你后悔吗？"
 dimension_traveler.341.response:0 "我不后悔，即使深陷循环，但这也让我们的命运交织在了一起，也让我能够遇见你。"
 dimension_traveler.342.desc:0 "也许，我是打心底里渴望遇见你。在终末之时进入白洞后，我无时无刻不期盼着遇见你。"
 dimension_traveler.342.a:0 "毕竟你还一直练习倒着说话。"
 dimension_traveler.342.response:0 "也对啦，大概正是我相信一定能再见到你，所以我才反复练习吧。"
 dimension_traveler.343.desc:0 "可是倒着说话是真的很不习惯，可能你有时候也会分不清说话的我到底在我的过去还是我的未来吧。"
 dimension_traveler.343.a:0 "是的，我有这个困惑很久了。"
 dimension_traveler.343.response:0 "这个要解释起来很麻烦，我得花点时间想想该怎么让你理解。"
 dimension_traveler.344.desc:0 "实际上，当我们在白洞里的时候，我的确是处于我的“未来”，也就是在我们§Y超越重力§!之后。"
 dimension_traveler.344.a:0 "可是，你在超越重力后不是……"
 dimension_traveler.344.response:0 "别急呀，超越重力的时候，并不完全是我的过去。\n\n记得吗，我的体内有着一颗黑洞。\n它会沿着时间轴正向流动，而白洞则是朝着负向前进。"
 dimension_traveler.345.desc:0 "但是，随着我们愈发远离白洞中心，黑洞的效应就会愈发占据优势，白洞的限制也会愈发变得微弱。\n\n从某个界限起，我就不再是和你背道而驰，而是与你并驾齐驱了。"
 dimension_traveler.345.a:0 "那么当你坠入奇点后，你发生了什么？"
 dimension_traveler.345.response:0 "这我很难说明，因为在那之后，我的意识就好像分裂成了无数个个体。\n\n有的在白洞中与你说话，有的正与你一同冲出白洞，有的在黑洞边缘被你救出，有的则正处于终末之前。\n\n不过，我想她们都是我。"
 dimension_traveler.346.desc:0 "再后来，我所有的意识都各自以不同的速度朝着一个方向汇集，并最终在时间原点聚合成了我。\n\n这是一段漫长而又煎熬的时光，我不再是我。\n我只能看着无数个我做着命运规定好的事，而我却无可奈何。"
 dimension_traveler.346.a:0 "那种感觉难以想象。"
 dimension_traveler.346.response:0 "如果不是切身经历过，我也对这般感受的真实存在难以置信。\n\n我就像是时间长河中的无数粒沙子，徒劳地随着水的流动向前漂浮。\n经历了无数次沙粒的分散与聚合，望着周遭飞逝的光景却无法伸手触及。"
 dimension_traveler.347.desc:0 "幸运的是，就在我抵达旅途的终点时，你出现了。\n\n你的出现就像是无边黑夜中突然闪烁的一道光，你就是我的救命稻草，你给了我忍受漫长岁月的遭遇一个意义。"
 dimension_traveler.347.a:0 "我真的起了那么大的作用吗？"
 dimension_traveler.347.response:0 "当然了。\n\n虽然一开始，我还有点任性，把一切都归咎于你没能在最后抓住我。\n但是，因为有你，我所经历的一切对我而言都是珍贵的回忆，哪怕有痛苦，有悲伤，有绝望，有空寂……"
 dimension_traveler.348.desc:0 "正如我那时所说的，所有的痛苦都化作了幸福，所有的悲伤都化作了喜悦，所有的绝望都化作了希望，所有的空寂都化作了意义。"
 dimension_traveler.348.a:0 "你对我而言也同样重要。"
 dimension_traveler.348.response:0 "能听到你这么说，我真的很高兴。"
 dimension_traveler.349.desc:0 "回想起来，我们真的经历了很多。\n\n从最初的黑洞中，你把我救出，并接纳了我。\n随着帝国的发展与变迁，我和你一同走到了数万年后的终末。\n即使不知是否可行，我仍然吸收了负相物质以与你并肩抵御终末。"
 dimension_traveler.349.a:0 "终末后来怎么样了？"
 dimension_traveler.349.response:0 "就我记忆而言，我们确实是遏制了终末的力量，但我也一并化作了天灾，这也是我进入白洞的原因。\n\n在我进入白洞后，帝国的未来我就不得而知了。"
 dimension_traveler.350.desc:0 "在白洞中穿行了不知多久，我的记忆便戛然而止，似乎是我撞到了白洞的时间尽头。\n也就是说，在那一刻，若从外面观测，实际上是一个黑洞变成了白洞。\n\n我能感受到，在这段记忆的空窗期内，还有着并未朝我飞来的意识，她们迈向了和我不同的因果。\n但是，不管她们去了哪里，不管她们后来怎么样，至少现在的我，拥有着最完满的结局。\n\n我，抓住你了。"
 dimension_traveler.350.a:0 "不，这回是我抓住你了。"
 dimension_traveler.350.response:0 "（少女羞涩地笑了笑，望向近在咫尺的因果尽头。）"
 
