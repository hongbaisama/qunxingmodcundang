 stage_dimension_traveler_3:0 "白洞领域"
 stage_dimension_traveler_4:0 "白洞边境"
 stage_dimension_traveler_5:0 "白洞视界"
 string_white_hole:0 "§Y白洞斥力§!"
 string_black_hole:0 "§R黑洞引力§!"
 string_fleet_energy:0 "§G飞船动力§!"
