 beyond_infinity_time_current_value: "当前值：§Y$VALUE|0$§!"
 beyond_infinity_time_crisis_description_title: "$ap_beyond_infinity$"
 beyond_infinity_time_crisis_description: "星海共同体中那些希图在历史的长河中照见未来的人们长期以来一直设想会有一场将要降临的§R天灾§!——一场所有智慧生命的生死危机，唯有倚仗前所未有的万众一心与前仆后继方能克服——如果真有可能克服的话。\n\n流行的关于何为这场天灾的本质的预测相当异想天开，比如系外掠食者入侵，再比如星系中机械智能星火燎原，又或是其他位面的继位战争波及而至，但是……\n\n鲜为人知的是，§R终末§!的倒计时早已开启。\n\n$ap_beyond_infinity_desc$"
 beyond_infinity_time_crisis_howto_title: "时间与循环"
 beyond_infinity_time_crisis_howto: "作为圆环之子完成§H$beyond_infinity_time_crisis_objective$§!来产生£beyond_infinity_time §H$beyond_infinity_time$§!，这样便能延缓终末的脚步。在我们寻求超越无限的过程中，我们必须与其它§H循环§!取得联系，唯有无限才能超越无限，唯有循环才能超越循环。"
