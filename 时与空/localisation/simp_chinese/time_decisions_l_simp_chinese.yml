 decision_blessed_by_god_effect:0 "§Y接受神明的恩赐！§!\n每次举行§Y$decision_blessed_by_god$§!都将使消耗§R增加§!，当前已举行§Y[Owner.blessed_by_god_decision_count]§!次"
 
 decision_equinox_seal:0 "封印供能"
