 trait_fourth_crisis_6_desc:0 "$origin_fourth_crisis_picture$§L第四天灾拥有智慧之脑，能够从多个角度思考问题。此外，他们会在危急时刻急中生智，令愚昧的敌人瞠目结舌。§!\n§R$origin_fourth_crisis$起源专属特质§!"
 
