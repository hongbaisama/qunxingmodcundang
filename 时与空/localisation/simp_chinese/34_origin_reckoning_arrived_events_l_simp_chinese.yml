l_simp_chinese:
 NAME_Origin_Reckoning_Arrived_Creatures_Planet: "清算之源"
 NAME_Origin_Reckoning_Arrived_Creatures_Other_Planet: "噩梦回响"
 NAME_Origin_Reckoning_Arrived_Starting_System: "临时庇护所"
 NAME_Origin_Reckoning_Arrived_Starting_Star_A: "虚境之眼"
 NAME_Origin_Reckoning_Arrived_Starting_Star_B: "地狱之爪"
 NAME_Origin_Reckoning_Arrived_Starting_Fleet: "终末先知"
 NAME_Origin_Reckoning_Arrived_Starting_Ship: "$NAME_Exile$"
 
 origin_reckoning_arrived.0.name:0 "$origin_reckoning_arrived$：§R源头§!"
 origin_reckoning_arrived.0.desc:0 "检测到本局存在使用§R$origin_reckoning_arrived$§!起源（轮回之终末开始清算）的国家。\n\n如果您不希望其生效，请选择禁用该起源（该国家不触发起源事件，且转为使用§Y繁荣一统§!起源）。"
 origin_reckoning_arrived.0.a:0 "§R启用该起源。§!"
 origin_reckoning_arrived.0.b:0 "§G禁用该起源。§!"
 
 origin_reckoning_arrived.1.desc: "$utopia.3320.desc.intro$\n\n$origin_reckoning_arrived.1.desc.a.1$\n\n$origin_reckoning_arrived.1.desc.a.outro$"
 origin_reckoning_arrived.1.desc.a.1: "我们整个帝国所剩的是一群被放逐者，被§H[Root.GetRulerName]§!领导着。他是一位预见了这一境况的强大[GetPsychicNoun]，他带走了一小群人口，潜藏在一艘事先建造的方舟舰上。"
 origin_reckoning_arrived.1.desc.a.outro: "简直像是对把我们的帝国毁于一旦还不够满足一般，一大群灵能实体在[origin_reckoning_arrived_creatures_planet.GetName]附近实体化。他们吞噬我们的[GetPsychicNounPlural]的意识之后获取了强大的能量，现在开始在星系中游荡寻找更多猎物。"
 origin_reckoning_arrived.1.tooltip: "§R清算还没有结束！§!\n§R一只强大的灵能实体很快就会追上我们，我们必须尽快离开此地！§!"
 
 origin_reckoning_arrived.11.name: "机遇？"
 origin_reckoning_arrived.11.desc.same: "当我们准备离开虚境时，一道声音传入了我们的脑海。\n\n§Y“你们已误入歧途，并自食恶果。拥抱我们，寻求救赎之道。”§!\n\n"
 origin_reckoning_arrived.11.desc: "$origin_reckoning_arrived.11.desc.same$§Y“愿生命在你们身上生根发芽。”§!"
 origin_reckoning_arrived.11.a: "尝试回应。"
 origin_reckoning_arrived.11.a.response: "那道声音戛然而止，似乎被某个存在掐断了联络。\n\n一座圣所的雏形在我们心中缓缓浮现。"
 origin_reckoning_arrived.12.name: "$origin_reckoning_arrived.11.name$"
 origin_reckoning_arrived.12.desc: "$origin_reckoning_arrived.11.desc.same$§Y“愿世界在你们脚下恐惧颤抖。”§!"
 origin_reckoning_arrived.12.a: "$origin_reckoning_arrived.11.a$"
 origin_reckoning_arrived.12.a.response: "$origin_reckoning_arrived.11.a.response$"
 origin_reckoning_arrived.13.name: "$origin_reckoning_arrived.11.name$"
 origin_reckoning_arrived.13.desc: "$origin_reckoning_arrived.11.desc.same$§Y“愿渴望在你们心中膨胀壮大。”§!"
 origin_reckoning_arrived.13.a: "$origin_reckoning_arrived.11.a$"
 origin_reckoning_arrived.13.a.response: "$origin_reckoning_arrived.11.a.response$"
 origin_reckoning_arrived.14.name: "$origin_reckoning_arrived.11.name$"
 origin_reckoning_arrived.14.desc: "$origin_reckoning_arrived.11.desc.same$§Y“愿灵魂在你们体内洗涤纯净。”§!"
 origin_reckoning_arrived.14.a: "$origin_reckoning_arrived.11.a$"
 origin_reckoning_arrived.14.a.response: "$origin_reckoning_arrived.11.a.response$"
 origin_reckoning_arrived.15.name: "$origin_reckoning_arrived.11.name$"
 origin_reckoning_arrived.15.desc: "$origin_reckoning_arrived.11.desc.same$§Y“愿智慧在你们耳畔低语呢喃。”§!"
 origin_reckoning_arrived.15.a: "$origin_reckoning_arrived.11.a$"
 origin_reckoning_arrived.15.a.response: "$origin_reckoning_arrived.11.a.response$"
 
 origin_reckoning_arrived.30.name: "末日求生"
 origin_reckoning_arrived.30.desc: "大功告成。§R清算§!已被摧毁。\n\n$end_of_the_cycle_color_article_cap$已撤退回§H虚境§!深处，它对我们物理现实构成的威胁暂时已被遏制。我们明白，总有一天祂仍会卷土重来，暂停的清算也会重新开始。但就算真有那么一天，我们也依然不会轻易言败，并在与§R清算§!的殊死一搏之后，凯旋而归。"
 origin_reckoning_arrived.30.a: "我们的胜率并不是零。"
 
 origin_reckoning_arrived.35.name: "末日求生"
 origin_reckoning_arrived.35.desc: "§R清算§!已被其它国家摧毁。\n\n$end_of_the_cycle_color_article_cap$已撤退回§H虚境§!深处，它对我们物理现实构成的威胁暂时已被遏制。尽管我们并未亲眼目睹，但至少现在可以松一口气了。"
 origin_reckoning_arrived.35.a: "但清算还没有结束……"