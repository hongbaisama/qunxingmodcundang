 concept_gas_mining_drone: "$job_gas_mining_drone_plural$"
 concept_gas_mining_drone_desc: "[gas_mining_drone.GetNamePlural]是一种产出$i_minerals$和$i_rare_crystals$的复合岗位，并被视作§I$job_mining_drone$§!岗位。\n\n§L$job_gas_mining_drone_desc$§!"
 
 concept_gas_agri_drone: "$job_gas_agri_drone_plural$"
