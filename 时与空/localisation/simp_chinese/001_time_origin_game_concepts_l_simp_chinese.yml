l_simp_chinese:
 # 通用
 concept_function_origin_text: "§B(机制性起源)§!"
 concept_function_origin: "机制性起源"
 concept_function_origin_desc: "该类起源拥有专属机制，甚至整局游戏都是围绕着该机制进行。\n该类起源的游戏体验可能与原版迥然不同，不建议完全按照原版的思路游玩。"
 
 concept_story_origin_text: "§G(剧情性起源)§!"
 concept_story_origin: "剧情性起源"
 concept_story_origin_desc: "该类起源初始便伴随着一定的剧情文本，适合代入体验。"
 
 concept_diversity_origin_text: "§Y(多样性起源)§!"
 concept_diversity_origin: "多样性起源"
 concept_diversity_origin_desc: "该类起源适合AI使用，以展现银河的多样性。\n但该类起源可玩性不强，不推荐玩家使用。"
 
 concept_multiplayer_origin_text: "§H(联机性起源)§!"
 concept_multiplayer_origin: "联机性起源"
 concept_multiplayer_origin_desc: "该类起源适合在§Y联机模式§!中使用，单人游玩则无法正常游戏或者没有乐趣。"
 
 concept_global_origin_text: "§R(全局性起源)§!"
 concept_global_origin: "全局性起源"
 concept_global_origin_desc: "该类起源会对整个银河的局势或规则造成较大的影响，请谨慎选择。\n当AI随机到该类起源时，在游戏开始，玩家将收到一个提示，并选择是否允许AI启用全局性起源。"
 
 # 理念
 concept_building_civic_starry_yearning: "$building_civic_starry_yearning$"
 concept_building_civic_starry_yearning_corporate: "$building_civic_starry_yearning_corporate$"
 
 concept_building_civic_overclocking_art: "$building_civic_overclocking_art$"
 concept_building_civic_overclocking_art_corporate: "$building_civic_overclocking_art_corporate$"
 concept_building_civic_overclocking_art_machine: "$building_civic_overclocking_art_machine$"
 
 # 协同进化
 concept_syncretic_evolution_traits: "$trait_syncretic_proles$特质"
 concept_syncretic_evolution_traits_desc: "只有具备['concept_trait_syncretic_proles']或['concept_trait_nerve_stapled']特质的物种才能使用的特质，可以提供类似于未开智物种特质的效果。\n\n§R若物种没有['concept_trait_syncretic_proles']或['concept_trait_nerve_stapled']特质，此类特质将自动替换为常规特质。§!"
 
 concept_trait_syncretic_proles: "$trait_syncretic_proles$"
 
 concept_trait_nerve_stapled: "$trait_nerve_stapled$"
 
 # 生命之籽
 concept_trait_pc_gaia_preference_terraforming: "$trait_pc_gaia_preference_terraforming$"
 
 # 蜂巢天性
 concept_d_pc_hive_blocker: "$d_pc_hive_blocker$"
 concept_d_pc_hive_blocker_desc: "—清理时间:\n$tt$—£time 720§I天§!\n—清理花费:\n$tt$—1500$i_food$\n—$MOD_PLANET_MAX_DISTRICTS_MULT$：§R-50%§!\n—$MOD_SPECIES_EMPIRE_SIZE_MULT$：§R+20%§!\n—$MOD_POP_AMENITIES_USAGE_NO_HAPPINESS_MULT$：§R+20%§!\n—$mod_planet_pops_upkeep_mult$：§R+20%§!\n—$MOD_BONUS_POP_GROWTH_MULT$：§R-20%§!\n—$mod_planet_jobs_produces_mult$：§R-20%§!\n—$mod_planet_structures_upkeep_mult$：§R+20%§!\n—清理后:\n$tt$—§I解锁星球特征：§!['concept_d_pc_hive']\n$h_line$§L$d_pc_hive_blocker_desc$§!"
 
 concept_d_pc_hive: "$d_pc_hive$"
 concept_d_pc_hive_desc: "—$MOD_PLANET_MAX_DISTRICTS_MULT$：§R-25%§!\n—每个拥有['concept_d_pc_hive']或['concept_d_pc_hive_other']的星球导致:\n$tt$—$MOD_SPECIES_EMPIRE_SIZE_MULT$：§G-2.5%§!\n$tt$—$MOD_POP_AMENITIES_USAGE_NO_HAPPINESS_MULT$：§G-2.5%§!\n$tt$—$mod_planet_pops_upkeep_mult$：§G-2.5%§!\n$tt$—$MOD_BONUS_POP_GROWTH_MULT$：§G+2.5%§!\n$tt$—$mod_planet_jobs_produces_mult$：§G+2.5%§!\n$tt$—$mod_planet_structures_upkeep_mult$：§R+2.5%§!\n$tt$—每§Y10§!年有§G100%§!概率将星系内随机固态行星转变为伴随['concept_d_pc_hive_other']的['concept_pc_hive']\n$tt$ (有§Y33%§!概率改为扩散至相邻星系)\n—维护费:10$i_food$/£planet \n$h_line$§L$d_pc_hive_desc$§!"
 
 concept_d_pc_hive_other: "$d_pc_hive_other$"
 concept_d_pc_hive_other_desc: "—$MOD_PLANET_MAX_DISTRICTS_MULT$：§R-25%§!\n—每个拥有['concept_d_pc_hive']或['concept_d_pc_hive_other']的星球导致:\n$tt$—$MOD_SPECIES_EMPIRE_SIZE_MULT$：§G-1.25%§!\n$tt$—$MOD_POP_AMENITIES_USAGE_NO_HAPPINESS_MULT$：§G-1.25%§!\n$tt$—$mod_planet_pops_upkeep_mult$：§G-1.25%§!\n$tt$—$MOD_BONUS_POP_GROWTH_MULT$：§G+1.25%§!\n$tt$—$mod_planet_jobs_produces_mult$：§G+1.25%§!\n$tt$—$mod_planet_structures_upkeep_mult$：§R+1.25%§!\n$tt$—每§Y10§!年有§G50%§!概率将星系内随机固态行星转变为伴随['concept_d_pc_hive_other']的['concept_pc_hive']\n$tt$ (有§Y33%§!概率改为扩散至相邻星系)\n—维护费:5$i_food$/£planet \n$h_line$§L$d_pc_hive_other_desc$§!"
 
