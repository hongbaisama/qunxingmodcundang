 concept_psionic_technician: "$job_psionic_technician_plural$"
 concept_psionic_technician_desc: "[psionic_technician.GetNamePlural]是一种产出$i_energy$和$i_physics$的复合岗位，并被视作§I$job_technician$§!岗位。\n\n§L$job_psionic_technician_desc$§!"
 
 concept_psionic_miner: "$job_psionic_miner_plural$"
 concept_psionic_miner_desc: "[psionic_miner.GetNamePlural]是一种产出$i_minerals$和$i_engineering$的复合岗位，并被视作§I$job_miner$§!岗位。\n\n§L$job_psionic_miner_desc$§!"
 
 concept_psionic_farmer: "$job_psionic_farmer_plural$"
 concept_psionic_farmer_desc: "[psionic_farmer.GetNamePlural]是一种产出$i_food$和$i_society$的复合岗位，并被视作§I$job_farmer$§!岗位。\n\n§L$job_psionic_farmer_desc$§!"
 
 # 纳米机器
 concept_origin_nanites_species_trait: "$origin_nanites$物种特质"
 concept_origin_nanites_species_trait_desc: "$concept_origin_nanites_species_trait$是§Y$origin_nanites$§!起源专属的物种特质。\n此类特质限定物种只能在['concept_pc_nanites']上生存，并且无法被添加或移除。"
 
 concept_trait_origin_nanites: "$trait_origin_nanites$"
 
 concept_district_nanites_modifier_mult_white: "§W$pc_nanites$区划效果§!"
 concept_district_nanites_modifier_mult: "$pc_nanites$区划效果"
