 concept_nanites_logistics_drone: "$job_nanites_logistics_drone_plural$"
 concept_nanites_logistics_drone_desc: "[nanites_logistics_drone.GetNamePlural]是一种产出$i_trade_value$、$i_research$和$i_amenities$的复合岗位，并被同时视作§I$job_logistics_drone$§!与§I演算者§!岗位。\n\n§L$job_nanites_logistics_drone_desc$§!"
 
 # 赞美太阳
 concept_building_origin_praise_the_sun: "$building_origin_praise_the_sun$"
 
 # 宁和之道
 databank_origin_tao_of_ninghe: "宁和之道"
 
 concept_pure_yin_modifier: "§B£mod_consecrated_world_green 极阴之力§!"
 concept_pure_yin: "§B极阴之力§!"
 concept_pure_yin_desc: "§B极阴之力§!代表着对阴气的极致掌握，当['concept_ninghe_country']偏向时['concept_yang_country']，国家与星球的['concept_yin_country']之力都会因此得到增强。"
 
 concept_pure_yang_modifier: "§Y£mod_consecrated_world_yellow 极阳之力§!"
 concept_pure_yang: "§Y极阳之力§!"
 concept_pure_yang_desc: "§Y极阳之力§!代表着对阳气的极致掌握，当['concept_ninghe_country']偏向时['concept_yin_country']，国家与星球的['concept_yang_country']之力都会因此得到增强。"
 
 concept_ninghe_country: "§G宁和§!"
 concept_ninghe_country_desc: "§G宁和§!代表着国家中的['concept_yin_country']['concept_yang_country']平衡，它将从社会制度、意识形态、地区文化等层面影响国家中全体公民的兴趣爱好与价值观侧重等。\n\n维持在§G宁和§!状态将给我们带来极大的收益，因此，我们需要注意国家的['concept_leader_yin']、['concept_planet_yin']和['concept_leader_yang']、['concept_planet_yang']对§G宁和§!的影响。"
 
 concept_yin_country: "§B阴§!"
 concept_yin_country_desc: "§B阴§!代表着国家中的阴气，是['concept_ninghe_country']的一部分，它将从社会制度、意识形态、地区文化等层面影响国家中全体公民的兴趣爱好与价值观侧重等。\n\n['concept_leader_yin']和['concept_planet_yin']是影响§B阴§!之力的主要因素。"
 
 concept_trait_yin: "§B阴系特质§!"
 concept_leader_yin: "§B阴系领袖§!"
 concept_leader_yin_desc: "§B阴系领袖§!会影响国家中的['concept_yin_country']之力，并直接影响国家的['concept_ninghe_country']。\n\n§B阴系领袖§!的每个等级和每级特质将使局势向['concept_yin_country']偏移§G1§!。\n\n§B阴系领袖§!主要来自于§H£official $subclass_official_delegate$§!、§H£official $subclass_official_diplomacy_councilor$§!、§H£official $subclass_official_economy_councilor$§!、§H£official $subclass_official_governor$§!、§B£scientist $subclass_scientist_governor$§!、§R£commander $subclass_commander_governor$§!的等级与特质的影响。"
 
 concept_planet_yin: "§B阴系星球§!"
 concept_planet_yin_desc: "§B阴系星球§!会影响国家中的['concept_yin_country']之力，并直接影响国家的['concept_ninghe_country']。\n\n§B['concept_yin']盛阳衰§!的星球将使局势向['concept_yin_country']偏移§G2~10§!。"
 
 concept_yang_country: "§Y阳§!"
 concept_yang_country_desc: "§Y阳§!代表着国家中的阳气，是['concept_ninghe_country']的一部分，它将从社会制度、意识形态、地区文化等层面影响国家中全体公民的兴趣爱好与价值观侧重等。\n\n['concept_leader_yang']和['concept_planet_yang']是影响§Y阳§!之力的主要因素。"
 
 concept_trait_yang: "§Y阳系特质§!"
 concept_leader_yang: "§Y阳系领袖§!"
 concept_leader_yang_desc: "§Y阳系领袖§!会影响国家中的['concept_yang_country']之力，并直接影响国家的['concept_ninghe_country']。\n\n§Y阳系领袖§!的每个等级和每级特质将使局势向['concept_yang_country']偏移§G1§!。\n\n§Y阳系领袖§!主要来自于§B£scientist $subclass_scientist_explorer$§!、§B£scientist $subclass_scientist_scholar$§!、§B£scientist $subclass_scientist_councilor$§!、§R£commander $subclass_commander_admiral$§!、§R£commander $subclass_commander_general$§!、§R£commander $subclass_commander_councilor$§!的等级与特质的影响。"
 
 concept_planet_yang: "§Y阳系星球§!"
 concept_planet_yang_desc: "§Y阳系星球§!会影响国家中的['concept_yang_country']之力，并直接影响国家的['concept_ninghe_country']。\n\n§Y['concept_yang']盛阴衰§!的星球将使局势向['concept_yang_country']偏移§G2~10§!。"
 
 concept_ninghe: "§G宁和§!"
 concept_ninghe_desc: "§G宁和§!代表着星球上的['concept_yin']['concept_yang']平衡，它将从温度、气候、环境变化等层面影响星球上生命的生存活动和思维方式等。\n\n维持在§G宁和§!状态将给我们带来极大的收益，因此，我们需要注意星球的['concept_building_yin']、['concept_building_yang']和['concept_ninghe_planet_class']对§G宁和§!的影响。"
 
 concept_ninghe_planet_class: "§G星球类型§!"
 concept_ninghe_planet_class_desc: "不同的§G星球类型§!会对星球的['concept_ninghe']造成不同的影响。\n\n炎热类星球、理想城、环世界、机械球、纳米球等会增强星球的['concept_yang']之力，寒冷类星球、遗落球、居住站、死寂球、蜂巢球等会增强星球的['concept_yin']之力，而盖亚球则拥有一定调节['concept_ninghe']的能力。\n此外，侧重['concept_building_yang']的§G星球规划§!和侧重['concept_building_yin']的§G星球规划§!同样会使['concept_ninghe']朝对应方向偏移。"
 
 concept_yin: "§B阴§!"
 concept_yin_desc: "§B阴§!代表着星球上的阴气，是['concept_ninghe']的一部分，它将从温度、气候、环境变化等层面影响星球上生命的生存活动和思维方式等。\n\n['concept_building_yin']和['concept_ninghe_planet_class']是影响§B阴§!之力的主要因素。"
 
 concept_yin_mult_modifier: "§W£mod_consecrated_world_green §B阴系建筑§!对宁和的影响§!"
 concept_building_yin: "§B阴系建筑§!"
 concept_building_yin_desc: "§B阴系建筑§!会影响星球上的['concept_yin']之力，并直接影响星球的['concept_ninghe']。\n\n每个§B阴系建筑§!将使局势向['concept_yin']偏移§G5§!。\n\n§B阴系建筑§!包括：\n£job_priest 凝聚类建筑、£trade 贸易类建筑、£amenities 舒适类建筑、£job_artisan 工厂类建筑、£strategic 精炼类建筑与侧重此类的区划特化等。"
 
 concept_yang: "§Y阳§!"
 concept_yang_desc: "§Y阳§!代表着星球上的阳气，是['concept_ninghe']的一部分，它将从温度、气候、环境变化等层面影响星球上生命的生存活动和思维方式等。\n\n['concept_building_yang']和['concept_ninghe_planet_class']是影响§Y阳§!之力的主要因素。"
 
 concept_yang_mult_modifier: "§W£mod_consecrated_world_yellow §Y阳系建筑§!对宁和的影响§!"
 concept_building_yang: "§Y阳系建筑§!"
 concept_building_yang_desc: "§Y阳系建筑§!会影响星球上的['concept_yang']之力，并直接影响星球的['concept_ninghe']。\n\n每个§Y阳系建筑§!将使局势向['concept_yang']偏移§G5§!。\n\n§Y阳系建筑§!包括：\n£job_researcher 科研类建筑、£job_enforcer 政府类建筑、£job_soldier 军事类建筑、£job_foundry 铸造类建筑、£job_miner 资源类建筑与侧重此类的区划特化等。"
 
 concept_building_origin_tao_of_ninghe_yin: "$building_origin_tao_of_ninghe_yin$"
 concept_building_origin_tao_of_ninghe_yang: "$building_origin_tao_of_ninghe_yang$"
 
 # 黑客帝国
 concept_d_the_matrix_blocker: "$d_the_matrix_blocker$"
 concept_d_the_matrix_blocker_desc: "—清理时间:\n$tt$—£time 90§I天§!\n—清理花费:\n$tt$—200$i_energy$\n$tt$—100$i_food$/$i_minerals$（每过一年§G-1§!）\n—$MOD_PLANET_MAX_DISTRICTS_ADD$：§R-0.2§!\n—生产:\n$tt$—2$i_research$（每过一年§R-0.1§!）\n$tt$—2$i_unity$（每过一年§R-0.1§!）\n—维护费:\n$tt$—1$i_food$/$i_minerals$（每过一年§G-0.05§!）\n—清理后:\n$tt$—拯救100£pop 人口（每过一年§R-5§!）\n$h_line$§L$d_the_matrix_blocker_desc$§!"
 
 # 再组装者
