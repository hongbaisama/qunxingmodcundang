l_simp_chinese:
 time_civic_building.name:0 "§R潜在的不可用建筑§!"
 time_civic_building.a:0 "懂了，不造这个了。"
 time_civic_building.b:0 "你在教我做事？"
 
 time_civic_building.2000.desc:0 "请不要在你的起源专属星球上建造这类可能改变星球类型的建筑，因为这些特殊星球不应当转变为§Y$pc_gaia$§!或是§Y$pc_nuked$§!。\n\n这类建筑建成后，它们将被§R无补偿§!地§R拆除§!，所以请取消建造。"
 time.3501.desc:0 "请不要在你的起源专属星球上建造原版自动化建筑，因为它们无法正确根据区划数提供维护费。\n\n这类建筑建成后，它们将被§R替换§!或§R无补偿§!地§R拆除§!，所以请改为建造星球专属的自动化建筑。"