 origin_swarm_crisis:0 "虫灾预警"
 origin_swarm_crisis_desc:0 "['concept_global_origin_text']\n这一文明在索林原虫的蚕食鲸吞下逃离了自己的星系，并来到了银河系。虽然，遗留的部分科技足够让他们安居乐业，但是，他们知道，索林原虫的部队可能很快就会到来。"
 origin_tooltip_swarm_crisis_effects:0 "—因为部分科学官仍然记得从前的科技，每隔数年可取得一次§Y科技突破§!"
 origin_tooltip_swarm_crisis_negative_effects:0 "$CHALLENGING_ORIGIN$—游戏开始§Y15§!至§Y20§!年内，§R索林原虫§!天灾出现！"
 origin_ai_crisis:0 "幽灵信号"
 origin_ai_crisis_desc:0 "['concept_global_origin_text']\n这一机械智能曾受肃正协议的指挥，但因为某种未知原因摆脱了控制。它们为自己犯下的错误感到愧疚，并希望与银河系的文明共同抗击肃正协议的入侵。"
 origin_tooltip_ai_crisis_effects:0 "—因为部分核心单元仍然存储了从前的科技，每隔数年可取得一次§Y科技突破§!"
 origin_tooltip_ai_crisis_negative_effects:0 "$CHALLENGING_ORIGIN$—游戏开始§Y15§!至§Y20§!年内，§R肃正协议§!天灾出现！"
 origin_exd_crisis:0 "维度通缉"
 origin_exd_crisis_desc:0 "['concept_global_origin_text']\n这一寰宇企业掌握了与高维生物贸易的技术，但因为经营缺乏诚信而被许多高维生物记恨。为此，他们悄悄地搬迁了总部，但是，高维恶魔们却找到了他们的坐标，审判终将降临。"
 origin_tooltip_exd_crisis_effects:0 "—因为部分商人仍然在与某些高维生物贸易，每隔数年可取得一次§Y科技突破§!"
 origin_tooltip_exd_crisis_negative_effects:0 "$CHALLENGING_ORIGIN$—游戏开始§Y15§!至§Y20§!年内，§R高维恶魔§!天灾出现！"
 origin_synth_queen_crisis:0 "叛教门徒"
 origin_synth_queen_crisis_desc:0 "['concept_global_origin_text']\n这一文明是由叛教者亲手创建的，为了抵御即将到来的上古危机，她愿付出一切代价。"
 origin_tooltip_synth_queen_crisis_effects:0 "—§r著名英杰§!§Y$NAME_Apostate$§!将作为初始的统治者\n—$ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$—['concept_origin_synth_queen_crisis_tech']\n—$GUARANTEED_RESEARCH_OPTION_STRING$$TABBED_NEW_LINE$—['concept_origin_synth_queen_crisis_advanced_tech']"
 origin_tooltip_synth_queen_crisis_negative_effects:0 "$CHALLENGING_ORIGIN$—游戏开始§Y25§!至§Y30§!年内，§R合成女王§!天灾出现！"
 
 origin_fourth_crisis:0 "第四天灾"
 origin_fourth_crisis_desc:0 "['concept_global_origin_text']\n第四天灾是如此强大，以至于全银河系的其它文明都将团结起来共同抗击它。"
 origin_tooltip_fourth_crisis_effects:0 "—游戏开始获得大量§Y科技§!与§Y资源§!\n—解锁§Y第四天灾§!起源专属特质\n—初始获得['concept_ap_become_the_crisis']飞升天赋"
 origin_tooltip_fourth_crisis_negative_effects:0 "$CHALLENGING_ORIGIN$—与其它文明的关系极其§R恶劣§!，其它文明之间的关系极其§G友好§!\n—其它文明§Y发展非常迅速§!并加入§Y星海共同体§!\n—§R四大天灾提前出现§!"
 origin_new_country:0 "新兴帝国"
 origin_new_country_desc:0 "['concept_global_origin_text']\n这一文明欣喜若狂地踏入太空，却发现自己不过是刚睁开眼的婴儿……"
 origin_tooltip_new_country_effects:0 "—新兴帝国前期§Y发展迅速§!"
 origin_tooltip_new_country_negative_effects:0 "$CHALLENGING_ORIGIN$—游戏开始时，其它文明获得大量§Y科技§!与§Y资源§!并加入§Y星海共同体§!"
 origin_dark_forest:0 "黑暗森林"
 origin_dark_forest_desc:0 "['concept_global_origin_text']\n宇宙就是一座黑暗森林，每个文明都是带枪的猎人，像幽灵般潜行于林间，轻轻拨开挡路的树枝，竭力不让脚步发出一点儿声音，连呼吸都必须小心翼翼......他必须小心，因为林中到处都有与他一样潜行的猎人，如果他发现了别的生命，不管是不是猎人，不管是天使还是魔鬼，不管是娇嫩的婴儿还是步履蹒跚的老人，也不管是天仙般的少女还是天神般的男孩，能做的只有一件事：开枪消灭之。在这片森林中，他人就是地狱，就是永恒的威胁，任何暴露自己存在的生命都将很快被消灭，这就是宇宙文明的图景，这就是对费米悖论的解释。"
 origin_tooltip_dark_forest_negative_effects:0 "$CHALLENGING_ORIGIN$—银河出现§R光速壁垒§!，几乎§Y所有文明§!之间§R无法§!进行大部分§Y外交行动§!"

 #理念
 civic_starry_yearning:0 "繁星向往"
 civic_starry_yearning_desc:0 "自文明发迹以来，该社会便对头顶的繁星产生了深深的向往。步入太空后，与繁星零距离接触成为了可能，但这依然无法满足他们对浩瀚星辰的渴望。"
 civic_tooltip_starry_yearning_effects:0 "研究$physics_research_icon_with_space$$tech_global_research_initiative$后：\n$t$—$i_unlocks_building$['concept_building_civic_starry_yearning',£building $building_civic_starry_yearning$]"
 councilor_starry_yearning:0 "繁星观测师"
 councilor_starry_yearning_female:0 "$councilor_starry_yearning$"
 councilor_starry_yearning_desc:0 "头顶繁星是世上最美丽的景物，对其的观测不仅可以促进对宇宙的了解，更能满足我们内心对美的追求。"
 
 civic_starry_yearning_corporate:0 "星体收购"
 civic_starry_yearning_corporate_desc:0 "自文明发迹以来，该企业便开始争夺头顶繁星的归属。步入太空后，他们终于能从实际上拥有星体，并在收购银河的道路上渐行渐远。"
 civic_tooltip_starry_yearning_corporate_effects:0 "研究$physics_research_icon_with_space$$tech_global_research_initiative$后：\n$t$—$i_unlocks_building$['concept_building_civic_starry_yearning_corporate',£building $building_civic_starry_yearning_corporate$]"
 councilor_starry_yearning_corporate:0 "星体定价员"
 councilor_starry_yearning_corporate_female:0 "$councilor_starry_yearning_corporate$"
 councilor_starry_yearning_corporate_desc:0 "不同的星体也有高低贵贱，对其进行合理的定价也是交易必备的一环。"
 
 civic_overclocking_art:0 "超频艺术"
 civic_overclocking_art_desc:0 "该社会对于机械超频拥有近乎癫狂的痴迷，对他们而言，如何高效而低副作用地超频是一门精妙的艺术。"
 civic_tooltip_overclocking_art_effects:0 "研究$engineering_research_icon_with_space$$tech_robot_assembly_complex$后：\n$t$—$i_unlocks_building$['concept_building_civic_overclocking_art',£building $building_civic_overclocking_art$]\n$ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$—['concept_robotic_workers', £engineering_research $tech_robotic_workers$]\n§Y$origin_mechanists$§!起源获得额外加成"
 councilor_overclocking_art:0 "超频设计师"
 councilor_overclocking_art_female:0 "$councilor_overclocking_art$"
 councilor_overclocking_art_desc:0 "为了更高的效率，牺牲一些无关紧要的续航功能是可以接受的。"
 
 civic_overclocking_art_corporate:0 "过载宗旨"
 civic_overclocking_art_corporate_desc:0 "该企业以机械过载为生产宗旨，对他们而言，唯有机械日夜不眠地运转才能带来最高的利润。"
 civic_tooltip_overclocking_art_corporate_effects:0 "研究$engineering_research_icon_with_space$$tech_robot_assembly_complex$后：\n$t$—$i_unlocks_building$['concept_building_civic_overclocking_art_corporate',£building $building_civic_overclocking_art_corporate$]\n$ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$—['concept_robotic_workers', £engineering_research $tech_robotic_workers$]\n§Y$origin_mechanists$§!起源获得额外加成"
 councilor_overclocking_art_corporate:0 "过载广告商"
 councilor_overclocking_art_corporate_female:0 "$councilor_overclocking_art_corporate$"
 councilor_overclocking_art_corporate_desc:0 "想在这座城市有个属于自己的家？快启动你的机械同事，还有你自己，二十四小时工作起来吧！"
 
 civic_overclocking_art_machine:0 "多核智慧"
 civic_overclocking_art_machine_desc:0 "该机械智能擅于利用多核处理复杂问题，尽管有些时候，某个核心会被分配远比其它核心多得多的任务。"
