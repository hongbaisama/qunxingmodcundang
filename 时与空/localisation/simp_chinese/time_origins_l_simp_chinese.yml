 councilor_origin_ruin_megastructure:0 "造物主"
 councilor_origin_ruin_megastructure_female:0 "$councilor_origin_ruin_megastructure$"
 councilor_origin_ruin_megastructure_desc:0 "他们具备独特的建筑天赋，建造的巨构甚至能与最初的相媲美。\n我们称他们为“造物主”。"
 councilor_origin_ruin_megastructure_corporate:0 "$councilor_origin_ruin_megastructure$"
 councilor_origin_ruin_megastructure_corporate_female:0 "$councilor_origin_ruin_megastructure_female$"
