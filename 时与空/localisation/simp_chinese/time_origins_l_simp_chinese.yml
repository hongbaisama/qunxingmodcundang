 origin_tooltip_we_are_not_one_effects:0 "—§G适合§Y多人合作§!联机模式游玩！§!\n—每个玩家扮演§Y一名领袖§!，只能操作有关这名领袖相关的内容，并行使相应的['concept_origin_we_are_not_one_job']（此为玩家自觉遵守的规则）\n—确保开局有§G足够§!的领袖、资源、殖民地、科研船和舰队"
