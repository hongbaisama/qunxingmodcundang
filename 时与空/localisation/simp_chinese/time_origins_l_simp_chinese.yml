 origin_tooltip_hypocritical_face_effects:0 "—你的文明将伪装成常规的['concept_auth_corporate']，其它国家对你的§Y情报等级§!较低时会对你有§Y正面评价§!\n—§I解锁§!['concept_hypocritical_face_branch_office_buildings',£building $concept_hypocritical_face_branch_office_buildings$]"
 origin_noah_ark:0 "诺亚方舟"
 origin_noah_ark_desc:0 "['concept_story_origin_text']\n这一文明搭载着诺亚方舟逃离了被毁灭的天堂，但他们并不沮丧，因为他们将建立自己的天堂。"
 origin_tooltip_noah_ark_effects:0 "—游戏初始星系存在数个可供环境改造的['concept_pc_flood']"
 origin_tooltip_noah_ark_negative_effects:0 "—$NO_GUARANTEED_WORLDS$\n—母星系将与其它星系§R隔绝§!"
 
 origin_monster_hunter:0 "怪物猎人"
 origin_monster_hunter_desc:0 "['concept_function_origin_text']\n这一文明是在无数次狩猎巨兽的过程中繁荣兴盛的。步入太空后，他们渴望狩猎更加强大的怪物。"
 origin_tooltip_monster_hunter_effects:0 "—$SPECIES_TRAITS$['concept_trait_origin_monster_hunter']\n—£building §Y$building_holo_theatres$§!将被['concept_building_origin_monster_hunter_1',£building $building_origin_monster_hunter_1$]替代，提供['concept_job_monster_hunter',£job_monster_hunter $job_monster_hunter$]岗位\n\n§R该起源绑定§Y$civic_warrior_culture$§!理念！§!"
 origin_curator_artist_and_me:0 "三心相印"
 origin_curator_artist_and_me_desc:0 "['concept_diversity_origin_text']\n这一文明与策展人、艺术家为伴，三颗心在星海中交相辉映。"
 origin_tooltip_curator_artist_and_me_effects:0 "—游戏初始星系存在一个§Y策展人§!的空间站和§Y艺术家§!的空间站\n—部分初始领袖被替换为来自太空城邦的§Y$subclass_scientist_governor$§!与§Y$subclass_official_governor$§!"
 origin_ever_changing:0 "千变万化"
 origin_ever_changing_desc:0 "['concept_diversity_origin_text']\n这一文明的母星千变万化，他们不得不每时每刻都要适应新的环境。"
 origin_tooltip_ever_changing_negative_effects:0 "$CHALLENGING_ORIGIN$—家园星球每隔数年就会改变§Y星球类型§!，但每次变化，星球上的人口都将变得§G更易适应环境§!"
 
 origin_knowledge_from_alien:0 "异星学识"
 origin_knowledge_from_alien_desc:0 "这一文明在迈入太空后便迫不及待地与外界进行联络，而他们的努力也有所收获。"
 origin_tooltip_knowledge_from_alien_effects:0 "—除了§Y统治者§!，初始不存在本族领袖，四位§r著名英杰§!将取而代之\n—$ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$—£society ['technology:tech_xeno_linguistics']"
 origin_born_in_the_purple:0 "生于紫室"
 origin_born_in_the_purple_desc:0 "['concept_function_origin_text']\n这一文明自古便对王室的血统抱有极高的重视，生于紫室的优质血脉才有资格领导整个帝国。"
 origin_tooltip_born_in_the_purple_effects:0 "—帝国的继承人将获得§Y$leader_trait_born_in_the_purple$§!特质，其效果受继承人§Y正统性§!影响"
 origin_corrupt_brain:0 "腐化主脑"
 origin_corrupt_brain_desc:0 "['concept_function_origin_text']\n这一格式塔文明的主脑被腐化了，它丝毫不在乎任何一个子个体，并带领着整个文明冲向灭亡。"
 origin_tooltip_corrupt_brain_effects:0 "—完成§H四大飞升§!路线或许有机会挽救主脑"
 origin_tooltip_corrupt_brain_negative_effects:0 "$CHALLENGING_ORIGIN$—主脑将获得§Y$leader_trait_corrupt_brain$§!特质，节点将获得§Y$leader_trait_corrupt_node$§!特质，主脑和节点的等级与负面特质将加剧腐化"
 
 origin_legendary_worship:0 "传奇崇拜"
 origin_legendary_worship_desc:0 "['concept_function_origin_text']\n“嘿，我已经三分钟没有讲过我当年驾驶一艘护卫舰击退一整支肃正协议舰队的故事了！”"
 origin_tooltip_legendary_worship_effects:0 "—§r著名英杰§!与§l传奇英杰§!将在§Y10§!级时获得§G额外§!的§d命定特质§!与§Y$MOD_LEADER_SKILL_ADD$§!§G加成§!\n—§c常规领袖§!在§Y4§!级时有概率§G晋升§!为§r著名英杰§!，§r著名英杰§!在§Y8§!级时有概率§G晋升§!为§l传奇英杰§!\n—锁定内阁席位§Y$councilor_origin_legendary_worship_legendary$§!，只有§l传奇英杰§!才能胜任\n—锁定内阁席位§Y$councilor_origin_legendary_worship_renowned$§!，只有§r著名英杰§!才能胜任"
 origin_tooltip_legendary_worship_negative_effects:0 "—超出§Y领袖容量§!会使晋升概率§R大幅降低§!，成功晋升的领袖同样会使晋升概率§R降低§!"
 origin_blessed_by_god:0 "神眷之族"
 origin_blessed_by_god_desc:0 "['concept_function_origin_text']\n这一文明受到了神明的眷顾，他们无需自己努力，只需祭拜便可接受神明的恩赐。代价是就此丧失了思考的能力，但谁又在乎呢？"
 origin_blessed_by_god_modifiers:0 "$MODIFIERS_TITLE$\n$t$—$MOD_ATTUNEMENT_MULT$：§G+25%§!\n$t$—$MOD_PSIONIC_AURA_EFFECTIVENESS_MULT$：§G+25%§!\n$t$—$MOD_PSIONIC_AURA_INTENSITY_MULT$：§G+25%§!"
 origin_tooltip_blessed_by_god_effects:0 "—$HOMEWORLD$['concept_building_blessed_by_god',£building $building_blessed_by_god$]\n—每年可在§Y母星§!举行一次§H$decision_blessed_by_god$§!，获得§G随机科技进展§!和独特的§Y神谕§!，祭祀的效果会随着§Y已采纳的传统数§!、§Y已采纳的飞升数§!和§Y$decision_blessed_by_god$的举行次数§!增加而§G增强§!"
 origin_tooltip_blessed_by_god_negative_effects:0 "$CHALLENGING_ORIGIN$—几乎§R无法§!进行独立科研\n—§R只能§!选择['concept_psionic_ascension']路线，§R禁用§!['concept_crisis_ascension']路线\n\n$origin_blessed_by_god_modifiers$"
 origin_abandoned_by_god:0 "神弃之族"
 origin_abandoned_by_god_desc:0 "['concept_function_origin_text']\n这一文明曾受神明眷顾，却又在某时被突然抛弃。现如今，失去恩赐的他们又该何去何从？"
 origin_abandoned_by_god_modifiers:0 "$MODIFIERS_TITLE$\n$t$—$MOD_PSIONIC_AURA_RESISTANCE_MULT$：§G+50%§!\n$t$—$mod_refugee_attraction$：§R-25%§!"
 origin_tooltip_abandoned_by_god_effects:0 "—$HOMEWORLD$['concept_building_abandoned_by_god',£building $building_abandoned_by_god$]\n—所有领袖成为['concept_leader_trait_abandoned_by_god']\n—每次研究科技可以根据§Y科技水平§!获得§G大量§!凝聚力\n—研究§Y$tech_psionic_theory$§!科技后获得['concept_ap_become_the_crisis']飞升天赋"
 origin_tooltip_abandoned_by_god_negative_effects:0 "$CHALLENGING_ORIGIN$—几乎§R无法§!生产凝聚力\n—§R禁用§!['concept_psionic_ascension']路线，§R禁用§!['concept_crisis_ascension']路线\n\n$origin_abandoned_by_god_modifiers$"
 
 origin_equinox_seal:0 "彼岸封印"
