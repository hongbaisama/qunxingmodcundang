 civic_origin_gas_colony:0 "流体星核"
 civic_origin_gas_colony_desc:0 "$origin_gas_colony_picture$我们有了一个惊人的发现：在我们居住的气态巨行星中，固体核心之内竟然还是流体。流体星核是如何抵抗固体外壳重力的原因我们不得而知，但其中混杂的各种稀有物质则可以为我们所用。"
 civic_tooltip_origin_gas_colony_effects:0 "将母星的$job_gas_technician_only_plural_with_icon$岗位替换为$job_civic_origin_gas_colony_technician_plural_with_icon$\n将母星的$job_gas_miner_only_plural_with_icon$岗位替换为$job_civic_origin_gas_colony_miner_plural_with_icon$\n将母星的$job_gas_farmer_only_plural_with_icon$岗位替换为$job_civic_origin_gas_colony_farmer_plural_with_icon$"
 councilor_origin_gas_colony:0 "气体人先驱"
 councilor_origin_gas_colony_female:0 "$councilor_origin_gas_colony$"
 councilor_origin_gas_colony_desc:0 "无人胆敢进入流体的星核，唯有最坚毅的领袖一马当先，星核的秘密才得以揭示。\n既然他们敢于进入危险的星核，那必然能率领我们在星海中立足。"
 councilor_origin_gas_colony_conditional_tooltip:0 "只有§Y$trait_origin_gas_colony$§!才能进入流体星核。"
 
 civic_origin_gas_colony_corporate:0 "$civic_origin_gas_colony$"
 civic_origin_gas_colony_corporate_desc:0 "$civic_origin_gas_colony_desc$"
 councilor_origin_gas_colony_corporate:0 "星核收藏家"
 councilor_origin_gas_colony_corporate_female:0 "$councilor_origin_gas_colony_corporate$"
 councilor_origin_gas_colony_corporate_desc:0 "无人胆敢进入流体的星核，唯有最果断的领袖一马当先，星核的秘密才得以揭示。\n他们收集了宝贵的星核物质，即使只有一点也足以令我们受益匪浅。"
 
