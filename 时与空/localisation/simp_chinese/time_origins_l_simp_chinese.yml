 origin_tooltip_secondhand_country_effects:0 "—$SPECIES_TRAITS$可以选择['concept_secondhand_country_traits']特质。\n—二手零件特质：$TABBED_NEW_LINE$—可由['concept_secondhand_country_edict']法令进一步增强$TABBED_NEW_LINE$—可以通过§I机器改造§!进行添加或移除\n—$HOMEWORLD$['concept_d_secondhand_country']\n—$ADDITIONAL_TECHNOLOGIES_STRING$['technology:tech_robomodding_m',£engineering $tech_robomodding_m$]"
 origin_wishing_well:0 "许愿之井"
