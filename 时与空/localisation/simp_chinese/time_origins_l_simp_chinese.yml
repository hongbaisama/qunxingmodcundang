 origin_pc_hive:0 "蜂巢天性"
 origin_pc_hive_desc:0 "这一蜂巢思维的成员天生就是为蜂巢集体服务的，这主要得益于它们的蜂巢母星。"
 origin_tooltip_pc_hive_effects:0 "—$HOMEWORLD$伴随§I特殊障碍§!['concept_d_pc_hive_blocker']的['concept_pc_hive']（规模：£planetsize 30）\n—$SPECIES_TRAITS$§H$trait_pc_hive_preference$§!"
 origin_tooltip_pc_hive_negative_effects:0 "—物种只能在['concept_pc_hive']上生存\n—$NO_GUARANTEED_WORLDS$"
 origin_contract:0 "古老契约"
 origin_contract_desc:0 "['concept_function_origin_text']\n这一文明的先祖与某种神秘存在签订了一种延时性契约，而今天，就是它生效的日期……"
 origin_tooltip_contract_effects:0 "—游戏初始与§Y$whisperers_in_the_void$§!签订契约\n—研究特定§Y科技§!后自动踏上['concept_psionic_ascension']路线"
 origin_tooltip_contract_negative_effects:0 "—一位随机的大超主将被替换为§Y$whisperers_in_the_void$§!\n—§R禁用§!['concept_ap_become_the_crisis']飞升天赋"
 origin_time:0 "神秘奇点"
 origin_time_desc:0 "['concept_function_origin_text']['concept_story_origin_text']\n这一文明竟然在一个神秘的黑洞中发源，混乱的时空令他们困惑，浩瀚的星海使他们迷惘，他们将何去何从……"
 origin_tooltip_time_effects:0 "—游戏初始将对母星['concept_pc_time']进行探索\n—$SPECIES_TRAITS$['concept_trait_time']\n—统治者：['concept_leader_trait_ruler_time']——§Y黑洞偏爱的永生者§!"
 origin_tooltip_time_negative_effects: "$CHALLENGING_ORIGIN$—$INITIAL_POPS$§R-90%§!\n—$GUARANTEED_WORLDS_BECOME_EXTRA_DEPOSITS$"
 
 origin_gas_colony:0 "气态生物"
 origin_gas_colony_desc:0 "['concept_function_origin_text']\n这一文明是由一种神奇的气态生物组成的，它们拥有生存在气态巨行星中的能力，但这也使它们难以适应其它的宜居星球。"
 origin_tooltip_gas_colony_effects:0 "—$HOMEWORLD$['concept_pc_gas_colony']\n—$SPECIES_TRAITS$['concept_trait_origin_gas_colony']\n—其它的§Y$pc_gas_giant$§!有概率适宜居住"
 origin_tooltip_gas_colony_negative_effects:0 "—物种只能在['concept_pc_gas_colony']上生存\n—§R禁用§!['concept_synthetic_ascension']路线\n—$GUARANTEED_WORLDS_BECOME_EXTRA_DEPOSITS$"
 origin_psionic:0 "虚境访客"
 origin_psionic_desc:0 "['concept_function_origin_text']\n这一文明似乎是来自虚境的访客，但由于高维投影而失去了部分细节，离开灵能星球便寸步难行。"
 origin_tooltip_psionic_effects:0 "—$HOMEWORLD$['concept_pc_psionic']\n—$SPECIES_TRAITS$['concept_trait_origin_psionic']\n—可以将某些星球环境改造为§Y$pc_psionic$§!"
 origin_tooltip_psionic_negative_effects:0 "—物种只能在['concept_pc_psionic']上生存\n—§R只能§!选择['concept_psionic_ascension']路线\n—$GUARANTEED_WORLDS_BECOME_EXTRA_DEPOSITS$"
 origin_nanites:0 "纳米机器"
 origin_nanites_desc:0 "['concept_function_origin_text']\n这一机械智能似乎是远古遗留的纳米机器，拥有极高的工作效率，但必须在合适的纳米星球才能正常运转。"
 origin_tooltip_nanites_effects:0 "—$HOMEWORLD$['concept_pc_nanites']\n—$SPECIES_TRAITS$['concept_trait_origin_nanites']\n—可以将某些星球环境改造为§Y$pc_nanites$§!"
 origin_tooltip_nanites_negative_effects:0 "—物种只能在['concept_pc_nanites']上生存\n—§R只能§!选择['concept_nanotech_ascension']路线"
 
 origin_praise_the_sun:0 "赞美太阳"
 origin_praise_the_sun_desc:0 "['concept_function_origin_text']\n太阳为这个星球带来了能量与生命，太阳使这个文明繁荣昌盛，太阳给冰冷的宇宙增添了一丝温暖，让我们赞美太阳。"
 origin_tooltip_praise_the_sun_effects:0 "—$i_unlocks_building$['concept_building_origin_praise_the_sun',£building $building_origin_praise_the_sun$]\n—§Y解锁特化：§!$zone_praise_the_sun$\n—['concept_generator_district', £district $district_generator$]：无上限"
 origin_parallel_sky:0 "平行星空"
 origin_parallel_sky_desc:0 "['concept_story_origin_text']\n两个文明共同统治着这个星球，但当他们拥抱星空时，却发现彼此生活在不同的世界里。"
 origin_tooltip_parallel_sky_effects:0 "—与§Y另一个世界的文明§!共同在宇宙中生存，双方关系的天平取决于你的选择"
 origin_under_the_haze:0 "阴霾之下"
 origin_under_the_haze_desc:0 "['concept_story_origin_text']\n这一文明成功地迈向银河，但并非每个人都感到欣喜。人心仿佛早已蒙上了一层阴霾，谁也不知道黑暗中究竟埋藏了什么。"
 origin_tooltip_under_the_haze_negative_effects:0 "$CHALLENGING_ORIGIN$—开局触发§Y阴霾之下§!局势，随着事件推进，阴霾下的真相将会浮出水面"
 
 origin_tao_of_ninghe:0 "宁和之道"
 origin_tao_of_ninghe_desc:0 "['concept_function_origin_text']\n这一文明深谙宁和之道，力图求得阴阳之间的平衡。"
 origin_tooltip_tao_of_ninghe_effects:0 "—通过调节星球上的['concept_yin']['concept_yang']之力以追求['concept_ninghe']，并从中获得不同的效果\n—国家中['concept_yin_country']['concept_yang_country']对['concept_ninghe_country']的影响同样与星球['concept_ninghe']相辅相成"
 origin_the_matrix:0 "黑客帝国"
 origin_the_matrix_desc:0 "['concept_function_origin_text']\n这一文明曾从虚拟世界中逃离，但在虚假的幻象中学到了许多。"
 origin_tooltip_the_matrix_effects:0 "—$HOMEWORLD$伴随§Y20§!个['concept_d_the_matrix_blocker']的['concept_pc_time_ruin_cosmogenesis_world']\n—$ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$—£physics ['technology:tech_encryption_1']$TABBED_NEW_LINE$—£physics ['technology:tech_decryption_1']\n—$GUARANTEED_RESEARCH_OPTION_STRING$$TABBED_NEW_LINE$—£physics ['technology:tech_encryption_2']$TABBED_NEW_LINE$—£physics ['technology:tech_decryption_2']"
 origin_tooltip_the_matrix_negative_effects:0 "$CHALLENGING_ORIGIN$—$INITIAL_POPS$§R-2000§!\n—§R降低§!其它帝国对其的§Y评价§!"
 origin_reassembler:0 "再组装者"
 origin_reassembler_desc:0 "['concept_function_origin_text']\n这一文明发现了自身硬件的局限性，便研发出了新型组装技术来更新自身。"
 origin_tooltip_reassembler_effects:0 "—§H解锁功能：§!['concept_reassembly_mode']\n—具有['concept_trait_reassembler']特质的£pop£§I机械人口§!：40%\n—$ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$—['concept_powered_exoskeletons', £engineering_research $tech_powered_exoskeletons$]\n—$GUARANTEED_RESEARCH_OPTION_STRING$$TABBED_NEW_LINE$—£engineering ['technology:tech_robomodding_m'](非§Y$civic_machine_assimilator$§!)$TABBED_NEW_LINE$—£engineering ['technology:tech_binary_motivators'](非§Y$civic_machine_assimilator$§!)$TABBED_NEW_LINE$—£engineering ['technology:tech_integrated_cybernetics'](§Y$civic_machine_assimilator$§!)\n—研究特定§Y科技§!后自动踏上['concept_modularity_ascension']路线，若为§Y$civic_machine_assimilator$§!则改为['concept_cybernetic_ascension']"
 
 origin_colossus:0 "悬顶之剑"
 origin_colossus_desc:0 "['concept_story_origin_text']\n这一文明的母星之上悬停着一座硕大的巨像。这艘舰船早已停止运转，但它的来历始终是个谜团。"
 origin_tooltip_colossus_effects:0 "—帝国初始可获得一座特殊的§Y巨像§!，未来或许能知晓§Y巨像§!的秘密"
 origin_manifesti:0 "娱乐至死"
 origin_manifesti_desc:0 "['concept_story_origin_text']\n这一文明遵循娱乐至上的原则，物质层面的一切都只是过往云烟，他们只在乎纸醉金迷。"
 origin_tooltip_manifesti_effects:0 "—$HOMEWORLD$伴随神秘建筑的['concept_pc_city']"
 origin_tooltip_manifesti_negative_effects:0 "—§R警告：非严肃向的起源§!\n—游戏开局不久出现§Y$pft_time_manifesti$§!"
 origin_voidspawn:0 "生于黑夜"
 origin_voidspawn_desc:0 "['concept_story_origin_text']\n这一文明的母星似乎是某种生物的卵，但它孵化的时间很快就要到了。"
 origin_tooltip_voidspawn_negative_effects:0 "$CHALLENGING_ORIGIN$—家园星球是§Y$NAME_Voidspawn$§!的卵，并将在不久后孵化"
 
 origin_bright_pearl:0 "璀璨明珠"
 origin_bright_pearl_desc:0 "这一文明所生活的星系被视作银河中的璀璨明珠，他们不得不时时刻刻面临其它国家觊觎的目光。"
 origin_tooltip_bright_pearl_effects:0 "—母星系是银河系中的['concept_sc_bright_pearl']\n—$GUARANTEED_RESEARCH_OPTION_STRING$$TABBED_NEW_LINE$—£engineering ['technology:tech_mega_engineering']"
 origin_tooltip_bright_pearl_negative_effects:0 "$CHALLENGING_ORIGIN$—$NO_GUARANTEED_WORLDS$\n—任何拥有['concept_sc_bright_pearl']的国家都将受到全银河的§R觊觎§!"
 origin_pirate_king:0 "江洋大盗"
 origin_pirate_king_desc:0 "['concept_function_origin_text']['concept_story_origin_text']\n这一文明由一群太空海盗的后代组成，而他们正打算继承先辈的意志。"
 origin_tooltip_pirate_king_effects:0 "—摧毁其它国家的船只将获得§Y赏金§!并增加§Y恶名§!\n—初始额外['concept_arkship']：§Y$military_arkship_tier_1$§!\n—$SPECIES_TRAITS$['concept_trait_origin_pirate_king']\n—$official$特质：['concept_leader_trait_origin_pirate_king_official']\n—$scientist$特质：['concept_leader_trait_origin_pirate_king_scientist']\n—$commander$特质：['concept_leader_trait_origin_pirate_king_commander']"
 origin_tooltip_pirate_king_negative_effects:0 "—§Y恶名§!能§G提升§!该国家的舰船作战能力，但会§R降低§!其它帝国对其的§Y评价§!"
 origin_no_water_no_fish:0 "竭泽而渔"
 origin_no_water_no_fish_desc:0 "['concept_function_origin_text']\n这一文明并不在乎可持续发展，他们只追求最高的利益。"
 origin_tooltip_no_water_no_fish_effects:0 "—['concept_generator_district', £district $district_generator$]：无上限\n—['concept_mining_district', £district $district_mining$]：无上限\n—['concept_farming_district', £district $district_farming$]：无上限"
 origin_tooltip_no_water_no_fish_negative_effects:0 "—随着岗位工作，星球上的一产资源将逐渐§R枯竭§!"
 
 origin_adeptus_mechanicus:0 "机械神教"
 origin_adeptus_mechanicus_desc:0 "['concept_function_origin_text']\n这一文明崇拜先进的机械，他们相信，机械之神会降下赐福。"
