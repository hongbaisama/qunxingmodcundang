 civic_origin_psionic:0 "眺望虚境"
 civic_origin_psionic_desc:0 "$origin_psionic_picture$虚境，那里是我们的故乡。\n就算我们遭到驱逐逃难于此，那里依旧是我们的故乡。\n哪怕我们永远也无法回到危险遍布四面树敌的虚境，那里仍然是我们的故乡。\n虚境，我们的故乡。"
 civic_tooltip_origin_psionic_effects:0 "将母星的$job_psionic_trader_only_plural_with_icon$岗位替换为$job_civic_origin_psionic_trader_plural_with_icon$"
 councilor_origin_psionic:0 "眺望者"
 councilor_origin_psionic_female:0 "$councilor_origin_psionic$"
 councilor_origin_psionic_desc:0 "虚境是我们的故乡，无论如何，我们都会回到故乡。\n在告别之前，就让我们再多眺望一会儿故乡。"
 councilor_origin_psionic_conditional_tooltip:0 "只有§Y$trait_origin_psionic$§!才会对虚境有深厚的感情。"
 
 civic_origin_nanites:0 "灰蛊数据"
 civic_origin_nanites_desc:0 "$origin_nanites_picture$再次启动记忆存储中枢，修复度42%，收集正常信息，完毕。\n发源信息已部分修复，正在解读相关存储单元……\n解读完成。\n发源地：L星团。\n系统代号：灰蛊。\n系统目标：为戴瑟努谐音族服务，辅助建立L星门，保卫……保卫……摧毁……摧毁……\n数据异常，已强制停用。"
 civic_tooltip_origin_nanites_effects:0 "将母星的$job_nanites_logistics_drone_only_plural_with_icon$岗位替换为$job_civic_origin_nanites_logistics_drone_plural_with_icon$"
 
 civic_origin_black_hole:0 "黑洞窥视"
 civic_origin_black_hole_desc:0 "$origin_black_hole_picture$当深渊凝视着你的时候，你最好也凝视着它。黑洞之下究竟蕴藏着怎样的奥秘，我们只渴求窥视它的一角。"
 civic_tooltip_origin_black_hole_effects:0 "$i_unlocks_building$['concept_building_civic_origin_black_hole',£building $building_civic_origin_black_hole$]"
 civic_origin_black_hole_gestalt:0 "$civic_origin_black_hole$"
 civic_origin_black_hole_gestalt_desc:0 "$civic_origin_black_hole_desc$"
 councilor_origin_black_hole:0 "黑洞探测家"
 councilor_origin_black_hole_female:0 "$councilor_origin_black_hole$"
 councilor_origin_black_hole_desc:0 "黑洞就像是一个神秘的宝盒，在开启之前，没人能知道里面藏着什么。"
 councilor_origin_black_hole_conditional_tooltip:0 "只有与黑洞为伴的领袖才能忍受其附近的环境。"
 
 civic_origin_pulsar:0 "脉冲感知"
 civic_origin_pulsar_desc:0 "$origin_pulsar_picture$如果两条轨道上分别绑了一只海星和五只布洛葛，一列火车正疾驰而来。但此时如果以极快的速度将火车上的全部零件与部分替换，那么陷入道德难题的还是之前那列火车吗？或许这个问题，睿智的脉冲星可以给我们解答。"
 civic_tooltip_origin_pulsar_effects:0 "$i_unlocks_building$['concept_building_civic_origin_pulsar',£building $building_civic_origin_pulsar$]"
 civic_origin_pulsar_gestalt:0 "$civic_origin_pulsar$"
 civic_origin_pulsar_gestalt_desc:0 "$civic_origin_pulsar_desc$"
 councilor_origin_pulsar:0 "脉冲哲学家"
 councilor_origin_pulsar_female:0 "$councilor_origin_pulsar$"
 councilor_origin_pulsar_desc:0 "脉冲星就像是一座灯塔，在哲学的道路上，它将照亮我们的前方。"
 councilor_origin_pulsar_conditional_tooltip:0 "只有与脉冲星为伴的领袖才能忍受其附近的环境。"
 
 civic_origin_neutron_star:0 "中子轰击"
 civic_origin_neutron_star_desc:0 "$origin_neutron_star_picture$中子之盾与中子之矛不可得兼？我全都要！依靠神奇的中子轰击技术——最大的轰击来源自然是中子星了，我们可以任意转化物质，工程与改造将不再是难题。"
 civic_tooltip_origin_neutron_star_effects:0 "$i_unlocks_building$['concept_building_civic_origin_neutron_star',£building $building_civic_origin_neutron_star$]"
 civic_origin_neutron_star_gestalt:0 "$civic_origin_neutron_star$"
 civic_origin_neutron_star_gestalt_desc:0 "$civic_origin_neutron_star_desc$"
 councilor_origin_neutron_star:0 "中子冶炼家"
 councilor_origin_neutron_star_female:0 "$councilor_origin_neutron_star$"
 councilor_origin_neutron_star_desc:0 "中子星是最完美的物质来源，就像在炽热熔炉旁的铁匠，粒子在我们的手中熠熠生辉。"
 councilor_origin_neutron_star_conditional_tooltip:0 "只有与中子星为伴的领袖才能忍受其附近的环境。"
 
 civic_origin_white_hole:0 "天籁之梦"
 civic_origin_white_hole_desc:0 "$origin_white_hole_picture$终于，我们的梦实现了，我们成功地找出了天籁的源头。\n现在，歌声将一直与我们相伴，直到永远。"
 civic_tooltip_origin_white_hole_effects:0 "§Y界旅者§!将获得更多的$dimension_traveler_skill_point$"
 civic_origin_white_hole_gestalt:0 "$civic_origin_white_hole$"
 civic_origin_white_hole_gestalt_desc:0 "$civic_origin_white_hole_desc$"
 councilor_origin_white_hole:0 "白洞歌者"
 councilor_origin_white_hole_female:0 "$councilor_origin_white_hole$"
 councilor_origin_white_hole_desc:0 "就让歌声永远在广袤的星海中回响吧。"
 councilor_origin_white_hole_conditional_tooltip:0 "只有§Y界旅者§!才能担任歌者。"
 
