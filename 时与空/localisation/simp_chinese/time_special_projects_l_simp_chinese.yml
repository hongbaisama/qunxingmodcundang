 DIMENSION_TRAVELER_PROJECT_1:0 "分析白洞视界信号"
 DIMENSION_TRAVELER_PROJECT_1_DESC:0 "分配一艘科研船前往§Y[dimension_traveler_system.GetName]§!星系去解码白洞中传来的神秘信号。"
 DIMENSION_TRAVELER_PROJECT_2:0 "继续分析白洞信号"
 DIMENSION_TRAVELER_PROJECT_2_DESC:0 "分配一艘科研船前往§Y[dimension_traveler_system.GetName]§!星系去解码白洞中传来的神秘信号。"
 DIMENSION_TRAVELER_PROJECT_3:0 "发送信号"
 DIMENSION_TRAVELER_PROJECT_3_DESC:0 "尝试向§Y[dimension_traveler_system.GetName]§!星系中的白洞发送信号。"
 DIMENSION_TRAVELER_PROJECT_4:0 "驶入白洞"
 DIMENSION_TRAVELER_PROJECT_4_DESC:0 "尝试将科研船强行驶入§Y[dimension_traveler_system.GetName]§!星系中的白洞。"
 DIMENSION_TRAVELER_PROJECT_5:0 "再入白洞"
 DIMENSION_TRAVELER_PROJECT_5_DESC:0 "再次尝试将科研船强行驶入§Y[dimension_traveler_system.GetName]§!星系中的白洞。"
 
 DIMENSION_TRAVELER_PROJECT_END_1:0 "超越时空"
 DIMENSION_TRAVELER_PROJECT_END_1_DESC:0 "循环的整体是无法改变的，所以我们仍然无法打破循环。\n\n但是，只要每次都能改变一点，一点，那么在接下来的无数次循环中，总有一次，我们可以突破时空的限制。\n\n[GetDimensionTravelerProjectEndDesc]"
 DIMENSION_TRAVELER_PROJECT_END_2:0 "超越圆环"
 DIMENSION_TRAVELER_PROJECT_END_2_DESC:0 "循环的整体是无法改变的，所以我们仍然无法打破循环。\n\n但是，只要每次都能改变一点，一点，那么在接下来的无数次循环中，总有一次，我们可以突破圆环的限制。\n\n[GetDimensionTravelerProjectEndDesc]"
 DIMENSION_TRAVELER_PROJECT_END_3:0 "超越位面"
 DIMENSION_TRAVELER_PROJECT_END_3_DESC:0 "循环的整体是无法改变的，所以我们仍然无法打破循环。\n\n但是，只要每次都能改变一点，一点，那么在接下来的无数次循环中，总有一次，我们可以突破位面的限制。\n\n[GetDimensionTravelerProjectEndDesc]"
 DimensionTravelerProjectEndDesc_1:0 "§Y<让界旅者担任$councilor_research$或许能获取额外的信息。>§!"
 DimensionTravelerProjectEndDesc_2:0 "§Y<让界旅者管理首都或许能获取额外的信息。>§!"
 
 PC_TIME_PROJECT_1:0 "时间逆流"
 PC_TIME_PROJECT_1_DESC:0 "这片时空的时间非常规律地朝着反方向流动，或许有值得利用的价值。"
 PC_TIME_PROJECT_2:0 "空间旋涡"
 PC_TIME_PROJECT_2_DESC:0 "这片时空的空间非常规律地围着某个中心旋转，或许有值得利用的价值。"
 PC_TIME_PROJECT_3:0 "物质熔炉"
 PC_TIME_PROJECT_3_DESC:0 "这片时空的物质在一片混沌中反复合成又分解，或许有值得利用的价值。"
 PC_TIME_PROJECT_4:0 "折叠维度"
 PC_TIME_PROJECT_4_DESC:0 "这片时空的氛围比其它时空更加压抑，不知背后隐藏着怎样的秘密。"
 PC_TIME_PROJECT_5:0 "位面裂缝"
 PC_TIME_PROJECT_5_DESC:0 "这片时空存在着一道巨大的位面裂缝，我们最好尽快将其修复。"
 PC_TIME_PROJECT_6:0 "虚境生物"
 PC_TIME_PROJECT_6_DESC:0 "这片时空居住着一些没有实体的诡异生命，它们会对我们造成威胁。"
 PC_TIME_PROJECT_MIDDLE_1:0 "测试屏障物理性质"
 PC_TIME_PROJECT_MIDDLE_1_DESC:0 "我们将从光学、力学、电学等层面测试屏障的能力。"
 PC_TIME_PROJECT_MIDDLE_2:0 "查阅屏障历史记载"
 PC_TIME_PROJECT_MIDDLE_2_DESC:0 "我们将从典籍、壁画、传说等层面查阅屏障的来源。"
 PC_TIME_PROJECT_MIDDLE_3:0 "分析屏障组成材料"
 PC_TIME_PROJECT_MIDDLE_3_DESC:0 "我们将从硬度、韧度、刚度等层面分析屏障的构造。"
 
 GAS_COLONY_CHANGE_PROJECT:0 "气态巨行星适应尝试"
 GAS_COLONY_CHANGE_PROJECT_DESC:0 "经过初步勘探，我们的科研船发现了一颗与我们的母星十分相似的气态巨行星。尽管我们暂时无法确定其内部构造，这一消息仍然令我们感到喜悦。\n为了确认我们能否在这颗星球上居住，我们最好分配一艘科研船前往§Y[From.GetName]§!进行适应尝试。"
 
 BREACHING_SHROUD_PSIONIC_PROJECT:0 "重返虚境"
 BREACHING_SHROUD_PSIONIC_PROJECT_DESC:0 "如果我们要重返虚境，哪怕只是暂时的，我们都必须释放一股难以想象的巨大灵能能量。一场巨大的降灵会已做好筹备，[Root.Capital.GetName]新建的通灵者集会所里最强大的通灵者们将参与其中。"
 
 PARALLEL_SKY_PROJECT:0 "研究虚伪星空"
 PARALLEL_SKY_PROJECT_DESC:0 "分配一艘科研船研究§Y[parallel_sky_planet.GetName]§!上虚伪的星空。"
 PARALLEL_SKY_END_PROJECT:0 "研究曲速兽"
 PARALLEL_SKY_END_PROJECT_DESC:0 "分配一艘科研船研究§Y[parallel_sky_planet.star.GetName]§!附近曲速兽的残骸。"
 
 UNDER_THE_HAZE_DATA_PROJECT_1:0 "调查敌方领袖自杀之谜"
 UNDER_THE_HAZE_DATA_PROJECT_1_DESC:0 "敌方领袖很可能不是自杀，但我们需要找到证据。"
 UNDER_THE_HAZE_ACCIDENT_PROJECT_1:0 "调查审讯人员车祸之谜"
 UNDER_THE_HAZE_ACCIDENT_PROJECT_1_DESC:0 "审讯人员很可能不是死于意外，但我们需要找到证据。"
 UNDER_THE_HAZE_DATA_PROJECT_2:0 "$UNDER_THE_HAZE_DATA_PROJECT_1$"
 UNDER_THE_HAZE_DATA_PROJECT_2_DESC:0 "$UNDER_THE_HAZE_DATA_PROJECT_1_DESC$"
 UNDER_THE_HAZE_ACCIDENT_PROJECT_2:0 "$UNDER_THE_HAZE_ACCIDENT_PROJECT_1$"
 UNDER_THE_HAZE_ACCIDENT_PROJECT_2_DESC:0 "$UNDER_THE_HAZE_ACCIDENT_PROJECT_1_DESC$"
 UNDER_THE_HAZE_DATA_PROJECT_3:0 "修复信息载体"
 UNDER_THE_HAZE_DATA_PROJECT_3_DESC:0 "这个信息载体中很可能存储了重要的内容，但在修复它之前谁也无法确定。"
 UNDER_THE_HAZE_SEARCH_PROJECT:0 "调查小队救援行动"
 UNDER_THE_HAZE_SEARCH_PROJECT_DESC:0 "单凭星球上的力量难以在短期内找到调查小队，但借助外太空的科研船的帮助，我们或许可以更快地发现他们的位置，并展开救援行动。"
 UNDER_THE_HAZE_EXCAVATE_PROJECT:0 "清理湖水挖掘行动"
 UNDER_THE_HAZE_EXCAVATE_PROJECT_DESC:0 "湖水源源不断地灌入洞穴中，如果不借助工程船的帮助，我们难以将湖水清理出去，也无法发现基地中蕴藏的秘密。"
 UNDER_THE_HAZE_END_PROJECT:0 "阴霾之下"
 UNDER_THE_HAZE_END_PROJECT_DESC:0 "§Y[under_the_haze_ruler.GetName]§!已经死了，它的残骸或许可以帮助我们了解真相。"
 
 ORIGIN_COLOSSUS_PROJECT_0:0 "准备为悬顶之剑提供能量"
 ORIGIN_COLOSSUS_PROJECT_0_DESC:0 "如果我们做好了充足的准备，我们随时都可以为这艘遗落舰船进行充能。\n\n§Y<需要£energy 5000>§!"
 ORIGIN_COLOSSUS_PROJECT_1:0 "调查悬顶之剑"
 ORIGIN_COLOSSUS_PROJECT_1_DESC:0 "分配一艘科研船研究§Y[Root.Capital_scope.GetName]§!上空的庞然大物。"
 ORIGIN_COLOSSUS_PROJECT_2:0 "深入调查悬顶之剑"
 ORIGIN_COLOSSUS_PROJECT_2_DESC:0 "再次分配一艘科研船研究§Y[Root.Capital_scope.GetName]§!上空的庞然大物。"
 ORIGIN_COLOSSUS_PROJECT_3:0 "为悬顶之剑提供能量"
 ORIGIN_COLOSSUS_PROJECT_3_DESC:0 "分配一艘科研船为§Y[Root.Capital_scope.GetName]§!上空的庞然大物进行充能。"
 ORIGIN_COLOSSUS_PROJECT_4:0 "调查“幽灵”"
 ORIGIN_COLOSSUS_PROJECT_4_DESC:0 "分配一艘科研船调查§Y[origin_colossus_fleet.GetName]§!中的“幽灵”。"
 ORIGIN_COLOSSUS_PROJECT_5:0 "准备改装悬顶之剑"
 ORIGIN_COLOSSUS_PROJECT_5_DESC:0 "如果我们做好了充足的准备，我们随时都可以为§Y[origin_colossus_fleet.GetName]§!进行改装。"
 ORIGIN_COLOSSUS_PROJECT_MIDDLE:0 "改装悬顶之剑"
 ORIGIN_COLOSSUS_PROJECT_MIDDLE_DESC:0 "接纳§H时之螶§!的馈赠，§Y[origin_colossus_fleet.GetName]§!将会焕然一新。"
 
 ORIGIN_MANIFESTI_DREAM_PROJECT:0 "破除桎梏"
 ORIGIN_MANIFESTI_DREAM_PROJECT_DESC:0 "保持清醒，破除梦的桎梏。"
 ORIGIN_MANIFESTI_DREAM_PROJECT_END:0 "第四面墙"
 ORIGIN_MANIFESTI_DREAM_PROJECT_END_DESC:0 "打破§R是个错误§!第四面墙§R是个错误§!，找出§R是个错误§!真相。"
 
 ORIGIN_VOIDSPAWN_PROJECT_1:0 "卵壳假说"
 ORIGIN_VOIDSPAWN_PROJECT_1_DESC:0 "我们需要确认卵壳假说是否正确。"
 ORIGIN_VOIDSPAWN_PROJECT_2:0 "母星拯救者"
 ORIGIN_VOIDSPAWN_PROJECT_2_DESC:0 "我们一定会找出拯救母星的方法。"
 ORIGIN_VOIDSPAWN_PROJECT_3:0 "怒号光明"
 ORIGIN_VOIDSPAWN_PROJECT_3_DESC:0 "黑夜总会过去，黎明必将来临。"
 ORIGIN_VOIDSPAWN_PROJECT_XENOPHILE:0 "安抚虚空孳孽"
 ORIGIN_VOIDSPAWN_PROJECT_XENOPHILE_DESC:0 "它只是一个刚出生的小生命，我们不必和它发生冲突。"
 
 REPAIR_NOAH_ARK_CIVILIAN_PROJECT:0 "重建诺亚方舟"
 REPAIR_NOAH_ARK_CIVILIAN_PROJECT_DESC:0 "我们将重建诺亚方舟为$civilian_arkship_name$。"
 REPAIR_NOAH_ARK_SCIENCE_PROJECT:0 "$REPAIR_NOAH_ARK_CIVILIAN_PROJECT$"
 REPAIR_NOAH_ARK_SCIENCE_PROJECT_DESC:0 "我们将重建诺亚方舟为$science_arkship_name$。"
 
 PIRATE_KING_TRUE_PROJECT_1:0 "窥视深渊"
 PIRATE_KING_TRUE_PROJECT_1_DESC:0 "事情有些蹊跷，舰船的残骸里或许会有什么线索。"
 PIRATE_KING_TRUE_PROJECT_2:0 "质疑深渊"
 PIRATE_KING_TRUE_PROJECT_2_DESC:0 "关于幽灵船长的身份，我们早就有所猜测，但谁都不敢相信。"
 PIRATE_KING_PROJECT:0 "直面深渊"
 PIRATE_KING_PROJECT_DESC:0 "为了结束循环，我们必须直面深渊。"
 PIRATE_KING_PROJECT_END:0 "终结深渊"
 PIRATE_KING_PROJECT_END_DESC:0 "深渊的神明已被我们终结，循环的陷阱已被我们破解，负相的秘密正展露在我们面前。"
 
 TIME_WANDERER_PROJECT:0 "来自过去的幽灵"
 TIME_WANDERER_PROJECT_DESC:0 "对§Y[hole_pets.GetName]§!再次进行研究或许有助于我们获悉游荡奇点的起源。\n\n§R<该项目非常危险，一旦中途打断，界旅者可能会遭受意外！>§!"
 
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_1:0 "$CRISIS_SPECIAL_PROJECT_1$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_1_DESC:0 "一股悄无声息的狂潮席卷了我们的人民。其起源何处已经无从追索，但是他们——不，是我们——某种观念已经开始渗入了我们的内心，认定我们[Root.GetSpeciesNamePlural]一族命中注定应该完成某个更加伟大的事业。我们应该调查是什么造成了这样的“群体性癔症”——耳边响起承诺将统治星河的低声细语的癔症。"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_1:0 "$CRISIS_SPECIAL_PROJECT_MACH_1$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_1_DESC:0 "遍布[Root.GetName]多个恒星系的传感器传来十分微弱、但是完全无法解释的能量涨落。这些能量异常现象十分微小，并不足以扰乱我们的进程，但是我们仍然授权进一步调查以确保我们了解事情的起因。"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_1:0 "$CRISIS_SPECIAL_PROJECT_HIVE_1$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_1_DESC:0 "我们的子个体网络内部感测到了异乎寻常的冲动——一种迫切的想要成为更加伟大存在的追求。一种用统一的思想囊括整个星系的追求。尽管这种追求不来源于我们内部，但其承诺的前景如此诱人，让我们没法置之不顾。我们应该集中全部的精力，找寻这一冲动的起源。"
 
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_2:0 "$CRISIS_SPECIAL_PROJECT_2$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_2_DESC:0 "现存的理论是——我们所处的宇宙和虚境是相互连接的——一个位面发生的大规模扰动事件或行动会对另一个位面产生“涟漪效应”。我们应该好好测试一下这个理论。"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_2:0 "$CRISIS_SPECIAL_PROJECT_MACH_2$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_2_DESC:0 "科学辅助程序已经给出了一个假设，即在我们所熟知的宇宙和代号：“虚境”的维度间存在某种可感知的连接。我们建议就该猜想进行进一步的实验与映射。"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_2:0 "$CRISIS_SPECIAL_PROJECT_HIVE_2$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_2_DESC:0 "我们最杰出的$job_brain_drone_plural$现已确认了当前宇宙与虚境连接的存在。我们必须找到更多与这个现实层面沟通的方法。"
 
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_3:0 "$CRISIS_SPECIAL_PROJECT_3$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_3_DESC:0 "我国实力与日俱增——加之无可否认的使命感将我们整个物种团结在了一起——让我们的科学家确信，我们已经接受来自虚境的注能。"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_3:0 "$CRISIS_SPECIAL_PROJECT_MACH_3$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_3_DESC:0 "边缘假想已经建档。一旦确认，其潜在的利益将会远远超出预测范围。假想概括：[Root.GetName]已经在从代号：“虚境”的空间汲取§Y<<未识别资源>>§!。建议进一步调查。"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_3:0 "$CRISIS_SPECIAL_PROJECT_HIVE_3$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_3_DESC:0 "随着我们夺取的星球愈多，蜂群愈发拓展，我们也能感受到那股冲动愈发强烈。现在这股冲动已经不再是朦胧的感觉，而是一股引导我们迎接即将到来的伟大的洪流——我们的意志将上升。"
 
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_4:0 "$CRISIS_SPECIAL_PROJECT_4$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_4_DESC:0 "是时候寻找一个方法将虚境的能量释放到现世，并驯服这股常人无法理解的能量源泉了。\n\n根据现有的理论，一股足够大的能量激增或许可以撕裂两个位面之间的屏障，最终让两个宇宙合二为一。\n\n虚境天威恢恢然，能者夺之。让我们来夺走吧。"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_4:0 "$CRISIS_SPECIAL_PROJECT_MACH_4$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_4_DESC:0 "科学理论子例程完成了一项新的有关代号“虚境”的假说，其内容包括如何全面地获取虚境释放的能量。\n\n请求：积累更多数据。\n建议行动：将最优能量和行动容量转移至科学分支，并进一步进行扰乱型互动（指令：“天灾”），以在另一位面（代号“虚境”）造成更大的波动。"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_4:0 "$CRISIS_SPECIAL_PROJECT_HIVE_4$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_4_DESC:0 "如果我们要彻底地激发我们的潜势，这条通路就必须打开。这种原始的，双态的现实必须终结。我们必须找到某种办法将两个宇宙合二为一。而在新的现实位面，我们的意志将成为独一无二。"
 
 BEYOND_INFINITY_GAMBLING_PHYSICS_PROJECT:0 "调度时间"
 BEYOND_INFINITY_GAMBLING_PHYSICS_PROJECT_DESC:0 "将迄今为止生产的时间调度至同一点，以此诱导奇点的产生。"
 BEYOND_INFINITY_GAMBLING_SOCIETY_PROJECT:0 "穿透循环"
 BEYOND_INFINITY_GAMBLING_SOCIETY_PROJECT_DESC:0 "利用时空奇点穿透循环的屏障，以与另一个循环相连。"
 BEYOND_INFINITY_GAMBLING_ENGINEERING_PROJECT:0 "稳定奇点"
 BEYOND_INFINITY_GAMBLING_ENGINEERING_PROJECT_DESC:0 "维持奇点的稳定，确保能和奇点的另一侧建立联系。"
 
 BEYOND_INFINITY_SEAL_PROJECT:0 "封印§Y[beyond_infinity_seal_project_target.GetName]§!"
 BEYOND_INFINITY_SEAL_PROJECT_DESC:0 "借助另一个循环的帮助，我们可以对§Y[beyond_infinity_seal_project_target.GetName]§!进行终焉封印。"
 
 BEYOND_INFINITY_TIME_MACHINE_PROJECT:0 "$building_time_machine$"
 BEYOND_INFINITY_TIME_MACHINE_PROJECT_DESC:0 "['concept_building_time_machine']允许我们抵达不同的时空，以便迎来一个新的开始，尽管该技术目前仍停留在理论阶段。"
 BEYOND_INFINITY_CIRCLE_NEXUS_PROJECT:0 "$building_circle_nexus$"
 BEYOND_INFINITY_CIRCLE_NEXUS_PROJECT_DESC:0 "['concept_building_circle_nexus']允许我们直接干涉另一个圆环，让一切朝着正确的方向进行，尽管该技术目前仍停留在理论阶段。"
 BEYOND_INFINITY_DIMENSION_ENGINE_PROJECT:0 "$building_dimension_engine$"
 BEYOND_INFINITY_DIMENSION_ENGINE_PROJECT_DESC:0 "['concept_building_dimension_engine']允许我们在其它位面设立锚点，使所有次元融为一体成为可能，尽管该技术目前仍停留在理论阶段。"
 
 BEYOND_INFINITY_DIMENSIONAL_HORROR_CRISIS_END_PROJECT:0 "命运之陨"
 BEYOND_INFINITY_DIMENSIONAL_HORROR_CRISIS_END_PROJECT_DESC:0 "让这场提前苏醒的浩劫回归它原本的位置。"