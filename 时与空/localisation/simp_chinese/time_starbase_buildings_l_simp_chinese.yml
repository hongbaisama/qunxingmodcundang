l_simp_chinese:
 sm_district_time_usage_cap_module:0 "位面共振引航塔"
 sm_district_time_usage_cap_module_desc:0 "要在无穷无尽的位面中进行安全准确的深度穿梭，利用共振传递信号的引航塔是必不可少的。"
 
 sm_col_time_module:0 "负相升维信号标"
 sm_col_time_module_desc:0 "为了将维度精确提升至与负相时空契合，对视界内的坐标进行完美定位是不可或缺的。"
 
 sm_time_energy_hub:0 "奇点辐射吸收场"
 sm_time_energy_hub_desc:0 "这些装置可以吸收来自奇点的辐射，提高整体发电产出。"
 
 sm_time_minerals_hub:0 "奇点物质解压器"
 sm_time_minerals_hub_desc:0 "这些装置可以将奇点中的物质解压出来，让全新的矿物增产科技得以应用。"
 
 sm_time_food_hub:0 "奇点时间加速仪"
 sm_time_food_hub_desc:0 "这些装置可以利用奇点加速时间，加快作物成熟速度，提高农业产出。"
 
 sm_time_consumer_goods_hub:0 "奇点物流配给站"
 sm_time_consumer_goods_hub_desc:0 "将物流操作转移到可任意扭曲空间的奇点，让配给人员持续在最高效率下运转。"
 
 sm_time_alloys_hub:0 "奇点合金精炼厂"
 sm_time_alloys_hub_desc:0 "在视界外生产的合金在致密的奇点中进行进一步处理，从原本可能浪费掉的副产物中进一步产出可使用的材料。"
 
 sm_time_unity_hub:0 "奇点艺术博物馆"
 sm_time_unity_hub_desc:0 "奇点中汇聚了过去与未来的灵感，在这里的每一件展品都是无法复现的旷世之作。"
 
 sm_time_physics_research_hub:0 "奇点粒子研究所"
 sm_time_physics_research_hub_desc:0 "奇点中的粒子具有极为特殊的性质，对它们的研究可以提高我们对自然法则的理解。"
 
 sm_time_society_research_hub:0 "奇点镜像观测室"
 sm_time_society_research_hub_desc:0 "奇点中存在着无数个镜像宇宙，对它们的观测可以提高我们对社会运转的认知。"
 
 sm_time_engineering_research_hub:0 "奇点现实扭曲域"
 sm_time_engineering_research_hub_desc:0 "奇点中充斥着足以扭曲现实的奇异领域，对它们的利用可以提高我们对物质操纵的技艺。"
 
 
 
 sm_white_hole_recycle_bin_rare:0 "异界资源采集站"
 sm_white_hole_recycle_bin_rare_desc:0 "这颗白洞似乎连接着另一个世界，无数稀有资源在视界边缘缓缓流淌。"
 sm_white_hole_recycle_bin_research:0 "白洞斥力研究站"
 sm_white_hole_recycle_bin_research_desc:0 "这颗白洞的斥力性质与其它白洞存在差异，据说其中蕴藏着一颗黑洞。"
 sm_white_hole_recycle_bin_minerals:0 "白洞物质回收站"
 sm_white_hole_recycle_bin_minerals_desc:0 "白洞源源不断地向外喷涌着物质，若不从源头上回收就太可惜了。"
 sm_white_hole_recycle_bin:0 "$sm_white_hole_recycle_bin_minerals$"
 sm_white_hole_recycle_bin_desc:0 "$sm_white_hole_recycle_bin_minerals_desc$"
 white_hole_recycle_bin_effect:0 "§Y白洞造成的环境危害§G减半§!§!"
 
 
 
 sm_noah_ark:0 "诺亚方舟"
 sm_noah_ark_desc:0 "我们根据诺亚文明的日志复现了诺亚方舟的微缩模型，虽然其实用性并不比正常的舰船高，但其蕴含的精神意义会时刻鼓舞我们的人民。"
 sm_noah_ark_civilian_spinal:0 "文化遗产保存室"
 sm_noah_ark_civilian_spinal_desc:0 "世界上有太多消亡的文化，若是不将它们的遗产保存下来就太可惜了。"
 sm_noah_ark_science_spinal:0 "异种历史研究室"
 sm_noah_ark_science_spinal_desc:0 "世界上有太多灭绝的物种，研究它们的历史或许能对我们有所启发。"
 noah_ark_spinal_effect:0 "根据方舟舰上的§Y物种数§!增强以下效果（§Y存在上限§!）"
 
 sm_akx_hyperspace_specialty:0 "超空间监听哨站"
 sm_akx_hyperspace_specialty_desc:0 "利用异世界的传感技术改进的监听哨站，可以更加清晰地掌握星海的动向，也让我们的人民更具安全感。"
 akx_hyperspace_specialty_effect:0 "§Y可被$councilor_hyperspace_specialty$增强§!"
 akx_hyperspace_specialty_upgrade_effect:0 "§Y可被$councilor_hyperspace_specialty$增强，并额外减少$MOD_PLANET_CRIME_ADD$§!"
 
 sm_nanites_protector:0 "纳米守卫者"
 sm_nanites_protector_desc:0 "我们根据存储元件中记录的数据建造出了这座纳米风暴产生器。它可以瞬间分裂出无数纳米机器人覆盖整个星系，在对敌人的装甲造成不可逆的损伤同时，有选择性地为我们的战舰提供修复职能。"
 sm_nanites_ring_habitation:0 "纳米矩阵节点"
 sm_nanites_ring_habitation_desc:0 "环形世界是曾经的主人所喜爱的巨型结构。\n虽然其原因无从得知，我们也难以对环形世界进行有效的利用，但我们会以自己独特的方式，建设出属于我们的环形矩阵。"
 sm_nanites_study_system:0 "纳米学习系统"
 sm_nanites_study_system_desc:0 "有机体的学习过程太过低效，而作为纳米机器人的我们拥有足够便捷的方式掌握更多的技能。"
 nanites_study_system_effect:0 "£job_maintenance_drone §Y$job_nanites_logistics_drone$§!会根据已建成的§Y区划§!与§Y区域§!提高产出"
 sm_nanites_sapient_network:0 "纳米知性网络"
 sm_nanites_sapient_network_desc:0 "身为数量繁多的纳米机器人，在各单元间组建具备一定智能的网络有利于工作效率的提升。"
 nanites_sapient_network_effect:0 "£job_maintenance_drone §Y$job_nanites_logistics_drone$§!会根据已建成的§Y建筑§!提高产出"
 
 sm_pirate_king_arkship_spinal_devastator_mount: "$sm_arkship_spinal_devastator_mount$"
 sm_pirate_king_arkship_spinal_devastator_mount_desc: "$sm_arkship_spinal_devastator_mount_desc$"
 sm_pirate_king_arkship_building_1:0 "雇佣兵营地"
 sm_pirate_king_arkship_building_1_desc:0 "这群雇佣兵在太空中久经沙场，他们熟悉如何训练合格的战士以及如何增强火炮的威力。"
 pirate_king_arkship_building_1_effect_1:0 "根据§Y$PLANET_CRIME_TITLE$§!提供§Y$MOD_SHIP_HULL_DAMAGE_MULT$§!、§Y$MOD_SHIP_ARMOR_DAMAGE_MULT$§!与§Y$MOD_SHIP_SHIELD_DAMAGE_MULT$§!"
 pirate_king_arkship_building_1_effect_2:0 "根据§Y$PLANET_CRIME_TITLE$§!提供§Y$MOD_PLANET_ARMY_BUILD_SPEED_MULT$§!"
 sm_pirate_king_arkship_building_2:0 "黑市销赃处"
 sm_pirate_king_arkship_building_2_desc:0 "这块销赃处对太空中的所有海盗开放，而我们只会收取他们一点小小的手续费。"
 pirate_king_arkship_building_2_effect:0 "根据§Y$PLANET_CRIME_TITLE$§!与§Y人口数§!产出$r_minerals$与$r_trade$"
 sm_pirate_king_arkship_building_3:0 "先祖造船厂"
 sm_pirate_king_arkship_building_3_desc:0 "通过逆向研究我们先祖的战舰，我们终于领悟了一个道理——拼就完事了，能动就行。"
 pirate_king_arkship_building_3_effect_1:0 "根据§Y$PLANET_CRIME_TITLE$§!提供§Y$MOD_PLANET_BUILDING_CAPACITY_ADD$§!"
 pirate_king_arkship_building_3_effect_2:0 "根据§Y$PLANET_CRIME_TITLE$§!减少§Y$MOD_STARBASE_SHIPYARD_BUILD_COST_MULT$§!"
 sm_pirate_king_arkship_building_4:0 "海盗珠宝行"
 sm_pirate_king_arkship_building_4_desc:0 "海盗抢完了财富却多到没地方花？这家珠宝行保证能掏空每一位水手的腰包，让他们充满干劲地继续下一单。"
 pirate_king_arkship_building_4_effect:0 "根据§Y$PLANET_CRIME_TITLE$§!提供§Y$MOD_POP_BONUS_WORKFORCE_MULT$§!与§Y$MOD_JOB_MAX_WORKFORCE_MULT$§!"
 sm_pirate_king_arkship_building_5:0 "死界魔法阵"
 sm_pirate_king_arkship_building_5_desc:0 "海盗之王留下的诡异魔法阵吸引着我们，我们试探性地将其绘制在方舟舰上，却似乎什么也没有发生？"
 pirate_king_arkship_building_5_effect:0 "根据§Y$PLANET_CRIME_TITLE$§!提供§Y$MOD_SHIP_DAMAGE_REDUCTION_MULT$§!"
 
 
 
