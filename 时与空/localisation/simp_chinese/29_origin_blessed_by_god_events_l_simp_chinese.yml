l_simp_chinese:
 origin_blessed_by_god.2.name:0 "大祭祀圆满完成"
 origin_blessed_by_god.2.desc_1:0 "一年一度的大祭祀就此拉下帷幕，所有人都沉浸在节日的喜悦之中。神明收到了我们献出的礼物，并慷慨地赐予了我们智慧与技术。"
 origin_blessed_by_god.2.desc_2:0 "一年一度的大祭祀就此拉下帷幕，所有人都沉浸在节日的喜悦之中。我们试图深入了解虚境的行为让神明十分高兴，祂大手一挥便帮我们完成了仅凭我们无法实现的突破。"
 origin_blessed_by_god.2.a:0 "愿神明永垂不朽。"
 origin_blessed_by_god.2.b:0 "瞧，我们的原始人朋友刚发现了火。"
 
 origin_blessed_by_god.10.name:0 "神明的谎言"
 origin_blessed_by_god.10.desc:0 "所谓的眷顾只是一场巨大的谎言。\n\n就在我们欣然接受神明的恩赐，准备就此拥抱灵能探索虚境时，神明毫无征兆地夺走了我们的一切。我们的所有领土都被虚境吞噬殆尽，唯一残留的只有我们的母星，还有母星上茫然无知的我们。\n\n是我们的祭祀不够完美吗？是我们献上的礼物不够丰富吗？是我们虔信的心灵不够热枕吗？是我们传教的行为不够真切吗？是我们……都不是，只因为我们太过弱小，我们只不过是神明手中愚昧的玩物，自始至终都是。\n\n神明将我们吃干抹净后就不屑一顾地离开了我们。或许是祂吃饱了？或许是祂遗忘了？或许是祂残恋旧情？或许是祂在羞辱我们？原因已不得而知了。\n\n但是，神明留给了我们一线生机，我们会用我们剩余的力量照着神明的脸来一记重拳，让神明付出应有的代价。"
 origin_blessed_by_god.10.a:0 "我们不会再被任何人抛弃。"
 
 origin_blessed_by_god.20.name:0 "视界信号"
 origin_blessed_by_god.20.desc:0 "就在我们被神明抛弃后不久，§Y[horizonsignal_system.GetName]§!星系的黑洞再一次向我们发来了信号。\n\n我们不清楚它是如何越过无数星系抵达我们的首都，但根据历史记录，自我们屏蔽这道信号以来，黑洞就一直在朝我们发出微弱的信号，直到今天。\n\n回想起来，过去的神明十分厌恶这串信号，这其中是否隐藏了什么秘密？还是说，这只是另一个虚伪的神明抛出的诱饵？"
 origin_blessed_by_god.20.a:0 "分析视界信号。"