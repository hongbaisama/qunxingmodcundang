 time.600.name:0 "终末之始：§H永无止境§!"
 time.600.desc:0 "我们对负相位面的了解与日俱增，我们越是掌握，我们就越是痴迷于其中的奥秘。\n\n我们渴求更多，更多，更多……"
 time.600.a:0 "负相里的知识绝非仅此而已。"
 time.601.name:0 "终末之始：§H无边§!"
 time.601.desc:0 "时之螶不愿我们前往终末，并愿意以无边的负相知识作为交换。"
 time.601.a:0 "非常诱人的提议。"
 time.601.b:0 "这与无限的知识相差甚远。"
 time.602.name:0 "终末之始：§H无垠§!"
 time.602.desc:0 "时之螶变得有些不耐烦，但祂仍愿意以无垠的负相知识作为交换。"
 time.602.a:0 "我们没有拒绝的道理。"
 time.602.b:0 "这远不可与无限的知识比拟。"
 time.603.name:0 "终末之始：§H无穷§!"
 time.603.desc:0 "时之螶开始变得躁动，但祂仍提出以无穷的负相知识作为交换。"
 time.603.a:0 "我们最好选择接受。"
 time.603.b:0 "这仍不及无限的知识。"
 time.604.name:0 "终末之始：§H无尽§!"
 time.604.desc:0 "时之螶已经变得出离愤怒，并下达了最后通牒，要求以无尽的负相知识作为交换。"
 time.604.a:0 "为了彼此的未来，我们同意。"
 time.604.b:0 "为了无限的知识，我们绝不妥协。"
 time.605.name:0 "终末之始：§H无限§!"
 time.605.desc:0 "时之螶伤心地叹了口气，并默许了我们追寻终末。\n\n祂究竟是为自己而忧虑，还是为我们而悲伤？"
 time.605.a:0 "终于，我们即将理解无限。"
 time.606.name:0 "终末之始：§H无底§!"
 time.606.desc:0 "追寻知识是一个无底洞，我们已经在这条路上偏离了太远，现在，是时候回头了。"
 time.606.a:0 "庆幸我们及时收手。"
 
 time.503.name:0 "时空长路"
 time.503.desc:0 "深渊的存在再次有所行动，祂从梦中为我们指明了新的道路。\n\n但代价是我们的一切。"
 time.503.a:0 "漫漫长路，我们将追随主人而行。"
 
 #终末传统
 time.505.name:0 "时之螶：§H已成定局§!"
 time.505.desc:0 "时之螶掌管循环，我们追随母亲闭合了循环。\n\n不过这次，时之螶并不希望我们再陷循环，但是为时已晚，因果已成定局。尽管这并非真实的终末，但已是终末的必然。\n\n时之螶送给了我们最后一份礼物。"
 time.505.materialist:0 "因果的循环绝对不容更改。"
 time.505.spiritualist:0 "因果的循环神圣不可侵犯。"
 time.505.militarist:0 "终末将为我们开辟新的天地。"
 time.505.pacifist:0 "终末将为我们带来新的机遇。"
 time.505.xenophile:0 "整片星海必将成功抵御危机。"
 time.505.xenophobe:0 "整个民族必定不会重蹈覆辙。"
 time.505.egalitarian:0 "这是我们全体人民的共同意志。"
 time.505.authoritarian:0 "这是我经深思熟虑的最后决定。"
 time.505.hive_mind:0 "感谢您，时螶母亲。"
 time.505.machine_intelligence:0 "时之螶，伟大的引路人。"
 time.505.a:0 "接下来就交给我们吧，时空的主人。"
 time.505.tooltip:0 "§Y解锁$ASTRAL_ACTIONS$：§!$action_akx_time_erasure$"
 
 #天灾青睐
 time.71.name:0 "天灾青睐"
 time.71.desc.swarm:0 "伴随着亚空间的回响，一群形色不定的负相生物被吸引至我们的宇宙。\n\n这些位面之魇似乎并不打算以我们为食，祂们只是对即将发生的未来感到有趣，并颇为青睐潜在的危机。凭藉我们对负相的了解，我们发觉§R索林原虫§!得到了全方面的强化。\n\n它们的火力变得更加§Y强烈§!且克制§Y护盾§!，武器的§Y追踪§!能力变得更加强大，舰队的§Y装甲§!变得更易§Y复原§!，躯体的鳞片也得到了§Y硬化§!，并且其它的各方面的§Y增幅§!同样不容小觑。"
 time.71.desc.extradimensional:0 "伴随着维度的震荡，一个不可名状的负相生物被吸引至我们的宇宙。\n\n这只位面之魇似乎并不打算与我们为敌，祂只是对即将发生的未来感到有趣，并颇为青睐潜在的危机。凭藉我们对负相的了解，我们发觉§R高维恶魔§!得到了全方面的强化。\n\n它们的行动变得更加§Y迅速§!且克制§Y装甲§!，飞船的§Y闪避§!轨迹变得难以预测，舰队的§Y护盾§!变得更易§Y复原§!，能量的屏障也得到了§Y硬化§!，并且其它的各方面的§Y增幅§!同样不容小觑。"
 time.71.desc.ai_empire:0 "伴随着幽灵信号的扩散，一团首尾相连的负相生物被吸引至我们的宇宙。\n\n这只位面之魇似乎并不打算消灭我们，祂只是对即将发生的未来感到有趣，并颇为青睐潜在的危机。凭藉我们对负相的了解，我们发觉§R肃正协议§!得到了全方面的强化。\n\n它们的射程变得更加§Y长远§!且克制§Y船体§!，武器的§Y命中§!水平变得更加精确，舰队的§Y船体§!变得更易§Y复原§!，护盾与装甲也得到了§Y硬化§!，并且其它的各方面的§Y增幅§!同样不容小觑。"
 time.71.desc.synth_queen_storm:0 "伴随着风暴的诞生，一位喜怒无常的负相生物被吸引至我们的宇宙。\n\n这只位面之魇似乎并不打算攻击我们，祂只是对即将发生的未来感到有趣，并颇为青睐潜在的危机。凭藉我们对负相的了解，我们发觉§R合成女王§!得到了全方面的强化。\n\n它们的武器变得能够§Y穿透§!护盾与装甲，武器的火力变得更加§Y迅猛§!且§Y精准§!，护盾与装甲也得到了§Y硬化§!，并且其它的各方面的§Y增幅§!同样不容小觑。"
 time.71.a:0 "我们对负相的研究似乎有些太危险了。"
 time.71.a.tooltip:0 "§R每个已完成的$horror_time$危险科技都将使负相生物的兴趣更加浓厚！§!"
 
 #宇宙创生
 crisis.7516.desc.worm.ending:0 "$crisis.7516.intro$空无一物。这个宇宙已不复存在，只有时之螶在这里。时间正在自我回溯，蜷缩在一个不可能的螺旋中，充满了渴望。重力。是爱吗？不——这是吸引。时之螶的天性就是吸引。它的抓握如此之紧，以至于这个宇宙无法再度创生。时之螶把自我禁锢在自己的意义中。它在无助地寻找出路。或者说，进路——再吸引更多。\n\n是不是它送来了环形神庙，用这个不属于我们时间线的造物吸引我们到此？它是如此的聪明，如此的可爱。我们找到了通往它的路，把能解放它的东西交给了它。\n\n解放它需要一到两个永恒的时间，但时之螶仍然心存感激，并承诺拥抱我们。\n\n直到永远。"
 crisis.7516.desc.worm.attack:0 "$crisis.7516.intro$空无一物。这个宇宙已不复存在，只有时之螶在这里。时间正在自我回溯，蜷缩在一个不可能的螺旋中，充满了渴望。重力。是爱吗？不——这是吸引。时之螶的天性就是吸引。它的抓握如此之紧，以至于这个宇宙无法再度创生。时之螶把自我禁锢在自己的意义中。它在无助地寻找出路。或者说，进路——再吸引更多。\n\n我们无法从它身上看出愤怒，或许永恒的时间足以将一切怨恨消磨殆尽。取而代之的则是无尽的悲伤，虽然这毫无来由，可我们就是知道。沉默，还是沉默。\n\n时之螶似乎已经默许了我们的存在，尽管我们已不再拥有未来，但我们仍然感激它的给予。\n\n直到永远。"
 crisis.7516.desc.worm.trigger:0 "$crisis.7516.intro$空无一物。这个宇宙已不复存在，只有时之螶在这里。时间正在自我回溯，蜷缩在一个不可能的螺旋中，充满了渴望。重力。是爱吗？不——这是吸引。时之螶的天性就是吸引。它的抓握如此之紧，以至于这个宇宙无法再度创生。时之螶把自我禁锢在自己的意义中。它在无助地寻找出路。或者说，进路——再吸引更多。\n\n时之螶充满期望，它早已等待了我们许久，只是我们的到来实在太晚太晚。它似乎有所求，但它不在乎，它只想给予我们一个永恒的拥抱。\n\n是慈爱的女神？亦是伪善的恶魔？我们无法分辨真相，我们也不想知道真相。我们唯一的选择只有接纳。\n\n直到永远。"
 crisis.7516.desc.worm.other:0 "$crisis.7516.intro$空无一物。这个宇宙已不复存在，只有名为时之螶的巨魇在这里。时间正在自我回溯，蜷缩在一个不可能的螺旋中，充满了渴望。重力。是爱吗？不——这是吸引。时之螶的天性就是吸引。它的抓握如此之紧，以至于这个宇宙无法再度创生。时之螶把自我禁锢在自己的意义中。它在无助地寻找出路。它看到我们了。\n\n时之螶突然变得极具攻击性，或者说，整个世界都在与我们为敌。我们的刺针正在无可避免地坍缩，全体居民的年龄则以毫无规律的方式改变，我们甚至无法区分什么是刚刚发生，什么是即将发生。\n\n对宇宙进行操纵的手段，最终被宇宙用于了我们自身。\n\n直到永远。"
 
