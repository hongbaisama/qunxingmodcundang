 akx_gestalt_messenger_stage_3:0 "末尾"
 situation_akx_gestalt_messenger_complete_effect:0 "我们将完成信使网络的构建。"
 situation_akx_gestalt_messenger_fail_effect:0 "我们将阻止信使网络的构建。"
 
 time_akx.101.name:0 "信使：终末访客"
 time_akx.101.desc:0 "彼岸之门缓缓开启，一群穿着古怪的§Y[owner.GetSpeciesName]§!走了出来，我们一眼便认出他们就是先前逃生舱中的信使物种。他们自称来自未来，并希望与我们分享他们的经历。\n\n据说，世界的未来充满灾厄，每一颗星球上都堆满了城市的废墟，每一个星系中战舰进退都针锋相对。所有的星际国家都撕毁了往日的盟约，深化了彼此的芥蒂，互相角逐着唯我独尊的银河霸主，为了免遭吞噬的命运而挣扎。"
 time_akx.101.a:0 "真是可怕的未来。"
 
 time_akx.102.name:0 "信使：灾厄挽歌"
 time_akx.102.desc:0 "彼岸之门再度开启，更多的§Y[owner.GetSpeciesName]§!抵达了§Y[target.GetName]§!，同样有着透明化的身体特征。\n\n他们说，未来变得黑暗，一切的结果都源于恐怖负相物质的发现——最顶尖的科学官对恐怖负相物质进行了研究，发现它拥有一些诡异的性质。利用恐怖负相物质，人们可以在一定程度上扭曲时空与位面，并前往无穷的过去掠夺富裕的资源。正是由于资源的消逝，使得宇宙循环彻底脱离正轨，也使世界破损成为现实。\n\n但是，这批旅者携带的穿越装置已经耗尽能源，因此，他们恳请我们提供一笔资金，以便于他们逃往过去。"
 time_akx.102.a:0 "我还想了解更多终末的秘密。"
 time_akx.102.b:0 "他们就是一群骗子！"
 
 # 结局1
 time_akx.103.name:0 "信使：黑暗时代"
 time_akx.103.desc:0 "彼岸之门最后一次开启，一大群§Y[owner.GetSpeciesName]§!拜访了我们的星球，我们从他们身上感受到了时空的流动。\n\n他们声称，终末已经进入了黑暗时代，拥有着未来的任何一个时间点都无法比拟的混乱，因此，除了那些迷失方向的可怜人，已经没有人需要回到未来了。他们已经是最后一批穿梭时空的旅者，不过他们苦苦哀求我们改写终末，希冀破除黑暗时代的无尽灾厄。\n\n这群来自终末的信使休整完毕便重返了彼岸之门，此后，大门紧紧关闭，再也不曾开启。"
 time_akx.103.a:0 "为终末的覆灭哀悼。"
 
 
 
 time_akx.111.name:0 "信使：未来访客"
 time_akx.111.desc:0 "彼岸之门缓缓开启，一群穿着古怪的§Y[owner.GetSpeciesName]§!走了出来，我们一眼便认出他们就是先前逃生舱中的信使物种。他们自称来自未来，并希望与我们分享他们的经历。\n\n据说，世界的未来充满美好，每一颗星球上都建满了繁荣的都市，每一个星系中货船来往都有条不紊。所有的星际国家都抛弃了往日的成见，消弭了彼此的隔阂，共同组建了团结一致的星海联邦，为了创建美好的目标而奋斗。"
 time_akx.111.a:0 "真是美好的未来。"
 
 time_akx.112.name:0 "信使：希望赞歌"
 time_akx.112.desc:0 "彼岸之门再度开启，更多的§Y[owner.GetSpeciesName]§!抵达了§Y[target.GetName]§!，同样有着透明化的身体特征。\n\n他们说，未来变得光明，一切的原因都在于恐怖负相物质的发现——最顶尖的科学官对恐怖负相物质进行了研究，发现它拥有一些奇妙的性质。利用恐怖负相物质，人们可以在一定程度上扭曲时空与位面，并前往无穷的过去采集富裕的资源。正是由于资源的涌进，使得星海文明彻底脱离竞争，也使银河一统成为可能。\n\n但是，这批旅者携带的穿越装置已经耗尽能源，因此，他们恳请我们提供一笔资金，以便于他们重返未来。"
 time_akx.112.a:0 "我还想听到更多未来的故事。"
 time_akx.112.b:0 "他们就是一群骗子！"
 
 # 结局2
 time_akx.113.name:0 "信使：光明时代"
 time_akx.113.desc:0 "彼岸之门最后一次开启，一大群§Y[owner.GetSpeciesName]§!拜访了我们的星球，我们从他们身上感受到了时空的流动。\n\n他们声称，未来已经进入了光明时代，拥有着过去的任何一个时间点都无法比拟的辉煌，因此，除了那些开采资源的工作者，已经没有人需要回到过去了。他们已经是最后一批穿梭时空的旅者，不过他们非常欢迎我们前往未来，共同享受光明时代的无限美好。\n\n这群来自未来的信使参观完毕便重返了彼岸之门，此后，大门紧紧关闭，再也不曾开启。"
 time_akx.113.a:0 "为未来的辉煌欢呼。"
 
 
 
 # 结局3
 time_akx.120.name:0 "信使：疑神疑鬼"
 time_akx.120.desc:0 "经过一番坎坷的审讯，我们认定从彼岸之门中出来的人都是骗子，那接下来我们该如何处置他们？"
 time_akx.120.a:0 "让他们留下来，并为自己的欺瞒行为赎罪。"
 time_akx.120.a.tooltip:0 "获得数名§Y信使§!"
 time_akx.120.b:0 "将他们驱逐到门的彼端，并把这装神弄鬼的破门碾成残渣！"
 
 
 
 time_akx.131.name:0 "信使：平行终端"
 time_akx.131.desc:0 "更多的子个体加入了这个异常的网络，并且网络中的子个体变得有些古怪。\n\n经过与信使网络的沟通，我们得知，这一网络并存于门外与门内，而门内的世界是另一个平行宇宙。这些子个体并非异常，而是在尝试与平行的“我们”进行连接，尽管这一举动并未得到我们的授权。"
 time_akx.131.a:0 "有趣。"
 
 time_akx.132.name:0 "信使：谜语答案"
 time_akx.132.desc:0 "随着我们的放任，异常网络的规模与日俱增，且网络中的子个体出现了透明化的身体特征。\n\n这次，信使网络主动与我们联络，并表示平行的“我们”正在进行无穷无尽的演算，似乎在寻找某种谜语的答案。信使网络希望我们可以为演算提供帮助，并笃定谜语的答案对我们至关重要。"
 time_akx.132.a:0 "我们也渴望答案。"
 time_akx.132.b:0 "你们已经彻底陷入了混乱。"
 
 # 结局4
 time_akx.133.name:0 "信使：何为问题"
 time_akx.133.desc:0 "信使网络的成员数量早已今非昔比，且子个体身上似乎附带着时空的流动。\n\n平行世界的演算似乎十分顺利，信使网络向我们传来了源源不断的数据，这些或许就是所谓的谜语答案。然而，它们并没有告诉我们，或者说，它们也不知道，这些答案的问题是什么。我们不知道问题，也无从利用答案。\n\n现如今，信使网络又开始忙碌了，它们计划在平行世界中寻觅何为问题。"
 time_akx.133.a:0 "问题是什么？"
 
 # 结局5
 time_akx.134.name:0 "信使：干扰讯息"
 time_akx.134.desc:0 "经过一番分析调查，我们最终确信，这扇奇异的大门会发出干扰的讯息，并让子个体们进入异常状态，也就导致了所谓“信使网络”的构建。"
 time_akx.134.a:0 "让“信使网络”为我们所用。"
 time_akx.134.b:0 "利用研究结果，摧毁这扇古怪的大门。"
 
 
 
 #命中相会
 syzygy_admiral_digsite:0 "终末行舟"
 syzygy_admiral_digsite_desc:0 "在黑洞中驶出了一艘诡异的舰船，却又在中途停止运作。\n\n它究竟来自哪里，因什么而现身，又为何停下了脚步？"
 syzygy_admiral_digsite_stop_tooltip:0 "§R破译行动目前毫无进展§!"
 no_syzygy_admiral_tooltip:0 "§R我们或许永远都无法解开这个谜团了§!"
 requires_can_approach_black_hole_tooltip:0 "§R这艘舰船离黑洞太近，只有能['concept_can_approach_black_hole']的领袖才可进行探索§!"
 requires_worm_tomb_ending_digsite:0 "§R这艘舰船离黑洞太近，我们无法调查§!"
 
 time_akx.200.name:0 "命中相会：终末行舟"
 time_akx.200.desc:0 "近日，有人目击到从§Y[syzygy_admiral_planet.GetName]§!中驶出了一艘诡异的舰船。\n\n这艘舰船才刚驶出视界便停止了运作，似乎耗尽了所有的能源。对舰船的扫描显示，船上没有任何生命的信号，我们只能猜测船的驾驶者在这一过程中死去，或是这艘船根本就没有驾驶者。"
 time_akx.200.a:0 "调查这艘舰船。"
 
 time_akx.201.name:0 "深渊之眼"
 time_akx.201.desc:0 "我们的科学官仔细调查了这艘舰船的外部，却没能发现任何一个出入口。\n\n调查小组最初尝试使用激光在船体上切割出入口，但这一尝试以失败告终，他们的激光根本无法对船体造成任何影响。或许我们可以尝试用舰船的武器对其进行攻击，但我们无法确保这一举措的后果，谨慎的调查小组很快就否决了这个方法。\n\n最终，调查成员们决定从舰船尾部的推进器处寻找进入的通道，意外地发现这艘飞船的引擎仍在运作。最大的排料口的孔径刚好容许调查小组进入，而漆黑深邃的内部则好似深渊的眼睛，默默地注视着黑洞之外的一切。"
 time_akx.201.a:0 "令人不寒而栗。"
 
 time_akx.202.name:0 "视界之内"
 time_akx.202.desc:0 "调查小组成功地进入了飞船内部，却发现了一些奇特的现象。\n\n在这艘舰船上，竟然没有任何一个计时装置，仿佛时间对于舰船上的乘客没有任何意义。但很快，就有调查成员发现了其它的异常——所有调查小组携带进来的计时装置的示数都各不相同，有的示数跳得飞快，有的示数变化得缓慢，有的示数就此保持不变，甚至有的示数反而愈来愈小。\n\n种种异常都让调查小组怀疑自己是否误入了视界之内，但从飞船外部观测，他们确确实实是处于黑洞以外的。"
 time_akx.202.a:0 "视界的界限究竟在哪里？"
 
 time_akx.203.name:0 "净化之光"
 time_akx.203.desc:0 "一群未知的物体袭击了调查小组。\n\n当调查小组继续深入舰船时，一群漆黑得无法辨识的黏性物体突然从阴影中对他们发起了攻击。调查成员一旦被这物体缠上就无法挣脱，并最终被黑暗吞噬，而那物体也因此变得更加巨硕。就在调查小组即将全军覆没时，周围的墙体上突然射出了无数道炽热的激光，击退了那群恐怖的物体。\n\n未被完全吞噬的幸存者得以生还，但绝大多数都损失了身体的某些部位。[maimed_leader.GetName]虽然幸运地并没有被袭击，但[maimed_leader.GetHeShe]被无差别攻击的净化之光严重烧伤，所幸没有生命危险。"
 time_akx.203.a:0 "他们的牺牲值得我们铭记。"
 
 time_akx.204.name:0 "未来之声"
 time_akx.204.desc:0 "经过一段时间的休息重整后，新的调查小组继续朝深处出发。\n\n调查成员们抵达了类似飞船核心的区域，但通往内部的门被封锁了。破译小队试图解开电子锁的密码，却意外地触发了警报，但警报却并未激活任何机关，原来只是虚惊一场。破译行动进行得很顺利，直到最后一步——显示屏上突然出现了一个谜题，我们不知道谜题的内容，因为破译小组的每个人所看到的谜面都不同，且会随着时间流逝而发生变化。\n\n一个熟悉的声音传到了调查小组的耳边：“已行之事，终将再行；将行之事，必为已行。”"
 time_akx.204.a:0 "我对这句话有印象。"
 # 结局1
 time_akx.204.b:0 "这是一道无解的谜题。"
 time_akx.204.b.tooltip:0 "§R我们或许永远都无法解开这个谜团了§!"
 
 time_akx.205.name:0 "希望之名"
 time_akx.205.desc:0 "[GetTimeAkxDesc205]"
 time_akx.205.desc_1:0 "在命中注定相会的二人重逢后，通往核心的门便敞开了。\n\n调查小组仔细地查阅了飞船上的所有日志和文献，并逐渐了解了真相。这艘船来自30000多年后的未来，那个时候，世界出现了一种未曾设想的危机，并且没有任何一个维度文明有能力解决。时间旅者们提议通过负相位面前往过去避难，这一方案最初进行得一帆风顺，但很快，就由于不可抗力而爆发了混乱，这也导致了负相文明的不满与愤怒。矛盾的加剧进一步促使天灾的扩散，而天灾的扩散也推进着矛盾的加剧，最终，整个时空都因污染而支离破碎。\n\n一位传奇的舰长驾驶着只剩一人的避难飞船，利用独特的能力突破了时空的界限，成功抵达了另一个因果循环，§R但代价是就此从时空之中被抹除§!。\n\n而这艘舰船是来自被毁灭的因果的最后礼物。"
 time_akx.205.desc_2:0 "（这段记忆被从时空中抹除了。）"
 time_akx.205.a:0 "以希望之名起誓，我们将改变这样的灾难。"
 
 # 结局2
 time_akx.206.name:0 "命中相会：时空之外"
 time_akx.206.desc:0 "这艘来自时空之外的舰船中，所有不属于这个因果的事物都已经被抹除了。因此，我们获得了它的完整掌控权，但也遗失了它的过去与未来。"
 time_akx.206.a:0 "刚刚发生了什么？"
 time_akx.206.a.tooltip:0 "§R《错误错误错误》§!"
 time_akx.206.b.tooltip:0 "§Y界旅者§!拥有了专属的战舰，所以她也是§Y战舰少女§!！"
 
 SYZYGY_ADMIRAL_TITLE:0 "命定之遇"
 time_akx.207.name:0 "[mirrored_syzygy_admiral.GetName]"
 time_akx.207.desc:0 "我们又再会了。\n\n就像我说过的，时间是一个迷宫，圆环是始也是终，时之螶需要它的祭品这么做。"
 time_akx.207.a:0 "时间为什么是个迷宫？"
 time_akx.207.a.response:0 "时间是迷宫是因为时间是迷宫，正如乌鸦就像写字台。"
 time_akx.207.b:0 "圆环为何是始也是终？"
 time_akx.207.b.response:0 "因为圆环没有始也没有终，你能从一个圆圈里找出它的起点和尽头吗？"
 time_akx.207.c:0 "时之螶的目的是什么？"
 time_akx.207.c.response:0 "不过是为了让循环里装点什么，以免不可一世的孩子闯出大祸。"
 time_akx.207.d:0 "这是最后一个问题，你吸引我过来是要做什么？"
 time_akx.207.d.response:0 "当然是要任命你为这艘船的舰长了，我现在将所有权限都转交给你。虽然我就是你，但你不是我。\n\n我的使命完成了，接下来就是你的任务了，§R唯有你才能驾驶这艘方舟偏离既定的未来§!。"
 
 # 结局3
 time_akx.208.name:0 "命中相会：希望之陨"
 time_akx.208.desc:0 "终末行舟被摧毁了，来自未来的希望就此在我们手中陨落。"
 time_akx.208.a:0 "我们食言了……"
 
 time_akx.209.name:0 "梦中虚影"
 time_akx.209.desc:0 "一群衣着古怪的神秘人包围了§Y[mirrored_syzygy_scientist.GetName]§!。\n\n他们并未对调查专员发起攻击，而是以此起彼伏的诡异语调反复陈述着几个词汇：“停止”、“放弃”、“徒劳”、“原点”。§Y[mirrored_syzygy_scientist.GetName]§!鼓起勇气掀开了其中一人的面纱，竟惊讶地发现那人与自己长相完全一致。其它人也纷纷卸下伪装望向[mirrored_syzygy_scientist.GetHerHim]——他们全都是§Y[mirrored_syzygy_scientist.GetName]§!自己。\n\n§Y[mirrored_syzygy_scientist.GetName]§!猛地从噩梦中苏醒，周围空无一人，只有死一般的寂静。这一切究竟是真是假，或许只有§Y[mirrored_syzygy_scientist.GetName]§!自己清楚了。"
 time_akx.209.a:0 "梦未必就是现实。"
 time_akx.209.b:0 "现实也未必是梦。"
 
 time_akx.215.name:0 "曲速涟漪"
 time_akx.215.desc:0 "由于§Y[From.GetName]§!星系的维度风暴，一些熟悉又陌生的太空生物利用曲速穿梭到了我们的宇宙，它们所泛起的涟漪似乎表明来者不善。"
 time_akx.215.a:0 "准备迎战。"
 
 time_akx.216.name:0 "曲速扭转"
 time_akx.216.desc:0 "由于§Y[From.GetName]§!星系的维度风暴，一些庞大的曲速生物出现在了我们的位面里，它们所引发的扭转现象已经散布在整片星系。"
 time_akx.216.a:0 "将它们驱逐出境。"
 
 time_akx.220.name:0 "命中相会：希望使者"
 time_akx.220.desc:0 "未来使者今非昔比，它已变得更加接近原本的面貌。这艘来自异世的舰船正蓄势待发，它将成为所有人最后的希望。"
 time_akx.220.a:0 "它就是播撒一切希望的希望。"
 
 time_akx.225.name:0 "命中相会：终末使者"
 time_akx.225.desc:0 "希望使者与过去大相径庭，它已与最初的面貌相差无几。这艘来自终末的舰船沉默不语，但其所承载的历史正倾诉着一切。"
 time_akx.225.a:0 "它便是终结一切灾厄的灾厄。"
 
 
 
 #神之圆环
 time_akx.300.name:0 "神之圆环：李代桃僵"
 time_akx.300.desc:0 "从§Y[coils_planet.System.GetName]§!传来了骇人听闻的消息。\n\n曾经热衷于“神之圆环”宗教活动的那个前超光速文明的母星——§Y[coils_planet.GetName]§!，在一瞬间变成了一颗黑洞。然而，§Y[coils_country.GetName]§!却安然无恙，并出现在了星系中的另一颗星球§Y[new_coils_planet.GetName]§!上——那本来并非一颗宜居星球！不仅如此，他们现在重新拾起了“神之圆环”的信仰，并疯狂进行着神秘的仪式。\n\n我们发现他们似乎有意提防着天空，难道他们察觉到我们了？"
 time_akx.300.a:0 "“神之圆环”背后一定有不为人知的秘密。"
 time_akx.300.a.tooltip:0 "我们可以对§Y[coils_country.GetName]§!进行一项新的§Y谍报行动§!。"
 time_akx.310.name:0 "神之圆环：鸠占鹊巢"
 time_akx.310.desc:0 "从§Y[coils_planet.System.GetName]§!传来了骇人听闻的消息。\n\n曾经热衷于“神之圆环”宗教活动的那个前超光速文明的遗址——§Y[coils_planet.GetName]§!，变成了一颗死寂星球，并在一夜之间发展出了新的文明。名为§Y[coils_country.GetName]§!的前超光速文明正安逸地生活在星球之上，他们遵循着“神之圆环”的引导，在世界各地举行着神秘的仪式。\n\n我们发现他们时常仰望天空，但似乎并未察觉到我们的存在。"
 time_akx.310.a:0 "“神之圆环”背后一定有耐人寻味的起因。"
 time_akx.310.a.tooltip:0 "我们可以对§Y[coils_country.GetName]§!进行一项新的§Y谍报行动§!。"
 
 operation_coils_god:0 "调查圆环之谜"
 operation_coils_god_desc:0 "[root.target.GetName]所经历的种种都充满神秘，我们应当调查圆环之谜。\n\n§R请不要开启“自动执行”功能，否则可能错过部分剧情！§!"
 operation_coils_god_on_success:0 "$IF_SUCCESSFUL|E$\n我们或许能发现神之圆环的真相。\n\n[owner.GetDisguiseState]"
 
 time_akx.321.name:0 "神之圆环：迷城"
 time_akx.321.desc:0 "我们的特工已经成功地潜入了§Y[new_coils_planet.GetName]§!上的一座城市。\n\n然而，这座城市错综复杂，宛如一个循环往复的迷宫，我们的特工还需要一段时间才能熟悉这里。"
 time_akx.321.a:0 "成功的第一步。"
 
 time_akx.322.name:0 "神之圆环：集会"
 time_akx.322.desc.1:0 "我们的特工意外地闯入了§Y[coils_country.GetName]§!所举行的一场宗教集会。\n\n尽管特工们确信自己并没有暴露，但参与集会的当地居民仍对我们的特工抱有极大的敌意与警惕性。在这场集会中举行了数个意义不明的仪式——主要内容都和圆有关，而我们的特工由于不了解仪式的细节而被愤怒的集会者赶了出来。\n\n这场集会中似乎并没有什么值得关注的地方，我们的特工或许需要着手于其它地方。"
 time_akx.322.desc.2:0 "我们的特工意外地闯入了§Y[coils_country.GetName]§!所举行的一场宗教集会。\n\n我们的特工似乎伪装得非常完美，参与集会的当地居民非常热情地邀请我们的特工加入。在这场集会中举行了数个意义不明的仪式——主要内容都和圆有关，尽管我们的特工并不了解仪式的细节，但友善的集会者并没有在意他们的失态。\n\n但非常可惜，这场集会中并没有发现什么有价值的信息，我们的特工或许需要着手于其它地方。"
 time_akx.322.a:0 "我们必须更小心谨慎了。"
 time_akx.322.b:0 "事情的进展意外地顺利。"
 
 time_akx.323.name:0 "神之圆环：神庙"
 time_akx.323.desc:0 "我们的特工在郊外发现了一座废弃的神庙。\n\n这座神庙从外部看来占地面积并不大，但穿过大门，其内部的空间却异常地开阔。我们的特工尝试从中搜寻与神之圆环有关的物品，但大多是一些造型怪异的圆形祭祀用具，唯一或许值得深入调查的就是祭坛中央的石碑。"
 time_akx.323.a:0 "值得一试。"
 
 time_akx.324.name:0 "神之圆环：石碑"
 time_akx.324.desc:0 "对石碑的调查工作并不顺利。\n\n石碑上满是一些造型各异的圆圈，却以某种特定的形式整齐地排列在一起，显然，这是一种独特的文字。经过一番尝试，我们的特工从中解读出了“原点”、“终结”、“彼岸”、“镜像”等词汇，但距离完全破译仍有很大的差异。"
 time_akx.324.a:0 "充满宗教意味的词语。"
 
 time_akx.325.name:0 "神之圆环：彼岸"
 time_akx.325.desc.1:0 "就在我们的特工即将破译完成时，一群§Y[coils_country.GetName]§!的祭司突然向神庙接近。\n\n我们的特工匆忙收拾好破译用具，并尽可能使神庙内的物件维持原状，随后便躲在了祭坛后的挡板背面。祭司们进入神庙后就手牵着手围在了石碑的周边，嘴里念叨着一些古怪的咒语，但从发音上判断似乎与石碑上的内容类似。\n\n眨眼间，连同我们潜伏中的特工，神庙中的所有人都被传送到了一个诡异的空间。据称，无数个§Y[new_coils_planet.GetName]§!上发生灾难的情景充斥着整个空间，就像是无数个平行宇宙在此刻叠加在了一起。"
 time_akx.325.desc.2:0 "就在我们的特工即将破译完成时，一群§Y[coils_country.GetName]§!的祭司突然向神庙接近。\n\n我们的特工匆忙收拾好破译用具，并大胆地前去迎接祭司，试图通过伪装以了解石碑的秘密。祭司们默许了特工们的加入，他们手牵着手围在了石碑的周边，嘴里念叨着一些古怪的咒语，但从发音上判断似乎与石碑上的内容类似。\n\n眨眼间，连同我们伪装中的特工，神庙中的所有人都被传送到了一个诡异的空间。据称，无数个§Y[new_coils_planet.GetName]§!上发生灾难的情景充斥着整个空间，就像是无数个平行宇宙在此刻叠加在了一起。"
 time_akx.325.a:0 "难道这就是石碑上所说的彼岸？"
 
 time_akx.326.name:0 "神之圆环：圆环"
 time_akx.326.desc.1:0 "“你们这群愚昧无知的外来者，怎么胆敢玷污我们神圣的圆环仪式？”祭司们愤怒地质问着我们的特工。\n\n“白痴们，我们全都困在了这无穷无尽的循环里，只有向圆环之神祈求宽恕，我们才有可能打破这循环。而你们，一而再再而三地阻碍着我们的计划！”祭司们继续吼着，“但是，你们的愚蠢行径早已无法阻止我们，我们现在就要前往循环之外的彼岸，和这个糟糕透顶的混蛋世界说再见！”\n\n在我们的特工目瞪口呆之下，这群祭司，连同星球上的所有居民，都在转瞬间消失不见，仿佛他们从未存在过。一枚金质的圆环戒指掉落在了地上，发出清脆的叮当声，眨眼间，我们的特工便回到了神庙。\n\n圆环上刻着：“给予迷失者的教训”。"
 time_akx.326.desc.2:0 "“困于循环而不自知的可怜人，你们也渴望了解圆环背后的真相吗？”祭司们柔和地询问着我们的特工。\n\n“虔信者，我们全都困在了这无穷无尽的循环里，只有向圆环之神祈求宽恕，我们才有可能打破这循环。很高兴你们曾加入过我们的仪式，尽管那是一次失败的尝试。”祭司们继续说着，“不过，吸取了上次的教训，我们确信很快就能抵达循环之外的彼岸，但也不得不和你们说再见了。”\n\n在我们的特工目瞪口呆之下，这群祭司，连同星球上的所有居民，都在转瞬间消失不见，仿佛他们从未存在过。一枚金质的圆环戒指掉落在了地上，发出清脆的叮当声，眨眼间，我们的特工便回到了神庙。\n\n圆环上刻着：“赠予虔信者的宝藏”。"
 # 结局1
 time_akx.326.a:0 "这该死的圆环到底是什么？"
 # 结局2
 time_akx.326.b:0 "这神秘的圆环究竟是什么？"
 
 
 
 #圣仆
 akx.9620.desc_time:0 "高科技球体满怀感激地吸收了所有资源，然后就没有任何通讯回应了。接着她在没有任何预兆的情况下开始向外辐射能量，射出的光线的亮度足以使人受伤，你赶紧撤回。这时黑洞有了反应。周围的空间开始扭曲翻腾，这一切都和视界信号事件所描述的状况十分吻合。高科技球体现在是蓝白色的。突然它开始变亮然后冷却下来，只剩下了一些矿渣。\n\n那个名为摘录者的造主回归了么？恒星系里没有任何智慧生命的痕迹。但是探测器却发现黑洞的辐射数据出现了大幅波动，各项指标都在逐渐趋近于某个熟悉的星体。最终，§Y$NAME_Gargantua$§!变成了一颗§H时空黑洞§!——我们生存了数亿年的母星。\n\n我们的母星最初也是这么形成的吗？我们与摘录者之间存在什么关系吗？这一切都是§H时之螶§!所设计好的吗？我们不知道答案，或许我们永远也无法找到答案，或许我们本身就是答案。"
 akx.9620.b:0 "永生！"
 
 hole_pets_categories_1:0 "黑洞压缩"
 hole_pets_categories_1_desc:0 "这一黑洞发生了超乎预料的异常现象，我们需要对其进行调查。"
 hole_pets_categories_2:0 "视界信号"
 hole_pets_categories_2_desc:0 "这一黑洞再次产生骤变，并发出了神秘的视界信号。"
 hole_pets_categories_3:0 "最后的最后"
 hole_pets_categories_3_desc:0 "这一黑洞已经抵达了它的终点，我们对未知的探索也抵达了终点。"
 
 time_akx.400.name:0 "圣仆：黑洞压缩"
 time_akx.400.desc.1:0 "当我们的传感器再次朝§Y[hole_pets.GetName]§!发出信号时，我们的计算机得出了一个惊人的结果：这颗黑洞变小了。\n\n没有任何证据表明有任何物体或者力场对该黑洞施加了作用，我们只能假设它是凭借自身的引力将自己压缩了。这一奇特的现象远超我们原有科学理论的预料，或许能为我们带来更多的基础理论进步。"
 time_akx.400.desc.2:0 "当我们的探索者再次前往§Y[hole_pets.GetName]§!所处的时空后，他们得出了一个惊人的结果：这颗黑洞变小了。\n\n没有任何证据表明有任何物体或者力场对该黑洞施加了作用，我们只能假设它是凭借自身的引力将自己压缩了。这一奇特的现象远超我们原有科学理论的预料，或许这颗黑洞与我们的母星存在更多的相似点。"
 time_akx.400.a:0 "派出更多的研究者。"
 time_akx.400.b:0 "派出更多的探索者。"
 
 time_akx.401.name:0 "圣仆：未解之谜"
 time_akx.401.desc.1:0 "我们的研究并未取得实质性进展。\n\n§Y[hole_pets.GetName]§!附近的引力场与辐射强度均处于稳定且正常的范围内，这表明该黑洞并未处于缩小的过程中，或许这已经是其压缩的极限。然而，仍然有少量异常数据值得研究，这或许是我们唯一的收获。"
 time_akx.401.desc.2:0 "我们的探索并未取得实质性进展。\n\n§Y[hole_pets.GetName]§!附近的时间轴与维度曲率均处于稳定且正常的范围内，这表明该黑洞并未处于缩小的过程中，或许这已经是其压缩的极限。然而，一些原本混乱无序的时空已被成功探明，这或许是我们唯一的收获。"
 time_akx.401.a:0 "令人遗憾。"
 time_akx.401.b:0 "令人惋惜。"
 
 time_akx.402.name:0 "圣仆：视界信号"
 time_akx.402.desc.1:0 "时隔数年，§Y[hole_pets.GetName]§!再一次发生了突变。\n\n这颗黑洞再一次奇迹般地缩小了，并且整个变化过程就在一瞬间，短暂到我们最精密的传感器都无法检测。与此同时，从黑洞中传来了神秘的视界信号，而这并非源于时之螶。"
 time_akx.402.desc.2:0 "时隔数年，§Y[hole_pets.GetName]§!再一次发生了突变。\n\n这颗黑洞再一次奇迹般地缩小了，并且整个变化过程就在一瞬间，短暂到我们最老练的探索者都无法发觉。与此同时，从黑洞中传来了神秘的视界信号，而这并非源于时之螶。"
 time_akx.402.a:0 "分析视界信号。"
 time_akx.402.b:0 "倾听视界信号。"
 
 time_akx.403.name:0 "圣仆：圆环使者"
 time_akx.403.desc.1:0 "视界信号的分析结果出来了，其内容令人震惊。\n\n这则离奇信号的署名是无限神机。那颗神秘的高科技球体进入黑洞后似乎并未被彻底摧毁，相反，其意识仍然弥漫在黑洞之中，并履行着自己的使命。而这则信号便是无限神机经过无数个时间周期的调查后，根据研究结果发向黑洞外的数据报告。在黑洞中的数据对于我们而言弥足珍贵，这将使我们对基本法则的了解获得极大的提升。"
 time_akx.403.desc.2:0 "视界信号的解析结果出来了，其内容令人震惊。\n\n这则离奇信号的署名是无限神机。那颗神秘的高科技球体进入黑洞后似乎并未被彻底摧毁，相反，其意识仍然弥漫在黑洞之中，并履行着自己的使命。而这则信号便是无限神机经过无数个时间周期的调查后，根据研究结果发向黑洞外的数据报告。无限神机指明了视界中时空混乱的根源，这给了我们的探索者将其解决、掌控的机会。"
 time_akx.403.a:0 "令人困惑。"
 time_akx.403.b:0 "令人好奇。"
 
 time_akx.404.name:0 "圣仆：最后的最后"
 time_akx.404.desc.1:0 "§Y[hole_pets.GetName]§!已经压缩至无法进一步压缩的程度。\n\n这颗曾经庞大的黑洞，现如今已经变成了一颗极其微小的奇点，也许这就是它的末路。无限神机并未发出任何汇报，或许是它已经没有新的数据可以提供，也或许是它在最终的压缩过程中彻底湮灭。然而，奇点中的秘密似乎毫无保留地向我们敞开，这可能是我们发现真相的最后机会。"
 time_akx.404.desc.2:0 "§Y[hole_pets.GetName]§!已经压缩至无法进一步压缩的程度。\n\n这颗曾经庞大的黑洞，现如今已经变成了一颗极其微小的奇点，也许这就是它的终结。无限神机并未发出任何汇报，或许是它已经没有新的数据可以提供，也或许是它在最终的压缩过程中彻底湮灭。然而，奇点中的秘密似乎毫无保留地向我们敞开，这可能是我们获悉秘密的最后机会。"
 time_akx.404.a:0 "我们需要知道真相。"
 time_akx.404.b:0 "我们需要得到秘密。"
 
 time_akx.405.name:0 "圣仆：最初的最初"
 time_akx.405.desc.1:0 "奇点中是另外一个宇宙。\n\n我们不知道这片宇宙与我们有任何关联，只能假设它是我们的镜像。在另一个宇宙中，有一个新兴国家刚迈入太空。文明的发展本不足为奇，但他们的进步是沐浴在白洞的歌声中。他们曾试图进入白洞，但迫于科技只得搁置，转而将目光移向辽阔的星河。\n\n在对宇宙的探索中，他们不断壮大，并结识了一只掌控时间的虫子。在自称时之螶的生物的帮助下，他们成功地进入了白洞，并找到了歌声的来源。然而，事与愿违，当他们与白洞中的少女朝视界之外飞去时，一股神秘的力量吞噬了白洞，并将其化作了黑洞。虽然出于少女的保护，他们并未遭受任何损失，但少女也就此杳无音信。\n\n他们并不甘心自己的历史就此成空，便致力于开发一台拥有极高算力的超级计算机，以寻觅进入黑洞的方法。他们的计划成功了，但他们的文明也覆灭了。这台计算机被取名为“无限神机”，这个消失在历史中的种族被称为“摘录者”。"
 time_akx.405.desc.2:0 "奇点中是另外一个宇宙。\n\n我们不知道这片宇宙与我们有任何关联，只能假设它是我们的镜像。在另一个宇宙中，有一个新兴国家刚迈入太空。文明的发展本不足为奇，但他们的进步是沐浴在白洞的歌声中。他们曾试图进入白洞，但迫于科技只得搁置，转而将目光移向辽阔的星河。\n\n在对宇宙的探索中，他们不断壮大，并结识了一只掌控时间的虫子。在自称时之螶的生物的帮助下，他们成功地进入了白洞，并找到了歌声的来源。然而，事与愿违，当他们与白洞中的少女朝视界之外飞去时，一股神秘的力量吞噬了白洞，并将其化作了黑洞。虽然出于少女的保护，他们并未遭受任何损失，但少女也就此杳无音信。\n\n他们并不甘心自己的历史就此成空，便致力于开发一台拥有极高算力的超级计算机，以寻觅进入黑洞的方法。他们的计划成功了，但他们的文明也覆灭了。这台计算机被取名为“无限神机”，这个消失在历史中的种族被称为“摘录者”。\n\n奇点在奉献出最终的秘密后便瞬间消失，却又在恍惚之中突然膨胀。一颗白洞在我们的见证下诞生了，正如我们在白洞的见证下诞生。"
 time_akx.405.desc.3:0 "奇点中是另外一个宇宙。\n\n我们不知道这片宇宙与我们有任何关联，但我们确信它映射着我们的过去。在另一个宇宙中，有一个新兴国家刚迈入太空。文明的发展本不足为奇，但他们的进步是沐浴在白洞的歌声中。他们曾试图进入白洞，但迫于科技只得搁置，转而将目光移向辽阔的星河。\n\n在对宇宙的探索中，他们不断壮大，并结识了一只掌控时间的虫子。在自称时之螶的生物的帮助下，他们成功地进入了白洞，并找到了歌声的来源。然而，事与愿违，当他们与白洞中的少女朝视界之外飞去时，一股神秘的力量吞噬了白洞，并将其化作了黑洞。虽然出于少女的保护，他们并未遭受任何损失，但少女也就此杳无音信。\n\n他们并不甘心自己的历史就此成空，便致力于开发一台拥有极高算力的超级计算机，以寻觅进入黑洞的方法。他们的计划成功了，但他们的文明也覆灭了。这台计算机被取名为“无限神机”，这个消失在历史中的种族被称为“摘录者”。\n\n时之螶感慨于他们的决心，实现了他们进入黑洞的愿望。他们就是我们，我们就是摘录者。"
 # 结局3
 time_akx.405.a:0 "这便是黑洞的最初。"
 # 结局2
 time_akx.405.b:0 "这便是白洞的最初。"
 # 结局1
 time_akx.405.c:0 "这便是我们的最初。"
 time_akx.405.c.tooltip:0 "§Y$d_brief$§!效果增强"
 
 time_akx.406.name:0 "摘录者之梦"
 time_akx.406.desc.1:0 "没想到，另一个我竟然拥有这样的经历。\n\n摘录者们一直追寻着他们的梦，但是失败了。不过，现在他们成功了，而我们也拥有着我们自己的梦。"
 time_akx.406.desc.2:0 "这也是另一个循环的我们在因果之间苦苦挣扎吧。\n\n摘录者们一直追寻着他们的梦，但是失败了。不过，我们成功了，我们会牢牢抓住我们自己的梦，永远不再醒来。"
 time_akx.406.a:0 "让我们继续我们的梦吧。"
 time_akx.406.b:0 "让我们把握我们的梦吧。"
 
 ################################################################
 # 视界之痕
 ################################################################
 
 astral_rift_akx_horror:0 "视界之痕"
 unlock_akx_dark_consortium_edict:0 "解锁额外的暗物质§S法令§!。"
 unlock_akx_dimensional_worship_building:0 "解锁建筑：§H$building_akx_dimensional_worship$§!。"
 unlock_akx_hyperspace_specialty_starbase_building:0 "解锁恒星基地建筑：§H$sm_akx_hyperspace_specialty$§!。"
 
 time_akx.501.name:0 "负相领域"
 time_akx.501.desc.completed_arcsite:0 "星界裂隙中的一切都表明，这里的一切几乎都无法用现有的逻辑证实，但它们的确存在，无论有无意义。\n\n当现象与理论发生冲突时，不是现象错了，而是我们的理论有问题。\n\n宇宙没有义务让我们理解。"
 time_akx.501.desc.default:0 "我们的探针成功进入了星界裂隙，但其内部的物理法则与外界大相径庭，我们的科学官付出了许多努力才勉强掌握新的操控方式。\n\n星界裂隙中似乎是一片虚空，没有任何参照物可以确定探针移动的方向，唯有探针传递的信息表明它仍在正常工作。我们的科学官甚至怀疑，裂隙的另一端并非其它的世界，而是黑洞的内部。\n\n无论如何，我们发现了新的天地。"
 time_akx.501.a:0 "我们打开了负相的大门。"
 
 time_akx.511.name:0 "反馈异常"
 time_akx.511.desc.default:0 "我们派入星界裂隙的探针似乎出了故障。\n\n我们试图让探针收集一些裂隙内可能存在的物质，并对其进行分析。探针也确实收集到了一些无形的物质，但其反馈的数据却破绽百出，自相矛盾。\n\n有科学官认为可能这就是裂隙中物质的独特性质，为了确认这一点，我们命令探针对事先携带的标准样本进行分析，却依然得出了错误的结果。现在我们可以确信，无论裂隙物质的性质如何，我们的探针都出现了某种故障。"
 time_akx.511.a.dark_consortium:0 "以暗物质打造探球外壳，让科学官进入星界裂隙。"
 time_akx.511.a.special:0 "用星界丝缕作为探球保护层，让科学官进入星界裂隙。"
 time_akx.511.a:0 "做好防护措施，让科学官进入星界裂隙。"
 time_akx.511.b:0 "尝试探针自检，分析问题原因。"
 time_akx.511.c:0 "放弃探针，派出新的探针。"
 
 time_akx.512.name:0 "流入大海"
 time_akx.512.desc.default:0 "我们将§Y[time_akx_astral_rift_lost_leader.GetName]§!派入裂隙是个错误的决定。如同水滴坠入大海，[time_akx_astral_rift_lost_leader.GetHeShe]未能激起任何涟漪便消失得无影无踪。\n\n我们对自己的技术太自信了，并付出了惨痛的代价，但对裂隙的探索仍要继续，一位继任者接替了§Y[time_akx_astral_rift_lost_leader.GetName]§!的工作。"
 time_akx.512.a:0 "$time_akx.511.b$"
 time_akx.512.b:0 "$time_akx.511.c$"
 
 time_akx.521.name:0 "当局者迷"
 time_akx.521.desc.default:0 "凭借我们引以为傲的技术，§Y[leader.GetName]§!有惊无险地进入了裂隙之中。所幸探针位置尚浅，且发出的坐标信息准确无误，科学官没有花费太多的时间就找到了探针。\n\n然而，经过了§Y[leader.GetName]§!的一番检查，[leader.GetHeShe]却发现探针并没有出现任何故障，所有部件都在有条不紊地运作着。此外，[leader.GetHeShe]还根据探针所采集的数据重新进行了分析和计算，验证得出结果完全正确，甚至怀疑是外界的计算出了问题。\n\n但是，外界的科学官却给出了迥然不同的结果，他们确信§Y[leader.GetName]§!和探针都算错了。"
 time_akx.521.a:0 "[leader.GetName]，你算错了。"
 time_akx.521.b:0 "撤回科学官，尝试探针自检。"
 
 time_akx.522.name:0 "未知符号"
 time_akx.522.desc.default:0 "经过一番检测和验证，我们的科学官发现，探针在运算的过程中引入了一个未知符号，但这个符号并不源于我们的编程。这个符号或许是探针自己创造出来的，尽管探针并没有这个权限修改自己的程序。\n\n科学官们坚信，正是这个古怪的符号导致计算出现错误。"
 time_akx.522.a:0 "找出这个符号出现的规律。"
 
 time_akx.523.name:0 "重蹈覆辙"
 time_akx.523.desc.default:0 "我们派出了一个新的探针，并且事先做过缜密检查，确保其能正常工作。\n\n然而，当新的探针进入裂隙后，计算结果就出现了相同的偏差。由此可以排除探针个体的故障，证明是裂隙中的世界导致了这一错误。"
 time_akx.523.a:0 "$time_akx.511.b$"
 
 time_akx.531.name:0 "三四之间"
 time_akx.531.desc.default:0 "经过内外双方反复的计算和验证，§Y[leader.GetName]§!惊讶地发现，自己和探针在运算过程中时常会运用到一个未知的符号，但自己却从未意识到这一点。甚至在被外界的科学官指出来之前，[leader.GetHeShe]一直认为这个符号的存在是理所应当的。\n\n§Y[leader.GetName]§!回溯自己的运算过程，最终找出了这个符号代表的含义：这个符号是3和4之间的一个整数，3.5并非是3和4的平均值，而是4和这个符号的平均值。先前的“错误结果”正是基于这一新的数字的引入，裂隙中的其它计算设备同样证明了这一点。\n\n尽管这一切都令人匪夷所思，但这确实是裂隙中客观存在的规律。根据这一规律，我们创建了新的运算法则以改进探针，让其能够消除新数字的影响以对外界输出“正确结果”。\n\n§Y[leader.GetName]§!已经成功返回，对裂隙的探索仍将继续。"
 time_akx.531.a:0 "真是美丽的数字。"
 
 time_akx.532.name:0 "新的整数"
 time_akx.532.desc.default:0 "在反复的试验下，我们的科学官发现了这个符号似乎是一个正整数。虽然无法了解其出现的原理，但将这个符号纳入我们现有的计算体系后，总算能够得到准确的结果。\n\n利用一套新的换算公式，我们可以将探针传输的数据转化为外界的结果。探索有了起色，但这一新的整数依然成为了我们心中不解的谜。"
 time_akx.532.a:0 "这是数学大厦上的一朵乌云。"
 
 time_akx.541.name:0 "黑洞穿行"
 time_akx.541.desc.default:0 "我们的探针终于找到了一处“可被观测”的景象。\n\n这块区域似乎存在着许多漏洞，透过这些漏洞，我们可以看到灿烂的星空，但科学官们确信那不是我们的星空。正当我们沉醉于这片星光璀璨时，一位细心的科学官发现，有个黑影在两个漏洞之间反复穿行。\n\n随着探针朝这两个漏洞驶去，黑影的映像也愈发清晰——那是一艘科研船。科学官猜测，这两个漏洞内可能是两个不同的星系，不知为何，这艘科研船不断地来往于两个星系，仿佛正寻觅着什么。"
 time_akx.541.a:0 "向科研船发出信号。"
 time_akx.541.b:0 "静静观察。"
 
 time_akx.542.name:0 "一而再"
 time_akx.542.desc.default:0 "我们观察了许久，这艘科研船仍不知疲倦地穿行于两个漏洞之间，没有发生任何变化。"
 
 time_akx.543.name:0 "再而三"
 time_akx.543.desc.default:0 "我们观察了许久，这艘科研船仍不知疲倦地穿行于两个漏洞之间，应该没有发生其它变化。"
 
 time_akx.544.name:0 "朝而往"
 time_akx.544.desc.default:0 "我们观察了许久，这艘科研船仍不知疲倦地穿行于两个漏洞之间，可能没有发生其它变化，也许吧？"
 
 time_akx.545.name:0 "暮而归"
 time_akx.545.desc.default:0 "我们观察了许久，这艘科研船仍不知疲倦地穿行于两个漏洞之间，似乎有什么变化，但又似乎没有。"
 
 time_akx.546.name:0 "陷入循环"
 time_akx.546.desc.default:0 "科学官们目不转睛地盯着那艘科研船，仿佛它有什么奇特的魔力，甚至不肯接收任何来自我们的命令。随后，我们派去探索裂隙的科研船完全断绝了与我们的联系，我们也无法看到科研船内的景象。\n\n庆幸的是，我们仍然保有探针信息的接收权，但当我们打开影像时，所有人都惊呆了。我们发现，不断穿行于两个星系之间的那艘科研船上，竟站满了我们的科学官，包括§Y[time_akx_astral_rift_recycle_leader.GetName]§!。\n\n我们不知道他们是如何瞬移到那艘科研船上的，但可以确定的是，他们陷入了一个循环，无法打破的循环。"
 time_akx.546.a:0 "他们陷入了循环，那我们呢？"
 
 time_akx.551.name:0 "视界信号"
 time_akx.551.desc.default:0 "当我们发出信号后，那艘科研船有了反应，或许这就是它所寻觅的东西。\n\n那艘科研船突然朝着最近的漏洞驶来，却又在接触内外交界面的瞬间消失不见，我们的探针无法搜寻到有关它的蛛丝马迹。不久后，另一艘科研船抵达了这一星系。与此同时，从探针附近出现了一道发送给新的科研船的信号，但经过排查，信号并非来源于探针。\n\n新的科研船同样有了反应，准备朝漏洞驶来。"
 time_akx.551.a:0 "已行之事终将再行，将行之事必为已行。"
 time_akx.551.b:0 "向新的科研船发出警告。"
 
 time_akx.561.name:0 "无尽穿越"
 time_akx.561.desc.default:0 "新的科研船如飞蛾扑火般坠入了漏洞，一如既往地消失得无影无踪。\n\n第三艘科研船再一次抵达了这个星系，但这次情况有所不同，探针周围不再自动出现信号，也正因如此，第三艘科研船似乎显得有些迷茫，停驻在漏洞上方犹豫不决。\n\n也许这一次，要由我们来充当发送信号的角色。"
 time_akx.561.a:0 "自动生成一封动人的情诗。"
 time_akx.561.b:0 "向第三艘科研船发出警告。"
 
 time_akx.562.name:0 "紧急介入"
 time_akx.562.desc.third:0 "我们立即向第三艘科研船发出了警告，对方却在接收到信号后毫无反应。\n\n沉默了许久，对方似乎如释重负，调转了船头，并朝着星系边缘驶去。然而，科研船未能完成超空间引擎的启动就发生了爆炸，我们也无从得知爆炸的原因。此后，星系重归寂静。"
 time_akx.562.desc.default:0 "我们立即向新的科研船发出了警告，对方则在逼近漏洞时成功接收信号，并紧急停止在了漏洞之外。\n\n对方似乎十分疑惑，显得有些进退两难。沉默了许久，这艘科研船调转了船头，并朝着星系边缘驶去。随着一阵超空间的扰动，星系重归寂静。"
 time_akx.562.a:0 "这是他们命中注定的谜团，也是我们的。"
 time_akx.562.b:0 "这是他们命中注定的悲剧，也是我们的。"
 
 time_akx.571.name:0 "灰烬之中"
 time_akx.571.desc.default:0 "我们戏谑般的情诗似乎很好地吸引了对方的注意力，第三艘科研船不再犹豫，而是坚定地朝我们驶来。\n\n这一次，科研船不再像过去一样刚接触漏洞就被吞噬，而是平稳地穿过了漏洞，并抵达了我们的探针附近。对方显然对于我们这个信号源十分好奇，频繁地发送讯息，渴望与我们交流。开始通讯后，双方都惊讶地发现，我们和他们竟长得一模一样，就连语言、文化、政体、思潮等都完全相同。我们都为找到了另一个世界的自己而欢呼雀跃，双方相谈甚欢，甚至已经开始规划起以后共同合作、携手进步的安排。\n\n然而，一阵突如其来的爆炸终止了我们的交谈。我们的探针平安无事，但对方的科研船则化作了一堆残骸。"
 time_akx.571.a:0 "寻找可能的幸存者。"
 time_akx.571.b:0 "朝闻道，夕死可矣。"
 time_akx.571.c:0 "我们迟早会再见的，为他们竖立纪念碑。"
 time_akx.571.d:0 "调查残骸，研究另一个世界的技术。"
 time_akx.571.e:0 "为他们哀悼，为我们哀悼。"
 
 time_akx.572.name:0 "镜中倒影"
 time_akx.572.desc.1:0 "尽管我们竭尽所能对幸存者进行搜救，但令人遗憾的是，绝大多数船员都在爆炸中丧生了，剩下的少数船员也因未穿戴防护服而器官衰竭而死。\n\n幸运的是，我们仍然成功救出了一名幸存者。令人惊讶的是，[time_akx_astral_rift_lost_leader.GetHeShe]竟然就是§Y[time_akx_astral_rift_lost_leader.GetName]§!本人——我们之前派入裂隙而后失踪的那名科学官！但是，§Y[time_akx_astral_rift_lost_leader.GetName]§!却声称并不记得与我们相处的时光，[time_akx_astral_rift_lost_leader.GetHeShe]只有自己身为第三艘科研船船员的记忆。\n\n或许[time_akx_astral_rift_lost_leader.GetHeShe]的确不是本人，但这一切绝对不会是巧合。"
 time_akx.572.desc.2:0 "尽管我们竭尽所能对幸存者进行搜救，但令人遗憾的是，绝大多数船员都在爆炸中丧生了，剩下的少数船员也因未穿戴防护服而器官衰竭而死。\n\n幸运的是，我们仍然成功救出了一名幸存者。令人惊讶的是，[akx_mirror_image_leader.GetHeShe]竟然与§Y[akx_mirror_image_leader.GetName]§!长得一模一样！然而，他们确实是不同的两个人，拥有着不同的记忆，也有着不同的思想。\n\n两个§Y[akx_mirror_image_leader.GetName]§!一时间难以接受这样的现实，但回想起曾经经历的种种奇遇，也最终释怀了。\n\n我们的§Y[akx_mirror_image_leader.GetName]§!仍然会为我们效忠，另一个§Y[akx_mirror_image_leader.GetName]§!也愿意助我们一臂之力，互为镜像的两人现在合二为一了。"
 time_akx.572.a.1:0 "沉溺于镜中世界也未必是件坏事……"
 time_akx.572.a.2:0 "惊诧于镜中自己也未尝不是好事……"
 time_akx.572.b.1:0 "为我们所逝去的一切竖立纪念碑……"
 time_akx.572.b.2:0 "为你们所失去的一切竖立纪念碑……"
 time_akx.572.c.1:0 "让我们想想看，能从中发现什么……"
 time_akx.572.c.2:0 "让我们想想看，能从中学到什么……"
 time_akx.572.d.1:0 "当镜中的倒影与本体调转……"
 time_akx.572.d.2:0 "当镜中的倒影与本体相遇……"
 
 time_akx.573.name:0 "破镜难圆"
 time_akx.573.desc:0 "尽管我们竭尽所能对幸存者进行搜救，但令人遗憾的是，绝大多数船员都在爆炸中丧生了，剩下的少数船员也因未穿戴防护服而器官衰竭而死。\n\n虽然我们的救援行动以失败告终，但我们找出了爆炸的成因。第三艘科研船上似乎携带了大量的炸药，并且被设定为一旦检测到剧烈的引力波动就会直接引爆。不知为何，对方的船员没有及时将炸弹关闭，或许是他们忘了这件事，或许是他们认为炸弹不会被引爆，或许是他们没有拆除炸弹的能力与权限。至于炸弹没有在进入漏洞时就引爆的原因，我们的科学官推测，漏洞内外的时间流速不同，极大幅度延缓的炸弹的激活，可能这是让船员们掉以轻心的真正原因。\n\n可事已至此，即便找出了原因也无法改变历史，这就是他们注定的命运。"
 time_akx.573.a:0 "破镜难圆，覆水难收。"
 
 ################################################################
 # 时间之伤
 ################################################################
 
 astral_rift_akx_time:0 "时间之伤"
 time_akx_astral_rift_history_refresh:0 "§Y星界裂隙的探索记录已更新！§!"
 unlock_hidden_akx_dark_consortium_edict:0 "§Y时间会给我们答案。§!"
 unlock_akx_ouroboros_building:0 "解锁建筑：§H$building_akx_ouroboros$§!。"
 upgrade_akx_hyperspace_specialty_starbase_building:0 "升级恒星基地建筑：§H$sm_akx_hyperspace_specialty$§!。"
 
 time_akx.601.name:0 "撕裂帷幕"
 time_akx.601.desc.completed_arcsite:0 "负相位面中的一切都表明，这里的一切几乎都无法用现有的逻辑证实，但它们的确存在，无论有无意义。\n\n当现象与理论发生冲突时，不是现象错了，而是我们的理论有问题。\n\n时间没有义务让我们理解。"
 time_akx.601.desc.default:0 "时之螶撕裂了维度，慷慨地为我们指明了探索的方向。\n\n不仅仅是从外侧研究负相物质，我们更要深入裂隙进一步探索负相位面。随着我们对负相的了解，我们已不必再担心被裂隙吞噬，现在可以放弃短小的探针，转而使用载人探球来窥视这片熟悉又陌生的世界。"
 time_akx.601.a:0 "时间正毫无保留地展示祂的全貌。"
 
 time_akx.611.name:0 "通天之塔"
 time_akx.611.desc.truth_2:0 "我们的探索小组已经成功进入了裂隙深处。\n\n裂隙探球在一片虚无中发现了一座神秘的高塔，探索小组的成员们也穿戴好防护服，准备开始对高塔的探索。这座巨塔高不见顶，使用了一种未知的材料建成，层次分明闪闪发光，仿佛是某种生物的鳞片。虽然塔的各处略显破败，但可以想象其曾经的辉煌，而壁面上充斥着的神秘符号似乎也暗示着这座塔具有特别的意义。\n\n探索小组正在有序前进，同时研究着壁上的神秘符号。"
 time_akx.611.desc.default:0 "§Y[time_akx_astral_rift_circle_leader.GetName]§!与[time_akx_astral_rift_circle_leader.GetHeShe]的探索小组已经成功进入了裂隙深处。\n\n裂隙探球在一片虚无中发现了一座神秘的高塔，探索小组的成员们也穿戴好防护服，准备开始对高塔的探索。这座巨塔高不见顶，使用了一种未知的材料建成，层次分明闪闪发光，仿佛是某种生物的鳞片。虽然塔的各处略显破败，但可以想象其曾经的辉煌，而壁面上充斥着的神秘符号似乎也暗示着这座塔具有特别的意义。\n\n探索小组正在有序前进，同时研究着壁上的神秘符号。"
 time_akx.611.a:0 "也许与某种宗教有关。"
 
 time_akx.621.name:0 "蝴蝶效应"
 time_akx.621.desc.same:0 "探索小组正忙于研究一个神秘房间内的古怪装饰，§Y[time_akx_astral_rift_circle_leader.GetName]§!则打算先独自朝塔顶赶去。但这座高塔仿佛没有尽头，无论如何尝试，[time_akx_astral_rift_circle_leader.GetHeShe]都无法望及塔顶。\n\n就在§Y[time_akx_astral_rift_circle_leader.GetName]§!快被这永无止境的攀爬逼疯时，从塔的上方走来了一个人。这个人穿着和小组成员完全相同的服饰，§Y[time_akx_astral_rift_circle_leader.GetName]§!一度怀疑是不是探索小组发现了前进的捷径，但一声枪响打破了[time_akx_astral_rift_circle_leader.GetHeShe]的思考——对方正向§Y[time_akx_astral_rift_circle_leader.GetName]§!发动攻击！\n\n"
 time_akx.621.desc.truth_1:0 "$time_akx.621.desc.same$§Y[time_akx_astral_rift_circle_leader.GetName]§!迅速地举起了武器，但对方的武器也已完成了充能。在两声枪响下，二人一同倒地，等到后方的探索小组姗姗来迟，此处只剩下两具尸体。经过搜查，这两人都是§Y[time_akx_astral_rift_circle_leader.GetName]§!本人，但他们同时出现的原因却不得而知。\n\n探索小组立刻向我们汇报了此事，尽管这一切迷雾重重，但探索仍要继续。"
 time_akx.621.desc.truth_2:0 "探索小组在一个神秘的房间发现了一些古怪的装饰，上面似乎雕刻了一些别有深意的符号。\n\n经过一段时间的钻研和翻译，探索小组发现，这段符号只是讲了一个小故事，大意是一个人做了一件小事，但经过一系列巧合与偶然，在未来间接害死了自己。这种讲着“蝴蝶效应”的科幻小故事在我们的母星数不胜数，不值一提，探索小组只得失望地继续前行。"
 time_akx.621.desc.truth_3:0 "探索小组正忙于研究一个神秘房间内的古怪装饰，§Y[time_akx_astral_rift_circle_leader.GetName]§!则打算先独自朝塔顶赶去。但这座高塔仿佛没有尽头，无论如何尝试，[time_akx_astral_rift_circle_leader.GetHeShe]都无法望及塔顶。\n\n就在§Y[time_akx_astral_rift_circle_leader.GetName]§!快被这永无止境的攀爬逼疯时，从塔的上方走来了一个人。这个人穿着和小组成员完全相同的服饰，§Y[time_akx_astral_rift_circle_leader.GetName]§!一度怀疑是不是探索小组发现了前进的捷径，但对方的问候打破了[time_akx_astral_rift_circle_leader.GetHeShe]的思考——对方没有敌意。\n\n经过一番沟通，双方竟然都是§Y[time_akx_astral_rift_circle_leader.GetName]§!本人，这令两人都大为震撼。我们的§Y[time_akx_astral_rift_circle_leader.GetName]§!决定往下走，与探索小队的队员会合，另一个§Y[time_akx_astral_rift_circle_leader.GetName]§!则准备往上走，以通知[time_akx_astral_rift_circle_leader.GetHeShe]的队员。"
 time_akx.621.desc.attack:0 "$time_akx.621.desc.same$§Y[time_akx_astral_rift_circle_leader.GetName]§!也及时地发起了反击，随着一声枪响，对方倒地不起。但令人惊讶的是，攻击者竟长得和§Y[time_akx_astral_rift_circle_leader.GetName]§!一模一样，而身上的各种证件也表明死者就是§Y[time_akx_astral_rift_circle_leader.GetName]§!本人。\n\n§Y[time_akx_astral_rift_circle_leader.GetName]§!感到难以置信，并担忧着自己的处境。"
 time_akx.621.desc.communicate:0 "$time_akx.621.desc.same$§Y[time_akx_astral_rift_circle_leader.GetName]§!及时激活了护盾，对方的攻击暂时无法突破。在等待增援的同时，§Y[time_akx_astral_rift_circle_leader.GetName]§!试图与对方交涉，但对方却完全没有理睬。直到后方的探索小组匆匆赶来，攻击者才急忙撤退，安全起见，探索小组没有立即追踪。\n\n§Y[time_akx_astral_rift_circle_leader.GetName]§!备感疑惑，并担忧着自己的处境。"
 time_akx.621.desc.default:0 "$time_akx.621.desc.same$对方的武器正在重新充能，而这片区域十分空旷，要想找到一个合适的掩体恐怕十分困难，但若能激活应急护盾，或许可以坚持到探索小组的增援。当然，我们也可以选择还击，但难以预估这一举动的后果。\n\n现在，§Y[time_akx_astral_rift_circle_leader.GetName]§!的命运已经交在你的手上。"
 time_akx.621.a:0 "没时间犹豫了，立即向对方发起反击！"
 time_akx.621.b:0 "不要还击，在激活护盾的同时尝试交涉！"
 
 time_akx.631.name:0 "轮回之始"
 time_akx.631.desc.same:0 "探索小组及时地使用携带的药物对§Y[time_akx_astral_rift_circle_leader.GetName]§!进行应急救治，虽然暂时免除了生命危险，但也留下了永远的后遗症。并且，§Y[time_akx_astral_rift_circle_leader.GetName]§!的情绪仍然有些不稳定。\n\n为了避免§Y[time_akx_astral_rift_circle_leader.GetName]§!再次遭到攻击，探索小组决定让[time_akx_astral_rift_circle_leader.GetHeShe]先原路返回，在营地内等待探索小组的消息，而探索小组则继续朝塔顶进发。\n\n但是返程的路上并非风平浪静，§Y[time_akx_astral_rift_circle_leader.GetName]§!向塔底前进时，突然又遇见了一个与小组成员服饰相同的人。§Y[time_akx_astral_rift_circle_leader.GetName]§!确信其它的小组成员都在朝塔顶前进，那么这个人必定是与先前攻击者一伙的。于是，[time_akx_astral_rift_circle_leader.GetHeShe]先发制人，朝对方发起了攻击。但由于情绪紧张，第一次的攻击仅仅是击伤了对方，未能抑制威胁。对方也很显然受到了极大的惊吓，似乎准备掏出武器发动反击。\n\n"
 time_akx.631.desc.truth_1:0 "探索小组选出了新的继任者以替代§Y[time_akx_astral_rift_circle_leader.GetName]§!。\n\n有了前车之鉴，探索小组们始终保持团体行动，避免任何一个成员落单。事实证明，他们的这一方案十分正确，一路上并未再发生类似事件，所有人都平安无事。\n\n令人庆幸的是，现在已经可以略微看到塔顶了，探索小组的士气大涨，抵达塔顶已指日可待。"
 time_akx.631.desc.truth_2:0 "探索小组总感觉自己是在一个地方进进出出，甚至可以在一个房间的装饰上再次看到那则“蝴蝶效应”小故事。\n\n探索小组认为自己迷了路，困在了一个走不出去的迷宫里，但时不时又会找到新的房间，给小组以希望。这样的希望与失望辗转反复，探索小组已经没有太大意愿继续前行了，或许他们放弃只是迟早的事。"
 time_akx.631.desc.attack:0 "$time_akx.631.desc.same$§Y[time_akx_astral_rift_circle_leader.GetName]§!再度扣下了扳机，并成功射杀了对方。§Y[time_akx_astral_rift_circle_leader.GetName]§!看着死者与自己完全一致的脸，精神已经濒临崩溃，和我们的通讯也中断了。"
 time_akx.631.desc.communicate:0 "$time_akx.631.desc.same$§Y[time_akx_astral_rift_circle_leader.GetName]§!冷静了下来，放下武器，试图与对方交涉，但随后就与我们失去了联系。"
 time_akx.631.desc.default:0 "$time_akx.631.desc.same$由于对方随时都可能发动反击，§Y[time_akx_astral_rift_circle_leader.GetName]§!难以抑制自己激动的情绪，把武器对准了对方，但仍然向你征求下一步的指令。"
 time_akx.631.a:0 "扣下扳机，消灭威胁！"
 time_akx.631.b:0 "放下武器，尝试交涉！"
 time_akx.631.b.warning:0 "§R界旅者认为这是一个非常危险的选项！§!"
 
 time_akx.632.name:0 "轮回之始"
 time_akx.632.desc.same:0 "探索小组及时地使用携带的药物对§Y[time_akx_astral_rift_circle_leader.GetName]§!进行应急救治，虽然暂时免除了生命危险，但也留下了永远的后遗症。并且，§Y[time_akx_astral_rift_circle_leader.GetName]§!的情绪仍然有些不稳定。\n\n为了避免§Y[time_akx_astral_rift_circle_leader.GetName]§!再次遭到攻击，探索小组决定让[time_akx_astral_rift_circle_leader.GetHeShe]先原路返回，在营地内等待探索小组的消息，而探索小组则继续朝塔顶进发。\n\n但是返程的路上并非风平浪静，§Y[time_akx_astral_rift_circle_leader.GetName]§!向塔底前进时，突然又遇见了一个与小组成员服饰相同的人。§Y[time_akx_astral_rift_circle_leader.GetName]§!确信其它的小组成员都在朝塔顶前进，那么这个人必定是与先前攻击者一伙的。于是，[time_akx_astral_rift_circle_leader.GetHeShe]先发制人，朝对方发起了攻击。但由于情绪紧张，第一次的攻击仅仅是击伤了对方，未能抑制威胁。对方也很显然受到了极大的惊吓，似乎准备激活某种护盾装置。\n\n"
 time_akx.632.desc.truth_1:0 "$time_akx.631.desc.truth_1$"
 time_akx.632.desc.truth_3:0 "两个§Y[time_akx_astral_rift_circle_leader.GetName]§!和两个探索小组再度相遇了。\n\n经过确认，对方的所有成员都是我们的小组成员本人，只不过处于不同的时间线。关于这座塔，§Y[time_akx_astral_rift_circle_leader.GetName]§!也似乎有所发现：“当你在往上走的同时，你也在往下走。而当你往下走的时候，总有一个你会成功抵达塔顶。”\n\n两个探索小组全部手牵着手，一个接一个地往下走，在路上又碰到了其它的探索小组，在解释了缘由后，他们也都加入了进来。\n\n无限个调查小组在无限的高塔里无限连接、无限循环。"
 time_akx.632.desc.attack:0 "$time_akx.632.desc.same$§Y[time_akx_astral_rift_circle_leader.GetName]§!再度扣下了扳机，并成功射杀了对方。但令人惊讶的是，对方竟长得和§Y[time_akx_astral_rift_circle_leader.GetName]§!一模一样，而身上的各种证件也表明死者就是§Y[time_akx_astral_rift_circle_leader.GetName]§!本人。\n\n§Y[time_akx_astral_rift_circle_leader.GetName]§!已经手足无措，不知道发生了什么，随后，通讯突然中断了。"
 time_akx.632.desc.communicate:0 "$time_akx.632.desc.same$§Y[time_akx_astral_rift_circle_leader.GetName]§!冷静了下来，放下武器，试图与对方交涉，而对方也只是激活了护盾装置，并未表现出强烈的敌意。\n\n经过一番沟通，双方竟然都是§Y[time_akx_astral_rift_circle_leader.GetName]§!本人，这令两人都大为震撼。我们的§Y[time_akx_astral_rift_circle_leader.GetName]§!决定继续往上走，通知探索小组的其它成员；另一个§Y[time_akx_astral_rift_circle_leader.GetName]§!则准备往下走，以与[time_akx_astral_rift_circle_leader.GetHeShe]的队员会合。\n\n这一切都显得似曾相识。"
 time_akx.632.desc.default:0 "$time_akx.632.desc.same$由于无法预测对方接下来的举动，§Y[time_akx_astral_rift_circle_leader.GetName]§!难以抑制自己激动的情绪，把武器对准了对方，但仍然向你征求下一步的指令。"
 time_akx.632.a:0 "扣下扳机，消灭威胁！"
 time_akx.632.b:0 "放下武器，尝试交涉！"
 
 time_akx.641.name:0 "衔尾之蛇"
 time_akx.641.desc.default:0 "探险小组最终成功地抵达了塔顶，每个成员的脸上都洋溢着喜悦的笑容。\n\n当你问及§Y[time_akx_astral_rift_circle_leader.GetName]§!的情况时，他们却很疑惑。探索小组表示§Y[time_akx_astral_rift_circle_leader.GetName]§!早已死亡，并且在先前的日志中就已经向我们汇报过了，现在小组由他们选出的继任者代为领导。我们核实了先前的报告，尽管与记忆中的不符，但与探索小组所言确实吻合。未等我们思考，探索小组就迫不及待地汇报他们的发现了：这座高塔的塔顶是一个神秘的祭坛，虽然已经废弃很久了，但祭祀对象的图案仍清晰可见——那是一条衔尾之蛇。\n\n对高塔的探索已经随着小组的汇报而尘埃落定，但我们都知道，这不是结束。"
 time_akx.641.a:0 "衔尾之蛇无始也无终。"
 time_akx.641.b:0 "这也不是开始。"
 
 time_akx.642.name:0 "迷失时空"
 time_akx.642.desc.default:0 "探险小组仍然没能抵达塔顶，最终不得不选择放弃。\n\n但当他们原路返回时，却只花了很短的时间就到了出口，仿佛他们一直是在离塔底很近的地方兜兜转转。探索小队中并没有§Y[time_akx_astral_rift_circle_leader.GetName]§!的身影，但当你发问时，他们却很疑惑。不仅是探索小组，其它负责通讯的联络人员也很疑惑，因为我们从未听说过§Y[time_akx_astral_rift_circle_leader.GetName]§!这个名字，§Y[time_akx_astral_rift_circle_leader.GetName]§!自始至终都不存在。\n\n你确信自己的记忆没有出现偏差，但现实就是如此。历史并非不可改变。"
 time_akx.642.a:0 "时间会抹除一切不合理。"
 time_akx.642.b:0 "有人陷入了时间的迷宫。"
 
 time_akx.643.name:0 "循环之终"
 time_akx.643.desc.default:0 "最终，我们的探索小组跟随着前人回到塔底后，发现塔底本身就是塔顶——这根本不是什么塔，而是一个圆。\n\n当这样的报告反馈给我们时，所有人都搞不懂这一逻辑关系，探索小组却似乎早有预料——他们已经历了每一个循环。他们建议我们重新查看一下过往的汇报，因为历史早已改变，我们已经踏入了不同的河流。\n\n探索小队已经回到了裂隙探球，准备继续探索负相的深处。"
 time_akx.643.a:0 "他们用时间看破了时间。"
 time_akx.643.b:0 "他们用无限超越了无限。"
 
 time_akx.651.name:0 "01100100  01100001  01110100  01100001" # data
 time_akx.651.desc.default:0 "探索小组继续在虚无之中摸索着前进。\n\n不知何时，裂隙探球已经被一团诡异的流股包围，探索小组几乎是被裹挟着顺着流股前进。这团流股中不断有蓝色丝线飞速穿行、扭转、交错，不知其终点在哪里。§Y[leader.GetName]§!尝试提升引擎功率，但流股的粘滞力和推动力过于强劲，无论如何尝试都无法将探球驶离流股。\n\n无奈之下，探索小组只得关闭推进器以节省能源，任凭探球成为蓝色丝线的一员。"
 time_akx.651.a:0 "总会抵达终点的。"
 
 time_akx.661.name:0 "01100011  01110010  01100001  01111010  01111001" # crazy
 time_akx.661.desc.default:0 "在流股中随波逐流的日子既漫长又煎熬，不亚于先前困在无穷无尽的高塔时的经历，探索小组的成员们都快被逼疯了。\n\n起初，大家还饶有兴趣地收集周边的蓝色丝线，但很快便发现这些丝线似乎不是实体，伸出的机械臂直接从丝线中穿过，宛如水中捞月。后来，探索小组尝试通过各种手段检测蓝色丝线的物理性质，竟发现它与我们投射的任何物质间都不存在相互作用力，就像是灯光下的影子，可见，但不可触。这一丝线很可能并不是像裂隙探球一样被流股裹挟着前进，它们是主动沿着流股移动的。\n\n最终，所有人都没了兴致，目中无神地盯着深不见底的流股尽头。突然间，§Y[leader.GetName]§!爆发出一阵大笑，狂呼自己知道了一切，但又说不出发现了什么。队员们想，[leader.GetHeShe]疯了。"
 time_akx.661.a:0 "无尽的等待会逼疯每一个人。"
 
 time_akx.671.name:0 "01100111  01100001  01101101  01100101" # game
 time_akx.671.desc.a:0 "$time_akx.671.desc.default$\n\n你选择了左边的箱子，§Y[leader.GetName]§!激动地大喊：§C“我就知道你会选这个！”§![leader.GetHeShe]打开了盖子，里面空无一物。"
 time_akx.671.desc.b:0 "$time_akx.671.desc.default$\n\n你选择了右边的箱子，§Y[leader.GetName]§!显得有些困惑：§C“我本以为你会选另一个。”§![leader.GetHeShe]打开了盖子，里面空无一物。"
 time_akx.671.desc.default:0 "§Y[leader.GetName]§!不知从哪拿出来了两个箱子，并说想和你玩个游戏。\n\n§Y[leader.GetName]§!声称，[leader.GetHeShe]在两个箱子之一里放了非常多的宝物，另一个则空无一物。如果你能猜中正确的箱子，就能获得箱子里的一切，但无论你有没有猜对，§Y[leader.GetName]§!都会告诉大家自己的发现。\n\n我们无法理解§Y[leader.GetName]§!这么做的原因，[leader.GetHeShe]也禁止我们和其它小组成员使用任何仪器分析出箱子的内容物，看起来，我们必须要试试运气了。"
 time_akx.671.a:0 "选左边的箱子。"
 time_akx.671.a.tooltip:0 "§Y[leader.GetHeShe]哪来的这么多资源？§!"
 time_akx.671.b:0 "选右边的箱子。"
 time_akx.671.b.tooltip:0 "§Y箱子里面是空的。§!"
 
 time_akx.672.name:0 "01100011  01101000  01100101  01100001  01110100" # cheat
 time_akx.672.desc.a:0 "$time_akx.672.desc.default$\n\n你选择了左边的箱子，里面依然是空的，你感到被欺骗了。"
 time_akx.672.desc.b:0 "$time_akx.672.desc.default$\n\n你选择了右边的箱子，里面依然是空的，你感到被欺骗了。"
 time_akx.672.desc.default:0 "§Y[leader.GetName]§!见你很不满，提议再来一轮游戏。\n\n[leader.GetHeShe]重新调整了宝物的位置，规则和先前的一致，我们还有50%的机会成功。"
 time_akx.672.a:0 "选左边的箱子。"
 time_akx.672.a.tooltip:0 "§Y箱子里面是空的。§!"
 time_akx.672.b:0 "选右边的箱子。"
 time_akx.672.b.tooltip:0 "§Y箱子里面装满了资源。§!"
 
 time_akx.681.name:0 "01110100  01110010  01110101  01110100  01101000" # truth
 time_akx.681.desc.same:0 "\n\n说完，§Y[leader.GetName]§!便启动了隐藏的炸弹，裂隙探球在一瞬间爆炸了。但我们的通讯并未中断，因为裂隙探球与所有的小组成员都完好无损地出现在了流股的外面——他们成功脱困了。\n\n§C“果然没错，伟大的意志不会希望我们就此死去。若是我们死了，裂隙的探索将永远中止，剧情也无法推进，因此我们绝不会死。在流股的规则内，我们必定无法脱离流股，只有打破这一规则，才能置于死地而后生。”§!\n\n我们非常担忧§Y[leader.GetName]§!的精神状况，但也对[leader.GetHeShe]的猜想半信半疑。所有人都看着你。"
 time_akx.681.desc.a:0 "§C“伟大的意志自认为能洞悉一切，但其目所能及的也只是另一个意志所希望他看到的。我只不过是某个意志操纵的一枚棋子，只不过这个意志有时是你，有时不是你。”§!\n\n你所做的选择似乎全都被§Y[leader.GetName]§!预料到了。\n\n§C“这两个箱子其实都是空的，根本就没有什么宝物。但是，您是怎么每次都猜到‘正确’的宝箱的呢？想必，您可以看到一些我们所看不到的东西，例如——某个事件的后果，或许这就是您能为我们的国家带来繁荣的秘诀。我们所处的世界，也许根本不是什么现实，而是包括您在内的高维生物的玩物。”§!$time_akx.681.desc.same$"
 time_akx.681.desc.b:0 "§C“伟大的意志能利用过往的经验，但这未必适用于新的挑战。老实说，您的选择远超我的想象。”§!\n\n§Y[leader.GetName]§!显得有些没有底气，但仍然选择继续往下说。\n\n§C“这两个箱子其实都是空的，根本就没有什么宝物。您每次都选择了‘空的宝箱’，或许是出于反套路的考量，或许是曾经经历过这一事件，也或许是在时间轴上进行了跳跃，更或许只是单纯依赖于运气。我不知道，可能只有您知道。您的选择的确让我曾坚定的理念有些动摇，但我还是打算放手一搏，我不敢相信它，也不敢怀疑它。我们所处的世界，也许根本不是什么现实，而是包括您在内的高维生物的玩物。”§!$time_akx.681.desc.same$"
 time_akx.681.desc.c:0 "§C“伟大的意志或许可以避开一时的错误，但无法避免注定的结果。在开启箱子之前，没人知道箱子里有什么，或许是空的，或许不是空的。”§!\n\n你的选择虽令§Y[leader.GetName]§!感到疑惑，但[leader.GetHeShe]很快就意识到了原因。\n\n§C“这两个箱子其实都是空的，根本就没有什么宝物。但是，为何您两次的选择会‘大相径庭’呢？您不是因为一个箱子是空的而选择另一个箱子，而是因为一个‘选项’失败了而选择另一个‘选项’。想必，您可以看到一些我们所看不到的东西，例如——某个事件的后果，或许这就是您能为我们的国家带来繁荣的秘诀。我们所处的世界，也许根本不是什么现实，而是包括您在内的高维生物的玩物。”§!$time_akx.681.desc.same$"
 time_akx.681.hidden:0 "还有的是你意想不到的呢，你这小聪明鬼。"
 time_akx.681.a:0 "不要打破第四面墙，你这小聪明鬼。"
 time_akx.681.a.tooltip:0 "§R这或许注定是一场有去无回的旅途！§!"
 time_akx.681.a.icon_text:0 "§H$RIFT_DIFFICULTY_TYPE$§!\n§R地狱（20）§!\n\n$RIFT_DIFFICULTY_TYPE_DESC$"
 time_akx.681.b:0 "够了，立刻返航！"
 
 time_akx.682.name:0 "无果而终"
 time_akx.682.desc:0 "探索小组成功返回了，§Y[akx_wall_breaker.GetName]§!声称会将自己在星界裂隙中的发现公之于众。\n\n我们不确定会有多少民众相信[akx_wall_breaker.GetHeShe]的说辞，但若是这一猜想毫无保留地展示在大众面前，其造成的后果难以预估。无论[akx_wall_breaker.GetHeShe]的理念是否正确，我们都必须有所行动。"
 time_akx.682.a:0 "立刻将[akx_wall_breaker.GetName]控制住，还有其它的小组成员！"
 time_akx.682.b:0 "每个人都有发表观点的权利，谣言会不攻自破。"
 
 time_akx.690.name:0 "连接无限"
 time_akx.690.desc.default:0 "我们意识到，我们的这次探索本身注定没有结局。\n\n在裂隙探球离开流股后，我们的探索小队就继续朝着深不可测的虚无进发，但一段时间后，我们便失去了与他们的联络。连接探球的锚链已经达到了长度的极限，但它还在不断延伸，就像是会自己生长。出于安全考量，我们没有阻止这一诡异现象，而是静静等待探险小队的讯息。\n\n在漫长的岁月中，我们未曾接收到任何有关探索小组的通信，但锚链的延展成了他们平安无事的证明。直到某一天，锚链突然停止了生长，我们也无从获取探险小组的行踪。最终，我们决定收回锚链以寻回探险小组，但无论我们用何种办法，都无法将其拉至尽头，甚至我们在锚链上做过的标记也于数天后重新出现在我们面前。\n\n无限的锚链在无限的裂隙中无限循环，我们最终只得放弃，将锚链与探球封存在时间的长河中。"
 time_akx.690.a:0 "锚链的彼端是无限。"
 
 time_akx.691.name:0 "迷宫尽头"
 time_akx.691.desc.default:0 "我们意识到，我们的这次探索本身就是一个循环。\n\n在裂隙探球离开流股后，我们的探索小队就继续朝着深不可测的虚无进发，但一段时间后，我们便失去了与他们的联络。连接探球的锚链已经达到了长度的极限，但它还在不断延伸，就像是会自己生长。出于安全考量，我们没有阻止这一诡异现象，而是静静等待探险小队的讯息。\n\n在漫长的岁月中，我们未曾接收到任何有关探索小组的通信，但锚链的延展成了他们平安无事的证明。最终，探索小组乘坐着裂隙探球达成了返航。他们激动地讲述着自己在裂隙中的所见所闻，诉说着对母国的思念，抱怨着我们与他们中断了联络，感激我们持之以恒地为他们延长锚链。\n\n但令人不解的是，我们的锚链还在不断生长，这意味着探索小组仍在前进。\n\n那我们现在所迎接的究竟是谁？"
 time_akx.691.a:0 "欢迎回家，未来的[leader.GetName]。"
 
 time_akx.692.name:0 "百年孤独"
 time_akx.692.desc:0 "我们为探索小组接风洗尘，发现每个人都饱经沧桑。\n\n§Y[akx_wall_breaker.GetName]§!说，他们在星界裂隙中游历了上百年，在这段漫长的岁月里，他们也想明白了，无论世界是否真实，他们都会像以前一样活下去，活下去——不需要理由。世界那么大，还有太多太多未解的谜团等着他们去发现，纠结于真实与虚伪并没有意义，探索真相的旅途永远没有终点。\n\n§Y[akx_wall_breaker.GetName]§!冲你狡黠一笑，表示自己会对裂隙中的那个发现缄默不言，但也希望你对[akx_wall_breaker.GetHeShe]的秘密不再过问。"
 time_akx.692.a:0 "让我们为我的秘密，为你的秘密，干杯！"
 time_akx.692.b:0 "这是属于你我的秘密，而非蜂群的秘密。"
 time_akx.692.c:0 "这是属于你我的秘密，而非网络的秘密。"
 
 ################################################################
 # 偏离航道
 ################################################################
 
 time_akx.1000.name:0 "偏离航道"
 time_akx.1000.desc.1:0 "我们在前进的道路上偏离的航道，幸好§H时之螶§!及时注意到了这一点，并帮助我们回归了正途。"
 time_akx.1000.desc.2:0 "我们似乎在有意偏离航道，§H时之螶§!已经向我们发出了警告：如果我们再次偏离，祂将会降下严重的§R惩罚§!。"
 time_akx.1000.desc.3:0 "在无人察觉的瞬间，§R惩罚§!悄然而至。我们故意偏离航道的行为激怒了这位时间的神明，祂曾给予我们的爱早已转变为无边的恶意。"
 time_akx.1000.desc.4:0 "§R惩罚§!如期而至。"
 time_akx.1000.a:0 "我们有错吗？"
 time_akx.1000.a.tooltip:0 "移除§Y灭绝政体§!类理念"
 time_akx.1000.b:0 "我们做得太过火了。"
 time_akx.1000.b.tooltip:0 "§R我们绝对不能再次偏离航道！§!"
 time_akx.1000.c:0 "……"
 time_akx.1000.c.tooltip:0 "§R惩罚已经降临，代价是我们的一切……§!"
 
 ################################################################
 # 虚空之魇
 ################################################################
 
 time.1005.name:0 "虚空之魇"
 time.1005.desc:0 "当一只我们驯养的虚空虫于§Y[dimensional_horror_voidworms_fleet.solar_system.GetName]§!的太空战丧生时，其周围的时空突然出现了扭曲，随后，一只小型的位面之魇从虚空中悄然现身。\n\n我们不清楚这只§Y虚空之魇§!产生的原因，但科学家们猜想，可能是虚空虫带有的§Y负相畸变§!诱发了这一现象，甚至这只虚空之魇或许就是战死的虚空虫本身。这只新生的怪物正好奇地打量着所处的世界，它似乎对我们没有敌意，但这可能只是暂时的。\n\n无论如何，它已永远地脱离了我们的掌控。"
 time.1005.a:0 "生于虚空的造物。"