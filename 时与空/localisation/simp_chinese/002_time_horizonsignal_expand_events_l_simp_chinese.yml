 #环形神殿
 akx.9100.desc.pc_time: "考古学家在[Root.GetName]某片人迹罕至的时空发现了一个被遗忘的寺庙——被埋葬了几个世纪，但是最近因为维度扰动而显露出来。通过分析寺庙墙体的凿面，年代分析理论指出这是一个前工业时代的遗迹。然而，墙壁上不断循环的标志和放射状的祭坛——一个莫比乌斯环一样的衔尾蛇——我们的早期历史中并没有这样的先例，并且在它的碑文上用了未知的文字体系。一个激动的探索者认为这个遗迹是一个先驱种族所遗留下来的。\n\n虽然看似无关，然而维度扰动看起来是和在[horizonsignal_system.GetName]传出最后信息的时候的同一时间发生的。"
 akx.9101.desc.pc_time: "我们的科学家对废弃神殿进行了深入的调查，但是仍然存在一些无法解释的问题。在星状祭坛上的延展线上的屋顶上有一个空洞，我们推测它应该曾被作为日晷使用；但是因为维度扰动造成的严重损毁导致我们无法确定。如果它是在某个重要的时刻建立起来的话，我们可能永远没法确认那个时间。我们在“未知语言系统”方面运气不错。这是一个因年代久远而模糊不清但十分著名的僧侣手抄——用的根本不是外星语言——并且我们已经成功的破译了它。\n\n这个神殿被用于侍奉“时间蠕虫”或者说是§H时之螶§!。大多数铭文都充满韵律和诗意，祈祷着时之螶的降临——或者，如果反过来读的话——它的离开。它还有一部分在描述“宇宙的运转”，激动的考古学家发誓这里面引用了先进的场方程——对我们而言这个东西并不新鲜，但是但其被发现于这个古老的神殿这一事件本身就让人印象深刻了。尽管我们还没找到同意该观点并且公开承认的物理学家。\n\n就目前而言，这个神殿没有任何与宇宙的秘密或外星武器相关的迹象。但它黑暗的环境是那么的与众不同，充满着危机感的美，而那些用于侍奉时之螶的诗文则变的时髦起来。它们被制成流行音乐传播；同时它们也被编成合集出版发行。"
 akx.9101.a.materialist:0 "将环形神殿改造成研究所。"
 akx.9101.a.materialist.tooltip:0 "一份来自我们远古祖先的奥秘。“将行之事，必为已行”。"
 akx.9101.a.spiritualist:0 "将环形神殿改造成朝圣地。"
 akx.9101.a.spiritualist.tooltip:0 "一份来自我们远古祖先的智慧。“已行之事，终将再行”。"
 akx.9101.a.militarist:0 "学习环形神殿的建造方式。"
 akx.9101.a.militarist.tooltip:0 "“圆环是始也是终”。"
 akx.9101.a.pacifist:0 "学习环形神殿的构筑方式。"
 akx.9101.a.pacifist.tooltip:0 "“圆环无始也无终”。"
 akx.9101.a.xenophile:0 "向公众开放环形神殿。"
 akx.9101.a.xenophile.tooltip:0 "直线弯曲成环，圆环拉伸为线。"
 akx.9101.a.xenophobe:0 "向公众宣传环形神殿。"
 akx.9101.a.xenophobe.tooltip:0 "直线扭曲成环，圆环延伸为线。"
 akx.9101.a.egalitarian:0 "把圆环作为民族的象征。"
 akx.9101.a.egalitarian.tooltip:0 "有些东西来自我们的过去，而它们也将成为我们的未来。"
 akx.9101.a.authoritarian:0 "把圆环作为帝国的徽章。"
 akx.9101.a.authoritarian.tooltip:0 "有些东西源于我们的过去，而它们也将奠定我们的未来。"
 akx.9101.a.hive_mind:0 "尝试从圆环神庙里获知思维的意义。"
 akx.9101.a.hive_mind.tooltip:0 "一即所有，所有即一。"
 akx.9101.a.machine_intelligence:0 "尝试从圆环神庙里获知智能的意义。"
 akx.9101.a.machine_intelligence.tooltip:0 "所有即一，一即所有。"
 
 # 信使
 akx.9200.desc.robotic: "[Root.GetName]定位到了一个小体积、只有基本能源供应的物体，仅仅在当地的范围内循环广播着信号。这类物体通常都被作为逃生舱使用，看起来这个就是那些东西之一。它来到这里已经有非常久的时间了。\n\n当工作人员把它打开的时候——谨慎遵守着隔离守则——他们发现了一些古代的遗物，被放在无菌环境舱内保藏着。到此时为止，一切都是正常的。然而，[Root.GetName]的队长表明，他们并没有料到能够寻找到[Root.Owner.GetAdj]词汇§H已行之事，终将再行；将行之事，必为已行§!——用那个救生舱乘员的机油涂抹在舱壁上——船员们挖苦的把它称作信使。他们添加补充道：信使的机体构造和我们的机体构造上在设计学上有一些意想不到的相似之处。"
 akx.9201.desc.robotic: "我们已经确定了那个逃生舱在星际文明的早期是一种在市面贩售的仿制品——没有任何的新科技或者其他的特别信息。信使的残骸，相对来说就显得额外引人注目。它明显是[Root.Owner.GetAdj]的旧型号或者是改装体。或许我们有相似的起源——或者我们的设计理念被先驱者们操纵过。[researchingscientist.GetName]要求允许进行更广泛的研究。"
 MESSENGER_POD_PROJECT_2_UNLEASHED_ROBOTIC: "$MESSENGER_POD_PROJECT_2_UNLEASHED$"
 MESSENGER_POD_PROJECT_2_UNLEASHED_ROBOTIC_DESC: "初步发现表明，信使是一种更加高阶的智慧形态，尽管机体上更加脆弱。"
 MESSENGER_POD_PROJECT_2_LEASHED_ROBOTIC: "$MESSENGER_POD_PROJECT_2_LEASHED$"
 MESSENGER_POD_PROJECT_2_LEASHED_ROBOTIC_DESC: "初步发现表明，信使是一种远比我们更加坚固，并且可能，更具侵略性的机体形态。"
 akx.9210.desc.normal: "[researchingscientist.GetName]重构了信使的物种信息。它比我们虚弱，但是认知能力相比有着显著的提升。不论我们是不是起源种族，这都对我们造成了一些困惑，因为要么信使是我们的修改版，要么信使就是我们的祖先。对于我们来说，想象自己是一个如此贫弱的种族的后裔是一件有点尴尬的事情——但是[researchingscientist.GetName]坚信这个观点。他们认为我们种族认知能力上的落后实在是一种“悲剧”。\n\n这一“充满悲剧的现状”驱使他们接受逆转录病毒治疗来把他们的生理机能改造成信使。他们强调说这将会让他们更好地进行这个计划。"
 akx.9210.desc.robotic: "[researchingscientist.GetName]重构了信使的机体信息。它比我们虚弱，但是运算能力相比有着显著的提升。不论我们是不是起源种族，这都对我们造成了一些困惑，因为要么信使是我们的修改版，要么信使就是我们的试作品。对于我们来说，想象自己是一个如此贫弱的机体的改装是一件有点尴尬的事情——但是[researchingscientist.GetName]坚信这个观点。他们认为我们种族运算能力上的落后实在是一种“悲剧”。\n\n这一“充满悲剧的现状”驱使他们植入侵入式病毒程序来把他们的存储回路改造成信使。他们强调说这将会让他们更好地进行这个计划。"
 akx.9211.desc.robotic: "[researchingscientist.GetName]现在已经逆向了信使物种的机理。在丝毫没有停下来征询任何人的意见的情况下，他们也创造出了高传染性的侵入式病毒程序。病毒开始蔓延到了我们的世界。在它的影响下，我们的主体种族开始重启，并且在一天之后显现出信使物种的特征。这一事件的结果，讲道理，让某些人兴奋不已。"
 akx.9211.a.tooltip.gestalt: "所有首都行星的人口将会被转变，但是到此为止了。\n他们的外貌和特质都可能发生明显的转变。"
 akx.9211.c.robotic: "过去发生的，注定再次发生。我们会去改变。给我也植入程序吧。"
 akx.9211.c.tooltip.ethic: "这将会转变我们整个物种。\n我们的外貌、思潮和特质都可能发生明显的转变，乃至我们的政体。"
 akx.9211.c.tooltip.gestalt: "这将会转变我们整个物种。\n我们的外貌和特质都可能发生明显的转变，乃至我们的政体。"
 akx.9211.c.tooltip.gestalt.no_change: "这将会转变我们整个物种。\n我们的外貌和特质都可能发生明显的转变。"
 akx.9220.desc.normal: "[researchingscientist9220.GetName]对信使的基因进行了重组研究。他们的确十分出色，但也令我们的科学家有些担忧。与我们现在的基因相比较，信使明显更为强健，攻击意愿也更高。现在研究人员们众说纷纭，无法确定信使到底是我们自身的进化版本，还是说他们其实是我们的祖先。[researchingscientist9220.GetName]本人更相信后一种说法——我们本也应当作为强大的战斗物种生活下去，却因为某个先驱文明的干涉而失去了战斗本能。据其认为，失去这种战斗能力乃是我方史上最大的“悲剧”。\n\n有些研究人员甚至为此接受逆转录基因治疗，将自己的体质改造成了信使的特征。他们还坚持认为，这对研究的继续进行具有重大意义。"
 akx.9220.desc.robotic: "[researchingscientist9220.GetName]对信使的机体进行了逆向研究。他们的确十分出色，但也令我们的科学家有些担忧。与我们现在的机体相比较，信使明显更为坚固，攻击意愿也更高。现在研究人员们众说纷纭，无法确定信使到底是我们自身的改良版本，还是说他们其实是我们的试作品。[researchingscientist9220.GetName]本人更相信后一种说法——我们本也应当作为强大的战斗机器生活下去，却因为某个先驱文明的干涉而失去了战斗本能。据其认为，失去这种战斗能力乃是我方史上最大的“悲剧”。\n\n有些研究人员甚至为此植入侵入式病毒程序，将自己的机体改造成了信使的特征。他们还坚持认为，这对研究的继续进行具有重大意义。"
 akx.9221.desc.robotic: "[researchingscientist9220.GetName]现在已经逆向了信使物种的机理。在丝毫没有停下来征询任何人意见的情况下，他们也创造出了高传染性的侵入式病毒程序。病毒蔓延到了我们的世界。在它的影响下，我们的主流物种开始重启，并且在一天之后显现出信使物种的特征。这一事件的结果，讲道理，让某些人兴奋不已。"
 akx.9221.c.robotic: "已行之事，必将再行。给我也植入程序吧。"
 
 #负相传统
 akx.10020.a.tooltip:0 "随着时之螶的显现，另一个§M位面§!的存在也注意到了我们，并揭开了现实的帷幕。\n§R祂们抛来了橄榄枝，但代价是什么？§!\n创造$ASTRAL_RIFT$：§Y$astral_rift_akx_horror$§!"
 akx.10020.b.tooltip:0 "我们将开启§Y圆环仪式§!（§G战舰少女R§!）"
 
 time.502.name:0 "终焉馈赠"
 time.502.desc_1:0 "我们对负相的钻研与日俱增，来自终焉的未知存在显然对此感到非常满意。\n\n祂钻进我们的梦境里，祂钻进我们的耳朵里，祂钻进我们的眼睛里，祂钻进我们的脑海里。一份珍贵的馈赠从深渊中浮现，契约已经建立。"
 time.502.desc_2:0 "我们对负相的钻研与日俱增，来自终焉的未知存在显然对此感到非常满意，时之螶却似乎感到愤怒。\n\n祂钻进我们的梦境里，祂钻进我们的耳朵里，祂钻进我们的眼睛里，祂钻进我们的脑海里。契约缔结之际，时之螶破坏了仪式，但珍贵的馈赠早已从深渊中浮现。"
 time.502.a:0 "我们早已属于您，负相的主人。"
 time.502.b:0 "我们已另有所属，负相的神祇。"
 time.502.b.tooltip:0 "时之螶就像是护犊的母亲，粗暴地驱逐了其它的§M负相§!存在。\n§B祂最终决定亲自引导我们，以避免我们误入歧途。§!"
 
 #负相奥秘
 AP_HORROR_CHAIN_title:0 "时之螶：奥秘"
 AP_HORROR_CHAIN_desc:0 "$ap_time_desc$"
 ap_horror_chain_time:0 "时空奥秘"
 ap_horror_chain_circle:0 "圆环奥秘"
 ap_horror_chain_dimension:0 "位面奥秘"
 
 time.10.name:0 "负相位面：§H奥秘§!"
 time.10.desc:0 "时之螶撕裂了维度，慷慨地为我们指明了探索的方向。\n\n源源不断的负相物质自裂隙中流出，这给了我们研究负相的可能。这或许意味着灾难，但也可能蕴含着机遇。"
 time.10.a:0 "未知的大门即将向我们敞开。"
 time.10.a.tooltip:0 "$ASTRAL_RIFT$扩张：§Y$astral_rift_akx_time$§!\n§R裂隙连通着严峻又危险的负相深处，唯有最精锐的科学官才能担此重任！§!"
 time.11.name:0 "负相位面：§H时空§!"
 time.11.desc:0 "时空是载体。\n\n负相生物并非控制时空流动，而是它们的一切行为都随着时空流动而改变。但是，负相生物的意志总是恰好与时空的意志相吻合，控制时空对于它们而言没有任何意义，它们即时空。"
 time.11.a:0 "有趣。"
 time.11.a.tooltip:0 "§Y[time_secret_researcher.GetName]§!窥探了§Y时空§!的奥秘"
 time.12.name:0 "负相位面：§H圆环§!"
 time.12.desc:0 "圆环是目的。\n\n负相生物的一切行为都是为了实现自己的圆环，但圆环并不需要任何含义。它们自伊始至终结就是一遍又一遍实现圆环的过程，无限的圆环意味着无限的生命，也意味着无限的死亡。"
 time.12.a:0 "有趣。"
 time.12.a.tooltip:0 "§Y[circle_secret_researcher.GetName]§!窥探了§Y圆环§!的奥秘"
 time.13.name:0 "负相位面：§H位面§!"
 time.13.desc:0 "位面是动力。\n\n负相生物总会前往各种不同的位面，停留在负相位面无法实现它们的目的。而自由穿梭于不同位面的秘诀则在于恐怖负相物质，它通过奇点来连接各个位面，这也导致了黑洞的形成。"
 time.13.a:0 "有趣。"
 time.13.a.tooltip:0 "§Y[dimension_secret_researcher.GetName]§!窥探了§Y位面§!的奥秘"
 time.14.name:0 "负相位面：§H负相§!"
 time.14.desc_1:0 "对恐怖负相位面的研究彻底颠覆了我们以往的知识体系。\n\n时之螶耐心且温柔，她愿意告诉我们负相的奥秘。"
 time.14.desc_2:0 "对恐怖负相位面的研究彻底颠覆了我们以往的知识体系，界旅者似乎也在恐怖负相物质之中预见了自己的过去和未来。\n\n时之螶耐心且温柔，她愿意告诉我们负相的奥秘。\n时之螶智慧且神秘，她期盼给予旅者圆环的使命。"
 time.14.a:0 "我看到了无尽的奥秘……"
 time.14.b:0 "既是使者，也是旅者……"
 time.14.b.tooltip:0 "我们将抉择§Y界旅者§!的§R命运§!"
 
 time.501.name:0 "深渊嘶鸣"
 time.501.desc:0 "某个来自深渊的未知存在朝我们抛来了橄榄枝。\n\n我们不知祂有何目的，也不知这背后是否暗藏危机，但无论如何，负相位面的大门已向我们敞开。"
 time.501.a:0 "这是我们未曾踏足的领域。"
 
 #时空传统
 time.15.name:0 "负相位面：§H扩散§!"
 time.15.desc:0 "随着我们对§Y[Root.GetName]§!的完全掌控，恐怖负相物质也扩散到了这颗星球。有人认为这将§G揭示真相§!，但有人认为这会§R招致灾难§!。"
 time.15.a:0 "无论是福是祸，这都是我们自己的选择。"
 
 time.504.name:0 "负相位面：§H凝华§!"
 time.504.desc.a.1:0 "随着我们对负相位面了解程度的日益增加，裂缝中流淌着的负相物质也逐渐变得稳定起来。\n\n流动的黑色能量逐渐汇集、凝聚，并最终结晶成了一朵美丽的负相之花。这便是时之螶给予的爱，也是我们还以时之螶的吻。"
 time.504.desc.a.2:0 "随着我们对负相位面了解程度的日益增加，裂缝中流淌着的负相物质也逐渐变得稳定起来。\n\n流动的黑色能量逐渐汇集、凝聚，并最终结晶成了一朵美丽的负相之花。这便是主人给予的爱，也是我们还以主人的吻。"
 time.504.desc.b.1:0 "随着我们对负相位面了解程度的日益增加，裂缝中流淌着的负相物质也逐渐变得稳定起来。\n\n流动的黑色能量逐渐汇集、凝聚，并最终熔铸成难以计量的凝炼暗物质。这便是时之螶给予的爱，也是我们还以时之螶的吻。"
 time.504.desc.b.2:0 "随着我们对负相位面了解程度的日益增加，裂缝中流淌着的负相物质也逐渐变得稳定起来。\n\n流动的黑色能量逐渐汇集、凝聚，并最终熔铸成难以计量的凝炼暗物质。这便是主人给予的爱，也是我们还以主人的吻。"
 time.504.a.1:0 "旧有契约废弃，爱与时螶同在。"
 time.504.a.2:0 "主人仁慈慷慨，爱与负相同在。"
 time.504.b.1:0 "旧有契约废弃，吻与时螶同在。"
 time.504.b.2:0 "主人仁慈慷慨，吻与负相同在。"
 
