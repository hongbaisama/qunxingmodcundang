 ######################
 
 #时螶之界
 time_akx.10.name:0 "时螶之界：朦胧阴影"
 time_akx.10.desc:0 "根据巡逻船的定期回报，§Y[waiting_world.GetName]§!上不知从何时蒙上了一层阴影。\n\n任何光线都无法穿透星球的大气层，而大气内部的一切也都无法被我们探测。这或许与数年前的星球重置现象有关，因为巡逻队员同样观测到了“闪光事件”，投向§Y[waiting_world.GetName]§!的光线似乎是莫名其妙积累然后以五光十色的形式释放在行星表面上，但随后，它便不再反射光线，仿佛是将所有接近的光吞噬了一般。"
 time_akx.10.a:0 "这一定是某种暗示，仔细调查。"
 time_akx.10.b:0 "这对我们的光学研究有重要的意义。"
 time_akx.10.c:0 "这似乎意味着某种启示。"
 time_akx.10.d:0 "这是光线的美妙艺术。"
 
 time_akx.11.name:0 "时螶之界：质量效应"
 time_akx.11.desc:0 "根据特遣小队的调查，§Y[waiting_world.GetName]§!的质量远远超过一颗行星应有的标准。\n\n§Y[waiting_world.GetName]§!的质量极大，并仍有增大的趋势，而其体积却依旧维持行星的大小，故其中心密度在一定程度上满足了奇点形成的条件。星球的屏障实际上是一种初期的视界，闯入的光线与信号难以克服强大的引力逃逸。可以预见，§Y[waiting_world.GetName]§!很快就会成为一颗真正的黑洞，并不断扩大。"
 time_akx.11.a:0 "调用一切资源，阻止黑洞形成。"
 time_akx.11.b:0 "我们无法阻止黑洞的蔓延。"
 
 # 结局1
 time_akx.12.name:0 "时螶之界：光的界限"
 time_akx.12.desc:0 "我们的科学官想尽一切办法阻止物质被§Y[waiting_world.GetName]§!吸入，同时试图用欧米伽理论调节星球上的相对论效应，但全都收效甚微。\n\n出乎意料的是，§Y[waiting_world.GetName]§!的质量增长速率逐渐下降，星球甚至开始向外释放粒子，并最终稳定在了处于行星与恒星之间的状态。星球上的屏障也日益稀薄，环境也恢复成可堪生存的水平。不仅如此，我们在§Y[waiting_world.GetName]§!上发现了智慧生命的存在，他们自称是数年前消失的殖民者，并以“信使”自谓，但对于过去的经历却缄默不语。\n\n然而，大气中光的界限依然存在，或许星球核心的奇点并未完全湮灭。"
 time_akx.12.a:0 "接管他们的殖民地。"
 time_akx.12.b:0 "他们不值得信任。"
 
 # 结局2
 time_akx.13.name:0 "时螶之界：光的视界"
 time_akx.13.desc:0 "我们对于§Y[waiting_world.GetName]§!的增长无动于衷，最终，它变成了一颗小型的黑洞。\n\n随着阴影的逐渐扩大，一些嘈杂的信号穿过屏障抵达了我们的收讯器，但其内容太过混乱无法解析，我们只能认定为黑洞形成过程中所发射的无意义辐射。我们不清楚这颗黑洞会对星系中的引力场造成怎样的影响，但至少它目前稳定了下来。"
 time_akx.13.a:0 "这一现象值得研究。"
 
 
 
 time_akx.20.name:0 "时螶之界：阴森低语"
 time_akx.20.desc.1:0 "我们的殖民地§Y[waiting_world.GetName]§!传来了一些不好的消息。\n\n就在不久之前，星球上突然出现了一些异样，每当夜晚降临，城市的街巷中便会出现毫无来源的低语，建筑也莫名发出阴森的光芒。星球上的居民对这一现象感到不安，关于数年前的净化事件似乎也变成了流言在§Y[waiting_world.GetName]§!上散播。"
 time_akx.20.desc.2:0 "有人目击到了§Y[waiting_world.GetName]§!上的灵异现象。\n\n就在不久之前，星球上突然出现了一些异样，每当夜晚降临，散发着阴森光芒的城市悄无声息地显现，从中不时传来诡异的低语。途径§Y[waiting_world.GetName]§!的民用船只纷纷选择绕道，而关于数年前的净化事件似乎也变成了流言在平民中散播。"
 time_akx.20.a:0 "这些事自然有其原因。"
 time_akx.20.b:0 "这会是逝者的哭诉吗？"
 time_akx.20.c:0 "短暂的接触不良。"
 time_akx.20.d:0 "这种流言对于我们非常不利。"
 
 time_akx.21.name:0 "时螶之界：凄厉哀嚎"
 time_akx.21.desc.1:0 "殖民地§Y[waiting_world.GetName]§!上的灵异现象已经变本加厉。\n\n夜晚时的低语变成了凄厉的哀嚎，仿佛有什么正遭受着莫大的痛苦，建筑的光芒也变得愈发诡异，似乎能吞噬周边的热量。不仅如此，失踪事件也在星球上频发，居民们已经陷入了恐慌。"
 time_akx.21.desc.2:0 "§Y[waiting_world.GetName]§!上的灵异现象已经变本加厉。\n\n夜晚时的低语变成了凄厉的哀嚎，仿佛有什么正遭受着莫大的痛苦，城市的光芒也变得愈发明亮，似乎能吞噬周边的热量。不仅如此，一些大胆的货船也因途径星球而消失得无影无踪，几乎已经没有船只敢于靠近§Y[waiting_world.GetName]§!。"
 time_akx.21.a:0 "灵异现象只不过是巧合的装神弄鬼。"
 time_akx.21.b:0 "我们应当为逝者进行追悼。"
 time_akx.21.c:0 "殖民地与节点的联络已日渐衰弱。"
 time_akx.21.d:0 "或许我们做得确实过火了。"
 
 time_akx.22.name:0 "时螶之界：恶毒诅咒"
 time_akx.22.desc.1:0 "殖民地§Y[waiting_world.GetName]§!上的状况愈发严峻。\n\n不知是什么原因，星球上已经不再出现白天，永无止境的夜晚笼罩着§Y[waiting_world.GetName]§!。在漆黑的夜里，大规模的失踪事件变得司空见惯，居民们早已对现状变得麻木。他们说，这是亡者施于我们无法祛除的诅咒。"
 time_akx.22.desc.2:0 "§Y[waiting_world.GetName]§!上的状况愈发严峻。\n\n不知是什么原因，星球上已经不再出现白天，永无止境的夜晚笼罩着§Y[waiting_world.GetName]§!。在漆黑的夜里，过去的故人和失踪的旅者穿梭在闪烁的城市中，越来越多失控的船员加入了他们的游行。船员在离去前说，这是亡者施于我们无法祛除的诅咒。"
 time_akx.22.a:0 "诅咒……"
 time_akx.22.b:0 "我们请求神明的救赎。"
 time_akx.22.c:0 ""
 time_akx.22.d:0 "可是，他们是无辜的啊。"
 
 # 结局3
 time_akx.23.name:0 "时螶之界：亡者迷途"
 time_akx.23.desc.1:0 "§Y[waiting_world.GetName]§!上的殖民地消失了，仿佛它原本就不存在。\n\n然而，灵异现象并未就此休止，不少人目击到迷路的亡者徘徊在星球的地表上，误入其中的生者也都将陷入生死弥留的状态。\n\n生与死的界限在此地变得模糊。"
 time_akx.23.desc.2:0 "§Y[waiting_world.GetName]§!上的幽灵城市消失了，仿佛它不曾出现过。\n\n然而，灵异现象并未就此休止，不少人目击到迷路的亡者徘徊在星球的地表上，误入其中的生者也都将陷入生死弥留的状态。\n\n生与死的界限在此地变得模糊。"
 time_akx.23.a:0 "我们不得不承认幽灵的存在。"
 time_akx.23.b:0 "往日的冤魂终究没有原谅我们。"
 time_akx.23.c:0 "只敢躲在阴影里作祟的胆小鬼！"
 time_akx.23.d:0 "愿逝者安息……"
 time_akx.23.e:0 "我们当初本不该这么做的。"
 time_akx.23.f:0 "本是同根生，相煎何太急。"
 time_akx.23.g:0 "过去的政府应当为此负责。"
 time_akx.23.h:0 "我会亲自为亡者献上哀悼。"
 time_akx.23.i:0 "它们不再属于我们。"
 time_akx.23.j:0 "这就是死者的报复……"
 
 
 
 time_akx.30.name:0 "时螶之界：通透之心"
 time_akx.30.desc:0 "§Y[waiting_world.GetName]§!上的居民发生了一些变化。\n\n一些居民的身体突然变得半透明了起来，在阳光的照射下闪闪发亮。这些居民的日常生活并未受到较大影响，相反，半透明的身体似乎能减少日常活动的能量消耗，使他们能拥有更多的精力用于工作和享受。然而，时间概念对于他们而言逐渐模糊，他们表示，如果过去、现在、未来没有任何差异，那就不需要区分昨天、今天、明天。"
 time_akx.30.a:0 "这不对劲。"
 time_akx.30.b:0 "这真是个好消息。"
 
 time_akx.31.name:0 "时螶之界：虚空赠礼"
 time_akx.31.desc:0 "经过一番研究，我们的科学官成功找出了透明化的原因。\n\n在§Y[waiting_world.GetName]§!居民的基因中，出现了一处前所未有的基因片段。我们无从得知这一片段是何时嵌入当地居民的基因中，但正是这一片段影响了蛋白质的编码。一些具有奇特构造的细胞从未知的地方获取了一种透明物质，并将其用于蛋白质的合成与修饰上。\n\n我们只能认为，这处片段是来自虚空的馈赠。"
 time_akx.31.desc.robotic:0 "经过一番研究，我们的科学官成功找出了透明化的原因。\n\n在§Y[waiting_world.GetName]§!居民的机体中，出现了一块前所未有的机体元件。我们无从得知这一元件是何时嵌入当地居民的机体中，但正是这一片段影响了系统的自我修复。一些具有奇特构造的装置从未知的地方获取了一种透明物质，并将其用于机体部件的替换与修复上。\n\n我们只能认为，这块元件是来自虚空的馈赠。"
 time_akx.31.a:0 "我们可以利用它。"
 time_akx.31.b:0 "我们无法确保这处片段的安全性，修复它。"
 time_akx.31.b.robotic:0 "我们无法确保这块元件的可靠性，移除它。"
 time_akx.31.c:0 "真是奇妙。"
 
 # 结局4
 time_akx.32.name:0 "时螶之界：生于虚无"
 time_akx.32.desc:0 "我们的改进项目成功了。\n\n就像是龙头的阀门被完全开启，大量的透明物质涌入了居民的身体，隐藏的潜能也因此得以释放。时间对于星球上的居民们已毫无意义，因为他们能在一定程度上穿梭于过去和未来。我们的科学官无法理解这一能力的原因，有人推测这股力量来源于灵能，也有人怀疑这与负相位面有关，但科学官们最终给出了一个更为合理也更为荒诞的答案：当地居民能够在时空中透明化，因此得以在时间轴上任意流动。\n\n无论如何，当地居民已经自称“信使”，愿意为我们寻求过去和未来的真相。"
 time_akx.32.a:0 "生于虚无，归于虚无。"
 time_akx.32.a.tooltip:0 "为星球上的所有人口添加['concept_trait_akx_messenger']特质"
 
 # 结局5
 time_akx.33.name:0 "时螶之界：拨转时钟"
 time_akx.33.desc:0 "我们的修复项目成功了。\n\n无论他们愿不愿意，所有居民基因中的特殊片段都已被修复，§Y[waiting_world.GetName]§!上的透明化现象已不复存在。混乱的时钟已被校准，星球上的生活重归正轨，我们也从中获益匪浅。"
 time_akx.33.a:0 "我们拨转了时钟。"
 
 # 结局5
 time_akx.34.name:0 "时螶之界：拨转时钟"
 time_akx.34.desc:0 "我们的移除项目成功了。\n\n无论他们愿不愿意，所有居民机体中的古怪元件都已被移除，§Y[waiting_world.GetName]§!上的透明化现象已不复存在。混乱的时钟已被校准，星球上的生活重归正轨，我们也从中获益匪浅。"
 time_akx.34.a:0 "我们拨转了时钟。"
 
 # 结局6
 time_akx.35.name:0 "时螶之界：虚无缥缈"
 time_akx.35.desc:0 "§Y[waiting_world.GetName]§!上的透明化现象已经达到前所未有的高峰。\n\n星球上的所有居民都已经完全透明化，这一性质极大地便利了他们的日常生活与生产行为。但透明化也同时伴随着不少的缺陷，比如较低的生育能力、较短的人均寿命、以及因难以控制形体而变得古怪的外貌。但无论如何，当地居民对自己的透明能力十分满意，这对我们而言同样是个好消息。"
 time_akx.35.desc.robotic:0 "§Y[waiting_world.GetName]§!上的透明化现象已经达到前所未有的高峰。\n\n星球上的所有居民都已经完全透明化，这一性质极大地便利了他们的日常生活与生产行为。但透明化也同时伴随着不少的缺陷，比如较低的组装速率、较高的组装花费、以及因难以控制形体而变得冗余的外设。但无论如何，当地居民对自己的透明能力十分满意，这对我们而言同样是个好消息。"
 time_akx.35.a:0 "棒极了。"
 time_akx.35.b:0 "真的是好消息吗？"
 time_akx.35.tooltip:0 "为星球上的所有人口添加['concept_trait_akx_waiting_world_all']特质"
 
 
 
 MANIFOLD_COUNTRY:0 "[manifold_country.GetName]"
 
 time_akx.40.name:0 "时螶之界：梦魇呢喃"
 time_akx.40.desc:0 "还记得我们吗，我们是被你们放弃的殖民地建立起的国家，§Y[manifold_country.GetName]§!。\n\n我们并非找你们报复，也无意使你们难堪，我们只是来寻求帮助。最近，我们所有的国民都不约而同地做了一模一样的噩梦，梦中，一个梦魇在我们的耳边反复呢喃。我们认为这是某种存在给予我们的暗示，因此，我们打算利用欧米伽理论建造一座粒子对撞机以召唤梦魇。\n\n然而，我们对欧米伽理论的了解并不够深入，我们的资源也并不充裕。关于理论层面的问题，我们的科学官会尽可能解决，因此，我们希望你能在物质层面援助我们。"
 time_akx.40.a:0 "拿去吧，这是你们应得的。"
 time_akx.40.a.response:0 "非常感谢你们的帮助。"
 time_akx.40.b:0 "这和我们有什么关系？"
 time_akx.40.b.response:0 "我明白了，但我认为我们以后还有回旋的余地。"
 
 time_akx.41.name:0 "时螶之界：进化之路"
 time_akx.41.desc:0 "我们是§Y[manifold_country.GetName]§!，希望告诉你们新的进展。\n\n虽然我们的建造过程仍在继续，但那梦魇又再一次闯入了我们的梦境。它似乎非常高兴，慷慨地表示出对我们的赞赏，并告诉我们，我们正朝着进化终点大步迈进。这条进化之路究竟延伸向何方？我们的行程能否一帆风顺？这都不重要了，我们只知道，我们的所作所为是正确的。\n\n但是，我们的科学官仍然无法在欧米伽理论上取得突破，研究陷入了瓶颈。不过，你们曾经完成了欧米伽同调装置的建造，如果你们肯借出一名科学官帮助我们的科研，那我们很快就能召唤出梦魇。"
 time_akx.41.a:0 "我们同意。"
 time_akx.41.a.tooltip:0 "§Y[manifold_country_leader.GetName]§!将被派往§Y[manifold_country.GetName]§!，对方承诺会尽快归还。"
 time_akx.41.a.response:0 "有了你们的支援，我们的进展一定会如虎添翼。"
 time_akx.41.b:0 "我们拒绝分享我们的知识。"
 time_akx.41.b.response:0 "那真是太遗憾了。"
 
 time_akx.42.name:0 "时螶之界：升华之时"
 time_akx.42.desc.front:0 "§Y[manifold_country.GetName]§!为你带来最后的通讯。\n\n实在是令人兴奋，我们的建造完成了！"
 time_akx.42.desc.behind:0 "宏伟而神秘的粒子对撞机耸立在我们首都的最高峰，目前正在进行最后的调试，可以预见，升华之时很快就要来临！\n\n在召唤梦魇前的短暂时间内，我们很乐意分享我们关于梦境的所见所闻。"
 time_akx.42.desc.1:0 "$time_akx.42.desc.front$你们提供的物质援助帮了我们大忙，你们派出的科学官也做了极大的贡献，对了，§Y[manifold_country_leader.GetName]§!很快就会回到你们的身边。$time_akx.42.desc.behind$"
 time_akx.42.desc.2:0 "$time_akx.42.desc.front$你们提供的物质援助帮了我们大忙，这也为我们研究欧米伽理论奠定了基础，可以说，我们的成功和你离不开关系。$time_akx.42.desc.behind$"
 time_akx.42.desc.3:0 "$time_akx.42.desc.front$你们派出的科学官做了极大的贡献，帮助我们合理运用少得可怜的资源并实目标，对了，§Y[manifold_country_leader.GetName]§!很快就会回到你们的身边。$time_akx.42.desc.behind$"
 time_akx.42.desc.4:0 "$time_akx.42.desc.front$虽然你们并未给予我们任何帮助，但我们并不因此怨恨你们，我们只想分享我们全靠自己的努力取得成功的喜悦。$time_akx.42.desc.behind$"
 time_akx.42.a:0 "梦境中的梦魇是个怎样的存在？"
 time_akx.42.a.response:0 "梦魇，祂是一个全知全能的存在，祂同时现身于过去、现在、未来，祂既是时间本身。"
 time_akx.42.b:0 "你们从梦中得到了怎样的启示？"
 time_akx.42.b.response:0 "梦魇呼唤着我们，祂愿意实现我们的一切愿望。只要我们肯向祂许愿，祂便会引导我们前往进化的终点。"
 time_akx.42.c:0 "进化的终点究竟是怎样的世界？"
 time_akx.42.c.response:0 "那是一个完美的位面，生与死之间不存在界限，时间和空间也没有任何意义，一切都与宇宙融为一体。"
 time_akx.42.d:0 "愿你们成功抵达升华的彼岸。"
 time_akx.42.d.response:0 "非常感谢你的祝福。\n\n所有准备工作都已经就绪，那么，永别了。"
 time_akx.42.e:0 "真是愚蠢，你们这是在飞蛾扑火。"
 time_akx.42.e.response:0 "很遗憾，你最终无法理解我们。\n\n但是，所有准备工作都已经就绪，永别了。"
 
 time_akx.43.name:0 "时螶之界：受赞颂者"
 time_akx.43.desc:0 "他们启动了梦魇的召唤仪式。\n\n在一瞬间，他们所有的舰船都变得透明直到消失，所有的星球都被黑洞吞噬。这个国家仿佛在时间之中被划去，我们已记不起他们的名字与历史，似乎他们从未存在过。我们只能依稀回想起，他们试图朝着终点飞升。\n\n他们的飞升是成功还是失败了？这个问题或许只有他们自己能够解答，而我们可能永远也得不到真相。\n\n§G<背景音乐：《うたわれるもの·久遠》（《受赞颂者》 松岡純也）>§!"
 # 结局7
 time_akx.43.a:0 "我们称他们为——受赞颂者。"
 # 结局8
 time_akx.43.b:0 "有人称他们为——受赞颂者。"
 
 time_akx.44.desc:0 "§Y[manifold_country.GetName]§!为你带来最后的通讯。\n\n终于，终于，宏伟而神秘的粒子对撞机耸立在我们首都的最高峰，目前正在进行最后的调试，可以预见，升华之时很快就要来临！\n\n别担心，我们可不是什么毁灭整个银河只顾自己飞升的小人，我们的飞升既美丽又安全，我们也很乐意整个宇宙都来见证我们的最后时刻。\n\n我们就要开启大门了。"
 time_akx.44.a:0 "他们似乎打算自取灭亡。"
 time_akx.44.b:0 "在被我们毁灭前选择自杀？有趣。"
 time_akx.44.c:0 "真是一群疯子。"
 
 
 
 #信使
 time_akx.100.name:0 "信使：彼岸来客"
 time_akx.100.desc:0 "§Y[root.capital_scope.GetName]§!上突然出现了一扇巨大的门。\n\n没人知道它是什么时候出现的，也没人知道它是怎么出现在星球上的。这扇门坚如磐石，从这一端似乎无法将其开启，更无法窥见大门背后的光景。\n\n有人声称，这是来自命运的馈赠，门的另一端埋藏着无尽的资源；\n有人坚信，这是上天给予的考验，门的另一端意味着真理的启示；\n有人怀疑，这是末日前夕的征兆，门的另一端连通着死亡的国度。\n\n星球上的大多数居民都对此感到恐慌，但也有不少人对其深感兴趣。"
 time_akx.100.a:0 "这扇门背后隐藏着怎样的秘密？"
 time_akx.100.b:0 "这扇门背后隐藏着怎样的启示？"
 time_akx.100.c:0 "无论这扇门背后有什么，我们都能应付得住。"
 time_akx.100.d:0 "无论这扇门背后有什么，我们都能承受得起。"
 time_akx.100.e:0 "如果有彼岸的来客，他们一定会乐意成为我们的朋友。"
 time_akx.100.f:0 "如果有彼岸的来客，他们一定会后悔冒犯我们的领地。"
 time_akx.100.g:0 "不要恐慌，人民的力量必然能战胜危机。"
 time_akx.100.h:0 "不要恐慌，我们的指挥必然能防范危机。"
 time_akx.100.i:0 "这扇门有它存在的价值，谨慎对待。"
 time_akx.100.j:0 "封印这扇门，不要让任何人接近！"
 time_akx.100.j.tooltip:0 "§R我们将永远无法解开彼岸之门背后的秘密！§!"
 
 time_akx.130.name:0 "信使：信使网络"
 time_akx.130.desc:0 "§Y[root.capital_scope.GetName]§!上突然出现了一扇巨大的门。\n\n与此同时，一个由异常子个体自发组建的网络进入了我们的视野，我们暂不了解这座建筑与异常网络之间的联系。"
 time_akx.130.a:0 "既然它们存在，那就让它们存在。"
 time_akx.130.b:0 "二者之间存在必然的联系，进行分析。"
 time_akx.130.c:0 "立即铲除异常网络。"
 time_akx.130.c.tooltip:0 "§R我们将永远无法解开信使之门背后的秘密！§!"
 
