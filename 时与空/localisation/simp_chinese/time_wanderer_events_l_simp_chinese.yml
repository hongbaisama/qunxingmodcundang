l_simp_chinese:
 time_wanderer.3.name:0 "游荡奇点：§H徘徊幽灵§!"
 time_wanderer.3.desc:0 "一股强烈的引力异常席卷了§Y[Root.GetName]§!，人们的生活与工作都遭受了严重的影响，这一切的罪魁祸首或许就是那个神秘莫测的游荡奇点。"
 time_wanderer.3.a:0 "就像个不详的幽灵。"
 
 time_wanderer.5.name:0 "游荡奇点：§H怪异示数§!"
 time_wanderer.5.desc:0 "当我们的舰船驶入§Y[From.GetName]§!星系时，船上的传感器给出了奇怪的示数。\n\n计算机分析显示，这个星系中存在着一股诡异的引力场异常现象，仿佛有一个无形的奇点在星系中四处游荡。"
 time_wanderer.5.a:0 "真是有趣的现象。"
 
 time_wanderer.6.name:0 "游荡奇点：§H不速之客§!"
 time_wanderer.6.desc_1:0 "来自§Y[From.GetName]§!星系的传感器表明，有一个周遭出现引力场异常的诡异物体侵入了我们的领土。\n\n尽管星系的哨兵们立即进入了警戒状态，并尝试看清那个物体，但他们却无法观测到它的实体，仿佛那是一个无形的奇点。"
 time_wanderer.6.desc_2:0 "来自§Y[From.GetName]§!星系的传感器表明，有一个周遭出现引力场异常的诡异物体侵入了我们的领土。\n\n根据先前的经验，我们认为该物体就是那个游荡的奇点，但我们尚不清楚它会带来怎样的危害。"
 time_wanderer.6.a:0 "真是诡异。"
 time_wanderer.6.b:0 "继续追踪这个奇点。"
 time_wanderer.6.c:0 "它似乎并不会对我们造成威胁，以后不需要报告了。"
 
 time_wanderer.7.name:0 "游荡奇点：§H与死相连§!"
 time_wanderer.7.desc:0 "一份紧急报告被递交给了政府高层。\n\n§Y[time_wanderer_planet.GetName]§!在一瞬间变成了一颗黑洞，并且上面出现了疑似位面之魇的投影。我们的科学官对此深感疑惑，但可以肯定的是，这与那个游荡的奇点脱不了干系。\n\n如果这一次，是这颗星球遭到了吞噬，那下一次，与死相连的又会是哪里？"
 time_wanderer.7.a:0 "我有一种不详的预感。"
 time_wanderer.7.b:0 "该现象早已司空见惯，以后不需要报告了。"
 
 time_wanderer.10.name:0 "游荡奇点：§H视界信号§!"
 time_wanderer.10.desc_1:0 "来自§Y[From.GetName]§!星系的传感器表明，有一个周遭出现引力场异常的诡异物体侵入了我们的领土。\n\n尽管星系的哨兵们立即进入了警戒状态，并尝试看清那个物体，但他们却无法观测到它的实体，仿佛那是一个无形的奇点。\n\n就在众人倍感疑惑时，那物体向我们发来了信号，而信号的规律似乎与当初时之螶的信号十分接近。"
 time_wanderer.10.desc_2:0 "来自§Y[From.GetName]§!星系的传感器表明，有一个周遭出现引力场异常的诡异物体侵入了我们的领土。\n\n根据先前的经验，我们认为该物体就是那个游荡的奇点，不过这次，它向我们发来了信号，并且信号的规律似乎与当初时之螶的信号十分接近。"
 time_wanderer.10.a:0 "分析视界信号。"
 time_wanderer.10.a.tooltip:0 "§Y尝试与游荡奇点进行第一次接触。§!"
 time_wanderer.10.b:0 "这是个危险的家伙，屏蔽信号！"
 
 fcsum_time_wanderer_1:0 "我们发现，游荡奇点所发送的信号是反向信号。"
 fcsum_time_wanderer_2:0 "游荡奇点的信号既诡异又神秘。"
 fcsum_time_wanderer_3:0 "界旅者发现了隐藏的坐标。"
 fcsum_time_wanderer_4:0 "界旅者与死共舞，但并未解开游荡奇点之谜。"
 fcsum_time_wanderer_5:0 "死亡之吻险些吞噬界旅者，而我们仍未解开游荡奇点之谜。"
 fcsum_time_wanderer_6:0 "游荡奇点重归死寂，再多的接触也只是徒劳。"
 
 time_wanderer.11.name:0 "游荡奇点：§H反向信号§!"
 time_wanderer.11.desc:0 "经过翻译小组的仔细对比，我们发现，游荡奇点所发出的信号也是反向信号，也就是界旅者在白洞中曾发给我们的信号类型。\n\n我们很快就联系了界旅者，但界旅者本人也不清楚为何游荡奇点会使用她曾经使用的信号。或许二者之间存在某种隐藏的联系，也或者只是一个曼妙的巧合，不过界旅者已经加入了翻译小组，准备与我们一同找出真相。"
 time_wanderer.11.a:0 "真是奇怪。"
 
 time_wanderer.12.name:0 "游荡奇点：§H来自深渊§!"
 time_wanderer.12.desc:0 "尽管有了界旅者的帮助，对游荡奇点的第一次接触仍然算不上顺利。\n\n不同于界旅者之前发出的信号，游荡奇点的信号中充满了残暴的嘶吼和凄厉的哀嚎，仿佛奇点内部是一个装满亡魂的深渊。\n\n尽管翻译小组的成员们都难以忍受这诡异的信号，但界旅者仍默默地倾听着一切，仿佛是在与曾经的自己交流，忧愁又哀伤。"
 time_wanderer.12.a:0 "她不该独自承担。"
 
 time_wanderer.13.name:0 "游荡奇点：§H黄泉邀约§!"
 time_wanderer.13.desc_1:0 "界旅者准备动身，并独自前往游荡奇点所在的位置。\n\n据界旅者表示，游荡奇点的信号中隐藏了一个坐标，而这个坐标恰恰就是游荡奇点当前所在的位置。因此，她认为，如果直接与游荡奇点接触，或许我们就能解开游荡奇点背后的秘密。\n\n然而，翻译小组的其它成员则表示这个坐标就是个假坐标，它所指向的根本不是游荡奇点的所在地，而是数学层面上更高维度的一个位置。\n\n我们认为界旅者不会无缘无故地欺骗我们，她也许有自己独特的见解，但这一举动可能会令她陷入危机，我们该如何决定？"
 time_wanderer.13.desc_2:0 "界旅者从游荡奇点的信号中找出了一个坐标。\n\n据界旅者表示，这个坐标恰恰就是游荡奇点当前所在的位置。因此，她认为，如果直接与游荡奇点接触，或许我们就能解开游荡奇点背后的秘密。\n\n然而，翻译小组的其它成员则表示这个坐标就是个假坐标，它所指向的根本不是游荡奇点的所在地，而是数学层面上更高维度的一个位置。\n\n我们认为界旅者不会无缘无故地欺骗我们，她也许有自己独特的见解，但界旅者目前处于紧急跃迁状态，暂时无法前往坐标，我们只能耐心等待。"
 time_wanderer.13.a:0 "允许界旅者行动。"
 time_wanderer.13.a.tooltip:0 "§R界旅者即刻出发，我们将暂时无法与界旅者进行通讯。§!"
 time_wanderer.13.b:0 "太危险了，阻止她。"
 time_wanderer.13.b.tooltip:0 "§R界旅者不会出发，我们只能等待游荡奇点的下一条讯息。§!"
 time_wanderer.13.c:0 "我们别无他法，只能等待。"
 time_wanderer.13.c.tooltip:0 "§R界旅者无法出发，我们只能等待游荡奇点的下一条讯息。§!"
 
 time_wanderer.14.name:0 "游荡奇点：§H与死共舞§!"
 time_wanderer.14.desc:0 "界旅者使用了她独特的时空穿梭能力，可她并没有出现在游荡奇点附近。\n\n然而，翻译小组却从来自游荡奇点的信号中找出了界旅者传来的讯息。讯息中，界旅者表示，她非常庆幸能够遇见我们，我们拯救了她无数次，而她却不知该怎么报答我们，现在又要任性地离开我们，她感到很抱歉。\n\n但好在，这并非诀别的遗言，界旅者还是平安无恙地回到了我们身边。界旅者俏皮地眨了眨眼，似乎对她小小的恶作剧很满意。\n\n界旅者回忆道，她是穿梭到了一个更高的维度，可惜那里也并非游荡奇点的本体。不过，她和游荡奇点一同在未知的世界中飘浮、旋转，就像是与危险的死神一同起舞。但也仅此而已，我们仍然没有解开游荡奇点的谜题。\n\n不过可以肯定的是，界旅者与游荡奇点之间一定存在着联系，这绝不是偶然。"
 time_wanderer.14.a:0 "你回来就好。"
 time_wanderer.14.a.tooltip:0 "§Y如果有合适的契机，也许未来我们真的能解开游荡奇点的秘密。\n也许……§!"
 
 time_wanderer.15.name:0 "游荡奇点：§H死亡之吻§!"
 time_wanderer.15.desc:0 "界旅者使用了她独特的时空穿梭能力，并出现在了游荡奇点附近。\n\n与此同时，翻译小组从来自游荡奇点的信号中找出了一些奇特的片段，里面描绘了各式各样的情景。虽然我们并未经历过这些情景，但它们显得既熟悉又陌生，因为这些片段讲述的正是我们与界旅者的故事。\n\n忽然间，片段戛然而止，我们收到了界旅者的讯息。界旅者在游荡奇点附近并没能获得什么收获，于是便尝试继续深入，却不慎被奇点的引力捕获，在即将坠入视界时进行了紧急时空跃迁。\n\n此后，游荡奇点再也没有传来任何信号。"
 time_wanderer.15.a:0 "我们还会再见的。"
 time_wanderer.15.a.tooltip:0 "§Y如果有合适的契机，也许未来我们真的能解开游荡奇点的秘密，但不是现在……§!"
 
 time_wanderer.16.name:0 "游荡奇点：§H重归死寂§!"
 time_wanderer.16.desc:0 "我们静静地等待着游荡奇点的下一条讯息，但迟迟没能等到。\n\n或许是因为我们没能及时赴约，或许是游荡奇点本来就不准备与我们继续沟通，无论如何，游荡奇点附近重归死寂。"
 time_wanderer.16.a:0 "为什么？"
 time_wanderer.16.a.tooltip:0 "§R我们再也无法获取更多的信息，只得废止该第一次接触。§!"
 
 time_wanderer.20.name:0 "游荡奇点：§H往昔残音§!"
 time_wanderer.20.desc_1:0 "我们从来源于游荡奇点的不规则电磁辐射中意外解读到了数个意义不明的词汇：\n§Y"
 time_wanderer.20.desc_2:0 "§!\n我们暂时无法分析出这些词汇之间的联系，只能等待下一个契机。"
 time_wanderer.21.name:0 "$time_wanderer.20.name$"
 time_wanderer.21.desc:0 "$time_wanderer.20.desc_1$“风”\n“白鸟”\n“故乡”$time_wanderer.20.desc_2$"
 time_wanderer.21.a:0 "熟悉又陌生。"
 time_wanderer.22.name:0 "$time_wanderer.20.name$"
 time_wanderer.22.desc:0 "$time_wanderer.20.desc_1$“思念”\n“梦”\n“躯体”$time_wanderer.20.desc_2$"
 time_wanderer.22.a:0 "似乎是首歌。"
 time_wanderer.23.name:0 "$time_wanderer.20.name$"
 time_wanderer.23.desc:0 "$time_wanderer.20.desc_1$“过去”\n“未来”\n“谜”$time_wanderer.20.desc_2$"
 time_wanderer.23.a:0 "时间的问题。"
 time_wanderer.24.name:0 "$time_wanderer.20.name$"
 time_wanderer.24.desc:0 "$time_wanderer.20.desc_1$“时空”\n“圆”\n“位面”$time_wanderer.20.desc_2$"
 time_wanderer.24.a:0 "负相的答案。"
 time_wanderer.25.name:0 "$time_wanderer.20.name$"
 time_wanderer.25.desc:0 "$time_wanderer.20.desc_1$“点”\n“镜”\n“摘录者”$time_wanderer.20.desc_2$"
 time_wanderer.25.a:0 "关键之所在。"
 
 TIME_WANDERER_CHAIN_title:0 "游荡奇点"
 TIME_WANDERER_CHAIN_desc:0 "游荡奇点，究竟是什么？"
 
 time_wanderer.100.desc:0 "游荡奇点？我说不上来。\n\n虽然我一直对它有股莫名其妙的熟悉感，也尝试过私下研究它，但它却又总是对我若即若离。不过，自从我调查了圣仆之谜以后，我就有了一个异想天开的猜想，可那也只是猜想，我没有证据能够证明。"
 time_wanderer.100.a:0 "那就再对[hole_pets.GetName]展开一次研究吧。"
 time_wanderer.100.a.response:0 "就等你这句话了，那让我们看看另一个世界的我们留下了什么宝贵的信息吧。"
 
 time_wanderer.101.desc:0 "抱歉，虽然研究了这么久，但我似乎还是没有什么进展。不过，对黑洞的研究让我获取了一些有趣的数据，或许会对你们有所帮助。"
 time_wanderer.101.a:0 "没关系，总会有结果的。"
 time_wanderer.101.a.response:0 "嗯，我会继续努力的。"
 
 time_wanderer.102.desc:0 "研究似乎有了一些进展，但发现真相似乎仍然遥遥无期。不过，我也不是毫无收获，我整理了一些有关另一个世界的历史文化档案，已经传输回首都了。"
 time_wanderer.102.a:0 "真是太感谢了。"
 time_wanderer.102.a.response:0 "（少女不好意思地转过了身。）"
 
 time_wanderer.103.desc:0 "我已经获取了不少的证据，我愈发感觉到我的猜想可能是正确的了。对了，我找到了一些从视界中吐出的残骸，或许是无限神机留下来的？"
 time_wanderer.103.a:0 "我们会好好利用的。"
 time_wanderer.103.a.response:0 "我相信，我们很快就能找到答案。"
 
 time_wanderer.104.desc:0 "随着研究的日益推进，我反而越来越感到害怕。因为我害怕我的猜想是真的，我害怕过去的我、未来的我全都未能走向好的末路，而这一切都是因为我得到了救赎……"
 time_wanderer.104.a:0 "“未来未来，不确定的才是未来”，这是你教我的。"
 time_wanderer.104.a.response:0 "欸？\n\n对啊，未来未来，不确定的才是未来，无论过去发生了什么，无论未来发生了什么，都有你站在我的身边，一起坦然地面对未来。"
 
 time_wanderer.105.desc:0 "我的猜想果然是对的，但一切都已经发生了，即使后悔也来不及了。\n\n实际上，游荡奇点就是我。\n准确来说，是在黑洞边缘未被你拯救的我、在白洞回溯中撞上黑洞而支离破碎的我、在终末之前吞噬银心却化作终末的我……是无数个因果之外的我的意识集合体，而这或许是我们超越因果而引发的代价。\n游荡奇点实际上处于另一个位面，我们所观测到的实际只是它投射到当前宇宙的映像。\n\n这一切听起来都是那么得匪夷所思又令人毛骨悚然吧？不过，我尝试利用命运的破绽和游荡奇点中的无数个我进行了一次交流。"
 time_wanderer.105.a:0 "她们说了什么？"
 time_wanderer.105.a.response:0 "她们告诉我：“这就是未来啊。”\n\n或许，我们的超越因果确实导致了无数个我的悲剧，但无数个我的悲剧是必然的，我们的超越因果也同样是必然的。\n即使这个世界的我没有超越因果，也会有其它世界的我成功超越了因果。纵然有无数个我承受着痛苦，但同样有无数个我享受着自由的喜悦。\n成功也好，失败也好，这都是循环的必然。\n\n我们超越了因果，但都未能打破时之螶的循环。\n或许循环本身就永远无法被打破，我们的小把戏只是时之螶对淘气的孩子一时的骄纵。\n\n但这一切都毫无意义吗？\n§P当然不是，至少我们现在，仍能紧紧相拥。§!\n\n§Y<你与少女忘我地抱在一起，来自过去的幽灵也悄无声息地离开了这个位面。>§!"
 
 time_wanderer.115.desc:0 "喂，等等，我还没……"
 time_wanderer.115.a:0 "不好意思，我手滑了。"
 
 time_wanderer.120.desc:0 "……发生了什么？\n\n我好像做了一个很长很长的梦，似乎已经睡了足足一百年，可是……"
 time_wanderer.120.a:0 "不，不必担心，你只是稍微小憩了一会。"
 time_wanderer.120.a.response:0 "呃，是这样吗……\n\n§R<请不要作弊！>§!"