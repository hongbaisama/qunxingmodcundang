l_english:
 r_horror_matter_modifier:0 "§MPlane Research§!"
 r_horror_matter_modifier_desc:0 "§MWe touched an unnoticed plane. It is close at hand yet far away. What mysteries are hidden there?§!"
 
 r_time_modifier_1:0 "§MInverse Phase Detection§!"
 r_time_modifier_1_desc:0 "§MWe are hungrily exploring the Inverse Plane. Infinite knowledge overturned original cognition.§!"
 r_time_modifier_2:0 "$r_time_modifier_1$"
 r_time_modifier_2_desc:0 "$r_time_modifier_1_desc$"
 r_time_modifier_3:0 "$r_time_modifier_1$"
