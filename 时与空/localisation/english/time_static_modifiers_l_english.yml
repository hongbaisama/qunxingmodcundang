 time_haze:0 "Horizon Haze"
 time_haze_desc:0 "This planet's surface formed an incomplete event horizon similar to a Black Hole, filled with chaos and disorder."
 second_time_homeworld:0 "Second Horizon"
 second_time_homeworld_desc:0 "This planet completely turned into a Black Hole under the shroud of haze; it has become our second home."
 time_wormhole:0 "Horizon Wormhole"
 time_wormhole_desc:0 "This planet is closely connected to §Y[time_wormhole_core_planet.GetName]§!. All material exchange will be maintained through the wormhole."
 time_wormhole_core:0 "Singularity Wormhole"
 time_wormhole_core_desc:0 "The Galactic Core Singularity is closely connected to §Y[time_wormhole_planet.GetName]§!. We have opened up a world of our own."
 
 time_hotel_modifier_1:0 "Warning of Time Prison"
 time_hotel_modifier_1_desc:0 "The story behind the Time Prison alerted every citizen of the empire. Everyone will think about their future before destroying social stability."
 time_hotel_modifier_2:0 "Secret of Time Prison"
 time_hotel_modifier_2_desc:0 "The secrets hidden in the Time Prison are conducive to planetary construction, ship assembly, and resolution implementation, but we still haven't fully mastered its principles."
 
 origin_contract_composer_assimilation:0 "What is Sought: Filling"
 origin_contract_composer_assimilation_desc:0 "Whispers satisfy the will of §Y$the_composer_of_strands$§!, and we are also satisfied with infinite craving."
 origin_contract_cradle_assimilation:0 "What is Sought: Containment"
 origin_contract_cradle_assimilation_desc:0 "Whispers satisfy the will of §Y$the_cradle_of_souls$§!, and we are also satisfied with infinite craving."
 origin_contract_eater_assimilation:0 "What is Sought: Conquest"
 origin_contract_eater_assimilation_desc:0 "Whispers satisfy the will of §Y$the_eater_of_worlds$§!, and we are also satisfied with infinite craving."
 origin_contract_instrument_assimilation:0 "What is Sought: Dominion"
 origin_contract_instrument_assimilation_desc:0 "Whispers satisfy the will of §Y$the_instrument_of_desire$§!, and we are also satisfied with infinite craving."
 
 psionic_origin_best:0 "Consecrated Psionic Source"
 psionic_origin_best_desc:0 "This planet is directly connected to the Shroud and continuously produces extreme amounts of psionics."
 psionic_origin_best_effect:0 "Unlocks exclusive designation when capital: $col_psionic_best_capital$\n£district£$district_psionic_generator$: No Limit\n£district£$district_psionic_mining$: No Limit\n£district£$district_psionic_farming$: No Limit\nOther colonies in empire:\n$t$$MOD_PLANETARY_ASCENSION_COST_MULT$: §G-10%§!\n$t$$mod_col_psionic_mult$: §G+25%§!"
 psionic_origin_best_other_planets:0 "$psionic_origin_best$"
 psionic_origin_best_other_planets_desc:0 "$psionic_origin_best_desc$"
 unlock_col_psionic:0 "Unlocks exclusive designation: §Y$col_psionic_capital$§!"
 psionic_origin:0 "Psionic Source"
 psionic_origin_desc:0 "This planet is directly connected to the Shroud and continuously produces psionics."
 best_psionic:0 "Powerful Psionic Wave"
 best_psionic_desc:0 "This planet is filled with powerful psionic waves, and the environment is very similar to the Shroud."
 good_psionic:0 "Stable Psionic Wave"
 good_psionic_desc:0 "This planet is filled with stable psionic waves. Shroud Visitors can make good use of this wave."
 normal_psionic:0 "Psionic Wave"
 normal_psionic_desc:0 "This planet is filled with psionic waves. Shroud Visitors can use this wave to a certain extent."
 bad_psionic:0 "Fragile Psionic Wave"
 bad_psionic_desc:0 "This planet is filled with fragile psionic waves. Shroud Visitors have difficulty using this wave."
 worst_psionic:0 "Chaotic Psionic Wave"
 worst_psionic_desc:0 "This planet is filled with chaotic psionic waves. Even Shroud Visitors cannot withstand this wave well."
 psionic_disaster:0 "Psionic Fear"
 psionic_disaster_desc:0 "The occurrence of psionic disasters makes people fear psionics, and society has difficulty maintaining normal order."
 
 nanites_1:0 "Collecting Nanite Machines"
 nanites_1_desc:0 "There are many scattered Nanite Machines in the atmosphere of this planet. Pops on the planet are collecting them."
 nanites_2:0 "Recycling Nanite Machines"
 nanites_2_desc:0 "This planet has many abandoned Nanite Machines buried deep. Pops on the planet are recycling them."
 nanites_3:0 "Repairing Nanite Machines"
 nanites_3_desc:0 "There are many damaged Nanite Machines on this planet. Pops on the planet are repairing them."
 nanites_4:0 "Assembling Nanite Machines"
 nanites_4_desc:0 "This planet needs many brand-new Nanite Machines. Pops on the planet are assembling new types of Nanite Machines."
 nanites_5:0 "Modifying Nanite Machines"
 nanites_5_desc:0 "This planet needs many special Nanite Machines. Pops on the planet are modifying existing Nanite Machines."
 nanites_nanotech_swarm_consume_world_effect_same:0 "§YNanite Districts provide extra jobs§!"
 nanites_nanotech_swarm_consume_world:0 "Active Nanite Overload"
 nanites_nanotech_swarm_consume_world_desc:0 "This planet has been transformed to feed the swarm and grow our existence."
 nanites_nanotech_swarm_consume_world_effect:0 "$nanites_nanotech_swarm_consume_world_effect_same$\nUnlocks exclusive designation: §Y$col_nanites_nanotech$§!"
 nanites_nanotech_swarm_consume_world_special:0 "$nanites_nanotech_swarm_consume_world$"
 nanites_nanotech_swarm_consume_world_special_desc:0 "$nanites_nanotech_swarm_consume_world_desc$"
 nanites_nanotech_swarm_consume_world_special_effect:0 "$nanites_nanotech_swarm_consume_world_effect_same$\nUnlocks exclusive designation when capital: §Y$col_nanites_capital_machine_nanotech$§!"
 nanites_attacker:0 "§RNanite Destroyer§!"
 nanites_attacker_desc:0 "Our mission: §RDestroy the galaxy§!."
 nanites_protector:0 "§CNanite Guardian§!"
 nanites_protector_desc:0 "Our mission: §CGuard the galaxy§!."
 nanites_protector_tooltip:0 "Damage to End-Game Crisis factions: §G+50%§!\n$mod_damage_vs_country_type_gray_goo_mult$: §G+100%§!\n$mod_damage_vs_country_type_default_mult$: §R-500%§!"
 
 origin_black_hole_modifier:0 "Gaze in the Abyss"
 origin_black_hole_modifier_desc:0 "Influenced by the Black Hole, physical science and technology developed rapidly, while the indifference of human feelings and the attraction of the Black Hole stagnated other sciences."
 origin_pulsar_modifier:0 "Spirit in the Pulsar"
 origin_pulsar_modifier_desc:0 "Influenced by the Pulsar, social science and technology developed rapidly, while endless contemplation and pulsar interference stagnated other sciences."
 origin_neutron_star_modifier:0 "Neutron under the Bulwark"
 origin_neutron_star_modifier_desc:0 "Influenced by the Neutron Star, engineering science and technology developed rapidly, while blind busyness and neutron oppression stagnated other sciences."
 
