 r_time_modifier_5:0 "$r_time_modifier_1$"
 r_time_modifier_5_desc:0 "$r_time_modifier_1_desc$"
 r_time_modifier_6:0 "§MSpacetime Insight§!"
 r_time_modifier_6_desc:0 "§MWe have known the Inverse Plane like the back of our hand for a long time, but the delving into spacetime is endless.§!"
 r_time_modifier_7:0 "$r_time_modifier_6$"
 r_time_modifier_7_desc:0 "$r_time_modifier_6_desc$"
 r_time_modifier_8:0 "$r_time_modifier_6$"
 r_time_modifier_8_desc:0 "$r_time_modifier_6_desc$"
 r_time_modifier_9:0 "$r_time_modifier_6$"
 r_time_modifier_9_desc:0 "$r_time_modifier_6_desc$"
 r_time_modifier_10:0 "§MHeart of the End§!"
 r_time_modifier_10_desc:0 "§MThe Inverse Plane has been completely analyzed by us.\nWe are no longer who we used to be; we have stepped into a different river long ago.§!"
 
 time_dimensional_horror_modifier:0 "Gaze"
 time_dimensional_horror_modifier_desc:0 "Where the loop is, shadows follow."
 time_worm_manifestation:0 "Gaze"
 time_worm_manifestation_desc:0 "Where the loop is, shadows follow."
 time_horror:0 "Spacetime Gift"
 time_horror_desc:0 "This §YManifested Horrific Inverse Mass§! comes from the deepest part of the §YHorrific Inverse Plane§!.\nIt is the original body for our replication of Inverse Phase matter, and also the key to our discovery of the secrets of the Inverse Plane."
 time_cycle_modifier:0 "Spacetime Loop"
 time_cycle_modifier_desc:0 "We have achieved a spacetime loop: our present selves provide help to the past, and our future selves contribute to the present.\n§MWe love ourselves forever.§!"
 
 time_0_planet_modifier:0 "Horizon Destiny"
 time_0_planet_modifier_desc:0 "We already belong to the Black Hole.\nEven though we did not choose, fate in the horizon gave us the opportunity to understand spacetime."
 time_1_planet_modifier:0 "Horizon History"
 time_1_planet_modifier_desc:0 "We originally belonged to the Black Hole.\nEven though we don't like it, history in the horizon did bring us many benefits."
 time_2_planet_modifier:0 "Horizon Data"
 time_2_planet_modifier_desc:0 "We once belonged to the Black Hole.\nEven though we have gone far away, data in the horizon still accelerated our scientific research progress."
 time_3_planet_modifier:0 "Horizon Signal"
 time_3_planet_modifier_desc:0 "We will belong to the Black Hole.\nEven though we have no way of knowing, the signal in the horizon is leading us to an unknown ending."
 origin_time_earth_modifier:0 "Before Horizon"
 origin_time_earth_modifier_desc:0 "This is not the original appearance of this planet, but we can no longer know its history before the horizon."
 akx_time_erasure_system_modifier:0 "Void"
 akx_time_erasure_system_modifier_desc:0 "This system has been erased from spacetime."
 akx_time_erasure_planet_modifier:0 "Void"
 akx_time_erasure_planet_modifier_desc:0 "This planet has been erased from spacetime."
 time_wanderer_system_modifier:0 "Invisible Singularity"
 time_wanderer_system_modifier_desc:0 "Some abnormality seems to have appeared in this system. Judging from the gravitational field within the system, it seems that an invisible singularity is wandering everywhere in the system."
 time_wanderer_planet_modifier:0 "Invisible Singularity"
 time_wanderer_planet_modifier_desc:0 "Some abnormality seems to have appeared on this planet. Judging from the surrounding gravitational field, it seems that an invisible singularity is wandering around the planet."
 time_wanderer_black_hole_modifier:0 "Connected to Death"
 time_wanderer_black_hole_modifier_desc:0 "This planet was swallowed by the Wandering Singularity, and the projection of the Nightmare of the Plane on it seems to declare the sovereignty of the Black Hole."
 time_wanderer_modifier:0 "Dancing with Death"
 time_wanderer_modifier_desc:0 "The Dimension Traveler brought a gift for the banquet from the abyss."
 time_wanderer_false_modifier:0 "Kiss of Death"
 time_wanderer_false_modifier_desc:0 "The critical data recorded by the Dimension Traveler before the emergency jump is of great research value."
 
 time_lifeline_just_a_dream:0 "Just a Dream"
 time_lifeline_just_a_dream_desc:0 "We had a long dream, but was that really just a dream?"
 time_lifeline_i_am_sorry:0 "I Am Sorry"
 time_lifeline_i_am_sorry_desc:0 "The distress caller is sorry for failing to keep the promise, and we are sorry that the distress caller cannot escape death."
 time_lifeline_traveler_in_dream:0 "Traveler in Dream"
 time_lifeline_traveler_in_dream_desc:0 "We cannot prove that the universe we live in is not inside a Black Hole, just as we cannot use things in a dream to prove whether we are in a dream.\n§YBut in the endless future, we will find the answer. Definitely.§!"
 time_lifeline_rule_of_time:0 "Rule of Time"
 time_lifeline_rule_of_time_desc:0 "Never underestimate time. Time has time's rules.\n§YJust as we have our responsibilities, she has her mission.§!"
 time_lifeline_song_of_circle:0 "Song of the Loop"
 time_lifeline_song_of_circle_desc:0 "On the ruins of civilization, a new civilization is sprouting.\n§YThis is a lullaby dedicated to the departed.§!"
 time_lifeline_identical_twins:0 "Identical Twins"
 time_lifeline_identical_twins_desc:0 "The same planet in different universes overlaps each other. How to prove? How to falsify?\n§YOne day, we can touch the truth of the universe; one day, we can become Laplace's Demon.§!"
 time_lifeline_closed_loop:0 "Closed Loop"
 time_lifeline_closed_loop_desc:0 "The achievement of a closed loop, the curtain call of a story."
 time_lifeline_civilization_afterglow:0 "Civilization Afterglow"
 time_lifeline_civilization_afterglow_desc:0 "These semi-finished Time Crystals may be the last glory of a civilization."
 time_lifeline_civilization_afterglow_gestalt:0 "$time_lifeline_civilization_afterglow$"
 time_lifeline_civilization_afterglow_gestalt_desc:0 "$time_lifeline_civilization_afterglow_desc$"
 time_lifeline_mirror_world:0 "Mirror World"
 time_lifeline_mirror_world_desc:0 "A lake connects the surface and the underground. Similar but different worlds mirror each other."
 time_lifeline_my_last_mission:0 "Last Mission"
 time_lifeline_my_last_mission_desc:0 "The distress caller opened up the correct course for herself at different times. She used her life to achieve the final mission."
 time_lifeline_there_is_no_wonder:0 "No Miracle"
 time_lifeline_there_is_no_wonder_desc:0 "No miracle happened. We witnessed the end of the distress caller's life."
 time_lifeline_there_is_no_wonder_gestalt:0 "$time_lifeline_there_is_no_wonder$"
 time_lifeline_there_is_no_wonder_gestalt_desc:0 "$time_lifeline_there_is_no_wonder_desc$"
 time_lifeline_fly_against_fire:0 "Moth to a Flame"
 time_lifeline_fly_against_fire_desc:0 "The moth flew towards the light of survival, unaware that it was fatal lightning."
 time_lifeline_finally_be_oblation:0 "Finally an Oblation"
 time_lifeline_finally_be_oblation_desc:0 "The sacrifice was interrupted and restarted. She eventually became an oblation."
 time_lifeline_finally_be_oblation_gestalt:0 "$time_lifeline_finally_be_oblation$"
 time_lifeline_finally_be_oblation_gestalt_desc:0 "$time_lifeline_finally_be_oblation_desc$"
 time_lifeline_finally_be_oblation_spiritualist:0 "$time_lifeline_finally_be_oblation$"
 time_lifeline_finally_be_oblation_spiritualist_desc:0 "In any case, the ritual will always begin."
 
 white_hole_recycle_bin_modifier:0 "$sm_white_hole_recycle_bin$"
 white_hole_recycle_bin_modifier_desc:0 "Due to recovering most matter from the source, the harm of material flow to ships is weakened."
 
 horror_focus_modifier:0 "Nightmare Terminator"
 horror_focus_modifier_desc:0 "To go further in the field of Inverse Phase, we need to know more about Inverse Phase existence-by any means."
 horror_focus_modifier_effect:0 "$mod_damage_vs_country_type_guardian_horror_mult$:§G+50%§!"
 
 pc_time_modifier_1:0 "Paradise on the Departed"
 pc_time_modifier_1_desc:0 "In order not to fail the achievements of the departed, we should develop and utilize this spacetime even more, even if it invites criticism."
 pc_time_modifier_2:0 "Passive Depressive"
 pc_time_modifier_2_desc:0 "The radiation released by the data core will greatly affect the residents' minds and trigger passive depression symptoms."
 pc_time_modifier_3:0 "Foolish Pioneer"
 pc_time_modifier_3_desc:0 "The knowledge stored in the data core did not bring the imagined convenience to opening up spacetime. Instead, we had to use our own computing systems to assist its operation."
 pc_time_modifier_4:0 "Wise Precursor"
 pc_time_modifier_4_desc:0 "The knowledge stored in the data core guides us to explore unknown fields. We are very grateful for the support of this precursor, although it broke down quickly."
 pc_time_modifier_5:0 "City in the Veil"
 pc_time_modifier_5_desc:0 "We tried to build cities in the new spacetime, but sporadic phase shift phenomena often caused construction troubles."
 pc_time_modifier_6:0 "Territory After the Storm"
 pc_time_modifier_6_desc:0 "To transform the new territory, our residents had to adapt and live in a harsher environment."
 pc_time_modifier_7:0 "Paradise After the Storm"
 pc_time_modifier_7_desc:0 "The spacetime after the storm is both stable and dangerous, and has become a paradise for residents to adjust their lives."
 pc_time_modifier_8:0 "Emigration Site of Stronghold"
 pc_time_modifier_8_desc:0 "A batch of young adults who grew up were arranged to go to the vanguard stronghold. They will make outstanding contributions to the exploration of the Mysterious Singularity."
 pc_time_modifier_9:0 "Stronghold Architectural Style"
 pc_time_modifier_9_desc:0 "We learned the architectural style of the stronghold and utilized the existing spacetime more efficiently, but this takes some time to adapt."
 pc_time_modifier_10:0 "Great Reversal of Laws"
 pc_time_modifier_10_desc:0 "Some laws in the Black Hole experienced reversal, which greatly affected our production activities and scientific research process."
 pc_time_modifier_11:0 "Undefeated Residents"
 pc_time_modifier_11_desc:0 "Even if laws reverse, residents of the Black Hole can quickly adapt to changes. We never admit defeat."
 pc_time_modifier_12:0 "They Come from Inverse Phase"
 pc_time_modifier_12_desc:0 "A group of residents from the Inverse Plane returned to our home, but obviously things are not that simple."
 pc_time_modifier_13:0 "We Yearn for Inverse Phase"
 pc_time_modifier_13_desc:0 "While maintaining vigilance against the Inverse Plane, we also yearn for everything unknown in the Inverse Plane."
 pc_time_modifier_14:0 "Gray Nanite Cloud"
 pc_time_modifier_14_desc:0 "This chaotic nanite cloud broke into our territory, and all areas dyed gray are temporarily unusable."
 pc_time_modifier_end:0 "Watcher of Singularity"
 pc_time_modifier_end_desc:0 "[GetPcTimeModifierEndDesc]"
 pc_time_modifier_end_desc_1:0 "The core of the Black Hole might really be ordinary, but we will always watch the central singularity until the day the mystery is solved."
 pc_time_modifier_end_desc_2:0 "The core of the Black Hole turned out to be just an illusion. Our watch over the central singularity is no longer futile."
 pc_time_modifier_end_desc_3:0 "The core of the Black Hole is actually the creation of The Worm-in-Waiting. We watch the singularity, and The Worm-in-Waiting watches us."
 pc_time_modifier_end_desc_4:0 "The core of the singularity has been completely opened to us. We will watch the true meaning of spacetime with The Worm-in-Waiting until eternity."
 
 origin_time_modifier_materialist:0 "Researcher of the Unknown"
 origin_time_modifier_materialist_desc:0 "$time.160.a.materialist$"
 origin_time_modifier_spiritualist:0 "Perceiver of the Soul"
 origin_time_modifier_spiritualist_desc:0 "$time.160.a.spiritualist$"
