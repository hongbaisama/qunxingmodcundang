 origin_time_modifier_militarist_desc:0 "$time.160.a.militarist$"
 origin_time_modifier_pacifist:0 "Enjoyer of Life"
 origin_time_modifier_pacifist_desc:0 "$time.160.a.pacifist$"
 origin_time_modifier_xenophile:0 "Pursuer of Hope"
 origin_time_modifier_xenophile_desc:0 "$time.160.a.xenophile$"
 origin_time_modifier_xenophobe:0 "Guardian of Territory"
 origin_time_modifier_xenophobe_desc:0 "$time.160.a.xenophobe$"
 origin_time_modifier_egalitarian:0 "Yearner for Happiness"
 origin_time_modifier_egalitarian_desc:0 "$time.160.a.egalitarian$"
 origin_time_modifier_authoritarian:0 "Controller of the Sea of Stars"
 origin_time_modifier_authoritarian_desc:0 "$time.160.a.authoritarian$"
 
 timesingularity:0 "Heart of the Black Hole"
 timesingularity_desc:0 "Research shows that the core of the Spacetime Black Hole is a singularity formed by spacetime distortion, and all this is the intentional act of The Worm-in-Waiting. This research result not only further proves The Worm-in-Waiting's love for us, but also enables creatures in the Black Hole to temporarily control spacetime and thereby improve work efficiency."
 timesingularity_effect:0 "$mod_district_time_usage_cap_mult$：§G+50%§!\n$MOD_JOB_MAX_WORKFORCE_MULT$ for $planet_time_researchers$：§G+50%§!\nPositive Planet Modifiers on $pc_time$: §G+100%§!\nNegative Planet Modifiers on $pc_time$: §G-100%§!\n$MOD_PLANET_CRIME_ADD$ from $planet_black_hole_physicists_with_icon$: §G-1§!\n$MOD_PLANET_AMENITIES_ADD$ from $planet_black_hole_biologists_with_icon$: §G+100§!\n$MOD_PLANET_HOUSING_ADD$ from $planet_black_hole_engineers_with_icon$: §G+100§!\nCapital exclusive designation promoted to: $col_timesingularity_capital$"
 timelife:0 "Reborn"
 timelife_desc:0 "The ruler entered the Black Hole unscathed, and even possessed stronger abilities. Our people were greatly encouraged, as if reborn."
 timedeath:0 "Inescapable Death"
 timedeath_desc:0 "The ruler disappeared mysteriously, but wailing came from the Black Hole. Our people were greatly hit, worrying that they cannot escape death."
 timefear:0 "Black Hole Fear"
 timefear_desc:0 "Upon learning that the ruler was about to be swallowed by the Black Hole, our people developed a severe fear of the Black Hole."
 
 origin_time_coup:0 "Coup Storm"
 origin_time_coup_desc:0 "Although the coup failed, its storm still affects the stability within the horizon."
 origin_time_authoritarian_attraction:0 "Followers' Rumors"
 origin_time_authoritarian_attraction_desc:0 "Followers spread rumors in the community, influencing the judgment of the people."
 origin_time_egalitarian_attraction:0 "Skeptics' Rumors"
 origin_time_egalitarian_attraction_desc:0 "Skeptics spread rumors in the community, influencing the judgment of the people."
 origin_time_spiritualist_attraction:0 "Admirers' Rumors"
 origin_time_spiritualist_attraction_desc:0 "Admirers spread rumors in the community, influencing the judgment of the people."
 origin_time_materialist_attraction:0 "Researchers' Rumors"
 origin_time_materialist_attraction_desc:0 "Researchers spread rumors in the community, influencing the judgment of the people."
 origin_time_militarist_attraction:0 "Radicals' Rumors"
 origin_time_militarist_attraction_desc:0 "Radicals spread rumors in the community, influencing the judgment of the people."
 origin_time_pacifist_attraction:0 "Conservatives' Rumors"
 origin_time_pacifist_attraction_desc:0 "Conservatives spread rumors in the community, influencing the judgment of the people."
 origin_time_xenophobe_attraction:0 "Purists' Rumors"
 origin_time_xenophobe_attraction_desc:0 "Purists spread rumors in the community, influencing the judgment of the people."
 origin_time_xenophile_attraction:0 "Mixers' Rumors"
 origin_time_xenophile_attraction_desc:0 "Mixers spread rumors in the community, influencing the judgment of the people."
 
