 happy_with_open_loop_temple_xenophobe_desc:0 "The purest ethnic group enjoys it, while servants mixed with impurities are responsible for taking care of their daily life. This is the best proof of our national superiority."
 happy_with_open_loop_temple_egalitarian:0 "Temple of the Loop: Symbol of Cycle"
