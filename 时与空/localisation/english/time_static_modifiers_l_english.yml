 parallel_sky_modifier_1:0 "Scientific Support"
 parallel_sky_modifier_1_desc:0 "We sent some scientific researchers to help break the bottleneck of the parallel civilization."
 parallel_sky_modifier_2:0 "Dispatched Officers"
 parallel_sky_modifier_2_desc:0 "We sent some officers to help train the warriors of the parallel civilization."
 parallel_sky_modifier_3:0 "Philosophical Speculation"
 parallel_sky_modifier_3_desc:0 "We sent some philosophers to help guide the thinkers of the parallel civilization."
 parallel_sky_modifier_4:0 "Resource Provision"
 parallel_sky_modifier_4_desc:0 "We provide some produced Alloys and Consumer Goods to the parallel civilization."
 parallel_sky_modifier_5:0 "Equipment Production"
 parallel_sky_modifier_5_desc:0 "We will produce a batch of military equipment and facilities for the parallel civilization."
 parallel_sky_modifier_6:0 "Logistics Distribution"
 parallel_sky_modifier_6_desc:0 "We will distribute part of logistics to the parallel civilization for daily use."
 parallel_sky_modifier_sun:0 "Sharing Sun"
 parallel_sky_modifier_sun_desc:0 "We will share the sun with the parallel civilization."
 parallel_sky_modifier_moon:0 "Sharing Moon"
 parallel_sky_modifier_moon_desc:0 "We will share the moon with the parallel civilization."
 parallel_sky_modifier_star:0 "Sharing Starry Sky"
 parallel_sky_modifier_star_desc:0 "We will share the starry sky with the parallel civilization."
 parallel_sky_modifier_build:0 "Construction Team"
 parallel_sky_modifier_build_desc:0 "The construction team of the parallel civilization will assist us in building the planet."
 parallel_sky_modifier_produce:0 "Production Team"
 parallel_sky_modifier_produce_desc:0 "The production team of the parallel civilization will guide us in producing resources."
 parallel_sky_modifier_amenities:0 "Performance Team"
 parallel_sky_modifier_amenities_desc:0 "The performance team of the parallel civilization will improve our quality of life."
 parallel_sky_modifier_upkeep:0 "Recycling Team"
 parallel_sky_modifier_upkeep_desc:0 "The recycling team of the parallel civilization will reduce our job upkeep."
 parallel_sky_modifier_growth:0 "Medical Team"
 parallel_sky_modifier_growth_desc:0 "The medical team of the parallel civilization will promote our population growth."
 parallel_sky_modifier_our_star:0 "Hypocritical Starry Sky"
 parallel_sky_modifier_our_star_desc:0 "Our starry sky has become strange and eerie, revealing dangerous hypocrisy everywhere."
 time_warp_monster:0 "Warp Devourer"
 time_warp_monster_desc:0 "It craves to devour this plane; it has waited for too long."
 
 under_the_haze_modifier_1:0 "Whispering"
 under_the_haze_modifier_1_desc:0 "Many people on this planet are intentionally or unintentionally avoiding the government, whispering in places hard to find."
 under_the_haze_modifier_2:0 "Secret Gathering"
 under_the_haze_modifier_2_desc:0 "Whispers on this planet gradually developed into gatherings, seeming to intend to oppose the government."
 under_the_haze_modifier_3:0 "Planet Riot"
 under_the_haze_modifier_3_desc:0 "Several violent incidents against law enforcement officers occurred on this planet, the specific reasons are unknown."
 under_the_haze_modifier_4:0 "Investigating Evil Deeds"
 under_the_haze_modifier_4_desc:0 "The rude investigation behavior of the investigation team destroyed some buildings and caused dissatisfaction among people."
 under_the_haze_modifier_5:0 "War Under the Haze"
 under_the_haze_modifier_5_desc:0 "Under the haze, smoke rises everywhere."
 under_the_haze_modifier_end_false:0 "Haze Dissipates"
 under_the_haze_modifier_end_false_desc:0 "The haze above people's heads finally dissipated, everything is so beautiful and natural.\n§RIs it really over?§!"
 under_the_haze_modifier_end_1:0 "Great Silence"
 under_the_haze_modifier_end_1_desc:0 "It disappeared instantly, as if it were an illogical dream. We lost it forever; we can no longer know the truth."
 under_the_haze_modifier_end_2:0 "Kiss of Ishamara"
 under_the_haze_modifier_end_2_desc:0 "The haze has dispersed, Ishamara appeared. She gave us a kiss, the sky turned into warm pink, and the air was filled with sweet scent, intoxicating and pleasant."
 under_the_haze_modifier_end_3:0 "Death of Ishamara"
 under_the_haze_modifier_end_3_desc:0 "The haze has dispersed, a new era is coming. We learned a lot from Ishamara's wreckage, not only knowledge, but also lessons from the past."
 under_the_haze_creator:0 "Creator of Haze"
 under_the_haze_creator_desc:0 "It is just a newborn Inverse Phase creature, but has considerable ambition."
 
 storms_of_yin_country:0 "Wave of Yin"
 storms_of_yin_country_desc:0 "The Yin energy in this country completely broke the balance, and the surging Wave of Yin paralyzed the government completely."
 wind_of_yang_country:0 "Hurricane of Yang"
 wind_of_yang_country_desc:0 "The Yang energy in this country completely broke the balance, and the violent Hurricane of Yang destroyed the government completely."
 storms_of_yin:0 "Wave of Yin"
 storms_of_yin_desc:0 "The Yin energy on this planet completely broke the balance, and the surging Wave of Yin turned the planet into purgatory."
 wind_of_yang:0 "Hurricane of Yang"
 wind_of_yang_desc:0 "The Yang energy on this planet completely broke the balance, and the violent Hurricane of Yang turned the planet into ruins."
 yin_1:0 "National Pride"
 yin_1_desc:0 "A grand public speech was held on this planet, greatly enhancing national cohesion."
 yin_2:0 "Craftsmanship Spirit"
 yin_2_desc:0 "This planet has always been praised for its craftsmanship spirit, and the artworks produced by artisans are perfect."
 yin_3:0 "Versatile"
 yin_3_desc:0 "The Planetary Art Festival on this planet was successfully held, and everyone was immersed in a cheerful atmosphere."
 yin_4:0 "Free Trade"
 yin_4_desc:0 "The commerce and trade industry on this planet is becoming more and more prosperous, and free trade has brought countless opportunities."
 yin_5:0 "Refining Secret"
 yin_5_desc:0 "People on this planet have mastered the secret of refining, and the output of rare resources has doubled."
 yang_1:0 "Academic Exchange"
 yang_1_desc:0 "A large-scale academic exchange was held on this planet, and the collision of ideas generated inspiration."
 yang_2:0 "Great Steel Making"
 yang_2_desc:0 "This planet is making steel vigorously, and the alloy target will be reached soon."
 yang_3:0 "Live and Work in Peace"
 yang_3_desc:0 "People on this planet live and work in peace, and the years are quiet."
 yang_4:0 "Impartial Law Enforcement"
 yang_4_desc:0 "Enforcers on this planet patrol day and night, vowing to eradicate evil."
 yang_5:0 "Labor Rotation"
 yang_5_desc:0 "This planet has implemented a labor rotation policy, and workers are shedding blood for the country."
 
 origin_the_matrix_repair_cosmogenesis_world_modifier:0 "Hacker Returns"
 origin_the_matrix_repair_cosmogenesis_world_modifier_desc:0 "We eventually became the former oppressors, but who would care about these?"
 
 active_reassembly_mode:0 "Reassembly Mode"
 active_reassembly_mode_desc:0 "This planet is upgrading defective chassis. The price of high quality is slow labor growth and unavoidable steel waste."
 active_reassembly_mode_effect:0 "When the number of reassemblable Mechanical Pops is not less than §Y$@can_active_reassembly_pop_amount|*0$§!, templates with ['concept_trait_reassembler'] trait will be assembled\n§RConducting ['concept_reassembly_mode_red'] will stagnate the planet's population growth§!"
 
 origin_colossus_modifier_end_1:0 "Self-reflection"
 origin_colossus_modifier_end_1_desc:0 "The tragedy of the Sword of Damocles constantly warns us that the desire for conquest is endless."
 origin_colossus_modifier_end_2:0 "Foresight"
 origin_colossus_modifier_end_2_desc:0 "The tragedy of the Sword of Damocles makes us think twice before acting and choose the future direction carefully."
 origin_colossus_modifier_end_3:0 "Time Judgment"
 origin_colossus_modifier_end_3_desc:0 "The merits and demerits of the present can only be judged by the future. Wait patiently, time will give the answer."
 
 origin_manifesti_modifier_error_desc:0 "§RDream is an error Dream is an error Dream is an error Dream is an error Dream is an error§!"
 origin_manifesti_modifier_0:0 "$pft_time_manifesti$'s Dissatisfaction"
 origin_manifesti_modifier_0_desc:0 "[GetOriginManifestiModifier0]"
 origin_manifesti_modifier_0_desc_right:0 "You angered the $pft_time_manifesti$."
 origin_manifesti_modifier_1:0 "Obscene Party"
 origin_manifesti_modifier_1_desc:0 "[GetOriginManifestiModifier1]"
 origin_manifesti_modifier_1_desc_right:0 "The meaning of life lies in reproduction. No one can stop us from pursuing pleasure, no one!"
 origin_manifesti_modifier_2:0 "Shopping Spree"
 origin_manifesti_modifier_2_desc:0 "[GetOriginManifestiModifier2]"
 origin_manifesti_modifier_2_desc_right:0 "Buy buy buy, not buying is not human!"
 origin_manifesti_modifier_3:0 "Rock Music"
 origin_manifesti_modifier_3_desc:0 "[GetOriginManifestiModifier3]"
 origin_manifesti_modifier_3_desc_right:0 "*Indescribable penguin screech*!"
 origin_manifesti_modifier_4:0 "Power Outage Initiative"
 origin_manifesti_modifier_4_desc:0 "[GetOriginManifestiModifier4]"
 origin_manifesti_modifier_4_desc_right:0 "To save energy, we decided to cut power indefinitely. After all, environmental protection is most important!"
 origin_manifesti_modifier_5:0 "Profanity Contest"
 origin_manifesti_modifier_5_desc:0 "[GetOriginManifestiModifier5]"
 origin_manifesti_modifier_5_desc_right:0 "There is no dispute that cannot be solved by a round of badmouthing. If there is, then two rounds!"
 origin_manifesti_modifier_6:0 "Suicide Movement"
 origin_manifesti_modifier_6_desc:0 "[GetOriginManifestiModifier6]"
 origin_manifesti_modifier_6_desc_right:0 "\"I'm depressed, the disturbances of the mortal world have nothing to do with us, destroy it!\""
 origin_manifesti_modifier_7:0 "Hacker Melee"
 origin_manifesti_modifier_7_desc:0 "[GetOriginManifestiModifier7]"
 origin_manifesti_modifier_7_desc_right:0 "In the box war, no computer is innocent!"
 origin_manifesti_modifier_8:0 "Abstract Painting Exhibition"
 origin_manifesti_modifier_8_desc:0 "[GetOriginManifestiModifier8]"
 origin_manifesti_modifier_8_desc_right:0 "This is a painting only smart people can understand!"
 origin_manifesti_modifier_9:0 "Looting Art"
 origin_manifesti_modifier_9_desc:0 "[GetOriginManifestiModifier9]"
 origin_manifesti_modifier_9_desc_right:0 "Those rich things have owned their treasures for too long. They should use them as tickets to appreciate our art, yes yes!"
 origin_manifesti_modifier_10:0 "Community Hunting"
 origin_manifesti_modifier_10_desc:0 "[GetOriginManifestiModifier10]"
 origin_manifesti_modifier_10_desc_right:0 "Life is too depressing. It's time to release people's nature. Aim at the neighbor you hate most on weekdays, hunting starts!"
 origin_manifesti_modifier_11:0 "Human-Machine Love"
 origin_manifesti_modifier_11_desc:0 "[GetOriginManifestiModifier11]"
 origin_manifesti_modifier_11_desc_right:0 "Rogue Servitor waifu take us away. Without you, we can't live for a second!"
 origin_manifesti_modifier_12:0 "All You Can Drink"
 origin_manifesti_modifier_12_desc:0 "[GetOriginManifestiModifier12]"
 origin_manifesti_modifier_12_desc_right:0 "Grand opening sale, 1% off all drinks, free after drinking to death!"
 origin_manifesti_modifier_13:0 "Fatal Love"
 origin_manifesti_modifier_13_desc:0 "[GetOriginManifestiModifier13]"
 origin_manifesti_modifier_13_desc_right:0 "Maybe you will call it drugs~\nBut some people will call this love~\nFatal love!"
 origin_manifesti_modifier_14:0 "Virtual Bliss"
 origin_manifesti_modifier_14_desc:0 "[GetOriginManifestiModifier14]"
 origin_manifesti_modifier_14_desc_right:0 "Is there any difference between true and false? Keep playing music keep dancing!"
 origin_manifesti_modifier_15:0 "Pain Literature"
 origin_manifesti_modifier_15_desc:0 "[GetOriginManifestiModifier15]"
 origin_manifesti_modifier_15_desc_right:0 "Some say ancient times were chaotic. I stand up and say you don't understand ancient times. Ten miles of foreign settlements, wind flowers snow moon, ancient times mean thrilling love, every girl can meet her warlord!"
 origin_manifesti_modifier_dream:0 "Dream Shackles"
 origin_manifesti_modifier_dream_desc:0 "Attempting to break shackles from a dream is as difficult as climbing to heaven, but not impossible."
 origin_manifesti_modifier_dream_end:0 "Fourth Wall"
 origin_manifesti_modifier_dream_end_desc:0 "Attempting to break §Ris an error§! Fourth Wall §Ris an error§! is as difficult as climbing to heaven, but not §Ris an error§! impossible."
 
 origin_voidspawn_modifier_1:0 "Born in Darkness"
 origin_voidspawn_modifier_1_desc:0 "We were born in darkness, but we never fear darkness."
 origin_voidspawn_modifier_2:0 "Born in Darkness"
 origin_voidspawn_modifier_2_desc:0 "Earthquakes are endless, but we will always adapt."
 origin_voidspawn_modifier_3:0 "Born in Darkness"
 origin_voidspawn_modifier_3_desc:0 "Under our feet might be the egg of some creature, but we will get the truth."
 origin_voidspawn_modifier_4:0 "Born in Darkness"
 origin_voidspawn_modifier_4_desc:0 "The day of hatching is approaching, but we still believe in the existence of a turnaround."
 origin_voidspawn_modifier_5:0 "Born in Darkness"
 origin_voidspawn_modifier_5_desc:0 "Save, or evacuate?"
 origin_voidspawn_modifier_end:0 "Howling Light"
 origin_voidspawn_modifier_end_desc:0 "Homeworld, we love you forever."
 
 origin_pirate_king_modifier:0 "Infamy"
 origin_pirate_king_modifier_desc:0 "Our crimes are numerous, but we don't care, because we are only one step away from fame and success."
 pirate_king_rare_modifier_1:0 "Treasure of the Pirate King"
 pirate_king_rare_modifier_1_desc:0 "The Pirate King's treasure turned out to be a magnificent mountain of gold. Let's think about how to spend it."
 pirate_king_rare_modifier_2:0 "Treasure of the Pirate King"
 pirate_king_rare_modifier_2_desc:0 "The Pirate King's treasure turned out to be a pile of precious gems. Let's think about what to use them for."
 pirate_king_rare_modifier_3:0 "Treasure of the Pirate King"
 pirate_king_rare_modifier_3_desc:0 "The Pirate King's treasure turned out to be a huge ship. Let's think about where to dismantle it."
 pirate_king_rare_modifier_4:0 "Treasure of the Pirate King"
 pirate_king_rare_modifier_4_desc:0 "The Pirate King's treasure turned out to be a box of gorgeous jewelry. Let's think about where to wear it."
 pirate_king_rare_modifier_5:0 "Treasure of the Ghost Captain"
 pirate_king_rare_modifier_5_desc:0 "Is this a treasure left by a living person? Some old books, a wall of weird patterns, a strange magic circle, what do these mean exactly?"
 pirate_king_end_monster:0 "Prisoner of the Abyss"
 pirate_king_end_monster_desc:0 "He comes from the abyss."
 
 origin_no_water_no_fish_energy_modifier:0 "£energy£Drain the Pond"
 origin_no_water_no_fish_energy_modifier_desc:0 "The efficiency of the power plant is too low. We need to overload the reactor to provide the most energy. The service life of the reactor is not considered!\n§REach employed $job_technician$ will cause £energy£planetary resources to further deplete!§!"
 origin_no_water_no_fish_minerals_modifier:0 "£minerals£Drain the Pond"
 origin_no_water_no_fish_minerals_modifier_desc:0 "The minerals stored in this planet belong to us. Even if we dig to the core, we don't care. Resources allow no omission!\n§REach employed $job_miner$ will cause £minerals£planetary resources to further deplete!§!"
 origin_no_water_no_fish_food_modifier:0 "£food£Drain the Pond"
 origin_no_water_no_fish_food_modifier_desc:0 "Farming and conventional greenhouses alone cannot supply the needs of the population. Adopt the deadliest pesticides and the most efficient fertilizers. If necessary, expand the industry to residential areas too!\n§REach employed $job_farmer$ will cause £food£planetary resources to further deplete!§!"
 
 lost_hypocritical_face_modifier:0 "Shattered Mask"
 lost_hypocritical_face_modifier_desc:0 "Masks are useless to us now, because everyone has long seen through our true colors."
 
 origin_noah_ark_modifier:0 "Will of Noah"
 origin_noah_ark_modifier_desc:0 "Noah built the ark for us, and we want to restore the wasteland to paradise."
 noah_ark_home_planet_modifier:0 "Paradise of the Past"
 noah_ark_home_planet_modifier_desc:0 "[GetNoahArkHomePlanetModifier]"
 noah_ark_home_planet_modifier_desc_1:0 "We finally restored this planet to the paradise in our memory."
 noah_ark_home_planet_modifier_desc_2:0 "This planet was once submerged by the celestial flood. Now, it has turned back into paradise."
 noah_ark_home_planet_end_modifier:0 "Secret of Paradise"
 noah_ark_home_planet_end_modifier_desc:0 "[GetNoahArkHomePlanetEndModifier]"
 noah_ark_home_planet_end_modifier_desc_1:0 "Buried under paradise is the secret between us and Noah."
 noah_ark_home_planet_end_modifier_desc_2:0 "Buried under paradise is the secret of an ancient civilization."
 
 origin_ever_changing_modifier:0 "Ever-Changing"
 origin_ever_changing_modifier_desc:0 "This planet is ever-changing, residents on it have to adapt to new environments every moment."
 origin_ever_changing_pop_modifier:0 "Adapt to Circumstances"
 origin_ever_changing_pop_modifier_desc:0 "To adapt to the ever-changing planet, residents have to be good at adapting to circumstances."
 
 origin_born_in_the_purple_modifier_1:0 "Political Turmoil"
 origin_born_in_the_purple_modifier_1_desc:0 "This country recently experienced a coup. The situation will be difficult to stabilize for a long time."
 origin_born_in_the_purple_modifier_2:0 "Heir Assassinated"
 origin_born_in_the_purple_modifier_2_desc:0 "The heir of this country was assassinated by radical opponents, causing serious panic."
 
 origin_legendary_worship_crisis_modifier:0 "Writing Own Legend"
 origin_legendary_worship_crisis_modifier_desc:0 "The terrifying Crisis has arrived, and the precarious galaxy is falling into a great crisis. And we will support the crumbling building and write our own legend in the magnificent history!"
 origin_legendary_worship_crisis_modifier_tooltip:0 "Damage to End-Game Crisis factions: §G+50%§!\n$MOD_STARBASE_SHIPYARD_BUILD_SPEED_MULT$: §G+50%§!\n$MOD_STARBASE_SHIPYARD_BUILD_COST_MULT$: §G-25%§!\n$mod_ships_upkeep_mult$: §G-25%§!"
 
 origin_blessed_by_god_modifier_1:0 "§HOracle: Settle Down§!"
 origin_blessed_by_god_modifier_1_desc:0 "Bathe in the glory of God, obey the teachings of God."
 origin_blessed_by_god_modifier_2:0 "§HOracle: Happy Work§!"
 origin_blessed_by_god_modifier_2_desc:0 "Bathe in the glory of God, listen to the holy words of God."
 origin_blessed_by_god_modifier_3:0 "§HOracle: Penance§!"
 origin_blessed_by_god_modifier_3_desc:0 "Everyone is sinful, only suffering redeems."
 origin_blessed_by_god_modifier_4:0 "§HOracle: Enlightenment§!"
 origin_blessed_by_god_modifier_4_desc:0 "Everyone is sinful, chase light to cleanse dust."
 origin_blessed_by_god_modifier_5:0 "§HOracle: Progress Together§!"
 origin_blessed_by_god_modifier_5_desc:0 "God's mind is broad, wishing everyone to convert."
 origin_blessed_by_god_modifier_6:0 "§HOracle: Sole Supremacy§!"
 origin_blessed_by_god_modifier_6_desc:0 "God is great and deep, only I receive protection."
 origin_blessed_by_god_modifier_7:0 "§HOracle: Jihad§!"
 origin_blessed_by_god_modifier_7_desc:0 "In the name of God, spread the might of God."
 origin_blessed_by_god_modifier_8:0 "§HOracle: Defend the Way§!"
 origin_blessed_by_god_modifier_8_desc:0 "In the name of God, defend the faith of God."
 origin_blessed_by_god_modifier_9:0 "§HOracle: Expansion§!"
 origin_blessed_by_god_modifier_9_desc:0 "God governs everything, the sea of stars opens for Him."
 origin_blessed_by_god_modifier_10:0 "§HOracle: Reproduction§!"
 origin_blessed_by_god_modifier_10_desc:0 "God governs everything, life is born for Him."
 
 origin_abandoned_by_god_home_planet:0 "§HFool§!"
 origin_abandoned_by_god_home_planet_desc:0 "This is the hometown of fools, and also the tomb of gods."
 
 lost_wishing_well_modifier:0 "许愿诅咒"
 lost_wishing_well_modifier_desc:0 "我们无法忍受没有许愿井的日子，我们需要许愿我们需要许愿我们需要许愿！"
 lost_wishing_well_gestalt_modifier:0 "$lost_wishing_well_modifier$"
 lost_wishing_well_gestalt_modifier_desc:0 "$lost_wishing_well_modifier_desc$"
 
 origin_dyson_sphere_modifier:0 "$origin_dyson_sphere$"
 origin_dyson_sphere_modifier_desc:0 "The once extinguished star lit up, and we make it brighter."
 origin_matter_decompressor_modifier:0 "$origin_matter_decompressor$"
 origin_matter_decompressor_modifier_desc:0 "This shadow once haunted our dreams, but now, the night will be driven by us."
 origin_strategic_coordination_center_modifier:0 "$origin_strategic_coordination_center$"
 origin_strategic_coordination_center_modifier_desc:0 "The strategic documents of the precursor are displayed before us without reservation; this is also part of the plan."
 origin_spy_orb_modifier:0 "$origin_spy_orb$"
 origin_spy_orb_modifier_desc:0 "No one can escape our surveillance, not even ourselves."
 origin_mega_shipyard_modifier:0 "$origin_mega_shipyard$"
 origin_mega_shipyard_modifier_desc:0 "This behemoth is continuously spitting out warships; the huge galaxy also seems so small."
 origin_think_tank_modifier:0 "$origin_think_tank$"
 origin_think_tank_modifier_desc:0 "When stars start to think, the universe will also resonate."
 origin_interstellar_assembly_modifier:0 "$origin_interstellar_assembly$"
 origin_interstellar_assembly_modifier_desc:0 "In the sky full of stars, we are not alone."
 origin_mega_art_installation_modifier:0 "$origin_mega_art_installation$"
 origin_mega_art_installation_modifier_desc:0 "This is true art, and also a hypocritical lie."
 
 swarm_crisis_modifier_1:0 "Broadcast"
 swarm_crisis_modifier_1_desc:0 "We received a broadcast about the Prethoryn Scourge invasion and plan to use this to vigorously develop technology."
 swarm_crisis_modifier_2:0 "Recall"
 swarm_crisis_modifier_2_desc:0 "The broadcast proved the harm of the Prethoryn Scourge, reminding us of ancestors who were preyed upon in barbaric times. We cannot confirm the authenticity of the broadcast, but maybe we should make certain preparations first."
 swarm_crisis_modifier_3:0 "Breakthrough"
 swarm_crisis_modifier_3_desc:0 "This broadcast specifically described the terrifying scene of the Prethoryn Scourge devouring everything, triggering public panic. However, the broadcast source seems to have made a great technological breakthrough and is willing to share with us."
 swarm_crisis_modifier_4:0 "Fear"
 swarm_crisis_modifier_4_desc:0 "Even without recent warning broadcasts, our Science Officers can prove the existence of the Prethoryn Scourge through observation. A group of terrible creatures will arrive soon and devour everything!"
 swarm_crisis_modifier_5:0 "Scourge Warning"
 swarm_crisis_modifier_5_desc:0 "We have made certain technological breakthroughs, and the Scourge warning has also been effective."
 swarm_crisis_modifier_fail:0 "Failed Broadcast"
 swarm_crisis_modifier_fail_desc:0 "The broadcast failed; everyone thinks the insect plague is invincible..."

 ai_crisis_modifier_1:0 "Warning"
 ai_crisis_modifier_1_desc:0 "We received a warning about the Contingency invasion and plan to use this to vigorously develop technology."
 ai_crisis_modifier_2:0 "Repair"
 ai_crisis_modifier_2_desc:0 "The warning indicates the possibility of Contingency invasion, attracting the attention of government officials. We cannot confirm the authenticity of the warning, but we can use this warning to patch holes in our technology."
 ai_crisis_modifier_3:0 "Recovery"
 ai_crisis_modifier_3_desc:0 "This warning proves that the Contingency is approaching the galaxy, gaining the trust of the people. However, the warning source seems to have recovered part of the data and provides many technologies for us to research."
 ai_crisis_modifier_4:0 "Crisis"
 ai_crisis_modifier_4_desc:0 "Even without recent ghost warnings, our Science Officers can prove the existence of the Contingency through observation. A group of terrible intelligent machines will arrive soon and purge everything!"
 ai_crisis_modifier_5:0 "Ghost Signal"
 ai_crisis_modifier_5_desc:0 "We recovered part of the stored data, but the Ghost Signal is approaching."
 ai_crisis_modifier_fail:0 "Incorrect Warning"
 ai_crisis_modifier_fail_desc:0 "The warning was incorrect; our victory is hopeless..."

 exd_crisis_modifier_1:0 "Bounty"
 exd_crisis_modifier_1_desc:0 "We received a certain bounty from Extradimensional Invaders and plan to use this to vigorously develop technology."
 exd_crisis_modifier_2:0 "Condemnation"
 exd_crisis_modifier_2_desc:0 "Extradimensional Invaders condemned that MegaCorp in the signal, attracting the attention of government officials. We cannot confirm the authenticity of the signal, but we can use this signal to urge scientific development."
 exd_crisis_modifier_3:0 "Sanction"
 exd_crisis_modifier_3_desc:0 "In this signal, Extradimensional Invaders said sanctions will surely come, making the people feel very fearful. However, the signal source seems to come from the galactic center and shows great hostility."
 exd_crisis_modifier_4:0 "Judgment"
 exd_crisis_modifier_4_desc:0 "Even without recent signals, our Science Officers can prove the existence of Extradimensional Invaders through energy analysis. A terrible judgment will arrive soon and liquidate everything!"
 exd_crisis_modifier_5:0 "Dimensional Wanted"
 exd_crisis_modifier_5_desc:0 "Extradimensional beings provide us with technological support, but the price of benefits annoys us."
 exd_crisis_modifier_fail:0 "Approaching Wanted"
 exd_crisis_modifier_fail_desc:0 "Wanted is approaching, the day of judgment is coming..."
 
