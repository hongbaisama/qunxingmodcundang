l_english:
 situation_origin_voidspawn:0 "Howling Light"
 situation_origin_voidspawn_type:0 "Howling Light"
 situation_origin_voidspawn_desc:0 "Even if born in darkness, one must howl for light."
 situation_origin_voidspawn_monthly_change_tooltip:0 "$situation_monthly_change_tooltip_little_control$"
 situation_origin_voidspawn_complete_effect:0 "§RSomething bad might happen to our homeworld.§!"
 approach_origin_voidspawn_default:0 "Wait and See"
 situation_origin_voidspawn_default_effect:0 "We cannot control the direction of the situation for the time being, but there will always be a way."
 string_egg_broken:0 "Hatching"
 
 origin_voidspawn.0.name:0 "Born in Darkness: §HDead in Womb§!"
 origin_voidspawn.0.desc:0 "The environment of this planet no longer meets the hatching conditions, and the egg's hatching has terminated."
 origin_voidspawn.0.a:0 "We might have missed something."
 
 origin_voidspawn.1.name:0 "Born in Darkness: §HGrotesque Shape§!"
 origin_voidspawn.1.desc:0 "After entering space, we got a glimpse of the full picture of our homeworld, but the result made everyone creeped out.\n\nOur homeworld is very different compared to other planets. She is not a beautiful sphere, but an ellipsoid with irregular bumps and depressions. In addition, the surface of the planet is covered with \"volcanoes\" that are erupting or preparing to erupt, but the \"lava\" is turbid liquid full of foul smell, like pus flowing from rotting wounds on animal corpses.\n\nAlthough we have long been accustomed to the harsh environment on our homeworld, we couldn't help trembling when we saw the photos."
 origin_voidspawn.1.a:0 "But she is our homeworld after all."
 origin_voidspawn.2.name:0 "Born in Darkness: §HFrequent Earthquakes§!"
 origin_voidspawn.2.desc:0 "Earthquakes on §Y[Target.GetName]§! are becoming more and more frequent.\n\nAlthough we have long been accustomed to earthquakes, now earthquakes appear too densely, almost every moment is an earthquake. Moreover, the degree of earthquakes shows no sign of slowing down. We may have to adapt to a long earthquake period in the next few years."
 origin_voidspawn.2.a:0 "We will adapt."
 origin_voidspawn.3.name:0 "Born in Darkness: §HEggshell Hypothesis§!"
 origin_voidspawn.3.desc:0 "A group of Science Officers spontaneously conducted research on §Y[Target.GetName]§!.\n\nThe leader of this group of Science Officers proposed a hypothesis based on research results: §Y[Target.GetName]§! is actually the egg of some creature, and the surface we live on is actually the eggshell. This hypothesis is not baseless, because research results show that the underground of §Y[Target.GetName]§! is rich in organic matter, and its composition is extremely similar to the egg yolk of common poultry.\n\nThe leader stated that the egg under our feet may be in the incubation period, and it has the possibility of breaking out of the shell at any time. But he also admitted that this hypothesis has not been fully confirmed and still needs to wait for further research results."
 origin_voidspawn.3.a:0 "We will discover the truth."
 origin_voidspawn.3.b:0 "They have the ability to investigate clearly."
 origin_voidspawn.4.name:0 "Born in Darkness: §HTrue Fact§!"
 origin_voidspawn.4.desc_1:0 "Volcanoes on §Y[Target.GetName]§! erupt endlessly, but our investigation has come to an end.\n\nWe learned unfortunate news: The eggshell hypothesis is correct. Right under our feet, in the very center within the layers of the planet's shell, sleeps a mysterious creature. Judging from the current situation of the planet, the hatching time of this egg is approaching.\n\nThis matter caused panic among the people. Some people are ready to evacuate this planet, and some people choose to continue staying on the homeworld, thinking there will be a turnaround."
 origin_voidspawn.4.desc_2:0 "Volcanoes on §Y[Target.GetName]§! erupt endlessly, but the investigation of Science Officers has come to an end.\n\nWe learned unfortunate news: The eggshell hypothesis is correct. Right under our feet, in the very center within the layers of the planet's shell, sleeps a mysterious creature. Judging from the current situation of the planet, the hatching day of this egg is approaching.\n\nThis matter caused panic among the people. Some people are ready to evacuate this planet, but more people choose to continue staying on the homeworld, thinking there will be a turnaround."
 origin_voidspawn.4.a:0 "We will make our own choice."
 origin_voidspawn.5.name:0 "Born in Darkness: §HLong Night Approaching§!"
 origin_voidspawn.5.desc:0 "The hatching day is close at hand, remaining time is running out..."
 origin_voidspawn.5.a:0 "We can definitely save our homeworld."
 origin_voidspawn.5.b:0 "Prepare to arrange evacuation work."
 origin_voidspawn.6.name:0 "Born in Darkness: §HBreak Out of Shell§!"
 origin_voidspawn.6.desc_1:0 "Disaster befell §Y[Target.GetName]§!! The last wave of violent crust rupture completely tore the wreckage of the colony. Under the empty shell, a terrible Voidspawn larva descended like a nightmare! We tried to save our homeworld, but we lost to time."
 origin_voidspawn.6.desc_2:0 "Disaster befell §Y[Target.GetName]§!! The last wave of violent crust rupture completely tore the wreckage of the colony. Under the empty shell, a terrible Voidspawn larva descended like a nightmare! This goes against all common sense, but there is no other explanation."
 origin_voidspawn.6.a:0 "It hatched eventually."
 origin_voidspawn.6.b:0 "We don't need to conflict with it."
 
 origin_voidspawn.11.name:0 "Born in Darkness: §HWithin Reach§!"
 origin_voidspawn.11.desc:0 "Our investigation on the eggshell hypothesis has made great progress. The truth is within reach, but we still need some time to get the result."
 origin_voidspawn.11.a:0 "I can't wait to know the truth."
 origin_voidspawn.11.b:0 "Wait quietly."
 origin_voidspawn.12.name:0 "Born in Darkness: §HPath of Redemption§!"
 origin_voidspawn.12.desc:0 "We re-collected research data on the egg and finally found our path of redemption.\n\nThe hatching of the egg is not irreversible. As long as the hatching environment does not meet the hatching conditions of the egg, the hatching of the egg may slow down or even stop. Researchers found in experiments that organic matter in the crust is extremely easy to combine with a rare element and generate a series of infectious toxic substances. After preliminary testing, this type of toxic substance is not very toxic to us, but seems to pose a great threat to the life in the egg, and the hatching progress of the egg has also slowed down a lot.\n\nIf we can produce this type of toxic substance on a large scale, maybe we have a chance to kill the creature in the egg and save our homeworld."
 origin_voidspawn.12.a:0 "Produce such substances at all costs."
 origin_voidspawn.12.b:0 "But it is also a life."
 origin_voidspawn.12.c:0 "The cost is too great."
 origin_voidspawn.13.name:0 "Born in Darkness: §HHowling Light§!"
 origin_voidspawn.13.desc:0 "The dark night has passed, and dawn is coming.\n\nOur plan succeeded. The creature in the egg eventually died under the infection of toxic substances, and the hatching day will never come. Although our homeworld is riddled with holes due to a series of changes, we will always love her, we will always accompany her, just as she accompanied us through the long night of civilization development."
 origin_voidspawn.13.a:0 "Homeworld, we love you forever."
 
 origin_voidspawn.14.name:0 "Born in Darkness: §HCute Creature§!"
 origin_voidspawn.14.desc:0 "Our pacification work succeeded. The Voidspawn obediently obeyed our orders. I think it likes us."
 origin_voidspawn.14.a:0 "We are also its \"homeworld\"."
 origin_voidspawn.15.name:0 "Born in Darkness: §HTerrible Creature§!"
 origin_voidspawn.15.desc:0 "Our pacification work failed. The Voidspawn still showed strong aggressiveness towards us. I think it hates us."
 origin_voidspawn.15.a:0 "Is this how you treat us?"
 origin_voidspawn.16.name:0 "Born in Darkness: §HToo Late§!"
 origin_voidspawn.16.desc:0 "Before our pacification work took effect, the Voidspawn was eliminated."
 origin_voidspawn.16.a:0 "Poor little guy."