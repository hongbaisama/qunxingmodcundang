l_english:
 time_hotel_digsite:0 "Time Hotel"
 time_hotel_digsite_desc:0 "A hotel that appears and disappears from time to time, only appears at midnight, and disappears soon after. Investigations outside the building all ended in failure. Photographic recording equipment will malfunction on time at midnight, and no one can observe the disappearance of the hotel while remaining awake.\n\nIf we want to learn the secrets hidden in this building, we must enter the hotel."
 time_hotel_categories:0 "Appearing and Disappearing Building"
 time_hotel_categories_desc:0 "There have been multiple sighting reports of appearing and disappearing buildings on §Y[time_hotel_site.GetName]§!. There must be some secrets hidden in it."
 
 time_hotel.0.name:0 "Appearing and Disappearing Building"
 time_hotel.0.desc:0 "According to the reports of multiple cargo spaceships shuttling through the §Y[time_hotel_site.System.GetName]§! system, crew members always witness ancient buildings faintly appearing on §Y[time_hotel_site.GetName]§!, but when they approach, they find that there are no buildings on these asteroids at all.\n\nOne or two reports may be accidental, but continuous and constant reports mean that some kind of anomaly must have occurred here."
 time_hotel.0.a:0 "Investigate this matter thoroughly."
 time_hotel.0.b:0 "Just a mirage in the universe."
 time_hotel.9.name:0 "Hotel Open at Midnight"
 time_hotel.9.desc:0 "After careful investigation, we finally found that there are indeed mysterious ancient buildings on §Y[time_hotel_site.GetName]§!.\n\nDue to unknown reasons, this huge building only appears during a certain period of time, which is exactly midnight when converted to the time of our homeworld. According to the signs and patterns on the outer layer of the building, Science Officer §Y[FromFrom.GetLeaderName]§! speculated that this should be a hotel used for the rest of specific galactic travelers."
 time_hotel.9.a:0 "There must be mysteries we don't know in this hotel."
 time_hotel.10.name:0 "Non-existent Building"
 time_hotel.10.desc:0 "After investigation, we did not find any abnormality on §Y[time_hotel_site.GetName]§!.\n\nPrevious sighting reports of ancient buildings may be collective hallucinations caused by long-term space travel, or may be due to electromagnetic radiation generated periodically in the system. But in any case, we reached a unanimous conclusion that there is no anomaly on the asteroid."
 time_hotel.10.a:0 "I thought I would find something."
 
 time_hotel.1.name:0 "Hotel First Floor"
 time_hotel.1.desc:0 "After the archaeological team entered the hotel, they experienced a very weird feeling.\n\nAfter a period of exploration, they finally realized that the speed of movement of everything in the hotel became faster, or rather, the speed of the archaeological team perceiving time became slower. However, the archaeological team was surprised to find that the internal structure of the hotel was very complete, the walls and floors were clean without a trace of dirt, and there was even fresh food in the lockers, as if the hotel was still in operation. Not only that, the archaeological team also found some rooms similar to classrooms, it seems that this hotel also works part-time on children's education.\n\nThe archaeological team seems to have discovered a passage to the second floor, but due to the maladaptation to time perception, the exploration speed is very slow."
 time_hotel.1.a:0 "Curious."
 time_hotel.2.name:0 "Hotel Second Floor"
 time_hotel.2.desc:0 "After a long exploration, the archaeological team finally found the way to the second floor.\n\nDifferent from the first floor of the hotel, the time flow speed on the second floor seems to have slowed down, but it does not rule out the possibility that the archaeological team gradually adapted to the time in the hotel. The layout of the second floor of the hotel is also different from the first floor. The environment seems to be simulating a corner of a city. In the alleys of the \"city\", various graffiti full of rebellion and filth can be seen everywhere on the walls, and the garbage and soot piled on the ground are also very different from the first floor. The archaeological team suspects that this floor is dedicated to interstellar delinquents wandering in the stars.\n\nThe exploration of the archaeological team continues, and they reported that they are heading to the third floor of the hotel."
 time_hotel.2.a:0 "Unimaginable scene."
 time_hotel.3.name:0 "Hotel Third Floor"
 time_hotel.3.desc:0 "The archaeological team successfully arrived at the third floor of the hotel.\n\nThis time, the archaeological team significantly felt that the time flow speed slowed down, even basically approaching normal body feeling. But when the archaeological team tried to contact the archaeological personnel outside the hotel, they found that their perception of time still differed greatly from the outside world. One day outside may be several weeks or even a month inside. Equally shocking is that the third floor of the hotel turned out to be law enforcement agencies and judicial organs, which overturned the previous speculation about interstellar delinquents.\n\nAt the junction of the second and third floors is the law enforcement agency, which includes various functional buildings such as detention rooms, interrogation rooms, execution rooms, and confinement rooms. After that is the interior of a huge court. The high judge's seat, the prosecution seat and defense seat standing on both sides, and the jury seat surrounding the surroundings give a strong sense of oppression. The entire court is filled with sacred justice atmosphere.\n\nThe archaeological team can't wait to go to the fourth floor and leave here."
 time_hotel.3.a:0 "Awe-inspiring."
 time_hotel.4.name:0 "Hotel Fourth Floor"
 time_hotel.4.desc:0 "The archaeological teams hurriedly went to the fourth floor of the hotel, but found that the archaeological specialist §Y[time_hotel_leader.GetName]§! mysteriously disappeared.\n\nWhether the archaeological specialist disappeared suddenly on the way to the fourth floor, or disappeared as early as the exploration of the third floor, the archaeological team can no longer remember clearly. On the fourth floor of the hotel-or the fourth floor of the building once considered a hotel, is a prison with cells scattered like stars, but there is not a single prisoner in the cells. The archaeological team felt serious discomfort in this gloomy prison, firmly believed that the time flow speed was far slower than normal, and resolutely denied the possibility that this was an illusion.\n\nThe archaeological team is unwilling to continue exploring the prison, nor willing to look for the missing archaeological specialist. They just want to leave this place now."
 time_hotel.4.materialist:0 "There must be a reason behind the disappearance!"
 time_hotel.4.spiritualist:0 "May the Holy Spirit bless us!"
 time_hotel.4.militarist:0 "Don't be timid!"
 time_hotel.4.pacifist:0 "Too terrible!"
 time_hotel.4.xenophile:0 "Did the original prisoners disappear like this too?"
 time_hotel.4.xenophobe:0 "Annoying mechanism designed by alien things!"
 time_hotel.4.egalitarian:0 "I promise, we will definitely rescue you!"
 time_hotel.4.authoritarian:0 "How can you abandon the leader of the empire and run away?"
 time_hotel.4.hive_mind:0 "Temporarily lost connection with synapse."
 time_hotel.4.machine_intelligence:0 "Archaeological node offline."
 time_hotel.4.other:0 "Is this really a hotel?"
 time_hotel.5.name:0 "Hotel Fifth Floor"
 time_hotel.5.desc:0 "The archaeological teams did not find the exit to return, but accidentally discovered the gate to the fifth floor.\n\nHowever, just after they opened the gate ecstatically, they fell into complete despair-behind the gate is another prison. The prison on the fifth floor is even more gloomy and terrible than the fourth floor. The archaeological team also reported that they \"lived like years\" inside. They frantically begged us to give up the archaeological operation, send rescue ships to destroy this huge hotel, and rescue them from prison. However, the hotel still appears and disappears from time to time. Our demolition work is difficult, and the firmness of the hotel building materials far exceeds our estimation.\n\nIt seems that the archaeological team can currently only rely on their own efforts to escape from the hotel."
 time_hotel.5.a:0 "Depressing."
 time_hotel.6.name:0 "Hotel Sixth Floor"
 time_hotel.6.desc:0 "The archaeological team finally escaped from the hotel through their own strength, but they appeared on another asteroid far away from §Y[time_hotel_site.GetName]§!.\n\nAccording to their recollection, the archaeological team arrived at the sixth floor in panic and fell into deep hallucinations. They felt that they had aged dozens of years, and the people around them were no longer other archaeological team members, but people vital to themselves. They hugged each other crying, pouring out their feelings for their relatives, and blaming themselves for the mistakes they had made. Until they woke up from the hallucination, they found themselves still in the hotel, and the sixth floor of the hotel was a fragrant field. The archaeological teams were reborn, full of hope, and worked together to find the exit of the hotel. After passing through the exit, they appeared on other asteroids.\n\nThe archaeological team finally escaped from the hotel successfully, but we still haven't learned the secret of the hotel and the whereabouts of the missing archaeological specialist."
 time_hotel.6.a:0 "There are still unsolved mysteries."
 time_hotel.7.name:0 "Mystery of the Hotel"
 time_hotel.7.desc:0 "After years of searching and waiting, archaeological specialist §Y[time_hotel_leader.GetName]§! finally appeared.\n\nLike the previous archaeological team, [time_hotel_leader.GetHeShe] experienced the same encounter in the hotel and also appeared on another asteroid far away from §Y[time_hotel_site.GetName]§!. However, the archaeological specialist seems to have aged dozens of years, and claimed that [time_hotel_leader.GetHerHis] loss of contact with the archaeological team happened decades ago, and details can no longer be remembered clearly. However, archaeological specialist §Y[time_hotel_leader.GetName]§! did not waste time in the hotel. After waking up from the initial panic, [time_hotel_leader.GetHeShe] investigated various parts of the hotel in detail, studied the devices and facilities in the core area of the hotel, and finally came to a conclusion-this is not a hotel, but a Time Prison.\n\nSubsequently, [time_hotel_leader.GetHeShe] handed out a confession lost somewhere in the prison."
 time_hotel.7.a:0 "View confession."
 time_hotel.8.desc:0 "\"All this is like a dream, a dream I will never forget.\n\nI dreamed of my childhood, spent in the classroom. I dreamed of the teacher teaching tirelessly on the podium, while I kept staring at the girl I liked. Everything was so quiet and beautiful, my future was full of light.\n\nI dreamed of my youth, spent in the city alleys. I wanted to attract the girl's attention. I thought doing cool things with cool people would make her notice me, but she seemed very angry. So, I did cooler things with cooler people, hoping one day she would be happy because of me.\n\nI dreamed of my prime, spent in the police station. I participated in gang fights, I committed robbery, I tried to steal treasures, but the girl didn't change her mind, and I sent myself to court.\n\nI dreamed of my middle age, spent in prison. Life in prison was not easy. The oppressive air under the strict hierarchy made it difficult for me to breathe. I transferred from one cell to another, I transferred from one prison to another, but my mind was full of that girl.\n\nI dreamed of my old age, I don't know where spent. I was finally released after serving my sentence, but on the day of release, my temples were already gray. I saw the girl of my childhood again, but she was already taken, old and fading. I told her my feelings, but she regretted that I went astray.\n\nWaking up from the dream, I found that the dream had long become reality. I regret, I hate, but it doesn't help. I drove my dilapidated cargo spaceship and accidentally discovered treasures in the stars, but I didn't want to enjoy wealth and glory. I just hoped no one would follow in my footsteps.\n\nSo, I donated the treasure to the government and built this Time Prison. Although, I cannot live to see its completion, and I don't know its principle, I just hope the prisoners who see my confession, rein in at the precipice, turn back to the shore.\""
 time_hotel.8.a:0 "This Time Prison should warn all citizens of the empire."
 time_hotel.8.b:0 "The secret of this Time Prison is more beneficial to us."
 
 unlock_councilor_time_hotel_1:0 "Unlock §Y$councilor_time_hotel_1$§! Council position"
 unlock_councilor_time_hotel_2:0 "Unlock §Y$councilor_time_hotel_2$§! Council position"
 
 time_hotel.20.name:0 "Time Flies"
 time_hotel.20.desc:0 "From some unknown time, all members of the archaeological team in the hotel stopped their work coincidentally, standing still in place, as if their time had frozen.\n\nAll means of trying to contact them ended in failure. Just when we were about to send a second archaeological team to rescue, the members of the first team \"came alive\" again in an instant. After some negotiation, §Y[intemporal_scientist.GetName]§! understood the current situation, but [intemporal_scientist.GetHeShe] stated that none of the team members noticed the existence of the freeze. For them, it was just a blink of an eye, but for us, this period of time seemed to be cut off out of thin air.\n\nAfter some twists and turns, our exploration work was put on the agenda again, and the members of the archaeological team showed exceptional vitality.\n\nThey seem a bit too energetic."
 time_hotel.20.a:0 "A time both short and long."
 time_hotel.20.b:0 "Like a camera-click."