l_english:
 
 ################################################################
 # 时之螶
 ################################################################
 
 TIMELINE_EVENT_HORIZONSIGNAL_BEGIN_TOOLTIP: "§HHorizon Signal§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] received a Horizon Signal from [EVENT_TARGET_1.GetName] and dispatched [EVENT_TARGET_2.GetName] to the coordinates hidden within. Although he fell into the eternal embrace of the Black Hole, he revealed the existence of §HThe Worm-in-Waiting§! to us."
 TIMELINE_HORIZONSIGNAL_BEGIN: "Horizon Signal\n§L[GetDate]§!"
 
 TIMELINE_EVENT_HORIZONSIGNAL_NOT_BEGIN_TOOLTIP: "§HHorizon Signal§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] received a Horizon Signal from [EVENT_TARGET_1.GetName], but ultimately decided to ignore it. We seem to have missed something, but perhaps it is for the best."
 TIMELINE_HORIZONSIGNAL_NOT_BEGIN: "Signal Rejected\n§L[GetDate]§!"
 
 TIMELINE_EVENT_HORIZONSIGNAL_BEGIN_BUT_STOP_TOOLTIP: "§HMessage Ended§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] received the invitation of death from [EVENT_TARGET_1.GetName] again, but ultimately decided to ignore it. We seem to have missed something, but perhaps it is for the best."
 TIMELINE_HORIZONSIGNAL_BEGIN_BUT_STOP: "Message Ended\n§L[GetDate]§!"
 
 TIMELINE_EVENT_LOOP_TEMPLE_TOOLTIP: "§HTemple of the Loop§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] accidentally discovered the Temple of the Loop on [EVENT_TARGET_1.GetName] and accepted its existence. This might be a gift from \"The Worm-in-Waiting\"."
 TIMELINE_LOOP_TEMPLE: "Temple of the Loop\n§L[GetDate]§!"
 
 TIMELINE_EVENT_LOOP_TEMPLE_BUT_SEAL_TOOLTIP: "§HTemple of the Loop§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] accidentally discovered the Temple of the Loop on [EVENT_TARGET_1.GetName], but ultimately decided to seal it. Better safe than sorry."
 TIMELINE_LOOP_TEMPLE_BUT_SEAL: "Seal Temple\n§L[GetDate]§!"
 
 TIMELINE_EVENT_WORM_LOVES_US_AND_ACCEPT_TOOLTIP: "§HWitness Future§!\n§YSystem Event§!\n\nOn §L[GetDate]§!, The Worm-in-Waiting offered infinite love to [EVENT_TARGET_0.GetName], and we accepted Her infinite love. Under the licking of love, we finally stepped onto the destined path."
 TIMELINE_EVENT_WORM_LOVES_US_AND_ACCEPT_OTHER_TOOLTIP: "§HWitness Future§!\n§YSystem Event§!\n\nOn §L[GetDate]§!, The Worm-in-Waiting offered infinite love to [EVENT_TARGET_0.GetName], and they accepted Her infinite love. Under the licking of love, they finally stepped onto the destined path."
 TIMELINE_WORM_LOVES_US_AND_ACCEPT: "Witness Future\n§L[GetDate]§!"
 
 TIMELINE_EVENT_WORM_LOVES_US_BUT_REFUSE_TOOLTIP: "§HShattered Loop§!\n§YSystem Event§!\n\nOn §L[GetDate]§!, The Worm-in-Waiting offered infinite love to [EVENT_TARGET_0.GetName], but we were unwilling to accept this twisted love. We expelled It, but It remains there."
 TIMELINE_EVENT_WORM_LOVES_US_BUT_REFUSE_OTHER_TOOLTIP: "§HShattered Loop§!\n§YSystem Event§!\n\nOn §L[GetDate]§!, The Worm-in-Waiting offered infinite love to [EVENT_TARGET_0.GetName], but they were unwilling to accept this twisted love. They expelled It, but It remains there."
 TIMELINE_WORM_LOVES_US_BUT_REFUSE: "Shattered Loop\n§L[GetDate]§!"
 
 TIMELINE_EVENT_ACCEPT_UNLEASHED_MESSENGER_NORMAL_TOOLTIP: "§HNew Dawn§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] reconstructed the origin of the Messenger species and began the transformation into Messengers. What has been will be again."
 TIMELINE_EVENT_ACCEPT_UNLEASHED_MESSENGER_ROBOTIC_TOOLTIP: "§HNew Dawn§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] reverse-engineered the mechanism of the Messenger species and began the transformation into Messengers. What has been will be again."
 TIMELINE_ACCEPT_UNLEASHED_MESSENGER: "New Dawn\n§L[GetDate]§!"
 
 TIMELINE_EVENT_ACCEPT_LEASHED_MESSENGER_NORMAL_TOOLTIP: "§HNightfall§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] reconstructed the origin of the Messenger species and began the transformation into Messengers. What has been will be again."
 TIMELINE_EVENT_ACCEPT_LEASHED_MESSENGER_ROBOTIC_TOOLTIP: "§HNightfall§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] reverse-engineered the mechanism of the Messenger species and began the transformation into Messengers. What has been will be again."
 TIMELINE_ACCEPT_LEASHED_MESSENGER: "Nightfall\n§L[GetDate]§!"
 
 TIMELINE_EVENT_GAIN_TIME_TITAN_TOOLTIP: "§HOutside Spacetime§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName]'s commander [EVENT_TARGET_1.GetName] took over The Captain that Will Be's Omega Ark at [EVENT_TARGET_2.GetName]. We gained complete control over it, but also lost its past and future."
 TIMELINE_GAIN_TIME_TITAN: "Outside Spacetime\n§L[GetDate]§!"
 
 TIMELINE_EVENT_MANIFOLD_COUNTRY_ASCENSION_TOOLTIP: "§HThe Utawarerumono§!\n§YSystem Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] started the ritual to summon the Nightmare and attempted to ascend towards the End. Did their ascension succeed or fail? Perhaps only they can answer this question, and we may never know the truth."
 TIMELINE_MANIFOLD_COUNTRY_ASCENSION: "The Utawarerumono\n§L[GetDate]§!"
 
 TIMELINE_EVENT_HOLE_PETS_PANTAGRUEL_TOOLTIP: "§H$NAME_Pantagruel$§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] witnessed the self-compression of [EVENT_TARGET_1.GetName] and discovered another universe within. The Sanctified Servant completed the initial mission."
 TIMELINE_HOLE_PETS_PANTAGRUEL: "$NAME_Pantagruel$\n§L[GetDate]§!"
 
 ################################################################
 # 负相
 ################################################################
 
 TIMELINE_EVENT_FIRST_MEET_DIMENSIONAL_HORROR_TOOLTIP: "§HInverse Phase Existence§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] encountered the Nightmare of the Plane for the first time in the [EVENT_TARGET_1.GetName] system."
 TIMELINE_FIRST_MEET_DIMENSIONAL_HORROR: "Inverse Phase Existence\n§L[GetDate]§!"
 
 TIMELINE_EVENT_ACTIVE_TR_HORROR_ADOPT_TOOLTIP: "§HEntering Inverse Phase§!\n§YMilestone§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] adopted the Inverse Phase tradition and stepped into the domain of Inverse Phase. Although faltering, we are still moving forward."
 TIMELINE_ACTIVE_TR_HORROR_ADOPT: "Entering Inverse Phase\n§L[GetDate]§!"
 
 TIMELINE_EVENT_ACTIVE_AP_HORROR_TOOLTIP: "§HInverse Phase Mysteries§!\n§YMilestone§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] adopted the Inverse Phase Mysteries Ascension Perk, and The Worm-in-Waiting tore the dimensions apart, generously pointing out the direction for our exploration. This may mean disaster, but it may also contain opportunity."
 TIMELINE_ACTIVE_AP_HORROR: "Inverse Phase Mysteries\n§L[GetDate]§!"
 
 TIMELINE_EVENT_ACTIVE_AP_TIME_TOOLTIP: "§HSpacetime Causality§!\n§YMilestone§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] adopted the Spacetime Causality Ascension Perk. Our pursuit of knowledge is endless, but is its end hope or the End? We crave more, more, more..."
 TIMELINE_ACTIVE_AP_TIME: "Spacetime Causality\n§L[GetDate]§!"
 
 TIMELINE_EVENT_ACTIVE_AP_BEYOND_INFINITY_TOOLTIP: "§HBeyond Infinity§!\n§YSystem Event§!\n\nOn §L[GetDate]§!, after transcending causality, [EVENT_TARGET_0.GetName] embarked on the path beyond infinity. Just as the reincarnation of the past, just as the cycle of the future."
 TIMELINE_EVENT_ACTIVE_AP_BEYOND_INFINITY_OTHER_TOOLTIP: "§HBeyond Infinity§!\n§YSystem Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] seemed to be preparing for a crisis in the distant future and embarked on the path beyond infinity. Just as the reincarnation of the past, just as the cycle of the future."
 TIMELINE_ACTIVE_AP_BEYOND_INFINITY: "Beyond Infinity\n§L[GetDate]§!"
 
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_HORROR_1_TOOLTIP: "§HCaught in a Loop§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] completed the exploration of $astral_rift_akx_horror$, but at the cost of a Science Officer's departure. They fell into a loop, what about us?"
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_HORROR_1: "Caught in a Loop\n§L[GetDate]§!"
 
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_HORROR_2_TOOLTIP: "§HDestined Mystery§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] completed the exploration of $astral_rift_akx_horror$, but mysteries remained unsolved. Is this really destined?"
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_HORROR_2: "Destined Mystery\n§L[GetDate]§!"
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_HORROR_2_THIRD_TOOLTIP: "§HDestined Tragedy§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] completed the exploration of $astral_rift_akx_horror$, but tragedies were still unavoidable. Is this really destined?"
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_HORROR_2_THIRD: "Destined Tragedy\n§L[GetDate]§!"
 
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_HORROR_3_TOOLTIP: "§HIn the Ashes§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] completed the exploration of $astral_rift_akx_horror$, although everything ended in ashes. We missed the opportunity to save ourselves."
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_HORROR_3: "In the Ashes\n§L[GetDate]§!"
 
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_HORROR_4_LOST_TOOLTIP: "§HReflection in the Mirror§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] completed the exploration of $astral_rift_akx_horror$ and found another [EVENT_TARGET_1.GetName]. The missing person was replaced by a survivor; all this is definitely not a coincidence."
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_HORROR_4_MIRROR_TOOLTIP: "§HReflection in the Mirror§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] completed the exploration of $astral_rift_akx_horror$, and [EVENT_TARGET_1.GetName] also met another self. The two who mirror each other are now one."
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_HORROR_4: "Reflection in the Mirror\n§L[GetDate]§!"
 
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_TIME_1_TOOLTIP: "§HFruitless End§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] interrupted the exploration of $astral_rift_akx_time$ to avoid touching the reality of the world. Fortunately, they didn't find more."
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_TIME_1: "Fruitless End\n§L[GetDate]§!"
 
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_TIME_2_TOOLTIP: "§HConnecting Infinity§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] ended the exploration of $astral_rift_akx_time$, because this exploration itself was destined to have no ending. The other end of the anchor chain is infinity."
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_TIME_2: "Connecting Infinity\n§L[GetDate]§!"
 
 TIMELINE_EVENT_FINISH_ASTRAL_RIFT_AKX_TIME_3_TOOLTIP: "§HEnd of the Maze§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] completed the exploration of $astral_rift_akx_time$; however, this exploration itself was a loop. Who exactly are we welcoming now?"
 TIMELINE_FINISH_ASTRAL_RIFT_AKX_TIME_3: "End of the Maze\n§L[GetDate]§!"
 
 ################################################################
 # 终焉宣告
 ################################################################
 
 TIMELINE_EVENT_DIMENSIONAL_HORROR_CRISIS_BEGIN_TOOLTIP: "§HProclamation of the End§!\n§YCrisis Event§!\n\nOn §L[GetDate]§!, a storm named Proclamation of the End quietly descended on the galaxy. Chaos, disorder, pain, disaster, death, termination-almost all terrible negative words filled the unfathomable storm as literally implied. This is just the beginning, but it will carry us to the end of time. Our enemy is the universe itself."
 TIMELINE_DIMENSIONAL_HORROR_CRISIS_BEGIN: "Proclamation of the End\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSIONAL_HORROR_CRISIS_BEGIN_FOR_NEW_COUNTRY_TOOLTIP: "§HProclamation of the End§!\n§YCrisis Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] observes a storm named Proclamation of the End, but it has already existed. Chaos, disorder, pain, disaster, death, termination-almost all terrible negative words filled the unfathomable storm as literally implied. This is just the beginning, but it will carry us to the end of time. Our enemy is the universe itself."
 TIMELINE_DIMENSIONAL_HORROR_CRISIS_BEGIN_FOR_NEW_COUNTRY: "Proclamation of the End\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSIONAL_HORROR_CRISIS_DESTINY_OCCUR_TOOLTIP: "§HFate Epilogue§!\n§YCrisis Event§!\n\nOn §L[GetDate]§!, the Nightmare of the End named Destiny gathered and formed in the [EVENT_TARGET_0.GetName] system. We can feel an unfathomable fear from It, a pain originating from the essence of the universe. Perhaps It is a counterattack from the cycle, perhaps It is a test from The Worm-in-Waiting, everything is unknown. At least, this is the final epilogue."
 TIMELINE_DIMENSIONAL_HORROR_CRISIS_DESTINY_OCCUR: "Fate Epilogue\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSIONAL_HORROR_CRISIS_END_TOOLTIP: "§HStriding Across Fate§!\n§YCrisis Event§!\n\nOn §L[GetDate]§!, the Nightmare of the End named Destiny has fallen, and this storm catastrophe also slowly ceased. Now, all traces of the Proclamation of the End disappeared instantly, as if it never existed. However, the mottled galaxy map is still warning us of the tragicness of this crisis. In any case, we can finally put an end to everything-with everyone."
 TIMELINE_DIMENSIONAL_HORROR_CRISIS_END: "Striding Across Fate\n§L[GetDate]§!"

 ################################################################
 # 时间机器/圆环枢纽/位面引擎
 ################################################################
 
 TIMELINE_EVENT_TIME_MACHINE_BEGIN_TOOLTIP: "§HSpacetime Chaos§!\n§YSystem Event§!\n\nOn §L[GetDate]§!, time in the galaxy suddenly became chaotic and difficult to measure."
 TIMELINE_TIME_MACHINE_BEGIN: "Spacetime Chaos\n§L[GetDate]§!"
 
 TIMELINE_EVENT_TIME_MACHINE_END_TOOLTIP: "§HSpacetime Restoration§!\n§YSystem Event§!\n\nOn §L[GetDate]§!, just as it appeared without reason, the chaotic spacetime also recovered without warning."
 TIMELINE_TIME_MACHINE_END: "Spacetime Restoration\n§L[GetDate]§!"
 
 TIMELINE_EVENT_CIRCLE_NEXUS_BEGIN_TOOLTIP: "§HLoop Deviation§!\n§YSystem Event§!\n\nOn §L[GetDate]§!, the galaxy encountered an unprecedented existential philosophical crisis."
 TIMELINE_CIRCLE_NEXUS_BEGIN: "Loop Deviation\n§L[GetDate]§!"
 
 TIMELINE_EVENT_CIRCLE_NEXUS_END_TOOLTIP: "§HLoop Return§!\n§YSystem Event§!\n\nOn §L[GetDate]§!, just as it appeared without reason, the deviated loop also returned without warning."
 TIMELINE_CIRCLE_NEXUS_END: "Loop Return\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_ENGINE_BEGIN_TOOLTIP: "§HPlane Oscillation§!\n§YSystem Event§!\n\nOn §L[GetDate]§!, the galaxy flickered like a buggy program in the blink of an eye."
 TIMELINE_DIMENSION_ENGINE_BEGIN: "Plane Oscillation\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_ENGINE_END_TOOLTIP: "§HPlane Calming§!\n§YSystem Event§!\n\nOn §L[GetDate]§!, just as it appeared without reason, the oscillating plane also calmed down without warning."
 TIMELINE_DIMENSION_ENGINE_END: "Plane Calming\n§L[GetDate]§!"
 
 ################################################################
 # 界旅者
 ################################################################
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_BEGIN_ORIGIN_TOOLTIP: "§HInside the White Hole§!\n§YOrigin Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] received a White Hole signal from [EVENT_TARGET_1.GetName] and decided to analyze it. This is a journey that has already begun."
 TIMELINE_EVENT_DIMENSION_TRAVELER_BEGIN_TOOLTIP: "§HInside the White Hole§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] received a White Hole signal from [EVENT_TARGET_1.GetName] and decided to analyze it. This is a new beginning."
 TIMELINE_DIMENSION_TRAVELER_BEGIN: "Inside the White Hole\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_NOT_BEGIN_TOOLTIP: "§HInside the White Hole§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] received a White Hole signal from [EVENT_TARGET_1.GetName] but decided to ignore it. Ended before it began."
 TIMELINE_DIMENSION_TRAVELER_NOT_BEGIN: "Inside the White Hole\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_BEGIN_BUT_STOP_TOOLTIP: "§HWhite Hole End§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, after some attempts, [EVENT_TARGET_0.GetName] finally gave up exploring the White Hole. The journey to the White Hole has reached its end."
 TIMELINE_DIMENSION_TRAVELER_BEGIN_BUT_STOP: "White Hole End\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_1_ORIGIN_TOOLTIP: "§HNever See Again§!\n§YOrigin Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName]'s Science Ship sailed out of the White Hole, accompanied by the girl's sweet singing. Different from what we heard initially, it was a cheerful song, as if welcoming someone's arrival. But we understand that someone will never come again."
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_1_TOOLTIP: "§HNever See Again§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName]'s Science Ship sailed out of the White Hole, accompanied by the girl's sweet singing. Different from what we heard initially, it was a cheerful song, as if welcoming someone's arrival. But we understand that someone will never come again."
 TIMELINE_DIMENSION_TRAVELER_END_1: "Never See Again\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_2_ORIGIN_TOOLTIP: "§HDestruction§!\n§YOrigin Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName]'s Science Ship failed to resist the strong gravity of the gravitational source, fell into the center of the White Hole, and never sent any messages again. We are certain that the Science Ship has been completely destroyed by the gravitational source, but the whereabouts of the girl in the White Hole are unknown. Ah, White Hole."
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_2_TOOLTIP: "§HDestruction§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName]'s Science Ship failed to resist the strong gravity of the gravitational source, fell into the center of the White Hole, and never sent any messages again. We are certain that the Science Ship has been completely destroyed by the gravitational source, but the whereabouts of the girl in the White Hole are unknown. We will never know the truth."
 TIMELINE_DIMENSION_TRAVELER_END_2: "Destruction\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_3_ORIGIN_TOOLTIP: "§HTermination§!\n§YOrigin Event§!\n\nOn §L[GetDate]§!, without the obstruction of strong gravity, [EVENT_TARGET_0.GetName]'s Science Ship left the White Hole smoothly, but we failed to take the person we should have taken. The singing of the White Hole stopped, but our singing will continue."
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_3_TOOLTIP: "§HTermination§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, without the obstruction of strong gravity, [EVENT_TARGET_0.GetName]'s Science Ship left the White Hole smoothly, but we failed to take the person we should have taken. We don't know what happened to that girl in the White Hole, but we are certain that a galactic crisis has been terminated."
 TIMELINE_DIMENSION_TRAVELER_END_3: "Termination\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_4_ORIGIN_TOOLTIP: "§HOrigin§!\n§YOrigin Event§!\n\nOn §L[GetDate]§!, the girl in the White Hole moved away from [EVENT_TARGET_0.GetName]'s Science Ship, rapidly approached the center of the White Hole, and triggered an explosion. The White Hole turned into a terrible Black Hole after the big explosion, but the girl's move did not seem to fail, because the Black Hole has no trend of continuing to expand for the time being. Everything is back to square one."
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_4_TOOLTIP: "§HOrigin§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, the girl in the White Hole moved away from [EVENT_TARGET_0.GetName]'s Science Ship, rapidly approached the center of the White Hole, and triggered an explosion. The White Hole turned into a terrible Black Hole after the big explosion, but the girl's move did not seem to fail, because the Black Hole has no trend of continuing to expand for the time being. Everything is back to square one."
 TIMELINE_DIMENSION_TRAVELER_END_4: "Origin\n§L[GetDate]§!"
 
 TIMELINE_EVENT_HIRE_DIMENSION_TRAVELER_TOOLTIP: "§HMeet Again Eventually§!\n§YMilestone§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] returned to the [EVENT_TARGET_1.GetName] system and saved the deja vu girl. After some communication, the girl decided to serve us. Although no longer an old friend, we will meet again eventually."
 TIMELINE_HIRE_DIMENSION_TRAVELER: "Meet Again Eventually\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DISMISS_DIMENSION_TRAVELER_ORIGIN_TOOLTIP: "§HMeet Again Eventually§!\n§YOrigin Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] returned to the [EVENT_TARGET_1.GetName] system and saved the deja vu girl. After some communication, the girl decided to fulfill her mission. The caged bird returns to freedom."
 TIMELINE_EVENT_DISMISS_DIMENSION_TRAVELER_TOOLTIP: "§HMeet Again Eventually§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] returned to the [EVENT_TARGET_1.GetName] system and saved the deja vu girl. After some communication, the girl decided to fulfill her mission. Goodbye, we will definitely meet again."
 TIMELINE_DISMISS_DIMENSION_TRAVELER: "Meet Again Eventually\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_6_TOOLTIP: "§HTime Origin§!\n§YMilestone§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] reunited with the girl in the White Hole at the time origin. After infinite waiting, she reached the end of the journey. See you in the next cycle."
 TIMELINE_DIMENSION_TRAVELER_END_6: "Time Origin\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_7_ORIGIN_TOOLTIP: "§HFalling into Reincarnation§!\n§YOrigin Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] finally failed to transcend the constraints of causality. The Dimension Traveler fell into the Black Hole inevitably again. A violent big explosion swallowed the entire system. You can only seek a trace of the girl's last murmur from the noisy electromagnetic radiation. We failed to protect our sound of nature..."
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_7_TOOLTIP: "§HFalling into Reincarnation§!\n§YEmpire Event§!\n\nOn §L[GetDate]§!, [EVENT_TARGET_0.GetName] finally failed to transcend the constraints of causality. The Dimension Traveler fell into the Black Hole inevitably again. A violent big explosion swallowed the entire system. You can only seek a trace of the girl's last murmur from the noisy electromagnetic radiation. We lost her forever..."
 TIMELINE_DIMENSION_TRAVELER_END_7: "Falling into Reincarnation\n§L[GetDate]§!"
 
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_8_ORIGIN_TOOLTIP: "§HTranscending Causality§!\n§YMilestone§!\n\nOn §L[GetDate]§!, after experiencing thousands of rises and falls, after countless saves and loads, we have always implemented our love for each other and found the timeline belonging only to us in infinite parallel worlds. [EVENT_TARGET_0.GetName] handed over the answer to The Worm-in-Waiting, and the story ushered in a perfect ending. We will sing with our own voices."
 TIMELINE_EVENT_DIMENSION_TRAVELER_END_8_TOOLTIP: "§HTranscending Causality§!\n§YMilestone§!\n\nOn §L[GetDate]§!, after experiencing thousands of rises and falls, after countless saves and loads, we have always implemented our love for each other and found the timeline belonging only to us in infinite parallel worlds. [EVENT_TARGET_0.GetName] handed over the answer to The Worm-in-Waiting, and the story ushered in a perfect ending. We will soar with our own wings."
 TIMELINE_DIMENSION_TRAVELER_END_8: "Transcending Causality\n§L[GetDate]§!"
 
 ################################################################
