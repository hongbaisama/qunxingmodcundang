l_english:
 d_time:0 "£mod_col_time_mult£Central Singularity"
 d_time_desc:0 "Through technological breakthroughs and exploration for knowledge, we successfully reached the true Central Singularity within the Spacetime Black Hole. Unknown what cosmic mysteries are hidden therein."
 d_time_effect:0 "$t$Unlocks exclusive designation when capital: $col_time_capital$"
 d_time_effect_short:0 "Unlocks designation: $col_time_capital$"
 d_endless_time:0 "£mod_col_time_mult£Endless Core"
 d_endless_time_desc:0 "This is the core of the Endless Singularity, nurturing infinite universes within."
 d_endless_time_effect:0 "$t$Capital exclusive designation promoted to: $col_endless_time_capital$"
 d_endless_time_effect_short:0 "Unlocks designation: $col_endless_time_capital$"
 d_time_resources:0 "£strategic£Palace of Future"
 d_time_resources_desc:0 "A mysterious palace storing inexhaustible rare resources. The text on the palace indicates it comes from the future, but we do not understand the meaning."
 d_time_resources_end:0 "£strategic£Palace of Past"
 d_time_resources_end_desc:0 "We gift a steady stream of rare resources to the past through the palace, just as our future selves gifted to the present."
 d_time_energy:0 "£energy£High Entropy Plane"
 d_time_energy_desc:0 "Through the spacetime lane, we accidentally discovered a High Entropy Plane filled with high-pressure energy."
 d_time_minerals:0 "£minerals£Weightless Plane"
 d_time_minerals_desc:0 "Through the spacetime lane, we accidentally discovered a Weightless Plane where floating ores can be seen everywhere."
 d_time_food:0 "£food£Life Plane"
 d_time_food_desc:0 "Through the spacetime lane, we accidentally discovered a Life Plane where many creatures thrive."
 d_time_alloys:0 "£alloys£Dead Plane"
 d_time_alloys_desc:0 "Through the spacetime lane, we accidentally discovered a Dead Plane where ship wreckage still has recycling value."
 d_time_consumer_goods:0 "£consumer_goods£Treasure Plane"
 d_time_consumer_goods_desc:0 "Through the spacetime lane, we accidentally discovered a Treasure Plane which seems to be the treasure hiding place of ancient precursors."
 d_time_physics_research:0 "£physics£Information Plane"
 d_time_physics_research_desc:0 "Through the spacetime lane, we accidentally discovered an Information Plane where secrets might be hidden in disorganized information flows."
 d_time_society_research:0 "£society£Primordial Plane"
 d_time_society_research_desc:0 "Through the spacetime lane, we accidentally discovered a Primordial Plane where the first life was born."
 d_time_engineering_research:0 "£engineering£Holographic Plane"
 d_time_engineering_research_desc:0 "Through the spacetime lane, we accidentally discovered a Holographic Plane where high-dimensional technology is displayed before us in projection form."
 d_time_unity:0 "£unity£Magic Plane"
 d_time_unity_desc:0 "Through the spacetime lane, we accidentally discovered a Magic Plane where powerful psionics overflow from cracks."
 d_brief:0 "£time£Mirror of Excerptors"
 d_brief_desc:0 "Is this a masterpiece of the Excerptors' past, or the future home of the Excerptors? At least we don't need to find the answer right now."
 d_time_beyond_infinity:0 "£time£$astral_rift_akx_time$"
 d_time_beyond_infinity_desc:0 "This planet is directly connected to the Inverse Plane, and the expanding rift is filled with pure and inexhaustible time turbulence."
 d_time_recursion:0 "£time_add£Recursive Nexus"
 d_time_recursion_desc:0 "Infinite nexus performing infinite recursion."
 d_time_blocker_0:0 "£blocker£Gravitational Vortex"
 d_time_blocker_0_desc:0 "This spacetime is full of chaotic gravitational vortexes, recklessly devouring everything around."
 d_time_blocker_0_tooltip:0 "§BSome interesting secrets seem to be hidden in this spacetime, perhaps we can get the answer after exploring§!"
 d_time_blocker_1:0 "£blocker£Gravitational Anomaly"
 d_time_blocker_1_desc:0 "Disordered gravitational anomalies appeared in this spacetime, and nearby gravitational changes are unpredictable."
 d_time_blocker_2:0 "£blocker£Gravitational Barrier"
 d_time_blocker_2_desc:0 "The central zone of the Black Hole is an invisible gravitational barrier; no matter can pass through it for the time being."
 d_time_blocker_3:0 "£blocker£Gravitational Trap"
 d_time_blocker_3_desc:0 "Under the gravitational barrier, a weird gravitational trap lurks in the Black Hole core. Light straying into it disappears without a trace."
 
 d_pc_hive_same_effect:0 "\n(There is a §Y33%§! chance to spread to adjacent systems instead)\n\nEach planet with ['concept_d_pc_hive'] or ['concept_d_pc_hive_other'] will §Genhance§! the following effects:"
 d_pc_hive:0 "Synapse of Love"
 d_pc_hive_desc:0 "We communicate with the homeworld through these synapses, and the homeworld selflessly gives us infinite love."
 d_pc_hive_effect:0 "Every §Y10§! years there is a §G100%§! chance to transform a random solid planet in the system into a ['concept_pc_hive'] with ['concept_d_pc_hive_other']$d_pc_hive_same_effect$"
 d_pc_hive_effect_short:0 "Every §Y10§! years there is a §G100%§! chance to spread"
 d_pc_hive_other:0 "Branch of Love"
 d_pc_hive_other_desc:0 "We maintain love with the homeworld through these branches, and the homeworld also looks forward to our response to her."
 d_pc_hive_other_effect:0 "Every §Y10§! years there is a §G50%§! chance to transform a random solid planet in the system into a ['concept_pc_hive'] with ['concept_d_pc_hive_other']$d_pc_hive_same_effect$"
 d_pc_hive_other_effect_short:0 "Every §Y10§! years there is a §G50%§! chance to spread"
 d_pc_hive_blocker:0 "£blocker£Broken Synapse"
 d_pc_hive_blocker_desc:0 "The synapse connecting us with the homeworld has been damaged.\nLost the resonance of the homeworld, we can hardly move."
 d_dead_pc_hive:0 "£blocker£Withered Synapse"
 d_dead_pc_hive_desc:0 "This synapse connecting to the hive has withered."
 d_dead_pc_hive_other:0 "£blocker£Withered Branch"
 d_dead_pc_hive_other_desc:0 "This branch connecting to the hive has withered."
 
 d_origin_contract_zro:0 "Mad Voices"
 d_origin_contract_zro_desc:0 "These chaotic whispers affect our sanity all the time, but this may not be a bad thing."
 
 d_gas_generator:0 "Conductive Gas"
 d_gas_generator_desc:0 "This mass of gas has good conductivity, making it easier to utilize the discharge phenomenon within."
 d_gas_mining:0 "Rich Rock"
 d_gas_mining_desc:0 "This condensed rock is rich in mineral resources and has great mining value."
 d_gas_farming:0 "Liquid Ammonia Hotbed"
 d_gas_farming_desc:0 "Many edible plankton appeared in this liquid ammonia, which can solve the food problem to a certain extent."
 d_gas_colony_arcology:0 "Gaseous Ecumenopolis"
 d_gas_colony_arcology_desc:0 "Utilization of deep domains has reached a new height; the chaotic atmosphere of the outer layer can no longer harm our industries."
 d_gas_colony_hive:0 "Gaseous Hive World"
 d_gas_colony_hive_desc:0 "The spread to deep domains has reached a new height; the chaotic atmosphere of the outer layer can no longer affect our hive."
 uncapped_pc_gas_colony_district_effect:0 "$t$£district£$district_gas_generator$: No Limit\n$t$£district£$district_gas_mining$: No Limit\n$t$£district£$district_gas_farming$: No Limit"
 uncapped_pc_gas_colony_district_effect_short:0 "£district_generator_max££district_mining_max££district_farming_max£: No Limit"
 d_gas_blocker_1:0 "£blocker£Dust Storm"
 d_gas_blocker_1_desc:0 "Dust storms often appearing in Gas Giants can tear approaching objects apart instantly."
 d_gas_blocker_2:0 "£blocker£Spaceship Wreckage"
 d_gas_blocker_2_desc:0 "Some spaceship wreckage crashed into this Gas Giant, seeming to carry some special supplies. However, the wreckage flies irregularly with the cyclone, extremely destructive."
 
 d_psionic_generator:0 "Psionic Storm"
 d_psionic_generator_desc:0 "A strong psionic storm appeared here, and the energy fluctuations within are sufficient for power generation."
 d_psionic_mining:0 "Shroud Crystal"
 d_psionic_mining_desc:0 "This crystal from the Shroud contains various metal elements and is of excellent quality."
 d_psionic_farming:0 "Sacred Altar"
 d_psionic_farming_desc:0 "This is a natural altar, very suitable for sacrifice."
 d_psionic_blocker_1:0 "£blocker£Psionic Abyss"
 d_psionic_blocker_1_desc:0 "A psionic abyss appeared here; no creature falling into it can survive."
 d_psionic_blocker_2:0 "£blocker£Shroud Creature"
 d_psionic_blocker_2_desc:0 "Some dangerous Shroud creatures escaped from the rift and wreaked havoc on the planet."
 
 d_nanites_generator:0 "Nanite Atmosphere"
 d_nanites_generator_desc:0 "The atmosphere is filled with nanobots, which can be used to efficiently convert stellar light and heat energy."
 d_nanites_mining:0 "Nanite Desert"
 d_nanites_mining_desc:0 "This is a desert composed of countless nanobots, reserving various rare metal elements."
 d_nanites_old_factory:0 "£nanites£Nanite Factory"
 d_nanites_old_factory_desc:0 "A Nanite Factory built in ancient times. The core principle is unknown, but it can assist in robot assembly."
 d_nanites_old_factory_effect:0 "$t$Unlocks exclusive designation when capital: §Y$col_nanites_capital_machine$§!"
 d_nanites_old_factory_effect_short:0 "Unlocks designation: §Y$col_nanites_capital_machine$§!"
 d_nanites_blocker_1:0 "£blocker£Meteorite Crater"
 d_nanites_blocker_1_desc:0 "A huge crater smashed by a meteorite, unfavorable for the work of nanite machines."
 d_nanites_blocker_2:0 "£blocker£Nanite Cyclone"
 d_nanites_blocker_2_desc:0 "A cyclone composed of abandoned nanobots, unfavorable for the work of nanite machines."
 d_nanites_blocker_3:0 "£blocker£Nanite Quicksand"
 d_nanites_blocker_3_desc:0 "Disordered flowing nanite desert, unfavorable for the work of nanite machines."
 
 planet_deposits_parallel_sky:0 "Parallel Protocol"
 d_parallel_sky:0 "Parallel Starry Sky"
 d_parallel_sky_desc:0 "Planets from different planes overlapped for a certain period, and the two civilizations developing on this overlapping planet embraced different starry skies."
 d_parallel_sky_1:0 "Energy Metropolis"
 d_parallel_sky_1_desc:0 "The energy metropolis originally owned by another civilization is now providing us with a steady stream of electricity."
 d_parallel_sky_2:0 "Ship Factory"
 d_parallel_sky_2_desc:0 "The ship factory originally owned by another civilization, we can dismantle abandoned ships and wreckage into minerals."
 d_parallel_sky_3:0 "Emergency Granary"
 d_parallel_sky_3_desc:0 "The emergency granary originally owned by another civilization, storing enough food to cope with years of famine."
 d_parallel_sky_4:0 "Dimensional Core"
 d_parallel_sky_4_desc:0 "An information radiation source found in the overlapping part of the planet, suspected to be related to the planet overlapping phenomenon, research on it is extremely valuable."
 d_parallel_sky_blocker:0 "£blocker£Information Radiation"
 d_parallel_sky_blocker_desc:0 "A high-energy area found in the overlapping part of the planet, filled with chaotic information radiation, seeming to hide some secrets."
 
 d_the_matrix_blocker:0 "£blocker£Life Support Capsule"
 d_the_matrix_blocker_desc:0 "These neural chips are immersed in happy illusions, afraid to face the unknown reality."
 d_the_matrix_blocker_effect:0 "$t$ §YResources produced by blocker§! and §Ynumber of pops saved§! will §Rdecrease§! over time"
 d_the_matrix_blocker_clear_effect:0 "Save [GetTheMatrixBlockerPopValue] £pop£Pops"
 
 d_pirate_king_blocker:0 "£blocker£Ancestor's Treasure Site"
 d_pirate_king_blocker_desc:0 "Legend has it that our pirate ancestors buried treasures they looted here. Following the route on the treasure map, we will definitely dig up treasures!"
 d_pirate_king_blocker_tooltip_1:0 "Found §Gmassive§! £energy£Gold Coins"
 d_pirate_king_blocker_tooltip_2:0 "Found §Gmassive§! £minerals£Gems"
 d_pirate_king_blocker_tooltip_3:0 "Found §Gmassive§! £alloys£Weapons"
 d_pirate_king_blocker_tooltip_4:0 "Found §Gmassive§! £consumer_goods£Jewelry"
 d_pirate_king_blocker_tooltip_5:0 "Found §Ysmall amount of§! £energy£Gold Coins"
 d_pirate_king_blocker_tooltip_6:0 "Found §Ysmall amount of§! £minerals£Gems"
 d_pirate_king_blocker_tooltip_7:0 "Found §Ysmall amount of§! £alloys£Weapons"
 d_pirate_king_blocker_tooltip_8:0 "Found §Ysmall amount of§! £consumer_goods£Jewelry"
 d_pirate_king_rare_blocker:0 "£blocker£Legendary Treasure Site"
 d_pirate_king_rare_blocker_desc:0 "It is said that the greatest Pirate King buried mysterious treasures here. Even without a treasure map, we can find the treasure!"
 d_pirate_king_rare_blocker_tooltip:0 "§MNo one knows what the Pirate King buried, and we don't know what we will discover§!"
 
 d_noah_ark:0 "£blocker£Crashed Ark"
 d_noah_ark_desc:0 "Noah's Ark crashed here. Although the ship wreckage hinders the development of the planet, the resources stored on the ship are enough for our daily expenses."
 d_noah_ark_effect:0 "$t$Ship resource reserves estimated to last for §Y[GetNoahArkBlockerValue]§! years"
 
 d_under_the_haze:0 "Monument to Church of Ascension"
 d_under_the_haze_desc:0 "Although the Church of Ascension once endangered our future, they still played an indispensable role in our history. We should remember them, remembering both their contributions to civilization and the lesson of their lost way."
 
 d_abandoned_by_god_home_planet:0 "$origin_abandoned_by_god_home_planet$"
 d_abandoned_by_god_home_planet_desc:0 "$origin_abandoned_by_god_home_planet_desc$"
 
 d_secondhand_country:0 "Second-Hand Garbage Mountain"
 d_secondhand_country_desc:0 "Various second-hand wastes pile up like mountains. Some say this is garbage, but we think they are treasures."
 d_secondhand_country_effect:0 "$t$Owner will §GUnlock§! some ['concept_secondhand_country_traits_yellow'] traits"
 d_secondhand_country_effect_short:0 "Unlock traits: ['concept_secondhand_country_traits_yellow']"
 
 d_wishing_well:0 "Wishing Well"
 d_wishing_well_desc:0 "The limited wishing well satisfies people's infinite desires."
 d_wishing_well_effect:0 "$t$Production and upkeep will §Gdouble§! every §Y10§! years\n$t$Production and upkeep §G+25%§! for each §YAscension Perk§! our Empire has taken\n$t$§RDesire will become increasingly difficult to satisfy!§!"
 
 d_white_hole:0 "Song of Nature"
 d_white_hole_desc:0 "The sounds of nature from the White Hole can be vaguely felt by us, inspiring us to continuously progress to explore the secrets in the White Hole."
 d_white_hole_1:0 "Origin"
 d_white_hole_1_desc:0 "Everything remains at the origin. We have explored the mystery of the White Hole. Next, what unsolved mysteries are waiting for us?"
 d_white_hole_2:0 "Echo of Dust Shadow"
 d_white_hole_2_desc:0 "Only intermittent singing can be heard from the White Hole. We don't know whether it is painful weeping or regretful mourning."
 d_white_hole_3:0 "Termination"
 d_white_hole_3_desc:0 "Everything has ushered in termination. No sounds of nature come from the White Hole anymore, but the sounds of nature in our hearts still linger."
 d_white_hole_4:0 "Origin is Termination"
 d_white_hole_4_desc:0 "Is all this a beginning or an end? Will we meet again, at the origin of the universe, or at the end of the world?"
 d_white_hole_5:0 "Termination is Origin"
 d_white_hole_5_desc:0 "All this has already ended and already begun. We will definitely meet again, whether at the end of the world or at the origin of the universe."
 
 d_dark_matter_deposit_5:0 "£sr_dark_matter£§Y+5§!"
 d_dark_matter_deposit_5_desc:0 "$d_dark_matter_deposit_5$"
 
 d_time_horror:0 "Spacetime Gift"
 d_time_horror_desc:0 "This §YManifested Horrific Inverse Mass§! comes from the deepest part of the §YHorrific Inverse Plane§!.\nIt is the original body for our replication of Inverse Phase matter, and also the key to our discovery of the secrets of the Inverse Plane."
 d_time_horror_effect:0 "每个因§Y$horror_study_trophy2$§!回归终焉的星球都将使以下效果§G增强§!："
 
 d_akx_dark_matter:0 "$astral_rift_akx_horror$"
 d_akx_dark_matter_desc:0 "This planet is directly connected to the Inverse Plane, and a steady stream of Dark Matter pours into our world through the rift."
 d_orbital_akx_dark_matter:0 "$d_akx_dark_matter$"
 d_orbital_akx_dark_matter_desc:0 "$d_akx_dark_matter_desc$"
 d_akx_dark_matter_special:0 "$astral_rift_akx_time$"
 d_akx_dark_matter_special_desc:0 "This planet is directly connected to the Inverse Plane, and the expanding rift is filled with pure and inexhaustible Dark Matter."
 d_orbital_akx_dark_matter_special:0 "$d_akx_dark_matter_special$"
 d_orbital_akx_dark_matter_special_desc:0 "$d_akx_dark_matter_special_desc$"
 
 d_akx_messenger_closed:0 "$d_akx_messenger$"
 d_akx_messenger_closed_desc:0 "$akx_messenger_closed_picture$This is a gate to the Beyond; no one knows what it will bring."
 d_akx_messenger_closed_effect:0 "$t$ §RThe Gate to the Beyond does not move.§!"
 d_akx_messenger:0 "Gate to the Beyond"
 d_akx_messenger_desc:0 "$akx_messenger_picture$Messengers from another world brought us news of the future. Whether it is a blessing or a curse depends on our choice.\n§YWhat exactly does the Beyond mean?§!"
 d_akx_messenger_effect:0 "[GetDepositAkxMessengerEffect]"
 building_akx_end_messenger:0 "$d_akx_messenger$"
 building_akx_end_messenger_desc:0 "$d_akx_messenger_desc$"
 building_akx_future_messenger:0 "$d_akx_messenger$"
 building_akx_future_messenger_desc:0 "$d_akx_messenger_desc$"
 make_akx_messenger_effect:0 "$t$Annually convert §Y$@d_akx_messenger_transfer_percentage|0%$§! of ['concept_trait_akx_waiting_world_all'] pops to ['concept_trait_akx_messenger_with_icon']"
 
 d_akx_gestalt_messenger_closed:0 "$d_akx_gestalt_messenger$"
 d_akx_gestalt_messenger_closed_desc:0 "$akx_messenger_closed_picture$This is a gate spontaneously built by messengers; no one knows the reason."
 d_akx_gestalt_messenger_closed_effect:0 "$t$ §RThe Messenger Gate does not move.§!"
 d_akx_gestalt_messenger:0 "Messenger Gate"
 d_akx_gestalt_messenger_desc:0 "$akx_messenger_picture$Messengers shuttle in parallel worlds, conveying answers to riddles for us, but what is the question?\n§YCan we find the truth?§!"
 d_akx_gestalt_messenger_effect:0 "[GetDepositAkxGestaltMessengerEffect]"
 building_akx_gestalt_messenger:0 "$d_akx_gestalt_messenger$"
 building_akx_gestalt_messenger_desc:0 "$d_akx_gestalt_messenger_desc$"
 make_akx_messenger_gestalt_effect:0 "$t$Annually convert §Y$@d_akx_gestalt_messenger_transfer_percentage|0%$§! of ['concept_trait_akx_waiting_world_all'] pops to ['concept_trait_akx_messenger_with_icon']"
 
 d_tree_of_life_tooltip:0 "§Y$tr_purity_finish$§! will §Genhance§! planet effects"
 
 time_gaia_deposit_tooltip:0 "['concept_time_gaia_deposit']"
 d_time_gaia_energy:0 "Internal Circulation Energy Storage Atmosphere"
 d_time_gaia_energy_desc:0 "The atmosphere of this Gaia World has a unique internal circulation system, capable of storing energy from stars more efficiently and radiating it to the surface at a suitable level."
 d_time_gaia_minerals:0 "Renewable Rare Minerals"
 d_time_gaia_minerals_desc:0 "The mineral deposits of this Gaia World have unique renewable capabilities, capable of rapidly converting surface waste into rare minerals and allowing continuous efficient mining."
 d_time_gaia_food:0 "Adaptive Ecosystem"
 d_time_gaia_food_desc:0 "The ecology of this Gaia World has unique adaptive characteristics, capable of invisibly transforming corpses and excrement into nutrients and promoting the evolution and development of biological groups."
 
 d_time_ringworld_network:0 "Ring Network"
 d_time_ringworld_network_desc:0 "This $pc_ringworld_habitable$ has established a huge control network, realizing efficient utilization of the vast land of the Ring World through flexible facility planning and dynamic job allocation.\nThe Ring Network is also allowed to access the system network hub to share computing power with other Ring Networks in the system."
 d_time_ringworld_network_effect:0 "$t$Each §Y$d_time_ringworld_network$§! in the system will §Genhance§! the following effects:"
 
 d_horror_dark_matter_blocker:0 "暗物质屏障"
 d_horror_dark_matter_blocker_desc:0 "这片区域被诡异的暗物质浓雾屏蔽着。"
 d_horror_dark_matter_blocker_tooltip:0 "§Y这片区域将被暗物质永久影响§!"
 d_horror_dark_matter_energy:0 "暗物质磁场"
 d_horror_dark_matter_energy_desc:0 "这片区域的磁场强度因暗物质发生异常突变。"
 d_horror_dark_matter_minerals:0 "暗物质矿脉"
 d_horror_dark_matter_minerals_desc:0 "这片区域的矿脉丰度因暗物质发生异常突变。"
 d_horror_dark_matter_food:0 "暗物质变异"
 d_horror_dark_matter_food_desc:0 "这片区域的天然生物因暗物质发生异常突变。"
 d_horror_dark_matter_alloys:0 "暗物质熔炉"
 d_horror_dark_matter_alloys_desc:0 "这片区域的常态温度因暗物质发生异常突变。"
 d_horror_dark_matter_consumer_goods:0 "暗物质气压"
 d_horror_dark_matter_consumer_goods_desc:0 "这片区域的大气压强因暗物质发生异常突变。"
 d_horror_dark_matter_physics_research:0 "暗物质折射"
 d_horror_dark_matter_physics_research_desc:0 "这片区域的光学性质因暗物质发生异常突变。"
 d_horror_dark_matter_society_research:0 "暗物质基因"
 d_horror_dark_matter_society_research_desc:0 "这片区域的基因序列因暗物质发生异常突变。"
 d_horror_dark_matter_engineering_research:0 "暗物质引力"
 d_horror_dark_matter_engineering_research_desc:0 "这片区域的引力强度因暗物质发生异常突变。"
 d_horror_dark_matter_unity:0 "暗物质干扰"
 d_horror_dark_matter_unity_desc:0 "这片区域的通讯方式因暗物质发生异常突变。"
 d_horror_dark_matter_deposit_effect:0 "$t$在§Y$pc_nuked$§!上获得额外§G加成§!"
 
 d_dimensional_horror_crisis_same_desc:0 "The Proclamation of the End tore a rift to other dimensions on this planet.\n"
 d_dimensional_horror_crisis_physics:0 "Radiation Dimension"
 d_dimensional_horror_crisis_physics_desc:0 "$d_dimensional_horror_crisis_same_desc$This dimension is full of various radiations, and radiation signals here are not affected by time and space."
 d_dimensional_horror_crisis_society:0 "Mirror Dimension"
 d_dimensional_horror_crisis_society_desc:0 "$d_dimensional_horror_crisis_same_desc$This dimension seems to be a mirror image of our universe, but its imitation in detail is clumsy."
 d_dimensional_horror_crisis_engineering:0 "Ice Crystal Dimension"
 d_dimensional_horror_crisis_engineering_desc:0 "$d_dimensional_horror_crisis_same_desc$Everything in this dimension consists of a peculiar ice crystal, with excellent material strength and plasticity."
 d_dimensional_horror_crisis_sr_dark_matter:0 "Inverse Entropy Dimension"
 d_dimensional_horror_crisis_sr_dark_matter_desc:0 "$d_dimensional_horror_crisis_same_desc$This dimension will automatically develop towards a state of reduced entropy. When entropy reaches the minimum value, it will trigger unpredictable chain reactions."
 d_dimensional_horror_crisis_sr_zro:0 "Shroud Dimension"
 d_dimensional_horror_crisis_sr_zro_desc:0 "$d_dimensional_horror_crisis_same_desc$This dimension connects to a corner of the Shroud, but there is no sign of Shroud life activity."
 d_dimensional_horror_crisis_sr_living_metal:0 "Magic Box Dimension"
 d_dimensional_horror_crisis_sr_living_metal_desc:0 "$d_dimensional_horror_crisis_same_desc$This dimension has only one mysterious magic box, and all objects spit out from it are composed of Living Metal."
 d_dimensional_horror_crisis_nanites:0 "Gray Worm Dimension"
 d_dimensional_horror_crisis_nanites_desc:0 "$d_dimensional_horror_crisis_same_desc$This dimension is inhabited by a group of giant worms formed by nanites, yet there is no evidence that their existence is artificial."
 d_dimensional_horror_crisis_astral_threads:0 "Divine Tree Dimension"
 d_dimensional_horror_crisis_astral_threads_desc:0 "$d_dimensional_horror_crisis_same_desc$This dimension is covered by the roots of a divine tree. The divine tree claims to be able to answer all our questions, but it does not guarantee the authenticity of the answers."