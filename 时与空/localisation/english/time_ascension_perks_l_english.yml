l_english:
 ap_category_akx_horror: "Horror"
 ap_category_akx_horror_desc: "对负相的探索永无止境。"
 
 ap_horror:0 "Inverse Phase Mysteries"
 ap_horror_desc:0 "Under the guidance of The Worm-in-Waiting, we can try to explore the mysterious Horrific Inverse Plane and step into endless ascension."
 ap_horror_effect:0 "§MAcquire knowledge of the Horrific Inverse Plane and enhance ['concept_horror_time'] technologies.§!"
 
 ap_time:0 "Spacetime Causality"
 ap_time_desc:0 "We are obsessed with the mysteries in the Inverse Phase. We crave knowledge, we crave truth, we crave infinity.\nJust as we did in the past, just as we will do in the future."
 ap_time_effect:0 "§MGain insight into the knowledge of the Horrific Inverse Plane and greatly enhance ['concept_horror_time'] technologies.§!"
 ap_time_potential_effect:0 "$ap_time_effect$\n§RThis Ascension Perk and subsequent content are quite powerful, cannot be unlocked in vanilla 8 Ascension Perks environment, please choose carefully!§!"
 
 ap_beyond_infinity:0 "Beyond Infinity"
 ap_beyond_infinity_desc:0 "We are not fanatics who become the Crisis, but lost people seeking redemption. Even if the success rate of stopping the End is infinitely close to zero, if we don't try, it will only be zero.\n\nSince we have transcended causality, we can definitely transcend infinity."
 ap_beyond_infinity_effect:0 "[Root.GetName] can now embark on the path of §MBeyond Infinity§!."
 ap_beyond_infinity_potential_effect:0 "$ap_beyond_infinity_effect$\n§RThis Ascension Perk and subsequent content are extremely powerful, and may even face quite powerful opponents, please choose carefully!§!"
 
 ap_origin_time:0 "Heart of Singularity"
 ap_origin_time_desc:0 "Infinite us explore infinite black holes, endless singularities connect infinite spacetime. We have touched the heart of the black hole, we are the singularity."
 ap_origin_time_effect:0 "$UNLOCKS_AGENDA$ §Y$council_agenda_agenda_time_soul_name$§!. "
 ap_origin_time_potential_effect:0 "$UNLOCKS_AGENDA$ §Y$council_agenda_agenda_time_soul_name$§!, obtain corresponding ['concept_trait_time_soul'] trait according to §YAscension Path§!."
 
 ap_origin_gas_colony:0 "Gaseous Journey"
 ap_origin_gas_colony_desc:0 "Many interesting things happened between $NAME_Baldarak$ and $NAME_New_Baldarak$. Even if movement is restricted, they still act according to their own wishes. Perhaps we should also overcome our defects and bravely embark on our journey."
 ap_origin_gas_colony_effect:0 "Allows us to perform adaptive terraforming on §Y$pc_gas_giant$§!."
 
 ap_nanites_ring:0 "Nanite Ring"
 ap_nanites_ring_desc:0 "After learning our mission, memories of the past also reappeared in the storage unit. We were once used for various construction projects, but now, we will follow our own will to shape our home."
 ap_nanites_ring_effect:0 "Unlock exclusive Starbase §YModules§! and §YBuildings§!."
 
 dimension_traveler_may_leave:0 "§RThe Dimension Traveler does not want us to do this. If we insist on becoming the Crisis, she may leave us!§!"