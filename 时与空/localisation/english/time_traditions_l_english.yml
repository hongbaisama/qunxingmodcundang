 tr_hope_1:0 "Coils of God"
 tr_hope_1_delayed:0 "\"The loop never terminates.\""
 
 tr_hope_2:0 "Sanctified Servant"
 tr_hope_2_delayed:0 "\"Loop-Strange loop, time loop, hungry loop.\""
 
 tr_hope_3:0 "Realm of the Worm-in-Waiting"
 tr_hope_3_delayed:0 "\"What will be has been.\""
 
 tr_hope_4:0 "Syzygy"
 tr_hope_4_delayed:0 "\"The loop is both the beginning and the end.\""
 
 tr_hope_5:0 "Messenger"
 tr_hope_5_delayed:0 "\"What has been will be again.\""
 
