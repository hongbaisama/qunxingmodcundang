 # 负相
 ################################################################
 
 tradition_horror:0 "Inverse Phase"
 tradition_horror_desc:0 "We never thought of the existence of the Horrific Inverse Plane, and now it is opening its door, luring us deep."
 tr_horror_adopt:0 "Initial Exploration of Inverse Phase"
 tr_horror_finish:0 "Deep into Inverse Phase"
 tr_horror_finish_desc:0 "$UNLOCKS_AGENDA$ §Y$council_agenda_agenda_tradition_horror_name$§!\nGain random §YPrecursor Relic§! and §YPrecursor Technology§!"
 
 tr_horror_1:0 "Light Cone"
 tr_horror_1_delayed:0 "What does the light cone represent, and what is time?"
 
 tr_horror_2:0 "Force Field"
 tr_horror_2_delayed:0 "Does the force field exist, what is the meaning of space?"
 
 tr_horror_3:0 "Inverse Phase"
 tr_horror_3_delayed:0 "What crisis lurks behind the Inverse Phase?"
 
 tr_horror_4:0 "Spacetime"
 tr_horror_4_delayed:0 "Can spacetime flow backward, can causality be reversed?"
 
 tr_horror_5:0 "Plane"
 tr_horror_5_delayed:0 "What mystery is hidden on the other side of the plane?"
 
 ################################################################
 # 时空
 ################################################################
 
 tradition_time:0 "Spacetime"
 tradition_time_desc:0 "For us, spacetime is not a strange concept. But when we go deep into the Horrific Inverse Plane, it becomes less familiar."
 tr_time_adopt:0 "A Brief History of Spacetime"
 tr_time_finish:0 "Loop Theory"
 tr_time_finish_desc:0 "$UNLOCKS_AGENDA$ §Y$council_agenda_agenda_tradition_time_name$§!\n[GetTrTimeFinishDesc]"
 tr_time_finish_desc_1:0 "Gain Relic: $r_horror_matter$"
 tr_time_finish_desc_2:0 "§Y£sr_dark_matter£2000.00§!\n$r_horror_matter_become_powerful$"
 
 tr_time_1:0 "Light Cone Fluctuation"
 tr_time_1_delayed:0 "The light cone of time is not immutable. We can use the fluctuation of the light cone to deflect enemy lasers to other time periods, thereby avoiding attacks launched by most opponents."
 
 tr_time_2:0 "Force Field Corpuscularity"
 tr_time_2_delayed:0 "The force field of space is not illusory. We can use the corpuscularity of the force field to absorb enemy shells into ship kinetic energy, thereby reducing damage caused by most opponents."
 
 tr_time_3:0 "Inverse Phase Concreteness"
 tr_time_3_delayed:0 "Inverse Phase can also be concretized. Concretized Inverse Phase will lose its unpredictable nature and instead gain powerful attraction and twisting force, making it more convenient for our research."
 
 tr_time_4:0 "Spacetime Conjugacy"
 tr_time_4_delayed:0 "Time and space complement each other. Through the dual-dimensional strike of time and space, we can more accurately lock onto the weak parts of enemy ships and pose a greater threat."
 
 tr_time_5:0 "Plane Voidness"
 tr_time_5_delayed:0 "Planes can be converted in the void. Different worlds are connected through Horrific Inverse Mass, and Inverse Phase creatures can use this property to freely shuttle between various planes and realize their own cycles."
 
 ################################################################
 # 终末
 ################################################################
 
 tradition_end:0 "The End"
 tradition_end_desc:0 "The End is an ending, but also a beginning. He is both a concept and an entity.\nWe eventually ushered in the fate of the End."
 tr_end_adopt:0 "Beginning of the End"
 tr_end_finish:0 "End of the Beginning"
 tr_end_finish_desc:0 "$UNLOCKS_AGENDA$ §Y$council_agenda_agenda_tradition_end_name$§!\n$time.505.tooltip$\n$mod_country_unity_produces_mult$: §G+15%§!\n$MOD_COUNTRY_ASCENSION_PERKS_ADD$: §G+1§!"
 
 tr_end_1:0 "Light Cone Balancer"
 tr_end_1_delayed:0 "Re-balance the light cone, the End has its own laws."
 
 tr_end_2:0 "Force Field Chaotist"
 tr_end_2_delayed:0 "Make the force field full of chaos, this is a dimension belonging only to the End."
 
 tr_end_3:0 "Inverse Phase Spreader"
 tr_end_3_delayed:0 "Inverse Phase spreads between cause and effect, the journey of the End is endless."
 
 tr_end_4:0 "Spacetime Annihilator"
 tr_end_4_delayed:0 "Annihilation cycles back and forth, this is spacetime's compromise to the End."
 
 tr_end_5:0 "Plane Shatterer"
 tr_end_5_delayed:0 "Shatter all wounds, the End does not allow flawlessness of planes."
 
 ################################################################
 # 希望
 ################################################################
 
 tradition_hope:0 "Hope"
 tradition_hope_desc:0 "We refused the temptation of the End. We will open up the future with our own hands and seek hope to break the cycle."
 tr_hope_adopt:0 "Twilight of the End"
 tr_hope_finish:0 "Dawn of Hope"
 tr_hope_finish_desc:0 "$UNLOCKS_AGENDA$ §Y$council_agenda_agenda_tradition_hope_name$§!\n[GetTrHopeFinishDesc]"
