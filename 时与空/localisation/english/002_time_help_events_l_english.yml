 time_help.850.name:0 "Utility Functions"
 time_help.850.desc:0 "These are some utility functions made by the author, which can solve some OCD problems and some unwanted bugs."
 time_help.850.a:0 "Primary Species Iteration"
 time_help.850.a.allow.1:0 "The default template of the primary species should not be already the main species"
 time_help.850.a.allow.2:0 "The default template of the primary species should not differ significantly from the main species"
 time_help.850.a.allow.3:0 "The pop amount of the default template of the primary species should be in advantage"
 time_help.850.a.tooltip:0 "Set the §HDefault Template§! of the §YPrimary Species§! as the §YEmpire's Main Species§!"
 time_help.850.b:0 "Leader Makeover"
 time_help.850.b.tooltip:0 "The species of all §YPrimary Species Leaders§! will update to §YPrimary Species§!"
 time_help.850.c:0 "$tech_end_dimension$"
 time_help.850.c.tooltip:0 "Connect newly appeared §YBlack Holes§! to our singularity dimension, and become selectable §YBlack Hole Traversal§! destinations"
 time_help.850.d:0 "Refresh Seal of the End"
 time_help.850.d.tooltip:0 "Obtain ['concept_dimensional_horror_crisis_seal_yellow'] project in all systems that are ['concept_dimensional_horror_crisis_erasured_yellow'] and §YNot ['concept_dimensional_horror_crisis_sealed_yellow']§!"
 
 time_help.900.name:0 "Play Music"
 time_help.900.desc:0 "This mod adds some music for playing in certain events. You can also play music through this interface at any time.\n\n§RNote:§! Playing music does not stop the previous music (game code limitation), so please do not play music multiple times at the same time."
 time_help.900.a:0 "\"White Bird Crossing the River Beach\""
 time_help.900.b:0 "\"Ask the Wind\""
 time_help.900.c:0 "\"Light Spot of Dream\""
 time_help.900.d:0 "\"Destiny-SADAME\""
 time_help.900.e:0 "\"The One Being Sung - Kuon\""
 
 time_help.950.name:0 "Ascension Paths"
 time_help.950.desc:0 "Because some origins of this mod come with ascension effects, the original ascension files need to be modified, which leads to conflicts with §YFour Major Ascension Coexistence Mods§!.\n\nTherefore, this mod provides §Ycompatibility§! for §YAscension Adoption§!, which is disabled by default. Players in need can enable it by themselves.\n\n§RNote§!: This mod does not come with ascension path coexistence mechanism. Mechanism regarding tradition adoption, trait coexistence, assimilation compatibility, etc. requires support from §YFour Major Ascension Coexistence Mods§!.\nRequires support from §YFour Major Ascension Coexistence Mods§!.\nRequires support from §YFour Major Ascension Coexistence Mods§!.\nRequires support from §YFour Major Ascension Coexistence Mods§!."
 time_help.ascension_paths.on:0 "§REnable Ascension Coexistence§!"
 time_help.ascension_paths.on.tooltip:0 "§YIf you have not enabled Four Major Ascension Coexistence Mods, please do not enable. Otherwise, after enabling, you can only adopt ascension, but still §Rcannot§! adopt tradition!§!"
 time_help.ascension_paths.off:0 "§GDisable Ascension Coexistence§!"
 time_help.ascension_paths.off.tooltip:0 "§YDisabling only affects future ascension adoption and will not affect the effects of adopted ascensions.§!"
 
 time_help.1000.name:0 "Author's Letter"
 time_help.1000.desc:0 "Hello, I am the author of the §HTime and Space§! mod - Dawn.\n\nHaving experienced so many events related to The Worm-in-Waiting, and perhaps experienced many new origins, do you like these new contents I added? If you like and are willing, welcome to scan the QR code in the picture to donate and support the mod author~\n\nOf course, donation behavior cannot bring you extra advantages, and not donating will not affect any of your game experience. Whether to donate is completely your freedom. However, I still hope that players who like this mod can move their fingers and give this mod a little like on the Workshop. Your support is the biggest motivation for the author to update!\n\nThank you very much for subscribing to §HTime and Space§!!"