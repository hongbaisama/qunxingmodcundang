 time_help.0.name:0 "Message from Outside Spacetime"
 time_help.0.desc:0 "This is the built-in guide for the §H\"Time and Space\"§! mod, which will be gradually updated with mod versions. You can also configure some mechanisms here.\n\nIt is recommended that players explore on their own first to get the best game experience. You are also welcome to join the QQ group: §H810943193§!.\n\nIf you do not want your non-artificial planets to become Tomb Worlds or Black Holes, you can execute the console command on the planet\n§Yeffect set_planet_flag = can_not_be_changed_by_akx_worm§!"
 time_help.0.a:0 "Dimension Traveler Event Chain"
 time_help.0.b:0 "Origin Guide"
 time_help.0.c:0 "Control Event Council"
 time_help.0.other:0 "Utility Functions"
 time_help.0.music:0 "Play Music"
 time_help.0.ascension_paths:0 "Ascension Paths"
 time_help.0.donation:0 "Sponsor Author"
 
 time_help.1.name:0 "Dimension Traveler Event Chain"
 time_help.1.desc:0 "The Dimension Traveler event chain is a content-rich, extremely long, and demanding event chain in this mod. Therefore, it is difficult to experience the complete process and even hidden routes through natural player exploration, so this guide is specially made."
 time_help.1.a:0 "§GThe Worm-in-Waiting: Traveler§!"
 time_help.1.a.tooltip:0 "Requires encountering §YWhite Hole§! system"
 time_help.1.b:0 "§YThe Worm-in-Waiting: See You Again§!"
 time_help.1.b.tooltip:0 "Requires completing §YTranscending Gravity§!"
 time_help.1.c:0 "§RTime Origin§!"
 time_help.1.c.tooltip:0 "Requires accepting §YDimension Traveler§!"
 time_help.1.d:0 "§MTranscending Causality§!"
 time_help.1.d.tooltip:0 "Requires arriving at §YTime Origin§!"
 time_help.11.name:0 "The Worm-in-Waiting: Traveler"
 time_help.11.desc:0 "In the §YThe Worm-in-Waiting§! event chain, after triggering the §Y$akx.9101.name$§! event, before researching the §Y$WORM_ENTRY_POINT$§! project, send a ship into any §YWhite Hole§! system (if §Y$origin_white_hole$§! origin, enter the home system instead) to trigger the §Y$DIMENSION_TRAVELER_CHAIN_1_title$§! event chain.\n\nAnalyze the Horizon Signal multiple times and successfully sail into the White Hole. Communicate with the Dimension Traveler, invite her to leave the White Hole together, and start the §YTranscending Gravity§! situation.\n\nIn the final stage of the situation, keep §YEngines On§! throughout, and §RDisapprove§! the Dimension Traveler's request, complete the situation, and end the event chain."
 time_help.12.name:0 "The Worm-in-Waiting: See You Again"
 time_help.12.desc:0 "§YTen years§! after the White Hole turns into a Black Hole, the §Y$DIMENSION_TRAVELER_CHAIN_2_title$§! event chain is automatically triggered.\n\nSend a ship back to §Rthat system§!, save and §Yaccept§! the \"past\" Dimension Traveler, and obtain the special leader Dimension Traveler."
 time_help.13.name:0 "Time Origin"
 time_help.13.desc:0 "Accept the love of §YThe Worm-in-Waiting§!, and open §Y$AP_HORROR_PROJECT_1$§!, §Y$AP_HORROR_PROJECT_2$§!, §Y$AP_HORROR_PROJECT_3$§! three special projects through subsequent series of events.\n\nLet the Dimension Traveler research §Rall§! §YMystery§! series special projects, unlock ['concept_policy_dimension_traveler'] policy, and meet the \"future\" Dimension Traveler again at §Y$DIMENSION_TRAVELER_TITLE$§!."
 time_help.14.name:0 "Transcending Causality"
 time_help.14.desc:0 "Under $normal_dimension_traveler$ policy, several years after the §Y$DIMENSION_TRAVELER_TITLE$§! event, open one of the §Y$DIMENSION_TRAVELER_PROJECT_END_1$§!, §Y$DIMENSION_TRAVELER_PROJECT_END_2$§!, §Y$DIMENSION_TRAVELER_PROJECT_END_3$§! special projects according to the choice in §Y$dimension_traveler.305.name$§! event.\n\nThrough multiple playthroughs, research §Rall§! §YTranscending§! series special projects, obtain §Rthree§! answers and record them in the player's reality."
 time_help.dimension_traveler.hide:0 "§MHidden True Ending§!"
 time_help.dimension_traveler.hide.response:0 "In a new playthrough, in the §Rlast§! event before starting the §YTranscending Gravity§! situation (i.e., §YTurning Point of Causality§!), §YPause§!, §YSave§!, §YLoad§!, the event content and option effects will change, entering the §YHidden Timeline§!, and starting the §YTranscending Causality§! situation.\n\nSelect the corresponding §YAnswer§! according to the event §YTitle§!, complete the situation, and achieve the §MHidden True Ending§!."
 time_help.dimension_traveler.hide.tooltip:0 "Requires obtaining any §YAnswer§!"
 
 time_help.100.name:0 "Origin Guide"
 time_help.100.desc:0 "Here, you can check the gameplay guide for some special origins."
 time_help.100.a:0 "$origin_time$"
 time_help.100.b:0 "$origin_gas_colony$"
 time_help.100.c:0 "$origin_psionic$"
 time_help.100.d:0 "$origin_nanites$"
 time_help.100.e:0 "$origin_noah_ark$"
 time_help.101.name:0 "$origin_time$"
 time_help.101.desc:0 "$origin_time$ origin suggests prioritizing the advancement of §Y$situation_pc_time$§! situation in the early stage, clearing blockers on the homeworld and upgrading homeworld districts, and ensuring that ['concept_origin_time_chosen'] always serves as the country ruler.\n\nUnder the condition that the ruler has ['concept_leader_trait_ruler_time'] trait, after completing the event §YTemple of the Loop§!, before building §Y$building_akx_worm_3$§!, dispatch a Science Officer to pilot a science ship into any §YBlack Hole§! system (subject to certain conditions) to trigger the §Y$TIME_BLACK_HOLE_CHAIN_title$§! event chain and activate the §Y$situation_time_black_hole_chain$§! situation.\n\nUnlock ['concept_tradition_origin_time'] tradition by clearing §Y$d_time_blocker_3$§!, and execute §Y$decision_time$§! decision on the homeworld to further enhance the homeworld.\n\nUnlock ['concept_ap_origin_time'] ascension by executing §Y$decision_time$§! decision, and promote §Y$council_agenda_agenda_time_soul_name$§! agenda to enhance species and leaders according to §YAscension Path§!."
 time_help.102.name:0 "$origin_gas_colony$"
 time_help.102.desc:0 "$origin_gas_colony$ origin discovers anomaly §Y$gas_colony_change_categories$§! by surveying §Y$pc_gas_giant$§!, and completing subsequent special projects may transform it into a §YHabitable Gas Giant§!.\n\nIf the original §YDathnak§! related events are triggered, some origin-exclusive dialogues will be added. Depending on your choice, you may obtain a §YHabitable Gas Giant§! or unlock an exclusive §YAscension Perk§!."
 time_help.103.name:0 "$origin_psionic$"
 time_help.103.desc:0 "$origin_psionic$ origin, after researching technology £society£§Y$tech_terrestrial_sculpting$§!, can terraform §YNine Habitable Planets§!, §Y$pc_gaia$§!, §Y$pc_nuked$§!, §Y$pc_relic$§!, §Y$pc_city$§!, §Y$pc_hive$§! into §YPsionic Worlds§!.\n\nThrough §YPsionic Ascension§!, two exclusive §YPlanetary Decisions§! will be unlocked.\nCan transform §Y$normal_psionic$§! and §Y$bad_psionic$§! into §Y$good_psionic$§!.\nCan also randomly transform §Y$worst_psionic$§! into other better psionic waves, but the premise is that disaster omens have not appeared.\n\nAfter §YBreaching the Shroud§!, §Y$ap_become_the_crisis$§! Ascension Perk will be automatically obtained."
 time_help.104.name:0 "$origin_nanites$"
 time_help.104.desc:0 "$origin_nanites$ origin, after researching technology £society£§Y$tech_terrestrial_sculpting$§!, can terraform §Y$pc_gray_goo$§! and §Y$pc_machine$§! into §YHabitable Nanite Worlds§!.\n\nAfter the L-Gate is opened, the §YGray Goo Fleet§! will appear fixedly. You can choose to §RJoin§! or §GResist§!.\nIf choosing to §RJoin§!, the §YGray Goo Fleet§! will become your ally, you will automatically obtain §Y$ap_become_the_crisis$§! Ascension Perk, and §RDeclare War on the entire galaxy§!. In addition, you will unlock the §YPlanetary Decision§! to build Gray Goo Fleets.\nIf choosing to §GResist§!, you will automatically obtain §Y$ap_defender_of_the_galaxy$§! Ascension Perk, and obtain bonus damage to §YCrisis§! and §YGray Goo Fleet§!."
 time_help.105.name:0 "$origin_noah_ark$"
 time_help.105.desc:0 "$origin_noah_ark$ origin, after researching technology £society£§Y$tech_climate_restoration$§!, can terraform §Y$pc_flood$§! into §Y$pc_ocean$§!.\n\nWhether through terraforming or Gaia Seeding, after transforming §Y$NAME_Noah_Ark_Home_Planet$§! in the home system into §Y$pc_gaia$§!, new archaeological sites will be discovered."
 
 time_help.200.name:0 "Control Event Council"
 time_help.200.desc:0 "Here, you can control whether event council positions from Time and Space are selectable, to avoid too many council positions affecting the selection of other council positions.\n\n§RNote:§! Disabling council positions will only make them not display in the council position selection interface, and will not make already selected council positions disappear."
