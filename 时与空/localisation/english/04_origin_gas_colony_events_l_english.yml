l_english:
 gas.2.name:0 "Gas Giant Signal"
 gas.2.desc:0 "We received a weak signal emitted from the atmosphere of a Gas Giant. Could it be someone, or something trying to establish contact with us?"
 gas.2.a:0 "Are there other gaseous lives?"
 
 gas.10.name:0 "Potential Habitable Gas Giant"
 gas.10.desc:0 "We found a Gas Giant named §Y[From.GetName]§! in the §Y[From.GetStarName]§! system.\n\nAccording to the exploration results sent by the science ship, the internal structure of this Gas Giant is very similar to our homeworld. After analysis, our Science Officer believes that this Gas Giant is very likely to become our new home. Therefore, they suggest that we immediately conduct an adaptation attempt on this planet by dispatching crew members to live temporarily on the planet to confirm whether our body structure can adapt to such an environment."
 gas.10.a:0 "This is a bold attempt."
 gas.10.b:0 "Approve."
 gas.10.c:0 "We'd better not take risks easily."
 gas.10.d:0 "Veto."
 gas.200.name:0 "New Home"
 gas.200.desc:0 "After a year of adaptation attempts, our science ship sent good news.\n\nAccording to the experimental results, we can fully adapt to the environment on §Y[FromFrom.GetName]§!. If possible, we can immediately dispatch a colony ship to colonize it. It is believed that after colonization, this Gas Giant will become our new home."
 gas.200.a:0 "Great!"
 gas.200.b:0 "New progress."
 gas.300.name:0 "Regrettable Attempt"
 gas.300.desc:0 "Despite a year of hard work, this adaptation attempt still ended in failure.\n\nOur Science Officer had to admit that the previous judgment was wrong. The actual environment inside §Y[FromFrom.GetName]§! is vastly different from our homeworld. With our body structure, we cannot survive in it at all. After losing several members, our experimental team was forced to withdraw from this Gas Giant."
 gas.300.a:0 "What a tragedy."
 gas.300.b:0 "Regrettable."
 
 gas.21.name:0 "Gaseous Colony: §HNew Journey§!"
 gas.21.desc:0 "With uneasiness, our pre-colonization team lived on §Y[From.GetName]§! for a long time.\n\nThey couldn't adapt to the environment of this planet at first, but with firm belief, they persisted, and used devices to adjust the cyclone direction and atmospheric flow rate of this planet. Now, §Y[From.GetName]§! has become a Gas Giant suitable for us to live, and the pre-colonization team has returned safely to our colonial base."
 gas.21.a:0 "This is a small step for them, but a giant leap for us!"
 
 gas.50.name:0 "§HGaseous Ecumenopolis§!: Established on [Root.GetName]"
 gas.50.desc:0 "The outer atmosphere of the Gas Planet is too chaotic. We were forced to open up space in the deep domain.\n\nAs we deepened into the core day by day, as we moved facilities inward one after another, we finally established a harbor exclusively for ourselves, away from the unpredictable chaotic system of the outer layer.\n\nGaseous people are invincible!"
 gas.50.a:0 "Amazing."
 gas.51.name:0 "§HGaseous Hive World§!: Established on [Root.GetName]"
 gas.51.desc:0 "The outer atmosphere of the Gas Planet is too chaotic. We were forced to expand territory into the deep domain.\n\nAs we deepened into the core day by day, as we moved facilities inward one after another, we finally established a home exclusively for ourselves, away from the unpredictable chaotic system of the outer layer.\n\nGaseous people are invincible!"
 gas.51.a:0 "Amazing."
 
 anomaly.5003.desc.gas_colony:0 "$anomaly.5003.desc$\n\nHmm... wait, you seem to be gaseous creatures like us, how did you leave the homeworld? No, these are not important anymore. Since we are all the same kind of people, you should be more willing to help us, right?"
 anomaly.5003.d.gas_colony:0 "$anomaly.5003.d$ (Deceive)"
 anomaly.5003.d.gas_colony.response:0 "$anomaly.5003.d.response$\n\nHey, wait, you haven't taken us yet! I understand, you are a bunch of liars, you are the same kind of people as those solid guys, you are all inhumane bastards!\n\nYou guys-are simply the plague of the galaxy! One day we will seize your position, and then settle accounts with you. Remember my words. Be swept into the dustbin of history with the solid era, you gas traitors! The era of true gaseous life will come!"
 anomaly.5007.a.gas_colony:0 "$anomaly.5007.a$ (Deceive)"
 anomaly.5007.a.gas_colony.response:0 "$anomaly.5007.a.response$\n\nHey, wait, you haven't taken us yet! How can you rob our future colony, we saw it first!\n\nBastard! Shameless! Cuckoo occupying magpie's nest! Rascal robbing other's home! Self-righteous idiot! Damn idiot! Ungrateful... (Your ship aimed weapons at them) Woo-that ball is yours, don't trouble us anymore, please, we were wrong, let us go QAQ!"
 anomaly.5019.a.gas_colony:0 "Maybe we can learn something from them."
 unlock_ap_origin_gas_colony:0 "Unlock §Y$ap_origin_gas_colony$§! Ascension Perk."