 origin_pirate_king.1.name:0 "Pirate King: §HSet Sail§!"
 origin_pirate_king.1.desc:0 "Since you asked sincerely, we will tell you mercifully:\nTo prevent wealth from being destroyed, to protect the peace of wealth, carry out love and true treasure evil, handsome and charming pirate role!\nWe are pirate ships shuttling through the galaxy. Black holes, a black tomorrow is waiting for us!"
 origin_pirate_king.1.a:0 "That's it!"
 origin_pirate_king.2.name:0 "Pirate King: §GCompetitor§!"
 origin_pirate_king.2.desc:0 "With the improvement of our strength, many other pirates think we have hindered their interests and actively challenged us."
 origin_pirate_king.2.a:0 "Bring it on!"
 origin_pirate_king.3.name:0 "Pirate King: §YCompetitor§!"
 origin_pirate_king.3.desc:0 "Our reputation is getting bigger and bigger, but there are always some pirates who dislike us and provoke us beyond their ability."
 origin_pirate_king.3.a:0 "Beat them to a pulp!"
 origin_pirate_king.4.name:0 "Pirate King: §RCompetitor§!"
 origin_pirate_king.4.desc:0 "We have gone further and further on the road of pirates and ruled many sea areas. Obviously, we posed a great threat to some guys, and they intend to eradicate us."
 origin_pirate_king.4.a:0 "Let them see who is the boss!"
 origin_pirate_king.5.name:0 "Pirate King: §MAbyss Fleet§!"
 origin_pirate_king.5.desc:0 "Our achievements almost surpassed our predecessors, and our infamy is much louder than any other pirate.\n\nHowever, a legendary fleet that sank in the black hole in history quietly appeared. They are preparing to make a comeback and seize our title of Pirate King."
 origin_pirate_king.5.a:0 "Go back to your abyss!"
 origin_pirate_king.6.name:0 "§MGhost Captain§!"
 origin_pirate_king.6.desc:0 "§RIt is impossible for anyone to defeat us. We should be the Pirate King!\n\nWe will wait for you in the abyss and take revenge on you!§!"
 origin_pirate_king.6.a:0 "Old thing from the abyss, this is our era!"
 unlock_decision_upgrade_pirate_king_arkship:0 "§Y:Unlocks Decision§! $decision_upgrade_pirate_king_arkship$"
 
 origin_pirate_king.7.name:0 "江洋大盗：§R迷失星际§!"
 origin_pirate_king.7.desc_a:0 "我们先祖留下的海盗船最终还是在星际间迷失了。\n\n随着§Y[FromFrom.GetName]§!的战败，我们在海盗间的声望也跌至谷底，没了旗舰的我们恐怕无法再成为任何人的威胁。虽然我们依旧能劫掠一些小型船队挣取赏金，但我们在这件小事上也失去了讨价还价的资本。"
 origin_pirate_king.7.desc_b:0 "我们引以为豪的海盗船最终还是在星际间迷失了。\n\n随着§Y[FromFrom.GetName]§!的战败，我们在海盗间的声望也有所减少，但我们作为海盗之王的威严依旧令他人忌惮。仅仅一次挫折还无法击垮我们，我们仍然有东山再起的机会。"
 origin_pirate_king.7.a:0 "成为海盗之王的梦该醒了。"
 origin_pirate_king.7.a.tooltip:0 "$mod_origin_pirate_king_reward_gain$§R减半§!"
 origin_pirate_king.7.b:0 "就算没有旗舰，我们依然是海盗之王！"
 origin_pirate_king.7.c:0 "海盗船？我们还有的是呢！"
 
 PIRATE_KING_CHAIN_title:0 "From the Abyss"
 PIRATE_KING_CHAIN_desc:0 "An ancient ghost ship sailed out of the black hole horizon.\nAre they visitors from high dimensions, or messengers from the abyss?"
 
 origin_pirate_king.10.name:0 "From the Abyss"
 origin_pirate_king.10.desc:0 "When our ship entered §Y[pirate_king_black_hole_system.GetName]§!, the crew witnessed a shocking thing.\n\nThey saw a pirate fleet filled with the breath of death slowly sailing out of the black hole horizon of §Y[pirate_king_black_hole.GetName]§!. The crew were surprised by this ancient fleet that could escape from the black hole, and also feared the looming shadows on the fleet. Some speculated that this fleet was a visitor from high dimensions; some suspected that this fleet was a messenger from the abyss.\n\nBut in any case, this fleet has its own master and sent a communication signal to us."
 origin_pirate_king.10.a:0 "Let's see their true face."
 origin_pirate_king.10.b:0 "Stop playing tricks!"
 origin_pirate_king.11.name:0 "$origin_pirate_king.6.name$"
 origin_pirate_king.11.desc:0 "Humble ants, turn off your weapons, extinguish your engines, stop resisting acts.\nBecause we, the Abyss Fleet, will reconquer this sea of stars and become the Pirate King again!"
 origin_pirate_king.11.a:0 "Pirate King? Not our opponent."
 origin_pirate_king.11.b:0 "Pirate King? We are the Pirate King!"
 origin_pirate_king.12.name:0 "$origin_pirate_king.6.name$"
 origin_pirate_king.12.desc:0 "Stupid things, resisting us is a dead end, you will eventually become part of the abyss!"
 origin_pirate_king.12.a:0 "Wait, we have seen you!"
 origin_pirate_king.12.a.response:0 "Nonsense, how do you nameless rats deserve to know us? We spent a long time in the black hole. We know that the outside has changed a lot, but this has nothing to do with us. We can still easily conquer you lambs."
 origin_pirate_king.12.b:0 "You are the stupid ones, you will definitely be defeated by us."
 origin_pirate_king.12.b.response:0 "Don't brag, except for the gravity of the black hole, no one can defeat the powerful Abyss Fleet, no one!"
 origin_pirate_king.12.c:0 "We defeated you once, and can defeat you a second time!"
 origin_pirate_king.13.name:0 "Repel the Abyss"
 origin_pirate_king.13.desc:0 "After a hard battle, we finally destroyed that terrible Abyss Fleet. The wreckage of the ships floated quietly over the horizon of §Y[pirate_king_black_hole.GetName]§!, as if they had always existed there."
 origin_pirate_king.13.a:0 "I have a premonition that they will come back."
 origin_pirate_king.13.b:0 "We will beat them as many times as they come!"
 origin_pirate_king.13.c:0 "Something is wrong, search the ship wreckage."
 origin_pirate_king.14.name:0 "Peep into the Abyss"
 origin_pirate_king.14.desc:0 "The search is over. We found a pile of religious books written in ancient texts from the wreckage of the Abyss Fleet. Although they cannot be completely deciphered, various weird patterns in the books make us shudder, seemingly implying some evil conspiracy."
 origin_pirate_king.14.a:0 "This seems similar to the weird treasure we once found."
 
 origin_pirate_king.20.name:0 "Abyss Reappears"
 origin_pirate_king.20.desc:0 "After several months, the figure of the Abyss Fleet appeared again in the §Y[pirate_king_black_hole_system.GetName]§! system. Their ships sailed out of the horizon of §Y[pirate_king_black_hole.GetName]§! again, and sent out a broadcast signal again."
 origin_pirate_king.20.a:0 "Really lingering."
 origin_pirate_king.20.b:0 "What kind of monsters are they!"
 origin_pirate_king.21.name:0 "$origin_pirate_king.6.name$"
 origin_pirate_king.21.desc:0 "$origin_pirate_king.11.desc$"
 origin_pirate_king.21.a:0 "Who exactly are you?"
 origin_pirate_king.21.b:0 "I can't remember how many times I've seen you."
 origin_pirate_king.22.name:0 "$origin_pirate_king.6.name$"
 origin_pirate_king.22.desc:0 "We don't care about your doubts, you just need to know that what welcomes you is the abyss, is death!"
 origin_pirate_king.22.a:0 "Maybe defeating you will reveal the truth."
 origin_pirate_king.22.b:0 "I can't remember how many times I've defeated you."
 origin_pirate_king.24.name:0 "Gaze into the Abyss"
 origin_pirate_king.24.desc:0 "After a hard battle, we destroyed that terrible Abyss Fleet again. The wreckage of the ships floated quietly over the horizon of §Y[pirate_king_black_hole.GetName]§!, but they should not exist there."
 origin_pirate_king.24.a:0 "What secret is hidden in the abyss?"
 origin_pirate_king.25.a:0 "What kind of monsters are in the abyss?"
 origin_pirate_king.25.b:0 "Who exactly are they in the abyss?"
 origin_pirate_king.26.name:0 "Question the Abyss"
 origin_pirate_king.26.desc:0 "We searched the wreckage of the Abyss Fleet again and found a damaged treasure map. The treasure map drew coordinates of multiple systems, but those are not important, because a word \"§YRainbow Sea§!\" stunned us.\n\n\"§YRainbow Sea§!\" is the mysterious treasure hiding place that generations of pirates among our ancestors were obsessed with and yearned for. It is said to be full of endless wealth, power and strength. However, all pirates who tried to find \"§YRainbow Sea§!\" did not return, including the most famous Pirate King."
 origin_pirate_king.26.a:0 "The final destination of \"§YRainbow Sea§!\"-this black hole!"
 
 origin_pirate_king.30.name:0 "Abyss Cycle"
 origin_pirate_king.30.desc:0 "After several years, the figure of the Abyss Fleet appeared again in the §Y[pirate_king_black_hole_system.GetName]§! system. Their ships sailed out of the horizon of §Y[pirate_king_black_hole.GetName]§! again, and sent out a broadcast signal again.\n\nThis seems to have formed a cycle."
 origin_pirate_king.30.a:0 "Another cycle."
 origin_pirate_king.30.b:0 "What a troublesome cycle!"
 origin_pirate_king.31.name:0 "$origin_pirate_king.6.name$"
 origin_pirate_king.31.desc:0 "$origin_pirate_king.11.desc$"
 origin_pirate_king.31.a:0 "Wake up, you have fallen into a time loop!"
 origin_pirate_king.31.b:0 "Stop being stupid, you are trapped in a loop, idiots!"
 origin_pirate_king.32.name:0 "$origin_pirate_king.6.name$"
 origin_pirate_king.32.desc:0 "Loop... loop?\nYes, loop... yes, loop... we, are in a loop, in the endless abyss, infinitely looping, looping, looping...\nBut, no one, can escape the loop, just as light cannot escape gravity; no one, can escape the loop, just as shadow cannot escape the horizon...\nThis is the loop..."
 origin_pirate_king.32.a:0 "It's time to free you."
 origin_pirate_king.32.b:0 "Still rely on us to help you escape the loop."
 origin_pirate_king.32.a.response:0 "Please... end the loop...\n...Except for the gravity of the black hole, no one can defeat the powerful Abyss Fleet, no one!"
 origin_pirate_king.32.c:0 "\"§YRainbow Sea§!\" is a scam, let's expose this scam together!"
 origin_pirate_king.32.c.response:0 "\"§YRainbow Sea§!\"... scam... yes... scam... \"§YRainbow Sea§!\" is a scam!\nWe were deceived by the despicable §YNightmare of the Abyss§!!\n\nNo one can deceive the §HPirate King§!. If anyone dares to do so, the §HPirate King§! will tear them apart!\nBecause I, am the greatest §HPirate King§!!"
 origin_pirate_king.33.name:0 "Face the Abyss"
 origin_pirate_king.33.desc:0 "After a hard battle, we destroyed that terrible Abyss Fleet again. The wreckage of the ships floated quietly over the horizon of §Y[pirate_king_black_hole.GetName]§!. No matter what, they exist there."
 origin_pirate_king.33.a:0 "There must be a way to end the loop in the abyss."
 origin_pirate_king.33.b:0 "To end the loop, we have to face the abyss sooner or later!"
 origin_pirate_king.34.a:0 "No one can bully the §HPirate King§!, because we, are the greatest §HPirate King§!!"
 
 origin_pirate_king.40.name:0 "He Comes from the Abyss"
 origin_pirate_king.40.desc:0 "We tried to end the loop, so He appeared.\n\nHe is very selfish, He does not want His prey to escape the trap.\nHe is very greedy, He wants to capture more prey.\nHe is very cunning, He likes to use prey to attract prey.\n\nHe comes from the abyss, He is the abyss."
 origin_pirate_king.40.a:0 "You are the abyss, and we want to end the abyss!"
 origin_pirate_king.40.b:0 "You are not the abyss, we, are the abyss!"
 origin_pirate_king.41.name:0 "End the Abyss"
 origin_pirate_king.41.desc:0 "The god of the abyss has been terminated by us, the trap of the cycle has been cracked by us, and the secrets of the Inverse Phase are being revealed before us."
 origin_pirate_king.41.a:0 "There never was a god of the abyss."
 origin_pirate_king.41.b:0 "The god of the abyss is just a despicable beast."
 origin_pirate_king.42.name:0 "$origin_pirate_king.6.name$"
 origin_pirate_king.42.desc_a:0 "Thank you very much for saving us from the loop.\nWe are souls that do not belong to this world, we still have our own beyond.\nYou are the most respectable opponent, take care."
 origin_pirate_king.42.desc_b:0 "Thank you very much for saving us from the loop.\nWe are souls that do not belong to this world, we still have our own beyond.\nYou are the Pirate Kings worthy of the name, my children, farewell."
 origin_pirate_king.42.a:0 "Wish you find your favorite world."
 origin_pirate_king.42.b:0 "Wish you find the destination of your soul."
 origin_pirate_king.42.c:0 "You are also the best opponents."
 origin_pirate_king.42.d:0 "You are also the best warriors."
 origin_pirate_king.42.e:0 "May you successfully reach your beyond."
 origin_pirate_king.42.f:0 "May you successfully reach your pure land."
 origin_pirate_king.42.g:0 "Wish you smooth sailing."
 origin_pirate_king.42.h:0 "Hope the journey is calm."
 origin_pirate_king.42.i:0 "Farewell, Ghost Captain."
 origin_pirate_king.42.j:0 "Farewell, our ancestor. Farewell, former Pirate King."
 origin_pirate_king.43.name:0 "Mystery of the Abyss"
 origin_pirate_king.43.desc:0 "The mystery of the abyss has been understood by us.\n\nThis monster from the Inverse Phase calls itself the god of the abyss, but is actually just a hunter using the black hole as a cage. It uses the singularity to shuttle through various planes, capturing the same prey in different time periods, letting them be released one after another at the same time point, and using causality to make them encounter repeated experiences to achieve the scam of the loop.\n\nWe don't know the purpose of the monster doing this, nor do we know how long the loop lasted, but at least now, the abyss has ended and will not be there anymore."
 # 结局1
 origin_pirate_king.43.a:0 "Truly a mysterious and terrible creature."
 # 结局2
 origin_pirate_king.43.b:0 "Just a little trick of time."
 origin_pirate_king.44.name:0 "End of Abyss"
 origin_pirate_king.44.desc:0 "The god of the abyss has been terminated by §Y[From.GetName]§!, we may never solve the mystery of the abyss."
 origin_pirate_king.44.a:0 "We missed the opportunity."
 origin_pirate_king.44.b:0 "How dare someone snatch our trophy!"
 
 pirate_king_leader_catch_phrase:0 "Still willing to take in an outdated antique like me? In that case, I won't refuse."
 pirate_king_leader_backstory:0 "Our ancestor, the former Pirate King, was saved from the scam named \"§YRainbow Sea§!\"."
 
 origin_pirate_king.50.name:0 "$NAME_Pirate_King_Leader$"
 origin_pirate_king.50.desc:0 "Thank you very much for saving us from the loop.\nWe are souls that do not belong to this world, we still have our own beyond."
 origin_pirate_king.50.a:0 "What exactly did you experience in the loop?"
 origin_pirate_king.50.a.response:0 "We fell into an endless treasure hunt journey.\nDuring the period, we lost many partners, but they came back to us, just that we didn't know if they were still the original partners.\nAlthough the journey was full of dangers and ended up with nothing, we still numbly searched for unknown treasures, without reason."
 origin_pirate_king.50.b:0 "How did you fall into the black hole?"
 origin_pirate_king.50.b.response:0 "We found this treasure map from a black hole system, and were surprised to find that it indicated the coordinates of \"§YRainbow Sea§!\".\nTherefore, we arrived at this system according to the route on the treasure map, but the end of the path was this black hole. We once suspected whether the treasure map was wrong, but the yearning for \"§YRainbow Sea§!\" exceeded the fear of the black hole, so we plunged into the black hole and never came out."
 origin_pirate_king.50.c:0 "Do you have to leave?"
 origin_pirate_king.50.c.response:0 "Yes, after all, our era has passed, and the stage should be left to young people."
 origin_pirate_king.50.hire:0 "But you are still our ancestor, join us."
 origin_pirate_king.50.hire.tooltip:0 "§Y$NAME_Pirate_King_Leader$ will join us.§!"
 origin_pirate_king.50.dismiss:0 "Farewell, former Pirate King."
 origin_pirate_king.50.dismiss.tooltip:0 "§Y$NAME_Pirate_King_Leader$ will go to his beyond.§!"