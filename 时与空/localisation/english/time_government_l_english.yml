 policy_dimension_traveler:0 "['concept_policy_dimension_traveler']"
 policy_dimension_traveler_desc:0 "The Dimension Traveler peeped into the mystery of the Inverse Phase, and The Worm-in-Waiting gave her the mission of the loop.\n"
 horror_dimension_traveler_name:0 "$horror_dimension_traveler$"
 horror_dimension_traveler:0 "['concept_horror_dimension_traveler']"
 horror_dimension_traveler_desc:0 "Past and future intertwine, the Dimension Traveler will exert her full potential in the Inverse Plane.\n\n§EDimension Traveler Exclusive Trait Effect §G+25%§!, and she will unlock §GCausal Burst§!, but this will also bring her §RNegative Effects§!§!"
 horror_dimension_traveler_gestalt:0 "['concept_horror_dimension_traveler']"
 horror_dimension_traveler_gestalt_desc:0 "Past and future intertwine, the Dimension Traveler will exert her full potential in the Inverse Plane.\n\n§EDimension Traveler Exclusive Trait Effect §G+25%§!, but this will also bring her §RNegative Effects§!§!"
 normal_dimension_traveler_name:0 "$normal_dimension_traveler$"
 normal_dimension_traveler:0 "['concept_normal_dimension_traveler']"
 normal_dimension_traveler_desc:0 "The Dimension Traveler does not need to rely on the Inverse Plane; she can create a beautiful past and future by herself.\n\n§EThe Dimension Traveler will maintain §YNormal§! state§!"
 
 policy_beyond_infinity_seal:0 "$concept_dimensional_horror_crisis_seal$"
 policy_beyond_infinity_seal_desc:0 "With the help of another cycle, we mastered the method of Seal of the End, but maybe not all systems are worth our trouble.\n"
 beyond_infinity_seal_for_affected_name:0 "$beyond_infinity_seal_for_affected$"
 beyond_infinity_seal_for_affected:0 "Seal Affected Systems"
 beyond_infinity_seal_for_affected_desc:0 "We are not doing this to complete a task; any system is worth our defense.\n\n§EShips entering systems that are ['concept_dimensional_horror_crisis_storm_affected_yellow'] or ['concept_dimensional_horror_crisis_erasured_yellow'] will automatically gain the ['concept_dimensional_horror_crisis_seal_yellow'] project for that system§!"
 beyond_infinity_seal_for_erasured_name:0 "$beyond_infinity_seal_for_erasured$"
 beyond_infinity_seal_for_erasured:0 "Seal Erased Systems"
 beyond_infinity_seal_for_erasured_desc:0 "Affairs should be prioritized; temporary abandonment is for long-term peace.\n\n§EShips will only automatically gain the ['concept_dimensional_horror_crisis_seal_yellow'] project when entering systems that are ['concept_dimensional_horror_crisis_erasured_yellow']§!"
 
 #法令
 edict_defective_time_machine_edict:0 "Spacetime Restoration"
 edict_defective_time_machine_edict_desc:0 "§RWARNING:§!\nDue to Paradox code reasons, saving during Spacetime Chaos will result in the save file recording the wrong year (around -5000), even if Spacetime Chaos is turned off, and will cause a series of unpredictable bugs.\nTherefore, please enable the $edict_defective_time_machine_edict$ edict to turn off Spacetime Chaos before saving to avoid save data errors."
 defective_time_machine_edict_effect:0 "§YTurns off Spacetime Chaos mechanism; Spacetime Chaos mechanism will automatically restart after loading save§!"
 
 edict_akx_hear_the_truth_in_the_morning:0 "Hear the Truth in the Morning"
 edict_akx_hear_the_truth_in_the_morning_desc:0 "Hearing the Dao in the morning, one can die in the evening."
 edict_akx_die_at_night_after_truth:0 "Die at Night"
 edict_akx_die_at_night_after_truth_desc:0 "Hearing the Dao in the morning, what does death matter."
 edict_akx_live_without_regret:0 "Live without Regret"
 edict_akx_live_without_regret_desc:0 "Hearing the Dao in the morning, die without regret."
 edict_akx_shorten_r_time_cooldown:0 "End of Cycle"
 edict_akx_shorten_r_time_cooldown_desc:0 "The starting point of spacetime flow is the end point of spacetime stagnation."
 akx_shorten_r_time_cooldown_effect:0 "Activation time and cooldown time of Relic $r_time$ §Ghalved§!"
 improve_akx_dark_consortium_edict_effect:0 "§Y$edict_akx_hear_the_truth_in_the_morning$§! Edict effect §Genhanced§!\n§Y$edict_akx_die_at_night_after_truth$§! Edict effect §Genhanced§!\n§Y$edict_akx_live_without_regret$§! Edict effect §Genhanced§!"
 
 edict_origin_gas_colony_edict_volatile_motes:0 "Gaseous Layer Catalyst"
 edict_origin_gas_colony_edict_volatile_motes_desc:0 "Using $volatile_motes$ as a catalyst can speed up the reaction rate of the gaseous layer, improve conductivity efficiency, and also benefit our physics research."
 edict_origin_gas_colony_edict_rare_crystals:0 "Solid Core Nucleation"
 edict_origin_gas_colony_edict_rare_crystals_desc:0 "Using $rare_crystals$ as nucleation nuclei can speed up the condensation rate of the solid core, improve excavation efficiency, and also benefit our engineering research."
 edict_origin_gas_colony_edict_exotic_gases:0 "Liquid Domain Petri Dish"
 edict_origin_gas_colony_edict_exotic_gases_desc:0 "Using $exotic_gases$ as a petri dish can speed up the formation rate of the liquid domain, improve cultivation efficiency, and also benefit our society research."
 edict_origin_psionic_edict:0 "Shroud Rift Maintenance Operation"
