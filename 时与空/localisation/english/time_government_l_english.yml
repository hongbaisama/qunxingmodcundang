 gov_time_0:0 "§BChrono-Sequencer§!"
 gov_time_0_desc:0 "§BIs the Chrono-Sequencer a messenger dispatching fate, or a prisoner deep in the cycle?§!\n\n$EFFECTS_HEADER$\n§W$mod_country_physics_research_produces_mult$: §G+25%§!\n$mod_country_alloys_produces_mult$: §G+25%§!\n$exotic_gases$ Consumption: §R+10%§!§!"
 gov_time_1:0 "§BLight Chaser§!"
 gov_time_1_desc:0 "§BLight Chasers chase their sun, yet know not what sun and light are.§!\n\n$EFFECTS_HEADER$\n§W$mod_country_society_research_produces_mult$: §G+25%§!\n$mod_country_unity_produces_mult$: §G+25%§!\n$rare_crystals$ Consumption: §R+10%§!§!"
 gov_time_2:0 "§BShadow Banisher§!"
 gov_time_2_desc:0 "§BShadow Banishers drive the shadows of the world, yet cannot drive their own shadows.§!\n\n$EFFECTS_HEADER$\n§W$mod_country_engineering_research_produces_mult$: §G+25%§!\n$mod_country_energy_produces_mult$: §G+25%§!\n$volatile_motes$ Consumption: §R+10%§!§!"
 gov_time_3:0 "§BExcerptor§!"
 gov_time_3_desc:0 "§BCan the Excerptors born in the White Hole find their favorite Black Hole?§!\n\n$EFFECTS_HEADER$\n§W$mod_country_physics_research_produces_mult$: §G+15%§!\n$mod_country_society_research_produces_mult$: §G+15%§!\n$mod_country_engineering_research_produces_mult$: §G+15%§!\n$consumer_goods$ Consumption: §R+10%§!§!"
 gov_wonder_country_35:0 "§BCybrex§!"
 gov_wonder_country_35_desc:0 "This machine once committed the sin of exterminating the galaxy, but they have decided to turn over a new leaf...?"
