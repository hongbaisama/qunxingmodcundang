 #议程
 council_agenda_agenda_tradition_horror_name:0 "Light of Inverse Phase"
 council_agenda_agenda_tradition_horror_desc:0 "In the Inverse Phase, we caught a glimpse of a ray of light. If we can grasp it, perhaps we can learn the mystery of fate."
 agenda_tradition_horror_finish:0 "$council_agenda_agenda_tradition_horror_name$ Bloom"
 agenda_tradition_horror_finish_desc:0 "$council_agenda_agenda_tradition_horror_desc$"
 council_agenda_agenda_tradition_time_name:0 "Shadow of Spacetime"
 council_agenda_agenda_tradition_time_desc:0 "Under spacetime, we perceived a shadow. If we can see it clearly, perhaps we can comprehend the omen of fate."
 agenda_tradition_time_finish:0 "$council_agenda_agenda_tradition_time_name$ Spread"
 agenda_tradition_time_finish_desc:0 "$council_agenda_agenda_tradition_time_desc$"
 council_agenda_agenda_tradition_end_name:0 "Loop of the End"
 council_agenda_agenda_tradition_end_desc:0 "Fate is a loop. The inevitability of the End created our meaning, and our meaning forged the inevitability of the End."
 agenda_tradition_end_finish:0 "$council_agenda_agenda_tradition_end_name$ Reincarnation"
 agenda_tradition_end_finish_desc:0 "$council_agenda_agenda_tradition_end_desc$"
 council_agenda_agenda_tradition_hope_name:0 "Song of Hope"
 council_agenda_agenda_tradition_hope_desc:0 "Fate is a song. The possibility of hope strengthened our mission, and our mission endowed the possibility of hope."
 agenda_tradition_hope_finish:0 "$council_agenda_agenda_tradition_hope_name$ Eulogy"
 agenda_tradition_hope_finish_desc:0 "$council_agenda_agenda_tradition_hope_desc$"
 
 council_agenda_agenda_tradition_origin_time_name:0 "Dimensional Travel"
 council_agenda_agenda_tradition_origin_time_desc:0 "Traveling in dimensions is a new skill we mastered, and also our innate instinct."
 agenda_tradition_origin_time_finish:0 "$council_agenda_agenda_tradition_origin_time_name$$agenda_ref$"
 agenda_tradition_origin_time_finish_desc:0 "$council_agenda_agenda_tradition_origin_time_desc$"
 council_agenda_agenda_tradition_origin_reassembler_name:0 "Reassembly Optimization"
 council_agenda_agenda_tradition_origin_reassembler_desc:0 "Our technology for reassembly is not perfect, so we need to optimize it deeply."
 agenda_tradition_origin_reassembler_finish:0 "$council_agenda_agenda_tradition_origin_reassembler_name$$agenda_ref$"
 agenda_tradition_origin_reassembler_finish_desc:0 "$council_agenda_agenda_tradition_origin_reassembler_desc$"
 council_agenda_agenda_tradition_origin_tao_of_ninghe_name:0 "Path of Serenity"
 council_agenda_agenda_tradition_origin_tao_of_ninghe_desc:0 "Listen, this is the voice of nature; Look, this is the color of Yin and Yang; Smell, this is the breath of life; Comprehend, this is the meaning of Serenity."
