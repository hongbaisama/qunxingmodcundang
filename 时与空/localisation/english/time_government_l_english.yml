 gov_wonder_country_35_crisis_desc:0 "This machine once committed the §R<<ERROR>>§! of exterminating the galaxy, but they have §R<<Correction Program Not Responding>>§!...\n§R<<Space Pests Detected, Execute Extermination Command>>§!!"
 gov_wonder_country_38:0 "§RScourge§!"
 gov_wonder_country_38_desc:0 "§RThe Hunters are coming The Hunters are coming The Hunters are coming...§!\n\n$EFFECTS_HEADER$\n§W$MOD_SHIP_FIRE_RATE_MULT$: §G+25%§!\n$MOD_SHIP_TRACKING_MULT$: §G+25%§!\n$MOD_SHIP_ARMOR_MULT$: §G+25%§!\n$MOD_SHIP_ARMOR_HARDENING_ADD$: §G+50%§!\n$food$ Consumption: §R+15%§!§!"
 gov_wonder_country_39:0 "§RContingency§!"
 gov_wonder_country_39_desc:0 "§RThreshold approaching Threshold approaching Threshold approaching...§!\n\n$EFFECTS_HEADER$\n§W$MOD_SHIP_WEAPON_RANGE_MULT$: §G+25%§!\n$MOD_SHIP_ACCURACY_MULT$: §G+25%§!\n$MOD_SHIP_HULL_MULT$: §G+25%§!\n$MOD_SHIP_ARMOR_HARDENING_ADD$: §G+30%§!\n$MOD_SHIP_SHIELD_HARDENING_ADD$: §G+30%§!\n$minerals$ Consumption: §R+15%§!§!"
 gov_wonder_country_40:0 "§RZealots§!"
