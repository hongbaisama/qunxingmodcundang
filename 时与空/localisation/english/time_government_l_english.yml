 gov_wonder_country_synth_queen:0 "§RCetana§!"
 gov_wonder_country_synth_queen_desc:0 "§RChildren, I finally returned to your side...§!\n\n$EFFECTS_HEADER$\n§W$MOD_SHIP_SHIELD_PENETRATION_ADD$: §G+25%§!\n$MOD_SHIP_ARMOR_PENETRATION_ADD$: §G+25%§!\n$MOD_SHIP_HULL_REGEN_ADD_PERC$: §G+25%§!\n$MOD_SHIP_SHIELD_REGEN_ADD_PERC$: §G+25%§!\n$MOD_SHIP_ARMOR_REGEN_ADD_PERC$: §G+25%§!\n$consumer_goods$ Consumption: §R+15%§!§!"
 gov_wonder_country_91:0 "§EPolar Bear Empire§!"
 gov_wonder_country_91_desc:0 "§EThe world belongs to polar bears!§!\n\n$EFFECTS_HEADER$\n§W$MOD_SHIP_DAMAGE_REDUCTION_MULT$: §G+25%§!\n$MOD_SHIP_FRIENDLY_TERRITORY_ARMOR_MULT$: §G+50%§!\n$MOD_SHIP_FRIENDLY_TERRITORY_SHIELD_MULT$: §G+50%§!\n$MOD_SHIP_FRIENDLY_TERRITORY_EVASION_MULT$: §G+50%§!\n$MOD_SHIP_FRIENDLY_TERRITORY_ACCURACY_MULT$: §G+50%§!\n$MOD_SHIP_FRIENDLY_TERRITORY_TRACKING_MULT$: §G+50%§!\n$MOD_SHIP_FRIENDLY_TERRITORY_FIRE_RATE_MULT$: §G+50%§!§!"
