 agenda_tradition_origin_tao_of_ninghe_finish_desc:0 "$council_agenda_agenda_tradition_origin_tao_of_ninghe_desc$"
 council_agenda_agenda_tradition_origin_pure_brain_name:0 "Master Mind Formatting"
 council_agenda_agenda_tradition_origin_pure_brain_desc:0 "Drastic formatting of the Master Mind can timely clear hidden dangers, but important data will be properly kept, and order during the cleaning period must also be kept extremely stable."
