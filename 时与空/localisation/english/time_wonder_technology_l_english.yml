l_english:
 tech_time_wonder:0 "Civilization Epic"
 tech_time_wonder_desc:0 "In the long river of time in the universe, stars are born and extinguished, civilizations flourish and decline, endless, leaving only emptiness.\nWe are unwilling to be buried in the vast galaxy, we hope to leave our traces and write our epic."
 tech_time_wonder_custom:0 "§HUnlock Building:§! Civilization Wonder"
 tech_time_wonder_custom_desc:0 "Civilization Wonder symbolizes the history of a country and contains the spirit of a nation.\nOn the homeworld of a galactic civilization, we can build a Civilization Wonder to commemorate the past glory of a civilization."
 
 tech_wonder_akx_worm_1:0 "Entropy and Enthalpy"
 tech_wonder_akx_worm_1_desc:0 "Through the exploration of entropy and enthalpy, we will become part of the long river of time, forever."
