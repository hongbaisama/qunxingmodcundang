l_english:
 time_lifeline_categories:0 "Lifeline"
 time_lifeline_categories_desc:0 "We have received several mysterious messages from within the black hole's event horizon. Based on their rapid transmission frequency, we suspect these may be distress signals."
 
 TIME_LIFELINE_CHAIN_title:0 "Lifeline"
 TIME_LIFELINE_CHAIN_desc:0 "We received a distress signal from the black hole, but where is... the caller?"
 
 time_lifeline.name:0 "Lifeline"
 time_lifeline_need_short_time:0 "§GWe may receive another communication from the caller within a short time.§!"
 time_lifeline_need_some_time:0 "§YIt may take some time before we receive another communication from the caller.§!"
 time_lifeline_need_long_time:0 "§RWe may not be able to communicate with the caller for a very long time.§!"
 time_lifeline_need_unknown_time:0 "§MWe do not know how long it will be before we can communicate with the caller again.§!\n§RPerhaps tomorrow, perhaps forever.§!"
 
 to_be_continued:0 "§YTo be continued.§!"
 
 ################################################################
 # Phase 1
 ################################################################
 
 time_lifeline.1.desc:0 "After analysis and verification, we can confirm that this is indeed a distress signal from someone, and we can attempt to establish contact with the source."
 time_lifeline.1.a:0 "Communicate with the distress caller immediately."
 time_lifeline.1.b:0 "This has nothing to do with us. Ignore the signal."
 time_lifeline.2.desc:0 "Hello! Hey! Can you hear me?"
 time_lifeline.2.a:0 "I can, but there is no visual."
 time_lifeline.3.desc:0 "Sorry, my communication equipment has been severely damaged. Thank heavens I can even send a transmission...\n\nIt's an emergency, I need your help!"
 time_lifeline.3.a:0 "You are trapped in a black hole; we are powerless to help."
 time_lifeline.3.b:0 "We will not provide assistance to scum."
 time_lifeline.3.b.response:0 "Wait, what do you mean by scu-\n\n§R<Connection terminated.>§!"
 time_lifeline.4.desc:0 "Black hole? What are you talking about? There's no time for jokes!\n\nMy ship crashed on this planet. I got off to look for supplies, but I ran into a group of terrifying monsters!\nThese black monsters move slowly, like thick slime, yet their speed is like flying. I don't know if I should call them fast or slow.\nThe moment they saw me, they rushed towards me. No matter how I ran, I couldn't shake them off.\n\nJust when I was cornered, they suddenly stopped moving. I really don't understand the situation."
 time_lifeline.4.a:0 "We seem to have no knowledge of such monsters either."
 time_lifeline.5.desc:0 "Although they are standing in front of me like statues, I don't know when they might suddenly attack me.\nSo, please save me. I don't even dare to breathe right now."
 time_lifeline.5.a:0 "Regrettably, we cannot help either."
 time_lifeline.6.desc:0 "Eh? But you just need to send a ship in. My communication device should be able to send coordinates to you...\n\nBut I can't blame you for not wanting to help.\nHow about this? You tell me, should I run for it now, or use something else to test them?"
 time_lifeline.6.a:0 "Run now, don't miss the chance."
 time_lifeline.6.b:0 "Acting rashly is dangerous. Test them first."
 time_lifeline.6.c:0 "We will not offer you any help. Closing communication."
 time_lifeline.6.c.response:0 "Hey, wait, you can't...\n\n§R<Connection terminated.>§!"
 time_lifeline.7.desc:0 "Okay, I'll try... Whoa! They suddenly came alive! Don't come near me!"
 time_lifeline.7.a:0 "What happened? Please respond!"
 time_lifeline.8.desc:0 "Phew- I'm still alive, and I've discovered their pattern...\n\nWhen I stay still, they freeze; only when I start moving do they return to normal. What a weird bunch of monsters.\nBut even knowing this, I can't escape, because once I start running, they'll catch me very quickly!\nI can only sit and wait for death now, but fortunately, as long as I don't move my position, even large movements won't activate them. At least I can breathe freely now.\n\nI think I might be done for. Although you couldn't lend a hand, I thank you for helping me make the decision. Goodbye. If I manage to escape alive, I hope to contact you then-of course, that's an 'if'..."
 time_lifeline.8.a:0 "Very well, I look forward to your contact."
 time_lifeline.8.b:0 "That depends on you escaping first. Don't die."
 
 ################################################################
 # Phase 2
 ################################################################
 
 time_lifeline.10.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller was besieged by monsters. Although the pattern was discovered, escape was impossible.>§!"
 time_lifeline.10.a:0 "You again. You're still alive?"
 time_lifeline.11.desc:0 "Yes, that was close. I thought no one would come to save me, so I dismantled the communication device and tried to use the parts to repair my Casting Unit-or to put it simply, my flight device.\n\nAlthough the parts didn't match perfectly, after some time, I managed to make the flight device barely usable.\nSo, *whoosh*, I flew out of their encirclement faster than the monsters!\nBut just as I flew back to the ship, the flight device broke again. I'm afraid it won't be fixed anytime soon.\n\nHowever, the ship still has some food reserves and a backup communicator. After resting, I immediately used it to contact you.\nOf course, since it's a backup, it has absolutely no video transmission function."
 time_lifeline.11.a:0 "What do you plan to do next?"
 time_lifeline.12.desc:0 "Look for useful materials to repair the ship, of course. The damage isn't too severe; common materials should be enough to fix it. I'm sure I can find what I need on this planet.\n\nI've observed the surroundings, and there seem to be no signs of monsters near the ship.\nTo the north is a towering mountain peak, to the west is a huge lake, to the east is a vast desert, and to the south is a dense forest.\nI flew back from the south, so those monsters might still be in there. I don't want to face them again.\n\nYou decide. Where should I go explore?"
 time_lifeline.12.a:0 "The mountain peak should have exposed rich mineral deposits."
 time_lifeline.12.a.response:0 "You make a valid point. I hope I gain something this time."
 time_lifeline.12.b:0 "Go to the lake. You might encounter a local civilization."
 time_lifeline.12.b.response:0 "What a great idea. I hope to meet friendly natives."
 time_lifeline.12.c:0 "Though it might not be a good idea, why not try your luck in the desert?"
 time_lifeline.12.c.response:0 "Indeed, I was surprised when I heard this answer. But risks come with opportunities. I'm setting off!"
 
 ################################################################
 # Phase 2 (Mountain)
 ################################################################
 
 time_lifeline.100.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller went to the mountain to find usable materials.>§!"
 time_lifeline.100.a:0 "Okay, have you reached the destination?"
 time_lifeline.101.desc:0 "Yes, despite some obstacles along the way, I arrived safely.\n\nI am now at the foot of the mountain, ready to climb.\nI can see a large, flourishing forest halfway up the mountain, a steep ridge with exposed rocks, and pure white snow above the snowline.\nA large dark cloud in the distance seems to be approaching, but I'm not sure if it will come here. I hope not.\n\nWhat should I do now?"
 time_lifeline.101.a:0 "Check the forest on the mountain first."
 time_lifeline.101.a.response:0 "I feel like it's just an ordinary forest...\nWhatever, I'll go take a look first."
 time_lifeline.101.b:0 "It is more likely to find what you need among the exposed rocks."
 time_lifeline.101.b.response:0 "Hmm, I thought so too. I'm heading out."
 time_lifeline.101.c:0 "Explore around the foot of the mountain first. Meeting rain on the mountain would be dangerous."
 time_lifeline.101.c.response:0 "You are right. That is indeed a prudent method."
 
 time_lifeline.110.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller went to the forest halfway up the mountain to find usable materials.>§!"
 time_lifeline.110.a:0 "Okay, what is the situation?"
 time_lifeline.111.desc:0 "The situation... is not good.\n\nThat dark cloud is getting closer, and it has started pouring.\nNot only that, but I also saw that it's raining black rain!\nThe rain is heavy. I can no longer see the scene at the foot of the mountain clearly. It's like being shrouded in a hazy mist, as if everything below has been completely submerged in a black ocean.\n\nI have a bad feeling. My intuition tells me I should run to the top of the mountain immediately."
 time_lifeline.111.a:0 "Trust your intuition. Find a way up the mountain."
 time_lifeline.111.a.response:0 "Okay, my intuition is very accurate. I'll contact you when I reach the summit."
 time_lifeline.111.b:0 "Nothing to be afraid of. Find a place nearby to take shelter from the rain."
 time_lifeline.111.b.response:0 "Is this really okay?\nAlright, I believe you. It's just rain, nothing to be afraid of.\n\nI'll contact you when the rain stops."
 
 time_lifeline.120.desc:0 "$time_lifeline.110.desc$\n\n§E<Historical Record: The distress caller went to the ridge with exposed rocks to find usable materials.>§!"
 time_lifeline.120.a:0 "$time_lifeline.110.a$"
 time_lifeline.121.desc:0 "$time_lifeline.111.desc$ But it seems a bit too steep here. I'm worried about whether I can climb up."
 time_lifeline.121.a:0 "It's the only choice. Take safety precautions."
 time_lifeline.121.a.response:0 "Okay, I'll find a way to climb up. I'll contact you when I reach the summit."
 time_lifeline.121.b:0 "$time_lifeline.111.b$"
 time_lifeline.121.b.response:0 "$time_lifeline.111.b.response$"
 
 time_lifeline.130.desc:0 "$time_lifeline.110.desc$\n\n§E<Historical Record: The distress caller looked for usable materials near the foot of the mountain.>§!"
 time_lifeline.130.a:0 "$time_lifeline.110.a$"
 time_lifeline.131.desc:0 "The situation... is not good.\n\nThat dark cloud is getting closer, and it has started pouring.\nNot only that, but I also saw that it's raining black rain!\nMy intuition tells me this rain is very dangerous, so I immediately found a path to run up the mountain.\nThe rain is heavy. I can no longer see the scene at the foot of the mountain clearly. It's like being shrouded in a hazy mist, as if everything below has been completely submerged in a black ocean.\n\nI'm certain this rain is really dangerous, and this dark cloud is chasing me! I know I have to go towards the summit, but I rushed up and now I'm a bit lost..."
 time_lifeline.131.a:0 "Believe in yourself. You can turn danger into safety."
 time_lifeline.131.a.response:0 "Okay, now is not the time to be discouraged. I'll contact you when I reach the summit."
 
 time_lifeline.140.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: To escape the dangerous dark cloud and black rain, the distress caller headed for the summit.>§!"
 time_lifeline.140.a:0 "Have you reached the summit?"
 time_lifeline.141.desc.1:0 "I successfully found the way up and have arrived safely at the summit.\nBut the dark cloud is closer to me, and the rain shows no sign of weakening; instead, it's gradually increasing.\nI'm certain the place I was originally at has been submerged by the black rain.$time_lifeline.141.desc.same$"
 time_lifeline.141.desc.2:0 "I tried to find a rock face that was easy to climb, but it was unexpectedly steep, and I almost fell.\nBut the dark cloud behind me was relentless, and the rain was intensifying. I had to endure the pain and continue climbing, finally reaching the summit.$time_lifeline.141.desc.same$"
 time_lifeline.141.desc.3:0 "I managed to find a suitable climbing route, but it was bumpy and full of pitfalls.\nBut I had no time to find another way. The sound of rain seemed to be right by my ear. In my panic, I fell several times and had to get up and continue running up the mountain, finally reaching the peak.$time_lifeline.141.desc.same$"
 time_lifeline.141.desc.same:0 "\n\nThere is a building on the summit that looks like an altar, but it is very dilapidated, as if no one has visited for a long time.\nAlthough it looks a bit eerie, at least it has a roof. I intend to enter the altar to take shelter from the rain.\n\nThis altar seems to be built with a kind of white fluorescent stone, because I can see it glowing in the dim light.\nA white altar standing on a white snowcap-I don't know if it's to complement nature, to blend in for camouflage, or simply because white represents holiness...\nI can't figure it out, so I'll ignore it.\n\nWalking into the altar, the surrounding walls seem to be painted with icons of different sizes but similar shapes.\nLet me see-it looks like a snake biting its own tail, its body coiled into a circle."
 time_lifeline.141.a:0 "This should be called \"§HOuroboros§!\"."
 time_lifeline.142.desc:0 "Huh? How strange. There's actually a giant machine in the middle of the altar.\nA high-tech style machine occupying the core space of a primitive religious altar feels really incongruous.\n\nThis machine is unexpectedly clean. The surface is spotless, as if someone maintained it not long ago.\nHowever, the machine also has the \"§HOuroboros§!\" pattern. Perhaps this machine is a sacred object of worship.\n\nWhat do you think this machine is used for?\nHere, take a closer look-oh, I forgot, this backup communicator cannot transmit images."
 time_lifeline.142.a:0 "This should be a machine used to analyze the mountain's mineral deposits."
 time_lifeline.142.b:0 "Obviously, this is a ritual vessel for worshipping \"§HOuroboros§!\"."
 time_lifeline.142.c:0 "It must be a monument to commemorate distinguished military exploits!"
 time_lifeline.142.d:0 "Based on database speculation: Calculating Pi?"
 time_lifeline.142.e:0 "I can't guess, since I haven't seen the full picture."
 time_lifeline.143.desc:0 "Damn, the dark cloud has arrived above the altar. I can hear the rain beating on the roof!\n\nI feel the roof is melting, and the entire altar is crumbling. Perhaps choosing to come to this mountain was a mistake. I have nowhere to run...\nNo, if I hadn't come up the mountain, I might have been submerged by the rain long ago.\nAh, there's no use dwelling on this. I have to give it a shot.\n\nI'm going to crawl into this machine and try to start it. Maybe it's a personal spacecraft?\nEven if it doesn't start, at least the alloy shell can withstand... §R<Static>§!... Eh... §R<Static>§!...\n\nThe inside of this machine seems to block signals. I need to get in and start the machine quickly. I'll close the communication first.\nThank you for your guidance. Without you, I certainly couldn't have done all this.\nIf I survive, I will contact you again... §R<Static>§!..."
 time_lifeline.143.a:0 "Good... bye."
 time_lifeline.143.a.response:0 "...§R<Static>§!..."
 
 time_lifeline.150.desc:0 "We haven't received any communication from the original distress caller for a long time. The other party may have met with an accident.\n\nPerhaps there was something strange about that rain, or perhaps she chose to go up the mountain and had an accident, or perhaps...\n\nThere are no perhaps. Time has no retreat; facts are established."
 time_lifeline.150.a:0 "$time_lifeline.300.a$"
 time_lifeline.150.b:0 "$time_lifeline.300.b$"
 time_lifeline.150.c:0 "If she had listened, no accident would have happened."
 time_lifeline.150.d:0 "$time_lifeline.300.d$"
 time_lifeline.150.e:0 "$time_lifeline.300.e$"
 
 ################################################################
 # Phase 2 (Lake)
 ################################################################
 
 time_lifeline.200.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller went to the lake to find usable materials.>§!"
 time_lifeline.200.a:0 "$time_lifeline.100.a$"
 time_lifeline.201.desc:0 "Yes, the journey was very smooth, and I arrived at the destination safely, only this lake is farther than I estimated.\n\nI just arrived at the lakeside. The water is very clear, reflecting the surrounding scenery. It feels beautiful.\nHuh? There seems to be something in the lake. Let me see, does that look like a ship?\nBut it's too far away. I can't see clearly, and I can't be sure.\n\nThat object is motionless. If it is a ship, maybe someone moored it in the center of the lake on purpose?"
 time_lifeline.201.a:0 "Might as well take a look."
 time_lifeline.202.desc:0 "But my flight device is broken, and I have no other way to get close to that ship. I can't swim there, can I?\n\nThere are only some low shrubs around the lake, and further away are a few sparse, half-withered trees.\nAh, that looks like a house. It seems to be made of stone, almost identical to the real rocks around it. I almost missed it.\n\nI wonder if any local life lives in it. I'll go take a look."
 time_lifeline.202.a:0 "I wonder if they are friend or foe."
 time_lifeline.202.a.response:0 "Thinking so much is useless. I have to see the truth for myself.\n\nSee you in a bit."
 
 time_lifeline.210.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller went to the stone house, hoping to encounter local civilization.>§!"
 time_lifeline.210.a:0 "Okay, did you see any natives?"
 time_lifeline.211.desc:0 "Didn't see any. I didn't detect any signs of intelligent life either.\n\nThe stone house is empty, but there is some simple furniture, such as a stone table, stone chairs, a stone bed, and a fireplace built of stone.\nThis furniture is covered in dust. It looks like no one has lived here for a long time.\n\nThe weather seems to have suddenly turned cold. There shouldn't be anything particularly noteworthy in this house either. I'd better go out."
 time_lifeline.211.a:0 "Since it's cold, why not light the fireplace to warm up?"
 time_lifeline.211.b:0 "Go out and look. Maybe something happened."
 time_lifeline.212.desc:0 "Okay, I'll tr... §R<Static>§!... \n\n...§R<Static>§!... seems I can't light... §R<Static>§!... Hello? ...§R<Static>§!...\n\n...§R<Static>§!..."
 time_lifeline.212.a:0 "What happened? Can you hear me?"
 time_lifeline.212.a.response:0 "...seems... §R<Static>§!...\n\n...§R<Static>§!... contact later... §R<Static>§!..."
 time_lifeline.213.desc:0 "Okay, I'm going out... §R<Static>§!...\n\n...§R<Static>§!... it's so cold outside... §R<Static>§!... Hello? ...§R<Static>§!...\n\n...§R<Static>§!..."
 time_lifeline.213.a:0 "$time_lifeline.212.a$"
 time_lifeline.213.a.response:0 "$time_lifeline.212.a.response$"
 
 time_lifeline.220.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller found nothing in the stone house, but communication suddenly suffered strong interference.>§!"
 time_lifeline.220.a:0 "What happened before?"
 time_lifeline.221.desc.1:0 "It seems like it suddenly hailed, but it stopped abruptly after a while.\nThe temperature after the storm is still very low, but this stone house seems to have some insulation. It doesn't feel too bad.\n\nI observed for a while, and there seems to be no sign of another hail storm. It should be safe outside, so I plan to go out and take a look."
 time_lifeline.221.desc.2:0 "It suddenly hailed from the sky. I was hit by hail before I could react!\nReally, it's too cold. I feel terrible. Although I fled back to the stone house immediately, it's still so cold, so painful...\n\nI applied emergency bandages. I feel a bit better, but I can't stay here forever, so I plan to go out and take a look."
 time_lifeline.221.a:0 "Move carefully. Return to the stone house immediately if any accident occurs."
 time_lifeline.221.b:0 "You are still injured. Rest on the stone bed for a while first."
 time_lifeline.221.b.response:0 "Actually, I hoped to do that too. Since you mentioned it, I'll rest for a while. I'll contact you when I wake up."
 time_lifeline.222.desc:0 "No problem.\n\nAh, the lake has frozen!\nNo wonder, after such a big hail storm and the cold weather.\nBut this way, even without a flight device, I can go check out that ship in the center of the lake.\n\nIs that really a ship, or something else?\nIf it is a ship, why is it moored in the center of the lake?\nWill there be people on the ship, and will there be the materials I need?"
 time_lifeline.222.a:0 "You'll have to confirm that yourself."
 time_lifeline.222.a.response:0 "Mm, if I find anything, I'll contact you immediately."
 time_lifeline.222.b:0 "The ice surface is dangerous. Better explore nearby first."
 time_lifeline.222.b.response:0 "Indeed, I was too rash... If I find anything, I'll contact you immediately."
 
 time_lifeline.230.desc:0 "...Help... §R<Static>§!...\n\n...Black rain... §R<Static>§!... submerged... §R<Static>§!..."
 time_lifeline.230.a:0 "Hello? Hello!"
 time_lifeline.231.desc:0 "...§R<Static>§!..."
 time_lifeline.231.a:0 "..."
 time_lifeline.231.a.response:0 "...§R<Static>§!..."
 time_lifeline.232.desc:0 "We haven't received any communication from the original distress caller for a long time. The other party may have met with an accident.\n\nWe only know that the other party sent a distress call in their final moments, but we were powerless. Perhaps...\n\nThere are no perhaps. Time has no retreat; facts are established."
 time_lifeline.232.a:0 "$time_lifeline.300.a$"
 time_lifeline.232.b:0 "$time_lifeline.300.b$"
 time_lifeline.232.c:0 "She seems to have been submerged by something, but the answer will remain unknown."
 time_lifeline.232.d:0 "$time_lifeline.300.d$"
 time_lifeline.232.e:0 "$time_lifeline.300.e$"
 
 time_lifeline.240.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The lake froze, and the distress caller went to check the ship in the center of the lake.>§!"
 time_lifeline.240.a:0 "I can hear you. Was the journey smooth?"
 time_lifeline.241.desc:0 "I thought something would happen, but in fact, it was unexpectedly smooth.\n\nThe ice is very solid. I'm sure it's not because I'm light, because that ship is standing firmly on the ice.\nThis is indeed a ship, just a bit dilapidated and not very large, though still much bigger than the spaceship I pilot.\n\nThere seems to be no one on this ship. No one answered no matter how I shouted.\nSo, I used the rope ladder at the stern to board the deck. Let me see what's on the ship."
 time_lifeline.241.a:0 "An unmanned derelict ship is a common location for horror movies."
 time_lifeline.242.desc:0 "Whoa, don't scare me!\n\nThe deck is messy, piled with crooked wooden boxes, but they are all empty.\nThe mast seems to have been broken by the wind, falling heavily onto the deck and smashing the helm to pieces. Fortunately, no one was underneath.\n\nThere is a staircase leading to the cabin here. Maybe there's something good inside."
 time_lifeline.242.a:0 "I advise you not to get your hopes up."
 time_lifeline.243.desc:0 "The cabin seems even bigger than I imagined. Just walking on the stairs produced quite an echo.\n\nI should be in the central hall of the cabin now. Along the hull are two bottomless corridors. I guess they point to the bow and stern respectively.\nOn both sides of the corridor are countless small rooms, probably the crew's quarters.\nThe wooden tables and chairs in the hall are organized. Maybe this is used as a dining room.\n\nThere are also several doors around the dining room, perhaps the kitchen and storage room.\nMy intuition tells me the materials I need are inside."
 time_lifeline.243.a:0 "It better be because of your intuition, not your stomach."
 time_lifeline.244.desc:0 "Oof! The hull suddenly shook violently. What happened?\n\nI can faintly hear the sound of pattering rain. Is it raining?\nThe door to the deck closed at some point, and it won't open. I don't know what the situation outside is.\nThe hull is still shaking violently. I heard the sound of something tearing. It doesn't feel good.\n\nBad news, this ship seems to be sinking. Did the ice crack?\nWorse, the cabin is leaking. More and more water is pouring into the hall.\nAlthough it is flowing towards the bow, I'm afraid it won't be long before the entire ship is submerged!\n\nThe door is stuck fast to the wall. No matter how I bang on it, it won't open. What should I... §R<Static>§!..."
 time_lifeline.244.a:0 "Are there any tools available nearby? Hello?"
 time_lifeline.244.a.response:0 "§R<Connection terminated.>§!"
 
 ################################################################
 # Phase 2 (Desert)
 ################################################################
 
 time_lifeline.300.desc:0 "We haven't received any communication from the original distress caller for a long time. The other party may have met with an accident.\n\nPerhaps choosing the desert as a destination was a wrong decision, or perhaps the other party's luck was too bad and they were destined to die there, or perhaps...\n\nThere are no perhaps. Time has no retreat; facts are established."
 time_lifeline.300.a:0 "If we could go back to the beginning, could we have saved her?"
 time_lifeline.300.b:0 "We have no obligation to be responsible for the deaths of others."
 time_lifeline.300.c:0 "Tragedy is destined to happen; we are powerless."
 time_lifeline.300.d:0 "Another vibrant life extinguished."
 time_lifeline.300.e:0 "Regrettable."
 
 ################################################################
 # Phase 3 (Time Machine)
 ################################################################
 
 time_lifeline.400.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: To escape the dangerous black rain, the distress caller had to activate the machine in the altar.>§!"
 time_lifeline.400.a:0 "Finally received your message. How is the situation?"
 time_lifeline.401.desc:0 "The situation is neither good nor bad.\n\nInside this machine are some precise instruments and consoles, with a dazzling array of indicator lights and buttons.\nI don't know how to operate this machine, but I didn't have time to analyze the functions of each button and lever one by one, so I pressed the one I thought looked most like a start button, and the machine really started.\n\nThe machine suddenly started spinning, faster and faster. I felt the world spinning, my whole body felt like it was flying, floating lightly in mid-air.\nI seemed to have lost gravity, because I couldn't feel gravity's existence;\nI seemed to have lost myself, because I couldn't feel my own existence.\n\nI don't know when I passed out. When I woke up, the machine had stopped working."
 time_lifeline.401.a:0 "What about outside the machine?"
 time_lifeline.402.desc.pass:0 "I can't be sure, but it should be safe.\n\nOutside the machine is still the white altar from before, with no signs of damage at all, even tidier than I remembered.\nOutside the altar, the sky is clear, and the snow is laid out flat on the ground without a ripple, as if nothing had happened.\n\nThinking about it now is a bit laughable. Why did I think that rain was dangerous? Maybe it was just ordinary rain.\nAnd I ran around trying to escape that rain. Truly ridiculous."
 time_lifeline.402.desc.future:0 "I can't be sure, but it should be safe.\n\nWhen I just walked out of the machine, I was surprised. There is absolutely no trace of the altar now. Perhaps it was completely destroyed in that black rain.\nThe white snow from before has also disappeared, replaced by green grass.\n\nDid that rain really have such power?\nIf this is the scene after the rain, I have a feeling something is wrong, but I can't think of any other reasonable explanation."
 time_lifeline.402.a:0 "What is done cannot be undone. We should face the future."
 time_lifeline.402.b:0 "Dwelling on the past is meaningless. Think about what to do next."
 time_lifeline.403.desc:0 "You reminded me. What has happened is a fact. Thinking about this won't help my current situation.\n\nThis machine might not be useful for the time being, so I plan to return to the ship to restock supplies first.\nAlthough this expedition yielded nothing, with you by my side, I believe I can definitely get out of this predicament."
 time_lifeline.403.a:0 "I look forward to that day."
 time_lifeline.403.a.response:0 "Mm, I look forward to that day too.\n\nI'll contact you when I get to the ship. See you in a bit."
 
 time_lifeline.410.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller was encouraged and prepared to return to the ship.>§!"
 time_lifeline.410.a:0 "Have you returned to the ship?"
 time_lifeline.411.desc.same:0 "Should I say I have returned, or should I say I haven't?\n\nI'm sure I didn't remember the wrong place, but when I arrived at the crash site, it was gone!\nThe ship is gone...\n\n"
 time_lifeline.411.desc.pass:0 "$time_lifeline.411.desc.same$The ground is very flat, not even a trace of impact left, as if the ship never existed.\nI suspected for a moment that I remembered the location wrong, so I searched carefully around again, but still no trace of the ship.\n\nAlthough tired and hungry, if I can't find the ship, I can't resupply.\nWhat... should I do?"
 time_lifeline.411.desc.future:0 "$time_lifeline.411.desc.same$But only the ship is gone. The impact crater on the ground is still intact, just overgrown with vegetation.\nI am certain the ship should be here, so I searched carefully around again, but still no trace of the ship.\n\nAlthough tired and hungry, if I can't find the ship, I can't resupply.\nWhat... should I do?"
 time_lifeline.411.a:0 "Maybe it was carried away by local creatures."
 time_lifeline.412.desc:0 "That is indeed a possibility, but I don't even know if local creatures exist.\n\nRight, I can go check the lake to the west. If a civilization really exists on this planet, the possibility of finding signs of civilization by the water is the highest!"
 time_lifeline.412.a:0 "Correct, that is a sound judgment."
 time_lifeline.412.a.response:0 "Hehe, after all, I have visited several different planets too."
 
 ################################################################
 # Phase 3 (Time Machine - Past)
 ################################################################
 
 time_lifeline.420.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller found the ship missing and prepared to go to the lake to find signs of civilization.>§!"
 time_lifeline.420.a:0 "Did you find a civilization?"
 time_lifeline.421.desc:0 "I have bad news, and even worse news.\n\nThe bad news is:\nI found a stone house by the lake, but it has been abandoned for a long time.\nThere are absolutely no signs of civilization surviving here, nor any trace of the ship.\n\nThe worse news is:\nA large dark cloud is drifting towards me! That dark cloud is very similar to the previous one, but not exactly the same.\nThe previous dark cloud rained black rain, while the current one is thundering with lightning, striking the trees below from time to time."
 time_lifeline.421.a:0 "Is there anywhere to hide?"
 time_lifeline.422.desc:0 "It's too far from the mountain peak; I definitely won't make it in time.\nThere is a seemingly abandoned wooden ship moored by the lake. The long mast easily attracts lightning, so hiding on the ship is probably not a good choice.\n\nNow, my only retreat is the stone house I just found. I hope I can survive the thunderstorm safely inside."
 time_lifeline.422.a:0 "Perhaps you can use that ship-that mast."
 time_lifeline.422.b:0 "Hurry and hide in the stone house. Prepare in advance."
 time_lifeline.423.desc:0 "Use the mast? I understand. Let the mast attract the lightning strike, while I hide in the safe stone house. What a great idea.\n\nWood alone might not be effective at attracting lightning. I can modify the mast with the metal decorations on my clothes.\nThen try pushing the wooden ship to drift towards the center of the lake. Maybe it can draw the thunderstorm away.\n\nBut the dark cloud is not far. I hope I can finish the preparations in time."
 time_lifeline.423.a:0 "If you can't make it, retreat to the stone house immediately."
 time_lifeline.423.a.response:0 "Don't worry, I have a good grasp of time!"
 time_lifeline.424.desc:0 "Indeed, the dark cloud is not far. If I want to make preparations, I must do it now.\n\nI plan to find some supports to pile up in the stone house. After all, this stone house doesn't look strong enough. If it really gets struck by lightning, they should be able to prop up a safe space for me.\n\nOf course, it would be best if it doesn't get struck by lightning, but it's always good to be prepared."
 time_lifeline.424.a:0 "You must protect yourself."
 time_lifeline.424.a.response:0 "I will. I will definitely persist until the next contact with you."
 
 time_lifeline.430.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller encountered a thunderstorm and planned to use the mast as a lightning rod.>§!"
 time_lifeline.430.a:0 "Has the thunderstorm passed?"
 time_lifeline.431.desc:0 "I have good news, and even better news.\n\nThe good news is:\nThe dark cloud has gone away following the wooden ship. The stone house I was in was not struck by lightning at all. I am very safe now!\n\nThe better news is:\nI already know what happened, and the reason for the ship's disappearance!"
 time_lifeline.431.a:0 "What did you learn?"
 time_lifeline.432.desc:0 "When I was preparing to modify the mast, I found a communicator modified into a voice recorder on the deck.\nI quickly turned on the recorder and found it written in characters familiar to me: \"§HThis is not the future, but the past! Use the time machine to return to the future!§!\"\n\nEverything makes sense now. The machine I crawled into to escape the rain earlier was actually a §HSpacetime Shuttle§!.\nThe altar was unharmed not because it survived the black rain, but because it hadn't suffered the black rain's erosion at all.\nThe missing ship, the unscathed ground-these are the best proofs.\n\nBecause at this time, my ship hasn't crash-landed on this planet yet!"
 time_lifeline.432.a:0 "Why are you so certain? What if it's a trap?"
 time_lifeline.433.desc:0 "I can feel the traces of time from the recorder.\nAnd when I was in the machine at the altar before, I had a subtle but similar feeling, but I was worried I was just mistaken.\n\nActually, I am a §HTime Traveler§!.\nThe main function of my flight device is actually to perform §HSpacetime Travel§!, but travel is not easily achieved, not to mention my flight device is broken.\nPrecisely because of my past experiences, I understand-no, I believe-that this message was sent to me by myself from a different timeline.\nAlthough I don't know why she didn't tell me in person, there must be some reason.\n\nI trust myself, whether it's the past self or the future self-just like I trust you."
 time_lifeline.433.a:0 "That... is truly unexpected."
 time_lifeline.434.desc:0 "I know, this kind of thing is hard to convince people of, so I didn't explain it at first.\n\nBut now, I should know what to do.\nI'm preparing to go to the mountain peak to investigate the §HTime Machine§! carefully and return to my original timeline. Of course, I have to delay a bit to avoid the black rain.\n\nThings after that can wait until later."
 time_lifeline.434.a:0 "Contact me after the investigation. Maybe I can provide help."
 time_lifeline.434.a.response:0 "That would be much appreciated!"
 
 time_lifeline.440.desc.1:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller encountered a thunderstorm and planned to stay in the stone house for shelter.>§!"
 time_lifeline.440.desc.2:0 "Can... Can you hear me?\n\n§E<Historical Record: The distress caller encountered a thunderstorm and planned to stay in the stone house for shelter.>§!"
 time_lifeline.440.a:0 "Has the thunderstorm passed?"
 time_lifeline.440.b:0 "You don't sound very good."
 time_lifeline.441.desc.1:0 "The thunderstorm should have passed, but I'm trapped under rocks...\n\nMy luck is bad. My stone house was hit by lightning anyway. The supports didn't hold out for long, and I was buried.\n\nI'm cold and tired, and the air is getting thinner, making it hard to breathe. I know I must do something.\n\nNng-hey!\nThere's one more piece above, hey!\nAgain, I can do this!\nWhy is there more?\nBut I see light. Hope is right in front of me. It should be the last piece, hey!\n\nPhew~ Finally escaped..."
 time_lifeline.441.desc.2:0 "I... am trapped under rocks.\n\nMy luck was terrible... my stone house was hit by lightning anyway.\nThe supports... didn't hold out for long. I was buried...\n\nI... am cold and tired. The wounds on my body have opened up again. I feel... very bad... I have no strength to push the rocks away. The air is getting thinner. I know I must do something, but... I still can't do anything...\n\nI'm sorry. I failed my duty as a messenger. I couldn't bring everyone... I'm sorry. You helped me so much, but I couldn't fulfill the promise..."
 time_lifeline.441.a:0 "That was really tough."
 time_lifeline.441.b:0 "Wait a moment, hang in there!"
 time_lifeline.441.b.response:0 "...Sorry...\n\n§R<Connection terminated.>§!"
 time_lifeline.442.desc:0 "Hah... so tired.\n\nAlthough I got quite a few scrapes, nothing serious. I'm just exhausted.\nIf I had been covered in wounds before, I'm not sure if I could have escaped alive.\n\nHuh, I seem to have found something in the pile of rocks?\nThis stone seems to be carved with some kind of text. Let me try to translate it:\n\"§H11037.7.7§!\"\n\nEh?"
 time_lifeline.442.a:0 "Looks like a date."
 time_lifeline.443.desc:0 "My first reaction was that too, but...\n\nIs it already the year 11037?\nIf judged by the Galactic Standard Time, this is thousands of years later than when I arrived on this planet. Have I been here for thousands or even tens of thousands of years?"
 time_lifeline.443.a:0 "Maybe this isn't written in Galactic Standard Time."
 time_lifeline.444.desc:0 "You have a point. Maybe it's only year 11037 according to the local calendar.\n\nBut in the ten thousand years since the calendar was established, hasn't this civilization managed to step into the stars and establish contact with other galactic civilizations?\nBut this simple stone hut doesn't look like a product of a spacefaring civilization at all.\n\nNo, I'm completely confused."
 time_lifeline.444.a:0 "Why not make a few hypotheses to explain everything currently?"
 time_lifeline.445.desc:0 "Hypotheses? I'll try.\n\nSuppose we confirm that this date is written in Galactic Standard Time, then it is now the year 11037, thousands of years later than when I crash-landed on this planet.\nI am certain I haven't stayed on this planet for that long, so the only possibility is that the time in between was \"§Herased§!\", or rather, \"§Hskipped§!\".\n\nMy personal experience tells me that §HSpacetime Travel§! is possible-no, it actually exists.\nThe only explanation is that the machine in the altar is actually a §HSpacetime Shuttle§!!\nBecause I activated the machine, I came to the distant future, which is the year 11037.\nThe ship vanished because it was flown away long ago, and the disappearance of the impact crater is because it was smoothed over by wind and sand over the long years.\nAs for who flew the ship away, I think it was myself.\n\nIn the correct timeline, I must have gathered the materials, repaired the ship, and flown it away from this planet without looking back."
 time_lifeline.445.a:0 "That is... hard to believe."
 time_lifeline.446.desc:0 "Hehe, very imaginative, right? I startled myself too.\n\nBut, I'm not joking. I'm preparing to go to the mountain peak right now to investigate that machine again.\nIf it is as I said, I need to use it to return to the correct timeline and complete the loop.\n\nEven if I find out I guessed wrong, it's just ruling out one incorrect inference."
 time_lifeline.446.a:0 "Then go take a look."
 time_lifeline.446.a.response:0 "Okay, see you in a bit!"
 
 time_lifeline.450.desc.1:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller determined she was in the past based on the message and prepared to use the time machine to return to the future.>§!\n§E<Record Note: The distress caller is a time traveler, worth noting.>§!"
 time_lifeline.450.desc.2:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller determined she was in the future based on the text and prepared to use the time machine to return to the past.>§!\n§E<Record Note: The distress caller has a rich imagination... not worth noting.>§!"
 time_lifeline.450.a:0 "How is the investigation of the time machine going?"
 time_lifeline.451.same:0 "Most of the meters and buttons, I don't know what they are for.\n\nHowever, I found a dial with dense markings. It has twelve equal intervals engraved like a clock, and between every two marks are twelve equal small marks, and between small marks are twelve equal smaller marks...\nIn addition, there is another meter nearby, which seems to be used to display more precise scales.\nThese two dials are located in the center of the console. I think they must have some connection to the shuttle's target time point.\n\n"
 time_lifeline.451.desc:0 "Honestly, no clue. $time_lifeline.451.same$I plan to place a conspicuous marker outside the machine, then fine-tune this dial, and then start the machine.\nFinally, by observing whether the marker exists, I can determine whether I went to the past or the future; if the marker exists, I can also analyze its state to judge how long I traveled.\n\nHehe, it's a dumb method, right?"
 time_lifeline.451.a:0 "If you could let me see it, maybe we could solve it faster."
 time_lifeline.452.desc:0 "What a pity. This communicator doesn't have video transmission capability.\nAnd even if it did, this machine itself shields signals, so I still can't show you the details.\n\nAlright, thinking more won't solve the problem. Next, let me try it out."
 time_lifeline.452.a:0 "You will eventually return to the future, right?"
 time_lifeline.452.a.response:0 "Yes, that's right. Let's meet in the future!"
 time_lifeline.452.b:0 "You will eventually return to the past, right?"
 time_lifeline.452.b.response:0 "Yes, that's right. Let's return to the origin!"
 
 time_lifeline.490.desc:0 "Communication is cut off here. We can no longer contact the distress caller.\n\nWe couldn't save her."
 time_lifeline.490.a:0 "Although she wasn't one of us, I am sorry."
 time_lifeline.490.b:0 "I am sorry. Is this emotion?"
 time_lifeline.490.c:0 "I am sorry."
 time_lifeline.490.d:0 "We will not feel sorry for the death of aliens!"
 time_lifeline.490.e:0 "No, this is not our fault!"
 
 ################################################################
 # Phase 3 (Time Machine - Future)
 ################################################################
 
 time_lifeline.460.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller found the ship missing and prepared to go to the lake to find signs of civilization.>§!"
 time_lifeline.460.a:0 "Did you find a civilization?"
 time_lifeline.461.desc:0 "I didn't find a single local, but it wasn't fruitless.\n\nI found a large number of stone buildings and facilities by the lake. Obviously, this is a place where a local tribe once lived.\nUnfortunately, traces of life no longer exist. This area should have been abandoned for a long time, possibly the entire civilization is gone.\n\nAlso, I didn't see any sign of the ship here. I'm afraid it wasn't carried away by local creatures, but for some other reason..."
 time_lifeline.461.a:0 "Investigate more. Maybe you'll discover something."
 time_lifeline.462.desc:0 "Speaking of discoveries, actually, there is something.\n\nI found similar dormant spores in several stone houses, but I can't determine if they were left by local intelligent life or simply non-intelligent spores blown by the wind.\nI have used my portable analysis equipment to test them, but the test will take some time.\n\nSo, I want to take this time to contact you and analyze my current situation."
 time_lifeline.462.a:0 "Let's organize the existing intelligence."
 time_lifeline.463.desc:0 "There is one thing I don't understand right now. How long was I unconscious after starting the machine?\n\nIf we can determine the time, perhaps we can lock onto the range where the ship might exist."
 time_lifeline.463.a:0 "$time_lifeline.531.a$"
 time_lifeline.464.desc:0 "$time_lifeline.532.desc$"
 time_lifeline.464.a:0 "$time_lifeline.532.a$"
 time_lifeline.465.desc:0 "$time_lifeline.533.desc$"
 time_lifeline.465.a:0 "$time_lifeline.533.a$"
 time_lifeline.466.desc:0 "$time_lifeline.534.desc$"
 time_lifeline.466.a:0 "$time_lifeline.534.a$"
 time_lifeline.467.desc:0 "$time_lifeline.535.desc$"
 time_lifeline.467.a:0 "$time_lifeline.535.a$"
 time_lifeline.468.desc:0 "This series of events is indeed baffling, but dwelling on these now is useless.\n\nThe analysis results seem to be out.\nLet me see. In the cells of these spores, the organelles have clear divisions of labor, and the genetic material in the nucleus maintains a stable double helix structure.\nJudging from the overall shape of the cells, compared to fungi, these look more like special animal cells with cell walls.\nI also found some surrounding fungi samples and compared them with the spores. The results didn't match at all.\n\nPerhaps these spores are what this tribe left behind. This civilization might be a special fungal civilization."
 time_lifeline.468.a:0 "That is interesting."
 time_lifeline.469.desc:0 "There is an abandoned wooden ship by the lake. Although there may not be any harvest, I plan to go up and take a look.\nAfter all, there will be no results without trying personally."
 time_lifeline.469.a:0 "Then I'll wait for your good news."
 time_lifeline.469.a.response:0 "Okay, I'll contact you again soon."
 
 time_lifeline.470.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller believes there was once a fungal civilization, but it no longer exists. Finally, the distress caller decided to explore the derelict ship.>§!\n§E<Record Note: The distress caller discovered a time difference between us, worth noting.>§!"
 time_lifeline.470.a:0 "Did you gain anything on the derelict ship?"
 time_lifeline.471.desc:0 "Yes, but... I don't understand.\n\nI boarded the deck, but it was empty, except for a mast broken for some unknown reason, lying heavily on the deck and smashing the helm to pieces.\nLater, I found some metal decorations in the debris of the mast, but they looked inexplicably familiar.\n\nNot only that, but I also found a communicator modified into a voice recorder."
 time_lifeline.471.a:0 "Voice recorder?"
 time_lifeline.472.desc:0 "There is only one message in the recorder: \"§HThis is not the future, but the past! Use the time machine to return to the future!§!\"\n\nThe message uses a language I am familiar with, which already surprised me, and the content confused me even more.\nFirst is the term \"§HTime Machine§!\". I think it probably refers to that machine in the center of the altar.\nBut what does it mean by \"§HThis is not the future, but the past§!\"?\n\nIs someone reminding me of the current time point?"
 time_lifeline.472.a:0 "Why not use it to explain the current situation for verification?"
 time_lifeline.473.desc:0 "First, assume the message is true. Then I came to the past through the \"§HTime Machine§!\" in the altar.\n\nThis might explain why the ship is gone; that's because I haven't arrived on this planet yet at this time.\nBut not only the ship, the altar outside the machine also disappeared completely. I thought it was destroyed by the black rain, could it be-because it hasn't been built yet?\n\nNo, no, there are still things that don't make sense. What is it..."
 time_lifeline.473.a:0 "Don't forget the ship's impact crater."
 time_lifeline.474.desc:0 "Right, only the ship is missing. The impact crater is still there intact!\n\nIf I went back to the past, how was the impact crater formed?\nExplaining it with a meteorite crater is too far-fetched.\nThinking back, is this message really for me? Could it be left for someone else, and I misunderstood its meaning on my own initiative?\nIf not, then my previous explanation about the §HTime Machine§! might be wrong. I may not have really traveled through spacetime.\n\nAnyway, this is inextricably linked to that machine in the altar. Only by re-investigating it carefully can this mystery be solved."
 time_lifeline.474.a:0 "Then investigate it again."
 time_lifeline.474.a.response:0 "I was busy hiding from the black rain before and didn't have time to investigate carefully. Now I must solve the secret of this machine!"
 
 time_lifeline.480.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller found a mysterious message. To verify the authenticity of the information, she chose to re-investigate the machine.>§!"
 time_lifeline.480.a:0 "$time_lifeline.450.a$"
 time_lifeline.481.desc:0 "At first, I was confused. $time_lifeline.451.same$But later, I used a clumsy method to test, and finally reached a conclusion-this is a genuine §HSpacetime Shuttle§!.\nNot only that, but I have basically mastered the method of operating this machine."
 time_lifeline.481.a:0 "Does that mean the message is true?"
 time_lifeline.482.desc:0 "I can't be that certain, because I only verified half, not the other half.\nMoreover, I still don't know if that message was really sent to me.\n\nHowever, the only thing certain is that I did travel to a different timeline. If I want to return to the correct time node, I can only rely on this §HTime Machine§!.\nMy intuition tells me this might be the only chance, because I can even hear the parts inside the machine clanking.\n\nThis final choice, I'll leave it to you.\nMy fate is also in your hands."
 time_lifeline.482.a:0 "Trust the message. Return to the future."
 time_lifeline.482.a.response:0 "The future... is it?\n\nOkay, let's meet in the future!"
 time_lifeline.482.b:0 "Too many doubts. Return to the past."
 time_lifeline.482.b.response:0 "The past... is it?\n\nOkay, let's return to the origin!"
 time_lifeline.482.c:0 "I cannot make a judgment right now."
 time_lifeline.482.c.response:0 "Is that so...\nTrue, I relied on you too much, forcing you to bear the responsibility of choice for me.\n\nOkay, this time, I will decide my own fate."
 
 ################################################################
 # Phase 3 (Mirror World)
 ################################################################
 
 time_lifeline.500.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller boarded the unmanned derelict ship, but the ship sank, and we lost contact.>§!"
 time_lifeline.500.a:0 "Are you still alive? That's great!"
 time_lifeline.501.desc:0 "Should be... still alive.\n\nBefore when communicating with you, my backup communicator was suddenly washed away by water. Shortly after, I was also washed away by water and fell into a coma.\nWhen I woke up from the coma, I found myself floating on the water surface, but that ship was floating not far away, almost intact.\nI re-boarded the ship and was surprised to find that the previously broken mast had actually returned to its original state, but the boxes on the deck had flown away, perhaps fallen into the lake.\n\nI entered the cabin again and found that the tables and chairs were firmly fixed in their original positions.\nI also found my communicator in the hall. Fortunately, it is waterproof."
 time_lifeline.501.a:0 "What do you mean by \"should be\"?"
 time_lifeline.502.desc:0 "You noticed. Honestly, I don't know if I'm still alive. Maybe I've gone to heaven.\n\nAfter I woke up, what caught my eye was a pink sky.\nIt should be night now because I can't find the sun's position, but the sky is emitting pink light on its own, giving a dreamy yet eerie feeling.\n\nIs this a dream, or is this heaven? Can you tell me?\nThen how am I communicating with you? Are you just my fantasy?"
 time_lifeline.502.a:0 "Of course all this is not a dream, because I am not fake."
 time_lifeline.502.b:0 "You are definitely still alive. Pinch yourself if you don't believe it."
 time_lifeline.502.c:0 "Yes, I am just your fantasy, and you are just my fantasy."
 time_lifeline.503.desc:0 "Since you say so, then I can be sure all this is real.\nAlthough using things in a dream to verify if a dream is a dream is ridiculous, I am willing to believe you.\n\nI don't know how long it has been since then. I'm getting a bit hungry.\nI plan to look for some edible food in the storage room first. Of course, I can't expect much from the taste and quality."
 time_lifeline.503.a:0 "What do you plan to do later? After all, you are still in the center of the lake."
 time_lifeline.504.desc:0 "Ouch, that hurts! Looks like I should still be alive. I shouldn't feel pain in heaven.\nThat's great, after all, I still have tasks I must do.\n\nI don't know how long it has been since then. I'm getting a bit hungry.\nI plan to look for some edible food in the storage room first. Of course, I can't expect much from the taste and quality."
 time_lifeline.504.a:0 "$time_lifeline.503.a$"
 time_lifeline.505.desc:0 "So that's it. I was just dreaming, and so are you.\n\nSince it's a dream, there's a time to wake up.\nI can't dream forever; I have things I need to do.\nPeople often say that dying in a dream will wake you up from the dream. I don't know if it's true or false.\n\nI will forget you, after all, it's just a dream.\n\nYou should forget me too, after all, it's just a dream."
 time_lifeline.505.a:0 "No need to forget. Sweet dreams and nightmares are equally worth remembering."
 time_lifeline.505.a.response:0 "I hope after waking up, I can still see you."
 time_lifeline.506.desc:0 "I don't know. Maybe I can try to start this ship, or wait for this ship to drift to the shore with the waves. After all, my flight device is broken...\n\nWait, my flight device has actually been repaired. How bizarre! I'm starting to suspect if this is a dream again!\nDid someone help me fix it? Then why didn't they take me with them? Could that person be hiding on this ship?\n\nWhatever, I'll use the flight device to go back to the spaceship first.\nAlthough there are no gains for now, there will always be a way later. After all, you will help me."
 time_lifeline.506.a:0 "I am very curious about the principle of your flight device."
 time_lifeline.506.a.response:0 "Eh? Well, it's a bit troublesome to explain. The usage is roughly riding on it, *whoosh*, and flying away. Similar to a witch's flying broomstick. It's magic!\n\nHaha, joking aside, let's talk about the specifics later. We'll contact later."
 
 time_lifeline.510.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller's flight device was repaired, and she planned to ride the flight device back to the ship.>§!\n§E<Record Note: Really riding back?>§!"
 time_lifeline.510.a:0 "Returned to the ship?"
 time_lifeline.511.desc:0 "No, not yet, but I have some unexpected discoveries.\n\nThe place that was originally a stone house has suddenly become a flourishing tribe, and the flight device's sensors also indicate that many creatures are active in it.\nAlthough the houses and facilities are also built of stone, it is worlds apart from the situation I saw before.\nThe tribe seems to be inhabited by a fungal civilization, covered with dense roots and tentacles, looking a bit scary.\n\nI plan to negotiate with them first, but my communication equipment is too old. When enabling the translation function to translate the locals' words, I can't communicate with you normally."
 time_lifeline.511.a:0 "Good luck."
 time_lifeline.511.a.response:0 "Hope they are easy to talk to. I'll contact you immediately after the negotiation."
 
 time_lifeline.520.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller unexpectedly discovered natives and planned to negotiate with the local residents.>§!"
 time_lifeline.520.a:0 "How was the negotiation result?"
 time_lifeline.521.desc:0 "Things went even smoother than I imagined. Although the locals look scary, they are actually very friendly, just... they don't seem very smart.\n\nThis civilization seems to be still in the Stone Age, a very primitive tribe. I'm afraid they can't bring me any help.\nBut one thing strikes me as strange: the local stone houses and stone furniture appear a bit too exquisite, unlike something a primitive civilization can easily achieve."
 time_lifeline.521.a:0 "Indeed suspicious."
 time_lifeline.522.desc:0 "Not only that.\n\nThis Stone Age tribe has ancient spiritual worship. They seem to worship a snake-shaped evil god-of course, I'm not deliberately belittling their faith, but they really show awe, or rather, fear of the god everywhere.\nThey seem to mistake me for the god's messenger. Maybe that's why I'm so popular.\nThey offered precious food endlessly, while begging for my-or rather the god's-forgiveness. It seems this god has sent down some punishment on them.\n\nThey said they want to take me to a sacred place.\nAlthough I want to find materials to repair the ship more, it's better not to offend the locals."
 time_lifeline.522.a:0 "Something feels wrong. Stay safe."
 time_lifeline.522.a.response:0 "Don't worry. My flight device never leaves my side. Even if something unexpected happens, I will fly away *whoosh* immediately."
 
 time_lifeline.530.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller was mistaken for a divine messenger by local residents and was taken to the Holy Land.>§!"
 time_lifeline.530.a:0 "Have you reached the Holy Land?"
 time_lifeline.531.desc:0 "This so-called Holy Land seems to be on the mountain peak-the mountain north of the ship that I told you about at the beginning.\n\nAlong the way, I noticed that the types of vegetation have changed, vastly different from my memory.\nNot only that, but this mountain peak has also changed-I'm quite sure that when I saw this mountain before, there was a lot of snow on the summit, but now, the summit is covered with lush green plants, with absolutely no trace of snow.\n\nWhat on earth happened to the world after I passed out?"
 time_lifeline.531.a:0 "Maybe you were in a coma for months, or even years."
 time_lifeline.532.desc:0 "What? Wait, that's impossible, right?\n\nIf I had been in a coma for so long without eating or drinking, I should have died long ago."
 time_lifeline.532.a:0 "In fact, the interval between each communication I receive from you is very long."
 time_lifeline.533.desc:0 "How could that be? Although I may walk a bit slowly, I am very sure that the interval between each communication with you is only a few hours?\n\nI am a bit curious though. Every time I initiate communication with you, you receive it almost instantly.\nI didn't expect you to care about me so much, hehe."
 time_lifeline.533.a:0 "Actually, every time communication is received, it takes some time before it's transferred to me."
 time_lifeline.534.desc:0 "Now that you mention it, I suspect there is a big difference in our §Hperception of time§!...\n\nNo, no matter how different, it cannot explain all this. I think there must be a huge difference in §HTime Flow Rate§! between us."
 time_lifeline.534.a:0 "After all, you are in a black hole."
 time_lifeline.535.desc:0 "Mentioning the black hole again. So you weren't joking before.\n\nBut I am quite sure that my ship did not crash in a black hole, but crash-landed on a habitable planet, and there isn't even a black hole in this system!"
 time_lifeline.535.a:0 "Too strange, because we received your signal from a black hole."
 time_lifeline.536.desc:0 "This series of events is indeed baffling, but dwelling on these now is useless.\n\nWe have arrived halfway up the mountain. The Holy Land they spoke of should be at the summit. I'll contact you when I see the Holy Land.\nDuring this time, I will also think carefully about what has happened so far."
 time_lifeline.536.a:0 "Understood."
 time_lifeline.536.a.response:0 "See you in a bit."
 
 time_lifeline.540.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller noticed significant environmental changes, but the primary task currently is to go to the Holy Land on the summit.>§!\n§E<Record Note: The distress caller discovered a time difference between us, worth noting.>§!"
 time_lifeline.540.a:0 "What kind of place is the Holy Land?"
 time_lifeline.541.desc:0 "There is a white altar on the top of the mountain. Maybe this is the \"sacred place\" they mentioned.\n\nI followed the natives into the altar. The surrounding walls seem to be painted with icons of different sizes but similar shapes.\nLet me see-it looks like a snake biting its own tail, its body coiled into a circle. I think this is the Snake God they worship."
 time_lifeline.541.a:0 "This should be called \"§HOuroboros§!\"."
 time_lifeline.542.desc:0 "In the very center of the altar is a giant machine, and the natives have surrounded the machine. This is really too eerie.\n\nThey started dancing around the machine, and a hunched local stood beside the machine, chanting something.\nBecause I am communicating with you, I can't translate what he said.\nI think this should be some kind of sacrificial ritual. Maybe that person is the tribe's priest, chanting prayers for the sacrifice.\n\nThe atmosphere is a bit terrifying. I feel very uneasy."
 time_lifeline.542.a:0 "Hold on tight to your flight device. If anything strange happens, fly away immediately."
 time_lifeline.543.desc:0 "Mm, I'm holding on for dear life. My heart feels like it's going to jump out.\n\nThe ritual seems to be over. The crowd stopped their dancing steps, and the priest stopped chanting strange spells.\nThe priest opened the door of the machine. Inside seem to be some precise instruments and consoles. I don't know what they are used for.\nThe people around dispersed spontaneously, clearing a path in front of me, and the priest also made a \"please\" gesture to me.\n\nDo they... want me to go in?"
 time_lifeline.543.a:0 "Maybe there is no danger inside; it might even contain the secrets of this planet."
 time_lifeline.543.b:0 "Everything is too eerie. They cannot be trusted. Run away quickly!"
 time_lifeline.544.desc:0 "Do you... really think so?\nYou shouldn't be pushing me into a fire pit...\n\nAlright, I believe you. Maybe they have no malicious intent.\nAfter all, they treat me as a divine messenger. They shouldn't do something disrespectful like sacrificing a divine messenger... right?\nThen I'm going in... §R<Static>§!... Eh... §R<Static>§!...\n\n...§R<Static>§!..."
 time_lifeline.544.a:0 "What happened? Are you in danger?"
 time_lifeline.544.a.response:0 "...§R<Static>§!... No, not for now. They haven't done anything drastic, just that this machine seems to block signals.\n\nThen I'll go in first. We'll contact again in a bit... §R<Static>§!..."
 time_lifeline.545.desc:0 "You are right. This sacrifice is very wrong. Maybe this tribe has a tradition of human sacrifice. Maybe I am the sacrifice they offer to \"§HOuroboros§!\"!\n\nI can't stay any longer. I want to activate the flight device to leave here.\nIt is inconvenient to communicate while flying, so I will contact you when I return to the ship."
 time_lifeline.545.a:0 "Okay, I will wait for your news."
 time_lifeline.545.a.response:0 "...Whoosh-"
 
 ################################################################
 # Phase 4 (Closing the Loop)
 ################################################################
 
 time_lifeline.600.desc.pass:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller activated the time machine and headed towards the future. Was her choice correct?>§!"
 time_lifeline.600.desc.future:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller activated the time machine and headed towards the past. Was our choice correct?>§!"
 time_lifeline.600.desc.future.chosen_by_myself:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller activated the time machine and headed towards the past. Was her choice correct?>§!"
 time_lifeline.600.a:0 "Never looked forward to your contact so much. How is the situation?"
 time_lifeline.601.desc.pass:0 "I seem to have returned to the correct timeline.$time_lifeline.601.desc.same$"
 time_lifeline.601.desc.future:0 "I think your choice should be correct.$time_lifeline.601.desc.same$"
 time_lifeline.601.desc.future.chosen_by_myself:0 "I think I should have bet correctly.$time_lifeline.601.desc.same$"
 time_lifeline.601.desc.same:0 "\n\nI opened the door. Outside the machine is a damaged altar. The roof has completely collapsed, leaving only some broken walls still maintaining the original shape of the altar.\nThe snow outside the altar has turned gray, seemingly stained with filth. I really don't want to step on it.\n\nPure white fine snow is floating in the sky. The surroundings are very quiet. I can't hear a sound. I feel a sense of peace."
 time_lifeline.601.a:0 "How is the §HTime Machine§!?"
 time_lifeline.602.desc:0 "The §HTime Machine§! seems to be scrapped. I checked it, but didn't find the cause. However, it won't be useful for the time being anyway."
 time_lifeline.602.a:0 "What do you plan to do next?"
 time_lifeline.603.desc:0 "I thought, since this machine is broken anyway, why not dismantle it? Maybe I can find some usable parts.\n\nAfter all, there seems to be no surviving civilization on this planet. Dismantling it privately... no one should blame me, hehe."
 time_lifeline.603.a:0 "If I send a ship to save you, you won't dismantle the ship too, will you?"
 time_lifeline.603.a.response:0 "I won't! I'm going to start dismantling now, stop teasing me.\n\nI'll contact you immediately if I find anything."
 
 time_lifeline.610.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller seems to have returned to the correct timeline, but the time machine is broken, and the distress caller is dismantling it.>§!\n§E<Record Note: She seems to really like dismantling things.>§!"
 time_lifeline.610.a:0 "Any usable parts?"
 time_lifeline.611.desc:0 "Yes, I found it.\n\nAs I suspected, the core of the §HTime Machine§! is this §HTime Crystal§!.\nAnd it is artificial. Was there a civilization on this planet capable of manufacturing such precise material?\nBut they seem to be gone now."
 time_lifeline.611.a:0 "What is a §HTime Crystal§!?"
 time_lifeline.611.a.response:0 "§HTime Crystal§! is a unique crystal generally only found within a black hole's event horizon. It seems to require a certain gravitational field and magnetic field changes caused by time distortion to form.\n\nTherefore, people generally use natural §HTime Crystals§!; it is difficult to synthesize artificially.\nIn my knowledge, there are only a few cases of artificial synthesis so far.\n\n§HTime Crystal§! itself has the ability to distort spacetime, but it requires a suitable method to activate.\nI'm not too sure about the specific principles. I just care about using it practically, hehe."
 time_lifeline.611.b:0 "Is this important to you?"
 time_lifeline.612.desc.same:0 "My flight device is actually my Casting Unit. Flying is just one of its functions.\nI rely on the Casting Unit to perform §HSpacetime Travel§!, and the core of the §HSpacetime Module§! is a §HTime Crystal§!, only it was severely damaged in the last jump."
 time_lifeline.612.desc:0 "Of course it's important, after all, I am a §HTime Traveler§!.\n\n$time_lifeline.612.desc.same$"
 time_lifeline.612.a:0 "Then you mean?"
 time_lifeline.613.desc:0 "Of course it's important, after all, I am a §HTime Traveler§!.\n\nBy the way, I don't seem to have mentioned this before. After all, §HSpacetime Travel§! is always unbelievable.\nBut I just used the §HTime Machine§! to return to the correct timeline. You should be able to believe it now, right?\n\nHmm... seems there's still no persuasiveness.\nAfter all, you have neither seen it with your own eyes nor experienced it yourself. It has always been just me talking to myself."
 time_lifeline.613.a:0 "No, of course I believe."
 time_lifeline.614.desc:0 "It's great that you are willing to believe.\n\n$time_lifeline.612.desc.same$"
 time_lifeline.614.a:0 "$time_lifeline.612.a$"
 time_lifeline.615.desc:0 "Correct, I want to use the §HTime Machine§!'s §HTime Crystal§! to repair my Casting Unit's §HSpacetime Module§!.\nWith this, I can temporarily perform §HSpacetime Travel§!.\n\nHowever, it is dangerous to perform §HSpacetime Travel§! without complete preparation, and my ship hasn't been fixed yet.\nSo, I plan to establish a §HSpacetime Anchor§! here and ask 'them' to provide me with supplies and repair the ship."
 time_lifeline.615.a:0 "What is a §HSpacetime Anchor§!?"
 time_lifeline.616.desc:0 "A §HSpacetime Anchor§! is actually equivalent to a coordinate on the time axis and space axis. Through this coordinate, one can accurately arrive at the time node and space node where I am.\n\nWhen I establish a §HSpacetime Anchor§! and broadcast it in a specific form in spacetime, 'I' on different timelines will receive and decipher the signal, and they will know that I need help.\nIf the 'I' receiving the signal is close enough to the §HSpacetime Anchor§! and happens to be capable of giving help, she will arrive at the anchor to help.\n\nThis is a customary rule among us internally. After all, everyone is myself.\nIn order to achieve a beautiful time loop, everyone works together for themselves."
 time_lifeline.616.a:0 "This... is really a convenient thing."
 time_lifeline.617.desc:0 "If you think of it as too simple, you are very wrong.\n\nAlthough easier than §HSpacetime Travel§!, establishing a §HSpacetime Anchor§! is also very time-consuming and laborious. The longer it is maintained, the more dangerous it is.\nNot only that, using a §HSpacetime Anchor§! to launch a rescue is itself an act of disturbing spacetime. If the loop is not closed in time, it may even cause severe causal confusion due to the butterfly effect.\n\nSo, I won't do this unless absolutely necessary."
 time_lifeline.617.a:0 "Is it an absolutely necessary situation now?"
 time_lifeline.618.desc:0 "Strictly speaking, it's not that critical yet, but my Casting Unit is broken after all. If the new §HTime Crystal§! is also damaged, I won't have a chance to establish a §HSpacetime Anchor§!.\n\nMoreover, I haven't eaten or drunk for a long time. I'm hungry and tired now. It's understandable to find someone to help a bit, hehe."
 time_lifeline.618.a:0 "You can always find all sorts of reasons."
 time_lifeline.618.a.response:0 "Alright, next, I'm going to establish the §HSpacetime Anchor§!.\n\nI'll contact you when I fix the ship."
 
 time_lifeline.620.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller prepared to establish a Spacetime Anchor, using the timeline to get help.>§!\n§E<Record Note: A person full of mysteries. Is she really credible?>§!"
 time_lifeline.620.a:0 "Is the ship fixed?"
 time_lifeline.621.desc:0 "Mm, it's been repaired, and I've finished resupplying.\n\nBut I got scolded, because she traveled through time to help and returned to her original timeline, so she can't perform §HSpacetime Travel§! again in a short time.\nShe found my situation wasn't that bad, felt cheated, and left angrily, hehe.\n\nBut the feeling of seeing another self is really strange. So shy."
 time_lifeline.621.a:0 "Can't you perform §HSpacetime Travel§! frequently?"
 time_lifeline.622.desc:0 "Of course not. §HSpacetime Travel§! is very physically draining. I'm not a machine; I get tired too.\n\nAlso, although frequent travel is indeed possible if physical strength permits, under the influence of high-frequency changes to the timeline, spacetime will become disordered, and §HSpacetime Travel§! will be difficult to arrive safely and accurately at the destination.\nRunning to the wrong place, or even being trapped in §HSpacetime Turbulence§!, are very dangerous things.\n\nSo, I only do this in extremely special circumstances."
 time_lifeline.622.a:0 "Then what do you plan to do next?"
 time_lifeline.623.desc.same:0 "Because I just performed §HSpacetime Travel§! before arriving on this planet, I cannot jump again temporarily.\nTherefore, I plan to investigate this planet again. After all, this planet looks full of mysteries.\n\n"
 time_lifeline.623.desc.pass:0 "$time_lifeline.623.desc.same$There is something I have always been concerned about, so I plan to explore the space orbit of this planet. Maybe I can find the answer to the question there."
 time_lifeline.623.desc.future:0 "$time_lifeline.623.desc.same$The surroundings of the ship have basically been investigated, so I plan to go to the unvisited eastern desert. Maybe there will be new discoveries there."
 time_lifeline.623.a:0 "Remember to contact me if you find clues."
 time_lifeline.623.a.response:0 "Of course, after all, I still have things I want to ask you.\nSee you in a bit."
 time_lifeline.623.b:0 "Remember to contact me if you discover anything."
 time_lifeline.623.b.response:0 "Naturally. I will still need your help.\nSee you in a bit."
 
 ################################################################
 # Phase 4 (Closing the Loop - Past)
 ################################################################
 
 time_lifeline.630.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller's ship was fixed. Because there was something concerning, she went to explore the space orbit.>§!"
 time_lifeline.630.a:0 "Did you find the answer to the question?"
 time_lifeline.631.desc:0 "No, not yet, but I have something I want to confirm with you."
 time_lifeline.631.a:0 "What is it?"
 time_lifeline.632.desc:0 "Every time you receive my signals, the interval between them should be very long, right? I think there should be gaps of months or even years."
 time_lifeline.632.a:0 "That is indeed so."
 time_lifeline.633.desc:0 "Sure enough. Because I found that your side's deputy voice changes often, I guess it's because your personnel changed.\n\nBut personnel cannot change so frequently in one day, so it can only be-time passes much longer on your side than I thought."
 time_lifeline.633.a:0 "Why do you think it changed within one day?"
 time_lifeline.634.desc:0 "Because for me, without considering the time changed by the §HTime Machine§!, everything I experienced now happened within one day.\n\nOne day passes here for me, but years pass there for you...\nI don't think this is because our §Hperception of time§! is different, but that there is indeed a huge difference in our §HTime Flow Rate§!!"
 time_lifeline.634.a:0 "After all, you are in a black hole."
 time_lifeline.635.desc:0 "Black hole? I remember you mentioned this word before. At that time I thought you were joking. Now it seems it should be true.\n\nBut I don't think I am in a black hole, because I am certain this is just an unremarkable habitable planet.\nBut the difference in §HTime Flow Rate§! exists objectively. Let me think..."
 time_lifeline.635.a:0 "Maybe something on the planet influenced time?"
 time_lifeline.636.desc:0 "There is indeed that possibility, but what exactly is this thing?\n\nOf course, it won't be the §HTime Machine§!, because a single machine is not enough to generate such a large wide-area time difference.\n\nRight, black hole!\nAlthough the star of this system is not a black hole, before, my ship crashed on this planet due to a wave of abnormal gravitational fluctuations.\nI suspect that maybe there is a small black hole in this planet's orbit, only it hasn't formed a large enough accretion disk yet, so I failed to observe its existence.\n\nNext, I just need to analyze the gravitational field changes across the planet to lock onto the possible range of that black hole."
 time_lifeline.636.a:0 "Won't it be dangerous to approach a black hole?"
 time_lifeline.637.desc:0 "Black holes are indeed dangerous. If I accidentally enter the event horizon, even I will have difficulty escaping. $time_lifeline.637.desc.same$"
 time_lifeline.637.desc.same:0 "\n\nHowever, there are always sacrifices on the road to pursuing truth. If we choose to escape just because of danger, how can we discover the truth?\n\nOf course, I won't throw my life away for nothing, because I also have my own mission.\nSo, I will be cautious. Trust me."
 time_lifeline.637.a:0 "Then I'll trust your ability."
 time_lifeline.637.a.response:0 "Don't worry."
 time_lifeline.637.b:0 "No, I cannot tolerate others stepping on a journey of no return."
 time_lifeline.638.desc:0 "Why insist so much...\n\nAlright, since it is your choice, then I can only give up this plan.\nAfter all, not all mysteries need an answer. Some results and truths will only cause regret instead. $time_lifeline.647.desc.same$"
 time_lifeline.638.a:0 "$time_lifeline.647.a$"
 time_lifeline.638.a.response:0 "$time_lifeline.647.a.response$"
 
 time_lifeline.640.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller planned to search for a potential black hole by analyzing the gravitational field.>§!\n§E<Record Note: The distress caller discovered a time difference between us, worth noting.>§!"
 time_lifeline.640.a:0 "Did you find that black hole?"
 time_lifeline.641.desc:0 "I should say I found it, but it's a bit different from what I expected.\n\nThis black hole, strictly speaking, is a singularity. There is no accretion disk around it at all. I can only judge its event horizon range through the gravitational field.\nCalculated based on the event horizon range and black hole mass, the diameter of this singularity is even smaller than the Planck length, far below the calculation accuracy of the machine. This is clearly an impossible situation.\nNot only that, but this invisible singularity is also shifting in an irregular manner, seemingly not influenced by surrounding celestial bodies, but moving purely on its own will.\n\nWhat exactly is this thing?"
 time_lifeline.641.a:0 "We may have contacted this type of celestial body before and called it a \"§HWandering Singularity§!\"."
 time_lifeline.641.b:0 "We also have no knowledge of this mysterious celestial body."
 time_lifeline.642.desc.1:0 "\"§HWandering Singularity§!\"? What an apt name. $time_lifeline.642.desc.same$"
 time_lifeline.642.desc.2:0 "Since it has been wandering in space, I decided to call it a \"§HWandering Singularity§!\". $time_lifeline.642.desc.same$"
 time_lifeline.642.desc.same:0 "\n\nI don't know why the §HWandering Singularity§! appeared here, but I can be sure that this singularity caused the ship to crash before. The gravitational field anomaly around it matches the data in the flight recorder."
 time_lifeline.642.a:0 "Is the §HWandering Singularity§! the root cause of the time difference?"
 time_lifeline.643.desc:0 "I don't think that's entirely the case.\n\nHowever, my ship detected that your signal came precisely from this singularity. I'm afraid we can only judge so for now.\nI guess we were originally unable to contact each other, but the signal traveled between two different worlds through the black hole, which also led to the difference in §HTime Flow Rate§!."
 time_lifeline.643.a:0 "Maybe your universe is inside a black hole, and the §HWandering Singularity§! is the bridge to the outside world."
 time_lifeline.644.desc:0 "Reasonable hypothesis.\n\nHowever, have you considered if you are the one inside the black hole?"
 time_lifeline.644.a:0 "No, I have never thought so."
 time_lifeline.645.desc:0 "Sure enough, all of us firmly believe that the world we live in is real, and the other party's is the universe within the event horizon.\n\nBut what if what we have always believed is wrong?\nPerhaps you are in the black hole, perhaps I am in the black hole, perhaps we are both in the black hole, perhaps no one is in the black hole.\n\nAfter all, no one can use things in a dream to prove whether they are in a dream or not."
 time_lifeline.645.a:0 "Then it's impossible to judge right from wrong forever."
 time_lifeline.646.desc:0 "Probably so.\nWho can be sure that a black hole won't nurture a universe?\nWho can be sure that their own universe is not nurtured in another black hole?\n\nThis question may have no answer.\nBut I believe that one day, we can break through the infinite technological ceiling, reach the edge of the vast universe, and thereby explore the world \"outside the event horizon\" to get the answer we want.\n\nAt that time, we will no longer be dreamers."
 time_lifeline.646.a:0 "I also believe there will definitely be such a day."
 time_lifeline.647.desc:0 "It's time to say goodbye. All good things must come to an end.\n\nThere is nothing I care about particularly on this planet anymore. I have found my answer. $time_lifeline.647.desc.same$"
 time_lifeline.647.desc.same:0 "\nSoon, I will activate the Casting Unit and take the entire ship to travel to another spacetime.\nBy then, we may not be able to get in touch again.\n\nThis might be the last communication between us.\nBut I believe that in the endless future, we will definitely meet again."
 time_lifeline.647.a:0 "Yes, definitely."
 time_lifeline.647.a.response:0 "Future, future. Only the uncertain is the future.\nLet's meet in the future."
 
 time_lifeline.650.desc:0 "We haven't received any communication from the original distress caller for a long time. The other party may have met with an accident.\n\nPerhaps the other party made a mistake and was captured by the singularity, or perhaps she indulged in the truth and sailed into the event horizon, or perhaps...\n\nThere are no perhaps. Time has no retreat; facts are established."
 time_lifeline.650.a:0 "If we could go back to the beginning, could we have dissuaded her?"
 time_lifeline.650.b:0 "$time_lifeline.300.b$"
 time_lifeline.650.c:0 "There is never a lack of sacrifice on the road to pursuing truth."
 time_lifeline.650.d:0 "$time_lifeline.300.d$"
 time_lifeline.650.e:0 "$time_lifeline.300.e$"
 
 ################################################################
 # Phase 4 (Closing the Loop - Future)
 ################################################################
 
 time_lifeline.660.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller's ship was fixed. Because there was something concerning, she went to explore the eastern desert.>§!"
 time_lifeline.660.a:0 "Do you have any new discoveries?"
 time_lifeline.661.desc:0 "I didn't discover anything substantial, but I sensed something strange with my senses.\n\nThis desert is very weird. The §HTime Flow Rate§! in various areas is vastly different. In some places, molecular thermal motion is extremely fast, while in others, it stands still as if frozen.\nNot only that, but the refractive index of light in the air also varies greatly. One direction is colorful, while another is pitch black.\nVarious phenomena indicate that the speed of light in different parts of this desert is different, and even changing constantly.\n\nAlthough this phenomenon is rare, I have indeed experienced it.\nHere is filled with §HSpacetime Turbulence§!."
 time_lifeline.661.a:0 "What is §HSpacetime Turbulence§!?"
 time_lifeline.662.desc:0 "§HSpacetime Turbulence§! is a special physical phenomenon where the §HSpacetime Curvature§! between different regions is different, which also leads to differences in physical properties, physical parameters, and even physical laws.\n\nIn §HSpacetime Turbulence§!, the time axis and space axis are unfixed and non-unidirectional. They will split at various nodes and extend in different directions.\nIt is extremely dangerous because it is difficult to judge logically what impact one's actions will cause.\nOrdinary people trapped in it are almost impossible to escape, and may even trigger an infinite loop because of an ordinary action, causing all selves to be forced towards a dead end.\n\nEven for me, without the assistance of the Casting Unit, it is extremely likely to fall into a deadlock."
 time_lifeline.662.a:0 "The Casting Unit is really a versatile treasure."
 time_lifeline.663.desc:0 "Hehe, it is indeed a trustworthy partner, but this does not mean I can't do anything without it.\n\nActually, flying and spacetime manipulation are my own abilities. I myself can briefly use abilities independently of the Casting Unit.\nThe Casting Unit is just a tool to assist me in casting spells, playing roles like amplification, shunting, loading, stabilization, etc., making the use of abilities easier, more durable, and more efficient.\nThe flight function of the Casting Unit is not simply using buoyancy or reaction force, but realized in a form similar to a gravitational field or phase, which essentially amplifies the phase field I generate for displacement.\nEven the §HTime Crystal§! of the Casting Unit needs me to slightly distort spacetime to activate. This is the principle of my §HSpacetime Travel§!.\n\nHowever, the Casting Unit has saved my life many times. I really can't leave it."
 time_lifeline.663.a:0 "It seems I praised the wrong object."
 time_lifeline.664.desc:0 "Alright, let's not talk about this.\n\nThe key problem now is why this desert is full of §HSpacetime Turbulence§!, and why I didn't notice it before.\n\nIf I want to solve the mystery, I should only be able to find the answer in the depths of the desert."
 time_lifeline.664.a:0 "But isn't this desert very dangerous?"
 time_lifeline.665.desc:0 "§HSpacetime Turbulence§! is indeed very dangerous. Even one wrong step is hard to remedy, even for me. $time_lifeline.637.desc.same$"
 time_lifeline.665.a:0 "$time_lifeline.637.a$"
 time_lifeline.665.a.response:0 "$time_lifeline.637.a.response$"
 time_lifeline.665.b:0 "$time_lifeline.637.b$"
 time_lifeline.666.desc:0 "$time_lifeline.638.desc$"
 time_lifeline.666.a:0 "$time_lifeline.638.a$"
 time_lifeline.666.a.response:0 "$time_lifeline.638.a.response$"
 
 time_lifeline.670.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller planned to go deep into the desert to investigate Spacetime Turbulence.>§!\n§E<Record Note: The distress caller possesses the ability to fly and manipulate spacetime, worth noting.>§!"
 time_lifeline.670.a:0 "Found any clues?"
 time_lifeline.671.desc:0 "I think I should have discovered the root of the problem.\n\nIn the central area of the desert, countless §HTime Machines§! are abandoned here.\nSome are covered with a layer of dust, some are half-buried by yellow sand, and some are completely sunk into the sand, exposing only the top surface.\n\nThe quantity alone is already huge. If we consider the machines buried deep under the sand, the result will only be more astonishing."
 time_lifeline.671.a:0 "Are these machines the cause of the turbulence?"
 time_lifeline.672.desc:0 "Basically certain, because almost all §HTime Machines§! here are in an active state!\n\nStrictly speaking, it wasn't someone who actively started them, but the §HTime Crystals§! at the machine cores resonated under the influence of their respective spacetime fields.\nCountless crystals influence spacetime in completely different forms, leading to this series of chaos.\n\nEven not just §HSpacetime Turbulence§!, maybe various disasters on this planet are caused by them.\nBefore communicating with you, I witnessed the terrifying scene of rainstorms, hail, lightning, and hurricanes appearing at the same time.\nI suspect that various butterfly effects in the §HSpacetime Turbulence§! are superimposed on each other, causing the weather outside the desert to be unpredictable.\nLiving creatures living in it for a long time may even transform into monsters because they cannot adapt to the unpredictable environment. Maybe the group of black monsters I encountered earlier originated from this desert.\n\nMaybe the original civilization of this planet perished because of this."
 time_lifeline.672.a:0 "This is simply a disaster. Why did they do this?"
 time_lifeline.673.desc:0 "I am also very curious about how developed this civilization was to be able to mass-produce such a huge amount of §HTime Machines§!.\n\nI just discovered that almost all machines are painted with an §HOuroboros§! icon. They probably built these machines out of some kind of faith.\nThere is also a text here. Let me try to translate it:\n\"§HDedicated to the greatest Lord of Spacetime - The Worm-in-Waiting§!\"\n\n§HThe Worm-in-Waiting§!?"
 time_lifeline.673.a:0 "That is a familiar name."
 time_lifeline.673.b:0 "This might be the god they believe in."
 time_lifeline.674.desc.1:0 "Do you know what §HThe Worm-in-Waiting§! represents?\nNo, this doesn't seem very important either.\nAnyway, this §HThe Worm-in-Waiting§! should be the god they believe in. $time_lifeline.674.desc.same$"
 time_lifeline.674.desc.2:0 "I think it is very likely, although I don't know what §HThe Worm-in-Waiting§! represents. $time_lifeline.674.desc.same$"
 time_lifeline.674.desc.same:0 "\n\nThis civilization should be fanatical followers of §HThe Worm-in-Waiting§!.\nIt is possible that this \"Lord of Spacetime\" asked them to build these machines, or they took it upon themselves to change spacetime to please the god, or they accepted the god's help but acted recklessly and invited punishment...\n\nThe reason has disappeared in the river of time along with the destruction of the civilization, but it is an indisputable fact that this civilization personally facilitated its own decline."
 time_lifeline.674.a:0 "They were not strong enough to control their own destiny."
 time_lifeline.675.desc:0 "No, it's not that simple. Never underestimate time.\n\nAlthough time seems irregular, time has its own laws, only we don't know them yet.\nPlaying tricks with time will only end up reaping what one sows. Following the tide of time is the essence of the world.\n\nPrecisely because of this, we can only explore time carefully and avoid time's wrath.\nPrecisely so, we can successfully guide time and get a glimpse of a corner of time."
 time_lifeline.675.a:0 "But you seem to be best at time tricks."
 time_lifeline.676.desc:0 "Indeed so. Perhaps one day, time will send down punishment on me.\n\nBut I also have my own mission. I am destined to violate time to a certain extent. I don't know if this is time's tacit approval or temporary tolerance.\n\nAnd, and, at least I am still alive and kicking now. Fate in the future can be discussed in the future."
 time_lifeline.676.a:0 "But you just advised us not to underestimate time."
 time_lifeline.677.desc:0 "Of course, after all, you represent a civilization and must consider the future of the entire civilization.\n\nI am just an individual. Even if I die, I don't need to be responsible for others.\nAnd the death of an individual does not mean the extinction of the whole. On infinite timelines, there are countless selves who will achieve the goal for me."
 time_lifeline.677.desc.chosen_by_myself:0 "$time_lifeline.677.desc$\n\nJust like the choice in the §HTime Machine§! before, this is the destiny I decided myself.\nSince then, I successfully returned to the correct timeline, then now, I will definitely not go astray.\nI believe, I firmly believe, I am certain, the path I chose will definitely lead to a sunny tomorrow."
 time_lifeline.677.a:0 "Perhaps this is your responsibility and mine."
 time_lifeline.677.b:0 "This sounds somewhat similar to us."
 time_lifeline.678.desc:0 "You have your responsibilities, and I have my mission. It's time to say goodbye.\n\nAlthough I found the root of the §HSpacetime Turbulence§!, I always feel there are still unsolved mysteries.\nBut I don't have time to continue exploring this planet. Not all mysteries need an answer. $time_lifeline.647.desc.same$"
 time_lifeline.678.a:0 "$time_lifeline.647.a$"
 time_lifeline.678.a.response:0 "$time_lifeline.647.a.response$"
 
 time_lifeline.680.desc:0 "We haven't received any communication from the original distress caller for a long time. The other party may have met with an accident.\n\nPerhaps the other party was lost in spacetime turbulence, or perhaps the other party was attacked in the depths of the desert, or perhaps...\n\nThere are no perhaps. Time has no retreat; facts are established."
 time_lifeline.680.a:0 "$time_lifeline.650.a$"
 time_lifeline.680.b:0 "$time_lifeline.300.b$"
 time_lifeline.680.c:0 "Time is a terrible opponent."
 time_lifeline.680.d:0 "$time_lifeline.300.d$"
 time_lifeline.680.e:0 "$time_lifeline.300.e$"
 
 ################################################################
 # Phase 4 (Deviation)
 ################################################################
 
 time_lifeline.700.desc.pass:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller activated the time machine and headed towards the past. Was her choice correct?>§!"
 time_lifeline.700.desc.future:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller activated the time machine and headed towards the future. Was our choice correct?>§!"
 time_lifeline.700.desc.future.chosen_by_myself:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller activated the time machine and headed towards the future. Was her choice correct?>§!"
 time_lifeline.700.a:0 "$time_lifeline.600.a$"
 
 ################################################################
 # Phase 4 (Deviation - Past)
 ################################################################
 
 time_lifeline.710.desc:0 "I feel something is very wrong.\n\nI'm still inside the §HTime Machine§!, but I feel the air is extremely hot, and the metal shell is too hot to approach.\nThere is another very strange thing, that is, this machine suddenly stopped blocking signals, so I can communicate with you now."
 time_lifeline.710.a:0 "Can you see what happened outside?"
 time_lifeline.710.b:0 "Better stay put and wait for the machine to cool down."
 time_lifeline.710.b.response:0 "I think this shouldn't be the heat generated by the machine's operation itself. There should be something outside.\n\nHowever, watching and waiting is never a bad thing. Going out rashly might be dangerous."
 time_lifeline.711.desc:0 "Okay, I'm opening the door.\n\nWhoa! It's boiling lava!\nWhy is there lava here?\nIt's pouring into the machine!"
 time_lifeline.711.a:0 "Oh no!"
 time_lifeline.711.a.response:0 "(Screams came from the other end.)\n\n§R<Connection terminated.>§!"
 time_lifeline.712.desc:0 "Communication is cut off here. We can no longer contact the distress caller.\n\nShe is likely buried in the lava."
 time_lifeline.712.a:0 "$time_lifeline.300.a$"
 time_lifeline.712.b:0 "$time_lifeline.300.b$"
 time_lifeline.712.c:0 "We should not risk other people's lives."
 time_lifeline.712.d:0 "$time_lifeline.300.d$"
 time_lifeline.712.e:0 "$time_lifeline.300.e$"
 
 time_lifeline.720.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: There seems to be a heat source outside the time machine. The distress caller is waiting for cooling.>§!"
 time_lifeline.720.a:0 "How is it? Has it cooled down outside?"
 time_lifeline.721.desc:0 "The temperature of the machine's shell has started to drop, but the air is still hot, the floor is also burning, and I feel a little difficulty breathing."
 time_lifeline.721.a:0 "It should be safe outside now. Open the door carefully."
 time_lifeline.722.desc:0 "Okay, I'll be careful.\n\nEh? The world outside, what happened to it?"
 time_lifeline.722.a:0 "What has the outside become?"
 time_lifeline.723.desc:0 "The altar disappeared. Accurately speaking, the original world disappeared entirely, replaced by a sea of fire!\n\nThe entire planet is covered by scorching lava. Some rocks floating on the surface of the lava melted again as soon as they cooled down.\nThis machine is floating on the lava right now. If I open the door any wider, maybe lava will pour in!"
 time_lifeline.723.a:0 "Did you travel to the wrong time point?"
 time_lifeline.724.desc:0 "Seems so. Now seems to be the period shortly after the planet was born, when the crust hasn't cooled down yet.\n\nI was too reckless!"
 time_lifeline.724.a:0 "Can you restart the §HTime Machine§!?"
 time_lifeline.725.desc:0 "Bad news, the core component of this machine seems to be burned out. It can't be started now.\n\nI seem... unable to return..."
 time_lifeline.725.a:0 "Can you repair the core component?"
 time_lifeline.726.desc:0 "I'm afraid it's very difficult, and even if I could, I don't have enough materials.\n\nBut I thought of a way. Let me remove the core component first to see if there is the thing I'm thinking of."
 time_lifeline.726.a:0 "What thing are you referring to?"
 time_lifeline.726.a.response:0 "Can't be sure if it's there yet. I'll know when I take it out.\n\nContact later."
 
 time_lifeline.730.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller seems to have returned to the lava period and is dismantling the core component.>§!"
 time_lifeline.730.a:0 "Did you find what you need?"
 time_lifeline.731.desc:0 "Luckily, I found it.\n\nAs I suspected, the core of the §HTime Machine§! is this §HTime Crystal§!.\nAnd it is artificial. Was there a civilization on this planet capable of manufacturing such precise material?\nEven though they haven't even stepped into the space age.\n\nIf I can use this §HTime Crystal§! to replace the core of my Casting Unit's §HSpacetime Module§!, maybe I can attempt §HSpacetime Travel§!."
 time_lifeline.731.a:0 "Wait, what are you talking about?"
 time_lifeline.732.desc:0 "Eh, haven't I told you before?\n\nActually, I am a §HTime Traveler§!. $time_lifeline.612.desc.same$"
 time_lifeline.732.a:0 "I thought you just had a rich imagination."
 time_lifeline.733.desc:0 "Ah, is that how you see me...\n\nBut the important thing is something else, it's the §HTime Crystal§! removed from the §HTime Machine§!.\nBad news, the temperature is really too high. The vast majority of this crystal has been denatured by heat. In the most optimistic case, only the central part of the crystal might work normally."
 time_lifeline.733.a:0 "Is that part of the crystal enough for you to perform §HSpacetime Travel§!?"
 time_lifeline.734.desc:0 "I think, probably far from enough...\n\nThe air is getting hotter and hotter, and the oxygen content is getting lower and lower.\nI can smell the pungent sulfur smell. My respiratory tract is suffering continuous damage. The situation is very dangerous.\n\nBut I am helpless. I can't find a way to escape, and I have no way to complete the mission..."
 time_lifeline.734.a:0 "Is there really no way?"
 time_lifeline.735.desc:0 "I think I have one last resort.\n\nThe core of this §HTime Crystal§! may not be enough... cough cough... enough for me to perform §HSpacetime Travel§!, but it should be able to bring the communicator to another timeline."
 time_lifeline.735.a:0 "You mean?"
 time_lifeline.736.desc:0 "I'm preparing to modify this communicator into a voice recorder, and use the §HTime Crystal§! to send it to the me of the past... cough cough... that is, me before starting the machine for the second time.\n\n...cough cough...\nI will tell myself that I misjudged the time point. At that time I was not in the future, but in the past... cough cough..."
 time_lifeline.736.a:0 "But you now..."
 time_lifeline.737.desc:0 "Naturally, it is absolutely impossible for me now to survive, but at least... cough cough... myself on different timelines can still have a glimmer of hope.\n\nIt's not the first time I've experienced this kind of thing... cough cough... although only knowing that another self fell into a dead end, I believe another me must be ready to die... cough cough... using the last strength to guide other mes to the true loop.\n\nI am not alone. In countless universes, on countless timelines, there are countless mes struggling for the mission.\nEven if I die, there are countless mes alive. I will open up a correct course for them."
 time_lifeline.737.a:0 "I respect your choice."
 time_lifeline.737.a.response:0 "I want to complete my final task... cough cough... If you see another me in the future, remember to say hello to her for me.\n\n§R<Connection terminated.>§!"
 
 time_lifeline.740.desc:0 "Communication is cut off here. We can no longer contact the distress caller.\n\nShe is preparing for her final mission."
 time_lifeline.740.a:0 "Time is a circle. Everything will eventually affect oneself."
 time_lifeline.740.b:0 "Time is a maze. She uses her life to search for the exit of the maze."
 time_lifeline.740.c:0 "Opening up a chance of survival for others at the last moment of life, truly a great person."
 time_lifeline.740.d:0 "She fought for herself until the last moment. Salute to her."
 time_lifeline.740.e:0 "Everything is for the common ideal of all selves."
 time_lifeline.740.f:0 "We will definitely meet again, definitely."
 
 ################################################################
 # Phase 4 (Deviation - Future)
 ################################################################
 
 time_lifeline.760.desc.1:0 "I think your choice should be correct.$time_lifeline.760.desc.same$"
 time_lifeline.760.desc.2:0 "I think I should have bet correctly.$time_lifeline.760.desc.same$"
 time_lifeline.760.desc.same:0 "\n\nThere is still no trace of the altar outside the machine, but the snow on the peak is still there.\nThis is probably shortly after the black rain. The altar might have been completely destroyed by the black rain. Fortunately, I escaped a disaster through the §HTime Machine§!."
 time_lifeline.760.a:0 "What do you plan to do next?"
 time_lifeline.761.desc:0 "This machine seems to be completely scrapped. I don't know if it's because of my improper operation, or because it operated too frequently, or maybe it had already reached its service life limit.\n\nBut anyway, I can't use this machine anymore, so I plan to dismantle it. Maybe there will be parts I can use."
 time_lifeline.761.a:0 "Then good luck."
 time_lifeline.761.a.response:0 "Thanks. If I find anything, I'll contact you immediately."
 
 time_lifeline.770.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller seems to have returned to the correct timeline, but the time machine is broken, and the distress caller is dismantling it.>§!"
 time_lifeline.770.a:0 "Found any useful parts?"
 time_lifeline.771.desc:0 "That's not important anymore... I discovered a terrible fact!"
 time_lifeline.771.a:0 "Your voice is shaking badly. What happened?"
 time_lifeline.772.desc:0 "I'm surrounded! Surrounded by a black ocean!\n\nTime was tight before, and I couldn't observe carefully, but now I found that this black ocean is actually composed of a black viscous substance.\nThe monsters I first encountered looked like this substance!"
 time_lifeline.772.a:0 "Black... monsters?"
 time_lifeline.773.desc:0 "Yes, it's the monster that only moves when I move.\n\nI also tested this black ocean, and they possess the same characteristics. This also proves that this ocean is actually a huge monster formed by the fusion of countless black monsters.\nWhat's more terrifying is that the entire world has been submerged by the black ocean, only this mountain top has survived."
 time_lifeline.773.a:0 "Sounds terrible."
 time_lifeline.774.desc:0 "Fortunately, this ocean is still some distance away from me.\n\nAt first, I thought as long as I kept still there would be no danger, but later, I found I was wrong.\nWhen I stay still, this mass of black viscous substance does not maintain stillness as well, but expands outward at a weak speed.\nBut now, large amounts of black viscous substance gather together. Every tiny part converges into a huge mass. Even if I stay still, the black ocean still spreads upward at a visible speed.\n\nIn other words, one day, I will be swallowed by them."
 time_lifeline.774.a:0 "How long will it take for them to spread to the top?"
 time_lifeline.775.desc:0 "I can't be sure.\n\nTheir spreading speed is sometimes fast and sometimes slow, difficult to measure.\nMaybe the day after tomorrow? Tomorrow?\nMaybe just today.\n\nIt's really hateful. I clearly made the correct choice, but couldn't get a good result.\nThe §HTime Machine§! cannot be started, my flight device cannot be repaired, and even if it could be repaired, I can't escape this planet..."
 time_lifeline.775.a:0 "Wait patiently. Maybe things will take a turn for the better."
 time_lifeline.775.a.response:0 "I can only hope for a miracle.\n\nI'm tired and hungry, need to rest for a while..."
 time_lifeline.775.b:0 "$time_lifeline.775.a$"
 time_lifeline.775.b.response:0 "I can only hope for a miracle.\n\nI'm tired and hungry, and the wounds on my body are throbbing faintly. I need to rest for a long time, very long, very long..."
 
 time_lifeline.780.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller was surrounded by a black ocean, waiting for a miracle to descend.>§!"
 time_lifeline.780.a:0 "Any turn for the better?"
 time_lifeline.781.desc:0 "No, no turn for the better, no miracle.\n\nI have no food to eat, I have no water to drink, I can only sleep.\nBut every time I wake up, that black ocean has spread up a large section again.\nTo avoid activating it, I dare not do anything. It seems whatever I do will accelerate my death.\n\nI throw a stone in, the stone disappears, the sea climbs up a bit;\nI throw a snowball in, the snowball disappears, the sea climbs up a bit;\nI throw a branch in, the branch disappears, the sea climbs up a bit.\n\nCan you understand how desperate it feels for a person to watch death coming towards them without stopping, while being powerless?"
 time_lifeline.781.a:0 "..."
 time_lifeline.782.desc:0 "I'm like trapped in a maze without an exit. No matter how I struggle, I can't find the direction forward.\n\nEverything I do only pushes me one step closer to death.\nI... have no way out.\nI... have had enough.\nI..."
 time_lifeline.782.a:0 "Wait, don't give up yet!"
 time_lifeline.782.a.response:0 "I throw a stone in, the stone disappears, the sea climbs up a bit;\nI throw a snowball in, the snowball disappears, the sea climbs up a bit;\nI throw a branch in, the branch disappears, the sea climbs up a bit;\nI throw myself in...\n\n§R<Connection terminated.>§!"
 time_lifeline.783.desc:0 "Communication is cut off here. We can no longer contact the distress caller.\n\nShe has given up the hope of living and thrown herself into the black ocean."
 time_lifeline.783.a:0 "Pinning hope on miracles will yield no results."
 time_lifeline.783.b:0 "Regrettably, she was not favored by the gods."
 time_lifeline.783.c:0 "Choosing suicide is an act of cowardice."
 time_lifeline.783.d:0 "A maze without an exit is the greatest malice."
 time_lifeline.783.e:0 "If integrated into the Hive Mind, she would never give up easily."
 time_lifeline.783.f:0 "This is not the best ending."
 
 time_lifeline.790.desc:0 "We haven't received any communication from the original distress caller for a long time. The other party may have met with an accident.\n\nPerhaps the other party died of infection from old wounds, or was submerged by the black ocean in eternal sleep, or perhaps...\n\nThere are no perhaps. Time has no retreat; facts are established."
 time_lifeline.790.a:0 "$time_lifeline.300.a$"
 time_lifeline.790.b:0 "$time_lifeline.300.b$"
 time_lifeline.790.c:0 "Something must have gone wrong."
 time_lifeline.790.d:0 "$time_lifeline.300.d$"
 time_lifeline.790.e:0 "$time_lifeline.300.e$"
 
 ################################################################
 # Phase 4 (Time Ritual)
 ################################################################
 
 time_lifeline.800.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller participated in the sacrifice and walked into the mysterious machine.>§!"
 time_lifeline.800.a:0 "$time_lifeline.600.a$"
 time_lifeline.801.desc:0 "Damn it, I was tricked!\n\nAt first, that priest just followed me in, singing and dancing inside the machine, singing not too badly.\nLater, he was chanting words while performing dazzling operations on the console. It's unbelievable that a creature of the Stone Age could operate a machine so familiarly.\nWhen the priest stopped his movements, the machine made a ticking sound like a jumping pointer, and he left the machine immediately, leaving me alone.\n\nJust as I was about to follow him out, the machine's door suddenly closed by itself. At the same time, the entire machine began to spin.\nThe machine spun faster and faster. I felt the world turning upside down, my whole body felt like it was flying, floating lightly in mid-air.\nI seemed to have lost gravity, because I couldn't feel gravity's existence;\nI seemed to have lost myself, because I couldn't feel my own existence.\n\nI don't know when I passed out. When I woke up, the machine had stopped working."
 time_lifeline.801.a:0 "It seems you were the sacrifice in the ritual."
 time_lifeline.802.desc:0 "It was clearly you who persuaded me to go in that I trusted them boldly. Now you tell me I am a sacrifice...\n\nForget it, after all, you weren't there in person and couldn't fathom their intentions. I can't blame it all on you.\nIt's my fault for being too careless, falling for a bunch of prehistoric creatures' trap so easily.\nBut the ones to blame most are those people. One moment they respectfully regarded me as a divine messenger, the next they treated me as a sacrifice. Who could have thought this would happen!"
 time_lifeline.802.a:0 "Dwelling on this is useless. Is it safe outside the machine?"
 time_lifeline.803.desc:0 "After I woke up, I opened the machine's door and found the world outside was very different from before.\n\nNot only are those natives gone, but even the entire altar is missing!\nThe snow underneath turned into cracked earth, the sky overhead turned pitch black, and the air was filled with foul odors, as if various chemicals were mixed together and evaporated into gas.\nEven the mountain is covered in smog. I can't distinguish the situation at the foot of the mountain at all.\n\nI don't know how far the natives have gone. Maybe they are ambushing me nearby.\nAlthough I can try flying to avoid traps, the air quality is too poor and visibility is very low. It's hard to distinguish directions in the air. Better not take such rash actions.\nThere may be dangers lurking below the mountain, but staying on the mountain won't make any progress. What do you think I should do?"
 time_lifeline.803.a:0 "Staying in place solves nothing. Go down and take a look."
 time_lifeline.803.a.response:0 "Okay, I intend to do so too. I'll contact you when I get down the mountain."
 time_lifeline.803.b:0 "It's too dangerous down the mountain. Wait on the mountain for the smog to dissipate first."
 time_lifeline.803.b.response:0 "Indeed, no one knows what dangers lie below. Better wait until I can see the road ahead before acting."
 time_lifeline.804.desc:0 "What? Fly down?\n\nSmog is generally heavier, right? The air below might be even turbid...\nAnd I can't see the situation down the mountain clearly. Going down like this is too dangerous... cough cough...\n\nReally fly down?"
 time_lifeline.804.a:0 "Trust me, fly down!"
 time_lifeline.804.a.response:0 "Since you said so, then I'll take a chance and fly down!\n\n...cough cough...\nI'll contact you when I reach the foot of the mountain!"
 
 time_lifeline.805.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller was sacrificed by natives, found the world changed, and decided to wait for the smog to dissipate before acting.>§!"
 time_lifeline.805.a:0 "Has the smog dissipated?"
 time_lifeline.806.desc:0 "No, not yet... cough cough...\n\nI feel the air seems to have become more turbid, and the smell is worse. I have some difficulty breathing now.\nThe moon seems to be covered by dark clouds too, or maybe the smog is thicker. I can't see anything now. It's pitch black in front of me.\nI feel something is wrong. My situation is dangerous... cough cough...\n\nI can't stay in this fog forever. I must do something!"
 time_lifeline.806.a:0 "Fly up. Maybe you can escape the smog."
 time_lifeline.806.b:0 "Fly down. Maybe there is a glimmer of hope."
 time_lifeline.807.desc:0 "Okay, I'll fly up right away!\n...cough cough... What's happening? I feel the higher I fly, the thinner the air becomes, and the more pungent the smell gets.\n\nBreathing is getting harder. Bad news, maybe before long, I will suffocate and pass out.\nBut now... there is no turning back. I can only hope for the pure air that might exist... above the smog.\n\nI feel very tired, very tired...\nNo, can't fall asleep at this time, but...\nI'm so tired, eyes are... going to close..."
 time_lifeline.807.a:0 "Hang in there!"
 time_lifeline.808.desc:0 "Mm... I can do it, can't sleep...\n\nWait a minute, I... I saw a light. That must be the exit!\nDon't sleep... just a little more, just a little more...\n\n...Almost there..."
 time_lifeline.808.a:0 "Keep flying up!"
 time_lifeline.808.a.response:0 "No, that's not light, that's...\n\n(Thunderclap)\n\n§R<Connection terminated.>§!"
 time_lifeline.809.desc:0 "Communication is cut off here. We can no longer contact the distress caller.\n\nThe fatal lightning was mistaken by her as the light of survival... perhaps we were that lightning."
 time_lifeline.809.a:0 "We wanted to help her, but killed her..."
 time_lifeline.809.b:0 "It's not like we killed her with our own hands. We don't need to feel guilty."
 time_lifeline.809.c:0 "That was not divine salvation, but a devil's trap."
 time_lifeline.809.d:0 "My people will not resent me for sacrifice."
 time_lifeline.809.e:0 "She should have received proper care from us."
 time_lifeline.809.f:0 "Giving people hope, then giving them despair..."
 
 time_lifeline.810.desc.1:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller was sacrificed by natives, found the world changed, and decided to go down the mountain to check the situation.>§!"
 time_lifeline.810.desc.2:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The smog is getting worse. The distress caller felt in danger and decided to go down the mountain to escape the smog.>§!"
 time_lifeline.810.a:0 "Was the journey smooth?"
 time_lifeline.810.b:0 "Have you reached the foot of the mountain?"
 time_lifeline.811.desc.1:0 "Mm, unimpeded.\nAlthough I couldn't see the road clearly, I didn't encounter any ambush or any accident. I arrived at the foot of the mountain very smoothly.\n\nAt first I was worried something would happen, but it turned out I was making a fuss over nothing.$time_lifeline.811.desc.same$"
 time_lifeline.811.desc.2:0 "Barely reached the foot of the mountain.\nBecause it was dark all around, I couldn't see obstacles clearly while going down the mountain. I bumped into the branches of several trees on the way.\nFortunately I have a protective suit. I wasn't hurt too seriously.\n\nI thought there would be native ambushes along the way, but it turned out I was making a fuss over nothing.$time_lifeline.811.desc.same$"
 time_lifeline.811.desc.same:0 "\nAnd the further down the mountain I went, the fresher the air felt, and the thinner the fog became. Although there is still considerable influence, it is much better than the mountaintop.\n\nI think the density of this smog should be lower than air, so the smog gathers at the top of the mountain.\nBut why? Why is smog lighter than air?"
 time_lifeline.811.a:0 "Think from another angle. Maybe it's \"Why is air heavier than smog?\""
 time_lifeline.812.desc:0 "Air is heavier than smog?\n\nCould it be that the formation reason of this smog is not what was \"mixed\" into the air, but what was \"stripped\" from the air?\nIs it because the air lacks some high-density substance that lighter smog forms?\nTo be more imaginative, maybe what was \"stripped\" is not some substance, but some property?\nNo, I can't figure out the situation at all. Better not think about these things first.\n\nThe important thing now lies in what I should do next."
 time_lifeline.812.a:0 "Do you have any plans?"
 time_lifeline.813.desc:0 "What I want to do most right now is hurry back to the ship, but the ship hasn't been fixed. Even if I return to the ship, I can't leave this planet.\n\nLet me think. There are several choices currently:\nGo to the lake, continue looking for materials;\nGo to the desert, perhaps there will be usable supplies;\nReturn to the summit, dismantle that machine, maybe gain new discoveries.\n\nWhat should I do?"
 time_lifeline.813.desc.same:0 "Although I have always followed your choices, I feel this idea is not very good.\n\n"
 time_lifeline.813.desc.a:0 "$time_lifeline.813.desc.same$Those natives who deceived me might be in the tribe by the lake right now. If I approach rashly, maybe they will discover I'm still alive and attack me.\nI'm not a professional combatant. Even if it's just a Stone Age civilization, it's hard for me to fight against an entire tribe alone."
 time_lifeline.813.desc.b:0 "$time_lifeline.813.desc.same$Although the air is better now, it is still turbid and pungent. The situation in the desert is probably not good, maybe even worse.\nAnd it is dark now. In case a sandstorm rises in the desert, it's hard for me to find the direction to escape. Still too dangerous."
 time_lifeline.813.desc.c:0 "$time_lifeline.813.desc.same$I just walked down from the mountain, and now climbing back up is really too tiring.\nAnd we just discussed it, the density of this smog is lower than air. Now the mountaintop might be full of smog. Staying in it for a long time might lead to suffocation."
 time_lifeline.813.a:0 "Go to the lake."
 time_lifeline.813.b:0 "Go to the desert."
 time_lifeline.813.c:0 "Return to the summit."
 time_lifeline.813.d:0 "Then... go to the forest."
 time_lifeline.814.desc:0 "Forest?\nWait, you mean the forest south of the ship?\n\nRight, how could I forget that forest.\nI found some usable materials in the forest before, only suddenly attacked by monsters, failing to bring them back to the ship.\nBut speaking of monsters, what if there are still monsters in that forest?\nBut so much time has passed now, maybe those monsters have left. And the forest is so big, the probability of encountering that group of monsters isn't very high.\n\nThen it's decided. Go to the forest. Maybe I can find the materials I left behind before."
 time_lifeline.814.a:0 "But aren't those monsters more dangerous than the natives?"
 time_lifeline.814.a.response:0 "Okay, the danger of those monsters is indeed higher than the natives by the lake, but the roots and tentacles of those fungal creatures are really too scary, even exceeding my fear of the black monsters!\n\nI really don't know how to deal with those guys. The monsters in the forest that won't move if I don't move are much easier to handle.\nSo that's it. See you in the forest."
 
 time_lifeline.820.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller discovered that smog seemed lighter than air, then decided to go to the forest to find materials to repair the ship.>§!\n§E<Record Note: Compared to monsters, the distress caller is more afraid of the natives' roots and tentacles. You shouldn't have any inappropriate imagination.>§!"
 time_lifeline.820.a:0 "Arrived at the forest? Did you encounter those monsters?"
 time_lifeline.821.desc:0 "No, I discovered something else.\n\nBecause the forest is in the south, I planned to check the ship's condition before flying to the forest, and ended up with a startling discovery.\nThe ship originally crash-landed on flat ground, but that area is now full of towering buildings, and the ship is nowhere to be found.\n\nThis seems to be an industrial ruin. Various buildings contain various machines. There are even unremoved products on the assembly lines.\nThe paint on the walls has started to peel off, and the metal casings of the machines are fully rusted.\nI can't find any signs of intelligent life. This place seems to have been abandoned for a long time.\n\nI'm certain I haven't seen these buildings before. I plan to go in and take a look."
 time_lifeline.821.a:0 "Isn't it dangerous to enter rashly?"
 time_lifeline.822.desc:0 "Although it is indeed weird here, I didn't feel any potential danger.\nMoreover, even if any accident happens, I will use the flight device to avoid it immediately.\n\nThere should be many metal materials in these ruins. They might be used as materials to repair the ship, though I haven't even found the ship yet.\nBesides, I am very interested in the significance of these factories. What exactly are they used to produce?\nDid that Stone Age fungal tribe build these factories? How did they do it?\n\nThis place is full of mysteries."
 time_lifeline.822.a:0 "Then go in and look. Stay safe."
 time_lifeline.822.a.response:0 "Okay, if I discover anything, I'll contact you."
 
 time_lifeline.830.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller discovered an industrial ruin and decided to enter and explore.>§!"
 time_lifeline.830.a:0 "Find anything?"
 time_lifeline.831.desc:0 "Mm, I gained a lot!\n\nI circled the periphery first and found that the area covered by this region is much larger than I thought.\nThe arrangement of buildings is orderly, and the aisles between them extend in all directions.\nWorkshops, storage tanks, storehouses, diversion rooms, laboratories, security departments, command headquarters, recycling stations, watchtowers and other facilities are all available. The configuration of pipelines, trucks, small spaceships and other transport tools is complete everywhere.\n\nAnalyzing based on the scale of these ruins, this might have been an important core industrial zone."
 time_lifeline.831.a:0 "Then what does it produce?"
 time_lifeline.832.desc:0 "This... I'm not sure yet.\n\nI explored some workshops and checked some storehouses. Things produced in different areas are different. I don't know if it's division of labor or independent.\nLet me think. There are those producing metal plates, reactors, engines, gears, reagents, and crystals. It's really hard to imagine what exactly it is used for.\n\nHowever, considering this industrial zone is guarded by various heavy weapons, I think this might be some military restricted area, specialized in producing war weapons."
 time_lifeline.832.a:0 "Any other discoveries?"
 time_lifeline.833.desc:0 "Of course, just now, I found a text marking on all buildings.\n\nThis building says \"§H11025.1.8§!\", this one is \"§H11025.1.9§!\", this one is \"§H11025.1.10§!\".\nWhen I got to this area, it says things like \"§H11024.12.5§!\", \"§H11024.12.4§!\", \"§H11024.12.3§!\".\n\nIs this mark, which looks like a date, representing the time the building was built?\nNo, I haven't seen buildings with the same number. This civilization shouldn't deliberately build adjacent buildings on adjacent dates, right?\nThere seems to be some pattern between them. Using dates to explain it is really a bit far-fetched..."
 time_lifeline.833.a:0 "Could this be a building number?"
 time_lifeline.834.desc:0 "Building number?\nRight, that makes sense!\n\nMaybe this civilization numbered buildings in different areas to manage and allocate.\nBut these numbers are interesting. Except for the first five digits, the numbers behind are at most \"12\". Does \"12\" have any special meaning?\n\nI can't find the answer to the question yet, but continuing to explore these ruins might lead to new discoveries."
 time_lifeline.834.a:0 "I await your good news."
 time_lifeline.834.a.response:0 "Okay, I should contact you again very soon."
 
 time_lifeline.840.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller roughly understood the situation of the industrial ruins and prepared to explore deeper.>§!"
 time_lifeline.840.a:0 "Made any new progress?"
 time_lifeline.841.desc:0 "I was still concerned about those crystals in the factory, so I investigated them carefully again.\n\nThese crystals are very special, sometimes very light, sometimes very heavy. Their mass seems to be changing ceaselessly.\nThe frequency of these crystals absorbing light is also not fixed, which leads to them always showing different colors, and easy to cause cognitive misunderstanding.\nIn fact, these crystals themselves are very likely colorless.\n\nNot only that, but I can feel weak time flow from them. Based on my past experience, these crystals might be §HTime Crystals§!, just semi-finished products."
 time_lifeline.841.a:0 "$time_lifeline.611.a$"
 time_lifeline.841.a.response:0 "$time_lifeline.611.a.response$"
 time_lifeline.841.b:0 "Why do you know so much about §HTime Crystals§!?"
 time_lifeline.842.desc:0 "Because I am a §HTime Traveler§!.\nJust kidding. It's just that I experienced a lot in the past and happened to know something about it.\n\nBut what is certain is that to synthesize these crystals artificially, Stone Age technology alone is far from enough.\nThese factories couldn't be built by that fungal tribe, but probably built by some extremely advanced civilization.\n\nOnly that civilization might have perished long ago."
 time_lifeline.842.a:0 "Even the most brilliant civilization has a day to take a bow."
 time_lifeline.843.desc:0 "Although I really want to know why this civilization could manufacture so many semi-finished §HTime Crystals§!, I have an even more important discovery-\nThere is an intact ship here.\n\nAnd I checked it. All its functions can operate normally. Although fuel is not much, it is enough to last for a long time.\nThis means I can finally leave this planet!\n\nBut before leaving, I want to explore this planet a bit more. After all, there are still many mysteries I haven't solved."
 time_lifeline.843.a:0 "Then explore to your heart's content. Questions await your answers."
 time_lifeline.843.a.response:0 "With your support, I'm relieved!"
 time_lifeline.843.b:0 "This planet has too many unknown dangers. Better not take risks."
 time_lifeline.844.desc:0 "Indeed, this planet is riddled with crises. Better hurry up and leave.\nAfter all, not all mysteries need an answer. Some results and truths will only cause regret instead. $time_lifeline.844.desc.same$"
 time_lifeline.844.desc.same:0 "\n\nSoon, I will sail into the vast space.\nI have a premonition that the connection between us is limited to this planet. By then, we may not be able to continue communicating.\n\nThis might be the last communication between us.\nBut I believe that in the endless future, we will definitely meet again."
 time_lifeline.844.a:0 "$time_lifeline.638.a$"
 time_lifeline.844.a.response:0 "$time_lifeline.638.a.response$"
 
 time_lifeline.850.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller discovered semi-finished time crystals and an intact ship, and decided to explore the planet for a while longer.>§!\n§E<Record Note: The distress caller claims to be a time traveler, but it seems to be just a joke.>§!"
 time_lifeline.850.a:0 "Did you find the answer to the question?"
 time_lifeline.851.desc:0 "Because I discovered semi-finished §HTime Crystals§! before, I thought of something and decided to go back to the peak.\n\nBecause I specially took oxygen supply equipment from the ship, I reached the summit very smoothly. That machine also stayed in place untouched.\nAfter some investigation, just as I expected, this machine is actually a §HTime Machine§!.\n\nThe natives' sacrifice was probably to offer me to time, and that priest likely adjusted the machine's settings, sending me to another timeline."
 time_lifeline.851.a:0 "Then exactly which year are you in now?"
 time_lifeline.852.desc:0 "To determine the specific year might be somewhat difficult, but if it's just judging whether I am in the past or future, there is a way to confirm.\n\nI think this timeline does not have that fungal civilization, so I went to the lake to find answers with peace of mind.\nThere, the place that was originally stone houses is filled with skyscrapers, and the lake is dyed a turbid black, but these won't affect my judgment.\n\nWhen visiting the fungal tribe initially, I secretly buried a capsule storing radioactive material in the ground.\nDon't worry, inside is just a special isotope harmless to biology and the environment. I am used to relying on it to judge the chronological order of timelines."
 time_lifeline.852.a:0 "\"Used to\"? Do you do this kind of thing often?"
 time_lifeline.853.desc:0 "Indeed so, after all, I am a §HTime Traveler§!. I'm not joking this time.\n\nSince I often travel between different timelines, there must be a relatively stable way to judge time.\nTherefore, I buried the capsule deliberately before. Now I came to the original place to detect the content of that radioactive material, and finally found the content is zero.\n\nThe half-life of this element is very long. For the material in the capsule to decay completely, it takes millions of years.\nIndeed, it is possible that I was transported to millions of years later, or my capsule was taken away by others midway. These would interfere with my judgment.\nBut I think the greater possibility is that I am now in a timeline before burying the capsule.\n\nIn other words, I was brought back to the past by the §HTime Machine§!."
 time_lifeline.853.a:0 "Sounds too unbelievable."
 time_lifeline.854.desc:0 "§HSpacetime Travel§! is a common trope in sci-fi novels, but many people just treat it as content that only happens in sci-fi novels.\nI know this kind of thing is hard to convince people of, so I haven't mentioned it before.\nBut, please believe me. Accept what I said, so you can better understand all this.\n\nRemember that \"§HOuroboros§!\" mark?\nNot only on the altar walls, but also on the casing of that §HTime Machine§!, and on the walls of the industrial ruins discovered earlier, there is this mark.\nIf we link them together, maybe everything will make sense.\n\nIf you believe me, can you listen to my guess?"
 time_lifeline.854.a:0 "I believe you. Go ahead."
 time_lifeline.855.desc:0 "At first, there was a civilization on this planet that gradually prospered, but they suddenly worshipped a mysterious Snake God.\nThis Snake God seems to govern time and cycles. Therefore, this civilization attempted to synthesize §HTime Crystals§! artificially to honor the Snake God.\n\nBut good times didn't last long. Because of some sudden change, maybe a massive war, maybe the worsening planetary environment, this civilization didn't make it.\nThe plan to mass-produce §HTime Crystals§! ended in failure. Although a large number of semi-finished products were manufactured, a few finished products still succeeded.\nIt was exactly these few finished products, genuine §HTime Machines§! were invented, but at the same time, this civilization perished.\n\nUnknown years later, a new civilization developed on this planet, which is that Stone Age fungal tribe.\nBy chance, this tribe discovered the legacy of the ancient civilization-that §HTime Machine§!.\nThis discovery made them jump for joy. They regarded this machine as a gift from the gods, moved it up the mountain, and built an altar to protect it.\nThe §HOuroboros§! pattern on the machine was also regarded by them as the portrait of the god, and they worshipped this Snake God fervently.\n\nTime is a ring. The history of the past civilization may repeat itself."
 time_lifeline.855.a:0 "If returning to the past, can this long-declined civilization be saved?"
 time_lifeline.856.desc:0 "Time is a ring. If just changing an individual's future, it is still possible, but wanting to change a civilization's history is probably very difficult.\n\nThere is not just one cycle of time, but multiple exist simultaneously, possibly parallel, possibly crossing, or even forming new cycles after crossing.\nTime is not a one-way street, but a crossroads.\nEvery choice of ours has a great impact on ourselves, but every choice has a very small impact on all selves, because right now, there are countless selves standing at the crossroads making their own choices.\nIf changing an individual's future is so difficult, what about a civilization?\n\nThere are countless individuals in a civilization. The countless cycles created by these countless individuals intertwine with each other and form countless new cycles.\nA civilization's cycle is created jointly by countless individuals within it. Just changing part of the small cycles may not change the overall cycle, or may cause the cycle to head towards an unexpected result due to other individuals' choices.\n\nThis is the so-called inevitability of history. This is the so-called causality of time."
 time_lifeline.856.a:0 "For the first time, I realize how small I am."
 time_lifeline.857.desc:0 "No need to be so pessimistic. After all, even for impossible things, the probability is not zero.\nAs long as it is not zero, there is still a chance of possibility.\n\nEven if the things we want to do are difficult, if we give up because of it, \"possible\" will turn into \"impossible\".\nEven if we cannot change the civilization's cycle directly, at least we can try to change our own cycle.\nUnder the joint action of countless us, maybe we really have the possibility to pry the wheels of history and change the civilization's cycle.\n\nAfter all, future, future. Only the uncertain is the future.\nEven though we may not be able to change the past, we can create the future, our own future."
 time_lifeline.857.a:0 "I was supposed to help you, but was comforted by you instead."
 time_lifeline.858.desc:0 "The decline of civilization is indeed regrettable, but a civilization reborn on ruins is also a miracle.\n\nAlthough they deceived me, I don't blame them. Maybe for them, experiencing the ritual of time personally is the greatest honor.\nThis civilization will sprout on this land again, and we also have things we should do ourselves. $time_lifeline.647.desc.same$"
 time_lifeline.858.a:0 "$time_lifeline.647.a$"
 time_lifeline.858.a.response:0 "(The other party sang a soft song. It is a lullaby dedicated to the departed.)"
 
 time_lifeline.860.desc:0 "We haven't received any communication from the original distress caller for a long time. The other party may have met with an accident.\n\nPerhaps the other party fell into a trap in the ruins, or perhaps the other party was attacked by lurking monsters, or perhaps...\n\nThere are no perhaps. Time has no retreat; facts are established."
 time_lifeline.860.a:0 "$time_lifeline.650.a$"
 time_lifeline.860.b:0 "$time_lifeline.300.b$"
 time_lifeline.860.c:0 "Curiosity killed the cat."
 time_lifeline.860.d:0 "$time_lifeline.300.d$"
 time_lifeline.860.e:0 "$time_lifeline.300.e$"
 
 ################################################################
 # Phase 4 (Mystery of the Mirror)
 ################################################################
 
 time_lifeline.900.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller used the flight device to escape the sacrifice and prepared to return to the ship.>§!"
 time_lifeline.900.a:0 "$time_lifeline.600.a$"
 time_lifeline.901.desc:0 "Phew, scared me to death. Luckily I escaped.\n\nWhen I flew out on the flight device, the natives were surprised, but they reacted quickly.\nBut I had already flown out of the altar. Only their roars came from behind.\n\nNow I have returned to where the ship crash-landed, but...\nSomething happened."
 time_lifeline.901.a:0 "What happened?"
 time_lifeline.902.desc:0 "My ship is gone!\n\nI am very sure my ship suffered severe damage. It is impossible for a Stone Age civilization to repair it, so it's impossible for those fungal creatures to drive it away.\nAnd, not only the ship, even the impact crater disappeared.\nThere is only a flat ground here, absolutely no trace of the ship's impact. The fungal tribe here alone cannot cover it up.\n\nEverything I encountered so far is too strange to be explained by common sense."
 time_lifeline.902.a:0 "Simply like being in another world."
 time_lifeline.903.desc:0 "Another world?\nYou inspired me. Maybe there is really this possibility!\n\nThink about it, how many things different from before have happened along the way?\nPushing back from the timeline, I found the ship and impact crater missing now. This is the first difference.\nFurther back, before participating in the ritual, I noticed the vegetation types changed, and the snow on the summit was replaced by green plants. This is the second difference.\nAnd why did I go to the summit? That was due to the guidance of the local fungal civilization, and this tribe previously had only one stone house. This is the third difference.\nFinally back to the beginning of everything, I woke up on the water surface and found the sky emitting peculiar light. This is the fourth difference.\n\nAt that time I couldn't distinguish reality from fantasy, and suspected for a moment that I went to heaven, but in reality, I indeed went to another world, but it is neither a dream nor heaven.\nIn other words, since I woke up, I was no longer on the original planet, but arrived at a similar yet different new world."
 time_lifeline.903.a:0 "The root of everything might be that lake."
 time_lifeline.904.desc:0 "Yes, correct. I must have appeared here in an unconscious state after being submerged by water.\n\nSince the culprit is found, next I need to investigate that lake properly. Maybe I can discover some bizarre truth."
 time_lifeline.904.a:0 "Stay safe. Watch out for the fungal tribe by the lake."
 time_lifeline.904.a.response:0 "I fly very fast. They shouldn't have time to return to the tribe yet. Now is the best time.\nSee you in a bit. If I encounter any accident, I will contact you immediately too."
 
 time_lifeline.910.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller found the ship and impact crater missing, and is going to the lake to find the truth.>§!\n§E<Record Note: The distress caller thinks she is in another world, worth noting.>§!"
 time_lifeline.910.a:0 "Arrived at the lake?"
 time_lifeline.911.desc:0 "Mm, relying on the flight device, I quickly returned here.\n\nThere seems to be no one in the tribe. It seems all tribe members participated in that sacrifice, and are currently still on the way down the mountain.\nIf I want to investigate the tribe, I'd better act quickly. After all, I don't know when they will return.\nHowever, I feel the lake water is the core of the entire mystery. Prioritizing investigating it is also a good choice.\n\nThere must be an order to things. You decide."
 time_lifeline.911.a:0 "No time to lose. Investigate the tribe right now."
 time_lifeline.911.a.response:0 "You are right. If I investigate later, maybe it will be too late.\nWait for my news."
 time_lifeline.911.b:0 "There may not be valuable clues in the tribe. Prioritize investigating the lake water."
 time_lifeline.911.b.response:0 "After all, it's just a Stone Age civilization. Not necessarily hiding any special secrets. The lake is the urgent task at the moment.\nWait for my news."
 
 time_lifeline.920.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller arrived at the lake and decided to prioritize investigating the tribe.>§!"
 time_lifeline.920.a:0 "Any discoveries in the tribe?"
 time_lifeline.921.desc:0 "Nothing for now.\n\nThis seems to be a very ordinary tribe, as if everything indicates: the Stone Age should be like this.\nSpeaking of strange places, it is that the materials for building houses are too smooth. Do they really have the ability to achieve this degree?\nThe stone furniture in the house is the same, as if finely processed, with absolutely no trace of manual grinding visible.\n\nThe simplicity of this tribe might be just a facade. There might be earth-shattering secrets hidden underneath."
 time_lifeline.921.a:0 "Maybe they are not just a stone civilization."
 time_lifeline.922.desc:0 "Right, I found this in the stone house that seems to be the leader's dwelling.\n\nOn the main wall of this suspected reception room, a mysterious and abstract mural is carved.\nLet me see, hmm... it seems to record a story.\n\nThe environment here seems very harsh. Fire rain falls from the sky, the ground cracks, and scorching lava gushes out.\nIn such a perilous place, hurricanes and tsunamis chase a group of fleeing lives, but they don't look like those fungal natives.\nThese lives have been driven to desperation. In desperation, they jumped into the water one after another to escape the disaster.\nWhen they surfaced, the world seemed to have returned to normal, very peaceful.\n\nThe mural ends here. Not only is this inexplicable story strange, but there is another strange point.\nThat is the last part of the mural. The content here is drawn upside down. I don't know if it is due to a mistake or the drawer's intentional act."
 time_lifeline.922.a:0 "Seems impossible to interpret valuable information from it."
 time_lifeline.922.a.response:0 "I thought so too. What a pity, wasted precious time again.\nNow, I have to hurry to investigate the lake water. Wait for my contact."
 
 time_lifeline.930.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: After investigating the tribe, the distress caller planned to investigate the lake water as soon as possible.>§!"
 time_lifeline.930.a:0 "$time_lifeline.940.a$"
 time_lifeline.931.desc:0 "I think there shouldn't be anything worth noting.\n\nDuring this time, I have been thinking about that mural, the one found in the leader's dwelling earlier.\nI always feel there is some important information hidden in that story, only we haven't found it temporarily.\nOr rather, temporarily unable to find."
 time_lifeline.931.a:0 "You mean the refugee lives jumping into the water?"
 time_lifeline.932.desc:0 "No, finding the world changed greatly after jumping into the water, I certainly noticed that.\nAfter all, this point is very similar to my current experience.\n\nAccording to the information on the mural, I think the water they jumped into refers to this lake.\nSo, if I jump into the lake again, maybe I can return to the original world.\nHowever, I am more concerned about the last part. Why is that part drawn upside down?\n\nBut thinking about these now won't yield results. Better verify the existing guess first to see if I can return to the previous world through this lake water."
 time_lifeline.932.a:0 "Although very dangerous, it's the only way."
 time_lifeline.932.a.response:0 "Don't worry, I won't die so easily.\nI will definitely, definitely contact you again!"
 
 time_lifeline.940.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller arrived at the lake and decided to prioritize investigating the lake water.>§!"
 time_lifeline.940.a:0 "Is there any secret in the lake water?"
 time_lifeline.941.desc:0 "Mm, I seem to have an amazing discovery!\n\nI activated my Casting Unit and carefully analyzed the composition and properties of this lake water, finding that there seems to be a very special substance in the lake water.\nAlthough this substance is hard to detect, after some effort, I successfully tested some of its properties.\n\nStrictly speaking, this substance should be a particle. It absorbs almost all light rays, so its existence can only be \"seen\" indirectly.\nMoreover, various physical and chemical properties of this particle change irregularly over time, but it is precisely this peculiar change that helped me lock onto this particle.\n\nIn addition, this particle has an unbelievable characteristic-its mass is negative!"
 time_lifeline.941.a:0 "Casting Unit?"
 time_lifeline.941.a.response:0 "Casting Unit is my flight device.\nOf course, it doesn't only have the function of flying. It is actually a multi-functional composite special tool.\n\nIt takes too much effort to explain carefully. Let's talk about it when there is a chance later.\nThe important thing now is-the mass of this particle is negative!"
 time_lifeline.941.b:0 "Negative mass?"
 time_lifeline.942.desc:0 "Correct. At first I couldn't believe it either, but I checked my Casting Unit and experimental steps carefully. I can confirm this conclusion is correct.\n\nIn other words, if this particle is mixed into a normal substance, the density of the entire substance will decrease instead, and the mass will also decrease, as if part of the mass was \"stripped\" by this particle.\nIn addition, due to its light absorption, the color of the substance mixed with this particle will also become \"deeper\", and the color of this particle itself might be defined as \"black\".\n\nSuch a peculiar particle must have a unique name, right?\nBased on its characteristics, let me think... let's call it \"§HInverse Phase Particle§!\"."
 time_lifeline.942.a:0 "Sounds weird."
 time_lifeline.942.a.response:0 "Hehe, I feel it's weird too, but this particle itself is weird.\nThe lake water investigation ends here for now. I plan to investigate the tribe quickly before they come back. Maybe there will be new discoveries.\n\nWait for my contact."
 
 time_lifeline.950.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: After investigating the lake water, the distress caller planned to take the opportunity to investigate the tribe.>§!"
 time_lifeline.950.a:0 "$time_lifeline.920.a$"
 time_lifeline.951.desc:0 "No, before I could discover anything, the natives came back.\n\nThey raised their weapons as soon as they saw me and tried to attack me. I had to dodge hastily.\nSome people held catching nets guarding against me. Once I fly up, they will throw catching nets to trap me.\nAnd the trees here are very tall. Intricate branches will also affect my flight.\nTherefore, I can only run on foot, shuttling between houses to avoid their pursuit.\n\nBut they were many, and I was unfamiliar with the terrain. Eventually, I was surrounded by them."
 time_lifeline.951.a:0 "Can you try to negotiate with them?"
 time_lifeline.952.desc:0 "No, they came fiercely. It looks like they won't let me go easily.\n\nThey seem fearful of the Casting Unit in my hand and dare not act rashly.\nBut the encirclement is gradually shrinking. I have nowhere to run."
 time_lifeline.952.a:0 "Give it a shot, try to fly out!"
 time_lifeline.953.desc.same:0 "Correct, even if they are prepared, this is my last chance.\n\nHeave-ho, get-out-of-the-way-\n(Sharp wind sound)\nPhew!\n(Noisy roars)\nClose one!\n(Sound of bowstring releasing)\nOuch, that hurts!\n\n"
 time_lifeline.953.desc.1:0 "$time_lifeline.953.desc.same$Bad news, I was hit by an arrow. Fortunately, it didn't hit a vital part. I can still persist.\nAh, almost got hit again. That was close.\nThe exit of the forest is ahead. I can escape their pursuit soon.\n\nOkay, out!"
 time_lifeline.953.desc.2:0 "$time_lifeline.953.desc.same$Bad news, I was hit by an arrow. Although it didn't hit a vital part, the injury I suffered before opened up because of this...\nAh, hit again. No!\nAh, so painful!\n(Violent impact sound)\n\nDamn it, the wound hurts too much, causing me to hit a tree, and then I fell...\nIt's too late. They surrounded me again. I'm totally unable to get out now..."
 time_lifeline.953.a:0 "Jump into the lake quickly!"
 time_lifeline.953.a.response:0 "Mm, this is the best way. Not only can I evade pursuers, but I can also verify my previous guess.\nYou must wait for me. I will definitely survive and contact you!"
 time_lifeline.953.b:0 "Is there any other way?"
 time_lifeline.953.b.response:0 "I'm afraid not. Due to the impact just now, my Casting Unit is severely damaged again. Now I don't even have the means of self-defense...\n\nHey, don't come near me. Stay away from me!\nWhat exactly do you want to do?\nLet go of me!\n\n§R<Connection terminated.>§!"
 time_lifeline.954.desc:0 "Communication is cut off here. We can no longer contact the distress caller.\n\nShe escaped from the terrible sacrifice, but couldn't escape the fate of becoming a sacrifice."
 time_lifeline.954.a:0 "She couldn't escape the inevitability of time."
 time_lifeline.954.b:0 "Once again, the ritual begins."
 time_lifeline.954.c:0 "If she were strong enough, she could surely break this farce."
 time_lifeline.954.d:0 "Sure enough, alien customs are both backward and dangerous."
 time_lifeline.954.e:0 "Why waste life on such a meaningless ritual?"
 time_lifeline.954.f:0 "Absurd history repeats itself once again."
 
 time_lifeline.960.desc.1:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller shook off the pursuit and decided to jump into the lake water to verify the guess.>§!"
 time_lifeline.960.desc.2:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller decided to jump into the water, attempting to return to the original world.>§!"
 time_lifeline.960.a:0 "Returned to the original world?"
 time_lifeline.961.desc:0 "Should have returned. The sky color is normal black, and the distant morning sun is rising slowly.\nAlthough the surroundings are very cold, seeing this scene, I still feel warm inside.\n\nBy the way, I remember it hailed before I fell into the lake for the first time, so it is colder here than the other world, right? This verifies my guess again.\nNow, I am floating on the water surface, soaked all over. To avoid hypothermia, I must get back to the shore quickly."
 time_lifeline.961.a:0 "After you jumped into the lake water, did you have any special feelings?"
 time_lifeline.962.desc:0 "Special feelings?\nIndeed there were.\n\nThe first time, because I was completely unprepared, I panicked after being submerged and didn't notice this abnormality.\nBut this time I came prepared. After jumping into the water, I felt something invisible seeping into my body. Then I felt very relaxed and passed out unknowingly.\n\nAfter waking up again, I am what I am now, similar to the situation when I woke up the first time."
 time_lifeline.962.a:0 "What do you plan to do next?"
 time_lifeline.963.desc.1:0 "After I fly back to the shore, I plan to light a bonfire first to dry my clothes and warm up my body.\nRight, the arrow wound needs to be treated too. It would be bad if it gets infected. $time_lifeline.963.desc.same$"
 time_lifeline.963.desc.2:0 "After I fly back to the shore, I plan to light a bonfire first to dry my clothes and warm up my body. $time_lifeline.963.desc.same$"
 time_lifeline.963.desc.same:0 "\nAfter resting, I plan to re-check the ship's condition and confirm again that I am indeed back.\n\nAfter that, I plan to go to the summit. Although that happened in another world, maybe there is also that machine in this world.\nI will dismantle that machine. The obtained materials should be usable to repair the ship.\nAnd if there is a chance, I also want to study the structure and function of that machine.\n\nBut the weather and environment of this world seem much harsher than the other world. I wonder if I will encounter any accidents on the way. I am a bit uneasy."
 time_lifeline.963.a:0 "Don't worry. Contact me immediately if you encounter danger."
 time_lifeline.963.a.response:0 "Mm, your words reassure me a lot.\nI have to continue working hard too. If I do nothing because of fear, no problem can be solved.\nNext, I will act according to plan. We'll contact later."
 
 time_lifeline.970.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller returned to the original world and prepared to act according to her own plan.>§!"
 time_lifeline.970.a:0 "Any abnormal situations?"
 time_lifeline.971.desc:0 "Although I encountered bad weather several times on the way, I found safe places in time to avoid danger.\nApart from that, the journey was fairly smooth. After all, I have a flight device. I arrived at the destination without spending much time.\n\nI first returned to where the ship crash-landed. The ship stayed in place safe and sound, and the damage condition didn't worsen. It seems this area didn't suffer any special environmental hazards.\nSubsequently, I went to the summit, where I saw the same white altar, only the outside of the altar was covered by white snow, looking like it merged into one.\n\nJust as I expected, an identical machine is placed in the altar, with the §HOuroboros§! pattern on it too."
 time_lifeline.971.a:0 "Did you investigate this machine?"
 time_lifeline.972.desc:0 "Of course I investigated it. To be exact, I investigated while dismantling.\n\nWhen dismantling the machine, I found a very interesting thing, and I can probably guess the use of this machine and what that so-called ritual was about.\nBut it probably has little to do with the mystery of this planet. Just count it as my personal unexpected gain.\nHowever, the structure of this machine is very ingenious. I can send you some specific details. It should be of great help to your country. This counts as my little gratitude.\n\nDismantling this machine did yield a lot of useful supplies. With them, I can attempt to repair the ship.\nJust now, I finally moved the needed materials back to the ship. I can start repairing soon. Hope everything goes smoothly."
 time_lifeline.972.a:0 "What do you think about that lake?"
 time_lifeline.973.desc:0 "Based on the information collected now alone, I have no clue for the time being.\n\nThe only thing that can be determined currently is that this lake connects two similar yet different worlds.\nAs for anything else, anything is possible. I am not sure which conjecture is more logical.\n\nBetter wait until I finish repairing the ship to consider these. During the repair process, I will also organize the existing clues properly."
 time_lifeline.973.a:0 "I will also think about this problem."
 time_lifeline.973.a.response:0 "Okay, I should be able to fix the ship very soon. Then see you in a bit."
 
 time_lifeline.980.desc:0 "$time_lifeline.2.desc$\n\n§E<Historical Record: The distress caller repaired the ship with materials obtained from dismantling the mysterious machine, and simultaneously thought about the secrets under the lake water.>§!\n§E<Record Note: She seems to have discovered something from the machine but concealed it intentionally.>§!"
 time_lifeline.980.a:0 "Is the ship fixed?"
 time_lifeline.981.desc:0 "Yes, the repair work was completed very smoothly, even simpler than I expected.\n\nNot only that, regarding this lake, I also have a bold conjecture."
 time_lifeline.981.a:0 "Tell me about it."
 time_lifeline.982.desc:0 "Remember that mural I found before?\nI've always been concerned about the last part of the painting, that is, the upside-down part. I think I should understand what that represents now.\n\nDrawing the last part upside down is not because of a mistake or coincidence, but the drawer's intentional act, or rather, this is just the truth objectively recorded by the drawer.\nWhat this lake connects are actually two upside-down worlds. I didn't go to another planet through the lake water, but passed through the crust using the lake water!"
 time_lifeline.982.a:0 "Passed through the crust... could there be a world underground?"
 time_lifeline.983.desc:0 "Correct. The next question is to judge which is the underground world.\n\nBecause my ship crash-landed in this world, this original world is the surface world of the planet.\nThen the other world can only be the world inside the planet's crust, that is, that underground world.\nWhen I woke up on the lake surface for the first time, the sky I saw was pink, but actually that was not the sky, but the mantle or core of this planet.\n\nThe environment of the planet's surface world is terrible. Therefore, the civilization on this planet built an underground world and lived in this paradise.\nThis is the final answer to the biggest mystery on this planet."
 time_lifeline.983.a:0 "This is too unbelievable. How did they achieve all this?"
 time_lifeline.984.desc:0 "Although I don't know how they did it, their technological level must be very high, able to place anti-gravity devices in the thin crust to reverse gravity in the underground world.\nAnd that fungal civilization I encountered before might be the descendants of this advanced civilization, only declined for some reason.\n\nI think, although it is absurd, my conjecture won't be wrong. That mural is the best evidence."
 time_lifeline.984.a:0 "Is this... the truth?"
 time_lifeline.985.desc:0 "After all, there is no other evidence, and my intuition has always been accurate. Maybe I guessed the truth right away.\n\nThe exploration on this planet has come to an end. Truly thrilling and interesting.\nOkay okay, stop dwelling on this matter. A detective once said: \"When you have eliminated the impossible, whatever remains, however improbable, must be the truth.\"\nI think this sentence should also apply to the current situation. $time_lifeline.844.desc.same$"
 time_lifeline.985.a:0 "I feel you are twisting words and forcing logic..."
 time_lifeline.985.a.response:0 "I am not!"
 time_lifeline.985.b:0 "Alright, let's find the truth again when we meet again."
 time_lifeline.985.b.response:0 "Mm, definitely. It's a promise."
 
 time_lifeline.990.desc:0 "$time_lifeline.980.desc$"
 time_lifeline.990.a:0 "$time_lifeline.980.a$"
 time_lifeline.991.desc:0 "Yes, the repair work was completed very smoothly, even simpler than I expected.\n\nBecause I have always been very interested in the secret of this lake, before contacting you, I went to the lake first and analyzed the composition and properties of the lake water again.\nJust now, the results came out."
 time_lifeline.991.a:0 "Any new discoveries?"
 time_lifeline.992.desc:0 "Can't really call it new, just for the lake water of this world, it is indeed a new discovery.\n\nI detected the existence of \"§HInverse Phase Particles§!\" again, the light-absorbing particles whose properties change constantly and mass is negative.\nThis particle appearing in the lake water of two worlds at the same time, I think this is not accidental."
 time_lifeline.992.a:0 "After all, these two lakes are actually the same lake."
 time_lifeline.993.desc:0 "Is it really the same lake?\n\nIn other words, is it really because they are the same lake that they have the same particles?\nIs there a possibility that it is because both lakes possess the same particles that they became the same lake?"
 time_lifeline.993.a:0 "Wait, you mean-they were initially different lakes?"
 time_lifeline.994.desc:0 "I think it is very likely.\n\nAt first, I had an imaginative conjecture that these two worlds are actually on the same planet, only one is on the surface and one is underground, connected by this lake water.\nTo verify this, I went to investigate the vicinity of the stone house by the lake.\n\nForgot to tell you before, when visiting the fungal tribe initially, I secretly buried a capsule storing radioactive material in the ground.\nDon't worry, inside is just a special isotope harmless to biology and the environment. I am used to relying on it to judge some things.\n\nWhen investigating the lakeside stone house, I detected the content of radioactive material in the soil and found the result was zero."
 time_lifeline.994.a:0 "What does this mean?"
 time_lifeline.995.desc:0 "Although in a short time, this radioactive material will not escape from the container and diffuse in large quantities, there will still be a tiny amount spreading into the soil, far exceeding the threshold of my instrument detection.\n\nSince the content cannot be detected at all, either this material has decayed completely after millions of years, or this material does not exist here at all.\nI roughly estimated the time from when I buried the capsule to now, and calculated the diffusion radius based on this. The result is-at least tens of kilometers.\nAlthough I cannot calculate the crust thickness of this planet in a short time, I don't need to calculate.\nBecause if I passed through a distance of dozens of kilometers through the lake water, I would have drowned in the lake water long ago.\n\nBased on this fact, I can falsify my first conjecture."
 time_lifeline.995.a:0 "First conjecture?"
 time_lifeline.996.desc:0 "Correct, I have more than one conjecture.\n\nSpeaking of the second conjecture, I have to mention one thing I said before but didn't pay attention to-\nAfter waking up from the lake water for the first time, the broken mast of the derelict ship was restored, and my Casting Unit was repaired.\n\nThe restoration of the mast might be because there are actually two ships. The mast in this world broke, while the mast in the other world remained safe and sound. After all, that world has always been stable.\nBut the repair of the Casting Unit cannot be explained like this, because it is impossible for an identical Casting Unit to exist.\nMy Casting Unit is specially customized. It is impossible to be imitated within a short time after arriving on this planet, so what I hold is exactly the original one.\n\nIt is also unlikely that someone else helped me repair the Casting Unit, because I checked its sensor records at that time, and no other life approached the Casting Unit in a short time."
 time_lifeline.996.a:0 "But what does this prove?"
 time_lifeline.997.desc:0 "This proves that my Casting Unit was repaired by this lake water, to be precise, repaired by the \"§HInverse Phase Particles§!\" in the lake water.\nAlthough the specific repair process is unclear, I think some resonance occurred between the two, right?\n\nMy Casting Unit can assist me in flying, but the principle of flight is not through buoyancy or reaction force; it is actually realized in a form similar to a gravitational field or phase.\nSince my Casting Unit can resonate with this particle, perhaps it also has similar properties.\n\nThus, I boldly infer that these two worlds are actually the same planet in different parallel universes!\nBoth lake waters were mixed with a large amount of \"§HInverse Phase Particles§!\" for some reason. Therefore, they are connected to each other, and the two dimensions overlap because of this.\n\nThis is the final answer to the biggest mystery on this planet."
 time_lifeline.997.a:0 "This is too unbelievable, illogical."
 time_lifeline.998.desc:0 "This is not a sci-fi novel. This is reality.\n\nNovels need logic, but reality doesn't.\nOf course, reality also has its own logic, only neither you nor I know it. After all, no one is Laplace's Demon.\nBut this does not mean pursuing logic is wrong, because the theorems, formulas, laws, and logic we have found so far apply to a certain extent.\nPerhaps they are not perfect, but we are always making them as perfect as possible.\n\nMy conjecture is the same. Although I cannot conclude it is the truth, although it indeed lacks sufficient logic, and even it is not the only explanation for the status quo, isn't the process of pursuing truth exactly like this?\nIf it is reality, then there must be some logic we haven't found yet; precisely because it might be reality, we can continue to perfect it.\nIf we discard an attempt just because of insufficient logic rather than actual falsification, then we might never understand reality.\n\nAccept its imperfection. Accept the imperfection of every breakthrough.\nMaybe we can never touch the truth of the universe, but we can still approach it infinitely, until the difference between us and reality is only infinitesimal.\n\nMaybe one day, we can prove the truth of everything;\nMaybe one day, we can become Laplace's Demon."
 time_lifeline.998.a:0 "Maybe there will be such a day."
 time_lifeline.999.desc:0 "The exploration on this planet has come to an end. We experienced a lot together, discovered a lot, discussed a lot. Truly an unforgettable time.\n\nAlthough we only found a truth that doesn't look so much like the truth-to be more precise, just an extremely absurd conjecture-this is our rare harvest after all.\nBut precisely because of its incompleteness, we have the opportunity to further perfect it, only not now. $time_lifeline.844.desc.same$"
 time_lifeline.999.a:0 "We will definitely meet again, and become Laplace's Demon together."
 time_lifeline.999.a.response:0 "Hehe, that's just a metaphor.\nThen, it's a promise, definitely."