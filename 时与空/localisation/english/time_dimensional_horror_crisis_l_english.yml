 ################################################################
 # 事件
 ################################################################
 
 time_dimensional_horror_crisis.1.name:0 "New Integer"
 time_dimensional_horror_crisis.1.desc.prefix:0 "We are trying to master time, but time played a little joke on us.\n\nAfter a routine transformation of time, our cognition of mathematics underwent earth-shaking changes. At first, only machines in the transformation area gave wrong results, then computers on the entire planet malfunctioned. The situation intensified, to the extent that people in the entire country can no longer correctly perceive mathematics, and almost all calculations involving numbers no longer have logic to speak of.\n\nA genius mathematician reviewed our past, compared the records in the Astral Rift with our current situation, and creatively proposed a new integer-Pi. When this \"integer\" located between three and four was incorporated into the existing mathematical system, he was surprised to find that the originally chaotic and disordered calculations became seamless, but proving this seems impossible at present.\n\n"
 time_dimensional_horror_crisis.1.desc.suffix:0 "Although the cause of this cognitive disaster is unknown, we modified our mathematical system in time. It is hard to estimate what impact this change will have on the future, but at least we barely stabilized the rigor and logic of science.\n\nAt the same time, the density of the entire space seems to have changed, and the passage of time has gradually become uncontrollable, as if something is emerging from the depths of the universe."
 time_dimensional_horror_crisis.1.desc.a:0 "$time_dimensional_horror_crisis.1.desc.prefix$A retired worker who participated in the exploration of the $astral_rift_akx_horror$ rift said he vividly remembers the experience of \"Between Three and Four\". The calculation method of the probe at that time was quite similar to the new method proposed by this genius mathematician. He can be certain that what happened to us is the same as in the rift-or rather, the universe we are in is gradually converging with the Inverse Plane.\n\n$time_dimensional_horror_crisis.1.desc.suffix$"
 time_dimensional_horror_crisis.1.desc.b:0 "$time_dimensional_horror_crisis.1.desc.prefix$A retired worker who participated in the exploration of the $astral_rift_akx_horror$ rift said he vividly remembers the experience of \"New Integer\". Although the full characteristics of this integer were not analyzed at that time, the gap in this regard seems to have been filled by this genius scientist, and the regret that plagued him for many years has finally been solved.\n\n$time_dimensional_horror_crisis.1.desc.suffix$"
 time_dimensional_horror_crisis.1.a:0 "It is already here."
 time_dimensional_horror_crisis.1.a.tooltip:0 "§R['concept_dimensional_horror_crisis_storm_tooltip'] is about to descend on §Y[dimensional_horror_crisis_storm_start_system.GetName]§!!§!"
 time_dimensional_horror_crisis.10.name:0 "Proclamation of the End"
 time_dimensional_horror_crisis.10.desc.prefix:0 "The rotation of the pointer never stops, the proclamation of the end arrives on time.\n\n"
 time_dimensional_horror_crisis.10.desc.suffix:0 "We once imagined what kind of enemies we would experience-swarms devouring everything, spirits from high dimensions, machines purging errors, queens manipulating minds, but we never thought of the most primitive yet most straightforward disaster-this universe itself. This is not some conqueror with delusions, nor some murderous destroyer, but a natural phenomenon encompassing the entire universe and even all planes-a destined end.\n\nThis is not the End, but a harbinger of the End, this is the §HProclamation of the End§!."
 time_dimensional_horror_crisis.10.desc.a:0 "$time_dimensional_horror_crisis.10.desc.prefix$['concept_dimensional_horror_crisis_storm'] drowned our capital in an instant, and everyone thought of a word coincidentally-\"The End\". Chaos, disorder, pain, disaster, death, termination, almost all terrible negative words happened literally on the affected planet.\n\n$time_dimensional_horror_crisis.10.desc.suffix$"
 time_dimensional_horror_crisis.10.desc.b:0 "$time_dimensional_horror_crisis.10.desc.prefix$['concept_dimensional_horror_crisis_storm'] drowned §Y[dimensional_horror_crisis_storm_start_system.GetName]§! in an instant, no one knows what exactly happened there. Chaos, disorder, pain, disaster, death, termination, almost all terrible negative words filled the unfathomable storm literally.\n\n$time_dimensional_horror_crisis.10.desc.suffix$"
 time_dimensional_horror_crisis.10.a:0 "Our enemy is the universe itself."
 
 time_dimensional_horror_crisis.500.name:0 "$concept_dimensional_horror_crisis_seal$"
 time_dimensional_horror_crisis.500.desc.a:0 "With the help of another cycle, we successfully sealed §Y[dimensional_horror_crisis_sealed_system.GetName]§! in the river of time.\nNow, all systems suffering from ['concept_dimensional_horror_crisis_erasure'] have been successfully sealed. We don't know how long this can last, we can only pray that the harm of ['concept_dimensional_horror_crisis_storm'] will weaken from now on."
 time_dimensional_horror_crisis.500.desc.b:0 "With the help of another cycle, we successfully sealed §Y[dimensional_horror_crisis_sealed_system.GetName]§! in the river of time.\nAlthough we don't know how long this can last, at least the system will not be affected by ['concept_dimensional_horror_crisis_storm'] again in a short time."
 time_dimensional_horror_crisis.500.a:0 "We are safe... for now."
 time_dimensional_horror_crisis.500.a.tooltip:0 "['concept_dimensional_horror_crisis_ship_orange'] will no longer cause ['concept_dimensional_horror_crisis_erasure_red']"
 time_dimensional_horror_crisis.500.b:0 "This one-then the next."
 time_dimensional_horror_crisis.500.b.tooltip:0 "['concept_dimensional_horror_crisis_storm'] will no longer produce negative effects on §Y[dimensional_horror_crisis_sealed_system.GetName]§!"
 
 time_dimensional_horror_crisis.1000.name:0 "Fall of Destiny"
 time_dimensional_horror_crisis.1000.desc:0 "Is He time? Is He space?\nIs He cycle? Is He causality?\nIs He world? Is He dimension?\n\n§C\"He is everything, He is nothing.\"§!\n\nIs He beginning? Is He end?\nIs He messenger? Is He god?\nIs He entity? Is He concept?\n\n§C\"He is everything, He is nothing.\"§!\n\n§R\"I am Destiny, we shall never meet again.\"§!"
 time_dimensional_horror_crisis.1000.a:0 "He is everything, He is nothing."
 
 time_dimensional_horror_crisis.1100.desc:0 "§Y[From.GetName]§! successfully repelled the Nightmare of the End named \"$NAME_Dimensional_Horror_Crisis_Destiny$\" in §Y[dimensional_horror_crisis_destiny_system.GetName]§!.\n\nWith the demise of this monster from the End, the storm of the End in the entire galaxy also calmed down. But we understand that all this is not completely over."
 time_dimensional_horror_crisis.1100.a:0 "The bell of the End has tolled, but this time it mourns the End itself."