l_english:
 situation_origin_born_in_the_purple:0 "Bloodline Legitimacy"
 situation_origin_born_in_the_purple_type:0 "Bloodline Legitimacy"
 situation_origin_born_in_the_purple_desc:0 "The legitimacy of §Y[Target.GetName]§! determines the citizens' view of [Target.GetHimHer], and also affects the power of §Y[Target.GetName]§!'s supporters and opponents."
 situation_origin_born_in_the_purple_monthly_change_tooltip:0 "$situation_monthly_change_tooltip_approaches_dependent$"
 stage_born_in_the_purple_1:0 "Impure Bloodline"
 stage_born_in_the_purple_2:0 "Controversial Bloodline"
 stage_born_in_the_purple_3:0 "Pure Bloodline"
 stage_born_in_the_purple_4:0 "Excellent Bloodline"
 stage_born_in_the_purple_5:0 "Bloodline of Past Kings"
 situation_origin_born_in_the_purple_complete_effect:0 "The legitimacy and prestige of §Y[Target.GetName]§! will reach the peak, but [Target.GetHerHis] power seems a bit too great..."
 situation_origin_born_in_the_purple_fail_effect:0 "§Y[Target.GetName]§! will be disgraced, maybe someone is plotting against [Target.GetHimHer]..."
 approach_origin_born_in_the_purple_up:0 "Promote Legitimacy"
 situation_origin_born_in_the_purple_up_effect:0 "The legitimacy of §Y[Target.GetName]§! will increase day by day.\n\nEither the heir's ability is very excellent, or the current monarch is too fatuous, or other reasons, but in any case, the prestige of this heir is constantly rising."
 approach_origin_born_in_the_purple_normal:0 "Let It Be"
 situation_origin_born_in_the_purple_normal_effect:0 "The legitimacy of §Y[Target.GetName]§! will remain stable.\n\nStability does not mean no changes. Sometimes, fate always brings some unexpected results."
 approach_origin_born_in_the_purple_down:0 "Belittle Lineage"
 situation_origin_born_in_the_purple_down_effect:0 "The legitimacy of §Y[Target.GetName]§! will deteriorate.\n\nAlthough tiger does not eat its cubs, for special considerations, it is necessary to let the heir know their own weight, even changing an heir is an optional strategy."
 string_born_in_the_purple_up:0 "National Support"
 string_born_in_the_purple_down:0 "National Ridicule"
 
 origin_born_in_the_purple.4.name:0 "Coup!"
 origin_born_in_the_purple.4.desc:0 "The prestige of §Y[Target.GetName]§! is in full swing, and [Target.GetHerHis] supporters have expanded to an unprecedented scale.\n\nMaybe blinded by interests, or maybe someone fueled the flames, §Y[Target.GetName]§! secretly planned a coup and successfully usurped the throne today. But the people are not angry about this, because everyone knows that [Target.GetHerHis] pure blood is worth a magnificent crown."
 origin_born_in_the_purple.4.a:0 "Long live the new king!"
 origin_born_in_the_purple.5.name:0 "Assassination!"
 origin_born_in_the_purple.5.desc:0 "Our heir is notorious. Opponents believe that our empire should be inherited by a more legitimate heir and sent an assassin.\n\nWhen the assassin sneaked into the heir's bedroom, our heir was busy playing with a few servants, unaware of the approaching danger. As the plasma gun emitted dazzling sparks, the heir lay in the servant's arms forever, and the assassin disappeared without a trace. The people panicked about this, but they knew in their hearts that it was the heir's ignorance and fatuousness that caused this tragedy."
 origin_born_in_the_purple.5.a:0 "Shocking."
 
 origin_born_in_the_purple.11.name:0 "Good-looking Vase"
 origin_born_in_the_purple.11.desc:0 "§Y[Target.GetName]§! showed a satisfactory side in a recent royal public event and was welcomed by the people."
 origin_born_in_the_purple.11.a:0 "At least [Target.GetHeShe] looks good."
 origin_born_in_the_purple.12.name:0 "People-friendly Heir"
 origin_born_in_the_purple.12.desc:0 "§Y[Target.GetName]§! visited the lower communities recently, condolences to the poor people while bringing a lot of relief supplies. This move not only made [Target.GetHimHer] highly praised among the people, but also made opponents disappear for a while."
 origin_born_in_the_purple.12.a:0 "Gratifying."
 origin_born_in_the_purple.13.name:0 "Deafening Speech"
 origin_born_in_the_purple.13.desc:0 "Not long ago, §Y[Target.GetName]§! gave a grand speech in the square, the theme of which was that the royal family and the people complement each other.\n\n[Target.GetHerHis] impassioned speech and inspiring declaration on stage deeply moved every citizen present, even the harshest critics applauded for it. A government dignitary was moved to tears and claimed to see the style of the former king from §Y[Target.GetName]§!, which further strengthened the people's hearts."
 origin_born_in_the_purple.13.a:0 "Well done!"
 origin_born_in_the_purple.14.name:0 "Gossip"
 origin_born_in_the_purple.14.desc:0 "In recent days, some gossip about §Y[Target.GetName]§! has spread in the streets. It is said that [Target.GetHeShe] has promiscuous relationships with multiple opposite sexes at the same time and caused multiple disputes, but its authenticity is unverifiable."
 origin_born_in_the_purple.14.a:0 "Annoying mosquitoes."
 origin_born_in_the_purple.15.name:0 "Useless Vase"
 origin_born_in_the_purple.15.desc:0 "Recently, a harsh critic publicly stated that §Y[Target.GetName]§! is a useless vase, and the heir of the empire should be a more capable and courageous prince, such as §Y[Target.GetName]§!'s brother. Although §Y[Target.GetName]§! did not pay attention to such unintelligible slander, it still brought considerable impact to [Target.GetHerHis] reputation."
 origin_born_in_the_purple.15.a:0 "This is an unwarranted accusation."
 origin_born_in_the_purple.16.name:0 "Controversial Bloodline"
 origin_born_in_the_purple.16.desc:0 "A rumor spread throughout the empire recently.\n\nI don't know who the source is, but someone secretly revealed that §Y[Target.GetName]§! is actually not the orthodox bloodline of the royal family, but an illegitimate child born of the intercourse between the royal spouse and a servant. Although the royal family and §Y[Target.GetName]§! [Target.GetHimHer]self immediately responded to this matter and actively prevented the spread of rumors, more and more people no longer trust our heir and firmly believe that [Target.GetHeShe] will become the impure one usurping the throne."
 origin_born_in_the_purple.16.a:0 "Truly nonsense!"
 origin_born_in_the_purple.17.name:0 "Self-centrism"
 origin_born_in_the_purple.17.desc:0 "§Y[Target.GetName]§! has a wrong understanding of [Target.GetHerHis] status. [Target.GetHeShe] thinks [Target.GetHeShe] is the well-deserved core of the empire. Without [Target.GetHimHer], even the homeworld won't turn. Therefore, [Target.GetHeShe] decided to indulge in dissipation to maintain the normal operation of the empire."
 origin_born_in_the_purple.17.a:0 "Let [Target.GetHimHer] be."
 origin_born_in_the_purple.17.b:0 "Give [Target.GetHimHer] enough money to make [Target.GetHimHer] stop."
 origin_born_in_the_purple.18.name:0 "Metal Head"
 origin_born_in_the_purple.18.desc:0 "§Y[Target.GetName]§! seems to have a strange serious illness and thinks [Target.GetHeShe] is a wise machine that can handle all affairs perfectly. Now, [Target.GetHeShe] has even started saying: \"hello world\"!"
 origin_born_in_the_purple.18.a:0 "Being a tireless machine is not bad either."
 origin_born_in_the_purple.18.b:0 "Go get a trained doctor quickly."
 origin_born_in_the_purple.19.name:0 "Daydreaming"
 origin_born_in_the_purple.19.desc:0 "§Y[Target.GetName]§! always has unrealistic ideas, even thinking [Target.GetHeShe] is the master of the world, and everyone should become [Target.GetHerHis] loyal servants. However, [Target.GetHeShe] always indulges in [Target.GetHerHis] own thoughts without doing anything, turning a blind eye to others' advice."
 origin_born_in_the_purple.19.a:0 "Dreams are always sweet, who doesn't like dreaming?"
 origin_born_in_the_purple.19.b:0 "Slap [Target.GetHimHer] to see if [Target.GetHeShe] is still crazy."
 origin_born_in_the_purple.20.name:0 "Great Hunt Approaching"
 origin_born_in_the_purple.20.desc:0 "The Great Hunt held every few years is about to open. According to custom, the heir of the empire always has to participate in this grand event.\n\nThis is not only a good platform for §Y[Target.GetName]§! to contact the people and get to know politicians, but also an opportunity for §Y[Target.GetName]§! to prove [Target.GetHimHer]self and show the royal style. However, in recent days, our heir is physically unwell. Participating in this event may worsen the condition, but giving up this attendance may disappoint the people."
 origin_born_in_the_purple.20.a:0 "Prioritize the Great Hunt."
 origin_born_in_the_purple.20.a.tooltip:0 "§Y[Target.GetName]§! will participate in this Great Hunt"
 origin_born_in_the_purple.20.b:0 "Prioritize health."
 origin_born_in_the_purple.21.name:0 "Old Man Time"
 origin_born_in_the_purple.21.desc:0 "In this Great Hunt, §Y[Target.GetName]§! accidentally got lost. However, after the Great Hunt ended, [Target.GetHeShe] returned to us safely. Although [Target.GetHeShe] failed to win the top spot in this Great Hunt, [Target.GetHeShe] had a wonderful experience.\n\nIt is said that after §Y[Target.GetName]§! got lost, [Target.GetHeShe] unexpectedly met an old man with white hair. The old man warmly invited [Target.GetHimHer] to be a guest at home. They talked and laughed while drinking, and unknowingly several days passed. Before leaving, the old man gave §Y[Target.GetName]§! a pocket watch as a gift, but disappeared without a trace in the blink of an eye.\n\nAfter accepting this pocket watch, §Y[Target.GetName]§! quickly found the way out, and the illness on [Target.GetHerHis] body miraculously healed."
 origin_born_in_the_purple.21.a:0 "Truly a strange thing."
 origin_born_in_the_purple.22.name:0 "Making Good Friends"
 origin_born_in_the_purple.22.desc:0 "In this Great Hunt, §Y[Target.GetName]§! met many children of government dignitaries.\n\nDuring the Great Hunt, §Y[Target.GetName]§! and [Target.GetHerHis] partner worked together to capture a huge prey. Although this result can be said to be everyone's joint effort, §Y[Target.GetName]§!'s actions can definitely be called the main contribution of the team. However, [Target.GetHeShe] did not take all the credit for [Target.GetHimHer]self, but modestly proposed that everyone share the hunting points. At the celebration party after the Great Hunt, §Y[Target.GetName]§! also toasted with the previous partners, talked about everything, and spent a happy time together. At the celebration party, they reluctantly returned to their camp, but solid friendship has taken root at this moment.\n\nThe Great Hunt is over. Although §Y[Target.GetName]§! did not win the top spot, what [Target.GetHeShe] gained in this Great Hunt is far more than becoming a champion."
 origin_born_in_the_purple.22.a:0 "This will become the cornerstone of your future."
 origin_born_in_the_purple.23.name:0 "Famous Overnight"
 origin_born_in_the_purple.23.desc:0 "In this Great Hunt, §Y[Target.GetName]§! carried forward the excellent style of the royal family, and won the title of Great Hunt Champion with [Target.GetHerHis] excellent hunting skills.\n\nDuring the Great Hunt, there were many powerful competitors with potential, but §Y[Target.GetName]§! was not timid about this. [Target.GetHeShe] just kept hunting one prey after another at [Target.GetHerHis] own pace, relying on the hunting laser gun in [Target.GetHerHis] hand. Gradually, §Y[Target.GetName]§!'s hunting points gradually surpassed many dark horses in the Great Hunt, and jumped to the second place. In the final stage of the Great Hunt, §Y[Target.GetName]§! and another opponent scrambled to hunt larger and larger prey. Even if they were exhausted, they did not show weakness to each other.\n\nFinally, the Great Hunt ended. Even if §Y[Target.GetName]§! was physically unwell, [Target.GetHeShe] still surpassed the original first place by a very small advantage and became the well-deserved Great Hunt Champion."
 origin_born_in_the_purple.23.a:0 "You are truly the pride of the empire!"
 origin_born_in_the_purple.24.name:0 "Give Up Halfway"
 origin_born_in_the_purple.24.desc:0 "In this Great Hunt, §Y[Target.GetName]§! was defeated by other opponents before [Target.GetHeShe] could participate in the whole process.\n\nUnknown whether due to the opponent's plot or physical illness, §Y[Target.GetName]§! repeatedly violated the rules and was eliminated without achieving excellent hunting results.\n\nThe Great Hunt is over. Many people began to ridicule our heir and question [Target.GetHerHis] legitimacy, but we all understand that §Y[Target.GetName]§! has tried [Target.GetHerHis] best."
 origin_born_in_the_purple.24.a:0 "We should not be harsh on a patient."
 origin_born_in_the_purple.25.name:0 "Hunting Accident"
 origin_born_in_the_purple.25.desc:0 "[Target.GetName]'s body has been covered with a cloth by someone, the white cloth dyed red by [Target.GetHerHis] blood. The attendants said [Target.GetHeShe] was found by [Target.GetHerHis] horse in a clearing in the woods. You know that place. [Target.GetHerHis] face is very calm, even peaceful. It wasn't until you reached out and gently stroked [Target.GetHimHer] that you realized the cruelty of reality and felt the cold death."
 origin_born_in_the_purple.25.a:0 "Sadness overwhelmed you."
 origin_born_in_the_purple.25.b:0 "Oh, I know..."