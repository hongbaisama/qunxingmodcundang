 time.600.name:0 "Beginning of the End: §HEndless§!"
 time.600.desc:0 "Our understanding of the Inverse Plane grows daily. The more we master, the more obsessed we become with its mysteries.\n\nWe crave more, more, more..."
 time.600.a:0 "Knowledge in the Inverse Phase is by no means limited to this."
 time.601.name:0 "Beginning of the End: §HBoundless§!"
 time.601.desc:0 "The Worm-in-Waiting does not wish for us to proceed to the End, and is willing to exchange boundless Inverse Phase knowledge for it."
 time.601.a:0 "A very tempting proposal."
 time.601.b:0 "This is far from infinite knowledge."
 time.602.name:0 "Beginning of the End: §HVast§!"
 time.602.desc:0 "The Worm-in-Waiting becomes somewhat impatient, but It still offers vast Inverse Phase knowledge in exchange."
 time.602.a:0 "We have no reason to refuse."
 time.602.b:0 "This is far from comparable to infinite knowledge."
 time.603.name:0 "Beginning of the End: §HInexhaustible§!"
 time.603.desc:0 "The Worm-in-Waiting starts to become restless, but It still proposes inexhaustible Inverse Phase knowledge in exchange."
 time.603.a:0 "We had better choose to accept."
 time.603.b:0 "This still falls short of infinite knowledge."
 time.604.name:0 "Beginning of the End: §HUnending§!"
 time.604.desc:0 "The Worm-in-Waiting has become outraged and issues an ultimatum, demanding unending Inverse Phase knowledge in exchange."
 time.604.a:0 "For our mutual future, we agree."
 time.604.b:0 "For infinite knowledge, we will never compromise."
 time.605.name:0 "Beginning of the End: §HInfinite§!"
 time.605.desc:0 "The Worm-in-Waiting sighed sadly and tacitly allowed us to pursue the End.\n\nIs It worried for Itself, or grieving for us?"
 time.605.a:0 "Finally, we are about to understand infinity."
 time.606.name:0 "Beginning of the End: §HBottomless§!"
 time.606.desc:0 "Pursuing knowledge is a bottomless pit. We have strayed too far on this path. Now, it is time to turn back."
 time.606.a:0 "Fortunate that we stopped in time."
 
 time.503.name:0 "Long Road of Spacetime"
 time.503.desc:0 "The existence from the abyss moves again; He points out a new path for us from our dreams.\n\nBut the price is everything we have."
 time.503.a:0 "A long, long road. We shall follow the Master."
 
 # Tradition of the End
 time.505.name:0 "The Worm-in-Waiting: §HInevitable§!"
 time.505.desc:0 "The Worm-in-Waiting governs the cycle. We followed Mother to close the loop.\n\nHowever, this time, The Worm-in-Waiting does not wish for us to fall into the cycle again, but it is too late. Causality is set in stone. Although this is not the true End, it is the inevitability of the End.\n\nThe Worm-in-Waiting gave us a final gift."
 time.505.materialist:0 "The cycle of causality must absolutely not be altered."
 time.505.spiritualist:0 "The cycle of causality is sacred and inviolable."
 time.505.militarist:0 "The End will open up a new world for us."
 time.505.pacifist:0 "The End will bring us new opportunities."
 time.505.xenophile:0 "The entire galaxy will surely succeed in resisting the crisis."
 time.505.xenophobe:0 "The entire nation will definitely not repeat the same mistakes."
 time.505.egalitarian:0 "This is the common will of all our people."
 time.505.authoritarian:0 "This is my final decision after careful consideration."
 time.505.hive_mind:0 "Thank you, Mother Worm."
 time.505.machine_intelligence:0 "The Worm-in-Waiting, the great guide."
 time.505.a:0 "Leave the rest to us, Master of Spacetime."
 time.505.tooltip:0 "§YUnlocks $ASTRAL_ACTIONS$:§!$action_akx_time_erasure$"
 
 # Crisis Favor
 time.71.name:0 "Crisis Favor"
 time.71.desc.swarm:0 "Accompanying the echoes of subspace, a group of shapeshifting Inverse Phase creatures were attracted to our universe.\n\nThese Nightmares of the Plane do not seem to intend to feed on us; They are merely amused by the impending future and favor the potential crisis. With our understanding of the Inverse Phase, we realize the §RPrethoryn Scourge§! has been strengthened in all aspects.\n\nTheir firepower has become more §Yintense§! and effective against §YShields§!, weapon §YTracking§! capabilities have become stronger, fleet §YArmor§! regenerates more easily, body scales have been §Yhardened§!, and other aspects of §Yamplification§! are equally formidable."
 time.71.desc.extradimensional:0 "Accompanying dimensional tremors, an indescribable Inverse Phase creature was attracted to our universe.\n\nThis Nightmare of the Plane does not seem to intend to be our enemy; It is merely amused by the impending future and favors the potential crisis. With our understanding of the Inverse Phase, we realize the §RExtradimensional Invaders§! have been strengthened in all aspects.\n\nTheir movements have become more §Yrapid§! and effective against §YArmor§!, ship §YEvasion§! trajectories have become unpredictable, fleet §YShields§! regenerate more easily, energy barriers have been §Yhardened§!, and other aspects of §Yamplification§! are equally formidable."
 time.71.desc.ai_empire:0 "Accompanying the spread of the Ghost Signal, a mass of end-to-end connected Inverse Phase creatures were attracted to our universe.\n\nThis Nightmare of the Plane does not seem to intend to destroy us; It is merely amused by the impending future and favors the potential crisis. With our understanding of the Inverse Phase, we realize the §RContingency§! has been strengthened in all aspects.\n\nTheir range has become §Ylonger§! and effective against §YHull§!, weapon §YAccuracy§! has become more precise, fleet §YHull§! regenerates more easily, shields and armor have been §Yhardened§!, and other aspects of §Yamplification§! are equally formidable."
 time.71.desc.synth_queen_storm:0 "Accompanying the birth of the storm, a moody Inverse Phase creature was attracted to our universe.\n\nThis Nightmare of the Plane does not seem to intend to attack us; It is merely amused by the impending future and favors the potential crisis. With our understanding of the Inverse Phase, we realize the §RSynthetic Queen§! has been strengthened in all aspects.\n\nTheir weapons have become able to §Ypenetrate§! shields and armor, weapon firepower has become more §Yferocious§! and §Yprecise§!, shields and armor have been §Yhardened§!, and other aspects of §Yamplification§! are equally formidable."
 time.71.a:0 "Our research into the Inverse Phase seems a bit too dangerous."
 time.71.a.tooltip:0 "§REach completed $horror_time$ dangerous technology will make the Inverse Phase creatures' interest more intense!§!"
 
 # Universal Genesis
 crisis.7516.desc.worm.ending:0 "$crisis.7516.intro$Nothingness. This universe no longer exists, only The Worm-in-Waiting is here. Time is rewinding itself, curling into an impossible spiral, full of longing. Gravity. Is it love? No-this is attraction. The nature of The Worm-in-Waiting is attraction. Its grip is so tight that this universe cannot be created again. The Worm-in-Waiting imprisons itself within its own meaning. It is helplessly looking for a way out. Or rather, a way in-to attract more.\n\nDid It send the Temple of the Loop, using this creation that does not belong to our timeline to attract us here? It is so clever, so lovely. We found the way to It and gave It what could liberate It.\n\nLiberating It requires one or two eternities of time, but The Worm-in-Waiting is still grateful and promises to embrace us.\n\nForever."
 crisis.7516.desc.worm.attack:0 "$crisis.7516.intro$Nothingness. This universe no longer exists, only The Worm-in-Waiting is here. Time is rewinding itself, curling into an impossible spiral, full of longing. Gravity. Is it love? No-this is attraction. The nature of The Worm-in-Waiting is attraction. Its grip is so tight that this universe cannot be created again. The Worm-in-Waiting imprisons itself within its own meaning. It is helplessly looking for a way out. Or rather, a way in-to attract more.\n\nWe cannot see anger in It; perhaps eternal time is enough to wear away all resentment. Replaced by endless sadness, although groundless, we just know. Silence, still silence.\n\nThe Worm-in-Waiting seems to have tacitly accepted our existence. Although we no longer have a future, we are still grateful for its giving.\n\nForever."
 crisis.7516.desc.worm.trigger:0 "$crisis.7516.intro$Nothingness. This universe no longer exists, only The Worm-in-Waiting is here. Time is rewinding itself, curling into an impossible spiral, full of longing. Gravity. Is it love? No-this is attraction. The nature of The Worm-in-Waiting is attraction. Its grip is so tight that this universe cannot be created again. The Worm-in-Waiting imprisons itself within its own meaning. It is helplessly looking for a way out. Or rather, a way in-to attract more.\n\nThe Worm-in-Waiting is full of expectation; It has waited for us for a long time, only our arrival is too late, too late. It seems to want something, but It doesn't care; It just wants to give us an eternal embrace.\n\nIs it a loving goddess? Or a hypocritical demon? We cannot distinguish the truth, nor do we want to know the truth. Our only choice is acceptance.\n\nForever."
 crisis.7516.desc.worm.other:0 "$crisis.7516.intro$Nothingness. This universe no longer exists, only the giant nightmare named The Worm-in-Waiting is here. Time is rewinding itself, curling into an impossible spiral, full of longing. Gravity. Is it love? No-this is attraction. The nature of The Worm-in-Waiting is attraction. Its grip is so tight that this universe cannot be created again. The Worm-in-Waiting imprisons itself within its own meaning. It is helplessly looking for a way out. It sees us.\n\nThe Worm-in-Waiting suddenly becomes extremely aggressive, or rather, the whole world is our enemy. Our stinger is inevitably collapsing, the ages of all citizens change in an irregular pattern, we cannot even distinguish what just happened from what is about to happen.\n\nThe means used to manipulate the universe are ultimately used by the universe against ourselves.\n\nForever."
 
