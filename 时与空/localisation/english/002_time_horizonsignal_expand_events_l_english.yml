 astral_rift_akx_time:0 "Time Wound"
 time_akx_astral_rift_history_refresh:0 "§YAstral Rift exploration records updated!§!"
 unlock_hidden_akx_dark_consortium_edict:0 "§YTime will give us the answer.§!"
 unlock_akx_ouroboros_building:0 "Unlocks building: §H$building_akx_ouroboros$§!."
 upgrade_akx_hyperspace_specialty_starbase_building:0 "Upgrades Starbase building: §H$sm_akx_hyperspace_specialty$§!."
 
 time_akx.601.name:0 "Tearing the Veil"
 time_akx.601.desc.completed_arcsite:0 "Everything in the Inverse Plane indicates that almost nothing here can be proven by existing logic, but they do exist, whether meaningful or not.\n\nWhen phenomena conflict with theory, it is not the phenomena that are wrong, but our theory that is problematic.\n\nTime has no obligation to make sense to us."
 time_akx.601.desc.default:0 "The Worm-in-Waiting tore the dimensions apart, generously pointing out the direction for our exploration.\n\nNot just studying Inverse Phase matter from the outside, we must go deep into the rift to further explore the Inverse Plane. With our understanding of the Inverse Phase, we no longer need to worry about being swallowed by the rift. Now we can abandon the short probe and use a manned sphere to peep into this familiar yet strange world."
 time_akx.601.a:0 "Time is revealing Its full appearance without reservation."
 
 time_akx.611.name:0 "Tower of Babel"
 time_akx.611.desc.truth_2:0 "Our exploration team has successfully entered the depths of the rift.\n\nThe rift sphere found a mysterious tower in a void, and the members of the exploration team also put on protective suits, ready to start exploring the tower. This giant tower is so high that the top cannot be seen. It is built with an unknown material, distinct in layers and shining, as if it were the scales of some creature. Although parts of the tower are slightly dilapidated, one can imagine its former glory, and the mysterious symbols filling the walls seem to imply that this tower has special meaning.\n\nThe exploration team is advancing in an orderly manner while studying the mysterious symbols on the walls."
 time_akx.611.desc.default:0 "§Y[time_akx_astral_rift_circle_leader.GetName]§! and [time_akx_astral_rift_circle_leader.GetHerHis] exploration team have successfully entered the depths of the rift.\n\nThe rift sphere found a mysterious tower in a void, and the members of the exploration team also put on protective suits, ready to start exploring the tower. This giant tower is so high that the top cannot be seen. It is built with an unknown material, distinct in layers and shining, as if it were the scales of some creature. Although parts of the tower are slightly dilapidated, one can imagine its former glory, and the mysterious symbols filling the walls seem to imply that this tower has special meaning.\n\nThe exploration team is advancing in an orderly manner while studying the mysterious symbols on the walls."
 time_akx.611.a:0 "Perhaps related to some religion."
 
 time_akx.621.name:0 "Butterfly Effect"
 time_akx.621.desc.same:0 "The exploration team was busy studying the strange decorations in a mysterious room, and §Y[time_akx_astral_rift_circle_leader.GetName]§! planned to rush to the top of the tower alone first. But this tower seemed to have no end; no matter how [time_akx_astral_rift_circle_leader.GetHeShe] tried, [time_akx_astral_rift_circle_leader.GetHeShe] could not see the top.\n\nJust when §Y[time_akx_astral_rift_circle_leader.GetName]§! was about to be driven crazy by this endless climb, a person walked down from the top of the tower. This person wore exactly the same clothes as the team members. §Y[time_akx_astral_rift_circle_leader.GetName]§! suspected for a moment whether the exploration team had found a shortcut to advance, but a gunshot broke [time_akx_astral_rift_circle_leader.GetHerHis] thoughts-the other party was attacking §Y[time_akx_astral_rift_circle_leader.GetName]§! in the face!\n\n"
 time_akx.621.desc.truth_1:0 "$time_akx.621.desc.same$ §Y[time_akx_astral_rift_circle_leader.GetName]§! quickly raised the weapon, but the opponent's weapon had also completed charging. With two gunshots, both fell to the ground together. When the exploration team behind arrived late, only two corpses remained. After searching, both of them were §Y[time_akx_astral_rift_circle_leader.GetName]§! [time_akx_astral_rift_circle_leader.GetHimHer]self, but the reason for their simultaneous appearance was unknown.\n\nThe exploration team reported this to us immediately. Although everything is shrouded in mist, the exploration must continue."
 time_akx.621.desc.truth_2:0 "The exploration team found some strange decorations in a mysterious room, which seemed to be carved with some meaningful symbols.\n\nAfter a period of study and translation, the exploration team found that this symbol just told a small story. The general idea is that a person did a small thing, but after a series of coincidences and accidents, indirectly killed themselves in the future. Sci-fi stories telling the \"Butterfly Effect\" like this are countless on our homeworld, not worth mentioning. The exploration team had to move on in disappointment."
 time_akx.621.desc.truth_3:0 "The exploration team was busy studying the strange decorations in a mysterious room, and §Y[time_akx_astral_rift_circle_leader.GetName]§! planned to rush to the top of the tower alone first. But this tower seemed to have no end; no matter how [time_akx_astral_rift_circle_leader.GetHeShe] tried, [time_akx_astral_rift_circle_leader.GetHeShe] could not see the top.\n\nJust when §Y[time_akx_astral_rift_circle_leader.GetName]§! was about to be driven crazy by this endless climb, a person walked down from the top of the tower. This person wore exactly the same clothes as the team members. §Y[time_akx_astral_rift_circle_leader.GetName]§! suspected for a moment whether the exploration team had found a shortcut to advance, but the other party's greeting broke [time_akx_astral_rift_circle_leader.GetHerHis] thoughts-the other party had no hostility.\n\nAfter some communication, both parties turned out to be §Y[time_akx_astral_rift_circle_leader.GetName]§! [time_akx_astral_rift_circle_leader.GetHimHer]self, which shocked both of them greatly. Our §Y[time_akx_astral_rift_circle_leader.GetName]§! decided to go down and meet with the team members, while the other §Y[time_akx_astral_rift_circle_leader.GetName]§! prepared to go up to notify [time_akx_astral_rift_circle_leader.GetHerHis] team members."
 time_akx.621.desc.attack:0 "$time_akx.621.desc.same$ §Y[time_akx_astral_rift_circle_leader.GetName]§! also launched a counterattack in time. With a gunshot, the opponent fell to the ground. But surprisingly, the attacker looked exactly like §Y[time_akx_astral_rift_circle_leader.GetName]§!, and various IDs on the body also indicated that the deceased was §Y[time_akx_astral_rift_circle_leader.GetName]§! [time_akx_astral_rift_circle_leader.GetHimHer]self.\n\n§Y[time_akx_astral_rift_circle_leader.GetName]§! felt unbelievable and worried about [time_akx_astral_rift_circle_leader.GetHerHis] situation."
 time_akx.621.desc.communicate:0 "$time_akx.621.desc.same$ §Y[time_akx_astral_rift_circle_leader.GetName]§! activated the shield in time, and the opponent's attack could not break through for the time being. While waiting for reinforcements, §Y[time_akx_astral_rift_circle_leader.GetName]§! tried to negotiate with the opponent, but the opponent ignored it completely. Only when the exploration team behind hurried over did the attacker retreat in a hurry. For safety reasons, the exploration team did not pursue immediately.\n\n§Y[time_akx_astral_rift_circle_leader.GetName]§! felt puzzled and worried about [time_akx_astral_rift_circle_leader.GetHerHis] situation."
 time_akx.621.desc.default:0 "$time_akx.621.desc.same$The opponent's weapon is recharging, and this area is very open. It is probably very difficult to find a suitable cover, but if the emergency shield can be activated, maybe [time_akx_astral_rift_circle_leader.GetHeShe] can hold on until the exploration team reinforces. Of course, we can also choose to fight back, but the consequences of this move are hard to estimate.\n\nNow, the fate of §Y[time_akx_astral_rift_circle_leader.GetName]§! is in your hands."
 time_akx.621.a:0 "No time to hesitate, counterattack immediately!"
 time_akx.621.b:0 "Do not fire back, try to negotiate while activating shields!"
 
 time_akx.631.name:0 "Beginning of Samsara"
 time_akx.631.desc.same:0 "The exploration team used the carried medicine to perform emergency treatment on §Y[time_akx_astral_rift_circle_leader.GetName]§! in time. Although the danger to life was temporarily avoided, permanent sequelae were left. Moreover, the emotions of §Y[time_akx_astral_rift_circle_leader.GetName]§! were still somewhat unstable.\n\nTo avoid §Y[time_akx_astral_rift_circle_leader.GetName]§! being attacked again, the exploration team decided to let [time_akx_astral_rift_circle_leader.GetHimHer] return the same way first and wait for news from the exploration team in the camp, while the exploration team continued to advance towards the top of the tower.\n\nBut the return journey was not calm. When §Y[time_akx_astral_rift_circle_leader.GetName]§! moved towards the bottom of the tower, [time_akx_astral_rift_circle_leader.GetHeShe] suddenly met another person with the same clothes as the team members. §Y[time_akx_astral_rift_circle_leader.GetName]§! was sure that other team members were advancing towards the top of the tower, so this person must be in the same group as the previous attacker. So, [time_akx_astral_rift_circle_leader.GetHeShe] struck first and launched an attack on the opponent. But due to nervousness, the first attack only injured the opponent and failed to suppress the threat. The other party was obviously also greatly frightened and seemed ready to take out a weapon to launch a counterattack.\n\n"
 time_akx.631.desc.truth_1:0 "The exploration team selected a new successor to replace §Y[time_akx_astral_rift_circle_leader.GetName]§!.\n\nWith lessons learned from the past, the exploration team always maintained group action to avoid any member being left alone. Facts proved that their plan was very correct. No similar incidents occurred along the way, and everyone was safe and sound.\n\nFortunately, the top of the tower can now be slightly seen. The morale of the exploration team has risen greatly, and reaching the top of the tower is just around the corner."
 time_akx.631.desc.truth_2:0 "The exploration team always felt that they were entering and exiting one place, and could even see that \"Butterfly Effect\" story again on the decoration of a room.\n\nThe exploration team thought they were lost, trapped in a maze they couldn't get out of, but occasionally they would find new rooms, giving hope to the team. Such hope and disappointment tossed back and forth. The exploration team had little desire to continue moving forward. Maybe it was only a matter of time before they gave up."
 time_akx.631.desc.attack:0 "$time_akx.631.desc.same$ §Y[time_akx_astral_rift_circle_leader.GetName]§! pulled the trigger again and successfully shot the opponent dead. Looking at the face of the deceased identical to [time_akx_astral_rift_circle_leader.GetHimHer]self, §Y[time_akx_astral_rift_circle_leader.GetName]§! was on the verge of mental collapse, and communication with us was also interrupted."
 time_akx.631.desc.communicate:0 "$time_akx.631.desc.same$ §Y[time_akx_astral_rift_circle_leader.GetName]§! calmed down, put down the weapon, and tried to negotiate with the opponent, but then lost contact with us."
 time_akx.631.desc.default:0 "$time_akx.631.desc.same$Since the opponent might launch a counterattack at any time, §Y[time_akx_astral_rift_circle_leader.GetName]§! could hardly suppress [time_akx_astral_rift_circle_leader.GetHerHis] excitement and aimed the weapon at the opponent, but still asked you for the next instruction."
 time_akx.631.a:0 "Pull the trigger, eliminate the threat!"
 time_akx.631.b:0 "Put down the weapon, try to negotiate!"
 time_akx.631.b.warning:0 "§RThe Dimension Traveler thinks this is a very dangerous option!§!"
 
 time_akx.632.name:0 "Beginning of Samsara"
 time_akx.632.desc.same:0 "The exploration team used the carried medicine to perform emergency treatment on §Y[time_akx_astral_rift_circle_leader.GetName]§! in time. Although the danger to life was temporarily avoided, permanent sequelae were left. Moreover, the emotions of §Y[time_akx_astral_rift_circle_leader.GetName]§! were still somewhat unstable.\n\nTo avoid §Y[time_akx_astral_rift_circle_leader.GetName]§! being attacked again, the exploration team decided to let [time_akx_astral_rift_circle_leader.GetHimHer] return the same way first and wait for news from the exploration team in the camp, while the exploration team continued to advance towards the top of the tower.\n\nBut the return journey was not calm. When §Y[time_akx_astral_rift_circle_leader.GetName]§! moved towards the bottom of the tower, [time_akx_astral_rift_circle_leader.GetHeShe] suddenly met another person with the same clothes as the team members. §Y[time_akx_astral_rift_circle_leader.GetName]§! was sure that other team members were advancing towards the top of the tower, so this person must be in the same group as the previous attacker. So, [time_akx_astral_rift_circle_leader.GetHeShe] struck first and launched an attack on the opponent. But due to nervousness, the first attack only injured the opponent and failed to suppress the threat. The other party was obviously also greatly frightened and seemed ready to activate some kind of shield device.\n\n"
 time_akx.632.desc.truth_1:0 "$time_akx.631.desc.truth_1$"
 time_akx.632.desc.truth_3:0 "Two §Y[time_akx_astral_rift_circle_leader.GetName]§! s and two exploration teams met again.\n\nAfter confirmation, all members of the other party were our team members themselves, just on different timelines. Regarding this tower, §Y[time_akx_astral_rift_circle_leader.GetName]§! also seemed to have discovered something: \"When you are going up, you are also going down. And when you go down, one of you will always successfully reach the top of the tower.\"\n\nThe two exploration teams all held hands and walked down one by one. On the way, they met other exploration teams. After explaining the reason, they all joined in.\n\nInfinite investigation teams are infinitely connected and infinitely looping in the infinite tower."
 time_akx.632.desc.attack:0 "$time_akx.632.desc.same$ §Y[time_akx_astral_rift_circle_leader.GetName]§! pulled the trigger again and successfully shot the opponent dead. But surprisingly, the opponent looked exactly like §Y[time_akx_astral_rift_circle_leader.GetName]§!, and various IDs on the body also indicated that the deceased was §Y[time_akx_astral_rift_circle_leader.GetName]§! [time_akx_astral_rift_circle_leader.GetHimHer]self.\n\n§Y[time_akx_astral_rift_circle_leader.GetName]§! was overwhelmed, not knowing what happened, and then the communication was suddenly interrupted."
 time_akx.632.desc.communicate:0 "$time_akx.632.desc.same$ §Y[time_akx_astral_rift_circle_leader.GetName]§! calmed down, put down the weapon, and tried to negotiate with the opponent, while the opponent only activated the shield device and did not show strong hostility.\n\nAfter some communication, both parties turned out to be §Y[time_akx_astral_rift_circle_leader.GetName]§! [time_akx_astral_rift_circle_leader.GetHimHer]self, which shocked both of them greatly. Our §Y[time_akx_astral_rift_circle_leader.GetName]§! decided to continue going up to notify other members of the exploration team; the other §Y[time_akx_astral_rift_circle_leader.GetName]§! prepared to go down to meet with [time_akx_astral_rift_circle_leader.GetHerHis] team members.\n\nAll this seems deja vu."
 time_akx.632.desc.default:0 "$time_akx.632.desc.same$Since the opponent's next move could not be predicted, §Y[time_akx_astral_rift_circle_leader.GetName]§! could hardly suppress [time_akx_astral_rift_circle_leader.GetHerHis] excitement and aimed the weapon at the opponent, but still asked you for the next instruction."
 time_akx.632.a:0 "Pull the trigger, eliminate the threat!"
 time_akx.632.b:0 "Put down the weapon, try to negotiate!"
 
 time_akx.641.name:0 "Ouroboros"
 time_akx.641.desc.default:0 "The exploration team finally successfully reached the top of the tower, and a smile of joy was on every member's face.\n\nWhen you asked about the situation of §Y[time_akx_astral_rift_circle_leader.GetName]§!, they were puzzled. The exploration team stated that §Y[time_akx_astral_rift_circle_leader.GetName]§! had died long ago and reported it to us in the previous log. Now the team is led by a successor elected by them. We verified the previous report. Although it did not match the memory, it did match what the exploration team said. Before we could think, the exploration team couldn't wait to report their findings: the top of this tower is a mysterious altar. Although it has been abandoned for a long time, the pattern of the worship object is still clearly visible-it is an Ouroboros.\n\nThe exploration of the tower has settled with the team's report, but we all know this is not the end."
 time_akx.641.a:0 "Ouroboros has no beginning and no end."
 time_akx.641.b:0 "This is not the beginning either."
 
 time_akx.642.name:0 "Lost in Spacetime"
 time_akx.642.desc.default:0 "The exploration team still failed to reach the top of the tower and had to choose to give up in the end.\n\nBut when they returned the same way, it took only a short time to reach the exit, as if they had always been wandering near the bottom of the tower. There was no §Y[time_akx_astral_rift_circle_leader.GetName]§! in the exploration team, but when you asked, they were confused. Not only the exploration team, but other liaison personnel responsible for communication were also confused, because we have never heard of the name §Y[time_akx_astral_rift_circle_leader.GetName]§!. §Y[time_akx_astral_rift_circle_leader.GetName]§! never existed from beginning to end.\n\nYou are sure your memory has no deviation, but reality is just like this. History is not immutable."
 time_akx.642.a:0 "Time will erase all unreasonableness."
 time_akx.642.b:0 "Someone got stuck in the maze of time."
 
 time_akx.643.name:0 "End of Cycle"
 time_akx.643.desc.default:0 "Finally, after our exploration team followed their predecessors back to the bottom of the tower, they found that the bottom of the tower is the top of the tower itself-this is not a tower at all, but a circle.\n\nWhen such a report was fed back to us, everyone couldn't figure out this logical relationship, but the exploration team seemed to have expected it-they have experienced every cycle. They suggested we recheck past reports because history has changed, and we have stepped into a different river.\n\nThe exploration team has returned to the rift sphere, ready to continue exploring the depths of the Inverse Phase."
 time_akx.643.a:0 "They saw through time with time."
 time_akx.643.b:0 "They transcended infinity with infinity."
 
 time_akx.651.name:0 "01100100 01100001 01110100 01100001" # data
 time_akx.651.desc.default:0 "The exploration team continued to grope forward in the void.\n\nAt some point, the rift sphere was surrounded by a weird stream, and the exploration team was almost wrapped and moved along with the stream. Blue silk threads shuttled, twisted, and interlaced rapidly in this stream, with no end in sight. §Y[leader.GetName]§! tried to increase engine power, but the viscous force and driving force of the stream were too strong. No matter how they tried, they could not drive the sphere out of the stream.\n\nHelplessly, the exploration team had to turn off the thrusters to save energy and let the sphere become a member of the blue threads."
 time_akx.651.a:0 "Will reach the destination eventually."
 
 time_akx.661.name:0 "01100011 01110010 01100001 01111010 01111001" # crazy
 time_akx.661.desc.default:0 "The days of drifting with the tide in the stream were long and tormenting, no less than the previous experience of being trapped in the endless tower. The members of the exploration team were almost driven crazy.\n\nAt first, everyone was interested in collecting the surrounding blue threads, but soon found that these threads did not seem to be solid entities. Extended robotic arms passed directly through the threads, like fishing for the moon in the water. Later, the exploration team tried to detect the physical properties of the blue threads by various means, and unexpectedly found that there was no interaction force between it and any substance we projected, just like a shadow under the light, visible but untouchable. This thread is likely not moving forward wrapped by the stream like the rift sphere, but actively moving along the stream.\n\nIn the end, everyone lost interest, staring blankly at the bottomless end of the stream. Suddenly, §Y[leader.GetName]§! burst into laughter, shouting that [leader.GetHeShe] knew everything, but couldn't say what was discovered. The team members thought [leader.GetHeShe] was crazy."
 time_akx.661.a:0 "Endless waiting will drive everyone crazy."
 
 time_akx.671.name:0 "01100111 01100001 01101101 01100101" # game
 time_akx.671.desc.a:0 "$time_akx.671.desc.default$\n\nYou chose the left box. §Y[leader.GetName]§! shouted excitedly: §C\"I knew you would choose this!\"§! [leader.GetHeShe] opened the lid; it was empty."
 time_akx.671.desc.b:0 "$time_akx.671.desc.default$\n\nYou chose the right box. §Y[leader.GetName]§! looked a bit confused: §C\"I thought you would choose the other one.\"§! [leader.GetHeShe] opened the lid; it was empty."
 time_akx.671.desc.default:0 "§Y[leader.GetName]§! took out two boxes from somewhere and said [leader.GetHeShe] wanted to play a game with you.\n\n§Y[leader.GetName]§! claimed that [leader.GetHeShe] put a lot of treasures in one of the two boxes, and the other was empty. If you can guess the correct box, you can get everything in the box, but regardless of whether you guessed right or not, §Y[leader.GetName]§! will tell everyone [leader.GetHerHis] discovery.\n\nWe cannot understand why §Y[leader.GetName]§! did this, and [leader.GetHeShe] also forbade us and other team members from using any instruments to analyze the contents of the box. It seems we have to try our luck."
 time_akx.671.a:0 "Choose the left box."
 time_akx.671.a.tooltip:0 "§YWhere did [leader.GetHeShe] get so many resources?§!"
 time_akx.671.b:0 "Choose the right box."
 time_akx.671.b.tooltip:0 "§YThe box is empty.§!"
 
 time_akx.672.name:0 "01100011 01101000 01100101 01100001 01110100" # cheat
 time_akx.672.desc.a:0 "$time_akx.672.desc.default$\n\nYou chose the left box. It is still empty. You feel cheated."
 time_akx.672.desc.b:0 "$time_akx.672.desc.default$\n\nYou chose the right box. It is still empty. You feel cheated."
 time_akx.672.desc.default:0 "Seeing you are dissatisfied, §Y[leader.GetName]§! proposed another round of the game.\n\n[leader.GetHeShe] readjusted the position of the treasure. The rules are the same as before. We still have a 50% chance of success."
 time_akx.672.a:0 "Choose the left box."
 time_akx.672.a.tooltip:0 "§YThe box is empty.§!"
 time_akx.672.b:0 "Choose the right box."
 time_akx.672.b.tooltip:0 "§YThe box is full of resources.§!"
 
 time_akx.681.name:0 "01110100 01110010 01110101 01110100 01101000" # truth
 time_akx.681.desc.same:0 "\n\nAfter speaking, §Y[leader.GetName]§! activated the hidden bomb, and the rift sphere exploded in an instant. But our communication was not interrupted because the rift sphere and all team members appeared intact outside the stream-they escaped successfully.\n\n§C\"Sure enough, the great will does not want us to die like this. If we die, the exploration of the rift will be suspended forever, and the plot cannot advance, so we will never die. Within the rules of the stream, we are destined unable to escape the stream. Only by breaking this rule can we find life in death.\"§!\n\nWe are very worried about the mental state of §Y[leader.GetName]§!, but also half-believe [leader.GetHerHis] conjecture. Everyone is looking at you."
 time_akx.681.desc.a:0 "§C\"The great will thinks he can perceive everything, but what he can see is only what another will wants him to see. I am just a pawn manipulated by a certain will, only sometimes this will is you, sometimes not you.\"§!\n\nThe choices you made seemed to be all predicted by §Y[leader.GetName]§!.\n\n§C\"Both of these boxes are actually empty. There is no treasure at all. However, how did you guess the 'correct' treasure box every time? Presumably, you can see something we cannot see, for example-the consequence of a certain event. Perhaps this is the secret of your ability to bring prosperity to our country. The world we live in may not be reality at all, but a plaything of higher-dimensional creatures including you.\"§!$time_akx.681.desc.same$"
 time_akx.681.desc.b:0 "§C\"The great will can use past experience, but this may not apply to new challenges. Honestly, your choice far exceeded my imagination.\"§!\n\n§Y[leader.GetName]§! seemed a bit unconfident, but still chose to continue speaking.\n\n§C\"Both of these boxes are actually empty. There is no treasure at all. You chose the 'empty treasure box' every time, perhaps out of anti-routine considerations, perhaps having experienced this event before, perhaps having jumped on the timeline, or perhaps purely relying on luck. I don't know; maybe only you know. Your choice indeed shook my once firm belief a bit, but I still intend to give it a shot. I dare not believe it, nor dare I doubt it. The world we live in may not be reality at all, but a plaything of higher-dimensional creatures including you.\"§!$time_akx.681.desc.same$"
 time_akx.681.desc.c:0 "§C\"The great will may be able to avoid temporary mistakes, but cannot avoid destined results. Before opening the box, no one knows what is in the box. Maybe it's empty, maybe it's not empty.\"§!\n\nYour choice puzzled §Y[leader.GetName]§!, but [leader.GetHeShe] soon realized the reason.\n\n§C\"Both of these boxes are actually empty. There is no treasure at all. However, why were your two choices 'worlds apart'? You didn't choose the other box because one box was empty, but because one 'option' failed, you chose another 'option'. Presumably, you can see something we cannot see, for example-the consequence of a certain event. Perhaps this is the secret of your ability to bring prosperity to our country. The world we live in may not be reality at all, but a plaything of higher-dimensional creatures including you.\"§!$time_akx.681.desc.same$"
 time_akx.681.hidden:0 "还有的是你意想不到的呢，你这小聪明鬼。"
 time_akx.681.a:0 "Don't break the fourth wall, you smart little devil."
 time_akx.681.a.tooltip:0 "§RThis may be destined to be a journey of no return!§!"
 time_akx.681.a.icon_text:0 "§H$RIFT_DIFFICULTY_TYPE$§!\n§RInferno (20)§!\n\n$RIFT_DIFFICULTY_TYPE_DESC$"
 time_akx.681.b:0 "Enough, return immediately!"
 
 time_akx.682.name:0 "Fruitless End"
 time_akx.682.desc:0 "The exploration team returned successfully. §Y[akx_wall_breaker.GetName]§! claimed that [akx_wall_breaker.GetHeShe] would make public [akx_wall_breaker.GetHerHis] findings in the Astral Rift.\n\nWe are not sure how many people will believe [akx_wall_breaker.GetHerHis] rhetoric, but if this conjecture is displayed to the public without reservation, the consequences are hard to estimate. Whether [akx_wall_breaker.GetHerHis] concept is correct or not, we must act."
 time_akx.682.a:0 "Control [akx_wall_breaker.GetName] immediately, and other team members too!"
 time_akx.682.b:0 "Everyone has the right to express their views. Rumors will collapse on their own."
 
 time_akx.690.name:0 "Connecting Infinity"
 time_akx.690.desc.default:0 "We realized that our exploration itself is destined to have no ending.\n\nAfter the rift sphere left the stream, our exploration team continued to advance towards the unfathomable void, but after a while, we lost contact with them. The anchor chain connecting the sphere has reached the limit of its length, but it is still extending, as if growing by itself. For safety reasons, we did not stop this eerie phenomenon, but waited quietly for the message from the exploration team.\n\nIn the long years, we have never received any communication about the exploration team, but the extension of the anchor chain became proof of their safety. Until one day, the anchor chain suddenly stopped growing, and we had no way to obtain the whereabouts of the exploration team. Finally, we decided to retract the anchor chain to retrieve the exploration team, but no matter what method we used, we could not pull it to the end. Even the marks we made on the anchor chain reappeared in front of us a few days later.\n\nInfinite anchor chains loop infinitely in infinite rifts. We finally had to give up, sealing the anchor chain and the sphere in the river of time."
 time_akx.690.a:0 "The other end of the anchor chain is infinity."
 
 time_akx.691.name:0 "End of the Maze"
 time_akx.691.desc.default:0 "We realized that our exploration itself is a loop.\n\nAfter the rift sphere left the stream, our exploration team continued to advance towards the unfathomable void, but after a while, we lost contact with them. The anchor chain connecting the sphere has reached the limit of its length, but it is still extending, as if growing by itself. For safety reasons, we did not stop this eerie phenomenon, but waited quietly for the message from the exploration team.\n\nIn the long years, we have never received any communication about the exploration team, but the extension of the anchor chain became proof of their safety. Finally, the exploration team achieved a return voyage in the rift sphere. They excitedly recounted what they saw and heard in the rift, expressing their longing for the motherland, complaining about our interruption of contact with them, and thanking us for persevering in extending the anchor chain for them.\n\nBut puzzlingly, our anchor chain is still growing, which means the exploration team is still advancing.\n\nThen who exactly are we welcoming now?"
 time_akx.691.a:0 "Welcome home, future [leader.GetName]."
 
 time_akx.692.name:0 "One Hundred Years of Solitude"
 time_akx.692.desc:0 "We held a reception for the exploration team and found everyone weathered.\n\n§Y[akx_wall_breaker.GetName]§! said that they traveled in the Astral Rift for hundreds of years. In this long time, they also figured out that whether the world is real or not, they will live on as before. Living-needs no reason. The world is so big, there are still too many unsolved mysteries waiting for them to discover. Tangling with truth and falsehood is meaningless. The journey of exploring the truth never ends.\n\n§Y[akx_wall_breaker.GetName]§! gave you a sly smile, indicating that [akx_wall_breaker.GetHeShe] would keep silent about that discovery in the rift, but also hoped you would not ask about [akx_wall_breaker.GetHerHis] secret anymore."
 time_akx.692.a:0 "Let's toast to my secret, to your secret!"
 time_akx.692.b:0 "This is a secret belonging to you and me, not the Hive's secret."
 time_akx.692.c:0 "This is a secret belonging to you and me, not the Network's secret."
 
 ################################################################
 # Deviation
 ################################################################
 
 time_akx.1000.name:0 "Deviation"
 time_akx.1000.desc.1:0 "We deviated from the course on the way forward. Fortunately, §HThe Worm-in-Waiting§! noticed this in time and helped us return to the right path."
 time_akx.1000.desc.2:0 "We seem to be intentionally deviating from the course. §HThe Worm-in-Waiting§! has issued a warning to us: if we deviate again, It will send down severe §Rpunishment§!."
 time_akx.1000.desc.3:0 "In a moment unnoticed by anyone, §Rpunishment§! arrived quietly. Our deliberate deviation from the course angered this God of Time. The love It once gave us has long turned into boundless malice."
 time_akx.1000.desc.4:0 "§RPunishment§! arrived as expected."
 time_akx.1000.a:0 "Are we wrong?"
 time_akx.1000.a.tooltip:0 "Removes §YGenocidal Civic§! concepts"
 time_akx.1000.b:0 "We went too far."
 time_akx.1000.b.tooltip:0 "§RWe absolutely cannot deviate from the course again!§!"
 time_akx.1000.c:0 "..."
 time_akx.1000.c.tooltip:0 "§RThe punishment has descended, and the price is everything we have...§!"
 
 ################################################################
 # Void Nightmare
 ################################################################
 
 time.1005.name:0 "Void Nightmare"
 time.1005.desc:0 "When a voidworm we tamed died in a space battle in §Y[dimensional_horror_voidworms_fleet.solar_system.GetName]§!, the spacetime around it suddenly twisted. Subsequently, a small Nightmare of the Plane quietly appeared from the void.\n\nWe don't know the cause of this §YVoid Nightmare§!, but scientists guess that the §YInverse Phase Distortion§! carried by the voidworm may have induced this phenomenon, or perhaps this Void Nightmare is the dead voidworm itself. This newborn monster is curiously looking at the world it is in. It seems to have no hostility towards us, but this may be only temporary.\n\nIn any case, it has forever escaped our control."
 time.1005.a:0 "Creation born of the void."