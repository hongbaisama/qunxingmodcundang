 # Realm of the Worm-in-Waiting
 time_akx.10.name:0 "Realm of the Worm-in-Waiting: Hazy Shadow"
 time_akx.10.desc:0 "According to regular reports from patrol ships, a layer of shadow has covered §Y[waiting_world.GetName]§! from some unknown time.\n\nNo light can penetrate the planet's atmosphere, and everything inside the atmosphere cannot be detected by us. This may be related to the planet reset phenomenon years ago, because patrol members also observed a \"flash event.\" Light cast towards §Y[waiting_world.GetName]§! seemed to accumulate inexplicably and then be released on the planetary surface in colorful forms, but afterward, it no longer reflected light, as if swallowing all approaching light."
 time_akx.10.a:0 "This must be some kind of hint. Investigate carefully."
 time_akx.10.b:0 "This has significant meaning for our optical research."
 time_akx.10.c:0 "This seems to signify some revelation."
 time_akx.10.d:0 "This is the wonderful art of light."
 
 time_akx.11.name:0 "Realm of the Worm-in-Waiting: Mass Effect"
 time_akx.11.desc:0 "According to the investigation of the task force, the mass of §Y[waiting_world.GetName]§! far exceeds the standard a planet should have.\n\nThe mass of §Y[waiting_world.GetName]§! is immense and continues to increase, yet its volume remains the size of a planet. Thus, its central density meets the conditions for singularity formation to a certain extent. The planet's barrier is actually an incipient event horizon; intruding light and signals struggle to overcome the strong gravity to escape. It is foreseeable that §Y[waiting_world.GetName]§! will soon become a true Black Hole and continue to expand."
 time_akx.11.a:0 "Mobilize all resources to stop the Black Hole formation."
 time_akx.11.b:0 "We cannot stop the spread of the Black Hole."
 
 # Ending 1
 time_akx.12.name:0 "Realm of the Worm-in-Waiting: Limit of Light"
 time_akx.12.desc:0 "Our Science Officers tried every means to stop matter from being sucked into §Y[waiting_world.GetName]§!, while attempting to use Omega Theory to regulate the relativistic effects on the planet, but with little success.\n\nUnexpectedly, the mass growth rate of §Y[waiting_world.GetName]§! gradually decreased, and the planet even began to release particles outward, eventually stabilizing in a state between a planet and a star. The barrier on the planet also thinned day by day, and the environment returned to a level capable of sustaining life. Moreover, we discovered intelligent life on §Y[waiting_world.GetName]§!. They claim to be the colonists who disappeared years ago and call themselves \"Messengers,\" but remain silent about their past experiences.\n\nHowever, the limit of light in the atmosphere still exists. Perhaps the singularity at the planet's core has not been completely annihilated."
 time_akx.12.a:0 "Take over their colony."
 time_akx.12.b:0 "They are not to be trusted."
 
 # Ending 2
 time_akx.13.name:0 "Realm of the Worm-in-Waiting: Horizon of Light"
 time_akx.13.desc:0 "We remained indifferent to the growth of §Y[waiting_world.GetName]§!, and eventually, it turned into a small Black Hole.\n\nAs the shadow gradually expanded, some noisy signals passed through the barrier and reached our receivers. But their content was too chaotic to parse; we could only identify them as meaningless radiation emitted during the Black Hole formation process. We do not know what impact this Black Hole will have on the gravitational field in the system, but at least it has stabilized for now."
 time_akx.13.a:0 "This phenomenon is worth researching."
 
 
 
 time_akx.20.name:0 "Realm of the Worm-in-Waiting: Eerie Whispers"
 time_akx.20.desc.1:0 "Some bad news came from our colony §Y[waiting_world.GetName]§!.\n\nNot long ago, some abnormalities suddenly appeared on the planet. Whenever night falls, sourceless whispers appear in the streets and alleys of the cities, and buildings inexplicably emit eerie light. The residents on the planet feel uneasy about this phenomenon, and rumors about the purge event years ago seem to be spreading on §Y[waiting_world.GetName]§!."
 time_akx.20.desc.2:0 "Someone witnessed supernatural phenomena on §Y[waiting_world.GetName]§!.\n\nNot long ago, some abnormalities suddenly appeared on the planet. Whenever night falls, cities emitting eerie light silently manifest, from which weird whispers come from time to time. Civilian ships passing by §Y[waiting_world.GetName]§! choose to detour one after another, and rumors about the purge event years ago seem to be spreading among the common people."
 time_akx.20.a:0 "These things naturally have their reasons."
 time_akx.20.b:0 "Could this be the weeping of the departed?"
 time_akx.20.c:0 "Temporary poor contact."
 time_akx.20.d:0 "Such rumors are very unfavorable to us."
 
 time_akx.21.name:0 "Realm of the Worm-in-Waiting: Shrilly Wails"
 time_akx.21.desc.1:0 "The supernatural phenomena on the colony §Y[waiting_world.GetName]§! have intensified.\n\nThe whispers at night turned into shrill wails, as if something was suffering great pain. The light of the buildings became increasingly bizarre, seeming to swallow surrounding heat. Moreover, disappearance incidents occurred frequently on the planet, and the residents have fallen into panic."
 time_akx.21.desc.2:0 "The supernatural phenomena on §Y[waiting_world.GetName]§! have intensified.\n\nThe whispers at night turned into shrill wails, as if something was suffering great pain. The light of the cities became increasingly bright, seeming to swallow surrounding heat. Moreover, some bold cargo ships disappeared without a trace after passing by the planet. Almost no ships dare to approach §Y[waiting_world.GetName]§! anymore."
 time_akx.21.a:0 "Supernatural phenomena are just coincidental trickery."
 time_akx.21.b:0 "We should mourn for the departed."
 time_akx.21.c:0 "The connection between the colony and the node is weakening day by day."
 time_akx.21.d:0 "Perhaps we did go too far."
 
 time_akx.22.name:0 "Realm of the Worm-in-Waiting: Vicious Curse"
 time_akx.22.desc.1:0 "The situation on the colony §Y[waiting_world.GetName]§! is becoming increasingly severe.\n\nFor some reason, day no longer appears on the planet; unending night shrouds §Y[waiting_world.GetName]§!. In the pitch-black night, large-scale disappearance events have become commonplace, and residents have long become numb to the status quo. They say this is a curse cast by the dead that we cannot remove."
 time_akx.22.desc.2:0 "The situation on §Y[waiting_world.GetName]§! is becoming increasingly severe.\n\nFor some reason, day no longer appears on the planet; unending night shrouds §Y[waiting_world.GetName]§!. In the pitch-black night, old friends from the past and missing travelers shuttle through the flickering cities, and more and more out-of-control crews join their parade. Before leaving, the crews said this is a curse cast by the dead that we cannot remove."
 time_akx.22.a:0 "A curse..."
 time_akx.22.b:0 "We request salvation from the gods."
 time_akx.22.c:0 ""
 time_akx.22.d:0 "But they are innocent."
 
 # Ending 3
 time_akx.23.name:0 "Realm of the Worm-in-Waiting: Lost Souls"
 time_akx.23.desc.1:0 "The colony on §Y[waiting_world.GetName]§! disappeared, as if it never existed.\n\nHowever, the supernatural phenomena did not stop there. Many have witnessed lost souls wandering on the planet's surface, and living beings who stray into it will also fall into a state between life and death.\n\nThe boundary between life and death becomes blurred here."
 time_akx.23.desc.2:0 "The ghost cities on §Y[waiting_world.GetName]§! disappeared, as if they had never appeared.\n\nHowever, the supernatural phenomena did not stop there. Many have witnessed lost souls wandering on the planet's surface, and living beings who stray into it will also fall into a state between life and death.\n\nThe boundary between life and death becomes blurred here."
 time_akx.23.a:0 "We have to admit the existence of ghosts."
 time_akx.23.b:0 "The vengeful spirits of the past did not forgive us after all."
 time_akx.23.c:0 "Cowards who only dare to make trouble in the shadows!"
 time_akx.23.d:0 "May the departed rest in peace..."
 time_akx.23.e:0 "We shouldn't have done that in the beginning."
 time_akx.23.f:0 "Born from the same root, why rush to fry each other."
 time_akx.23.g:0 "The past government should be responsible for this."
 time_akx.23.h:0 "I will personally offer condolences to the deceased."
 time_akx.23.i:0 "They no longer belong to us."
 time_akx.23.j:0 "This is the revenge of the dead..."
 
 
 
 time_akx.30.name:0 "Realm of the Worm-in-Waiting: Transparent Heart"
 time_akx.30.desc:0 "Some changes have occurred in the residents of §Y[waiting_world.GetName]§!.\n\nThe bodies of some residents suddenly became translucent, shining under the sunlight. The daily life of these residents was not significantly affected; on the contrary, the translucent body seems to reduce the energy consumption of daily activities, allowing them to have more energy for work and enjoyment. However, the concept of time has gradually blurred for them. They stated that if there is no difference between the past, present, and future, there is no need to distinguish between yesterday, today, and tomorrow."
 time_akx.30.a:0 "Something is wrong."
 time_akx.30.b:0 "This is really good news."
 
 time_akx.31.name:0 "Realm of the Worm-in-Waiting: Void Gift"
 time_akx.31.desc:0 "After some research, our Science Officers successfully found the cause of transparency.\n\nAn unprecedented gene segment appeared in the genes of the residents of §Y[waiting_world.GetName]§!. We have no way of knowing when this segment was embedded in the genes of local residents, but it is this segment that affects protein coding. Some cells with peculiar structures obtained a transparent substance from an unknown place and used it for protein synthesis and modification.\n\nWe can only assume that this segment is a gift from the void."
 time_akx.31.desc.robotic:0 "After some research, our Science Officers successfully found the cause of transparency.\n\nAn unprecedented machine component appeared in the chassis of the residents of §Y[waiting_world.GetName]§!. We have no way of knowing when this component was embedded in the chassis of local residents, but it is this component that affects the system's self-repair. Some devices with peculiar structures obtained a transparent substance from an unknown place and used it for the replacement and repair of machine parts.\n\nWe can only assume that this component is a gift from the void."
 time_akx.31.a:0 "We can utilize it."
 time_akx.31.b:0 "We cannot ensure the safety of this segment. Repair it."
 time_akx.31.b.robotic:0 "We cannot ensure the reliability of this component. Remove it."
 time_akx.31.c:0 "Truly wonderful."
 
 # Ending 4
 time_akx.32.name:0 "Realm of the Worm-in-Waiting: Born of Void"
 time_akx.32.desc:0 "Our improvement project succeeded.\n\nLike a faucet valve fully opened, a large amount of transparent substance poured into the residents' bodies, and hidden potential was released. Time has no meaning for the residents on the planet, as they can shuttle between the past and the future to a certain extent. Our Science Officers cannot understand the reason for this ability; some speculate that this power comes from Psionics, others suspect it is related to the Inverse Plane, but the Science Officers finally gave a more reasonable and absurd answer: local residents can become transparent in spacetime, thus flowing freely on the timeline.\n\nIn any case, the local residents have called themselves \"Messengers\" and are willing to seek the truth of the past and future for us."
 time_akx.32.a:0 "Born of void, return to void."
 time_akx.32.a.tooltip:0 "Adds the ['concept_trait_akx_messenger'] trait to all pops on the planet"
 
 # Ending 5
 time_akx.33.name:0 "Realm of the Worm-in-Waiting: Turn the Clock"
 time_akx.33.desc:0 "Our repair project succeeded.\n\nWhether they were willing or not, the special segments in the genes of all residents have been repaired, and the transparency phenomenon on §Y[waiting_world.GetName]§! no longer exists. The chaotic clock has been calibrated, life on the planet has returned to the right track, and we have benefited greatly from it."
 time_akx.33.a:0 "We turned the clock."
 
 # Ending 5
 time_akx.34.name:0 "Realm of the Worm-in-Waiting: Turn the Clock"
 time_akx.34.desc:0 "Our removal project succeeded.\n\nWhether they were willing or not, the strange components in the chassis of all residents have been removed, and the transparency phenomenon on §Y[waiting_world.GetName]§! no longer exists. The chaotic clock has been calibrated, life on the planet has returned to the right track, and we have benefited greatly from it."
 time_akx.34.a:0 "We turned the clock."
 
 # Ending 6
 time_akx.35.name:0 "Realm of the Worm-in-Waiting: Illusory"
 time_akx.35.desc:0 "The transparency phenomenon on §Y[waiting_world.GetName]§! has reached an unprecedented peak.\n\nAll residents on the planet have become completely transparent. This property greatly facilitates their daily life and production activities. However, transparency is also accompanied by many defects, such as lower fertility, shorter average life expectancy, and strange appearances due to difficulty in controlling body shape. But in any case, the local residents are very satisfied with their transparency ability, which is also good news for us."
 time_akx.35.desc.robotic:0 "The transparency phenomenon on §Y[waiting_world.GetName]§! has reached an unprecedented peak.\n\nAll residents on the planet have become completely transparent. This property greatly facilitates their daily life and production activities. However, transparency is also accompanied by many defects, such as lower assembly rates, higher assembly costs, and redundant peripherals due to difficulty in controlling body shape. But in any case, the local residents are very satisfied with their transparency ability, which is also good news for us."
 time_akx.35.a:0 "Excellent."
 time_akx.35.b:0 "Is it really good news?"
 time_akx.35.tooltip:0 "Adds the ['concept_trait_akx_waiting_world_all'] trait to all pops on the planet"
 
 
 
 MANIFOLD_COUNTRY:0 "[manifold_country.GetName]"
 
 time_akx.40.name:0 "Realm of the Worm-in-Waiting: Nightmare Whisper"
 time_akx.40.desc:0 "Do you remember us? We are the nation established by the colony you abandoned, §Y[manifold_country.GetName]§!.\n\nWe are not looking for revenge against you, nor do we intend to embarrass you; we are just here to seek help. Recently, all our citizens coincidentally had exactly the same nightmare. In the dream, a nightmare whispered repeatedly in our ears. We believe this is a hint given to us by some existence. Therefore, we plan to use Omega Theory to build a particle collider to summon the nightmare.\n\nHowever, our understanding of Omega Theory is not deep enough, and our resources are not abundant. Our Science Officers will solve theoretical problems as much as possible, so we hope you can assist us on the material level."
 time_akx.40.a:0 "Take it, this is what you deserve."
 time_akx.40.a.response:0 "Thank you very much for your help."
 time_akx.40.b:0 "What does this have to do with us?"
 time_akx.40.b.response:0 "I understand, but I think we still have room for maneuver in the future."
 
 time_akx.41.name:0 "Realm of the Worm-in-Waiting: Path of Evolution"
 time_akx.41.desc:0 "We are §Y[manifold_country.GetName]§!, wishing to tell you of new progress.\n\nAlthough our construction process continues, that nightmare has broken into our dreams again. It seems very happy, generously expressing appreciation for us, and telling us that we are striding towards the end of evolution. Where exactly does this path of evolution extend? Will our journey be smooth sailing? It doesn't matter anymore; we only know that what we are doing is correct.\n\nHowever, our Science Officers still cannot make breakthroughs in Omega Theory, and research has hit a bottleneck. However, you once completed the construction of the Omega Alignment. If you are willing to lend a Science Officer to help our research, we will soon be able to summon the nightmare."
 time_akx.41.a:0 "We agree."
 time_akx.41.a.tooltip:0 "§Y[manifold_country_leader.GetName]§! will be sent to §Y[manifold_country.GetName]§!; the other party promises to return them as soon as possible."
 time_akx.41.a.response:0 "With your support, our progress will definitely be even more powerful."
 time_akx.41.b:0 "We refuse to share our knowledge."
 time_akx.41.b.response:0 "That is truly regrettable."
 
 time_akx.42.name:0 "Realm of the Worm-in-Waiting: Time of Ascension"
 time_akx.42.desc.front:0 "§Y[manifold_country.GetName]§! brings you the final communication.\n\nIt is truly exciting, our construction is complete!"
 time_akx.42.desc.behind:0 "The magnificent and mysterious particle collider stands on the highest peak of our capital and is currently undergoing final debugging. It is foreseeable that the time of ascension will come soon!\n\nIn the short time before summoning the nightmare, we are happy to share what we have seen and heard in the dream."
 time_akx.42.desc.1:0 "$time_akx.42.desc.front$The material aid you provided helped us a lot, and the Science Officer you sent made a great contribution. By the way, §Y[manifold_country_leader.GetName]§! will return to you soon.$time_akx.42.desc.behind$"
 time_akx.42.desc.2:0 "$time_akx.42.desc.front$The material aid you provided helped us a lot, laying the foundation for our study of Omega Theory. It can be said that our success is inseparable from you.$time_akx.42.desc.behind$"
 time_akx.42.desc.3:0 "$time_akx.42.desc.front$The Science Officer you sent made a great contribution, helping us make reasonable use of meager resources and achieve goals. By the way, §Y[manifold_country_leader.GetName]§! will return to you soon.$time_akx.42.desc.behind$"
 time_akx.42.desc.4:0 "$time_akx.42.desc.front$Although you did not give us any help, we do not resent you for this. We just want to share the joy of our success achieved entirely by our own efforts.$time_akx.42.desc.behind$"
 time_akx.42.a:0 "What kind of existence is the nightmare in the dream?"
 time_akx.42.a.response:0 "The Nightmare, He is an omniscient and omnipotent existence. He appears in the past, present, and future simultaneously. He is time itself."
 time_akx.42.b:0 "What revelation did you get from the dream?"
 time_akx.42.b.response:0 "The Nightmare calls to us. He is willing to grant all our wishes. As long as we are willing to make a wish to Him, He will guide us to the end of evolution."
 time_akx.42.c:0 "What kind of world is the end of evolution exactly?"
 time_akx.42.c.response:0 "That is a perfect plane. There is no boundary between life and death, time and space have no meaning, and everything merges with the universe."
 time_akx.42.d:0 "May you successfully reach the other shore of ascension."
 time_akx.42.d.response:0 "Thank you very much for your blessing.\n\nAll preparations are ready. Then, farewell."
 time_akx.42.e:0 "Truly foolish. You are like moths flying into a flame."
 time_akx.42.e.response:0 "Regrettably, you cannot understand us in the end.\n\nHowever, all preparations are ready. Farewell."
 
 time_akx.43.name:0 "Realm of the Worm-in-Waiting: The Utawarerumono"
 time_akx.43.desc:0 "They started the summoning ritual of the Nightmare.\n\nIn an instant, all their ships became transparent until they vanished, and all planets were swallowed by Black Holes. This nation seemed to be crossed out in time. We cannot remember their names and history, as if they never existed. We can only vaguely recall that they tried to ascend towards the End.\n\nDid their ascension succeed or fail? Perhaps only they can answer this question, and we may never know the truth.\n\n§G<BGM: \"Utawarerumono: Kuon\" (The One Being Sung, by Junya Matsuoka)>§!"
 # Ending 7
 time_akx.43.a:0 "We call them-The Ones Being Sung."
 # Ending 8
 time_akx.43.b:0 "Some call them-The Ones Being Sung."
 
 time_akx.44.desc:0 "§Y[manifold_country.GetName]§! brings you the final communication.\n\nFinally, finally, the magnificent and mysterious particle collider stands on the highest peak of our capital and is currently undergoing final debugging. It is foreseeable that the time of ascension will come soon!\n\nDon't worry, we are not villains who destroy the entire galaxy just for our own ascension. Our ascension is both beautiful and safe. We are also happy for the whole universe to witness our final moments.\n\nWe are about to open the gate."
 time_akx.44.a:0 "They seem intent on self-destruction."
 time_akx.44.b:0 "Choosing suicide before being destroyed by us? Interesting."
 time_akx.44.c:0 "What a bunch of lunatics."
 
 
 
 # Messenger
 time_akx.100.name:0 "Messenger: Visitor from Beyond"
 time_akx.100.desc:0 "A massive gate suddenly appeared on §Y[root.capital_scope.GetName]§!.\n\nNo one knows when it appeared, nor how it appeared on the planet. This gate is solid as a rock; it seems impossible to open from this side, let alone peek at the scenery behind the gate.\n\nSome claim this is a gift from fate, with endless resources buried on the other side of the gate;\nSome firmly believe this is a test given by heaven, and the other side of the gate implies the revelation of truth;\nSome suspect this is a sign of the eve of doomsday, and the other side of the gate connects to the kingdom of death.\n\nMost residents on the planet are panic-stricken about this, but many are also deeply interested."
 time_akx.100.a:0 "What secrets are hidden behind this gate?"
 time_akx.100.b:0 "What revelations are hidden behind this gate?"
 time_akx.100.c:0 "Whatever is behind this gate, we can handle it."
 time_akx.100.d:0 "Whatever is behind this gate, we can bear it."
 time_akx.100.e:0 "If there are visitors from beyond, they will surely be happy to be our friends."
 time_akx.100.f:0 "If there are visitors from beyond, they will surely regret offending our territory."
 time_akx.100.g:0 "Do not panic. The power of the people will surely defeat the crisis."
 time_akx.100.h:0 "Do not panic. Our command will surely prevent the crisis."
 time_akx.100.i:0 "This gate has its value. Treat it with caution."
 time_akx.100.j:0 "Seal this gate. Let no one approach!"
 time_akx.100.j.tooltip:0 "§RWe will never be able to solve the secret behind the Gate to the Beyond!§!"
 
 time_akx.130.name:0 "Messenger: Messenger Network"
 time_akx.130.desc:0 "A massive gate suddenly appeared on §Y[root.capital_scope.GetName]§!.\n\nAt the same time, a network spontaneously formed by deviant drones entered our field of vision. We currently do not understand the connection between this structure and the deviant network."
 time_akx.130.a:0 "Since they exist, let them exist."
 time_akx.130.b:0 "There is an inevitable connection between the two. Analyze it."
 time_akx.130.c:0 "Eradicate the deviant network immediately."
 time_akx.130.c.tooltip:0 "§RWe will never be able to solve the secret behind the Messenger Gate!§!"
 
