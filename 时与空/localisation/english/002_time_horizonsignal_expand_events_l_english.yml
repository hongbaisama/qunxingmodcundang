 situation_akx_gestalt_messenger_fail_effect:0 "We will prevent the construction of the Messenger Network."
 
 time_akx.101.name:0 "Messenger: Visitor from the End"
 time_akx.101.desc:0 "The Gate to the Beyond slowly opened, and a group of bizarrely dressed §Y[owner.GetSpeciesName]§! walked out. We recognized them at a glance as the Messenger species from the escape pod earlier. They claim to be from the future and wish to share their experiences with us.\n\nIt is said that the future of the world is full of disaster. Every planet is piled with the ruins of cities, and in every system, battleships advance and retreat in tit-for-tat struggles. All interstellar nations have torn up past covenants, deepened mutual grudges, and competed with each other to become the sole galactic hegemon, struggling to avoid the fate of being swallowed."
 time_akx.101.a:0 "Truly a terrible future."
 
 time_akx.102.name:0 "Messenger: Elegy of Calamity"
 time_akx.102.desc:0 "The Gate to the Beyond opened again, and more §Y[owner.GetSpeciesName]§! arrived at §Y[target.GetName]§!, also having transparent body characteristics.\n\nThey say the future has become dark, and the result of everything stems from the discovery of Horrific Inverse Mass-top Science Officers researched Horrific Inverse Mass and found it possesses some weird properties. Using Horrific Inverse Mass, people can distort spacetime and planes to a certain extent, and go to the infinite past to plunder abundant resources. It is precisely the disappearance of resources that caused the cosmic cycle to completely derail and made world damage a reality.\n\nHowever, the travel devices carried by this batch of travelers have exhausted their energy. Therefore, they implore us to provide a sum of funds to facilitate their escape to the past."
 time_akx.102.a:0 "I want to learn more secrets of the End."
 time_akx.102.b:0 "They are just a bunch of liars!"
 
 # Ending 1
 time_akx.103.name:0 "Messenger: Dark Age"
 time_akx.103.desc:0 "The Gate to the Beyond opened for the last time, and a large group of §Y[owner.GetSpeciesName]§! visited our planet. We felt the flow of spacetime from them.\n\nThey claimed that the End has entered the Dark Age, possessing chaos incomparable to any point in time in the future. Therefore, except for those poor souls who lost their way, no one needs to return to the future anymore. They are already the last batch of time travelers, but they begged us to rewrite the End, hoping to break the endless disaster of the Dark Age.\n\nThis group of Messengers from the End returned to the Gate to the Beyond after resting. Since then, the gate closed tightly and never opened again."
 time_akx.103.a:0 "Mourn for the collapse of the End."
 
 
 
 time_akx.111.name:0 "Messenger: Visitor from Future"
 time_akx.111.desc:0 "The Gate to the Beyond slowly opened, and a group of bizarrely dressed §Y[owner.GetSpeciesName]§! walked out. We recognized them at a glance as the Messenger species from the escape pod earlier. They claim to be from the future and wish to share their experiences with us.\n\nIt is said that the future of the world is full of beauty. Every planet is built with prosperous cities, and cargo ships come and go methodically in every system. All interstellar nations have abandoned past prejudices, eliminated mutual barriers, and jointly formed a united Galactic Federation, striving for the goal of creating a better future."
 time_akx.111.a:0 "Truly a wonderful future."
 
 time_akx.112.name:0 "Messenger: Hymn of Hope"
 time_akx.112.desc:0 "The Gate to the Beyond opened again, and more §Y[owner.GetSpeciesName]§! arrived at §Y[target.GetName]§!, also having transparent body characteristics.\n\nThey say the future has become bright, and the cause of everything lies in the discovery of Horrific Inverse Mass-top Science Officers researched Horrific Inverse Mass and found it possesses some wonderful properties. Using Horrific Inverse Mass, people can distort spacetime and planes to a certain extent, and go to the infinite past to gather abundant resources. It is precisely the influx of resources that allowed galactic civilization to completely break away from competition and made galactic unification possible.\n\nHowever, the travel devices carried by this batch of travelers have exhausted their energy. Therefore, they implore us to provide a sum of funds to facilitate their return to the future."
 time_akx.112.a:0 "I want to hear more stories of the future."
 time_akx.112.b:0 "They are just a bunch of liars!"
 
 # Ending 2
 time_akx.113.name:0 "Messenger: Age of Light"
 time_akx.113.desc:0 "The Gate to the Beyond opened for the last time, and a large group of §Y[owner.GetSpeciesName]§! visited our planet. We felt the flow of spacetime from them.\n\nThey claimed that the future has entered the Age of Light, possessing splendor incomparable to any point in time in the past. Therefore, except for those resource extraction workers, no one needs to return to the past anymore. They are already the last batch of time travelers, but they welcome us very much to go to the future and enjoy the infinite beauty of the Age of Light together.\n\nThis group of Messengers from the future returned to the Gate to the Beyond after the visit. Since then, the gate closed tightly and never opened again."
 time_akx.113.a:0 "Cheer for the glory of the future."
 
 
 
 # Ending 3
 time_akx.120.name:0 "Messenger: Suspicion"
 time_akx.120.desc:0 "After a bumpy interrogation, we determined that the people who came out of the Gate to the Beyond are all liars. How should we deal with them next?"
 time_akx.120.a:0 "Let them stay and atone for their deception."
 time_akx.120.a.tooltip:0 "Gain a number of §YMessengers§!"
 time_akx.120.b:0 "Expel them to the other side of the gate, and crush this spooky broken gate into residue!"
 
 
 
 time_akx.131.name:0 "Messenger: Parallel Terminal"
 time_akx.131.desc:0 "More drones have joined this deviant network, and the drones in the network have become a bit odd.\n\nThrough communication with the Messenger Network, we learned that this network coexists outside and inside the gate, and the world inside the gate is another parallel universe. These drones are not deviant but are attempting to connect with the parallel \"us,\" although this action has not been authorized by us."
 time_akx.131.a:0 "Interesting."
 
 time_akx.132.name:0 "Messenger: Riddle Answer"
 time_akx.132.desc:0 "With our indulgence, the scale of the deviant network grew day by day, and transparent body characteristics appeared in the drones in the network.\n\nThis time, the Messenger Network actively contacted us and stated that the parallel \"us\" is performing endless calculations, seeming to look for the answer to some riddle. The Messenger Network hopes that we can provide assistance for the calculation and is certain that the answer to the riddle is crucial to us."
 time_akx.132.a:0 "We also crave the answer."
 time_akx.132.b:0 "You have fallen into complete chaos."
 
 # Ending 4
 time_akx.133.name:0 "Messenger: What is the Question"
 time_akx.133.desc:0 "The number of members in the Messenger Network is not what it used to be, and the drones seem to carry the flow of spacetime.\n\nThe calculations in the parallel world seem to be going very smoothly. The Messenger Network sent us a steady stream of data, which might be the so-called riddle answers. However, they didn't tell us, or rather, they didn't know, what the question to these answers was. We don't know the question, so we can't use the answer.\n\nNow, the Messenger Network is busy again; they plan to seek what the question is in the parallel world."
 time_akx.133.a:0 "What is the question?"
 
 # Ending 5
 time_akx.134.name:0 "Messenger: Jamming Signal"
 time_akx.134.desc:0 "After some analysis and investigation, we finally confirmed that this strange gate emits jamming signals and puts drones into a deviant state, which led to the construction of the so-called \"Messenger Network.\""
 time_akx.134.a:0 "Let the \"Messenger Network\" be used by us."
 time_akx.134.b:0 "Use research results to destroy this peculiar gate."
 
 
 
 # Syzygy
 syzygy_admiral_digsite:0 "Omega Ark"
 syzygy_admiral_digsite_desc:0 "An eerie ship sailed out of the Black Hole, but stopped functioning halfway.\n\nWhere exactly did it come from, why did it appear, and why did it stop?"
 syzygy_admiral_digsite_stop_tooltip:0 "§RThe deciphering operation has made no progress so far§!"
 no_syzygy_admiral_tooltip:0 "§RWe may never solve this mystery§!"
 requires_can_approach_black_hole_tooltip:0 "§RThis ship is too close to the Black Hole; only Leaders who can ['concept_can_approach_black_hole'] can explore it§!"
 requires_worm_tomb_ending_digsite:0 "§RThis ship is too close to the Black Hole; we cannot investigate§!"
 
 time_akx.200.name:0 "Syzygy: Omega Ark"
 time_akx.200.desc:0 "Recently, an eerie ship was witnessed sailing out of §Y[syzygy_admiral_planet.GetName]§!.\n\nThis ship stopped functioning as soon as it sailed out of the event horizon, seeming to have exhausted all energy. Scans of the ship showed no life signals on board. We can only guess that the pilot of the ship died in the process, or the ship had no pilot at all."
 time_akx.200.a:0 "Investigate this ship."
 
 time_akx.201.name:0 "Eye of the Abyss"
 time_akx.201.desc:0 "Our Science Officers carefully investigated the exterior of the ship but failed to find any entrance or exit.\n\nThe investigation team initially tried to use lasers to cut an entrance on the hull, but this attempt failed; their lasers couldn't affect the hull at all. Perhaps we could try attacking it with ship weapons, but we cannot ensure the consequences of this move, so the cautious investigation team quickly rejected this method.\n\nFinally, the investigation members decided to look for an entry passage from the thrusters at the rear of the ship, surprisingly finding that the ship's engine was still operating. The aperture of the largest exhaust port just allowed the investigation team to enter, and the pitch-black and deep interior was like the eye of the abyss, silently watching everything outside the Black Hole."
 time_akx.201.a:0 "Chilling."
 
 time_akx.202.name:0 "Within the Horizon"
 time_akx.202.desc:0 "The investigation team successfully entered the ship but found some strange phenomena.\n\nOn this ship, there was not a single timekeeping device, as if time had no meaning for the passengers on the ship. But soon, investigation members discovered other anomalies-the readings of all timekeeping devices brought in by the investigation team were different. Some readings jumped fast, some changed slowly, some remained unchanged, and some even became smaller.\n\nVarious anomalies made the investigation team suspect whether they had strayed into the event horizon, but observing from outside the ship, they were indeed outside the Black Hole."
 time_akx.202.a:0 "Where exactly is the limit of the event horizon?"
 
 time_akx.203.name:0 "Light of Purification"
 time_akx.203.desc:0 "A group of unknown objects attacked the investigation team.\n\nAs the investigation team went deeper into the ship, a group of pitch-black, sticky objects indistinguishable from shadows suddenly attacked them. Once entangled by this object, investigation members could not break free and were eventually swallowed by darkness, and the object became more massive as a result. Just as the investigation team was about to be wiped out, countless blazing lasers suddenly shot out from the surrounding walls, repelling the terrifying group of objects.\n\nSurvivors who were not completely swallowed managed to survive, but most lost parts of their bodies. Although §Y[maimed_leader.GetName]§! was lucky not to be attacked, [maimed_leader.GetHeShe] was severely burned by the indiscriminate attack of the purification light, fortunately not life-threatening."
 time_akx.203.a:0 "Their sacrifice is worth remembering."
 
 time_akx.204.name:0 "Voice of the Future"
 time_akx.204.desc:0 "After a period of rest and reorganization, a new investigation team continued to set off deeper.\n\nThe investigation members arrived at an area resembling the ship's core, but the door to the interior was sealed. The decryption team tried to unlock the electronic lock's password but accidentally triggered an alarm, but the alarm did not activate any traps; it was just a false alarm. The decryption operation went smoothly until the last step-a puzzle suddenly appeared on the screen. We don't know the content of the puzzle because the riddle seen by each member of the decryption team was different and changed with the passage of time.\n\nA familiar voice reached the ears of the investigation team: \"What has been will be again; what will be has been.\""
 time_akx.204.a:0 "I have an impression of this sentence."
 # Ending 1
 time_akx.204.b:0 "This is an unsolvable puzzle."
 time_akx.204.b.tooltip:0 "§RWe may never solve this mystery§!"
 
 time_akx.205.name:0 "In the Name of Hope"
 time_akx.205.desc:0 "[GetTimeAkxDesc205]"
 time_akx.205.desc_1:0 "After the two destined to meet reunited, the door to the core opened.\n\nThe investigation team carefully reviewed all logs and documents on the ship and gradually understood the truth. This ship came from a future more than 30,000 years later. At that time, the world faced an unimagined crisis, and no dimensional civilization had the ability to solve it. Time travelers proposed taking refuge in the past through the Inverse Plane. This plan went smoothly at first, but soon chaos broke out due to force majeure, which also led to the dissatisfaction and anger of Inverse Phase civilizations. The intensification of contradictions further promoted the spread of the Crisis, and the spread of the Crisis also promoted the intensification of contradictions. In the end, the entire spacetime was fragmented by pollution.\n\nA legendary captain piloted the refuge ship with only one person left, using unique abilities to break through the boundaries of spacetime, successfully arriving at another causal loop, §Rbut the price was being erased from spacetime forever§!.\n\nAnd this ship is the last gift from the destroyed causality."
 time_akx.205.desc_2:0 "(This memory was erased from spacetime.)"
 time_akx.205.a:0 "Sworn in the name of hope, we will change such a disaster."
 
 # Ending 2
 time_akx.206.name:0 "Syzygy: Outside Spacetime"
 time_akx.206.desc:0 "In this ship from outside spacetime, everything that does not belong to this causality has been erased. Therefore, we obtained its complete control rights, but also lost its past and future."
 time_akx.206.a:0 "What happened just now?"
 time_akx.206.a.tooltip:0 "§R<< ERROR ERROR ERROR >>§!"
 time_akx.206.b.tooltip:0 "The §YDimension Traveler§! possesses an exclusive warship, so she is also a §YWarship Girl§!!"
 
 SYZYGY_ADMIRAL_TITLE:0 "Destined Encounter"
 time_akx.207.name:0 "[mirrored_syzygy_admiral.GetName]"
 time_akx.207.desc:0 "We meet again.\n\nAs I said, time is a maze, the loop is both the beginning and the end, and The Worm-in-Waiting needs its sacrifice to do so."
 time_akx.207.a:0 "Why is time a maze?"
 time_akx.207.a.response:0 "Time is a maze because time is a maze, just as a raven is like a writing desk."
 time_akx.207.b:0 "Why is the loop both the beginning and the end?"
 time_akx.207.b.response:0 "Because a loop has no beginning and no end. Can you find its starting point and end point in a circle?"
 time_akx.207.c:0 "What is the purpose of The Worm-in-Waiting?"
 time_akx.207.c.response:0 "Just to decorate the loop with something, to prevent the arrogant child from causing a catastrophe."
 time_akx.207.d:0 "This is the last question. What did you attract me here to do?"
 time_akx.207.d.response:0 "Of course, to appoint you as the captain of this ship. I am transferring all authority to you now. Although I am you, you are not me.\n\nMy mission is complete. The next is your task. §ROnly you can pilot this ark to deviate from the destined future§!."
 
 # Ending 3
 time_akx.208.name:0 "Syzygy: Fall of Hope"
 time_akx.208.desc:0 "The Omega Ark was destroyed; the hope from the future fell in our hands."
 time_akx.208.a:0 "We broke our word..."
 
 time_akx.209.name:0 "Phantom in Dream"
 time_akx.209.desc:0 "A group of bizarrely dressed mysterious people surrounded §Y[mirrored_syzygy_scientist.GetName]§!.\n\nThey did not attack the investigation specialist, but repeatedly stated several words in eerie tones rising and falling: \"Stop,\" \"Give up,\" \"Futile,\" \"Origin.\" §Y[mirrored_syzygy_scientist.GetName]§! plucked up the courage to lift the veil of one of them, and was surprised to find that the person looked exactly like [mirrored_syzygy_scientist.GetHerHim]self. Others also removed their disguises and looked at [mirrored_syzygy_scientist.GetHerHim]-they were all §Y[mirrored_syzygy_scientist.GetName]§! [mirrored_syzygy_scientist.GetHerHim]self.\n\n§Y[mirrored_syzygy_scientist.GetName]§! woke up abruptly from the nightmare. There was no one around, only deathly silence. Whether all this is true or false, perhaps only §Y[mirrored_syzygy_scientist.GetName]§! knows."
 time_akx.209.a:0 "Dreams are not necessarily reality."
 time_akx.209.b:0 "Reality is not necessarily a dream either."
 
 time_akx.215.name:0 "Warp Ripples"
 time_akx.215.desc:0 "Due to the dimensional storm in the §Y[From.GetName]§! system, some familiar yet strange space creatures used warp speed to travel to our universe. The ripples they caused seem to indicate that the visitors are unkind."
 time_akx.215.a:0 "Prepare for battle."
 
 time_akx.216.name:0 "Warp Twist"
 time_akx.216.desc:0 "Due to the dimensional storm in the §Y[From.GetName]§! system, some massive warp creatures appeared in our plane. The twisting phenomenon they caused has spread throughout the entire system."
 time_akx.216.a:0 "Expel them from the borders."
 
 time_akx.220.name:0 "Syzygy: Messenger of Hope"
 time_akx.220.desc:0 "The Messenger of Future is not what it used to be; it has become closer to its original appearance. This ship from another world is poised for action; it will become the last hope for everyone."
 time_akx.220.a:0 "It is the hope that sows all hope."
 time_akx.220.a.tooltip:0 "Omega Ark Upgrade Cap: §G+5§!\n§YWe can initiate the Beyond Shelter Project§!"
 
 time_akx.221.name:0 "Syzygy: Messenger of End"
 time_akx.221.desc:0 "The Messenger of Hope is very different from the past; it is almost identical to its original appearance. This ship from the End is silent, but the history it carries is pouring out everything."
 time_akx.221.a:0 "It is the calamity that ends all calamities."
 time_akx.221.a.tooltip:0 "Omega Ark Upgrade Cap: §G+5§!\n§HUnlocks Casus Belli:§! Edict of the End"
 
 
 
 # Coils of God
 time_akx.300.name:0 "Coils of God: Imposter"
 time_akx.300.desc:0 "Shocking news came from the §Y[coils_planet.System.GetName]§! system.\n\nThe homeworld of that pre-FTL civilization once keen on \"Coils of God\" religious activities-§Y[coils_planet.GetName]§!, turned into a Black Hole in an instant. However, §Y[coils_country.GetName]§! is safe and sound, and appeared on another planet in the system, §Y[new_coils_planet.GetName]§!-which was not originally a habitable planet! Not only that, they have now picked up the faith of \"Coils of God\" again and are frantically conducting mysterious rituals.\n\nWe found that they seem to be intentionally guarding against the sky. Did they detect us?"
 time_akx.300.a:0 "There must be unknown secrets behind the \"Coils of God\"."
 time_akx.300.a.tooltip:0 "We can conduct a new §YESPIONAGE OPERATION§! against §Y[coils_country.GetName]§!."
 time_akx.310.name:0 "Coils of God: Usurping the Nest"
 time_akx.310.desc:0 "Shocking news came from the §Y[coils_planet.System.GetName]§! system.\n\nThe site of that pre-FTL civilization once keen on \"Coils of God\" religious activities-§Y[coils_planet.GetName]§!, turned into a Tomb World, and developed a new civilization overnight. The pre-FTL civilization named §Y[coils_country.GetName]§! is living comfortably on the planet. Following the guidance of the \"Coils of God,\" they hold mysterious rituals all over the world.\n\nWe found that they often look up at the sky, but do not seem to have detected our existence."
 time_akx.310.a:0 "There must be intriguing causes behind the \"Coils of God\"."
 time_akx.310.a.tooltip:0 "We can conduct a new §YESPIONAGE OPERATION§! against §Y[coils_country.GetName]§!."
 
 operation_coils_god:0 "Investigate the Mystery of the Coils"
 operation_coils_god_desc:0 "Everything experienced by [root.target.GetName] is full of mystery. We should investigate the mystery of the Coils.\n\n§RPlease do not turn on the \"Auto-launch\" function, otherwise you may miss part of the story!§!"
 operation_coils_god_on_success:0 "$IF_SUCCESSFUL|E$\nWe might discover the truth of the Coils of God.\n\n[owner.GetDisguiseState]"
 
 time_akx.321.name:0 "Coils of God: Labyrinth City"
 time_akx.321.desc:0 "Our agents have successfully infiltrated a city on §Y[new_coils_planet.GetName]§!.\n\nHowever, this city is intricate and complicated, like a looping maze. Our agents need some time to get familiar with this place."
 time_akx.321.a:0 "First step to success."
 
 time_akx.322.name:0 "Coils of God: Assembly"
 time_akx.322.desc.1:0 "Our agents accidentally broke into a religious assembly held by §Y[coils_country.GetName]§!.\n\nAlthough the agents were sure they were not exposed, the local residents participating in the assembly still held great hostility and vigilance towards our agents. Several rituals of unknown meaning were held in this assembly-the main content was related to circles. Our agents were driven out by angry participants because they did not understand the details of the rituals.\n\nThere seems to be nothing worth paying attention to in this assembly. Our agents may need to start elsewhere."
 time_akx.322.desc.2:0 "Our agents accidentally broke into a religious assembly held by §Y[coils_country.GetName]§!.\n\nOur agents seemed to disguise themselves perfectly, and the local residents participating in the assembly invited our agents to join very warmly. Several rituals of unknown meaning were held in this assembly-the main content was related to circles. Although our agents did not understand the details of the rituals, the friendly participants did not mind their gaffes.\n\nBut unfortunately, no valuable information was found in this assembly. Our agents may need to start elsewhere."
 time_akx.322.a:0 "We must be more cautious."
 time_akx.322.b:0 "Things went unexpectedly smoothly."
 
 time_akx.323.name:0 "Coils of God: Temple"
 time_akx.323.desc:0 "Our agents discovered an abandoned temple in the suburbs.\n\nFrom the outside, this temple does not cover a large area, but passing through the gate, the interior space is unusually open. Our agents tried to search for items related to the Coils of God inside, but most were weirdly shaped circular sacrificial utensils. The only thing perhaps worth investigating deeply is the stele in the center of the altar."
 time_akx.323.a:0 "Worth a try."
 
 time_akx.324.name:0 "Coils of God: Stele"
 time_akx.324.desc:0 "The investigation of the stele did not go smoothly.\n\nThe stele is full of circles of various shapes, arranged neatly in a specific form. Obviously, this is a unique script. After some attempts, our agents deciphered words such as \"Origin,\" \"End,\" \"Beyond,\" and \"Mirror,\" but there is still a big gap before complete deciphering."
 time_akx.324.a:0 "Words full of religious meaning."
 
 time_akx.325.name:0 "Coils of God: The Beyond"
 time_akx.325.desc.1:0 "Just as our agents were about to complete the deciphering, a group of priests from §Y[coils_country.GetName]§! suddenly approached the temple.\n\nOur agents hurriedly packed up the deciphering tools and tried to keep the objects in the temple in their original state as much as possible, then hid behind the baffle behind the altar. After entering the temple, the priests held hands and surrounded the stele, muttering some strange spells, but judging from the pronunciation, it seemed similar to the content on the stele.\n\nIn the blink of an eye, along with our lurking agents, everyone in the temple was teleported to a bizarre space. It is said that scenes of disasters occurring on countless §Y[new_coils_planet.GetName]§! s filled the entire space, as if countless parallel universes were superimposed at this moment."
 time_akx.325.desc.2:0 "Just as our agents were about to complete the deciphering, a group of priests from §Y[coils_country.GetName]§! suddenly approached the temple.\n\nOur agents hurriedly packed up the deciphering tools and boldly went to meet the priests, trying to understand the secret of the stele through disguise. The priests tacitly allowed the agents to join. They held hands and surrounded the stele, muttering some strange spells, but judging from the pronunciation, it seemed similar to the content on the stele.\n\nIn the blink of an eye, along with our disguised agents, everyone in the temple was teleported to a bizarre space. It is said that scenes of disasters occurring on countless §Y[new_coils_planet.GetName]§! s filled the entire space, as if countless parallel universes were superimposed at this moment."
 time_akx.325.a:0 "Could this be the Beyond mentioned on the stele?"
 
 time_akx.326.name:0 "Coils of God: The Loop"
 time_akx.326.desc.1:0 "\"You ignorant outsiders, how dare you defile our sacred Loop Ritual?\" The priests questioned our agents angrily.\n\n\"Idiots, we are all trapped in this endless loop. Only by praying for forgiveness from the God of the Loop can we possibly break this loop. And you, again and again, hinder our plans!\" The priests continued to shout, \"However, your stupid acts can no longer stop us. We are going to the Beyond outside the loop now, and saying goodbye to this terrible jerk world!\"\n\nWhile our agents were dumbfounded, this group of priests, along with all residents on the planet, disappeared in an instant, as if they never existed. A gold ring dropped to the ground with a crisp clinking sound. In the blink of an eye, our agents returned to the temple.\n\nEngraved on the ring: \"Lesson given to the lost.\""
 time_akx.326.desc.2:0 "\"Poor souls trapped in the loop without knowing it, do you also yearn to know the truth behind the loop?\" The priests asked our agents gently.\n\n\"Devout believers, we are all trapped in this endless loop. Only by praying for forgiveness from the God of the Loop can we possibly break this loop. We are glad you joined our ritual, although it was a failed attempt.\" The priests continued, \"However, learning from the last lesson, we are confident that we will reach the Beyond outside the loop soon, but we have to say goodbye to you.\"\n\nWhile our agents were dumbfounded, this group of priests, along with all residents on the planet, disappeared in an instant, as if they never existed. A gold ring dropped to the ground with a crisp clinking sound. In the blink of an eye, our agents returned to the temple.\n\nEngraved on the ring: \"Treasure gifted to devout believers.\""
 # Ending 1
 time_akx.326.a:0 "What on earth is this damn loop?"
 # Ending 2
 time_akx.326.b:0 "What exactly is this mysterious loop?"
 
 
 
 # Sanctified Servant
 akx.9620.desc_time:0 "The high-tech sphere absorbed all resources with gratitude, and then there was no communication response. Then, without any warning, it began to radiate energy outward. The brightness of the emitted light was enough to cause injury, so you withdrew quickly. At this time, the Black Hole reacted. The surrounding space began to twist and churn; all this matches the situation described in the Horizon Signal event perfectly. The high-tech sphere is now blue-white. Suddenly it began to brighten and then cooled down, leaving only some slag.\n\nDid the creators named The Excerptors return? There are no traces of intelligent life in the star system. But the probe found that the radiation data of the Black Hole fluctuated significantly, and various indicators were gradually approaching a familiar celestial body. Finally, §Y$NAME_Gargantua$§! turned into a §HSpacetime Black Hole§!-our homeworld where we survived for hundreds of millions of years.\n\nWas our homeworld also formed like this initially? Is there any relationship between us and The Excerptors? Was all this designed by §HThe Worm-in-Waiting§!? We don't know the answer. Perhaps we will never find the answer, or perhaps we are the answer itself."
 akx.9620.b:0 "Eternal life!"
 
 hole_pets_categories_1:0 "Black Hole Compression"
 hole_pets_categories_1_desc:0 "This Black Hole has undergone an unexpected anomaly. We need to investigate it."
 hole_pets_categories_2:0 "Horizon Signal"
 hole_pets_categories_2_desc:0 "This Black Hole underwent a sudden change again and emitted a mysterious Horizon Signal."
 hole_pets_categories_3:0 "The Final End"
 hole_pets_categories_3_desc:0 "This Black Hole has reached its end, and our exploration of the unknown has also reached an end."
 
 time_akx.400.name:0 "Sanctified Servant: Black Hole Compression"
 time_akx.400.desc.1:0 "When our sensors sent signals to §Y[hole_pets.GetName]§! again, our computers came up with an astonishing result: this Black Hole has shrunk.\n\nThere is no evidence that any object or force field has exerted an effect on the Black Hole. We can only assume that it compressed itself by virtue of its own gravity. This peculiar phenomenon far exceeds the predictions of our original scientific theories and may bring us more progress in basic theories."
 time_akx.400.desc.2:0 "When our explorers went to the spacetime where §Y[hole_pets.GetName]§! is located again, they came up with an astonishing result: this Black Hole has shrunk.\n\nThere is no evidence that any object or force field has exerted an effect on the Black Hole. We can only assume that it compressed itself by virtue of its own gravity. This peculiar phenomenon far exceeds the predictions of our original scientific theories. Perhaps this Black Hole shares more similarities with our homeworld."
 time_akx.400.a:0 "Send more researchers."
 time_akx.400.b:0 "Send more explorers."
 
 time_akx.401.name:0 "Sanctified Servant: Unsolved Mystery"
 time_akx.401.desc.1:0 "Our research has not made substantial progress.\n\nThe gravitational field and radiation intensity near §Y[hole_pets.GetName]§! are within a stable and normal range, indicating that the Black Hole is not in the process of shrinking. Perhaps this is the limit of its compression. However, there is still a small amount of abnormal data worth studying, which may be our only harvest."
 time_akx.401.desc.2:0 "Our exploration has not made substantial progress.\n\nThe timeline and dimensional curvature near §Y[hole_pets.GetName]§! are within a stable and normal range, indicating that the Black Hole is not in the process of shrinking. Perhaps this is the limit of its compression. However, some originally chaotic and disordered spacetimes have been successfully explored, which may be our only harvest."
 time_akx.401.a:0 "Regrettable."
 time_akx.401.b:0 "A pity."
 
 time_akx.402.name:0 "Sanctified Servant: Horizon Signal"
 time_akx.402.desc.1:0 "After several years, §Y[hole_pets.GetName]§! underwent a sudden change again.\n\nThis Black Hole shrank miraculously again, and the whole change process was in an instant, so short that our most precise sensors could not detect it. At the same time, a mysterious Horizon Signal came from the Black Hole, and this did not originate from The Worm-in-Waiting."
 time_akx.402.desc.2:0 "After several years, §Y[hole_pets.GetName]§! underwent a sudden change again.\n\nThis Black Hole shrank miraculously again, and the whole change process was in an instant, so short that our most seasoned explorers could not detect it. At the same time, a mysterious Horizon Signal came from the Black Hole, and this did not originate from The Worm-in-Waiting."
 time_akx.402.a:0 "Analyze the Horizon Signal."
 time_akx.402.b:0 "Listen to the Horizon Signal."
 
 time_akx.403.name:0 "Sanctified Servant: Loop Emissary"
 time_akx.403.desc.1:0 "The analysis results of the Horizon Signal are out, and the content is shocking.\n\nThis bizarre signal is signed by The Infinity Machine. That mysterious high-tech sphere seemed not to be completely destroyed after entering the Black Hole; on the contrary, its consciousness still permeates the Black Hole and fulfills its mission. And this signal is the data report sent to the outside of the Black Hole by The Infinity Machine based on the research results after countless time cycles of investigation. The data in the Black Hole is precious to us, which will greatly improve our understanding of basic laws."
 time_akx.403.desc.2:0 "The parsing results of the Horizon Signal are out, and the content is shocking.\n\nThis bizarre signal is signed by The Infinity Machine. That mysterious high-tech sphere seemed not to be completely destroyed after entering the Black Hole; on the contrary, its consciousness still permeates the Black Hole and fulfills its mission. And this signal is the data report sent to the outside of the Black Hole by The Infinity Machine based on the research results after countless time cycles of investigation. The Infinity Machine pointed out the root of spacetime chaos in the horizon, which gave our explorers the opportunity to solve and control it."
 time_akx.403.a:0 "Confusing."
 time_akx.403.b:0 "Curious."
 
 time_akx.404.name:0 "Sanctified Servant: The Final End"
 time_akx.404.desc.1:0 "§Y[hole_pets.GetName]§! has been compressed to the extent that it cannot be further compressed.\n\nThis once huge Black Hole has now become an extremely tiny singularity. Perhaps this is its dead end. The Infinity Machine did not send any reports; perhaps it has no new data to provide, or perhaps it was completely annihilated in the final compression process. However, the secrets in the singularity seem to be open to us without reservation. This may be our last chance to discover the truth."
 time_akx.404.desc.2:0 "§Y[hole_pets.GetName]§! has been compressed to the extent that it cannot be further compressed.\n\nThis once huge Black Hole has now become an extremely tiny singularity. Perhaps this is its end. The Infinity Machine did not send any reports; perhaps it has no new data to provide, or perhaps it was completely annihilated in the final compression process. However, the secrets in the singularity seem to be open to us without reservation. This may be our last chance to learn the secrets."
 time_akx.404.a:0 "We need to know the truth."
 time_akx.404.b:0 "We need to get the secrets."
 
 time_akx.405.name:0 "Sanctified Servant: The Very Beginning"
 time_akx.405.desc.1:0 "Inside the singularity is another universe.\n\nWe don't know if this universe has any connection with us; we can only assume it is our mirror image. In the other universe, there is an emerging nation that has just stepped into space. The development of civilization is not surprising, but their progress is bathed in the singing of a White Hole. They tried to enter the White Hole but had to shelve it due to technology limitations, turning their eyes to the vast galaxy instead.\n\nDuring the exploration of the universe, they continued to grow and met a worm that controls time. With the help of the creature calling itself The Worm-in-Waiting, they successfully entered the White Hole and found the source of the singing. However, contrary to expectations, when they flew towards the outside of the event horizon with the girl in the White Hole, a mysterious force swallowed the White Hole and turned it into a Black Hole. Although due to the girl's protection, they did not suffer any loss, the girl has since disappeared without a trace.\n\nNot reconciled to their history becoming void, they dedicated themselves to developing a supercomputer with extremely high computing power to find a way to enter the Black Hole. Their plan succeeded, but their civilization also perished. This computer was named \"The Infinity Machine,\" and this race that disappeared in history was called \"The Excerptors.\""
 time_akx.405.desc.2:0 "Inside the singularity is another universe.\n\nWe don't know if this universe has any connection with us; we can only assume it is our mirror image. In the other universe, there is an emerging nation that has just stepped into space. The development of civilization is not surprising, but their progress is bathed in the singing of a White Hole. They tried to enter the White Hole but had to shelve it due to technology limitations, turning their eyes to the vast galaxy instead.\n\nDuring the exploration of the universe, they continued to grow and met a worm that controls time. With the help of the creature calling itself The Worm-in-Waiting, they successfully entered the White Hole and found the source of the singing. However, contrary to expectations, when they flew towards the outside of the event horizon with the girl in the White Hole, a mysterious force swallowed the White Hole and turned it into a Black Hole. Although due to the girl's protection, they did not suffer any loss, the girl has since disappeared without a trace.\n\nNot reconciled to their history becoming void, they dedicated themselves to developing a supercomputer with extremely high computing power to find a way to enter the Black Hole. Their plan succeeded, but their civilization also perished. This computer was named \"The Infinity Machine,\" and this race that disappeared in history was called \"The Excerptors.\"\n\nThe singularity disappeared instantly after offering the final secret, but suddenly expanded in a trance. A White Hole was born under our witness, just as we were born under the witness of a White Hole."
 time_akx.405.desc.3:0 "Inside the singularity is another universe.\n\nWe don't know if this universe has any connection with us, but we are sure it mirrors our past. In the other universe, there is an emerging nation that has just stepped into space. The development of civilization is not surprising, but their progress is bathed in the singing of a White Hole. They tried to enter the White Hole but had to shelve it due to technology limitations, turning their eyes to the vast galaxy instead.\n\nDuring the exploration of the universe, they continued to grow and met a worm that controls time. With the help of the creature calling itself The Worm-in-Waiting, they successfully entered the White Hole and found the source of the singing. However, contrary to expectations, when they flew towards the outside of the event horizon with the girl in the White Hole, a mysterious force swallowed the White Hole and turned it into a Black Hole. Although due to the girl's protection, they did not suffer any loss, the girl has since disappeared without a trace.\n\nNot reconciled to their history becoming void, they dedicated themselves to developing a supercomputer with extremely high computing power to find a way to enter the Black Hole. Their plan succeeded, but their civilization also perished. This computer was named \"The Infinity Machine,\" and this race that disappeared in history was called \"The Excerptors.\"\n\nThe Worm-in-Waiting sighed at their determination and fulfilled their wish to enter the Black Hole. They are us, and we are The Excerptors."
 # Ending 3
 time_akx.405.a:0 "This is the beginning of the Black Hole."
 # Ending 2
 time_akx.405.b:0 "This is the beginning of the White Hole."
 # Ending 1
 time_akx.405.c:0 "This is our beginning."
 time_akx.405.c.tooltip:0 "§Y$d_brief$§! effect increased"
 
 time_akx.406.name:0 "Dream of The Excerptors"
 time_akx.406.desc.1:0 "Unexpectedly, another me had such an experience.\n\nThe Excerptors have been pursuing their dream but failed. However, now they have succeeded, and we also have our own dream."
 time_akx.406.desc.2:0 "This is also us in another cycle struggling between cause and effect.\n\nThe Excerptors have been pursuing their dream but failed. However, we succeeded. We will firmly grasp our own dream and never wake up again."
 time_akx.406.a:0 "Let us continue our dream."
 time_akx.406.b:0 "Let us grasp our dream."
 
 ################################################################
 # Scars of the Horizon
 ################################################################
 
 astral_rift_akx_horror:0 "Scars of the Horizon"
 unlock_akx_dark_consortium_edict:0 "Unlocks additional Dark Matter §SEdicts§!."
 unlock_akx_dimensional_worship_building:0 "Unlocks building: §H$building_akx_dimensional_worship$§!."
 unlock_akx_hyperspace_specialty_starbase_building:0 "Unlocks Starbase building: §H$sm_akx_hyperspace_specialty$§!."
 
 time_akx.501.name:0 "Inverse Phase Domain"
 time_akx.501.desc.completed_arcsite:0 "Everything in the Astral Rift indicates that almost nothing here can be proven by existing logic, but they do exist, whether meaningful or not.\n\nWhen phenomena conflict with theory, it is not the phenomena that are wrong, but our theory that is problematic.\n\nThe universe has no obligation to make sense to us."
 time_akx.501.desc.default:0 "Our probe successfully entered the Astral Rift, but the physical laws inside are vastly different from the outside. Our Science Officers made great efforts to barely master the new control methods.\n\nThe Astral Rift seems to be a void. There is no reference object to determine the direction of the probe's movement. Only the information transmitted by the probe indicates that it is still working normally. Our Science Officers even suspect that the other end of the rift is not another world, but the inside of a Black Hole.\n\nIn any case, we have discovered a new world."
 time_akx.501.a:0 "We opened the door to the Inverse Phase."
 
 time_akx.511.name:0 "Abnormal Feedback"
 time_akx.511.desc.default:0 "The probe we sent into the Astral Rift seems to have malfunctioned.\n\nWe tried to make the probe collect some substances that might exist in the rift and analyze them. The probe did collect some invisible substances, but the data it fed back was full of flaws and contradictions.\n\nSome Science Officers believe that this may be the unique property of the substances in the rift. To confirm this, we ordered the probe to analyze the standard samples carried beforehand, but it still yielded erroneous results. Now we can be sure that regardless of the nature of the rift substances, our probe has malfunctioned."
 time_akx.511.a.dark_consortium:0 "Build the probe shell with Dark Matter and let a Science Officer enter the Astral Rift."
 time_akx.511.a.special:0 "Use Astral Threads as a protective layer for the probe and let a Science Officer enter the Astral Rift."
 time_akx.511.a:0 "Take protective measures and let a Science Officer enter the Astral Rift."
 time_akx.511.b:0 "Attempt probe self-check and analyze the cause of the problem."
 time_akx.511.c:0 "Abandon the probe and send a new one."
 
 time_akx.512.name:0 "Into the Sea"
 time_akx.512.desc.default:0 "Sending §Y[time_akx_astral_rift_lost_leader.GetName]§! into the rift was a wrong decision. Like a drop of water falling into the sea, [time_akx_astral_rift_lost_leader.GetHeShe] disappeared without a trace before causing any ripples.\n\nWe were too confident in our technology and paid a heavy price, but the exploration of the rift must continue. A successor took over the work of §Y[time_akx_astral_rift_lost_leader.GetName]§!."
 time_akx.512.a:0 "$time_akx.511.b$"
 time_akx.512.b:0 "$time_akx.511.c$"
 
 time_akx.521.name:0 "Baffled Insider"
 time_akx.521.desc.default:0 "Relying on our proud technology, §Y[leader.GetName]§! entered the rift without danger. Fortunately, the position of the probe was shallow, and the coordinate information sent was accurate. The Science Officer found the probe without spending too much time.\n\nHowever, after some inspection by §Y[leader.GetName]§!, [leader.GetHeShe] found that the probe did not have any faults, and all parts were operating methodically. In addition, [leader.GetHeShe] re-analyzed and calculated based on the data collected by the probe, verifying that the results were completely correct, and even suspected that the calculation outside was wrong.\n\nBut the Science Officers outside gave completely different results. They were sure that both §Y[leader.GetName]§! and the probe calculated incorrectly."
 time_akx.521.a:0 "[leader.GetName], you calculated wrong."
 time_akx.521.b:0 "Withdraw the Science Officer and attempt probe self-check."
 
 time_akx.522.name:0 "Unknown Symbol"
 time_akx.522.desc.default:0 "After some testing and verification, our Science Officers found that the probe introduced an unknown symbol during the calculation process, but this symbol did not originate from our programming. This symbol might have been created by the probe itself, although the probe does not have the permission to modify its own program.\n\nThe Science Officers firmly believe that it is this strange symbol that caused the calculation error."
 time_akx.522.a:0 "Find out the pattern of this symbol's appearance."
 
 time_akx.523.name:0 "Repeat Mistakes"
 time_akx.523.desc.default:0 "We sent a new probe and checked it carefully beforehand to ensure it works properly.\n\nHowever, after the new probe entered the rift, the calculation results showed the same deviation. This can rule out individual probe failure, proving that the world in the rift caused this error."
 time_akx.523.a:0 "$time_akx.511.b$"
 
 time_akx.531.name:0 "Between Three and Four"
 time_akx.531.desc.default:0 "After repeated calculations and verifications by both internal and external parties, §Y[leader.GetName]§! was surprised to find that [leader.GetHeShe] and the probe often used an unknown symbol during the calculation process, but [leader.GetHeShe] was never aware of this. Even before being pointed out by the external Science Officers, [leader.GetHeShe] always thought the existence of this symbol was natural.\n\n§Y[leader.GetName]§! traced back [leader.GetHerHis] calculation process and finally found the meaning represented by this symbol: this symbol is an integer between 3 and 4. 3.5 is not the average of 3 and 4, but the average of 4 and this symbol. The previous \"wrong results\" were exactly based on the introduction of this new number. Other computing devices in the rift also proved this.\n\nAlthough all this is unbelievable, it is indeed an objective law existing in the rift. Based on this law, we created new algorithms to improve the probe, enabling it to eliminate the influence of the new number to output \"correct results\" to the outside.\n\n§Y[leader.GetName]§! has returned successfully, and the exploration of the rift will continue."
 time_akx.531.a:0 "Truly a beautiful number."
 
 time_akx.532.name:0 "New Integer"
 time_akx.532.desc.default:0 "Under repeated tests, our Science Officers found that this symbol seems to be a positive integer. Although the principle of its appearance cannot be understood, integrating this symbol into our existing calculation system can finally yield accurate results.\n\nUsing a new set of conversion formulas, we can convert the data transmitted by the probe into external results. Exploration has improved, but this new integer remains an unsolved mystery in our hearts."
 time_akx.532.a:0 "This is a dark cloud over the edifice of mathematics."
 
 time_akx.541.name:0 "Black Hole Traversal"
 time_akx.541.desc.default:0 "Our probe finally found an \"observable\" scene.\n\nThis area seems to have many holes. Through these holes, we can see a brilliant starry sky, but the Science Officers are sure that is not our starry sky. Just as we were intoxicated by this starlight, a careful Science Officer discovered that a dark shadow was repeatedly shuttling between two holes.\n\nAs the probe sailed towards these two holes, the image of the dark shadow became clearer-it was a Science Ship. The Science Officer guessed that inside these two holes might be two different systems. For some reason, this Science Ship constantly shuttles between the two systems, as if looking for something."
 time_akx.541.a:0 "Signal the Science Ship."
 time_akx.541.b:0 "Observe quietly."
 
 time_akx.542.name:0 "Again"
 time_akx.542.desc.default:0 "We observed for a long time. This Science Ship tirelessly shuttles between two holes, without any change occurring."
 
 time_akx.543.name:0 "And Again"
 time_akx.543.desc.default:0 "We observed for a long time. This Science Ship tirelessly shuttles between two holes, probably without any other change occurring."
 
 time_akx.544.name:0 "Go at Dawn"
 time_akx.544.desc.default:0 "We observed for a long time. This Science Ship tirelessly shuttles between two holes, possibly without any other change occurring, maybe?"
 
 time_akx.545.name:0 "Return at Dusk"
 time_akx.545.desc.default:0 "We observed for a long time. This Science Ship tirelessly shuttles between two holes, seeming to change, but seeming not to."
 
 time_akx.546.name:0 "Caught in a Loop"
 time_akx.546.desc.default:0 "The Science Officers stared intently at that Science Ship, as if it had some strange magic, and even refused to receive any orders from us. Subsequently, the Science Ship we sent to explore the rift completely cut off contact with us, and we couldn't see the scene inside the Science Ship either.\n\nFortunately, we still retained the right to receive probe information, but when we opened the image, everyone was stunned. We found that the Science Ship constantly shuttling between two systems was actually full of our Science Officers, including §Y[time_akx_astral_rift_recycle_leader.GetName]§!.\n\nWe don't know how they teleported to that Science Ship, but what is certain is that they fell into a loop, an unbreakable loop."
 time_akx.546.a:0 "They fell into a loop, what about us?"
 
 time_akx.551.name:0 "Horizon Signal"
 time_akx.551.desc.default:0 "When we sent the signal, that Science Ship reacted. Perhaps this is what it was looking for.\n\nThat Science Ship suddenly sailed towards the nearest hole, but disappeared the moment it touched the interface between inside and outside. Our probe could not find any trace of it. Shortly after, another Science Ship arrived in this system. At the same time, a signal sent to the new Science Ship appeared near the probe, but after investigation, the signal did not originate from the probe.\n\nThe new Science Ship also reacted and prepared to sail towards the hole."
 time_akx.551.a:0 "What has been will be again; what will be has been."
 time_akx.551.b:0 "Warn the new Science Ship."
 
 time_akx.561.name:0 "Endless Crossing"
 time_akx.561.desc.default:0 "The new Science Ship fell into the hole like a moth to a flame, disappearing without a trace as usual.\n\nA third Science Ship arrived in this system again, but this time the situation was different. Signals no longer appeared automatically around the probe. Because of this, the third Science Ship seemed a bit confused, hesitating above the hole.\n\nMaybe this time, it's up to us to play the role of sending signals."
 time_akx.561.a:0 "Automatically generate a touching love poem."
 time_akx.561.b:0 "Warn the third Science Ship."
 
 time_akx.562.name:0 "Emergency Intervention"
 time_akx.562.desc.third:0 "We immediately issued a warning to the third Science Ship, but the other party did not respond after receiving the signal.\n\nAfter a long silence, the other party seemed relieved, turned the bow, and sailed towards the edge of the system. However, the Science Ship exploded before completing the hyperdrive activation, and we had no way of knowing the cause of the explosion. Since then, the system returned to silence."
 time_akx.562.desc.default:0 "We immediately issued a warning to the new Science Ship. The other party successfully received the signal when approaching the hole and stopped urgently outside the hole.\n\nThe other party seemed very confused and appeared to be in a dilemma. After a long silence, this Science Ship turned the bow and sailed towards the edge of the system. With a burst of hyperspace disturbance, the system returned to silence."
 time_akx.562.a:0 "This is their destined mystery, and ours too."
 time_akx.562.b:0 "This is their destined tragedy, and ours too."
 
 time_akx.571.name:0 "In the Ashes"
 time_akx.571.desc.default:0 "Our playful love poem seemed to attract the other party's attention well. The third Science Ship no longer hesitated but sailed firmly towards us.\n\nThis time, the Science Ship was no longer swallowed as soon as it touched the hole like in the past, but passed through the hole smoothly and arrived near our probe. The other party was obviously very curious about us as a signal source, sending messages frequently, eager to communicate with us. After starting communication, both sides were surprised to find that we and they look exactly the same, even language, culture, government, ethics, etc., are completely identical. We both cheered for finding ourselves in another world. Both sides chatted happily and even started planning arrangements for cooperation and progress together in the future.\n\nHowever, a sudden explosion terminated our conversation. Our probe was safe and sound, but the other party's Science Ship turned into a pile of wreckage."
 time_akx.571.a:0 "Search for possible survivors."
 time_akx.571.b:0 "Hearing the Dao in the morning, one can die in the evening."
 time_akx.571.c:0 "We will meet again sooner or later. Erect a monument for them."
 time_akx.571.d:0 "Investigate the wreckage and study the technology of another world."
 time_akx.571.e:0 "Mourn for them, mourn for us."
 
 time_akx.572.name:0 "Reflection in the Mirror"
 time_akx.572.desc.1:0 "Although we did our best to search for and rescue survivors, regrettably, the vast majority of the crew died in the explosion, and the remaining few also died of organ failure due to not wearing protective suits.\n\nFortunately, we still successfully rescued a survivor. Surprisingly, [time_akx_astral_rift_lost_leader.GetHeShe] turned out to be §Y[time_akx_astral_rift_lost_leader.GetName]§! [time_akx_astral_rift_lost_leader.GetHimHer]self-the Science Officer we sent into the rift who went missing earlier! However, §Y[time_akx_astral_rift_lost_leader.GetName]§! claimed not to remember the time spent with us; [time_akx_astral_rift_lost_leader.GetHeShe] only had memories of being a crew member of the third Science Ship.\n\nMaybe [time_akx_astral_rift_lost_leader.GetHeShe] is indeed not the original person, but all this is definitely not a coincidence."
 time_akx.572.desc.2:0 "Although we did our best to search for and rescue survivors, regrettably, the vast majority of the crew died in the explosion, and the remaining few also died of organ failure due to not wearing protective suits.\n\nFortunately, we still successfully rescued a survivor. Surprisingly, [akx_mirror_image_leader.GetHeShe] looks exactly like §Y[akx_mirror_image_leader.GetName]§!! However, they are indeed two different people, possessing different memories and different thoughts.\n\nThe two §Y[akx_mirror_image_leader.GetName]§! s found it difficult to accept such reality for a while, but recalling the various adventures they had experienced, they finally let go.\n\nOur §Y[akx_mirror_image_leader.GetName]§! will still be loyal to us, and the other §Y[akx_mirror_image_leader.GetName]§! is also willing to lend us a hand. The two who mirror each other are now one."
 time_akx.572.a.1:0 "Indulging in the mirror world may not be a bad thing..."
 time_akx.572.a.2:0 "Being surprised by oneself in the mirror may not be a bad thing either..."
 time_akx.572.b.1:0 "Erect a monument for everything we lost..."
 time_akx.572.b.2:0 "Erect a monument for everything you lost..."
 time_akx.572.c.1:0 "Let's think about what can be discovered from it..."
 time_akx.572.c.2:0 "Let's think about what can be learned from it..."
 time_akx.572.d.1:0 "When the reflection in the mirror and the original body swap..."
 time_akx.572.d.2:0 "When the reflection in the mirror and the original body meet..."
 
 time_akx.573.name:0 "Broken Mirror"
 time_akx.573.desc:0 "Although we did our best to search for and rescue survivors, regrettably, the vast majority of the crew died in the explosion, and the remaining few also died of organ failure due to not wearing protective suits.\n\nAlthough our rescue operation failed, we found the cause of the explosion. The third Science Ship seemed to carry a large amount of explosives, set to detonate directly once severe gravitational fluctuations were detected. For some reason, the crew of the other party did not turn off the bombs in time. Maybe they forgot about it, maybe they thought the bombs wouldn't detonate, maybe they didn't have the ability and authority to dismantle the bombs. As for why the bombs didn't detonate when entering the hole, our Science Officer speculated that the different time flow rates inside and outside the hole greatly delayed the activation of the bombs. This might be the real reason why the crew let down their guard.\n\nBut things have come to this; even finding the cause cannot change history. This is their destined fate."
 time_akx.573.a:0 "A broken mirror cannot be joined; spilt water cannot be gathered."
 
