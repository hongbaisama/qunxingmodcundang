 # Temple of the Loop
 akx.9100.desc.pc_time: "Archeologists have discovered a forgotten temple in a largely inaccessible region of spacetime in [Root.GetName]-buried for centuries, but recently revealed by dimensional disturbances. Analysis of the tooling marks on the temple walls dates it to the pre-industrial era. However, the recurring symbols on the walls and the radial altar-a Mobius strip-like Ouroboros-have no precedent in our early history, and an unknown writing system is used on its steles. An excited explorer believes this ruin was left by a precursor race.\n\nAlthough seemingly unrelated, the dimensional disturbances appear to have occurred at the same time the final message was transmitted from [horizonsignal_system.GetName]."
 akx.9101.desc.pc_time: "Our scientists have conducted an in-depth investigation of the abandoned temple, but unexplained questions remain. There is a hole in the roof along the extension line of the star-shaped altar, which we speculate was used as a sundial; but due to severe damage caused by dimensional disturbances, we cannot be certain. If it was built at some significant moment, we may never confirm that time. We had better luck with the \"unknown language system.\" It is an obscure but famous monastic manuscript due to its age-not an alien language at all-and we have successfully deciphered it.\n\nThe temple was used to serve the \"Time Worm,\" or §HThe Worm-in-Waiting§!. Most inscriptions are rhythmic and poetic, praying for the arrival of The Worm-in-Waiting-or, if read backwards-its departure. There is also a section describing the \"operation of the universe,\" and excited archeologists swear it references advanced field equations-not new to us, but the fact that they were found in this ancient temple is impressive in itself. Although we haven't found a physicist who agrees with this view and admits it publicly.\n\nFor now, there are no signs in this temple related to cosmic secrets or alien weapons. But its dark environment is so unique, full of dangerous beauty, and the poems used to serve The Worm-in-Waiting have become fashionable. They have been made into pop music; at the same time, they have been compiled and published."
 akx.9101.a.materialist:0 "Convert the Temple of the Loop into a research institute."
 akx.9101.a.materialist.tooltip:0 "A mystery from our ancient ancestors. \"What shall be, was.\""
 akx.9101.a.spiritualist:0 "Convert the Temple of the Loop into a pilgrimage site."
 akx.9101.a.spiritualist.tooltip:0 "Wisdom from our ancient ancestors. \"What was, shall be.\""
 akx.9101.a.militarist:0 "Study the construction methods of the Temple of the Loop."
 akx.9101.a.militarist.tooltip:0 "The loop is both the beginning and the end."
 akx.9101.a.pacifist:0 "Study the architectural style of the Temple of the Loop."
 akx.9101.a.pacifist.tooltip:0 "The loop has no beginning and no end."
 akx.9101.a.xenophile:0 "Open the Temple of the Loop to the public."
 akx.9101.a.xenophile.tooltip:0 "Lines bend into loops, loops stretch into lines."
 akx.9101.a.xenophobe:0 "Promote the Temple of the Loop to the public."
 akx.9101.a.xenophobe.tooltip:0 "Lines twist into loops, loops extend into lines."
 akx.9101.a.egalitarian:0 "Adopt the loop as a national symbol."
 akx.9101.a.egalitarian.tooltip:0 "Some things come from our past, and they will become our future."
 akx.9101.a.authoritarian:0 "Adopt the loop as the imperial emblem."
 akx.9101.a.authoritarian.tooltip:0 "Some things originate from our past, and they will establish our future."
 akx.9101.a.hive_mind:0 "Attempt to learn the meaning of thought from the Temple of the Loop."
 akx.9101.a.hive_mind.tooltip:0 "One is all, all is one."
 akx.9101.a.machine_intelligence:0 "Attempt to learn the meaning of intelligence from the Temple of the Loop."
 akx.9101.a.machine_intelligence.tooltip:0 "All is one, one is all."
 
 # Messenger
 akx.9200.desc.robotic: "[Root.GetName] has located a small object with only basic power supply, broadcasting a looping signal only within the local range. Such objects are usually used as escape pods, and it looks like this is one of them. It has been here for a very long time.\n\nWhen the crew opened it-carefully observing quarantine protocols-they found some ancient relics preserved in a sterile environment chamber. Up to this point, everything was normal. However, the captain of [Root.GetName] indicated that they did not expect to find the [Root.Owner.GetAdj] phrase §HWhat was, will be; what will be, was§!-smeared on the bulkhead with the machine oil of the pod's occupant-whom the crew sarcastically refer to as the Messenger. They added: the Messenger's mechanical structure has some unexpected design similarities to our own chassis construction."
 akx.9201.desc.robotic: "We have determined that the escape pod was a commercially available replica from the early days of interstellar civilization-containing no new technology or other special information. The wreckage of the Messenger, however, is notably striking. It is clearly an old model or a modification of the [Root.Owner.GetAdj]. Perhaps we share a similar origin-or our design philosophy was manipulated by precursors. [researchingscientist.GetName] requests permission to conduct more extensive research."
 MESSENGER_POD_PROJECT_2_UNLEASHED_ROBOTIC: "$MESSENGER_POD_PROJECT_2_UNLEASHED$"
 MESSENGER_POD_PROJECT_2_UNLEASHED_ROBOTIC_DESC: "Preliminary findings suggest that the Messenger is a higher form of intelligence, although physically more fragile."
 MESSENGER_POD_PROJECT_2_LEASHED_ROBOTIC: "$MESSENGER_POD_PROJECT_2_LEASHED$"
 MESSENGER_POD_PROJECT_2_LEASHED_ROBOTIC_DESC: "Preliminary findings suggest that the Messenger is a much sturdier, and possibly more aggressive, mechanical form than us."
 akx.9210.desc.normal: "[researchingscientist.GetName] has reconstructed the species information of the Messenger. It is weaker than us, but has significantly enhanced cognitive abilities. Whether we are the original species or not, this has caused some confusion for us, because either the Messenger is a modified version of us, or the Messenger is our ancestor. For us, imagining ourselves as descendants of such a frail species is a bit embarrassing-but [researchingscientist.GetName] firmly believes this view. They consider the backwardness of our species' cognitive abilities to be a \"tragedy.\"\n\nThis \"tragic status quo\" has driven them to undergo retroviral therapy to transform their physiology into that of the Messenger. They emphasize that this will allow them to better carry out this project."
 akx.9210.desc.robotic: "[researchingscientist.GetName] has reconstructed the chassis information of the Messenger. It is weaker than us, but has significantly enhanced processing power. Whether we are the original race or not, this has caused some confusion for us, because either the Messenger is a modified version of us, or the Messenger is our prototype. For us, imagining ourselves as a modification of such a frail chassis is a bit embarrassing-but [researchingscientist.GetName] firmly believes this view. They consider the backwardness of our species' processing power to be a \"tragedy.\"\n\nThis \"tragic status quo\" has driven them to install intrusive viral programs to transform their memory circuits into that of the Messenger. They emphasize that this will allow them to better carry out this project."
 akx.9211.desc.robotic: "[researchingscientist.GetName] has now reverse-engineered the mechanism of the Messenger species. Without stopping to consult anyone, they also created a highly contagious intrusive virus program. The virus has begun to spread to our worlds. Under its influence, our primary species began to reboot, and a day later, displayed the characteristics of the Messenger species. The result of this event, frankly, has made some people extremely excited."
 akx.9211.a.tooltip.gestalt: "All pops on the capital planet will be transformed, but that is all.\nTheir appearance and traits may undergo significant changes."
 akx.9211.c.robotic: "What was, shall be. We will change. Install the program in me too."
 akx.9211.c.tooltip.ethic: "This will transform our entire species.\nOur appearance, ethics, and traits may undergo significant changes, even our government."
 akx.9211.c.tooltip.gestalt: "This will transform our entire species.\nOur appearance and traits may undergo significant changes, even our government."
 akx.9211.c.tooltip.gestalt.no_change: "This will transform our entire species.\nOur appearance and traits may undergo significant changes."
 akx.9220.desc.normal: "[researchingscientist9220.GetName] has conducted recombination research on the Messenger's genes. They are indeed remarkable, but also worry our scientists. Compared to our current genes, the Messenger is clearly more robust and has a higher willingness to attack. Researchers are now divided, unable to determine whether the Messenger is an evolved version of ourselves, or if they are actually our ancestors. [researchingscientist9220.GetName] personally believes the latter-we should have lived as a powerful combat species, but lost our combat instincts due to the interference of some precursor civilization. According to them, losing this combat ability is the greatest \"tragedy\" in our history.\n\nSome researchers have even undergone retroviral gene therapy to transform their physique into the characteristics of the Messenger. They also insist that this is of great significance for the continuation of the research."
 akx.9220.desc.robotic: "[researchingscientist9220.GetName] has conducted reverse engineering on the Messenger's chassis. They are indeed remarkable, but also worry our scientists. Compared to our current chassis, the Messenger is clearly more robust and has a higher willingness to attack. Researchers are now divided, unable to determine whether the Messenger is an improved version of ourselves, or if they are actually our prototypes. [researchingscientist9220.GetName] personally believes the latter-we should have lived as powerful combat machines, but lost our combat instincts due to the interference of some precursor civilization. According to them, losing this combat ability is the greatest \"tragedy\" in our history.\n\nSome researchers have even installed intrusive viral programs to transform their chassis into the characteristics of the Messenger. They also insist that this is of great significance for the continuation of the research."
 akx.9221.desc.robotic: "[researchingscientist9220.GetName] has now reverse-engineered the mechanism of the Messenger species. Without stopping to consult anyone, they also created a highly contagious intrusive virus program. The virus spread to our worlds. Under its influence, our dominant species began to reboot, and a day later, displayed the characteristics of the Messenger species. The result of this event, frankly, has made some people extremely excited."
 akx.9221.c.robotic: "What was, shall be. Install the program in me too."
 
 # Inverse Phase Tradition
 akx.10020.a.tooltip:0 "With the manifestation of The Worm-in-Waiting, an existence from another §MPlane§! has also noticed us and unveiled the curtain of reality.\n§RThey have extended an olive branch, but at what cost?§!\nCreate $ASTRAL_RIFT$: §Y$astral_rift_akx_horror$§!"
 akx.10020.b.tooltip:0 "We will initiate the §YRitual of the Loop§! (§GWarship Girls R§!)"
 
 time.502.name:0 "Gift of the End"
 time.502.desc_1:0 "Our research into the Inverse Phase grows daily, and the unknown existence from the End is clearly very satisfied with this.\n\nHe burrows into our dreams, He burrows into our ears, He burrows into our eyes, He burrows into our minds. A precious gift emerges from the abyss; the pact has been established."
 time.502.desc_2:0 "Our research into the Inverse Phase grows daily, and the unknown existence from the End is clearly very satisfied with this, yet The Worm-in-Waiting seems angry.\n\nHe burrows into our dreams, He burrows into our ears, He burrows into our eyes, He burrows into our minds. Just as the pact was being concluded, The Worm-in-Waiting destroyed the ritual, but the precious gift had already emerged from the abyss."
 time.502.a:0 "We have long belonged to you, Master of the Inverse Phase."
 time.502.b:0 "We belong to another, Deity of the Inverse Phase."
 time.502.b.tooltip:0 "The Worm-in-Waiting acted like a protective mother, roughly expelling other §MInverse Phase§! entities.\n§BIt finally decided to guide us personally, to prevent us from going astray.§!"
 
 # Inverse Phase Mysteries
 AP_HORROR_CHAIN_title:0 "The Worm-in-Waiting: Mysteries"
 AP_HORROR_CHAIN_desc:0 "$ap_time_desc$"
 ap_horror_chain_time:0 "Spacetime Mystery"
 ap_horror_chain_circle:0 "Loop Mystery"
 ap_horror_chain_dimension:0 "Plane Mystery"
 
 time.10.name:0 "Inverse Plane: §HMystery§!"
 time.10.desc:0 "The Worm-in-Waiting tore the dimensions apart, generously pointing out the direction for our exploration.\n\nHorrific Inverse Mass flows endlessly from the rift, giving us the possibility to study the Inverse Phase. This may mean disaster, but it may also contain opportunity."
 time.10.a:0 "The door to the unknown is about to open to us."
 time.10.a.tooltip:0 "$ASTRAL_RIFT$ Expansion: §Y$astral_rift_akx_time$§!\n§RThe rift connects to the harsh and dangerous depths of the Inverse Phase; only the most elite Scientists can undertake this heavy responsibility!§!"
 time.11.name:0 "Inverse Plane: §HSpacetime§!"
 time.11.desc:0 "Spacetime is the carrier.\n\nInverse Phase creatures do not control the flow of spacetime; rather, all their actions change with the flow of spacetime. However, the will of Inverse Phase creatures always happens to coincide with the will of spacetime. Controlling spacetime is meaningless to them; they ARE spacetime."
 time.11.a:0 "Interesting."
 time.11.a.tooltip:0 "§Y[time_secret_researcher.GetName]§! pryed into the mystery of §YSpacetime§!"
 time.12.name:0 "Inverse Plane: §HLoop§!"
 time.12.desc:0 "The Loop is the purpose.\n\nAll actions of Inverse Phase creatures are to realize their own loop, but the loop does not need any meaning. From beginning to end, it is a process of realizing the loop over and over again. Infinite loops mean infinite life, and also infinite death."
 time.12.a:0 "Interesting."
 time.12.a.tooltip:0 "§Y[circle_secret_researcher.GetName]§! pryed into the mystery of the §YLoop§!"
 time.13.name:0 "Inverse Plane: §HPlane§!"
 time.13.desc:0 "The Plane is the motive force.\n\nInverse Phase creatures will always travel to various different planes. Staying in the Inverse Plane cannot achieve their goals. The secret to freely shuttling between different planes lies in Horrific Inverse Mass, which connects various planes through singularities, which also leads to the formation of Black Holes."
 time.13.a:0 "Interesting."
 time.13.a.tooltip:0 "§Y[dimension_secret_researcher.GetName]§! pryed into the mystery of the §YPlane§!"
 time.14.name:0 "Inverse Plane: §HInverse Phase§!"
 time.14.desc_1:0 "Research into the Horrific Inverse Plane has completely overturned our previous knowledge systems.\n\nThe Worm-in-Waiting is patient and gentle; It is willing to tell us the mysteries of the Inverse Phase."
 time.14.desc_2:0 "Research into the Horrific Inverse Plane has completely overturned our previous knowledge systems, and the Dimension Traveler seems to have foreseen their own past and future within the Horrific Inverse Mass.\n\nThe Worm-in-Waiting is patient and gentle; It is willing to tell us the mysteries of the Inverse Phase.\nThe Worm-in-Waiting is wise and mysterious; It yearns to give the traveler the mission of the loop."
 time.14.a:0 "I have seen endless mysteries..."
 time.14.b:0 "Both a messenger and a traveler..."
 time.14.b.tooltip:0 "We will decide the §YFate§! of the §YDimension Traveler§!"
 
 time.501.name:0 "Hiss from the Abyss"
 time.501.desc:0 "Some unknown existence from the abyss has extended an olive branch to us.\n\nWe do not know Its purpose, nor whether there is a crisis hidden behind this, but in any case, the door to the Inverse Plane has opened to us."
 time.501.a:0 "This is a domain we have never set foot in."
 
 # Spacetime Tradition
 time.15.name:0 "Inverse Plane: §HDiffusion§!"
 time.15.desc:0 "With our complete control over §Y[Root.GetName]§!, Horrific Inverse Mass has also spread to this planet. Some believe this will §Greveal the truth§!, but others believe it will §Rinvite disaster§!."
 time.15.a:0 "Whether blessing or curse, this is our own choice."
 
 time.504.name:0 "Inverse Plane: §HSublimation§!"
 time.504.desc.a.1:0 "As our understanding of the Inverse Plane increases day by day, the Inverse Phase matter flowing in the rift has gradually become stable.\n\nThe flowing black energy gradually gathers, condenses, and finally crystallizes into a beautiful Flower of the Inverse Phase. This is the love given by The Worm-in-Waiting, and also the kiss we return to The Worm-in-Waiting."
 time.504.desc.a.2:0 "As our understanding of the Inverse Plane increases day by day, the Inverse Phase matter flowing in the rift has gradually become stable.\n\nThe flowing black energy gradually gathers, condenses, and finally crystallizes into a beautiful Flower of the Inverse Phase. This is the love given by the Master, and also the kiss we return to the Master."
 time.504.desc.b.1:0 "As our understanding of the Inverse Plane increases day by day, the Inverse Phase matter flowing in the rift has gradually become stable.\n\nThe flowing black energy gradually gathers, condenses, and finally casts into immeasurable condensed Dark Matter. This is the love given by The Worm-in-Waiting, and also the kiss we return to The Worm-in-Waiting."
 time.504.desc.b.2:0 "As our understanding of the Inverse Plane increases day by day, the Inverse Phase matter flowing in the rift has gradually become stable.\n\nThe flowing black energy gradually gathers, condenses, and finally casts into immeasurable condensed Dark Matter. This is the love given by the Master, and also the kiss we return to the Master."
 time.504.a.1:0 "Old contracts discarded, love is with The Worm."
 time.504.a.2:0 "The Master is benevolent and generous, love is with the Inverse Phase."
 time.504.b.1:0 "Old contracts discarded, the kiss is with The Worm."
 time.504.b.2:0 "The Master is benevolent and generous, the kiss is with the Inverse Phase."
 
 # Spacetime Causality
