 akx.9000.normal:0 "Analyze these signals."
 akx.9000.origin_time:0 "A call from the Black Hole..."
 akx.9000.blessed_by_god:0 "This signal is full of impurity, block it immediately!"
 akx.9000.blessed_by_god.tooltip:0 "§RThe God is extremely disgusted by this signal and forbids us from making any contact with it!§!"
 akx.9000.equinox_seal.a:0 "An aura similar to that within the seal. Dangerous. Block the signal!"
