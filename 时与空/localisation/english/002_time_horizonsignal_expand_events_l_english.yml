 approach_ap_time_up_effect:0 "The pursuit of knowledge is endless, no matter what calamity it may invite."
 approach_ap_time_down:0 "Turn Back"
 approach_ap_time_down_effect:0 "The pursuit of knowledge should have limits; to avoid disaster, we should stop in time."
