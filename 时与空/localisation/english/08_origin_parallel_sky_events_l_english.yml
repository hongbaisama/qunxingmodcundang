 parallel_sky.79.desc.1:0 "We recently encountered a bottleneck in scientific and technological development.\n\nIf possible, we hope you can send some researchers to help us break through the bottleneck. We will pay Energy Credits as thanks."
 parallel_sky.79.desc.2:0 "My warriors started slacking off again recently.\n\nIf possible, we hope you can send some officers to help me train them. I will pay a large sum of Energy Credits as remuneration."
 parallel_sky.79.desc.3:0 "We feel more and more lost recently.\n\nIf possible, we hope you can send some philosophers to help guide us. We will pay you due remuneration."
 parallel_sky.79.a:0 "We agree."
 parallel_sky.79.a.response:0 "Thank you for your understanding."
 parallel_sky.79.b:0 "We have our own things to do."
 parallel_sky.79.b.response:0 "What a pity."
 parallel_sky.80.desc.1:0 "Our recent output of Alloys and Consumer Goods is not ideal.\n\nIf possible, we hope you can provide part of the produced Alloys and Consumer Goods to us. We will pay Energy Credits as thanks."
 parallel_sky.80.desc.2:0 "It's really bad, my warriors lack Alloys for equipment.\n\nIf possible, we hope you can help me produce some equipment. I will pay a large sum of Energy Credits as remuneration."
 parallel_sky.80.desc.3:0 "We have a serious shortage of Consumer Goods, which is an ominous sign.\n\nIf possible, we hope you can distribute some Consumer Goods to us. We will pay you due remuneration."
 parallel_sky.80.a:0 "We agree."
 parallel_sky.80.a.response:0 "Thank you for your understanding."
 parallel_sky.80.b:0 "We have our own things to do."
 parallel_sky.80.b.response:0 "What a pity."
 
