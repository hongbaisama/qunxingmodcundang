 parallel_sky.90.desc.1:0 "Friend, our recent output of Alloys and Consumer Goods is not ideal.\n\nIf possible, we hope you can provide part of the produced Alloys and Consumer Goods to us. These are gifts of our friendship."
 parallel_sky.90.desc.2:0 "Friend, it's really bad, my warriors lack Alloys for equipment.\n\nIf possible, we hope you can help me produce some equipment. Don't worry about the price, I can afford it."
 parallel_sky.90.desc.3:0 "Friend, we have a serious shortage of Consumer Goods, which is an ominous sign.\n\nIf possible, we hope you can distribute some Consumer Goods to us. We are happy to pay wealth for friendship."
 parallel_sky.90.a:0 "We agree."
 parallel_sky.90.a.response:0 "Thank you very much for your help."
 parallel_sky.90.b:0 "We have our own things to do."
 parallel_sky.90.b.response:0 "What a pity."
 
 situation_parallel_sky_holiday:0 "Parallel Holiday"
 situation_parallel_sky_holiday_type:0 "Parallel Holiday"
 situation_parallel_sky_holiday_desc:0 "The Parallel Empire plans to come to our part of the planet for a vacation, which will be of great benefit to the diplomatic relations between the two countries."
 situation_parallel_sky_holiday_monthly_change_tooltip:0 "$situation_monthly_change_tooltip_approaches_dependent$"
 situation_parallel_sky_complete_effect:0 "The holiday festival will end smoothly"
 situation_parallel_sky_fail_effect:0 "The holiday festival will end halfway"
 
 parallel_sky.91.desc.1:0 "Friend, our researchers just completed a big project.\n\nThey are too tired and need a wonderful holiday to reward themselves. So, we plan to vacation on your part of the planet. What do you think?"
 parallel_sky.91.desc.2:0 "Friend, my warriors just fought a big victory.\n\nThey are too tired and need a wonderful holiday to reward themselves. So, we plan to vacation on your part of the planet. You shouldn't refuse, right?"
 parallel_sky.91.desc.3:0 "Friend, our philosophers just realized the true meaning of fate.\n\nThey are too tired and need a wonderful holiday to reward themselves. So, we plan to vacation on your part of the planet. Hope you can agree."
 parallel_sky.91.a:0 "This is helpful for friendship between the two countries."
 parallel_sky.91.a.response:0 "Delightful."
 parallel_sky.91.b:0 "Vacation on your own turf."
 parallel_sky.91.b.response:0 "Disappointing."
 parallel_sky.92.name:0 "Piles of Garbage"
 parallel_sky.92.desc:0 "The citizens of the Parallel Empire who came to our planet for vacation do not seem to know how to respect others.\n\nThey discard waste at will, requisition civilians' vehicles and objects without authorization and throw them on the roadside. The city is almost becoming a garbage dump because of them. We should ask them to compensate for this, but this may be detrimental to the friendship between the two countries."
 parallel_sky.92.a:0 "This is our turf."
 parallel_sky.92.b:0 "Should prioritize the overall situation."
 parallel_sky.93.name:0 "Diplomatic Insult"
 parallel_sky.93.desc:0 "Some of our officials publicly expressed insults to the Parallel Empire.\n\nThey believe that people of the Parallel Empire are of low quality, morally corrupt, and arrogant, and also accused us of inaction against the evil deeds of Parallel Empire citizens. Obviously, people of the Parallel Empire do not like such insults, and they ask us to explain this."
 parallel_sky.93.a:0 "Smooth things over."
 parallel_sky.93.b:0 "Don't care."
 parallel_sky.94.name:0 "Festival Speech"
 parallel_sky.94.desc.1:0 "The festival is nearing its climax, and the vacationers from the Parallel Empire look very satisfied.\n\nNow, we should hold a speech to praise the depth of friendship between the two civilizations. What should be our topic?"
 parallel_sky.94.desc.2:0 "The festival is nearing its climax, but the vacationers from the Parallel Empire do not look satisfied.\n\nNow, we should hold a speech to ease the depressed atmosphere between the two countries. What should be our topic?"
 parallel_sky.94.a:0 "\"Auld Lang Syne\""
 parallel_sky.94.b:0 "\"Voice of the Sea of Stars\""
 parallel_sky.95.name:0 "Settlement Intention"
 parallel_sky.95.desc:0 "Our festival obviously gave the other party a good impression. Some vacationers from the Parallel Empire requested to settle in our country.\n\nWe can give them citizenship of our country, but the Parallel Empire does not seem to want us to do so."
 parallel_sky.95.a:0 "Agree to their settlement request."
 parallel_sky.95.b:0 "Politely refuse their settlement request."
 parallel_sky.96.name:0 "Festival End"
 parallel_sky.96.desc:0 "The festival was held very successfully, and the Parallel Empire was also very satisfied with it.\n\nNow, the friendship between the two countries has entered a new stage. May our two countries continue to maintain good relations and roam together in the parallel starry sky."
 parallel_sky.96.a:0 "Gratifying."
 parallel_sky.97.name:0 "Festival Interrupted"
 parallel_sky.97.desc:0 "The festival ended halfway, and the Parallel Empire is obviously very dissatisfied with this."
 parallel_sky.97.a:0 "We don't need to care about their expressions."
 
 parallel_sky.100.desc.1:0 "Friend, we have reached the Long Night Period again.\n\nWithout the light of the sun, we have to suspend solar-related energy facilities, and our plantations will also be seriously affected. Therefore, we hope to temporarily install solar conversion devices in your territory and use your sun to help us survive the Long Night Period."
 parallel_sky.100.desc.2:0 "Friend, my sun is gone again.\n\nWithout the light of the sun, I have to suspend solar-related energy facilities, and my plantations will also be seriously affected. Therefore, I hope to temporarily install solar conversion devices in your territory, and also let me see your sun."
 parallel_sky.100.desc.3:0 "Friend, we have fallen into long darkness again.\n\nWithout the light of the sun, we have to suspend solar-related energy facilities, and our plantations will also be seriously affected. Therefore, we hope to temporarily install solar conversion devices in your territory and use your sun to help us survive the long night."
 parallel_sky.100.a.1:0 "Long Night Period?"
 parallel_sky.100.a.2:0 "Sun is gone?"
 parallel_sky.100.a.3:0 "Long darkness?"
 parallel_sky.100.a.response:0 "In our world, our planet revolves around a massive star in a large range, and the revolution period is very long. Therefore, there will be a not short period of time when our planet is far away from the star, and it is difficult to feel the light of the sun on the surface.\n\nI really envy you."
 parallel_sky.100.b:0 "We do not hesitate to share the sun."
 parallel_sky.100.b.response:0 "Praise the sun."
 parallel_sky.100.c:0 "The sun is also important to us."
 parallel_sky.100.c.response:0 "Really miss the sun."
 parallel_sky.100.d:0 "We can't see the sun either-it is a Black Hole."
 parallel_sky.100.d.response:0 "I regret to hear this news."
 parallel_sky.101.desc.1:0 "Friend, we have reached the Moonless Period again.\n\nWithout the production base on the moon, we have to suspend the mining facilities on it, and our alloy production will also be seriously affected. Therefore, we hope to temporarily establish a production base on your moon and use your moon to help us survive the Moonless Period."
 parallel_sky.101.desc.2:0 "Friend, my moon is gone again.\n\nWithout the production base on the moon, I have to suspend the mining facilities on it, and my alloy production will also be seriously affected. Therefore, I hope to temporarily establish a production base on your moon, and also let me see your moon."
 parallel_sky.101.desc.3:0 "Friend, the Moon God has left us again.\n\nWithout the production base on the moon, we have to suspend the mining facilities on it, and our alloy production will also be seriously affected. Therefore, we hope to temporarily establish a production base on your moon and use your moon to help us survive the pitch-black night."
 parallel_sky.101.a.1:0 "Moonless Period?"
 parallel_sky.101.a.2:0 "Moon is gone?"
 parallel_sky.101.a.3:0 "Departure of the Moon God?"
 parallel_sky.101.a.response:0 "In our world, our moon is not just our satellite; it only belongs to us for a certain period of time. But more often, it will be captured by other high-mass planets, and may even temporarily pass through the interior of a Gas Giant, thus escaping our control.\n\nI really envy you."
 parallel_sky.101.b:0 "We do not hesitate to share the moon."
 parallel_sky.101.b.response:0 "Praise the moon."
 parallel_sky.101.c:0 "The moon is also important to us."
 parallel_sky.101.c.response:0 "Really miss the moon."
 parallel_sky.101.d:0 "Our moon is gone too-we never had a satellite."
 parallel_sky.101.d.response:0 "I regret to hear this news."
 parallel_sky.102.desc.1:0 "Friend, we have reached the Shaded Period again.\n\nWithout the bathing of the starry sky, we will fall into uneasiness, and the people will have no heart to engage in production work. Therefore, we hope to temporarily settle on your planet at night and observe your normal starry sky."
 parallel_sky.102.desc.2:0 "Friend, my stars are gone again.\n\nWithout the bathing of the starry sky, I will fall into uneasiness, and civilians will have no heart to engage in production work. Therefore, we hope to temporarily settle on your planet at night and take a good look at your normal starry sky."
 parallel_sky.102.desc.3:0 "Friend, the evil devil has eroded the starry sky again.\n\nWithout the bathing of the starry sky, we will fall into panic, and the people will have no heart to engage in production work. Therefore, we hope to temporarily settle on your planet at night and bathe in your normal starry sky."
 parallel_sky.102.a.1:0 "Shaded Period?"
 parallel_sky.102.a.2:0 "Stars are gone?"
 parallel_sky.102.a.3:0 "Devil's starry sky?"
 parallel_sky.102.a.response:0 "In our world, for some unknown reason, a starry sky chaos phenomenon will occur every irregular period of time. During this period, the starry sky becomes abnormal, and many inexplicable disasters will quietly occur in the magical night.\n\nI really envy you."
 parallel_sky.102.b:0 "We do not hesitate to share the starry sky."
 parallel_sky.102.b.response:0 "Praise the starry sky."
 parallel_sky.102.c:0 "The starry sky is also important to us."
 parallel_sky.102.c.response:0 "Really miss the starry sky."
 parallel_sky.102.d:0 "Our starry sky has always been chaotic-we are in an unpredictable nebula."
 parallel_sky.102.d.response:0 "I regret to hear this news."
 
 parallel_sky.103.desc.1:0 "Friend, for the friendship between us, please accept these gifts.\n\nThank you very much for your help over the years. With you, we don't have to survive alone in the universe. So, accept these gifts."
 parallel_sky.103.desc.2:0 "Friend, I heard you are in a war, please accept our assistance.\n\nThank you very much for your help over the years. With you, we don't have to survive alone in the universe. So, for our mutual future, accept these supplies."
 parallel_sky.103.a:0 "Truly a big gift."
 parallel_sky.103.a.response:0 "May our friendship last forever."
 
 parallel_sky.106.desc:0 "Friend, your construction speed seems not very high.\n\nWe are willing to provide an efficient construction team. They can help you quickly build the buildings you need, and this only requires a small remuneration."
 parallel_sky.106.a:0 "We need them right now."
 parallel_sky.106.a.response:0 "They will satisfy you."
 parallel_sky.106.b:0 "We don't need them."
 parallel_sky.106.b.response:0 "What a pity, their construction ability is top-notch."
 parallel_sky.107.desc:0 "Friend, your production efficiency seems not very high.\n\nWe are willing to provide an efficient production team. They can guide you on how to quickly produce high-quality resources, and this only requires a small remuneration."
 parallel_sky.107.a:0 "We need them right now."
 parallel_sky.107.a.response:0 "They will satisfy you."
 parallel_sky.107.b:0 "We don't need them."
 parallel_sky.107.b.response:0 "What a pity, their production level is top-notch."
 parallel_sky.108.desc:0 "Friend, your quality of life seems not very high.\n\nWe are willing to provide an efficient performance team. They can provide you with a high-quality and comfortable living environment, and this only requires a small remuneration."
 parallel_sky.108.a:0 "We need them right now."
 parallel_sky.108.a.response:0 "They will satisfy you."
 parallel_sky.108.b:0 "We don't need them."
 parallel_sky.108.b.response:0 "What a pity, their performance talent is top-notch."
 parallel_sky.109.desc:0 "Friend, your recycling ability seems not very high.\n\nWe are willing to provide an efficient recycling team. They can recycle the waste created in your production process, and this only requires a small remuneration."
 parallel_sky.109.a:0 "We need them right now."
 parallel_sky.109.a.response:0 "They will satisfy you."
 parallel_sky.109.b:0 "We don't need them."
 parallel_sky.109.b.response:0 "What a pity, their recycling system is top-notch."
 parallel_sky.110.desc:0 "Friend, your medical level seems not very high.\n\nWe are willing to provide an efficient medical team. They can treat your difficult and complicated diseases at all levels, and this only requires a small remuneration."
 parallel_sky.110.a:0 "We need them right now."
 parallel_sky.110.a.response:0 "They will satisfy you."
 parallel_sky.110.b:0 "We don't need them."
 parallel_sky.110.b.response:0 "What a pity, their medical theory is top-notch."
 
 PARALLEL_SKY_CHAIN_title:0 "Hypocritical Starry Sky"
 PARALLEL_SKY_CHAIN_desc:0 "Our starry sky has become strange and eerie, revealing dangerous hypocrisy everywhere.\nCould this be related to the overlapping of planets?"
 
 parallel_sky.111.name:0 "Interlace"
 parallel_sky.111.desc:0 "From some unknown time, the starry sky of §Y[parallel_sky_planet.GetName]§! became a bit wrong.\n\nAt first, only the clouds became colorful, then the stars disappeared, and later the stars reappeared, but not in their original positions. Finally, the stars gradually gathered to form some indescribable patterns. Everyone who looks directly at the starry sky will feel inexplicable fear, and over time may even trigger madness, but we cannot find out the cause.\n\nAccording to our past communication records, it seems that the Parallel Empire has also encountered this weird phenomenon."
 parallel_sky.111.a:0 "Communicate with the Parallel Empire immediately."
 parallel_sky.112.desc.1:0 "Friend, heard that you also encountered the Shaded Period?\n\nIt is really regrettable. Although we have experienced it many times, after countless researches, we still cannot find out its cause."
 parallel_sky.112.desc.2:0 "Friend, heard that your stars are gone too?\n\nIt is really regrettable. Although we have experienced it many times, after countless researches, we still haven't found a solution."
 parallel_sky.112.desc.3:0 "Friend, heard that your starry sky was also eroded?\n\nIt is really regrettable. Although we have experienced it many times, after countless researches, we still cannot discover the truth."
 parallel_sky.112.a:0 "Can you describe your situation at that time?"
 parallel_sky.113.desc.1:0 "At first, only the clouds changed color, and then the stars disappeared. But when they reappeared, their positions changed, and even gathered into weird patterns.\n\nWe sent many scientific research teams to risk their lives studying the starry sky, but found nothing. Instead, many researchers went mad."
 parallel_sky.113.desc.2:0 "At first, only the clouds changed color, and then the stars disappeared. But when they reappeared, their positions changed, and even gathered into inexplicable scenes.\n\nI sent many warriors to risk their lives observing the starry sky, but found nothing. Instead, many warriors went mad."
 parallel_sky.113.desc.3:0 "At first, only the clouds changed color, and then the stars disappeared. But when they reappeared, their positions changed, and even gathered into the face of a devil.\n\nWe sent many philosophers to risk their lives perceiving the starry sky, but found nothing. Instead, many philosophers went mad."
 parallel_sky.113.a:0 "Could this be related to our planet overlapping phenomenon?"
 parallel_sky.114.desc:0 "Before learning the secret behind this phenomenon, we can never judge this."
 parallel_sky.114.a:0 "We should also take action."
 parallel_sky.114.a.response:0 "Good luck, although this is very likely to be futile."
 parallel_sky.115.name:0 "Conjugate"
 parallel_sky.115.desc:0 "Our study of the starry sky ended in failure.\n\nAfter careful investigation, we still cannot know the mystery behind the starry sky. On the planet, the starry sky is chaotic, while in space, the planet surface is normal. All spaceships attempting to pass through the atmosphere from the dark side of the planet disappeared into the unknown, including the Science Officer participating in the research."
 parallel_sky.115.a:0 "We will find the truth one day."
 parallel_sky.115.a.tooltip:0 "§YThe Science Officer conducting research is missing.§!"
 
 parallel_sky.116.desc:0 "Friend, bad news, we are in a huge crisis.\n\nWe encountered a group of Warp Beasts, and they are fighting radically with our fleet. This group of Warp Beasts is a new species we have never seen before. They seem to be attracted by your hypocritical starry sky, because they have been approaching with §Y[parallel_sky_planet.GetName]§! as the target since that day!"
 parallel_sky.116.a:0 "Warp Beasts?"
 parallel_sky.116.a.response:0 "Our universe is different from yours. We do not move between galaxies through hyperdrives, but through warp drives. Warp Beasts are space creatures that move using warp speed, and are often attracted by the operation of warp drives to attack ships.\n\nBut this time the Warp Beasts are very mysterious. They are larger, more ferocious, and will not be distracted by warp drives, but firmly move towards §Y[parallel_sky_planet.GetName]§!."
 parallel_sky.116.b:0 "We will fund you."
 parallel_sky.116.b.response:0 "Thank you very much for your funding. We need all power to deal with this group of unknown behemoths."
 parallel_sky.116.c:0 "You need more help."
 parallel_sky.116.c.response:0 "Thank you so much. We will use all power to deal with this group of unknown behemoths."
 parallel_sky.116.d:0 "We can't help with anything except blessings."
 parallel_sky.116.d.response:0 "We thought you could do something more."
 parallel_sky.117.desc:0 "Friend, Warp Beasts are approaching!\n\nOur ships are difficult to withstand their attacks. We need more resources."
 parallel_sky.117.a:0 "We will fund you."
 parallel_sky.117.a.response:0 "Thank you very much for your funding. We need all power to deal with this group of unknown behemoths."
 parallel_sky.117.b:0 "You need more help."
 parallel_sky.117.b.response:0 "Thank you so much. We will use all power to deal with this group of unknown behemoths."
 parallel_sky.117.c:0 "We can't help with anything except blessings."
 parallel_sky.117.c.response:0 "We thought you could do something more."
 
