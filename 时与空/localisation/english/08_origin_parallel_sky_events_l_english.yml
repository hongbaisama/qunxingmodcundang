 parallel_sky.118.desc:0 "Friend, some ordinary Warp Beasts that would not have been attracted by §Y[parallel_sky_planet.GetName]§! also attacked us!\n\nSome Warp Beasts quietly slipped through our defense line and rushed straight to the atmosphere of §Y[parallel_sky_planet.GetName]§!. We did not see any trace of Warp Beasts on the planet, so they are likely to have arrived in your world!"
 parallel_sky.118.a:0 "Really bad."
 parallel_sky.118.a.response:0 "Sorry, our fleet cannot intercept every mad Warp Beast."
 parallel_sky.120.name:0 "Collinear"
 parallel_sky.120.desc:0 "We successfully repelled this group of Warp Beasts, but more Warp Beasts appeared!"
 parallel_sky.120.a:0 "How many more Warp Beasts are waiting for us?"
 parallel_sky.121.name:0 "Coplanar"
 parallel_sky.121.desc:0 "Finally, we repelled all current Warp Beasts. The situation of the Parallel Empire seems to have stabilized, and no more Warp Beasts have arrived in our universe for the time being."
 parallel_sky.121.a:0 "When will they launch the next attack?"
 parallel_sky.122.desc:0 "Friend, we have reached our limit!\n\nThose big guys... are too powerful. We have no power to stop them anymore. They have broken into §Y[parallel_sky_planet.GetName]§!. Next, it's up to you."
 parallel_sky.122.a:0 "How is your situation?"
 parallel_sky.122.a.response:0 "We have no power to resurrect...\n\nOur fleets were destroyed in the battle with Warp Beasts, and all our colonies were destroyed by Warp Beasts. Now only a small group of military forces are still making the last resistance. We have completely failed. However, our army is brave and fearless. They killed at least nearly half of the Warp Behemoths, so you still have hope."
 parallel_sky.122.b:0 "Understood, leave the rest to us."
 parallel_sky.122.b.response:0 "......"
 parallel_sky.123.name:0 "Intersection"
 parallel_sky.123.desc:0 "We just defeated these behemoths, but a huger monster suddenly appeared near the star of the system. How did it appear?\n\nSeveral remnant fleets from the Parallel Empire came to our world through §Y[parallel_sky_planet.GetName]§!, but their help is a drop in the bucket compared to this monster."
 parallel_sky.123.a:0 "What is going on?"
 parallel_sky.124.name:0 "Turning Point"
 parallel_sky.124.desc:0 "After untold hardships, our fleet finally defeated that mysterious monster.\n\nAt the same time as defeating it, the chaotic starry sky on §Y[parallel_sky_planet.GetName]§! also returned to its original state in an instant. It seems that the overlap of planets and the hypocritical starry sky are all related to this strange creature."
 parallel_sky.124.a:0 "We will definitely find the answer from it."
 parallel_sky.125.name:0 "Parallel"
 parallel_sky.125.desc:0 "According to our research, this monster comes from a world called \"Horrific Inverse Plane\" by Science Officers.\n\nThe electromagnetic radiation frequency on this monster is extremely similar to that of a Black Hole, and it also shows the property of strong attraction of a Black Hole in a closer range. Research Specialist §Y[Leader.GetName]§! speculates that creatures living in the Horrific Inverse Plane have the ability to change dimensions to a certain extent. Therefore, they can shuttle in different worlds or planes in some form. If this hypothesis holds, then this monster crossed dimensions through the planet's atmosphere, and our homeworld is the \"anchor point\" it selected in advance.\n\nHowever, this hypothesis cannot solve all problems, and our understanding of this monster is only a drop in the bucket, but this must be an opportunity for us to explore the mysteries of the universe."
 parallel_sky.125.a:0 "Friend of the Parallel Empire, we will explore the mysteries of the universe for you."
 parallel_sky.125.b:0 "Friend of the Parallel Empire, we will find the direction of the universe for you."
 parallel_sky.125.c:0 "Friend of the Parallel Empire, we will conquer this galaxy for you."
 parallel_sky.125.d:0 "Friend of the Parallel Empire, we will govern this galaxy for you."
 parallel_sky.125.e:0 "Friend of the Parallel Empire, the sea of stars is not lonely because of your company."
 parallel_sky.125.f:0 "Friend of the Parallel Empire, the sea of stars is not humble because of your existence."
 parallel_sky.125.g:0 "Friend of the Parallel Empire, history will remember you forever."
 parallel_sky.125.h:0 "Friend of the Parallel Empire, we will remember you forever."
 parallel_sky.125.i:0 "Friend of the Parallel Empire, farewell."