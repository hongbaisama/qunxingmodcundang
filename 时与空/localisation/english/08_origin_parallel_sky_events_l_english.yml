l_english:
 NAME_Parallel_Sky:0 "Parallel"
 NAME_Parallel_Sky_adj:0 "Parallel Empire's"
 parallel_sky.name:0 "Parallel Empire"
 parallel_sky.1.name:0 "Perpendicular"
 parallel_sky.1.desc:0 "We finally stepped into the galaxy, and another country that has always been opposed to us also embraced the starry sky.\n\nHowever, looking around, we did not find any ships of the other country in space. We can't help but doubt the truth of the other country flying into space, but at this time, the other party also sent a communication request."
 parallel_sky.1.a:0 "Communicate."
 parallel_sky.2.desc:0 "Where... are you exactly?\n\nOur probe ship searched the entire system but could not find any trace of your ships. I understand now, your claim of stepping into space is just a trick, you haven't developed the technology needed for aerospace.\n\nThis time, our country is ahead."
 parallel_sky.2.a:0 "I should be asking you this, right?"
 parallel_sky.3.desc:0 "You mean-you can't find our ships either?\n\nWhat a strange thing, is our starry sky not the same starry sky?"
 parallel_sky.3.a:0 "We don't know the answer either."
 parallel_sky.4.desc:0 "Wait, our Science Officer submitted a very important report.\n\nThe report shows that based on years of investigation by the research team and photos taken by probe ships, our Science Officer made an amazing hypothesis: §RWe two civilizations are not on the same planet!§!\n\nThere is reason to believe that the planets inhabited by our two civilizations just have exactly the same environment, but are actually not the same planet. It's just that for some reason our planets overlapped to a certain extent. We can reach the other planet through the invisible overlapping part in the planet, but not in space.\n\nThis hypothesis can also explain the phenomenon that our two countries have had significant disagreements on the map of the junction for tens of thousands of years."
 parallel_sky.4.a:0 "Is this hypothesis reliable?"
 parallel_sky.5.desc:0 "The Science Officer who submitted the report enjoys high academic achievements and prestige in our country. His theory should have high credibility.\n\nAlthough we still need a lot of time to verify this theory, for now, we need to temporarily accept this fact."
 parallel_sky.5.materialist:0 "In the sky full of stars, we will move forward alone."
 parallel_sky.5.spiritualist:0 "In the sky full of stars, where will we go?"
 parallel_sky.5.militarist:0 "Even if only us, it is enough to conquer this galaxy."
 parallel_sky.5.pacifist:0 "Even if only us, we can establish a foothold in this galaxy."
 parallel_sky.5.xenophile:0 "Can we meet again in the future?"
 parallel_sky.5.xenophobe:0 "It's time for us to part ways."
 parallel_sky.5.egalitarian:0 "Our people will guide the future direction."
 parallel_sky.5.authoritarian:0 "I already know which way to go in the future."
 parallel_sky.5.other:0 "It's time to embark on the journey."
 
 parallel_sky.10.desc.1.good:0 "Welcome, our friend. I am glad to see cooperation between the two countries, which is of great benefit to the scientific development of both sides."
 parallel_sky.10.desc.1.normal:0 "What can I do for you, country from the parallel world. Do you need our scientific help, or is it for something else?"
 parallel_sky.10.desc.1.bad:0 "How dare you appear in front of us? You will be defeated by the ocean of our people!"
 parallel_sky.10.desc.2.good:0 "Welcome, our friend. I am glad to see cooperation between the two countries, which is of great benefit to the military development of both sides."
 parallel_sky.10.desc.2.normal:0 "What can I do for you, country from the parallel world. Do you need our military power, or is it for something else?"
 parallel_sky.10.desc.2.bad:0 "How dare you appear in front of us? You will soon be conquered by my warriors!"
 parallel_sky.10.desc.3.good:0 "Welcome, our friend. I am glad to see cooperation between the two countries, which is of great benefit to the ideological development of both sides."
 parallel_sky.10.desc.3.normal:0 "What can I do for you, country from the parallel world. Do you need our ideological guidance, or is it for something else?"
 parallel_sky.10.desc.3.bad:0 "How dare you appear in front of us? You are hopeless, justice will prevail!"
 parallel_sky.10.a.1:0 "§RYou are redundant!§!"
 HAS_PARALLEL_SKY_PEACE:0 "We just returned to peace"
 parallel_sky.10.a.2:0 "It's time for the war to end."
 parallel_sky.10.b:0 "We can share knowledge on scientific development."
 parallel_sky.10.c:0 "We can cooperate on military development."
 parallel_sky.10.d:0 "We can help each other on ideological development."
 parallel_sky.10.e:0 "We can help each other on trade development."
 parallel_sky.10.f.1:0 "Thank you for your hospitality."
 parallel_sky.10.f.2:0 "Nothing."
 parallel_sky.10.f.3:0 "Get out of our planet!"
 
 parallel_sky.12.name:0 "Parallel"
 parallel_sky.12.desc:0 "With the destruction of §Y[From.GetName]§!, the overlapping worlds returned to the right track, and parallel starry skies no longer intersect.\n\nThe status quo of another planet, the future of another civilization, the reason for world overlap, the destination of parallel starry skies, have all been buried in dust with the demise of the planet."
 parallel_sky.12.a:0 "Our history also went with it."
 parallel_sky.13.name:0 "Overlap"
 parallel_sky.13.desc.1:0 "We recaptured §Y[Root.GetName]§!. Now, we can communicate with the Parallel Empire through the overlapping part on the planet again."
 parallel_sky.13.desc.2:0 "After we took control of §Y[Root.GetName]§!, we found some unbelievable things.\n\nFirst, observation of the planet from space cannot reveal the full picture of the planet. There are always some areas on the planet that cannot be known from space.\nSecond, there seems to be not only its original owner on the planet, but also a second owner, and it also possesses sufficiently developed technology.\nFinally, another civilization obviously mastered space travel technology. Their ships in the starry sky can also be seen from the planet, but we cannot find the whereabouts of their ships in outer space.\n\nNow, another civilization has sent us a communication request."
 parallel_sky.13.a:0 "Very good."
 parallel_sky.13.b:0 "Communicate."
 parallel_sky.14.desc:0 "Hello, new owner of the planet-to be exact, new owner of your planet."
 parallel_sky.14.a:0 "What does this mean?"
 parallel_sky.15.desc:0 "Actually, this planet is produced by the overlap of different planets from two worlds. We can reach the other planet through the invisible overlapping part in the planet, but not in space."
 parallel_sky.15.a:0 "That is to say, you are in another world?"
 parallel_sky.16.desc:0 "Exactly. Because we have different starry skies, if you try to conquer us together, you can only rely on ground combat, which poses no threat to our empire. Similarly, if we try to attack you, we can at most only cause you to lose one colony."
 parallel_sky.16.a:0 "Indeed so."
 parallel_sky.17.desc:0 "Therefore, I suggest that we do not interfere with each other and share this huge planet together. If you are willing, we can even advance hand in hand."
 parallel_sky.17.a:0 "Understood."
 parallel_sky.17.a.response:0 "Then, happy cooperation."
 parallel_sky.17.b:0 "Impossible, alien scum!"
 parallel_sky.17.c:0 "No, you are all food!"
 parallel_sky.17.d:0 "Organic filth must be completely removed!"
 parallel_sky.17.e:0 "Burning! Burning!"
 
 parallel_sky.18.desc.1:0 "We regret to inform you that we no longer want to share our knowledge with you. From now on, we will have nothing to do with each other."
 parallel_sky.18.desc.2:0 "What a pity, I am no longer interested in you. All your cooperation treaties are just a piece of waste paper to me."
 parallel_sky.18.desc.3:0 "Our philosophers do not need your charity, and we do not need your help. The agreement between us has been abolished."
 parallel_sky.18.a:0 "You will regret it."
 
 parallel_sky.20.desc.1:0 "Very good, we are very happy to share our scientific knowledge with you. However, knowledge is not without cost. We need a handling fee to ensure the success of our academic exchange operation."
 parallel_sky.20.desc.2:0 "Sharing knowledge? Very good, I am also very interested in your knowledge, but my warriors don't seem to think so. If you can give them some benefits, maybe they will change their minds."
 parallel_sky.20.desc.3:0 "Want to share our knowledge? Honestly, we don't really care about your scientific knowledge, but if you are willing to sponsor our poor philosophers, maybe we can consider it."
 parallel_sky.20.a:0 "For science!"
 parallel_sky.20.a.response:0 "Thank you for your understanding. Our researchers will arrive in your country soon."
 parallel_sky.20.b:0 "Take it."
 parallel_sky.20.b.response:0 "The warriors are enthusiastic. They agreed, and I agreed too."
 parallel_sky.20.c:0 "We are willing to sponsor."
 parallel_sky.20.c.response:0 "Thank you very much for your sponsorship. The philosophers will be very happy, and so will your scientists."
 parallel_sky.20.d:0 "The price seems a bit too high."
 parallel_sky.20.d.response:0 "Come back when you change your mind."
 
 parallel_sky.30.desc.1:0 "Very good, we are very happy to share our military knowledge with you. However, knowledge is not without cost. We need a handling fee to ensure the success of our military cooperation operation."
 parallel_sky.30.desc.2:0 "Military cooperation? Very good, I am also very interested in your military level, but my warriors don't seem to think so. If you can give them some benefits, maybe they will change their minds."
 parallel_sky.30.desc.3:0 "Want to cooperate militarily with us? Honestly, we don't really like military and war, but if you are willing to sponsor our poor philosophers, maybe we can consider it."
 parallel_sky.30.a:0 "For progress!"
 parallel_sky.30.a.response:0 "Thank you for your understanding. Our military experts will arrive in your country soon."
 parallel_sky.30.b:0 "Your warriors will like these."
 parallel_sky.30.b.response:0 "The warriors cheered. They agreed, and I agreed too."
 parallel_sky.30.c:0 "We are willing to sponsor."
 parallel_sky.30.c.response:0 "Thank you very much for your sponsorship. The philosophers will be very happy, and so will your military strategists."
 parallel_sky.30.d:0 "The price seems a bit too high."
 parallel_sky.30.d.response:0 "Come back when you change your mind."
 
 parallel_sky.40.desc.1:0 "Very good, we are very happy to share our ideology and culture with you. However, ideology is not without cost. We need a handling fee to ensure the success of our cultural exchange operation."
 parallel_sky.40.desc.2:0 "Ideological mutual assistance? Very good, I am also very interested in your ideology and culture, but my warriors don't seem to think so. If you can give them some benefits, maybe they will change their minds."
 parallel_sky.40.desc.3:0 "Want to discuss ideology and culture with us? Honestly, we don't really need to understand your culture, but if you are willing to sponsor our poor philosophers, maybe we can consider it."
 parallel_sky.40.a:0 "For progress!"
 parallel_sky.40.a.response:0 "Thank you for your understanding. Our cultural workers will arrive in your country soon."
 parallel_sky.40.b:0 "Take it."
 parallel_sky.40.b.response:0 "The warriors applauded. They agreed, and I agreed too."
 parallel_sky.40.c:0 "This is the remuneration they deserve."
 parallel_sky.40.c.response:0 "Thank you very much for your sponsorship. The philosophers will be very happy, and so will your philosophers."
 parallel_sky.40.d:0 "The price seems a bit too high."
 parallel_sky.40.d.response:0 "Come back when you change your mind."
 
 parallel_sky.45.desc.1:0 "Very good, we are very happy to share our trading market with you. However, trade is not without cost. We need a handling fee to ensure the success of our economic exchange operation."
 parallel_sky.45.desc.2:0 "Border trade? Very good, I am also very interested in your economic profits, but my warriors don't seem to think so. If you can give them some benefits, maybe they will change their minds."
 parallel_sky.45.desc.3:0 "Want to achieve mutual exchange of needed goods with us? Honestly, we don't really intend to change the economic structure, but if you are willing to sponsor our poor philosophers, maybe we can consider it."
 parallel_sky.45.a:0 "For progress!"
 parallel_sky.45.a.response:0 "Thank you for your understanding. Our merchants will arrive in your country soon."
 parallel_sky.45.b:0 "Take it."
 parallel_sky.45.b.response:0 "The warriors are gearing up. They agreed, and I agreed too."
 parallel_sky.45.c:0 "We are willing to sponsor."
 parallel_sky.45.c.response:0 "Thank you very much for your sponsorship. The philosophers will be very happy, and so will your financiers."
 parallel_sky.45.d:0 "The price seems a bit too high."
 parallel_sky.45.d.response:0 "Come back when you change your mind."
 
 NAME_Parallel_Sky_Army_0:0 "Vigilante"
 NAME_Parallel_Sky_Army_1:0 "Inquisitor"
 NAME_Parallel_Sky_Army_2:0 "Conqueror"
 NAME_Parallel_Sky_Army_3:0 "Watcher"
 parallel_sky_army_0:0 "Parallel Guard"
 parallel_sky_army_0_plural:0 "Parallel Guards"
 parallel_sky_army_0_desc:0 "Guards from the Parallel Empire, willing to sacrifice their lives to defend their home and country."
 parallel_sky_army_1:0 "Parallel Warform"
 parallel_sky_army_1_plural:0 "Parallel Warforms"
 parallel_sky_army_1_desc:0 "Machine Warforms from the Parallel Empire; fearless people will drown the enemy."
 parallel_sky_army_2:0 "Parallel Warrior"
 parallel_sky_army_2_plural:0 "Parallel Warriors"
 parallel_sky_army_2_desc:0 "Gene Warriors from the Parallel Empire; loyal soldiers will defeat the enemy."
 parallel_sky_army_3:0 "Parallel Chapter"
 parallel_sky_army_3_plural:0 "Parallel Chapters"
 parallel_sky_army_3_desc:0 "Psionic Chapters from the Parallel Empire; righteous armies will conquer the enemy."
 
 parallel_sky.50.desc:0 "What do you mean, do you want to declare war on us?"
 parallel_sky.50.a:0 "§RYes, we don't need you!§!"
 parallel_sky.50.b:0 "No, I didn't mean that..."
 parallel_sky.50.b.response:0 "Please be cautious in your words and deeds."
 parallel_sky.51.desc.1:0 "You made a huge mistake. The ocean of our people will completely crush your army."
 parallel_sky.51.desc.2:0 "You asked for this. My brave and loyal warriors will soon kill you all without leaving a trace, haha."
 parallel_sky.51.desc.3:0 "We crave peace, but if forced, we are also willing to wage war to defend our homeland."
 parallel_sky.51.a:0 "War!"
 parallel_sky.52.desc.1:0 "This is just a temporary setback. Our people will regroup soon."
 parallel_sky.52.desc.2:0 "This is just a temporary setback. My warriors will regroup soon."
 parallel_sky.52.desc.3:0 "This is just a temporary setback. Our army will regroup soon."
 parallel_sky.52.a:0 "You cannot defeat us!"
 parallel_sky.53.desc.1:0 "It's time to end this dispute. We will completely crush you."
 parallel_sky.53.desc.2:0 "It's time to end this game. We will tear you to pieces."
 parallel_sky.53.desc.3:0 "It's time to end this chaos. We will drive you out of our homeland."
 parallel_sky.53.a:0 "Stop struggling in vain!"
 parallel_sky.54.desc.1:0 "Don't be in a hurry to celebrate. Our main force will arrive soon."
 parallel_sky.54.desc.2:0 "Don't think you have won. Our main force is coming."
 parallel_sky.54.desc.3:0 "Don't look like a villain who succeeded. Our main force hasn't arrived yet."
 parallel_sky.54.a:0 "No matter how many times, the result cannot be changed!"
 parallel_sky.55.desc.1:0 "This is the final decisive battle. Either you die, or I die!"
 parallel_sky.55.desc.2:0 "This is the final bloody battle. Either you die, or I die!"
 parallel_sky.55.desc.3:0 "This is the final jihad. Either you die, or I die!"
 parallel_sky.55.a:0 "You have already lost!"
 parallel_sky.56.desc.1:0 "We admit, we lost. We will leave this planet forever, remember this humiliating history, and never return."
 parallel_sky.56.desc.2:0 "Undoubtedly, you are the final winner. This war was fought to the heart's content. It's yours, we accept defeat."
 parallel_sky.56.desc.3:0 "It's over. War has no winner. You take this regrettable planet. We part forever here."
 parallel_sky.56.a:0 "We eventually went parallel."
 parallel_sky.60.desc.1.a:0 "Want peace? You also want peace? Peace is not without cost."
 parallel_sky.60.desc.1.b:0 "Want peace? Want peace only after losing the homeworld? Peace comes at a great price."
 parallel_sky.60.desc.2.a:0 "I also want to end the war, but my warriors don't seem to think so, unless you can pay them a remuneration."
 parallel_sky.60.desc.2.b:0 "I also want to end the war, but my warriors don't seem to think so, especially since they just won a battle, unless you can pay them a large remuneration."
 parallel_sky.60.desc.3.a:0 "Do you finally understand that we are the righteous side? But our people lost a lot in the war, they must be compensated."
 parallel_sky.60.desc.3.b:0 "Did you only understand that we are the righteous side after defeat? But our people lost a lot in the war, they must receive sufficient compensation."
 parallel_sky.60.a:0 "We can accept your conditions."
 parallel_sky.60.a.response:0 "Wise choice."
 parallel_sky.60.b:0 "For peace, we have no other choice."
 parallel_sky.60.b.response:0 "We accept your peace."
 parallel_sky.60.c:0 "It seems the war will continue."
 parallel_sky.60.c.response:0 "We will not show mercy."
 
