 time.30.name:0 "Mysterious Singularity: §HUnderstanding Infinity§!"
 time.30.desc:0 "The singularity is not the form with the highest density; we can compress it again.\n\nUnder the hint of The Worm-in-Waiting, we tried this unprecedented black hole compression technology-compressing the singularity to make its density overflow. Only with the help of The Worm-in-Waiting can we complete this process. Therefore, we compressed our homeworld. However, The Worm-in-Waiting only told us that this act could allow us to understand all the mysteries of the universe, but did not tell us what the price is.\n\n§RWhat is the price?§!"
 time.30.a:0 "§RI can see eternity...§!"
 time.30.a.tooltip:0 "§HUnlock Feature:§! Singularity Recursion\n$t$Allows terraforming §Y$pc_black_hole$§! into §Y$pc_time$§!\n$t$Each §Y$pc_time$§! and §Y$pc_endless_time$§! will generate $mod_col_time_mult$ §G+5%§!\n§R$pc_endless_time$ will swallow all hyperlanes in the system!§!"
 time.24.name:0 "Mysterious Singularity: §HEternal Farewell§!"
 time.24.desc.1:0 "Black holes are all evil and devoid of beauty, and our former homeworld is even more so.\n\n$change_pc_time_1_desc$"
 time.24.a.1:0 "§YThis is God's guidance...§!"
 time.24.a.1.tooltip:0 "Successfully seal §Y$pc_time$§!, and thus obtain the empire modifier §Y$change_pc_time_1$§!."
 time.24.desc.2:0 "Every black hole in the universe hides mysteries, and our former homeworld is no exception.\n\n$change_pc_time_2_desc$"
 time.24.a.2:0 "§BData is unbelievable...§!"
 time.24.a.2.tooltip:0 "Successfully peek into §Y$pc_time$§!, and thus obtain the empire modifier §Y$change_pc_time_2$§!."
 
 time.29.name:0 "Mysterious Singularity: §HHorizon Haze§!"
 time.29.desc.1:0 "Using the technology learned in the homeworld, we successfully changed the physical laws under the horizon haze, and even successfully transformed it into a black hole.\n\nChaos and disorder are no longer synonymous with §Y[time_wormhole_planet.GetName]§!; it has become our second home."
 time.29.desc.2:0 "Through the study of the horizon haze, we made an amazing discovery-the horizon of §Y[time_wormhole_planet.GetName]§! is actually connected to §Y[time_wormhole_core_planet.GetName]§!!\n\nThe Science Officer has used this feature to open a stable wormhole between the two planets. We decided to give up the development of §Y[time_wormhole_planet.GetName]§! itself and instead incorporate the dimension it occupies into the realm of §Y[time_wormhole_core_planet.GetName]§!."
 time.29.a:0 "This is our second horizon."
 time.29.b:0 "This is a world belonging to us."
 
 time.50.name:0 "The Worm-in-Waiting: §BPast Palace§!"
 time.50.desc:0 "After living in the Endless Singularity for several years, we finally realized the meaning of the Future Palace.\n\nThis mysterious palace comes from our future, and the resources in it are gifts from our future selves. Perhaps, now is the time to repay. We can also contribute our part to this §YLoop§!, so that our past selves can get help from the present. Of course, past time is finite, and future time is infinite, so we only need to provide very few resources to make the §YLoop§! complete.\n\n§HThe Worm-in-Waiting§! also looks forward to our response."
 time.50.a:0 "We are always part of the loop."
 time.50.b:0 "Our future selves will make up for this part of the present."
 time.51.name:0 "The Worm-in-Waiting: §MSpacetime Loop§!"
 time.51.desc:0 "We have achieved a spacetime loop: our present selves provide help to the past, and our future selves contribute to the present.\n\nWe truly understand the meaning of the loop, and truly understand the deep meaning of §HThe Worm-in-Waiting§!. Not only does §HThe Worm-in-Waiting§! love us deeply, we also love ourselves deeply."
 time.51.a:0 "§MWe love ourselves forever.§!"