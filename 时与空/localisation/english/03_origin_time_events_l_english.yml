 time_blocker_3_can_be_cleared:0 "['concept_time_blocker_3_can_be_cleared_yellow']"
 
 time.121.name:0 "Mysterious Singularity: §HUnknown Spacetime§!"
 time.121.desc:0 "Our explorers have arrived at an unknown spacetime.\n\nIn this spacetime, we found that time flows very regularly in the reverse direction. If we can find out the cause of this phenomenon, perhaps we can utilize this spacetime."
 time.121.a:0 "Research this phenomenon."
 time.111.name:0 "Mysterious Singularity: §HTime Reversal§!"
 time.111.desc:0 "According to the Science Officer's research, this phenomenon may be caused by an early white hole.\n\nIn the central vortex of this spacetime, a small anti-singularity is brewing. It rotates on a time scale opposite to that of a black hole and continuously ejects matter from unknown planes outward.\n\nAlthough we still cannot know its specific principle, the laws of this spacetime have become graspable."
 time.111.a:0 "Truly beautiful."
 time.122.name:0 "Mysterious Singularity: §HUnknown Spacetime§!"
 time.122.desc:0 "Our explorers have arrived at an unknown spacetime.\n\nIn this spacetime, we found that space rotates very regularly around a certain center. If we can find out the cause of this phenomenon, perhaps we can utilize this spacetime."
 time.122.a:0 "Research this phenomenon."
 time.112.name:0 "Mysterious Singularity: §HSpace Vortex§!"
 time.112.desc:0 "According to the Science Officer's research, this phenomenon may be caused by a micro-singularity.\n\nIn the central vortex of this spacetime, a small micro-singularity is brewing. It swallows surrounding matter with not large but rapid attraction, and thus drives the rotation of the entire space.\n\nAlthough we still cannot know its specific principle, the laws of this spacetime have become graspable."
 time.112.a:0 "Truly interesting."
 time.123.name:0 "Mysterious Singularity: §HUnknown Spacetime§!"
 time.123.desc:0 "Our explorers have arrived at an unknown spacetime.\n\nIn this spacetime, we found that matter is repeatedly synthesized and decomposed in chaos. If we can find out the cause of this phenomenon, perhaps we can utilize this spacetime."
 time.123.a:0 "Research this phenomenon."
 time.113.name:0 "Mysterious Singularity: §HMatter Forge§!"
 time.113.desc:0 "According to the Science Officer's research, this phenomenon may be caused by a high-pressure field.\n\nIn the central vortex of this spacetime, a singularity point continuously releases pressure outward, causing the entire spacetime to be in a state of extreme high pressure. Particles collide rapidly to synthesize matter, and matter decomposes because it cannot withstand high pressure.\n\nAlthough we still cannot know its specific principle, the laws of this spacetime have become graspable."
 time.113.a:0 "Truly shocking."
 time.124.name:0 "Mysterious Singularity: §HUnknown Spacetime§!"
 time.124.desc:0 "Our explorers have arrived at an unknown spacetime.\n\nIn this spacetime, we clearly feel a wonderful strangeness. The atmosphere here is more oppressive than other spacetimes. There must be secrets hidden behind this that we don't know."
 time.124.a:0 "We crave answers."
 time.114.name:0 "Mysterious Singularity: §HFolded Dimension§!"
 time.114.desc:0 "Investigations show that this is a rare folded dimension phenomenon.\n\nFive dimensions are folded in half in this spacetime. The oppressive feeling we feel is exactly the helplessness of accommodating the information volume of higher dimensions in lower dimensions.\n\nAlthough we cannot fully master its principle, this has brought considerable inspiration to our way of utilizing spacetime."
 time.114.a:0 "Truly wonderful."
 time.125.name:0 "Mysterious Singularity: §HUnknown Spacetime§!"
 time.125.desc:0 "Our explorers have arrived at an unknown spacetime.\n\nIn this spacetime, we found a huge plane rift, greedily sucking the surrounding particles. If allowed to expand, it may cause indelible impacts on other spacetimes."
 time.125.a:0 "We guard against disasters."
 time.115.name:0 "Mysterious Singularity: §HPlane Rift§!"
 time.115.desc:0 "After a laborious repair process, the plane rift has temporarily stopped expanding.\n\nThe staff participating in the repair process stated that they glimpsed the existence of another world through the plane rift, claiming that a group of \"higher dimensional\" \"demons\" are fighting each other and thus tearing other rifts in the dimension.\n\nAlthough we cannot completely repair the plane rift, the fight of \"higher dimensional creatures\" brought us unexpected surprises."
 time.115.a:0 "Truly terrible."
 time.126.name:0 "Mysterious Singularity: §HUnknown Spacetime§!"
 time.126.desc:0 "Our explorers have arrived at an unknown spacetime.\n\nIn this spacetime, there are still some eerie life forms without physical bodies stranded. They seem extremely aggressive and will attack any black hole residents attempting to approach. We'd better expel them."
 time.126.a:0 "We defend our homeland."
 time.116.name:0 "Mysterious Singularity: §HShroud Creatures§!"
 time.116.desc:0 "After a hard fight, that group of life forms finally fled in panic.\n\nAlthough these eerie creatures have no physical bodies, they are not invincible. Conventional weapons can still cause certain damage to them. Due to their peculiar life forms, we call them \"Shroud Creatures\".\n\nAlthough we suffered some losses, we successfully rescued some trapped residents."
 time.116.a:0 "Truly lucky."
 
 time.130.name:0 "Mysterious Singularity: §HTranscending the Barrier§!"
 time.130.desc:0 "Our explorers finally approached the central zone of the black hole.\n\nWhen the explorers were preparing to continue forward, they were blocked by an invisible barrier. Someone tentatively took out a personal item and threw it forward, but the item bounced back and hit him in the face. The accompanying researchers immediately took out various detection devices from their bags, but no matter how precise the instruments were, they could not sense the existence of the barrier, let alone analyze the composition and cause of the barrier.\n\nOur Head Researcher requested to initiate an investigation project on this, but opinions vary on the direction of the investigation."
 time.130.a:0 "Start with the physical properties of the barrier."
 time.130.b:0 "Start with the historical records of the barrier."
 time.130.c:0 "Start with the composition materials of the barrier."
 time.131.name:0 "Mysterious Singularity: §HTransparent Wall§!"
 time.131.desc:0 "Tests on the central barrier have come to an end.\n\nNo matter how we interact with this barrier, we cannot get any valid information. The only feedback is that all substances known to us cannot pass through it-except light.\n\nResearch in this direction probably won't make any progress. Our researchers are trying to start from other angles."
 time.131.a:0 "Like a transparent wall."
 time.132.name:0 "Mysterious Singularity: §HNameless Wall§!"
 time.132.desc:0 "Consultation on the central barrier has come to an end.\n\nNo matter how many materials we have read, we cannot find any records about this barrier. The only thing that can be confirmed is that no one has ever seen it-except us.\n\nResearch in this direction probably won't make any progress. Our researchers are trying to start from other angles."
 time.132.a:0 "Like a nameless wall."
 time.133.name:0 "Mysterious Singularity: §HIllusory Wall§!"
 time.133.desc:0 "Analysis of the central barrier has come to an end.\n\nNo matter what materials we referred to, we cannot find any substance similar to the barrier in terms of engineering properties. The only possible conclusion is that it is nothing-except a force field.\n\nResearch in this direction probably won't make any progress. Our researchers are trying to start from other angles."
 time.133.a:0 "Like an illusory wall."
 time.134.name:0 "Mysterious Singularity: §HUnexpected Harvest§!"
 time.134.desc:0 "Although our research on the central barrier has made no progress, we found an unexpected harvest.\n\nBased on previous test data, we might be able to use it to calm the chaotic vortex of a piece of spacetime and incorporate them into our territory. Such an opportunity is rare, but it requires consuming a large amount of resources and may temporarily delay our research progress."
 time.134.a:0 "We cannot waste such a precious opportunity."
 time.134.b:0 "Our primary task is to breach the barrier."
 time.135.name:0 "Mysterious Singularity: §HDistress Signal§!"
 time.135.desc:0 "Although our research on the central barrier has made no progress, we received a distress signal.\n\nThis signal uses a very ancient language, but fortunately, we learned the grammar of this language in our previous consultation. The rescued may join us, but this requires consuming a large amount of resources and may temporarily delay our research progress."
 time.135.a:0 "We cannot leave them to die."
 time.135.b:0 "Our primary task is to breach the barrier."
 time.136.name:0 "Mysterious Singularity: §HWhim§!"
 time.136.desc:0 "Although our research on the central barrier has made no progress, we had a whim.\n\nAlthough no material is similar to the barrier, we can mix multiple materials to simulate the properties of the barrier and use it to expand existing districts. This idea is bold, but it requires consuming a large amount of resources and may temporarily delay our research progress."
 time.136.a:0 "We cannot deny the value of unconstrained imagination."
 time.136.b:0 "Our primary task is to breach the barrier."
 time.137.name:0 "Mysterious Singularity: §HGravitational Resonance§!"
 time.137.desc:0 "Hard work pays off; our research on the barrier finally yielded results.\n\nDuring a routine check, staff accidentally discovered the strange characteristics of the barrier. When outputting a signal to the barrier at a certain extremely high frequency, the barrier responds to the signal and vibrates slightly.\n\nWe speculate that this gravitational barrier generates a force field and maintains its shape with a specific frequency signal. When the frequency we happen to output is superimposed on this frequency, it will cause a certain phase of its cycle wave to be in an unstable state and lead to the vibration of the barrier. Although it is difficult to continuously output this high-frequency signal, and the resonance amplitude of the barrier is not drastic, it still gives us a glimmer of hope to breach the barrier.\n\nWe don't know if this method is feasible, but this may be our only chance to transcend the barrier."
 time.137.a:0 "Before trying, no one can predict the result."
 time.138.name:0 "Mysterious Singularity: §HStepping into the Abyss§!"
 time.138.desc:0 "Under the action of gravitational resonance, the gravitational barrier finally showed a gap and shattered instantly. At the same time, a strong attractive force wrapped us, as if everything would be swallowed by this bottomless abyss. After barely maintaining the repulsion balance, we finally got a chance to breathe.\n\nSome philosophers believe that this barrier was not intended to hinder us; on the contrary, its real purpose was to protect us."
 time.138.a:0 "But we always have to take this step."
 
 time.141.name:0 "Mysterious Singularity: §HGravitational Fluctuation§!"
 time.141.desc:0 "A violent gravitational fluctuation swept through the entire black hole.\n\nA group of explorers investigating unknown spacetime were swallowed by the fluctuation and have been missing since. We can only assume they died in this sudden disaster. The relatives of this group of explorers feel very sad, and other explorer colleagues also expressed regret.\n\nThey call for the establishment of a monument in this spacetime where the victims died to mourn the deceased, which may temporarily prevent us from developing and utilizing this place."
 time.141.a:0 "We cannot fail their achievements."
 time.141.b:0 "We should remember their sacrifice."
 time.142.name:0 "Mysterious Singularity: §HData Core§!"
 time.142.desc:0 "Our explorers found a mysterious data core.\n\nWhen they transported the data core to the central research institute, the data core suddenly activated and instantly released countless unknown radiations. This radiation will not cause direct harm to our bodies, but it seems to affect our minds and trigger symptoms such as depression, grief, amnesia, and mania.\n\nHowever, this data core stores a lot of knowledge we have never touched upon. It might provide significant help for our scientific progress."
 time.142.a:0 "Use it to stabilize chaotic spacetime."
 time.142.b:0 "Use it to enhance the empire's scientific research."
 time.143.name:0 "Mysterious Singularity: §HPhase Shift§!"
 time.143.desc:0 "Some of our districts suddenly disappeared without a trace.\n\nThe original building complexes disappeared in an instant, replaced by several pieces of unknown spacetime. According to experienced explorers, this is a rare phase shift phenomenon, only never seen on such a large scale.\n\nWe don't know if these spacetimes will change again, but this gives us an opportunity to build new areas, and also an opportunity to understand the black hole."
 time.143.a:0 "Develop these spacetimes."
 time.143.b:0 "Research phase shift."
 time.144.name:0 "Mysterious Singularity: §HElectromagnetic Storm§!"
 time.144.desc:0 "An electromagnetic storm hit our homeworld.\n\nElectromagnetic storms are not common. As far as our history is concerned, its last appearance was hundreds of years ago. However, once a storm forms, its blow to our civilization is catastrophic. Fortunately, after each electromagnetic storm ends, several pieces of spacetime will be in a relatively stable state for a long time because the storm will consume their energy and slow down the rate of high entropy.\n\nFor these new spacetimes approaching stability, we should choose appropriate utilization methods."
 time.144.a:0 "Transform them into permanent residences."
 time.144.b:0 "Only use them as public land."
 time.145.name:0 "Mysterious Singularity: §HVanguard Stronghold§!"
 time.145.desc:0 "Our explorers are closer to the core of the black hole.\n\nIt is said that soon, we will be able to touch the core of the mysterious singularity. But the closer to the center, the more chaotic spacetime becomes, and the long distance from the homeland makes supply and reinforcement very difficult.\n\nTherefore, they applied to build a vanguard stronghold at the forefront, store certain materials in it, and move in some residents to live and multiply, in order to explore the black hole more efficiently."
 time.145.a:0 "Approve, and learn their stronghold technology."
 time.145.b:0 "Approve, and propagate their pioneering spirit."
 time.146.name:0 "Mysterious Singularity: §HLaw Reversal§!"
 time.146.desc:0 "Some physical laws in the black hole suddenly differ greatly from the past.\n\nThis is a disaster we have never experienced. All changed fields have suffered devastating blows. Related production lines had to stop running, and corresponding scientific research directions were closed. But as a civilization living in a black hole, being accustomed to the variability of the black hole has long been ingrained in our blood.\n\nWe quickly adjusted our industrial structure and scientific research direction. Explorers also took this opportunity to investigate higher dimensions that they would not have had the chance to contact. We will never be defeated by the black hole."
 time.146.a:0 "Fully support the explorers' actions."
 time.146.b:0 "Prioritize stabilizing the homeland balance."
 time.147.name:0 "Mysterious Singularity: §HFear Spreading§!"
 time.147.desc:0 "Our explorers started a collective strike.\n\nAt first, one explorer refused to move forward, then a few, then a team, then a batch. Now, the vast majority of explorers have started to retreat. We don't know the reason for their strike, but perhaps it stems from their fear of the unknown at the black hole core. But soon, we found something wrong because the number of explorers retreating far exceeded the number of explorers we had sent out. There are also many unregistered populations among them, but they all insist that they are one of us.\n\nHow should we deal with such a strange thing?"
 time.147.a:0 "Allow people outside the registry to return to the empire."
 make_situation_pc_time_slow:0 "§RThis will slow down the situation progress for 5 years.§!"
 time.147.b:0 "Require them to continue exploring to prove loyalty."
 make_situation_pc_time_fast:0 "§GThis will speed up the situation progress for 5 years.§!"
 time.148.name:0 "Mysterious Singularity: §HOtherworldly Domain§!"
 time.148.desc:0 "Our explorers seem to have strayed into an otherworldly domain.\n\nNo channel to the black hole core can be found from any direction, as if the original area was replaced by the otherworld. Although there is no progress in the exploration of the mysterious singularity for the time being, our explorers still launched an investigation into the otherworld with great interest. According to reports, this world is full of substances opposite to the normal plane, and there are huge differences in physical properties. They call it the \"Inverse Plane\".\n\nJust as we were curious about the Inverse Plane, a group of explorers claimed to have found lost black hole residents in it, but their credibility cannot be ensured."
 make_situation_pc_time_stop:0 "§RThis will stop the situation progress for 5 years.§!"
 time.148.a:0 "They are also one of us."
 time.148.b:0 "What they say is completely untrustworthy."
 time.149.name:0 "Mysterious Singularity: §HDistant Cluster§!"
 time.149.desc:0 "The core spacetime of the black hole seems to connect to a distant cluster.\n\nOur explorers found that this cluster is filled with chaotic nanobots, and the nanite clouds intruding into our territory have brought great obstacles to our development and construction. At this time, the sound of distant gunfire reached the explorers' ears. They looked towards the hazy sky, and saw several gray dragons fighting fiercely with several gray warships.\n\nOur explorers found a hiding place in time to avoid being discovered, and embarked on the return journey safely after the battle ended. Before leaving, they can search for some wreckage of the battle for research."
 time.149.a:0 "Research the wreckage of the nanite dragon."
 time.149.b:0 "Research the wreckage of the nanite warship."
 
 time.151.name:0 "Mysterious Singularity: §HSpacetime Stream§!"
 time.151.desc:0 "We are only a stone's throw away from success, but the center of the black hole within reach is wrapped in a chaotic spacetime turbulence, which is much more dangerous than the outer gravitational vortex.\n\nIn order to reduce losses as much as possible, [Owner.GetRulerTitle] §Y[situation_pc_time_leader.GetName]§!, who is also the country's most elite explorer, decided to take a risk and enter the spacetime stream alone to find a path.\n\nWe don't know what awaits [situation_pc_time_leader.GetHerHim] ahead."
 time.151.a:0 "This is a necessary sacrifice."
 time.151.a.tooltip:0 "§R['concept_origin_time_chosen'] trait temporarily disabled§!"
 time.152.name:0 "Mysterious Singularity: §HLight Cone Dislocation§!"
 time.152.desc:0 "§Y[situation_pc_time_leader.GetName]§! found that [situation_pc_time_leader.GetHerHis] way of moving on the time axis is both chaotic and regular.\n\nUnlike the situation inside the horizon where there is no clear boundary between past, present, and future, the light cone formed by movement events in the stream will stably propagate in a parallel direction, rather than the normal vertical direction. This means that almost everything §Y[situation_pc_time_leader.GetName]§! does will never be fed back to [situation_pc_time_leader.GetHerselfHimself], and [situation_pc_time_leader.GetSheHe] can never predict what impact [situation_pc_time_leader.GetHerHis] actions will have on the outside world.\n\nThis is extremely dangerous. §Y[situation_pc_time_leader.GetName]§! may disrupt the causal chain of the entire universe in the blink of an eye, or may end [situation_pc_time_leader.GetHerHis] life prematurely due to a small move."
 time.152.a:0 "Believe in yourself."
 time.153.name:0 "Mysterious Singularity: §HInfinite Amplification§!"
 time.153.desc:0 "§Y[situation_pc_time_leader.GetName]§! found a relatively stable shelter in the spacetime stream, but soon, [situation_pc_time_leader.GetSheHe] noticed something strange.\n\nThis spacetime seems to be able to overlap different time nodes and infinitely amplify the tiny tremors caused by the same thing through an unknown effect. This strange phenomenon may help §Y[situation_pc_time_leader.GetName]§! improve control over [situation_pc_time_leader.GetHerHis] own abilities, and this space also seems to be able to connect with the outside world through anchoring, but its unique characteristics may be destroyed as a result."
 time.153.a:0 "[situation_pc_time_leader.GetName] should strive for perfection in what [situation_pc_time_leader.GetSheHe] is good at."
 time.153.a.tooltip:0 "§YThe primary class part of [situation_pc_time_leader.GetName]'s exclusive trait will be enhanced§!"
 time.153.b:0 "[situation_pc_time_leader.GetName] can fully master [situation_pc_time_leader.GetHerHis] abilities."
 time.153.b.tooltip:0 "§YThe other class parts of [situation_pc_time_leader.GetName]'s exclusive trait will be enhanced§!"
 time.153.c:0 "This spacetime will benefit our people."
 time.154.name:0 "Mysterious Singularity: §HInfinite Superposition§!"
 time.154.desc:0 "§Y[situation_pc_time_leader.GetName]§! found a relatively stable shelter in the spacetime stream, but soon, [situation_pc_time_leader.GetSheHe] noticed something strange.\n\nThis spacetime seems to be able to overlap different time nodes and infinitely superimpose the tiny tremors caused by the same thing through an unknown effect. §Y[situation_pc_time_leader.GetName]§! tried to connect this space with the outside world through anchoring, but discovered during the action that this might interfere with its unique characteristics."
 time.154.a:0 "Connect only partially, use it to create resources."
 time.154.b:0 "Connect only partially, use it to process materials."
 time.154.c:0 "Connect completely, we need more spacetime."
 time.155.name:0 "Mysterious Singularity: §HChain Reaction§!"
 time.155.desc:0 "After several turns, §Y[situation_pc_time_leader.GetName]§! finally discovered a junction of a large number of streams.\n\nAccording to precise calculations, if a certain amount of energy is applied to this junction point to increase the speed of the stream to a certain value, it may cause the density of the next junction point to tend to infinity and form a short-time singularity to tear the stream. This bold attempt does not require consuming too many resources, because we only need to push gently at the starting point, and the whole process will continue like a chain reaction, expanding constantly.\n\nHowever, this measure is too dangerous, its long-term consequences are hard to predict, and there is even a risk of triggering the collapse of the stream."
 time.155.a:0 "Use dark matter energy specifically to trigger resonance."
 time.155.a.tooltip:0 "§YThis makes it easier to form a singularity, but also more dangerous§!"
 time.155.b:0 "Cautiously use conventional resources to promote the process."
 time.155.b.tooltip:0 "§YThis may lead to different results, but is safer§!"
 time.155.c:0 "The risk is too great, abandon exploration, leave the stream."
 time.155.c.tooltip:0 "§YWe will try to bypass the spacetime stream from the outside§!"
 time.156.name:0 "Mysterious Singularity: §HButterfly Effect§!"
 time.156.desc:0 "After several turns, §Y[situation_pc_time_leader.GetName]§! finally discovered a junction of a large number of streams.\n\nAccording to precise calculations, if a certain amount of energy is applied to this junction point to increase the speed of the stream to a certain value, it may cause the overall stream to become more turbulent and form pores that can be traversed stably. This bold attempt does not require consuming too many resources, because we only need to push gently at the starting point, and the whole process will spread to the entire stream due to the butterfly effect.\n\nHowever, this measure is too dangerous, its long-term consequences are hard to predict, and there is even a risk of triggering the collapse of the stream."
 time.156.a:0 "Cautiously use conventional resources to promote the process."
 time.156.a.tooltip:0 "§YThis is likely to succeed, but there is also a risk of failure§!"
 time.156.b:0 "The risk is too great, abandon exploration, leave the stream."
 time.156.b.tooltip:0 "§YWe will try to bypass the spacetime stream from the outside§!"
 time.157.name:0 "Mysterious Singularity: §HWhat You See Is Void§!"
 time.157.desc:0 "After several flow cycles, a singularity appeared at a certain junction, and the surrounding stream was deformed due to distortion. However, §Y[situation_pc_time_leader.GetName]§! did not wait for the stream to tear, but was trapped by a powerful gravitational field.\n\nBut the singularity did not crush [situation_pc_time_leader.GetHerHim], but turned into a mirror. In the mirror there is §Y[situation_pc_time_leader.GetName]§!, and a mirror. In this mirror there is also a §Y[situation_pc_time_leader.GetName]§! and another mirror. In countless mirrors, countless §Y[situation_pc_time_leader.GetName]§! s look at the mirror, and also look at countless selves.\n\nWhen §Y[situation_pc_time_leader.GetName]§! realized this, the mirror twisted into an indescribable object, and §Y[situation_pc_time_leader.GetName]§! in the mirror also deformed into an indistinguishable shadow.\nThe mirror broke, §Y[situation_pc_time_leader.GetName]§! didn't even realize when the mirror broke, as if it didn't exist originally.\nThe spacetime stream disappeared, §Y[situation_pc_time_leader.GetName]§! also failed to detect the moment of its disappearance, maybe [situation_pc_time_leader.GetSheHe] never entered."
 time.157.a:0 "What you see is void, only time is eternal."
 time.157.a.tooltip:0 "§YThe state rulership part of [situation_pc_time_leader.GetName]'s exclusive trait will be enhanced§!"
 time.157.b:0 "What you see is void, existence is meaning."
 time.157.b.tooltip:0 "§YThe resource output part of [situation_pc_time_leader.GetName]'s exclusive trait will be enhanced§!"
 time.157.c:0 "What you see is void, reality is not true either."
 time.158.name:0 "Mysterious Singularity: §HSeeing Is Believing§!"
 time.158.desc:0 "After several flow cycles, countless tiny pores appeared between the streams, and the nearest one wrapped §Y[situation_pc_time_leader.GetName]§! in it instantly.\n\nOn the other side of the spacetime turbulence, there was actually another black hole. §Y[situation_pc_time_leader.GetName]§! even suspected that [situation_pc_time_leader.GetHeShe] had returned to the homeworld. However, this world was empty, with absolutely no sign of civilization, which convinced §Y[situation_pc_time_leader.GetName]§! that this is our other side. Relying on previous exploration experience and records, §Y[situation_pc_time_leader.GetName]§! reached the edge of the black hole's event horizon, but the starry sky did not exist at all, and outside the horizon there was only pitch blackness.\n\nLater, §Y[situation_pc_time_leader.GetName]§! returned to the stream, crossed other pores, and successfully found a path to the center of the black hole, but our other side always troubled [situation_pc_time_leader.GetHerHim].\nMaybe this is before the birth of our civilization, and also the beginning of the birth of the universe.\nMaybe this is after the demise of our civilization, and also the end of the world's decline."
 time.158.a:0 "Seeing is believing, the beginning of the universe is worth studying."
 time.158.b:0 "Seeing is believing, the end of the world should be pondered deeply."
 time.158.c:0 "Seeing is believing, the cycle of fate is set."
 time.159.name:0 "Mysterious Singularity: §HFruitless End§!"
 time.159.desc_1:0 "We haven't received any message from §Y[situation_pc_time_leader.GetName]§! for a long time.\n\nAccording to the observations of stream researchers, we found that §Y[situation_pc_time_leader.GetName]§! seemed to be trapped in an unbreakable cycle. This outcome seemed to have been determined as early as the time of entry. Whether past, present, or future, [situation_pc_time_leader.GetSheHe] died long ago."
 time.159.desc_2:0 "The most elite explorer is gone, although not due to the stream.\n\nAnalysis of the spacetime stream shows that the stream has become increasingly chaotic over the past period of time. Entering the stream again now has almost no chance of survival. We decided to give up continued exploration and look for ways to bypass the stream instead."
 time.159.a:0 "What's done is done, can only accept."
 time.159.b:0 "We will always find a way."
 time.159.tooltip:0 "§YWe will try to bypass the spacetime stream from the outside§!"
 
 time.160.name:0 "Mysterious Singularity: §HHeart of the Black Hole§!"
 time.160.desc:0 "After going through untold hardships, our explorers finally reached the destination of the journey.\n\nThe center of the black hole is just an ordinary singularity.\nA singularity.\nAn ordinary singularity.\nA singularity that fully complies with black hole laws.\nOur explorers are extremely disappointed, and so are we. We thought that the reason why our black hole is different from other black holes lies in the central singularity, but facts proved that there is no reason. Even so, life must go on. Our explorers will still look for phenomena never seen before in countless spacetimes and investigate areas never set foot in.\n\nThis is our mission, this is our fate."
 time.160.a.materialist:0 "Delving into the unknown is our destiny."
 time.160.a.spiritualist:0 "Perceiving the soul is our destiny."
 time.160.a.militarist:0 "Advocating force is our destiny."
 time.160.a.pacifist:0 "Enjoying life is our destiny."
 time.160.a.xenophile:0 "Pursuing hope is our destiny."
 time.160.a.xenophobe:0 "Defending territory is our destiny."
 time.160.a.egalitarian:0 "Yearning for happiness is our destiny."
 time.160.a.authoritarian:0 "Controlling the sea of stars is our destiny."
 time.160.b:0 "Exploring spacetime is our destiny."
 time.160.c:0 "Civilization progress is our destiny."
 time.160.d:0 "National development is our destiny."
 time.161.name:0 "Mysterious Singularity: §HHorizon Signal§!"
 time.161.desc_1:0 "Just after our life returned to the right track, several star systems sent us mysterious signals. According to observations, the sources of those signals seem to be black hole systems.\n\nSome speculate that the senders are black hole residents like us;\nSome suspect that the signal source is warning of danger;\nOthers believe that this is a signal from the event horizon, inviting us to the black hole."
 time.161.desc_2:0 "Just after our life returned to the right track, our homeworld sent us a mysterious signal. After analysis, the content of the signal seems to be teaching some special technologies.\n\nSome speculate that the sender is a resident of a deeper singularity;\nSome suspect that the signal source is warning of danger;\nOthers believe that this is a signal from The Worm-in-Waiting, inviting us to step into the unknown."
 time.161.a:0 "What does this mean?"
 gain_horizonsignal_spawn_system_point:0 "§YWe learned the coordinates of several Horizon Signals.§!"
 time.161.b:0 "What does this mean?"
 
 time.170.name:0 "Mysterious Singularity: §HDimensional Hub§!"
 time.170.desc:0 "We thought the center of the black hole was just an ordinary singularity, and believed it for a time.\n\nBut with the help of §HThe Worm-in-Waiting§!, we finally removed the camouflage of the singularity and discovered the secret under the trap-this is a hub connecting other planes. We don't know how many such hubs there are in the universe, nor if anyone has used this hub before us, nor the reason for the formation of the plane hub, but we are sure that we are going further and further on the road to truth.\n\nWe are glad that the homeworld is as extraordinary as we are."
 time.170.a:0 "Connecting dimensions, also connecting truth."
 unlock_tradition_origin_time:0 "Unlock ['concept_tradition_origin_time'] Tradition Tree"
 unlock_ap_origin_time:0 "Unlock ['concept_ap_origin_time'] Ascension Perk"
 
 PC_TIME_END_CHAIN_title:0 "Horizon Signal"
 PC_TIME_END_CHAIN_desc:0 "We received some mysterious signals; they all seem to come from black holes."
 horizonsignal_spawn_system_point:0 "Horizon Coordinates"
 horizonsignal_spawn_system_point_desc:0 "This is the signal source coordinate of one of the Horizon Signals."
 
 TIME_BLACK_HOLE_CHAIN_title:0 "The Worm-in-Waiting: Communication"
 TIME_BLACK_HOLE_CHAIN_desc:0 "Mysteries appeared one after another in the black hole, as if deliberately mocking our ignorance. And the bursts of murmurs coming from the event horizon seem to be inextricably linked to our homeworld.\n\nWe will soon know where we come from and where we are going."
 
 time.201.name:0 "Horizon Signal: §HInseparable Shadow§!"
 time.201.desc:0 "Again, again...\n\nAfter many days, when our science ship entered another black hole system, we received that string of mysterious Horizon Signals again. It's like some mysterious existence has been following us, can't wait to claim it as its own as soon as it encounters a black hole, and then mock our ignorance wantonly. However, this signal is slightly different from the previous ones; we may need to re-decipher it.\n\nIt is certain that this is definitely not a prank, at least, not an ordinary prank."
 time.201.a:0 "Analyze the Horizon Signal again."
 time.201.b:0 "Forget that damn signal!"
 time.202.name:0 "Horizon Signal: §HDisordered§!"
 time.202.desc:0 "The signal analysis this time was extremely difficult, and the analysis results were also very confusing.\n\nThe signal is full of irregular sentences. We simply cannot understand what information the other party wants to convey. It seems that the other party intended to say something, but regretted it halfway and scrambled the signal."
 time.202.a:0 "A prank from the black hole."
 time.203.name:0 "Horizon Signal: §HLive or Die§!"
 time.203.desc:0 "The signal analysis this time was extremely difficult, and the analysis results were also very shocking.\n\nWe don't know what the other party's real purpose is, but this time, they set their sights on our [Root.GetRulerTitle]-§Y[time_black_hole_leader.GetName]§!. Even though our race possesses the ability to survive in black holes, a series of previous events made us understand that most black holes in the universe are greedy gluttons; our homeworld is just an exception. Therefore, if we send the [Root.GetRulerTitle] into the black hole, [time_black_hole_leader.GetSheHe] will not be able to guide us in the direction forward, and our people are extremely likely to fall into panic.\n\nOf course, we can also refuse, but who knows what else will happen?"
 time.203.b.tooltip:0 "§H[time_black_hole_leader.GetName]§! will arrive at the exit point within §Y30 days§!."
 time.203.a:0 "I choose survival."
 time.203.b:0 "I choose death."
 # Ending 1
 time.204.name:0 "Horizon Signal: §HBorn Towards Death§!"
 time.204.desc:0 "This is really unbelievable!\n\nThe moment the ship piloted by [Root.GetRulerTitle] §Y[time_black_hole_leader.GetName]§! entered the event horizon, it actually flew out from the center of our homeworld! After communication, we can confirm that the person in the ship is [Root.GetRulerTitle] §Y[time_black_hole_leader.GetName]§! [time_black_hole_leader.GetHimHer]self. According to §Y[time_black_hole_leader.GetName]§!, the moment [time_black_hole_leader.GetSheHe] entered the event horizon, [time_black_hole_leader.GetSheHe] only felt like returning to the embrace of the homeworld, and then appeared in front of the people of the homeworld.\n\nAfter welcoming §Y[time_black_hole_leader.GetName]§! back to the central government, we quickly conducted a physical examination on [time_black_hole_leader.GetHimHer] and found nothing unusual with the [Root.GetRulerTitle]. However, researchers found that the spacetime around §Y[time_black_hole_leader.GetName]§! seems to have become more stable, and [time_black_hole_leader.GetSheHe] can command spacetime to a certain extent."
 time.204.a:0 "Cheer for [time_black_hole_leader.GetName]'s escape from death!"
 # Ending 2
 time.205.name:0 "Horizon Signal: §HCraven§!"
 time.205.desc:0 "This is really unbelievable!\n\nOvernight, [Root.GetRulerTitle] §Y[time_black_hole_leader.GetName]§! disappeared. No matter which corner of the homeworld, we couldn't find [time_black_hole_leader.GetHerHis] trace. Just as we were anxious about the disappearance of the [Root.GetRulerTitle], we received the Horizon Signal again...\n\nAccording to analysis, there is also a sound code in this signal, which sounds like the voice of [Root.GetRulerTitle] §Y[time_black_hole_leader.GetName]§!. [time_black_hole_leader.GetSheHe] seems to be wailing, as if suffering something extremely painful. But soon, the wailing faded away, replaced by the laughter of some creature. \"Why refuse to accept my embrace?\" The creature seemed to say, \"Craven ones cannot survive in the black hole.\"\n\nThen, the signal was interrupted."
 time.205.a:0 "This feeling is simply worse than death..."
 
 time.206.name:0 "Whispers of the Black Hole: §HFollowers and Skeptics§!"
 time.206.desc.life:0 "The bizarre death of [Owner.GetRulerTitle] §Y[time_black_hole_leader.GetName]§! shocked the whole country. Skeptics dissatisfied with the old [Owner.GetRulerTitle] believe that [time_black_hole_leader.GetHerHis] cowardice is the cause of this tragedy.\n\nHowever, there is also a group of people following §Y[time_black_hole_leader.GetName]§! who claim that this accident is a conspiracy, and they will seek an explanation for the deceased [Owner.GetRulerTitle].\n\nInside the horizon is as peaceful as ever, but in the intricate spacetime, doubts and uneasiness are spreading gradually."
 time.206.desc.death:0 "The glorious deeds of [Owner.GetRulerTitle] §Y[time_black_hole_leader.GetName]§! have spread throughout the country, and [time_black_hole_leader.GetSheHe] has gained a group of staunch followers because of this, but the [Owner.GetRulerTitle] has not yet expressed a position.\n\nHowever, not everyone is convinced of this deed. They assume this is just a hype planned by §Y[time_black_hole_leader.GetName]§! for [time_black_hole_leader.GetHimHer]self, and turn doubt into hostility towards the [Owner.GetRulerTitle].\n\nInside the horizon is as peaceful as ever, but in the intricate spacetime, doubts and uneasiness are spreading gradually."
 time.206.a:0 "This is the calm before the storm."
 
 time.207.name:0 "Whispers of the Black Hole: §HAdmirers and Researchers§!"
 time.207.desc.life:0 "In the blink of an eye, several months have passed. The bizarre death of [Owner.GetRulerTitle] §Y[time_black_hole_leader.GetName]§! still shocks the people nationwide. A group of famous researchers believe that the death of §Y[time_black_hole_leader.GetName]§! itself is just a regret, but the meaning it contains is worth pondering.\n\nHowever, more people prefer to regard this accident as divine punishment from heaven. Only by maintaining reverence for the black hole can the tragedy be prevented from repeating.\n\nNow, two new factions have appeared inside the horizon. Although not powerful, their potential cannot be underestimated."
 time.207.desc.death:0 "In the blink of an eye, several months have passed. The glorious deeds of [Owner.GetRulerTitle] §Y[time_black_hole_leader.GetName]§! are still spreading nationwide. A group of fanatical admirers regard §Y[time_black_hole_leader.GetName]§! as the supreme god and spare no effort to preach their doctrines.\n\nHowever, there are also calm people who believe that this is by no means a miracle. What we should do is research the cause of the miracle and analyze the essence behind the phenomenon.\n\nNow, two new factions have appeared inside the horizon. Although not powerful, their potential cannot be underestimated."
 time.207.a:0 "Something seems to be fueling the flames behind the scenes."
 
 time.208.name:0 "Whispers of the Black Hole: §HRadicals and Conservatives§!"
 time.208.desc.life:0 "Time flies, and the discussion on the bizarre death of the [Owner.GetRulerTitle] has intensified instead. §Y[time_black_hole_leader.GetName]§! being swallowed by the black hole made many people's thoughts conservative. They cherish life more and are unwilling to take risks.\n\nOn the contrary, another group of people feel that the conservatives are too cowardly. They firmly believe that only through radical and brave ways can great achievements be made.\n\nSix forces argue endlessly with each other. Inside the horizon has long become chaotic."
 time.208.desc.death:0 "Time flies, and the praise for the glorious deeds of the [Owner.GetRulerTitle] has intensified instead. §Y[time_black_hole_leader.GetName]§! who withstood the test of the black hole triggered a trend of admiring the strong. Many people began to pursue determining everything by radical means.\n\nHowever, ordinary people bullied by radicals expressed serious dissatisfaction with this. They hope to determine their own destiny through a more conservative and peaceful way.\n\nSix forces argue endlessly with each other. Inside the horizon has long become chaotic."
 time.208.a:0 "Do these arguments really make sense?"
 
 time.209.name:0 "Whispers of the Black Hole: §HPurists and Mixers§!"
 time.209.desc.life:0 "The situation in the black hole is no longer completely related to the death of the [Owner.GetRulerTitle]. Our people spontaneously regard the cowardice of §Y[time_black_hole_leader.GetName]§! as a stain we cannot erase, and compare themselves with other species, hoping that diverse ways can avoid national defects.\n\nHowever, a group of patriots strongly criticized this behavior. They believe that other species polluted us, and only by purifying the nation can this stain be erased.\n\nThe dispute inside the horizon has reached a new climax."
 time.209.desc.death:0 "The situation in the black hole is no longer completely related to the deeds of the [Owner.GetRulerTitle]. Our people spontaneously regard the born-towards-death of §Y[time_black_hole_leader.GetName]§! as proof of the nobility of the entire nation, and therefore extremely reject other species to avoid polluting the purity of the nation.\n\nOn the contrary, some progressives believe that other species can bring us more possibilities, and our nation can have diversified development, which is also a manifestation of nobility.\n\nThe dispute inside the horizon has reached a new climax."
 time.209.a:0 "Nothing can stop the wheels of history."
 
