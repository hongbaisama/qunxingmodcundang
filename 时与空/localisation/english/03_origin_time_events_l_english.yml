 time.210.name:0 "Followers: §HFinal Decision§!"
 time.210.desc:0 "Finally, the endless disputes ushered in a brief pause.\n\nThe followers occupy an overwhelming advantage in the government and among the people. The skeptics' arguments collapsed on their own. The outcome of this battle for rights has been decided.\n\nJust waiting for the right time, the followers will reorganize the government and guide our future in their way."
 time.210.a:0 "Salute to the greatest empire!"
 time.211.name:0 "Followers: §HParade§!"
 time.211.desc.life:0 "Followers of §Y[time_black_hole_leader.GetName]§! have always planned a parade, hoping the authorities would reveal the truth of the conspiracy.\n\nToday, their plan succeeded. This massive parade unfolded in our capital and unexpectedly gained support from many citizens. Although we all know there is no conspiracy, the fanatical followers don't believe any of our explanations."
 time.211.desc.death:0 "Followers of §Y[time_black_hole_leader.GetName]§! have always planned a parade, hoping the [Owner.GetRulerTitle]'s power would be further enhanced.\n\nToday, their plan succeeded. This massive parade unfolded in our capital and unexpectedly gained support from many citizens. Many participants expressed that scattered power is far less responsive than centralized power, especially since we have such a wise ruler."
 time.211.a:0 "Let them be."
 time.211.b:0 "Stop this parade immediately!"
 time.212.name:0 "Followers: §HSpeech§!"
 time.212.desc.life:0 "Today, followers of §Y[time_black_hole_leader.GetName]§! held a large speech in a crowded area.\n\nThe theme of this speech doesn't matter at all because it is full of fictitious conspiracy theories, but both speakers and listeners are convinced of it. They have fallen into an information cocoon."
 time.212.desc.death:0 "Today, followers of §Y[time_black_hole_leader.GetName]§! held a large speech in a crowded area.\n\nThis speech revolved around the various achievements of the [Owner.GetRulerTitle]. Although there were many significant exaggerations, neither speakers nor listeners cared about these small issues."
 time.212.a:0 "This is their spontaneous behavior and should not be interfered with."
 time.212.b:0 "The content of the speech is unreasonable; there is no need to continue."
 time.213.name:0 "Followers: §HCoup§!"
 time.213.desc.life:0 "From some unknown time, followers of §Y[time_black_hole_leader.GetName]§! planted many insiders in the government, and they erupted centrally today.\n\nThey manipulated a secret meeting with few participants and forcefully demanded that a relative of §Y[time_black_hole_leader.GetName]§! serve as [Owner.GetRulerTitle]. Fortunately, we controlled the situation in time, and the laws they signed have no validity."
 time.213.desc.death:0 "From some unknown time, followers of §Y[time_black_hole_leader.GetName]§! planted many insiders in the government, and they erupted centrally today.\n\nThey manipulated a secret meeting with few participants and forcefully demanded that §Y[time_black_hole_leader.GetName]§! be our eternal [Owner.GetRulerTitle]. Fortunately, we controlled the situation in time, and the laws they signed have no validity."
 time.213.a:0 "Detain the coup plotters, prioritize appeasing the people."
 time.213.b:0 "Execute the coup plotters; must kill the chicken to scare the monkey!"
 time.214.name:0 "Followers: §HRiot§!"
 time.214.desc.life:0 "A group of lawless terrorists suddenly launched a riot. Before being controlled by the military police, they had caused considerable damage.\n\nVerified, they are all extreme followers of §Y[time_black_hole_leader.GetName]§!. The purpose of this riot is unknown, but we guess it is revenge for the so-called \"conspiracy\"."
 time.214.desc.death:0 "A group of lawless terrorists suddenly launched a riot. Before being controlled by the military police, they had caused considerable damage.\n\nVerified, they are all extreme followers of §Y[time_black_hole_leader.GetName]§!. The purpose of this riot is unknown, but after §Y[time_black_hole_leader.GetName]§! came forward to mediate, the terrorists stopped resistance."
 time.214.a:0 "A terrible disaster."
 time.214.b:0 "Quickly make up for losses, restore daily order."
 time.215.name:0 "Followers: §HRumor§!"
 time.215.desc.life:0 "Recently, a rumor about the death accident of §Y[time_black_hole_leader.GetName]§! spread in the community.\n\nThe final investigation found that the source of the rumor was the followers of §Y[time_black_hole_leader.GetName]§!, which was not unexpected. Although we arrested the author, it still takes some effort to deal with the overwhelming rumors."
