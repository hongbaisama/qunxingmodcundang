 time.270.name:0 "Purists: §HFinal Decision§!"
 time.270.desc:0 "Finally, the endless disputes ushered in a brief pause.\n\nThe purists occupy an overwhelming advantage in the government and among the people. The mixers' arguments collapsed on their own. The outcome of this battle for rights has been decided.\n\nJust waiting for the right time, the purists will reorganize the government and guide our future in their way."
 time.270.a:0 "Embracing isolation is embracing fate!"
 time.271.name:0 "Purists: §HParade§!"
 time.271.desc:0 "Purists inside the horizon have always planned a parade, hoping the authorities would immediately expel all alien xenos.\n\nToday, their plan succeeded. This massive parade unfolded in our capital and unexpectedly gained support from many citizens. Many participants expressed that we are a noble nation and should not be tainted by inferior xenos."
 time.272.name:0 "Purists: §HSpeech§!"
 time.272.desc:0 "Today, purists inside the horizon held a large speech in a crowded area.\n\nThe theme of this speech doesn't matter at all because it is full of abuse and slander against alien xenos, but both speakers and listeners are convinced of it. They have fallen into an information cocoon."
 time.273.name:0 "Purists: §HCoup§!"
 time.273.desc:0 "From some unknown time, purists inside the horizon planted many insiders in the government, and they erupted centrally today.\n\nThey manipulated a secret meeting with few participants and forcefully demanded to cut off all communication with alien xenos. Fortunately, we controlled the situation in time, and the laws they signed have no validity."
 time.274.name:0 "Purists: §HRiot§!"
 time.274.desc:0 "A group of lawless terrorists suddenly launched a riot. Before being controlled by the military police, they had caused considerable damage.\n\nVerified, they are all extreme purists inside the horizon. The purpose of this riot is unknown, but we guess it is concentrated persecution against alien xenos."
 time.275.name:0 "Purists: §HRumor§!"
 time.275.desc:0 "Recently, a rumor that alien xenos attempted to subvert the regime spread in the community.\n\nThe final investigation found that the source of the rumor was the purists inside the horizon, which was not unexpected. Although we arrested the author, it still takes some effort to deal with the overwhelming rumors."
 
 time.280.name:0 "Mixers: §HFinal Decision§!"
 time.280.desc:0 "Finally, the endless disputes ushered in a brief pause.\n\nThe mixers occupy an overwhelming advantage in the government and among the people. The purists' arguments collapsed on their own. The outcome of this battle for rights has been decided.\n\nJust waiting for the right time, the mixers will reorganize the government and guide our future in their way."
 time.280.a:0 "Embracing diversity is embracing hope!"
 time.281.name:0 "Mixers: §HParade§!"
 time.281.desc:0 "Mixers inside the horizon have always planned a parade, hoping the authorities would deepen friendly exchanges between the nation and foreign races.\n\nToday, their plan succeeded. This massive parade unfolded in our capital and unexpectedly gained support from many citizens. Many participants expressed that our nation is worthy of pride, but wisdom from aliens is also indispensable."
 time.282.name:0 "Mixers: §HSpeech§!"
 time.282.desc:0 "Today, mixers inside the horizon held a large speech in a crowded area.\n\nThis speech revolved around ethnic diversity. Although there were many empty slogans and unrealistic plans, neither speakers nor listeners cared about these small issues."
 time.283.name:0 "Mixers: §HCoup§!"
 time.283.desc:0 "From some unknown time, mixers inside the horizon planted many insiders in the government, and they erupted centrally today.\n\nThey manipulated a secret meeting with few participants and forcefully demanded that foreign races occupy a certain quota of important government positions. Fortunately, we controlled the situation in time, and the laws they signed have no validity."
 time.284.name:0 "Mixers: §HRiot§!"
 time.284.desc:0 "A group of lawless terrorists suddenly launched a riot. Before being controlled by the military police, they had caused considerable damage.\n\nVerified, they are all extreme mixers inside the horizon. The purpose of this riot is unknown, but we guess it is a counterattack against extreme nationalists."
 time.285.name:0 "Mixers: §HRumor§!"
 time.285.desc:0 "Recently, a rumor that intermarriage with foreign races can improve the IQ of offspring spread in the community.\n\nThe final investigation found that the source of the rumor was the mixers inside the horizon, which was not unexpected. Although we arrested the author, it still takes some effort to deal with the overwhelming rumors."
 
 time.292.name:0 "Whispers of the Black Hole: §HThe Worm's Apology§!"
 time.292.desc:0 "Just before the situation got out of control, we received the Horizon Signal again. However, it came from our homeworld...\n\n\"I am sorry, poor §Y[Owner.GetSpeciesName]§! s.\" The creature said right in the center of our homeworld, \"I thought change meant opportunity, just like your past or future, but I didn't expect to add confusion to you, and instead made you fall into a cage of self-contradiction. Maybe I went too far, which is contrary to my original intention.\" The creature paused and continued to whisper: \"Now I think the choice should be given to you.\"\n\nThat mysterious signal is like a mother's touch. Even if we can't fully understand it, we can still feel the warmth in it. The moment the signal ended, the fanatical people suddenly stopped what they were doing, as if everything in the past was just a dream."
 time.292.a:0 "Not due to The Worm-in-Waiting's interference; this is the tomorrow we chose ourselves."
 time.292.b:0 "Although the inner belief will not change, it is time to end this farce."
 time.292.c:0 "We have already made the best decision; there is no need to change it."
 time.293.name:0 "Whispers of the Black Hole: §HIdeal Home§!"
 time.293.desc:0 "These days, our homeworld has been communicating with us-to be precise, that mysterious creature called §HThe Worm-in-Waiting§! is communicating with us through our homeworld.\n\nIt hopes that we can accept Its existence, although various previous events make it difficult for us to relax our guard against It. Perhaps to show sufficient goodwill, It made the spacetime flow inside the horizon more stable and orderly, and the distortion effect of the gravitational trap was also greatly weakened. The central singularity we dreamed of also gradually unveiled its veil.\n\n§H\"This is your ideal home.\"§! That creature seemed to mutter to itself, §H\"Maybe not now, but it was in the past, and it will be in the future.\"§!"
 time.293.a:0 "So this is the real core of the black hole."
 time.294.name:0 "Whispers of the Black Hole: §HAbrupt Stop§!"
 time.294.desc:0 "As we lost control of §Y[Target.GetName]§!, our communication with §HThe Worm-in-Waiting§! also came to an abrupt end."
 time.294.a:0 "What did She want to tell us?"
 
 time.100.name:0 "The Worm-in-Waiting: §BMystery of the Singularity§!"
 time.100.desc.1:0 "We were born in this mysterious black hole; there must be unknown spacetime mysteries hidden in its depths.\n\nTo this end, we specially established a research team targeting the deepest part of the homeworld, analyzing the data emitted from it day and night. By comparing with data from other black holes in the universe, we found that the center of the black hole we are in is a singularity formed due to spacetime distortion. Moreover, its formation method is not natural, as if someone intentionally distorted spacetime to form this singularity.\n\nWhat is jaw-dropping is that just as we obtained this scientific research result, a familiar yet strange signal came from the singularity: a poem we had heard before, repeating the phrases §HGRAVITY IS DESIRE§! and §HTIME IS SIGHT§!...\n\nIt's §HThe Worm-in-Waiting§!!\n\nEverything is revealed. We thought that before we received the Horizon Signal for the first time, §HThe Worm-in-Waiting§! had only been watching us silently, but in fact, It had interfered with us long ago. To be precise, our entire species was created by §HThe Worm-in-Waiting§! personally. At this moment, we also suddenly understood the signals §HThe Worm-in-Waiting§! once sent to us-that was its hint for us to discover the truth!\n\nWe are very fortunate that when we received the Horizon Signal, we did not ignore it, and finally when calling §HThe Worm-in-Waiting§!, we chose to accept Its love. However, perhaps, it is precisely because we were created by §HThe Worm-in-Waiting§! that we chose to do so."
 time.100.desc.2:0 "We were born in this mysterious black hole; there must be unknown spacetime mysteries hidden in its depths.\n\nTo this end, §Y[origin_time_ruler.GetName]§! led a research team targeting the deepest part of the homeworld, analyzing the data emitted from it day and night. By comparing with data from other black holes in the universe, we found that the center of the black hole we are in is a singularity formed due to spacetime distortion. Moreover, its formation method is not natural, as if someone intentionally distorted spacetime to form this singularity.\n\nWhat is jaw-dropping is that just as we obtained this scientific research result, a familiar yet strange signal came from the singularity: a poem we had heard before, repeating the phrases §HGRAVITY IS DESIRE§! and §HTIME IS SIGHT§!...\n\nIt's §HThe Worm-in-Waiting§!!\n\nEverything is revealed. We thought that before we received the Horizon Signal for the first time, §HThe Worm-in-Waiting§! had only been watching us silently, but in fact, It had interfered with us long ago. To be precise, our entire species was created by §HThe Worm-in-Waiting§! personally. At this moment, we also suddenly understood the signals §HThe Worm-in-Waiting§! once sent to us-that was its hint for us to discover the truth!\n\nWe are very fortunate that when we received the Horizon Signal, we did not ignore it; when §Y[origin_time_ruler.GetName]§! entered the black hole, the desire for knowledge overcame the fear of death; finally when calling §HThe Worm-in-Waiting§!, we chose to accept Its love. However, perhaps, it is precisely because we were created by §HThe Worm-in-Waiting§! that we chose to do so."
 time.100.a:0 "§MWHAT WAS WILL BE WHAT WILL BE WAS!§!"
 time.100.a.tooltip:0 "§Y[origin_time_ruler.GetName] comprehended the essence of spacetime§!"
 time.200.name:0 "The Worm-in-Waiting: §MDescend§!"
 time.200.desc:0 "The Worm-in-Waiting descended on our plane again and spared no effort to protect us."
 time.200.a:0 "She loves us forever, and we love Her forever."
 
