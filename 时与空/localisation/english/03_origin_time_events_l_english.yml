 time.110.name:0 "Mysterious Singularity: §HInitial Singularity Exploration§!"
 time.110.desc:0 "As we step into space, the mysterious homeworld singularity also deeply attracts our attention.\n\nWe plan to use the skills of surviving in the black hole to discover our history from the unpredictable spacetime and find our direction.\n\nThe explorers are ready, but we'd better choose a destination for the journey."
 time.110.a:0 "$approach_pc_time_encourage$."
 time.110.b:0 "$approach_pc_time_default$."
 time.110.c:0 "$approach_pc_time_discourage$."
 
