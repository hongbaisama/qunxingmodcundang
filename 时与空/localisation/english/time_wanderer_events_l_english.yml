l_english:
 time_wanderer.3.name:0 "Wandering Singularity: §HWandering Ghost§!"
 time_wanderer.3.desc:0 "A strong gravitational anomaly swept through §Y[Root.GetName]§!. People's lives and work have been seriously affected. The culprit of all this may be that mysterious Wandering Singularity."
 time_wanderer.3.a:0 "Like an ominous ghost."
 
 time_wanderer.5.name:0 "Wandering Singularity: §HWeird Readings§!"
 time_wanderer.5.desc:0 "When our ship entered the §Y[From.GetName]§! system, the sensors on the ship gave strange readings.\n\nComputer analysis shows that there is a weird gravitational field anomaly in this system, as if an invisible singularity is wandering everywhere in the system."
 time_wanderer.5.a:0 "Truly an interesting phenomenon."
 
 time_wanderer.6.name:0 "Wandering Singularity: §HUninvited Guest§!"
 time_wanderer.6.desc_1:0 "Sensors from the §Y[From.GetName]§! system indicate that a weird object with gravitational field anomalies around it has invaded our territory.\n\nAlthough the sentinels of the system immediately entered a state of alert and tried to see the object clearly, they could not observe its entity, as if it were an invisible singularity."
 time_wanderer.6.desc_2:0 "Sensors from the §Y[From.GetName]§! system indicate that a weird object with gravitational field anomalies around it has invaded our territory.\n\nBased on previous experience, we believe that the object is the wandering singularity, but we are not yet clear what harm it will bring."
 time_wanderer.6.a:0 "Truly weird."
 time_wanderer.6.b:0 "Continue tracking this singularity."
 time_wanderer.6.c:0 "It seems not to pose a threat to us, no need to report in the future."
 
 time_wanderer.7.name:0 "Wandering Singularity: §HConnected to Death§!"
 time_wanderer.7.desc:0 "An urgent report was submitted to the high-level government.\n\n§Y[time_wanderer_planet.GetName]§! turned into a Black Hole in an instant, and a projection suspected to be a Nightmare of the Plane appeared on it. Our Science Officer is deeply puzzled by this, but what is certain is that this is inseparable from that wandering singularity.\n\nIf this time, this planet was swallowed, then next time, where will be connected to death?"
 time_wanderer.7.a:0 "I have a bad premonition."
 time_wanderer.7.b:0 "This phenomenon has long been commonplace, no need to report in the future."
 
 time_wanderer.10.name:0 "Wandering Singularity: §HHorizon Signal§!"
 time_wanderer.10.desc_1:0 "Sensors from the §Y[From.GetName]§! system indicate that a weird object with gravitational field anomalies around it has invaded our territory.\n\nAlthough the sentinels of the system immediately entered a state of alert and tried to see the object clearly, they could not observe its entity, as if it were an invisible singularity.\n\nJust when everyone was puzzled, the object sent us a signal, and the pattern of the signal seemed very close to the signal of The Worm-in-Waiting at the beginning."
 time_wanderer.10.desc_2:0 "Sensors from the §Y[From.GetName]§! system indicate that a weird object with gravitational field anomalies around it has invaded our territory.\n\nBased on previous experience, we believe that the object is the wandering singularity, but this time, it sent us a signal, and the pattern of the signal seemed very close to the signal of The Worm-in-Waiting at the beginning."
 time_wanderer.10.a:0 "Analyze Horizon Signal."
 time_wanderer.10.a.tooltip:0 "§YAttempt first contact with the Wandering Singularity.§!"
 time_wanderer.10.b:0 "This is a dangerous guy, block the signal!"
 
 fcsum_time_wanderer_1:0 "We found that the signal sent by the Wandering Singularity is a reverse signal."
 fcsum_time_wanderer_2:0 "The signal of the Wandering Singularity is both weird and mysterious."
 fcsum_time_wanderer_3:0 "The Dimension Traveler discovered hidden coordinates."
 fcsum_time_wanderer_4:0 "The Dimension Traveler danced with death, but did not solve the mystery of the Wandering Singularity."
 fcsum_time_wanderer_5:0 "The Kiss of Death almost swallowed the Dimension Traveler, and we still haven't solved the mystery of the Wandering Singularity."
 fcsum_time_wanderer_6:0 "The Wandering Singularity returned to dead silence, no amount of contact is futile."
 
 time_wanderer.11.name:0 "Wandering Singularity: §HReverse Signal§!"
 time_wanderer.11.desc:0 "After careful comparison by the translation team, we found that the signal sent by the Wandering Singularity is also a reverse signal, that is, the signal type sent to us by the Dimension Traveler in the White Hole.\n\nWe quickly contacted the Dimension Traveler, but the Dimension Traveler herself didn't know why the Wandering Singularity would use the signal she once used. Perhaps there is some hidden connection between the two, or maybe it is just a wonderful coincidence, but the Dimension Traveler has joined the translation team, ready to find out the truth with us."
 time_wanderer.11.a:0 "Truly strange."
 
 time_wanderer.12.name:0 "Wandering Singularity: §HFrom the Abyss§!"
 time_wanderer.12.desc:0 "Even with the help of the Dimension Traveler, the first contact with the Wandering Singularity was not smooth.\n\nDifferent from the signals sent by the Dimension Traveler before, the signals of the Wandering Singularity are full of brutal roars and shrill wails, as if the inside of the singularity is an abyss full of dead souls.\n\nAlthough the members of the translation team could hardly bear this weird signal, the Dimension Traveler still listened to everything silently, as if communicating with her past self, sorrowful and sad."
 time_wanderer.12.a:0 "She shouldn't bear it alone."
 
 time_wanderer.13.name:0 "Wandering Singularity: §HInvitation from Netherworld§!"
 time_wanderer.13.desc_1:0 "The Dimension Traveler is preparing to set off and go to the location of the Wandering Singularity alone.\n\nAccording to the Dimension Traveler, a coordinate is hidden in the signal of the Wandering Singularity, and this coordinate is exactly the current location of the Wandering Singularity. Therefore, she believes that if she directly contacts the Wandering Singularity, perhaps we can unlock the secrets behind the Wandering Singularity.\n\nHowever, other members of the translation team stated that this coordinate is a fake coordinate. What it points to is not the location of the Wandering Singularity at all, but a location in a higher dimension on a mathematical level.\n\nWe believe that the Dimension Traveler will not deceive us for no reason. She may have her own unique insights, but this move may put her in danger. How should we decide?"
 time_wanderer.13.desc_2:0 "The Dimension Traveler found a coordinate from the signal of the Wandering Singularity.\n\nAccording to the Dimension Traveler, this coordinate is exactly the current location of the Wandering Singularity. Therefore, she believes that if she directly contacts the Wandering Singularity, perhaps we can unlock the secrets behind the Wandering Singularity.\n\nHowever, other members of the translation team stated that this coordinate is a fake coordinate. What it points to is not the location of the Wandering Singularity at all, but a location in a higher dimension on a mathematical level.\n\nWe believe that the Dimension Traveler will not deceive us for no reason. She may have her own unique insights, but the Dimension Traveler is currently in an emergency jump state and cannot go to the coordinates temporarily. We can only wait patiently."
 time_wanderer.13.a:0 "Allow Dimension Traveler to act."
 time_wanderer.13.a.tooltip:0 "§RThe Dimension Traveler sets off immediately. We will temporarily be unable to communicate with the Dimension Traveler.§!"
 time_wanderer.13.b:0 "Too dangerous, stop her."
 time_wanderer.13.b.tooltip:0 "§RThe Dimension Traveler will not set off. We can only wait for the next message from the Wandering Singularity.§!"
 time_wanderer.13.c:0 "We have no choice but to wait."
 time_wanderer.13.c.tooltip:0 "§RThe Dimension Traveler cannot set off. We can only wait for the next message from the Wandering Singularity.§!"
 
 time_wanderer.14.name:0 "Wandering Singularity: §HDancing with Death§!"
 time_wanderer.14.desc:0 "The Dimension Traveler used her unique spacetime travel ability, but she did not appear near the Wandering Singularity.\n\nHowever, the translation team found a message from the Dimension Traveler in the signal from the Wandering Singularity. In the message, the Dimension Traveler stated that she was very lucky to meet us. We saved her countless times, but she didn't know how to repay us. Now she wants to leave us willfully again, she feels very sorry.\n\nBut fortunately, this is not a farewell last word. The Dimension Traveler returned to us safe and sound. The Dimension Traveler winked playfully, seeming very satisfied with her little prank.\n\nThe Dimension Traveler recalled that she traveled to a higher dimension, but unfortunately that was not the body of the Wandering Singularity either. However, she floated and rotated in the unknown world together with the Wandering Singularity, just like dancing with the dangerous Grim Reaper. But that's all. We still haven't solved the puzzle of the Wandering Singularity.\n\nBut what is certain is that there must be a connection between the Dimension Traveler and the Wandering Singularity. This is by no means accidental."
 time_wanderer.14.a:0 "It's good that you are back."
 time_wanderer.14.a.tooltip:0 "§YIf there is a suitable opportunity, maybe in the future we can really unlock the secret of the Wandering Singularity.\nMaybe...§!"
 
 time_wanderer.15.name:0 "Wandering Singularity: §HKiss of Death§!"
 time_wanderer.15.desc:0 "The Dimension Traveler used her unique spacetime travel ability and appeared near the Wandering Singularity.\n\nAt the same time, the translation team found some strange fragments from the signal from the Wandering Singularity, which depicted various scenes. Although we have not experienced these scenes, they seem both familiar and strange, because these fragments tell the story of us and the Dimension Traveler.\n\nSuddenly, the fragments came to an abrupt end, and we received a message from the Dimension Traveler. The Dimension Traveler gained nothing near the Wandering Singularity, so she tried to go deeper, but was accidentally captured by the gravity of the singularity, and performed an emergency spacetime jump when she was about to fall into the event horizon.\n\nSince then, the Wandering Singularity has never sent any signals."
 time_wanderer.15.a:0 "We will meet again."
 time_wanderer.15.a.tooltip:0 "§YIf there is a suitable opportunity, maybe in the future we can really unlock the secret of the Wandering Singularity, but not now...§!"
 
 time_wanderer.16.name:0 "Wandering Singularity: §HReturn to Dead Silence§!"
 time_wanderer.16.desc:0 "We waited quietly for the next message from the Wandering Singularity, but it never came.\n\nMaybe because we failed to keep the appointment in time, or maybe the Wandering Singularity didn't intend to continue communicating with us originally. In any case, the vicinity of the Wandering Singularity returned to dead silence."
 time_wanderer.16.a:0 "Why?"
 time_wanderer.16.a.tooltip:0 "§RWe can no longer obtain more information and have to abolish this first contact.§!"
 
 time_wanderer.20.name:0 "Wandering Singularity: §HRemnant Sound of the Past§!"
 time_wanderer.20.desc_1:0 "We accidentally interpreted several meaningless words from the irregular electromagnetic radiation originating from the Wandering Singularity:\n§Y"
 time_wanderer.20.desc_2:0 "§!\nWe temporarily cannot analyze the connection between these words and can only wait for the next opportunity."
 time_wanderer.21.name:0 "$time_wanderer.20.name$"
 time_wanderer.21.desc:0 "$time_wanderer.20.desc_1$\"Wind\"\n\"White Bird\"\n\"Hometown\"$time_wanderer.20.desc_2$"
 time_wanderer.21.a:0 "Familiar yet strange."
 time_wanderer.22.name:0 "$time_wanderer.20.name$"
 time_wanderer.22.desc:0 "$time_wanderer.20.desc_1$\"Missing\"\n\"Dream\"\n\"Body\"$time_wanderer.20.desc_2$"
 time_wanderer.22.a:0 "Seems to be a song."
 time_wanderer.23.name:0 "$time_wanderer.20.name$"
 time_wanderer.23.desc:0 "$time_wanderer.20.desc_1$\"Past\"\n\"Future\"\n\"Riddle\"$time_wanderer.20.desc_2$"
 time_wanderer.23.a:0 "Question of Time."
 time_wanderer.24.name:0 "$time_wanderer.20.name$"
 time_wanderer.24.desc:0 "$time_wanderer.20.desc_1$\"Spacetime\"\n\"Circle\"\n\"Plane\"$time_wanderer.20.desc_2$"
 time_wanderer.24.a:0 "Answer of Inverse Phase."
 time_wanderer.25.name:0 "$time_wanderer.20.name$"
 time_wanderer.25.desc:0 "$time_wanderer.20.desc_1$\"Point\"\n\"Mirror\"\n\"Excerptor\"$time_wanderer.20.desc_2$"
 time_wanderer.25.a:0 "Where the key lies."
 
 TIME_WANDERER_CHAIN_title:0 "Wandering Singularity"
 TIME_WANDERER_CHAIN_desc:0 "Wandering Singularity, what exactly is it?"
 
 time_wanderer.100.desc:0 "Wandering Singularity? I can't say.\n\nAlthough I always have an inexplicable sense of familiarity with it, and tried to study it privately, it always kept me at a distance. However, since I investigated the mystery of the Sanctified Servant, I had a whimsical conjecture, but that is just a conjecture, I have no evidence to prove it."
 time_wanderer.100.a:0 "Then launch another study on [hole_pets.GetName]."
 time_wanderer.100.a.response:0 "Waiting for your words. Let's see what valuable information we in another world left behind."
 
 time_wanderer.101.desc:0 "Sorry, although I studied for so long, I seem to have made no progress. However, the study of the Black Hole allowed me to obtain some interesting data, which might be helpful to you."
 time_wanderer.101.a:0 "It doesn't matter, there will always be results."
 time_wanderer.101.a.response:0 "Mm, I will continue to work hard."
 
 time_wanderer.102.desc:0 "The research seems to have made some progress, but finding the truth still seems far away. However, I am not without gain. I organized some historical and cultural archives about another world and have transmitted them back to the capital."
 time_wanderer.102.a:0 "Thank you so much."
 time_wanderer.102.a.response:0 "(The girl turned around shyly.)"
 
 time_wanderer.103.desc:0 "I have obtained a lot of evidence, and I feel more and more that my conjecture might be correct. By the way, I found some wreckage spit out from the horizon, maybe left by The Infinity Machine?"
 time_wanderer.103.a:0 "We will make good use of it."
 time_wanderer.103.a.response:0 "I believe we will find the answer soon."
 
 time_wanderer.104.desc:0 "With the increasing advancement of research, I feel more and more afraid instead. Because I am afraid that my conjecture is true, I am afraid that the past me and the future me all failed to move towards a good end, and all this is because I was saved..."
 time_wanderer.104.a:0 "\"Future, future. Only the uncertain is the future\", this is what you taught me."
 time_wanderer.104.a.response:0 "Eh?\n\nRight, future, future. Only the uncertain is the future. No matter what happened in the past, no matter what will happen in the future, you stand by my side, facing the future calmly together."
 
 time_wanderer.105.desc:0 "My conjecture is indeed correct, but everything has already happened, even regret is too late.\n\nActually, the Wandering Singularity is me.\nTo be precise, it is me who was not saved by you at the edge of the Black Hole, me who crashed into the Black Hole and shattered during the White Hole backtrack, me who swallowed the galactic center but turned into the End before the End... It is the collection of consciousness of countless mes outside causality, and this may be the price caused by our transcending causality.\nThe Wandering Singularity is actually located in another plane. What we observed is actually just its projection into the current universe.\n\nDoes all this sound so unbelievable and creepy? However, I tried to use the flaw of fate to communicate with countless mes in the Wandering Singularity."
 time_wanderer.105.a:0 "What did they say?"
 time_wanderer.105.a.response:0 "They told me: \"This is the future.\"\n\nPerhaps our transcending causality did lead to the tragedy of countless mes, but the tragedy of countless mes is inevitable, and our transcending causality is also inevitable.\nEven if the me in this world did not transcend causality, there will be mes in other worlds who successfully transcended causality. Even if countless mes suffer pain, there are also countless mes enjoying the joy of freedom.\nSuccess or failure, this is the inevitability of the cycle.\n\nWe transcended causality, but failed to break the cycle of The Worm-in-Waiting.\nMaybe the cycle itself can never be broken. Our little trick is just The Worm-in-Waiting's momentary indulgence to naughty children.\n\nBut is all this meaningless?\n§POf course not, at least we can still embrace each other tightly now.§!\n\n§Y<You embraced the girl selflessly, and the ghost from the past quietly left this plane.>§!"
 
 time_wanderer.115.desc:0 "Hey, wait, I haven't..."
 time_wanderer.115.a:0 "Sorry, my hand slipped."
 
 time_wanderer.120.desc:0 "...What happened?\n\nI seem to have had a very long dream, seemingly slept for a full hundred years, but..."
 time_wanderer.120.a:0 "No, don't worry, you just took a nap."
 time_wanderer.120.a.response:0 "Uh, is that so...\n\n§R<Please do not cheat!>§!"