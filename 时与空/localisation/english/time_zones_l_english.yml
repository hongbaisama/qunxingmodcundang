l_english:
 zone_akx_worm: "Horizon Domain"
 zone_akx_worm_desc: "With densely paved micro-singularities, this domain possesses properties similar to the Black Hole event horizon."
 zone_akx_worm_requires_capital: "§RWarning: this £zone£ District Specialization is effective only in the capital§!"
 zone_worm_black_hole: "Field of Horizonal Observation"
 zone_worm_black_hole_desc: "By receiving the particle beam diffused from the surface cracks of the central event horizon, we can piece together some information inside the black hole and observe the singularity."
 
 zone_time_default: "$zone_default$"
 zone_time_default_desc: "$zone_default_desc$"
 zone_time_urban: "$zone_urban$"
 zone_time_urban_desc: "$zone_urban_desc$"
 zone_time: "Stasis Field"
 zone_time_desc: "Spacetime stagnates here, and radiates order outward with an eternal span."
 zone_time_requires_tech: "$physics_research_icon_with_space$$tech_time_blocker_1$"
 
 zone_time_physics: "Nullifier Dimension"
 zone_time_physics_desc: "This is the horizon where Nullifiers live and work. Zero point and inverse entropy are stable norms here."
 zone_time_physics_requires_tech: "['concept_zone_time_physics_requires_tech']"
 
 zone_time_society: "Light Chaser Dimension"
 zone_time_society_desc: "This is the horizon where Light Chasers live and work. There is no boundary between body and soul here."
 zone_time_society_requires_tech: "['concept_zone_time_society_requires_tech']"
 
 zone_time_engineering: "Shadow Banisher Dimension"
 zone_time_engineering_desc: "This is the horizon where Shadow Banishers live and work. Particles and waves lose meaning here."
 zone_time_engineering_requires_tech: "['concept_zone_time_engineering_requires_tech']"
 
 zone_gas_energy: "Gaseous Power Generation"
 zone_gas_energy_desc: "Concentrate on utilizing the discharge phenomenon in the gaseous layer to provide power for our upward quest."
 zone_gas_energy_physics: "Gaseous Research Support"
 zone_gas_energy_physics_desc: "Focusing on analyzing the discharge phenomenon in the gaseous layer, our physicists can light up the light in the ignorant dark night."
 zone_gas_minerals: "Solid Extraction"
 zone_gas_minerals_desc: "Under the barrier of solid shell and gaseous vortex, drills are gnawing at rich mineral deposits, continuously outputting industrial blood."
 zone_gas_minerals_engineering: "Solid Research Support"
 zone_gas_minerals_engineering_desc: "Stable mineral supply, whether solid or fluid, our engineering scientists can conduct experiments at speeds unimaginable to others."
 zone_gas_food: "Liquid Focus"
 zone_gas_food_desc: "Large areas of bio-engineered crops ripple in the liquid breeding pool, feeding this growing empire."
 zone_gas_food_biology: "Liquid Research Support"
 zone_gas_food_biology_desc: "By synthesizing organic materials from liquid culture pods, our experiment speed and quality have been greatly improved."
 
 zone_psionic_energy: "Meditation Power Generation"
 zone_psionic_energy_desc: "Concentrate on utilizing energy fluctuations generated during meditation to provide power for our upward quest."
 zone_psionic_energy_physics: "Meditation Research Support"
 zone_psionic_energy_physics_desc: "Focusing on analyzing energy fluctuations generated during meditation, our physicists can light up the light in the ignorant dark night."
 zone_psionic_minerals: "Teleportation Extraction"
 zone_psionic_minerals_desc: "At the junction of reality and the Shroud, small portals open and close one after another, continuously outputting industrial blood."
 zone_psionic_minerals_engineering: "Teleportation Research Support"
 zone_psionic_minerals_engineering_desc: "Stable material supply, whether peaceful or forceful, our engineering scientists can conduct experiments at speeds unimaginable to others."
 zone_psionic_food: "Sacrificial Focus"
 zone_psionic_food_desc: "Large areas of altars borrowed rations from Shroud creatures, feeding this growing empire."
 zone_psionic_food_biology: "Sacrificial Research Support"
 zone_psionic_food_biology_desc: "By praying for organic materials from nearby altars, our experiment speed and quality have been greatly improved."
 
 zone_nanites_energy: "Energy Supply Power Generation"
 zone_nanites_energy_desc: "Concentrate on utilizing the thermal energy of the planet core to provide power for our upward quest."
 zone_nanites_energy_physics: "Energy Supply Research Support"
 zone_nanites_energy_physics_desc: "Focusing on analyzing the thermal energy of the planet core, our physicists can light up the light in the ignorant dark night."
 zone_nanites_minerals: "Collection Extraction"
 zone_nanites_minerals_desc: "In the flowing atmosphere and floating dust, recovery teams collect every piece of waste, continuously outputting industrial blood."
 zone_nanites_minerals_engineering: "Collection Research Support"
 zone_nanites_minerals_engineering_desc: "Stable resource supply, whether manufactured or recycled, our engineering scientists can conduct experiments at speeds unimaginable to others."
 
 zone_praise_the_sun: "Solar Altar"
 zone_praise_the_sun_desc: "On this altar closest to the sun, hot sundials and fervent hearts create infinite praise for the selfless star."
 
