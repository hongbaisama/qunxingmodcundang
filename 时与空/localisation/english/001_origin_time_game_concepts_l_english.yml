 # 岗位
 concept_planet_time_researchers: "$planet_time_researchers$"
 concept_planet_time_researchers_with_icon: "$planet_time_researchers_with_icon$"
 concept_planet_time_researchers_with_icon_standard_green: "§E$planet_time_researchers_with_icon$§!"
 concept_planet_time_researchers_desc: "$concept_planet_time_researchers$ is a type of job that can shuttle through spacetime lanes and obtain resources, while exploring the Mysterious Singularity.\n\n$concept_planet_time_researchers$ includes\n-['concept_black_hole_physicist']\n-['concept_black_hole_biologist']\n-['concept_black_hole_engineer']\n-['concept_time_recursioner']\n-['concept_planet_time_orders']"
 
 concept_planet_time_orders: "$planet_time_orders$"
 concept_planet_time_orders_with_icon: "$planet_time_orders_with_icon$"
 concept_planet_time_orders_desc: "$concept_planet_time_orders$ is a special type of job provided by ['concept_building_origin_time_authority'] based on the winning ethics, capable of producing resources based on planet population and enhancing ['concept_col_time_mult'].\n\n$concept_planet_time_orders$ includes\n-§I$job_hope_guardian_plural_with_icon$§!\n-§I$job_hope_disseminator_plural_with_icon$§!\n-§I$job_eternal_observer_plural_with_icon$§!\n-§I$job_eternal_creator_plural_with_icon$§!\n-§I$job_dimensional_ruler_plural_with_icon$§!\n-§I$job_dimensional_conqueror_plural_with_icon$§!\n-§I$job_original_meditator_plural_with_icon$§!\n-§I$job_original_purifier_plural_with_icon$§!"
 
 concept_black_hole_physicist: "$job_black_hole_physicist_plural$"
 concept_black_hole_physicist_desc: "[black_hole_physicist.GetNamePlural] is a composite job that produces $i_energy$, $i_consumer_goods$ and $i_physics$, and is treated as §I$job_technician$§!, §I$job_artisan$§! and §I$job_physicist$§! jobs.\n\nConversion Rate:\n§INone§!→4$i_energy$\n1$i_minerals$+1$i_food$→2$i_consumer_goods$\n1$i_energy$+0.5$i_consumer_goods$+0.25$i_alloys$→2$i_physics$\n\n§L$job_black_hole_physicist_desc$§!"
 
 concept_black_hole_biologist: "$job_black_hole_biologist_plural$"
 concept_black_hole_biologist_desc: "[black_hole_biologist.GetNamePlural] is a composite job that produces $i_food$, $i_unity$ and $i_society$, and is treated as §I$job_farmer$§!, §I$job_bureaucrat$§! and §I$job_biologist$§! jobs.\n\nConversion Rate:\n§INone§!→4$i_food$\n0.5$i_consumer_goods$+0.5$i_alloys$→2$i_unity$\n1$i_food$+0.5$i_consumer_goods$+0.25$i_alloys$→2$i_society$\n\n§L$job_black_hole_biologist_desc$§!"
 
 concept_black_hole_engineer: "$job_black_hole_engineer_plural$"
 concept_black_hole_engineer_desc: "[black_hole_engineer.GetNamePlural] is a composite job that produces $i_minerals$, $i_alloys$ and $i_engineering$, and is treated as §I$job_miner$§!, §I$job_foundry$§! and §I$job_engineer$§! jobs.\n\nConversion Rate:\n§INone§!→4$i_minerals$\n1$i_energy$+1$i_minerals$→2$i_alloys$\n1$i_minerals$+0.5$i_consumer_goods$+0.25$i_alloys$→2$i_engineering$\n\n§L$job_black_hole_engineer_desc$§!"
 
 concept_time_recursioner: "$job_time_recursioner_plural$"
 concept_time_recursioner_desc: "[time_recursioner.GetNamePlural] is a composite job that produces $i_energy$, $i_minerals$, $i_food$, $i_consumer_goods$, $i_alloys$, $i_unity$ and $i_research$, and is treated as §I$job_technician$§!, §I$job_miner$§!, §I$job_farmer$§!, §I$job_artisan$§!, §I$job_foundry$§!, §I$job_bureaucrat$§! and §IResearcher§! jobs.\n\nConversion Rate:\n§INone§!→2$i_energy$+2$i_minerals$+2$i_food$\n0.5$i_minerals$+0.5$i_food$→1$i_consumer_goods$\n0.5$i_energy$+0.5$i_minerals$→1$i_alloys$\n0.25$i_consumer_goods$+0.25$i_alloys$→1$i_unity$\n0.5$i_energy$+0.25$i_consumer_goods$+0.125$i_alloys$→1$i_physics$\n0.5$i_food$+0.25$i_consumer_goods$+0.125$i_alloys$→1$i_society$\n0.5$i_minerals$+0.25$i_consumer_goods$+0.125$i_alloys$→1$i_engineering$\n\n§L$job_time_recursioner_desc$§!"
 
