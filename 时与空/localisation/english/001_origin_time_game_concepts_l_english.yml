 concept_origin_time_chosen_desc: "§MChild of the Loop§! is the person chosen by the §HLoop§!, who is crucial to §Y$origin_time$§!. Their §Ylatent potential§! and §Ydestiny§! will also bring §Yunpredictable§! effects to the empire."
 
 concept_leader_trait_ruler_time: "$leader_trait_ruler_time$"
 concept_leader_trait_ruler_time_desc: "$origin_time_chosen_subtitle_common$\n\n$THIS_LEADER_TXT$:\n$t$-$TRAIT_IMMORTAL_LEADERS$\n$h_line$$pc_time_pitcure$ §LTo survive in a Black Hole, a wise leader is indispensable, and this leader is the best candidate.§!\n§G$origin_time$['concept_time_ruler_trait_green']§!"
 concept_leader_trait_ruler_time_owner: "$leader_trait_ruler_time_owner$"
 concept_leader_trait_ruler_time_owner_desc: "$origin_time_chosen_subtitle_veteran$\n\n$THIS_LEADER_TXT$:\n$t$-$TRAIT_IMMORTAL_LEADERS$\n$h_line$$origin_time_picture$ §LBeing able to resurrect from a pure Black Hole, this leader must be a messenger from the singularity, able to convey to us the information behind the Horizon Signal.§!\n§G$origin_time$['concept_time_ruler_trait_green']§!"
 concept_leader_trait_ruler_time_king: "$leader_trait_ruler_time_king$"
 concept_leader_trait_ruler_time_king_desc: "$origin_time_chosen_subtitle_paragon$\n\n$THIS_LEADER_TXT$:\n$t$-$TRAIT_IMMORTAL_LEADERS$\n$h_line$$pc_endless_time_picture$ §LWith the deepening research on the singularity, this leader gradually mastered the ability to distort and transform spacetime at will. Spacetime has been ruled by us.§!\n§G$origin_time$['concept_time_ruler_trait_green']§!"
 
 concept_origin_time_species_trait: "$origin_time$ Species Trait"
 concept_origin_time_species_trait_desc: "$concept_origin_time_species_trait$ is a species trait exclusive to §Y$origin_time$§! origin.\nSuch traits allow species to survive on ['concept_pc_time'], train as exclusive §Y$origin_time_army_plural$§! armies, and cannot be added or removed."
 
