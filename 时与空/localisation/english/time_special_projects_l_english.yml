 TIME_BLACK_HOLE_PROJECT:0 "Re-analyze the Horizon Signal"
 TIME_BLACK_HOLE_PROJECT_DESC:0 "Dispatch a science ship to the §Y[time_black_hole_system.GetName]§! system to decode the mysterious signal coming from the black hole."
 
 AP_HORROR_PROJECT_1:0 "Mystery of Spacetime"
 AP_HORROR_PROJECT_1_DESC:0 "Spacetime is an integral part of the Horrific Inverse Plane, and we must understand the role it plays.\n\n[GetApHorrorProjectDesc]"
 AP_HORROR_PROJECT_2:0 "Mystery of the Loop"
 AP_HORROR_PROJECT_2_DESC:0 "The Loop is an integral part of the Horrific Inverse Plane, and we must understand the role it plays.\n\n[GetApHorrorProjectDesc]"
 AP_HORROR_PROJECT_3:0 "Mystery of the Plane"
 AP_HORROR_PROJECT_3_DESC:0 "The Plane is an integral part of the Horrific Inverse Plane, and we must understand the role it plays.\n\n[GetApHorrorProjectDesc]"
 ApHorrorProjectDesc_1:0 "§Y<[GetResearcherCouncilorName] will pry into the mystery of the Inverse Phase.>§!"
 ApHorrorProjectDesc_2:0 "§Y<[GetResearcherCouncilorName] will pry into the mystery of the Inverse Phase, and the Dimension Traveler seems very interested in this.>§!"
 AP_HORROR_PROJECT_GESTALT_1:0 "Mystery of Spacetime"
 AP_HORROR_PROJECT_GESTALT_1_DESC:0 "Spacetime is an integral part of the Horrific Inverse Plane, and we must understand the role it plays.\n\n[GetApHorrorProjectGestaltDesc]"
 AP_HORROR_PROJECT_GESTALT_2:0 "Mystery of the Loop"
 AP_HORROR_PROJECT_GESTALT_2_DESC:0 "The Loop is an integral part of the Horrific Inverse Plane, and we must understand the role it plays.\n\n[GetApHorrorProjectGestaltDesc]"
 AP_HORROR_PROJECT_GESTALT_3:0 "Mystery of the Plane"
 AP_HORROR_PROJECT_GESTALT_3_DESC:0 "The Plane is an integral part of the Horrific Inverse Plane, and we must understand the role it plays.\n\n[GetApHorrorProjectGestaltDesc]"
 ApHorrorProjectGestaltDesc_1:0 "§Y<Project researchers will pry into the mystery of the Inverse Phase.>§!\n$ApHorrorProjectGestaltDescSame$"
 ApHorrorProjectGestaltDesc_2:0 "§Y<Project researchers will pry into the mystery of the Inverse Phase, and the Dimension Traveler seems very interested in this.>§!\n$ApHorrorProjectGestaltDescSame$"
 ApHorrorProjectGestaltDescSame:0 "§R<This project must be started via a science ship, not through the log, otherwise bugs will occur!>§!"
 
 TIME_AKX_WAITING_WORLD_PROJECT_1:0 "Hazy Shadow"
 TIME_AKX_WAITING_WORLD_PROJECT_1_DESC:0 "Dispatch a science ship to §Y[waiting_world.GetName]§! to investigate the cause."
 TIME_AKX_WAITING_WORLD_PROJECT_2:0 "Mass Effect"
 TIME_AKX_WAITING_WORLD_PROJECT_2_DESC:0 "Dispatch a science ship to §Y[waiting_world.GetName]§! to stop the formation of the black hole."
 TIME_AKX_WAITING_WORLD_PROJECT_3:0 "Transparent Heart"
 TIME_AKX_WAITING_WORLD_PROJECT_3_DESC:0 "Research the transparency phenomenon on §Y[waiting_world.GetName]§!."
 TIME_AKX_WAITING_WORLD_PROJECT_4:0 "Void Gift"
 TIME_AKX_WAITING_WORLD_PROJECT_4_DESC:0 "Attempt to improve the translucent nature of the residents."
 TIME_AKX_WAITING_WORLD_PROJECT_5:0 "Repair Special Gene Segment"
 TIME_AKX_WAITING_WORLD_PROJECT_5_DESC:0 "Attempt to repair the special gene segment and prevent residents from becoming translucent."
 TIME_AKX_WAITING_WORLD_PROJECT_6:0 "Remove Peculiar Body Components"
 TIME_AKX_WAITING_WORLD_PROJECT_6_DESC:0 "Attempt to remove peculiar body components and prevent residents from becoming translucent."
 
 SYZYGY_ADMIRAL_PROJECT:0 "Destined to Meet Again"
 SYZYGY_ADMIRAL_PROJECT_DESC:0 "They are destined to meet again, which may determine the future of the Omega Ark."
 
 DIMENSION_TRAVELER_PROJECT_1:0 "Analyze White Hole Horizon Signal"
 DIMENSION_TRAVELER_PROJECT_1_DESC:0 "Dispatch a science ship to the §Y[dimension_traveler_system.GetName]§! system to decode the mysterious signal coming from the white hole."
 DIMENSION_TRAVELER_PROJECT_2:0 "Continue Analyzing White Hole Signal"
 DIMENSION_TRAVELER_PROJECT_2_DESC:0 "Dispatch a science ship to the §Y[dimension_traveler_system.GetName]§! system to decode the mysterious signal coming from the white hole."
 DIMENSION_TRAVELER_PROJECT_3:0 "Send Signal"
 DIMENSION_TRAVELER_PROJECT_3_DESC:0 "Attempt to send a signal to the white hole in the §Y[dimension_traveler_system.GetName]§! system."
 DIMENSION_TRAVELER_PROJECT_4:0 "Sail into White Hole"
 DIMENSION_TRAVELER_PROJECT_4_DESC:0 "Attempt to force the science ship into the white hole in the §Y[dimension_traveler_system.GetName]§! system."
 DIMENSION_TRAVELER_PROJECT_5:0 "Re-enter White Hole"
 DIMENSION_TRAVELER_PROJECT_5_DESC:0 "Attempt to force the science ship into the white hole in the §Y[dimension_traveler_system.GetName]§! system again."
 
 DIMENSION_TRAVELER_PROJECT_END_1:0 "Transcending Spacetime"
 DIMENSION_TRAVELER_PROJECT_END_1_DESC:0 "The cycle as a whole cannot be changed, so we still cannot break the cycle.\n\nHowever, as long as we can change a little bit each time, then in the next countless cycles, there will be one time when we can break through the limitations of spacetime.\n\n[GetDimensionTravelerProjectEndDesc]"
 DIMENSION_TRAVELER_PROJECT_END_2:0 "Transcending the Loop"
 DIMENSION_TRAVELER_PROJECT_END_2_DESC:0 "The cycle as a whole cannot be changed, so we still cannot break the cycle.\n\nHowever, as long as we can change a little bit each time, then in the next countless cycles, there will be one time when we can break through the limitations of the loop.\n\n[GetDimensionTravelerProjectEndDesc]"
 DIMENSION_TRAVELER_PROJECT_END_3:0 "Transcending the Plane"
 DIMENSION_TRAVELER_PROJECT_END_3_DESC:0 "The cycle as a whole cannot be changed, so we still cannot break the cycle.\n\nHowever, as long as we can change a little bit each time, then in the next countless cycles, there will be one time when we can break through the limitations of the plane.\n\n[GetDimensionTravelerProjectEndDesc]"
 DimensionTravelerProjectEndDesc_1:0 "§Y<Assigning the Dimension Traveler as $councilor_research$ may yield additional information.>§!"
 DimensionTravelerProjectEndDesc_2:0 "§Y<Letting the Dimension Traveler manage the capital may yield additional information.>§!"
 
 PC_TIME_PROJECT_1:0 "Time Reversal"
 PC_TIME_PROJECT_1_DESC:0 "Time flows very regularly in the reverse direction in this spacetime. It may be of value."
 PC_TIME_PROJECT_2:0 "Space Vortex"
 PC_TIME_PROJECT_2_DESC:0 "Space rotates very regularly around a certain center in this spacetime. It may be of value."
 PC_TIME_PROJECT_3:0 "Matter Forge"
 PC_TIME_PROJECT_3_DESC:0 "Matter is repeatedly synthesized and decomposed in chaos in this spacetime. It may be of value."
 PC_TIME_PROJECT_4:0 "Folded Dimension"
 PC_TIME_PROJECT_4_DESC:0 "The atmosphere in this spacetime is more oppressive than in others. Unknown secrets must be hidden behind it."
 PC_TIME_PROJECT_5:0 "Plane Rift"
 PC_TIME_PROJECT_5_DESC:0 "There is a huge plane rift in this spacetime. We'd better repair it as soon as possible."
 PC_TIME_PROJECT_6:0 "Shroud Creature"
 PC_TIME_PROJECT_6_DESC:0 "Some eerie life forms without physical bodies inhabit this spacetime. They pose a threat to us."
 PC_TIME_PROJECT_MIDDLE_1:0 "Test Barrier Physical Properties"
 PC_TIME_PROJECT_MIDDLE_1_DESC:0 "We will test the barrier's capabilities from optical, mechanical, electrical, and other aspects."
 PC_TIME_PROJECT_MIDDLE_2:0 "Consult Barrier Historical Records"
 PC_TIME_PROJECT_MIDDLE_2_DESC:0 "We will consult the origin of the barrier from ancient books, murals, legends, etc."
 PC_TIME_PROJECT_MIDDLE_3:0 "Analyze Barrier Composition Materials"
 PC_TIME_PROJECT_MIDDLE_3_DESC:0 "We will analyze the structure of the barrier from hardness, toughness, stiffness, etc."
 
 GAS_COLONY_CHANGE_PROJECT:0 "Gas Giant Adaptation Attempt"
 GAS_COLONY_CHANGE_PROJECT_DESC:0 "After preliminary exploration, our science ship found a Gas Giant very similar to our homeworld. Although we cannot determine its internal structure for the time being, this news still makes us happy.\nTo confirm whether we can live on this planet, we'd better dispatch a science ship to §Y[From.GetName]§! for adaptation attempt."
 
 BREACHING_SHROUD_PSIONIC_PROJECT:0 "Return to the Shroud"
 BREACHING_SHROUD_PSIONIC_PROJECT_DESC:0 "If we are to return to the Shroud, even temporarily, we must release an unimaginably huge amount of psionic energy. A massive seance has been prepared, and the most powerful psychics in the newly built psychic conclave on [Root.Capital.GetName] will participate."
 
 PARALLEL_SKY_PROJECT:0 "Research Hypocritical Starry Sky"
 PARALLEL_SKY_PROJECT_DESC:0 "Dispatch a science ship to research the hypocritical starry sky on §Y[parallel_sky_planet.GetName]§!."
 PARALLEL_SKY_END_PROJECT:0 "Research Warp Beast"
 PARALLEL_SKY_END_PROJECT_DESC:0 "Dispatch a science ship to research the wreckage of Warp Beasts near §Y[parallel_sky_planet.star.GetName]§!."
 
 UNDER_THE_HAZE_DATA_PROJECT_1:0 "Investigate Mystery of Enemy Leader Suicide"
 UNDER_THE_HAZE_DATA_PROJECT_1_DESC:0 "The enemy leader likely did not commit suicide, but we need to find evidence."
 UNDER_THE_HAZE_ACCIDENT_PROJECT_1:0 "Investigate Mystery of Interrogator Car Accident"
 UNDER_THE_HAZE_ACCIDENT_PROJECT_1_DESC:0 "The interrogator likely did not die in an accident, but we need to find evidence."
 UNDER_THE_HAZE_DATA_PROJECT_2:0 "$UNDER_THE_HAZE_DATA_PROJECT_1$"
 UNDER_THE_HAZE_DATA_PROJECT_2_DESC:0 "$UNDER_THE_HAZE_DATA_PROJECT_1_DESC$"
 UNDER_THE_HAZE_ACCIDENT_PROJECT_2:0 "$UNDER_THE_HAZE_ACCIDENT_PROJECT_1$"
 UNDER_THE_HAZE_ACCIDENT_PROJECT_2_DESC:0 "$UNDER_THE_HAZE_ACCIDENT_PROJECT_1_DESC$"
 UNDER_THE_HAZE_DATA_PROJECT_3:0 "Repair Information Carrier"
 UNDER_THE_HAZE_DATA_PROJECT_3_DESC:0 "This information carrier likely stores important content, but no one can be sure before repairing it."
 UNDER_THE_HAZE_SEARCH_PROJECT:0 "Search Team Rescue Operation"
 UNDER_THE_HAZE_SEARCH_PROJECT_DESC:0 "It is difficult to find the search team in a short time with the power on the planet alone, but with the help of the science ship in outer space, we may be able to find their location faster and launch a rescue operation."
 UNDER_THE_HAZE_EXCAVATE_PROJECT:0 "Lake Water Cleanup Excavation Operation"
 UNDER_THE_HAZE_EXCAVATE_PROJECT_DESC:0 "Lake water continuously pours into the cave. Without the help of a construction ship, it is difficult for us to clean up the lake water and discover the secrets hidden in the base."
 UNDER_THE_HAZE_END_PROJECT:0 "Under the Haze"
 UNDER_THE_HAZE_END_PROJECT_DESC:0 "§Y[under_the_haze_ruler.GetName]§! is dead. Its wreckage may help us understand the truth."
 
 ORIGIN_COLOSSUS_PROJECT_0:0 "Prepare to Power Sword of Damocles"
 ORIGIN_COLOSSUS_PROJECT_0_DESC:0 "If we are fully prepared, we can charge this abandoned ship at any time.\n\n§Y<Requires £energy 5000>§!"
 ORIGIN_COLOSSUS_PROJECT_1:0 "Investigate Sword of Damocles"
 ORIGIN_COLOSSUS_PROJECT_1_DESC:0 "Dispatch a science ship to research the behemoth above §Y[Root.Capital_scope.GetName]§!."
 ORIGIN_COLOSSUS_PROJECT_2:0 "Deeply Investigate Sword of Damocles"
 ORIGIN_COLOSSUS_PROJECT_2_DESC:0 "Dispatch a science ship again to research the behemoth above §Y[Root.Capital_scope.GetName]§!."
 ORIGIN_COLOSSUS_PROJECT_3:0 "Provide Power for Sword of Damocles"
 ORIGIN_COLOSSUS_PROJECT_3_DESC:0 "Dispatch a science ship to charge the behemoth above §Y[Root.Capital_scope.GetName]§!."
 ORIGIN_COLOSSUS_PROJECT_4:0 "Investigate \"Ghost\""
 ORIGIN_COLOSSUS_PROJECT_4_DESC:0 "Dispatch a science ship to investigate the \"ghost\" in §Y[origin_colossus_fleet.GetName]§!."
 ORIGIN_COLOSSUS_PROJECT_5:0 "Prepare to Refit Sword of Damocles"
 ORIGIN_COLOSSUS_PROJECT_5_DESC:0 "If we are fully prepared, we can refit §Y[origin_colossus_fleet.GetName]§! at any time."
 ORIGIN_COLOSSUS_PROJECT_MIDDLE:0 "Refit Sword of Damocles"
 ORIGIN_COLOSSUS_PROJECT_MIDDLE_DESC:0 "Accept the gift of §HThe Worm-in-Waiting§!, and §Y[origin_colossus_fleet.GetName]§! will look brand new."
 
 ORIGIN_MANIFESTI_DREAM_PROJECT:0 "Break Shackles"
 ORIGIN_MANIFESTI_DREAM_PROJECT_DESC:0 "Stay awake, break the shackles of the dream."
 ORIGIN_MANIFESTI_DREAM_PROJECT_END:0 "Fourth Wall"
 ORIGIN_MANIFESTI_DREAM_PROJECT_END_DESC:0 "Break §Ris an error§! Fourth Wall §Ris an error§!, find §Ris an error§! truth."
 
 ORIGIN_VOIDSPAWN_PROJECT_1:0 "Eggshell Hypothesis"
 ORIGIN_VOIDSPAWN_PROJECT_1_DESC:0 "We need to confirm if the Eggshell Hypothesis is correct."
 ORIGIN_VOIDSPAWN_PROJECT_2:0 "Homeworld Savior"
 ORIGIN_VOIDSPAWN_PROJECT_2_DESC:0 "We will definitely find a way to save our homeworld."
 ORIGIN_VOIDSPAWN_PROJECT_3:0 "Howling Light"
 ORIGIN_VOIDSPAWN_PROJECT_3_DESC:0 "The dark night will pass, and dawn will come."
 ORIGIN_VOIDSPAWN_PROJECT_XENOPHILE:0 "Pacify Voidspawn"
 ORIGIN_VOIDSPAWN_PROJECT_XENOPHILE_DESC:0 "It is just a newborn little life, we don't need to conflict with it."
 
 REPAIR_NOAH_ARK_CIVILIAN_PROJECT:0 "重建诺亚方舟"
 REPAIR_NOAH_ARK_CIVILIAN_PROJECT_DESC:0 "我们将重建诺亚方舟为$civilian_arkship_name$。"
 REPAIR_NOAH_ARK_SCIENCE_PROJECT:0 "$REPAIR_NOAH_ARK_CIVILIAN_PROJECT$"
 REPAIR_NOAH_ARK_SCIENCE_PROJECT_DESC:0 "我们将重建诺亚方舟为$science_arkship_name$。"
 
 PIRATE_KING_TRUE_PROJECT_1:0 "Peep into the Abyss"
 PIRATE_KING_TRUE_PROJECT_1_DESC:0 "Things are a bit strange. Maybe there are some clues in the ship wreckage."
 PIRATE_KING_TRUE_PROJECT_2:0 "Question the Abyss"
 PIRATE_KING_TRUE_PROJECT_2_DESC:0 "We have long speculated about the identity of the Ghost Captain, but no one dares to believe it."
 PIRATE_KING_PROJECT:0 "Face the Abyss"
 PIRATE_KING_PROJECT_DESC:0 "To end the cycle, we must face the abyss directly."
 PIRATE_KING_PROJECT_END:0 "End the Abyss"
 PIRATE_KING_PROJECT_END_DESC:0 "The god of the abyss has been terminated by us, the trap of the cycle has been cracked by us, and the secrets of the Inverse Phase are being revealed before us."
 
 TIME_WANDERER_PROJECT:0 "Ghost from the Past"
 TIME_WANDERER_PROJECT_DESC:0 "Re-researching §Y[hole_pets.GetName]§! may help us learn the origin of the Wandering Singularity.\n\n§R<This project is very dangerous. Once interrupted midway, the Dimension Traveler may suffer an accident!>§!"
 
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_1:0 "$CRISIS_SPECIAL_PROJECT_1$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_1_DESC:0 "A silent frenzy swept through our people. Its origin is untraceable, but they-no, we-some idea has begun to seep into our hearts, determining that our [Root.GetSpeciesNamePlural] race is destined to complete a greater cause. We should investigate what caused such \"mass hysteria\"-hysteria with whispers promising to rule the galaxy ringing in the ears."
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_1:0 "$CRISIS_SPECIAL_PROJECT_MACH_1$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_1_DESC:0 "Sensors scattered across multiple star systems of [Root.GetName] report very faint but completely inexplicable energy fluctuations. These energy anomalies are very small and not enough to disrupt our processes, but we still authorize further investigation to ensure we understand the cause of the matter."
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_1:0 "$CRISIS_SPECIAL_PROJECT_HIVE_1$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_1_DESC:0 "Unusual impulses were sensed within our drone network-an urgent pursuit to become a greater existence. A pursuit to encompass the entire galaxy with a unified mind. Although this pursuit does not originate from within us, its promised prospect is so tempting that we cannot ignore it. We should concentrate all our energy to find the origin of this impulse."
 
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_2:0 "$CRISIS_SPECIAL_PROJECT_2$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_2_DESC:0 "The existing theory is-the universe we are in and the Shroud are interconnected-large-scale disturbance events or actions occurring in one plane will have a \"ripple effect\" on the other plane. We should test this theory properly."
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_2:0 "$CRISIS_SPECIAL_PROJECT_MACH_2$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_2_DESC:0 "The science auxiliary program has given a hypothesis that there is some perceptible connection between the universe we know well and the dimension code-named \"Shroud\". We suggest further experiments and mapping on this conjecture."
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_2:0 "$CRISIS_SPECIAL_PROJECT_HIVE_2$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_2_DESC:0 "Our most outstanding $job_brain_drone_plural$ have now confirmed the existence of the connection between the current universe and the Shroud. We must find more ways to communicate with this reality plane."
 
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_3:0 "$CRISIS_SPECIAL_PROJECT_3$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_3_DESC:0 "Our country's strength is increasing day by day-coupled with an undeniable sense of mission uniting our entire species-convincing our scientists that we are already accepting energy infusion from the Shroud."
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_3:0 "$CRISIS_SPECIAL_PROJECT_MACH_3$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_3_DESC:0 "Edge hypothesis has been filed. Once confirmed, its potential benefits will far exceed the predicted range. Hypothesis summary: [Root.GetName] is already drawing §Y<<Unidentified Resources>>§! from the space code-named \"Shroud\". Suggest further investigation."
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_3:0 "$CRISIS_SPECIAL_PROJECT_HIVE_3$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_3_DESC:0 "As we seize more planets and the hive expands, we can also feel that impulse becoming stronger. Now this impulse is no longer a hazy feeling, but a torrent guiding us to meet the coming greatness-our will shall ascend."
 
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_4:0 "$CRISIS_SPECIAL_PROJECT_4$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_4_DESC:0 "It is time to find a way to release the energy of the Shroud into the present world and tame this energy source incomprehensible to ordinary people.\n\nAccording to existing theories, a sufficiently large energy surge might tear the barrier between the two planes and eventually merge the two universes into one.\n\nThe Shroud's power is vast; the capable take it. Let us take it."
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_4:0 "$CRISIS_SPECIAL_PROJECT_MACH_4$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_MACH_4_DESC:0 "The scientific theory subroutine completed a new hypothesis about code name \"Shroud\", which includes how to comprehensively acquire energy released by the Shroud.\n\nRequest: Accumulate more data.\nSuggested action: Transfer optimal energy and action capacity to the science branch, and further conduct disruptive interactions (Command: \"Crisis\") to cause greater fluctuations in the other plane (code name \"Shroud\")."
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_4:0 "$CRISIS_SPECIAL_PROJECT_HIVE_4$"
 BEYOND_INFINITY_CRISIS_SPECIAL_PROJECT_HIVE_4_DESC:0 "If we are to thoroughly stimulate our potential, this path must be opened. This primitive, dual-state reality must end. We must find a way to merge the two universes into one. And in the new reality plane, our will shall become unique."
 
 BEYOND_INFINITY_GAMBLING_PHYSICS_PROJECT:0 "Schedule Time"
 BEYOND_INFINITY_GAMBLING_PHYSICS_PROJECT_DESC:0 "Schedule the time produced so far to the same point to induce the generation of a singularity."
 BEYOND_INFINITY_GAMBLING_SOCIETY_PROJECT:0 "Penetrate Cycle"
 BEYOND_INFINITY_GAMBLING_SOCIETY_PROJECT_DESC:0 "Use the spacetime singularity to penetrate the barrier of the cycle to connect with another cycle."
 BEYOND_INFINITY_GAMBLING_ENGINEERING_PROJECT:0 "Stabilize Singularity"
 BEYOND_INFINITY_GAMBLING_ENGINEERING_PROJECT_DESC:0 "Maintain the stability of the singularity to ensure connection with the other side of the singularity."
 
 BEYOND_INFINITY_SEAL_PROJECT:0 "Seal §Y[beyond_infinity_seal_project_target.GetName]§!"
 BEYOND_INFINITY_SEAL_PROJECT_DESC:0 "With the help of another cycle, we can perform Seal of the End on §Y[beyond_infinity_seal_project_target.GetName]§!."
 
 BEYOND_INFINITY_TIME_MACHINE_PROJECT:0 "$building_time_machine$"
 BEYOND_INFINITY_TIME_MACHINE_PROJECT_DESC:0 "['concept_building_time_machine'] allows us to reach different spacetimes to welcome a new beginning, although this technology is currently still in the theoretical stage."
 BEYOND_INFINITY_CIRCLE_NEXUS_PROJECT:0 "$building_circle_nexus$"
 BEYOND_INFINITY_CIRCLE_NEXUS_PROJECT_DESC:0 "['concept_building_circle_nexus'] allows us to directly interfere with another loop, letting everything proceed in the right direction, although this technology is currently still in the theoretical stage."
 BEYOND_INFINITY_DIMENSION_ENGINE_PROJECT:0 "$building_dimension_engine$"
 BEYOND_INFINITY_DIMENSION_ENGINE_PROJECT_DESC:0 "['concept_building_dimension_engine'] allows us to establish anchors in other planes, making it possible for all dimensions to merge into one, although this technology is currently still in the theoretical stage."
 
 BEYOND_INFINITY_DIMENSIONAL_HORROR_CRISIS_END_PROJECT:0 "Fall of Destiny"
 BEYOND_INFINITY_DIMENSIONAL_HORROR_CRISIS_END_PROJECT_DESC:0 "Let this prematurely awakened catastrophe return to its original place."