 casus_belli_cb_dark_forest:1 "Dark Forest Law"
 war_goal_wg_dark_forest:0 "Hell is Other People"
 war_goal_wg_dark_forest_desc:0 "The universe is a dark forest. Every civilization is an armed hunter stalking through the trees like a ghost, gently pushing aside branches that block the path and trying to tread without sound. Even breathing is done with care... He must be careful, because everywhere in the forest are stealthy hunters like him. If he finds other life-be it another hunter, an angel or a demon, a delicate infant or a tottering old man, a fairy or a demigod-there's only one thing he can do: open fire and eliminate them? In this forest, hell is other people. An eternal threat that any life that exposes its own existence will be swiftly wiped out. This is the picture of cosmic civilization. It's the explanation for the Fermi Paradox."
 
