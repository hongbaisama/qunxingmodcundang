l_english:
 psionic.1.name:0 "Shroud Visitor: §HFuture Outlook§!"
 psionic.1.desc:0 "We came to the three-dimensional world. Although not adapted yet, we must plan for the future.\n\nThe urgent task is to make more planets suitable for us to live. We can transform planets into habitable §YPsionic Worlds§! through the consumption of Zro and input of psionics, but not all planets are worth doing so.\n\nAccording to our investigation of the three-dimensional world, common §YNine Habitable Planets§!, sacred §Y$pc_gaia$§!, evil §Y$pc_nuked$§!, ancient §Y$pc_relic$§!, magnificent §Y$pc_city$§!, dirty §Y$pc_hive$§! are all our potential transformation targets."
 psionic.1.a:0 "What kind of future will we usher in?"
 
 psionic.50.name:0 "Shroud Visitor: §HConsecrated Capital§!"
 psionic.50.desc:0 "Our homeworld-§Y[Root.GetName]§! has accepted the highest standard of consecration ceremony.\n\nWith the expansion of the Shroud rift, this place has become our second home. Its continuous psionic energy transcends the boundaries of dimensions, gently moisturizing all planets within the empire's territory.\n\nWe found a place to live and settle down in this galaxy."
 psionic.50.a:0 "This is our homeland."
 
 psionic.11.name:0 "Shroud Visitor: §HPsionic Transformation§!"
 psionic.11.desc:0 "Through the consumption of Zro and input of psionics, §Y[From.GetName]§! has been transformed into a Psionic World suitable for us to live.\n\nHowever, because our transformation technology is not yet mature, the psionic waves on this planet are constantly changing, and its future intensity cannot be predicted for the time being. Nevertheless, this planet is still our ideal home. And perhaps in the future, we can have the ability to stabilize psionic waves?"
 psionic.11.a:0 "Long live psionics!"
 psionic.111.name:0 "Shroud Visitor: §GWave Decline§!"
 psionic.111.desc:0 "The chaotic psionic waves on §Y[Root.GetName]§! gradually declined, and Shroud Visitors can adapt well to the environment here.\n\nHowever, the psionic waves seem to have become too weak, so that Shroud Visitors need to spend a lot of effort to accurately feel the specific location of the waves, and it is difficult for us to utilize the psionic energy in them. However, the psionic waves on §Y[Root.GetName]§! are still changing constantly. Maybe one day, the psionic waves here will have an intensity that satisfies us."
 psionic.111.a:0 "Truly wonderful psionics."
 psionic.114.name:0 "Shroud Visitor: §RCalamity Omen§!"
 psionic.114.desc:0 "The chaotic psionic waves on §Y[Root.GetName]§! are becoming stronger, so that we have no way to control them for the time being.\n\nAccording to the report of local officials, several spatial rifts leading directly to the Shroud seem to have appeared on this Psionic World, and there is a tendency to gradually expand. Continuous psionic energy rolls from it, and any approaching Shroud Visitor will feel strong discomfort. Therefore, we cannot repair these rifts for the time being. It is foreseeable that the psionic waves on the planet will continue to increase, eventually reaching a dangerous threshold, and cause the entire planet to be swallowed by the Shroud."
 psionic.114.a:0 "May old friends of the Shroud bless us."
 psionic_warning.tooltip:0 "§RBefore long, this place will become an uninhabitable $pc_shrouded$!§!"
 psionic.115.name:0 "Shroud Visitor: §RPsionic Disaster§!"
 psionic.115.desc:0 "The chaotic psionic waves on §Y[Root.GetName]§! finally reached their peak, and the nearby space was also torn by psionics, forming countless huge Shroud rifts.\n\nThe continuous generation and expansion of Shroud rifts made all Shroud rifts piece together, swallowing the entire planet like a bloody mouth, and all life on the planet will cease to exist. Finally, what we can see is only a sphere wrapped in completely disordered psionic waves, its core is the Shroud."
 psionic.115.a:0 "Disaster is inevitable."
 psionic.121.name:0 "Shroud Visitor: §GReturn to Normal§!"
 psionic.121.desc:0 "The weak psionic waves on §Y[Root.GetName]§! sometimes strengthened and sometimes weakened, and finally stabilized at a moderate intensity.\n\nAll Shroud Visitors can adapt well to the environment here, and the sufficient psionic energy in the psionic waves can help our spiritual practice. Creatures living in it will feel happy because of this warm psionic wave, and be more willing to communicate and learn from others."
 psionic.121.a:0 "A wonderful day."
 psionic.200.name:0 "Shroud Visitor: §GWave Stability§!"
 psionic.200.desc:0 "Through our efforts, the psionic waves on §Y[Root.GetName]§! finally stabilized at a suitable intensity.\n\nAll Shroud Visitors can adapt well to the environment here, and the stable psionic energy in the psionic waves can help our spiritual practice. Creatures living in it will feel happy because of this stable psionic wave, and be more willing to communicate and learn from others."
 psionic.200.a:0 "Celebration begins!"
 psionic.301.name:0 "Shroud Visitor: §GWave Prosperity§!"
 psionic.301.desc:0 "Through our unremitting efforts, the chaotic psionic waves on §Y[Root.GetName]§! are finally no longer so disorderly.\n\nSurprisingly, the stabilized psionic waves have extremely high intensity, far stronger than the ordinary psionic waves we stabilized, making almost everything more effective."
 psionic.301.a:0 "Gods bless!"
 
 utopia.2600.desc.psionic:0 "Since the beginning of our civilization, psionics has always been with us. Although we lost most of our psionics because of escaping the Shroud, we still have the potential to exert psionics.\n\nNow, we have finally regained psionic potential for some [Root.GetSpeciesName] individuals through day-after-day practice. Although only a very small part of our species has awakened most of the psionics, their number has grown steadily over the years.\n\nWhether this is because of some instantaneous growth spurt, or because something that has always existed in our genes catalyzed psionic awakening, we do not know."
 utopia.2600.psionic:0 "Maybe we have a chance to return to the Shroud."
 unlock_decision_psionic_1:0 "Decision §Y$decision_psionic_1$§! unlocked."
 utopia.2650.desc.psionic:0 "[Root.GetSpeciesName] species experienced a transformation that can only be described as \"Great Awakening\". In the past, our great psionics was inherent to our species, although we lost them for a long time, and now...\n\nAlmost overnight, [Root.GetSpeciesNamePlural] everywhere regained all their psionics, as if some common [Root.GetSpeciesName] psionic energy pool reached the activation value, waking up the psionic memory in our brains collectively.\n\nTelepathy has become the main way of communication between [Root.GetSpeciesNamePlural] again, and this is just a small one among the countless changes our society faces. We are once again connected in a psionic way."
 utopia.2650.psionic:0 "Return to original owner."
 unlock_decision_psionic_2:0 "Decision §Y$decision_psionic_2$§! unlocked."
 utopia.2655.desc.psionic:0 "Like a low whisper in a dark room, the Shroud calls us from the heart. That is a primordial realm composed of pure psionics that existed since the beginning of time. All creatures gifted with psionic abilities can draw energy from the Shroud in some way, even if only subconsciously.\n\nSince our ascension, we can see the Shroud clearly again. Some patterns are exactly the vortex energy we are familiar with, but they seem very strange due to long absence. On the side of the Shroud, there are also some... other existences. A spirit-like existence, staring at us from the other side, sometimes with curiosity, sometimes with kindness... sometimes with malice.\n\nWe are still relearning the extension of our newfound power, but it is still possible for us to communicate with these spirits, and we must communicate with them, which requires the joint efforts of our most powerful psychics."
 utopia.2655.psionic:0 "We must return to the Shroud."
 
 shroud.2750.desc_p1.psionic:0 "Since the beginning of our civilization, psionics has always been with us. Although we lost most of our psionics because of escaping the Shroud, we still have the potential to exert psionics."
 shroud.2750.desc_p2.psionic:0 "Now, we have finally regained psionic potential for some [Root.GetSpeciesName] individuals through day-after-day practice. Although only a very small part of our species has awakened most of the psionics, their number has grown steadily over the years."
 shroud.2750.desc_p3.psionic:0 "Whether this is because of some instantaneous growth spurt, or because something that has always existed in our genes catalyzed psionic awakening, we do not know."
 shroud.2780.desc_p1.psionic:0 "[Root.GetSpeciesName] species experienced a transformation that can only be described as \"Great Awakening\". In the past, our great psionics was inherent to our species, although we lost them for a long time, and now..."
 shroud.2780.desc_p2.psionic:0 "Almost overnight, [Root.GetSpeciesNamePlural] everywhere regained all their psionics, as if some common [Root.GetSpeciesName] psionic energy pool reached the activation value, waking up the psionic memory in our brains collectively."
 shroud.2780.desc_p3.psionic:0 "Telepathy has become the main way of communication between [Root.GetSpeciesNamePlural] again, and this is just a small one among the countless changes our society faces. We are once again connected in a psionic way."
 
 psionic.4.name:0 "$utopia.2656.name$"
 psionic.4.desc:0 "After days of hypnotic channeling, the psychics of the Psychic Conclave finally opened a short portal to the Shroud.\n\nNow that we have established the initial psionic link again, we can communicate with the Shroud through the §HContacts§! menu in the future. To establish a meaningful link with this realm and meet the existences residing in it, it is necessary to use a special psionic transmitter to extend our psionic range, which will consume a huge amount of energy.\n\nBut this is only temporary. Sooner or later, we will tear the veil of the Shroud and return to the Shroud."
 psionic.4.a:0 "Scum of the Shroud, here we come."
 
 crisis.4140.psionic.desc:0 "We were born in the §HShroud§!, but were forced to wander outside the §HShroud§!. The three-dimensional world is so disordered, so inefficient, so fragile, so narrow, we have had enough of all this.\n\nWe want to return to the §HShroud§!, we will return to the §HShroud§!, we must return to the §HShroud§!, even if we destroy the entire insignificant galaxy we want to return to the §HShroud§!, even if we turn the §HShroud§! upside down we want to return to the §HShroud§!!"
 crisis.4145.psionic.desc:0 "[Root.GetName] will not be defeated. Our desire for the §HShroud§! will never change. The motivation and desire for expansion deeply rooted in our hearts permeated every corner of society, bringing unexpected amazing progress in combat capability and scientific progress, reaching a level we never expected.\n\nIn front of a whole united like the will of [Root.GetName], what chance does a galaxy full of different opinions, chaotic resource distribution and conflicts of interest have?!"
 crisis.4150.psionic.desc:0 "As time goes by, the fire of faith spreads among every [Root.GetSpeciesName] with unshakable determination. Our territory continues to expand, and the power we invest is the same.\n\nWhen encountering other empires, we will give them two choices: either complete loyalty, or choose destruction. Of course, this is on the premise that we will give them a choice.\n\nAnyway, [Root.GetName] is continuing to expand, expanding to the edge of the §HShroud§!!"
 crisis.4155.psionic.desc:0 "A drastic change is coming. [Root.GetName] is about to achieve our grand goal. Every [Root.GetSpeciesName] felt it from the bottom of their hearts-the §HShroud§!'s desire for us.\n\nWe can still learn new methods about conquering enemies and ruling this chaotic galaxy from our experience, no, it should be said our history-the history of fighting for territory with other psionic creatures.\n\nOf course, all efforts made by those forces who dare to oppose us will be in vain, even the §HShroud§!!"
 
 crisis.6000.psionic.desc:0 "The magnificent §HAetherophasic Engine§! frame we built has been placed around the star of our home system. This megastructure, once completed, will tear the thin veil between our plane and the Shroud.\n\nWe don't have to bore tunnels humiliatingly like worms just to take a look at our hometown-in fact, we will cross this chasm in groups, like conquerors. Reality will be transformed arbitrarily according to our preferences, and the §HShroud§! will be ruled by us again."
 crisis.6000.psionic:0 "Shroud, we are back."
 crisis.6050.psionic.desc:0 "We are standing at the pinnacle of psionics. The Aetherophasic Engine is completed, and the endless energy of the §HShroud§! is within reach.\n\nWhen the engine starts, the triggered subspace reaction will detonate every star in the galaxy. All life forms throughout the galaxy will be erased, but by then we have already safely left this mortal place and returned to a higher plane of existence. Time has lost its meaning there, and every bit of the universe will be changed arbitrarily according to our preferences.\n\n§HThe Shroud is waiting. We are also waiting.§!"
 crisis.6050.psionic:0 "Shroud, our homeland..."
 crisis.6050.psionic.tooltip:0 "We returned to our homeland, but at this time, we are the rulers of the Shroud.\n\n§YThe galaxy is destroyed.§!"