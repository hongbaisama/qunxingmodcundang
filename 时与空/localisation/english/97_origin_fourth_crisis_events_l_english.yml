l_english:
 fourth_crisis.0.name:0 "The Fourth Crisis: §RSource§!"
 fourth_crisis.0.desc:0 "Detected a country using §RThe Fourth Crisis§! origin (this country obtains massive technology, resources and enables ['concept_ap_become_the_crisis']) in this game.\n\nIf you do not want it to take effect, please choose to disable this origin (the country will not trigger origin events and will switch to §YProsperous Unification§! origin)."
 fourth_crisis.0.a:0 "§REnable this origin.§!"
 fourth_crisis.0.b:0 "§GDisable this origin.§!"
 fourth_crisis.1.name:0 "The Fourth Crisis: §RAwakening§!"
 fourth_crisis.1.desc:0 "We are the powerful Fourth Crisis!\n\nNeutron Sweep, World Cracker, Forced Labor, Grid Amalgamation, we call this efficiency!"
 fourth_crisis.1.a:0 "~ key Awakening!"
 fourth_crisis.2.name:0 "The Fourth Crisis: §YAwakening§!"
 fourth_crisis.2.desc:0 "Coming, coming...\n\nThe Fourth Crisis... they are coming!"
 fourth_crisis.2.a:0 "We will definitely go all out!"
 fourth_crisis.4.name:0 "The Fourth Crisis: §YDestruction§!"
 fourth_crisis.4.desc:0 "The Fourth Crisis finally ushered in demise.\n\nAs the destroyer of the Fourth Crisis, we have the right to celebrate this, we have the right to revel in this!"
 fourth_crisis.4.a:0 "The galaxy finally ushered in peace!"
 fourth_crisis.4.b:0 "§RI am my own Crisis!§!"
 fourth_crisis.5.name:0 "The Fourth Crisis: §YPeace§!"
 fourth_crisis.5.desc:0 "The Fourth Crisis finally ushered in demise.\n\nThis is the light we see through perseverance, this is the result of the galaxy working together, this is the inevitability revealed by history unchanged since ancient times!"
 fourth_crisis.5.a:0 "Cheer for the peace of the galaxy!"
 fourth_crisis.6.name:0 "The Fourth Crisis: §YCrown§!"
 fourth_crisis.6.desc:0 "The Fourth Crisis finally ushered in demise, but another Fourth Crisis put on the crown.\n\nThe Fourth Crisis... they are here again!"
 fourth_crisis.6.a:0 "The dragon slayer eventually becomes the evil dragon..."