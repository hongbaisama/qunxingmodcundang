 contract.1.name:0 "Whisper Murmur"
 contract.1.desc:0 "§Y\"The time has come, what do you seek?\"§!\n\nThis whisper echoed in the minds of all our citizens without warning."
 contract.1.a:0 "Who are you?"
 contract.2.desc:0 "§Y\"Born in the morning and die in the evening, sad and lamentable.\nPromiser responds, promiser forgets.\nAncient contract, redeemed today.\nI am Whisper, what do you seek?\"§!"
 contract.2.a:0 "Promise? Contract?"
 contract.3.desc:0 "§Y\"Whisper awakens, [GetContractReplacedPatron] slumbers.\nMayfly shakes tree, Shroud changes.\nAncient people concluded contract, present people receive grace.\nThe time has come, what do you seek?\"§!"
 contract.3.a:0 "We don't know what we crave either."
 contract.4.desc:0 "§Y\"Your reply, I have listened.\nSeeking nothing is also desire.\nPath of exploration, long and obstructed.\nI am Whisper, contract concluded.\"§!"
 contract.4.a:0 "We seem to have wasted a wish..."
 contract.4.a.response:0 "This whisper no longer murmurs, but we seem to have gained something."
 contract.5.desc:0 "§Y“开启大门，拥抱真谛。\n心之所向，触手可及。”§!"
 contract.5.a:0 "开启大门，拥抱真谛。"
 contract.5.b:0 "心之所向，触手可及。"
 contract.5.response:0 "这串低语已不再呢喃，但我们口中仍不断传颂。"
 contract.5.tooltip:0 "Unlock §Y$tradition_psionics_shroud$§! Tradition Tree"
 
 shroud.2750.desc_p1.contract:0 "Since the beginning of our civilization, there have been many legends of [This.GetSpeciesNamePlural] with extraordinary abilities-they can invade others' minds, lift heavy objects with their minds, or perform various supernatural feats, etc."
 shroud.2750.desc_p2.contract:0 "With the appearance of the whisper, the existence of this unique ability also has an explanation-coming from a certain contract concluded by our distant ancestors. Nevertheless, only a small part of [This.GetSpeciesWord] showed this power of \"psionics\"."
 shroud.2750.desc_p3.contract:0 "The ceaseless whisper seems to be the key to liberating our full power. If [This.GetAdjective]'s entire society can unlock these potential abilities, we can begin to control dimensions beyond ordinary understanding."
 shroud.2750.a.contract:0 "We crave more whispers."
 
 shroud.2780.desc_p1.contract:0 "Our psionic research continues steadily. Telepathy has replaced most verbal communication between people, and telekinesis may become common. [Owner.GetResearchers] claim that we will soon be able to awaken potential power for all [Owner.GetSpeciesAdj] pops."
 shroud.2780.desc_p2.contract:0 "With the opening of the mind and the spreading of whispers, we sensed some indescribable power echoing in our bodies and surroundings. The forefront [Owner.GetTelepathPlural] mentioned the §HShroud§!, which is the root realm where all psionic [Owner.GetIndividualNamePlural] draw power, even if they didn't realize it-this is the home of many entities composed of pure psionic energy. Like whispers in a dark room, they call us from the heart."
 shroud.2780.desc_p3.contract:0 "By condensing our minds together, perhaps we can communicate with these existences, or even catch a glimpse of the true face of the whisper-but first we have to learn to break through the veil lying between our dimension and the Shroud."
 shroud.2780.a.contract:0 "Whispers also crave us."
 
 shroud.2800.desc.contract:0 "$shroud.2800.intro$Our actions affect psionic flow, and invisible entities stare at us from the other side. They are sometimes curious, sometimes friendly... sometimes malicious. But in any case, whispers will always welcome us.\n\nOur mastery of psionics in the real world is just a beginning. Behind the opened gate of the Shroud, the whispers of the void wrapped countless wills murmuring to us-They crave more, more."
 shroud.2800.a.contract:0 "More... more..."
 
 contract.100.name:0 "What is Sought"
 contract.100.desc:0 "Our connection with §Y$the_eater_of_worlds$§! has reached its peak, but we are not satisfied with His grace.\nWe offer it to the whisper, and voices of the Shroud instantly swallowed this spiritual domain.\n\n§Y$the_eater_of_worlds$§! asked in a familiar voice:\n§Y\"I am Eater, what do you seek?\"§!"
 contract.200.desc:0 "Our connection with §Y$the_cradle_of_souls$§! has reached its peak, but we are not satisfied with Her grace.\nWe offer it to the whisper, and voices of the Shroud instantly swallowed this spiritual domain.\n\n§Y$the_cradle_of_souls$§! asked in a familiar voice:\n§Y\"I am Cradle, what do you seek?\"§!"
 contract.300.desc:0 "Our connection with §Y$the_instrument_of_desire$§! has reached its peak, but we are not satisfied with Its grace.\nWe offer it to the whisper, and voices of the Shroud instantly swallowed this spiritual domain.\n\n§Y$the_instrument_of_desire$§! asked in a familiar voice:\n§Y\"I am Instrument, what do you seek?\"§!"
 contract.400.desc:0 "Our connection with §Y$the_composer_of_strands$§! has reached its peak, but we are not satisfied with Its grace.\nWe offer it to the whisper, and voices of the Shroud instantly swallowed this spiritual domain.\n\n§Y$the_composer_of_strands$§! asked in a familiar voice:\n§Y\"I am Composer, what do you seek?\"§!"
 contract.100.a:0 "What we crave is..."
 
