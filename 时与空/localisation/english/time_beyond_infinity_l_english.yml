 beyond_infinity_time_crisis_description: "Those in the Galactic Community who seek to see the future in the river of history have long envisioned a §RCrisis§! that will descend-a life-and-death crisis for all intelligent life, which can only be overcome by relying on unprecedented unity and stepping forward one after another-if it is really possible to overcome.\n\nPopular predictions about the nature of this crisis are quite whimsical, such as extra-galactic predator invasion, or machine intelligence prairie fire in the galaxy, or succession wars from other planes spreading, but...\n\nLittle known is that the countdown to §RThe End§! has already begun.\n\n$ap_beyond_infinity_desc$"
