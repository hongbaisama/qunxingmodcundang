 # 飞升路线
 concept_nanotech_ascension: "Nanotech Ascension"
 concept_nanotech_ascension_desc: "By integrating nanobots, it is possible to become a nanite swarm devouring the entire sea of stars, where one is all."
 
 concept_modularity_ascension: "Modularity Ascension"
 concept_modularity_ascension_desc: "By perfecting the component replacement protocol, it is possible to understand the principle of chassis operation and understand where we come from."
 
 concept_crisis_ascension: "Crisis Ascension"
 concept_crisis_ascension_desc: "$concept_crisis_ascension$: \n-['concept_ap_become_the_crisis']\n-['concept_ap_cosmogenesis']\n-['concept_ap_behemoths']"
 
 # 修正
 concept_building_akx_research_decay_white: "§W$concept_building_akx_research_decay$§!"
 concept_building_akx_research_decay: "Inverse Phase Observation Disorder"
 concept_building_akx_research_decay_desc: "Simultaneous high-frequency and large-scale observation of the Inverse Plane may lead to serious Inverse Phase disorder and hinder our deepening into the Inverse Phase.\n\nTo avoid potential disasters, each £building£§Y$building_horror_research$ series building§! will split the bonus to the planet equally."
 
 concept_building_akx_computer_decay_white: "§W$concept_building_akx_computer_decay$§!"
 concept_building_akx_computer_decay: "Inverse Phase Interference Disorder"
 concept_building_akx_computer_decay_desc: "Simultaneous high-frequency and large-scale interference with the Inverse Plane may lead to serious Inverse Phase disorder and hinder our deepening into the Inverse Phase.\n\nTo avoid potential disasters, each £building£§Y$building_horror_computer$ series building§! will split the bonus to the planet equally."
 
 concept_building_akx_monument_decay_white: "§W$concept_building_akx_monument_decay$§!"
 concept_building_akx_monument_decay: "Inverse Phase Memory Disorder"
 concept_building_akx_monument_decay_desc: "Simultaneous high-frequency and large-scale memory of the Inverse Plane may lead to serious Inverse Phase disorder and hinder our deepening into the Inverse Phase.\n\nTo avoid potential disasters, each £building£§Y$building_horror_monument$ series building§! will split the bonus to the planet equally."
 
 concept_building_akx_forecast_decay_white: "§W$concept_building_akx_forecast_decay$§!"
 concept_building_akx_forecast_decay: "Inverse Phase Perception Disorder"
 concept_building_akx_forecast_decay_desc: "Simultaneous high-frequency and large-scale perception of the Inverse Plane may lead to serious Inverse Phase disorder and hinder our deepening into the Inverse Phase.\n\nTo avoid potential disasters, each £building£§Y$building_horror_forecast$ series building§! will split the bonus to the planet equally."
 
 # 地块
 concept_time_gaia_deposit: "Gaia World Exclusive Features"
 concept_time_gaia_deposit_desc: "These are planetary features exclusive to Gaia Worlds. All Gaia planets will randomly possess one of them, and will provide additional bonuses due to §Y$ap_world_shaper$§!.\n\n$concept_time_gaia_deposit$:\n-['concept_d_time_gaia_energy']\n-['concept_d_time_gaia_minerals']\n-['concept_d_time_gaia_food']"
 
 concept_d_time_gaia_energy: "$d_time_gaia_energy$"
 concept_d_time_gaia_energy_desc: "-$mod_district_generator_max_add$: §G+5§!\n-$mod_district_generator_max_mult$: §G+50%§!\n-$mod_job_technician_max_workforce_mult$: §G+50%§!\n-Per $PLANET_SIZE$ causes:\n$tt$-$mod_country_energy_produces_mult$: §G+2%§!\n$tt$-$mod_country_physics_research_produces_mult$: §G+1%§!\n-$ap_world_shaper$ causes:\n$tt$-$mod_planet_technician_energy_produces_add$: §G+2§!\n$tt$-$mod_planet_technician_physics_research_produces_add$: §G+1§!\n$tt$-$mod_planet_technician_volatile_motes_produces_add$: §G+0.5§!\n$tt$-$mod_district_generator_max_add$: §G+5§!\n$tt$-$mod_district_generator_max_mult$: §G+50%§!\n$tt$-$mod_job_technician_max_workforce_mult$: §G+50%§!\n$h_line$§L$d_time_gaia_energy_desc$§!"
 
 concept_d_time_gaia_minerals: "$d_time_gaia_minerals$"
 concept_d_time_gaia_minerals_desc: "-$mod_district_mining_max_add$: §G+5§!\n-$mod_district_mining_max_mult$: §G+50%§!\n-$mod_job_miner_max_workforce_mult$: §G+50%§!\n-Per $PLANET_SIZE$ causes:\n$tt$-$mod_country_minerals_produces_mult$: §G+2%§!\n$tt$-$mod_country_engineering_research_produces_mult$: §G+1%§!\n-$ap_world_shaper$ causes:\n$tt$-$mod_planet_miners_minerals_produces_add$: §G+2§!\n$tt$-$mod_planet_miners_engineering_research_produces_add$: §G+1§!\n$tt$-$mod_planet_miners_rare_crystals_produces_add$: §G+0.5§!\n$tt$-$mod_district_mining_max_add$: §G+5§!\n$tt$-$mod_district_mining_max_mult$: §G+50%§!\n$tt$-$mod_job_miner_max_workforce_mult$: §G+50%§!\n$h_line$§L$d_time_gaia_minerals_desc$§!"
 
 concept_d_time_gaia_food: "$d_time_gaia_food$"
 concept_d_time_gaia_food_desc: "-$mod_district_farming_max_add$: §G+5§!\n-$mod_district_farming_max_mult$: §G+50%§!\n-$mod_job_farmer_max_workforce_mult$: §G+50%§!\n-Per $PLANET_SIZE$ causes:\n$tt$-$mod_country_food_produces_mult$: §G+2%§!\n$tt$-$mod_country_society_research_produces_mult$: §G+1%§!\n-$ap_world_shaper$ causes:\n$tt$-$mod_planet_farmers_food_produces_add$: §G+2§!\n$tt$-$mod_planet_farmers_society_research_produces_add$: §G+1§!\n$tt$-$mod_planet_farmers_exotic_gases_produces_add$: §G+0.5§!\n$tt$-$mod_district_farming_max_add$: §G+5§!\n$tt$-$mod_district_farming_max_mult$: §G+50%§!\n$tt$-$mod_job_farmer_max_workforce_mult$: §G+50%§!\n$h_line$§L$d_time_gaia_food_desc$§!"
 
 # 星球类型
 concept_pc_hive: "$pc_hive$"
 concept_pc_hive_desc: "-$trait_hive_mind$ Habitability: §Y100%§!\n-$mod_planet_jobs_produces_mult$: §G+10%§!\n-$MOD_PLANET_RESETTLEMENT_UNEMPLOYED_DESTINATION_MULT$: §G+50%§!\n-No limit on number of ['concept_generator_district', £district£$district_generator$], ['concept_mining_district', £district£$district_mining$], ['concept_farming_district', £district£$district_farming$]\n\n§L$pc_hive_desc$§!"
 
