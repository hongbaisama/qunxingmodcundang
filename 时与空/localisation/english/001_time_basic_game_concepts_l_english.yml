 concept_tech_time_trait_purple: "§MInverse Phase Trait§!"
 concept_tech_time_trait: "Inverse Phase Trait"
 concept_tech_time_trait_desc: "These are unique genes and weird components reverse-engineered from the Inverse Plane and Nightmares of the Plane. Should we really apply them to ourselves?\n\n$concept_tech_time_trait$:\n$t$['concept_trait_akx_low_dimensional_adaptor']\n$t$['concept_trait_akx_low_dimensional_adaptor_robot']\n$t$['concept_trait_akx_high_dimensional_extender']\n$t$['concept_trait_akx_high_dimensional_extender_robot']\n$t$['concept_trait_akx_spatial_entity']\n$t$['concept_trait_akx_spatial_entity_robot']\n$t$['concept_trait_akx_time_incorporeality']\n$t$['concept_trait_akx_time_incorporeality_robot']\n$t$['concept_trait_akx_concentrator']\n$t$['concept_trait_akx_concentrator_robot']\n$t$['concept_trait_akx_diffuser']\n$t$['concept_trait_akx_diffuser_robot']\n$t$['concept_trait_akx_spiritual_radiator']\n$t$['concept_trait_akx_spiritual_radiator_robot']\n$t$['concept_trait_akx_body_folder']\n$t$['concept_trait_akx_body_folder_robot']"
 
