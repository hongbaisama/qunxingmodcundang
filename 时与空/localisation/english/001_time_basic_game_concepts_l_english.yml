l_english:
 # 负相时空
 concept_horror_time: "§MInverse Spacetime§!"
 concept_horror_time_desc: "§MInverse Spacetime§! is a general term for a type of mysterious technology, mainly coming from our research on the §MInverse Plane§!. Although its basis and results may be very different, this is the true reality of the §MInverse Plane§!.\n\n§MInverse Spacetime§! is a special type of technology that will never appear naturally, but after each research completion, it is possible to obtain research options that meet the conditions.\nActivating §Y$r_horror_matter$§!, activating §Y$r_time$§!, appointing leaders with ['concept_has_horror_time_knowledge'] for research, increasing ['concept_category_horror_time_draw_chance_mult'], etc., can §Gincrease§! the §Yprobability§! of obtaining research options."
 
 concept_has_horror_time_knowledge: "Possess Inverse Phase Knowledge"
 concept_has_horror_time_knowledge_desc: "This represents that the leader possesses certain unique knowledge about ['concept_horror_time'].\n\nThe leader must meet one of the following conditions:\n-Learned any §YInverse Phase Mystery§!\n-Experienced §YBlack Hole Traversal§!\n-Has §Y$leader_trait_time_soul$§! trait\n-Has ['concept_leader_trait_equinox_seal'] trait\n-Has §Y$leader_trait_horror_focus$§! trait\n-Has §Y$leader_trait_expertise_horror_time$§! trait\n-Has §Y$leader_trait_dimensional_horror_weapon_specialization$§! trait\n-Has §YDimension Traveler Destiny Trait§!\n-Has §Y$leader_trait_dimension_traveler_brief$§! trait"
 
 concept_category_horror_time_research_speed_mult_white: "§WResearch Speed (§YInverse Spacetime§!)§!"
 concept_category_horror_time_research_speed_mult: "Research Speed (Inverse Spacetime)"
 concept_category_horror_time_research_speed_mult_desc: "This represents our mastery of ['concept_horror_time'], which can §Gspeed up§! our §YResearch Speed§! on related technologies, and also §Greduce§! the §YLaunch Requirement§! of related agendas."
 
 concept_category_horror_time_draw_chance_mult_white: "§WProbability of §YInverse Spacetime§! Options§!"
 concept_category_horror_time_draw_chance_mult: "Probability of Inverse Spacetime Options"
 concept_category_horror_time_draw_chance_mult_desc: "This represents our understanding of ['concept_horror_time'], which can §Gincrease§! the §Yprobability§! of obtaining technology options in related fields."
 
 concept_can_approach_black_hole: "Touch Horizon Edge"
 concept_can_approach_black_hole_desc: "This represents that the leader has the ability to work close to a Black Hole and can perform tasks that other regular leaders cannot complete.\n\nThe leader must meet one of the following conditions:\n-Species has ['concept_trait_time'] trait\n-Species has ['concept_trait_time_soul'] trait\n-Species has ['concept_trait_origin_black_hole'] trait\n-Species has ['concept_trait_dimension_traveler'] trait\n-Species has ['concept_trait_akx_messenger'] trait\n-Species has ['concept_trait_akx_waiting_world_all'] trait\n-Species has ['concept_tech_time_trait']\n-Leader ['concept_has_horror_time_knowledge']"
 
 # 终末行舟
 concept_time_titan_desc: "According to the database of the Omega Ark, a large number of Omega Arks participated in the escape plan, but most of them fell due to unavoidable fate. Only a very few successfully reached different planes, and only this one was accepted by our universe.\nThe construction of Omega Arks is not batch, depending on the capabilities of the designers and assemblers, the strength that different Omega Arks can exert also varies-in other words, each Omega Ark is unique.\n\n"
 
 concept_exceptional_time_titan_color: "§3$concept_exceptional_time_titan$§!"
 concept_exceptional_time_titan: "$exceptional$"
 concept_exceptional_time_titan_desc: "$concept_time_titan_desc$$concept_exceptional_time_titan$ Rarity causes:\n$t$Omega Ark Part Upgrade Effect: §G+100%§!\n$t$Beyond Shelter Upgrade Effect: §G+100%§!"
 
 concept_epic_time_titan_color: "§2$concept_epic_time_titan$§!"
 concept_epic_time_titan: "$epic$"
 concept_epic_time_titan_desc: "$concept_time_titan_desc$$concept_epic_time_titan$ Rarity causes:\n$t$Omega Ark Part Upgrade Effect: §G+80%§!\n$t$Beyond Shelter Upgrade Effect: §G+80%§!"
 
 concept_rare_time_titan_color: "§1$concept_rare_time_titan$§!"
 concept_rare_time_titan: "$rare$"
 concept_rare_time_titan_desc: "$concept_time_titan_desc$$concept_rare_time_titan$ Rarity causes:\n$t$Omega Ark Part Upgrade Effect: §G+40%§!\n$t$Beyond Shelter Upgrade Effect: §G+40%§!"
 
 concept_common_time_titan_color: "§0$concept_common_time_titan$§!"
 concept_common_time_titan: "$common$"
 concept_common_time_titan_desc: "$concept_time_titan_desc$$concept_common_time_titan$ Rarity causes:\n$t$Omega Ark Part Upgrade Effect: §Y+0%§!\n$t$Beyond Shelter Upgrade Effect: §Y+0%§!"
 
 concept_time_titan_best_status_color: "§M$concept_time_titan_best_status$§!"
 concept_time_titan_best_status: "Destined Cycle"
 concept_time_titan_best_status_desc: "The Omega Ark is piloted by the Dimension Traveler who is The Captain that Will Be. She will break the destined cycle of the End for us.\n\n$concept_time_titan_best_status$ Status causes:\n$t$$unlock_time_titan_component_upgrade$\n$t$Omega Ark Upgrade Effect Multiplier: §Y100%§!\n$t$Omega Ark Curse Effect Multiplier: §R0%§!"
 
 concept_time_titan_good_status_color: "§H$concept_time_titan_good_status$§!"
 concept_time_titan_good_status: "Future Deviation"
 concept_time_titan_good_status_desc: "The Omega Ark is piloted by The Captain that Will Be, and the future leading to the End deviates from here.\n\n$concept_time_titan_good_status$ Status causes:\n$t$Omega Ark Upgrade Effect Multiplier: §Y100%§!\n$t$Omega Ark Curse Effect Multiplier: §R0%§!"
 
 concept_time_titan_normal_status_color: "§B$concept_time_titan_normal_status$§!"
 concept_time_titan_normal_status: "Causal Protection"
 concept_time_titan_normal_status_desc: "The Omega Ark is piloted by the Dimension Traveler. Intertwined causality obtains protection in the End.\n\n$concept_time_titan_normal_status$ Status causes:\n$t$Omega Ark Upgrade Effect Multiplier: §Y50%§!\n$t$Omega Ark Curse Effect Multiplier: §R0%§!"
 
 concept_time_titan_bad_status_color: "§R$concept_time_titan_bad_status$§!"
 concept_time_titan_bad_status: "Curse of the End"
 concept_time_titan_bad_status_desc: "The Omega Ark is not piloted by a suitable commander, and the curse of the End is gradually corroding it.\n\n$concept_time_titan_bad_status$ Status causes:\n$t$Omega Ark Upgrade Effect Multiplier: §Y0%§!\n$t$Omega Ark Curse Effect Multiplier: §R100%§!"
 
 concept_time_shelter_maintenance_white: "§W$concept_time_shelter_maintenance$§!"
 concept_time_shelter_maintenance_yellow: "§Y$concept_time_shelter_maintenance$§!"
 concept_time_shelter_maintenance: "Beyond Maintenance"
 concept_time_shelter_maintenance_desc: "彼岸并非终末行舟的内部空间，而是借助终末行舟扭曲奇点可以抵达的不计其数的混沌之一。因此，彼岸与现世的物质交换与信息流通必须依靠专门的设施维持，该维持效率即为彼岸维系度。\n\n提高彼岸维系度可以令彼岸庇护所§Y产出的资源§!与§Y提供的修正§!更§G完整§!地增益于我们的帝国。\n\n§Y$concept_time_shelter_maintenance$§!无法超过['concept_time_shelter_maintenance_cap']"
 
 concept_time_shelter_maintenance_cap_white: "§W$concept_time_shelter_maintenance_cap$§!"
 concept_time_shelter_maintenance_cap: "Beyond Maintenance Cap"
 concept_time_shelter_maintenance_cap_desc: "现世与彼岸的维系效率并非无上限，这受我们的维系设施性能与彼岸的总体环境影响。\n\n['concept_time_shelter_maintenance']无法超过§Y$concept_time_shelter_maintenance_cap$§!"
 
 # 位面之鳞
 concept_dimensional_horror_damage_reduction: "Abyssal Scales"
 concept_dimensional_horror_damage_reduction_desc: "The Dimensional Horror is covered in eerie Abyssal Scales, and the temporal and spatial distortions it causes can protect it from most of the damage it receives.\n\n§Y$dimensional_horror_voidworms$§! due to the $FE_DIFFICULTY$ at most produces: \n$t$-$MOD_SHIP_DAMAGE_REDUCTION_MULT$：§G+10%§!\n\n§Y$dimensional_horror$§! due to the $FE_DIFFICULTY$ at most produces: \n$t$-$MOD_SHIP_DAMAGE_REDUCTION_MULT$：§G+25%§!\n\n§Y$dimensional_horror_crisis$§! due to the $FE_DIFFICULTY$ at most produces: \n$t$-$MOD_SHIP_DAMAGE_REDUCTION_MULT$：§G+50%§!\n\n§Y$dimensional_horror_destiny$§! due to the $FE_DIFFICULTY$ at most produces: \n$t$-$MOD_SHIP_DAMAGE_REDUCTION_MULT$：§G+100%§!\n\n§RThis component will not produce the above effect when assembled on ships other than Dimensional Horror!§!"
 
 # 负相武器负面概率
 concept_horror_weapon_debuff_chance: "负相武器负面概率"
 concept_horror_weapon_debuff_chance_short: "chance"
 concept_horror_weapon_debuff_chance_desc: "研究£physics ['concept_tech_horror_focus_1']科技后，绝大多数负相武器可以造成['concept_confusion']或['concept_terrify']，其施加负面效果的概率受到以下影响：\n$t$—拥有['concept_ap_horror']飞升：§G×2§!\n$t$—拥有['concept_ap_time']飞升：§G×1.5§!\n$t$—装配于['concept_biological_ship']或['concept_space_fauna']：§R×0.5§!"
 
 # 特质
 concept_time_ruler_trait_green: "§G$concept_time_ruler_trait$§!"
 concept_time_ruler_trait_red: "§R$concept_time_ruler_trait$§!"
 concept_time_ruler_trait: "Origin Ruler Trait"
 concept_time_ruler_trait_desc: "This is a ruler §dDestiny Trait§! exclusive to §HTime and Space§! mod origins. Only the §YRuler§! or §YHeir§! of the corresponding origin can obtain it, and it can only take §Geffect§! when acting as §YRuler§!.\n\nThe bonus values of such traits are generally related to §Y$MOD_LEADER_SKILL_ADD$§!, §Y$MOD_COUNCILOR_SKILL_ADD$§!, §Y$MOD_RULER_SKILL_ADD$§!."
 
 concept_time_node_trait_green: "§G$concept_time_node_trait$§!"
 concept_time_node_trait_red: "§R$concept_time_node_trait$§!"
 concept_time_node_trait: "Origin Node Trait"
 concept_time_node_trait_desc: "This is a node §dDestiny Trait§! exclusive to §HTime and Space§! mod origins. Only the §YGestalt Node§! of the corresponding origin can obtain it, and it can only take §Geffect§! when acting as §YGestalt Node§!.\n\nThe bonus values of such traits are generally related to §YEffective Node Skill Level§!, §Y$MOD_COUNCILOR_SKILL_ADD$§!."
 
 concept_time_inborn_legendary_trait: "§lLegendary Leader Exclusive Trait§!"
 concept_time_inborn_legendary_trait_desc: "This is a §dDestiny Trait§! added by the §HTime and Space§! mod for all §lLegendary Leaders§! (including other mods), but leaders promoted through the ['concept_origin_legendary_worship'] origin will not obtain this trait.\n\nThe bonus focus of this trait is related to §YLeader Class§!, the bonus value is related to §Y$MOD_LEADER_SKILL_ADD$§!, and the ['concept_origin_legendary_worship'] origin will §Gdouble§! the effect of this trait."
 
 concept_time_inborn_renowned_trait: "§rRenowned Leader Exclusive Trait§!"
 concept_time_inborn_renowned_trait_desc: "This is a §dDestiny Trait§! added by the §HTime and Space§! mod for all §rRenowned Leaders§! (including other mods), but leaders promoted through the ['concept_origin_legendary_worship'] origin will not obtain this trait.\n\nThe bonus focus of this trait is related to §YLeader Class§!, the bonus value is related to §Y$MOD_LEADER_SKILL_ADD$§!, and the ['concept_origin_legendary_worship'] origin will §Gdouble§! the effect of this trait."
 
 concept_akx_messenger_species_trait: "Messenger Trait"
 concept_akx_messenger_species_trait_desc: "Messengers may be their ancestors or their future, but in any case, this species has accepted this reality and actively enjoys the advantages brought by the Messenger bloodline.\n\n$concept_akx_messenger_species_trait$:\n$t$['concept_trait_akx_messenger']\n$t$['concept_trait_akx_waiting_world_all']"
 
