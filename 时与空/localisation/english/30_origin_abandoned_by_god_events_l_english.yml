l_english:
 origin_abandoned_by_god.4.name:0 "Time for Revenge"
 origin_abandoned_by_god.4.desc:0 "Finally, the moment of revenge has come.\n\nWe will never forget the humiliating history suffered hundreds of years ago. Now, we will personally tear open the gate of the Shroud and let the arrogant god know who is the ignorant plaything."
 origin_abandoned_by_god.4.a:0 "We will not be abandoned by anyone again."
 
 crisis.4140.abandoned_by_god.desc:0 "This is just the first step of our road to revenge.\n\nIn the past few years, we have asked ourselves more than once: God gave us everything, and took it away one by one. Is our revenge just? We cannot answer this question for the time being, but we will not stop the pace of revenge, because we will eventually find the answer."
 crisis.4145.abandoned_by_god.desc:0 "[Root.GetName] will not be defeated. Our desire for §HRevenge§! will never change. The motivation and desire for expansion deeply rooted in our hearts permeated every corner of society, bringing unexpected amazing progress in combat capability and scientific progress, reaching a level we never expected.\n\nIn front of a whole united like the will of [Root.GetName], even the former god will be shocked, right?"
 crisis.4150.abandoned_by_god.desc:0 "As time goes by, the fire of faith spreads among every [Root.GetSpeciesName] with unshakable determination. Our territory continues to expand, and the power we invest is the same.\n\nWhen encountering other empires, we will give them two choices: either complete loyalty, or choose destruction. Of course, this is on the premise that we will give them a choice.\n\nAnyway, [Root.GetName] is continuing to expand, expanding to the territory of §HGod§!!"
 crisis.4155.abandoned_by_god.desc:0 "A drastic change is coming. [Root.GetName] is about to achieve our grand goal. Every [Root.GetSpeciesName] felt it from the bottom of their hearts-§HTime for Revenge§! is gradually approaching.\n\nWe can still learn new methods about conquering enemies and ruling this chaotic galaxy from our experience, no, it should be said our history-the history of accepting God's favor.\n\nOf course, all efforts made by those forces who dare to oppose us will be in vain, even §HGod§!!"
 
 crisis.6000.abandoned_by_god.desc:0 "The magnificent §HAetherophasic Engine§! frame we built has been placed around the star of our home system. This megastructure, once completed, will tear the thin veil between our plane and the Shroud.\n\nWe don't have to endure the humiliating history of being playthings, lingering on a small ball-in fact, we will cross this chasm in groups, like conquerors. Reality will be transformed arbitrarily according to our preferences, and the status of §HGod§! will also be shaken by us."
 crisis.6000.abandoned_by_god:0 "Former God, long time no see."
 crisis.6050.abandoned_by_god.desc:0 "We are standing at the peak of humble existence. The Aetherophasic Engine is completed, and we will redefine who is the humble §HPlaything§!.\n\nWhen the engine starts, the triggered subspace reaction will detonate every star in the galaxy. All life forms throughout the galaxy will be erased, but by then we have already safely left this mortal place and returned to a higher plane of existence. Time has lost its meaning there, and every bit of the universe will be changed arbitrarily according to our preferences.\n\n§HGod is fearing, and we are shouting.§!"
 crisis.6050.abandoned_by_god:0 "Revenge needs no reason, just because you are too weak."
 crisis.6050.abandoned_by_god.tooltip:0 "We will launch the final decisive battle with the god, but no one can record the outcome.\n\n§YThe galaxy is destroyed.§!"