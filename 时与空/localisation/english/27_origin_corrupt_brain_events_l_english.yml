 origin_pure_brain:0 "Pure Mind"
 origin_pure_brain_desc:0 "['concept_function_origin_text']\nThe master mind of this Gestalt civilization has eliminated corruption, and civilization is rebuilt from past lessons and experiences."
 origin_tooltip_pure_brain_effects:0 "-The Ruler will gain the §Y$leader_trait_pure_brain$§! trait, and Nodes will gain the §Y$leader_trait_pure_node$§! trait"
