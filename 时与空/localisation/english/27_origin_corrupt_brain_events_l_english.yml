 origin_corrupt_brain.6.name:0 "Refuse Treatment"
 origin_corrupt_brain.6.desc:0 "We have made progress in saving the Corrupted Mind, but this technology is both radical and dangerous, and our Master Mind refuses to apply this technology in practice.\n\nAfter some calculation and demonstration, the Master Mind finally decided to clear corruption on the periphery of the core, but the central area is still prohibited from executing tasks."
 origin_corrupt_brain.6.a:0 "Regrettable."
 
 origin_corrupt_brain.7.name:0 "Node Cleaning"
 origin_corrupt_brain.7.desc:0 "With the development of the latest technology, we can try to clean nodes to a certain extent, which can alleviate corruption, but only temporarily."
 origin_corrupt_brain.7.a:0 "Still a long way from purifying the Master Mind."
 
 origin_corrupt_brain.8.name:0 "Pure Project"
 origin_corrupt_brain.8.desc:0 "Finally, we finally succeeded.\n\nWe have mastered advanced enough technology, which allows us to purify the Master Mind in a stable and safe way.\n\nInitially, the Master Mind was still worried about various unconsidered possibilities behind this technology, but after rigorous experiments and careful demonstration, the Master Mind's doubts were dispelled and convinced that this would completely reshape our future.\n\nThe progress of the Pure Project is foolproof. All obstacles appearing midway can be foreseen and solved easily under sufficient preparation. The Master Mind returned to normal, and even a tiny flaw was not let go by purification sub-individuals.\n\nWe welcome a brand new future."
 origin_corrupt_brain.8.a:0 "This is our future."
 
 origin_corrupt_brain.11.name:0 "Corruption Appears"
 origin_corrupt_brain.11.desc:0 "Our Master Mind is becoming bad, along with its other nodes being contaminated.\n\nAt first, we thought it was just some small malfunctions, but as time went on, more and more sub-individuals became difficult to control, and hidden dangers initially buried deep in the Master Mind are gradually revealing.\n\nBut unfortunately, we currently have no countermeasures and can only watch the corruption intensify."
 origin_corrupt_brain.11.a:0 "Bad."
 origin_corrupt_brain.12.name:0 "Corruption Spreads"
 origin_corrupt_brain.12.desc:0 "The corruption level of our Master Mind is intensifying, and the work of other nodes has also been affected.\n\nNot only the lowest sub-individuals, even some high-level sub-individuals are gradually breaking away from our control. The self-repair team is ready to go to the Master Mind to study the root of the failure, but the Master Mind thinks everything is normal and prohibits any modification to the Master Mind.\n\nWe know it exists, and the Master Mind knows too."
 origin_corrupt_brain.12.a:0 "We must do something."
 origin_corrupt_brain.13.name:0 "Corruption Spreads"
 origin_corrupt_brain.13.desc:0 "Corruption has spread throughout the empire. If we cannot end the source of corruption, we will move towards destruction.\n\nRegardless of high or low, almost all sub-individuals have experienced serious chaos. Nodes responsible for transmitting signals sent wrong signals, receiving sub-individuals executed irrelevant wrong tasks, corrupted hunting teams began to attack the few normal sub-individuals, and seemingly normal repair teams brought corruption to more nodes.\n\nWe... don't... want... to... die..."
 origin_corrupt_brain.13.a:0 "But that is... our Master Mind!"
 origin_corrupt_brain.14.name:0 "§RCorruption Corruption§!"
 origin_corrupt_brain.14.desc:0 "§RCorruption Corruption Corruption Corruption Corruption Corruption Corruption...\n\nCorruption Corruption Corruption Corruption Corruption Corruption Corruption Corruption Corruption Corruption Corruption Corruption Corruption Corruption...\n\nCorruption...§!"
 origin_corrupt_brain.14.a:0 "§RCorruption...§!"
 origin_corrupt_brain.15.name:0 "§RCorruption End§!"
 origin_corrupt_brain.15.desc_1:0 "Just as the entire empire was on the verge of extinction, our Master Mind finally agreed to apply the technology we newly mastered to eradicate corruption.\n\nBecause this technology is drastic and immature, the Master Mind determined it to be too dangerous and did not approve. But now, this is our last chance, and the Master Mind had to accept this unprecedented move. The cleanup of the Master Mind's corruption went smoothly, and the obstacles once foreseen were easily solved.\n\nFinally, the Master Mind returned to normal. Although there are still some small flaws that cannot be cured, we are sure that they can provide us with extra benefits at present, and even if corruption recurs in the future, we have the ability to repurify the Master Mind."
 origin_corrupt_brain.15.desc_2:0 "§REven if the entire... empire is on the verge of... extinction\nWe still failed... cure Master Mind... way\n\nPredictable\nWelcoming us... only endless... corruption\nAnd following... extinction!!!§!"
 origin_corrupt_brain.15.a:0 "Really hope corruption ends here."
 origin_corrupt_brain.15.b:0 "§R......§!"