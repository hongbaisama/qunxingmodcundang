l_english:
 resolution_category_beyond_infinity_emperor:0 "Time Resonance"
 resolution_beyond_infinity_emperor_repeal_1:0 "§RRepeal $resolution_beyond_infinity_emperor_1$§!"
 resolution_beyond_infinity_emperor_repeal_1_desc:0 "Even if the Imperial Council has contributed, they should not share our right of control over time."
 resolution_beyond_infinity_emperor_repeal_1_effect:0 "Repeal §Y$resolution_beyond_infinity_emperor_1$§! resolution."
 resolution_beyond_infinity_emperor_repeal_2:0 "§RRepeal $resolution_beyond_infinity_emperor_2$§!"
 resolution_beyond_infinity_emperor_repeal_2_desc:0 "Our subjects are uncontrollable. Letting them participate in resonance does more harm than good."
 resolution_beyond_infinity_emperor_repeal_2_effect:0 "Repeal §Y$resolution_beyond_infinity_emperor_2$§! resolution, make §Y$resolution_beyond_infinity_emperor_1$§! Galactic Law.\n\n$resolution_beyond_infinity_emperor_1_effect$"
 resolution_beyond_infinity_emperor_repeal_3:0 "§RRepeal $resolution_beyond_infinity_emperor_3$§!"
 resolution_beyond_infinity_emperor_repeal_3_desc:0 "Making the entire empire join Time Resonance is too dangerous. Their withdrawal does not mean the division of the empire."
 resolution_beyond_infinity_emperor_repeal_3_effect:0 "Repeal §Y$resolution_beyond_infinity_emperor_3$§! resolution, make §Y$resolution_beyond_infinity_emperor_2$§! Galactic Law.\n\n$resolution_beyond_infinity_emperor_2_effect$"
 resolution_beyond_infinity_emperor_1:0 "Council Resonance"
 resolution_beyond_infinity_emperor_1_desc:0 "The Imperial Council should contribute to the empire's path to Beyond Infinity, and they will also accept the Emperor's gift from time."
 resolution_beyond_infinity_emperor_1_effect:0 "§EImperial Council:§! $produce_beyond_infinity_time_for_emperor_1$\n\n$resolution_galactic_focus_crisis_effect_success$"
 resolution_beyond_infinity_emperor_2:0 "Subject Resonance"
 resolution_beyond_infinity_emperor_2_desc:0 "Not only the Imperial Council, but we also need resonance from all imperial subjects. This is a good thing for both them and us."
 resolution_beyond_infinity_emperor_2_effect:0 "§EImperial Council:§! $produce_beyond_infinity_time_for_emperor_2$\n\n§EImperial Subjects:§! $produce_beyond_infinity_time_for_emperor_1$"
 resolution_beyond_infinity_emperor_3:0 "Empire Resonance"
 resolution_beyond_infinity_emperor_3_desc:0 "The entire Galactic Imperium will fully join Time Resonance. We will merge into one at this moment, until eternity."
 resolution_beyond_infinity_emperor_3_effect:0 "§EImperial Subjects:§! $produce_beyond_infinity_time_for_emperor_2$"
 produce_beyond_infinity_time_for_emperor_1:0 "\nEnjoy §Yhalf§! bonus of ['concept_tech_beyond_infinity_repeatable']\n£opinion£§YOpinion§! of §RGalactic Emperor§! §G+100§!\nProduce £beyond_infinity_time£§Y$beyond_infinity_time$§! for §RGalactic Emperor§!"
 produce_beyond_infinity_time_for_emperor_2:0 "\nEnjoy §Gfull§! bonus of ['concept_tech_beyond_infinity_repeatable']\n£opinion£§YOpinion§! of §RGalactic Emperor§! §G+200§!\nProduce £beyond_infinity_time£§Y$beyond_infinity_time$§! for §RGalactic Emperor§!"
 
 resolution_category_beyond_infinity_custodian:0 "$resolution_category_beyond_infinity_emperor$"
 resolution_beyond_infinity_custodian_repeal_1:0 "§RRepeal $resolution_beyond_infinity_custodian_1$§!"
 resolution_beyond_infinity_custodian_repeal_1_desc:0 "Even if the Council has contributed, they should not share our right of control over time."
 resolution_beyond_infinity_custodian_repeal_1_effect:0 "Repeal §Y$resolution_beyond_infinity_custodian_1$§! resolution."
 resolution_beyond_infinity_custodian_repeal_2:0 "§RRepeal $resolution_beyond_infinity_custodian_2$§!"
 resolution_beyond_infinity_custodian_repeal_2_desc:0 "Member states are outwardly united but inwardly divided. Letting them participate in resonance does more harm than good."
 resolution_beyond_infinity_custodian_repeal_2_effect:0 "Repeal §Y$resolution_beyond_infinity_custodian_2$§! resolution, make §Y$resolution_beyond_infinity_custodian_1$§! Galactic Law.\n\n$resolution_beyond_infinity_custodian_1_effect$"
 resolution_beyond_infinity_custodian_repeal_3:0 "§RRepeal $resolution_beyond_infinity_custodian_3$§!"
 resolution_beyond_infinity_custodian_repeal_3_desc:0 "Making the entire Community join Time Resonance is too dangerous. Their withdrawal does not mean mutual estrangement."
 resolution_beyond_infinity_custodian_repeal_3_effect:0 "Repeal §Y$resolution_beyond_infinity_custodian_3$§! resolution, make §Y$resolution_beyond_infinity_custodian_2$§! Galactic Law.\n\n$resolution_beyond_infinity_custodian_2_effect$"
 resolution_beyond_infinity_custodian_1:0 "Council Resonance"
 resolution_beyond_infinity_custodian_1_desc:0 "The Council should contribute to the Community's path to Beyond Infinity, and they will also accept the Custodian's gift from time."
 resolution_beyond_infinity_custodian_1_effect:0 "§EGalactic Council:§! $produce_beyond_infinity_time_for_custodian_1$\n\n$resolution_galactic_focus_crisis_effect_success$"
 resolution_beyond_infinity_custodian_2:0 "Member Resonance"
 resolution_beyond_infinity_custodian_2_desc:0 "Not only the Council, but we also need resonance from all member states. This is a good thing for both them and us."
 resolution_beyond_infinity_custodian_2_effect:0 "§EGalactic Council:§! $produce_beyond_infinity_time_for_custodian_2$\n\n§ECommunity Members:§! $produce_beyond_infinity_time_for_custodian_1$"
 resolution_beyond_infinity_custodian_3:0 "Community Resonance"
 resolution_beyond_infinity_custodian_3_desc:0 "The entire Galactic Community will fully join Time Resonance. We will unite as one at this moment, forever."
 resolution_beyond_infinity_custodian_3_effect:0 "§ECommunity Members:§! $produce_beyond_infinity_time_for_custodian_2$"
 produce_beyond_infinity_time_for_custodian_1:0 "\nEnjoy §Yhalf§! bonus of ['concept_tech_beyond_infinity_repeatable']\n£opinion£§YOpinion§! of §CGalactic Custodian§! §G+100§!\nProduce £beyond_infinity_time£§Y$beyond_infinity_time$§! for §CGalactic Custodian§!"
