l_english:
 NAME_Noah_Ark_Home_Planet:0 "Gaia"
 origin_noah_ark.11.name:0 "Paradise of the Past"
 origin_noah_ark.11.desc_1:0 "Finally, we did it, we restored the world destroyed by the celestial flood to the paradise in our memory!"
 origin_noah_ark.11.desc_2:0 "We transformed this world submerged by flood into a Gaia World, which seems to be its original appearance."
 origin_noah_ark.11.a:0 "This time, it's our turn to be someone else's Noah."
 origin_noah_ark.11.b:0 "There seems to be some secret hidden on this planet."
 
 noah_ark_1_digsite:0 "From Paradise"
 noah_ark_1_digsite_desc:0 "Noah's Ark crashed here.\n\nAfter unknown years, the wreckage of the spaceship has long merged with the environment, and we are accustomed to its existence. But the myths passed down from generation to generation by our ancestors always remind us that our original home was a paradise, and this spaceship came from paradise."
 
 origin_noah_ark.21.name:0 "Hidden Compartment"
 origin_noah_ark.21.desc:0 "We are very familiar with the internal structure of Noah's Ark because we lived here for hundreds of years. Even though we have long moved away from the spaceship to develop civilization, the details inside the spaceship are still recorded in relevant documents.\n\nBut we seem to still not understand enough, because in the process of re-exploring the spaceship, we found a hidden huge compartment in the core area of the spaceship. Perhaps the changes of the years faded its camouflage, the door of the compartment was exposed to us without reservation.\n\nHowever, the door of the compartment has a password, and we cannot find any clues about this compartment from the classics."
 origin_noah_ark.21.a:0 "Prepare decryption team."
 origin_noah_ark.22.name:0 "Corpse Storage Room"
 origin_noah_ark.22.desc:0 "After some decryption, we successfully opened the door, but the scene behind the door left the archaeological team dumbfounded.\n\nThis compartment is full of various nutritional life support facilities, but the nutrient solution has long been filthy, and the facilities are full of rotting corpses. These creatures seemed to be passengers of this ark, but for some reason, they died before reaching the destination successfully.\n\nThere seem to be other secrets in this compartment."
 origin_noah_ark.22.a:0 "Regrettable."
 origin_noah_ark.23.name:0 "Named Noah"
 origin_noah_ark.23.desc:0 "Our archaeological team seems to have discovered the captain of the spaceship.\n\nBy cracking the labels on the nutritional facilities, we can identify the duties of the creatures in the facilities on the spaceship. Most passengers, including the captain, are of the same race. We can reasonably speculate that this race is the builder of the spaceship, and other creatures are rescued passengers.\n\nIf the ancient language passed down since ancient times has not deviated, then this race is called \"Noah\", and they are the civilization that saved our race."
 origin_noah_ark.23.a:0 "Salute to you."
 origin_noah_ark.24.name:0 "Direction of Paradise"
 origin_noah_ark.24.desc:0 "The secret of Noah's Ark has been completely understood by us.\n\nAccording to the captain's log, we learned what happened, which also confirmed the legends of our ancestors. We originally lived in a paradise, but the god was dissatisfied with the crimes of the creatures in paradise and sent down divine punishment. The mighty celestial flood instantly submerged this pure land and killed all creatures.\n\nBut fortunately, this civilization named Noah built an ark in advance and avoided the flood disaster. And they were not limited to saving themselves, but also brought many other creatures, including us. However, the flight journey was too far, and the vast majority of creatures died during the voyage, leaving only us to arrive at the destination alone.\n\nHowever, Noah's behavior is not meaningless, because we are still alive. We will live tenaciously with Noah's will. We have found the direction of paradise-§Y[noah_ark_home_planet.GetName]§!, and we also hope to restore her to the paradise of the past."
 origin_noah_ark.24.a:0 "Set off for paradise!"
 
 noah_ark_2_digsite:0 "Below Paradise"
 noah_ark_2_digsite_desc:0 "We restored this place to the pure land of the past, but secrets of the past are still hidden below paradise."
 
 origin_noah_ark.31.name:0 "Grotto Mural"
 origin_noah_ark.31.desc:0 "We discovered some mysterious murals in a hidden grotto.\n\nThe murals seem to tell such a story: a group of primitive creatures lived on this land, gods descended on this world in their vehicles and bestowed wisdom upon primitive creatures. However, instead of being grateful after gaining wisdom, primitive creatures tried to rebel, so the gods sent down a celestial flood as punishment."
 origin_noah_ark.31.a:0 "Sounds like our past."
 origin_noah_ark.31.b:0 "This seems to be the past of this planet."
 origin_noah_ark.32.name:0 "Ancient Altar"
 origin_noah_ark.32.desc:0 "After discovering the mysterious murals, we found an ancient altar.\n\nThis altar seems to be used to worship gods. Despite thousands of years of vicissitudes and flood baptism, it still preserves most of its structure, which may be related to the advanced materials used in altar construction. According to the engravings around the altar, the archaeological team judged that the altar was built to praise the gods who gave them wisdom, and there is more than one such altar on the planet."
 origin_noah_ark.32.a:0 "Truly strange."
 origin_noah_ark.33.name:0 "War of Gods"
 origin_noah_ark.33.desc:0 "Our archaeological team found the ruins of the largest altar on the planet according to the engravings.\n\nThe altar suffered severe damage, and the degree of damage indicates that this is not entirely due to the celestial flood, it is very likely to have been attacked by some large weapon. Under the deepest broken walls of the altar, our archaeological team found a chip. Although most data is damaged, we can still read the remaining information.\n\nThe chip seems to record a protracted war. The sky was densely covered with vehicles of gods, and two groups of gods fought fiercely above the planet. The intensity of this war far exceeded the imagination of primitive creatures. For them, this is no different from the end of the world."
 origin_noah_ark.33.a:0 "Perhaps those were not ordinary vehicles."
 origin_noah_ark.34.name:0 "Twilight of the Gods"
 origin_noah_ark.34.desc:0 "Our archaeological team managed to recover part of the data stored in the chip.\n\nThe final information of the chip indicates that this war ended with the defeat of the primitive creatures' gods, and the other group of gods arrogantly took over this planet. However, primitive creatures worshiped and were grateful to the initial gods. Even if their gods were at the end of their strength, they stood firmly with their own gods and carried out the final resistance against the invaders, even if victory was hopeless."
 origin_noah_ark.34.a:0 "Truly respectable creatures."
 origin_noah_ark.35.name:0 "Noah's Ark"
 origin_noah_ark.35.desc:0 "All clues are pieced together.\n\nBased on various current discoveries and historical documents about the past, we can infer such a conclusion: The civilization named \"Noah\" that built Noah's Ark was the god who enlightened the primitive creatures on this planet. Noah civilization lived in harmony with primitive creatures on this pure land. Noah civilization provided advanced technology, and primitive creatures also expressed gratitude for this in their own way. However, this peaceful life was broken by the invader civilization. They possessed higher technology and stronger fleets, crushed all ships of the Noah civilization with overwhelming superiority, and occupied all planets of the Noah civilization. However, they experienced tenacious resistance from primitive creatures and Noah remnants when taking over this planet, so impatient, they decided to use Colossus weapons to directly destroy this paradise.\n\nThe remaining Noah civilization exhausted the last resources to build several escape ships to escape, but their friendship with primitive creatures was deep. They did not hesitate to overload to evacuate with primitive partners. The invader civilization's firepower was too strong. In the end, only one ark successfully passed through the encirclement, but the invader civilization also used special weapons to cut off all hyperlanes of this system to the outside. The last ark had to be forced to hide on a planet in the system.\n\nThis is the history of Noah's Ark, this is the truth hidden under paradise."
 origin_noah_ark.35.a:0 "We will also become our own gods."
 origin_noah_ark.35.b:0 "Is our god another Noah?"
 origin_noah_ark.35.c:0 "We will always remember the former gods."
 origin_noah_ark.35.d:0 "Noah, a civilization worth remembering."
 
 origin_noah_ark.50.name:0 "重建诺亚方舟"
 origin_noah_ark.50.desc:0 "随着最近的科技进展，我们已更加了解诺亚文明的技术，或许可以尝试对诺亚方舟进行重建。"
 origin_noah_ark.55.desc:0 "经过了一年的资源与技术积累，或许是时候启动诺亚方舟重建计划了。"
 origin_noah_ark.50.a:0 "建造一艘普渡众生的方舟。"
 repair_noah_ark_CIVILIAN:0 "§Y我们将重建诺亚方舟为$civilian_arkship_name$§!"
 origin_noah_ark.50.b:0 "建造一艘培育希望的方舟。"
 repair_noah_ark_SCIENCE:0 "§Y我们将重建诺亚方舟为$science_arkship_name$§!"
 origin_noah_ark.50.c:0 "现在还不是时候，一年后再考虑吧。"
 delay_repair_noah_ark:0 "§Y我们可以在一年后重启这项计划§!"
 origin_noah_ark.50.d:0 "诺亚方舟已经成为了过去，我们更应专注于自己的未来。"
 abandon_repair_noah_ark:0 "§R我们不会重建诺亚方舟§!"
 
 origin_noah_ark.60.name:0 "众生摇篮"
 origin_noah_ark.60.desc:0 "在工程师们的不懈努力下，昔日载着我们逃离地狱的方舟最终褪去残旧的躯壳，重返无垠的太空。\n\n虽然建造这艘方舟的人已经不在了，但他们所守护的种子已破壳而出，茁壮生长。只要我们依然存在，名为“诺亚”的文明便永不灭亡。"
 origin_noah_ark.60.a:0 "我们将代表诺亚驶向天堂。"
 origin_noah_ark.60.a.tooltip:0 "§Y诺亚方舟已被重建为$civilian_arkship_name$§!"
 
 origin_noah_ark.65.name:0 "巨人之肩"
 origin_noah_ark.65.desc:0 "$origin_noah_ark.60.desc$"
 origin_noah_ark.65.a:0 "我们将代表诺亚缔造天堂。"
 origin_noah_ark.65.a.tooltip:0 "§Y诺亚方舟已被重建为$science_arkship_name$§!"