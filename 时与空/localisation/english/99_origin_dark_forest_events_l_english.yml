l_english:
 dark_forest.0.name:0 "Dark Forest: §RSource§!"
 dark_forest.0.desc:0 "Detected a country using §RDark Forest§! origin (most diplomacy impossible for all galactic countries) in this game.\n\nIf you do not want it to take effect, please choose to disable this origin (the country will not trigger origin events and will switch to §YProsperous Unification§! origin)."
 dark_forest.0.a:0 "§REnable this origin.§!"
 dark_forest.0.b:0 "§GDisable this origin.§!"
 dark_forest.1.name:0 "Dark Forest: §RChain of Suspicion§!"
 dark_forest.1.desc:0 "A civilization cannot judge whether another civilization is benevolent or malicious to itself;\nA civilization cannot judge whether another civilization thinks it is benevolent or malicious;\nA civilization cannot judge whether another civilization judges itself to be benevolent or malicious to it;\nA civilization cannot judge whether another civilization is a benevolent civilization or a malicious civilization;\nA civilization cannot judge whether another civilization will attack this civilization."
 dark_forest.1.a:0 "§RThen, kill them all!§!"
 dark_forest.2.name:0 "Dark Forest: §RTechnology Explosion§!"
 dark_forest.2.desc:0 "The speed and acceleration of civilization progress are not necessarily consistent. Weak civilizations are likely to surpass powerful civilizations in a short time."
 dark_forest.2.a:0 "§RThen, stifle them in the cradle before they surpass us!§!"
 dark_forest.3.name:0 "Dark Forest: §RInterference§!"
 dark_forest.3.desc:0 "The despicable §Y[dark_forest_war_declarer.GetName]§! declared war on us while we were in a fierce battle. Do they want to stop our war with other countries, or do they want to fish in troubled waters and steal a profit?"
 dark_forest.3.a:0 "§RDie all of you!§!"
 dark_forest.4.name:0 "Dark Forest: §YExposed§!"
 dark_forest.4.desc:0 "Our current war with other countries seems to have exposed our location. A country claiming to be §Y[dark_forest_communicator.GetName]§! discovered us, but we don't know what they will do."
 dark_forest.4.a:0 "We must be more careful in the future."
 dark_forest.5.name:0 "Dark Forest: §YObserve§!"
 dark_forest.5.desc:0 "We discovered a country through traces of war-§Y[From.GetName]§!. They are currently in a hard fight, maybe we have a chance."
 dark_forest.5.a:0 "Let's take a guess."