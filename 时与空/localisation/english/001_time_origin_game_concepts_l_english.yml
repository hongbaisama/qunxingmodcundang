l_english:
 # 通用
 concept_function_origin_text: "§B(Mechanism Origin)§!"
 concept_function_origin: "Mechanism Origin"
 concept_function_origin_desc: "This type of origin has exclusive mechanisms, and even the entire game revolves around this mechanism.\nThe game experience of this type of origin may be very different from the original version. It is not recommended to play completely according to the original ideas."
 
 concept_story_origin_text: "§G(Story Origin)§!"
 concept_story_origin: "Story Origin"
 concept_story_origin_desc: "This type of origin comes with certain story text at the beginning, suitable for immersive experience."
 
 concept_diversity_origin_text: "§Y(Diversity Origin)§!"
 concept_diversity_origin: "Diversity Origin"
 concept_diversity_origin_desc: "This type of origin is suitable for AI use to show the diversity of the galaxy.\nBut this type of origin is not very playable and is not recommended for players to use."
 
 concept_multiplayer_origin_text: "§H(Multiplayer Origin)§!"
 concept_multiplayer_origin: "Multiplayer Origin"
 concept_multiplayer_origin_desc: "This type of origin is suitable for use in §YMultiplayer Mode§!. Single-player play cannot proceed normally or has no fun."
 
 concept_global_origin_text: "§R(Global Origin)§!"
 concept_global_origin: "Global Origin"
 concept_global_origin_desc: "This type of origin will cause a greater impact on the situation or rules of the entire galaxy. Please choose carefully.\nWhen AI randomly selects this type of origin, at the beginning of the game, the player will receive a prompt and choose whether to allow AI to enable the global origin."
 
