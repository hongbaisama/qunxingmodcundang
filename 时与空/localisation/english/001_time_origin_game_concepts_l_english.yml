 # 伪善假面
 concept_hypocritical_face_decay: "§GManipulation of Public Opinion§!"
 concept_hypocritical_face_decay_desc: "§GManipulation of Public Opinion§! represents our control over international speech, reducing the possibility of other countries discovering our true face.\n\nBy researching certain specific technologies, we can enhance the ability to manipulate public opinion:\n§Y$tech_interplanetary_commerce$§!, §Y$tech_space_trading$§!, §Y$tech_interstellar_economics$§!, §Y$tech_galactic_markets$§!, §Y$tech_xeno_diplomacy$§!, §Y$tech_xeno_relations$§!"
 
 concept_hypocritical_face_country: "§RRumors from Other Countries§!"
 concept_hypocritical_face_country_desc: "§RRumors from Other Countries§! mainly come from countries with §Rtoo high intel§! on us. They will expose our true face internationally. Of course, we call it rumors externally.\n\nOur §YEncryption Capability§! can reduce this value."
 
 concept_hypocritical_face_building_modifier: "§W£mod_add_base_country_intel£Gossip of Planet§!"
 concept_hypocritical_face_building: "§RGossip of Planet§!"
 concept_hypocritical_face_building_desc: "§RGossip of Planet§! mainly comes from ['concept_hypocritical_face_branch_office_buildings'] we built on other planets. The residents on the planet will see our true face. Although gossip is small, it is also annoying.\n\nOur §YEncryption Capability§! can reduce this value."
 
 concept_hypocritical_face_branch_office_buildings: "Hypocritical $BRANCH_OFFICE_BUILDINGS$"
 concept_hypocritical_face_branch_office_buildings_desc: "$concept_hypocritical_face_branch_office_buildings$ are $BRANCH_OFFICE_BUILDINGS$ with stronger effects, which can only be built in countries that have signed commercial pacts. They can generate higher profits, but also make you easier to expose.\n\n$concept_hypocritical_face_branch_office_buildings$ include:\n['concept_building_time_private_mining_consortium']\n['concept_building_time_food_conglomerate']\n['concept_building_time_virtual_entertainment_studios']\n['concept_building_time_private_shipyards']\n['concept_building_time_military_contractors']\n['concept_building_time_industrial_subsidiary']\n['concept_building_time_public_relations_office']\n['concept_building_time_private_research_initiative']\n['concept_building_time_amusement_megaplex']\n['concept_building_time_commercial_forum']\n['concept_building_time_corporate_embassy']\n['concept_building_time_private_security']\n['concept_building_time_temple_of_prosperity']"
 
