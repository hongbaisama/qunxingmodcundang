 concept_d_pc_hive_blocker_desc: "-Clear Time:\n$tt$-£time£720 §IDays§!\n-Clear Cost:\n$tt$-1500 $i_food$\n-$MOD_PLANET_MAX_DISTRICTS_MULT$: §R-50%§!\n-$MOD_SPECIES_EMPIRE_SIZE_MULT$: §R+20%§!\n-$MOD_POP_AMENITIES_USAGE_NO_HAPPINESS_MULT$: §R+20%§!\n-$mod_planet_pops_upkeep_mult$: §R+20%§!\n-$MOD_BONUS_POP_GROWTH_MULT$: §R-20%§!\n-$mod_planet_jobs_produces_mult$: §R-20%§!\n-$mod_planet_structures_upkeep_mult$: §R+20%§!\n-After Clearing:\n$tt$-§IUnlock Planet Feature:§! ['concept_d_pc_hive']\n$h_line$§L$d_pc_hive_blocker_desc$§!"
 
 concept_d_pc_hive: "$d_pc_hive$"
 concept_d_pc_hive_desc: "-$MOD_PLANET_MAX_DISTRICTS_MULT$: §R-25%§!\n-Each planet with ['concept_d_pc_hive'] or ['concept_d_pc_hive_other'] causes:\n$tt$-$MOD_SPECIES_EMPIRE_SIZE_MULT$: §G-2.5%§!\n$tt$-$MOD_POP_AMENITIES_USAGE_NO_HAPPINESS_MULT$: §G-2.5%§!\n$tt$-$mod_planet_pops_upkeep_mult$: §G-2.5%§!\n$tt$-$MOD_BONUS_POP_GROWTH_MULT$: §G+2.5%§!\n$tt$-$mod_planet_jobs_produces_mult$: §G+2.5%§!\n$tt$-$mod_planet_structures_upkeep_mult$: §R+2.5%§!\n$tt$-Every §Y10§! years there is a §G100%§! chance to transform a random solid planet in the system into a ['concept_pc_hive'] with ['concept_d_pc_hive_other']\n$tt$ (There is a §Y33%§! chance to spread to adjacent systems instead)\n-Upkeep: 10 $i_food$ / £planet£\n$h_line$§L$d_pc_hive_desc$§!"
 
 concept_d_pc_hive_other: "$d_pc_hive_other$"
 concept_d_pc_hive_other_desc: "-$MOD_PLANET_MAX_DISTRICTS_MULT$: §R-25%§!\n-Each planet with ['concept_d_pc_hive'] or ['concept_d_pc_hive_other'] causes:\n$tt$-$MOD_SPECIES_EMPIRE_SIZE_MULT$: §G-1.25%§!\n$tt$-$MOD_POP_AMENITIES_USAGE_NO_HAPPINESS_MULT$: §G-1.25%§!\n$tt$-$mod_planet_pops_upkeep_mult$: §G-1.25%§!\n$tt$-$MOD_BONUS_POP_GROWTH_MULT$: §G+1.25%§!\n$tt$-$mod_planet_jobs_produces_mult$: §G+1.25%§!\n$tt$-$mod_planet_structures_upkeep_mult$: §R+1.25%§!\n$tt$-Every §Y10§! years there is a §G50%§! chance to transform a random solid planet in the system into a ['concept_pc_hive'] with ['concept_d_pc_hive_other']\n$tt$ (There is a §Y33%§! chance to spread to adjacent systems instead)\n-Upkeep: 5 $i_food$ / £planet£\n$h_line$§L$d_pc_hive_other_desc$§!"
 
