 concept_building_origin_praise_the_sun: "$building_origin_praise_the_sun$"
 
 # 宁和之道
 databank_origin_tao_of_ninghe: "Path of Serenity"
 
 concept_pure_yin_modifier: "§B£mod_consecrated_world_green£Power of Ultimate Yin§!"
 concept_pure_yin: "§BPower of Ultimate Yin§!"
 concept_pure_yin_desc: "§BPower of Ultimate Yin§! represents the ultimate mastery of Yin energy. When ['concept_ninghe_country'] is biased towards ['concept_yang_country'], the ['concept_yin_country'] power of the country and planet will be enhanced."
 
 concept_pure_yang_modifier: "§Y£mod_consecrated_world_yellow£Power of Ultimate Yang§!"
 concept_pure_yang: "§YPower of Ultimate Yang§!"
 concept_pure_yang_desc: "§YPower of Ultimate Yang§! represents the ultimate mastery of Yang energy. When ['concept_ninghe_country'] is biased towards ['concept_yin_country'], the ['concept_yang_country'] power of the country and planet will be enhanced."
 
 concept_ninghe_country: "§GSerenity§!"
 concept_ninghe_country_desc: "§GSerenity§! represents the balance of ['concept_yin_country'] and ['concept_yang_country'] in the country. It will affect the hobbies and value emphasis of all citizens in the country from the aspects of social system, ideology, regional culture, etc.\n\nMaintaining in the state of §GSerenity§! will bring us great benefits. Therefore, we need to pay attention to the influence of the country's ['concept_leader_yin'], ['concept_planet_yin'] and ['concept_leader_yang'], ['concept_planet_yang'] on §GSerenity§!."
 
 concept_yin_country: "§BYin§!"
 concept_yin_country_desc: "§BYin§! represents the Yin energy in the country and is part of ['concept_ninghe_country']. It will affect the hobbies and value emphasis of all citizens in the country from the aspects of social system, ideology, regional culture, etc.\n\n['concept_leader_yin'] and ['concept_planet_yin'] are the main factors affecting the power of §BYin§!."
 
 concept_trait_yin: "§BYin Traits§!"
 concept_leader_yin: "§BYin Leaders§!"
 concept_leader_yin_desc: "§BYin Leaders§! will affect the ['concept_yin_country'] power in the country and directly affect the country's ['concept_ninghe_country'].\n\nEach level and each level of trait of §BYin Leaders§! will shift the situation towards ['concept_yin_country'] by §G1§!.\n\n§BYin Leaders§! mainly come from the influence of levels and traits of §H£official£$subclass_official_delegate$§!, §H£official£$subclass_official_diplomacy_councilor$§!, §H£official£$subclass_official_economy_councilor$§!, §H£official£$subclass_official_governor$§!, §B£scientist£$subclass_scientist_governor$§!, §R£commander£$subclass_commander_governor$§!."
 
 concept_planet_yin: "§BYin Planets§!"
 concept_planet_yin_desc: "§BYin Planets§! will affect the ['concept_yin_country'] power in the country and directly affect the country's ['concept_ninghe_country'].\n\nPlanets with §B['concept_yin'] flourishing and Yang declining§! will shift the situation towards ['concept_yin_country'] by §G2~10§!."
 
 concept_yang_country: "§YYang§!"
 concept_yang_country_desc: "§YYang§! represents the Yang energy in the country and is part of ['concept_ninghe_country']. It will affect the hobbies and value emphasis of all citizens in the country from the aspects of social system, ideology, regional culture, etc.\n\n['concept_leader_yang'] and ['concept_planet_yang'] are the main factors affecting the power of §YYang§!."
 
 concept_trait_yang: "§YYang Traits§!"
 concept_leader_yang: "§YYang Leaders§!"
 concept_leader_yang_desc: "§YYang Leaders§! will affect the ['concept_yang_country'] power in the country and directly affect the country's ['concept_ninghe_country'].\n\nEach level and each level of trait of §YYang Leaders§! will shift the situation towards ['concept_yang_country'] by §G1§!.\n\n§YYang Leaders§! mainly come from the influence of levels and traits of §B£scientist£$subclass_scientist_explorer$§!, §B£scientist£$subclass_scientist_scholar$§!, §B£scientist£$subclass_scientist_councilor$§!, §R£commander£$subclass_commander_admiral$§!, §R£commander£$subclass_commander_general$§!, §R£commander£$subclass_commander_councilor$§!."
 
 concept_planet_yang: "§YYang Planets§!"
 concept_planet_yang_desc: "§YYang Planets§! will affect the ['concept_yang_country'] power in the country and directly affect the country's ['concept_ninghe_country'].\n\nPlanets with §Y['concept_yang'] flourishing and Yin declining§! will shift the situation towards ['concept_yang_country'] by §G2~10§!."
 
 concept_ninghe: "§GSerenity§!"
 concept_ninghe_desc: "§GSerenity§! represents the balance of ['concept_yin'] and ['concept_yang'] on the planet. It will affect the survival activities and thinking modes of life on the planet from the aspects of temperature, climate, environmental changes, etc.\n\nMaintaining in the state of §GSerenity§! will bring us great benefits. Therefore, we need to pay attention to the influence of the planet's ['concept_building_yin'], ['concept_building_yang'] and ['concept_ninghe_planet_class'] on §GSerenity§!."
 
 concept_ninghe_planet_class: "§GPlanet Class§!"
 concept_ninghe_planet_class_desc: "Different §GPlanet Classes§! will have different effects on the planet's ['concept_ninghe'].\n\nHot planets, Ecumenopolises, Ring Worlds, Machine Worlds, Nanite Worlds, etc. will enhance the planet's ['concept_yang'] power, while Cold planets, Relic Worlds, Habitats, Tomb Worlds, Hive Worlds, etc. will enhance the planet's ['concept_yin'] power, and Gaia Worlds possess certain ability to regulate ['concept_ninghe'].\nIn addition, §GPlanetary Designation§! focusing on ['concept_building_yang'] and §GPlanetary Designation§! focusing on ['concept_building_yin'] will also shift ['concept_ninghe'] towards the corresponding direction."
 
 concept_yin: "§BYin§!"
 concept_yin_desc: "§BYin§! represents the Yin energy on the planet and is part of ['concept_ninghe']. It will affect the survival activities and thinking modes of life on the planet from the aspects of temperature, climate, environmental changes, etc.\n\n['concept_building_yin'] and ['concept_ninghe_planet_class'] are the main factors affecting the power of §BYin§!."
 
 concept_yin_mult_modifier: "§W£mod_consecrated_world_green£Effect of §BYin Buildings§! on Serenity§!"
 concept_building_yin: "§BYin Buildings§!"
 concept_building_yin_desc: "§BYin Buildings§! will affect the ['concept_yin'] power on the planet and directly affect the planet's ['concept_ninghe'].\n\nEach §BYin Building§! will shift the situation towards ['concept_yin'] by §G5§!.\n\n§BYin Buildings§! include:\n£job_priest£Unity buildings, £trade£Trade buildings, £amenities£Amenities buildings, £job_artisan£Factory buildings, £strategic£Refinery buildings and district specializations focusing on these."
 
 concept_yang: "§YYang§!"
 concept_yang_desc: "§YYang§! represents the Yang energy on the planet and is part of ['concept_ninghe']. It will affect the survival activities and thinking modes of life on the planet from the aspects of temperature, climate, environmental changes, etc.\n\n['concept_building_yang'] and ['concept_ninghe_planet_class'] are the main factors affecting the power of §YYang§!."
 
 concept_yang_mult_modifier: "§W£mod_consecrated_world_yellow£Effect of §YYang Buildings§! on Serenity§!"
 concept_building_yang: "§YYang Buildings§!"
 concept_building_yang_desc: "§YYang Buildings§! will affect the ['concept_yang'] power on the planet and directly affect the planet's ['concept_ninghe'].\n\nEach §YYang Building§! will shift the situation towards ['concept_yang'] by §G5§!.\n\n§YYang Buildings§! include:\n£job_researcher£Research buildings, £job_enforcer£Government buildings, £job_soldier£Military buildings, £job_foundry£Foundry buildings, £job_miner£Resource buildings and district specializations focusing on these."
 
 concept_building_origin_tao_of_ninghe_yin: "$building_origin_tao_of_ninghe_yin$"
 concept_building_origin_tao_of_ninghe_yang: "$building_origin_tao_of_ninghe_yang$"
 
 # 黑客帝国
 concept_d_the_matrix_blocker: "$d_the_matrix_blocker$"
 concept_d_the_matrix_blocker_desc: "-Clear Time:\n$tt$-£time£90 §IDays§!\n-Clear Cost:\n$tt$-200 $i_energy$\n$tt$-100 $i_food$ / $i_minerals$ (§G-1§! per year)\n-$MOD_PLANET_MAX_DISTRICTS_ADD$: §R-0.2§!\n-Production:\n$tt$-2 $i_research$ (§R-0.1§! per year)\n$tt$-2 $i_unity$ (§R-0.1§! per year)\n-Upkeep:\n$tt$-1 $i_food$ / $i_minerals$ (§G-0.05§! per year)\n-After Clearing:\n$tt$-Save 100 £pop£Pops (§R-5§! per year)\n$h_line$§L$d_the_matrix_blocker_desc$§!"
 
 # 再组装者
 concept_reassembly_mode_red: "§R$concept_reassembly_mode$§!"
 concept_reassembly_mode: "Reassembly"
 concept_reassembly_mode_desc: "Start Reassembly Mode through planetary decisions to reassemble existing §I$mechanical_pops$§!.\n\nIn Reassembly Mode, no new pops will be obtained when mechanical assembly is completed. Instead, $mechanical_pops$ without ['concept_trait_reassembler'] trait will be integrated into templates with ['concept_trait_reassembler'] trait.\n\nWhen the number of reassemblable Mechanical Pops is lower than §Y$@can_active_reassembly_pop_amount|*0$§!, reassembly cannot be performed."
 
 concept_trait_reassembler: "$trait_reassembler$"
 
 concept_reassembly_speed_white: "§WReassembly Efficiency§!"
 concept_reassembly_speed: "Reassembly Efficiency"
 concept_reassembly_speed_desc: "This represents our efficiency in conducting ['concept_reassembly_mode']. When assembling templates with ['concept_trait_reassembler'] trait, £mod_planet_pop_assembly_mult£§Y$MOD_PLANET_POP_ASSEMBLY_MULT$§! will receive higher §Genhancement§!."
 
 # 江洋大盗
 concept_leader_trait_origin_pirate_king_official: "$leader_trait_origin_pirate_king_official$"
 concept_leader_trait_origin_pirate_king_official_desc: "$official_trait$\n\n$PLANET_EFFECTS_TXT$:\n$t$$MOD_PLANET_ARMY_BUILD_SPEED_MULT$: §G+20%§!\n$t$$MOD_ARMY_STARTING_EXPERIENCE_ADD$: §G+200§!\n\n$SECTOR_EFFECTS_TXT$:\n$t$$MOD_PLANET_ARMY_BUILD_SPEED_MULT$: §G+10%§!\n$t$$MOD_ARMY_STARTING_EXPERIENCE_ADD$: §G+100§!\n$h_line$§L$leader_trait_origin_pirate_king_official_desc$§!"
