 # 并非一体
 concept_origin_we_are_not_one_job: "Function"
 concept_origin_we_are_not_one_job_desc: "Players playing different types of leaders can only do work within their function.\n\n$concept_origin_we_are_not_one_job$ includes:\n['concept_origin_we_are_not_one_ruler']\n['concept_origin_we_are_not_one_state']\n['concept_origin_we_are_not_one_research']\n['concept_origin_we_are_not_one_defense']\n['concept_origin_we_are_not_one_official']\n['concept_origin_we_are_not_one_scientist']\n['concept_origin_we_are_not_one_commander']"
 
 concept_origin_we_are_not_one_ruler: "£ruler£$councilor_ruler$ Function"
 concept_origin_we_are_not_one_ruler_desc: "As §G£ruler£$councilor_ruler$§!, you can:\n-§YAppoint Council§!\n-§YSelect Agenda§!\n-§YAdjust Policies§!\n-§YToggle Edicts§!\n-§YMarket Trade§!\n-§YChoose Events§!\n-§YDispatch Leaders§! (§RDismissal Not Allowed!§!)\n\nYou §Rcannot§! exercise your ['concept_origin_we_are_not_one_official'], ['concept_origin_we_are_not_one_scientist'] or ['concept_origin_we_are_not_one_commander']."
 
 concept_origin_we_are_not_one_state: "£growth_node£$councilor_state$ Function"
 concept_origin_we_are_not_one_state_desc: "As §G£growth_node£$councilor_state$§!, you can:\n-§YConduct Diplomacy§! (including §RDeclaring War§!)\n-§YCommunity Actions§! (§RUnless other players serve in Community§!)\n-§YFederation Actions§! (§RUnless other players serve in Federation§!)\n\nYou also §Gcan§! exercise your ['concept_origin_we_are_not_one_official']."
 
 concept_origin_we_are_not_one_research: "£cognitive_node£$councilor_research$ Function"
 concept_origin_we_are_not_one_research_desc: "As §G£cognitive_node£$councilor_research$§!, you can:\n-§YDecide Research§!\n-§YAdopt Traditions§!\n-§YModify Species§!\n-§YResearch Log Projects§!\n\nYou also §Gcan§! exercise your ['concept_origin_we_are_not_one_scientist']."
 
 concept_origin_we_are_not_one_defense: "£legion_node£$councilor_defense$ Function"
 concept_origin_we_are_not_one_defense_desc: "As §G£legion_node£$councilor_defense$§!, you can:\n-§YMake Claims§!\n-§YEspionage Infiltration§!\n-§YBuild Ships and Armies Nationwide§!\n-§YCommand Ships and Armies Nationwide§! (§RUnless other players pilot/command§!)\n\nYou also §Gcan§! exercise your ['concept_origin_we_are_not_one_commander']."
 
 concept_origin_we_are_not_one_official: "£official£$official$ Function"
 concept_origin_we_are_not_one_official_desc: "As §H£official£$official$§!, you can:\n-§YCommunity Actions§! (when serving in Community)\n-§YFederation Actions§! (when serving in Federation)\n-§YExercise ['concept_origin_we_are_not_one_planet_governor']§! (when governing colony)\n-§YExercise ['concept_origin_we_are_not_one_sector_governor']§! (when governing sector capital)"
 
 concept_origin_we_are_not_one_scientist: "£scientist£$scientist$ Function"
 concept_origin_we_are_not_one_scientist_desc: "As §B£scientist£$scientist$§!, you can:\n-§YCommand Science Ship§! (when piloting Science Ship)\n-§YExercise ['concept_origin_we_are_not_one_planet_governor']§! (when governing colony)\n-§YExercise ['concept_origin_we_are_not_one_sector_governor']§! (when governing sector capital)"
 
 concept_origin_we_are_not_one_commander: "£commander£$commander$ Function"
 concept_origin_we_are_not_one_commander_desc: "As §R£commander£$commander$§!, you can:\n-§YCommand Fleet§! (when piloting fleet)\n-§YCommand Army§! (when commanding army)\n-§YBuild Military Ships and Armies§! (only in current system)\n-§YExercise ['concept_origin_we_are_not_one_planet_governor']§! (when governing colony)\n-§YExercise ['concept_origin_we_are_not_one_sector_governor']§! (when governing sector capital)"
 
 concept_origin_we_are_not_one_planet_governor: "£planet£Planetary Governor Function"
 concept_origin_we_are_not_one_planet_governor_desc: "As §Y£planet£Planetary Governor§!, you can:\n-Manage the §YColony§! you are in\n-Manage §YConstruction Ships§! in your system\n-Manage §YStarbases§! in your system, and build §Yany ships§! and §Ydefense platforms§!"
 
 concept_origin_we_are_not_one_sector_governor: "£sector£Sector Governor Function"
 concept_origin_we_are_not_one_sector_governor_desc: "As §Y£sector£Sector Governor§!, you can:\n-Manage §YColonies§! in the sector (§RUnless other players govern the colony§!)\n-Manage §YConstruction Ships§! in the sector (§RUnless other players govern the colony in that system§!)\n-Manage §YStarbases§! in the sector, and build §Yany ships§! and §Ydefense platforms§! (§RUnless other players govern the colony in that system§!)"