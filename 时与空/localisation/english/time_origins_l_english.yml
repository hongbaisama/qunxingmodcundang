 civic_origin_psionic:0 "Gazing at the Shroud"
 civic_origin_psionic_desc:0 "$origin_psionic_picture$The Shroud, that is our homeland.\nEven if we were expelled and fled here, that is still our homeland.\nEven if we can never return to the danger-ridden Shroud full of enemies, that is still our homeland.\nThe Shroud, our homeland."
 civic_tooltip_origin_psionic_effects:0 "Replace the $job_psionic_trader_only_plural_with_icon$ jobs on the homeworld with $job_civic_origin_psionic_trader_plural_with_icon$"
