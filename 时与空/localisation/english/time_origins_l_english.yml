 civic_origin_pulsar:0 "Pulsar Perception"
 civic_origin_pulsar_desc:0 "$origin_pulsar_picture$If a starfish and five Blorg are tied to two tracks respectively, and a train is speeding towards them. But if all parts of the train are replaced with new parts at extremely high speed at this moment, is the train facing the moral dilemma still the previous train? Perhaps the wise pulsar can give us the answer."
