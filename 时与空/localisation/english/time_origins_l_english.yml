 origin_dyson_sphere:0 "Rekindled Light"
 origin_dyson_sphere_desc:0 "['concept_diversity_origin_text']\nThis civilization observed a star that had long been extinguished in history lighting up. What secrets lie behind that rekindled light?"
 origin_tooltip_dyson_sphere_effects:0 "- A §Y$dyson_sphere_ruined$§! exists near your homeworld at the start"
 origin_matter_decompressor:0 "Pulsating Shadow"
