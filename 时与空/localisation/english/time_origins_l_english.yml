 #起源
 origin_tooltip_life_seeded_special_effects:0 "- $HOMEWORLD$ is a ['concept_pc_gaia'] (Size: £planetsize£30) with §IRare Planetary Features§!\n- $SPECIES_TRAITS$ ['concept_trait_pc_gaia_preference_terraforming']"
 origin_tooltip_life_seeded_special_negative_effects:0 "['concept_guaranteed_colonies'] are replaced by additional ['concept_time_gaia_deposit'] on the homeworld"
 origin_tooltip_life_seeded_special_machine_negative_effects:0 "$origin_tooltip_life_seeded_special_negative_effects$\n$ORIGIN_REQUIRES_ROBO_MODDING$"
 GUARANTEED_WORLDS_BECOME_EXTRA_DEPOSITS:0 "['concept_guaranteed_colonies'] are replaced by additional §YPlanetary Features§! on the homeworld"
 
 origin_pc_hive:0 "Hive Instinct"
 origin_pc_hive_desc:0 "The members of this Hive Mind were born to serve the hive collective, thanks largely to their Hive World of origin."
 origin_tooltip_pc_hive_effects:0 "- $HOMEWORLD$ is a ['concept_pc_hive'] (Size: £planetsize£30) with §ISpecial Blockers§! ['concept_d_pc_hive_blocker']\n- $SPECIES_TRAITS$ §H$trait_pc_hive_preference$§!"
 origin_tooltip_pc_hive_negative_effects:0 "- Species can only survive on ['concept_pc_hive']\n- $NO_GUARANTEED_WORLDS$"
 origin_contract:0 "Ancient Contract"
 origin_contract_desc:0 "['concept_function_origin_text']\nThe ancestors of this civilization signed a deferred contract with some mysterious existence, and today is the day it comes into effect..."
 origin_tooltip_contract_effects:0 "- Start the game with a contract signed with §Y$whisperers_in_the_void$§!\n- Automatically embark on the ['concept_psionic_ascension'] path after researching specific §YTechnologies§!"
 origin_tooltip_contract_negative_effects:0 "- A random Shroud Entity will be replaced by §Y$whisperers_in_the_void$§!\n- ['concept_ap_become_the_crisis'] Ascension Perk is §RDisabled§!"
 origin_time:0 "Mysterious Singularity"
 origin_time_desc:0 "['concept_function_origin_text']['concept_story_origin_text']\nThis civilization actually originated within a mysterious black hole. The chaotic spacetime confuses them, the vast sea of stars bewilders them. Where will they go from here..."
 origin_tooltip_time_effects:0 "- Begin the game having explored the homeworld ['concept_pc_time']\n- $SPECIES_TRAITS$ ['concept_trait_time']\n- Ruler: ['concept_leader_trait_ruler_time'] - §YImmortal favored by the Black Hole§!"
 origin_tooltip_time_negative_effects: "- $CHALLENGING_ORIGIN$- $INITIAL_POPS$ §R-90%§!\n- $GUARANTEED_WORLDS_BECOME_EXTRA_DEPOSITS$"
 
 origin_gas_colony:0 "Gaseous Colony"
 origin_gas_colony_desc:0 "['concept_function_origin_text']\nThis civilization is composed of miraculous gaseous organisms. They possess the ability to survive in Gas Giants, but this also makes it difficult for them to adapt to other habitable planets."
 origin_tooltip_gas_colony_effects:0 "- $HOMEWORLD$ ['concept_pc_gas_colony']\n- $SPECIES_TRAITS$ ['concept_trait_origin_gas_colony']\n- Other §Y$pc_gas_giant$s§! have a chance to be habitable"
 origin_tooltip_gas_colony_negative_effects:0 "- Species can only survive on ['concept_pc_gas_colony']\n- ['concept_synthetic_ascension'] path is §RDisabled§!\n- $GUARANTEED_WORLDS_BECOME_EXTRA_DEPOSITS$"
 origin_psionic:0 "Shroud Visitor"
 origin_psionic_desc:0 "['concept_function_origin_text']\nThis civilization seems to be visitors from The Shroud, but due to high-dimensional projection, they have lost some details. They can hardly move a step if they leave a Psionic World."
 origin_tooltip_psionic_effects:0 "- $HOMEWORLD$ ['concept_pc_psionic']\n- $SPECIES_TRAITS$ ['concept_trait_origin_psionic']\n- Can terraform certain planets into §Y$pc_psionic$§!"
 origin_tooltip_psionic_negative_effects:0 "- Species can only survive on ['concept_pc_psionic']\n- §RMust§! choose the ['concept_psionic_ascension'] path\n- $GUARANTEED_WORLDS_BECOME_EXTRA_DEPOSITS$"
 origin_nanites:0 "Nanite Machines"
 origin_nanites_desc:0 "['concept_function_origin_text']\nThis Machine Intelligence seems to be Nanite Machines left over from ancient times. It possesses extremely high work efficiency but must operate on a suitable Nanite World."
 origin_tooltip_nanites_effects:0 "- $HOMEWORLD$ ['concept_pc_nanites']\n- $SPECIES_TRAITS$ ['concept_trait_origin_nanites']\n- Can terraform certain planets into §Y$pc_nanites$§!"
 origin_tooltip_nanites_negative_effects:0 "- Species can only survive on ['concept_pc_nanites']\n- §RMust§! choose the ['concept_nanotech_ascension'] path"
 
 origin_praise_the_sun:0 "Praise the Sun"
 origin_praise_the_sun_desc:0 "['concept_function_origin_text']\nThe sun brought energy and life to this planet, the sun made this civilization prosperous, and the sun added a touch of warmth to the cold universe. Let us praise the sun."
 origin_tooltip_praise_the_sun_effects:0 "- $i_unlocks_building$ ['concept_building_origin_praise_the_sun',£building£$building_origin_praise_the_sun$]\n- §YUnlocks Specialization:§!$zone_praise_the_sun$\n- ['concept_generator_district', £district£$district_generator$]: No Limit"
 origin_parallel_sky:0 "Parallel Sky"
 origin_parallel_sky_desc:0 "['concept_story_origin_text']\nTwo civilizations jointly rule this planet, but when they embraced the stars, they discovered that they lived in different worlds."
 origin_tooltip_parallel_sky_effects:0 "- Coexist in the universe with a §Ycivilization from another world§!; the balance of your relationship depends on your choices"
 origin_under_the_haze:0 "Under the Haze"
 origin_under_the_haze_desc:0 "['concept_story_origin_text']\nThis civilization successfully stepped into the galaxy, but not everyone felt joy. The hearts of the people seem to have long been covered with a haze, and no one knows what lies buried in the darkness."
 origin_tooltip_under_the_haze_negative_effects:0 "- $CHALLENGING_ORIGIN$- Triggers the §YUnder the Haze§! situation at the start; as events progress, the truth under the haze will surface"
 
 origin_tao_of_ninghe:0 "Path of Serenity"
 origin_tao_of_ninghe_desc:0 "['concept_function_origin_text']\nThis civilization is well-versed in the Path of Serenity, striving for the balance between Yin and Yang."
 origin_tooltip_tao_of_ninghe_effects:0 "- Pursue ['concept_ninghe'] by regulating the ['concept_yin'] and ['concept_yang'] forces on the planet to gain different effects\n- The influence of ['concept_yin_country'] and ['concept_yang_country'] in the empire complements the planetary ['concept_ninghe']"
 origin_the_matrix:0 "The Matrix"
 origin_the_matrix_desc:0 "['concept_function_origin_text']\nThis civilization once escaped from a virtual world but learned much from the false illusions."
 origin_tooltip_the_matrix_effects:0 "- $HOMEWORLD$ is a ['concept_pc_time_ruin_cosmogenesis_world'] with §Y20§! ['concept_d_the_matrix_blocker']\n- $ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$- £physics£['technology:tech_encryption_1']$TABBED_NEW_LINE$- £physics£['technology:tech_decryption_1']\n- $GUARANTEED_RESEARCH_OPTION_STRING$$TABBED_NEW_LINE$- £physics£['technology:tech_encryption_2']$TABBED_NEW_LINE$- £physics£['technology:tech_decryption_2']"
 origin_tooltip_the_matrix_negative_effects:0 "- $CHALLENGING_ORIGIN$- $INITIAL_POPS$ §R-2000§!\n- §RLowers§! other empires' §YOpinion§! of you"
 origin_reassembler:0 "Reassembler"
 origin_reassembler_desc:0 "['concept_function_origin_text']\nThis civilization discovered the limitations of its own hardware and developed a new assembly technology to update itself."
 origin_tooltip_reassembler_effects:0 "- §HUnlocks Feature:§! ['concept_reassembly_mode']\n- £pop£§IMechanical Pops§! with ['concept_trait_reassembler'] trait: 40%\n- $ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$- ['concept_powered_exoskeletons', £engineering_research£$tech_powered_exoskeletons$]\n- $GUARANTEED_RESEARCH_OPTION_STRING$$TABBED_NEW_LINE$- £engineering£['technology:tech_robomodding_m'] (Non-§Y$civic_machine_assimilator$§!)$TABBED_NEW_LINE$- £engineering£['technology:tech_binary_motivators'] (Non-§Y$civic_machine_assimilator$§!)$TABBED_NEW_LINE$- £engineering£['technology:tech_integrated_cybernetics'] (§Y$civic_machine_assimilator$§!)\n- Automatically embarks on the ['concept_modularity_ascension'] path after researching specific §YTechnologies§!; if §Y$civic_machine_assimilator$§!, changes to ['concept_cybernetic_ascension']"
 
 origin_colossus:0 "Sword of Damocles"
 origin_colossus_desc:0 "['concept_story_origin_text']\nA massive Colossus hovers above this civilization's homeworld. This ship ceased functioning long ago, but its origin remains a mystery."
 origin_tooltip_colossus_effects:0 "- The empire starts with a special §YColossus§!; perhaps the secret of the §YColossus§! will be known in the future"
 origin_manifesti:0 "Amused to Death"
 origin_manifesti_desc:0 "['concept_story_origin_text']\nThis civilization follows the principle of entertainment supremacy. Everything material is just a passing cloud; they only care about debauchery and pleasure."
 origin_tooltip_manifesti_effects:0 "- $HOMEWORLD$ is an ['concept_pc_city'] accompanied by mysterious buildings"
 origin_tooltip_manifesti_negative_effects:0 "- §RWARNING: This is a non-serious Origin§!\n- §Y$pft_time_manifesti$§! appears shortly after the game starts!"
 origin_voidspawn:0 "Born in Darkness"
 origin_voidspawn_desc:0 "['concept_story_origin_text']\nThis civilization's homeworld seems to be the egg of some creature, and its hatching time is coming soon."
 origin_tooltip_voidspawn_negative_effects:0 "- $CHALLENGING_ORIGIN$- The homeworld is the egg of a §Y$NAME_Voidspawn$§! and will hatch in the near future"
 
 origin_bright_pearl:0 "Resplendent Pearl"
 origin_bright_pearl_desc:0 "The star system inhabited by this civilization is regarded as a Resplendent Pearl in the galaxy, and they constantly face the covetous eyes of other nations."
 origin_tooltip_bright_pearl_effects:0 "- The home system is a ['concept_sc_bright_pearl'] in the galaxy\n- $GUARANTEED_RESEARCH_OPTION_STRING$$TABBED_NEW_LINE$- £engineering£['technology:tech_mega_engineering']"
 origin_tooltip_bright_pearl_negative_effects:0 "- $CHALLENGING_ORIGIN$- $NO_GUARANTEED_WORLDS$\n- Any nation possessing a ['concept_sc_bright_pearl'] will be §Rcoveted§! by the entire galaxy!"
 origin_pirate_king:0 "Pirate King"
 origin_pirate_king_desc:0 "['concept_function_origin_text']['concept_story_origin_text']\nThis civilization consists of the descendants of a group of space pirates, and they intend to inherit their ancestors' will."
 origin_tooltip_pirate_king_effects:0 "- Destroying other nations' ships will grant §YBounties§! and increase §YInfamy§!\n- Extra beginning ['concept_arkship']：§Y$military_arkship_tier_1$§!\n- $official$ Trait: ['concept_leader_trait_origin_pirate_king_official']\n- $scientist$ Trait: ['concept_leader_trait_origin_pirate_king_scientist']\n- $commander$ Trait: ['concept_leader_trait_origin_pirate_king_commander']"
 origin_tooltip_pirate_king_negative_effects:0 "- §YInfamy§! can §Genhance§! the combat capability of the nation's ships, but will §Rlower§! other empires' §YOpinion§! of you!"
 origin_no_water_no_fish:0 "Drain the Pond"
 origin_no_water_no_fish_desc:0 "['concept_function_origin_text']\nThis civilization does not care about sustainable development; they only pursue the highest profit."
 origin_tooltip_no_water_no_fish_effects:0 "- ['concept_generator_district', £district£$district_generator$]: No Limit\n- ['concept_mining_district', £district£$district_mining$]: No Limit\n- ['concept_farming_district', £district£$district_farming$]: No Limit"
 origin_tooltip_no_water_no_fish_negative_effects:0 "- As jobs are worked, the primary resources on the planet will gradually be §Rdepleted§!"
 
 origin_adeptus_mechanicus:0 "Adeptus Mechanicus"
 origin_adeptus_mechanicus_desc:0 "['concept_function_origin_text']\nThis civilization worships advanced machinery. They believe the Machine God will send down blessings."
 origin_tooltip_adeptus_mechanicus_effects:0 "- Start the game with §Y1.5K§! £pop£§HMechanical Pops§! with £job_bio_trophy£§Y$citizenship_adeptus_mechanicus$§! citizenship, enjoying §Y$living_standard_adeptus_mechanicus$§! living standards\n- $AVAILABLE_BUILDINGS$ ['concept_building_adeptus_mechanicus_1',£building£$building_adeptus_mechanicus_1$]\n- Homeworld: ['concept_robot_assembly_plant',£building£$building_robot_assembly_plant$]\n- $ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$- ['concept_robotic_workers', £engineering_research£$tech_robotic_workers$]"
 origin_tooltip_adeptus_mechanicus_negative_effects:0 "- ['concept_synthetic_ascension'] path is §RDisabled§!"
 origin_hypocritical_face:0 "Hypocritical Mask"
 origin_hypocritical_face_desc:0 "['concept_function_origin_text']\nThis civilization wears a mask of kindness but possesses an evil heart."
 origin_tooltip_hypocritical_face_effects:0 "- Your civilization will be disguised as a regular ['concept_auth_corporate']; other nations with low §YIntel Level§! on you will have a §YPositive Opinion§!\n- §IUnlocks§! ['concept_hypocritical_face_branch_office_buildings',£building£$concept_hypocritical_face_branch_office_buildings$]"
 origin_noah_ark:0 "Noah's Ark"
 origin_noah_ark_desc:0 "['concept_story_origin_text']\nThis civilization escaped the destroyed paradise aboard Noah's Ark, but they are not dismayed, for they will build their own paradise."
 origin_tooltip_noah_ark_effects:0 "- Several terraformable ['concept_pc_flood'] exist in the starting system"
 origin_tooltip_noah_ark_negative_effects:0 "- $NO_GUARANTEED_WORLDS$\n- The home system will be §Risolated§! from other systems!"
 
 origin_monster_hunter:0 "Monster Hunter"
 origin_monster_hunter_desc:0 "['concept_function_origin_text']\nThis civilization flourished through countless hunts of giant beasts. After stepping into space, they crave to hunt even more powerful monsters."
 origin_tooltip_monster_hunter_effects:0 "- $SPECIES_TRAITS$ ['concept_trait_origin_monster_hunter']\n- £building£§Y$building_holo_theatres$§! is replaced by ['concept_building_origin_monster_hunter_1',£building£$building_origin_monster_hunter_1$], providing ['concept_job_monster_hunter',£job_monster_hunter£$job_monster_hunter$] jobs\n\n§RThis Origin is bound to the §Y$civic_warrior_culture$§! Civic!§!"
 origin_curator_artist_and_me:0 "Three Hearts Entwined"
 origin_curator_artist_and_me_desc:0 "['concept_diversity_origin_text']\nThis civilization is accompanied by Curators and Artists; three hearts shining together in the sea of stars."
 origin_tooltip_curator_artist_and_me_effects:0 "- The starting system contains a §YCurator§! station and an §YArtist§! station\n- Some initial leaders are replaced by §Y$subclass_scientist_governor$§! and §Y$subclass_official_governor$§! from space enclaves"
 origin_ever_changing:0 "Ever-Changing"
 origin_ever_changing_desc:0 "['concept_diversity_origin_text']\nThis civilization's homeworld is ever-changing; they have to adapt to new environments every moment."
 origin_tooltip_ever_changing_negative_effects:0 "- $CHALLENGING_ORIGIN$- The homeworld changes its §YPlanet Class§! every few years, but with each change, the pops on the planet will become §Gmore adaptable to the environment§!"
 
 origin_knowledge_from_alien:0 "Alien Knowledge"
 origin_knowledge_from_alien_desc:0 "Upon entering space, this civilization eagerly established contact with the outside world, and their efforts have paid off."
 origin_tooltip_knowledge_from_alien_effects:0 "- Apart from the §YRuler§!, there are no initial leaders of the founding species; four §rRenowned Leaders§! will take their place\n- $ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$- £society£['technology:tech_xeno_linguistics']"
 origin_born_in_the_purple:0 "Born in the Purple"
 origin_born_in_the_purple_desc:0 "['concept_function_origin_text']\nSince ancient times, this civilization has placed extreme importance on royal bloodlines. Only high-quality bloodlines born in the purple are eligible to lead the entire empire."
 origin_tooltip_born_in_the_purple_effects:0 "- The empire's heir will gain the §Y$leader_trait_born_in_the_purple$§! trait, the effect of which is influenced by the heir's §YLegitimacy§!"
 origin_corrupt_brain:0 "Corrupted Mind"
 origin_corrupt_brain_desc:0 "['concept_function_origin_text']\nThe main mind of this Gestalt civilization has been corrupted. It cares nothing for any sub-unit and is leading the entire civilization towards destruction."
 origin_tooltip_corrupt_brain_effects:0 "- Completing the §Hfour major Ascension§! paths may offer a chance to save the main mind"
 origin_tooltip_corrupt_brain_negative_effects:0 "- $CHALLENGING_ORIGIN$- The Ruler will gain the §Y$leader_trait_corrupt_brain$§! trait, and Nodes will gain the §Y$leader_trait_corrupt_node$§! trait. The levels and negative traits of the Ruler and Nodes will exacerbate corruption"
 
 origin_legendary_worship:0 "Legend Worship"
 origin_legendary_worship_desc:0 "['concept_function_origin_text']\n\"Hey, I haven't told the story of how I piloted a corvette to repel an entire Contingency fleet for three minutes!\""
 origin_tooltip_legendary_worship_effects:0 "- §rRenowned Leaders§! and §lLegendary Leaders§! will gain §Gadditional§! §dDestiny Traits§! and §Y$MOD_LEADER_SKILL_ADD$§! §Gbonus§! at level §Y10§!\n- §cRegular Leaders§! have a chance to be §Gpromoted§! to §rRenowned Leaders§! at level §Y4§!, and §rRenowned Leaders§! have a chance to be §Gpromoted§! to §lLegendary Leaders§! at level §Y8§!\n- Locks Council Position §Y$councilor_origin_legendary_worship_legendary$§!, which only §lLegendary Leaders§! can hold\n- Locks Council Position §Y$councilor_origin_legendary_worship_renowned$§!, which only §rRenowned Leaders§! can hold"
 origin_tooltip_legendary_worship_negative_effects:0 "- Exceeding §YLeader Capacity§! will §Rdrastically reduce§! promotion chance, and successfully promoted leaders will also §Rreduce§! promotion chance"
 origin_blessed_by_god:0 "Blessed by God"
 origin_blessed_by_god_desc:0 "['concept_function_origin_text']\nThis civilization is favored by the gods. They do not need to work hard themselves; they only need to worship to receive the gods' grace. The price is the loss of the ability to think, but who cares?"
 origin_blessed_by_god_modifiers:0 "$MODIFIERS_TITLE$\n$t$- $MOD_ATTUNEMENT_MULT$: §G+25%§!\n$t$- $MOD_PSIONIC_AURA_EFFECTIVENESS_MULT$: §G+25%§!\n$t$- $MOD_PSIONIC_AURA_INTENSITY_MULT$: §G+25%§!"
 origin_tooltip_blessed_by_god_effects:0 "- $HOMEWORLD$ ['concept_building_blessed_by_god',£building£$building_blessed_by_god$]\n- Can hold §H$decision_blessed_by_god$§! once a year on the §YHomeworld§! to gain §GRandom Tech Progress§! and unique §YOracles§!. The effect of the sacrifice §Genhances§! with the increase of §YAdopted Tradition Trees§!, §YAdopted Ascension Perks§!, and §ynumber of times $decision_blessed_by_god$ is held§!"
 origin_tooltip_blessed_by_god_negative_effects:0 "- $CHALLENGING_ORIGIN$- Almost §Runable§! to conduct independent scientific research\n- §RMust§! choose the ['concept_psionic_ascension'] path, ['concept_crisis_ascension'] path is §RDisabled§!\n\n$origin_blessed_by_god_modifiers$"
 origin_abandoned_by_god:0 "Abandoned by God"
 origin_abandoned_by_god_desc:0 "['concept_function_origin_text']\nThis civilization was once favored by the gods, but was suddenly abandoned at some point. Now, losing grace, where should they go?"
 origin_abandoned_by_god_modifiers:0 "$MODIFIERS_TITLE$\n$t$- $MOD_PSIONIC_AURA_RESISTANCE_MULT$: §G+50%§!\n$t$- $mod_refugee_attraction$：§R-25%§!"
 origin_tooltip_abandoned_by_god_effects:0 "- $HOMEWORLD$ ['concept_building_abandoned_by_god',£building£$building_abandoned_by_god$]\n- All leaders become ['concept_leader_trait_abandoned_by_god']\n- Gain a §Glarge amount§! of Unity based on §YTechnology Level§! each time a technology is researched\n- Gain the ['concept_ap_become_the_crisis'] Ascension Perk after researching the §Y$tech_psionic_theory$§! technology"
 origin_tooltip_abandoned_by_god_negative_effects:0 "- $CHALLENGING_ORIGIN$- Almost §Runable§! to produce Unity\n- ['concept_psionic_ascension'] path is §RDisabled§!, ['concept_crisis_ascension'] path is §RDisabled§!\n\n$origin_abandoned_by_god_modifiers$"
 
 origin_equinox_seal:0 "Seal of the Beyond"
 origin_equinox_seal_desc:0 "['concept_story_origin_text']\nThis civilization is plagued by nightmares; the nightmare from the Beyond calls from within the seal."
 origin_tooltip_equinox_seal_effects:0 "- Starting system contains an ['concept_astral_rift',$ASTRAL_RIFTS$]: §Y$astral_rift_equinox_seal$§!"
 origin_tooltip_equinox_seal_negative_effects:0 "- $CHALLENGING_ORIGIN$- §Y$astral_rift_equinox_seal$§! will loosen within §R50 years§!"
 origin_secondhand_country:0 "Second-Hand Nation"
 origin_secondhand_country_desc:0 "['concept_function_origin_text']\nTo reduce costs, this civilization is keen on using second-hand parts for assembly. The chassis assembled through 'Jerry-rigging' unexpectedly obtained higher efficiency but is also more prone to damage and scrapping due to unknown reasons."
 origin_tooltip_secondhand_country_effects:0 "- $SPECIES_TRAITS$ can choose ['concept_secondhand_country_traits'] traits.\n- Second-Hand Parts Traits:$TABBED_NEW_LINE$- Can be further enhanced by ['concept_secondhand_country_edict'] Edict$TABBED_NEW_LINE$- Can be added or removed through §IModify Machine§!\n- $HOMEWORLD$ ['concept_d_secondhand_country']\n- $ADDITIONAL_TECHNOLOGIES_STRING$ ['technology:tech_robomodding_m',£engineering£$tech_robomodding_m$]"
 origin_wishing_well:0 "Wishing Well"
 origin_wishing_well_desc:0 "['concept_function_origin_text']\nThis civilization has discovered a wishing well that can fulfill any wish, but can infinite desires really be fulfilled?"
