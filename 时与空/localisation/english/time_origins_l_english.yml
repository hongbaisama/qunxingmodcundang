 civic_origin_black_hole:0 "Peeping at the Black Hole"
 civic_origin_black_hole_desc:0 "$origin_black_hole_picture$When the abyss gazes into you, you'd better gaze back. We only crave to peep into a corner of the mysteries hidden beneath the black hole."
