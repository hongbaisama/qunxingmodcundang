 civic_origin_neutron_star:0 "Neutron Bombardment"
 civic_origin_neutron_star_desc:0 "$origin_neutron_star_picture$Cannot have both Neutron Shield and Neutron Sweep? I want them all! Relying on magical neutron bombardment technology-the largest source of bombardment is naturally the neutron star-we can arbitrarily convert matter, and engineering and modification will no longer be difficult."
