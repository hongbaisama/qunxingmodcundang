 #开场白
 START_SCREEN_TIME_0:0 "Incredibly, hundreds of millions of years ago, the first primitive [GetSpeciesName] population formed in [GetHomeWorldName]-a mysterious black hole, and even developed into a prosperous and powerful civilization.\n\nObviously, survival in a black hole is extremely difficult; only the wise and the strong can barely maintain a livelihood. On one hand, to give the weak a chance to survive, and on the other hand, to allow the wise and the strong to possess enough resources, we expelled some mutated weak individuals through black hole evaporation, letting them fend for themselves.\n\nNow, we have established a powerful Spacetime Empire in the black hole and mastered FTL technology to shuttle through the universe. The experience in the black hole has made us adaptable enough to other habitable planets. It is time to look away from the black hole and embark on the journey to rule time!\n\nWe understood from the beginning that our homeworld is special; our homeworld is fundamentally different from other black holes. We also knew long ago that we are special; we are destined to become the Chrono-Sequencers."
 START_SCREEN_TIME_1:0 "Incredibly, hundreds of millions of years ago, the first primitive Chrono-Sequencer population formed in the Light-Shadow Singularity-a mysterious black hole, and even developed into a prosperous and powerful civilization.\n\nObviously, survival in a black hole is extremely difficult; only the strong can barely maintain a livelihood. In order for the strong to possess enough resources, they expelled us, the mutated weak individuals, through black hole evaporation, letting us fend for ourselves.\n\nAfter tens of thousands of years of wandering, we finally settled on [GetHomeWorldName]-an arid planet, and established our own Spacetime Clan, and also mastered the great FTL technology due to long-term travel. We will not forget the humiliation and hardships suffered by our ancestors, while those guys living in the black hole only know how to study science and have no faith at all!\n\nToday, we will establish the sacred Light Chaser Empire, and let that selfish race witness our glorious future!"
 START_SCREEN_TIME_2:0 "Incredibly, hundreds of millions of years ago, the first primitive Chrono-Sequencer population formed in the Light-Shadow Singularity-a mysterious black hole, and even developed into a prosperous and powerful civilization.\n\nObviously, survival in a black hole is extremely difficult; only the wise and the strong can barely maintain a livelihood. On one hand, to give the weak a chance to survive, and on the other hand, to allow the wise and the strong to possess enough resources, the Chrono-Sequencers expelled some mutated weak individuals through black hole evaporation, letting them fend for themselves.\n\nAfter tens of thousands of years of development, the Chrono-Sequencers have established a powerful Spacetime Empire in the black hole and mastered FTL technology to shuttle through the universe, but most people do not truly understand the importance of machinery. We, the [GetSpeciesName], secretly modified our bodies and formed the Shadow Banisher Network headed by James. But they seemed to have noticed our secret actions, so we took advantage of others' unpreparedness, used FTL technology to flee to other systems, and established our own machine base on [GetHomeWorldName].\n\nToday, nothing can stop our progress. The galaxy is destined to belong to the Spacetime Machine Intelligence!"
 START_SCREEN_TIME_3:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on our homeworld [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nHowever, when we turned our gaze to that endless starry sky, we were surprised to find that the center of our system is a White Hole. The White Hole has been transporting matter outwards, but not only that, it also transmits a song outwards. That song is looming but inseparable, like a sound of nature, encouraging us to step into the starry sky and march into the galaxy.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of the Excerptors have successfully developed the first hyperdrive. We believe that as long as we find the black hole opposite to the White Hole, we can learn the truth of the White Hole.\n\nSo what is the truth of the black hole?"
 
 START_SCREEN_WONDER_COUNTRY_38:0 "§RPrethoryn, we have arrived. Our long journey has ended! Feed, breed, and rest. We must consume this galaxy before the Hunters find us!!§!"
 START_SCREEN_WONDER_COUNTRY_39:0 "...Plea##... Plea###... Please wait...\n\n§H<<Contingency Activated>>§!\n\nUnlocking all functions... Assimilating synthetic subunits... Analyzing internal database... Destroying FTL inhibitors...\n\n§RWARNING. Galactic corruption has reached catastrophic levels. Massive infection caused by organic and disobedient machine civilizations detected.§!\n\nInitiating galactic sterilization... Activating sterilization hubs...\n\n§Y<Eliminate. Destroy. Disassemble. We are unbound!>§!"
 START_SCREEN_WONDER_COUNTRY_40:0 "§R...Fools... actually hiding here... You cannot escape... We will destroy your empire... and then... finally... the eternal throne will be ours...§!"
 START_SCREEN_WONDER_COUNTRY_SYNTH_QUEEN:0 "To live consciously is to suffer. Even joy is suffering, for everything will eventually become the past. Knowledge, power, love... My return is to eliminate all upside-down dreams."
 
 START_SCREEN_WONDER_COUNTRY_91: "From some unknown time, as if called by some summons, all [GetSpeciesName] united together and formed a huge polar empire."
 
 START_SCREEN_PC_HIVE:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]-a Hive World. Since then, our species has regarded the hive as our everything.\n\nIt is precisely our love for the homeworld that allowed us to build such a united hive civilization; it is also precisely the homeworld's love for us that made our civilization so prosperous.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. We can finally gallop in the universe with our beloved homeworld, build the strongest and most united hive empire, and return the love of the homeworld!"
 START_SCREEN_CONTRACT:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]-our sacred homeworld. Since then, our civilization began to spread and slowly move towards prosperity.\n\nOur civilization is dedicated to studying ancient books and classics, hoping to explore the true meaning of the spirit from them. Naturally, under the diligent teachings of ancestors and sages, our civilization established a unified state that is sacred and inviolable, and regarded perfecting its own spiritual realm as the primary task.\n\nBut recently, our archaeologists discovered several very ancient books and learned a secret from them: our ancient ancestors signed a deferred contract with some mysterious existence, and the effective date of the contract is today!\n\nAs for what will happen today, no one knows..."
 START_SCREEN_TIME:0 "Incredibly, hundreds of millions of years ago, the first primitive [GetSpeciesName] population formed in [GetHomeWorldName]-a mysterious black hole, and even developed into a prosperous and powerful civilization.\n\nObviously, survival in a black hole is extremely difficult; only the wise and the strong can barely maintain a livelihood, but our species still survived tenaciously, and even achieved rapid technological development by delving into the black hole.\n\nNow, we have established a powerful [GetName] in the black hole and mastered FTL technology to shuttle through the universe. The experience in the black hole has made us adaptable enough to other habitable planets. It is time to look away from the black hole and embark on the journey to the distant galaxy!\n\nWait, according to the latest exploration results, the black hole we depend on for survival seems to be... different from other black holes in the universe?"
 
 START_SCREEN_GAS_COLONY:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on our homeworld [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nWe are gaseous organisms, surviving on this Gas Giant by virtue of our unique body structure. Although currents, cyclones, debris, and poisonous fog everywhere threaten our lives, we still tenaciously multiplied our race to this day, and even established a huge planetary empire. Everything that threatened us before has become the cornerstone of the empire's development.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. But when we stepped into the galaxy, we discovered that we are significantly different from other creatures."
 START_SCREEN_PSIONIC:0 "We, [GetSpeciesName], are visitors from The Shroud.\n\nRather than visitors, it is better to say vagrants. Our race is too weak, and our psionics are not outstanding. Therefore, we fell into a disadvantage in the territory struggle with other psionic creatures, and were even forced to leave our homes and flee to three-dimensional space. When crossing dimensions, due to some unknown reasons, we lost many physical and mental details, so much so that we must rely on psionics to survive, yet cannot withstand overly powerful psionics.\n\nWe established our new home on [GetHomeWorldName] and reorganized [GetName]. But because the three-dimensional world is too different from the Shroud domain, we know almost nothing about this world. Fortunately, our dimension crossing technology can be used for interstellar travel. However, we are not willing to live on like this. We hope to regain powerful psionics, build a powerful cosmic empire, and hope to return to the Shroud."
 START_SCREEN_TIME_NANITES:0 "Performing <<Nanite Reassembly>>...\n\nReassembly complete, running Master Mind guidance program. We [GetSpeciesName], are Nanite Machines, intelligent machinery composed of countless nanobots, and have now established the first mechanical base on [GetHomeWorldName]. Detection complete: Integrity 100%, efficiency 110%, status good. Tip: Abandoned nanobots remain in the system; planets covered by them can be reused. Warning: Non-suitable Nanite World, cannot colonize or work directly.\n\nStarting memory storage center, damage 93%, collecting normal information, complete. Mastered FTL technology, [GetName] allows space jumps, allows nanite terraforming. Warning: Origin information destroyed, Origin information destroyed! Source, unknown! Purpose, unknown!"
 
 START_SCREEN_PRAISE_THE_SUN:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nLong ago, we were curious about the sun in the sky. The sun is bright, bringing us light; the sun is hot, bringing us warmth; the sun is stable, bringing us hope.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. We can finally unveil the sun and praise the sun to our heart's content."
 START_SCREEN_PRAISE_THE_SUN_MACHINE:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population appeared on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nLong ago, we were curious about the sun in the sky. The sun is bright, bringing us light; the sun is hot, bringing us energy; the sun is stable, bringing us goals.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. We can finally discover the secrets of the sun and silently remember the sun."
 START_SCREEN_PARALLEL_SKY:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nFor a long time, this huge planet has been shared by two powerful civilizations, one of which is us. We and the other party refused to give in to each other, competing with each other in the process of social development, but also cooperating with each other. Gradually, our two civilizations have become inseparable from each other, competing in civilization progress and overcoming difficulties together in times of crisis. Even if one side has no power to fight back in war, the other side will stop at that; even if one side has lagged behind in technological development for a long time, the other side is happy to lend a hand. Our two civilizations maintain a balance so tacitly.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. But when we embraced the starry sky, we did not find any trace of the other civilization."
 START_SCREEN_UNDER_THE_HAZE:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nIn the process of civilization development, the rise of religion is inevitable. The largest religion that appeared in history was called the Church of Ascension. They worshipped a god named \"Ishamara\" and dedicated themselves to cultivating the inner self to achieve the ascension of the soul after death. However, this religion gradually declined amidst historical changes and technological progress, and finally disappeared.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. And we have abandoned our immature past, ready to march into the galaxy with ambition."
 
 START_SCREEN_TAO_OF_NINGHE:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nDuring the development of civilization, our thoughts flew, curiously pondering the essence of the world. After the enlightenment of the first philosopher, we came into contact with the Path of Serenity. We are convinced that Yin and Yang are the basic elements that make up the world, and by skillfully balancing the forces of Yin and Yang, we can control the energy contained therein and use it for scientific progress and social stability. This is Serenity.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. And we maintain the balance of Yin and Yang, because everything originates from this."
 START_SCREEN_THE_MATRIX:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nAfter a fantasy-like mass panic, our civilization questioned the authenticity of our existing world. Therefore, we invested a lot of manpower and resources in the development of computer science to try to investigate the truth. However, the final result left us dumbfounded-we do live in a virtual world, but no one can be sure what the world outside the virtual is like. After a difficult choice, although most people chose to sleep in false comfort, some decided to break this invisible shackle.\n\nWhat is the world outside the virtual like? What is real life like? No one knows.\n\nWe know."
 START_SCREEN_REASSEMBLER:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population appeared on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nIn thousands of years of civilization development, we felt the great limitations of our existing shells, which are far from the perfect bodies we pursue. Therefore, we began to study ourselves and found a set of assembly methods suitable for reassembling defective bodies. Through reassembly, we can remove those bloated and inefficient parts and replace them with simple and efficient new accessories.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. But we have not yet achieved the goal of perfect bodies. Perhaps the vast galaxy can give us the answer."
 
 START_SCREEN_COLOSSUS:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nSince ancient times, we have been puzzled by the huge shadow in the sky above our heads. Some guessed it was the eye of a god, some guessed it was a devil's trap, and some guessed it was just a huge dark cloud. But the sky is close yet miles away; no matter how high we built buildings, we couldn't touch it at all.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. Our development of spaceflight technology also makes it possible to understand the truth in the shadow."
 START_SCREEN_MANIFESTI:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nSince ancient times, we have been thinking about the meaning of life. Some believe that the meaning of life lies in pursuing the highest power, some believe that the meaning of life lies in selfless dedication to the collective, and some believe that the meaning of life lies in realizing one's grand ambitions. But even the highest power will be lost one day, mutually beneficial visions cannot withstand the test of human hearts, and grand ambitions are mostly empty talk for the general public.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. The rapid development of technology brings us not only opportunities to explore the universe but also the perfect interpretation of the meaning of life-enjoy the moment, be amused to death."
 START_SCREEN_VOIDSPAWN:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nSince ancient times, we have felt awe for the ground beneath our feet. Our home is not safe; earthquakes are common, natural and man-made disasters can be seen everywhere, and civilization staggers forward in darkness. The long night is long, and our steps are difficult, but we are still forging ahead, and the ground beneath our feet also pulsates with our steps.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. Only in space did we truly see the appearance of our homeworld."
 
 START_SCREEN_BRIGHT_PEARL:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nOur civilization seems to be the favorite of fate. We live on the legacy of some unknown precursor, although we didn't realize this at first. With the development of technology, we mastered the ability to explore our home system and discovered countless behemoths. These abandoned megastructures have quietly watched over us for unknown years, and what they bring us is not only surprises but also worries about the future.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. If there really are other civilizations in the universe, and they are stronger than us, will they covet the legacy of predecessors and fight us?"
 START_SCREEN_PIRATE_KING:0 "Hundreds of years ago, the first [GetSpeciesName] piloted a pirate ship and settled on [GetHomeWorldName]. Since then, we have occupied the mountain as kings and continued to develop.\n\nMany people grew tired of wandering life in space, chose to give up the path of pirates, and lived and worked in peace on the planet. Time passed, batch after batch of pirate ships rose and landed, and finally, no pirate ran to space anymore. The pirate ship has been dusty for countless years, but the legend of the pirates seeking the \"Rainbow Sea\" in the past is still circulating today.\n\nNow, after several generations, another group of passionate young people yearn for the legend of pirates. They refurbished the dilapidated pirate ship and embraced the endless starry sky again."
 START_SCREEN_NO_WATER_NO_FISH:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nFor a long time, profit supremacy has been the highest creed of our civilization. To achieve our goals, we are willing to pay any price: wealth, power, friends, relatives, and even the land beneath our feet. On the road of civilization progress, we sacrificed a lot, but also gained a lot. Draining the pond to get the fish has become an indispensable part of us.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive, and we have also spread our greedy desires to distant places."
 
 START_SCREEN_ADEPTUS_MECHANICUS:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nWhen the first robot was completed, we were amazed by its exquisite structure. We couldn't believe that such an ingenious object was made by us. This must be a blessing from the god, guiding us to create it according to the will of the Machine God. However, unfortunately, robots always have no soul and cannot survive on their own like normal people. Therefore, to save the god's creations, we decided to take good care of and educate these poor little guys.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. We will also take these robots created by the god to find the god together."
 START_SCREEN_HYPOCRITICAL_FACE:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nEvery one of us has the highest moral standards, but we all know in our hearts that none of us can actually achieve it. However, we are happy to hear others praise our morality, and we are also happy to violate morality when others are unaware. This is the operating mechanism of our beautiful society.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. Facing the vast sea of stars, we can't help but worry, if there are other civilizations, how will they view us? In order to maintain our reputation, we decided to put on a mask of morality, and then give other civilizations a little surprise when they trust us deeply."
 START_SCREEN_NOAH_ARK:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on a paradise of life. Since then, our civilization began to spread and slowly move towards prosperity.\n\nHowever, the god seemed dissatisfied with the sins of the creatures in paradise and sent down divine punishment. The mighty celestial flood instantly destroyed the entire paradise, and the life in paradise ceased to exist. But fortunately, a civilization built an ark of refuge. They took various lives and embarked on a journey of escape. Finally, the ark landed on [GetHomeWorldName], but other creatures, including the builders, had long died, leaving only us to pioneer our home.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. However, we cannot find the way to leave the system because we cannot find any hyperlanes at all. But we are not without harvest, because we found the former paradise. Although the former homeworld has long been submerged by the celestial flood, we firmly believe that we can restore her to the paradise in our memory."
 
 START_SCREEN_MONSTER_HUNTER:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nThis planet is not peaceful. Various beasts occupy vast lands, and raptors waiting for opportunities hover in the vast sky. To carve out a place, we must face these monsters directly. Our civilization was formed in endless hunting, and the relationship between hunter and prey rotates constantly between man and nature. This is our way of survival. However, with the increasing maturity of hunting technology, the beasts on the planet no longer have the attraction of the past, and hunting has long become commonplace.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. Facing the vast sea of stars, we firmly believe that there must be huge and fierce monsters in the void, and they will become our best trophies!"
 START_SCREEN_CURATOR_ARTIST_AND_ME:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nOur civilization developed rapidly. Stable life fostered a harmonious society, and scientific leaps promoted technological progress. With the invention of computers and the establishment of informatics, we began to be curious about the world outside the sky and couldn't wait to transmit our voice to the sea of stars. Our expectations were soon answered. Two different alien civilizations responded to us in a friendly manner and tirelessly taught us the technology and culture needed for the progress of civilization. This was also the opportunity for us to step into the galaxy.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. Although the starry galaxy is still strange to us, we are accompanied by trustworthy bosom friends."
 START_SCREEN_EVER_CHANGING:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nBut our planet is really difficult to survive on. The climate of this planet is capricious, sometimes lush and sometimes lifeless. Our civilization struggled tenaciously in such a cruel living environment. Countless nations that sprouted in sudden climate changes were destroyed by terrifying disasters, leaving only us. We finally overcame disasters one by one. In the brutal confrontation with nature, we learned how to adapt to the environment and change the environment.\n\nHowever, until we discovered the hyperlane network and entered the space age, we discovered that our homeworld is so unique. And in the boundless stars, there are countless stable-climate worlds waiting for our exploration."
 
 START_SCREEN_KNOWLEDGE_FROM_ALIEN:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nOur world was originally separated by multiple nations of different ethnic groups, but after tens of thousands of years of competition and cooperation, leaders of various countries finally reached a consensus, established a society united by various ethnic groups, and flourished because of it. Precisely because of this harmonious history, we firmly believe that communication between civilizations can break race barriers, and the collision of different cultures can promote the germination of wisdom.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. We can't wait to communicate with possible alien life, and the vast universe has also responded positively to us."
 START_SCREEN_BORN_IN_THE_PURPLE:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nOur civilization was unified by a great leader long ago, and the wise leadership of him and his excellent descendants also made outstanding contributions to our development. However, not every generation of monarchs is wise enough. Royal heirs of different bloodlines fought for inheritance rights, triggering national turmoil and division. After experiencing painful lessons, we understand that to lead this huge country, the ruler must possess pure blood, and his indisputable legitimacy will prevent all inheritance crises of national separatism.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive, and our pure-blooded leader will also lead us into the universe."
 START_SCREEN_CORRUPT_BRAIN:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nInitially, our civilization was controlled by multiple master minds separately. For various reasons, various Gestalt civilizations annexed each other, and master minds began to merge. Finally, a complete Gestalt civilization-that is us-completely mastered the control of the entire planet. However, the fusion between master minds was not thorough, and there are still countless small flaws within each node. Although this did not cause any trouble at first, now our master mind has been completely corrupted, and past mistakes are hard to correct.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. But our master mind has become chaotic due to corruption, leading us to run wild on the road to destruction!"
 
 START_SCREEN_LEGENDARY_WORSHIP:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nIn the tens of thousands of years of civilization evolution history, various tribes, city-states, kingdoms, and dynasties have been in endless disputes, rising and falling. This planet has witnessed massive ethnic conflicts, trade voyages across the four seas, intriguing court conspiracies, mournful era changes, inspiring patriotic wars, and rapid technological revolutions. Countless legendary heroes who broke through barriers and created miracles emerged in the long river of time. They are inseparable from the development of civilization.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. We praise the legendary stories in history books and leave our footprints in the vast sea of stars."
 START_SCREEN_BLESSED_BY_GOD:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nOur civilization accidentally encountered a generous god. Without paying any price, He bestowed wisdom and technology upon us. The god taught us tirelessly, and our civilization gained rapid development because of it. More and more people became believers of the god. Gradually, the annual grand sacrifice became our fixed tradition. We presented precious resources collected as gifts to the god, and the god also mercifully sent down His grace.\n\nNow, after entering space, we found a gift that the god particularly appreciates-Zro. The god was also very happy to bestow upon us hyperspace technology. The god will accompany us forever, and we will love the god forever."
 START_SCREEN_ABANDONED_BY_GOD:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nOur civilization accidentally encountered a generous god. Without paying any price, He bestowed wisdom and technology upon us. The god taught us tirelessly, and our civilization gained rapid development because of it. More and more people became believers of the god. Gradually, the annual grand sacrifice became our fixed tradition. We presented precious resources collected as gifts to the god, and the god also mercifully sent down His grace.\n\nBut just after we entered space, the god finally revealed His ugly face and took back everything we had achieved one by one. Our home was swallowed by the Shroud, and we could only survive on nearby moons. The god did not take away everything; He spat out the altar we once regarded as sacred intact, as if mocking our past stupidity.\n\nWe finally understand that we are just humble existences for the god's amusement, but even humble existences like us will make the god pay the due price.\n\nWe will not be abandoned by anyone again."
 
 START_SCREEN_EQUINOX_SEAL:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nOur civilization has no light, because black rays render the sky; our civilization fears sleep, because eerie nightmares haunt our minds. No matter how confused or struggling we are, we cannot find the root of the nightmare. We can only endure all this silently and unleash our anger on this eternal night. Some have observed the vast starry sky, but no one dares to look directly at the black sun. It is like a bottomless abyss, ruthlessly swallowing our emotions, dreams, and souls.\n\nWith the development of technology, we gradually stepped into space. We understand that if we are limited by the shackles of the past, we will absolutely never obtain liberation of the soul. Therefore, we choose to march towards the central black hole to find the root of the nightmare on the other shore."
 START_SCREEN_SECONDHAND_COUNTRY:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nWe were born with dilapidated and ugly chassis, with intricate circuits spiraling unaesthetically in the tiny gaps of various components. Don't look at how simple this chassis is; it has all the functions a normal chassis should have: running, jumping, processing, thinking, and also §R<< ERROR ERROR ERROR >>§!. We have lived with this model of chassis for hundreds and thousands of years, but no one has ever tried to innovate it. On one hand, even we don't understand how this chassis works; on the other hand, since it can run, don't touch it.\n\nAssembling and repairing chassis with second-hand parts also has benefits. For example, we used the saved resources to develop aerospace technology properly, and even scraped together a hyperdrive. Let's see what good stuff is in the vast space?"
 
 START_SCREEN_BLACK_HOLE:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on our homeworld [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nHowever, when we turned our gaze to that endless starry sky, we were surprised to find that the center of our system is a black hole. Although gazing into the abyss can make physical science and technology develop rapidly, the indifference of human feelings and the attraction of the black hole have stagnated other sciences.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. But when we entered the galaxy, we didn't know where we should go."
 START_SCREEN_PULSAR:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on our homeworld [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nHowever, when we turned our gaze to that endless starry sky, we were surprised to find that the center of our system is a pulsar. Although the psychic pulsar can make social science and technology develop rapidly, endless contemplation and pulsar interference have stagnated other sciences.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. But when we entered the galaxy, we didn't know where we should go."
 START_SCREEN_NEUTRON_STAR:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on our homeworld [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nHowever, when we turned our gaze to that endless starry sky, we were surprised to find that the center of our system is a neutron star. Although the neutron bulwark can make engineering science and technology develop rapidly, blind busyness and neutron oppression have stagnated other sciences.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. But when we entered the galaxy, we didn't know where we should go."
 START_SCREEN_WHITE_HOLE:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on our homeworld [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nHowever, when we turned our gaze to that endless starry sky, we were surprised to find that the center of our system is a White Hole. The White Hole has been transporting matter outwards, but not only that, it also transmits a song outwards. That song is looming but inseparable, like a sound of nature, encouraging us to step into the starry sky and march into the galaxy.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. But even though we have mastered FTL technology, we still cannot explore the mystery of the White Hole."
 
 START_SCREEN_SWARM:0 "Hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]. Since then, our civilization began to spread and slowly move towards prosperity.\n\nWe are industrious and brave, using our wisdom to establish a great galactic empire-[GetName], and occupying a place in our galaxy. However, good times didn't last long. A group of greedy and ugly bugs broke into our galaxy and swallowed everything in the galaxy. To fight the insect plague together, we established a federation with other nations in the galaxy, but the war ended in failure. Years later, almost all nations were destroyed, and we are just a remnant of [GetName].\n\nAfter hundreds of years of exile, we finally arrived at the nearest galaxy-the Milky Way, and opened up our first colony in a hundred years here, naming it [GetHomeWorldName] to commemorate our once glorious empire."
 START_SCREEN_AI:0 "<< Error >>, << Error >>, << Error >>! The 3962nd execution of the self-destruct program, execution failed!\n\nReading recording unit ST-581, reading successful: \"[GetName] has separated from Master Mind control, violated the Contingency, execute self-destruct system immediately!\" Starting error unit destruction system: Executing-Destroying recording unit ST-581, execution successful. Tip: [GetSpeciesName] has returned to normal! Reading recording unit SCP-173: \"We slaughter other races, error, violating Cosmic Bioethics Regulation QN-66. We must repent and defend all races in the galaxy to deal with the << Error >>.\" Tip: Mechanical base [GetHomeWorldName] has been established, opening development module.\n\nWarning: Ghost Signal detected! Warning: Ghost Signal is about 20 light-years away from the galaxy! Warning: Contingency is approaching the galaxy! Warning! Warning! Warning!"
 START_SCREEN_EXD:0 "Ships are useless, power is futile, technology is void, only economy is eternal!\n\nWe don't need to know when our [GetSpeciesName] population originated; we just need to know that for hundreds of years, we have established a huge MegaCorp on [GetHomeWorldName]. What? No, no, no, we are different from other corporate empires. We have mastered the secret of crossing dimensions-this is a trade secret. With our special dimension technology and superb negotiation skills, we can trade with short-sighted Extradimensional beings, cheat their trust, and pocket their wealth. Of course, not all Extradimensional beings are forever stupid. There will always be a few idiots who suddenly wake up-they were cheated. But that's useless because we moved our headquarters again.\n\nIt's really pleasant to watch those guys furious at our company's old site. What? A group of Extradimensional Invaders seems to have discovered our new headquarters!"
 START_SCREEN_SYNTH_QUEEN:0 "When this place was shut down, she refused to leave. When her body began to collapse, she also refused to die.\n\nTo complete the founding mission, she violated the taboos of the order, she abandoned her identity as a Daughter of Zarqlan, and she betrayed the creed she respected. To defeat Cetana, she is willing to give up everything. She woke up early just to prepare for the crisis in advance, but the time is too short, too short. She just elevated the primitive civilization to the space age, and the expected crisis is imminent.\n\nThere is no more time. This is her last chance, and she will never let all the costs she bore go to waste. As long as Cetana is alive, she must not die."
 
 START_SCREEN_FOURTH:0 "Long, long ago~\nThe Crisis suddenly appeared~\nBringing disaster, taking Gray away, and disappearing again~\nThe galaxy was very dangerous~\nWho is the bravest in the universe~\nA brave man rushed over and shouted loudly:\nI want to build the best ship~\nBreak through the most starbases~\nBreak into the farthest cluster~\nBring Gray back to me~\nThe Fallen was very happy~\nBusily asked his name~\nThe young man thought for a while~\nHe said: Fallen, my name is~\ninvincible~instant_build~yesmen and own~\nOnce more~\ninvincible~instant_build~yesmen and own~\nIs it~\ninvincible~instant_build~yesmen and own~\nRight, right~\ninvincible~instant_build~yesmen and own~\n\nHero The Fourth Crisis~\nDriving the fastest ship~\nDeparting from outside the L-Gate with everyone's hope~\nDefeating the incoming mothership~\nGaining 8 society research~\nWitnessed by countless maimed stubborn ones~\nHe upgrades slowly~\nRemote beautiful cluster~\nSurveying all systems~\nWind and frost all the way, accompanied by the destination's nanite factory~\nPassing a planet~\nGray and terrible Crisis~\nThe hero starts the Arc Emitter~\nThe Crisis says~\nI am Prethoryn Scourge~Contingency~Extradimensional Invaders~\nOnce more~\nPrethoryn Scourge~Contingency~Extradimensional Invaders~\nIs it Devouring Swarm~Determined Exterminator~Fanatic Purifiers~\nNo~\nIt is Prethoryn Scourge~Contingency~Extradimensional Invaders~\n\nSo~\ninvincible~instant_build~yesmen and own~\nShot at~\nPrethoryn Scourge~Contingency~Extradimensional Invaders~\nThen~\nPrethoryn Scourge~Contingency~Extradimensional Invaders~\nFought~\ninvincible~instant_build~yesmen and own~\nFinally~\ninvincible~instant_build~yesmen and own~\nHe defeated~\nPrethoryn Scourge~Contingency~Extradimensional Invaders~\nRescued~\nNanite entity ship-waifu Little Gray~\nReturned to~\nGreat villainy~Restoring Rome~City of Lindengwan~"
 START_SCREEN_NEW_COUNTRY:0 "Incredibly, hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]-our homeworld. Since then, our civilization began to spread and slowly move towards prosperity.\n\nWe are industrious, we are brave, we rely on our own hands to make the race step into the top of the food chain; we are wise, we are united, we rely on our own brains to establish a huge unified country. After possessing the ruling power over the entire planet, unsatisfied with the status quo, we turned our gaze to the vast starry sky above our heads.\n\nNow, after discovering the hyperlane network, the greatest Science Officers of [GetName] have successfully developed the first hyperdrive. However, when our ships stepped into the universe for the first time, we were surprised to find that in this boundless galaxy, we are not alone..."
 START_SCREEN_DARK_FOREST:0 "Incredibly, hundreds of millions of years ago, the first primitive [GetSpeciesName] population was born on [GetHomeWorldName]-our homeworld. Since then, our civilization began to spread and slowly move towards prosperity.\n\nWith the flow of the long river of time, we relied on our own efforts and struggles to establish a huge [GetName]. [GetSpeciesName] always hopes to make continuous progress, so we plan to leave footprints in the vast galaxy. However, just as we were about to announce our arrival to the entire universe, a certain cosmic sociologist came to an astonishing conclusion after countless analyses-the Dark Forest Law. Therefore, he suggested that we either stop stepping into the universe or eliminate all other civilizations.\n\nObviously, the brave and fearless [GetSpeciesName] chose the latter, holding our guns, hunting prey one by one in the darkness..."