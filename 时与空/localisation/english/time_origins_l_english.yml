 origin_tooltip_black_hole_effects:0 "- Starting system is a ['concept_sc_black_hole']\n- $SPECIES_TRAITS$ ['concept_trait_origin_black_hole']"
 origin_pulsar:0 "Psychic Pulsar"
 origin_pulsar_desc:0 "['concept_diversity_origin_text']\nThis civilization is deeply influenced by the psychic pulsar, indulging in the Trolley Problem and the Ship of Theseus paradox all day long."
