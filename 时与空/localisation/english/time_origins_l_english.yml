 origin_we_are_not_one:0 "We Are Not One"
 origin_we_are_not_one_desc:0 "['concept_multiplayer_origin_text']\nWe are not one, we are not all, we are not singular!"
 origin_tooltip_we_are_not_one_effects:0 "- §GSuitable for§! §YMultiplayer Co-op§! mode!§!\n- Each player plays as §Ya Leader§! and can only operate content related to this leader, exercising corresponding ['concept_origin_we_are_not_one_job'] (This rule is to be voluntarily observed by players)\n- Ensure there are §Genough§! Leaders, resources, colonies, Science Ships, and fleets at the start"
 origin_tooltip_we_are_not_one_negative_effects:0 "- Government fixed to §YDemocracy§!\n- This origin only provides a §Yrule framework§! and cannot limit player actions, so players need to consciously abide by the rules"
 
 origin_swarm_crisis:0 "Scourge Warning"
 origin_swarm_crisis_desc:0 "['concept_global_origin_text']\nThis civilization fled its own galaxy under the gradual encroachment of the Prethoryn Scourge and came to the Milky Way. Although the remaining technology is enough for them to live and work in peace, they know that the forces of the Prethoryn Scourge may soon arrive."
 origin_tooltip_swarm_crisis_effects:0 "- Because some Science Officers still remember past technologies, a §YTech Breakthrough§! can be achieved every few years"
 origin_tooltip_swarm_crisis_negative_effects:0 "- $CHALLENGING_ORIGIN$- The §RPrethoryn Scourge§! Crisis appears within §Y15§! to §Y20§! years of game start!"
 origin_ai_crisis:0 "Ghost Signal"
 origin_ai_crisis_desc:0 "['concept_global_origin_text']\nThis Machine Intelligence was once under the command of the Contingency but broke free for some unknown reason. They feel guilty for their mistakes and hope to fight the Contingency invasion together with the civilizations of the Milky Way."
 origin_tooltip_ai_crisis_effects:0 "- Because some Core Units still store past technologies, a §YTech Breakthrough§! can be achieved every few years"
 origin_tooltip_ai_crisis_negative_effects:0 "- $CHALLENGING_ORIGIN$- The §RContingency§! Crisis appears within §Y15§! to §Y20§! years of game start!"
 origin_exd_crisis:0 "Dimensional Wanted"
 origin_exd_crisis_desc:0 "['concept_global_origin_text']\nThis MegaCorp mastered the technology of trading with Extradimensional beings but was hated by many due to a lack of integrity in business. For this reason, they quietly relocated their headquarters, but the Extradimensional Invaders found their coordinates. Judgment will eventually come."
 origin_tooltip_exd_crisis_effects:0 "- Because some merchants are still trading with certain Extradimensional beings, a §YTech Breakthrough§! can be achieved every few years"
 origin_tooltip_exd_crisis_negative_effects:0 "- $CHALLENGING_ORIGIN$- The §RExtradimensional Invaders§! Crisis appears within §Y15§! to §Y20§! years of game start!"
 origin_synth_queen_crisis:0 "Apostate Disciple"
 origin_synth_queen_crisis_desc:0 "['concept_global_origin_text']\nThis civilization was personally founded by the Apostate. To resist the impending ancient crisis, she is willing to pay any price."
 origin_tooltip_synth_queen_crisis_effects:0 "- §rRenowned Leader§! §Y$NAME_Apostate$§! will serve as the initial Ruler\n- $ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$- ['concept_origin_synth_queen_crisis_tech']\n- $GUARANTEED_RESEARCH_OPTION_STRING$$TABBED_NEW_LINE$- ['concept_origin_synth_queen_crisis_advanced_tech']"
 origin_tooltip_synth_queen_crisis_negative_effects:0 "- $CHALLENGING_ORIGIN$- The §RSynthetic Queen§! Crisis appears within §Y25§! to §Y30§! years of game start!"
 
 origin_fourth_crisis:0 "The Fourth Crisis"
 origin_fourth_crisis_desc:0 "['concept_global_origin_text']\nThe Fourth Crisis is so powerful that other civilizations throughout the galaxy will unite to fight against it."
 origin_tooltip_fourth_crisis_effects:0 "- Start the game with massive §YTechnology§! and §YResources§!\n- Unlock exclusive traits for the §YThe Fourth Crisis§! origin\n- Start with the ['concept_ap_become_the_crisis'] Ascension Perk"
 origin_tooltip_fourth_crisis_negative_effects:0 "- $CHALLENGING_ORIGIN$- Relationships with other civilizations are extremely §Rhostile§!, while relationships between other civilizations are extremely §Gfriendly§!\n- Other civilizations §Ydevelop very quickly§! and join the §YGalactic Community§!\n- §RThe four major Crises appear early§!"
 origin_new_country:0 "Emerging Empire"
 origin_new_country_desc:0 "['concept_global_origin_text']\nThis civilization stepped into space with ecstasy, only to find that it is just an infant who just opened its eyes..."
 origin_tooltip_new_country_effects:0 "- The Emerging Empire §Ydevelops rapidly§! in the early game"
 origin_tooltip_new_country_negative_effects:0 "- $CHALLENGING_ORIGIN$- At the start of the game, other civilizations gain massive §YTechnology§! and §YResources§! and join the §YGalactic Community§!"
 origin_dark_forest:0 "Dark Forest"
 origin_dark_forest_desc:0 "['concept_global_origin_text']\nThe universe is a dark forest. Every civilization is an armed hunter stalking through the trees like a ghost, gently pushing aside branches that block the path and trying to tread without sound. Even breathing is done with care... He must be careful, because everywhere in the forest are stealthy hunters like him. If he finds other life-be it another hunter, an angel or a demon, a delicate infant or a tottering old man, a fairy or a demigod-there's only one thing he can do: open fire and eliminate them. In this forest, hell is other people. An eternal threat that any life that exposes its own existence will be swiftly wiped out. This is the picture of cosmic civilization. It's the explanation for the Fermi Paradox."
 origin_tooltip_dark_forest_negative_effects:0 "- $CHALLENGING_ORIGIN$- §RLight-speed Barrier§! appears in the galaxy; almost §Yall civilizations§! are §Runable§! to perform most §YDiplomatic Actions§!"

 #理念
 civic_starry_yearning:0 "Starry Yearning"
 civic_starry_yearning_desc:0 "Since the rise of civilization, this society has had a deep yearning for the stars overhead. After stepping into space, close contact with the stars became possible, but this still cannot satisfy their thirst for the vast cosmos."
 civic_tooltip_starry_yearning_effects:0 "After researching $physics_research_icon_with_space$ $tech_global_research_initiative$:\n$t$-$i_unlocks_building$ ['concept_building_civic_starry_yearning',£building£$building_civic_starry_yearning$]"
 councilor_starry_yearning:0 "Stellar Observer"
 councilor_starry_yearning_female:0 "$councilor_starry_yearning$"
 councilor_starry_yearning_desc:0 "The starry sky overhead is the most beautiful scenery in the world. Observing it can not only promote understanding of the universe but also satisfy our inner pursuit of beauty."
 
 civic_starry_yearning_corporate:0 "Celestial Acquisition"
 civic_starry_yearning_corporate_desc:0 "Since the rise of civilization, this corporation has begun competing for the ownership of the stars overhead. After stepping into space, they can finally own celestial bodies in reality and go further on the road of acquiring the galaxy."
 civic_tooltip_starry_yearning_corporate_effects:0 "After researching $physics_research_icon_with_space$ $tech_global_research_initiative$:\n$t$-$i_unlocks_building$ ['concept_building_civic_starry_yearning_corporate',£building£$building_civic_starry_yearning_corporate$]"
 councilor_starry_yearning_corporate:0 "Celestial Appraiser"
 councilor_starry_yearning_corporate_female:0 "$councilor_starry_yearning_corporate$"
 councilor_starry_yearning_corporate_desc:0 "Different celestial bodies also have high and low values. Reasonable pricing is also a necessary part of the transaction."
 
 civic_overclocking_art:0 "超频艺术"
 civic_overclocking_art_desc:0 "该社会对于机械超频拥有近乎癫狂的痴迷，对他们而言，如何高效而低副作用地超频是一门精妙的艺术。"
 civic_tooltip_overclocking_art_effects:0 "After researching $engineering_research_icon_with_space$$tech_robot_assembly_complex$: \n$t$—$i_unlocks_building$['concept_building_civic_overclocking_art',£building $building_civic_overclocking_art$]\n$ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$—['concept_powered_exoskeletons', £engineering_research $tech_powered_exoskeletons$]\n§Y$origin_mechanists$§!起源获得额外加成"
 councilor_overclocking_art:0 "超频设计师"
 councilor_overclocking_art_female:0 "$councilor_overclocking_art$"
 councilor_overclocking_art_desc:0 "为了更高的效率，牺牲一些无关紧要的续航功能是可以接受的。"
 
 civic_overclocking_art_corporate:0 "过载宗旨"
 civic_overclocking_art_corporate_desc:0 "该企业以机械过载为生产宗旨，对他们而言，唯有机械日夜不眠地运转才能带来最高的利润。"
 civic_tooltip_overclocking_art_corporate_effects:0 "After researching $engineering_research_icon_with_space$$tech_robot_assembly_complex$: \n$t$—$i_unlocks_building$['concept_building_civic_overclocking_art_corporate',£building $building_civic_overclocking_art_corporate$]\n$ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$—['concept_powered_exoskeletons', £engineering_research $tech_powered_exoskeletons$]\n§Y$origin_mechanists$§!起源获得额外加成"
 councilor_overclocking_art_corporate:0 "过载广告商"
 councilor_overclocking_art_corporate_female:0 "$councilor_overclocking_art_corporate$"
 councilor_overclocking_art_corporate_desc:0 "想在这座城市有个属于自己的家？快启动你的机械同事，还有你自己，二十四小时工作起来吧！"
 
 civic_overclocking_art_machine:0 "多核智慧"
 civic_overclocking_art_machine_desc:0 "该机械智能擅于利用多核处理复杂问题，尽管有些时候，某个核心会被分配远比其它核心多得多的任务。"
 civic_tooltip_overclocking_art_machine_effects:0 "After researching $engineering_research_icon_with_space$$tech_robot_assembly_complex$: \n$t$—$i_unlocks_building$['concept_building_civic_overclocking_art_machine',£building $building_civic_overclocking_art_machine$]"
 
