 origin_neutron_star:0 "Neutron Bulwark"
 origin_neutron_star_desc:0 "['concept_diversity_origin_text']\nThis civilization uses the neutron star as a shield, but wonders if it can withstand the neutron sweep spear."
 origin_tooltip_neutron_star_effects:0 "- Starting system is a ['concept_sc_neutron_star']\n- $SPECIES_TRAITS$ ['concept_trait_origin_neutron_star']"
 
 origin_white_hole:0 "Song of Nature"
 origin_white_hole_desc:0 "['concept_story_origin_text']\nThis civilization's parent star is a rare White Hole. The White Hole not only transports matter outward but also transmits a song."
 origin_tooltip_white_hole_effects:0 "- Starting system is a ['concept_sc_time_white_hole'], seemingly related to the §YDimension Traveler§!\n- Initial ['concept_specimen']: §2$dimension_traveler_song_of_nature$§!"
