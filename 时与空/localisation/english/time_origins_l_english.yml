 councilor_origin_psionic_desc:0 "The Shroud is our homeland. No matter what, we will return home.\nBefore bidding farewell, let us gaze at our homeland a little longer."
 councilor_origin_psionic_conditional_tooltip:0 "Only §Y$trait_origin_psionic$§! have deep affection for the Shroud."
 
 civic_origin_nanites:0 "Gray Goo Data"
