 councilor_overclocking_art_individual_machine:0 "多核服务端"
 councilor_overclocking_art_individual_machine_female:0 "$councilor_overclocking_art_individual_machine$"
 councilor_overclocking_art_individual_machine_desc:0 "在服务端进行多线程统一分配，以避免接收端拒绝高难任务导致的效率低下。"
 
