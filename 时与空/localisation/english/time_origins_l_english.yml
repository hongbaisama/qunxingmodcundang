 civic_origin_gas_colony:0 "Fluid Core"
 civic_origin_gas_colony_desc:0 "$origin_gas_colony_picture$We have made an astonishing discovery: within the Gas Giant we inhabit, inside the solid core, it is actually fluid. We do not know how the fluid core resists the gravity of the solid shell, but the various rare substances mixed in it can be used by us."
 civic_tooltip_origin_gas_colony_effects:0 "Replace the $job_gas_technician_only_plural_with_icon$ jobs on the homeworld with $job_civic_origin_gas_colony_technician_plural_with_icon$\nReplace the $job_gas_miner_only_plural_with_icon$ jobs on the homeworld with $job_civic_origin_gas_colony_miner_plural_with_icon$\nReplace the $job_gas_farmer_only_plural_with_icon$ jobs on the homeworld with $job_civic_origin_gas_colony_farmer_plural_with_icon$"
 councilor_origin_gas_colony:0 "Gas Pioneer"
 councilor_origin_gas_colony_female:0 "$councilor_origin_gas_colony$"
 councilor_origin_gas_colony_desc:0 "No one dares to enter the fluid core. Only the most resolute leaders take the lead, revealing the secrets of the core.\nSince they dare to enter the dangerous core, they will inevitably lead us to establish a foothold in the sea of stars."
 councilor_origin_gas_colony_conditional_tooltip:0 "Only §Y$trait_origin_gas_colony$§! can enter the fluid core."
 
 civic_origin_gas_colony_corporate:0 "$civic_origin_gas_colony$"
 civic_origin_gas_colony_corporate_desc:0 "$civic_origin_gas_colony_desc$"
 councilor_origin_gas_colony_corporate:0 "Core Collector"
 councilor_origin_gas_colony_corporate_female:0 "$councilor_origin_gas_colony_corporate$"
 councilor_origin_gas_colony_corporate_desc:0 "No one dares to enter the fluid core. Only the most decisive leaders take the lead, revealing the secrets of the core.\nThey collected precious core materials; even a little bit is enough to benefit us greatly."
 
