 under_the_haze.1.name:0 "Under the Haze: §HBeginning§!"
 under_the_haze.1.desc:0 "We finally stepped into the galaxy, which is the beginning of the development of interstellar civilization.\n\nOur economic prospects are good, our technological progress is rapid, our culture is blooming, our society is orderly, and our empire is flourishing. We should have been happy about this, but many people feel heavy-hearted, as if something terrible is about to happen."
 under_the_haze.1.a:0 "It will pass."
 
 situation_under_the_haze_1:0 "Under the Haze"
 situation_under_the_haze_1_type:0 "Under the Haze"
 situation_under_the_haze_1_desc:0 "Our civilization is covered with a haze. Some things took root long before we stepped into the galaxy..."
 situation_under_the_haze_1_monthly_change_tooltip:0 "The progress of this §YSituation§! is roughly under our control."
 stage_under_the_haze_1:0 "Source of Mist"
 stage_under_the_haze_2:0 "Center of Mist"
 stage_under_the_haze_3:0 "Depths of Mist"
 stage_under_the_haze_4:0 "Illusion of Mist"
 stage_under_the_haze_5:0 "Edge of Mist"
 situation_under_the_haze_1_complete_effect:0 "We will clear the mist and face the truth."
 situation_under_the_haze_1_fail_effect:0 "§RWe will be trapped in the mist, unable to extricate ourselves...§!"
 
 under_the_haze.11.name:0 "Under the Haze: §HWhisper§!"
 under_the_haze.11.desc:0 "According to the report of the governor and law enforcement officers of §Y[Target.GetName]§!, we found that there seems to be some problems in the capital.\n\nMany people are intentionally or unintentionally avoiding the government, whispering in places we can't see. Although we have not prohibited private communication among the people, and the number of people whispering together has not reached the category of illegal gathering, our high-level government officials suspect that they are conspiring against the government."
 under_the_haze.11.a:0 "We cannot condone such things."
 under_the_haze.11.b:0 "Maybe we are overthinking."
 under_the_haze.12.name:0 "Under the Haze: §HGathering§!"
 under_the_haze.12.desc_a:0 "Although we tried to stop the people's whispers, the result was obviously a failure.\n\nThe situation of §Y[Target.GetName]§! has become somewhat uncontrolled. The whispers are growing and have now evolved into secret gatherings. Our high-level government officials unanimously agree that secret gatherings are harmful to national security."
 under_the_haze.12.desc_b:0 "Whispers did not subside due to our tolerance but intensified.\n\nThe situation of §Y[Target.GetName]§! has become somewhat uncontrolled. The whispers are growing and have now evolved into secret gatherings. Our high-level government officials unanimously agree that secret gatherings are harmful to national security."
 under_the_haze.12.a:0 "Arrest the gathering people."
 under_the_haze.12.b:0 "Let it be."
 under_the_haze.13.name:0 "Under the Haze: §HRiot§!"
 under_the_haze.13.desc_a:0 "The arrest operation seems to have aggravated the seriousness of the problem.\n\nSeveral violent acts against law enforcement officers occurred on §Y[Target.GetName]§!. It seems their grievances have a long history. Our high-level government officials call on us to find out the truth."
 under_the_haze.13.desc_b:0 "The seriousness of the problem has not been alleviated by our indulgence.\n\nSeveral violent acts against law enforcement officers occurred on §Y[Target.GetName]§!. It seems their grievances have a long history. Our high-level government officials call on us to find out the truth."
 under_the_haze.13.a:0 "Suppress the riot by force!"
 under_the_haze.13.b:0 "Investigate this matter secretly."
 under_the_haze.14.name:0 "Under the Haze: §HLeader§!"
 under_the_haze.14.desc_a:0 "Our military operation achieved outstanding results.\n\nIn this armed suppression, we successfully captured the enemy leader. Through interrogation, we will soon know the truth of the incident."
 under_the_haze.14.desc_b:0 "Our investigation operation achieved outstanding results.\n\nWe successfully found the enemy leader and captured him. Through interrogation, we will soon know the truth of the incident."
 under_the_haze.14.a:0 "Great."
 under_the_haze.14.b:0 "Hope so."
 
 under_the_haze.2.name:0 "Under the Haze: §HDeath§!"
 under_the_haze.2.desc:0 "The enemy leader we captured died.\n\nOur interrogators stated that the enemy leader was unwilling to explain anything, even if tortured. Just last night, the enemy leader was unwilling to endure torture anymore and committed suicide by taking hidden poison. Our detention personnel said they would be responsible for their ineffective supervision."
 under_the_haze.2.a:0 "We lost a precious opportunity."
 under_the_haze.2.b:0 "Is it really so?"
 
 situation_under_the_haze_2:0 "Under the Haze"
 situation_under_the_haze_2_type:0 "Under the Haze"
 situation_under_the_haze_2_desc:0 "Our civilization is covered with a haze. Some things took root long before we stepped into the galaxy..."
 string_exists_under_the_haze_project:0 "£trigger_no£We should do something"
 situation_under_the_haze_2_monthly_change_tooltip:0 "$situation_monthly_change_tooltip_no_control$"
 situation_under_the_haze_2_complete_effect:0 "$situation_under_the_haze_1_complete_effect$"
 situation_under_the_haze_2_fail_effect:0 "$situation_under_the_haze_1_fail_effect$"
 
 under_the_haze.21.name:0 "Under the Haze: §HLie§!"
 under_the_haze.21.desc:0 "A low-level interrogator quietly found you.\n\nHe claimed that the captured leader's suicide was a lie, and some evidence had been collected, just needing some time to organize. He asked you to review this evidence and find out the truth behind the matter."
 under_the_haze.21.a:0 "I also want to find the truth."
 under_the_haze.21.b:0 "I have more important things to do."
 under_the_haze.22.name:0 "Under the Haze: §HAccident§!"
 under_the_haze.22.desc_a:0 "You waited for a long time, but the previous interrogator did not appear.\n\nWhen you asked the person in charge of the relevant department, the other party informed you that the person died in an accidental car accident a few days ago. The driver who caused the accident has escaped and is still being arrested."
 under_the_haze.22.desc_b:0 "You learned something unexpected from the media.\n\nThe previous interrogator died in an accidental car accident a few days ago. The driver who caused the accident has escaped and is still being arrested."
 under_the_haze.22.a:0 "This matter is very strange."
 under_the_haze.22.b:0 "What a poor person."
 under_the_haze.23.name:0 "Under the Haze: §HInvestigation§!"
 under_the_haze.23.desc:0 "This series of confusing events makes you curious, and you plan to investigate the truth of the event.\n\nYou know the address of that interrogator. There must be some information hidden inside. And the interrogator's death is likely not an accident. This accident may also bring some clues.\n\nYou vaguely think that this series of coincidences is inextricably linked to various government departments, so you hope to investigate as secretly as possible, but the manpower that can be deployed in the same period is limited."
 under_the_haze.23.a:0 "Prioritize finding out the cause of death of the enemy leader."
 under_the_haze.23.b:0 "Prioritize finding out the cause of death of the interrogator."
 under_the_haze.24.name:0 "Under the Haze: §HContinue§!"
 under_the_haze.24.desc:0 "The investigation results left you dumbfounded. You feel angry and afraid.\n\nHowever, there are still unsolved mysteries. To get closer to the truth, you'd better continue investigating. Similarly, this is still a covert operation and absolutely cannot be discovered by others."
 under_the_haze.24.a:0 "Continue investigating the cause of death of the enemy leader."
 under_the_haze.24.b:0 "Continue investigating the cause of death of the interrogator."
 under_the_haze.24.c:0 "Enough information has been mastered."
 under_the_haze.25.name:0 "Under the Haze: §HEnd?§!"
 under_the_haze.25.desc:0 "With the passage of time, most people have forgotten this series of turmoil.\n\nFinally, the haze lingering over our heads has dissipated, and everything is so beautiful and natural."
 under_the_haze.25.a:0 "§RIs it really over?§!"
 under_the_haze.26.name:0 "Under the Haze: §HData§!"
 under_the_haze.26.desc:0 "You led some trustworthy researchers to secretly search the interrogator's home.\n\nThere was almost nothing unusual in the house, as if it had been deliberately cleaned. Just when everyone was helpless, §Y[under_the_haze_researcher.GetName]§! found a clue-when irradiating the ceiling with a UV lamp, hidden characters would appear.\n\nAccording to the hidden information, you learned that the enemy leader had actually confessed long ago and was forcibly injected with poison shortly after confessing. In addition, the text mentioned the mysterious word \"Ishamara\" many times."
 under_the_haze.26.a:0 "How much did they hide from us?"
 under_the_haze.27.name:0 "Under the Haze: §HAccident§!"
 under_the_haze.27.desc:0 "You led some trustworthy researchers to secretly collect clues about the car accident.\n\nVarious information about the car accident is very accurate, and all evidence indicates that this was a pure accident. Just when everyone was helpless, §Y[under_the_haze_researcher.GetName]§! found a loophole-there was a very critical contradiction in the autopsy report, which means the autopsy report was fabricated.\n\nIf existing information is used to correct the contradiction, it can be proven that the interrogator died entirely from a deliberate murder."
 under_the_haze.27.a:0 "How much did they hide from us?"
 under_the_haze.28.name:0 "Under the Haze: §HData§!"
 under_the_haze.28.desc:0 "You led some trustworthy researchers to secretly search the interrogator's home.\n\nThere was almost nothing unusual in the house, as if it had been deliberately cleaned. Tried methods including UV irradiation and flame burning, but found no hidden text. Just when everyone was helpless, §Y[under_the_haze_researcher.GetName]§! found a semi-damaged information carrier, which might store important information."
 under_the_haze.28.a:0 "Repair the information carrier as soon as possible!"
 under_the_haze.29.name:0 "Under the Haze: §HAccident§!"
 under_the_haze.29.desc:0 "You led some trustworthy researchers to secretly collect clues about the car accident.\n\nVarious information about the car accident is very accurate, and all evidence indicates that this was a pure accident. Just when everyone was helpless, §Y[under_the_haze_researcher.GetName]§! found a loophole-there was a very critical contradiction in the autopsy report, which means the autopsy report was fabricated.\n\nIf existing information is used to correct the contradiction, it can be proven that the interrogator died entirely from a deliberate murder."
 under_the_haze.29.a:0 "Truly despicable behavior!"
 under_the_haze.30.name:0 "Under the Haze: §HRepair§!"
 under_the_haze.30.desc:0 "After a long time, the information carrier was finally repaired by §Y[under_the_haze_researcher.GetName]§!.\n\nAlthough most information cannot be restored, based on the remaining information, you learned that the enemy leader had actually confessed long ago and was forcibly injected with poison shortly after confessing. In addition, the information mentioned the mysterious word \"Ishamara\" many times."
 under_the_haze.30.a:0 "Truly despicable behavior!"
 
 under_the_haze.3.name:0 "Under the Haze: §HHistory§!"
 under_the_haze.3.desc:0 "We finally collected enough clues, but the truth is still out of reach.\n\nWe threw the evidence and clues in their faces at the Imperial Council and asked them to give a reasonable explanation for this. Those government dignitaries were dumbfounded when they saw our masterpiece, and the meeting was suddenly silent. After a long silence, they finally spoke.\n\nThey recalled our history, various religions in our history, and the largest religion that appeared in our history-Church of Ascension. They told us that the Church of Ascension did not decline due to the changes of the times, but was gradually banned by ancient monarchs reaching a consensus because the tenets and beliefs of the Church of Ascension were detrimental to their rule. Although the Church of Ascension has been buried in the river of time, some of its believers still quietly hide among ordinary people. Their faith, their spirit, their anger have been passed down from generation to generation.\n\nThose rioting people are the descendants of believers. Once we step into the sea of stars, the Church of Ascension will have no possibility of revenge, so they collectively attacked at this time and gave it a shot. And government dignitaries hope to eradicate the roots and bury the secrets of the Church of Ascension in the haze forever."
 under_the_haze.3.a:0 "Can we trust you again?"
 under_the_haze.3.b:0 "Can we distrust you?"
 
 situation_under_the_haze_3:0 "Under the Haze"
 situation_under_the_haze_3_type:0 "Under the Haze"
 situation_under_the_haze_3_desc:0 "Our civilization is covered with a haze. Some things took root long before we stepped into the galaxy..."
