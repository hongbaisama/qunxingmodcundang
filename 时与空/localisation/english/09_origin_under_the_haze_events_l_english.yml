 under_the_haze.41.name:0 "Under the Haze: §HForward§!"
 under_the_haze.41.desc:0 "§Y[Owner.leader.GetName]§!, very glad you can stand on our side.\n\nThe Church of Ascension is committed to making everyone become Ishamara, and Ishamara will help us, just like we planned to become nobles and partners who had become nobles helped us. Don't worry, don't be afraid, as long as you are willing to follow us all the way, we can give you everything you want, even eternal life.\n\nJoin our eternal evolution!"
 under_the_haze.41.a:0 "Keep moving forward, never look back!"
 under_the_haze.41.b:0 "The truth is far more than this..."
 under_the_haze.42.name:0 "Under the Haze: §HWar§!"
 under_the_haze.42.desc:0 "§Y[Owner.leader.GetName]§!, whether you are ready or not, the war has begun.\n\nThere is no turning back now. Sacrifice those faithless people and treacherous traitors to Ishamara, and we will be ascended!"
 under_the_haze.42.a:0 "Prepare for battle!"
 under_the_haze.44.name:0 "Under the Haze: §HDecisive Battle§!"
 under_the_haze.44.desc:0 "§Y[Owner.leader.GetName]§!, our battle on the ground has succeeded. Ishamara will be very happy.\n\nThose guys secretly built fleets at some point, but we will definitely crush them completely. Ishamara will protect us!"
 under_the_haze.44.a:0 "Last battle!"
 under_the_haze.46.name:0 "Under the Haze: §HVictory§!"
 under_the_haze.46.desc:0 "§Y[Owner.leader.GetName]§!, the war is won. No one can stop us anymore.\n\nNow it is time to conduct sacrifices and summon Ishamara to the present world.\nAccording to our bible records, when Ishamara appears, she will share her power with the summoner, allowing the summoner to evolve rapidly and gain powerful strength beyond ordinary people.\nNow, it is ours!"
 under_the_haze.46.a:0 "Long live Ishamara!"
 under_the_haze.47.name:0 "Under the Haze: §HManifestation§!"
 under_the_haze.47.desc:0 "Ishamara is here.\n\nAfter holding the sacrificial ceremony, Ishamara appeared out of thin air.\nShe is transparent and pure white throughout, like a strand of spotless white gauze, and also like a girl in her cardamom years.\nShe hovered quietly above us, whispering softly in an indistinguishable but reassuring tone.\nAt this moment, everyone's body and mind seemed to be washed by the morning dew. Everything was so calm and peaceful.\nAfter opening eyes, the sky has turned into warm pink, and the air is filled with sweet scent, intoxicating and pleasant.\n\nIshamara is here."
 under_the_haze.47.a:0 "The haze has truly ended."
 
 under_the_haze.51.name:0 "Under the Haze: §HForward§!"
 under_the_haze.51.desc:0 "§Y[Owner.leader.GetName]§!, very glad you can stand on our side.\n\nThe Church of Ascension are a bunch of selfish liars. They don't care about the life and death of ordinary people; they just want to gain powerful strength themselves. They believe in evil gods, but we need not fear, because of the weapons in our hands, because of the firm belief in our hearts, because all of us are united under the same banner.\n\nJoin us, fight for survival!"
 under_the_haze.51.a:0 "Keep moving forward, never look back!"
 under_the_haze.51.b:0 "The truth is far more than this..."
 under_the_haze.52.name:0 "Under the Haze: §HWar§!"
 under_the_haze.52.desc:0 "§Y[Owner.leader.GetName]§!, whether you are ready or not, the war has begun.\n\nThere is no turning back now. Sweep those worshipers of evil gods into the dustbin of history. The new era belongs to us!"
 under_the_haze.52.a:0 "Prepare for battle!"
 under_the_haze.54.name:0 "Under the Haze: §HDecisive Battle§!"
 under_the_haze.54.desc:0 "§Y[Owner.leader.GetName]§!, our battle on the ground has succeeded, but the situation is not optimistic.\n\nThe army of those guys is just a delaying tactic, delaying time for their sacrifice. Although we have defeated the enemy's army as soon as possible, they still frantically sacrificed a large number of victims and summoned their evil god. We have no retreat, behind us is our homeworld!"
 under_the_haze.54.a:0 "Last battle!"
 under_the_haze.56.name:0 "Under the Haze: §HVictory§!"
 under_the_haze.56.desc:0 "§Y[Owner.leader.GetName]§!, the war is won. The Church of Ascension has become history forever.\n\nWe will clean up the traces of the battlefield, bury the bodies of soldiers, destroy enemy strongholds, and study the wreckage of evil gods.\nWe will mourn for the people who sacrificed in this war for the whole country. We will firmly record this disaster and change in history books. We will walk out of this haze, learn lessons, warn future generations, and stride forward towards the era belonging to us!"
 under_the_haze.56.a:0 "Long live the new era!"
 under_the_haze.57.name:0 "Under the Haze: §HDawn§!"
 under_the_haze.57.desc:0 "The haze is over.\n\nThe battlefield cleanup is nearing its end, and post-disaster reconstruction is proceeding in an orderly manner.\nAll people, whether sad, painful, stunned, or confused, are now full of hope.\nWe don't have to hide anymore, we don't have to worry anymore, we don't have to be terrified anymore, we don't have to be insignificant anymore.\nWe are heroes. We are heroes who crushed the conspiracy of the cult. We are heroes who defended the peace of the homeworld. We are heroes who dispelled heavy fog.\nThis is a new era. This is the era of heroes. This is an era belonging to us.\n\nThe haze is over."
 under_the_haze.57.a:0 "The haze has truly ended."
 
 under_the_haze.5.name:0 "Under the Haze: §HEngagement§!"
 under_the_haze.5.desc:0 "The war will start soon.\n\nBoth sides of the war are waiting for your response, and both sides hope for your joining. Whichever side you join, that side will gain a huge advantage, but even if you remain neutral, they will not stop because of this. The tilt of the balance of war is only a matter of time."
 under_the_haze.5.a:0 "We will fight for survival!"
 under_the_haze.5.b:0 "We will fight for faith!"
 under_the_haze.5.c:0 "I have my own plans."
 under_the_haze.6.name:0 "Under the Haze: §RAdvent§!"
 under_the_haze.6.desc:0 "\"Victory belongs to the Adventists!\"\n\n\"Stupid religion, stupid people, and stupid you!\n\"What Church of Ascension, actually expecting an illusory god to redeem themselves and let themselves ascend? Truly stupid!\n\"What Resisters, just randomly planted some subordinates to provoke and then led by the nose, thinking they are fighting for themselves? Truly stupid!\n\"What National Will, blinded by the haze created by me, instead thinking they control the fate of the country? Truly stupid!\"\n\n\"Fight, war, the more people die the better.\n\"Whether Church of Ascension or Resisters, their souls will become tributes to the Horrific Inverse Phase, and their lives will become the opportunity for death to descend.\"\n\n§R\"I, am my own god!\"§!"
 under_the_haze.6.a:0 "All this is within my expectations, [under_the_haze_ruler.GetName]!"
 under_the_haze.6.b:0 "You will pay the price, [under_the_haze_ruler.GetName]!"
 under_the_haze.6.c:0 "You are the stupid one, [under_the_haze_ruler.GetName]!"
 under_the_haze.6.d:0 "Truly interesting, [under_the_haze_ruler.GetName]!"
 under_the_haze.6.e:0 "Who do you think you are, [under_the_haze_ruler.GetName]!"
 under_the_haze.6.f:0 "The wrath of the people will swallow you, [under_the_haze_ruler.GetName]!"
 under_the_haze.6.g:0 "No one can dictate to me, [under_the_haze_ruler.GetName]!"
 under_the_haze.6.h:0 "Stop dreaming, [under_the_haze_ruler.GetName]!"
 under_the_haze.8.name:0 "Under the Haze: §HTruth§!"
 under_the_haze.8.desc:0 "We finally defeated the former ruler §Y[under_the_haze_ruler.GetName]§!, but it is still foggy at present.\n\nWe don't know what exactly it did, nor what exactly it was for. It only left a wreckage. Studying the wreckage, maybe we can clear the haze and find the truth.\n\nAt least we can take a breath now."
 under_the_haze.8.a:0 "We have not yet understood the truth."
 under_the_haze.9.name:0 "Under the Haze: §HTwilight§!"
 under_the_haze.9.desc:0 "Everything is just a flash in the pan, twilight will eventually come.\n\n§Y[under_the_haze_ruler.GetName]§!-that hideous monster, still ushered in the end.\nIt claimed to be death, but could not escape the fate of death itself. Truly pathetic.\nIt is the founder of the Adventists. It has existed in this world since the beginning of the Church of Ascension. I don't know what method it mastered to survive until now.\nIts companions grew old, but it felt no sadness. It only rejoiced that fewer and fewer people knew the secret of its immortality.\nIt experienced too long a time, even no one in the Church of Ascension remembers its existence.\nIt quietly developed its own faction, bought those with unsteady will in the Church of Ascension, and bewitched those who did not know the truth among the general public.\nIts purpose is only one, that is to exchange as many deaths as possible for becoming a god itself.\nIt sowed discord, it used anger, it was self-righteous, it went to the end.\n\nThe false god ushered in its own twilight."
 under_the_haze.9.a:0 "Goodbye, [under_the_haze_ruler.GetName]!"
 
 under_the_haze.100.name:0 "Under the Haze: §RSilence§!"
 under_the_haze.100.desc:0 "The Great Silence has arrived.\n\nIn an instant-too fast for us to react, let alone prepare countermeasures-§Y[under_the_haze_planet.GetName]§!... was gone. Where once was a thriving colony, now there is only death. The powerful fleet that once sailed through the void now leaves only souls and wreckage. Everything was swallowed by the mist, everything was taken away by the haze.\n\nAll returned to nothingness, leaving only silence."
 under_the_haze.100.a:0 "......"
 under_the_haze.103.desc:0 "Just after we lost §Y[under_the_haze_planet.GetName]§!, the Great Silence arrived.\n\nIn an instant-too fast for us to react, let alone prepare countermeasures-§Y[under_the_haze_planet.GetName]§!... was gone. Where once was a thriving colony, now there is only death. The powerful fleet that once sailed through the void now leaves only souls and wreckage. Everything was swallowed by the mist, everything was taken away by the haze.\n\nAll returned to nothingness, leaving only silence."
 under_the_haze.103.a:0 "We can never discover the truth anymore."
 under_the_haze.104.desc:0 "Just after we took over §Y[under_the_haze_planet.GetName]§!, the Great Silence arrived.\n\nIn an instant-too fast for us to react, let alone prepare countermeasures-§Y[under_the_haze_planet.GetName]§!... was gone. Where once was a thriving colony, now there is only death. The powerful fleet that once sailed through the void now leaves only souls and wreckage. Everything was swallowed by the mist, everything was taken away by the haze.\n\nAll returned to nothingness, leaving only silence."
 under_the_haze.104.a:0 "What exactly happened?"