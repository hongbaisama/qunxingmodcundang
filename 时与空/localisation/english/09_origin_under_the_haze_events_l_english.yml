 situation_under_the_haze_3_fail_effect:0 "$situation_under_the_haze_1_fail_effect$"
 
 under_the_haze.31.name:0 "Under the Haze: §HHiding§!"
 under_the_haze.31.desc:0 "According to the return of the spies we planted among the believers of the Church of Ascension, the \"leader\" we captured earlier was not the real leader of the Church of Ascension. He was just a puppet standing in the open. The real culprit is still hiding in the dark.\n\nIn the last operation, the rioting people we arrested were just the tip of the iceberg of the Church of Ascension. The rest of the believers are still hiding all over the planet. The spies stated that the core organization of the Church of Ascension is likely hiding in the city, hiding among ordinary people, waiting for the right time to reappear and trigger rebellion. However, some government dignitaries stated that they learned through their secret channels that the Industrial District is more likely to be the secret base of the Church of Ascension. But other high-level officials pointed out that they were avenging personal wrongs in the name of public interests, and Generator Districts, Mining Districts, Agriculture Districts, etc. should be key search targets."
 under_the_haze.31.city:0 "Search City Districts."
 under_the_haze.31.generator:0 "Search Generator Districts."
 under_the_haze.31.mining:0 "Search Mining Districts."
 under_the_haze.31.farming:0 "Search Agriculture Districts."
 under_the_haze.32.name:0 "Under the Haze: §HFutile§!"
 under_the_haze.32.desc_city:0 "The team sent to search the City Districts did not bring good news.\n\nThey focused on searching the slums because the chaotic lower city is the easiest place to breed crime and the most suitable place for the Church of Ascension to hide. However, whether they alerted the enemy or went in the wrong direction from the beginning, the search team failed to find any clues about the Church of Ascension. Instead, they rudely destroyed some buildings due to the search behavior and caused dissatisfaction among some people."
 under_the_haze.32.desc_generator:0 "The team sent to search the Generator Districts did not bring good news.\n\nThey focused on searching the energy distribution center because it controls the energy supply to the planet. Once the Church of Ascension seizes the center, it will gain a huge advantage. However, whether they alerted the enemy or went in the wrong direction from the beginning, the search team failed to find any clues about the Church of Ascension. Instead, they rudely destroyed some buildings due to the search behavior and caused dissatisfaction among some power supply staff."
 under_the_haze.32.desc_mining:0 "The team sent to search the Mining Districts did not bring good news.\n\nThey focused on searching the mineral refining area because it produces various building materials and treasures, which is very likely to become a coveted target of the Church of Ascension. However, whether they alerted the enemy or went in the wrong direction from the beginning, the search team failed to find any clues about the Church of Ascension. Instead, they rudely destroyed some buildings due to the search behavior and caused dissatisfaction among some miners."
 under_the_haze.32.desc_farming:0 "The team sent to search the Agriculture Districts did not bring good news.\n\nThey focused on searching the granary because the granary stores enough food to cope with famine, enabling the Church of Ascension, which is difficult to obtain supplies, to lurk for a longer time. However, whether they alerted the enemy or went in the wrong direction from the beginning, the search team failed to find any clues about the Church of Ascension. Instead, they rudely destroyed some buildings due to the search behavior and caused dissatisfaction among some farmers."
 under_the_haze.32.city:0 "Change to search City Districts."
 under_the_haze.32.generator:0 "Change to search Generator Districts."
 under_the_haze.32.mining:0 "Change to search Mining Districts."
 under_the_haze.32.farming:0 "Change to search Agriculture Districts."
 under_the_haze.33.name:0 "Under the Haze: §HBase§!"
 under_the_haze.33.desc:0 "After a long search, we finally discovered the secret base of the Church of Ascension.\n\nWho would have thought that a huge cave was buried under an ordinary lake, and the entrances to the cave were scattered around the lake, even including the cellar of an abandoned church! Our army is preparing to attack the secret base. When the time is right, we will capture this cave and catch the core figures of the Church of Ascension in one fell swoop."
 under_the_haze.33.a:0 "Well done."
 under_the_haze.34.name:0 "Under the Haze: §HDeity§!"
 under_the_haze.34.desc:0 "Our archeologists made an unexpected discovery.\n\nBy comparing with historical records, one of the mysterious creatures depicted on the mural seems to be Ishamara-a deity worshipped by the Church of Ascension. In the doctrine of the Church of Ascension, this deity means evolution and ascension, the highest form that creatures can evolve into, the origin of matter, and the end of consciousness. The mural also seems to imply the arrival of Ishamara, but specific information remains to be verified."
 under_the_haze.34.a:0 "Unbelievable."
 under_the_haze.35.name:0 "Under the Haze: §HEnd?§!"
 under_the_haze.35.desc:0 "Since then, there has been no movement from the Church of Ascension. With the passage of time, most people have forgotten this series of turmoil.\n\nFinally, the haze lingering over our heads has dissipated, and everything is so beautiful and natural."
 under_the_haze.35.a:0 "§RIs it really over?§!"
 under_the_haze.36.name:0 "Under the Haze: §HMissing§!"
 under_the_haze.36.desc:0 "The search team we sent suddenly lost track, and we couldn't contact them despite many methods.\n\n§YGovernment dignitaries§! firmly believe that they must have gained something and found the core organization of the Church of Ascension, so they were attacked by the Church of Ascension and lost contact. But some §Yhigh-level officials§! also believe that the search team may indeed be close to the core, but they are still lurking, so they stopped contacting us. We should wait quietly."
 under_the_haze.36.a:0 "Launch rescue operation immediately."
 under_the_haze.36.b:0 "Trust the search team."
 under_the_haze.37.name:0 "Under the Haze: §HSacrifice§!"
 under_the_haze.37.desc:0 "We finally found the investigation team, but only their bones.\n\nThe sacrifice of the investigation team is not meaningless. The Church of Ascension can only act covertly, so the burial place must be close to the core organization of the Church of Ascension. We just need to launch a range search with this as the center, and we will definitely find their secret base."
 under_the_haze.37.a:0 "We will remember them."
 under_the_haze.38.name:0 "Under the Haze: §HSubmerged§!"
 under_the_haze.38.desc:0 "Believers of the Church of Ascension are truly frenzied.\n\nAfter our army launched an attack on the secret base, the believers of the Church of Ascension found that they were unable to resist, and actually detonated explosives at the top of the cave-obviously they were ready to perish together. Many of our soldiers and believers of the Church of Ascension drowned in the lake water gushing from the top. This attack was not successful. We urgently need to launch an operation to clean up the lake water poured into the cave, otherwise we will not only be unable to recover the soldiers' bodies but also unable to learn the final plan of the Church of Ascension."
 under_the_haze.38.a:0 "Launch excavation operation immediately."
 under_the_haze.38.b:0 "Let them sleep in the lake forever."
 under_the_haze.39.name:0 "Under the Haze: §HMural§!"
 under_the_haze.39.desc:0 "The lake water has finally been cleaned up, and we can carefully search this base of the Church of Ascension.\n\nMost paper books and mechanical equipment were severely damaged, and it is difficult to repair them on a large scale with existing technology. Our technicians are collecting and interpreting the remaining data as much as possible. However, these documents are not the only ones. There are also mysterious murals on the cave walls left for us, which seem to depict some unknown existences, but the specific meaning still needs to be studied by our archeologists."
 under_the_haze.39.a:0 "What do these mean exactly?"
 under_the_haze.40.name:0 "Under the Haze: §HBan§!"
 under_the_haze.40.desc:0 "The study of the murals was suddenly banned, and the archeologists participating in the research work were also secretly executed.\n\nThe government dignitaries who issued the ban stated that this mural contains §Rvery dangerous§! information. Once interpreted, it is very likely to plunge us into a place of no return. Now, the main figures of the Church of Ascension have drowned in the lake water, and other believers have scattered and fled, becoming insignificant. Therefore, our best course of action now is to seal these murals and let it and the Church of Ascension be silent in history forever."
 under_the_haze.40.a:0 "We must know the meaning of the murals!"
 under_the_haze.40.b:0 "We have borne too much..."
 
 under_the_haze.4.name:0 "Under the Haze: §HChoice§!"
 under_the_haze.4.desc:0 "The content of the mural has been basically interpreted.\n\nThis mural not only talks about the deity Ishamara but also records a shocking conspiracy spanning thousands of years. The Church of Ascension was indeed suppressed and banned by ancient rulers, but its decline was not due to this, or rather, the Church of Ascension never silenced in the dark. Believers of the Church of Ascension learned of the rulers' actions and decided to hide their identities and mix into the nobility. Through mutual help, most believers have their own prestigious families. The families of the Church of Ascension have been supporting each other secretly for thousands of years. Whether it is dynasty change or civilization rise and fall, they are always there. The Church of Ascension always has a place in the ruling class, even now.\n\nMore than half of the upper class of this society believe in the Church of Ascension, but they disguise themselves very exquisitely. Coupled with the cover of their power, ordinary people cannot know the truth at all. Believers of the Church of Ascension are extremely crazy. They plan to conduct a grand sacrifice after stepping into the sea of stars, using the people of the entire §Y[Target.GetName]§! as sacrifices in exchange for Ishamara's appearance in the universe and leading them to ascend to godhood. However, the Church of Ascension is not completely monolithic. A branch called Adventists appeared among them. This branch betrayed the Church of Ascension and fled among ordinary people with secrets. The previous riots were organized by the Adventists.\n\nNow, the Adventists and the general public have reached a common consensus. They rose up in revolt, vowing to resist the rule and sacrifice of the Church of Ascension. They fight for survival. The Church of Ascension has also gathered the power of upper-class people from all walks of life and the army. The appearance of Ishamara is unstoppable. They fight for faith."
 under_the_haze.4.a:0 "We will fight for survival!"
 under_the_haze.4.b:0 "We will fight for faith!"
 under_the_haze.4.c:0 "I have my own plans."
 
