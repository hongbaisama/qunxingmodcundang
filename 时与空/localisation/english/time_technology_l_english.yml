 gateway_origin_corrupt_brain:0 "§HPath of Purification§!\n§EThis technology allows launching self-rescue for the Master Mind.§!"
 
 tech_time_hide:0 "Time and Space: Hidden Tech"
 tech_time_hide_desc:0 "Time and Space Mod prerequisite technology for hiding certain things, you should not see it."
 
 tech_horror_focus_1:0 "Photon String Resonance"
 tech_horror_focus_1_desc:0 "Through the study of the neural conduction mechanism of the Nightmare of the Plane, we can now use the string resonance effect to manipulate the photon signals of enemy ships and usurp command power."
 tech_horror_focus_1_effect:0 "§HUnlock Feature:§! Inverse Phase weapons can cause ['concept_confusion'] or ['concept_terrify']"
 tech_horror_focus_2:0 "Inverse Phase Body Reshaping"
 tech_horror_focus_2_desc:0 "Our bodies are far from the most perfect form. To better fit the Inverse Plane, we urgently need to reshape them."
 tech_horror_focus_2_effect:0 "['concept_tech_time_trait'] Point Cost: §G-1§!\n§HUnlock Feature:§! Remove ['concept_tech_time_trait']"
 
 tech_coils_god_1:0 "Coils of God"
 tech_coils_god_1_desc:0 "We found this object from a pre-FTL civilization, engraved with: \"Lesson given to the lost\".\nThis seems to be just an ordinary circle, but strange energy can be felt from it, though perhaps it is just psychological."
 tech_coils_god_2:0 "Coils of God"
 tech_coils_god_2_desc:0 "A pre-FTL civilization gave us a gift, engraved with: \"Treasure gifted to devout believers\".\nThis seems to be just an ordinary circle, but strange energy can be felt from it, though perhaps it is just psychological."
 
 tech_akx_ouroboros:0 "Ouroboros"
 tech_akx_ouroboros_desc:0 "The Ouroboros symbolizes the infinite cycle. This is not the end, nor is it the beginning."
 
 tech_horror_titan_blueprint:0 "Blueprint: Messenger of Future"
 tech_horror_titan_blueprint_desc:0 "We obtained the complete control rights of Omega Ark, but also lost its past and future."
 tech_time_titan_blueprint:0 "Blueprint: Messenger of Hope"
 tech_time_titan_blueprint_desc:0 "Our understanding of the Inverse Plane is increasing day by day. Perhaps we can modify the Messenger of Future to approach its original appearance."
 tech_end_titan_blueprint:0 "Blueprint: Messenger of End"
 tech_end_titan_blueprint_desc:0 "We have mastered the mystery of Inverse Spacetime. Perhaps we can modify the Messenger of Hope to restore its original appearance."
 
 tech_building_time_hotel:0 "Legacy of Time"
 tech_building_time_hotel_desc:0 "The structure of the Time Prison deeply attracted our scientists. Such an exquisite building may soon be created by us."
 tech_time_microsingularity:0 "Mystery of Singularity"
 tech_time_microsingularity_desc:0 "The secret of the Time Prison lies in the micro-singularities filling the walls. They may be useful in ship design."
 tech_noah_ark:0 "Noah Reappearance"
 tech_noah_ark_desc:0 "According to the log records of the Noah civilization, maybe we can use our technology to restore its true appearance."
 
 tech_corrupt_brain_hive_1:0 "Corrupted Gene Editing Project"
 tech_corrupt_brain_hive_1_desc:0 "We have made progress in saving the Corrupted Mind, but this can only temporarily alleviate the impact of corruption. If it comes to the last moment, we may rely on this technology to make a desperate gamble."
 tech_corrupt_brain_hive_2:0 "Corrupted Synapse Control Mechanism"
 tech_corrupt_brain_hive_2_desc:0 "$tech_corrupt_brain_hive_1_desc$"
 tech_corrupt_brain_hive_3:0 "Corrupted Node Self-Purification Network"
