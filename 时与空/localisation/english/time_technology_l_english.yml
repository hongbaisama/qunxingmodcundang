 tech_change_pc_time:0 "$tech_change_pc_time_0$"
 tech_change_pc_time_desc:0 "$tech_change_pc_time_0_desc$"
 tech_change_pc_time_0:0 "Singularity Compression"
 tech_change_pc_time_0_desc:0 "Singularity is not the form with the highest density; we can compress it again."
 tech_change_pc_time_0_custom:0 "§HUnlock Feature:§! Compress Singularity"
 tech_change_pc_time_0_custom_desc:0 "Under the hint of The Worm-in-Waiting, we can try this unprecedented Black Hole compression technology-compressing the singularity to make its density overflow. Only with the help of The Worm-in-Waiting can we complete this compression process. Therefore, we can only compress our homeworld.\nHowever, The Worm-in-Waiting only told us that this act could allow us to understand all the mysteries of the universe, but did not tell us what the price is.\n§RWhat is the price?§!"
 tech_change_pc_time_0_effect:0 "§Y$district_endless_time$§! effect §Genhanced§!\n§Y$district_endless_time_physics$§! effect §Genhanced§!\n§Y$district_endless_time_society$§! effect §Genhanced§!\n§Y$district_endless_time_engineering$§! effect §Genhanced§!"
 tech_change_pc_time_1:0 "Black Hole Seal"
 tech_change_pc_time_1_desc:0 "Black Holes are all evil and devoid of beauty, and our former homeworld is even more so."
 tech_change_pc_time_1_custom:0 "§HUnlock Feature:§! Seal Black Hole"
 tech_change_pc_time_1_custom_desc:0 "We have returned to this homeland from tens of thousands of years ago. However, it is now extremely strange to us, even appearing full of evil. We should change it back to its original appearance and designate it as a forbidden land to warn future generations."
 tech_change_pc_time_2:0 "Black Hole Peep"
 tech_change_pc_time_2_desc:0 "Every Black Hole in the universe hides mysteries, and our former homeworld is no exception."
 tech_change_pc_time_2_custom:0 "§HUnlock Feature:§! Peep Black Hole"
 tech_change_pc_time_2_custom_desc:0 "We have returned to this mysterious Black Hole. It is different from other Black Holes in the universe. We may never know the reason. But we can try to transform it into a normal Black Hole and peep into the secrets of the Black Hole in the process."
 
 tech_time_blocker_1:0 "Gravity Tuner"
 tech_time_blocker_1_desc:0 "Through the study of gravity, we successfully made a Gravity Tuner to eliminate gravitational anomalies."
 tech_time_blocker_2:0 "Gravity Resonator"
 tech_time_blocker_2_desc:0 "Through the study of gravity, we successfully made a Gravity Resonator, which can break through the gravitational barrier through resonance."
 tech_time_blocker_3:0 "Gravity Reversal Core"
 tech_time_blocker_3_desc:0 "Through the study of gravity, we successfully made a Gravity Reversal Core, making it possible to repair gravitational traps."
 
 tech_gas_blocker_1:0 "Anticyclone Device"
 tech_gas_blocker_1_desc:0 "To stop the dust storm, we made an Anticyclone Device."
 tech_gas_blocker_2:0 "Spaceship Recovery Device"
 tech_gas_blocker_2_desc:0 "To prevent spaceship wreckage from causing further damage, we made a Spaceship Recovery Device."
 
 tech_psionic_blocker_1:0 "Psionic Suppression Barrier"
 tech_psionic_blocker_1_desc:0 "We invented the Psionic Suppression Barrier, which can stop the psionic abyss from continuing to expand."
 tech_psionic_blocker_2:0 "Shroud Deterrence Magic"
 tech_psionic_blocker_2_desc:0 "We invented Shroud Deterrence Magic, which can prevent more Shroud creatures from invading."
 
 tech_nanites_blocker_1:0 "Crater Repair Team"
 tech_nanites_blocker_1_desc:0 "The crater repair team is ready to repair meteorite craters on the planet at any time."
 tech_nanites_blocker_2:0 "Cyclone Reversal Team"
 tech_nanites_blocker_2_desc:0 "The cyclone reversal team is ready to reverse nanite cyclones on the planet at any time."
 tech_nanites_blocker_3:0 "Quicksand Fixation Team"
 tech_nanites_blocker_3_desc:0 "The quicksand fixation team is ready to fix nanite quicksand on the planet at any time."
 
 tech_parallel_sky_blocker:0 "Information Analysis Computer"
 tech_parallel_sky_blocker_desc:0 "Through the analysis of information radiation, we can reorganize information turbulence into stable information flow and obtain hidden secrets from it."
 
