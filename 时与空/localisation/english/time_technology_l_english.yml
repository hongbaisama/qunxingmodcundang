 # 终焉宣告
 
 tech_dimensional_horror_crisis_storm_protection_level_1:0 "Inverse Phase Diversion"
 tech_dimensional_horror_crisis_storm_protection_level_1_desc:0 "Tear open a gap to the Inverse Plane and influence the energy distribution of the Proclamation of the End through diversion effect to avoid large-scale damage."
 tech_dimensional_horror_crisis_storm_protection_level_2:0 "Inverse Phase Barrier"
 tech_dimensional_horror_crisis_storm_protection_level_2_desc:0 "Deploy a barrier composed of Inverse Phase matter to isolate important equipment from the Proclamation of the End in spacetime to reduce large-scale damage."
 tech_dimensional_horror_crisis_storm_protection_level_3:0 "Negative Mass Trap"
 tech_dimensional_horror_crisis_storm_protection_level_3_desc:0 "Create a negative mass trap to absorb unstoppable End matter flow to ensure a certain degree of safety."
 tech_dimensional_horror_crisis_storm_protection_level_4:0 "Negative Energy Fold"
 tech_dimensional_horror_crisis_storm_protection_level_4_desc:0 "Form a negative energy fold to refract undelayable End energy flow to ensure a certain degree of stability."
 tech_dimensional_horror_crisis_storm_protection_level_5:0 "Positive Phase Spacetime Field"
 tech_dimensional_horror_crisis_storm_protection_level_5_desc:0 "Use Astral materials to create a Positive Phase Spacetime Field covering the whole country to offset the spacetime distortion effect of the Proclamation of the End to a certain extent."
 
 tech_dimensional_horror_crisis_storm_protection_building_1:0 "Negative Sound Wave Communication"
 tech_dimensional_horror_crisis_storm_protection_building_1_desc:0 "Use Inverse Phase matter as sound wave transmission medium to make long-distance communication possible during the Proclamation of the End."
 tech_dimensional_horror_crisis_storm_protection_building_2:0 "Negative Dimension Storage"
 tech_dimensional_horror_crisis_storm_protection_building_2_desc:0 "Use the Inverse Plane as a material storage container to free up more space to settle refugees in the Proclamation of the End."
 tech_dimensional_horror_crisis_storm_protection_building_3:0 "Negative Substrate Terraforming"
 tech_dimensional_horror_crisis_storm_protection_building_3_desc:0 "Use Inverse Phase matter as a substrate for terraforming to create a safe haven in the world shrouded by the Proclamation of the End."
 tech_dimensional_horror_crisis_storm_protection_building_4:0 "Negative Life Backup"
 tech_dimensional_horror_crisis_storm_protection_building_4_desc:0 "Use the Inverse Plane as a place for life backup to make up for the loss of precious productivity caused by the Proclamation of the End."
 tech_dimensional_horror_crisis_storm_protection_building_5:0 "Reverse Cycle Backtracking"
 tech_dimensional_horror_crisis_storm_protection_building_5_desc:0 "Use Astral materials to backtrack the reverse cycle of partial spacetime, delay and accelerate the impact caused by the Proclamation of the End, making it conflict and become invalid."
 
 tech_dimensional_horror_crisis_storm_protection_component_1:0 "Inverse Action Engine"
 tech_dimensional_horror_crisis_storm_protection_component_1_desc:0 "Using the interaction force between Inverse Phase matter as the propulsion principle, the irregular movement trajectory can even avoid the bombardment of the Proclamation of the End."
 tech_dimensional_horror_crisis_storm_protection_component_2:0 "Negative Superposition Device"
 tech_dimensional_horror_crisis_storm_protection_component_2_desc:0 "Use Inverse Phase matter to superimpose different spacetimes in reverse direction, allowing ships to modify their own coordinates to a safe area in critical moments."
 tech_dimensional_horror_crisis_storm_protection_component_3:0 "Negative Potential Energy Shield"
 tech_dimensional_horror_crisis_storm_protection_component_3_desc:0 "Release the negative potential energy possessed by Inverse Phase matter instantly to resist the energy disturbance of the Proclamation of the End."
 tech_dimensional_horror_crisis_storm_protection_component_4:0 "Negative Resistance Armor"
 tech_dimensional_horror_crisis_storm_protection_component_4_desc:0 "Reinforce armor with the negative resistance characteristics of Inverse Phase matter, capable of deflecting non-fatal weapon attacks."
 tech_dimensional_horror_crisis_storm_protection_component_5:0 "Acausal Core"
 tech_dimensional_horror_crisis_storm_protection_component_5_desc:0 "Use Astral materials to reverse the order of cause and effect, making the harm of the Proclamation of the End detach from spacetime and be erased."