 sm_time_titan_time_microsingularity_desc: "该舰船表面密布微型奇点，并藉此从负相汲取能量。"
 sm_time_titan_time_microsingularity_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_TIME_TITAN_AUX_SLOTS$\n$t$这些专用辅助槽位将装备§Y$TIME_MICROSINGULARITY$§!。"
 sm_time_titan_resource_silo: "潘多拉魔盒"
 sm_time_titan_resource_silo_desc: "这个神秘魔盒的存储容量远比外表看上去要大得多，但存入的物资被取出时总是会变成不同的形态。"
 sm_time_titan_max_workforce: "彼岸之门"
 sm_time_titan_max_workforce_desc: "这个装置负责耦合彼岸与现世，允许两个世界间以更多的方式进行物质运输与信息交流。"
 sm_time_titan_maintenance_cap: "真实之窗"
 sm_time_titan_maintenance_cap_desc: "这个装置负责模拟彼岸与现世的缓冲地带——我们将其称为“真实”，并藉此巩固两个世界之间的桥梁。"
 sm_time_titan_maintenance: "现世之镜"
 sm_time_titan_maintenance_desc: "这个装置负责在交换前对现世的物质与信息进行审查，以确保两个世界间的通道稳定。"
 