l_english:
 sm_district_time_usage_cap_module:0 "Plane Resonance Pilot Tower"
 sm_district_time_usage_cap_module_desc:0 "To perform safe and accurate deep shuttling in endless planes, a pilot tower using resonance to transmit signals is indispensable."
 
 sm_col_time_module:0 "Negative Phase Elevation Signal Standard"
 sm_col_time_module_desc:0 "In order to accurately elevate the dimension to match the negative phase spacetime, it is essential to perfectly locate the coordinates within the field of view."
 
 sm_time_energy_hub:0 "Singularity Radiation Absorption Field"
 sm_time_energy_hub_desc:0 "These devices can absorb radiation from the singularity to increase overall power generation output."
 
 sm_time_minerals_hub:0 "Singularity Matter Decompressor"
 sm_time_minerals_hub_desc:0 "These devices can decompress matter from the singularity, allowing new mineral production increase technologies to be applied."
 
 sm_time_food_hub:0 "Singularity Time Accelerator"
 sm_time_food_hub_desc:0 "These devices can use the singularity to accelerate time, speed up crop maturation, and increase agricultural output."
 
 sm_time_consumer_goods_hub:0 "Singularity Logistics Distribution Station"
 sm_time_consumer_goods_hub_desc:0 "Transfer logistics operations to the singularity that can arbitrarily distort space, allowing distribution personnel to continue operating at maximum efficiency."
 
 sm_time_alloys_hub:0 "Singularity Alloy Refinery"
 sm_time_alloys_hub_desc:0 "Alloys produced outside the horizon are further processed in the dense singularity to produce usable materials from by-products that might otherwise be wasted."
 
 sm_time_unity_hub:0 "Singularity Art Museum"
 sm_time_unity_hub_desc:0 "The singularity gathers inspiration from the past and future. Every exhibit here is a peerless masterpiece that cannot be reproduced."
 
 sm_time_physics_research_hub:0 "Singularity Particle Institute"
 sm_time_physics_research_hub_desc:0 "Particles in the singularity have extremely special properties. Studying them can improve our understanding of natural laws."
 
 sm_time_society_research_hub:0 "Singularity Mirror Observation Room"
 sm_time_society_research_hub_desc:0 "There are countless mirror universes in the singularity. Observing them can improve our cognition of social operation."
 
 sm_time_engineering_research_hub:0 "Singularity Reality Distortion Domain"
 sm_time_engineering_research_hub_desc:0 "The singularity is full of domains enough to distort reality. Utilizing them can improve our skills in manipulating matter."
 
 
 
 sm_white_hole_recycle_bin_rare:0 "Otherworld Resource Collection Station"
 sm_white_hole_recycle_bin_rare_desc:0 "This White Hole seems to connect to another world, countless rare resources flow slowly at the edge of the horizon."
 sm_white_hole_recycle_bin_research:0 "White Hole Repulsion Research Station"
 sm_white_hole_recycle_bin_research_desc:0 "The repulsion property of this White Hole is different from other White Holes. It is said that a Black Hole is hidden in it."
 sm_white_hole_recycle_bin_minerals:0 "White Hole Matter Recovery Station"
 sm_white_hole_recycle_bin_minerals_desc:0 "The White Hole continuously spews matter outwards. It would be a pity not to recover it from the source."
 sm_white_hole_recycle_bin:0 "$sm_white_hole_recycle_bin_minerals$"
 sm_white_hole_recycle_bin_desc:0 "$sm_white_hole_recycle_bin_minerals_desc$"
 white_hole_recycle_bin_effect:0 "§YEnvironmental hazards caused by White Hole §Ghalved§!§!"
 
 
 
 sm_noah_ark:0 "Noah's Ark"
 sm_noah_ark_desc:0 "We reproduced the miniature model of Noah's Ark based on the log of Noah civilization. Although its practicality is not higher than our ships, its spiritual significance will always inspire our people."
 sm_noah_ark_civilian_spinal:0 "文化遗产保存室"
 sm_noah_ark_civilian_spinal_desc:0 "世界上有太多消亡的文化，若是不将它们的遗产保存下来就太可惜了。"
 sm_noah_ark_science_spinal:0 "异种历史研究室"
 sm_noah_ark_science_spinal_desc:0 "世界上有太多灭绝的物种，研究它们的历史或许能对我们有所启发。"
 noah_ark_spinal_effect:0 "根据方舟舰上的§Y物种数§!增强以下效果（§Y存在上限§!）"
 
 sm_akx_hyperspace_specialty:0 "Hyperspace Listening Post"
 sm_akx_hyperspace_specialty_desc:0 "Listening post improved using sensing technology from another world, can more clearly grasp the movement of the sea of stars, and also make our people feel safer."
 akx_hyperspace_specialty_effect:0 "§YCan be enhanced by $councilor_hyperspace_specialty$§!"
 akx_hyperspace_specialty_upgrade_effect:0 "§YCan be enhanced by $councilor_hyperspace_specialty$, and additionally reduce $MOD_PLANET_CRIME_ADD$§!"
 
 sm_nanites_protector:0 "Nanite Guardian"
 sm_nanites_protector_desc:0 "We built this nanite storm generator based on the data recorded in the storage component. It can instantly split into countless nanobots to cover the entire system, causing irreversible damage to enemy armor while selectively providing repair functions for our warships."
 sm_nanites_ring_habitation:0 "Nanite Matrix Node"
 sm_nanites_ring_habitation_desc:0 "Ring World is a megastructure loved by former masters.\nAlthough the reason is unknown, and it is difficult for us to effectively utilize the Ring World, we will build our own ring matrix in our own unique way."
 sm_nanites_study_system:0 "Nanite Learning System"
 sm_nanites_study_system_desc:0 "The learning process of organisms is too inefficient, while as nanobots we have convenient enough ways to master more skills."
 nanites_study_system_effect:0 "£job_maintenance_drone£§Y$job_nanites_logistics_drone$§! will increase output based on completed §YDistricts§! and §YZones§!"
 sm_nanites_sapient_network:0 "Nanite Sapient Network"
 sm_nanites_sapient_network_desc:0 "As numerous nanobots, establishing a network with certain intelligence among units is conducive to improving work efficiency."
 nanites_sapient_network_effect:0 "£job_maintenance_drone£§Y$job_nanites_logistics_drone$§! will increase output based on completed §YBuildings§!"
 
 sm_pirate_king_arkship_spinal_devastator_mount: "$sm_arkship_spinal_devastator_mount$"
 sm_pirate_king_arkship_spinal_devastator_mount_desc: "$sm_arkship_spinal_devastator_mount_desc$"
 sm_pirate_king_arkship_building_1:0 "雇佣兵营地"
 sm_pirate_king_arkship_building_1_desc:0 "这群雇佣兵在太空中久经沙场，他们熟悉如何训练合格的战士以及如何增强火炮的威力。"
 pirate_king_arkship_building_1_effect_1:0 "根据§Y$PLANET_CRIME_TITLE$§!提供§Y$MOD_SHIP_HULL_DAMAGE_MULT$§!、§Y$MOD_SHIP_ARMOR_DAMAGE_MULT$§!与§Y$MOD_SHIP_SHIELD_DAMAGE_MULT$§!"
 pirate_king_arkship_building_1_effect_2:0 "根据§Y$PLANET_CRIME_TITLE$§!提供§Y$MOD_PLANET_ARMY_BUILD_SPEED_MULT$§!"
 sm_pirate_king_arkship_building_2:0 "黑市销赃处"
 sm_pirate_king_arkship_building_2_desc:0 "这块销赃处对太空中的所有海盗开放，而我们只会收取他们一点小小的手续费。"
 pirate_king_arkship_building_2_effect:0 "根据§Y$PLANET_CRIME_TITLE$§!与§Y人口数§!产出$r_minerals$与$r_trade$"
 sm_pirate_king_arkship_building_3:0 "先祖造船厂"
 sm_pirate_king_arkship_building_3_desc:0 "通过逆向研究我们先祖的战舰，我们终于领悟了一个道理——拼就完事了，能动就行。"
 pirate_king_arkship_building_3_effect_1:0 "根据§Y$PLANET_CRIME_TITLE$§!提供§Y$MOD_PLANET_BUILDING_CAPACITY_ADD$§!"
 pirate_king_arkship_building_3_effect_2:0 "根据§Y$PLANET_CRIME_TITLE$§!减少§Y$MOD_STARBASE_SHIPYARD_BUILD_COST_MULT$§!"
 sm_pirate_king_arkship_building_4:0 "海盗珠宝行"
 sm_pirate_king_arkship_building_4_desc:0 "海盗抢完了财富却多到没地方花？这家珠宝行保证能掏空每一位水手的腰包，让他们充满干劲地继续下一单。"
 pirate_king_arkship_building_4_effect:0 "根据§Y$PLANET_CRIME_TITLE$§!提供§Y$MOD_POP_BONUS_WORKFORCE_MULT$§!与§Y$MOD_JOB_MAX_WORKFORCE_MULT$§!"
 sm_pirate_king_arkship_building_5:0 "死界魔法阵"
 sm_pirate_king_arkship_building_5_desc:0 "海盗之王留下的诡异魔法阵吸引着我们，我们试探性地将其绘制在方舟舰上，却似乎什么也没有发生？"
 pirate_king_arkship_building_5_effect:0 "根据§Y$PLANET_CRIME_TITLE$§!提供§Y$MOD_SHIP_DAMAGE_REDUCTION_MULT$§!"
 
 
 
