 string_require_dimension_traveler_out:0 "£trigger_no£If engines are not started, we will eventually fall into the Black Hole"
 string_dimension_traveler_out_impossible:0 "£trigger_no£It is impossible to resist the Black Hole's gravity with only the ship's power, unless a miracle happens"
