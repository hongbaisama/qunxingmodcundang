 stage_dimension_traveler_2:0 "Center of White Hole"
 stage_dimension_traveler_3:0 "White Hole Domain"
 stage_dimension_traveler_4:0 "Border of White Hole"
 stage_dimension_traveler_5:0 "White Hole Event Horizon"
