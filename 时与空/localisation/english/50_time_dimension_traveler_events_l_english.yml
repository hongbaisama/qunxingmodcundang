 #负相奥秘/时空因果
 dimension_traveler.500.desc.1:0 "The Inverse Plane is truly a peculiar world. Can't imagine such an exquisite dimension exists in the universe.\n\nYou have already started exploring the depths of the Inverse Phase, and I am also curious about the mysteries of the Inverse Phase.\nI have a premonition that the path we are about to embark on will intertwine our destinies, and I want to figure out what that is.\n\nSo, let me join the research on the Inverse Phase too."
 dimension_traveler.500.desc.2:0 "Ah, we returned to the Inverse Phase again, as if returning to the initial starting point.\n\nI can't help but recall the countless reincarnations we once encountered.\nAt that time, we hadn't broken free from the shackles of fate, but we were still fighting for meeting each other.\nFortunately, at the time origin, we will eventually meet again.\nIt was also in the reunions again and again that we finally understood the meaning of each other and the true meaning of transcending causality.\n\nLeave the depths of the Inverse Phase to me."
 dimension_traveler.500.a:0 "That couldn't be better."
 dimension_traveler.500.b:0 "Truly filled with emotion."
 
 dimension_traveler.510.desc.1:0 "Is what we are doing really correct?\n\nAlthough we do have a full understanding of the Inverse Phase and spacetime, we are not clear about the future direction.\nThese days, I thought for a long time. I have been worried that our continued deepening will be a mistake...\n\nBut, isn't the future just like this?\nFuture, future. Only the uncertain is the future. If we are timid because of unknown fate, then how should we embrace the future?\nNo matter what happened in the past, no matter what will happen in the future, I will stand by your side and create the future together."
 dimension_traveler.510.desc.2:0 "Isn't what we are doing inviting the End with our own hands?\n\nAlthough we do have a full understanding of causality and reincarnation, we still cannot control the arrival of the End.\nThese days, I thought for a long time. I have been worried that our continued deepening will be a mistake...\n\nBut, isn't the future just like this?\nFuture, future. Only the uncertain is the future. If we are timid because of unknown fate, then how should we kiss the future?\nEven if the curse of the End swallows everything, even if the torrent of calamity submerges the world, I will stand by your side and march towards the future hand in hand."
 dimension_traveler.510.a:0 "For our future, we can definitely make the correct choice."
 
 #因果爆发/因果过载
 dimension_traveler.1001.name:0 "Causal Burst"
 dimension_traveler.1001.desc.1:0 "§YDimension Traveler§! gently pushed open your door.\n\nShe walked in front of you and sat down, then said: \"With you, we have experienced a lot together. In the changes of Black Holes and White Holes, in the intertwining of spacetime and loops, we touched the mystery of fate together.\"\n\n\"However, reincarnation is not seamless. If using my unique constitution and strange experiences, maybe we can find the flaw of causality and make the laws temporarily controlled by us.\" The girl winked at you and continued, \"Of course, this is not without cost. However, I am really grateful that you did so many things for me. And love is mutual, so I hope to risk myself to open up a path of causality for you, even for just a moment.\""
 dimension_traveler.1001.desc.2:0 "§YDimension Traveler§! pushed open your door again.\n\n\"I think I have recovered my strength. According to previous attempts, although we temporarily broke the laws of causality and suffered huge punishment, fate does not seem to intend to destroy us.\" She also winked playfully, \"Perhaps §HThe Worm-in-Waiting§! is not angry about this, or rather, She might instead hope we continue to do so-the punishment we bear is far less than the benefits it brings. Whether intentional or coincidental, I found another flaw in causality. Want to try again?\""
 dimension_traveler.1001.desc.3:0 "§YDimension Traveler§! pushed open your door again.\n\n\"I guess, maybe you changed your mind? Although doing so may be risky, I think it is worth it for us.\" She also winked playfully, \"Recently, I found another flaw in causality. If we give up this opportunity, we don't know how long we have to wait for the next one. So, want to seize the opportunity and give it a try?\""
 dimension_traveler.1001.a:0 "Let us witness the burst of causality."
 dimension_traveler.1001.b:0 "The laws of causality cannot be easily broken."
 dimension_traveler.1002.name:0 "Causal Overload"
 dimension_traveler.1002.desc:0 "§YDimension Traveler§!'s ability to manipulate fate has reached the limit. In an instant, she was swallowed by chaotic Spacetime Turbulence, and terrible causal mist also filled the entire empire.\n\nCausality overloaded. The price is heavy."
 dimension_traveler.1002.a:0 "We overdrew the future."
 dimension_traveler.1002.a.tooltip:0 "§RThe Dimension Traveler is temporarily unable to return to us!§!"