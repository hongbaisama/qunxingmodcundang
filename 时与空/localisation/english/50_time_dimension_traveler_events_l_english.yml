 situation_dimension_traveler_1_type:0 "Transcending Gravity"
 situation_dimension_traveler_1_desc:0 "Our Science Ship and that girl will fly out of the White Hole together and return home."
 situation_dimension_traveler_1_monthly_change_tooltip:0 "The progress of this §YSituation§! is roughly under our control."
