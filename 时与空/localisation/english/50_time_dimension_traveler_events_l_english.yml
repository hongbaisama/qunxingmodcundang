 NAME_Come_From_White_Hole:0 "Returned from White Hole"
 NAME_Dimension_Traveler:0 "Dimension Traveler"
 NAME_Traveler:0 "Traveler"
 
 dimension_traveler_catch_phrase:0 "Future, future. Only the uncertain is the future.\nNo matter what happened in the past, no matter what will happen in the future, I will stand by your side and create the future together."
 dimension_traveler_backstory:0 "The final messenger from another world-Dimension Traveler Angelina, awaits your command.\n§YWhat kind of future will she bring?§!"
 
 DIMENSION_TRAVELER_CHAIN_1_title:0 "The Worm-in-Waiting: Traveler"
 DIMENSION_TRAVELER_CHAIN_1_desc:0 "Not only Black Holes, but even White Holes are starting to send us Horizon Signals. What does all this mean?"
 
 dimension_traveler.1.name:0 "White Hole"
 dimension_traveler.1.desc:0 "A White Hole is a source of ejection in the universe, which can provide matter and energy to the external region but cannot absorb any matter and radiation from the external region. However, the White Hole is only a theoretical model, and we have not yet confirmed it through observation.\n\nHowever, when we entered the §H[From.GetName]§! system, we were surprised to find that the star of this system is exactly the White Hole in theory! This discovery has greatly improved our understanding of the universe and brought us new doubts."
 dimension_traveler.1.a:0 "What does this mean?"
 dimension_traveler.2.name:0 "Horizon Signal: §HInside the White Hole§!"
 dimension_traveler.2.desc_1:0 "A White Hole is a source of ejection in the universe, which can provide matter and energy to the external region but cannot absorb any matter and radiation from the external region. However, the White Hole is only a theoretical model, and we have not yet confirmed it through observation.\n\nHowever, when we entered the §H[From.GetName]§! system, we were surprised to find that the star of this system is exactly the White Hole in theory! Not only that, a familiar yet strange signal came from the White Hole, with a pattern similar to the previous Horizon Signal, but not exactly the same."
 dimension_traveler.2.desc_2:0 "We came to the White Hole system again, but something changed this time.\n\nUnlike the usual hot matter and noisy radiation, a familiar yet strange signal came from the White Hole, with a pattern similar to the previous Horizon Signal, but not exactly the same."
 dimension_traveler.2.desc_3:0 "Our home system is filled with the sounds of nature as always, but this time it is slightly different.\n\nUnlike the usual relaxed and cheerful voice, a sorrowful song came from the White Hole, which seemed to be a familiar yet strange signal, with a pattern similar to the previous Horizon Signal, but not exactly the same."
 dimension_traveler.2.a:0 "Analyze the White Hole signal."
 dimension_traveler.2.b:0 "Just meaningless noise radiated outward by the White Hole."
 dimension_traveler.2.c:0 "There must be some secret hidden in it."
 dimension_traveler.3.name:0 "Horizon Signal: §HReverse Signal§!"
 dimension_traveler.3.desc:0 "Science Officer §Y[Root.GetLeaderName]§! reported that this signal is actually a reverse Horizon Signal. After decoding it according to the previous method of cracking the Horizon Signal, reversing the decoding result yields the content of the signal.\n\nThe content of the signal is some simple short words and sentences without continuous meaning, which seem to be language samples specially designed for easy translation. This is also a common method in our first contact process. Shortly after we cracked the signal, another new signal came from the White Hole, and we can clearly feel the large amount of information contained in it."
 dimension_traveler.3.a:0 "Continue analyzing the White Hole signal."
 dimension_traveler.3.b:0 "We don't have time for guessing games."
 dimension_traveler.3.c:0 "We must discover the secret of the White Hole."
 dimension_traveler.4.name:0 "Horizon Signal: §HSoliloquy§!"
 dimension_traveler.4.desc:0 "Science Officer §Y[Root.GetLeaderName]§! reported that the signal seems to be just a soliloquy.\n\nThe signal source does not seem to be aware of our existence. The other party is just constantly talking to itself, telling its loneliness, and quietly transmitting these words outside the White Hole, asking for no answer. Perhaps because of the White Hole, the signal source cannot know our existence, but we can try to send signals into the White Hole to communicate with the signal source."
 dimension_traveler.4.a:0 "Attempt to send a signal."
 dimension_traveler.4.b:0 "Ignore it."
 dimension_traveler.4.c:0 "It's our turn to sing to the White Hole."
 dimension_traveler.5.name:0 "Horizon Signal: §HLittle Effect§!"
 dimension_traveler.5.desc:0 "Science Officer §Y[Root.GetLeaderName]§! reported that this operation had little effect. The characteristic of the White Hole only exiting and not entering greatly affected our signal transmission.\n\nThe signal source still does not seem to have noticed our signal and is still muttering to itself, as if recalling its past. In the other party's signal, we seem to have learned of the existence of another unknown nation. We can consider forcing the Science Ship into the White Hole to communicate with the signal source, but we cannot predict the consequences."
 dimension_traveler.5.a:0 "Forcefully enter the White Hole."
 dimension_traveler.5.b:0 "Let it stay alone in the White Hole."
 dimension_traveler.5.c:0 "White Hole, here we come!"
 dimension_traveler.6.name:0 "Horizon Signal: §HGive Up Halfway§!"
 dimension_traveler.6.desc.normal:0 "When Science Officer §Y[Root.GetLeaderName]§! piloted the Science Ship into the White Hole, [Root.Leader.GetHeShe] encountered great resistance.\n\nTherefore, believing that continuing to go deeper poses great danger, [Root.Leader.GetHeShe] decided to turn the ship around and sail out of the White Hole. However, just as they were about to leave the White Hole, the Science Ship was suddenly subjected to a strong attractive force from behind, as if a Black Hole suddenly appeared at the core of the White Hole. Under the action of two powerful forces, the Science Ship was torn apart, and the operation was declared a failure."
 dimension_traveler.6.desc.homicidal:0 "When Science Officer §Y[Root.GetLeaderName]§! piloted the Science Ship into the White Hole, [Root.Leader.GetHeShe] encountered great resistance.\n\nTherefore, believing that continuing to go deeper poses great danger, [Root.Leader.GetHeShe] decided to turn the ship around and sail out of the White Hole. However, just as they were about to leave the White Hole, the Science Ship was suddenly subjected to a strong attractive force from behind, as if a Black Hole suddenly appeared at the core of the White Hole. Under the action of two powerful forces, the Science Ship was torn apart, and the operation was declared a failure.\n\nSince then, the White Hole fell silent, and the signal stopped."
 dimension_traveler.6.a:0 "Regrettable, but we still need to move forward."
 dimension_traveler.6.b:0 "Their sacrifice is not meaningless, but letting people continue to sacrifice is foolish behavior."
 dimension_traveler.6.c:0 "White Hole, do not reject us!"
 dimension_traveler.6.d:0 "There is nothing worth cherishing here anymore."
 dimension_traveler.7.name:0 "Horizon Signal: §HArrive at the Center§!"
 dimension_traveler.7.desc:0 "When Science Officer §Y[time_white_hole_leader.GetName]§! piloted the Science Ship into the White Hole, [time_white_hole_leader.GetHeShe] encountered great resistance.\n\nHowever, [time_white_hole_leader.GetHeShe] still decided to risk ship destruction and death to continue sailing towards the center of the White Hole. Finally, they arrived safely at the target. In the center of the White Hole, we saw a girl, bathed in the Spacetime Turbulence of the singularity, eyes closed, humming a sorrowful song."
 dimension_traveler.7.a:0 "I want to communicate with her."
 dimension_traveler.7.a.tooltip:0 "§YThe girl will use the anime portrait.§!\n§GAnime gkd, I love beautiful girls the most!§!"
 dimension_traveler.7.b:0 "I want to communicate with her."
 dimension_traveler.7.b.tooltip:0 "§YThe girl will use the original portrait.§!\n§RWatch out for anime!§!"
 
 dimension_traveler.name:0 "Girl in the White Hole"
 dimension_traveler.8.desc:0 "(The girl is still immersed in the song and did not realize your arrival.)"
 dimension_traveler.8.a:0 "Hello."
 dimension_traveler.9.desc:0 "?em evas ot yaw a dnuof uoy evaH\n\n.ereh yllanif era uoy ,gnol yrev rof uoy rof detiaw I\n...sraey 00001 ,sraey 0001 ,sraey 001 ,sraey 01 ,raey 1"
 #It's reversed:一年、十年、一百年、一千年、一万年......我等了你很久很久, 你终于来了. \n\n你找到了解救我的方法吗?
 dimension_traveler.9.a:0 "What is this all about?"
 dimension_traveler.10.desc:0 "Oh, I forgot, the flow of time in the White Hole is opposite to the outside world. The earlier I speak, the later you will receive it.\nI have to find a way to speak backwards so that you can hear it in the correct word order.\nYes, I practiced, I practiced in this long river of time...\n\nIs what I'm saying now in the correct order?"
 dimension_traveler.10.a:0 "Yes, very correct."
 dimension_traveler.11.desc:0 "It doesn't matter anymore. I'm already very happy to see you again 32,768 years ago.\n\nHaving spent so long alone in the White Hole, I have always looked forward to seeing you again, living with positive time flow again, once again..."
 dimension_traveler.11.a:0 "32,768 years ago?"
 dimension_traveler.12.desc:0 "Did you forget? In the White Hole, time flows backward.\nSo, of course I come from the very distant future-at least the future for you.\n\nThinking about it this way, the problems that you in the future haven't solved are certainly even more impossible to solve now.\nAlthough, I have always fantasized that one day, you in the past can really do it, just like you in the past saved me from the Black Hole..."
 dimension_traveler.12.a:0 "What do you want us to solve?"
 dimension_traveler.13.desc:0 "Naturally, it is my out-of-control ability.\n\nIn the very distant future, to resist that... §Yexistence§! (the girl paused noticeably), I had to absorb the energy of the galactic center Black Hole.\nHowever, after defeating the End Crisis, I myself became a new Crisis because I couldn't control the pure Horrific Inverse Mass.\nI don't want to destroy the galaxy after losing control, nor do I want to hurt everyone, let alone be your enemy.\nSo, I entered the White Hole, hoping that the power of the White Hole could suppress the Black Hole inside me.\n\nI really want to go out and see the long-lost universe. When I was still a Dimension Traveler, the universe where I could travel freely, but I'm afraid I will lose control..."
 dimension_traveler.13.a:0 "After so long, the Black Hole should have stabilized."
 dimension_traveler.13.b:0 "For the safety of the galaxy, you'd better stay in the White Hole."
 dimension_traveler.14.desc:0 "[GetDimensionTravelerDesc14]"
 dimension_traveler.14.desc_1:0 "Really? Is what you said true?\n\nAlthough in the White Hole, I do feel that the frequency of the Black Hole inside me losing control is getting lower and lower, and the impact caused by the out-of-control Horrific Inverse Mass is getting smaller and smaller, but I can't be sure yet.\nHowever, since you said so, I am willing to believe you.\n\nDon't worry about me, I can fly. I will follow behind your Science Ship and fly out of the White Hole together.\n\n\n\n\n§Y<This seems to be the turning point of causality.>§!"
 dimension_traveler.14.desc_2:0 "§H(As the world reloads, the fate of reincarnation is rewritten.)§!\n\nThis is the cycle we have experienced countless times. Finally, we finally have a chance to break it.\nHowever, the power of causality cannot be underestimated. Only by finding all §Ythree§! flaws in the loop can there be a glimmer of hope.\nBut I believe that after endless reincarnations, we will definitely be able to do it."
 dimension_traveler.14.a:0 "Let's go home."
 dimension_traveler.15.desc:0 "You are right. I will stick to the birth of the universe. I wonder if that will be my end.\n\nThen, goodbye. I'm really happy to see you again.\nOf course, when I say this, it's still my past. So, my future can still talk to you again, even if not much...\n\nAfter I say goodbye to you in my future-or before your past meets me, I will sing a song.\nThat is the song I loved to sing most when traveling through other worlds, and also the song we used to like singing together most."
 dimension_traveler.15.a:0 "Goodbye, goodbye forever."
 dimension_traveler.15.a.tooltip:0 "The Science Ship will sail out of the White Hole in §Y30 days§!."
 # 结局1
 dimension_traveler.16.name:0 "Horizon Signal: §HNever See Again§!"
 dimension_traveler.16.desc:0 "Our Science Ship sailed out of the White Hole, accompanied by the girl's sweet singing.\n\nDifferent from what we heard initially, it was a cheerful song, as if welcoming someone's arrival.\nBut we understand that someone will never come again."
 dimension_traveler.16.a:0 "May we meet again at the end of the universe."
 dimension_traveler.16.b:0 "Goodbye, White Hole. Goodbye, past."
 
 approach_dimension_traveler_nature_0:0 "Stop Engines"
 approach_dimension_traveler_nature:0 "Stop Engines"
 approach_dimension_traveler_nature_effect:0 "We will stop the engines and rely on the repulsion of the White Hole itself to fly out of the White Hole."
 approach_dimension_traveler_out:0 "Start Engines"
 approach_dimension_traveler_out_effect:0 "We will start the engines and rely on the power of the ship to fight against the Black Hole's gravity."
 situation_dimension_traveler_complete_effect:0 "We will fly out of the White Hole."
 situation_dimension_traveler_fail_effect:0 "We will fall into the Black Hole..."
