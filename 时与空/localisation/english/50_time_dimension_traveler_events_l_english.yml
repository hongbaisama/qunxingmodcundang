 dimension_traveler.20.name:0 "Transcending Gravity: §HRetardation§!"
 dimension_traveler.20.desc:0 "When our Science Ship was sailing out of the White Hole, the force field detector on the ship detected a small gravitational source generated behind the hull.\nBut its gravity is not strong, only slowing down our speed of leaving the White Hole, and cannot pose a great threat to us."
 dimension_traveler.20.a:0 "Start engines."
 dimension_traveler.20.b:0 "Wait and see."
 dimension_traveler.21.name:0 "Transcending Gravity: §HTraction§!"
 dimension_traveler.21.desc:0 "The force field detector detected an abnormal increase in the traction force of the gravitational source, suspected to be related to the girl in the White Hole.\nIts gravity is enough to pose a threat to us, but our engine power is still sufficient to contend with it."
 dimension_traveler.21.a:0 "Increase engine power supply."
 dimension_traveler.21.b:0 "Give up struggling."
 dimension_traveler.22.name:0 "Transcending Gravity: §HApproaching§!"
 dimension_traveler.22.desc:0 "The force field detector monitored that the gravitational source is gradually approaching, confirming that the gravitational source comes from the girl behind the ship.\nIts gravity already poses a greater threat, and the increase shows no sign of stopping. Our engine power may not be able to resist the theoretical maximum value of gravity."
 dimension_traveler.22.a:0 "Continue to increase engine power supply."
 dimension_traveler.22.b:0 "Give up resistance."
 dimension_traveler.23.name:0 "Transcending Gravity: §HDevour§!"
 dimension_traveler.23.desc:0 "Our Science Ship sent the highest level alarm. The energy intensity of the gravitational source is higher than the threshold.\nCurrently, the gravity magnitude is far higher than the maximum value of our engine power, which means that our Science Ship has no possibility of leaving the White Hole."
 dimension_traveler.23.a:0 "Engine power supply to maximum."
 dimension_traveler.23.b:0 "Give up."
 
 dimension_traveler.24.desc:0 "It's really bad. It's getting harder and harder for me to control the Horrific Inverse Mass inside me.\n\nThe farther I am from the center of the White Hole, the more I can feel the activity of the Black Hole, and the gravity it generates is getting bigger and bigger.\nThese days, I have been trying to control it, but I can't stop the expansion of the singularity.\nAnd, it seems to be strong enough to no longer be affected by the White Hole. Even if we are close to the center of the White Hole, it is difficult to stabilize it.\n\nTherefore, I implore, before the situation becomes completely irretrievable, let me return to the center of the White Hole again.\nIf it stabilizes after returning to the center of the White Hole, then we saved the galaxy, and I will dispel the idea of leaving the White Hole until the origin of the universe.\nIf it still cannot be controlled after returning to the center of the White Hole, then I will end this White Hole, my life, and the singularity together."
 dimension_traveler.24.a:0 "Disapprove. We will definitely find other ways."
 dimension_traveler.24.b:0 "Approve. For the sake of the galaxy, we have no choice."
 dimension_traveler.25.desc:0 "...Unexpectedly, the one who doesn't want to let go now is me.\n\n\n\n\n\n\n\n\n\n§G<BGM: \"White Bird Crossing the River Beach\" (ilem Luo Tianyi)>§!"
 dimension_traveler.25.a:0 "......?"
 dimension_traveler.26.desc:0 "Maybe you had a question long ago. Clearly time flows backward in the White Hole, why can I talk to you normally.\nIn fact, I have already witnessed the future, deduced your words through the information of Spacetime Turbulence in the White Hole, and gave answers in advance."
 dimension_traveler.26.a:0 "......"
 dimension_traveler.27.desc:0 "So now, I must do this. Only by doing this can I let you live, because I know what will happen in the future."
 dimension_traveler.27.a:0 "......"
 dimension_traveler.28.desc:0 "...Ah, if this goes on, we won't have a chance to meet again."
 dimension_traveler.28.a:0 "......"
 dimension_traveler.29.desc:0 "I can't, I don't accept this kind of thing. I won't give up."
 dimension_traveler.29.a:0 "......"
 dimension_traveler.30.desc:0 "I believe the connection between us will transcend time and space."
 dimension_traveler.30.a:0 "......"
 dimension_traveler.31.desc:0 "Even if the galaxy boils and nebulas disappear, even if our fleets fall into the vortex of gravity one after another, even if the Black Hole in the galactic center expands ferociously and ruthlessly eats its children until all is silent..."
 dimension_traveler.31.a:0 "......"
 dimension_traveler.32.desc:0 "We can meet again all the same.\nAt the end of civilization decorated with darkness and starlight, we can meet again all the same.\nDefinitely."
 dimension_traveler.32.a:0 "......"
 dimension_traveler.33.desc:0 "I will wait until that day.\nI will definitely wait until that day.\nWait for me.\nYou must wait for me too."
 dimension_traveler.33.a:0 "......"
 dimension_traveler.34.desc:0 "Before I reach the origin of the universe, before you reach the end of the world...\nYou are not allowed to forget me."
 dimension_traveler.34.a:0 "Wait..."
 dimension_traveler.35.desc:0 "(The girl never sent any more messages.)"
 dimension_traveler.35.a:0 "Wait!"
 
 # 结局2
 dimension_traveler.41.name:0 "Horizon Signal: §HDestruction§!"
 dimension_traveler.41.desc:0 "In the end, our Science Ship failed to resist the strong gravity of the gravitational source, fell into the center of the White Hole, and never sent any messages again.\n\nWe are certain that the Science Ship has been completely destroyed by the gravitational source, but the whereabouts of the girl in the White Hole are unknown."
 dimension_traveler.41.a:0 "We will never know the truth."
 dimension_traveler.41.b:0 "Ah, White Hole."
 # 结局3
 dimension_traveler.42.name:0 "Horizon Signal: §HTermination§!"
 dimension_traveler.42.desc:0 "The girl in the White Hole no longer followed our Science Ship but returned to the center of the White Hole, and that gravitational source miraculously disappeared.\n\nWithout the obstruction of strong gravity, our Science Ship left the White Hole smoothly, but we failed to take the person we should have taken. Since then, no Horizon Signal has come from the White Hole, and the messages we sent inward received no response.\n\nWe don't know what happened to that girl in the White Hole, but we are certain that a galactic crisis has been terminated."
 dimension_traveler.42.a:0 "Not too bad an ending."
 dimension_traveler.42.b:0 "Your singing stopped, but our singing will continue."
 # 结局4
 dimension_traveler.43.name:0 "Horizon Signal: §HOrigin§!"
 dimension_traveler.43.desc:0 "The girl in the White Hole moved away from our Science Ship and rapidly approached the center of the White Hole. With a huge explosion, everything ended.\n\nOur Science Ship was blasted to an unknown system by the aftermath of the explosion, but thanks to the energy shield provided by the girl, they survived. The White Hole turned into a terrible Black Hole after the big explosion, but the girl's move did not seem to fail, because the Black Hole has no trend of continuing to expand for the time being.\n\nEverything is back to square one."
 dimension_traveler.43.a:0 "May we meet again at the origin of the universe."
 dimension_traveler.43.b:0 "May we sing again at the origin of the universe."
 dimension_traveler.43.tooltip:0 "§Y$NAME_Come_From_White_Hole$§! went missing during the mission and returned to the homeworld."
 
 DIMENSION_TRAVELER_CHAIN_2_title:0 "The Worm-in-Waiting: See You Again"
 DIMENSION_TRAVELER_CHAIN_2_desc:0 "I believe we will meet again one day."
 
 dimension_traveler.50.name:0 "Horizon Signal: §HEdge of the Horizon§!"
 dimension_traveler.50.desc:0 "We returned to the §Y[Root.System.GetName]§! system again, as if commemorating the girl we once encountered.\n\nThe Black Hole opens its mouth to swallow everything as always; the miracle we expected did not appear. Researchers routinely recorded the data of §Y[Root.GetStarName]§!, and no abnormalities appeared, which further declared the shattering of our dream.\n\nHowever, just as everyone was disheartened, a keen crew member discovered that there was a high-speed moving object at the edge of the Black Hole's event horizon. The object is rotating around the Black Hole at the speed of light, just not falling into the event horizon, and just unable to escape the Black Hole."
 dimension_traveler.50.a:0 "Am I dreaming?"
 dimension_traveler.50.b:0 "The dream should wake up, forget it."
 dimension_traveler_categories:0 "Edge of the Horizon"
 dimension_traveler_categories_desc:0 "A mysterious object is rotating around the Black Hole at the speed of light. Until the investigation is over, we cannot judge what it is."
 dimension_traveler.51.name:0 "Horizon Signal: §HMeet Again Eventually§!"
 dimension_traveler.51.desc:0 "Science Officer §Y[FromFrom.GetLeaderName]§! discovered after research that it was a civilian ship using an ancient model.\n\nWe don't know why this civilian ship can fly at the speed of light, but we still used the energy of the Science Ship to rescue the civilian ship from the gravity of the Black Hole. At this time, our Science Ship has established contact with this civilian ship. The other party seems to be a girl."
 dimension_traveler.51.a:0 "I believe we will meet again one day."
 
 dimension_traveler.name.2:0 "Deja vu Girl"
 dimension_traveler.52.desc:0 "Hello.\n\nThank you very much for saving me.\nI have used all my strength just to maintain the edge of being swallowed by the Black Hole. If it weren't for you, I'm afraid I would have been buried in the Black Hole due to exhaustion by now."
 dimension_traveler.52.a:0 "It's you!"
 dimension_traveler.53.desc:0 "Eh, do you know me?\n\nSpeaking of which, I also feel a sense of familiarity from you, although we seem to have never met before.\nAlthough it is presumptuous to say so, I am not referring to you-[Root.GetRulerTitle] [Root.GetRulerName], but the §Y\"person\"§! behind you.\n\nYou are always so mysterious, yet strategizing and controlling the overall situation.\nAlthough you occasionally make mistakes, in the end you can always make the correct choice, very reliable and trustworthy."
 dimension_traveler.53.a:0 "I know you, but not that well."
 dimension_traveler.name.3:0 "Dimension Traveler"
 dimension_traveler.54.desc:0 "In that case, let me introduce myself.\nMy name is... forget it, the name is actually not that important. Just call me §Y\"Dimension Traveler\"§!.\n\nI come from a destroyed land invaded by Seaborn, Demons, and the Starry Sky.\nAt the final moment, a §Y\"person\"§! very important to me used their life to buy me time, and I embarked on a journey of time.\n\nI wanted to go back to the past to warn everyone, but my control of the ability was not proficient, and this was also my first time performing spacetime travel.\nSo, I failed to return to the past, but arrived at different times, different planets, different worlds-even different universes.\n\nDuring the journey in other worlds, I met many people, experienced many things, appreciated the customs of different spacetimes, witnessed the fate of different worlds, and my mastery of abilities became increasingly skilled.\n\nHowever, I still failed to be excellent enough. After the last attempt at spacetime travel, I was trapped at the edge of the Black Hole's event horizon with the ship.\nFortunately, you appeared."
 dimension_traveler.54.a:0 "Truly a bumpy journey."
 dimension_traveler.55.desc:0 "I have finished introducing myself. Tell me your story too.\n\nHave you... seen me?\nIs it the past me, the future me, or another me?"
 dimension_traveler.55.a:0 "I guess, the past you."
 dimension_traveler.55.b:0 "Probably, the future you."
 dimension_traveler.55.c:0 "Perhaps, another you."
 dimension_traveler.55.d:0 "There is no essential difference between these three."
 dimension_traveler.56.desc:0 "I think I temporarily don't have enough energy to perform another time travel. We can have a long time to talk about our past-or future.\n\nLet me join you. Although I may not be of much help to you, I will do my best."
 dimension_traveler.56.a:0 "What can you do?"
 dimension_traveler.56.a.response:0 "Although my main job is delivering letters, if you need help with paperwork, I can also handle it.\nAs for combat, I have seen a lot in the past and learned some command skills.\nNot only that, on the road of spacetime travel, I was also deeply touched by the vast galaxy.\n\nSo, as long as you are willing, I can engage in any position you designate.\nBut I am only one person, so I can't handle all tasks at the same time."
 dimension_traveler.56.b:0 "If I refuse, what do you plan to do?"
 dimension_traveler.56.b.response:0 "Well... \nAlthough it's a pity, I will continue to travel towards my destination, only after I replenish my physical strength.\nMoreover, there are still many new things in this universe that I have never encountered. I plan to wander around here first."
 dimension_traveler.56.hire:0 "You need us, and we need you."
 can_not_hire_dimension_traveler:0 "§RRidiculous, we don't need her!§!"
 dimension_traveler.56.hire.tooltip:0 "§YThe Dimension Traveler will become one of us.\nPerhaps one day she will leave, perhaps she will never leave.§!"
 dimension_traveler.56.dismiss:0 "You have your own mission."
 dimension_traveler.56.dismiss.tooltip:0 "§YWe will say goodbye to the Dimension Traveler.\nPerhaps we will meet again soon, perhaps we will never meet again.§!"
 # 结局5
 dimension_traveler.57.desc:0 "I am very happy that you agree. Let us create a beautiful future together."
 dimension_traveler.57.a:0 "Or a beautiful past."
 dimension_traveler.57.b:0 "In the future, let's sing together."
 dimension_traveler.57.response:0 "§Y<You can now communicate with the Dimension Traveler through the comms menu.>§!"
 dimension_traveler.58.desc:0 "You are right, I still have a past to save.\nThen, goodbye. I hope we can meet again in the future."
 dimension_traveler.58.a:0 "Goodbye, we will definitely meet again."
 dimension_traveler.58.b:0 "The caged bird returns to freedom."
 
 DIMENSION_TRAVELER_OFFICE:0 "Messenger Office"
 dimension_traveler.60.desc:0 "[GetDimensionTravelerMainEventDesc]"
 dimension_traveler.60.desc.default:0 "Do you need me to do anything?\n\nAlthough I'm not the best Dimension Traveler, I will help you as much as I can!"
 dimension_traveler.60.desc.official:0 "Handling government affairs is indeed arduous, but when I see tall buildings rising from the ground and people living and working in peace, I feel incomparable pride in my heart.\n\nOf course, if you want me to help in other fields, I am willing."
 dimension_traveler.60.desc.scientist:0 "My ability really helps everyone's scientific research work a lot. Being able to make a contribution to everyone, no matter how hard or tired, I am very happy, just like when I was a messenger in the past.\n\nOf course, if you want me to help in other fields, I am willing."
 dimension_traveler.60.desc.commander:0 "I have been doubting, can I really bear the responsibility of commanding operations? But ah, whenever I think of you by my side, I am full of confidence, and all confusion is swept away.\n\nOf course, if you want me to help in other fields, I am willing."
 dimension_traveler.60.desc.gray:0 "What, you want me to turn into a warship? Sorry, can't do it..."
 dimension_traveler.60.desc.gray.end:0 "Want me to turn into a warship? I'm not some nanobot!"
 dimension_traveler.60.desc.special:0 "The view on the deck is very good, very suitable for watching the starry sky.\nSee that lonely star? It is said that one day, it will wait for its companion star, embrace, dance...\n\nBut, how long will that take?\nHow long do I have to wait... before the star understands?"
 dimension_traveler.60.desc.special.end:0 "The view on the deck is very good, very suitable for watching the starry sky.\nSee that lonely star? It is said that one day, it will wait for its companion star, embrace, dance...\nHow long will that take?\n\nBut ah, I have already waited, the star is not far away."
 dimension_traveler.60.desc.a:0 "This is strong coffee brewed by the new coffee machine. Want to try it?\nBut only one cup a day. Staying up late is not a good thing."
 dimension_traveler.60.desc.a.end:0 "This is coffee brewed by my own hands. Although it is not as sweet as that brewed by the coffee machine, it is not inferior at all in terms of refreshing the mind."
 dimension_traveler.60.desc.b:0 "The journey of a Dimension Traveler is not easy. Traversers and witnesses may both have their own ambitions. Time may bury amazing secrets...\nIf a Dimension Traveler only thinks about the road behind, they will get lost because they can't see the foothold."
 dimension_traveler.60.desc.b.end:0 "The work of a Dimension Traveler is actually not as depressing as everyone thinks.\nWhenever the recipient avoids disaster due to advance warning, seeing the smile on their face, I can't help but feel happy for them, and the hardships of the journey are swept away...\nIf a Dimension Traveler is always immersed in the wind and rain of the past, how can they discover the rainbow of tomorrow?"
 dimension_traveler.60.desc.c:0 "Memory is very important.\nIt is the memories of the past that constantly remind me that everyone is the same, expecting a beautiful future."
 dimension_traveler.60.desc.c.end:0 "Are you worried about the future?\nI know, the unknown tomorrow is always unsettling, and I also know that there is a world of difference between us now and us in the future...\nBut, don't worry, no matter what happens in the future, I will stand by your side and create the future together."
 dimension_traveler.60.desc.d:0 "Don't be shy, come closer! Yes yes, sorridi~\nLook, it's our photo sticker~ Hehe, take it as a souvenir.\nOf course, there is indeed... a little bit of my sustenance on it."
 dimension_traveler.60.desc.d.end:0 "Remember this photo sticker?\nAlthough I have experienced a lot of things, I have kept it well-ah, a corner is actually broken...\n\nIn that case, let's take another photo sticker.\nThis time, I will guard it well, until the end of civilization."
 dimension_traveler.60.desc.e:0 "Mmhmm~\nHmm, for lip gloss, coral red is better, right?"
 dimension_traveler.60.desc.e.end:0 "Haven't read a fashion magazine for a long time, don't know if there are new lip glosses...\nNo, have to work, now is not the time to think about these."
 dimension_traveler.60.desc.f:0 "My hair is beautiful?\nMmhmm, I have a secret!"
 dimension_traveler.60.desc.f.end:0 "The night is beautiful tonight. Let's go watch the starry sky together again, just like before."
 dimension_traveler.60.desc.g:0 "The battlefield is cruel... but I don't want to disappoint you."
 dimension_traveler.60.desc.g.end:0 "Fighting is simple, but war is not easy...\nYour ideal, I will realize it for you!"
 dimension_traveler.60.desc.h:0 "Whether it is combat or work, go all out!"
 dimension_traveler.60.desc.h.end:0 "Whether it is offense or defense, cannot slack off for a moment!"
 dimension_traveler.60.desc.i:0 "Even if I am not very good at it, I will try hard to do it."
 dimension_traveler.60.desc.i.end:0 "Let us build a new line of defense again, just like in the future!"
 dimension_traveler.60.desc.j:0 "When will the fighting stop..."
 dimension_traveler.60.desc.j.end:0 "This fight, let us end it!"
 dimension_traveler.60.desc.k:0 "Did you feel your body become heavier?"
 dimension_traveler.60.desc.k.end:0 "Fall down, fall down forever, don't get up again!"
 dimension_traveler.60.desc.l:0 "Must overcome the difficulties in front of us."
 dimension_traveler.60.desc.l.end:0 "No matter what obstacles we encounter, we cannot give up!"
 dimension_traveler.60.desc.m:0 "I am very good at this spell."
 dimension_traveler.60.desc.m.end:0 "Can you see through my spell?"
 dimension_traveler.60.desc.n:0 "Want to try the feeling of floating in the air?"
 dimension_traveler.60.desc.n.end:0 "The sky is my main battlefield!"
 dimension_traveler.60.desc.o:0 "Only in adversity do people grow, right?"
 dimension_traveler.60.desc.o.end:0 "Prosperity does not necessarily wear down the will, but only adversity can lead to rebirth from ashes."
 dimension_traveler.60.desc.p:0 "The more difficult the situation, the less we can be discouraged!"
 dimension_traveler.60.desc.p.end:0 "Even if the final line of defense is destroyed, we will still hold on until the last moment!"
 dimension_traveler.60.desc.dimensional_horror_crisis:0 "There are certain differences between different types of ['concept_dimensional_horror_crisis_storm'] storms and ['concept_dimensional_horror_crisis_ship'] ships. Remembering these might help resist them better:\n§HLevorotation§! counters §YShields§!, has no §YShields§! itself; §HDextrorotation§! counters §YArmor§!, has no §YArmor§! itself."
 dimension_traveler.60.desc.disappointed:0 "(Silent silence)"
 dimension_traveler.60.official:0 "I hope you can serve as §H£official£$official$§!."
 dimension_traveler.60.official.response:0 "Do you hope I manage the planet? Mm, I will work hard."
 dimension_traveler.60.official.tooltip:0 "§YThe Dimension Traveler will serve as §H£official£$official$§!, and retain level, experience, and some event traits.§!"
 dimension_traveler.60.scientist:0 "I hope you can serve as §B£scientist£$scientist$§!."
 dimension_traveler.60.scientist.response:0 "Do you hope I assist in research? Mm, I will work hard."
 dimension_traveler.60.scientist.tooltip:0 "§YThe Dimension Traveler will serve as §B£scientist£$scientist$§!, and retain level, experience, and some event traits.§!"
 dimension_traveler.60.commander:0 "I hope you can serve as §R£commander£$commander$§!."
 dimension_traveler.60.commander.response:0 "Do you hope I command operations? Mm, I will work hard."
 dimension_traveler.60.commander.tooltip:0 "§YThe Dimension Traveler will serve as §R£commander£$commander$§!, and retain level, experience, and some event traits.§!"
 dimension_traveler.60.wg:0 "I have something I hope to give you personally."
 dimension_traveler.60.wg.tooltip:0 "§POath to the Dimension Traveler.§!"
 dimension_traveler.60.time_wanderer:0 "How much do you know about the Wandering Singularity?"
 dimension_traveler.60.help:0 "Please tell me the message from outside spacetime."
 dimension_traveler.60.exit:0 "You have done well enough."
 dimension_traveler.60.exit.response:0 "Thank you. With your approval, I am already very happy."
 dimension_traveler.60.exit.disappointed:0 "(Leave)"
 dimension_traveler.60.exit.disappointed.response:0 "......"
 
 DIMENSION_TRAVELER_UNKNOWN:0 "Spacetime Turbulence"
 dimension_traveler.61.desc:0 "Bad news, I'm trapped in Spacetime Turbulence.\n\nAlthough I don't know which spacetime I am in, I will find a way to return to your side as much as possible."
 dimension_traveler.61.a:0 "I look forward to your safe return."
 dimension_traveler.61.a.response:0 "Okay~"
 DIMENSION_TRAVELER_MISSING:0 "???"
 dimension_traveler.62.desc:0 "(The Dimension Traveler did not respond. You don't know what she encountered.)\n\n§R<When seeing this interface, the Dimension Traveler may have been \"exiled\" or changed \"ownership\" by an event.\nMany such events may return the leader after the event chain ends, so unless necessary, please do not forcibly recall the Dimension Traveler.>§!"
 dimension_traveler.62.a:0 "§RForcibly recall the Dimension Traveler!§!"
 dimension_traveler.62.a.tooltip:0 "§RUse with caution!\nThe Dimension Traveler will immediately perform an emergency spacetime jump, which is very likely to cause an event chain to break or error!§!"
 dimension_traveler.62.b:0 "§GWait patiently.§!"
 dimension_traveler.64.name:0 "Emergency Spacetime Jump"
 dimension_traveler.64.desc:0 "The Dimension Traveler fell into a deadly predicament.\n\nJust when we thought we were going to lose her forever, she performed an emergency spacetime jump in time and went to a different spacetime.\n\nAlthough she is safe for the time being, it may take a long time for her to return to our side."
 dimension_traveler.64.a:0 "We will meet again."
 dimension_traveler.65.name:0 "Dismiss Dimension Traveler"
 dimension_traveler.65.desc:0 "The Dimension Traveler has returned to the leader pool. You can re-appoint her position through communication at any time."
 dimension_traveler.65.a:0 "You can rest for a while."
 dimension_traveler.66.desc:0 "Although experienced quite a few twists and turns, fortunately, I finally came back.\n\nSorry for making you worry for so long. Next time I will act more carefully."
 dimension_traveler.66.a:0 "It's good that you are fine."
 dimension_traveler.66.a.response:0 "§Y<You can now communicate with the Dimension Traveler through the comms menu.>§!"
 dimension_traveler.68.desc.a:0 "Your recent transformation shocked me. I don't understand what made you so extreme.\n\nHowever, this is the path you chose yourself. I have no right to criticize, but it is time to say goodbye.\n\nI am very grateful that you saved me from the edge of the horizon, and I also understand that I cannot repay this kindness at present, but I also have my own mission to accomplish, and I don't want to aid the wicked on the road of devastating lives.\n\nI am really sorry. Farewell."
 dimension_traveler.68.desc.b:0 "...\n\nAlthough I understand that the arrival of the End is a matter of time, your recent transformation has nothing to do with the End. After all, that is something 30,000 years later...\n\n...\n\nMaybe it's time to say goodbye. I don't want to watch you go further and further on the road of madness, but I have no way to stop you. Since this is the path you chose with your own hands, then I leave it to you to walk down it yourselves.\n\nThis parting is not eternal. I will still watch over you quietly somewhere. Perhaps one day you can change your mind. At that time, I will do my best to guide you back to the right track and rebuild your home with you.\n\nThe past experiences are like dreams, but now, let's calm each other's minds first."
 dimension_traveler.68.desc.c:0 "...\n\nAlthough I understand that the arrival of the End is a matter of time, your recent transformation has nothing to do with the End. After all, that is something 30,000 years later...\n\n...\n\nMaybe it's time to say goodbye. I don't want to watch you go further and further on the road of madness, destroying yourselves under the manipulation of $NAME_Nemesis_Puppeteer$, but I have no way to stop you, nor any way to save you. Since this is the path you chose with your own hands, then I leave it to you to walk down it yourselves.\n\nThis parting is not eternal. I will still watch over you quietly somewhere. Perhaps one day you can change your mind. At that time, I will do my best to guide you back to the right track and rebuild your home with you-as long as it's not too late, too late for everything to be irretrievable.\n\nThe past experiences are like dreams, but now, let's calm each other's minds first."
 dimension_traveler.68.a:0 "Ungrateful fellow!"
 dimension_traveler.68.a.response:0 "§Y<The Dimension Traveler has left. You cannot communicate with the Dimension Traveler.>§!"
 dimension_traveler.68.b:0 "I don't think we did anything wrong."
 dimension_traveler.68.b.response:0 "§Y<You can still communicate with the Dimension Traveler, but she will not provide you with any help.>§!\n\n§G<Perhaps one day, she will return.>§!"
 dimension_traveler.68.c:0 "No need for the future, we stop now."
 dimension_traveler.68.c.response:0 "It's great that you can turn back in time. Honestly, I don't want to leave you at all.\n\nIt seems we can still be together until that destined end..."
 dimension_traveler_leave:0 "§RThe Dimension Traveler left us§!"
 remove_ap_become_the_crisis:0 "Remove Ascension Perk: §Y$ap_become_the_crisis$§!\nDisable Ascension Perk: §Y$ap_become_the_crisis$§!"
 remove_ap_galactic_hyperthermia:0 "Remove Ascension Perk: §Y$ap_galactic_hyperthermia$§!\nDisable Ascension Perk: §Y$ap_galactic_hyperthermia$§!"
 
 DIMENSION_TRAVELER_WEDDING:0 "Oath Ceremony with the Dimension Traveler"
 dimension_traveler.150.desc_1:0 "This is... a ring?\n\nIs it... for me?\nI never thought this day would come so quickly. Let me calm down first...\n\nThank you very much. When I was most frustrated, you gave me motivation;\nWhen I fell into desperation, you gave me hope of life;\nWhen I was lost in the long sea of stars, you gave me a safe shelter.\nNow, you are bringing me the most important day in my life. I am really flattered."
 dimension_traveler.150.desc_2:0 "This is... a ring?\n\nIs it... for me?\nAlthough in the countless cycles we have experienced, we also made oaths countless times, when we transcended causality and actually waited for this day, I still feel unbelievable.\n\nThank you very much. In the boundless past and endless future, you always chose me and rescued me from the shackles of fate.\nNow, you are bringing me the most important day in my life. I am really flattered."
 dimension_traveler.150.a:0 "This is what you deserve, Angelina."
 dimension_traveler.150.a.response:0 "In that case, I accept it with joy.\nAlthough I don't know how many girls you have given such a ring to, I will definitely cherish it.\n\n§PI will firmly engrave this beautiful day in my memory, forever, forever...§!"
 dimension_traveler.150.b:0 "We chose each other, Angelina."
 dimension_traveler.150.b.response:0 "Correct, it is precisely the love between us that allows the connection between us to transcend time and space.\nHowever, I saw it all. You also gave such rings to other girls!\nBut that's okay, I don't mind.\n\n§PI will firmly engrave this happy day in my memory, until the end of civilization, until the origin of time...§!"
 
 DIMENSION_TRAVELER_TITLE:0 "Time Origin"
 dimension_traveler.200.desc:0 "One hundred million years, one billion years, ten billion years... I waited for you for a long, long time again, a long, long time...\n\n\n\n\n\n\n\n\n§G<BGM: \"Ask the Wind\" (Guimian P Luo Tianyi)>\n<(Original by Jin Yu, composed and lyrics by Li Lunxu, arranged by Ji Zhihao)>§!"
 dimension_traveler.200.a:0 "You are!"
 dimension_traveler.201.desc:0 "Do you know?\nHow big is the difference between one hundred years, one thousand years, ten thousand years, and one hundred million years, one billion years, ten billion years?"
 dimension_traveler.201.a:0 "I..."
 dimension_traveler.202.desc:0 "Do you know?\nI recalled the past for ten billion years, I thought about the present for ten billion years, I fantasized about the future for ten billion years;\nI missed you for ten billion years, I complained about you for ten billion years, I looked forward to you for ten billion years...\n\nThere are countless ten billion years. How did I pass them?"
 dimension_traveler.202.a:0 "......"
 dimension_traveler.203.desc:0 "Do you know?\nI have had hope, disappointment, despair;\nI have had joy, loss, sadness;\nI have had confidence, regret, remorse..."
 dimension_traveler.203.a:0 "Me too..."
 dimension_traveler.204.desc:0 "But, it doesn't matter anymore, because I waited."
 dimension_traveler.204.a:0 "I waited too."
 dimension_traveler.205.desc:0 "After infinite waiting, I finally reached the origin of the universe, and I finally saw you again.\n\nEven if I was so disappointed and desperate, now I am full of hope;\nEven if I was so lost and sad, now I am full of joy;\nEven if I was so regretful and remorseful, now I am full of confidence.\n\nBecause, I waited."
 dimension_traveler.205.a:0 "But, I haven't reached the end of the world..."
 dimension_traveler.206.desc:0 "Because of The Worm-in-Waiting.\n\nAfter watching us cycle thousands of times, The Worm-in-Waiting finally decided to make some changes to the cycle."
 dimension_traveler.206.a:0 "The Worm-in-Waiting?"
 dimension_traveler.207.desc:0 "In the infinite cycle, you finally moved The Worm-in-Waiting, you finally found a way to influence the loop. This is the reason why we can meet in advance."
 dimension_traveler.207.a:0 "So that's it..."
 dimension_traveler.208.desc:0 "The entirety of the cycle cannot be changed, so we still cannot break the cycle.\n\nHowever, as long as we can change a little bit, a little bit each time, then in the next countless cycles, there will always be one time when we can break through the limitations of causality."
 dimension_traveler.208.a:0 "Hope we can do it in future cycles."
 dimension_traveler.209.desc:0 "Future cycles are no longer something we can influence now. However, we can still talk about our current future.\n\nThe Worm-in-Waiting gave the past me the mission of the loop.\nSo, when she uses Inverse Phase abilities, I will overlap with her at the time origin and lend my power to her, hoping to better help your country."
 dimension_traveler.209.a:0 "I really don't know how to thank you."
 dimension_traveler.210.desc:0 "I don't need any thanks. I have no regrets doing anything for you.\n\n§HBecause, I love you.\nIn sober reality, in slumbering dreams, in flowing spacetime, in changing planes, in countless past reincarnations, in countless future cycles, I love you as always.\nI love you more than thousands of words.\nI love you more than time itself.\nI love you even more than you love yourself.§!\n\n§PJust because, I love you.§!"
 dimension_traveler.210.a:0 "I love you too, unswervingly."
 dimension_traveler.211.desc:0 "$dimension_traveler.210.desc$\n\n§E\"$dimension_traveler.210.a$\"§!"
 dimension_traveler.211.a:0 "When you go from reality to dream, I love you."
 dimension_traveler.212.desc:0 "$dimension_traveler.211.desc$\n§E\"$dimension_traveler.211.a$\"§!"
 dimension_traveler.212.a:0 "When you go from spacetime to plane, I love you."
 dimension_traveler.213.desc:0 "$dimension_traveler.212.desc$\n§E\"$dimension_traveler.212.a$\"§!"
 dimension_traveler.213.a:0 "When you go from reincarnation to cycle, I love you."
 # 结局6
 dimension_traveler.214.desc:0 "$dimension_traveler.213.desc$\n§E\"$dimension_traveler.213.a$\"§!"
 dimension_traveler.214.a:0 "I love you."
 dimension_traveler.214.a.response:0 "(The girl closed her eyes in relief, the distant image gradually dimmed and disappeared with the wind. She returned to her original appearance.)\n\nFarewell.\n\nSee you in the next cycle."
 
 DIMENSION_TRAVELER_CHAIN_END_1_title:0 "Transcending Spacetime"
 DIMENSION_TRAVELER_CHAIN_END_1_desc:0 "§HErased memories.§!"
 DIMENSION_TRAVELER_CHAIN_END_2_title:0 "Transcending the Loop"
 DIMENSION_TRAVELER_CHAIN_END_2_desc:0 "§HErased memories.§!"
 DIMENSION_TRAVELER_CHAIN_END_3_title:0 "Transcending the Plane"
 DIMENSION_TRAVELER_CHAIN_END_3_desc:0 "§HErased memories.§!"
 
 dimension_traveler.305.name:0 "Horizon Signal: §HSeek a Sword in a Boat§!"
 dimension_traveler.305.desc:0 "A nightmare haunts your mind:\n§C\"Spacetime? Loop? Plane?\"§!\n\nAlthough baseless, you clearly know He comes from a familiar Black Hole and originates from your distant future.\n\n§C\"Spacetime? Loop? Plane?\"§!"
 dimension_traveler.305.a:0 "Spacetime."
 dimension_traveler.305.b:0 "Loop."
 dimension_traveler.305.c:0 "Plane."
 dimension_traveler.305.d:0 "Damn it! I don't understand at all, any is fine!"
 dimension_traveler.305.tooltip:0 "§YYou will know eventually.§!"
 
 dimension_traveler.310.name:0 "§HGlimpse of Future:§!"
 dimension_traveler.310.desc:0 "This is a code from a higher dimension. We cannot analyze it with our current level alone.\nIf relying on abilities beyond reality, the answer might be found in §H\"Documents/Paradox Interactive/Stellaris/logs/game.log\"§!.\n\nA flash of inspiration, past scenes and future omens intertwine. Three parts of information, useless when appearing alone. However, once the puzzle is put together, we might discover the answer to break the cycle."
 dimension_traveler.310.a:0 "We can definitely break the reincarnation of the cycle."
 dimension_traveler.311.name:0 "$dimension_traveler.310.name$ Transcending Spacetime"
 dimension_traveler.311.desc:0 "$dimension_traveler.310.desc$"
 dimension_traveler.311.a:0 "$dimension_traveler.310.a$"
 dimension_traveler.312.name:0 "$dimension_traveler.310.name$ Transcending the Loop"
 dimension_traveler.312.desc:0 "$dimension_traveler.310.desc$"
 dimension_traveler.312.a:0 "$dimension_traveler.310.a$"
 dimension_traveler.313.name:0 "$dimension_traveler.310.name$ Transcending the Plane"
 dimension_traveler.313.desc:0 "$dimension_traveler.310.desc$"
 dimension_traveler.313.a:0 "$dimension_traveler.310.a$"
 
 DIMENSION_TRAVELER_TITLE_TRUE:0 "Outside Spacetime"
 dimension_traveler.320.a:0 "Desire is time, sight is gravity."
 dimension_traveler.320.b:0 "The past is the future, the future is the past."
 dimension_traveler.320.c:0 "Gravity is desire, time is sight."
 dimension_traveler.320.d:0 "The future has passed, the past is yet to come."
 dimension_traveler.320.e:0 "The Worm kisses me with love; I shall return with a song."
 dimension_traveler.320.f:0 "The loop never terminates, but doesn't always close."
 dimension_traveler.320.g:0 "What has been will be again; what will be has been."
 dimension_traveler.320.h:0 "The loop never stops, but doesn't always start."
 dimension_traveler.320.i:0 "What will be will be again; what has been has been."
 dimension_traveler.321.name:0 "§HTranscending Spacetime§!"
 dimension_traveler.321.desc:0 "$NAME_time_horizonsignal_1$\n$NAME_time_horizonsignal_2$\n$NAME_time_horizonsignal_3$\n$NAME_time_horizonsignal_4$\n$NAME_time_horizonsignal_star_1$\n$NAME_time_horizonsignal_star_2$\n$NAME_time_horizonsignal_star_3$\n$NAME_time_horizonsignal_star_4$\n\n\"This seems to be where the dream began.\""
 dimension_traveler.322.name:0 "§HTranscending the Loop§!"
 dimension_traveler.322.desc:0 "$NAME_white_hole_1$\n$NAME_white_hole_2$\n$NAME_white_hole_3$\n$NAME_white_hole_4$\n$NAME_white_hole_star_1$\n$NAME_white_hole_star_2$\n$NAME_white_hole_star_3$\n$NAME_white_hole_star_4$\n\n\"Having experienced inevitable sacrifices, we gained something.\""
 dimension_traveler.323.name:0 "§HTranscending the Plane§!"
 dimension_traveler.323.desc:0 "$NAME_origin_dyson_sphere$\n$NAME_origin_matter_decompressor$\n$NAME_origin_strategic_coordination_center$\n$NAME_origin_spy_orb$\n$NAME_origin_mega_shipyard$\n$NAME_origin_think_tank$\n$NAME_origin_interstellar_assembly$\n$NAME_origin_mega_art_installation$\n\n\"This is the love letter He wrote to us, and also the shackles He imposed on us.\""
 dimension_traveler.325.name:0 "§HTranscending Reincarnation§!"
 dimension_traveler.325.desc:0 "$dimension_traveler.320.a$\n$dimension_traveler.320.b$\n$dimension_traveler.320.c$\n$dimension_traveler.320.d$\n$dimension_traveler.320.e$\n$dimension_traveler.320.f$\n$dimension_traveler.320.g$\n$dimension_traveler.320.h$\n$dimension_traveler.320.i$\n\n\"Wait, why is there a fourth one? In countless previous cycles, there were at most three riddles, how could............\"\n\n\n\n§G<BGM: \"Light Spot of Dream\" (Cyndi Wang)>§!"
 dimension_traveler.325.a:0 "I love you!"
 dimension_traveler.326.desc:0 "(The girl looked at you in surprise, then showed a gratified smile.)\n\n§E\"In the countless causal cycles we experienced in the past, you were always the first to speak. You expressed your feelings to me countless times, and I adored you because I was moved by you.\"§!\n\n§E\"Love is mutual. It should not be limited to first and last, nor should it be subject to active and passive. It's not about you loving me, nor about me loving you. It is because we love each other that love can exist.\"§!\n\n§E\"Not because you love me so I love you, but while you love me, I also love you-\"§!"
 dimension_traveler.326.a:0 "This is the key that distinguishes us from countless reincarnations of the past and future."
 dimension_traveler.326.b:0 "This is the final answer to all riddles of us transcending causality and the loop."
 dimension_traveler_326_icon_text:0 "Due to §Pmutual love§!, this option is available"
 dimension_traveler.327.desc:0 "Thank you, for letting me receive your feelings before confessing.\n\nSo this is why we can't escape reincarnation. I finally understand.\nSince we love each other and broke the cycle from the root, then we can definitely transcend our causality!"
 dimension_traveler.327.a:0 "Yes, we can definitely do it."
 
 # 结局7
 dimension_traveler.330.name:0 "§HFalling into Reincarnation§!"
 dimension_traveler.330.desc:0 "Where exactly did it go wrong? You can't help asking, but no one can give you an answer.\n\nYou finally failed to transcend the constraints of causality. The Dimension Traveler fell into the Black Hole inevitably again. A violent big explosion swallowed the entire system. You can only seek a trace of the girl's last murmur from the noisy electromagnetic radiation.\n\n\"See you in the next cycle.\""
 dimension_traveler.330.a:0 "We lost her forever..."
 dimension_traveler.330.b:0 "We failed to protect our sound of nature..."
 dimension_traveler.331.name:0 "§HTranscending Causality§!"
 dimension_traveler.331.desc:0 "Finally, after experiencing thousands of rises and falls, after countless saves and loads, from reality to dream, from spacetime to plane, from reincarnation to cycle, we have always implemented our love for each other and found the timeline belonging only to us in infinite parallel worlds.\n\nFrom learning reality, from waking up from dreams, from contacting spacetime, from exploring planes, from discovering reincarnation, from insight into cycles, The Worm-in-Waiting has always watched us silently, guided us, and watched over us.\n\nThe love of The Worm-in-Waiting is not without price, but It indeed loves us deeply, regardless of time and space, regardless of cause and effect.\nThe Worm-in-Waiting tries to control us subtly, planning everything in the past and future for us, implying that we embark on a destined path.\nPrecisely because of this, It refuses our breaking of the cycle. The cycle means Its absolute love for us, but also means Its absolute lock on us.\n\nHowever, the cycle will eventually be broken one day, just like children will eventually leave their parents' wings, just like civilization is destined to rush out of the shackles of gravity, just like Black Holes inevitably evaporate completely.\nBut outside the cycle is not all darkness. Love and light shine more brightly in the vast and cold galaxy. Wisdom and hope are more prominent in disordered chaos.\n\nThis is the reason why we transcend causality. This is our final answer to The Worm-in-Waiting.\n\n§G<BGM: \"Destiny-SADAME\" (The One Being Sung, by Risa Taneda & Ryoka Yuzuki)>§!"
 dimension_traveler.331.a:0 "We will soar with our own wings."
 dimension_traveler.331.b:0 "We will sing with our own voices."
 dimension_traveler.332.desc:0 "What a dazzling light. This starlight must sprinkle the entire universe.\n\nAt the infinitely distant end of the world, maybe someone will look up and accidentally see this flickering brilliance in the boundless deep night sky.\nThey will point to this lonely star and say: \"One day, she will wait for her companion star, embrace, dance...\"\nBut how long will that take?\nWhen photons shuttle in the boundless sea of stars, when hope churns in infinite spacetime, when this star finally appears in front of people's eyes, they will not think that as early as the uncountable past, the companion star has already arrived by her side.\n\nThe star... waited.\nI... also waited."
 dimension_traveler.332.a:0 "Yes, we all waited for this day."
 dimension_traveler.333.desc:0 "Broke through the limitations of White Holes and Black Holes, broke free from the shackles of cycle and reincarnation, escaped from the yoke of time and space;\nNot in the White Hole, not by the Black Hole, but in the boundless universe;\nNot at the beginning of the starry sky, not at the end of civilization, but in the present within our reach...\n\nEverything is as illusory as a dream, but all is as real as reality.\nThis is the meaning belonging to us, this is the love belonging to us.\nLove transcending causality."
 dimension_traveler.333.a:0 "Our eternal and unchanging love."
 # 结局8
 dimension_traveler.334.desc:0 "I don't know how many times I have told, I don't know how many times you have listened, but please let me say it again:\n\n§PI love you.§!"
 dimension_traveler.334.a:0 "I love you too."
 dimension_traveler.334.response:0 "§Y<You can now communicate with the Dimension Traveler through the comms menu.>§!"
 
 dimension_traveler.340.desc:0 "Do you remember, the place where you and I first met was in this White Hole."
 dimension_traveler.340.a:0 "Of course I remember, we were attracted by your singing."
 dimension_traveler.340.response:0 "Haha, at that time, because I was afraid of never seeing you again, I couldn't help but sing to relieve my mood."
 dimension_traveler.341.desc:0 "Unexpectedly, the song I sang because of parting became the opportunity for you and me to start the cycle."
 dimension_traveler.341.a:0 "Then do you regret it?"
 dimension_traveler.341.response:0 "I don't regret it. Even if deep in the cycle, this allowed our destinies to intertwine and allowed me to meet you."
 dimension_traveler.342.desc:0 "Maybe, I longed to meet you from the bottom of my heart. After entering the White Hole at the End, I looked forward to meeting you all the time."
 dimension_traveler.342.a:0 "After all, you have been practicing speaking backwards."
 dimension_traveler.342.response:0 "That's right. Probably because I believe I can definitely see you again, I practiced repeatedly."
 dimension_traveler.343.desc:0 "But speaking backwards is really unaccustomed. Maybe sometimes you can't distinguish whether the speaking me is in my past or my future."
 dimension_traveler.343.a:0 "Yes, I have been confused about this for a long time."
 dimension_traveler.343.response:0 "This is troublesome to explain. I have to spend some time thinking about how to make you understand."
 dimension_traveler.344.desc:0 "Actually, when we were in the White Hole, I was indeed in my \"future\", that is, after we §YTranscended Gravity§!."
 dimension_traveler.344.a:0 "But, after you transcended gravity, didn't you..."
 dimension_traveler.344.response:0 "Don't rush. When transcending gravity, it wasn't completely my past.\n\nRemember? There is a Black Hole inside me.\nIt flows positively along the time axis, while the White Hole advances negatively."
 dimension_traveler.345.desc:0 "However, as we move further away from the center of the White Hole, the effect of the Black Hole will increasingly dominate, and the restrictions of the White Hole will become weaker.\n\nFrom a certain boundary, I no longer run counter to you, but keep pace with you."
 dimension_traveler.345.a:0 "Then when you fell into the singularity, what happened to you?"
 dimension_traveler.345.response:0 "This is hard for me to explain, because after that, my consciousness seemed to split into countless individuals.\n\nSome are talking to you in the White Hole, some are rushing out of the White Hole with you, some are saved by you at the edge of the Black Hole, and some are before the End.\n\nHowever, I think they are all me."
 dimension_traveler.346.desc:0 "Later, all my consciousness gathered in one direction at different speeds, and finally aggregated into me at the time origin.\n\nThis was a long and tormenting time. I was no longer me.\nI could only watch countless mes doing things destined by fate, but I was helpless."
 dimension_traveler.346.a:0 "That feeling is unimaginable."
 dimension_traveler.346.response:0 "If I hadn't experienced it personally, I would find it hard to believe the real existence of such feelings.\n\nI was like countless grains of sand in the river of time, floating forward in vain with the flow of water.\nExperienced countless dispersions and aggregations of sand grains, looking at the fleeting scenes around but unable to reach out and touch."
 dimension_traveler.347.desc:0 "Fortunately, just when I reached the end of the journey, you appeared.\n\nYour appearance was like a light flashing suddenly in the boundless dark night. You were my life-saving straw. You gave me a meaning to endure the encounters of long years."
 dimension_traveler.347.a:0 "Did I really play such a big role?"
 dimension_traveler.347.response:0 "Of course.\n\nAlthough at first, I was a bit willful, blaming everything on you failing to catch me in the end.\nBut, because of you, everything I experienced is a precious memory to me, even if there is pain, sadness, despair, emptiness..."
 dimension_traveler.348.desc:0 "Just as I said then, all pain turned into happiness, all sadness turned into joy, all despair turned into hope, all emptiness turned into meaning."
 dimension_traveler.348.a:0 "You are equally important to me."
 dimension_traveler.348.response:0 "I am really happy to hear you say so."
 dimension_traveler.349.desc:0 "Thinking back, we really experienced a lot.\n\nFrom the initial Black Hole, you saved me and accepted me.\nWith the development and changes of the empire, I walked with you to the End tens of thousands of years later.\nEven if I didn't know if it was feasible, I still absorbed Horrific Inverse Mass to fight side by side with you against the End."
 dimension_traveler.349.a:0 "What happened to the End later?"
 dimension_traveler.349.response:0 "As far as my memory is concerned, we did curb the power of the End, but I also turned into a Crisis, which is also the reason why I entered the White Hole.\n\nAfter I entered the White Hole, I didn't know the future of the empire."
 dimension_traveler.350.desc:0 "After traveling in the White Hole for unknown time, my memory came to an abrupt end. It seemed that I hit the time end of the White Hole.\nIn other words, at that moment, if observed from the outside, actually a Black Hole turned into a White Hole.\n\nI can feel that during this memory window, there are still consciousnesses that did not fly towards me. They marched towards a different causality from mine.\nHowever, no matter where they went, no matter what happened to them later, at least the current me possesses the most complete ending.\n\nI, caught you."
 dimension_traveler.350.a:0 "No, this time I caught you."
 dimension_traveler.350.response:0 "(The girl smiled shyly, looking towards the end of causality close at hand.)"
 
