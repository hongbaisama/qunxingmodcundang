 tao_of_ninghe.3.name:0 "Path of Serenity: §HEnd Point§!"
 tao_of_ninghe.3.desc:0 "With the loss of control of §Y[Target.GetName]§!, this planet is no longer affected by our Path of Serenity."
 tao_of_ninghe.3.a:0 "Regrettable."
 tao_of_ninghe.4.name:0 "Path of Serenity: §RWave of Yin§!"
 tao_of_ninghe.4.desc:0 "§BYin Power§! on §Y[Target.GetName]§! has lost control and turned into a surging §RWave of Yin§!, wreaking havoc on our colony."
 tao_of_ninghe.4.a:0 "Too late."
 tao_of_ninghe.5.name:0 "Path of Serenity: §HOrigin§!"
 tao_of_ninghe.5.desc:0 "We have complete control of §Y[Root.GetName]§!. Our Path of Serenity will be applied to this planet and make it prosperous."
 tao_of_ninghe.5.a:0 "Very good."
 tao_of_ninghe.6.name:0 "Path of Serenity: §RHurricane of Yang§!"
 tao_of_ninghe.6.desc:0 "§YYang Power§! on §Y[Target.GetName]§! has lost control and turned into a violent §RHurricane of Yang§!, wreaking havoc on our colony."
 tao_of_ninghe.6.a:0 "Too late."
 
