 tao_of_ninghe.111.name:0 "Path of Serenity: §BNational Pride§!"
 tao_of_ninghe.111.desc:0 "People on §Y[Root.GetName]§! are full of national cohesion. They are preparing to hold a public speech to promote the superiority of our nation."
 tao_of_ninghe.111.a:0 "Approve their speech."
 tao_of_ninghe.111.b:0 "This is a dangerous speech."
 tao_of_ninghe.112.name:0 "Path of Serenity: §BCraftsmanship Spirit§!"
 tao_of_ninghe.112.desc:0 "§Y[Root.GetName]§! has always been praised for its craftsmanship spirit. Craftsmen rack their brains just to create the most perfect artwork."
 tao_of_ninghe.112.a:0 "Their spirit is commendable."
 tao_of_ninghe.112.b:0 "This spirit is superfluous for us."
 tao_of_ninghe.113.name:0 "Path of Serenity: §BVersatile§!"
 tao_of_ninghe.113.desc:0 "Everyone on §Y[Root.GetName]§! is learning a talent because the planetary art festival held every few years is coming soon."
 tao_of_ninghe.113.a:0 "Praise art."
 tao_of_ninghe.113.b:0 "This is not a reason for them to waste time."
 tao_of_ninghe.114.name:0 "Path of Serenity: §BFree Trade§!"
 tao_of_ninghe.114.desc:0 "The commerce and trade industry on §Y[Root.GetName]§! is becoming more and more prosperous. Free trade brings countless opportunities but also coexists with crisis."
 tao_of_ninghe.114.a:0 "Free trade brings opportunities."
 tao_of_ninghe.114.b:0 "Free trade brings crisis."
 tao_of_ninghe.115.name:0 "Path of Serenity: §BRefining Secret§!"
 tao_of_ninghe.115.desc:0 "Refining personnel on §Y[Root.GetName]§! seem to have mastered the secret of refining. They can produce rare resources more efficiently, but the consumables also increase accordingly."
 tao_of_ninghe.115.a:0 "In the face of efficiency, consumables are not a problem."
 tao_of_ninghe.115.b:0 "We should plan for the long term."
 
 tao_of_ninghe.121.name:0 "Path of Serenity: §YAcademic Exchange§!"
 tao_of_ninghe.121.desc:0 "A large-scale academic exchange is prepared on §Y[Root.GetName]§!. Top scientific researchers on the planet will share their research experiences with each other."
 tao_of_ninghe.121.a:0 "The collision of ideas can generate inspiration."
 tao_of_ninghe.121.b:0 "The collision of ideas will only trigger unnecessary arguments."
 tao_of_ninghe.122.name:0 "Path of Serenity: §YGreat Steel Making§!"
 tao_of_ninghe.122.desc:0 "Great steel making is planned on §Y[Root.GetName]§!. Although the quality may not be top-notch, the quantity will definitely meet our standards."
 tao_of_ninghe.122.a:0 "The alloy target will be reached soon."
 tao_of_ninghe.122.b:0 "Alloys value quality over quantity."
 tao_of_ninghe.123.name:0 "Path of Serenity: §YLive and Work in Peace§!"
 tao_of_ninghe.123.desc:0 "People on §Y[Root.GetName]§! have adapted to current life. They live and work in peace, but therefore are unwilling to accept new changes."
 tao_of_ninghe.123.a:0 "Peaceful life is everyone's pursuit."
 tao_of_ninghe.123.b:0 "Standing still will only lead to downfall; they need to adapt to changes."
 tao_of_ninghe.124.name:0 "Path of Serenity: §YImpartial Law Enforcement§!"
 tao_of_ninghe.124.desc:0 "No crime is tolerated on §Y[Root.GetName]§!. Enforcers work day and night to stop crime, but frequent law enforcement also causes panic."
 tao_of_ninghe.124.a:0 "Crime must never be tolerated."
 tao_of_ninghe.124.b:0 "Law enforcement should not be too extreme."
 tao_of_ninghe.125.name:0 "Path of Serenity: §YLabor Rotation§!"
 tao_of_ninghe.125.desc:0 "§Y[Root.GetName]§! is responsible for producing various natural resources. The government also innovatively came up with a labor rotation policy, expected to make labor production more efficient."
 tao_of_ninghe.125.a:0 "Everything is for the country."
 tao_of_ninghe.125.b:0 "Labor rights should also be protected."
 
 tao_of_ninghe.1000.name:0 "Path of Serenity: §RWave of Yin§!"
 tao_of_ninghe.1000.desc:0 "§BYin Power§! in §Y[Target.GetName]§! has lost control and turned into a surging §RWave of Yin§!, wreaking havoc on our country."
 tao_of_ninghe.1000.a:0 "This is a disaster!"
 tao_of_ninghe.1001.name:0 "Path of Serenity: §RHurricane of Yang§!"
 tao_of_ninghe.1001.desc:0 "§YYang Power§! in §Y[Target.GetName]§! has lost control and turned into a violent §RHurricane of Yang§!, wreaking havoc on our country."
 tao_of_ninghe.1001.a:0 "This is a disaster!"
 tao_of_ninghe.1010.name:0 "Path of Serenity: §GReturn to Serenity§!"
 tao_of_ninghe.1010.desc:0 "After years of effort, the disaster of §Y[Target.GetName]§! finally calmed down, and our country regained control of §GSerenity§!."
 tao_of_ninghe.1010.a:0 "Casualties were heavy..."