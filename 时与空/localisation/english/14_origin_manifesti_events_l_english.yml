l_english:
 origin_manifesti_dream_1:0 "Waking from Dream"
 origin_manifesti_dream_1_desc:0 "['concept_story_origin_text']\nIt's time to wake up from the dream, but you still stay in the dream."
 origin_tooltip_manifesti_dream_1_effects:0 "-§REndless carnival finally destroyed your empire, entertainment is dead§!"
 origin_manifesti_dream_2:0 "Waking from Dream"
 origin_manifesti_dream_2_desc:0 "['concept_story_origin_text']\nIt's time to wake up from the dream, but being awake may not be a good thing."
 origin_tooltip_manifesti_dream_2_effects:0 "-§RYou broke free from the dream's confinement, but found yourself in a new cage§!"
 origin_manifesti_dream_end:0 "Fourth Wall"
 origin_manifesti_dream_end_desc:0 "['concept_story_origin_text']\nBroke the fourth wall, we mastered the ability to distort reality."
 origin_tooltip_manifesti_dream_end_effects:0 "-§RSo it was just a game§!"
 
 pft_time_manifesti:0 "$pft_manifesti$"
 pft_time_manifesti_desc:0 "$pft_manifesti_desc$"
 ORIGIN_MANIFESTI_COUNT:0 "Have a Good Dream"
 ORIGIN_MANIFESTI_COUNT_YES_DESC:0 "[root.GetName] hopes everyone can have a good dream, and you are getting better."
 ORIGIN_MANIFESTI_COUNT_DESC:0 "[root.GetName] hopes everyone can have a good dream, say \"Thank you Cathartic\"."
 ORIGIN_MANIFESTI_COUNT_NO_DESC:0 "[root.GetName] hopes everyone can have a good dream, but you always try to wake up."
 
 situation_origin_manifesti:0 "Carnival of $pft_time_manifesti$"
 situation_origin_manifesti_type:0 "Carnival of $pft_time_manifesti$"
 situation_origin_manifesti_desc:0 "Should we embrace the carnival, be amused to death, or stay awake and live in ignominy?"
 situation_origin_manifesti_monthly_change_tooltip:0 "Show your stance through actions."
 situation_origin_manifesti_complete_effect:0 "§GStart a thorough carnival!§!\n\n§RThis may destroy your empire.§!"
 situation_origin_manifesti_fail_effect:0 "§GReflect on our actions§!\n\n§R$pft_time_manifesti$ will be dissatisfied.§!"
 stage_manifesti:0 "Dream"
 approach_origin_manifesti_default:0 "Stand By"
 situation_origin_manifesti_default_effect:0 "\"You and I are just outsiders and should not interfere at will.\""
 approach_origin_manifesti_interfere:0 "Active Interference"
 situation_origin_manifesti_interfere_effect:0 "\"Conduct active research on the natives in order to understand their biological and cultural characteristics as much as possible.\""
 string_living_standard:0 "Current $SPECIES_RIGHT_LIVING_STANDARDS$"
 string_dream_broken:0 "Dream Shattered"
 
 origin_manifesti.1.name:0 "Amused to Death: §HCatharsis§!"
 origin_manifesti.1.desc:0 "Life has no meaning. Instead of being submissive and mediocre, it is better to enjoy the moment and be amused to death.\n\nAs for the weird buildings on the planet? Origin has no meaning, function need not be known, dream needs no waking."
 origin_manifesti.1.a:0 "Start our carnival!"
 origin_manifesti.2.name:0 "Amused to Death: §HSleep§!"
 origin_manifesti.2.desc:0 "You had a beautiful dream. In this dream, all pain and sorrow do not exist."
 origin_manifesti.2.a:0 "Sleep a little longer."
 origin_manifesti.3.name:0 "Amused to Death: §HWake Up§!"
 origin_manifesti.3.desc:0 "You woke up from the dream. You try to maintain sanity, but you don't know if you are still in the dream."
 origin_manifesti.3.a:0 "Sleep a little longer."
 origin_manifesti.tooltip:0 "§RThe dream became strange...§!"
 origin_manifesti.4.name:0 "Waking from Dream: §HYesterday's Broken Dream§!"
 origin_manifesti.4.desc:0 "It's time to wake up from the dream, but you still stay in the dream.\n\nYou were forcibly pulled away from the dream, and the subjects of the empire also woke up from their sleep. The mysterious advanced civilization terminated their experiment, seemingly having obtained satisfactory results. They left with everything in the blink of an eye, leaving only broken dreams."
 origin_manifesti.4.a:0 "Am I still in a dream?"
 origin_manifesti.dream_1.tooltip:0 "§RThe dream woke up, you have nothing...§!"
 origin_manifesti.5.name:0 "Amused to Death: §HShackles§!"
 origin_manifesti.5.desc:0 "You try to stay awake, but always feel the hypocrisy of the world.\n\nYou seem to have noticed a group of mysterious observers who are meticulously recording your words and deeds. Perhaps they are the culprits creating the dream.\n\nHowever, there is a dream barrier between you and the observers. Before breaking the shackles of the dream, you cannot touch the truth."
 origin_manifesti.5.a:0 "The dream should wake up."
 origin_manifesti.6.name:0 "Waking from Dream: §HButterfly Dream§!"
 origin_manifesti.6.desc:0 "It's time to wake up from the dream, but being awake may not be a good thing.\n\nYou tried your best to stay awake and finally broke the shackles of the dream. The mysterious advanced civilization was forced to interrupt their experiment, and the result was obviously beyond their expectations. They left in a hurry with documents, but left behind countless precious data."
 origin_manifesti.6.a:0 "Wake up!"
 origin_manifesti.dream_2.tooltip:0 "§RThe dream woke up, you have nothing...§!\n§GBut do you really have nothing?§!"
 origin_manifesti.7.name:0 "Waking from Dream: §HFourth Wall§!"
 origin_manifesti.7.desc:0 "Why was I in a dream at the start? Where did that advanced civilization come from? What experiment did they do? What is the purpose of interfering with us?\n\nThey never appeared, why do they exist? Why are they real? Why are they the culprits?\n\nWhy did I work hard to operate for so long, only to end up like this?"
 origin_manifesti.7.a:0 "Why?"
 origin_manifesti.7.b:0 "Don't care about these details."
 origin_manifesti.8.name:0 "Fourth Wall: §HGame Life§!"
 origin_manifesti.8.desc:0 "We broke the fourth wall, only to discover endless data streams.\n\nIt turns out that our life is just a game. Origins, events, situations, etc. are all randomly written by a mod author named §YDawn§! outside the screen in madness.\n\nAlthough we cannot exert any influence on him, he still promised to give us the ability to distort game reality, but did not say the price."
 origin_manifesti.8.a:0 "What is all this stuff?"
 
 origin_manifesti.11.name:0 "[GetOriginManifestiName11]"
 origin_manifesti.11.name_1:0 "Amused to Death: §HObscene Party§!"
 origin_manifesti.11.name_2:0 "origin_manifesti.11.name"
 origin_manifesti.11.desc:0 "[GetOriginManifestiDesc11]"
 origin_manifesti.11.desc_1:0 "The meaning of life lies in reproduction. No one can stop us from pursuing pleasure, no one!"
 origin_manifesti.11.desc_2:0 "origin_manifesti.11.desc"
 origin_manifesti.11.a:0 "[GetOriginManifestiA11]"
 origin_manifesti.11.a_1:0 "Let me join the party too!"
 origin_manifesti.11.a_2:0 "origin_manifesti.11.a"
 origin_manifesti.11.b:0 "[GetOriginManifestiB11]"
 origin_manifesti.11.b_1:0 "You are not allowed to participate in the orgy!"
 origin_manifesti.11.b_2:0 "origin_manifesti.11.b"
 
 origin_manifesti.12.name:0 "[GetOriginManifestiName12]"
 origin_manifesti.12.name_1:0 "Amused to Death: §HShopping Spree§!"
 origin_manifesti.12.name_2:0 "origin_manifesti.12.name"
 origin_manifesti.12.desc:0 "[GetOriginManifestiDesc12]"
 origin_manifesti.12.desc_1:0 "Buy buy buy, not buying is not human!"
 origin_manifesti.12.desc_2:0 "origin_manifesti.12.desc"
 origin_manifesti.12.a:0 "[GetOriginManifestiA12]"
 origin_manifesti.12.a_1:0 "You earned, he lost!"
 origin_manifesti.12.a_2:0 "origin_manifesti.12.a"
 origin_manifesti.12.b:0 "[GetOriginManifestiB12]"
 origin_manifesti.12.b_1:0 "Stop buying!"
 origin_manifesti.12.b_2:0 "origin_manifesti.12.b"
 
 origin_manifesti.13.name:0 "[GetOriginManifestiName13]"
 origin_manifesti.13.name_1:0 "Amused to Death: §HRock Music§!"
 origin_manifesti.13.name_2:0 "origin_manifesti.13.name"
 origin_manifesti.13.desc:0 "[GetOriginManifestiDesc13]"
 origin_manifesti.13.desc_1:0 "*Indescribable penguin screech*!"
 origin_manifesti.13.desc_2:0 "origin_manifesti.13.desc"
 origin_manifesti.13.a:0 "[GetOriginManifestiA13]"
 origin_manifesti.13.a_1:0 "*Indescribable penguin screech*!"
 origin_manifesti.13.a_2:0 "origin_manifesti.13.a"
 origin_manifesti.13.b:0 "[GetOriginManifestiB13]"
 origin_manifesti.13.b_1:0 "*[root.GetName] profanity*!"
 origin_manifesti.13.b_2:0 "origin_manifesti.13.b"
 
 origin_manifesti.14.name:0 "[GetOriginManifestiName14]"
 origin_manifesti.14.name_1:0 "Amused to Death: §HPower Outage Initiative§!"
 origin_manifesti.14.name_2:0 "origin_manifesti.14.name"
 origin_manifesti.14.desc:0 "[GetOriginManifestiDesc14]"
 origin_manifesti.14.desc_1:0 "To save energy, we decided to cut power indefinitely. After all, environmental protection is most important!"
 origin_manifesti.14.desc_2:0 "origin_manifesti.14.desc"
 origin_manifesti.14.a:0 "[GetOriginManifestiA14]"
 origin_manifesti.14.a_1:0 "During this time, power plants shouldn't be idle either!"
 origin_manifesti.14.a_2:0 "origin_manifesti.14.a"
 origin_manifesti.14.b:0 "[GetOriginManifestiB14]"
 origin_manifesti.14.b_1:0 "Don't generate electricity here!"
 origin_manifesti.14.b_2:0 "origin_manifesti.14.b"
 
 origin_manifesti.15.name:0 "[GetOriginManifestiName15]"
 origin_manifesti.15.name_1:0 "Amused to Death: §HProfanity Contest§!"
 origin_manifesti.15.name_2:0 "origin_manifesti.15.name"
 origin_manifesti.15.desc:0 "[GetOriginManifestiDesc15]"
 origin_manifesti.15.desc_1:0 "There is no dispute that cannot be solved by a round of badmouthing. If there is, then two rounds!"
 origin_manifesti.15.desc_2:0 "origin_manifesti.15.desc"
 origin_manifesti.15.a:0 "[GetOriginManifestiA15]"
 origin_manifesti.15.a_1:0 "Come on, offline PVP!"
 origin_manifesti.15.a_2:0 "origin_manifesti.15.a"
 origin_manifesti.15.b:0 "[GetOriginManifestiB15]"
 origin_manifesti.15.b_1:0 "Haters have really low quality!"
 origin_manifesti.15.b_2:0 "origin_manifesti.15.b"
 
 origin_manifesti.16.name:0 "[GetOriginManifestiName16]"
 origin_manifesti.16.name_1:0 "Amused to Death: §HSuicide Movement§!"
 origin_manifesti.16.name_2:0 "origin_manifesti.16.name"
 origin_manifesti.16.desc:0 "[GetOriginManifestiDesc16]"
 origin_manifesti.16.desc_1:0 "\"I'm depressed, the disturbances of the mortal world have nothing to do with us, destroy it!\""
 origin_manifesti.16.desc_2:0 "origin_manifesti.16.desc"
 origin_manifesti.16.a:0 "[GetOriginManifestiA16]"
 origin_manifesti.16.a_1:0 "Destroy it!"
 origin_manifesti.16.a_2:0 "origin_manifesti.16.a"
 origin_manifesti.16.b:0 "[GetOriginManifestiB16]"
 origin_manifesti.16.b_1:0 "Then who will make up for my lack of population!"
 origin_manifesti.16.b_2:0 "origin_manifesti.16.b"
 
 origin_manifesti.17.name:0 "[GetOriginManifestiName17]"
 origin_manifesti.17.name_1:0 "Amused to Death: §HHacker Melee§!"
 origin_manifesti.17.name_2:0 "origin_manifesti.17.name"
 origin_manifesti.17.desc:0 "[GetOriginManifestiDesc17]"
 origin_manifesti.17.desc_1:0 "In the box war, no computer is innocent!"
 origin_manifesti.17.desc_2:0 "origin_manifesti.17.desc"
 origin_manifesti.17.a:0 "[GetOriginManifestiA17]"
 origin_manifesti.17.a_1:0 "Damn, box!"
 origin_manifesti.17.a_2:0 "origin_manifesti.17.a"
 origin_manifesti.17.b:0 "[GetOriginManifestiB17]"
 origin_manifesti.17.b_1:0 "Doxing me, right!"
 origin_manifesti.17.b_2:0 "origin_manifesti.17.b"
 
 origin_manifesti.18.name:0 "[GetOriginManifestiName18]"
 origin_manifesti.18.name_1:0 "Amused to Death: §HAbstract Painting Exhibition§!"
 origin_manifesti.18.name_2:0 "origin_manifesti.18.name"
 origin_manifesti.18.desc:0 "[GetOriginManifestiDesc18]"
 origin_manifesti.18.desc_1:0 "This is a painting only smart people can understand!"
 origin_manifesti.18.desc_2:0 "origin_manifesti.18.desc"
 origin_manifesti.18.a:0 "[GetOriginManifestiA18]"
 origin_manifesti.18.a_1:0 "No one can't understand it, right?"
 origin_manifesti.18.a_2:0 "origin_manifesti.18.a"
 origin_manifesti.18.b:0 "[GetOriginManifestiB18]"
 origin_manifesti.18.b_1:0 "I understood, did you?"
 origin_manifesti.18.b_2:0 "origin_manifesti.18.b"
 
 origin_manifesti.19.name:0 "[GetOriginManifestiName19]"
 origin_manifesti.19.name_1:0 "Amused to Death: §HLooting Art§!"
 origin_manifesti.19.name_2:0 "origin_manifesti.19.name"
 origin_manifesti.19.desc:0 "[GetOriginManifestiDesc19]"
 origin_manifesti.19.desc_1:0 "Those rich things have owned their treasures for too long. They should use them as tickets to appreciate our art, yes yes!"
 origin_manifesti.19.desc_2:0 "origin_manifesti.19.desc"
 origin_manifesti.19.a:0 "[GetOriginManifestiA19]"
 origin_manifesti.19.a_1:0 "yes!yes!"
 origin_manifesti.19.a_2:0 "origin_manifesti.19.a"
 origin_manifesti.19.b:0 "[GetOriginManifestiB19]"
 origin_manifesti.19.b_1:0 "Rat things die! die!"
 origin_manifesti.19.b_2:0 "origin_manifesti.19.b"
 
 origin_manifesti.20.name:0 "[GetOriginManifestiName20]"
 origin_manifesti.20.name_1:0 "Amused to Death: §HCommunity Hunting§!"
 origin_manifesti.20.name_2:0 "origin_manifesti.20.name"
 origin_manifesti.20.desc:0 "[GetOriginManifestiDesc20]"
 origin_manifesti.20.desc_1:0 "Life is too depressing. It's time to release people's nature. Aim at the neighbor you hate most on weekdays, hunting starts!"
 origin_manifesti.20.desc_2:0 "origin_manifesti.20.desc"
 origin_manifesti.20.a:0 "[GetOriginManifestiA20]"
 origin_manifesti.20.a_1:0 "Why don't they eat cake?"
 origin_manifesti.20.a_2:0 "origin_manifesti.20.a"
 origin_manifesti.20.b:0 "[GetOriginManifestiB20]"
 origin_manifesti.20.b_1:0 "The cake is a lie!"
 origin_manifesti.20.b_2:0 "origin_manifesti.20.b"
 
 origin_manifesti.21.name:0 "[GetOriginManifestiName21]"
 origin_manifesti.21.name_1:0 "Amused to Death: §HHuman-Machine Love§!"
 origin_manifesti.21.name_2:0 "origin_manifesti.21.name"
 origin_manifesti.21.desc:0 "[GetOriginManifestiDesc21]"
 origin_manifesti.21.desc_1:0 "Rogue Servitor waifu take us away. Without you, we can't live for a second!"
 origin_manifesti.21.desc_2:0 "origin_manifesti.21.desc"
 origin_manifesti.21.a:0 "[GetOriginManifestiA21]"
 origin_manifesti.21.a_1:0 "Girls,this way!"
 origin_manifesti.21.a_2:0 "origin_manifesti.21.a"
 origin_manifesti.21.b:0 "[GetOriginManifestiB21]"
 origin_manifesti.21.b_1:0 "Why would anyone want to fall in love with a toaster?"
 origin_manifesti.21.b_2:0 "origin_manifesti.21.b"
 
 origin_manifesti.22.name:0 "[GetOriginManifestiName22]"
 origin_manifesti.22.name_1:0 "Amused to Death: §HAll You Can Drink§!"
 origin_manifesti.22.name_2:0 "origin_manifesti.22.name"
 origin_manifesti.22.desc:0 "[GetOriginManifestiDesc22]"
 origin_manifesti.22.desc_1:0 "Grand opening sale, 1% off all drinks, free after drinking to death!"
 origin_manifesti.22.desc_2:0 "origin_manifesti.22.desc"
 origin_manifesti.22.a:0 "[GetOriginManifestiA22]"
 origin_manifesti.22.a_1:0 "Give me a cup!"
 origin_manifesti.22.a_2:0 "origin_manifesti.22.a"
 origin_manifesti.22.b:0 "[GetOriginManifestiB22]"
 origin_manifesti.22.b_1:0 "Don't make me treat!"
 origin_manifesti.22.b_2:0 "origin_manifesti.22.b"
 
 origin_manifesti.23.name:0 "[GetOriginManifestiName23]"
 origin_manifesti.23.name_1:0 "Amused to Death: §HFatal Love§!"
 origin_manifesti.23.name_2:0 "origin_manifesti.23.name"
 origin_manifesti.23.desc:0 "[GetOriginManifestiDesc23]"
 origin_manifesti.23.desc_1:0 "Maybe you will call it drugs~\nBut some people will call this love~\nFatal love!"
 origin_manifesti.23.desc_2:0 "origin_manifesti.23.desc"
 origin_manifesti.23.a:0 "[GetOriginManifestiA23]"
 origin_manifesti.23.a_1:0 "Governor, your heart is really big for you!"
 origin_manifesti.23.a_2:0 "origin_manifesti.23.a"
 origin_manifesti.23.b:0 "[GetOriginManifestiB23]"
 origin_manifesti.23.b_1:0 "I know what I must do!"
 origin_manifesti.23.b_2:0 "origin_manifesti.23.b"
 
 origin_manifesti.24.name:0 "[GetOriginManifestiName24]"
 origin_manifesti.24.name_1:0 "Amused to Death: §HVirtual Bliss§!"
 origin_manifesti.24.name_2:0 "origin_manifesti.24.name"
 origin_manifesti.24.desc:0 "[GetOriginManifestiDesc24]"
 origin_manifesti.24.desc_1:0 "Is there any difference between true and false? Keep playing music keep dancing!"
 origin_manifesti.24.desc_2:0 "origin_manifesti.24.desc"
 origin_manifesti.24.a:0 "[GetOriginManifestiA24]"
 origin_manifesti.24.a_1:0 "False becomes true!"
 origin_manifesti.24.a_2:0 "origin_manifesti.24.a"
 origin_manifesti.24.b:0 "[GetOriginManifestiB24]"
 origin_manifesti.24.b_1:0 "False is hard to be true!"
 origin_manifesti.24.b_2:0 "origin_manifesti.24.b"
 
 origin_manifesti.25.name:0 "[GetOriginManifestiName25]"
 origin_manifesti.25.name_1:0 "Amused to Death: §HPain Literature§!"
 origin_manifesti.25.name_2:0 "origin_manifesti.25.name"
 origin_manifesti.25.desc:0 "[GetOriginManifestiDesc25]"
 origin_manifesti.25.desc_1:0 "Some say ancient times were chaotic. I stand up and say you don't understand ancient times. Ten miles of foreign settlements, wind flowers snow moon, ancient times mean thrilling love, every girl can meet her warlord!"
 origin_manifesti.25.desc_2:0 "origin_manifesti.25.desc"
 origin_manifesti.25.a:0 "[GetOriginManifestiA25]"
 origin_manifesti.25.a_1:0 "It's time to recite a poem!"
 origin_manifesti.25.a_2:0 "origin_manifesti.25.a"
 origin_manifesti.25.b:0 "[GetOriginManifestiB25]"
 origin_manifesti.25.b_1:0 "Pain, so painful!"
 origin_manifesti.25.b_2:0 "origin_manifesti.25.b"