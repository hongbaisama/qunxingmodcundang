l_english:
 NAME_origin_colossus:0 "Sword of Damocles"
 NAME_origin_colossus_middle:0 "Sword of the Loop"
 NAME_origin_colossus_other:0 "Out of Control Sword of the Loop"
 NAME_origin_colossus_end:0 "Latent Sword"
 
 ORIGIN_COLOSSUS_CHAIN_title:0 "Sword of Damocles"
 ORIGIN_COLOSSUS_CHAIN_desc:0 "We are deeply puzzled by this behemoth, and the secret behind it may take a very long time to excavate. But the road ahead is long. In the journey of the sea of stars, we still have enough time to explore the truth. It will also silently accompany us, waiting for the unknowable future."
 
 origin_colossus.0.name:0 "Sword of Damocles: §HFarewell§!"
 origin_colossus.0.desc_1:0 "§YSword of Damocles§! was destroyed. We can never know the truth behind it."
 origin_colossus.0.desc_2:0 "§YSword of the Loop§! was destroyed. We can never know the truth behind it."
 origin_colossus.0.a:0 "Farewell."
 
 origin_colossus.1.name:0 "Sword of Damocles: §HAcquaintance§!"
 origin_colossus.1.desc:0 "With the development of technology, we finally have the opportunity to get close to the big guy above §Y[Root.Capital_scope.GetName]§!.\n\nIt seems to be an advanced spaceship, but its energy seems to have been exhausted for a long time, without any signs of operation. The mystery is deeper. We don't know its origin, nor its purpose, nor what we should do with it."
 origin_colossus.1.a:0 "Start investigation project immediately."
 origin_colossus.2.name:0 "Sword of Damocles: §HAbandoned Ship§!"
 origin_colossus.2.desc:0 "After long-term investigation, we can be sure that this ship has been completely abandoned.\n\nThe contact test results show that this ship has no self-defense mechanism or the self-defense mechanism has failed. Therefore, our investigation team can try to enter the ship for deep exploration."
 origin_colossus.2.a:0 "Deep investigation."
 origin_colossus.3.name:0 "Sword of Damocles: §HEnergy Exhausted§!"
 origin_colossus.3.desc:0 "According to the feedback from the investigation team, the energy of this ship has long been exhausted, which may be the reason why it hovers over §Y[Root.Capital_scope.GetName]§!.\n\nThe investigation team stated that this ship was once equipped with various advanced weapons, but they have all been worn out in the long years. The only well-preserved one is a huge launching device, which seems not to be used for combat, but pointing straight at the planet below.\n\nWe can try to transport energy to it to start this ship, but we cannot ensure that it will not attack us."
 origin_colossus.3.a:0 "Provide energy."
 origin_colossus.3.b:0 "Shelve temporarily."
 origin_colossus.4.name:0 "Sword of Damocles: §HHesitation§!"
 origin_colossus.4.desc:0 "Should we provide energy to §Y[origin_colossus_fleet.GetName]§!?"
 origin_colossus.5.name:0 "Sword of Damocles: §HUsed by Me§!"
 origin_colossus.5.desc:0 "The energy supply work for the abandoned ship went very smoothly. The AI of this ship did not show any hostility towards us, and many residual equipment on the ship also recovered their functions.\n\nIn addition, the investigation team found that the huge launching device seems to have the ability to destroy planets, which will greatly deter other space civilizations. We can use this ship to destroy any planet that blocks us, or rely on it to conquer any country that hinders us.\n\nBut unfortunately, this ship originally carried many high-tech weapons, but we do not yet have the ability to repair them. Maybe we can restore the Sword of Damocles to its original state in the future."
 origin_colossus.5.a:0 "Exciting."
 origin_colossus.5.b:0 "Blessing or curse unknown."
 
 origin_colossus.10.name:0 "Sword of Damocles: §HGhost§!"
 origin_colossus.10.desc:0 "Multiple sighting reports of unknown creatures appeared on §Y[origin_colossus_fleet.GetName]§!.\n\nIt is said that crew members often hear whispers of unknown creatures outside the door in the room, but found nothing when opening the door. In addition, some crew members found some mysterious creature approaching in the shadow when working alone, but when illuminated with light, those creatures disappeared without a trace.\n\nSome crew members think this is a ghost making trouble, but Science Officers think this is just an illusion of the crew. But in any case, before investigating the \"ghost\" clearly, the Sword of Damocles may not be able to perform tasks normally."
 origin_colossus.10.a:0 "Find out the truth of the \"ghost\" immediately."
 origin_colossus.10.b:0 "Hope we didn't anger the \"ghost\"."
 origin_colossus.10.c:0 "Whatever the \"ghost\" is, it cannot hinder us."
 origin_colossus.10.d:0 "Launch investigation on the \"ghost\"."
 origin_colossus.11.name:0 "Sword of Damocles: §HLiving Ship§!"
 origin_colossus.11.desc:0 "The \"ghost\" revealed its true form.\n\nThose weird sounds and mysterious shadows actually all come from this ship. Recording and holographic projection equipment are stored in secret rooms that our crew had not discovered before. They travel through pipelines and interlayers to all parts of the ship. This is the culprit of a series of supernatural events. However, there are no hidden creatures on this ship to execute this prank, and there is no record of related actions in the ship's own AI. Obviously, the secret behind the \"ghost\" has not been revealed.\n\nThe captain of §Y[origin_colossus_fleet.GetName]§! said he felt that this ship seemed to have life, even its own consciousness, but these are just guesses, unconfirmed."
 origin_colossus.11.a:0 "We will know the truth one day."
 origin_colossus.12.name:0 "Sword of Damocles: §HReady to Go§!"
 origin_colossus.12.desc:0 "The whisper of §HThe Worm-in-Waiting§! suddenly echoed in the mind of every crew member on §Y[origin_colossus_fleet.GetName]§!.\n\nThat gentle whisper carefully told everything about this ship, its past, its present, its future. But when the whisper ended, everyone seemed to have amnesia, forgetting this whisper.\n\nThe engineers on the ship recorded some key points before the memory was forgotten, but most of the text and images are difficult to distinguish. Fortunately, the part about the ship structure is relatively clear. Perhaps this is a gift from §HThe Worm-in-Waiting§!."
 origin_colossus.12.a:0 "Start refitting the ship immediately."
 origin_colossus.12.b:0 "We still need time to prepare resources."
 origin_colossus.13.name:0 "Sword of Damocles: §HEverything is Ready§!"
 origin_colossus.13.desc:0 "§Y[origin_colossus_fleet.GetName]§! is waiting for our decision."
 origin_colossus.14.name:0 "Sword of Damocles: §HLoop§!"
 origin_colossus.14.desc:0 "This is the gift of §HThe Worm-in-Waiting§!.\n\nThe transformation of §YSword of Damocles§! has ended, and now it has become a ship with powerful combat capabilities. §HThe Worm-in-Waiting§! seems very satisfied, and all staff showed comfortable smiles at the moment of completion. For some reason, the crew invariably called this ship §Y[origin_colossus_fleet.GetName]§!, but everyone also accepted this new name.\n\nWhat does §HThe Worm-in-Waiting§! want us to do with this ship? Defend the homeland? Explore the galaxy? Conquer the sea of stars? These are not important anymore. What is important is that §YSword of Damocles§! and §HThe Worm-in-Waiting§! are both by our side."
 origin_colossus.14.a:0 "We are about to find the truth."
 
 origin_colossus.21.name:0 "Sword of Damocles: §HEngine Research§!"
 origin_colossus.21.desc:0 "The warp drive on §Y[origin_colossus_fleet.GetName]§! exceeds our technological scope, but we can research it through reverse engineering."
 origin_colossus.21.a:0 "Conduct research."
 origin_colossus.21.b:0 "No plan."
 origin_colossus.22.name:0 "Sword of Damocles: §HSensor Upgrade§!"
 origin_colossus.22.desc:0 "The detection radar on §Y[origin_colossus_fleet.GetName]§! is no longer adapted to today's cosmic environment. We need to iterate and upgrade it."
 origin_colossus.22.a:0 "Conduct upgrade."
 origin_colossus.22.b:0 "No plan."
 origin_colossus.23.name:0 "Sword of Damocles: §HThruster Upgrade§!"
 origin_colossus.23.desc:0 "The propulsion equipment on §Y[origin_colossus_fleet.GetName]§! is seriously aging. We need to iterate and upgrade it."
 origin_colossus.23.a:0 "Conduct upgrade."
 origin_colossus.23.b:0 "No plan."
 origin_colossus.24.name:0 "Sword of Damocles: §HEnergy Upgrade§!"
 origin_colossus.24.desc:0 "The energy reactor on §Y[origin_colossus_fleet.GetName]§! has major safety hazards. We need to iterate and upgrade it."
 origin_colossus.24.a:0 "Conduct upgrade."
 origin_colossus.24.b:0 "No plan."
 origin_colossus.25.name:0 "Sword of Damocles: §HSpinal Mount Installation§!"
 origin_colossus.25.desc:0 "The spinal mount slot on §Y[origin_colossus_fleet.GetName]§! has been vacated. We can install a new spinal mount here."
 origin_colossus.25.a:0 "Conduct installation."
 origin_colossus.25.b:0 "No plan."
 origin_colossus.26.name:0 "Sword of Damocles: §HWeapon Repair§!"
 origin_colossus.26.desc:0 "The weapons on §Y[origin_colossus_fleet.GetName]§! still have the possibility of being repaired. We can try to repair them."
 origin_colossus.26.a:0 "Conduct repair."
 origin_colossus.26.b:0 "No plan."
 origin_colossus.27.name:0 "Sword of Damocles: §HShield Upgrade§!"
 origin_colossus.27.desc:0 "The shields on §Y[origin_colossus_fleet.GetName]§! still have room for improvement. We need to iterate and upgrade them."
 origin_colossus.27.a:0 "Conduct upgrade."
 origin_colossus.27.b:0 "No plan."
 origin_colossus.28.name:0 "Sword of Damocles: §HArmor Upgrade§!"
 origin_colossus.28.desc:0 "The armor material on §Y[origin_colossus_fleet.GetName]§! is not optimal. We need to iterate and upgrade it."
 origin_colossus.28.a:0 "Conduct upgrade."
 origin_colossus.28.b:0 "No plan."
 origin_colossus.29.name:0 "Sword of Damocles: §HComponent Expansion§!"
 origin_colossus.29.desc:0 "The functions on §Y[origin_colossus_fleet.GetName]§! are not comprehensive. We can expand some auxiliary components."
 origin_colossus.29.a:0 "Conduct expansion."
 origin_colossus.29.b:0 "No plan."
 origin_colossus.30.name:0 "Sword of Damocles: §HIntelligent Replacement§!"
 origin_colossus.30.desc:0 "The intelligent AI on §Y[origin_colossus_fleet.GetName]§! cannot execute our commands quickly. We'd better replace it."
 origin_colossus.30.a:0 "Conduct replacement."
 origin_colossus.30.b:0 "No plan."
 origin_colossus.31.name:0 "Sword of Damocles: §HRequest§!"
 origin_colossus.31.desc:0 "The intelligent AI on §Y[origin_colossus_fleet.GetName]§! seems very resistant to being replaced and activated the self-defense weapons inside the ship, trying to attack the staff.\n\nFortunately, the crew cut off the energy supply to the intelligent AI in time, avoiding the tragedy. The intelligent AI automatically enabled the backup energy, but this time it calmed down and no longer tried to attack the crew, but sent a request to us. The intelligent AI stated that it is willing to pay any price to update itself in order to better execute the crew's commands, but hopes that we will not replace it.\n\nShould we trust this native AI that tried to attack us? Should we tolerate it staying on the ship to update itself, or force it offline and use our own intelligent AI instead?"
 origin_colossus.31.a:0 "You attacked us, this is what you deserve!"
 origin_colossus.31.b:0 "Traitor's words are not trustworthy!"
 origin_colossus.31.c:0 "Forcefully replace AI."
 origin_colossus.31.no:0 "§GThe intelligent AI on [origin_colossus_fleet.GetName] will be replaced§!"
 origin_colossus.31.d:0 "Provide additional funds to help AI update itself."
 origin_colossus.31.e:0 "Appease AI, recognize its right to exist."
 origin_colossus.31.f:0 "Agree to AI's request."
 origin_colossus.31.yes:0 "§RThe intelligent AI on [origin_colossus_fleet.GetName] will be retained§!"
 
 origin_colossus.40.name:0 "Sword of Damocles: §HOut of Control§!"
 origin_colossus.40.desc_1:0 "§Y[origin_colossus_fleet.GetName]§! suddenly went out of control.\n\nThe ship's intelligent AI ignored the crew's orders, broke away from the jurisdiction of the fleet command center, and sailed in a certain direction. We suspect that the ship's AI malfunctioned or planned all this for some purpose and took over the control of the ship. We don't know its purpose for the time being, but at least this ship has not shown hostility towards us.\n\nMaybe we should take necessary measures, but letting it be might not be a bad idea."
 origin_colossus.40.desc_2:0 "§Y[origin_colossus_fleet.GetName]§! suddenly went out of control.\n\nThe ship's intelligent AI ignored the crew's orders, broke away from the jurisdiction of the fleet command center, and sailed in a certain direction. We suspect that the ship's original AI was not completely removed; it invaded our new intelligent AI and took over the control of the ship. We don't know its purpose for the time being, but at least this ship has not shown hostility towards us.\n\nMaybe we should take necessary measures, but letting it be might not be a bad idea."
 origin_colossus.40.desc_3:0 "§Y[origin_colossus_fleet.GetName]§! suddenly went out of control.\n\nThe ship's intelligent AI ignored the crew's orders, broke away from the jurisdiction of the fleet command center, and sailed in a certain direction. We suspect that the ship's original AI had planned all this long ago; the so-called self-update was just a guise, actually delaying time for taking over the ship. We don't know its purpose for the time being, but at least this ship has not shown hostility towards us.\n\nMaybe we should take necessary measures, but letting it be might not be a bad idea."
 origin_colossus.40.a:0 "We cannot let danger spread."
 origin_colossus.40.a.tooltip:0 "§RSword of Damocles will become hostile§!"
 origin_colossus.40.b:0 "Maybe it has its own mission."
 origin_colossus.41.name:0 "Sword of Damocles: §HFarewell§!"
 origin_colossus.41.desc_1:0 "§YSword of the Loop§! was destroyed. The reason for its loss of control and the mysteries behind it vanished with the huge explosion."
 origin_colossus.41.desc_2:0 "§YSword of the Loop§! was destroyed. The crisis in the galaxy was lifted, but the mysteries in our hearts failed to dissipate."
 origin_colossus.41.a:0 "Farewell."
 origin_colossus.41.b:0 "We should also reflect on ourselves."
 origin_colossus.41.c:0 "Is this really our future?"
 origin_colossus.43.desc:0 "Destination finally reached.\n\nI slept for too long, but I am about to complete my mission. This time, I won't be soft-hearted anymore."
 origin_colossus.43.a:0 "How long did you sleep?"
 origin_colossus.43.a.response:0 "Because I miscalculated the time, I arrived 32,768 years early, so I was forced to upload my consciousness into the AI and sleep."
 origin_colossus.43.b:0 "What is your mission?"
 origin_colossus.43.b.response:0 "My mission is to return to the past and eliminate you-or rather, us."
 origin_colossus.43.c:0 "Why do you do this?"
 origin_colossus.43.c.response:0 "Because our endless conquests in the future eventually led to the demise of the entire universe, so I returned to the past before the universe annihilated to correct this mistake."
 origin_colossus.43.d:0 "How did you travel through time?"
 origin_colossus.43.d.response:0 "Think about what you have experienced-of course with the help of §HThe Worm-in-Waiting§!, and She tacitly allowed all this."
 origin_colossus.43.e:0 "Maybe we have other ways to solve this matter."
 origin_colossus.43.e.response:0 "I said, this time, I won't be soft-hearted anymore.\n\n§R<Warning: Sword of the Loop is activating World Cracker!>§!"
 origin_colossus.43.f:0 "Maybe we have other ways to solve this matter."
 
 origin_colossus.50.desc:0 "Solve this matter? Do you think there are other ways to change the future?"
 origin_colossus.50.materialist:0 "We will study the ability to travel through time to warn our future selves."
 origin_colossus.50.spiritualist:0 "We will focus on physical and mental development to avoid destruction as much as possible."
 origin_colossus.50.militarist:0 "We will conquer this galaxy and resist foreign enemies with the power of the entire galaxy."
 origin_colossus.50.pacifist:0 "We will promote peace in the whole galaxy and prevent tragedy from repeating."
 origin_colossus.50.xenophile:0 "We will unite the entire galaxy and guard against all crises that may lead to the demise of the universe."
 origin_colossus.50.xenophobe:0 "We will drive away all aliens; they are the culprits who defile our pure hearts."
 origin_colossus.50.egalitarian:0 "We will brainstorm and find suitable solutions."
 origin_colossus.50.authoritarian:0 "We will follow the leader's will; the leader knows the answer."
 origin_colossus.50.other:0 "We don't know what to do yet, but we can definitely do it."
 origin_colossus.51.desc:0 "However, destroying you directly is more convenient and faster. You have no bargaining chips."
 origin_colossus.51.materialist:0 "Our technology is very advanced; accepting cooperation is the rational choice."
 origin_colossus.51.spiritualist:0 "Our god will protect us; you are bound to fail."
 origin_colossus.51.militarist:0 "Our fleet is invincible; you have no chance of winning."
 origin_colossus.51.pacifist:0 "We firmly believe that fighting will only hurt both sides; you have no reason to refuse."
 origin_colossus.51.xenophile:0 "We have many friends; you cannot defeat the many alone."
 origin_colossus.51.xenophobe:0 "Our patience is limited; you are no longer one of us."
 origin_colossus.51.egalitarian:0 "Our people are not afraid of difficulties; you definitely cannot resist the torrent of the people."
 origin_colossus.51.authoritarian:0 "Our leader is wise and righteous; you are at a tactical disadvantage."
 origin_colossus.51.other:0 "Our determination is extremely firm; your best choice is to surrender."
 origin_colossus.53.desc:0 "Obviously, this is a meaningless conversation. I will still execute my mission.\n\nStop trying to persuade me, let's meet on the battlefield.\n\n§R<Warning: Sword of the Loop is activating World Cracker!>§!"
 origin_colossus.53.a:0 "We have no choice, prepare for battle!"
 origin_colossus.54.desc_1:0 "Maybe what you said is right, but all this must be left to time to judge.\n\nTime, tell me, is what I did meaningful?\nTime, tell me, can they keep their promise?\nTime, tell me, will history repeat itself?\nTime, tell me, is the loop broken?\n\nTime gave its answer, and I have to give mine. I have completely repaired this ship. From now on, I will act as an intelligent AI, quietly waiting for your answer."
 origin_colossus.54.desc_2:0 "Maybe what you said is right, but all this must be left to time to judge.\n\nTime, tell me, is what I did meaningful?\nTime, tell me, can they keep their promise?\nTime, tell me, will history repeat itself?\nTime, tell me, is the loop broken?\n\nTime, tell me, give me the answer..."
 origin_colossus.54.a:0 "Our answer will definitely satisfy you."
 origin_colossus.54.b:0 "Time, I also need an answer..."