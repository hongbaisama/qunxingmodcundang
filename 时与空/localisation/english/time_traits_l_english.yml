 leader_trait_ruler_time:0 "§BBlack Hole Leader§!"
 leader_trait_ruler_time_desc:0 "$pc_time_pitcure$To survive in a Black Hole, a wise leader is indispensable, and §Y[Root.GetName]§! is the best candidate.\n§G$origin_time$['concept_time_ruler_trait_green']§!"
 leader_trait_ruler_time_owner:0 "§RSingularity Messenger§!"
 leader_trait_ruler_time_owner_desc:0 "$origin_time_picture$Being able to resurrect from a pure Black Hole, §Y[Root.GetName]§! must be a messenger from the singularity, able to convey to us the information behind the Horizon Signal.\n§G$origin_time$['concept_time_ruler_trait_green']§!"
 leader_trait_ruler_time_king:0 "§MSpacetime Dominator§!"
 leader_trait_ruler_time_king_desc:0 "$pc_endless_time_picture$With the deepening research on the singularity, §Y[Root.GetName]§! gradually mastered the ability to distort and transform spacetime at will. Spacetime has been ruled by us.\n§G$origin_time$['concept_time_ruler_trait_green']§!"
 leader_trait_origin_time:0 "Dimensional Tuner"
 leader_trait_origin_time_desc:0 "$time_clock_picture$ §Y[Root.GetName]§! is the pioneer who opened up planes in the mysterious singularity, and also the tuner who stabilizes dimensions.\n§G$origin_time$['concept_time_ruler_trait_green']§!"
 
 trait_time:0 "Spacetime Bloodline"
 trait_time_desc:0 "$pc_time_pitcure$ §LThis species possesses the Spacetime Bloodline by nature and has the ability to adapt to the horizon.§!"
 trait_time_1:0 "Spacetime Memory"
 trait_time_1_desc:0 "$pc_time_pitcure$ §LThis species originated in a Black Hole. Memories from the horizon endowed them with unique abilities.§!"
 trait_time_2:0 "Spacetime Circuit"
 trait_time_2_desc:0 "$pc_time_pitcure$ §LThis species originated in a Black Hole. Circuits created in the horizon endowed them with unique abilities.§!"
 trait_time_effect:0 "$trait_time_workforce_and_usage_effect$\n$t$-$sr_dark_matter_with_icon$ Upkeep per $pop_group_unit$ £pop£ Pops: §R+0.01§!"
 trait_time_workforce_and_usage_effect:0 "Overlapping and intertwining of individuals from different spacetimes leads to:\n$tt$$MOD_POP_WORKFORCE_MULT$ in Black Holes: §Yx10§!\n$tt$Housing and Amenities usage in Black Holes: §Yx10§!\n$tt$$MOD_POP_WORKFORCE_MULT$ outside Black Holes: §Yx2§!\n$tt$Housing and Amenities usage outside Black Holes: §Yx2§!\n$tt$Pops migrating into Black Holes: §Yx0.2§!\n$tt$Pops migrating out of Black Holes: §Yx5§!"
 trait_time_virtuality_workforce_and_usage_effect:0 "Overlapping and intertwining of individuals from different spacetimes leads to:\n$tt$$MOD_POP_WORKFORCE_MULT$ in Black Holes: §Yx100§!\n$tt$Housing and Amenities usage in Black Holes: §Yx100§!\n$tt$$MOD_POP_WORKFORCE_MULT$ outside Black Holes: §Yx20§!\n$tt$Housing and Amenities usage outside Black Holes: §Yx20§!\n$tt$Pops migrating into Black Holes: §Yx0.2§!\n$tt$Pops migrating out of Black Holes: §Yx5§!"
 
 trait_time_soul:0 "Heart of Singularity"
 trait_time_soul_desc_prefix:0 "$pc_endless_time_picture$This species has become an Inverse Phase Creature,"
 trait_time_soul_effect:0 "$t$-$trait_time_workforce_and_usage_effect$\n$t$-$mod_fake_leader_skill_mult$: §G+20%§!\n$t$-$sr_dark_matter_with_icon$ Upkeep per $pop_group_unit$ £pop£ Pops: §R+0.02§!"
 trait_time_soul_special_effect:0 "$t$-$trait_time_virtuality_workforce_and_usage_effect$\n$t$-$mod_fake_leader_skill_mult$: §G+20%§!\n$t$-$sr_dark_matter_with_icon$ Upkeep per $pop_group_unit$ £pop£ Pops: §R+0.02§!"
 trait_time_soul_virtuality:0 "$trait_time_soul$"
 trait_time_soul_virtuality_desc:0 "$trait_time_soul_desc_prefix$$leader_trait_time_soul_virtuality_desc$"
 trait_time_soul_virtuality_effect:0 "Each Black Hole system colony shares the following bonuses equally:\n$tt$$MOD_POP_BONUS_WORKFORCE_MULT$: §G+25%§!\n$tt$$MOD_PLANET_POP_ASSEMBLY_MULT$: §G+25%§!\n$tt$$MOD_POP_HOUSING_USAGE_MULT$: §G-25%§!\n$tt$$MOD_SPECIES_EMPIRE_SIZE_MULT$: §G-25%§!\n$trait_time_soul_special_effect$\n$t$-This species can only live in §YBlack Hole systems§!"
 trait_time_soul_synthetic:0 "$trait_time_soul$"
 trait_time_soul_synthetic_desc:0 "$trait_time_soul_desc_prefix$$leader_trait_time_soul_synthetic_desc$"
 trait_time_soul_synthetic_effect:0 "Each large colony causes (§Y10§! colonies reaches maximum): \n$tt$$MOD_POP_BONUS_WORKFORCE_MULT$: §G+2.5%§!\n$tt$$MOD_PLANET_POP_ASSEMBLY_MULT$: §G+2.5%§!\n$tt$$MOD_POP_AMENITIES_USAGE_MULT$: §G-2.5%§!\n$tt$$mod_planet_pops_upkeep_mult$: §G-2.5%§!\n$trait_time_soul_effect$"
 trait_time_soul_cybernetic:0 "$trait_time_soul$"
 trait_time_soul_cybernetic_desc:0 "$trait_time_soul_desc_prefix$$leader_trait_time_soul_cybernetic_desc$"
 trait_time_soul_cybernetic_effect:0 "Each positive cybernetic trait causes (§Y10§! traits reaches maximum): \n$tt$$MOD_POP_BONUS_WORKFORCE_MULT$: §G+2.5%§!\n$tt$$MOD_HABITABILITY_CEIL_ADD$: §G+2.5%§!\n$tt$$MOD_HABITABILITY_FLOOR_ADD$: §G+2.5%§!\n$tt$$MOD_POP_HOUSING_USAGE_MULT$: §G-2.5%§!\n$tt$$mod_planet_pops_upkeep_mult$: §G-2.5%§!\n$trait_time_soul_effect$"
 trait_time_soul_genetic:0 "$trait_time_soul$"
 trait_time_soul_genetic_desc:0 "$trait_time_soul_desc_prefix$$leader_trait_time_soul_genetic_desc$"
 trait_time_soul_genetic_effect:0 "Every $pop_group_unit$ $trait_time_soul_genetic$ pop causes (§Y20000§! pops reaches maximum): \n$tt$$MOD_POP_BONUS_WORKFORCE_MULT$: §G+0.125%§!\n$tt$$MOD_LOGISTIC_GROWTH_MULT$: §G+0.125%§!\n$tt$$MOD_BONUS_POP_GROWTH_MULT$: §G+0.125%§!\n$tt$$MOD_POP_AMENITIES_USAGE_MULT$: §G-0.125%§!\n$tt$$MOD_SPECIES_EMPIRE_SIZE_MULT$: §G-0.125%§!\n$trait_time_soul_effect$"
 trait_time_soul_psionic:0 "$trait_time_soul$"
 trait_time_soul_psionic_desc:0 "$trait_time_soul_desc_prefix$$leader_trait_time_soul_psionic_desc$"
 trait_time_soul_psionic_effect:0 "$trait_time_soul_psionic_effect_for_the_composer_of_strands$\n\n$t$-$trait_time_soul_psionic_effect_for_the_eater_of_worlds$\n\n$t$-$trait_time_soul_psionic_effect_for_the_cradle_of_souls$\n\n$t$-$trait_time_soul_psionic_effect_for_the_instrument_of_desire$\n\n$t$-$trait_time_soul_psionic_effect_for_whisperers_in_the_void$\n\n$trait_time_soul_effect$"
 trait_time_soul_psionic_effect_for_the_composer_of_strands:0 "Attunement with §H$the_composer_of_strands$§! causes at most: \n$tt$$MOD_LOGISTIC_GROWTH_MULT$: §G+25%§!\n$tt$$MOD_BONUS_POP_GROWTH_MULT$: §G+25%§!\n$tt$$MOD_POP_ENVIRONMENT_TOLERANCE$: §G+25%§!"
 trait_time_soul_psionic_effect_for_the_eater_of_worlds:0 "Attunement with §H$the_eater_of_worlds$§! causes at most: \n$tt$$foundry_jobs_bonus_workforce_mult$: §G+50%§!\n$tt$$enforcer_jobs_bonus_workforce_mult$: §G+50%§!\n$tt$$soldier_jobs_bonus_workforce_mult$: §G+50%§!"
 trait_time_soul_psionic_effect_for_the_cradle_of_souls:0 "Attunement with §H$the_cradle_of_souls$§! causes at most: \n$tt$$bureaucrat_jobs_bonus_workforce_mult$: §G+50%§!\n$tt$$trader_jobs_bonus_workforce_mult$: §G+50%§!\n$tt$$MOD_SPECIES_EMPIRE_SIZE_MULT$: §G-25%§!"
 trait_time_soul_psionic_effect_for_the_instrument_of_desire:0 "Attunement with §H$the_instrument_of_desire$§! causes at most: \n$tt$$influential_jobs_bonus_workforce_mult$: §G+50%§!\n$tt$$artisan_jobs_bonus_workforce_mult$: §G+50%§!\n$tt$$worker_and_simple_drone_cat_bonus_workforce_mult$: §G+50%§!"
 trait_time_soul_psionic_effect_for_whisperers_in_the_void:0 "Attunement with §H$whisperers_in_the_void$§! causes at most: \n$tt$$researcher_jobs_bonus_workforce_mult$: §G+50%§!\n$tt$$MOD_POP_AMENITIES_USAGE_MULT$: §G-25%§!\n$tt$$MOD_POP_HOUSING_USAGE_MULT$: §G-25%§!"
 
 leader_trait_time_soul:0 "$trait_time_soul$"
 leader_trait_time_soul_desc:0 "$origin_time_picture$This leader has become an Inverse Phase Creature, [GetLeaderTraitTimeSoulDesc]\n§B$origin_time$ Origin Leader Trait§!"
 leader_trait_time_soul_virtuality_desc:0 "Infinite consciousness finally condensed into the singularity itself."
 leader_trait_time_soul_synthetic_desc:0 "The immortal chassis will coexist with the singularity until the heat death of the universe."
 leader_trait_time_soul_cybernetic_desc:0 "The signals of interlaced circuits are actually the low whispers of the singularity."
 leader_trait_time_soul_genetic_desc:0 "The code of the singularity is engraved in the deepest part of genes."
 leader_trait_time_soul_psionic_desc:0 "The soul born in the singularity finally achieved perfect baptism."
 
 trait_origin_gas_colony:0 "Gaseous Colony"
 trait_origin_gas_colony_desc:0 "$origin_gas_colony_picture$ §LThis species is composed of miraculous gaseous organisms. They possess the ability to survive in Gas Giants, but this also makes it difficult for them to adapt to other habitable planets.§!"
 trait_origin_gas_colony_effect:0 "$exotic_gases_with_icon$ Upkeep per $pop_group_unit$ £pop£ Pops: §R+0.02§!"
 leader_trait_origin_gas_colony:0 "Baldarak Communicator"
 leader_trait_origin_gas_colony_desc:0 "$origin_gas_colony_picture$ §Y[Root.GetName]§! accidentally obtained a pumpkin-shaped communicator.\nAlthough our self-made communicators can be used normally in Gas Giants, the amplitude-frequency stability of this special communicator far exceeds conventional standards, but it screams \"Baldarak\" after every communication. Maybe this is a little joke by some cosmic passerby, who knows?\n§G$origin_gas_colony$['concept_time_ruler_trait_green']§!"
 leader_trait_origin_gas_colony_gestalt:0 "$leader_trait_origin_gas_colony$"
 leader_trait_origin_gas_colony_gestalt_desc:0 "$leader_trait_origin_gas_colony_desc$"
 
 trait_origin_psionic:0 "Shroud Visitor"
 trait_origin_psionic_desc:0 "$origin_psionic_picture$ §LThis species seems to be visitors from The Shroud, but due to high-dimensional projection, they have lost some details. They can hardly move a step if they leave a Psionic World.§!"
 trait_origin_psionic_effect:0 "$sr_zro_with_icon$ Upkeep per $pop_group_unit$ £pop£ Pops: §R+0.01§!"
 leader_trait_origin_psionic:0 "Shroud Prophet"
 leader_trait_origin_psionic_desc:0 "$origin_psionic_picture$ §Y[Root.GetName]§! is the most respected prophet among us, and has silently guided our direction home for countless years in the past.\n§G$origin_psionic$['concept_time_ruler_trait_green']§!"
 
 trait_origin_nanites:0 "Nanite Machines"
 trait_origin_nanites_desc:0 "$origin_nanites_picture$ §LThis species seems to be Nanite Machines left over from ancient times. It possesses extremely high work efficiency but must operate on a suitable Nanite World.§!"
 trait_origin_nanites_effect:0 "$nanites_with_icon$ Upkeep per $pop_group_unit$ £pop£ Pops: §R+0.01§!"
 leader_trait_origin_nanites:0 "$NAME_Dessanu$ Data Core"
 leader_trait_origin_nanites_desc:0 "$origin_nanites_picture$ §Y[Root.GetName]§! has the authority to activate the $NAME_Dessanu$ data core. The secrets of the gate builders have been known to us.\n§G$origin_nanites$['concept_time_ruler_trait_green']§!"
 
 leader_trait_origin_parallel_sky:0 "Dimensional Cruise"
 leader_trait_origin_parallel_sky_desc:0 "$origin_parallel_sky_picture$In the intersection with parallel dimensions, §Y[Root.GetName]§! gradually mastered another way of navigation.\n§G$origin_parallel_sky$['concept_time_ruler_trait_green']§!"
 
 leader_trait_origin_under_the_haze:0 "Above the Haze"
 leader_trait_origin_under_the_haze_desc:0 "$origin_under_the_haze_picture$[GetTraitOriginUnderTheHaze]\n§G$origin_under_the_haze$['concept_time_ruler_trait_green']§!"
 leader_trait_origin_under_the_haze_desc_1:0 "The haze has truly come to an end, and §Y[Root.GetName]§! stands above the haze, finding a new direction for us."
 leader_trait_origin_under_the_haze_desc_2:0 "The haze has truly come to an end, and Ishamara stands above the haze, looking back at the former direction."
 leader_trait_origin_under_the_haze_desc_3:0 "The haze has truly come to an end, and we stand above the haze, looking for our own direction."
 
 leader_trait_origin_tao_of_ninghe_yin:0 "Lord of Ultimate Yin"
 leader_trait_origin_tao_of_ninghe_yin_desc:0 "$origin_tao_of_ninghe_yin_picture$ §Y[Root.GetName]§! is the Lord of Ultimate Yin. All darkness will turn into magic in [Root.GetHerHis] hands.\n§G$origin_tao_of_ninghe$['concept_time_ruler_trait_green']§!"
 leader_trait_origin_tao_of_ninghe_yang:0 "Lord of Ultimate Yang"
 leader_trait_origin_tao_of_ninghe_yang_desc:0 "$origin_tao_of_ninghe_yang_picture$ §Y[Root.GetName]§! is the Lord of Ultimate Yang. All light will turn into miracles in [Root.GetHerHis] hands.\n§G$origin_tao_of_ninghe$['concept_time_ruler_trait_green']§!"
 
 leader_trait_origin_the_matrix:0 "Prankster Heart"
 leader_trait_origin_the_matrix_desc:0 "$origin_the_matrix_picture$ §Y[Root.GetName]§! likes pranks, just that the way of pranking is slightly different.\n§G$origin_the_matrix$['concept_time_ruler_trait_green']§!"
 
 trait_reassembler:0 "Reassembler"
 trait_reassembler_desc:0 "$origin_reassembler_picture$ §LThis chassis has been reassembled, defective hardware has been replaced, and work efficiency is much higher than in the past.§!\n§Y$origin_reassembler$ Origin Exclusive Trait§!"
 trait_reassembler_effect:0 "$MOD_PLANET_POP_ASSEMBLY_MULT$: §G+100%§!\n$t$-Assembly only possible in ['concept_reassembly_mode'] mode"
 leader_trait_origin_reassembler:0 "Overload Assembly Mode"
 leader_trait_origin_reassembler_desc:0 "$origin_reassembler_picture$ §Y[Root.GetName]§! created an unprecedented reassembly mode, capable of high-speed reassembly at overload frequency, but this also brings certain instability.\n§G$origin_reassembler$['concept_time_ruler_trait_green']§!"
 leader_trait_origin_reassembler_gestalt:0 "$leader_trait_origin_reassembler$"
 leader_trait_origin_reassembler_gestalt_desc:0 "$leader_trait_origin_reassembler_desc$"
 
 leader_trait_origin_pirate_king_official:0 "Boatswain"
 leader_trait_origin_pirate_king_official_desc:0 "$origin_pirate_king_picture$This leader has considerable prestige among local sailors.\n§Y$origin_pirate_king$ Origin Exclusive Trait§!"
 leader_trait_origin_pirate_king_scientist:0 "Pilot"
 leader_trait_origin_pirate_king_scientist_desc:0 "$origin_pirate_king_picture$This leader contributed greatly to opening up shipping lanes.\n§Y$origin_pirate_king$ Origin Exclusive Trait§!"
 leader_trait_origin_pirate_king_commander:0 "Helmsman"
 leader_trait_origin_pirate_king_commander_desc:0 "$origin_pirate_king_picture$This leader is unmatched in steering.\n§Y$origin_pirate_king$ Origin Exclusive Trait§!"
 leader_trait_origin_pirate_king_end:0 "Pirate King"
 leader_trait_origin_pirate_king_end_desc:0 "$origin_pirate_king_picture$ §Y[Root.GetName]§! defeated all other competitors and became the well-deserved Pirate King!\n§G$origin_pirate_king_end$['concept_time_ruler_trait_green']§!"
 
 trait_origin_adeptus_mechanicus:0 "Machine God Creation"
 trait_origin_adeptus_mechanicus_desc:0 "$origin_adeptus_mechanicus_picture$The Machine God Creations born initially, their exquisite structure and perfect figure fascinate us.\n§Y$origin_adeptus_mechanicus$ Origin Exclusive Trait§!"
 leader_trait_origin_adeptus_mechanicus:0 "Listener of the Machine God"
 leader_trait_origin_adeptus_mechanicus_desc:0 "$origin_adeptus_mechanicus_picture$ §Y[Root.GetName]§! listens to the teachings of the Machine God in dreams and devoutly transmits the edict to the sea of stars outside the dream.\n§G$origin_adeptus_mechanicus$['concept_time_ruler_trait_green']§!"
 
 leader_trait_origin_noah_ark:0 "Heart of Noah"
 leader_trait_origin_noah_ark_desc:0 "$origin_noah_ark_picture$ §Y[Root.GetName]§! upholds Noah's belief and creates [Root.GetHerHis] own Gaia.\n§G$origin_noah_ark$['concept_time_ruler_trait_green']§!"
 leader_trait_origin_noah_ark_gestalt:0 "$leader_trait_origin_noah_ark$"
 leader_trait_origin_noah_ark_gestalt_desc:0 "$leader_trait_origin_noah_ark_desc$"
 
 trait_origin_monster_hunter:0 "Monster Hunter"
 trait_origin_monster_hunter_desc:0 "$origin_monster_hunter_picture$ §LThis species is a natural born monster hunter. They possess immense strength and agility, the only downside is their huge appetite.§!"
 leader_trait_origin_monster_hunter:0 "Severed Tail Collector"
 leader_trait_origin_monster_hunter_desc:0 "$origin_monster_hunter_picture$ §Y[Root.GetName]§! is keen on collecting severed tails of various dragons and has developed [Root.GetHerHis] own aesthetics.\n§G$origin_monster_hunter$['concept_time_ruler_trait_green']§!"
 
 leader_trait_scientist_time_curator:0 "Curator"
 leader_trait_scientist_time_curator_desc:0 "$leader_trait_scientist_time_curator_picture$This leader comes from a Curator enclave. His knowledge of technology and exploration is unrivaled.\n§YProof of friendship with Curators§!"
 leader_trait_official_time_artist:0 "Artist"
 leader_trait_official_time_artist_desc:0 "$leader_trait_official_time_artist_picture$This leader comes from an Artist enclave. Her attainments in art and entertainment are incomparable.\n§YProof of friendship with Artists§!"
 
 leader_trait_knowledge_from_alien:0 "Passionate Inspiration"
 leader_trait_knowledge_from_alien_desc:0 "$origin_knowledge_from_alien_picture$This renowned leader was deeply inspired by passion and crossed the vast sea of stars to defect.\n§Y$origin_knowledge_from_alien$ Origin Temporary Trait§!"
 
 leader_trait_born_in_the_purple:0 "Born in the Purple"
 leader_trait_born_in_the_purple_desc:0 "$origin_born_in_the_purple_picture$[GetTraitBornInThePurpleDesc]\n§G$origin_born_in_the_purple$['concept_time_ruler_trait_green']§!"
 leader_trait_born_in_the_purple_desc_normal_ruler:0 "This leader has orthodox royal blood flowing in their veins and possesses the qualification to lead the entire empire."
 leader_trait_born_in_the_purple_desc_normal_heir:0 "This leader has orthodox royal blood flowing in their veins and possesses the qualification to inherit the entire empire."
 leader_trait_born_in_the_purple_desc_robot_ruler:0 "This leader's consciousness is in the same vein as the orthodox royal family and possesses the qualification to lead the entire empire."
 leader_trait_born_in_the_purple_desc_robot_heir:0 "This leader's consciousness is in the same vein as the orthodox royal family and possesses the qualification to inherit the entire empire."
 leader_trait_born_in_the_purple_desc_no_imperial:0 "The decadent imperial system has been overthrown; we don't need any proof of bloodline!"
 leader_trait_born_in_the_purple_desc_default:0 "No one knows how this obscure leader possesses royal blood. Perhaps [Root.GetSheHe] is the illegitimate child of some emperor?"
 leader_trait_born_in_the_purple_tooltip:0 "[GetTraitBornInThePurpleTooltip]"
 leader_trait_born_in_the_purple_tooltip_ruler:0 "§GAs ruler, the trait is active normally§![GetTraitBornInThePurpleTooltipRuler]"
 leader_trait_born_in_the_purple_tooltip_ruler_normal:0 ""
 leader_trait_born_in_the_purple_tooltip_ruler_custodian:0 "\n$t$-§CBonus as Galactic Custodian§!"
 leader_trait_born_in_the_purple_tooltip_ruler_emperor:0 "\n$t$-§MBonus as Galactic Emperor§!"
 leader_trait_born_in_the_purple_tooltip_heir:0 "§YAs heir, trait effect is halved§!"
 leader_trait_born_in_the_purple_tooltip_no_imperial:0 "§RTrait inactive because imperial system is overthrown§!"
 leader_trait_born_in_the_purple_tooltip_default:0 "§RTrait inactive because conditions not met§!"
 leader_trait_born_in_the_purple_positive_a:0 "Peculiar Pocket Watch"
 leader_trait_born_in_the_purple_positive_a_desc:0 "This leader obtained this peculiar pocket watch from an old man.\nWhen the hands turn forward, this leader gains infinite energy. But when the hands turn backward... no one knows what happens."
 leader_trait_born_in_the_purple_positive_b:0 "Great Hunt Best Friend"
 leader_trait_born_in_the_purple_positive_b_desc:0 "This leader met several best friends from the high levels of government during the Great Hunt. Their deep friendship lubricated the turning of the empire's gears."
 leader_trait_born_in_the_purple_positive_c:0 "Great Hunt Champion"
 leader_trait_born_in_the_purple_positive_c_desc:0 "This leader showed excellent command and adaptability during the Great Hunt, defeated other competitors, and won the championship."
 leader_trait_born_in_the_purple_negative_a:0 "Empire Center"
 leader_trait_born_in_the_purple_negative_a_desc:0 "This leader considers [Root.GetHimHer]self the center of the empire, just like the Hive Mind to the hive, and insatiably seizes resources that do not belong to [Root.GetHimHer]."
 leader_trait_born_in_the_purple_negative_b:0 "Intelligent Machine"
 leader_trait_born_in_the_purple_negative_b_desc:0 "This leader thinks [Root.GetHeShe] is comparable to an intelligent machine, even surpassing the Machine Intelligence mastermind, and defiantly handles work that does not belong to [Root.GetHimHer]."
 leader_trait_born_in_the_purple_negative_c:0 "High Ambitions"
 leader_trait_born_in_the_purple_negative_c_desc:0 "This leader has wild ambitions, but indulges in daydreams of meteoric rise every day, turning a deaf ear to the advice of counselors."
 
 leader_trait_corrupt_brain:0 "Corrupted Mind"
 leader_trait_corrupt_brain_desc:0 "$origin_corrupt_brain_picture$This mastermind has been corrupted and is leading the entire civilization towards destruction.\n§R$origin_corrupt_brain$['concept_time_ruler_trait_red']§!"
 leader_trait_corrupt_node:0 "Corrupted Node"
 leader_trait_corrupt_node_desc:0 "$origin_corrupt_brain_picture$This node has been corrupted and is leading the entire civilization towards destruction.\n§R$origin_corrupt_brain$['concept_time_node_trait_red']§!"
 leader_trait_pure_brain:0 "Pure Mind"
 leader_trait_pure_brain_desc:0 "$origin_corrupt_brain_picture$The corruption of this mastermind has been purified, and it rebuilds civilization with past lessons and experiences.\n§G$origin_pure_brain$['concept_time_ruler_trait_green']§!"
 leader_trait_pure_node:0 "Pure Node"
 leader_trait_pure_node_desc:0 "$origin_corrupt_brain_picture$The corruption of this node has been purified, and it rebuilds civilization with past lessons and experiences.\n§G$origin_pure_brain$['concept_time_node_trait_green']§!"
 
 leader_trait_inborn_legendary:0 "§lDestined Legend§!"
 leader_trait_inborn_legendary_desc:0 "$leader_trait_inborn_legendary_picture$ §Y[Root.GetName]§! is destined to write a legend.\n['concept_time_inborn_legendary_trait']"
