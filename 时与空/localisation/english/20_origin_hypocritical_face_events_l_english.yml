 origin_hypocritical_face.4.name:0 "Hypocritical Face: §HMake Public§!"
 origin_hypocritical_face.4.desc_1:0 "Rumors about §Y[From.GetName]§! were finally confirmed. They are a very secretly disguised criminal syndicate, and use their hypocritical mask to swaggeringly engage in transnational illegal activities."
