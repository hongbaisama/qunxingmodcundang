 #特殊对话 (暂时废弃) 
 action.1.desc_time_0_to_1:0 "Hmm... we look very similar, right, although there are still big differences, but...\n\nAfter all, we have the same ancestors. I am glad to see your empire become so powerful, but relying solely on spiritual guidance is probably difficult to get you further... And our current resources are abundant enough for us to share...\n\nI mean, return to our homeworld, join us, we can dominate the galaxy together to make up for the mistakes made by our ancestors."
 action.1.desc_time_0_to_2:0 "Heh, you traitors! You shouldn't have appeared in front of us again!\n\nRelying on the people's trust in you, consuming the resources of our homeworld, you achieved remarkable results in the field of machinery. You should have shared this technological progress with all Chrono-Sequencers, but chose to transform yourselves into machines and then flee our system!\n\nYou are traitors to the Chrono-Sequencers and will eventually be conquered by us!"
 action.1.desc_time_1_to_0:0 "How can you pollute our vision again?\n\nA group of selfish guys, just to free up more resources for that meaningless science, exiled our ancestors! Look at you now. Relying on the pursuit of spirit, we have also reached an advanced technological level, which saves much more trouble than your blind research.\n\nWe don't want to have any intersection with you anymore, just hope you can witness our glorious future and abandon stupid materialism!"
 action.1.desc_time_1_to_2:0 "A pile of evil machines?\n\nWait, you seem to have been members of that group of selfish guys? Heh, blindly pursuing science, finally just abandoning your holy bodies and becoming this ugly appearance, really self-inflicted. However, we only need to cultivate our moral character, and we can also make the so-called science serve us, without worrying about having such an end.\n\nYou are hopeless, we don't want to have intersection with you anymore."
 action.1.desc_time_2_to_0_a:0 "Start first contact protocol.\n\nError, according to database records, we once had common ancestors. You mechanical slaves who don't value machines are still unwilling to give up your bodies, really too stupid. According to data analysis, our technology is far more advanced than yours, and our strength is far stronger than yours.\n\nCommunicating with you is just futile. We don't need to spend more energy wasting on meeting you."
 action.1.desc_time_2_to_0_b:0 "Start first contact protocol.\n\nError, according to database records, we once had common ancestors. You mechanical slaves who don't value machines finally chose to abandon your bodies, which is really wise. However, according to data analysis, our technology is far more advanced than yours, and our strength is far stronger than yours.\n\nCommunicating with you is just futile. We don't need to spend more energy wasting on meeting you."
 action.1.desc_time_2_to_1_a:0 "Start first contact protocol.\n\nError, according to database records, we once had common ancestors. You are weak exiles, actually able to survive under our calculated 0.6349% survival probability, worth studying. However, according to data analysis, our technology is far more advanced than yours, and our strength is far stronger than yours.\n\nCommunicating with you is just futile. We don't need to spend more energy wasting on meeting you."
 action.1.desc_time_2_to_1_b:0 "Start first contact protocol.\n\nError, according to database records, we once had common ancestors. You are weak exiles, actually able to survive with extremely low probability, and even joined the ranks of machines like us, this probability is only 0.0175%, worth studying. However, according to data analysis, our technology is far more advanced than yours, and our strength is far stronger than yours.\n\nCommunicating with you is just futile. We don't need to spend more energy wasting on meeting you."

