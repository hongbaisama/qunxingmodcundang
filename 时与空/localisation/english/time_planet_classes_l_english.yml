 pc_time:0 "Spacetime Black Hole"
 pc_time_adj:0 "Black Hole"
 pc_time_desc:0 "Spacetime Black Hole is not just an ordinary Black Hole. It is selective about the entry and exit of matter and energy, and allows the appearance of certain life. However, in the Spacetime Black Hole, time is chaotic and difficult to control, so creatures living in it have to overcome various cognitive errors, which also reduces work efficiency.\n[GetPcTimeModifierLoc]"
 pc_time_tile:0 "Spacetime Plane"
 pc_time_tile_desc:0 "Mysterious plane at the junction of spacetime, all phenomena cannot be explained by common sense."
 
 pc_time_replace:0 "$pc_black_hole$"
 pc_time_replace_adj:0 "$pc_black_hole$"
 pc_time_replace_desc:0 "$pc_black_hole_desc$"
 pc_time_replace_tile:0 "Black Hole Plane"
 pc_time_replace_tile_desc:0 "Will devour all intruding matter, difficult to peep its full picture."
 
 pc_endless_time:0 "Endless Singularity"
 pc_endless_time_adj:0 "Singularity"
 pc_endless_time_desc:0 "The huge Spacetime Black Hole was condensed into a tiny singularity, but it contains endless mysteries inside.\n[GetPcEndlessTimeModifierLoc]"
 pc_endless_time_tile:0 "Endless Plane"
 pc_endless_time_tile_desc:0 "Plane wrapped in endlessness, and containing endlessness within."
 
 pc_time_white_hole:0 "White Hole"
 pc_time_white_hole_adj:0 "White Hole"
 pc_time_white_hole_desc:0 "A White Hole is a source of ejection in the universe, which can provide matter and energy to the external region but cannot absorb any matter and radiation from the external region. However, the White Hole was once only a theoretical model until we actually observed this planet to be confirmed."
 pc_time_white_hole_tile:0 "White Hole Plane"
 pc_time_white_hole_tile_desc:0 "Continuously spewing matter outwards, difficult to gain insight into its full picture."
 
 pc_gas_colony:0 "$pc_gas_giant$"
 pc_gas_colony_adj:0 "Gaseous"
 pc_gas_colony_desc:0 "$pc_gas_giant_desc$"
 pc_gas_colony_tile:0 "Gaseous Terrain"
 pc_gas_colony_tile_desc:0 "Terrain located in a Gas Giant, both rough and agile."
 
 pc_psionic:0 "Psionic World"
 pc_psionic_adj:0 "Psionic"
 pc_psionic_desc:0 "Planet filled with psionics. Except for Shroud Visitors, almost no creatures can withstand the psionic waves within."
 pc_psionic_tile:0 "Shroud Terrain"
 pc_psionic_tile_desc:0 "Terrain filled with psionics, unpredictable like the Shroud."
 
 pc_nanites:0 "$pc_gray_goo$"
 pc_nanites_adj:0 "Nanite"
 pc_nanites_desc:0 "Planet covered by countless nanobots, but unlike ordinary Nanite Worlds, all robots on this planet are in an active state."
 pc_nanites_tile:0 "Nanite Terrain"
 pc_nanites_tile_desc:0 "Terrain composed of nanobots, prioritizing efficiency over aesthetics."
 
 pc_flood:0 "Flood World"
 pc_flood_adj:0 "Flood"
 pc_flood_desc:0 "World completely submerged by celestial flood. Turbulent waves churn on the sea surface all the time, and unpredictable rapid vortexes are hidden under the water surface. No creature can survive in it."
 pc_flood_tile:0 "Flood Terrain"
 pc_flood_tile_desc:0 "World under flood, original terrain has long been eroded beyond recognition."
 
 pc_time_ruin_cosmogenesis_world:0 "Abandoned $pc_cosmogenesis_world$"
 pc_time_ruin_cosmogenesis_world_desc:0 "An abandoned reservoir computing system. It once interconnected hundreds of millions of sentient beings, including organics or synths, with intricate cables, transistors, and life support pods, but now only a mess remains."
 
 pc_time_notofthisworld:0 "Plane Gate"
 pc_time_notofthisworld_adj:0 "Plane"
 pc_time_notofthisworld_desc:0 "This is an irregular folded spacetime connected to a plane not belonging to this world."
 pc_time_notofthisworld_tile:0 "Extradimensional Plane"
 pc_time_notofthisworld_tile_desc:0 "Plane leading to another dimension, its environment is vastly different from our universe."
 
 change_pc_time_1:0 "Black Hole Seal"
 change_pc_time_1_desc:0 "We have returned to this homeland from tens of thousands of years ago. However, it is now extremely strange to us, even appearing full of evil. We should change it back to its original appearance and designate it as a forbidden land to warn future generations."
 change_pc_time_2:0 "Black Hole Peep"
 change_pc_time_2_desc:0 "We have returned to this mysterious Black Hole. It is different from other Black Holes in the universe. We may never know the reason. But we can try to transform it into a normal Black Hole and peep into the secrets of the Black Hole in the process."
 
