 sc_endless_time:0 "Endless Singularity"
 sc_endless_time_desc:0 "The huge Spacetime Black Hole was condensed into a tiny singularity, but it contains endless mysteries inside."
 sc_time_core:0 "Galactic Core"
 sc_time_core_desc:0 "This is the Galactic Core of the Milky Way, and a strange civilization is quietly sprouting in it."
 sc_endless_time_core:0 "Endless Galactic Core"
 sc_endless_time_core_desc:0 "The huge Galactic Core Black Hole was condensed into a tiny singularity, but it contains endless mysteries inside."
