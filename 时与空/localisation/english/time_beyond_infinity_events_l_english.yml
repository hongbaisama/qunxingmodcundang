 beyond_infinity.6001.a:0 "What about you?"
 beyond_infinity.6002.desc:0 "I will stay in this cycle and continue to watch over your empire.\n\nWhen your people are threatened, when this universe encounters a crisis, when Proclamation of the End makes a comeback, when the final End arrives quietly, someone needs to guide the direction of the future.\nThis cycle needs me, but don't worry. Just as there are countless cycles, there will be countless me accompanying you.\n\nSee you in the next cycle."
 beyond_infinity.6002.a:0 "Let's go."
 beyond_infinity.6002.a.tooltip:0 "§H\"Documents/Paradox Interactive/Stellaris/user_empire_designs.txt\"§!\n§YAdd hidden civics that match the government to your custom empire!§!"