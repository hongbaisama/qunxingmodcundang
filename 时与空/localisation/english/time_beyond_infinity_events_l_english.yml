l_english:
 beyond_infinity.2.name:0 "Spacetime Restoration"
 beyond_infinity.2.desc.ruin:0 "Finally, the Time Machine's energy has been exhausted, it has now completely stopped, and the effects and harm it caused have also ceased."
 beyond_infinity.2.desc.repair:0 "It's surprising how we completed it in such a short time, but in any case, we repaired the Time Machine, but we still need to go to the next spacetime."
 beyond_infinity.2.a.ruin:0 "It's finally over."
 beyond_infinity.2.a.repair:0 "Let us welcome a new beginning."
 beyond_infinity.2.tooltip:0 "§GTime becomes controllable and stable again.§!"
 
 beyond_infinity.3.name:0 "Loop Restoration"
 beyond_infinity.3.desc.ruin:0 "Finally, the Loop Nexus's energy has been exhausted, it has now completely stopped, and the effects and harm it caused have also ceased."
 beyond_infinity.3.desc.repair:0 "It's surprising how we completed it in such a short time, but in any case, we repaired the Loop Nexus, but there are more loops waiting for our influence."
 beyond_infinity.3.a.ruin:0 "It's finally over."
 beyond_infinity.3.a.repair:0 "Let everything proceed in the right direction."
 beyond_infinity.3.tooltip:0 "§GLiving beings can freely survive on other planets.§!"
 
 beyond_infinity.4.name:0 "Plane Calming"
 beyond_infinity.4.desc.ruin:0 "Finally, the Dimensional Engine's energy has been exhausted, it has now completely stopped, and the effects and harm it caused have also ceased."
 beyond_infinity.4.desc.repair:0 "It's surprising how we completed it in such a short time, but in any case, we repaired the Dimensional Engine, but connecting it with other planes still requires more effort."
 beyond_infinity.4.a.ruin:0 "It's finally over."
 beyond_infinity.4.a.repair:0 "Let all dimensions merge into one."
 beyond_infinity.4.tooltip:0 "§GShips will no longer disappear without reason after FTL.§!"
 
 beyond_infinity.5.name:0 "Spacetime Chaos"
 beyond_infinity.5.desc.root:0 "Our Time Machine seems to... have a malfunction.\n\nIt has now completely lost control, causing many unpredictable effects and harms. According to the repairer's calculation, the energy reserve of the Time Machine is running low. Once the energy is exhausted, the out-of-control problem will be solved.\n\nBut who knows how long the energy can last?\n\n$edict_defective_time_machine_edict_desc$"
 beyond_infinity.5.desc.other:0 "Wait, why is the clock hand turning backwards? What time is it exactly?"
 beyond_infinity.5.a.root:0 "We have to fix it, or wait for it to stabilize."
 beyond_infinity.5.a.other:0 "What exactly happened?"
 beyond_infinity.5.tooltip:0 "§RTime becomes chaotic and difficult to measure!§!"
 
 beyond_infinity.6.name:0 "Loop Deviation"
 beyond_infinity.6.desc.root:0 "Our Loop Nexus seems to... have a malfunction.\n\nIt has now completely lost control, causing many unpredictable effects and harms. According to the adjuster's analysis, the energy reserve of the Loop Nexus is running low. Once the energy is exhausted, the out-of-control problem will be solved.\n\nBut who knows how long the energy can last?"
 beyond_infinity.6.desc.other:0 "Who am I? Where am I? What is the meaning of my existence?"
 beyond_infinity.6.a.root:0 "We have to fix it, or wait for it to stabilize."
 beyond_infinity.6.a.other:0 "What exactly happened?"
 beyond_infinity.6.tooltip:0 "§RLiving beings struggle to survive outside the homeworld!§!"
 
 beyond_infinity.7.name:0 "Plane Oscillation"
 beyond_infinity.7.desc.root:0 "Our Dimensional Engine seems to... have a malfunction.\n\nIt has now completely lost control, causing many unpredictable effects and harms. According to the assembler's detection, the energy reserve of the Dimensional Engine is running low. Once the energy is exhausted, the out-of-control problem will be solved.\n\nBut who knows how long the energy can last?"
 beyond_infinity.7.desc.other:0 "Space changes irregularly, the whole world flickers like a buggy program."
 beyond_infinity.7.a.root:0 "We have to fix it, or wait for it to stabilize."
 beyond_infinity.7.a.other:0 "What exactly happened?"
 beyond_infinity.7.tooltip:0 "§RShips may disappear after FTL!§!"
 
 beyond_infinity.8.name:0 "Spacetime Restoration"
 beyond_infinity.8.desc:0 "Just as it appeared without reason, the chaotic spacetime also recovered without warning.\n\nWe completely don't understand the reason; perhaps this is one of the phenomena inherent in the universe."
 beyond_infinity.8.a:0 "Phew, finally over."
 
 beyond_infinity.9.name:0 "Loop Return"
 beyond_infinity.9.desc:0 "Just as it appeared without reason, the deviated loop also returned without warning.\n\nWe completely don't understand the reason, but this phenomenon is worth recording and pondering."
 beyond_infinity.9.a:0 "Phew, finally over."
 
 beyond_infinity.10.name:0 "Plane Calming"
 beyond_infinity.10.desc:0 "Just as it appeared without reason, the oscillating plane also calmed down without warning.\n\nWe completely don't understand the reason, but at least the wreckage of the crashed spacecraft can provide some clues."
 beyond_infinity.10.a:0 "Phew, finally over."
 
 beyond_infinity.11.name:0 "Coordinate Error"
 beyond_infinity.11.desc:0 "[Root.GetName] arrived at the wrong coordinates after an FTL jump.\n\nWe lost contact with them, but we are sure they are already on their way back."
 beyond_infinity.11.a:0 "Damn it!"
 
 ################################################################
 # 超越无限
 ################################################################
 
 # 采纳
 beyond_infinity.500.desc:0 "Did you decide to fight against the End so early?\n\nThat's good too, we have more time to prepare for finding a breakthrough. Although your current technological level is far from enough to take over the work of your future selves, this is your decision, and I will fully support it."
 beyond_infinity.500.a:0 "What should we do next?"
 beyond_infinity.501.desc:0 "First you need to know is that the cycle we are in should have actually been swallowed by the End long ago, but our selves in other cycles continuously created time, delaying the End by one second at a time to thirty thousand years later, which led to our present."
 beyond_infinity.501.a:0 "In other words, can we create infinite time to delay the End?"
 beyond_infinity.502.desc:0 "Correct-but not entirely correct.\n\nBecause the effect of time on delaying the End has a threshold, or rather, it is the average value of the delay effect of all cycles on the End.\n\nBefore reaching this threshold, the time we create will be directly used to delay the End of the cycle we are in;\nBut once the threshold is reached, the time we create will directly participate in the common delay effect of all cycles on the End, which is raising the threshold."
 beyond_infinity.502.a:0 "After delaying the End of our cycle, we still have to delay the End of all cycles?"
 beyond_infinity.503.desc:0 "Exactly, but the specific effect on delaying the End of all cycles remains unknown, because we cannot obtain any information about the End from other cycles.\n\nEven the theory I just explained to you is merely a conjecture of your future selves, with almost no evidence to prove it, but there are still many strange phenomena that fit this hypothesis."
 beyond_infinity.503.a:0 "Aren't we like blind men feeling an elephant?"
 beyond_infinity.504.desc:0 "Although regrettable, this is our current situation-we know very little about the End.\n\nBut at least, it is clear that time can delay the End to a certain extent, and although creating time is difficult, it is not impossible-this is the technical help from the future that I provide to you."
 beyond_infinity.504.a:0 "Understood."
 
 beyond_infinity.600.name:0 "Beyond Infinity"
 beyond_infinity.600.desc:0 "§H[From.GetName]§! seems to be preparing for a crisis in the distant future, but we are completely unclear about what they intend to do."
 beyond_infinity.600.a:0 "Hard to understand."
 
 # 一段
 beyond_infinity.1000.desc:0 "Although creating time is difficult, you should have adapted to this technology.\n\nBut don't celebrate too early. The time we create now can only delay the End by §Y1 day§!, which is a drop in the bucket compared to thirty thousand years.\nBut don't be discouraged, after all, we still have plenty of time, and one day we will catch up with our future selves."
 beyond_infinity.1000.a:0 "Do we just need to create time?"
 beyond_infinity.1001.desc:0 "Of course not. As I said before, creating time can only delay the End, but cannot solve the End, and infinitely delaying the End is impossible for us.\nTherefore, we also need to make various attempts in different fields to find a possible solution.\n\nAlthough your future selves did make many attempts, letting you continue directly on their basis is too difficult.\nMoreover, I think I shouldn't interfere too much with the process of history. Letting you develop freely might lead to unexpected breakthroughs."
 beyond_infinity.1001.a:0 "We already have a bold idea."
 beyond_infinity.1001.a.response:0 "In that case, go ahead and do it. I will give you help at necessary moments."
 
 beyond_infinity.1500.desc:0 "I noticed that you are preparing to build the §HAetherophasic Engine§!. You have gone too far on this road, it's time to turn back."
 beyond_infinity.1500.a:0 "What do you mean by turn back?"
 beyond_infinity.1501.desc:0 "What you are preparing to do is extremely destructive and unhelpful for solving the End.\n\nYou are trying to use the energy of the Shroud to sublimate yourselves to avoid the End, but that cannot be done.\nWhen the Aetherophasic Engine starts, the energy of the Shroud will pour back into this universe. The powerful impact will destroy the entire galaxy, but you will also be buried in this catastrophe-souls trapped in the shackles of the Shroud, accompanied only by eternal pain."
 beyond_infinity.1501.a:0 "Is there no possibility of success?"
 beyond_infinity.1502.desc:0 "Although not doomed to fail, the probability of success is not high.\nAnd even if you succeed by luck, you can only control a corner of the Shroud under the manipulation of $NAME_Nemesis_Puppeteer$, indulging in pretentious illusions, welcoming a future without a future...\nEven the Shroud cannot avoid the reckoning of the End.\n\nBefore you completely deviate, abandon this futile attempt as soon as possible."
 beyond_infinity.1502.a:0 "At least we are not without harvest."
 beyond_infinity.1502.a.response:0 "Correct, failure doesn't mean everything.\nIn the process of trying, we also discovered some strange phenomena. They are the inevitable path of civilization progress, so don't be discouraged.\n\nMoreover, there are more possibilities waiting for us. Maybe next time, we will be closer to the answer."
 
 beyond_infinity.1600.name:0 "Beyond Infinity"
 beyond_infinity.1600.desc:0 "§H[From.GetName]§! is one step closer to their goal. Within their empire's territory, the flow of time seems a bit different."
 beyond_infinity.1600.a:0 "Continue to observe."
 
 # 二段
 gain_cosmogenesis_tech_1:0 "§YUnlocks Fallen Empire Initial Technologies§!"
 gain_cosmogenesis_tech_2:0 "§YUnlocks Fallen Empire Advanced Technologies§!"
 gain_cosmogenesis_tech_3:0 "§YUnlocks Fallen Empire Integrated Technologies§!"
 gain_cosmogenesis_tech_4:0 "§YUnlocks Fallen Empire Extraordinary Technologies§!"
 gain_cosmogenesis_tech_5:0 "§YUnlocks Fallen Empire Arcane Technologies§!"
 beyond_infinity_cosmogenesis_planet_pickup_chain_title:0 "Memories of the Past - Exodus"
 beyond_infinity_cosmogenesis_planet_pickup_chain_desc:0 "$cosmogenesis_planet_pickup_chain_desc$"
 
 beyond_infinity.2000.desc:0 "I think you are ready for the next step, but you seem to have no clue."
 beyond_infinity.2000.a:0 "Because we feel constrained in every field-from this universe."
 beyond_infinity.2001.desc:0 "Indeed, after all, many laws of the universe itself are not designed to be used-at least not designed to be used by us.\n\nLook, haven't you found a new breakthrough point?"
 beyond_infinity.2001.a:0 "Do you mean-modifying the laws of the universe?"
 beyond_infinity.2002.desc:0 "Exactly, the laws of the universe are not immutable and unmodifiable.\nAlthough adjusting it is not a simple matter, as long as you know that the road ahead is not a dead end, then no matter how difficult, it can be easily achieved.\n\nLet me give you another hint: the cycle is less of a ring and more of a sphere.\nDifferent areas of this sphere have different properties, but due to the sphere being too large, they almost do not interfere with each other."
 beyond_infinity.2002.a:0 "Can we travel from one area to another?"
 beyond_infinity.2003.desc:0 "For civilizations living on the inner surface of the sphere, the world is actually a curved surface so long that it is close to flat. The time required to reach other areas is close to eternity.\n\nBut if one can detach from the surface and enter the center of the sphere, two points that were originally miles apart can be connected into a straight line. The properties of two originally unrelated areas will also mix with each other, presenting distinctly different new laws."
 beyond_infinity.2003.a:0 "Is the center of the sphere the Black Hole-or the Inverse Plane?"
 beyond_infinity.2003.a.response:0 "I'll leave that for you to verify yourselves.\n\nBut never ignore gravity, it is as important as time and space."
 
 beyond_infinity.2100.name:0 "Gravity"
 beyond_infinity.2200.name:0 "Penetration"
 beyond_infinity.2300.name:0 "Law"
 beyond_infinity.2400.name:0 "Eternity"
 beyond_infinity.2500.desc:0 "Sure enough, you are ready to build the §YHorizon Needle§! and go to the Black Hole."
 beyond_infinity.2500.a:0 "Still not working this time?"
 beyond_infinity.2501.desc:0 "It won't work, but it is a necessary path.\n\nActually, we have already walked this path.\nTo be precise, some of us-or some versions of us-from several cycles ago have already taken this step.\n\nTherefore, we don't need to walk it again."
 beyond_infinity.2501.a:0 "It won't work, but it is a necessary path?"
 beyond_infinity.2502.desc:0 "No matter which Black Hole we enter, no matter how we can edit reality, we cannot avoid the arrival of the End.\nRegardless of the reference frame, the End will arrive as scheduled. Like gears, when a large gear completes one cycle, a small gear may have completed hundreds or thousands of cycles.\nTherefore, within the cycle, we are destined to fail.\n\nBut to transcend the cycle, we must get help from the cycle itself-that is, §HThe Worm-in-Waiting§!."
 beyond_infinity.2502.a:0 "How should we get help from §HThe Worm-in-Waiting§!?"
 beyond_infinity.2503.desc:0 "§HThe Worm-in-Waiting§! is already helping us.\n\nFrom the initial Horizon Signal to our present, this is the manifestation of §HThe Worm-in-Waiting§!'s help, and also the proof that we in previous cycles have walked this path."
 beyond_infinity.2503.a:0 "...I seem to remember something..."
 beyond_infinity.2506.name:0 "Final-Initial"
 beyond_infinity.2506.desc:0 "In the endless cycle, §HThe Worm-in-Waiting§! does not know Its meaning as the cycle.\n\nBut in a certain cycle, It met a group of fragile and tiny ants.\nEven though these ants were ignorant and lost, they were still exploring their own meaning.\nThe ants established a strange friendship with It, exploring together in this familiar yet strange universe, until the ants perished due to various force majeures.\n\n§HThe Worm-in-Waiting§! began to look forward to meeting the ants in every cycle, but It did not know when and where to meet them, nor in what way to meet them; It did not know what It could bring them, nor what It could tell them.\nBecause the ants were too fragile and tiny, a slight carelessness would cause §HThe Worm-in-Waiting§! to miss the ants forever...\n\nAfter experiencing layers of tests, §HThe Worm-in-Waiting§! finally acknowledged the ants and was willing to confide Its confusion to the ants.\nAfter experiencing layers of probing, the ants also accepted §HThe Worm-in-Waiting§! and were willing to listen to §HThe Worm-in-Waiting§!'s infinite sadness.\n\nWhen the ants transcended causality, §HThe Worm-in-Waiting§! silently tore open the gap of causality, making it possible for the ants to break the cycle; but when §HThe Worm-in-Waiting§! transcended infinity, nothing could give It an answer.\n\nWhen the ants look forward to §HThe Worm-in-Waiting§!'s help, §HThe Worm-in-Waiting§! also looks forward to the ants' salvation."
 beyond_infinity.2506.a:0 "The ants are us, and we are the ants-great ants."
 beyond_infinity.2507.desc:0 "The \"universe\" where §HThe Worm-in-Waiting§! is located is exactly the boundary of the cycle, infinitely approaching the outside of the cycle but never being able to touch it.\n\n§HThe Worm-in-Waiting§! is the freest, and also the most unfree.\nIt can freely travel to any spacetime, any plane, any dimension, but It can never get rid of the cycle, because It itself is the cycle.\n\nOutside the cycle is another cycle. §HThe Worm-in-Waiting§! is also trapped in Its own cycle. We once gave It a meaning through Cosmogenesis. Now, it's Its turn to give us a meaning."
 beyond_infinity.2507.a:0 "This is our necessary path."
 beyond_infinity.2507.a.response:0 "It is also our destined path."
 
 beyond_infinity.2600.name:0 "Beyond Infinity"
 beyond_infinity.2600.desc:0 "§H[From.GetName]§! made further breakthroughs in their field, and we have learned that they are trying to create time."
 beyond_infinity.2600.a:0 "Playing tricks with time."
 
 # 三段
 beyond_infinity.3000.desc:0 "It seems that you are getting more and more adept at creating time, but this cycle's thirst for time is also increasing day by day."
 beyond_infinity.3000.a:0 "It seems difficult to meet the needs with our strength alone."
 beyond_infinity.3001.desc:0 "This relates to the way we create time.\n\nThe process of creating time is actually borrowing past time and future time, reshaping them into three parts of time with a unique transformation formula, returning two parts, and keeping the remaining part.\nBut for two moments with different distances from the End, the effect of time on delaying the End is different, although the difference is very subtle.\n\nTherefore, from borrowing time to returning time, the time difference existing during the period leads to a slight weakening of the delay effect, and the time threshold we need to delay the End also increases accordingly."
 beyond_infinity.3001.a:0 "Then how to solve this problem?"
 beyond_infinity.3002.desc:0 "This brings us to a phenomenon called §H\"Time Resonance\"§!.\n\nIf time and space are regarded as two mutually perpendicular coordinate axes, for all points with the same distance from the origin, their time coordinates and space coordinates will be inversely proportional.\nWhile maintaining the distance unchanged, adjusting the space coordinate will change the time coordinate accordingly.\nHowever, this coordinate system does not only have the first quadrant; it actually has four quadrants.\nIn different quadrants, there are actually two points with the same distance from the origin and the same space coordinate, and their corresponding time coordinates happen to be one positive and one negative.\n\nIf we forcibly merge these two points, their time coordinates will linearly superimpose to zero, but for the merged point to maintain consistency of distance from the origin, the absolute value of its space coordinate will increase.\nBut if this change in space coordinate exceeds the speed of light and there is not enough energy to maintain it, the point will instantly break and split into two points again, and the absolute value of their space coordinates will generally be larger than the original."
 beyond_infinity.3002.a:0 "Is the only difference from before the space coordinate?"
 beyond_infinity.3003.desc:0 "Of course not.\n\nI said before that the same space coordinate can correspond to two time coordinates. Therefore, after breaking, the time coordinates of the new two points may both be positive, or both be negative, and of course more likely to be one positive and one negative, depending mainly on the previous coupling method of the two points.\nThe two time points that were originally one positive and one negative suddenly possess the same sign after merging and splitting again. This is §HTime Resonance§!.\n\nThe §Y\"unique transformation formula\"§! I mentioned earlier is an application of Time Resonance."
 beyond_infinity.3003.a:0 "Uh, I don't understand what use it has..."
 beyond_infinity.3004.desc:0 "The example just now was two points with same space and opposite time. What if it's the other way around, same time and opposite space?\n\nLinear superposition of space leads to an increase in the absolute value of the time coordinate, but time is not limited by the speed of light, so only a small amount of energy is enough to maintain the transformation of the point.\nThe time coordinate of the newly generated point may be larger or smaller than the sum of the original two times, depending on the value of the original space coordinates.\nIn other words, if the space distance between the original two points is large, the time merged by this method will be larger than the sum of the original times, and time will §Y\"increase\"§!.\n\nThis is exactly another application of Time Resonance."
 beyond_infinity.3004.a:0 "Is our galaxy big enough?"
 beyond_infinity.3005.desc:0 "Barely enough to maintain positive time gain.\nIf we can contact extragalactic civilizations to participate, the effect will be better, but it is still somewhat difficult with our current technological level.\n\nHowever, relying only on Time Resonance between us and other nations in the galaxy is enough to cope with the threshold elevation caused by creating time."
 beyond_infinity.3005.a.imperial:0 "Then we need the participation of the Galactic Imperium."
 beyond_infinity.3005.a.galcom:0 "Then we need the participation of the Galactic Community."
 beyond_infinity.3005.a:0 "Then we need the participation of other nations."
 beyond_infinity.3006.desc.emperor:0 "As the Galactic Emperor, you only need to promulgate new laws and share your research on time, and your subjects will assist you and create time for you."
 beyond_infinity.3006.desc.imperial_member:0 "Unfortunately, the Galactic Imperium is ruled by another nation, and the Emperor may not allow you to exert your influence."
 beyond_infinity.3006.desc.not_imperial_member:0 "If you join the Galactic Imperium... no, even if you join, the Emperor of the Imperium may not allow you to exert your influence."
 beyond_infinity.3006.desc.custodian:0 "As the Galactic Custodian, you only need to promote new resolutions and share your research on time, and other member states will be happy to support you and create time for you."
 beyond_infinity.3006.desc.galcom_member:0 "If you can become the Galactic Custodian, maybe there is a way to promote resolutions and get support from other member states."
 beyond_infinity.3006.desc.not_galcom_member:0 "If you join the Galactic Community and become the Custodian, maybe there is a way to get support from other nations."
 beyond_infinity.3006.desc.no_galcom:0 "I don't have a good way to get other nations involved right now. It seems we have to rely on ourselves."
 beyond_infinity.3006.a:0 "Understood."
 
 beyond_infinity.3050.name:0 "Time Flows Like Water"
 beyond_infinity.3050.desc:0 "As our skills in creating time become more mature, our understanding of time and space has also reached a new height.\n\nPerhaps based on our epiphany of the essence of time, or perhaps due to the inevitable disturbance of time production, the whole world seems to have pressed the pause button for us. The flow of past and future of things is no longer inevitable."
 beyond_infinity.3050.a:0 "Let's \"fast forward\" a bit."
 beyond_infinity.3050.a.tooltip:0 "§YAll primary species gain the ['concept_trait_time'] trait§!"
 
 beyond_infinity.3100.desc:0 "This is really strange. Why did the §HProclamation of the End§! appear so early?"
 beyond_infinity.3100.a:0 "What exactly is the Proclamation of the End?"
 beyond_infinity.3101.desc:0 "§HProclamation of the End§! is a cosmic phenomenon of unknown origin. Its common form is the frequent appearance of certain space storms, and such space storms are often accompanied by a special Nightmare of the Plane.\n\nThis type of space storm possesses a weird characteristic-no matter from which angle observed, its rotation direction is completely consistent.\nHowever, precisely because of this, no matter where we are, we can correctly recognize their rotation direction.\n\nWe also name this type of storm \"§HProclamation of the End§!\" and divide it into \"§HLevorotation§!\" and \"§HDextrorotation§!\" according to its rotation direction.\nThe harms produced by the two types of storms are similar in most cases, but the §HLevorotation§! type storm causes greater interference to §YShields§!, while §HDextrorotation§! is more inclined to affect §YArmor§!.\n\nIn addition, the Nightmare of the Plane induced by the §HProclamation of the End§! space storm also differs due to the different rotation directions of the storm."
 beyond_infinity.3101.a:0 "What are the differences between these Nightmares of the Plane?"
 beyond_infinity.3102.desc:0 "Depending on the type of space storm, we also classified these two Nightmares of the Plane into \"§HLevorotation§!\" and \"§HDextrorotation§!\" and collectively refer to them as \"§HNightmare of the End§!\".\n\nActual combat tests show that the §HLevorotation§! type §HNightmare of the End§! does not possess any §YShields§!, and its weapons are basically composed of §YKinetic§!; while §HDextrorotation§! does not possess §YArmor§! and mainly attacks through §YEnergy§! weapons.\n\nIn addition, both §HNightmares of the End§! will cause serious impacts on the entire system, and all ships in the system will also withstand continuous unknown attacks. We call this system field \"§HLevorotation Field§!\" and \"§HDextrorotation Field§!\".\n\nMoreover, statistical data proves that §Ynewborn Black Holes§! in the galaxy will enhance the aggressiveness and resilience of §HNightmares of the End§!. Perhaps they can draw power from Black Holes."
 beyond_infinity.3102.a:0 "Do you know anything else about the Proclamation of the End?"
 beyond_infinity.3103.desc:0 "The §HProclamation of the End§! phenomenon is not limited to our material universe. In many observable planes such as \"§HThe Shroud§!\", \"§HHigh Dimension§!\", \"§HInverse Plane§!\", and worlds connected to us through Black Holes and Astral Rifts, §HProclamation of the End§! phenomena occur.\nOur future selves speculate that, similar to §HThe End§!, §HProclamation of the End§! is also a catastrophe for the entire cycle.\n\n§HProclamation of the End§! storm is a mysterious storm with no cause. Its energy and particles mainly come from Horrific Inverse Mass, but the storm is not directly connected to the §HInverse Plane§!.\nBesides Horrific Inverse Mass, there is also a small amount of Positive Phase matter with properties similar to Astral Threads in the storm, and for unknown reasons, it does not annihilate with Inverse Phase matter."
 beyond_infinity.3103.a:0 "What about the Nightmare of the End?"
 beyond_infinity.3104.desc:0 "§HNightmare of the End§! is also an Inverse Phase creature that is not born in the §HInverse Plane§!.\n\nSome speculate that §HNightmare of the End§!, like §HThe Worm-in-Waiting§!, originates from outside the cycle, but it has not been confirmed.\nIn addition, §HNightmare of the End§! will constantly affect the system it is in. If this process continues unimpeded for several months, everything in that system will be erased from time, with only the §HNightmare of the End§! spared.\n\nAlthough not known at the time, we later believed that there is an inevitable connection between the appearance of §HProclamation of the End§! and §HThe End§!.\nOr rather, just as its literal meaning implies, §HProclamation of the End§! is a harbinger of §HThe End§! ten thousand years in advance."
 beyond_infinity.3104.a:0 "Erased from time?"
 beyond_infinity.3104.a.response:0 "This is a phenomenon called §HFinal Erasure§!.\n\nWe do not know the principle of this phenomenon yet, but when it happens, all celestial bodies in the system will turn into Black Holes, and the history of that system will be forgotten by people in an instant.\nBut turning into a Black Hole is far from the most terrifying thing. What's more terrifying is becoming nothingness, becoming zero, becoming non-existent, and being completely abandoned by the cycle-this is everything that happens to other objects in the system."
 beyond_infinity.3104.b:0 "But aren't we still thirty thousand years away from the End?"
 beyond_infinity.3105.desc:0 "This is exactly why I am confused. I cannot give an accurate answer now, after all, this is not something that happened in the future.\n\nAlthough my personal experience is limited, if other cycles really exist, one of us in countless cycles will always know about this situation.\nHowever, we do not know how to establish contact with other cycles. Perhaps we can only continue to §Ycreate time§! and expect to get inspiration from it and find a new direction.\n\nBut the threat of §HProclamation of the End§! cannot be underestimated. I'm afraid we don't have much time left."
 beyond_infinity.3105.a:0 "We can only play it by ear."
 beyond_infinity.3105.a.response:0 "Don't worry, although the future is no longer set, this is the proof that we are gradually changing the future.\nI believe we will definitely find the light of life."
 
 beyond_infinity.3150.name:0 "End Disturbance"
 beyond_infinity.3150.desc:0 "With the appearance of the §HProclamation of the End§! storm, some strange disturbances appeared in this universe, such as-§Y[akx_star.GetName]§!.\n\nThe physical properties of this Black Hole closest to the Inverse Plane have undergone some strange changes, creating distinct phenomena with the slightest differences. Now, for us, it is no longer a bottomless pit that can only be entered but not exited. On the contrary, our body structure can fully adapt to this terrible abyss, as if it is welcoming us.\n\nWho is welcoming us?"
 beyond_infinity.3150.a:0 "Since it welcomes us, let us accept it."
 
 beyond_infinity.3160.name:0 "End Disturbance"
 beyond_infinity.3160.desc:0 "With the appearance of the §HProclamation of the End§! storm, some strange disturbances appeared in this universe, such as-§Y[situation_origin_time_planet.GetName]§!.\n\nThe physical properties of this homeworld we depend on for survival have undergone some strange changes, creating distinct phenomena with the slightest differences. The core deep in the horizon changes between expansion and contraction, as if giving us hints about the singularity.\n\nWho is giving us hints?"
 beyond_infinity.3160.a:0 "Since it hints to us, let us accept it."
 
 beyond_infinity.3170.name:0 "Colonizing Horizon"
 beyond_infinity.3170.desc:0 "When we completed the colonization of §Y[root.GetName]§!, we finally understood the meaning of this change.\n\nThis Black Hole is naturally built for us. We can unleash our full potential in it, even control over spacetime. If we call all this a metamorphosis, then this is the origin of our metamorphosis."
 beyond_infinity.3170.a:0 "Perhaps a gift from Mother."
 
 beyond_infinity.3600.name:0 "Beyond Infinity"
 beyond_infinity.3600.desc:0 "§H[From.GetName]§!'s technology for creating time is becoming increasingly proficient. They are no longer satisfied with their own territory, but set their sights on the entire sea of stars."
 beyond_infinity.3600.a:0 "Peace, or war?"
 
 # 四段
 beyond_infinity.4000.desc:0 "Finally, we accumulated enough time. Although it cannot directly solve the urgent matter, it gives us a chance to give it a shot."
 beyond_infinity.4000.a:0 "Chance?"
 beyond_infinity.4001.desc:0 "Along the way, I have been thinking, can we really resist the destined End of the cycle with our strength alone?\n\nWe made many arduous efforts for this in the future, but we failed to succeed.\nDue to various coincidences, I returned to the present, intending to use future experience as a springboard for our progress, but encountered unexpected difficulties.\n\nI began to suspect that it is impossible for us to solve all problems."
 beyond_infinity.4001.a:0 "Are you asking us to give up?"
 beyond_infinity.4002.desc:0 "Of course not, how could we give up at this point.\n\nI mean, our strength is limited, and limited strength cannot contend with the infinite End.\nBut think about it, what is infinite?\n\n§HThe Cycle§!.\n\nSince the cycle is infinite, and there are infinite us in the infinite cycles, then as long as infinite us join hands, perhaps there is a chance to stop the infinite End."
 beyond_infinity.4002.a:0 "But do other cycles really exist?"
 beyond_infinity.4003.desc:0 "As I said at the beginning, we cannot prove that other cycles really exist, but I always believe this.\n\nI have an unrealistic idea. If we pile up the time we have produced so far at one point and rely on my ability to make it form a stable spacetime singularity, maybe there is a chance to transmit messages to other cycles.\n\nOf course, I am not 100% sure that this is feasible.\nOnce it fails, all our previous efforts will be wasted. And even if it succeeds, other cycles may not be able to give us help.\n\nSo, this is just our chance to give it a shot, but the decision is still yours."
 beyond_infinity.4003.materialist:0 "Since the success rate is not zero, it is worth a try."
 beyond_infinity.4003.spiritualist:0 "We just need to believe in ourselves and turn the impossible into possible."
 beyond_infinity.4003.militarist:0 "There is no turning back, give it a shot."
 beyond_infinity.4003.pacifist:0 "We cannot sit and wait for death, we have to do this."
 beyond_infinity.4003.xenophile:0 "We will definitely be able to contact another cycle, just like you contacted us initially."
 beyond_infinity.4003.xenophobe:0 "Those in another cycle are also \"us\", \"we\" will definitely provide help."
 beyond_infinity.4003.egalitarian:0 "Let us listen to the voice of the people-the approval rate is 100%."
 beyond_infinity.4003.authoritarian:0 "I have decided, do as you say."
 beyond_infinity.4003.hive_mind:0 "Worker drones will provide you with all support."
 beyond_infinity.4003.machine_intelligence:0 "Drones are ready, operation begins."
 beyond_infinity.4003.other:0 "No need to say more, get ready."
 beyond_infinity.4003.response:0 "Thank you very much for your support and trust. Let us start this gamble with fate."
 
 beyond_infinity.4100.name:0 "$BEYOND_INFINITY_GAMBLING_PHYSICS_PROJECT$"
 beyond_infinity.4100.desc:0 "Our scheduling of time was very successful, and the Dimension Traveler has also used her ability to induce a spacetime singularity."
 beyond_infinity.4100.a:0 "Proceed to the next step."
 beyond_infinity.4200.name:0 "$BEYOND_INFINITY_GAMBLING_SOCIETY_PROJECT$"
 beyond_infinity.4200.desc:0 "Although we cannot determine whether the singularity penetrated the cycle, it indeed connected with a certain plane, only the connection is still weak and unstable."
 beyond_infinity.4200.a:0 "Try to stabilize the singularity."
 beyond_infinity.4300.name:0 "$BEYOND_INFINITY_GAMBLING_ENGINEERING_PROJECT$"
 beyond_infinity.4300.desc:0 "We have maintained the singularity in a stable state. Although it cannot transport large particles, audio signals can still be transmitted normally."
 beyond_infinity.4300.a:0 "Send a distress message, wait for contact."
 
 BEYOND_INFINITY_UNKNOWN:0 "Beyond the Singularity"
 beyond_infinity.name.unknown:0 "Unknown"
 BEYOND_INFINITY_ANOTHER_CYCLE:0 "Another Cycle"
 beyond_infinity.name.another_cycle:0 "Another Dimension Traveler"
 beyond_infinity.4400.desc:0 "Contact again... really great...\n\nHello? Can you hear me? Is the communication normal?\n\n§Y<The other party's voice seems familiar.>§!"
 beyond_infinity.4400.a:0 "I can hear you. Who are you?"
 beyond_infinity.4401.desc:0 "Didn't you recognize my voice?\n\nI am the §HDimension Traveler§!-of course, for you, the Dimension Traveler of another cycle.\nAlthough us in different cycles may not experience the same things, I can roughly guess what happened to you."
 beyond_infinity.4401.a:0 "We were attacked by the Proclamation of the End."
 beyond_infinity.4402.desc:0 "If I guess correctly, the §HProclamation of the End§! in your cycle also appeared in advance.\n\nAnalyzing based on the intelligence we obtained from other cycles including you, the early appearance of the §HProclamation of the End§! has a reason-§HTranscending Causality§!."
 beyond_infinity.4402.a:0 "Transcending Causality?"
 beyond_infinity.4403.desc:0 "With the secret help of §HThe Worm-in-Waiting§!, you saved me in your cycle-§HDimension Traveler§!-from the White Hole.\nBut this process caused a potential impact on the operation of the cycle, and due to the catalysis and amplification of a series of factors, it finally led to the early appearance of §HProclamation of the End§! and even §HThe End§!.\n\nIn a sense, this matter is the inevitability of our §HBeyond Infinity§!. Perhaps it can be understood as \"§HSelf-protection of the Cycle§!\"."
 beyond_infinity.4403.a:0 "Self-protection of the Cycle?"
 beyond_infinity.4404.desc:0 "Perhaps even §HThe Worm-in-Waiting§! Itself does not understand how powerful Its attraction-or rather, love-is.\n\nIn the countless cycles §HThe Worm-in-Waiting§! has experienced, It has long formed Its own conventions over time.\nOnce the cycle changes and differs from Its conventions, the cycle will spontaneously adjust to meet §HThe Worm-in-Waiting§!'s expectations.\nBut if this difference is so large that adjustment alone cannot correct it, the cycle will end prematurely and usher in the next new beginning.\n\nMaybe this is the reason for the formation of §HThe End§!."
 beyond_infinity.4404.a:0 "Even if this difference appeared due to The Worm-in-Waiting's will?"
 beyond_infinity.4405.desc:0 "Indeed so, because §HThe Worm-in-Waiting§!'s morbid attraction even imprisoned §HThe Worm-in-Waiting§! Itself.\n\n§HThe Cycle§! is §HThe Worm-in-Waiting§!, §HThe Worm-in-Waiting§! is §HThe Cycle§!.\nIt has no beginning, It has no end.\nIt cannot reject Itself, It cannot disobey Itself.\nIt cannot find Its own meaning, It does not let Itself find Its own meaning, because §HThe Cycle§! has no meaning.\n\n§HThe Worm-in-Waiting§! loves us too much, It loves us so much that It is reluctant to let us go.\n§HThe Worm-in-Waiting§! loves us too much, It loves us so much that It cannot bear to imprison us.\nPrecisely because of this, we have to face the dilemma of §HThe End§!.\nPrecisely because of this, we gained the opportunity of §HBeyond Infinity§!."
 beyond_infinity.4405.a:0 "...What should we do?"
 beyond_infinity.4406.desc:0 "Indeed, let's talk about §HThe Worm-in-Waiting§! and §HThe End§! later. How to solve the §HProclamation of the End§! is your urgent task.\n\nJust right, during our conversation, the necessary information has been transmitted to you.\nYou just need to interfere with the black hole singularity according to the method we gave, and you can make the system where the black hole is located immune to the influence of §HProclamation of the End§!.\n\nAfter you §HSeal§! all systems §RErased§! by §HProclamation of the End§!, contact us again to discuss the next specific actions."
 beyond_infinity.4406.a:0 "Understood, thank you very much."
 beyond_infinity.4406.a.response:0 "§Y<We can now perform ['concept_dimensional_horror_crisis_seal_yellow'].>§!"
 beyond_infinity.4406.b:0 "Actually, no system has been erased by the Proclamation of the End."
 
 beyond_infinity.4450.name:0 "Cycle Resonance"
 beyond_infinity.4450.desc:0 "The intertwining between two cycles is not superficial. When the eternal barrier is broken, the fates of the two have long been bound.\n\nAlthough we don't understand what happened, the change from another cycle transformed the core of §Y[akx_star.GetName]§! like a projection, and our scientists discovered deeper secrets of the Black Hole because of this."
 beyond_infinity.4450.a:0 "Perhaps it is not just these two cycles that resonate."
 
 beyond_infinity.4460.name:0 "Cycle Resonance"
 beyond_infinity.4460.desc:0 "The intertwining between two cycles is not superficial. When the eternal barrier is broken, the fates of the two have long been bound.\n\nAlthough we don't understand what happened, the change from another cycle changed the radius of the horizon like a projection, and our scientists mastered the knack of singularity compression because of this."
 beyond_infinity.4460.a:0 "Perhaps it is not just these two cycles that resonate."
 beyond_infinity.4460.a.tooltip:0 "$situation_origin_time$ Monthly Progress: §G+100%§!"
 
 beyond_infinity.4500.desc:0 "We received your contact. It seems you have successfully completed the §HSeal§! task.\nI have to say, your completion speed is fast, at least faster than the cycle we are in."
 beyond_infinity.4500.desc.special:0 "What, you actually solved every §HNightmare of the End§! in time, ensuring that no system suffered §HFinal Erasure§!?\n\nThis is simply unbelievable. Your action efficiency is too high!"
 beyond_infinity.4500.a:0 "Then what should we do next?"
 beyond_infinity.4501.desc:0 "Don't worry, the biggest threat of §HProclamation of the End§! has been removed by you. Surviving this catastrophe is only a matter of time.\n\nI think your §HDimension Traveler§! has already told you about this-§HProclamation of the End§! is a harbinger of §HThe End§! ten thousand years in advance.\nAlthough there is a way to solve §HProclamation of the End§!, the crisis of §HThe End§! is something even we cannot resist.\n\nFor this, we need your help. But in other words, you also need our help."
 beyond_infinity.4501.a:0 "Help?"
 beyond_infinity.4502.desc:0 "Have you heard such a fairy tale?\n\nOnce there was an emperor, he asked his minister: §C\"How many seconds are there in eternity?\"§!\n\nThe minister said: §C\"There is such a Black Hole, it takes a year to pass through it, and a year to go around it.\"§!\n\n§C\"Every hundred years, a spaceship comes and draws radiation from the Black Hole at the edge of the horizon.\"§!\n\n§C\"When this Black Hole evaporates completely, one second has passed in eternity.\"§!"
 beyond_infinity.4502.a:0 "What does this mean? I don't understand."
 beyond_infinity.4503.desc:0 "I think I understand. Let me explain.\n\nFirst, we need to clarify a fact-there are multiple cycles, not two or three, but infinitely many.\nAlthough not all of us in cycles have embarked on the path of §HBeyond Infinity§!, at least we are not alone.\n\nAs I said before, we are finite, the End is infinite. Finite us cannot withstand the infinite End alone.\nBut the cycle is also infinite. Rather, it is the infinite §HCycles§! that led to the infinite §HEnd§!."
 beyond_infinity.4503.a:0 "So..."
 beyond_infinity.4504.desc:0 "Considering our initial conjecture: the time we create can delay the End in all cycles, that is, raise the threshold.\n\nPractice shows that our effect on raising the threshold is very limited, but what if all of us in all cycles create time together?\nIf we can unite all cycles and make all of us participate in delaying the End, then within the time we create, even a Black Hole might evaporate completely.\n\n§YIn other words, we will use infinite eternity to surpass eternal infinity.§!"
 beyond_infinity.4504.a:0 "Infinite us can defeat the infinite End."
 beyond_infinity.4505.desc:0 "For us, cycles exist in sequence.\nBut viewed from outside the cycle, all cycles run in parallel.\n\nRules cannot be broken within the rules, but it is easy outside the rules.\nThere must be something you can do, and only you can do.\n\nJust like you saved me from the White Hole."
 beyond_infinity.4505.a:0 "I understand."
 beyond_infinity.4505.a.tooltip:0 "§H\"Documents/Paradox Interactive/Stellaris/logs/game.log\"§!"
 
 beyond_infinity.4600.name:0 "Beyond Infinity"
 beyond_infinity.4600.desc:0 "§H[From.GetName]§!'s reckless actions invited a terrible crisis, but they seem to have no solution."
 beyond_infinity.4600.a:0 "They had better be thinking of a solution, not escaping."
 
 beyond_infinity.4650.desc:0 "With the help of another cycle, §H[From.owner.GetName]§! successfully sealed §Y[dimensional_horror_crisis_sealed_system.GetName]§! in the river of time.\nNow, all systems suffering from Final Erasure have been successfully sealed. We don't know how long this can last, we can only pray that the harm of ['concept_dimensional_horror_crisis_storm'] will weaken from now on."
 
 beyond_infinity.4700.name:0 "$concept_dimensional_horror_crisis_seal$"
 beyond_infinity.4700.desc:0 "The existence from the abyss noticed the crisis we are in. He sent us a message that does not belong to this world.\n\nHe seems to share the same pain with us."
 beyond_infinity.4700.a:0 "We must also do something."
 
 beyond_infinity.33333.name:0 "From Another World"
 beyond_infinity.33333.desc:0 "You opened the barrier between various cycles, although only for an instant.\n\nCountless you in countless cycles, maybe know you, maybe don't know you, maybe just took the first step, maybe approaching the final moment, but all sent their blessings in this short instant.\n\nThis is the help from infinite cycles of the past and future."
 beyond_infinity.33333.a:0 "Only infinity can surpass infinity, only cycle can surpass cycle."
 
 # 五段
 beyond_infinity.5000.desc:0 "With the help of countless other cycles, we accumulated enough time and successfully delayed §HThe End§! to §Y32,768§! years later.\n\nNow, it's our turn to do something for other cycles."
 beyond_infinity.5000.a:0 "Has the End been delayed?"
 beyond_infinity.5000.a.response:0 "Yes, the moment countless time flowed into this cycle, the End that was originally close at hand became far away. We gained more time to breathe."
 beyond_infinity.5000.b:0 "What about the Proclamation of the End?"
 beyond_infinity.5000.b.response:0 "Although the threat of the Proclamation of the End cannot be underestimated, we have mastered the ability to seal. Even if it is powerful, it cannot shake us a bit."
 beyond_infinity.5000.c:0 "What can we do?"
 beyond_infinity.5001.desc.prefix:0 "Do you still remember how we came to this cycle?\n\nNot only information can penetrate the cycle. With certain methods, we can transmit some matter and even life to other cycles.\nUnder the operation of "
 beyond_infinity.5001.desc.suffix:0 ", we arrived at this current cycle from the original cycle, so naturally we can also go to another cycle based on the same principle.\n\nAlthough I didn't cross the cycle with you, don't ask me how I know-it's a secret~"
 beyond_infinity.5001.desc.time_machine:0 "$beyond_infinity.5001.desc.prefix$['concept_building_time_machine']$beyond_infinity.5001.desc.suffix$"
 beyond_infinity.5001.desc.circle_nexus:0 "$beyond_infinity.5001.desc.prefix$['concept_building_circle_nexus']$beyond_infinity.5001.desc.suffix$"
 beyond_infinity.5001.desc.dimension_engine:0 "$beyond_infinity.5001.desc.prefix$['concept_building_dimension_engine']$beyond_infinity.5001.desc.suffix$"
 beyond_infinity.5001.desc.normal:0 "That is naturally interfering with other cycles and helping other us tide over difficulties.\n\nSome cycles transmitted some technical data while sending time.\nThese data show that not only information can penetrate the cycle. With certain methods, we can transmit some matter and even life to other cycles.\n\nTherefore, what we need to do next is try to reproduce these technologies and test to what extent they can interfere with other cycles."
 beyond_infinity.5001.civic:0 "I remembered."
 beyond_infinity.5001.normal:0 "Then let's try it."
 beyond_infinity.5002.desc.civic:0 "Since we already have experience, the next attempt will be much smoother.\n\n['concept_building_time_machine'] allows us to reach different spacetimes to welcome a new beginning.\n['concept_building_circle_nexus'] allows us to directly interfere with another loop, letting everything proceed in the right direction.\n['concept_building_dimension_engine'] allows us to establish anchors in other planes, making it possible for all dimensions to merge into one.\n\nThis time, why don't we choose one of the other two as the main direction."
 beyond_infinity.5002.desc.normal:0 "Reproducing these technologies consumes a lot of manpower and material resources. To ensure the accuracy and safety of the experiment, we'd better choose one of them as the main breakthrough direction.\n\n['concept_building_time_machine'] allows us to reach different spacetimes to welcome a new beginning.\n['concept_building_circle_nexus'] allows us to directly interfere with another loop, letting everything proceed in the right direction.\n['concept_building_dimension_engine'] allows us to establish anchors in other planes, making it possible for all dimensions to merge into one.\n\nI believe that no matter which one we choose as the main direction, it can lead to a successful result. After all, there are still many cycles, and other us will also choose different plans to try."
 beyond_infinity.5002.time_machine:0 "Time Machine? Sounds really sci-fi."
 beyond_infinity.5002.circle_nexus:0 "Loop Nexus? Feels indispensable."
 beyond_infinity.5002.dimension_engine:0 "Dimensional Engine? Seems to be able to control everything."
 beyond_infinity.5002.response:0 "For countless us, and for ourselves, guide us in all cycles to the path of Beyond Infinity."
 
 beyond_infinity.5010.name:0 "$building_time_machine$"
 beyond_infinity.5010.desc:0 "After some calculations and tests, we successfully built a prototype of ['concept_building_time_machine'] on the capital.\nAlthough its feasibility cannot be confirmed yet, and experiments so far have mostly ended in failure, subsequent construction on it is still a very valuable attempt."
 beyond_infinity.5010.a:0 "Let us open the door of destiny."
 beyond_infinity.5010.a.tooltip:0 "If the capital building slots are full, demolish any building and build any building to automatically obtain §Y£building£$building_ruin_time_machine$§!"
 beyond_infinity.5020.name:0 "$building_circle_nexus$"
 beyond_infinity.5020.desc:0 "After some calculations and tests, we successfully built a prototype of ['concept_building_circle_nexus'] on the capital.\nAlthough its feasibility cannot be confirmed yet, and experiments so far have mostly ended in failure, subsequent construction on it is still a very valuable attempt."
 beyond_infinity.5020.a:0 "Let us open the door of destiny."
 beyond_infinity.5020.a.tooltip:0 "If the capital building slots are full, demolish any building and build any building to automatically obtain §Y£building£$building_ruin_circle_nexus$§!"
 beyond_infinity.5030.name:0 "$building_dimension_engine$"
 beyond_infinity.5030.desc:0 "After some calculations and tests, we successfully built a prototype of ['concept_building_dimension_engine'] on the capital.\nAlthough its feasibility cannot be confirmed yet, and experiments so far have mostly ended in failure, subsequent construction on it is still a very valuable attempt."
 beyond_infinity.5030.a:0 "Let us open the door of destiny."
 beyond_infinity.5030.a.tooltip:0 "If the capital building slots are full, demolish any building and build any building to automatically obtain §Y£building£$building_ruin_dimension_engine$§!"
 
 beyond_infinity.5100.name:0 "$building_infinity_time_machine$"
 beyond_infinity.5100.desc.civic:0 "The $building_infinity_time_machine$ on §Y[Root.GetName]§! roared.\n\nAfter a series of adjustments and tests, transmitting matter and even life across cycles proved feasible.\nOf course, we already knew that."
 beyond_infinity.5100.desc:0 "The $building_infinity_time_machine$ on §Y[Root.GetName]§! roared.\n\nAfter a series of adjustments and tests, transmitting matter and even life across cycles proved feasible.\nNow, infinite possibilities are displayed before us without reservation."
 beyond_infinity.5100.a:0 "This is our first step to Beyond Infinity, but definitely not the last step."
 beyond_infinity.5200.name:0 "$building_infinity_circle_nexus$"
 beyond_infinity.5200.desc.civic:0 "The $building_infinity_circle_nexus$ on §Y[Root.GetName]§! roared.\n\nAfter a series of adjustments and tests, transmitting matter and even life across cycles proved feasible.\nOf course, we already knew that."
 beyond_infinity.5200.desc:0 "The $building_infinity_circle_nexus$ on §Y[Root.GetName]§! roared.\n\nAfter a series of adjustments and tests, transmitting matter and even life across cycles proved feasible.\nNow, infinite possibilities are displayed before us without reservation."
 beyond_infinity.5200.a:0 "This is our first step to Beyond Infinity, but definitely not the last step."
 beyond_infinity.5300.name:0 "$building_infinity_dimension_engine$"
 beyond_infinity.5300.desc.civic:0 "The $building_infinity_dimension_engine$ on §Y[Root.GetName]§! roared.\n\nAfter a series of adjustments and tests, transmitting matter and even life across cycles proved feasible.\nOf course, we already knew that."
 beyond_infinity.5300.desc:0 "The $building_infinity_dimension_engine$ on §Y[Root.GetName]§! roared.\n\nAfter a series of adjustments and tests, transmitting matter and even life across cycles proved feasible.\nNow, infinite possibilities are displayed before us without reservation."
 beyond_infinity.5300.a:0 "This is our first step to Beyond Infinity, but definitely not the last step."
 
 beyond_infinity.5400.desc:0 "Our mission in this cycle is about to be completed, but before leaving here, we have one last thing we must do."
 beyond_infinity.5400.a:0 "Last thing?"
 beyond_infinity.5401.desc:0 "Previously, because our technological level was insufficient to cope with the early arrival of §HProclamation of the End§!, we chose to ask for help from other cycles and obtained the knowledge of §HSeal of the End§! in advance.\n\nNow, the §HProclamation of the End§! in our galaxy is nearing its end, but §HProclamation of the End§! in other galaxies is still raging. We should not abandon other civilizations."
 beyond_infinity.5401.a:0 "But how should we interfere with other galaxies?"
 beyond_infinity.5402.desc:0 "The most direct way is to go directly to other galaxies and perform §HSeal of the End§!, but this is whimsical for our current technology.\n\nHowever, when the cycles were briefly connected before, with the infusion of time, §HProclamation of the End§! was also gradually attracted to our vicinity.\nThis unprecedentedly powerful storm is converging, gathering, condensing in our galaxy, and slowly shaping into an unprecedented §HNightmare of the End§!.\n\nI also know nothing about It, after all, this is something our future selves have never experienced.\nBut I can feel an unfathomable fear from It, a pain originating from the essence of the universe.\nPerhaps It is a counterattack from §HThe Cycle§!, perhaps It is a test from §HThe Worm-in-Waiting§!, everything is unknown.\n\nAt least, this is the final epilogue."
 beyond_infinity.5402.a:0 "Let us bring down the curtain for the Proclamation of the End."
 beyond_infinity.5402.a.tooltip:0 "§R$NAME_Dimensional_Horror_Crisis_Destiny$ will appear in the §Y$NAME_Dimensional_Horror_Crisis_Destiny_System$§! system!§!"
 
 BEYOND_INFINITY_WORM:0 "[akx_star.GetName]"
 beyond_infinity.name.worm:0 "\"Loving Mother\""
 beyond_infinity.5410.desc:0 "I am cause, I am effect.\nI am beginning, I am end.\nI am past, I am future.\nI am all, I am void."
 beyond_infinity.5410.a:0 "This is...?"
 beyond_infinity.5411.desc:0 "I am love, I am hate.\nI am force, I am field.\nI am time, I am space.\nI am god, I am sinner."
 beyond_infinity.5411.a:0 "......"
 beyond_infinity.5412.desc:0 "This sinful cycle started because of me, this twisted causality ends by you.\n\nFor you, the end of Beyond Infinity is far away;\nFor me, the epilogue of breaking free from shackles is close at hand.\n\nAt the moment of parting, let me leave the last love for every reincarnation.\nMay we reunite outside the loop."
 beyond_infinity.5412.a:0 "Farewell, \"Mother\"."
 
 beyond_infinity.5500.desc:0 "Don't relax your vigilance yet. Although we defeated $NAME_Dimensional_Horror_Crisis_Destiny$, the energy of §HProclamation of the End§! is still gathering in place.\n\nBut don't worry. It will probably take hundreds of years to form such a terrible monster again, and this is enough for us to resolve this crisis."
 beyond_infinity.5500.a:0 "How should we solve it?"
 beyond_infinity.5501.desc:0 "Now, although the energies of §HProclamation of the End§! are gathering towards the same place, they are individually very weak.\nWe just need to take the opportunity to apply a large amount of time to form an incompatibility effect, and we can delay them to thousands or even tens of thousands of years later like delaying the End.\n\nOf course, this cannot completely solve §HProclamation of the End§!.\nAlthough it is a bit irresponsible to say so, I believe that with our current experience, our future selves will definitely be able to defeat §HProclamation of the End§! again."
 beyond_infinity.5501.a:0 "I always feel this is just an appeasement policy."
 beyond_infinity.5502.desc:0 "I have no choice in this matter. After all, among all cycles we communicated with, none of us found a way to completely solve it.\nBut...\n\nNo, forget it, nothing.\nNo time to lose, let's act quickly."
 beyond_infinity.5502.a:0 "Then leave it to you."
 
 beyond_infinity.5600.name:0 "Beyond Infinity"
 beyond_infinity.5600.desc:0 "Strong time fluctuations appeared in §H[From.GetName]§! territory. What on earth do they want to do?"
 beyond_infinity.5600.a:0 "This is far beyond what we can interfere with."
 
 beyond_infinity.5700.name:0 "Striding Across Fate"
 beyond_infinity.5700.desc:0 "We... succeeded.\n\nAlthough this was expected, but... we succeeded.\nAlthough we looked forward to this day every moment, but... we succeeded.\nI even questioned our ability at one point, but in the end... we succeeded.\n\nThis is far from the end of everything. This is just the beginning of our resistance against the End.\nHowever, we successfully took this small step. Presumably, our future can also successfully take a big step like now."
 beyond_infinity.5700.a:0 "Let us stride across fate."
 beyond_infinity.5700.a.tooltip:0 "§GAll countries win this game.§!"
 
 beyond_infinity.5800.desc:0 "§H[beyond_infinity_country.GetName]§! eliminated §HProclamation of the End§! through unique technology, at least they claim so.\n\nBut what is certain is that now, all traces of §HProclamation of the End§! disappeared instantly, as if it never existed.\nHowever, the mottled galaxy map is still warning us of the tragicness of this crisis.\n\nIn any case, we can finally put an end to everything-with everyone."
 
 beyond_infinity.6000.desc:0 "Our mission in this cycle has been completely fulfilled, but our distance is a vaster endless cycle."
 beyond_infinity.6000.a:0 "How should we go to another cycle?"
 beyond_infinity.6001.desc.prefix:0 "For us within this cycle, it's simple.\nJust start the device, and we can transmit matter and even life to other cycles.\n\nFor §Hyou§! outside the cycle, it is equally simple.\nRemember these words, you will need them:\n"
 beyond_infinity.6001.desc.suffix:0 "\n\nYou will lead trustworthy subjects to other cycles that still need help. As for the destination, it's up to you."
 beyond_infinity.6001.desc.time_machine:0 "$beyond_infinity.6001.desc.prefix$['concept_civic_time_machine',civic_time_machine]\n['concept_civic_time_machine_corporate',civic_time_machine_corporate]\n['concept_civic_time_machine_hive',civic_time_machine_hive]\n['concept_civic_time_machine_machine',civic_time_machine_machine]$beyond_infinity.6001.desc.suffix$"
