 horror.16.name: "Repel Nightmare of the Plane"
 horror.16.desc: ""
 horror.16.hint: "Nightmares of the Plane often haunt ['concept_sc_black_hole'], possess extremely high combat capability and regeneration ability, and possess certain stealth detection capabilities.\nThe weapons of Nightmares of the Plane come with certain penetration capabilities and confusion functions, and the skin also provides a high level of hardening. In addition, its disturbance to the plane can cause damage to all ships in the system simultaneously."
 horror.16.lore: "§L\"This is not where you should come, the Black Hole is your eternal home.\"§!"
 horror.16.req: "Repelled a Nightmare of the Plane"
 horror.16.fail: "£trigger_no£$horror.16.req$"
 horror.16.success: "£trigger_yes£$horror.16.req$"
