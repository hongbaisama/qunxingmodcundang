l_english:
 horror.1.name: "Survey Black Hole"
 horror.1.desc: ""
 horror.1.hint: "Dispatch a £science_ship£['concept_science_ship'] to survey a Black Hole. Black Holes are often the central stars of ['concept_sc_black_hole']."
 horror.1.lore: "§L\"Black holes are arguably the most attractive celestial bodies in the universe-physically attractive.\"§!"
 horror.1.req: "Surveyed a Black Hole"
 horror.1.fail: "£trigger_no£$horror.1.req$"
 horror.1.success: "£trigger_yes£$horror.1.req$"
 MESSAGE_HORROR_FOCUS_1_COMPLETED_DESC: "$MESSAGE_EXPLORATION_FOCUS_COMPLETED_DESC$\n§YWe have begun to take an interest in Black Holes§!"
 
 horror.2.name: "Discover 3 Black Hole Systems"
 horror.2.desc: ""
 horror.2.hint: "Dispatch a £science_ship£['concept_science_ship'] to find Black Holes in the galaxy. ['concept_sc_black_hole'] often have unique icons on the galaxy map."
 horror.2.lore: "§L\"Do you believe Black Holes can talk? It is said that as long as you shuttle back and forth between two Black Hole systems, you can receive love poems from the Black Hole.\"§!"
 horror.2.req: "Discovered 3 Black Hole systems"
 horror.2.fail: "£trigger_no£$horror.2.req$"
 horror.2.success: "£trigger_yes£$horror.2.req$"
 MESSAGE_HORROR_FOCUS_2_COMPLETED_DESC: "$MESSAGE_EXPLORATION_FOCUS_COMPLETED_DESC$\n§YWe seem to sense Inverse Phase existence§!"
 
 horror.3.name: "Contact Inverse Phase Existence"
 horror.3.desc: ""
 horror.3.hint: "Nightmares of the Plane often haunt ['concept_sc_black_hole'], but they are powerful and dangerous Inverse Phase existences, and possess certain stealth detection capabilities."
 horror.3.lore: "§L\"I used to be an explorer like you, until my ship took a shot.\"§!"
 horror.3.req: "Contacted Inverse Phase existence"
 horror.3.fail: "£trigger_no£$horror.3.req$"
 horror.3.success: "£trigger_yes£$horror.3.req$"
 MESSAGE_HORROR_FOCUS_3_COMPLETED_DESC: "$MESSAGE_EXPLORATION_FOCUS_COMPLETED_DESC$\nGain Research Option:\n£physics£§Y$tech_mine_dark_matter$§!"
 
 horror.4.name: "Own 25 Dark Matter"
 horror.4.desc: ""
 horror.4.hint: "To obtain $r_dark_matter$, you can build £science_ship£['concept_research_stations'] around ['concept_celestial_objects'] with Dark Matter resources, and Dark Matter resources are common in Black Holes.\n\nAlternatively, you can also purchase $r_dark_matter$ on the £market£['concept_market'] or from other ['concept_empires'].$focus_other$"
 horror.4.lore: "§L\"I can hear it, but I can't see it;\nI can smell it, but I can't taste it;\nI can feel it, but I can't touch it.\"§!"
 horror.4.req: "Owned 25 Dark Matter"
 horror.4.fail: "£trigger_no£$horror.4.req$"
 horror.4.success: "£trigger_yes£$horror.4.req$"
 MESSAGE_HORROR_FOCUS_4_COMPLETED_DESC: "$MESSAGE_DEVELOPMENT_FOCUS_COMPLETED_DESC$\n§YIt's time to open the door personally§!"
 
 time_focus.10.name: "Open the Door to Inverse Phase"
 time_focus.10.desc.1: "The Inverse Phase is whispering, it seems something is luring us astray.\nThe road ahead is foggy, but everything just needs a gentle push."
 time_focus.10.desc.2: "The Inverse Phase is whispering, it seems something is luring us deep into the fog.\nThe road ahead is intricate, but everything just needs a gentle push."
 time_focus.10.a: "Our purpose is to study it."
 time_focus.10.b: "Our mission is to accept it."
 time_focus.10.tooltip: "§RCurrent choice will determine the subsequent route§!"
 
