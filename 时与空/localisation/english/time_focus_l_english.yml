 horror.15.name: "Build Inverse Phase Armed Ships"
 horror.15.desc: ""
 horror.15.hint: "In the $fleet_management_view_tab_ship_designer$ tab of £interface£['concept_fleet_management_view'], design a ship equipped with Inverse Phase weapons such as §Y$HORROR_BEAM$§! or §Y$HORROR_ACCELERATOR$§!, and build it in ['concept_shipyard']."
 horror.15.lore: "§L\"If gravity is desire, then our desire can even swallow the black hole itself.\"§!"
 horror.15.req: "Built ship equipped with any Inverse Phase weapon"
