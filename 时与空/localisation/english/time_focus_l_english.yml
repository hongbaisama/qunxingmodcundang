 horror.14.name: "Research Inverse Phase Protection Components"
 horror.14.desc: ""
 horror.14.hint: "In the £interface£['concept_technology_view'] interface, find and research £physics£§Y$tech_horror_shield$§! and £engineering£§Y$tech_horror_armor$§! technologies, they are both §HRare Technologies§! belonging to ['concept_horror_time'] category."
 horror.14.lore: "§L\"Although not 100% certain, our ship hull is comparable to the skin of Inverse Phase beings.\"§!"
 horror.14.req: "Researched £physics£§Y$tech_horror_shield$§! and £engineering£§Y$tech_horror_armor$§! technologies"
