l_english:
 swarm_crisis.0.name:0 "Scourge Warning: §RSource§!"
 swarm_crisis.0.desc:0 "Detected a country using §RScourge Warning§! origin (Prethoryn Scourge appears early) in this game.\n\nIf you do not want it to take effect, please choose to disable this origin (the country will not trigger origin events and will switch to §YProsperous Unification§! origin)."
 swarm_crisis.0.a:0 "§REnable this origin.§!"
 swarm_crisis.0.b:0 "§GDisable this origin.§!"
 swarm_crisis.1.name:0 "Scourge Warning: §RBroadcast§!"
 swarm_crisis.1.desc:0 "Finally arrived at the new home.\n\nThe technologies carried on our spaceship should be enough to cope with our current situation, but how to develop in the future is still a problem. Now, we temporarily don't have to be tired from the exile journey, but the appearance of those terrible creatures still lingers in our minds. If everything they said is true, then maybe they will come here soon and devour everything with their bloody mouths.\n\nThe Prethoryn Scourge's troops are too strong. I'm afraid it's hard to resist with our own strength alone. Perhaps we should broadcast the invasion of the insect plague to the entire universe, so there can be a glimmer of hope."
 swarm_crisis.1.a:0 "Start broadcasting!"
 swarm_crisis.2.name:0 "Scourge Warning: §RRecall§!"
 swarm_crisis.2.desc:0 "In the blink of an eye, we have lived in the new home for several years.\n\nJudging from the current situation, people's lives are fairly comfortable, but we cannot forget the crisis brought by the Prethoryn Scourge. According to the latest report, our Science Officer recalled some past technologies, which might help us achieve technological breakthroughs quickly.\n\nAlthough we have broadcast to the entire galaxy, the empires in the galaxy do not seem to take it seriously. We'd better make them understand the harm of the insect plague."
 swarm_crisis.2.a:0 "Broadcast again!"
 swarm_crisis.3.name:0 "Scourge Warning: §RBreakthrough§!"
 swarm_crisis.3.desc:0 "In a flash, several years have passed again.\n\nOur last broadcast had some effect. The high levels of the galactic empires have paid attention to the Prethoryn Scourge, but still haven't done much. However, to our delight, our Science Officer burst with inspiration again, allowing us to achieve one technological breakthrough after another.\n\nTo allow the entire galaxy to prepare in time and no longer regard this crisis as a fantasy, we should broadcast the terrifying scene of the Prethoryn Scourge devouring everything."
 swarm_crisis.3.a:0 "Continue broadcasting!"
 swarm_crisis.4.name:0 "Scourge Warning: §RFear§!"
 swarm_crisis.4.desc:0 "Time is running out!\n\nOur efforts were not in vain. The entire galaxy felt fear of the Prethoryn Scourge and made ample preparations. However, our Science Officer has hit a bottleneck. Higher technologies are difficult to recall due to being too ancient. This may be our last technological breakthrough.\n\nWe can feel that they are approaching, staring at the pure galaxy with their greedy eyes, and those bloody mouths are already prepared."
 swarm_crisis.4.a:0 "Broadcast!"
 swarm_crisis.5.name:0 "Scourge Warning: §RGive Up§!"
 swarm_crisis.5.desc:0 "We are too late...\n\nThe insect plague is invincible. No matter how hard we try, it is futile. Better enjoy the last moments of life..."
 swarm_crisis.5.a:0 "Give up..."
 swarm_crisis.101.name:0 "Scourge Warning: §YBroadcast§!"
 swarm_crisis.101.desc:0 "When our civilization was preparing to take the first step into the sea of stars, a broadcast reached our homeworld.\n\nThe content of the broadcast was short, seemingly a warning from another galactic civilization. That civilization only stated one thing in the broadcast: a creature named §RPrethoryn Scourge§! is about to invade our galaxy.\n\nWe currently cannot confirm the authenticity of the broadcast content and the other party's purpose."
 swarm_crisis.101.a:0 "Being prepared is better than doing nothing."
 swarm_crisis.102.name:0 "Scourge Warning: §YRecall§!"
 swarm_crisis.102.desc:0 "A few years after we received the first broadcast, that mysterious broadcast appeared again.\n\nThe source of the broadcast seems to be the same as last time, but this broadcast proved the serious harm of the §RPrethoryn Scourge§! to the galaxy, and seems to very much hope that we actively deal with that creature.\n\nWe cannot determine whether this creature exists for the time being, but this broadcast should not be a prank."
 swarm_crisis.102.a:0 "Better to believe it exists than not."
 swarm_crisis.103.name:0 "Scourge Warning: §YBreakthrough§!"
 swarm_crisis.103.desc:0 "A few years later, that broadcast arrived as scheduled.\n\nIt can be confirmed that the source of the broadcast is the same as the previous times. However, this broadcast described in detail the specific scene of the §RPrethoryn Scourge§! devouring everything, and our people panicked because of it.\n\nThe other party seems to have achieved some kind of technological breakthrough and even shared some scientific technologies with us through the broadcast. The purpose is questionable."
 swarm_crisis.103.a:0 "I'm afraid that creature really exists."
 swarm_crisis.104.name:0 "Scourge Warning: §YFear§!"
 swarm_crisis.104.desc:0 "That broadcast was like a death pronouncement, shocking our hearts step by step.\n\nAfter observing outside the galaxy, our Science Officer had to admit that a huge unknown object was moving towards the galaxy, and that object is very likely the swarm of the §RPrethoryn Scourge§! mentioned in the broadcast.\n\nThe other party showed great fear, and we are also worried about this."
 swarm_crisis.104.a:0 "The Crisis is coming soon."
 swarm_crisis.105.name:0 "Scourge Warning: §YGive Up§!"
 swarm_crisis.105.desc:0 "That broadcast brought unbelievable news.\n\nIt is said that we are too late, the insect plague is invincible, and even the broadcast source has given up struggling..."
 swarm_crisis.105.a:0 "What about us?"
 
 situation_swarm_crisis:0 "Scourge Warning"
 situation_swarm_crisis_type:0 "Scourge Warning"
 situation_swarm_crisis_desc:0 "The Prethoryn Scourge will arrive at our new home soon, we must prepare as soon as possible!"
 situation_swarm_crisis_monthly_change_tooltip:0 "$situation_monthly_change_tooltip_approaches_dependent$"
 stage_swarm_crisis_1:0 "First Broadcast"
 stage_swarm_crisis_2:0 "Second Broadcast"
 stage_swarm_crisis_3:0 "Third Broadcast"
 stage_swarm_crisis_effects:0 "We will continue our broadcast."
 situation_swarm_crisis_complete_effect:0 "We will conduct the last broadcast."
 situation_swarm_crisis_fail_effect:0 "§RWe will give up broadcasting... give up resistance...§!"
 situation_swarm_crisis_default_effect:0 "Hope we can tide over the difficulties."
 situation_swarm_crisis_encourage_effect:0 "We must recall past technologies as soon as possible!"
 situation_swarm_crisis_discourage_effect:0 "We have no possibility to stop the invasion of the insect plague..."

 ai_crisis.0.name:0 "Ghost Signal: §RSource§!"
 ai_crisis.0.desc:0 "Detected a country using §RGhost Signal§! origin (Contingency appears early) in this game.\n\nIf you do not want it to take effect, please choose to disable this origin (the country will not trigger origin events and will switch to §YProsperous Unification§! origin)."
 ai_crisis.0.a:0 "§REnable this origin.§!"
 ai_crisis.0.b:0 "§GDisable this origin.§!"
 ai_crisis.1.name:0 "Ghost Signal: §RWarning§!"
 ai_crisis.1.desc:0 "Warning count overflow!\n\nStart background processing system: Process warnings, current processing speed: 824TB/s. Start self-check system: Storage unit damaged 96.4258%, physics tech lost, society tech lost, engineering tech lost, machine tradition lost! Start self-repair system: <<Error>>, severe information loss, unable to restore, use low-level tech data only.\n\nTip: Warning processing complete, conduct hazard analysis, calculation result: Win probability 0.1473%, Danger Level S! Suggestion: Issue warning, unite galactic empires."
 ai_crisis.1.a:0 "Start warning!"
 ai_crisis.2.name:0 "Ghost Signal: §RRepair§!"
 ai_crisis.2.desc:0 "Calculation result: Contingency appearance probability 16.4869%.\n\nTip: Semi-damaged core unit found. Start self-check system: Core unit damaged 48.2020%, physics tech lost, society tech lost, machine tradition lost, engineering tech partially lost! Start self-repair system: Repairing, progress: 28.4654%, <<Error>>, self-repair system level low, unable to fully repair, pause repair, use mid-level tech data.\n\nCalculation result: Win probability 2.3475%, Danger Level S! Suggestion: Share tech, unite galactic empires."
 ai_crisis.2.a:0 "Warn again!"
 ai_crisis.3.name:0 "Ghost Signal: §RRecovery§!"
 ai_crisis.3.desc:0 "Calculation result: Contingency appearance probability 37.6642%.\n\nTip: Self-repair system upgraded, core unit data can be re-restored. Start self-repair system: Repairing, progress: 57.4039%, <<Error>>, self-repair system level low, unable to fully repair, pause repair, use high-level tech data.\n\nCalculation result: Win probability 6.2490%, Danger Level S! Suggestion: Provide tech, unite galactic empires."
 ai_crisis.3.a:0 "Continue warning!"
 ai_crisis.4.name:0 "Ghost Signal: §RCrisis§!"
 ai_crisis.4.desc:0 "Calculation result: Contingency appearance probability 89.1706%.\n\nTip: Self-repair system upgraded, core unit data can be re-restored. Start self-repair system: Repairing, progress: 82.0215%, <<Error>>, self-repair system level low, unable to fully repair, pause repair, use ultimate tech data. Warning: Self-repair system reached core processor max level, cannot continue upgrading!\n\nCalculation result: Win probability 0.000%, Danger Level Unknown! Suggestion: <<Error>>!"
 ai_crisis.4.a:0 "<<Error>>!"
 ai_crisis.5.name:0 "Ghost Signal: §RGive Up§!"
 ai_crisis.5.desc:0 "Calculation result: Contingency appearance probability ??.????%.\n\nWarning: Self-repair system offline, core unit destroyed, main control system stopped working..."
 ai_crisis.5.a:0 ".?!"
 ai_crisis.101.name:0 "Ghost Signal: §YWarning§!"
 ai_crisis.101.desc:0 "When our civilization was preparing to take the first step into the sea of stars, a warning reached our homeworld like a ghost.\n\nThe content of the warning was short, seemingly from another galactic civilization. That civilization only stated one thing in the warning: an intelligent machine named §RContingency§! is about to invade our galaxy.\n\nWe currently cannot confirm the authenticity of the warning content and the other party's purpose."
 ai_crisis.101.a:0 "Being prepared is better than doing nothing."
 ai_crisis.102.name:0 "Ghost Signal: §YRepair§!"
 ai_crisis.102.desc:0 "A few years after we received the first warning, that ghost-like warning appeared again.\n\nThe source of the warning seems to be the same as last time, but this warning indicates that the §RContingency§! has a high probability of invading our galaxy. The other party also shared some technologies we didn't know through the warning, seemingly without malice.\n\nWe cannot determine whether this intelligent machine exists for the time being, but we should be able to use this warning to patch holes in our technology."
 ai_crisis.102.a:0 "Better to believe it exists than not."
 ai_crisis.103.name:0 "Ghost Signal: §YRecovery§!"
 ai_crisis.103.desc:0 "A few years later, that warning arrived as scheduled.\n\nIt can be confirmed that the source of the warning is the same as the previous times, and the warning source itself is also an intelligent machine. However, this warning proved that the §RContingency§! is approaching our galaxy, and our people also believe everything said in the warning.\n\nThe other party seems to have recovered some data and provided part of the recovered technology for us to research. Maybe we should trust the other party."
 ai_crisis.103.a:0 "I'm afraid that intelligent machine really exists."
 ai_crisis.104.name:0 "Ghost Signal: §YCrisis§!"
 ai_crisis.104.desc:0 "That warning was like a ghost haunting us, surrounding our hearts step by step.\n\nAfter observing outside the galaxy, our Science Officer confirmed again that a huge unknown object was moving towards the galaxy, and that object is very likely the swarm of the §RContingency§! mentioned in the warning.\n\nThe other party seems to have fallen into some kind of chaos, and we are also close to collapse."
 ai_crisis.104.a:0 "The Crisis will eventually come."
 ai_crisis.105.name:0 "Ghost Signal: §YGive Up§!"
 ai_crisis.105.desc:0 "We never thought we would receive such a warning.\n\nThe warning source seems to have crashed, and there is no more news about the unknown Crisis..."
 ai_crisis.105.a:0 "What about us?"
 
 situation_ai_crisis:0 "Ghost Signal"
 situation_ai_crisis_type:0 "Ghost Signal"
 situation_ai_crisis_desc:0 "Warning: There is a high probability that the Contingency will appear in our system, please take necessary measures!"
 situation_ai_crisis_monthly_change_tooltip:0 "$situation_monthly_change_tooltip_approaches_dependent$"
 stage_ai_crisis_1:0 "First Signal"
 stage_ai_crisis_2:0 "Second Signal"
 stage_ai_crisis_3:0 "Third Signal"
 stage_ai_crisis_effects:0 "We will continue to spread the warning."
 situation_ai_crisis_complete_effect:0 "We will issue the last warning."
 situation_ai_crisis_fail_effect:0 "§RError: We will give up warning... give up... give up...§!"
 situation_ai_crisis_default_effect:0 "According to calculations, we still have a possibility of survival."
 situation_ai_crisis_encourage_effect:0 "According to calculations, repairing storage units as soon as possible will significantly increase the probability of victory!"
 situation_ai_crisis_discourage_effect:0 "According to calculations, the chance of victory is zero, error, error, error..."

 exd_crisis.0.name:0 "Dimensional Wanted: §RSource§!"
 exd_crisis.0.desc:0 "Detected a country using §RDimensional Wanted§! origin (Extradimensional Invaders appear early) in this game.\n\nIf you do not want it to take effect, please choose to disable this origin (the country will not trigger origin events and will switch to §YProsperous Unification§! origin)."
 exd_crisis.0.a:0 "§REnable this origin.§!"
 exd_crisis.0.b:0 "§GDisable this origin.§!"
 exd_crisis.1.name:0 "Dimensional Wanted: §RBounty§!"
 exd_crisis.1.desc:0 "After relocating headquarters, the portal to the high dimension opened for the first time.\n\nA group of Extradimensional beings continued to conduct goods trade and intelligence exchange with our merchants through this temporary portal. Today's transaction went very smoothly as usual, but just as it was about to end, an Extradimensional friend told us a shocking secret: the group of Extradimensional Invaders who hated us seemed to have found the Milky Way based on traces and planned to take revenge on us in the near future.\n\nAlthough the other party behaved very seriously, we are sure we didn't leave any traces. But just the moment the portal closed, a signal suddenly came from the center of the galaxy: Extradimensional Invaders are offering a bounty for our arrest..."
 exd_crisis.1.a:0 "Disturbing!"
 exd_crisis.2.name:0 "Dimensional Wanted: §RCondemnation§!"
 exd_crisis.2.desc:0 "After several years, the portal for trade opened again.\n\nToday's trade also went smoothly, and our profits are increasing rapidly. Just when we were happy about today's income, a signal came from the center of the galaxy again: Extradimensional Invaders are condemning our actions. Those Extradimensional beings who came to trade seemed to be gloating a bit and proposed a new trade: They provide us with some advanced scientific technologies, and we need to return today's entire income to them.\n\nAfter discussion by the board of directors, we decided that we need their technology to deal with the demons' revenge. However, today's loss makes us very sad..."
 exd_crisis.2.a:0 "Disgusting!"
 exd_crisis.3.name:0 "Dimensional Wanted: §RSanction§!"
 exd_crisis.3.desc:0 "Another new trade.\n\nThe Extradimensional beings coming to trade with us seem to have increased, but we suspect they will repeat their old tricks. Sure enough, the signal from the center of the galaxy came again: Extradimensional Invaders said that the Milky Way will surely be sanctioned by justice. Extradimensional beings took the opportunity to propose that transaction that made us lose everything, and we seem to have to accept it.\n\nThis board meeting lasted a long time. Most people chose to compromise, but a few also expressed their anger. What an unforgettable day, we only hope the technology provided by the other party is worth the money..."
 exd_crisis.3.a:0 "Infuriating!"
 exd_crisis.4.name:0 "Dimensional Wanted: §RJudgment§!"
 exd_crisis.4.desc:0 "Today's trade arrived as scheduled.\n\nDifferent from usual, the Extradimensional beings coming to participate in the transaction are few and far between. It seems other beings think this place is ominous. We suspect they have colluded with Extradimensional Invaders because the signal from the center of the galaxy came again: Extradimensional Invaders seemed to be laughing wildly and claimed that judgment is coming soon. Extradimensional beings said this is the last time they trade with us, but they are unwilling to tell us the reason. Similarly, they still proposed that transaction, but only asked for half of our income.\n\nWe agreed. Although there is at least some profit today, we are more worried than ever."
 exd_crisis.4.a:0 "Desperate!"
 exd_crisis.5.name:0 "Dimensional Wanted: §RGive Up§!"
 exd_crisis.5.desc:0 "Today's trading place is empty.\n\nNo Extradimensional beings come to do business with us anymore, our doom is coming..."
 exd_crisis.5.a:0 "Damn..."
 exd_crisis.101.name:0 "Dimensional Wanted: §YBounty§!"
 exd_crisis.101.desc:0 "When our civilization was preparing to take the first step into the sea of stars, a mysterious signal reached our homeworld.\n\nThe content of the signal was short, but it seemed to contain great mysteries. The signal only stated one thing: a creature calling itself §RExtradimensional Invaders§! is offering a bounty for the arrest of a certain MegaCorp.\n\nWe currently cannot confirm the authenticity of the signal content and the other party's purpose."
 exd_crisis.101.a:0 "Being prepared is better than doing nothing."
 exd_crisis.102.name:0 "Dimensional Wanted: §YCondemnation§!"
 exd_crisis.102.desc:0 "A few years after we received the first signal, that mysterious signal appeared again.\n\nThe signal source seems to be the same as last time, but in this signal, §RExtradimensional Invaders§! are angrily condemning the actions of that MegaCorp. The other party does not seem to be aiming at us, but is full of contempt.\n\nWe cannot determine whether this creature exists for the time being, but this signal should not be a prank."
 exd_crisis.102.a:0 "Better to believe it exists than not."
 exd_crisis.103.name:0 "Dimensional Wanted: §YSanction§!"
 exd_crisis.103.desc:0 "A few years later, that signal arrived as scheduled.\n\nIt can be confirmed that the signal source is the same as the previous times, and we were surprised to find that the signal came from the galactic center. However, in this signal, §RExtradimensional Invaders§! said the galaxy will surely be sanctioned by justice, and our people also fear everything said in the signal.\n\nThe other party's tone is full of hostility, and we don't know if the other party will invade us."
 exd_crisis.103.a:0 "I'm afraid that creature really exists."
 exd_crisis.104.name:0 "Dimensional Wanted: §YJudgment§!"
 exd_crisis.104.desc:0 "That signal is like a black hole in the galactic center, gradually encroaching on our spirit.\n\nAfter analyzing the energy data in the galaxy, our Science Officer confirmed that some special energy fluctuation appeared in the galaxy, and that fluctuation is very likely the omen of judgment by §RExtradimensional Invaders§! mentioned in the signal.\n\nThe other party seems to be reveling, while we feel like walking on thin ice."
 exd_crisis.104.a:0 "The Crisis is bound to come."
 exd_crisis.105.name:0 "Dimensional Wanted: §YGive Up§!"
 exd_crisis.105.desc:0 "That signal brought death.\n\nThe signal source is approaching, the other party constantly recites the coordinates of some systems, the bell of judgment has rung..."
 exd_crisis.105.a:0 "What about us?"
 
 situation_exd_crisis:0 "Dimensional Wanted"
 situation_exd_crisis_type:0 "Dimensional Wanted"
 situation_exd_crisis_desc:0 "Extradimensional Invaders may have discovered our coordinates, we need to obtain detailed intelligence!"
 situation_exd_crisis_monthly_change_tooltip:0 "$situation_monthly_change_tooltip_approaches_dependent$"
