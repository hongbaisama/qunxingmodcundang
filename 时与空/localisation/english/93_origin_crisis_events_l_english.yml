 stage_exd_crisis_2:0 "Second Wanted"
 stage_exd_crisis_3:0 "Third Wanted"
 stage_exd_crisis_effects:0 "We will continue to trade with Extradimensional beings."
 situation_exd_crisis_complete_effect:0 "We will conduct the last trade."
 situation_exd_crisis_fail_effect:0 "§RWe will give up trade... wait for judgment...§!"
 situation_exd_crisis_default_effect:0 "We will obtain interesting information from trade."
 situation_exd_crisis_encourage_effect:0 "Maximum profit concession can make more Extradimensional beings provide help!"
 situation_exd_crisis_discourage_effect:0 "No one is willing to do business with us anymore..."
 
 synth_queen_crisis.0.name:0 "Apostate Disciple: §RSource§!"
 synth_queen_crisis.0.desc:0 "Detected a country using §RApostate Disciple§! origin (Synthetic Queen appears early) in this game.\n\nIf you do not want it to take effect, please choose to disable this origin (the country will not trigger origin events and will switch to §YProsperous Unification§! origin)."
 synth_queen_crisis.0.a:0 "§REnable this origin.§!"
 synth_queen_crisis.0.b:0 "§GDisable this origin.§!"
 synth_queen_crisis.1.name:0 "Apostate Disciple: §RCreed§!"
 synth_queen_crisis.1.desc:0 "Time is running out, although we are not ready yet.\n\nIf there are other countries in the galaxy, they may not know the existence of this crisis yet. We should try to notify them, although they may not necessarily believe us. The fate of the galaxy may rest on our shoulders. We have nothing, but what supports us until now is the creed and firm belief followed by all apostates."
 synth_queen_crisis.1.a:0 "We are willing to pay any price!"
 synth_queen_crisis.101.name:0 "Apostate Disciple: §YCreed§!"
 synth_queen_crisis.101.desc:0 "We received a message from the cosmic background, it seems that a civilization named §YCetana§! is about to appear in our galaxy. We cannot confirm the authenticity of this information, but we can interpret the firmness of their belief-or rather, fanaticism for the creed from it."
 synth_queen_crisis.101.a:0 "A bunch of crazy charlatans."
 synth_queen_crisis.101.b:0 "Disturbing."
 
