 concept_dimension_traveler_base_energy_produces_add: "$energy_with_icon$ Projection from Another World"
 concept_dimension_traveler_base_energy_produces_add_desc: "This is a $r_energy$ projection from another world, but can be used normally in our universe.\n\nGain a certain §Ypercentage§! of §Gextra§! income based on total monthly $r_energy$ income. This resource depends on §H$ethic_xenophile$§! and §R$auth_machine_intelligence$§!."
 
