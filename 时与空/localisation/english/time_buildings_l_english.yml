 # 事件
 ################################################################
 
 building_time_hotel:0 "Time Prison"
 building_time_hotel_desc:0 "$time_clock_picture$By imitating the structure of the Time Prison, we mastered the technology of building small Time Prisons. Punishing criminals with spacetime delay, we made more citizens realize the necessity of order and the cost of breaking the law."
 building_time_hotel_extra_effect_for_sector_capital:0 "Provides extra §G$COUNTRY_MODIFIERS$§! when built on §Y$EMPIRE_CAPITAL$§!, §Y$SECTOR_CAPITAL$§! or §Y$penal_colony$§!"
 
 building_akx_dimensional_worship:0 "Dimensional Monument"
 building_akx_dimensional_worship_desc:0 "A monument erected for us in another world. We will meet again sooner or later."
 building_akx_dimensional_worship_effect:0 "Produces £unity£§G10§! per §Y$sm_dimensional_shrine$§!"
 building_akx_ouroboros:0 "Altar of Ouroboros"
 building_akx_ouroboros_desc:0 "This is a revelation from the dimension, this is an oracle from Ouroboros."
 building_akx_ouroboros_effect:0 "Provides §G-1%§! §Y$MOD_SOCIETY_TECH_COST_MULT$§! per §Y$sm_dimensional_shrine$§!"
 
 ################################################################
 # 理念
 ################################################################
 
 building_civic_starry_yearning:0 "Stellar Research Institute"
 building_civic_starry_yearning_desc:0 "Yearning for stars evolved into a thirst for knowledge of the universe. We crave to understand the physical laws of every celestial body."
 building_civic_starry_yearning_corporate:0 "Celestial Positioning Instrument"
 building_civic_starry_yearning_corporate_desc:0 "To put a price on celestial bodies, we need to accurately locate every star and master all its parameters."
 building_civic_starry_yearning_effect:0 "Provides different types of output bonuses based on the §YStar Class§! of the system"
 
 building_civic_overclocking_art:0 "超频美术馆"
 building_civic_overclocking_art_desc:0 "这座美术馆主要展出精巧的超频设计，它们将高效与美密不可分地融为一体。"
 building_civic_overclocking_art_corporate:0 "过载工作室"
 building_civic_overclocking_art_corporate_desc:0 "这间工作室负责监控整个星球的流水线过载作业，确保没有任何一份劳动力出现浪费。"
 building_civic_overclocking_art_machine:0 "多核处理器"
 building_civic_overclocking_art_machine_desc:0 "这块处理器缓解了中央主脑分配算力的负担，主脑只会接收必要的信息，而无需被冗余的数据干扰。"
 building_civic_overclocking_art_effect:0 "Each $pop_group_unit$ $engineer_type_plural_with_icon$ produce $roboticist_jobs_bonus_workforce_mult$: §G+0.5%§!( max §G+50%§! )"
 building_civic_overclocking_art_mechanists_effect:0 "Each $pop_group_unit$ $engineer_type_plural_with_icon$ produce $roboticist_jobs_bonus_workforce_mult$: §G+1%§!( max §G+100%§! )"
 
 building_civic_origin_black_hole:0 "Black Hole Peeping Station"
 building_civic_origin_black_hole_desc:0 "$origin_black_hole_picture$Through the Black Hole Peeping Station, we might catch a glimpse of the true face under the mysterious veil of the Black Hole."
 
 building_civic_origin_pulsar:0 "Pulsar Perception Station"
 building_civic_origin_pulsar_desc:0 "$origin_pulsar_picture$Through the Pulsar Perception Station, we can receive intelligent signals from the Pulsar."
 
 building_civic_origin_neutron_star:0 "Neutron Bombardment Station"
 building_civic_origin_neutron_star_desc:0 "$origin_neutron_star_picture$Through the Neutron Bombardment Station, we will create the greatest creation-from the greatest Neutron Star."
 
