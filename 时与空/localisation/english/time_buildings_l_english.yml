 # 神秘奇点 (高级政体) 
 ################################################################
 
 building_hope_parliament:0 "Parliament of Hope"
 building_egalitarian_is_winner_desc:0 "$hope_parliament_picture$This is the victory of egalitarians. They established a parliament to guard the future of the country in the name of hope."
 building_xenophile_is_winner_desc:0 "$hope_parliament_picture$This is the victory of xenophiles. They established a parliament to spread the will of the country in the name of hope."
 building_egalitarian_and_xenophile_is_winner_desc:0 "$hope_parliament_picture$This is the joint victory of egalitarians and xenophiles. They established a parliament to open up the future of the country in the name of hope."
 building_hope_parliament_effect:0 "Produces £minor_artifacts£§G0.0125§! per $pop_group_unit$ £pops£§YPop§!"
 building_hope_institution:0 "Institution of Hope"
 building_egalitarian_is_winner_advanced_desc:0 "$hope_institution_picture$The purpose of the Institution of Hope is to ensure the survival of hope. Guardians will give everything for their duties."
 building_xenophile_is_winner_advanced_desc:0 "$hope_institution_picture$The purpose of the Institution of Hope is to achieve the closed loop of hope. Disseminators will spare no effort for their mission."
 building_egalitarian_and_xenophile_is_winner_advanced_desc:0 "$hope_institution_picture$The purpose of the Institution of Hope is to seek the final hope. Guardians and disseminators will work together for this."
 building_hope_institution_effect:0 "Produces £minor_artifacts£§G0.025§! per $pop_group_unit$ £pops£§YPop§!"
 
 building_eternal_probe:0 "Eternal Probe"
 building_materialist_is_winner_desc:0 "$eternal_probe_picture$This is the victory of materialists. They built a probe to sail into eternity to observe truth."
 building_pacifist_is_winner_desc:0 "$eternal_probe_picture$This is the victory of pacifists. They built a probe to pierce into eternity to create laws."
 building_materialist_and_pacifist_is_winner_desc:0 "$eternal_probe_picture$This is the victory of materialists and pacifists. They built a probe to fall into eternity to master the cycle."
 building_eternal_probe_effect:0 "Produces £nanites£§G0.0125§! per $pop_group_unit$ £pops£§YPop§!"
 building_eternal_matrix:0 "Eternal Matrix"
 building_materialist_is_winner_advanced_desc:0 "$eternal_matrix_picture$The Eternal Matrix calculates infinity day and night, just to observe a moment of eternity."
 building_pacifist_is_winner_advanced_desc:0 "$eternal_matrix_picture$The Eternal Matrix analyzes infinity day and night, just to create an instant of eternity."
 building_materialist_and_pacifist_is_winner_advanced_desc:0 "$eternal_matrix_picture$The Eternal Matrix reshapes infinity day and night, just to tear a moment of eternity."
 building_eternal_matrix_effect:0 "Produces £nanites£§G0.025§! per $pop_group_unit$ £pops£§YPop§!"
 
 building_dimensional_fortress:0 "Dimensional Fortress"
 building_authoritarian_is_winner_desc:0 "$dimensional_fortress_picture$This is the victory of authoritarians. They forged a fortress; only rulers have the power to control dimensions."
 building_militarist_is_winner_desc:0 "$dimensional_fortress_picture$This is the victory of militarists. They forged a fortress; only conquerors have the power to challenge dimensions."
 building_authoritarian_and_militarist_is_winner_desc:0 "$dimensional_fortress_picture$This is the victory of authoritarians and militarists. They forged a fortress; only pioneers have the power to drive dimensions."
 building_dimensional_fortress_effect:0 "Produces £sr_living_metal£§G0.0125§! per $pop_group_unit$ £pops£§YPop§!"
 building_dimensional_metropolis:0 "Dimensional Metropolis"
 building_authoritarian_is_winner_advanced_desc:0 "$dimensional_metropolis_picture$The Dimensional Metropolis is the most luxurious hub of the empire; all dimensions will be ruled here."
 building_militarist_is_winner_advanced_desc:0 "$dimensional_metropolis_picture$The Dimensional Metropolis is the most magnificent hub of the empire; all dimensions will be conquered from here."
 building_authoritarian_and_militarist_is_winner_advanced_desc:0 "$dimensional_metropolis_picture$The Dimensional Metropolis is the grandest hub of the empire; any dimension will be eclipsed by it."
 building_dimensional_metropolis_effect:0 "Produces £sr_living_metal£§G0.025§! per $pop_group_unit$ £pops£§YPop§!"
 
 building_original_sanctuary:0 "Original Sanctuary"
 building_spiritualist_is_winner_desc:0 "$original_sanctuary_picture$This is the victory of spiritualists. They built a sanctuary to meditate in the origin."
 building_xenophobe_is_winner_desc:0 "$original_sanctuary_picture$This is the victory of xenophobes. They built a sanctuary to purify in the origin."
 building_spiritualist_and_xenophobe_is_winner_desc:0 "$original_sanctuary_picture$This is the victory of spiritualists and xenophobes. They built a sanctuary to comprehend the true meaning of the origin."
 building_original_sanctuary_effect:0 "Produces £sr_zro£§G0.0125§! per $pop_group_unit$ £pops£§YPop§!"
 building_original_palace:0 "Original Palace"
 building_spiritualist_is_winner_advanced_desc:0 "$original_palace_picture$The Original Palace gives the lost a home; their fate is destined in the dark."
 building_xenophobe_is_winner_advanced_desc:0 "$original_palace_picture$The Original Palace gives the filthy a habitat; bathe, purify, baptize."
 building_spiritualist_and_xenophobe_is_winner_advanced_desc:0 "$original_palace_picture$The Original Palace gives the deceased a harbor; there is no boundary between soul and body."
 building_original_palace_effect:0 "Produces £sr_zro£§G0.025§! per $pop_group_unit$ £pops£§YPop§!"
 
