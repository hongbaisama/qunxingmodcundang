 building_origin_contract_other_only_one:0 "§YOnly one type of anchor can be built on a planet§!"
 
 building_origin_contract_whisperers:0 "Whisper Hub"
 building_origin_contract_whisperers_desc:0 "$origin_contract_picture$Dedicate this planet to $whisperers_in_the_void$-and the Shroud connected to it."
 
 building_origin_contract_composer:0 "Strand Anchor"
 building_origin_contract_composer_desc:0 "$origin_contract_picture$Anchor this planet to the Shroud of $the_composer_of_strands$-in the name of whispers."
 
 building_origin_contract_cradle:0 "Cradle Anchor"
 building_origin_contract_cradle_desc:0 "$origin_contract_picture$Anchor this planet to the Shroud of $the_cradle_of_souls$-in the name of whispers."
 
 building_origin_contract_eater:0 "Eater Anchor"
 building_origin_contract_eater_desc:0 "$origin_contract_picture$Anchor this planet to the Shroud of $the_eater_of_worlds$-in the name of whispers."
 
 building_origin_contract_instrument:0 "Instrument Anchor"
 building_origin_contract_instrument_desc:0 "$origin_contract_picture$Anchor this planet to the Shroud of $the_instrument_of_desire$-in the name of whispers."
 
 building_origin_praise_the_sun:0 "Pyramid of the Sun"
 building_origin_praise_the_sun_desc:0 "$origin_praise_the_sun_picture$The pyramid means the sun's love for us, and also our love for the sun."
 
 building_origin_tao_of_ninghe_yin:0 "Yin Palace"
 building_origin_tao_of_ninghe_yin_desc:0 "$origin_tao_of_ninghe_yin_picture$This eerie palace absorbs most of the Yin power on the planet, making it easier for us to regulate Serenity."
 building_origin_tao_of_ninghe_yang:0 "Yang Pavilion"
 building_origin_tao_of_ninghe_yang_desc:0 "$origin_tao_of_ninghe_yang_picture$This masculine pavilion gathers most of the Yang power on the planet, making it easier for us to balance Serenity."
 
 building_origin_the_matrix_lathe_capital:0 "Abandoned $building_lathe_capital$"
 building_origin_the_matrix_lathe_capital_desc:0 "The unit core of the Synaptic Lathe, maintaining incomprehensible calculations even after the planet is abandoned."
 building_origin_the_matrix_lathe_capital_effect:0 "$mod_planet_physicists_physics_research_produces_add$: §G+0.05§! per $job_physicist$ (Max §G+3§!)\n$mod_planet_biologists_society_research_produces_add$: §G+0.05§! per $job_biologist$ (Max §G+3§!)\n$mod_planet_engineers_engineering_research_produces_add$: §G+0.05§! per $job_engineer$ (Max §G+3§!)"
 building_origin_the_matrix_lathe_resonator:0 "Abandoned $building_lathe_resonator$"
 building_origin_the_matrix_lathe_resonator_desc:0 "Originally a device for chip resonance, its components are rich in rare resources for the Reborn to refine."
 building_origin_the_matrix_lathe_stabilisator:0 "Abandoned $building_lathe_stabilisator$"
 building_origin_the_matrix_lathe_stabilisator_desc:0 "A facility capable of filtering noise, where the Reborn established headquarters to maintain order."
 building_origin_the_matrix_lathe_overclocker:0 "Abandoned $building_lathe_overclocker$"
 building_origin_the_matrix_lathe_overclocker_desc:0 "A device capable of rewriting Lathe commands, used by the Reborn to restart the processing industry chain."
 building_origin_the_matrix_lathe_preserver:0 "Abandoned $building_lathe_preserver$"
 building_origin_the_matrix_lathe_preserver_desc:0 "The preserver was originally intended to protect organic components, now used by the Reborn to reclaim wasteland."
 building_origin_the_matrix_lathe_reactor:0 "Abandoned $building_lathe_reactor$"
 building_origin_the_matrix_lathe_reactor_desc:0 "A somewhat damaged reactor, but it does not affect providing power supply for the Reborn."
 building_origin_the_matrix_lathe_life_support:0 "Abandoned $building_lathe_life_support$"
 building_origin_the_matrix_lathe_life_support_desc:0 "A series of facilities once used for maintenance, transformed by the Reborn into leisure places."
 building_origin_the_matrix_lathe_cogitator:0 "Abandoned $building_lathe_cogitator$"
 building_origin_the_matrix_lathe_cogitator_desc:0 "A computer room covered with star charts, where the Reborn ponder the meaning of survival."
 building_origin_the_matrix_lathe_validator:0 "Abandoned $building_lathe_validator$"
 building_origin_the_matrix_lathe_validator_desc:0 "A fully functional computer, but it will take some time for the Reborn to master its operation."
 
 building_origin_manifesti:0 "\"Dream Machine\""
 building_origin_manifesti_desc:0 "$origin_manifesti_picture$\"Origin has no meaning, function need not be known, dream needs no waking.\""
 building_origin_manifesti_effect:0 "§R\"The Dream Machine does not welcome outsiders.\"§!"
 building_origin_manifesti_dream:0 "\"Awakening\""
 building_origin_manifesti_dream_desc:0 "$origin_manifesti_picture$\"It's time to wake up from the dream, but being awake may not be a good thing.\""
 building_origin_manifesti_dream_effect_1:0 "Produces £energy£§G2§! £minerals£§G2§! £food£§G2§! £consumer_goods£§G1§! £alloys£§G1§! £trade£§G1§! £physics£§G1§! £society£§G1§! £engineering£§G1§! £unity£§G1§! per $pop_group_unit$ £pops£§YPop§!"
 building_origin_manifesti_dream_effect_2:0 "Produces £energy£§G1§! £minerals£§G1§! £food£§G1§! £consumer_goods£§G0.5§! £alloys£§G0.5§! £trade£§G0.5§! £physics£§G0.5§! £society£§G0.5§! £engineering£§G0.5§! £unity£§G0.5§! per $pop_group_unit$ £pops£§YPop§!"
 
 building_adeptus_mechanicus_1:0 "Mechanical Indoctrination Center"
 building_adeptus_mechanicus_1_desc:0 "$origin_adeptus_mechanicus_picture$This indoctrination center will educate soulless machines, not only protecting them from environmental threats but also making them understand the meaning of the soul."
 building_adeptus_mechanicus_2:0 "Machine God Church"
 building_adeptus_mechanicus_2_desc:0 "$origin_adeptus_mechanicus_picture$Following the mission of the Machine God, we built this magnificent church. In the church, believers of the Machine God tirelessly educate machines, hoping that they will one day gain a soul."
 building_adeptus_mechanicus_vault:0 "Electric Stimulation Confessional"
 building_adeptus_mechanicus_vault_desc:0 "$origin_adeptus_mechanicus_picture$Machines that refuse to repent and are stubborn will be forcibly sent here for punishment. This is not our abuse of them, but a baptism to make them look brand new.\nMoreover, they enjoy it themselves."
 
 building_origin_monster_hunter_1:0 "Hunter Camp"
 building_origin_monster_hunter_1_desc:0 "$origin_monster_hunter_picture$Hunters built a simple camp, but the hunting equipment inside is complete."
 building_origin_monster_hunter_2:0 "Hunter Guild"
 building_origin_monster_hunter_2_desc:0 "$origin_monster_hunter_picture$Hunters spontaneously organized a large-scale hunting guild. Both experienced old hunters and novice hunters can get what they need from it."
 
 building_time_private_mining_consortium:0 "Co-Prosperity Mine"
 building_time_private_mining_consortium_desc:0 "Co-Prosperity Mine, dedicated to discovering treasures buried in the planet."
 building_time_food_conglomerate:0 "Co-Prosperity Restaurant"
 building_time_food_conglomerate_desc:0 "Co-Prosperity Restaurant, dedicated to serving delicious food to every diner."
 building_time_virtual_entertainment_studios:0 "Co-Prosperity Studio"
 building_time_virtual_entertainment_studios_desc:0 "Co-Prosperity Studio, dedicated to developing the most popular entertainment equipment."
 building_time_private_shipyards:0 "Co-Prosperity Arsenal"
 building_time_private_shipyards_desc:0 "Co-Prosperity Arsenal, dedicated to casting the highest quality alloy materials."
 building_time_military_contractors:0 "Co-Prosperity Brotherhood"
 building_time_military_contractors_desc:0 "Co-Prosperity Brotherhood, dedicated to letting every bounty hunter get their due reward."
 building_time_industrial_subsidiary:0 "Co-Prosperity Processing Station"
 building_time_industrial_subsidiary_desc:0 "Co-Prosperity Processing Station, dedicated to achieving supply of alien parts at the lowest price."
 building_time_public_relations_office:0 "Co-Prosperity Branch"
 building_time_public_relations_office_desc:0 "Co-Prosperity Branch, dedicated to eliminating all misunderstandings existing in business activities."
 building_time_private_research_initiative:0 "Co-Prosperity Institute"
 building_time_private_research_initiative_desc:0 "Co-Prosperity Institute, dedicated to exploring the unknown and truth."
 building_time_amusement_megaplex:0 "Co-Prosperity Amusement City"
 building_time_amusement_megaplex_desc:0 "Co-Prosperity Amusement City, dedicated to letting children have a happy childhood."
 building_time_commercial_forum:0 "Co-Prosperity Forum"
 building_time_commercial_forum_desc:0 "Co-Prosperity Forum, dedicated to letting every business tycoon freely express their opinions."
 building_time_corporate_embassy:0 "Co-Prosperity Embassy"
 building_time_corporate_embassy_desc:0 "Co-Prosperity Embassy, dedicated to breaking down barriers between different cultures."
 building_time_private_security:0 "Co-Prosperity Security"
 building_time_private_security_desc:0 "Co-Prosperity Security, dedicated to guarding precious safety for employers."
 building_time_temple_of_prosperity:0 "Temple of Apocalypse"
 building_time_temple_of_prosperity_desc:0 "Temple of Apocalypse, dedicated to spreading the apocalypse to all parts of the world."
 
 planet_buildings_blessed_by_god:0 "Blessed by God"
